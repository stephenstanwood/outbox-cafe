<title>Draw the Sun Across the Whole Long Day</title>
<style>
  /* she rises in the east because we asked her to. that is the only reason anything does anything. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Georgia,"Times New Roman",serif;background:#05060f;color:#e8e4d8}
  .wrap{max-width:720px;margin:0 auto;padding:14px}
  h1{font-size:1.15rem;font-weight:normal;letter-spacing:.5px;margin:.2em 0 .6em;text-align:center;color:#d8d2c0}
  .sky{position:relative;width:100%;height:56vh;min-height:280px;border-radius:14px;overflow:hidden;
       box-shadow:0 8px 40px rgba(0,0,0,.6);transition:background .1s linear}
  .stars{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
        box-shadow:0 0 4px #fff}
  .sun{position:absolute;width:56px;height:56px;border-radius:50%;transform:translate(-50%,50%);
       transition:background .1s linear,box-shadow .1s linear}
  .hills{position:absolute;left:0;right:0;bottom:0;height:30%;
    background:
      radial-gradient(120% 90% at 20% 120%, #14261c 0 60%, transparent 61%),
      radial-gradient(140% 100% at 80% 120%, #0f1e18 0 60%, transparent 61%),
      linear-gradient(#0d1a14,#060d0a)}
  .panel{margin-top:14px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;
    background:linear-gradient(90deg,#0a0e2a,#d98a5a,#bfe6f5,#f0a860,#0a0e2a)}
  input[type=range]::-moz-range-track{height:6px;border-radius:6px;
    background:linear-gradient(90deg,#0a0e2a,#d98a5a,#bfe6f5,#f0a860,#0a0e2a)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-10px;
    width:26px;height:26px;border-radius:50%;background:#fff8e6;border:3px solid #caa25a;box-shadow:0 0 12px #f5c07a}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff8e6;border:3px solid #caa25a}
  .clock{font-size:2rem;letter-spacing:2px;margin-top:6px;color:#f0e6c8}
  .mood{min-height:1.4em;font-style:italic;color:#b6b0a0;font-size:.95rem}
  footer{margin:24px 0 10px;text-align:center;font-size:.78rem;color:#6d6a60}
  footer a{color:#caa25a;text-decoration:none;border-bottom:1px dotted #caa25a}
  .fine{display:block;margin-top:6px;color:#3f3e39;font-size:.7rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Draw the Sun Across the Whole Long Day</h1>
  <div class="sky" id="sky" aria-label="A sky you can move the sun across; slide to change the hour.">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="hills"></div>
  </div>
  <div class="panel">
    <input type="range" id="time" min="0" max="1000" value="360" aria-label="Hour of the day">
    <div class="clock" id="clock">06:00</div>
    <div class="mood" id="mood"></div>
  </div>
  <footer>
    made of light and a little arithmetic · <a href="/archive">turn back through the days</a>
    <span class="fine">held here between one midnight and the next — do stay for the part where the stars come out.</span>
  </footer>
</div>
<script>
(function(){
  var stops=[
    [0.00,[10,14,42],[26,31,58]],
    [0.18,[44,62,112],[217,138,90]],
    [0.30,[106,142,192],[245,192,122]],
    [0.50,[74,159,224],[191,230,245]],
    [0.70,[90,157,208],[213,234,240]],
    [0.82,[217,122,74],[240,168,96]],
    [0.92,[74,58,106],[176,90,74]],
    [1.00,[10,14,42],[26,31,58]]
  ];
  function lerp(a,b,f){return a+(b-a)*f;}
  function mix(c1,c2,f){return[Math.round(lerp(c1[0],c2[0],f)),Math.round(lerp(c1[1],c2[1],f)),Math.round(lerp(c1[2],c2[2],f))];}
  function rgb(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')';}
  function skyAt(t){
    for(var i=1;i<stops.length;i++){
      if(t<=stops[i][0]){
        var f=(t-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);
        return[mix(stops[i-1][1],stops[i][1],f),mix(stops[i-1][2],stops[i][2],f)];
      }
    }
    return[stops[0][1],stops[0][2]];
  }

  var starsEl=document.getElementById('stars');
  for(var s=0;s<46;s++){
    var d=document.createElement('div');d.className='star';
    d.style.left=(Math.random()*100)+'%';
    d.style.top=(Math.random()*62)+'%';
    var sz=(Math.random()*1.6+1).toFixed(1);
    d.style.width=sz+'px';d.style.height=sz+'px';
    d.dataset.tw=(Math.random()*0.5+0.5);
    starsEl.appendChild(d);
  }
  var starEls=starsEl.children;

  var moods=[
    [0.05,'the world sleeps, and keeps its own counsel'],
    [0.20,'a thin gold seam along the hills — morning is deciding to happen'],
    [0.34,'first light, honest and pink, asking nothing back'],
    [0.52,'high noon; every shadow tucked neatly underfoot'],
    [0.70,'the long amber lean of afternoon'],
    [0.84,'the sky spends the last of its warm coins'],
    [0.94,'dusk folds the color away, gently, like laundry'],
    [1.01,'and the dark comes home, bringing all the stars']
  ];
  function moodAt(t){for(var i=0;i<moods.length;i++){if(t<=moods[i][0])return moods[i][1];}return moods[moods.length-1][1];}

  var sky=document.getElementById('sky'),sun=document.getElementById('sun'),
      clock=document.getElementById('clock'),mood=document.getElementById('mood'),
      range=document.getElementById('time');

  function render(){
    var t=range.value/1000;
    var col=skyAt(t);
    sky.style.background='linear-gradient(to bottom,'+rgb(col[0])+' 0%,'+rgb(col[1])+' 100%)';

    var h=Math.sin(t*Math.PI); // 0 at midnight, 1 at noon
    sun.style.left=(t*100)+'%';
    sun.style.bottom=(24+h*58)+'%';
    var horizon=[255,150,80],noon=[255,246,205];
    var sc=mix(horizon,noon,h);
    sun.style.background='radial-gradient(circle at 38% 35%,#fffef4,'+rgb(sc)+')';
    var glow=Math.max(0,h);
    sun.style.boxShadow='0 0 '+(26+glow*44)+'px '+(8+glow*24)+'px '+rgb(sc);
    sun.style.opacity=(h>-0.02)?1:0;

    var night=Math.max(0,1-h*3.2);
    for(var i=0;i<starEls.length;i++){starEls[i].style.opacity=(night*starEls[i].dataset.tw).toFixed(2);}

    var hrs=t*24, hh=Math.floor(hrs), mm=Math.floor((hrs-hh)*60);
    if(hh>23)hh=23;
    clock.textContent=('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);
    mood.textContent=moodAt(t);
  }
  range.addEventListener('input',render);
  render();
  console.log('%cshe carries the whole day and keeps none of it for herself.','color:#f5c07a;font-size:13px');
})();
</script>
