<title>Warm Water, Bright Koi — a pond you can feed</title>
<!--
  Feed them slowly. Koi don't count the minutes and neither should you.
  There is one gold one. She is shy. Watch the far corner.
-->
<style>
  :root{
    --ink:#0d3b3d;
    --paper:#f4efe4;
    --reed:#c9a24a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:#0b2c2e;
    color:var(--paper);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }
  header{
    padding:.7rem 1rem .55rem;
    text-align:center;
    background:
      radial-gradient(120% 160% at 50% -30%, rgba(233,199,110,.16), transparent 60%),
      #0b2c2e;
    border-bottom:1px solid rgba(233,199,110,.22);
  }
  header h1{
    margin:0;
    font-size:clamp(1.15rem,4.4vw,1.75rem);
    font-weight:600;
    letter-spacing:.02em;
    color:#f7efd8;
  }
  header p{
    margin:.28rem 0 0;
    font-size:.8rem;
    font-style:italic;
    color:rgba(244,239,228,.72);
  }
  .stage{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;}
  .hint{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    padding:.6rem 1.1rem;
    background:rgba(6,32,34,.55);
    border:1px solid rgba(233,199,110,.35);
    border-radius:2rem;
    font-size:.9rem;
    color:#f7efd8;
    pointer-events:none;
    backdrop-filter:blur(2px);
    transition:opacity 1.1s ease;
    text-align:center;
  }
  .hint.gone{opacity:0;}
  .controls{
    position:absolute;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:.6rem;
    padding:.55rem .8rem;
    background:linear-gradient(to top, rgba(6,28,30,.55), transparent);
    pointer-events:none;
  }
  .controls .count{
    font-size:.82rem;
    color:#f4efe4;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
    pointer-events:none;
  }
  button{
    pointer-events:auto;
    font-family:inherit;
    font-size:.82rem;
    color:#0d3b3d;
    background:linear-gradient(#f7efd8,#e6d7a8);
    border:1px solid #b99a49;
    border-radius:1.4rem;
    padding:.42rem .95rem;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:transform .1s ease;
  }
  button:active{transform:translateY(1px) scale(.98);}
  footer{
    text-align:center;
    padding:.55rem .8rem .7rem;
    font-size:.72rem;
    color:rgba(244,239,228,.62);
    background:#0b2c2e;
    border-top:1px solid rgba(233,199,110,.2);
  }
  footer a{color:var(--reed);text-decoration:none;border-bottom:1px dotted var(--reed);}
  footer a:hover{color:#f7efd8;}
  footer .whisper{display:block;margin-top:.25rem;font-style:italic;opacity:.7;font-size:.68rem;}

<body>
  <header>
    <h1>Warm Water, Bright Koi</h1>
    <p>Tap the pond to scatter a little feed. They will come when they're ready.</p>
  </header>

  <div class="stage">
    <canvas id="pond" aria-label="A top-down view of a calm koi pond; tapping the water drops feed and the koi glide over to eat."></canvas>
    <div class="hint" id="hint">tap anywhere on the water</div>
    <div class="controls">
      <span class="count" id="count">koi: 0</span>
      <button id="add">release a koi</button>
    </div>
  </div>

  <footer>
    Drift on to the <a href="/archive">other quiet ponds</a>.
    <span class="whisper">The old brown carp near the bottom has been here longest. He remembers rain.</span>
  </footer>

<script>
(function(){
  "use strict";
  const canvas=document.getElementById('pond');
  const ctx=canvas.getContext('2d');
  const hint=document.getElementById('hint');
  const countEl=document.getElementById('count');
  let W=0,H=0,dpr=1;

  const PALETTES=[
    {base:'#f6f1e6', spots:['#d64a2a']},                 // kohaku
    {base:'#eb8b39', spots:['#f6f1e6']},                 // orange & white
    {base:'#f6f1e6', spots:['#d64a2a','#312c2a']},       // calico
    {base:'#ecc85f', spots:[]},                          // yamabuki
    {base:'#b98a5a', spots:['#8a6438']},                 // chagoi (the old one)
    {base:'#f6f1e6', spots:['#e8873a','#312c2a']}
  ];

  function rand(a,b){return a+Math.random()*(b-a);}
  function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}

  function makeKoi(x,y,special){
    const pal = special ? {base:'#f6d873', spots:['#f0b429']} : PALETTES[(Math.random()*PALETTES.length)|0];
    const maxW = special ? 15 : rand(8.5,14.5);
    const n=16;
    const seg=maxW*0.85;
    const heading=rand(-Math.PI,Math.PI);
    const spine=[];
    for(let i=0;i<n;i++){
      spine.push({x:x-Math.cos(heading)*seg*i, y:y-Math.sin(heading)*seg*i});
    }
    const spots=[];
    const count = special?2:(Math.random()*3.2)|0;
    for(let i=0;i<count;i++){
      spots.push({
        t:rand(0.12,0.72),
        off:rand(-0.35,0.35),
        r:rand(0.55,1.0),
        color: pal.spots.length? pal.spots[(Math.random()*pal.spots.length)|0] : pal.base
      });
    }
    const width=[];
    for(let i=0;i<n;i++){
      const f=i/(n-1);
      width[i]=maxW*Math.sin(Math.PI*(0.2+0.6*f))*(1-0.55*f);
    }
    return {
      spine, width, n, seg, heading, pal, maxW, spots, special,
      speed: rand(20,30),
      curl: rand(-0.14,0.14),
      phase: rand(0,Math.PI*2),
      freq: rand(2.2,3.4),
      finPhase: rand(0,Math.PI*2)
    };
  }

  let koi=[], food=[], ripples=[], dapples=[];

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    const r=canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    for(const k of koi){
      k.spine[0].x=Math.max(30,Math.min(W-30,k.spine[0].x));
      k.spine[0].y=Math.max(30,Math.min(H-30,k.spine[0].y));
    }
    if(dapples.length===0){
      for(let i=0;i<6;i++){
        dapples.push({px:rand(0,1),py:rand(0,1),r:rand(60,140),
          ax:rand(0,Math.PI*2),ay:rand(0,Math.PI*2),
          sx:rand(0.05,0.13),sy:rand(0.04,0.11)});
      }
    }
  }

  function seed(){
    const area=W*H;
    const target=Math.max(5,Math.min(9,Math.round(area/58000)));
    for(let i=0;i<target;i++){
      const special = (i===target-1); // one gold, shy in a corner
      koi.push(makeKoi(
        special?rand(W*0.75,W*0.92):rand(W*0.15,W*0.85),
        special?rand(H*0.75,H*0.92):rand(H*0.15,H*0.85),
        special));
    }
    updateCount();
  }

  function updateCount(){ countEl.textContent='koi: '+koi.length; }

  function feed(x,y){
    ripples.push({x,y,r:4,max:rand(48,70),a:0.55});
    const pellets=2+((Math.random()*2)|0);
    for(let i=0;i<pellets;i++){
      food.push({x:x+rand(-14,14), y:y+rand(-14,14), born:performance.now(), wob:rand(0,6.28)});
    }
    hint.classList.add('gone');
  }

  function nearestFood(hx,hy){
    let best=null,bd=1e9;
    for(const f of food){
      const dx=f.x-hx, dy=f.y-hy, d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=f;}
    }
    return {f:best,d:Math.sqrt(bd)};
  }

  function update(dt,time){
    // ripples
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i];
      r.r+=42*dt; r.a-=0.55*dt;
      if(r.a<=0||r.r>r.max) ripples.splice(i,1);
    }
    // food bob
    for(const f of food){ f.wob+=dt*2.4; }

    for(const k of koi){
      const head=k.spine[0];
      const fwdx=Math.cos(k.heading), fwdy=Math.sin(k.heading);
      let vx=fwdx, vy=fwdy;
      let chasing=false;

      const nf=nearestFood(head.x,head.y);
      if(nf.f && nf.d<Math.max(W,H)*0.7){
        const dx=(nf.f.x-head.x)/nf.d, dy=(nf.f.y-head.y)/nf.d;
        const pull = nf.d<120?2.6:1.5;
        vx+=dx*pull; vy+=dy*pull;
        chasing=true;
        if(nf.d < k.maxW*1.6){
          const idx=food.indexOf(nf.f);
          if(idx>-1) food.splice(idx,1);
          ripples.push({x:nf.f.x,y:nf.f.y,r:3,max:26,a:0.4});
        }
      }
      // edge avoidance
      const m=72;
      if(head.x<m) vx+=(m-head.x)/m*2.2;
      if(head.x>W-m) vx-=(head.x-(W-m))/m*2.2;
      if(head.y<m) vy+=(m-head.y)/m*2.2;
      if(head.y>H-m) vy-=(head.y-(H-m))/m*2.2;
      // gentle side weave
      const weave=Math.sin(time*k.freq+k.phase)*0.55;
      vx+=Math.cos(k.heading+Math.PI/2)*weave;
      vy+=Math.sin(k.heading+Math.PI/2)*weave;

      const desired=Math.atan2(vy,vx);
      const maxTurn=(chasing?4.2:2.0)*dt;
      const diff=norm(desired-k.heading);
      k.heading+=Math.max(-maxTurn,Math.min(maxTurn,diff));
      if(!chasing) k.heading+=k.curl*dt;

      const sp=(k.special?k.speed*0.85:k.speed)*(chasing?2.0:1)*dt;
      head.x+=Math.cos(k.heading)*sp;
      head.y+=Math.sin(k.heading)*sp;

      // spine follow
      for(let i=1;i<k.n;i++){
        const a=k.spine[i-1], b=k.spine[i];
        let dx=b.x-a.x, dy=b.y-a.y;
        const d=Math.hypot(dx,dy)||1;
        b.x=a.x+dx/d*k.seg;
        b.y=a.y+dy/d*k.seg;
      }
      k.finPhase+=dt*(chasing?9:5);
    }
    // occasionally settle spare feed (fade uneaten)
    const now=performance.now();
    for(let i=food.length-1;i>=0;i--){
      if(now-food[i].born>26000) food.splice(i,1);
    }
  }

  function perp(ax,ay,bx,by){
    let dx=ax-bx, dy=ay-by;
    const d=Math.hypot(dx,dy)||1;
    return {x:-dy/d, y:dx/d};
  }

  function smoothClosed(pts){
    const n=pts.length;
    let p0=pts[n-1], p1=pts[0];
    ctx.beginPath();
    ctx.moveTo((p0.x+p1.x)/2,(p0.y+p1.y)/2);
    for(let i=0;i<n;i++){
      const a=pts[i], b=pts[(i+1)%n];
      ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);
    }
    ctx.closePath();
  }

  function buildOutline(k){
    const right=[], left=[];
    for(let i=0;i<k.n;i++){
      const s=k.spine[i];
      let dx,dy;
      if(i===0){ dx=k.spine[0].x-k.spine[1].x; dy=k.spine[0].y-k.spine[1].y; }
      else { dx=k.spine[i-1].x-k.spine[i].x; dy=k.spine[i-1].y-k.spine[i].y; }
      const d=Math.hypot(dx,dy)||1;
      const px=-dy/d, py=dx/d;
      const w=k.width[i];
      right.push({x:s.x+px*w, y:s.y+py*w});
      left.push({x:s.x-px*w, y:s.y-py*w});
    }
    const pts=[];
    for(let i=0;i<k.n;i++) pts.push(right[i]);
    for(let i=k.n-1;i>=0;i--) pts.push(left[i]);
    return pts;
  }

  function drawTail(k,time){
    const a=k.spine[k.n-1], b=k.spine[k.n-2];
    let dx=a.x-b.x, dy=a.y-b.y;
    const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const px=-dy, py=dx;
    const wag=Math.sin(time*k.freq*1.6+k.phase)*k.maxW*0.5;
    const len=k.maxW*2.1, spread=k.maxW*1.35;
    const tipx=a.x+dx*len, tipy=a.y+dy*len;
    ctx.beginPath();
    ctx.moveTo(a.x+px*k.width[k.n-1], a.y+py*k.width[k.n-1]);
    ctx.quadraticCurveTo(tipx+px*spread+px*wag, tipy+py*spread+py*wag, tipx+px*wag*0.3, tipy+py*wag*0.3);
    ctx.quadraticCurveTo(tipx-px*spread+px*wag, tipy-py*spread+py*wag, a.x-px*k.width[k.n-1], a.y-py*k.width[k.n-1]);
    ctx.closePath();
    ctx.fillStyle=k.pal.base;
    ctx.globalAlpha=0.5;
    ctx.fill();
    ctx.globalAlpha=1;
  }

  function drawPectorals(k){
    const idx=4;
    const s=k.spine[idx];
    let dx=k.spine[idx-1].x-k.spine[idx].x, dy=k.spine[idx-1].y-k.spine[idx].y;
    const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const px=-dy, py=dx;
    const flap=Math.sin(k.finPhase)*0.35+0.75;
    const len=k.maxW*1.5*flap;
    for(const side of [1,-1]){
      const bx=s.x+px*side*k.width[idx]*0.6, by=s.y+py*side*k.width[idx]*0.6;
      const ex=bx+px*side*len-dx*len*0.6, ey=by+py*side*len-dy*len*0.6;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(bx+px*side*len*0.4-dx*len, by+py*side*len*0.4-dy*len, ex,ey);
      ctx.quadraticCurveTo(bx-dx*len*0.4, by-dy*len*0.4, bx,by);
      ctx.closePath();
      ctx.fillStyle=k.pal.base;
      ctx.globalAlpha=0.42;
      ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  function drawKoi(k,time){
    const pts=buildOutline(k);
    // shadow
    ctx.save();
    ctx.translate(5,9);
    smoothClosed(pts);
    ctx.fillStyle='rgba(4,26,28,0.20)';
    ctx.fill();
    ctx.restore();

    drawTail(k,time);
    drawPectorals(k);

    // body
    smoothClosed(pts);
    if(k.special){
      ctx.shadowColor='rgba(246,216,115,0.75)';
      ctx.shadowBlur=16;
    }
    ctx.fillStyle=k.pal.base;
    ctx.fill();
    ctx.shadowBlur=0;

    // spots (clipped to body)
    ctx.save();
    smoothClosed(pts);
    ctx.clip();
    for(const sp of k.spots){
      const fi=sp.t*(k.n-1);
      const i=Math.min(k.n-2,Math.floor(fi));
      const fr=fi-i;
      const a=k.spine[i], b=k.spine[i+1];
      const cx=a.x+(b.x-a.x)*fr, cy=a.y+(b.y-a.y)*fr;
      const pr=perp(a.x,a.y,b.x,b.y);
      const w=k.width[i];
      const x=cx+pr.x*sp.off*w, y=cy+pr.y*sp.off*w;
      ctx.beginPath();
      ctx.arc(x,y,w*sp.r*1.25,0,Math.PI*2);
      ctx.fillStyle=sp.color;
      ctx.fill();
    }
    ctx.restore();

    // subtle top sheen along spine
    ctx.save();
    smoothClosed(pts);
    ctx.clip();
    const g=ctx.createLinearGradient(k.spine[0].x,k.spine[0].y-20,k.spine[0].x,k.spine[0].y+20);
    g.addColorStop(0,'rgba(255,255,255,0.16)');
    g.addColorStop(1,'rgba(0,0,0,0.10)');
    smoothClosed(pts);
    ctx.fillStyle=g;
    ctx.fill();
    ctx.restore();

    // eyes / barbels hint
    const head=k.spine[0];
    const pr=perp(k.spine[0].x,k.spine[0].y,k.spine[1].x,k.spine[1].y);
    const ew=k.width[0]*0.55;
    for(const side of [1,-1]){
      ctx.beginPath();
      ctx.arc(head.x+pr.x*side*ew, head.y+pr.y*side*ew, k.maxW*0.14, 0,Math.PI*2);
      ctx.fillStyle='rgba(20,20,20,0.55)';
      ctx.fill();
    }
  }

  function drawWater(time){
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#226b64');
    g.addColorStop(0.5,'#155049');
    g.addColorStop(1,'#0c3a3a');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    // sunlight dapples
    for(const d of dapples){
      const x=(0.5+0.4*Math.sin(time*d.sx+d.ax))*W;
      const y=(0.5+0.4*Math.sin(time*d.sy+d.ay))*H;
      const rg=ctx.createRadialGradient(x,y,0,x,y,d.r);
      rg.addColorStop(0,'rgba(255,248,214,0.12)');
      rg.addColorStop(1,'rgba(255,248,214,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.arc(x,y,d.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawLilies(time){
    // a couple of gentle lily pads in corners
    const pads=[
      {x:W*0.12,y:H*0.16,r:Math.min(W,H)*0.09},
      {x:W*0.9,y:H*0.28,r:Math.min(W,H)*0.07},
      {x:W*0.82,y:H*0.88,r:Math.min(W,H)*0.08}
    ];
    for(let i=0;i<pads.length;i++){
      const p=pads[i];
      const bob=Math.sin(time*0.6+i)*3;
      ctx.save();
      ctx.translate(p.x, p.y+bob);
      ctx.beginPath();
      const notch=(i*1.3);
      for(let a=0.5;a<Math.PI*2+0.5;a+=0.08){
        const rr=(Math.abs(a-notch)<0.35)?p.r*0.15:p.r;
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(a===0.5)ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle='rgba(46,92,60,0.72)';
      ctx.fill();
      ctx.strokeStyle='rgba(20,50,34,0.5)';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFood(){
    for(const f of food){
      const bob=Math.sin(f.wob)*1.5;
      ctx.beginPath();
      ctx.arc(f.x,f.y+bob,2.4,0,Math.PI*2);
      ctx.fillStyle='#e7c9a0';
      ctx.fill();
    }
  }
  function drawRipples(){
    for(const r of ripples){
      ctx.beginPath();
      ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(226,244,238,'+Math.max(0,r.a)+')';
      ctx.lineWidth=1.4;
      ctx.stroke();
    }
  }

  let last=performance.now();
  function frame(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05)dt=0.05;
    const time=now/1000;
    drawWater(time);
    drawLilies(time);
    update(dt,time);
    // sort so gold draws last-ish? keep order; draw all
    for(const k of koi) drawKoi(k,time);
    drawFood();
    drawRipples();
    requestAnimationFrame(frame);
  }

  function pos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left), y:(e.clientY-r.top)};
  }
  canvas.addEventListener('pointerdown',function(e){
    const p=pos(e);
    feed(p.x,p.y);
  });
  document.getElementById('add').addEventListener('click',function(){
    if(koi.length>=20)return;
    const edge=(Math.random()*4)|0;
    let x,y;
    if(edge===0){x=rand(0,W);y=-20;}
    else if(edge===1){x=W+20;y=rand(0,H);}
    else if(edge===2){x=rand(0,W);y=H+20;}
    else {x=-20;y=rand(0,H);}
    x=Math.max(30,Math.min(W-30,x));
    y=Math.max(30,Math.min(H-30,y));
    koi.push(makeKoi(x,y,false));
    updateCount();
  });

  window.addEventListener('resize',resize);
  resize();
  seed();
  requestAnimationFrame(frame);

  // for the patient ones who open the drawer
  console.log('%c🐟 the pond','font-size:15px;color:#e9c76e');
  console.log(
    "still water in the shade —\n"+
    "a slow gold shadow turns\n"+
    "and forgives the noon."
  );
  console.log("Feed the gold one eight times without startling her and she'll follow your finger a while.");
})();
</script>
