  <meta name="outbox-spec-era" content="1879 — a genteel Victorian drawing-room scientific curiosity at its parlor-amusement peak: the twin-pendulum HARMONOGRAPH, a brass-and-mahogany table instrument a well-off family would set up after dinner to watch it draw curves no hand could steady enough to make. Not a museum instrument behind glass and not a relic in an estate sale — a working machine standing on the table THIS evening, the ink-well freshly filled, the pendulums hung, the paper clipped down, someone about to give it a push.">
  <meta name="outbox-spec-format" content="The entire viewport IS a single sheet of clipped-down drawing paper seen straight from above, with a brass-weighted pen suspended over it tracing one continuous line of ink — the pen genuinely driven by two coupled, slowly-decaying pendulum oscillations (a real two-pendulum harmonograph simulation), so the looping rosette winds outward, drifts, tightens as the two swings beat against each other, and fades to a dead stop as the pendulums lose energy; then the finished sheet slides off to the side and a fresh blank one clips in and the pen begins a brand-new figure from newly-randomized frequencies, amplitudes, and phase offsets — never the same curve twice. No chrome, no captions, no header, no controls: just the paper filling the frame and the pen drawing on it.">
  <meta name="outbox-spec-subject" content="The plain mechanical wonder of a harmonograph: two pendulums swinging at very slightly different rates, one nudging the pen along the paper and one nudging the paper (or the second arm) crosswise, so that the pen — which is only ever obeying gravity and a little friction — lays down enormous looping Lissajous rosettes and spirograph-like whorls that no person could draw by hand and that nobody in the room can predict from the push. The frequencies decay, the loops shrink inward, and the whole figure closes itself off into stillness. Not a metaphor for harmony or fate or anything else — literally two weights on strings, beating slowly against each other, and the astonishing looping line that falls out of it.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the tiny engraving on the brass base — the tone is purely the wordless, leaning-in delight of watching a machine draw something you couldn't have guessed: greedy to see which way the loops will drift, gleeful when two swings lock into a beat and the pattern suddenly turns symmetric, satisfied when the pen finally settles and stops. The drawing is treated as a plain physical fact and a genuine visual pleasure — not reverent, not hushed, not precious, not solemn. The closest thing to a voice is the pen's own patient, unhurried winding of a line that never repeats.">
  <meta name="outbox-spec-length" content="medium">

<title>The Winding Line — a Parlour Harmonograph, Drawing</title>
<!-- Wren & Halloway, No. 41. Twin-pendulum table instrument. Fill the well, hang the weights, give it a push.
     (pencilled inside the case lid, a later hand: "showed this to the Hempstead Bros. boys when they passed
      through Frankfort — they wanted to buy it off me. no sale. — E.H.") -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c9b489;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #pen{pointer-events:none;}
  /* the only text the instrument carries: the engraved base-plate */
  #plate{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    pointer-events:none;z-index:5;padding:7px 20px 8px;border-radius:5px;
    background:linear-gradient(150deg,#c99e52 0%,#b08a45 38%,#8f6f34 62%,#c6a25a 100%);
    box-shadow:0 2px 5px rgba(30,22,10,.35),inset 0 1px 1px rgba(255,247,222,.6),inset 0 -2px 3px rgba(80,58,20,.5);
    text-align:center;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    color:#3a2c12;line-height:1.25;max-width:88vw;}
  #tally{font-size:13px;letter-spacing:.14em;font-variant:small-caps;
    text-shadow:0 1px 0 rgba(255,246,220,.55),0 -1px 0 rgba(70,50,16,.7);}
  #tally b{font-weight:700;letter-spacing:.12em;padding-left:.2em;}
  #mark{font-size:9px;letter-spacing:.1em;opacity:.72;margin-top:2px;font-style:italic;
    text-shadow:0 1px 0 rgba(255,246,220,.4);}
  #more{position:fixed;left:11px;bottom:9px;z-index:5;font-family:Georgia,serif;
    font-size:10px;letter-spacing:.08em;color:#372b1c;opacity:.34;text-decoration:none;font-style:italic;}
  #more:hover{opacity:.7;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="main"></canvas>
  <canvas id="pen"></canvas>
</div>
<div id="plate">
  <div id="tally">Figures drawn on this table<b id="n">0</b></div>
  <div id="mark">Wren &amp; Halloway · Instrument Makers · MDCCCLXXIX</div>
</div>
<a id="more" href="/archive">see the other sheets</a>

<script>
(function(){
"use strict";
var stage=document.getElementById("stage");
var mCan=document.getElementById("main"), pCan=document.getElementById("pen");
var mCtx=mCan.getContext("2d"), pCtx=pCan.getContext("2d");
// offscreen layers
var paper=document.createElement("canvas"), paperCtx=paper.getContext("2d");
var ink=document.createElement("canvas"), inkCtx=ink.getContext("2d");
var out=document.createElement("canvas"), outCtx=out.getContext("2d");
var W=0,H=0,DPR=1,cx=0,cy=0,minD=0;

var INK="#372b1c";
function rand(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rand(a,b+1));}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function sizeCanvas(c,ctx){c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cx=W/2;cy=H/2;minD=Math.min(W,H);
  [ [mCan,mCtx],[pCan,pCtx],[paper,paperCtx],[ink,inkCtx],[out,outCtx] ].forEach(function(p){sizeCanvas(p[0],p[1]);});
  buildPaper();
}
window.addEventListener("resize",function(){resize(); /* keep drawing; figure re-centres */});

// ---- the sheet of laid drawing paper ----
function buildPaper(){
  var g=paperCtx; g.clearRect(0,0,W,H);
  g.fillStyle="#efe3c8"; g.fillRect(0,0,W,H);
  // close laid lines
  g.strokeStyle="rgba(226,211,176,.55)"; g.lineWidth=1;
  for(var x=0;x<W;x+=5){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke();}
  // wider chain lines
  g.strokeStyle="rgba(210,192,150,.5)"; g.lineWidth=1;
  for(var y=0;y<H;y+=27){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke();}
  // faint fibre mottle
  var n=Math.floor(W*H/5200);
  for(var i=0;i<n;i++){
    g.fillStyle="rgba(198,178,138,"+(0.05+Math.random()*0.09).toFixed(3)+")";
    g.fillRect(Math.random()*W,Math.random()*H,1.4,1.4);
  }
  // soft lamp vignette
  var v=g.createRadialGradient(cx,cy*0.9,minD*0.2,cx,cy,minD*0.95);
  v.addColorStop(0,"rgba(255,250,236,.16)");
  v.addColorStop(1,"rgba(120,96,54,.14)");
  g.fillStyle=v; g.fillRect(0,0,W,H);
  // brass clips at the top corners holding the sheet down
  drawClip(g,26,20); drawClip(g,W-26,20);
}
function drawClip(g,x,y){
  g.save();g.translate(x,y);
  g.shadowColor="rgba(40,28,12,.3)";g.shadowBlur=5;g.shadowOffsetY=2;
  var grd=g.createLinearGradient(-16,-8,16,8);
  grd.addColorStop(0,"#e3c079");grd.addColorStop(.5,"#b08a45");grd.addColorStop(1,"#8a6a30");
  g.fillStyle=grd;
  roundRect(g,-15,-7,30,14,4);g.fill();
  g.shadowColor="transparent";
  g.fillStyle="rgba(255,248,224,.6)";roundRect(g,-11,-5,9,3,1.5);g.fill();
  g.restore();
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ---- the physics: two elliptical pendulums, summed ----
var fig=null, lastPt=null;
var DT=0.045, SUB=8, TMAX=1400;

function makeFigure(seed){
  var R=0.24*minD;
  var base=rand(2.0,2.7);
  var N=ri(3,9);
  var wild=Math.random()<0.05;              // wildcard: a clean closed rosette
  var r0=Math.random()<0.6?1:[1.5,2,3][ri(0,2)];
  var detune=wild?0:rand(0.004,0.02)*(Math.random()<0.5?-1:1);
  var d=wild?rand(0.0019,0.0026):rand(0.0050,0.0075);
  var pushA=seed?seed.angle:rand(0,Math.PI*2);
  var sc=seed?clamp(seed.scale,0.35,1.15):1;
  var f=new Float64Array(0); // (unused, keep JS calm)
  var p1={f:base, ax:R*rand(0.7,1)*sc, ay:R*rand(0.45,0.95)*sc,
          phx:pushA, phy:pushA+(wild?Math.PI/2:rand(0.3,1.3)), d:wild?d:d*rand(0.96,1.05)};
  var p2={f:base*(r0+1/N)*(1+detune), ax:R*rand(0.55,0.95)*sc, ay:R*rand(0.55,0.95)*sc,
          phx:pushA+(wild?0:rand(0.2,1.6)), phy:pushA+(wild?Math.PI/2:rand(0.4,1.9)),
          d:wild?d:d*rand(0.96,1.05)};
  var env0=Math.abs(p1.ax)+Math.abs(p2.ax);
  return {p1:p1,p2:p2,t:0,env0:env0,wild:wild,ox:cx,oy:cy};
}
function at(F,t){
  var e1=Math.exp(-F.p1.d*t), e2=Math.exp(-F.p2.d*t);
  return {
    x:F.ox + F.p1.ax*Math.sin(F.p1.f*t+F.p1.phx)*e1 + F.p2.ax*Math.sin(F.p2.f*t+F.p2.phx)*e2,
    y:F.oy + F.p1.ay*Math.sin(F.p1.f*t+F.p1.phy)*e1 + F.p2.ay*Math.sin(F.p2.f*t+F.p2.phy)*e2
  };
}
function settled(F){
  var e1=Math.exp(-F.p1.d*F.t), e2=Math.exp(-F.p2.d*F.t);
  return (Math.abs(F.p1.ax)*e1+Math.abs(F.p2.ax)*e2) < 0.03*F.env0 || F.t>TMAX;
}

function startFigure(seed){
  inkCtx.clearRect(0,0,W,H);
  fig=makeFigure(seed);
  lastPt=at(fig,0);
  state="draw";
}
function drawInkSegment(a,b){
  var dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
  var lw=clamp(2.4-dist*0.06,0.7,2.4);
  var al=clamp(0.9-dist*0.008,0.35,0.9);
  inkCtx.strokeStyle="rgba(55,43,28,"+al.toFixed(3)+")";
  inkCtx.lineWidth=lw;inkCtx.lineCap="round";inkCtx.lineJoin="round";
  inkCtx.beginPath();inkCtx.moveTo(a.x,a.y);inkCtx.lineTo(b.x,b.y);inkCtx.stroke();
}

// ---- state machine ----
var state="draw";            // draw | settle | slide | charge
var settleUntil=0, slideStart=0, SLIDE_MS=1100;
var pendingSeed=null;
var counter=0;
try{counter=parseInt(localStorage.getItem("harmonograph.figures")||"0",10)||0;}catch(e){}
document.getElementById("n").textContent=" "+counter;

function beginSlide(doCount){
  // snapshot the finished sheet, then swap in a blank
  outCtx.clearRect(0,0,W,H);
  outCtx.drawImage(ink,0,0,W,H);
  inkCtx.clearRect(0,0,W,H);
  if(doCount){
    counter++;
    try{localStorage.setItem("harmonograph.figures",String(counter));}catch(e){}
    document.getElementById("n").textContent=" "+counter;
  }
  slideStart=performance.now();
  state="slide";
}

// ---- pointer: give the pendulums their push ----
var dragStart=null,dragCur=null;
function pt(e){
  var t=(e.touches&&e.touches[0])||e;
  return {x:t.clientX,y:t.clientY};
}
stage.addEventListener("pointerdown",function(e){
  if(state==="slide")return;
  dragStart=pt(e);dragCur=dragStart;state="charge";
});
window.addEventListener("pointermove",function(e){
  if(state==="charge"){dragCur=pt(e);}
});
window.addEventListener("pointerup",function(e){
  if(state!=="charge")return;
  var dx=dragCur.x-dragStart.x,dy=dragCur.y-dragStart.y,len=Math.sqrt(dx*dx+dy*dy);
  pendingSeed={
    angle: len>8?Math.atan2(dy,dx):rand(0,Math.PI*2),
    scale: clamp(len/(0.42*minD),0.35,1.15)
  };
  dragStart=dragCur=null;
  beginSlide(false);          // user-started figures don't count toward the tally
});

// ---- render loop ----
function easeIO(x){return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function compose(){
  mCtx.clearRect(0,0,W,H);
  mCtx.fillStyle="#c9b489";mCtx.fillRect(0,0,W,H); // the table, only ever glimpsed in the gap
  if(state==="slide"){
    var fr=easeIO(clamp((performance.now()-slideStart)/SLIDE_MS,0,1));
    var xOut=fr*W, xIn=-W+fr*W;
    // incoming blank sheet
    edgeShadow(xIn);
    mCtx.drawImage(paper,xIn,0,W,H);
    // outgoing finished sheet
    edgeShadow(xOut);
    mCtx.drawImage(paper,xOut,0,W,H);
    mCtx.drawImage(out,xOut,0,W,H);
  }else{
    mCtx.drawImage(paper,0,0,W,H);
    mCtx.drawImage(ink,0,0,W,H);
  }
}
function edgeShadow(x){
  mCtx.save();mCtx.shadowColor="rgba(40,28,12,.28)";mCtx.shadowBlur=14;mCtx.shadowOffsetX=0;
  mCtx.fillStyle="#efe3c8";mCtx.fillRect(x+2,2,W-4,H-4);mCtx.restore();
}

function drawPen(p){
  pCtx.clearRect(0,0,W,H);
  if(!p)return;
  // shadow where the nib meets the paper
  pCtx.save();
  pCtx.globalAlpha=0.92;
  pCtx.fillStyle="rgba(30,22,10,.10)";
  pCtx.beginPath();pCtx.ellipse(p.x+3,p.y+4,7,4,0,0,7);pCtx.fill();
  // slim graphite-and-steel shaft, hung from above
  var top=Math.max(0,p.y-56);
  var sg=pCtx.createLinearGradient(p.x-3,0,p.x+3,0);
  sg.addColorStop(0,"#4c463d");sg.addColorStop(.5,"#8b857a");sg.addColorStop(1,"#544e45");
  pCtx.strokeStyle=sg;pCtx.lineWidth=4.5;pCtx.lineCap="round";
  pCtx.beginPath();pCtx.moveTo(p.x,top);pCtx.lineTo(p.x,p.y-2);pCtx.stroke();
  // brass pendulum bob, with a specular glint
  var by=p.y-34;
  var bg=pCtx.createRadialGradient(p.x-3,by-3,1,p.x,by,10);
  bg.addColorStop(0,"#ffe9b8");bg.addColorStop(.35,"#d8ab5b");bg.addColorStop(1,"#8a6a30");
  pCtx.fillStyle=bg;pCtx.beginPath();pCtx.arc(p.x,by,9,0,7);pCtx.fill();
  pCtx.fillStyle="rgba(255,250,235,.85)";pCtx.beginPath();pCtx.arc(p.x-3,by-3,2.4,0,7);pCtx.fill();
  // the nib
  pCtx.fillStyle="#2c2419";pCtx.beginPath();pCtx.arc(p.x,p.y,1.9,0,7);pCtx.fill();
  pCtx.restore();
}
function drawCharge(){
  pCtx.clearRect(0,0,W,H);
  if(!dragStart||!dragCur)return;
  pCtx.save();
  pCtx.strokeStyle="rgba(55,43,28,.35)";pCtx.lineWidth=1.5;pCtx.setLineDash([4,4]);
  pCtx.beginPath();pCtx.moveTo(dragStart.x,dragStart.y);pCtx.lineTo(dragCur.x,dragCur.y);pCtx.stroke();
  pCtx.setLineDash([]);
  var bg=pCtx.createRadialGradient(dragCur.x-3,dragCur.y-3,1,dragCur.x,dragCur.y,10);
  bg.addColorStop(0,"#ffe9b8");bg.addColorStop(.4,"#d8ab5b");bg.addColorStop(1,"#8a6a30");
  pCtx.fillStyle=bg;pCtx.beginPath();pCtx.arc(dragCur.x,dragCur.y,9,0,7);pCtx.fill();
  pCtx.fillStyle="rgba(255,250,235,.8)";pCtx.beginPath();pCtx.arc(dragCur.x-3,dragCur.y-3,2.4,0,7);pCtx.fill();
  pCtx.restore();
}

function frame(){
  if(state==="draw"){
    for(var i=0;i<SUB;i++){
      fig.t+=DT;
      var np=at(fig,fig.t);
      drawInkSegment(lastPt,np);
      lastPt=np;
      if(settled(fig)){ state="settle"; settleUntil=performance.now()+850; break; }
    }
    drawPen(lastPt);
  }else if(state==="settle"){
    drawPen(lastPt);
    if(performance.now()>=settleUntil){ beginSlide(true); }
  }else if(state==="charge"){
    drawCharge();
  }else if(state==="slide"){
    pCtx.clearRect(0,0,W,H);
    if(performance.now()-slideStart>=SLIDE_MS){
      var s=pendingSeed;pendingSeed=null;
      startFigure(s);
    }
  }
  compose();
  requestAnimationFrame(frame);
}

// ---- go ----
resize();
startFigure(null);
requestAnimationFrame(frame);

console.log("%cWren & Halloway No.41 — fill the well, hang the weights, give it a push.",
  "color:#8a6a30;font-family:Georgia,serif;font-style:italic");
console.log("Drag across the paper and let go. Every now and then two swings fall into step and the line closes clean on itself. Watch for it.");
})();
</script>
