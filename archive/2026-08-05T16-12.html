  <meta name="outbox-spec-era" content="Right now — 10:40 on a hard, glaring April morning behind a house on the edge of Hebron, North Dakota, 22 mph steady out of the northwest with gusts over thirty, two T-posts and forty feet of galvanized line strung between them, a prop pole leaning against the fence, a paper bag of spring-clip wooden pegs, and a galvanized basket of wrung sheets and work shirts sat on an upturned crate. Not a look-back at 'when everyone hung their wash out' and not a 'the dryer killed the clothesline' lament — the basket is full, the wind is up, and the whole load has to be dry before the front comes through this afternoon.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one clothesline seen broadside from about fifteen feet away in flat noon-hard sunlight: line, two posts, a strip of grass, a strip of sky, nothing else — no header, no caption, no counter, no title, no instructions. The wash is a live cloth simulation being blown around by real gusting wind, and the visitor's whole vocabulary is grabbing: drag an item up out of the basket at the bottom edge, drop it over the line, and press to pinch a peg onto it wherever the cursor is. HOW the cloth lands on the line is entirely physical and entirely up to the visitor — a sheet flopped over with a wide bight of fabric on each side hangs and belly-snaps like a sail; the same sheet pegged by two corners hangs as a heavy vertical curtain that barely moves; a shirt hung by its shoulders wraps itself around the line inside of a minute. The piece IS forty feet of cotton getting worked over by moving air.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of hanging a load of wash so it actually dries — that drying is water leaving cloth into moving air, so exposed surface area and airflow are the only two things that matter and everything else is folklore; that a sheet doubled over the line with a generous bight on both sides presents nearly its whole area to the wind and dries in a third the time of the same sheet pegged flat by two corners, which shelters half of itself behind the other half; that cloth pegged across the wind fills like a sail and hammers itself dry while cloth pegged along the wind just streams and sulks; that a shirt goes up by the tail and not the shoulders, because shoulders let the sleeves flag out and whip the body of the shirt into a rope around the line, and because pegs at the shoulder print two dimples that will still be there tonight; that the heavy items go at the ends nearest the posts where the line sags least, since a loaded line sags and a sagging line lets the middle of a sheet drag the grass; that a prop pole under the middle isn't decoration, it's what buys back the sag; that a pinch of clearance between items is worth more than one extra item on the line; that a peg on a doubled seam holds and a peg on a single thickness of wet sheet pulls through in a gust; and the plain fact that a wrung sheet loses most of its weight in the first ten minutes and then argues about the rest. Literally water, wind, cotton, gravity, and a wooden spring clip.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the cloth and the air, and that register is LOUD, HARD, SNAPPING and BUSY — a stiff prairie wind working forty feet of wet cotton over, sheets cracking like a tarp on a truck bed, sleeves flogging, the line thrumming and shedding drops in a gust, everything glaring in flat hard morning light with short black shadows on dry grass. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT gentle, NOT soft-focus, NOT nostalgic, NOT melancholy — nothing here billows prettily in slow motion. It is a windy backyard at twenty past ten and the wash is getting beaten dry.">

<script>
'use strict';
(function(){
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const L={};
const G=900, DAMP=0.9955, AERO=9.4e-6, ROPE_N=72;
const items=[], pegs=[], drips=[], wetspots=[];
let rope=[], grassTufts=[], basket=['shirt','sheet','towel','shirt','pillow','shirt','sheet'];

/* ---------- layout ---------- */
function layout(){
  L.lineY=H*0.30;
  L.postX1=Math.max(34,W*0.115);
  L.postX2=W-Math.max(34,W*0.115);
  L.postBase=H*0.845;
  L.ground=H*0.795;
  L.horizon=H*0.555;
  L.crateW=Math.min(210,W*0.34); L.crateH=Math.min(120,H*0.15);
  L.crateX=Math.max(L.crateW*0.62,W*0.30); L.crateY=H*0.99;
  L.span=L.postX2-L.postX1;
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth||window.innerWidth; H=cv.clientHeight||window.innerHeight;
  cv.width=Math.max(1,Math.floor(W*DPR)); cv.height=Math.max(1,Math.floor(H*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); buildRope(); makeGrass(); makeGrid();
}
window.addEventListener('resize',resize);

/* ---------- palette helpers ---------- */
function hx(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function mix(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
const DRY_L=hx('#f6f2e6'), DRY_M=hx('#d6d5cd'), DRY_D=hx('#a7b3bd');
const WET_L=hx('#cfcabb'), WET_M=hx('#b0b0a8'), WET_D=hx('#8d99a3');
function clothTones(w){
  return [mix(DRY_L,WET_L,w), mix(DRY_M,WET_M,w), mix(DRY_D,WET_D,w)];
}

/* ---------- wind ---------- */
const wind={x:0,y:0,z:0,speed:1,ux:0,uy:0,uz:1};
let wt=Math.random()*40;
function updateWind(dt){
  wt+=dt;
  const surge=0.36*Math.sin(wt*0.29)+0.24*Math.sin(wt*0.71+1.7);
  const turb=0.17*Math.sin(wt*2.9+0.4)+0.12*Math.sin(wt*5.3+2.2)+0.08*Math.sin(wt*9.1+1.1);
  let s=1.0+surge+turb; if(s<0.28)s=0.28;
  wind.speed=s;
  const V=530*s;
  let dx=0.33+0.11*Math.sin(wt*0.47), dy=-0.05+0.06*Math.sin(wt*1.6), dz=0.93;
  const dl=Math.hypot(dx,dy,dz); dx/=dl;dy/=dl;dz/=dl;
  wind.ux=dx;wind.uy=dy;wind.uz=dz;
  wind.x=V*dx; wind.y=V*dy; wind.z=V*dz;
}

/* ---------- rope ---------- */
function buildRope(){
  if(rope.length!==ROPE_N){
    rope=[];
    for(let i=0;i<ROPE_N;i++) rope.push({x:0,y:0,z:0,px:0,py:0,pz:0,m:2.6});
    for(let i=0;i<ROPE_N;i++){const t=i/(ROPE_N-1);const x=L.postX1+L.span*t;rope[i].x=rope[i].px=x;rope[i].y=rope[i].py=L.lineY;}
  }
  L.ropeRest=L.span/(ROPE_N-1)*1.006;
  rope[0].x=rope[0].px=L.postX1; rope[0].y=rope[0].py=L.lineY;
  rope[ROPE_N-1].x=rope[ROPE_N-1].px=L.postX2; rope[ROPE_N-1].y=rope[ROPE_N-1].py=L.lineY;
}
function integrateRope(dt){
  for(let i=1;i<ROPE_N-1;i++){
    const n=rope[i];
    const vx=(n.x-n.px)*0.994, vy=(n.y-n.py)*0.994, vz=(n.z-n.pz)*0.96;
    n.px=n.x;n.py=n.y;n.pz=n.z;
    n.x+=vx; n.y+=vy+G*0.9*dt*dt; n.z+=vz+wind.z*0.055*dt*dt*60;
    if(n.z> 26)n.z=26; if(n.z<-26)n.z=-26;
  }
}
function ropeConstraints(){
  const r=L.ropeRest;
  for(let k=0;k<3;k++){
    for(let i=0;i<ROPE_N-1;i++){
      const a=rope[i],b=rope[i+1];
      let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
      const d=Math.hypot(dx,dy,dz)||1e-6;
      const diff=(d-r)/d*0.5;
      const pinA=(i===0)?0:1, pinB=(i+1===ROPE_N-1)?0:1;
      const tot=pinA+pinB; if(!tot)continue;
      const fa=pinA/tot*2, fb=pinB/tot*2;
      dx*=diff;dy*=diff;dz*=diff;
      if(pinA){a.x+=dx*fa*0.5;a.y+=dy*fa*0.5;a.z+=dz*fa*0.5;}
      if(pinB){b.x-=dx*fb*0.5;b.y-=dy*fb*0.5;b.z-=dz*fb*0.5;}
    }
    rope[0].x=L.postX1;rope[0].y=L.lineY;rope[0].z=0;
    rope[ROPE_N-1].x=L.postX2;rope[ROPE_N-1].y=L.lineY;rope[ROPE_N-1].z=0;
  }
}

/* ---------- prop pole ---------- */
const pole={x:0,set:false,len:0};
function polePush(){
  if(!pole.set) return;
  const top=L.postBase-pole.len;
  const t=(pole.x-L.postX1)/L.span;
  const c=Math.round(t*(ROPE_N-1));
  for(let d=-4;d<=4;d++){
    const i=c+d; if(i<1||i>ROPE_N-2)continue;
    const f=1-Math.abs(d)/5;
    const target=top+(1-f)*10;
    if(rope[i].y>target) rope[i].y+=(target-rope[i].y)*f;
  }
}

/* ---------- cloth items ---------- */
const KINDS={
  sheet: {nx:11,ny:15,s:0.0295,dens:1.05},
  towel: {nx:9, ny:12,s:0.0270,dens:1.5},
  pillow:{nx:9, ny:7, s:0.0270,dens:1.0},
  shirt: {nx:13,ny:11,s:0.0205,dens:1.0,shirt:true},
  sock:  {nx:4, ny:6, s:0.0125,dens:0.9}
};
function makeItem(kind,ox,oy,water){
  const K=KINDS[kind], s=K.s*H, pts=[], cons=[], quads=[];
  const act=[];
  for(let j=0;j<K.ny;j++)for(let i=0;i<K.nx;i++){
    let a=true;
    if(K.shirt){ const shoulder=j<3, body=(i>=3&&i<=K.nx-4); if(!shoulder&&!body)a=false; }
    act.push(a);
    const x=ox+(i-(K.nx-1)/2)*s, y=oy+(j-(K.ny-1)/2)*s;
    const z=(Math.random()-0.5)*3;
    pts.push({x:x,y:y,z:z,px:x,py:y,pz:z,fx:0,fy:0,fz:0,m:1,mb:1,a:a,i:i,j:j,con:false});
  }
  const id=(i,j)=>j*K.nx+i;
  function link(i1,j1,i2,j2,k,bend){
    if(i2<0||j2<0||i2>=K.nx||j2>=K.ny)return;
    const A=id(i1,j1),B=id(i2,j2);
    if(!act[A]||!act[B])return;
    const a=pts[A],b=pts[B];
    cons.push({a:A,b:B,r:Math.hypot(a.x-b.x,a.y-b.y),k:k,bend:!!bend});
  }
  for(let j=0;j<K.ny;j++)for(let i=0;i<K.nx;i++){
    if(!act[id(i,j)])continue;
    link(i,j,i+1,j,1); link(i,j,i,j+1,1);
    link(i,j,i+1,j+1,0.62); link(i,j,i-1,j+1,0.62);
    link(i,j,i+2,j,0.30,true); link(i,j,i,j+2,0.30,true);
  }
  for(let j=0;j<K.ny-1;j++)for(let i=0;i<K.nx-1;i++){
    const a=id(i,j),b=id(i+1,j),c=id(i+1,j+1),d=id(i,j+1);
    if(act[a]&&act[b]&&act[c]&&act[d]) quads.push([a,b,c,d]);
  }
  const mb=K.dens*s*s/1000;
  for(const p of pts){p.mb=mb;p.m=mb*(1+1.6*water);}
  const it={kind:kind,K:K,s:s,pts:pts,cons:cons,quads:quads,water:water,
    locked:false,tones:clothTones(water),area:quads.length*s*s,
    nx:0,ny:0,nz:1,lastSnap:0,dripT:0.3,exposed:0,onGround:false};
  return it;
}
function updateMass(it){
  const f=1+1.6*it.water;
  for(const p of it.pts) p.m=p.mb*f;
  it.tones=clothTones(it.water);
}

/* ---------- physics ---------- */
function integrateItem(it,dt){
  const pts=it.pts;
  for(const p of pts){p.fx=0;p.fy=p.m*G;p.fz=0;}
  let anx=0,any=0,anz=0;
  for(const q of it.quads){
    const a=pts[q[0]],b=pts[q[1]],c=pts[q[2]],d=pts[q[3]];
    const ux=c.x-a.x,uy=c.y-a.y,uz=c.z-a.z;
    const vx=d.x-b.x,vy=d.y-b.y,vz=d.z-b.z;
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const len=Math.hypot(nx,ny,nz)||1e-6;
    const area=len*0.5;
    nx/=len;ny/=len;nz/=len;
    anx+=nx;any+=ny;anz+=nz;
    const inv=0.25/dt;
    const cvx=((a.x-a.px)+(b.x-b.px)+(c.x-c.px)+(d.x-d.px))*inv;
    const cvy=((a.y-a.py)+(b.y-b.py)+(c.y-c.py)+(d.y-d.py))*inv;
    const cvz=((a.z-a.pz)+(b.z-b.pz)+(c.z-c.pz)+(d.z-d.pz))*inv;
    const rx=wind.x-cvx, ry=wind.y-cvy, rz=wind.z-cvz;
    const dot=rx*nx+ry*ny+rz*nz;
    const mag=AERO*area*dot*Math.abs(dot)*0.25;
    const fx=nx*mag, fy=ny*mag, fz=nz*mag;
    const tanm=AERO*area*0.09*Math.hypot(rx,ry,rz)*0.25;
    const tx=(rx-dot*nx)*tanm, ty=(ry-dot*ny)*tanm, tz=(rz-dot*nz)*tanm;
    a.fx+=fx+tx;a.fy+=fy+ty;a.fz+=fz+tz;
    b.fx+=fx+tx;b.fy+=fy+ty;b.fz+=fz+tz;
    c.fx+=fx+tx;c.fy+=fy+ty;c.fz+=fz+tz;
    d.fx+=fx+tx;d.fy+=fy+ty;d.fz+=fz+tz;
  }
  const al=Math.hypot(anx,any,anz)||1;
  const nnx=anx/al,nny=any/al,nnz=anz/al;
  const dn=Math.hypot(nnx-it.nx,nny-it.ny,nnz-it.nz)/dt;
  it.nx=nnx;it.ny=nny;it.nz=nnz;
  it.angv=dn;
  const dt2=dt*dt;
  for(const p of pts){
    if(!p.a)continue;
    const vx=(p.x-p.px)*DAMP, vy=(p.y-p.py)*DAMP, vz=(p.z-p.pz)*DAMP;
    p.px=p.x;p.py=p.y;p.pz=p.z;
    const im=1/p.m;
    p.x+=vx+p.fx*im*dt2; p.y+=vy+p.fy*im*dt2; p.z+=vz+p.fz*im*dt2;
    if(p.z>320)p.z=320; if(p.z<-320)p.z=-320;
  }
}
function itemConstraints(it){
  const pts=it.pts, bf=0.10+0.62*(1-it.water)+(it.locked?0.5:0);
  for(const c of it.cons){
    const a=pts[c.a],b=pts[c.b];
    let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
    const d=Math.hypot(dx,dy,dz)||1e-6;
    const k=c.bend?c.k*bf:c.k;
    const diff=(d-c.r)/d*0.5*k;
    const wa=1/a.m, wb=1/b.m, tw=wa+wb;
    const ra=wa/tw*2, rb=wb/tw*2;
    dx*=diff;dy*=diff;dz*=diff;
    a.x+=dx*ra;a.y+=dy*ra;a.z+=dz*ra;
    b.x-=dx*rb;b.y-=dy*rb;b.z-=dz*rb;
  }
}
function pegConstraints(first){
  for(let k=pegs.length-1;k>=0;k--){
    const pg=pegs[k];
    const p=pg.it.pts[pg.i], n=rope[pg.node];
    const dx=n.x-p.x, dy=n.y-p.y, dz=n.z-p.z;
    const d=Math.hypot(dx,dy,dz);
    if(first){
      pg.load=pg.load*0.86+d*0.14;
      pg.age+=1/60;
      if(pg.age>0.5 && !pg.it.locked){
        const th=pg.strength*(0.55+0.45*(1-pg.it.water));
        if(pg.load*p.m>th){ pegs.splice(k,1); sndPop(); continue; }
      }
    }
    const wp=1/p.m, wn=1/n.m, tw=wp+wn;
    const fp=wp/tw, fn=wn/tw;
    p.x+=dx*fp;p.y+=dy*fp;p.z+=dz*fp;
    n.x-=dx*fn;n.y-=dy*fn;n.z-=dz*fn;
  }
}
function lineCollide(it){
  const R=4.2, span=L.span;
  for(const p of it.pts){
    if(!p.a)continue;
    let i=Math.round((p.x-L.postX1)/span*(ROPE_N-1));
    if(i<0)i=0; if(i>ROPE_N-2)i=ROPE_N-2;
    for(let k=Math.max(0,i-1);k<=Math.min(ROPE_N-2,i+1);k++){
      const a=rope[k],b=rope[k+1];
      const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
      const el=ex*ex+ey*ey+ez*ez||1e-6;
      let t=((p.x-a.x)*ex+(p.y-a.y)*ey+(p.z-a.z)*ez)/el;
      if(t<0)t=0; if(t>1)t=1;
      const cx=a.x+ex*t, cy=a.y+ey*t, cz=a.z+ez*t;
      let dx=p.x-cx,dy=p.y-cy,dz=p.z-cz;
      const d=Math.hypot(dx,dy,dz);
      if(d<R&&d>1e-6){
        const push=(R-d)/d;
        p.x+=dx*push;p.y+=dy*push;p.z+=dz*push;
        const vx=p.x-p.px, vy=p.y-p.py, vz=p.z-p.pz;
        const el2=Math.sqrt(el);
        const tv=(vx*ex+vy*ey+vz*ez)/el2/el2;
        p.px+=ex*tv*0.45;p.py+=ey*tv*0.45;p.pz+=ez*tv*0.45;
      }
    }
  }
}
function groundCollide(it){
  const gy=L.ground;
  let touched=false;
  for(const p of it.pts){
    if(!p.a)continue;
    if(p.y>gy){
      p.y=gy; touched=true;
      const vx=p.x-p.px, vz=p.z-p.pz;
      p.px=p.x-vx*0.80; p.pz=p.z-vz*0.80; p.py=p.y;
      if(it.water>0.15&&Math.random()<0.006) addWet(p.x,gy+2,3+Math.random()*4);
    }
    if(p.x<3){p.x=3;p.px=3;}
    if(p.x>W-3){p.x=W-3;p.px=W-3;}
  }
  it.onGround=touched;
}

/* ---------- exposure grid & drying ---------- */
let grid=null,gw=0,gh=0,GC=16;
function makeGrid(){ gw=Math.ceil(W/GC)+2; gh=Math.ceil(H/GC)+2; grid=new Float32Array(gw*gh); }
const QP=[]; let QN=0;
function proj(p,o){
  const sc=1+p.z*0.00092;
  o.x=W*0.5+(p.x-W*0.5)*sc;
  o.y=H*0.44+(p.y-H*0.44)*sc;
}
const _t={x:0,y:0};
function buildQuads(){
  QN=0;
  for(const it of items){
    const pts=it.pts;
    for(const q of it.quads){
      const a=pts[q[0]],b=pts[q[1]],c=pts[q[2]],d=pts[q[3]];
      let o=QP[QN]; if(!o){o={ax:0,ay:0,bx:0,by:0,cx:0,cy:0,dx:0,dy:0,cz:0,mx:0,my:0,n:0,area:0,it:null,ex:1};QP[QN]=o;}
      QN++;
      proj(a,_t);o.ax=_t.x;o.ay=_t.y;
      proj(b,_t);o.bx=_t.x;o.by=_t.y;
      proj(c,_t);o.cx=_t.x;o.cy=_t.y;
      proj(d,_t);o.dx=_t.x;o.dy=_t.y;
      const ux=c.x-a.x,uy=c.y-a.y,uz=c.z-a.z;
      const vx=d.x-b.x,vy=d.y-b.y,vz=d.z-b.z;
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const len=Math.hypot(nx,ny,nz)||1e-6;
      o.area=len*0.5; nx/=len;ny/=len;nz/=len;
      o.nx=nx;o.ny=ny;o.nz=nz;
      o.cz=(a.z+b.z+c.z+d.z)*0.25;
      o.mx=(o.ax+o.bx+o.cx+o.dx)*0.25;
      o.my=(o.ay+o.by+o.cy+o.dy)*0.25;
      o.it=it;
      o.bright=Math.abs(nx*-0.30+ny*-0.86+nz*0.42);
    }
  }
}
function exposureAndDry(dt){
  grid.fill(1e9);
  for(let k=0;k<QN;k++){
    const o=QP[k];
    const gi=(Math.max(0,Math.min(gw-1,(o.mx/GC)|0))+Math.max(0,Math.min(gh-1,(o.my/GC)|0))*gw);
    if(o.cz<grid[gi]) grid[gi]=o.cz;
    o.gi=gi;
  }
  for(const it of items) it.exposed=0;
  for(let k=0;k<QN;k++){
    const o=QP[k];
    o.ex=(o.cz<=grid[o.gi]+14)?1:0.20;
    const face=Math.abs(o.nx*wind.ux+o.ny*wind.uy+o.nz*wind.uz);
    o.it.exposed+=o.area*face*o.ex;
  }
  for(const it of items){
    if(it.locked||it.water<=0)continue;
    const r=4.6e-7*it.exposed*wind.speed*(it.onGround?0.35:1);
    it.water-=r*dt;
    if(it.water<0)it.water=0;
    updateMass(it);
    if(it.water>0.10){
      it.dripT-=dt;
      if(it.dripT<=0){
        it.dripT=0.10+0.55*(1-it.water)+Math.random()*0.25;
        let low=null;
        for(const p of it.pts){if(p.a&&(!low||p.y>low.y))low=p;}
        if(low&&low.y<L.ground-6) drips.push({x:low.x,y:low.y,z:low.z,vy:0});
      }
    }
  }
}

/* ---------- wet grass ---------- */
function addWet(x,y,r){
  wetspots.push({x:x,y:y,r:r,a:0.5});
  if(wetspots.length>240) wetspots.shift();
}

/* ---------- pegs ---------- */
function nearestNode(x,y){
  let best=0,bd=1e9;
  for(let i=0;i<ROPE_N;i++){
    const d=(rope[i].x-x)*(rope[i].x-x)+(rope[i].y-y)*(rope[i].y-y);
    if(d<bd){bd=d;best=i;}
  }
  return {i:best,d:Math.sqrt(bd)};
}
function tryPeg(sx,sy){
  for(let k=0;k<pegs.length;k++){
    const pg=pegs[k], n=rope[pg.node];
    proj(n,_t);
    if(Math.hypot(_t.x-sx,_t.y-sy)<16 && !pg.it.locked){ pegs.splice(k,1); sndClack(0.55); return; }
  }
  let best=null,bd=40;
  for(let m=items.length-1;m>=0;m--){
    const it=items[m]; if(it.locked)continue;
    for(let i=0;i<it.pts.length;i++){
      const p=it.pts[i]; if(!p.a)continue;
      proj(p,_t);
      const d=Math.hypot(_t.x-sx,_t.y-sy);
      if(d<bd){bd=d;best={it:it,i:i,p:p};}
    }
  }
  if(!best)return;
  const nn=nearestNode(best.p.x,best.p.y);
  if(nn.d>34)return;
  for(const pg of pegs) if(pg.it===best.it&&pg.i===best.i) return;
  let doubled=false;
  const p=best.p, s=best.it.s;
  for(let i=0;i<best.it.pts.length;i++){
    const q=best.it.pts[i];
    if(!q.a||i===best.i)continue;
    if(Math.abs(q.i-p.i)<2&&Math.abs(q.j-p.j)<2)continue;
    if(Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z)<s*0.75){doubled=true;break;}
  }
  const hem=(p.i===0||p.j===0||p.i===best.it.K.nx-1||p.j===best.it.K.ny-1);
  const strength=(doubled?15.0:4.6)+(hem?1.4:0);
  const n=rope[nn.i];
  p.x=n.x;p.y=n.y;p.z=n.z;p.px=n.x;p.py=n.y;p.pz=n.z;
  pegs.push({it:best.it,i:best.i,node:nn.i,strength:strength,load:0,age:0,doubled:doubled});
  sndClack(1);
}

/* ---------- audio ---------- */
let AC=null,master=null,wg1=null,wg2=null,wf=null,thG=null,thO=null,nbuf=null,sndReady=false,sndOn=true;
function initAudio(){
  if(sndReady)return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{AC=new C();}catch(e){return;}
  nbuf=AC.createBuffer(1,Math.floor(AC.sampleRate*2),AC.sampleRate);
  const d=nbuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  master=AC.createGain(); master.gain.value=sndOn?0.9:0.0; master.connect(AC.destination);
  const s1=AC.createBufferSource(); s1.buffer=nbuf; s1.loop=true;
  wf=AC.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=430; wf.Q.value=0.65;
  wg1=AC.createGain(); wg1.gain.value=0.04;
  s1.connect(wf); wf.connect(wg1); wg1.connect(master); s1.start();
  const s2=AC.createBufferSource(); s2.buffer=nbuf; s2.loop=true; s2.playbackRate.value=0.62;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200;
  wg2=AC.createGain(); wg2.gain.value=0.05;
  s2.connect(lp); lp.connect(wg2); wg2.connect(master); s2.start();
  thO=AC.createOscillator(); thO.type='sine'; thO.frequency.value=84;
  thG=AC.createGain(); thG.gain.value=0;
  thO.connect(thG); thG.connect(master); thO.start();
  sndReady=true;
}
function updateAudio(){
  if(!sndReady)return;
  const t=AC.currentTime, s=wind.speed;
  wf.frequency.setTargetAtTime(300+540*s,t,0.09);
  wg1.gain.setTargetAtTime(0.022+0.055*Math.pow(Math.max(s,0),2.2),t,0.10);
  wg2.gain.setTargetAtTime(0.030+0.070*s,t,0.15);
  thG.gain.setTargetAtTime(Math.max(0,s-1.14)*0.075,t,0.13);
  thO.frequency.setTargetAtTime(70+28*s,t,0.2);
}
function sndSnap(size,amp){
  if(!sndReady||!sndOn||AC.state==='suspended')return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=nbuf; src.playbackRate.value=0.6+Math.random()*0.9;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2900-2350*size; bp.Q.value=1.0;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(amp,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0006,t+0.07+0.18*size);
  src.connect(bp);bp.connect(g);g.connect(master);
  src.start(t,Math.random()*1.4); src.stop(t+0.45);
  if(size>0.45){
    const o=AC.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(150-70*size,t);
    o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    const g2=AC.createGain(); g2.gain.setValueAtTime(amp*0.55,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.17);
    o.connect(g2);g2.connect(master);o.start(t);o.stop(t+0.22);
  }
}
function sndClack(v){
  if(!sndReady||!sndOn)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=nbuf; src.playbackRate.value=1.6;
  const hp=AC.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1750; hp.Q.value=2.2;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.28*v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.035);
  src.connect(hp);hp.connect(g);g.connect(master);src.start(t,Math.random());src.stop(t+0.06);
  const o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(880,t);
  const g2=AC.createGain(); g2.gain.setValueAtTime(0.05*v,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.045);
  o.connect(g2);g2.connect(master);o.start(t);o.stop(t+0.06);
}
function sndPop(){
  if(!sndReady||!sndOn)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=nbuf; src.playbackRate.value=0.9;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.8;
  const g=AC.createGain(); g.gain.setValueAtTime(0.30,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.20);
  src.connect(bp);bp.connect(g);g.connect(master);src.start(t,Math.random());src.stop(t+0.3);
}

/* ---------- grass ---------- */
function makeGrass(){
  grassTufts=[];
  const n=Math.floor(W*0.9);
  for(let k=0;k<n;k++){
    const t=Math.random();
    const y=L.horizon+Math.pow(t,0.8)*(H-L.horizon);
    const x=Math.random()*W;
    const h=2+ (y-L.horizon)/(H-L.horizon)*11;
    grassTufts.push({x:x,y:y,h:h,l:Math.random(),d:(Math.random()-0.5)*3});
  }
  grassTufts.sort((a,b)=>a.y-b.y);
}

/* ---------- render ---------- */
const order=[];
function render(){
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,L.horizon);
  sky.addColorStop(0,'#3f79bd'); sky.addColorStop(0.55,'#4f86c6'); sky.addColorStop(1,'#a9c6e2');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,L.horizon+1);
  ctx.fillStyle='#8c8a5b'; ctx.fillRect(0,L.horizon,W,H-L.horizon);
  ctx.fillStyle='#9c9a68'; ctx.fillRect(0,L.horizon,W,6);
  ctx.fillStyle='#7c7a4e'; ctx.fillRect(0,L.horizon+20,W,H*0.05);
  ctx.fillStyle='#94925f'; ctx.fillRect(0,L.ground+12,W,H*0.10);
  for(const s of wetspots){
    ctx.fillStyle='rgba(84,84,52,'+(s.a*0.75).toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r,s.r*0.4,0,0,6.283); ctx.fill();
  }
  for(const g of grassTufts){
    ctx.strokeStyle=g.l>0.72?'#a5a173':(g.l>0.35?'#84824f':'#6d6b40');
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x+g.d,g.y-g.h); ctx.stroke();
  }
  drawPost(L.postX1); drawPost(L.postX2);
  ctx.strokeStyle='#5d6a74'; ctx.lineWidth=2.4;
  ctx.beginPath();
  for(let i=0;i<ROPE_N;i++){proj(rope[i],_t); if(i===0)ctx.moveTo(_t.x,_t.y); else ctx.lineTo(_t.x,_t.y);}
  ctx.stroke();
  ctx.strokeStyle='#b9c6cf'; ctx.lineWidth=0.9;
  ctx.beginPath();
  for(let i=0;i<ROPE_N;i++){proj(rope[i],_t); if(i===0)ctx.moveTo(_t.x,_t.y-1); else ctx.lineTo(_t.x,_t.y-1);}
  ctx.stroke();
  order.length=0;
  for(let i=0;i<QN;i++) order.push(i);
  order.sort((a,b)=>QP[a].cz-QP[b].cz);
  for(let k=0;k<order.length;k++){
    const o=QP[order[k]], tn=o.it.tones;
    const b=o.bright;
    const col=b<0.34?tn[2]:(b<0.70?tn[1]:tn[0]);
    ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(o.ax,o.ay); ctx.lineTo(o.bx,o.by); ctx.lineTo(o.cx,o.cy); ctx.lineTo(o.dx,o.dy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  for(const pg of pegs){
    const n=rope[pg.node]; proj(n,_t);
    const i=Math.min(ROPE_N-2,pg.node), a=rope[i], bnd=rope[i+1];
    const ang=Math.atan2(bnd.y-a.y,bnd.x-a.x);
    ctx.save(); ctx.translate(_t.x,_t.y); ctx.rotate(ang+Math.PI/2);
    ctx.fillStyle='#c99a5e'; ctx.fillRect(-3.2,-4,6.4,14);
    ctx.fillStyle='#a97f47'; ctx.fillRect(-3.2,-4,6.4,3);
    ctx.fillStyle='#7d5c33'; ctx.fillRect(-0.6,-1,1.2,10);
    ctx.strokeStyle='#8f9aa3'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-3.5,2.5); ctx.lineTo(3.5,2.5); ctx.stroke();
    ctx.restore();
  }
  drawPole();
  ctx.fillStyle='#9fb3c4';
  for(const d of drips){ ctx.fillRect(d.x-1,d.y,2,4); }
  drawCrate();
  drawSoundIcon();
}
function drawPost(x){
  const top=L.lineY-16, base=L.postBase;
  ctx.fillStyle='rgba(46,46,32,0.32)';
  ctx.beginPath(); ctx.moveTo(x,base); ctx.lineTo(x+26,base+9); ctx.lineTo(x+30,base+5); ctx.lineTo(x+4,base-3); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3d4750'; ctx.fillRect(x-3.5,top,7,base-top);
  ctx.fillStyle='#59646d'; ctx.fillRect(x-3.5,top,2.2,base-top);
  ctx.fillStyle='#2b333a';
  for(let y=top+22;y<base-6;y+=17) ctx.fillRect(x+3.5,y,5,3.5);
  ctx.fillStyle='#4a555e'; ctx.fillRect(x-6,top,12,4);
}
function drawPole(){
  const base=L.postBase;
  ctx.save();
  if(pole.set){
    const top=base-pole.len;
    ctx.fillStyle='rgba(46,46,32,0.30)';
    ctx.beginPath();ctx.moveTo(pole.x,base);ctx.lineTo(pole.x+22,base+8);ctx.lineTo(pole.x+26,base+4);ctx.lineTo(pole.x+4,base-3);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#c99a5e'; ctx.lineWidth=6.5; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(pole.x,base); ctx.lineTo(pole.x,top); ctx.stroke();
    ctx.strokeStyle='#a87e48'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pole.x+2,base); ctx.lineTo(pole.x+2,top); ctx.stroke();
    ctx.fillStyle='#c99a5e';
    ctx.beginPath(); ctx.moveTo(pole.x-7,top+4); ctx.lineTo(pole.x,top-5); ctx.lineTo(pole.x+7,top+4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#7d5c33'; ctx.fillRect(pole.x-1.6,top-5,3.2,7);
  }else{
    const bx=pole.x, tx=pole.x-26, ty=L.lineY+22;
    ctx.strokeStyle='#c99a5e'; ctx.lineWidth=6.5;
    ctx.beginPath(); ctx.moveTo(bx,base); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.strokeStyle='#a87e48'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx+1,base); ctx.lineTo(tx+1,ty); ctx.stroke();
  }
  ctx.restore();
}
function drawCrate(){
  const x=L.crateX, y=L.crateY, w=L.crateW, h=L.crateH;
  ctx.fillStyle='rgba(46,46,32,0.30)';
  ctx.beginPath(); ctx.ellipse(x,y-h*0.05,w*0.60,10,0,0,6.283); ctx.fill();
  ctx.fillStyle='#6c6c5e'; ctx.fillRect(x-w/2,y-h,w,h);
  ctx.fillStyle='#7d7d6d'; ctx.fillRect(x-w/2,y-h,w,5);
  ctx.fillStyle='#565648';
  for(let i=1;i<4;i++) ctx.fillRect(x-w/2,y-h+i*(h/4),w,3);
  const bw=w*0.86, bh=h*0.68, by=y-h-bh*0.55;
  ctx.fillStyle='#8f9aa3';
  ctx.beginPath(); ctx.ellipse(x,by+bh*0.5,bw*0.5,bh*0.45,0,0,6.283); ctx.fill();
  ctx.fillStyle='#a7b3bd';
  ctx.beginPath(); ctx.ellipse(x,by,bw*0.5,bh*0.28,0,0,6.283); ctx.fill();
  const n=basket.length;
  for(let i=0;i<n;i++){
    const t=i/Math.max(1,n);
    const lx=x-bw*0.30+ (i%3)*bw*0.28 + Math.sin(i*2.3)*5;
    const ly=by-6-i*4.2;
    ctx.fillStyle=i%2?'#cfcabb':'#c3bfb0';
    ctx.beginPath(); ctx.ellipse(lx,ly,bw*0.20,bh*0.20,Math.sin(i)*0.4,0,6.283); ctx.fill();
    ctx.fillStyle='#a7b3bd';
    ctx.beginPath(); ctx.ellipse(lx-3,ly+3,bw*0.13,bh*0.10,Math.sin(i)*0.4,0,6.283); ctx.fill();
  }
  ctx.strokeStyle='#7e8a94'; ctx.lineWidth=1.4;
  for(let i=-2;i<=2;i++){
    ctx.beginPath(); ctx.ellipse(x,by+bh*0.5,bw*0.5-Math.abs(i)*0.3,bh*0.45,0,0,6.283); ctx.stroke();
    break;
  }
  const px=x+w*0.62, py=y-h*0.30;
  ctx.fillStyle='#ddd6c4';
  ctx.beginPath(); ctx.moveTo(px-16,py); ctx.lineTo(px+16,py); ctx.lineTo(px+13,py-40); ctx.lineTo(px-13,py-40); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c6bda8'; ctx.fillRect(px-13,py-42,26,4);
  ctx.fillStyle='#c99a5e';
  for(let i=0;i<4;i++){ ctx.fillRect(px-11+i*7,py-52+ (i%2)*4,4.4,12); }
}
function drawSoundIcon(){
  const x=W-30,y=26, a=sndOn?0.42:0.15;
  ctx.strokeStyle='rgba(226,238,250,'+a+')'; ctx.lineWidth=2; ctx.lineCap='round';
  const w0=10+ (sndOn? wind.speed*7:0);
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(x-w0-i*2,y-6+i*6);
    ctx.lineTo(x+w0*0.5+ (sndOn?Math.sin(wt*3+i)*3:0),y-6+i*6);
    ctx.stroke();
  }
}

/* ---------- interaction ---------- */
let drag=null;
function toWorld(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function inBasket(x,y){
  const bw=L.crateW*0.86;
  return x>L.crateX-bw*0.6&&x<L.crateX+bw*0.6&&y>L.crateY-L.crateH*1.7&&y<L.crateY;
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  const m=toWorld(e);
  if(Math.hypot(m.x-(W-30),m.y-26)<26){ sndOn=!sndOn; if(master)master.gain.value=sndOn?0.9:0; return; }
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  const pdist=(pole.set)?Math.abs(m.x-pole.x)+Math.max(0,(m.y<L.postBase-pole.len||m.y>L.postBase)?60:0)
                        :Math.hypot(m.x-(pole.x-13),m.y-(L.lineY+22+ (L.postBase-L.lineY-22)*0.5));
  if(pdist<30){ drag={type:'pole',t0:performance.now(),dx:m.x,dy:m.y,moved:false}; return; }
  let best=null,bd=40;
  for(let k=items.length-1;k>=0;k--){
    const it=items[k]; if(it.locked)continue;
    for(let i=0;i<it.pts.length;i++){
      const p=it.pts[i]; if(!p.a)continue;
      proj(p,_t);
      const d=Math.hypot(_t.x-m.x,_t.y-m.y);
      if(d<bd){bd=d;best={it:it,i:i};}
    }
  }
  if(best){ drag={type:'cloth',it:best.it,i:best.i,t0:performance.now(),dx:m.x,dy:m.y,moved:false,x:m.x,y:m.y}; return; }
  if(inBasket(m.x,m.y)&&basket.length){
    const kind=basket.pop();
    const it=makeItem(kind,m.x,m.y,1);
    items.push(it);
    const gi=Math.floor(it.K.nx/2);
    drag={type:'new',it:it,i:gi,t0:performance.now(),dx:m.x,dy:m.y,moved:false,x:m.x,y:m.y,kind:kind};
    return;
  }
  drag={type:'none',t0:performance.now(),dx:m.x,dy:m.y,moved:false,x:m.x,y:m.y};
});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;
  const m=toWorld(e);
  if(Math.hypot(m.x-drag.dx,m.y-drag.dy)>9) drag.moved=true;
  drag.x=m.x; drag.y=m.y;
  if(drag.type==='pole'){
    pole.x=Math.max(20,Math.min(W-20,m.x));
    pole.set=(pole.x>L.postX1+26&&pole.x<L.postX2-26);
  }
});
function endDrag(e){
  if(!drag)return;
  const m=drag.x!==undefined?{x:drag.x,y:drag.y}:toWorld(e);
  const quick=(performance.now()-drag.t0)<420&&!drag.moved;
  if(drag.type==='new'&&quick){
    const idx=items.indexOf(drag.it);
    if(idx>=0)items.splice(idx,1);
    basket.push(drag.kind);
  }else if((drag.type==='cloth'||drag.type==='none')&&quick){
    tryPeg(drag.dx,drag.dy);
  }else if((drag.type==='cloth'||drag.type==='new')&&inBasket(m.x,m.y)&&!drag.it.locked){
    const it=drag.it;
    for(let k=pegs.length-1;k>=0;k--) if(pegs[k].it===it) pegs.splice(k,1);
    const idx=items.indexOf(it); if(idx>=0)items.splice(idx,1);
    basket.push(it.kind);
    sndClack(0.4);
  }
  drag=null;
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',function(e){ if(drag&&drag.type!=='pole') endDrag(e); });
window.addEventListener('keydown',function(e){
  if(e.key==='m'||e.key==='M'){ sndOn=!sndOn; if(master)master.gain.value=sndOn?0.9:0; }
});

/* ---------- init ---------- */
resize();
pole.len=(L.postBase-L.lineY)+22;
pole.x=L.postX2-14;
pole.set=false;
(function initSock(){
  const node=ROPE_N-9;
  const it=makeItem('sock',rope[node].x,rope[node].y+H*0.02,0);
  it.locked=true; it.water=0; updateMass(it);
  items.push(it);
  const i=Math.floor(it.K.nx/2);
  const p=it.pts[i];
  p.x=rope[node].x;p.y=rope[node].y;p.px=p.x;p.py=p.y;
  pegs.push({it:it,i:i,node:node,strength:Infinity,load:0,age:99,doubled:true});
})();

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
const FIXED=1/120;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.12)dt=0.12;
  acc+=dt;
  let steps=0;
  while(acc>=FIXED&&steps<4){
    acc-=FIXED; steps++;
    updateWind(FIXED);
    integrateRope(FIXED);
    for(const it of items) integrateItem(it,FIXED);
    for(let k=0;k<4;k++){
      ropeConstraints();
      for(const it of items) itemConstraints(it);
      pegConstraints(k===0);
      if(drag&&(drag.type==='cloth'||drag.type==='new')&&drag.it){
        const p=drag.it.pts[drag.i];
        p.x=drag.x; p.y=drag.y; p.z*=0.7;
      }
    }
    polePush();
    for(const it of items){ lineCollide(it); groundCollide(it); }
  }
  buildQuads();
  exposureAndDry(dt);
  for(const it of items){
    if(it.locked)continue;
    const size=Math.min(1,it.area/(H*H*0.06));
    if(it.angv>5.2+(1-size)*4 && (wt-it.lastSnap)>0.14+Math.random()*0.14){
      it.lastSnap=wt;
      sndSnap(size,Math.min(0.34,0.06+it.angv*0.012*(0.4+size)));
    }
  }
  for(let k=drips.length-1;k>=0;k--){
    const d=drips[k];
    d.vy+=1100*dt; d.y+=d.vy*dt; d.x+=wind.x*0.10*dt;
    if(d.y>L.ground){ addWet(d.x,L.ground+2,2.5+Math.random()*3.5); drips.splice(k,1); }
    else if(drips.length>200) drips.splice(0,1);
  }
  for(let k=wetspots.length-1;k>=0;k--){
    const s=wetspots[k];
    s.a-=dt*0.011*(0.5+wind.speed);
    if(s.a<=0) wetspots.splice(k,1);
  }
  updateAudio();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
