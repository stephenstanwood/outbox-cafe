<title>Through the Flaming Hoop — the Professor's Afternoon Turn</title>
<style>
  :root{
    --crimson:#7c1a22; --gilt:#c9a24b; --sawdust:#e9dcb8;
    --flame:#e8641f; --core:#f6efd8; --soot:#241612;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#4a0f14;overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;color:var(--sawdust);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #booth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 40%, #8f2028 0%, #7c1a22 45%, #48101a 100%);
  }
  #stage{position:relative;box-shadow:0 0 0 6px #5c121a, 0 0 0 12px var(--gilt),
      0 0 0 15px #3c0a10, 0 30px 80px rgba(0,0,0,.6);
    border-radius:6px;overflow:hidden;background:#000;}
  canvas{display:block;}
  /* overlays */
  #commentary{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:min(92%,760px);text-align:center;font-size:clamp(13px,2.4vw,20px);
    line-height:1.25;color:#f4e6b8;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.7);
    font-style:italic;pointer-events:none;letter-spacing:.2px;min-height:2.2em;}
  #commentary b{color:var(--flame);font-style:normal;}
  #roster{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;
    gap:5px;z-index:5;}
  .chip{font-family:Georgia,serif;font-size:clamp(10px,1.8vw,13px);
    padding:3px 9px;border-radius:12px;cursor:pointer;
    background:linear-gradient(#8f2028,#6a141b);color:#f2e2b0;
    border:1.5px solid var(--gilt);text-shadow:0 1px 1px #000;
    box-shadow:0 2px 5px rgba(0,0,0,.4);white-space:nowrap;transition:transform .08s;}
  .chip:active{transform:scale(.94);}
  .chip.sel{background:linear-gradient(var(--gilt),#a5813a);color:#3a0d12;
    text-shadow:none;font-weight:bold;box-shadow:0 0 12px rgba(201,162,75,.6);}
  #baton{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    width:min(74%,360px);height:46px;cursor:pointer;z-index:6;touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  #batonRod{width:100%;height:12px;border-radius:8px;position:relative;
    background:linear-gradient(#e7cf88,#9c7d34);box-shadow:0 2px 6px rgba(0,0,0,.5),
      inset 0 1px 1px rgba(255,255,255,.5);}
  #batonRod::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9b53,#b02c12);
    box-shadow:0 0 8px rgba(232,100,31,.6);}
  #baton.wind #batonRod{background:linear-gradient(#fff0c4,#c9a24b);}
  #hint{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    font-size:clamp(9px,1.6vw,11px);color:#e2cf98;opacity:.8;text-align:center;
    width:92%;pointer-events:none;font-style:italic;}
  #rail{position:absolute;bottom:64px;left:0;width:100%;text-align:center;
    font-size:clamp(9px,1.7vw,12px);letter-spacing:1.5px;color:#3a0d12;
    pointer-events:none;text-shadow:0 1px 0 rgba(255,240,200,.35);}
  #rail span{background:linear-gradient(#d9b563,#b28c3c);padding:2px 14px;border-radius:3px;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.4);
    border:1px solid #8a6a2e;font-family:Georgia,serif;font-variant:small-caps;}
  #foot{position:absolute;bottom:64px;right:10px;font-size:11px;z-index:5;}
  #foot a{color:var(--gilt);text-decoration:none;border-bottom:1px dotted var(--gilt);
    font-variant:small-caps;letter-spacing:.5px;}
  #foot a:hover{color:#fff0c4;}
</style>
</head>
<body>
<div id="booth">
  <div id="stage">
    <canvas id="c" width="1000" height="600"></canvas>
    <div id="commentary">The Professor raises the baton — the booth leans in!</div>
    <div id="roster"></div>
    <div id="rail"><span id="tally">CLEAN LEAPS THROUGH THE HOOP: 0</span></div>
    <div id="foot"><a href="/archive">more turns on the pier &rsaquo;</a></div>
    <div id="baton"><div id="batonRod"></div></div>
    <div id="hint">Hold the baton (or SPACE) to wind the leap — let go to fire through the hoop. Tap a prop for its trick.</div>
  </div>
</div>
<script>
/* One Professor. One booth. The hoop is lit right now and old Pomeroy still
   toddles up to the mark though he hasn't cleared it since the Jubilee. */
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const commEl=document.getElementById('commentary');
const rosterEl=document.getElementById('roster');
const tallyEl=document.getElementById('tally');
const baton=document.getElementById('baton');

/* ---- geometry (logical 1000x600) ---- */
const HOOP={x:560,y:290,r:66,open:47};
const LAUNCH={x:130,y:470};
const PED={x1:698,x2:742,top:372};
const GROUND=470;
const ANG=48*Math.PI/180, COS=Math.cos(ANG), SIN=Math.sin(ANG), G=900;

/* ---- roster ---- */
const roster=[
  {name:"Blondin",star:true},
  {name:"Vesta"},
  {name:"Bounder"},
  {name:"Titch"},
  {name:"Pomeroy",old:true}
];
let sel=0;

/* ---- sawdust flecks ---- */
const flecks=[];
for(let i=0;i<230;i++){flecks.push({x:Math.random()*1000,y:GROUND+2+Math.random()*(600-GROUND-4),
  s:Math.random()*1.6+.4,t:Math.random()});}

/* ---- audio ---- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(freq,dur,type,vol){const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.value=vol||0.06;o.connect(g);g.connect(a.destination);
  const t=a.currentTime;g.gain.setValueAtTime(g.gain.value,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);}
function tick(){beep(320+Math.random()*40,0.03,'square',0.05);}
function ting(){beep(1180,0.5,'sine',0.13);setTimeout(()=>beep(1770,0.4,'sine',0.07),20);}
function whoosh(){beep(180,0.18,'sawtooth',0.05);}
function thud(){beep(90,0.12,'triangle',0.09);}

/* ---- tally (localStorage, only ever up) ---- */
const KEY='outbox_flea_clean_leaps';
let tally=0;
try{tally=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
function drawTally(){tallyEl.textContent='CLEAN LEAPS THROUGH THE HOOP: '+tally;}
function bumpTally(){tally++;try{localStorage.setItem(KEY,String(tally));}catch(e){}drawTally();}
drawTally();

/* ---- state ---- */
let state='idle';           // idle | charging | flying | settle
let power=0, charging=false;
const RATE=94;              // power/sec, max ~130
let flea=null, trail=[];
let settleT=0;
let hoopFlare=0;            // extra flame after a clean pass or relight

/* prop states */
let chariot={active:false,x:180,v:0};
let seesaw={active:false,rf:{x:392,y:452,vy:0},tilt:0,ttarget:0};
let rope={w:0,wv:0,walkX:560};

/* ---- commentary banks ---- */
const WHOOP=[
 "THROUGH! Clean as a whistle through the flaming hoop — <b>oh</b>, that's championship stuff!",
 "Right through the middle of the fire — not a whisker singed — <b>magnificent!</b>",
 "He threads the burning ring dead centre — the whole booth's up on the benches!"
];
const STICK=[
 "—and <b>STICKS</b> the pedestal! A soft ting, a flawless landing, the card's finest turn!",
 "Down onto the pedestal with a <b>ting</b> — planted like a nail! Textbook, textbook!",
 "Sticks it cold on the far post — <b>ting!</b> — nine judges couldn't fault that landing!"
];
const NOSTICK=[
 "Clean through the ring but he skids off short of the post — no stick, but what a leap!",
 "Through the fire — <b>yes</b> — then slides into the sawdust shy of the pedestal! So close!"
];
const OVERSTICK=[
 "Clean through and sailing long — overshoots the pedestal into the sawdust beyond! Bit much on the baton!",
 "Through she goes but overcooked — right past the post and into the shavings! Ease off next time!"
];
const OVER=[
 "Too much wax on that spring! He <b>clips the top</b> of the hoop and tumbles — over-charged!",
 "Over-cooked! Catches the crown of the ring, spark and a somersault — down he goes!"
];
const SHORT=[
 "<b>Short!</b> A timid little hop, flops into the sawdust well shy of the ring — more on the baton!",
 "Nowhere near! A soft flop into the shavings — the wind-up wanted another second!"
];
const POM=[
 "Old <b>Pomeroy</b> toddles up... a game little hop and down in the sawdust, bless him. Never mind!",
 "Here comes <b>Pomeroy</b> — a brave spring — and short again, into the shavings. Good old boy!",
 "<b>Pomeroy</b> gathers himself... and a modest hop lands him short. Ah, well — a hearty try!"
];
function pick(a){return a[(Math.random()*a.length)|0];}
function say(t){commEl.innerHTML=t;}

/* ---- roster UI ---- */
function buildRoster(){
  rosterEl.innerHTML='';
  roster.forEach((f,i)=>{
    const b=document.createElement('div');
    b.className='chip'+(i===sel?' sel':'');
    b.textContent=(f.star?'★ ':'')+f.name;
    b.addEventListener('pointerdown',(e)=>{e.stopPropagation();
      if(state!=='idle'&&state!=='settle')return;
      sel=i;buildRoster();tick();
      say('<b>'+f.name+'</b> steps up to the launch-mark' + (f.star?' — the favourite!':'.') );
    });
    rosterEl.appendChild(b);
  });
}
buildRoster();

/* ---- charging ---- */
function startWind(){
  if(state!=='idle'&&state!=='settle')return;
  ac();
  state='charging';charging=true;power=0;
  baton.classList.add('wind');
  say('He\'s coiling — <b>he\'s coiling</b> — the whole booth holds its breath—');
}
function release(){
  if(state!=='charging')return;
  charging=false;baton.classList.remove('wind');
  fire();
}
function fire(){
  const f=roster[sel];
  let v;
  if(f.old){ v=320+power*0.4; }          // Pomeroy: never enough, no matter the wind
  else{ v=600+power*2.3; }
  whoosh();
  flea={x:LAUNCH.x,y:LAUNCH.y,vx:v*COS,vy:-v*SIN,hoopChecked:false,passedHoop:false,done:false,old:!!f.old,name:f.name};
  trail=[];
  state='flying';power=0;
}

/* baton events */
baton.addEventListener('pointerdown',(e)=>{e.preventDefault();startWind();});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
window.addEventListener('keydown',(e)=>{if(e.code==='Space'){e.preventDefault();if(!charging)startWind();}});
window.addEventListener('keyup',(e)=>{if(e.code==='Space'){e.preventDefault();release();}});

/* ---- canvas prop clicks ---- */
cv.addEventListener('pointerdown',(e)=>{
  const r=cv.getBoundingClientRect();
  const lx=(e.clientX-r.left)/r.width*1000, ly=(e.clientY-r.top)/r.height*600;
  handleProp(lx,ly);
});
function handleProp(lx,ly){
  ac();
  // hoop relight (always allowed)
  if(Math.hypot(lx-HOOP.x,ly-HOOP.y)<HOOP.r+14){
    hoopFlare=1;tick();
    say('The Professor touches the taper to the hoop — <b>she flares up bright!</b>');
    return;
  }
  if(state!=='idle'&&state!=='settle')return;
  // chariot lane
  if(lx>150&&lx<330&&ly>438&&ly<500){startChariot();return;}
  // see-saw
  if(lx>300&&lx<420&&ly>430&&ly<478){startSeesaw();return;}
  // tightrope
  if(lx>430&&lx<700&&ly>150&&ly<210){nudgeRope();return;}
}

function startChariot(){
  chariot.active=true;chariot.x=180;chariot.v=175;
  state='settle';settleT=0;
  whoosh();
  say('<b>Hercuflea</b> into the traces — and he <b>HEAVES!</b> The gilt chariot rolls—');
}
function startSeesaw(){
  seesaw.active=true;seesaw.tilt=0;seesaw.ttarget=-0.42;
  seesaw.rf={x:392,y:452,vy:-268};
  state='settle';settleT=0;
  beep(240,0.08,'square',0.06);
  say('Down comes one — <b>UP goes the other!</b> Flung a clean two inches, the little acrobat!');
}
function nudgeRope(){
  rope.wv += (Math.random()<0.5?-1:1)*(0.6+Math.random()*0.9);
  tick();
  say('Out on the horsehair — <b>teeter, teeter</b> — steady him now, nudge him true!');
}

/* ---- physics loop ---- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.033)dt=0.033;
  update(dt);
  draw(now/1000);
  requestAnimationFrame(loop);
}
function update(dt){
  if(charging){power+=RATE*dt;if(power>130)power=130;}
  if(hoopFlare>0)hoopFlare=Math.max(0,hoopFlare-dt*1.6);

  if(state==='flying'&&flea){
    const px=flea.x,py=flea.y;
    flea.vy+=G*dt;
    flea.x+=flea.vx*dt;flea.y+=flea.vy*dt;
    trail.push({x:flea.x,y:flea.y});if(trail.length>10)trail.shift();

    // hoop plane crossing
    if(!flea.hoopChecked && px<HOOP.x && flea.x>=HOOP.x){
      flea.hoopChecked=true;
      const yH=py+(flea.y-py)*((HOOP.x-px)/(flea.x-px));
      if(Math.abs(yH-HOOP.y)<=HOOP.open){
        flea.passedHoop=true;hoopFlare=1;bumpTally();
        say(pick(WHOOP));beep(760,0.12,'sine',0.09);
      }else{
        if(flea.old){/* shouldn't reach here */}
        else if(yH<HOOP.y){say(pick(OVER));}
        else{say(pick(SHORT));}
        flea.vx*=0.35;flea.vy=Math.abs(flea.vy)*0.3+60;thud();
      }
    }
    // pedestal landing
    if(flea.passedHoop && !flea.done && flea.x>=PED.x1 && flea.x<=PED.x2 && flea.y>=PED.top && flea.vy>0){
      flea.y=PED.top;flea.done=true;ting();say(pick(STICK));endShot();
    }
    // ground
    if(!flea.done && flea.y>=GROUND){
      flea.y=GROUND;flea.done=true;thud();
      if(flea.old){say(pick(POM));}
      else if(flea.passedHoop){ say(flea.x>PED.x2?pick(OVERSTICK):pick(NOSTICK)); }
      else if(!flea.hoopChecked){ say(pick(SHORT)); }
      endShot();
    }
  }

  // chariot drag
  if(chariot.active){
    chariot.x+=chariot.v*0.016;
    chariot.v-=42*0.016;
    if(chariot.v<8||chariot.x>632){
      chariot.v=0;chariot.active=false;
      const inches=(8.4+Math.random()*1.6).toFixed(1);
      say('—rolls the length of the ring and halts! A haul of <b>'+inches+' inches</b> — within a whisker of the record!');
      beep(520,0.3,'sine',0.08);
    }
  }
  // see-saw flung flea
  if(seesaw.active){
    seesaw.rf.vy+=G*0.016;
    seesaw.rf.y+=seesaw.rf.vy*0.016;
    seesaw.tilt+= (seesaw.ttarget-seesaw.tilt)*0.15;
    if(seesaw.rf.y>=452&&seesaw.rf.vy>0){
      seesaw.rf.y=452;seesaw.active=false;seesaw.ttarget=0;beep(300,0.06,'square',0.05);
    }
  }else{ seesaw.tilt+=(0-seesaw.tilt)*0.1; }

  // tightrope walker spring (always live, gentle)
  rope.wv += (-3.2*rope.w - 0.9*rope.wv)*dt;
  rope.w  += rope.wv*dt;

  if(state==='settle'){settleT+=dt;if(settleT>1.15&&!chariot.active&&!seesaw.active)state='idle';}
}
function endShot(){state='settle';settleT=0;}

/* ---- drawing ---- */
function draw(t){
  const sx=cv.width/1000, sy=cv.height/600;
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.clearRect(0,0,1000,600);

  // sawdust field
  let bg=ctx.createRadialGradient(500,300,60,500,340,620);
  bg.addColorStop(0,'#f0e4bf');bg.addColorStop(.55,'#e9dcb8');bg.addColorStop(1,'#c8b98e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1000,600);

  // velvet wings
  let wl=ctx.createLinearGradient(0,0,220,0);
  wl.addColorStop(0,'rgba(40,8,12,.92)');wl.addColorStop(1,'rgba(40,8,12,0)');
  ctx.fillStyle=wl;ctx.fillRect(0,0,220,600);
  let wr=ctx.createLinearGradient(1000,0,780,0);
  wr.addColorStop(0,'rgba(40,8,12,.92)');wr.addColorStop(1,'rgba(40,8,12,0)');
  ctx.fillStyle=wr;ctx.fillRect(780,0,220,600);
  // top curtain shadow
  let ts=ctx.createLinearGradient(0,0,0,90);
  ts.addColorStop(0,'rgba(60,10,16,.8)');ts.addColorStop(1,'rgba(60,10,16,0)');
  ctx.fillStyle=ts;ctx.fillRect(0,0,1000,90);

  // sawdust flecks
  ctx.fillStyle='rgba(90,70,40,.5)';
  for(const f of flecks){ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();}
  // ground line
  ctx.strokeStyle='rgba(120,95,55,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(1000,GROUND);ctx.stroke();

  drawTightrope(t);
  drawChariot();
  drawSeesaw();
  drawPedestal();
  drawHoop(t);
  drawLaunch();
  if(state==='flying'&&flea)drawFleaFlight();
  drawGauge();

  // lens vignette
  let vg=ctx.createRadialGradient(500,300,260,500,300,600);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,4,8,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,1000,600);
}

function drawHoop(t){
  const cx=HOOP.x,cy=HOOP.y,r=HOOP.r;
  const flick=0.75+0.25*Math.sin(t*13)+0.12*Math.sin(t*31+1)+hoopFlare*0.5;
  // outer glow
  let gl=ctx.createRadialGradient(cx,cy,r-18,cx,cy,r+46);
  gl.addColorStop(0,'rgba(246,239,216,0)');
  gl.addColorStop(.5,'rgba(232,100,31,'+(0.5*flick)+')');
  gl.addColorStop(1,'rgba(232,100,31,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,r+46,0,7);ctx.fill();
  // flame tongues
  const N=40;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    const len=10+ (0.5+0.5*Math.sin(t*9+i*1.7))*16*(0.8+hoopFlare);
    const x1=cx+Math.cos(a)*(r-2), y1=cy+Math.sin(a)*(r-2);
    const x2=cx+Math.cos(a)*(r-2+len), y2=cy+Math.sin(a)*(r-2+len);
    ctx.strokeStyle= (i%3===0)?'rgba(246,239,216,'+(0.8*flick)+')':'rgba(232,100,31,'+(0.85*flick)+')';
    ctx.lineWidth=(i%3===0)?2:4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  // the ring itself
  ctx.lineWidth=9;ctx.strokeStyle='#e8641f';
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  ctx.lineWidth=4;ctx.strokeStyle='rgba(246,239,216,'+(0.7*flick)+')';
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  // gilt wire stand
  ctx.strokeStyle='#b28c3c';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(cx,cy+r);ctx.lineTo(cx,GROUND);ctx.stroke();
  ctx.fillStyle='#c9a24b';ctx.beginPath();ctx.ellipse(cx,GROUND,26,7,0,0,7);ctx.fill();
}

function drawPedestal(){
  ctx.fillStyle='#d9c690';
  ctx.fillRect(PED.x1,PED.top,PED.x2-PED.x1,GROUND-PED.top);
  ctx.strokeStyle='#b28c3c';ctx.lineWidth=3;ctx.strokeRect(PED.x1,PED.top,PED.x2-PED.x1,GROUND-PED.top);
  ctx.fillStyle='#c9a24b';ctx.fillRect(PED.x1-6,PED.top-7,PED.x2-PED.x1+12,8);
  ctx.fillStyle='#8a6a2e';ctx.fillRect(PED.x1-6,PED.top-2,PED.x2-PED.x1+12,2);
}

function drawLaunch(){
  // launch mark
  ctx.fillStyle='#8a6a2e';ctx.beginPath();ctx.ellipse(LAUNCH.x,GROUND,20,6,0,0,7);ctx.fill();
  ctx.strokeStyle='#7c1a22';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(LAUNCH.x,GROUND-3);ctx.lineTo(LAUNCH.x,GROUND-16);ctx.stroke();
  // waiting fleas (roster minus selected, minus one in flight)
  const spots=[[112,466],[100,470],[122,470],[108,462],[128,466]];
  let si=0;
  roster.forEach((f,i)=>{
    if(i===sel)return;
    if(state==='flying'&&flea&&flea.name===f.name)return;
    const s=spots[si++%spots.length];
    ctx.fillStyle='#241612';ctx.beginPath();ctx.arc(s[0],s[1],3.4,0,7);ctx.fill();
  });
  // selected flea at mark (unless flying)
  if(!(state==='flying'&&flea)){
    const f=roster[sel];
    ctx.fillStyle='#241612';
    ctx.beginPath();ctx.arc(LAUNCH.x, GROUND-5, 5.2,0,7);ctx.fill();
    // legs / harness threads
    ctx.strokeStyle='rgba(36,22,18,.7)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(LAUNCH.x-4,GROUND-4);ctx.lineTo(LAUNCH.x-9,GROUND);
    ctx.moveTo(LAUNCH.x+4,GROUND-4);ctx.lineTo(LAUNCH.x+9,GROUND);ctx.stroke();
  }
}

function drawFleaFlight(){
  // trail
  for(let i=0;i<trail.length;i++){
    const p=trail[i], a=(i+1)/trail.length*0.4;
    ctx.fillStyle='rgba(36,22,18,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,7);ctx.fill();
  }
  ctx.fillStyle='#241612';
  ctx.beginPath();ctx.arc(flea.x,flea.y,5.2,0,7);ctx.fill();
}

function drawChariot(){
  // lane
  ctx.strokeStyle='rgba(120,95,55,.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(150,492);ctx.lineTo(640,492);ctx.stroke();
  const x=chariot.x, y=486;
  // haul thread + strong-flea
  ctx.strokeStyle='rgba(36,22,18,.8)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x+18,y-4);ctx.lineTo(x+40,y-1);ctx.stroke();
  ctx.fillStyle='#241612';ctx.beginPath();ctx.arc(x+44,y-1,3.6,0,7);ctx.fill();
  // gilt chariot
  ctx.fillStyle='#c9a24b';
  ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x+16,y);ctx.lineTo(x+11,y-13);ctx.lineTo(x-11,y-13);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8a6a2e';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#8a6a2e';
  ctx.beginPath();ctx.arc(x-9,y+2,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+9,y+2,4,0,7);ctx.fill();
  ctx.fillStyle='#e9dcb8';ctx.beginPath();ctx.arc(x-9,y+2,1.4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+9,y+2,1.4,0,7);ctx.fill();
}

function drawSeesaw(){
  const px=360, py=464, len=52;
  // pivot
  ctx.fillStyle='#8a6a2e';ctx.beginPath();ctx.moveTo(px-8,py+6);ctx.lineTo(px+8,py+6);ctx.lineTo(px,py-6);ctx.closePath();ctx.fill();
  // plank
  const dx=Math.cos(seesaw.tilt)*len, dy=Math.sin(seesaw.tilt)*len;
  ctx.strokeStyle='#c9a24b';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px-dx,py-dy-6);ctx.lineTo(px+dx,py+dy-6);ctx.stroke();
  // resting flea on left end
  ctx.fillStyle='#241612';
  ctx.beginPath();ctx.arc(px-dx,py-dy-11,3.6,0,7);ctx.fill();
  // flung flea (right)
  ctx.beginPath();ctx.arc(seesaw.rf.x,seesaw.rf.y,3.6,0,7);ctx.fill();
}

function drawTightrope(t){
  const x1=440,x2=690,y=180;
  // posts
  ctx.strokeStyle='#8a6a2e';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x1,y+34);
  ctx.moveTo(x2,y);ctx.lineTo(x2,y+34);ctx.stroke();
  // wire with sag + wobble
  const sag=8+Math.abs(rope.w)*10;
  ctx.strokeStyle='rgba(36,22,18,.85)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(x1,y);
  ctx.quadraticCurveTo((x1+x2)/2,y+sag+rope.w*14,x2,y);ctx.stroke();
  // walker at mid, leaning by wobble
  const wx=(x1+x2)/2, wy=y+sag+rope.w*10;
  ctx.save();ctx.translate(wx,wy);ctx.rotate(rope.w*0.9);
  ctx.fillStyle='#241612';ctx.beginPath();ctx.arc(0,-4,4.2,0,7);ctx.fill();
  // balancing pole
  ctx.strokeStyle='rgba(36,22,18,.7)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-14,-3);ctx.lineTo(14,-3);ctx.stroke();
  ctx.restore();
}

function drawGauge(){
  const gx=42, gy=210, gw=22, gh=250;
  // frame
  ctx.fillStyle='rgba(30,8,12,.55)';ctx.fillRect(gx-3,gy-3,gw+6,gh+6);
  ctx.strokeStyle='#c9a24b';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
  // sweet zones (pass-through 59-113, stick 76-91), unmarked-ish subtle gilt
  const pz=(p)=>gy+gh-(p/130)*gh;
  ctx.fillStyle='rgba(201,162,75,.20)';
  ctx.fillRect(gx,pz(113),gw,pz(59)-pz(113));
  ctx.fillStyle='rgba(201,162,75,.42)';
  ctx.fillRect(gx,pz(91),gw,pz(76)-pz(91));
  // danger over-charge
  ctx.fillStyle='rgba(180,44,18,.35)';
  ctx.fillRect(gx,gy,gw,pz(113)-gy);
  // fill
  const h=(power/130)*gh;
  let fg=ctx.createLinearGradient(0,gy+gh,0,gy);
  fg.addColorStop(0,'#e8641f');fg.addColorStop(1,'#f6efd8');
  ctx.fillStyle=fg;ctx.fillRect(gx+2,gy+gh-h,gw-4,h);
  // label
  ctx.fillStyle='#f2e2b0';ctx.font='11px Georgia';ctx.textAlign='center';
  ctx.save();ctx.translate(gx-9,gy+gh/2);ctx.rotate(-Math.PI/2);
  ctx.fillText('WIND-UP',0,0);ctx.restore();ctx.textAlign='left';
}

/* ---- fit ---- */
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  let w=window.innerWidth, h=window.innerHeight, ar=1000/600;
  let dw=w, dh=w/ar;
  if(dh>h){dh=h;dw=h*ar;}
  cv.style.width=dw+'px';cv.style.height=dh+'px';
  cv.width=Math.round(dw*dpr);cv.height=Math.round(dh*dpr);
}
window.addEventListener('resize',fit);fit();
requestAnimationFrame(loop);

console.log("%cThe Professor's booth — hoop's lit, chariot's waxed. Send Blondin at the ring; he's the favourite. (Pomeroy tries his best.)","color:#e8641f");
})();
</script>
