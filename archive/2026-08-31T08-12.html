  <meta name="outbox-spec-era" content="August 1968, right now — twenty past two on a hot bright afternoon in the plate-glass front window of a taffy shop on the boardwalk at Wildwood, New Jersey, where the puller is set in the window facing the sidewalk because a machine working is what sells the candy. A forty-pound batch came out of the copper kettle at 256°F nine minutes ago, went onto the slab, got its corners folded in with a scraper, and is now hanging on the three pins. Not a look-back at anything and not a lament for anything: the batch has to come off the arms before it stiffens past working range, the shop air is 86°F and the humidity is up, and there is another kettle due off in twenty minutes.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the taffy puller seen head-on through the shop window at life size: three nickel-plated pins on their true epicyclic paths, one hot batch of candy hanging and folding across them, a marble slab table along the bottom edge of frame, and the painted back wall of the shop behind. No header, no caption, no counter, no title, no menu, no scrollbar, no instructions, nothing readable anywhere. It is a live lamination simulation. The batch is a real material curve that the pins stretch and fold, and the piece IS what folding does to it — a translucent amber mass turning opaque and pale purely by light scattering off millions of entrained air interfaces, and a single laid-on ribbon of colour splitting into 2, 4, 8, 16 stripes and on down until the stripes are finer than the eye and the whole batch reads as one flat even tint that is still, physically, all stripes. The visitor's entire vocabulary is the machine and the material: drag left and right across the frame to run the arms faster or slower; click anywhere on the batch to lay a ribbon of colour onto it at that exact point; press and hold to put the shop's exhaust fan on the batch, which cools it locally and honestly and makes that part stiffer than the rest; and drag the batch downward and off the pins, which ends it — the slab drops onto the marble at the bottom of frame with whatever colour and streaking it actually finished with, and a new batch comes up out of frame onto the pins. Nothing scrolls. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The plain mechanics of pulling a batch of taffy, and specifically that pulling is aeration and lamination and is not mixing anything — that the batch left the kettle at 256°F as a supersaturated sucrose solution held amorphous by corn syrup and invert sugar, both of which are there for exactly one reason, to sit on a growing sucrose crystal face and stop it, so the whole product is a glass that has been talked out of crystallising and a batch that grains is a batch that goes sandy and is fit for nothing; that pulling turns a clear amber mass opaque and pale WITHOUT any pigment change whatsoever, because folding entrains air into millions of fine elongated cells and every cell wall is an optical interface, so whiteness is a count of interfaces and nothing else, and a pulled batch is measurably less dense than the same candy unpulled — it floats where the other sinks; that the three-pin puller is a genuine mechanical mixer and the arithmetic of it is fixed by the geometry: the length of the strand multiplies by about 2.414 every full period of the arms, so the batch is roughly ten thousand times longer after fifteen periods than it was when it went on, and none of that length went anywhere, it is folded back on itself in the same volume; that a ribbon of coloured batch laid on is a material line and is advected, never diffused, so it becomes 2 stripes, then 4, then 8, and after about twelve folds the stripes are a few microns across and below the resolution of an eye at arm's length, at which point the batch reads as one flat even pastel and is in fact still entirely stripes, all of them, permanently, and cutting it would show them; that TEMPERATURE is the entire clock and the entire working range — above about 180°F the mass sags off the pins and drips, between roughly 130 and 150 it holds and folds and takes air, and below about 105 it is heading for its glass transition, stops folding, and starts TEARING, and a torn batch is torn, there is no working it back in; that a stretched-thin batch presents enormous surface area and therefore cools several times faster than a folded blob, so the machine is racing itself — every fold that makes it whiter also makes it colder; that over-pulling is a real fault and not an excess of virtue, because past a point the air cells coarsen and merge, the batch goes short and crumbly instead of chewy, and the whiteness stops increasing; that humidity is the enemy of the whole trade, since the surface is hygroscopic and a batch pulled on a wet afternoon picks up moisture, goes sticky, refuses to release from the pins and leaves skin on the nickel that has to be scraped; that the motor's load is a live readout of the batch's viscosity and the current draw climbs measurably as it stiffens, which is how a person at the far end of the shop knows it is nearly ready without looking; that the pins are nickel-plated and kept warm on purpose because a cold pin grabs; and the flat arithmetic that it is forty pounds, that it went on at nine minutes past two, that a batch is worked eleven to fourteen minutes depending on the day, and that there is another kettle coming off at twenty of three.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the machine, the candy and the light, and that register is HOT, HEAVY, FAST, MECHANICAL and slightly sticky — pins swinging through at a real working speed, a forty-pound mass with genuine sag and genuine momentum flopping over a pin and slapping, loops that hang and stretch and get caught again, the whole batch visibly gaining bulk as air goes into it, the nickel throwing hard moving speculars, and a fine haze on the inside of the window glass from the kettle room. Everything happens on somebody else's clock and nothing waits. The batch is always either getting whiter or getting colder and usually both. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT satisfying-video, NOT a screensaver, NOT stately, NOT precious — this is a machine in a shop window at twenty past two with a batch that has to come off before it sets and another kettle due.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is the shop's back wall in flat oil-painted tongue-and-groove, a warm institutional cream gone dirty and yellow above the kettle range (#e4d9bd), going a colder grey-green in the shadow behind the machine (#a9a894), with the marble slab table along the bottom edge as a hard cool grey-white with real veining and a permanent scald mark (#ded9d0). The puller's frame and pins are nickel plate over cast iron — a neutral hard metal (#c9ced0) carrying moving specular streaks from the boardwalk daylight behind the viewer (#fbfcfa) and a dulled, scratched, sugar-hazed band exactly where the batch has been riding on each pin (#8f9698). Against that, the candy's colour is COMPUTED and never chosen: base absorption is a hot caramelised amber (#c8842a) at zero folds, and rendered value and saturation are driven live by actual laminate count and actual entrained-air volume fraction through a real scattering term, so the batch travels honestly from deep translucent amber, through a cloudy orange-cream at four or five folds, to an opaque satin near-white (#f2e9dc) at twelve, and every part of the batch renders at ITS OWN local fold count — a fresh corner folded in late stays visibly darker and glassier than the rest for the remainder of the session. Local thickness also drives translucency, so a stretched loop genuinely glows through where it is thin. Exactly one chip of colour-batch cochineal (#d8365e) is held strictly for the laid-on ribbon and its advected striations, and it obeys the same lamination arithmetic — it never dilutes, it only ever gets finer, and when its stripe width falls below one pixel it is rendered as the honest area-weighted average of stripe and ground and not deleted. Flat, hard, high-contrast, no glow, no bloom, no soft focus, no gradients other than honest scattering, honest thickness and honest metal — nickel and sugar under a shop ceiling fixture with hot afternoon daylight coming in off the boards behind you.">
  <meta name="outbox-spec-wildcard" content="There is a housefly on the INSIDE of the shop window, in front of everything, between the viewer and the machine — rendered slightly out of focus and always at the same size regardless of what the batch is doing. It lands somewhere on the glass, walks two or three centimetres in short bursts with real pauses, cleans its forelegs, and takes off again, on its own irregular clock. It never touches the candy, never reacts to the arms, never reacts to the cursor, cannot be shooed, and is never accounted for by anything on the page. It is there in the first ten seconds of every visit.">
  <meta name="outbox-spec-forbidden" content="NO candy-as-metaphor for anything — not sweetness, not childhood, not summer, not indulgence, not 'pulled in two directions', not how a person is made by being folded over and over; it is a supersaturated glass, an air fraction and a fold count, and it has nothing to teach anybody. ABSOLUTELY NO chaos-theory or mathematics-as-poetry framing: no 'order out of chaos', no butterfly effect, no infinity, no fractal awe, no sublime-pattern reverie, no Borges, no 'everything is still in there somewhere' as a statement about memory or the soul — the striations are microns wide and that is the whole of it. NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery or screensaver framing whatsoever. NO boardwalk nostalgia, NO Americana, NO Kodachrome summer, NO 'the smell of the shore', NO 1960s-as-innocence, NO Jersey-shore sentimentality, NO family-vacation warmth, NO 'the last real boardwalk'. NO decline narrative of any kind: no 'the shops are all t-shirt places now', no 'nobody pulls by hand anymore', no vanished-trade lament — there is another kettle due at twenty of three. NO twee, NO whimsy, NO cute, NO pastel-confectionery preciousness, NO Wes Anderson symmetry, NO candy-shop-as-wonderland. NO food writing whatsoever: nothing about how any of it tastes, smells or feels in the mouth, no mouthwatering description, no craving; the batch is a mass with a viscosity and an optical density. NO craftsman-sage register, NO 'you can feel when it's ready', NO secret-family-recipe mystique, NO artisan reverence, NO machine-vs-handmade sermon. NO danger-porn about the hot sugar, no foreshadowed burns, no dread about the pins. NO cryptic-SCP, liminal, uncanny, analog-horror or ominous dread about the fly, the tearing, or the batch that keeps getting whiter — nothing here is wrong. NO sensuous material writing about sugar or metal beyond temperature, viscosity, thickness, air fraction and speed. NO archival / museum / cabinet / drawer / found-object / relic framing — the machine is running in the window this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past two on a hot bright afternoon with the front door propped open. NO signal / transmission / frequency / broadcast framing of the motor hum, despite it having a pitch. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the machine, the candy, the marble and the wall, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,CX=0,CY=0,R=0,PR=0,MARBLE=0,NMAX=1700,MOB=false;
var bg=document.createElement('canvas'),bgx=bg.getContext('2d');
var hz=document.createElement('canvas'),hzx=hz.getContext('2d');
var hazePat=null;

/* ---------- deterministic little rng for the wall ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= layout ================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  MOB=Math.min(W,H)<620;
  NMAX=MOB?760:1700;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W*0.5;CY=H*0.395;
  R=Math.min(W*0.235,H*0.165);
  PR=Math.max(7,R*0.20);
  MARBLE=H*0.795;
  paintWall();paintHaze();
}
function paintWall(){
  bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
  bgx.setTransform(DPR,0,0,DPR,0,0);
  var rnd=mulberry(1968);
  var g=bgx.createLinearGradient(0,0,0,MARBLE);
  g.addColorStop(0,'#e6dcc0');g.addColorStop(.52,'#e4d9bd');g.addColorStop(1,'#cfc6ab');
  bgx.fillStyle=g;bgx.fillRect(0,0,W,MARBLE+2);
  /* dirty yellow over the kettle range, back right */
  var kg=bgx.createRadialGradient(W*0.86,H*0.06,10,W*0.86,H*0.06,Math.max(W,H)*0.62);
  kg.addColorStop(0,'rgba(196,164,86,0.42)');kg.addColorStop(.45,'rgba(199,172,101,0.18)');kg.addColorStop(1,'rgba(199,172,101,0)');
  bgx.fillStyle=kg;bgx.fillRect(0,0,W,MARBLE+2);
  /* tongue-and-groove */
  var bw=Math.max(26,W/26);
  for(var x=-bw;x<W+bw;x+=bw){
    var v=(rnd()-0.5)*13;
    bgx.fillStyle='rgba('+(228+v)+','+(217+v)+','+(186+v*0.6)+',0.30)';
    bgx.fillRect(x,0,bw,MARBLE);
    bgx.fillStyle='rgba(120,116,92,0.30)';bgx.fillRect(x+bw-2,0,1.4,MARBLE);
    bgx.fillStyle='rgba(255,252,236,0.22)';bgx.fillRect(x+bw-0.4,0,1.1,MARBLE);
    if(rnd()<0.5){ /* a run of old paint */
      var dy=rnd()*MARBLE*0.7, dl=12+rnd()*70;
      bgx.fillStyle='rgba(150,142,110,0.10)';bgx.fillRect(x+2+rnd()*(bw-6),dy,1.5,dl);
    }
    if(rnd()<0.35){var ny=H*0.08+rnd()*MARBLE*0.8;bgx.fillStyle='rgba(120,112,86,0.28)';bgx.beginPath();bgx.arc(x+bw*0.5,ny,1.6,0,6.3);bgx.fill();}
  }
  /* cold grey-green shadow behind the machine */
  var sg=bgx.createRadialGradient(CX,CY+R*0.4,R*0.2,CX,CY+R*0.4,R*3.4);
  sg.addColorStop(0,'rgba(140,142,124,0.50)');sg.addColorStop(.5,'rgba(169,168,148,0.34)');sg.addColorStop(1,'rgba(169,168,148,0)');
  bgx.fillStyle=sg;bgx.fillRect(0,0,W,MARBLE+2);
  /* marble slab */
  var mg=bgx.createLinearGradient(0,MARBLE,0,H);
  mg.addColorStop(0,'#e6e2da');mg.addColorStop(.16,'#ded9d0');mg.addColorStop(.72,'#d4cfc6');mg.addColorStop(1,'#c3beb5');
  bgx.fillStyle=mg;bgx.fillRect(0,MARBLE,W,H-MARBLE+1);
  bgx.fillStyle='rgba(255,255,252,0.55)';bgx.fillRect(0,MARBLE,W,1.6);
  bgx.fillStyle='rgba(90,88,82,0.32)';bgx.fillRect(0,MARBLE-1.6,W,1.6);
  /* veining */
  bgx.lineCap='round';
  for(var i=0;i<26;i++){
    var y0=MARBLE+6+rnd()*(H-MARBLE-8);
    bgx.strokeStyle='rgba('+(140+rnd()*40)+','+(140+rnd()*38)+','+(136+rnd()*36)+','+(0.05+rnd()*0.16)+')';
    bgx.lineWidth=0.5+rnd()*1.6;bgx.beginPath();
    var px=rnd()*W,py=y0;bgx.moveTo(px,py);
    for(var k=0;k<5;k++){px+=(rnd()-0.35)*W*0.28;py+=(rnd()-0.5)*14;bgx.lineTo(px,py);}
    bgx.stroke();
  }
  /* the scald mark, permanent */
  var sc=bgx.createRadialGradient(W*0.235,MARBLE+(H-MARBLE)*0.42,2,W*0.235,MARBLE+(H-MARBLE)*0.42,Math.max(40,W*0.09));
  sc.addColorStop(0,'rgba(112,84,50,0.30)');sc.addColorStop(.55,'rgba(140,116,80,0.16)');sc.addColorStop(1,'rgba(140,116,80,0)');
  bgx.fillStyle=sc;bgx.beginPath();bgx.ellipse(W*0.235,MARBLE+(H-MARBLE)*0.42,Math.max(46,W*0.10),Math.max(16,W*0.032),0.18,0,6.3);bgx.fill();
}
function paintHaze(){
  hz.width=180;hz.height=180;var d=hzx.createImageData(180,180),p=d.data;
  for(var i=0;i<p.length;i+=4){var n=200+Math.random()*55;p[i]=n;p[i+1]=n;p[i+2]=n-6;p[i+3]=Math.random()*46;}
  hzx.putImageData(d,0,0);hazePat=ctx.createPattern(hz,'repeat');
}

/* ================= kinematics ================= */
var theta=0, omega=1.85, speedMul=1.0, lastTheta=0, periodTick=0;
var pins=[{x:0,y:0,px:0,py:0,haze:0.04},{x:0,y:0,px:0,py:0,haze:0.04},{x:0,y:0,px:0,py:0,haze:0.02}];
function stepPins(){
  for(var i=0;i<3;i++){pins[i].px=pins[i].x;pins[i].py=pins[i].y;}
  pins[0].x=CX+Math.cos(theta)*R;      pins[0].y=CY+Math.sin(theta)*R;
  pins[1].x=CX+Math.cos(theta+Math.PI)*R; pins[1].y=CY+Math.sin(theta+Math.PI)*R;
  var r2=R*0.155;
  pins[2].x=CX+Math.cos(-2*theta)*r2;  pins[2].y=CY+Math.sin(-2*theta)*r2;
}

/* ================= material ================= */
var AMB=86, chains=[], drips=[], totalVol=0, batchStart=0;
function mkv(x,y){return {x:x,y:y,px:x,py:y,vol:0,rest:0,T:186,fold:0,air:0,col:0,rad:9,ci:0,li:0};}
function visc(T){var e=Math.exp((150-T)*0.048);return e<0.16?0.16:(e>14?14:e);}

function newBatch(){
  chains.length=0;drips.length=0;
  var n=Math.max(150,Math.min(320,Math.round(R*2.0)));
  var v=[],rx=R*1.30,ry=R*0.98,off=H*0.72;
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2;
    v.push(mkv(CX+Math.cos(a)*rx,CY+R*0.45+Math.sin(a)*ry+off));
  }
  var per=0;for(i=0;i<n;i++){var b=v[(i+1)%n];per+=Math.hypot(b.x-v[i].x,b.y-v[i].y);}
  var r0=Math.max(9,R*0.20);
  totalVol=per*Math.PI*r0*r0;
  for(i=0;i<n;i++){
    var b2=v[(i+1)%n],L=Math.hypot(b2.x-v[i].x,b2.y-v[i].y);
    v[i].rest=L;v[i].vol=L*Math.PI*r0*r0;v[i].rad=r0;
  }
  chains.push({v:v,closed:true,lift:true});
  batchStart=performance.now();
  torn=false;
}
var torn=false;

function segCount(ch){return ch.closed?ch.v.length:ch.v.length-1;}

/* ---- adaptive resample ---- */
function resampleAll(){
  var totalLen=0,c,i,ch,n;
  for(c=0;c<chains.length;c++){ch=chains[c];n=ch.v.length;for(i=0;i<segCount(ch);i++){var a=ch.v[i],b=ch.v[(i+1)%n];totalLen+=Math.hypot(b.x-a.x,b.y-a.y);}}
  var maxS=totalLen/(NMAX*0.82); if(maxS<5)maxS=5; if(maxS>64)maxS=64;
  var minS=maxS*0.45;
  var count=0;for(c=0;c<chains.length;c++)count+=chains[c].v.length;
  for(c=0;c<chains.length;c++){
    ch=chains[c];n=ch.v.length;
    if(n<4){chains.splice(c,1);c--;continue;}
    var segs=segCount(ch),nv=[];
    for(i=0;i<segs;i++){
      var a=ch.v[i],b=ch.v[(i+1)%n];
      nv.push(a);
      var L=Math.hypot(b.x-a.x,b.y-a.y);
      if(L>maxS&&count<NMAX){
        var m=mkv((a.x+b.x)*0.5,(a.y+b.y)*0.5);
        m.px=(a.px+b.px)*0.5;m.py=(a.py+b.py)*0.5;
        m.T=(a.T+b.T)*0.5;m.fold=(a.fold+b.fold)*0.5;m.air=(a.air+b.air)*0.5;
        m.col=(a.col===b.col)?a.col:(Math.random()<0.5?a.col:b.col);
        a.vol*=0.5;a.rest*=0.5;m.vol=a.vol;m.rest=a.rest;m.rad=a.rad;
        nv.push(m);count++;
      }
    }
    if(!ch.closed)nv.push(ch.v[n-1]);
    /* merge */
    var out=[],skip=false,ln=nv.length;
    for(i=0;i<ln;i++){
      if(skip){skip=false;continue;}
      var p=nv[i];
      var lim=ch.closed?ln:ln-1;
      if(i<lim-1){
        var q=nv[(i+1)%ln];
        var d=Math.hypot(q.x-p.x,q.y-p.y);
        if(d<minS&&out.length+ (ln-i) > 24){
          p.vol+=q.vol;p.rest+=q.rest;
          p.fold=Math.max(p.fold,q.fold);p.air=Math.max(p.air,q.air);
          p.col=Math.max(p.col,q.col);p.T=(p.T+q.T)*0.5;
          skip=true;count--;
        }
      }
      out.push(p);
    }
    ch.v=out;
  }
}

/* ---- spatial grid, for bulk ---- */
var flat=[],head=null,nxt=null,GC=14,gw=0,gh=0;
function grid(){
  flat.length=0;
  for(var c=0;c<chains.length;c++){var v=chains[c].v;for(var i=0;i<v.length;i++){v[i].ci=c;v[i].li=i;flat.push(v[i]);}}
  gw=Math.ceil(W/GC)+2;gh=Math.ceil(H/GC)+2;
  if(!head||head.length<gw*gh)head=new Int32Array(gw*gh);
  head.fill(-1);
  if(!nxt||nxt.length<flat.length)nxt=new Int32Array(flat.length+256);
  for(var k=0;k<flat.length;k++){
    var p=flat[k];var gx=(p.x/GC)|0,gy=(p.y/GC)|0;
    if(gx<0)gx=0;if(gy<0)gy=0;if(gx>=gw)gx=gw-1;if(gy>=gh)gy=gh-1;
    var id=gy*gw+gx;nxt[k]=head[id];head[id]=k;
  }
}
function bulk(){
  for(var k=0;k<flat.length;k++){
    var p=flat[k];var gx=(p.x/GC)|0,gy=(p.y/GC)|0;
    if(gx<1)gx=1;if(gy<1)gy=1;if(gx>gw-2)gx=gw-2;if(gy>gh-2)gy=gh-2;
    for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++){
      var j=head[(gy+oy)*gw+(gx+ox)];var guard=0;
      while(j!==-1&&guard++<24){
        if(j>k){
          var q=flat[j];
          if(!(q.ci===p.ci&&Math.abs(q.li-p.li)<5)){
            var dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
            var mr=(p.rad+q.rad)*0.42;
            if(d2<mr*mr&&d2>0.0001){
              var d=Math.sqrt(d2),f=(mr-d)/d*0.18;
              p.x-=dx*f;p.y-=dy*f;q.x+=dx*f;q.y+=dy*f;
            }
          }
        }
        j=nxt[j];
      }
    }
  }
}

/* ================= interaction state ================= */
var mode='idle',p0x=0,p0y=0,pt0=0,px_=0,py_=0,grab=null,fanX=0,fanY=0,fanOn=false,pointerDown=false;

/* ================= simulation ================= */
function simulate(dt){
  var sub=3,h=dt/sub,c,i,ch,n,a,b;
  for(var s=0;s<sub;s++){
    theta+=omega*speedMul*h;
    stepPins();
    for(c=0;c<chains.length;c++){
      ch=chains[c];n=ch.v.length;
      if(ch.lift){
        var ay=0;for(i=0;i<n;i++)ay+=ch.v[i].y;ay/=n;
        var up=H*0.85*h;
        for(i=0;i<n;i++){ch.v[i].y-=up;ch.v[i].py-=up;}
        if(ay-up<CY+R*0.50)ch.lift=false;
        continue;
      }
      /* integrate */
      for(i=0;i<n;i++){
        var p=ch.v[i];
        var vx=p.x-p.px,vy=p.y-p.py;
        var dmp=1-Math.min(0.55,0.016*visc(p.T));
        p.px=p.x;p.py=p.y;
        p.x+=vx*dmp;p.y+=vy*dmp+900*h*h;
      }
      /* constraints + plastic creep */
      var segs=segCount(ch);
      for(var it=0;it<2;it++){
        for(i=0;i<segs;i++){
          a=ch.v[i];b=ch.v[(i+1)%n];
          var dx=b.x-a.x,dy=b.y-a.y,L=Math.sqrt(dx*dx+dy*dy)||0.0001;
          if(L>a.rest){
            var corr=(L-a.rest)/L*0.5;
            a.x+=dx*corr;a.y+=dy*corr;b.x-=dx*corr;b.y-=dy*corr;
            if(it===0){
              var rate=h*7/visc(a.T); if(rate>0.5)rate=0.5;
              var old=a.rest;
              a.rest+=(L-a.rest)*rate;
              if(a.rest>old){
                var dl=Math.log(a.rest/old)/Math.LN2;
                a.fold+=dl;
                a.air+=dl*2.6*(1-a.air)/visc(a.T);
                if(a.air>0.62)a.air=0.62;
                if(a.fold>17)a.fold=17;
                var bb=ch.v[(i+1)%n];
                bb.fold=Math.max(bb.fold,a.fold*0.985);
                bb.air=Math.max(bb.air,a.air*0.985);
              }
              /* cold and stretched: it tears */
              if(a.T<109&&L>a.rest*1.035&&a.rad<7&&Math.random()<0.35){
                tearAt(c,i);crack(a.rad);n=chains[c]?chains[c].v.length:0;segs=chains[c]?segCount(chains[c]):0;
                if(!chains[c])break; ch=chains[c];
              }
            }
          }else if(L<a.rest*0.55){
            var c2=(L-a.rest*0.55)/L*0.22;
            a.x+=dx*c2;a.y+=dy*c2;b.x-=dx*c2;b.y-=dy*c2;
          }
        }
        if(!ch)break;
      }
      if(!ch)continue;
      /* pins */
      for(i=0;i<ch.v.length;i++){
        var v0=ch.v[i];
        for(var k2=0;k2<3;k2++){
          var pn=pins[k2];
          var ddx=v0.x-pn.x,ddy=v0.y-pn.y,dd=Math.sqrt(ddx*ddx+ddy*ddy)||0.0001;
          var rr=PR+v0.rad*0.55;
          if(dd<rr){
            var push=(rr-dd)/dd;
            v0.x+=ddx*push;v0.y+=ddy*push;
            var pvx=(pn.x-pn.px),pvy=(pn.y-pn.py);
            var stick=0.30+Math.min(0.45,visc(v0.T)*0.05);
            v0.px=v0.x-((v0.x-v0.px)*(1-stick)+pvx*stick);
            v0.py=v0.y-((v0.y-v0.py)*(1-stick)+pvy*stick);
            pn.haze=Math.min(0.55,pn.haze+0.00028*stick);
            if(dd<rr*0.72)slapPing(v0.rad);
          }
        }
      }
      /* grab */
      if(grab&&grab.c===c){
        for(var gi=0;gi<grab.idx.length;gi++){
          var q2=ch.v[grab.idx[gi]];
          if(!q2)continue;
          q2.x+=(px_-q2.x)*0.42;q2.y+=(py_-q2.y)*0.42;
        }
      }
    }
    bulkTick++;
  }
  /* per-frame material bookkeeping */
  grid();bulk();
  for(c=0;c<chains.length;c++){
    ch=chains[c];n=ch.v.length;var segs2=segCount(ch);
    for(i=0;i<segs2;i++){
      a=ch.v[i];b=ch.v[(i+1)%n];
      var L2=Math.hypot(b.x-a.x,b.y-a.y)||0.001;
      var area=a.vol/L2;
      a.rad=Math.sqrt(area/Math.PI);
      if(a.rad<0.35)a.rad=0.35;
      /* cooling by real surface-to-volume */
      var cool=0.42/(a.rad+1.6);
      if(fanOn){
        var fx=a.x-fanX,fy=a.y-fanY,fd2=fx*fx+fy*fy,fr=Math.max(70,R*0.85);
        if(fd2<fr*fr)cool+=1.35*(1-Math.sqrt(fd2)/fr);
      }
      a.T+=-(a.T-AMB)*cool*lastDT;
      if(a.T<AMB)a.T=AMB;
      /* volume flows thick -> thin */
      if(i<segs2-1||ch.closed){
        var nb=ch.v[(i+1)%n];
        var L3=Math.hypot(ch.v[(i+2)%n].x-nb.x,ch.v[(i+2)%n].y-nb.y)||0.001;
        var ar2=nb.vol/L3;
        var fl=(area-ar2)*0.016*lastDT*60/visc(a.T);
        var mv=fl*Math.min(L2,L3)*0.5;
        if(Math.abs(mv)<a.vol*0.2&&Math.abs(mv)<nb.vol*0.2){a.vol-=mv;nb.vol+=mv;}
      }
      /* hot and thin and hanging low: it drips off */
      if(a.T>168&&a.rad<2.6&&a.y>CY+R*1.9&&Math.random()<0.02){
        drips.push({x:a.x,y:a.y,vx:(Math.random()-.5)*20,vy:40,r:Math.max(2,a.rad*2.2),
                    col:a.col,fold:a.fold,air:a.air,land:0});
        totalVol-=a.vol*0.6;a.vol*=0.4;
      }
    }
  }
  resampleAll();
  if(chains.length===0)newBatch();
  /* drips */
  for(i=drips.length-1;i>=0;i--){
    var d=drips[i];
    if(d.land){d.land+=lastDT;if(d.land>240)drips.splice(i,1);continue;}
    d.vy+=900*lastDT;d.x+=d.vx*lastDT;d.y+=d.vy*lastDT;
    if(d.y>MARBLE+8){d.y=MARBLE+8+Math.random()*6;d.land=0.001;}
  }
}
var bulkTick=0,lastDT=1/60;

function tearAt(c,i){
  var ch=chains[c];if(!ch)return;var v=ch.v,n=v.length;
  torn=true;
  if(ch.closed){
    var out=[];for(var k=1;k<=n;k++)out.push(v[(i+k)%n]);
    ch.v=out;ch.closed=false;
  }else{
    if(i<2||i>n-3)return;
    var A=v.slice(0,i+1),B=v.slice(i+1);
    ch.v=A;
    chains.push({v:B,closed:false,lift:false});
  }
}

/* ================= colour ================= */
function shade(rad,air,fold,col,out){
  var t=Math.exp(-rad*0.055);
  var br=200+16*col, bg2=132-78*col, bb=42+52*col;
  var gr=br*(0.52+0.88*t), gg=bg2*(0.50+1.00*t), gb=bb*(0.48+1.75*t);
  var wr=242, wg=233-27*col, wb=220-8*col;
  var Sv=air*(1+fold*0.92), s=Sv*0.52*rad;
  var Wt=s/(s+0.62); if(Wt>1)Wt=1;
  out[0]=gr+(wr-gr)*Wt;out[1]=gg+(wg-gg)*Wt;out[2]=gb+(wb-gb)*Wt;
  out[3]=Wt;
}

/* ================= slabs on the marble ================= */
var slabs=[];
function loadSlabs(){try{var s=localStorage.getItem('wildwood.pulled');if(s)slabs=JSON.parse(s)||[];}catch(e){slabs=[];}}
function saveSlabs(){try{localStorage.setItem('wildwood.pulled',JSON.stringify(slabs.slice(-64)));}catch(e){}}
function pullOff(){
  var i,c,ch,tw=0,cr=0,cg=0,cb=0,af=0,fo=0,cl=0,maxf=0,o=[0,0,0,0];
  for(c=0;c<chains.length;c++){ch=chains[c];for(i=0;i<ch.v.length;i++){
    var p=ch.v[i],w=p.vol;
    shade(p.rad,p.air,p.fold,p.col,o);
    cr+=o[0]*w;cg+=o[1]*w;cb+=o[2]*w;af+=p.air*w;fo+=p.fold*w;cl+=p.col*w;tw+=w;
    if(p.col>0.5&&p.fold>maxf)maxf=p.fold;
  }}
  if(tw<=0)return;
  slabs.push({r:Math.round(cr/tw),g:Math.round(cg/tw),b:Math.round(cb/tw),
              a:af/tw,f:fo/tw,c:cl/tw,s:Math.round(Math.pow(2,maxf)),
              v:tw,t:Date.now(),x:Math.random()});
  if(slabs.length>64)slabs=slabs.slice(-64);
  saveSlabs();
  clank(0.9);
  newBatch();
}
function drawSlabs(){
  var show=slabs.slice(-13),n=show.length;
  for(var i=0;i<n;i++){
    var s=show[i];
    var depth=(n-1-i)/Math.max(1,n-1);
    var bandH=(H-MARBLE);
    var y=MARBLE+bandH*(0.20+0.52*(1-depth));
    var sc=0.62+0.42*(1-depth);
    var w=Math.min(W*0.19,150)*sc*(0.72+0.55*Math.min(1.4,s.v/(totalVol||1)));
    var hgt=Math.max(7,bandH*0.15*sc);
    var x=W*0.10+ (s.x)*(W*0.80)-w*0.5;
    if(x<4)x=4; if(x+w>W-4)x=W-4-w;
    var dim=1-depth*0.20;
    ctx.save();
    ctx.fillStyle='rgba(70,68,62,'+(0.16+0.10*(1-depth))+')';
    ctx.beginPath();ctx.ellipse(x+w*0.5,y+hgt*0.96,w*0.54,hgt*0.30,0,0,6.3);ctx.fill();
    /* body */
    var col='rgb('+Math.round(s.r*dim)+','+Math.round(s.g*dim)+','+Math.round(s.b*dim)+')';
    ctx.fillStyle=col;
    rr(ctx,x,y,w,hgt,hgt*0.34);ctx.fill();
    /* top face */
    ctx.fillStyle='rgba(255,253,246,'+(0.16+0.22*s.a)+')';
    rr(ctx,x+w*0.04,y,w*0.92,hgt*0.34,hgt*0.20);ctx.fill();
    /* cut face, striped */
    var fw=w*0.20,fx=x+w-fw-1,fy=y+hgt*0.13,fh=hgt*0.74;
    ctx.save();ctx.beginPath();rr(ctx,fx,fy,fw,fh,2);ctx.clip();
    ctx.fillStyle='rgb('+Math.round(s.r*dim*0.92)+','+Math.round(s.g*dim*0.92)+','+Math.round(s.b*dim*0.92)+')';
    ctx.fillRect(fx,fy,fw,fh);
    if(s.c>0.02){
      var stripes=Math.max(2,s.s),sw=fw/stripes;
      if(sw<1){
        ctx.fillStyle='rgba(216,54,94,'+(0.30*Math.min(1,s.c*2.4))+')';ctx.fillRect(fx,fy,fw,fh);
      }else{
        ctx.fillStyle='rgba(216,54,94,0.55)';
        for(var k=0;k<stripes;k+=2)ctx.fillRect(fx+k*sw,fy,sw,fh);
      }
    }
    ctx.restore();
    ctx.strokeStyle='rgba(88,84,76,0.22)';ctx.lineWidth=0.8;rr(ctx,fx,fy,fw,fh,2);ctx.stroke();
    ctx.restore();
  }
}
function rr(c2,x,y,w,h,r){c2.beginPath();c2.moveTo(x+r,y);c2.arcTo(x+w,y,x+w,y+h,r);c2.arcTo(x+w,y+h,x,y+h,r);c2.arcTo(x,y+h,x,y,r);c2.arcTo(x,y,x+w,y,r);c2.closePath();}

/* ================= render ================= */
var sc4=[0,0,0,0];
function render(){
  ctx.drawImage(bg,0,0,W,H);
  /* cast iron column and base */
  ctx.fillStyle='#4e5150';
  ctx.fillRect(CX-R*0.10,CY,R*0.20,MARBLE-CY);
  ctx.fillStyle='#3f4241';
  ctx.fillRect(CX-R*0.40,MARBLE-R*0.16,R*0.80,R*0.16);
  ctx.fillStyle='rgba(255,255,250,0.10)';ctx.fillRect(CX-R*0.10,CY,R*0.05,MARBLE-CY);
  /* carrier arm */
  ctx.save();ctx.translate(CX,CY);ctx.rotate(theta);
  var ag=ctx.createLinearGradient(0,-R*0.13,0,R*0.13);
  ag.addColorStop(0,'#dfe3e4');ag.addColorStop(.35,'#c9ced0');ag.addColorStop(1,'#8f9698');
  ctx.fillStyle=ag;rr(ctx,-R*1.02,-R*0.10,R*2.04,R*0.20,R*0.10);ctx.fill();
  ctx.strokeStyle='rgba(58,62,63,0.5)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
  /* boss */
  var bgd=ctx.createRadialGradient(CX-R*0.06,CY-R*0.07,1,CX,CY,R*0.30);
  bgd.addColorStop(0,'#e9edee');bgd.addColorStop(.6,'#b3b9bb');bgd.addColorStop(1,'#787f81');
  ctx.fillStyle=bgd;ctx.beginPath();ctx.arc(CX,CY,R*0.26,0,6.3);ctx.fill();
  /* pins, back */
  for(var i=0;i<3;i++)drawPin(pins[i],false);
  /* drips in air */
  for(i=0;i<drips.length;i++){
    var d=drips[i];shade(d.r*0.5,d.air,d.fold,d.col,sc4);
    ctx.fillStyle='rgb('+(sc4[0]|0)+','+(sc4[1]|0)+','+(sc4[2]|0)+')';
    ctx.beginPath();
    if(d.land)ctx.ellipse(d.x,d.y,d.r*1.9,d.r*0.6,0,0,6.3);
    else ctx.ellipse(d.x,d.y,d.r*0.8,d.r*1.5,0,0,6.3);
    ctx.fill();
  }
  /* the batch */
  ctx.lineCap='round';ctx.lineJoin='round';
  var lastKey=-1,open=false;
  for(var c=0;c<chains.length;c++){
    var ch=chains[c],v=ch.v,n=v.length,segs=segCount(ch);
    for(i=0;i<segs;i++){
      var a=v[i],b=v[(i+1)%n];
      shade(a.rad,a.air,a.fold,a.col,sc4);
      var wpx=a.rad*2, dw=wpx<1?1:wpx;
      var op=1-Math.exp(-a.rad*(0.30+a.air*1.5+a.fold*0.10));
      if(op<0.30)op=0.30;
      var al=op*(wpx<1?wpx:1);
      var key=(((sc4[0]>>3)*32+(sc4[1]>>3))*32+(sc4[2]>>3))*64+Math.min(63,Math.round(dw*1.5))
              +(Math.round(al*7)*1000000);
      if(key!==lastKey){
        if(open){ctx.stroke();}
        ctx.strokeStyle='rgba('+(sc4[0]|0)+','+(sc4[1]|0)+','+(sc4[2]|0)+','+al.toFixed(2)+')';
        ctx.lineWidth=dw;ctx.beginPath();open=true;lastKey=key;
      }
      ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    }
  }
  if(open)ctx.stroke();
  /* glassy sheen on thick, unaerated material */
  ctx.strokeStyle='rgba(251,252,250,0.13)';ctx.lineCap='round';
  ctx.beginPath();
  for(c=0;c<chains.length;c++){
    var ch2=chains[c],v2=ch2.v,n2=v2.length,s2=segCount(ch2);
    for(i=0;i<s2;i+=2){
      var a2=v2[i];if(a2.rad<4||a2.air>0.34)continue;
      var b2=v2[(i+1)%n2];
      ctx.lineWidth=a2.rad*0.42;
      ctx.moveTo(a2.x-a2.rad*0.30,a2.y-a2.rad*0.38);
      ctx.lineTo(b2.x-a2.rad*0.30,b2.y-a2.rad*0.38);
    }
  }
  ctx.stroke();
  /* pin fronts */
  for(i=0;i<3;i++)drawPin(pins[i],true);
  drawSlabs();
  /* window haze + glare */
  if(hazePat){ctx.globalAlpha=0.055;ctx.fillStyle=hazePat;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  var gg2=ctx.createLinearGradient(0,0,W*0.7,H);
  gg2.addColorStop(0,'rgba(251,252,250,0.11)');gg2.addColorStop(.30,'rgba(251,252,250,0.03)');
  gg2.addColorStop(.55,'rgba(251,252,250,0.07)');gg2.addColorStop(1,'rgba(251,252,250,0)');
  ctx.fillStyle=gg2;ctx.fillRect(0,0,W,H);
  drawFly();
}
function drawPin(p,front){
  var g;
  if(!front){
    g=ctx.createRadialGradient(p.x-PR*0.4,p.y-PR*0.45,1,p.x,p.y,PR*1.25);
    g.addColorStop(0,'#f2f5f5');g.addColorStop(.45,'#c9ced0');g.addColorStop(.85,'#8f9698');g.addColorStop(1,'#6e7577');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,PR,0,6.3);ctx.fill();
    /* sugar-hazed riding band */
    ctx.strokeStyle='rgba(143,150,152,'+(0.35+p.haze).toFixed(2)+')';
    ctx.lineWidth=PR*0.42;ctx.beginPath();ctx.arc(p.x,p.y,PR*0.72,0,6.3);ctx.stroke();
  }else{
    var la=Math.atan2(p.y-H*0.10,p.x-W*0.30);
    ctx.fillStyle='rgba(251,252,250,0.85)';
    ctx.beginPath();ctx.arc(p.x,p.y,PR*0.52,la-1.5,la+1.0);ctx.lineTo(p.x,p.y);ctx.fill();
    g=ctx.createRadialGradient(p.x-PR*0.22,p.y-PR*0.26,1,p.x,p.y,PR*0.60);
    g.addColorStop(0,'#fbfcfa');g.addColorStop(.5,'#c9ced0');g.addColorStop(1,'#8f9698');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,PR*0.40,0,6.3);ctx.fill();
    ctx.strokeStyle='rgba(60,64,65,0.45)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,PR*0.40,0,6.3);ctx.stroke();
    /* moving specular streak */
    ctx.strokeStyle='rgba(251,252,250,0.55)';ctx.lineWidth=PR*0.16;
    ctx.beginPath();ctx.arc(p.x,p.y,PR*0.86,la-0.75,la-0.10);ctx.stroke();
  }
}

/* ================= the fly on the glass ================= */
var fly={x:0.4,y:0.3,a:0,mode:'pause',t:0,tt:0.7,leg:0,cnt:0,tx:0,ty:0,fx:0,fy:0,ft:0};
function flyInit(){fly.x=0.32+Math.random()*0.3;fly.y=0.18+Math.random()*0.2;fly.a=Math.random()*6.3;}
function flyStep(dt){
  fly.t+=dt;
  if(fly.mode==='pause'&&fly.t>fly.tt){
    fly.cnt++;
    if(fly.cnt>3+Math.random()*4){fly.cnt=0;fly.mode='air';fly.t=0;fly.ft=0.45+Math.random()*0.55;
      fly.fx=fly.x;fly.fy=fly.y;fly.tx=0.10+Math.random()*0.80;fly.ty=0.10+Math.random()*0.62;}
    else if(Math.random()<0.38){fly.mode='clean';fly.t=0;fly.tt=0.5+Math.random()*0.9;}
    else{fly.mode='walk';fly.t=0;fly.tt=0.12+Math.random()*0.35;fly.a+=(Math.random()-0.5)*1.7;}
  }else if(fly.mode==='walk'){
    var sp=0.026*dt;
    fly.x+=Math.cos(fly.a)*sp;fly.y+=Math.sin(fly.a)*sp*0.8;
    fly.leg+=dt*22;
    if(fly.x<0.05||fly.x>0.95)fly.a=Math.PI-fly.a;
    if(fly.y<0.05||fly.y>0.72)fly.a=-fly.a;
    if(fly.t>fly.tt){fly.mode='pause';fly.t=0;fly.tt=0.35+Math.random()*1.6;}
  }else if(fly.mode==='clean'){
    fly.leg+=dt*30;
    if(fly.t>fly.tt){fly.mode='pause';fly.t=0;fly.tt=0.3+Math.random()*1.2;}
  }else if(fly.mode==='air'){
    var u=fly.t/fly.ft;
    if(u>=1){fly.mode='pause';fly.t=0;fly.tt=0.4+Math.random()*1.4;fly.x=fly.tx;fly.y=fly.ty;fly.a=Math.random()*6.3;}
    else{
      fly.x=fly.fx+(fly.tx-fly.fx)*u+Math.sin(u*13)*0.017;
      fly.y=fly.fy+(fly.ty-fly.fy)*u-Math.sin(u*Math.PI)*0.10+Math.cos(u*17)*0.012;
    }
  }
}
function drawFly(){
  var x=fly.x*W,y=fly.y*H,S=Math.max(7,Math.min(W,H)*0.0125);
  ctx.save();
  try{ctx.filter='blur(1.15px)';}catch(e){}
  ctx.translate(x,y);ctx.rotate(fly.a+Math.PI*0.5);
  /* wings */
  ctx.fillStyle='rgba(224,226,222,0.42)';
  var wf=fly.mode==='air'?(0.6+0.4*Math.sin(fly.t*90)):1;
  ctx.beginPath();ctx.ellipse(-S*0.34,-S*0.10,S*0.26,S*0.62*wf,-0.42,0,6.3);ctx.fill();
  ctx.beginPath();ctx.ellipse(S*0.34,-S*0.10,S*0.26,S*0.62*wf,0.42,0,6.3);ctx.fill();
  /* legs */
  ctx.strokeStyle='rgba(38,34,30,0.8)';ctx.lineWidth=Math.max(0.8,S*0.075);
  var lw=(fly.mode==='walk')?Math.sin(fly.leg)*0.25:(fly.mode==='clean'?Math.sin(fly.leg)*0.55:0);
  for(var s=-1;s<=1;s+=2)for(var k=0;k<3;k++){
    ctx.beginPath();ctx.moveTo(s*S*0.13,-S*0.30+k*S*0.26);
    ctx.lineTo(s*(S*0.48+lw*S*0.2),-S*0.42+k*S*0.34+lw*S*0.2);ctx.stroke();
  }
  /* body */
  ctx.fillStyle='#2c2a26';
  ctx.beginPath();ctx.ellipse(0,S*0.16,S*0.24,S*0.44,0,0,6.3);ctx.fill();
  ctx.fillStyle='#3a362f';
  ctx.beginPath();ctx.ellipse(0,-S*0.34,S*0.21,S*0.23,0,0,6.3);ctx.fill();
  ctx.fillStyle='rgba(122,72,52,0.9)';
  ctx.beginPath();ctx.arc(-S*0.14,-S*0.42,S*0.10,0,6.3);ctx.arc(S*0.14,-S*0.42,S*0.10,0,6.3);ctx.fill();
  ctx.restore();
  try{ctx.filter='none';}catch(e){}
}

/* ================= audio ================= */
var AC=null,master=null,motorA=null,motorB=null,motorF=null,motorG=null,creakG=null,creakO=null,fanG=null,noiseBuf=null,lastSlap=0;
function noise(sec){
  var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),l=0;
  for(var i=0;i<n;i++){var wn=Math.random()*2-1;l=(l+0.02*wn)/1.02;d[i]=wn*0.55+l*3.2;}
  return b;
}
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
  noiseBuf=noise(2.4);
  /* motor */
  motorF=AC.createBiquadFilter();motorF.type='lowpass';motorF.frequency.value=380;
  motorG=AC.createGain();motorG.gain.value=0.11;
  motorF.connect(motorG);motorG.connect(master);
  motorA=AC.createOscillator();motorA.type='sawtooth';motorA.frequency.value=47;
  motorB=AC.createOscillator();motorB.type='square';motorB.frequency.value=94;
  var mb=AC.createGain();mb.gain.value=0.35;motorB.connect(mb);mb.connect(motorF);
  motorA.connect(motorF);motorA.start();motorB.start();
  /* creak */
  creakO=AC.createOscillator();creakO.type='sawtooth';creakO.frequency.value=88;
  var cf=AC.createBiquadFilter();cf.type='bandpass';cf.frequency.value=620;cf.Q.value=7;
  creakG=AC.createGain();creakG.gain.value=0.0;
  creakO.connect(cf);cf.connect(creakG);creakG.connect(master);creakO.start();
  var lfo=AC.createOscillator();lfo.frequency.value=0.7;var lg=AC.createGain();lg.gain.value=22;
  lfo.connect(lg);lg.connect(creakO.frequency);lfo.start();
  /* fan */
  var fs=AC.createBufferSource();fs.buffer=noiseBuf;fs.loop=true;
  var ff=AC.createBiquadFilter();ff.type='bandpass';ff.frequency.value=900;ff.Q.value=0.6;
  fanG=AC.createGain();fanG.gain.value=0;fs.connect(ff);ff.connect(fanG);fanG.connect(master);fs.start();
  /* shop bed: surf + range */
  var ss=AC.createBufferSource();ss.buffer=noiseBuf;ss.loop=true;
  var sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=430;
  var sg=AC.createGain();sg.gain.value=0.055;ss.connect(sf);sf.connect(sg);sg.connect(master);ss.start();
  var slo=AC.createOscillator();slo.frequency.value=0.085;var slg=AC.createGain();slg.gain.value=210;
  slo.connect(slg);slg.connect(sf.frequency);slo.start();
  var ks=AC.createBufferSource();ks.buffer=noiseBuf;ks.loop=true;
  var kf=AC.createBiquadFilter();kf.type='bandpass';kf.frequency.value=210;kf.Q.value=0.9;
  var kg=AC.createGain();kg.gain.value=0.042;ks.connect(kf);kf.connect(kg);kg.connect(master);ks.start();
  scheduleShop();
}
function burst(buf,freq,q,dur,vol,type){
  if(!AC)return;
  var s=AC.createBufferSource();s.buffer=buf||noiseBuf;
  var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  var g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(master);
  s.playbackRate.value=0.7+Math.random()*0.7;
  s.start(AC.currentTime,Math.random()*1.2);s.stop(AC.currentTime+dur+0.02);
}
function clank(v){
  if(!AC)return;
  burst(noiseBuf,1500,2.4,0.11,0.16*v,'bandpass');
  var o=AC.createOscillator();o.type='triangle';o.frequency.setValueAtTime(230,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(140,AC.currentTime+0.10);
  var g=AC.createGain();g.gain.setValueAtTime(0.10*v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.16);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.18);
}
function slapPing(rad){
  if(!AC)return;
  var now=performance.now();
  if(now-lastSlap<95)return;lastSlap=now;
  var f=520-Math.min(360,rad*34);
  burst(noiseBuf,Math.max(150,f),1.5,0.09+rad*0.006,0.045+Math.min(0.07,rad*0.006),'bandpass');
}
function crack(rad){
  if(!AC)return;
  burst(noiseBuf,2600,0.9,0.055,0.30,'highpass');
  burst(noiseBuf,700,3,0.09,0.16,'bandpass');
}
function scheduleShop(){
  if(!AC)return;
  var t=1800+Math.random()*9000;
  setTimeout(function(){
    var r=Math.random();
    if(r<0.30){ /* gull */
      var o=AC.createOscillator();o.type='sawtooth';
      var g=AC.createGain(),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1700;f.Q.value=4;
      var n=AC.currentTime;o.frequency.setValueAtTime(900+Math.random()*400,n);
      o.frequency.exponentialRampToValueAtTime(520,n+0.28);
      g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.05,n+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,n+0.42);
      o.connect(f);f.connect(g);g.connect(master);o.start(n);o.stop(n+0.45);
    }else if(r<0.68){ /* boards */
      for(var i=0;i<2+Math.floor(Math.random()*4);i++){
        (function(k){setTimeout(function(){burst(noiseBuf,120+Math.random()*90,1.1,0.10,0.055,'lowpass');},k*(280+Math.random()*140));})(i);
      }
    }else if(r<0.86){ /* screen door on its spring */
      var o2=AC.createOscillator();o2.type='triangle';var g2=AC.createGain();
      var n2=AC.currentTime;o2.frequency.setValueAtTime(340,n2);
      o2.frequency.exponentialRampToValueAtTime(120,n2+0.55);
      g2.gain.setValueAtTime(0.045,n2);g2.gain.exponentialRampToValueAtTime(0.0001,n2+0.6);
      o2.connect(g2);g2.connect(master);o2.start(n2);o2.stop(n2+0.62);
      setTimeout(function(){burst(noiseBuf,260,1.4,0.12,0.10,'lowpass');},640);
    }else{
      burst(noiseBuf,300,0.8,0.5,0.03,'lowpass');
    }
    scheduleShop();
  },t);
}
function audioTick(){
  if(!AC)return;
  var vm=0,ct=0;
  for(var c=0;c<chains.length;c++){var v=chains[c].v;for(var i=0;i<v.length;i+=7){vm+=visc(v[i].T);ct++;}}
  var load=ct?Math.min(1,(vm/ct)/9):0;
  var base=46*(0.35+speedMul*0.75);
  motorA.frequency.setTargetAtTime(base*(1-load*0.22),AC.currentTime,0.25);
  motorB.frequency.setTargetAtTime(base*2*(1-load*0.22),AC.currentTime,0.25);
  motorG.gain.setTargetAtTime(0.09+load*0.055,AC.currentTime,0.3);
  motorF.frequency.setTargetAtTime(300+speedMul*260,AC.currentTime,0.3);
  creakG.gain.setTargetAtTime(load*load*0.030,AC.currentTime,0.4);
  fanG.gain.setTargetAtTime(fanOn?0.085:0,AC.currentTime,0.08);
}

/* ================= pointer ================= */
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function nearest(x,y){
  var best=null,bd=1e9;
  for(var c=0;c<chains.length;c++){var v=chains[c].v;
    for(var i=0;i<v.length;i++){var dx=v[i].x-x,dy=v[i].y-y,d=dx*dx+dy*dy;
      if(d<bd){bd=d;best={c:c,i:i,d:Math.sqrt(d)};}}}
  return best;
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  pointerDown=true;var p=pos(e);p0x=p.x;p0y=p.y;px_=p.x;py_=p.y;pt0=performance.now();mode='pending';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);
  if(!pointerDown){px_=p.x;py_=p.y;return;}
  var dx=p.x-px_,dy=p.y-py_;px_=p.x;py_=p.y;
  var tdx=p.x-p0x,tdy=p.y-p0y;
  if(mode==='pending'){
    if(Math.abs(tdx)>15&&Math.abs(tdx)>Math.abs(tdy)*1.2){mode='speed';}
    else if(tdy>18){
      var nb=nearest(p0x,p0y);
      if(nb&&nb.d<Math.max(46,R*0.45)){
        var v=chains[nb.c].v,idx=[];
        for(var k=-6;k<=6;k++){var j=nb.i+k;if(j>=0&&j<v.length)idx.push(j);}
        grab={c:nb.c,idx:idx};mode='pull';
      }else mode='speed';
    }
  }
  if(mode==='speed'){
    speedMul+=dx*0.0055;
    if(speedMul<0.18)speedMul=0.18;if(speedMul>2.4)speedMul=2.4;
  }
  if(mode==='pull'&&p.y>MARBLE-6){pullOff();grab=null;mode='done';}
  if(mode==='fan'){fanX=p.x;fanY=p.y;}
});
function endPtr(e){
  if(!pointerDown)return;
  pointerDown=false;fanOn=false;
  var el=performance.now()-pt0;
  var mv=Math.hypot(px_-p0x,py_-p0y);
  if(mode==='pending'&&el<340&&mv<12){
    var nb=nearest(p0x,p0y);
    if(nb&&nb.d<Math.max(52,R*0.5)){
      var v=chains[nb.c].v;
      var span=Math.max(3,Math.round(v.length*0.028));
      for(var k=-span;k<=span;k++){var j=nb.i+k;if(j>=0&&j<v.length)v[j].col=1;}
      burst(noiseBuf,420,2.0,0.08,0.05,'bandpass');
    }
  }
  grab=null;mode='idle';
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',endPtr);
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

/* ================= loop ================= */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000;last=now;
  if(dt>1/24)dt=1/24; if(dt<0.001)dt=0.001;
  lastDT=dt;
  if(pointerDown&&mode==='pending'&&now-pt0>340&&Math.hypot(px_-p0x,py_-p0y)<14){
    mode='fan';fanX=px_;fanY=py_;
  }
  fanOn=(mode==='fan'&&pointerDown);
  var pre=theta;
  simulate(dt);
  var per=Math.PI;
  if(Math.floor(theta/per)>Math.floor(pre/per))clank(0.55+Math.min(0.4,speedMul*0.2));
  render();
  audioTick();
  flyStep(dt);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',function(){
  var oldCX=CX,oldCY=CY,oldR=R;
  resize();
  if(oldR>0){
    var s=R/oldR;
    for(var c=0;c<chains.length;c++){var v=chains[c].v;
      for(var i=0;i<v.length;i++){
        v[i].x=CX+(v[i].x-oldCX)*s;v[i].y=CY+(v[i].y-oldCY)*s;
        v[i].px=CX+(v[i].px-oldCX)*s;v[i].py=CY+(v[i].py-oldCY)*s;
        v[i].rest*=s;v[i].vol*=s*s*s;
      }}
  }
});

resize();loadSlabs();newBatch();flyInit();stepPins();
requestAnimationFrame(frame);

})();
