  <meta name="outbox-spec-era" content="Easter Saturday 1979, right now — half two on a bright cold windy afternoon in a back garden in Ormskirk, Lancashire, where an 8ft × 6ft aluminium greenhouse has arrived flat in three cardboard bundles from a mail-order horticultural firm in Wexford Horticultural Products' spring list, 214 parts, forty-one bolt sizes, one folded instruction sheet printed in two colours, and a concrete base laid last weekend by somebody who did not check it with a string. Not a look-back at 'when things came in kits' and not a 'you can't get a decent greenhouse now' lament — the wind is up, the glass is stacked against the fence, and the whole thing has to be standing before dark or it blows away.">
  <meta name="outbox-spec-format" content="THE PAGE IS ONE OVERPRINTED SHEET THAT CANNOT BE READ WITHOUT A COLOURED GEL, AND THE GEL IS SMALLER THAN THE SHEET. The whole viewport, edge to edge and life-size, is a single folded instruction sheet printed TWICE, in register, on the same paper: the manufacturer's assembly text in process red, and — set line for line, word position for word position, at identical size and leading — a completely different second text in process cyan. Superimposed they are genuinely illegible, a solid muddy interference pattern of two alphabets sitting on each other. Lying loose on top of the sheet are two small squares of coloured acetate, a red gel and a cyan gel, which the visitor drags about with the cursor: the red gel kills the red printing and lets the cyan text read cleanly through it, the cyan gel does the reverse. Each gel is about the size of a beermat, so at no point can either text be read as a whole — you read one layer through a moving hole, and the two texts describe the same twelve steps of the same afternoon and can never once be seen together. Slide both gels over each other and that patch of paper goes flat black. The sheet is dragged up and down under the gels like paper under a hand. There is no header, no menu, no toggle, no reveal button, and no third state.">
  <meta name="outbox-spec-subject" content="The plain, entirely practical business of erecting a bolt-together aluminium greenhouse on a base that is not square — that everything in the kit is extruded to a thousandth and the concrete is out by an inch and a quarter, and that the whole afternoon is the argument between those two facts; that you assemble all four sides flat on the lawn before anything stands up, because a frame that is square lying down can be pulled square standing up and a frame bolted crooked flat can never be; that the corner bolts go in FINGER TIGHT and stay finger tight until the ridge is on, since the frame has to be allowed to shrug itself into shape and a fully tightened corner is a hinge you have welded shut; that you check square by measuring the two diagonals and not by looking, and that they must agree within about an eighth or every pane will bind; that glass is cut to a fixed size and does not negotiate, so a rebate three-sixteenths narrow at one corner means either the frame moves or the pane goes back in the crate; that the glazing goes bottom row first and each pane is held by clips that spring into the extrusion, and a clip fitted the wrong way round holds nothing and you will find out in the first gale; that the base rail must be bolted down to something before the roof goes on, because an empty aluminium frame with no glass in it has enormous sail area and almost no weight and will go over the fence; that the door runs on two wheels in a top track and the track is the last thing you can adjust, so the door is how you find out whether the whole building is out of true; and the flat arithmetic that 214 parts includes eleven you will not need, four you will be short of, and one bag of M6 bolts that is actually M5.">
  <meta name="outbox-spec-tone" content="TWO VOICES ON THE SAME PAPER, never audible at once. RED — the manufacturer's own copy, written by somebody in the Wexford sales office who has never carried a pane of glass: relentlessly encouraging, second person, faintly salesy, everything described as straightforward and rewarding, generous with phrases like 'you will find this a most satisfying stage' and 'two persons of average ability, one afternoon'; sincere, cheerful, and wrong about roughly a third of it, and it never once anticipates a difficulty. CYAN — Dot Halliwell, fifty-eight, and her sister Eunice, who are actually building the thing and are talking straight past each other while they do it: fast, blunt, practical, arguing about the diagonals, keeping a running count of bolts out loud, Eunice holding the ridge bar above her head for far longer than anybody promised, Dot going back into the house twice for a bigger spanner and once for tea, both of them in a perfectly good mood and both of them competitive about who spotted the base was out. Present tense, bright cold windy afternoon, neighbour's dog going, glass ringing against the fence when the wind gets under it. Never wistful, never a life-lesson, never a portrait of a marriage or a family, never charming-old-ladies comedy — two capable people putting up a greenhouse.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Cheap greyish instruction-sheet newsprint (#e8e4d8) with a slightly browner band down each of the two fold creases (#d9d3c2), printed in exactly two process inks — a hot process red (#e33127) and a cold process cyan (#00a2b3) — laid over each other in true register so their overlap composites subtractively into a muddy near-black (#2a2320) and reads as pure noise. The acetate gels are the same two inks in translucent sheet form, with a visibly thicker darker edge where the acetate is cut (#a8241c and #00757f) and a hairline of chromatic fringing along that edge. Flat, hard, no glow, no gradients, no gloss — two ink passes on cheap paper photographed straight down in bright outdoor daylight.">
  <meta name="outbox-spec-wildcard" content="Exactly one line on the sheet is identical in both inks — the red text and the cyan text say precisely the same words in precisely the same positions, so they overprint into a single clean legible sentence and it is the ONLY thing readable on the whole page without a gel: 'CHECK THE BASE IS SQUARE BEFORE YOU GO ANY FURTHER.' It reads black rather than red or cyan, it stays readable under either gel and under both gels together, neither voice ever refers to it, and it is in the same position — step three, fourth line — every visit.">
  <meta name="outbox-spec-forbidden" content="NO DIY-as-metaphor for marriage, sisterhood, patience, building-a-life, 'the instructions never match the thing' as a comment on anything, or the gap between the promise and the reality of adulthood — it is aluminium extrusion, a diagonal measurement, and an inch and a quarter of bad concrete, and it has nothing to teach anybody. NO nostalgia, NO wistfulness, NO 'you could get a proper greenhouse then / everything's plastic now / nobody builds anything themselves anymore' decline narrative — the glass is against the fence and the wind is getting up. NO camp or ironic affection for 1970s British domestic ephemera, no winking at the mail-order copy, no 'so square it's charming' — the Wexford copywriter is entirely sincere and Dot takes the sheet seriously enough to swear at it. NO cosy-northern-sisters comedy, no charming-old-ladies sketch, no catchphrases, no dialect spelling. NO gardening lyricism whatsoever: no tomatoes-in-August, no green-fingered dreaming, no light-through-glass, no growing-things-as-hope. NO cryptic-SCP or ominous dread about the illegible overprint or the one identical line, and NO liminal / uncanny / hidden-message / palimpsest / 'what's underneath the surface' framing of the two layers — it is two ink passes on one sheet of paper. NO sensuous material writing about glass, metal or ink beyond size, weight, tolerance and how it goes together. NO archival / museum / drawer / found-object / relic framing of the sheet — it came in the box this morning and is being followed right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is half two on a bright cold windy Saturday. NO signal / transmission / frequency framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

var cv=document.getElementById("sheet");
var ctx=cv.getContext("2d",{willReadFrequently:false});

var DPR=Math.min(window.devicePixelRatio||1,2);
var W=0,H=0;
var FS=14, LH=21, MARGIN=26;         // recalculated on resize
var SHEET_H=0;
var offY=0, vel=0;
var PAPER="#e8e4d8", CREASE="#d9d3c2";
var RED="#e33127", CYAN="#00a2b3", BLACK="#2a2320";

/* offscreen ink layers, full sheet height */
var redC=document.createElement("canvas"), redX=redC.getContext("2d");
var cyaC=document.createElement("canvas"), cyaX=cyaC.getContext("2d");
var IDENT_ROW=-1;
for(var k=0;k<L.length;k++){ if(L[k][0]===L[k][1] && L[k][0].length>10){ IDENT_ROW=k; break; } }

function fit(){
  W=stage.clientWidth; H=stage.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* type size so the longest line fits the width */
  var target = Math.min(W-18, 720);
  FS = Math.max(8.2, Math.min(15.5, target/29.5));
  LH = Math.round(FS*1.55*10)/10;
  MARGIN = Math.max(9, Math.round(W*0.035));
  SHEET_H = L.length*LH + LH*10;

  buildLayers();
  clampOff();
  placeGelsIfNeeded();
  draw();
}

function typeset(x2d,which,color,dx){
  var c = x2d.canvas;
  c.width=Math.round(W*DPR); c.height=Math.round(Math.min(SHEET_H,20000)*DPR);
  x2d.setTransform(DPR,0,0,DPR,0,0);
  x2d.clearRect(0,0,W,SHEET_H);
  x2d.font='500 '+FS+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  x2d.textBaseline="alphabetic";
  x2d.fillStyle=color;
  var top=LH*3.2;
  for(var i=0;i<L.length;i++){
    var s=L[i][which];
    if(!s) continue;
    if(i===IDENT_ROW) continue;         // the agreed line is drawn separately, in both
    x2d.fillText(s, MARGIN+dx, top+i*LH);
  }
  /* the one line both passes carry: drawn in each layer identically, dx included,
     so it composites to near-black and survives either gel. */
  if(IDENT_ROW>=0){
    x2d.fillText(L[IDENT_ROW][0], MARGIN+dx, top+IDENT_ROW*LH);
  }
}
function buildLayers(){
  typeset(redX,0,"#000",0);      // masks; colour applied at composite time
  typeset(cyaX,1,"#000",1.1);    // second pass, one mm right
}

/* ---------- gels ---------- */

];
var placed=false;
function gelSize(){ var s=Math.round(Math.min(W,H)*0.30); return Math.max(96,Math.min(178,s)); }
function makeGels(){
  GEL.forEach(function(g,i){
    var el=document.createElement("div");
    el.className="gel";
    el.setAttribute("aria-label", i===0?"red acetate":"cyan acetate");
    stage.appendChild(el);

      el.setPointerCapture(e.pointerId);
      g.drag=true; el.classList.add("g");
      g.ox=e.clientX-g.x; g.oy=e.clientY-g.y;
      g.lastX=e.clientX; g.lastY=e.clientY;
      stage.appendChild(el); // raise
      audio.start();
    });
    el.addEventListener("pointermove",function(e){
      if(!g.drag) return;
      var nx=e.clientX-g.ox, ny=e.clientY-g.oy;
      var dx=e.clientX-g.lastX, dy=e.clientY-g.lastY;
      g.spd=Math.min(1,Math.hypot(dx,dy)/14);
      g.lastX=e.clientX; g.lastY=e.clientY;
      var oldY=g.y;
      g.x=Math.max(-g.w*0.45,Math.min(W-g.w*0.55,nx));
      g.y=Math.max(-g.h*0.45,Math.min(H-g.h*0.55,ny));

      styleGel(g); draw();
    });
    function up(e){ if(!g.drag)return; g.drag=false; g.spd=0; el.classList.remove("g"); }
    el.addEventListener("pointerup",up);
    el.addEventListener("pointercancel",up);
  });

function placeGelsIfNeeded(){
  var s=gelSize();

    placed=true;
  }else{
    GEL.forEach(function(g){
      g.x=Math.max(-g.w*0.45,Math.min(W-g.w*0.55,g.x));
      g.y=Math.max(-g.h*0.45,Math.min(H-g.h*0.55,g.y));
    });
  }
  GEL.forEach(styleGel);
}
function styleGel(g){
  var e=g.el;
  e.style.left=g.x+"px"; e.style.top=g.y+"px";
  e.style.width=g.w+"px"; e.style.height=g.h+"px";
  var edge = g.ink==="red" ? "#a8241c" : "#00757f";
  var tint = g.ink==="red" ? "rgba(227,49,39,0.30)" : "rgba(0,162,179,0.30)";
  e.style.background=tint;
  e.style.border="2px solid "+edge;
  e.style.boxShadow="inset 0 0 0 1px rgba(255,255,255,.18), 0 0 0 1px "+
     (g.ink==="red"?"rgba(0,140,160,.45)":"rgba(210,60,50,.45)")+", 1px 1px 0 rgba(60,50,40,.18)";
}

/* ---------- fold creases ---------- */
function creaseXs(){ return [Math.round(W/3), Math.round(2*W/3)]; }
function checkCrease(g,oldY){
  var cs=creaseXs();
  var l=g.x, r=g.x+g.w, pl=g.el._pl, pr=g.el._pr;
  if(pl===undefined){ g.el._pl=l; g.el._pr=r; return; }
  for(var i=0;i<cs.length;i++){
    var c=cs[i];
    if((pl-c)*(l-c)<0 || (pr-c)*(r-c)<0){ audio.tick(); }
  }
  g.el._pl=l; g.el._pr=r;
}

/* ---------- sheet drag ---------- */
var sdrag=false, slast=0, sid=null;
stage.addEventListener("pointerdown",function(e){
  sdrag=true; sid=e.pointerId; slast=e.clientY; vel=0;
  stage.classList.add("dragging"); audio.start();
});
window.addEventListener("pointermove",function(e){
  if(!sdrag||e.pointerId!==sid) return;
  var d=e.clientY-slast; slast=e.clientY;
  offY+=d; vel=d;
  audio.rustle(Math.min(1,Math.abs(d)/22));
  clampOff(); draw();
});
window.addEventListener("pointerup",function(e){ if(e.pointerId===sid){sdrag=false;stage.classList.remove("dragging");} });
window.addEventListener("pointercancel",function(){ sdrag=false;stage.classList.remove("dragging"); });
window.addEventListener("wheel",function(e){ offY-=e.deltaY*0.75; vel=-e.deltaY*0.12; clampOff(); draw(); audio.rustle(Math.min(1,Math.abs(e.deltaY)/120)); },{passive:true});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowDown"){offY-=LH*3;clampOff();draw();e.preventDefault();}
  if(e.key==="ArrowUp"){offY+=LH*3;clampOff();draw();e.preventDefault();}
});
function clampOff(){
  var min=-(SHEET_H-H+LH*2); if(min>0)min=0;
  if(offY>LH*1.5)offY=LH*1.5;
  if(offY<min)offY=min;
}

/* momentum */
function loop(){
  if(!sdrag && Math.abs(vel)>0.25){
    offY+=vel; vel*=0.925; clampOff(); draw();
    audio.rustle(Math.min(0.5,Math.abs(vel)/40));
  }
  audio.frame();
  requestAnimationFrame(loop);
}

/* ---------- the composite ---------- */
var tmp=document.createElement("canvas"), tx=tmp.getContext("2d");
function draw(){
  /* paper */
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  var cs=creaseXs();
  ctx.fillStyle=CREASE;
  cs.forEach(function(c){ ctx.fillRect(c-7,0,14,H); });

  /* build the ink pass in an offscreen buffer, then knock out gel footprints */
  if(tmp.width!==cv.width||tmp.height!==cv.height){ tmp.width=cv.width; tmp.height=cv.height; }
  tx.setTransform(DPR,0,0,DPR,0,0);

  var gRed=GEL[0], gCya=GEL[1];

  /* --- CYAN pass (suppressed under the CYAN gel) --- */
  tx.setTransform(1,0,0,1,0,0); tx.clearRect(0,0,tmp.width,tmp.height);
  tx.setTransform(DPR,0,0,DPR,0,0);
  tx.drawImage(cyaC,0,offY*DPR,cyaC.width,cyaC.height,0,offY,W,cyaC.height/DPR);
  tx.globalCompositeOperation="destination-out";
  paintGelMask(tx,gCya);
  tx.globalCompositeOperation="source-in";
  tx.fillStyle=CYAN; tx.fillRect(0,0,W,H);
  tx.globalCompositeOperation="source-over";
  ctx.globalCompositeOperation="multiply";
  ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,W,H);

  /* --- RED pass (suppressed under the RED gel) --- */
  tx.setTransform(1,0,0,1,0,0); tx.clearRect(0,0,tmp.width,tmp.height);
  tx.setTransform(DPR,0,0,DPR,0,0);
  tx.drawImage(redC,0,offY*DPR,redC.width,redC.height,0,offY,W,redC.height/DPR);
  tx.globalCompositeOperation="destination-out";
  paintGelMask(tx,gRed);
  tx.globalCompositeOperation="source-in";
  tx.fillStyle=RED; tx.fillRect(0,0,W,H);
  tx.globalCompositeOperation="source-over";
  ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,W,H);
  ctx.globalCompositeOperation="source-over";

  /* the identical line composites to near-black on its own (red×cyan multiply),
     but nudge it truly black so it survives under both gels at once */
  drawAgreedLine();

  /* paper grain — a very light speckle, cheap newsprint */
  grain();
}

function paintGelMask(c2,g){
  /* full suppression in the core; a few-pixel band at the edge where it's partial */
  var band=Math.max(3,Math.round(Math.min(W,H)*0.010));
  var gx=g.x,gy=g.y,gw=g.w,gh=g.h;
  c2.save();
  c2.globalAlpha=1;
  c2.fillStyle="#000";
  c2.fillRect(gx+band,gy+band,Math.max(0,gw-band*2),Math.max(0,gh-band*2));
  /* partial ring */
  var steps=band;
  for(var i=0;i<steps;i++){
    var a=(i+1)/(steps+1);
    c2.globalAlpha=a*0.85;
    c2.fillRect(gx+i,gy+i,gw-i*2,1);
    c2.fillRect(gx+i,gy+gh-i-1,gw-i*2,1);
    c2.fillRect(gx+i,gy+i,1,gh-i*2);
    c2.fillRect(gx+gw-i-1,gy+i,1,gh-i*2);
  }
  c2.restore();
}

function drawAgreedLine(){
  if(IDENT_ROW<0) return;
  var y=LH*3.2+IDENT_ROW*LH+offY;
  if(y< -LH || y>H+LH) return;
  ctx.save();
  ctx.font='500 '+FS+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  ctx.textBaseline="alphabetic";
  ctx.fillStyle=BLACK;
  ctx.globalAlpha=0.94;
  ctx.fillText(L[IDENT_ROW][0],MARGIN,y);
  ctx.globalAlpha=0.5;
  ctx.fillText(L[IDENT_ROW][0],MARGIN+1.1,y);
  ctx.restore();
}

/* speckle */
var grainCv=null;
function makeGrain(){
  grainCv=document.createElement("canvas");
  grainCv.width=160; grainCv.height=160;
  var g=grainCv.getContext("2d");
  var id=g.createImageData(160,160);
  for(var i=0;i<160*160;i++){
    var v=Math.random();
    var p=i*4;
    if(v>0.965){ id.data[p]=90;id.data[p+1]=84;id.data[p+2]=70;id.data[p+3]=26; }
    else if(v<0.02){ id.data[p]=255;id.data[p+1]=255;id.data[p+2]=250;id.data[p+3]=22; }
    else { id.data[p+3]=0; }
  }
  g.putImageData(id,0,0);
}
function grain(){
  if(!grainCv) makeGrain();
  var p=ctx.createPattern(grainCv,"repeat");
  ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle=p; ctx.fillRect(0,0,W,H); ctx.restore();
}

/* ---------- Web Audio ---------- */
var audio=(function(){
  var AC=window.AudioContext||window.webkitAudioContext;
  var ac=null, started=false;
  var noiseBuf=null;
  var slSrc,slF,slG;     // acetate slither
  var ruSrc,ruF,ruG;     // paper rustle
  var wdSrc,wdF,wdG;     // wind bed
  var t0=0;
  function mkNoise(){
    var n=ac.sampleRate*2, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function chain(type,freq,q,gain){
    var s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q)f.Q.value=q;
    var g=ac.createGain(); g.gain.value=gain;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
    return {s:s,f:f,g:g};
  }
  function start(){
    if(started) return;
    try{
      ac=new AC(); noiseBuf=mkNoise();
      var a=chain("bandpass",5200,4.5,0); slSrc=a.s;slF=a.f;slG=a.g;
      var b=chain("bandpass",1500,1.1,0); ruSrc=b.s;ruF=b.f;ruG=b.g;
      var c=chain("lowpass",320,0.7,0.0); wdSrc=c.s;wdF=c.f;wdG=c.g;
      t0=ac.currentTime;
      started=true;
    }catch(e){ started=true; }
  }
  function slither(sp){
    if(!ac) return;
    var t=ac.currentTime;
    slG.gain.cancelScheduledValues(t);
    slG.gain.setTargetAtTime(0.030*sp,t,0.03);
    slF.frequency.setTargetAtTime(3200+5200*sp,t,0.05);
    slG.gain.setTargetAtTime(0,t+0.10,0.16);
  }
  function rustle(sp){
    if(!ac) return;
    var t=ac.currentTime;
    ruG.gain.cancelScheduledValues(t);
    ruG.gain.setTargetAtTime(0.052*sp,t,0.02);
    ruF.frequency.setTargetAtTime(900+2400*sp,t,0.04);
    ruG.gain.setTargetAtTime(0,t+0.09,0.13);
  }
  function tick(){
    if(!ac) return;
    var t=ac.currentTime;
    var o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
    o.type="square"; o.frequency.value=1700+Math.random()*500;
    f.type="highpass"; f.frequency.value=900;
    g.gain.setValueAtTime(0.045,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+0.035);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+0.05);
  }
  function frame(){
    if(!ac||!wdG) return;
    var mins=(ac.currentTime-t0)/60;
    var target=Math.min(0.055, 0.006+mins*0.016);
    wdG.gain.setTargetAtTime(target,ac.currentTime,2.0);
    wdF.frequency.setTargetAtTime(260+90*Math.sin(ac.currentTime*0.09),ac.currentTime,1.5);
  }
  return {start:start,slither:slither,rustle:rustle,tick:tick,frame:frame};
})();

/* ---------- go ---------- */
makeGels();
fit();
window.addEventListener("resize",function(){ fit(); });
loop();

setTimeout(function(){ var h=document.getElementById("hint"); if(h) h.style.opacity="0"; },7000);

/* pencil, back of the sheet, in Dot's hand:
   "209 out, 11 spare, 4 short, one bag M6 that's M5. Base 1¼ over 6ft.
    Door packed 3 washers far end. Mastic the ridge Monday." */
console.log("%cM6 bag: M5 all through. Sent it back? No — kept them, they'll do for the staging.","color:#00757f");
})();
