  <meta name="outbox-spec-era" content="Mid-January 1974, the third afternoon of a ground blizzard on a north–south county grid road in Emmons County, North Dakota. Nothing has fallen out of the sky since Tuesday: every grain moving across this section is old snow, already fallen once, already packed once, now being moved for the fourth or fifth time by a 26-knot northwesterly that has not dropped below 20 in fifty hours. Two hundred metres of 4-foot lath-and-wire fence stands on steel posts in the stubble, set back from the road grade at the distance somebody paced off in October. The overcast is total and shadowless, there is no horizon, and the drift behind the fence is at about seventy percent of the volume it will hold. Not a look-back at anything, not a lament, not a memory of hard winters: the fence is working right now, it is thirteen inches from being buried in two places, and once it is buried the drift starts walking toward the road.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one stretch of snow fence and the ground downwind of it, seen obliquely from standing height about thirty metres out in the stubble, so the fence runs from lower left to upper right across the frame and the drift lies out toward the viewer with its whole length readable. Wind comes across the frame left to right at a slight angle. There is no header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label and no readable character anywhere at any time — the only thing on the page is weather, ground, and a fence. It is a live aeolian transport engine: several hundred thousand snow grains are moved by a real turbulent boundary layer, they saltate and suspend and deposit according to actual shear stress at the surface, and the drift shape behind the fence is not drawn, sculpted, keyframed or eased — it is whatever the deposition arithmetic has built since the visitor's first visit and it only ever gets bigger. The visitor's entire vocabulary is three things a person could do to a fence with cold hands: DRAG horizontally to walk along the fence line, which is real parallax across two hundred metres of fence with genuinely different porosity, different drift, and different burial depth section by section; CLICK any single lath to pull it out (or push a loose one back in), which permanently changes the porosity of that panel and therefore permanently changes the shape, length and height of the drift downwind of it; and DRAG the wire panel vertically on its posts to raise or lower the bottom gap, which is the single most consequential thing on the page and is never explained. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat mechanics of a snow fence, and specifically that a snow fence does not stop snow and never has — it slows the air, and the air puts down what it can no longer carry, which means the entire device is a deposition problem and not a barrier problem. That mass transport goes roughly as the CUBE of wind speed above the threshold, so a 30-knot wind moves not fifty percent more snow than a 20-knot wind but something over three times as much, and one bad thirty-six-hour blow puts down more than a whole quiet January. That there are two transport modes and they behave completely differently: SALTATION, grains bouncing in a shallow moving carpet within the first ten or fifteen centimetres of the surface, which is where most of the mass actually is; and SUSPENSION, the fine stuff carried up into the air column, which is what makes a whiteout and which is mostly LOST — sublimating in transit, so a long fetch delivers measurably less snow to the fence than a short one because the air ate it on the way. That the threshold friction velocity is a property of the SNOW and not the wind: fresh dry snow starts moving in a breeze, and the same snow eight hours later, wind-packed and slightly sintered, will not move at twice that speed, which is exactly why a ground blizzard runs out of material without anything falling and then finds more when the surface is broken. That POROSITY IS THE WHOLE DESIGN and the answer is counterintuitive — a fence about half open holds far more snow than a solid one, because a solid fence throws a violent lee eddy that scours a pit immediately behind it and drops a short steep drift close in, while a porous fence bleeds enough air through to kill the eddy, so the wake reattaches five or six fence heights downwind and the drift lies out long, shallow and enormous. That an ideally porous fence stores something like six to eight times its own height squared in snow per metre of length, and a solid one stores a fraction of that. That the BOTTOM GAP is the difference between a fence that works for a season and a fence that buries itself in a week: leave roughly a tenth to a seventh of the fence height clear at the ground and the accelerated jet under the panel scours the snow away from the fence's own feet and pushes the whole drift downwind where it belongs; set the panel on the ground and deposition begins at the fence, climbs the fence, and the fence is out of service and cannot be recovered until spring. That SET-BACK is the arithmetic everybody gets wrong: the drift will run out roughly thirty-five times the fence height, so a four-foot fence needs something like forty-five metres of clear ground before the road shoulder, and a fence set close to the road is not a partly-effective fence, it is a machine for putting a drift on the pavement. That deposited drift snow is not the snow that fell — it arrives already broken into rounded grains and packs to two or three times the density of new snowfall, then sinters harder every hour, which is why a two-day-old drift takes a wing plough and a one-hour-old drift takes a broom. That the drift reaches EQUILIBRIUM: once its profile matches the flow, the fence stops capturing and everything arriving simply goes over the top and lands on the road, so a fence at capacity is functionally not there. That scour and deposition are the same process with the sign flipped, so the same wind that is building a five-foot cornice at forty metres is cutting a hollow at two. That the fence itself is the least interesting object on the page — laths, wire, steel posts, four dollars a running foot, and the whole of its behaviour is set by how much air goes through it and how much goes under.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wind, the grains and the flat light, and that register is LOUD, DRY, ABRASIVE, GRANULAR and BUSY — a shallow carpet of snow moving fast and continuously across the whole floor of the frame at all times, in visible streamers that braid and split around every obstruction; grain hitting lath hard enough to be a rattle and not a whisper; the fence panel working measurably against its staples; the whole picture in flat total overcast so there is no shadow anywhere, no horizon anywhere, no modelling except what the drift's own curvature does to multiply-scattered light. The air is not empty and never quiet. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the drift goes on building whether or not anybody touches a lath. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT a screensaver, NOT stately, NOT reverent, NOT bleak, NOT ominous, NOT lonely — this is a working fence in a stubble field on a Thursday with a truck due through and the wind holding steady.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. Snow is NOT white here and its value is COMPUTED, never chosen: the sky is a total overcast dome of near-uniform luminance, so every point on the ground is lit almost entirely by multiply-scattered light and its rendered value falls out of local surface curvature and sky-view factor alone — a convex drift crest sees nearly the whole dome and comes out a hard bright grey-white (#eef2f4), a concave scour hollow sees much less of it and goes a genuine deep blue-grey (#b9c8d4), and the tightest lee pockets and the cornice undercut go further still (#8fa3b4). Because the sky and the far ground converge on the same value (#d9dde0) there is no horizon line rendered anywhere and the top third of the frame and the far fifth of the field are honestly the same tone, which is not a stylistic wash but an arithmetic consequence, and it means the drift's far end genuinely dissolves. Suspended snow in the air column reduces contrast over distance by a real extinction term, so the far posts are measurably softer than the near ones and get softer when the wind gusts. The saltation carpet is rendered as actual grains at true relative scale, each catching the dome as a small flat highlight, so the moving layer reads as a bright granular haze lying along the ground rather than as a filter over the image. Against all of that, the fence is the only warm thing on the page: lath weathered oxide red where the paint has held (#8c3a26), sandblasted to a chalky pink-grey on the windward faces where four winters of saltating grain have taken the paint off at exactly saltation height and nowhere else (#b58f80), and bare grey split lath where a slat has lost it entirely (#9a9086), with steel T-posts and their punched studs in a dull cold grey (#55564f) and rusted twist-wire at every tie (#6b4a35). Stubble showing through the scour zone is bleached wheat straw (#c8bda0), and it is the only thing in frame that is not snow, steel or wood. Exactly one chip of highway-orange delineator (#ff5a1f) is held strictly for the three plastic reflector tabs wired to the fence at hundred-foot intervals and for the strip of orange baling twine on the round bale downwind — it appears nowhere else on the page, never on snow, never on lath, never on steel. Flat, hard, high contrast at the near end and honestly extinguished at the far end; no glow, no bloom, no lens flare, no soft focus, no vignette, no blue-hour tinting, no gradients other than honest sky-view shading, honest atmospheric extinction and honest grain highlight.">
  <meta name="outbox-spec-wildcard" content="There is a single round hay bale sitting out in the stubble about forty metres downwind of the fence, dropped off a truck at some point and never picked up, still with a strip of orange twine round it. The engine treats it exactly as it treats the fence: a real solid obstruction in the flow solve, zero porosity, no bottom gap, so it builds its own honest miniature drift — a scour crescent immediately behind it and a long tapering comet tail running downwind, which is a completely different shape from anything the porous fence produces and sits in the same frame for comparison that nobody makes. It is already about a third buried at load. It cannot be moved, cannot be clicked, cannot be affected in any way, and nothing on the page accounts for it. Same bale, same twine, same place, every visit — and it gets deeper every visit and never comes out.">
  <meta name="outbox-spec-forbidden" content="NO snow-as-metaphor for anything — not blankness, not erasure, not forgetting, not purity, not what covers over, not what accumulates, not 'it buries everything eventually'; this is deposited mass at 350 kilos the cubic metre with a threshold friction velocity, and it has nothing to teach anybody. ABSOLUTELY NO winter lyricism: no describing snow as soft, hushed, gentle, feathered, sugar, lace, ash or falling like anything; no crystal reverie; no 'no two alike'; no white-as-silence, because nothing here is silent and nothing here is falling. NO whiteout as void, abyss, dissolution, the sublime, or nature's indifference; the horizon is missing because sky luminance and ground luminance converge, and that is the entire content of it. NO cozy: no woodstove, no coffee thermos, no snowed-in warmth, no waiting-out-the-storm, no somebody-inside-a-house. NO survival or danger-porn: no getting lost twenty feet from the door, no frozen bodies, no cautionary tale, no dread, no foreshadowed accident, no 'the road is closed and nobody knows'; a truck goes through and keeps going. NO prairie Americana whatsoever: no big sky, no amber waves, no Little House, no homesteader hardship, no Willa Cather, no Fargo, no woodchipper joke, no upper-midwest accent comedy, no aren't-they-hardy condescension, no farm-crisis pathos, no explaining North Dakota to anybody, and NO settler-and-Native history imported as atmosphere or subtext. NO 1974-as-period-signifier, NO oil-crisis drift, NO Watergate, NO 70s retro-kitsch, NO camp affection for the fence, the T-posts or the reflector tabs. NO nostalgia, NO wistfulness, NO 'nobody puts up lath fence anymore / it's all plastic mesh now / the county crews are gone' decline narrative — the fence went up in October and it is working this minute. NO craftsman-sage register, NO 'the old road men knew where to set them', NO folk-wisdom, NO trade mystique, NO master-and-apprentice arc, NO wise-absent-figure who paced it off. NO climate sermon and NO ecological elegy. NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery, chillout or screensaver framing, and no 'let it settle you'; the piece is loud, granular and abrasive from the first frame. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the bale, the missing horizon, the buried sections or the drift that never melts — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object in frame. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a flat grey afternoon. NO signal / transmission / frequency / broadcast framing of the wire's tone or the wind, despite both having a pitch. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the snow, the ground, the fence and the bale, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
/* Emmons Co. section 14, west line. Panel set Oct 9. Paced off at thirty, should
   have been thirty-five. Nothing in here melts. Nothing in here falls. Every grain
   on this page was already on the ground when you got here.
   (Sandlin Bros. Frozen, window two, is closed for the season and the scale still
   reads two grams heavy if you lean on it.) */
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------------------------------------------------------------
   WORLD MODEL
   x  : metres along the fence line, 0..200
   y  : metres downwind of the fence, negative = upwind
   Fence height Hf = 1.22 m (4 ft). Lath panels every 1.0 m.
   --------------------------------------------------------------- */
var HF=1.22;
var NX=200;              // 1 m cells along fence
var NY=64;               // downwind cells, 1.1 m each -> ~70 m, past 35*Hf
var DY=1.1;
var YOFF=8;              // cells upwind included
var NPANEL=NX;           // one panel per metre
var LATHS=6;             // laths per panel

/* --------- persistent state --------- */
var KEY='emmons.sec14.westline.v3';
var S=null;
function fresh(){
  var s={ h:new Float32Array(NX*NY), rho:new Float32Array(NX*NY), age:new Float32Array(NX*NY),
          lath:new Uint8Array(NPANEL*LATHS), gap:new Float32Array(NPANEL),
          hours:0, camx:96 };
  var i,j,k;
  for(i=0;i<NPANEL;i++){
    // October build: mostly full, a few laths already gone to the wind
    for(k=0;k<LATHS;k++){
      var miss=(hash(i*13+k*7)<0.055)?0:1;
      s.lath[i*LATHS+k]=miss;
    }
    s.gap[i]=0.14; // 14 cm, near enough a ninth of height
  }
  // pre-existing drift: three days of blow already in the bank
  for(i=0;i<NX;i++){
    var por=panelPorosity(s,i);
    for(j=0;j<NY;j++){
      var yy=(j-YOFF)*DY;
      var d=0;
      if(yy>0){
        var peak=4.5+8*por;
        var t=yy/ (28*HF);
        d=Math.exp(-Math.pow((yy-peak)/(9+16*por),2)/2)*(0.42+0.30*por)*(1-t*0.35);
        if(d<0)d=0;
      } else if(yy>-6){
        d=-0.06*Math.exp(-Math.pow((yy+2.2)/2.6,2));   // upwind scour
      }
      d+= (hash(i*31+j*17)-0.5)*0.03;
      var idx=j*NX+i;
      s.h[idx]=d;
      s.rho[idx]=290+90*hash(i*5+j*3);
      s.age[idx]=6+30*hash(i*3+j*11);
    }
  }
  // two sections thirteen inches from burial
  var b1=54,b2=137;
  for(var q=-4;q<=4;q++){
    for(var bb=0;bb<2;bb++){
      var cx=(bb?b2:b1)+q; if(cx<0||cx>=NX)continue;
      var f=Math.exp(-q*q/14);
      for(j=0;j<NY;j++){
        var yy2=(j-YOFF)*DY;
        if(yy2>-2.5&&yy2<9){
          var idx2=j*NX+cx;
          s.h[idx2]=Math.max(s.h[idx2], (HF-0.33)*f*Math.exp(-Math.pow((yy2-2.0)/4.4,2)/2));
          s.age[idx2]=40;s.rho[idx2]=370;
        }
      }
    }
  }
  return s;
}
function hash(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function panelPorosity(s,i){
  var open=0;
  for(var k=0;k<LATHS;k++) if(!s.lath[i*LATHS+k]) open++;
  // laths cover ~58% when all present; gaps between are structural
  var solid=(LATHS-open)/LATHS;
  return 1-solid*0.86;   // open fraction 0.14 .. 1
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return fresh();
    var o=JSON.parse(raw);
    if(!o||!o.h||o.h.length!==NX*NY)return fresh();
    var s={h:Float32Array.from(o.h),rho:Float32Array.from(o.rho),age:Float32Array.from(o.age),
           lath:Uint8Array.from(o.lath),gap:Float32Array.from(o.gap),hours:o.hours||0,camx:o.camx||96};
    return s;
  }catch(e){return fresh();}
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      h:Array.prototype.slice.call(S.h).map(function(v){return Math.round(v*1000)/1000;}),
      rho:Array.prototype.slice.call(S.rho).map(function(v){return Math.round(v);}),
      age:Array.prototype.slice.call(S.age).map(function(v){return Math.round(v*10)/10;}),
      lath:Array.prototype.slice.call(S.lath),
      gap:Array.prototype.slice.call(S.gap).map(function(v){return Math.round(v*1000)/1000;}),
      hours:S.hours,camx:S.camx}));
  }catch(e){}
}
S=load();

/* ---------------------------------------------------------------
   WIND FIELD
   Log profile u(z) = (u*/k) ln(z/z0). Gusts on their own clock.
   Fence is a porous obstruction with pressure-loss coefficient
   derived from open fraction. Bleed / under-jet / lee eddy fall out.
   --------------------------------------------------------------- */
var KARMAN=0.4;
var Z0=0.0006;           // wind-packed drift snow
var Uref=13.4;           // m/s at 10 m -> 26 kt
var wind={u10:Uref, dir:0, ustar:0, gust:0};
var gustPhase=[0,0,0,0],gustRate=[0.083,0.031,0.171,0.0117],gustAmp=[0.62,0.44,0.28,0.9];
var meanDirDrift=0;

function stepWind(dt,t){
  var g=0;
  for(var i=0;i<4;i++){
    gustPhase[i]+=dt*gustRate[i]*(1+0.3*Math.sin(t*0.013+i));
    g+=gustAmp[i]*Math.sin(gustPhase[i]*6.283)*Math.sin(gustPhase[i]*2.11+i);
  }
  g+= 0.5*(Math.sin(t*0.47)*Math.sin(t*0.19)+Math.sin(t*1.13)*0.4);
  wind.gust=g;
  wind.u10=Uref+g*1.9;
  if(wind.u10<10.3)wind.u10=10.3;      // has not dropped below 20 kt in fifty hours
  meanDirDrift+=dt*0.00018;
  wind.dir=0.10+0.20*Math.sin(meanDirDrift)+0.012*Math.sin(t*0.07);
  wind.ustar=wind.u10*KARMAN/Math.log(10/Z0);
}

/* per-column shear field, solved against the fence + ground */
var shear=new Float32Array(NX*NY);
var uzTop=new Float32Array(NX*NY);
function solveFlow(){
  var i,j;
  for(i=0;i<NX;i++){
    var por=panelPorosity(S,i);
    var gap=S.gap[i];
    // burial: local drift height at the fence line
    var fi=YOFF*NX+i;
    var buried=S.h[fi];
    var effH=HF+gap-buried;              // exposed panel height
    if(effH<0.05){ effH=0; }
    // pressure loss coefficient for a porous screen, k = ((1-b)/b^2)-ish
    var b=Math.max(0.06,Math.min(0.98,por));
    var kloss=(1-b*b)/(b*b);
    // fraction of momentum removed at the panel
    var block=effH>0 ? (kloss/(kloss+2.2)) * Math.min(1,effH/HF) : 0;
    // under-jet strength: accelerated flow through the bottom gap
    var jet = effH>0 ? Math.min(1.6, gap/(0.11*HF)) * (1-b*0.45) : 0;
    // reattachment distance: solid -> 3H, ideal porous -> 6H+
    var reatt=(2.6+6.4*b)*HF;
    var lenScale=(9+30*b)*HF;

    for(j=0;j<NY;j++){
      var y=(j-YOFF)*DY;
      var idx=j*NX+i;
      var f=1;
      if(effH<=0){
        f=1.0;                              // section out of service
      } else if(y< -0.5){
        // upwind stagnation, then acceleration around
        f=1-0.36*block*Math.exp(-Math.pow((y+0.9)/2.4,2));
      } else {
        var dec=Math.exp(-Math.pow(y/lenScale,1.35));
        f=1-block*dec*0.95;
        // under-jet scour right at the feet
        var jf=jet*Math.exp(-Math.pow((y-0.55*HF)/(1.05*HF),2));
        f+=jf*0.62;
        // solid sections: violent lee eddy -> reversed, scoured pit close in
        if(b<0.42){
          var eddy=(0.42-b)/0.42;
          var pit=Math.exp(-Math.pow((y-0.9*HF)/(1.1*HF),2));
          f+=eddy*pit*0.55;
          var quiet=Math.exp(-Math.pow((y-reatt*0.95)/(1.5*HF),2));
          f-=eddy*quiet*0.30;
        }
        // recovery far downwind
        f=f+(1-f)*Math.min(1,Math.max(0,(y-reatt)/(reatt*3.4)));
      }
      // surface slope effect: crests speed up, hollows slow down
      var hj=S.h[idx], hjm=S.h[(j>0?j-1:0)*NX+i];
      var slope=(hj-hjm)/DY;
      f*= (1+Math.max(-0.35,Math.min(0.45,slope*1.3)));
      // the bale: solid, no porosity, no bottom gap
      var bx=BALE.x-CAM0, byc=BALE.y;
      var dxm=(i-BALE.x), dym=(y-BALE.y);
      if(Math.abs(dxm)<3.4 && dym>-2.2 && dym<26){
        var rad=Math.exp(-(dxm*dxm)/3.4);
        if(dym<1.6 && dym>-2.2){ f*=1-0.72*rad*Math.exp(-Math.pow(dym/1.6,2)); }
        else { f*=1-0.55*rad*Math.exp(-Math.pow((dym-4.5)/8.5,2)); }
        if(Math.abs(dxm)>1.6&&Math.abs(dxm)<3.4&&dym>-1&&dym<3){ f*=1.18; } // crescent scour horns
      }
      if(f<0.05)f=0.05;
      var us=wind.ustar*f;
      shear[idx]=us;
      uzTop[idx]=f;
    }
  }
}

/* bale, fixed, forty metres downwind, thirty percent buried at load */
var CAM0=0;
var BALE={x:112, y:39.5, r:0.78, sink:0.33};

/* ---------------------------------------------------------------
   TRANSPORT: threshold based, cubic in excess shear.
   Saltation carpet + suspension with sublimation loss.
   --------------------------------------------------------------- */
var susp=new Float32Array(NX*NY);
function threshold(idx){
  // property of the snow, not the wind: density + sintering age
  var rho=S.rho[idx], age=S.age[idx];
  var ut=0.14 + 0.00035*(rho-250) + 0.052*Math.log(1+age*0.55);
  if(ut<0.15)ut=0.15;
  return ut;
}
var totalSaltFlux=0, lathStrikes=0, hissLevel=0;
function transport(dt){
  var i,j,idx;
  totalSaltFlux=0;lathStrikes=0;
  var subl=0.00042;   // sublimation loss per metre of fetch, suspension
  for(i=0;i<NX;i++){
    var q=0.10; // upwind supply, saltation carpet arriving from the section west
    var sq=0.03;
    for(j=0;j<NY;j++){
      idx=j*NX+i;
      var us=shear[idx];
      var ut=threshold(idx);
      var cap=0;
      if(us>ut){
        // mass flux ~ integral of excess -> cubic
        var ex=us-ut;
        cap=2.9*(ex*ex*ex + 0.9*ut*ex*ex);
      }
      var d=cap-q;
      var rate=d>0 ? 0.30 : 0.40;    // erosion slower than deposition
      var dq=d*rate;
      q+=dq;
      if(q<0)q=0;
      var dh=-dq*dt*0.55/(S.rho[idx]/350);
      // avalanche-safe direct application
      S.h[idx]+=dh;
      if(dh>0){
        // fresh deposit: drift snow, already broken, packs 2-3x new snowfall
        var newrho=330+40*hash(i+j*7);
        var w=Math.min(0.9,dh*40);
        S.rho[idx]=S.rho[idx]*(1-w)+newrho*w;
        S.age[idx]*= (1-w*0.85);
      }
      // suspension: fine stuff lifted, settles, and is eaten in transit
      var lift=Math.max(0,us-ut)*0.34;
      sq+=lift*dt - sq*(0.10+subl*DY*90)*dt*60;
      if(sq<0)sq=0;
      susp[idx]=susp[idx]*0.86+sq*0.14;
      totalSaltFlux+=q;
      if(j===YOFF) {
        // grains striking lath on this panel
        var por=panelPorosity(S,i);
        var exposed=Math.max(0,HF+S.gap[i]-S.h[idx]);
        lathStrikes+=q*(1-por)*Math.min(1,exposed/HF);
      }
    }
  }
  // sintering: everything hardens with the hours
  var ag=dt*0.00046;
  for(idx=0;idx<NX*NY;idx++){
    S.age[idx]+=ag*3600;
    if(S.rho[idx]<430) S.rho[idx]+=ag*260;
  }
  hissLevel=totalSaltFlux/(NX*NY);
}

/* angle of repose relaxation — crests break and slump */
function avalanche(){
  var rep=Math.tan(0.60); // ~34 deg
  for(var pass=0;pass<2;pass++){
    for(var j=1;j<NY-1;j++){
      for(var i=0;i<NX;i++){
        var idx=j*NX+i;
        var a=S.h[idx], b=S.h[(j+1)*NX+i];
        var d=a-b;
        var lim=rep*DY;
        if(d>lim){var m=(d-lim)*0.30;S.h[idx]-=m;S.h[(j+1)*NX+i]+=m;}
        else if(d<-lim){var m2=(-d-lim)*0.30;S.h[idx]+=m2;S.h[(j+1)*NX+i]-=m2;}
        if(i<NX-1){
          var c=S.h[j*NX+i+1],dx=a-c,limx=rep*1.0;
          if(dx>limx){var m3=(dx-limx)*0.22;S.h[idx]-=m3;S.h[j*NX+i+1]+=m3;}
        }
      }
    }
  }
}

/* ---------------------------------------------------------------
   CAMERA / PROJECTION
   Standing height, 30 m out in the stubble. Fence runs lower-left
   to upper-right. Oblique.
   --------------------------------------------------------------- */
var cam={x:S.camx, eye:1.65, dist:30};
function proj(wx,wy,wz){
  // wx metres along fence relative to camera centre, wy metres downwind (toward viewer = +),
  // wz height above nominal ground
  var lx=wx-cam.x;
  var depth=cam.dist-wy;             // distance from viewer along view axis
  if(depth<1.2)depth=1.2;
  var f=Math.min(W,H)*0.95;
  var scale=f/depth;
  // fence tilted across frame: add a slope term in x
  var sx=W*0.5 + lx*scale*0.86 + (depth-cam.dist)*0.0;
  var sy=H*0.62 + (cam.eye-wz)*scale - lx*scale*0.30;
  return [sx,sy,scale,depth];
}
/* extinction: suspended snow reduces contrast over distance */
function ext(depth,extra){
  var k=0.0135+0.0090*Math.max(0,(wind.u10-11)/6)+ (extra||0);
  return Math.exp(-k*Math.max(0,depth-3));
}
var SKY=[0xd9,0xdd,0xe0];
function mixSky(r,g,b,t){
  return 'rgb('+Math.round(r*t+SKY[0]*(1-t))+','+Math.round(g*t+SKY[1]*(1-t))+','+Math.round(b*t+SKY[2]*(1-t))+')';
}

/* sky-view factor shading: value falls out of curvature, not choice */
function surfShade(i,j){
  var idx=j*NX+i;
  var h=S.h[idx];
  var hu=S.h[Math.max(0,j-1)*NX+i], hd=S.h[Math.min(NY-1,j+1)*NX+i];
  var hl=S.h[j*NX+Math.max(0,i-1)], hr=S.h[j*NX+Math.min(NX-1,i+1)];
  var curv=((hu+hd+hl+hr)*0.25-h);     // + = concave (hollow), - = convex (crest)
  var slope=(hd-hu)/(2*DY);
  // sky view factor: concave sees less dome
  var svf=1-Math.max(0,curv)*5.2 + Math.max(0,-curv)*2.4;
  svf-=Math.abs(slope)*0.13;
  // near-fence and near-bale lee pockets occlude further
  var yy=(j-YOFF)*DY;
  if(yy>-0.3&&yy<1.5){ svf-=0.16*Math.max(0,(HF-S.h[idx])/HF); }
  svf=Math.max(0.30,Math.min(1.12,svf));
  return svf;
}
function svfColor(svf){
  // #8fa3b4 (0.30) .. #b9c8d4 (0.62) .. #eef2f4 (1.06)
  var r,g,b,t;
  if(svf<0.62){ t=(svf-0.30)/0.32; r=0x8f+(0xb9-0x8f)*t; g=0xa3+(0xc8-0xa3)*t; b=0xb4+(0xd4-0xb4)*t; }
  else { t=Math.min(1,(svf-0.62)/0.44); r=0xb9+(0xee-0xb9)*t; g=0xc8+(0xf2-0xc8)*t; b=0xd4+(0xf4-0xd4)*t; }
  return [r,g,b];
}

/* ---------------------------------------------------------------
   GRAINS — real saltation particles, drawn at true relative scale
   --------------------------------------------------------------- */
var NG=2600;
var G=new Float32Array(NG*6);   // x, y, z, vz, life, size
function initGrains(){
  for(var i=0;i<NG;i++){
    G[i*6]=cam.x-40+Math.random()*90;
    G[i*6+1]=-8+Math.random()*72;
    G[i*6+2]=Math.random()*0.16;
    G[i*6+3]=0;
    G[i*6+4]=Math.random();
    G[i*6+5]=0.5+Math.random()*1.7;
  }
}
initGrains();
var NSUS=900;
var SU=new Float32Array(NSUS*4);
for(var q=0;q<NSUS;q++){SU[q*4]=cam.x-50+Math.random()*110;SU[q*4+1]=-10+Math.random()*80;SU[q*4+2]=0.2+Math.random()*3.2;SU[q*4+3]=Math.random();}

function groundAt(wx,wy){
  var i=Math.round(wx), j=Math.round(wy/DY)+YOFF;
  if(i<0)i=0;if(i>=NX)i=NX-1;
  if(j<0)j=0;if(j>=NY)j=NY-1;
  return S.h[j*NX+i];
}
function shearAt(wx,wy){
  var i=Math.round(wx), j=Math.round(wy/DY)+YOFF;
  if(i<0)i=0;if(i>=NX)i=NX-1;if(j<0)j=0;if(j>=NY)j=NY-1;
  return shear[j*NX+i];
}
function stepGrains(dt){
  var d=wind.dir;
  for(var i=0;i<NG;i++){
    var o=i*6;
    var us=shearAt(G[o],G[o+1]);
    var uz=(us/KARMAN)*Math.log(Math.max(G[o+2],0.0008)/Z0);
    if(uz<0)uz=0;
    var spd=uz*0.55;
    G[o]+=spd*dt*Math.cos(d);
    G[o+1]+=spd*dt*Math.sin(d)*1.0;
    G[o+3]-=9.8*dt*0.55;
    G[o+2]+=G[o+3]*dt;
    var gh=groundAt(G[o],G[o+1]);
    if(G[o+2]<=0.004){
      G[o+2]=0.004;
      // rebound: splash, energy from the shear
      G[o+3]=us*(0.9+Math.random()*2.6);
      if(us<0.16&&Math.random()<0.3){ G[o+3]=0; }
    }
    if(G[o+2]>0.22){G[o+3]-=2.0*dt;}
    // recycle
    if(G[o]>cam.x+52||G[o+1]>72||G[o+1]<-12){
      G[o]=cam.x-46-Math.random()*8;
      G[o+1]=-9+Math.random()*80;
      G[o+2]=Math.random()*0.10;G[o+3]=0;
    }
    if(G[o]<cam.x-52){G[o]=cam.x+50;}
  }
  for(var k=0;k<NSUS;k++){
    var p=k*4;
    var us2=wind.ustar*1.05;
    var uz2=(us2/KARMAN)*Math.log(Math.max(SU[p+2],0.02)/Z0);
    SU[p]+=uz2*dt*0.62*Math.cos(d);
    SU[p+1]+=uz2*dt*0.62*Math.sin(d);
    SU[p+2]+=(-0.10+Math.sin(SU[p]*0.7+SU[p+1]*0.3)*0.32)*dt;   // settling vs. eddy lift
    SU[p+3]-=dt*0.028;   // sublimation: it is being eaten on the way
    if(SU[p+3]<=0||SU[p+2]<0.05||SU[p]>cam.x+58||SU[p+1]>82){
      SU[p]=cam.x-50-Math.random()*12;SU[p+1]=-12+Math.random()*88;
      SU[p+2]=0.25+Math.random()*3.4;SU[p+3]=0.5+Math.random()*0.5;
    }
  }
}

/* ---------------------------------------------------------------
   RENDER
   --------------------------------------------------------------- */
var stripCache=null;
function render(){
  // sky and far ground converge; no horizon is drawn because none exists
  ctx.fillStyle='rgb(217,221,224)';
  ctx.fillRect(0,0,W,H);

  var i,j;
  var i0=Math.max(0,Math.floor(cam.x-46)), i1=Math.min(NX-1,Math.ceil(cam.x+46));

  // ground: draw far to near
  for(j=NY-1;j>=0;j--){
    var y0=(j-YOFF)*DY, y1=y0+DY;
    for(i=i0;i<i1;i++){
      var svf=surfShade(i,j);
      var c=svfColor(svf);
      var idx=j*NX+i;
      var h0=S.h[idx];
      var pA=proj(i,y0,h0), pB=proj(i+1,y0,S.h[j*NX+Math.min(NX-1,i+1)]);
      var jn=Math.max(0,j-1);
      var pC=proj(i+1,y1,S.h[jn*NX+Math.min(NX-1,i+1)]), pD=proj(i,y1,S.h[jn*NX+i]);
      if(pA[3]<1.4)continue;
      var t=ext(pA[3]);
      // stubble showing through scour where the drift is thin or negative
      var strawMix=0;
      if(h0<0.035){ strawMix=Math.min(1,(0.035-h0)/0.10); }
      var r=c[0],g=c[1],b=c[2];
      if(strawMix>0){
        r=r*(1-strawMix*0.62)+0xc8*strawMix*0.62;
        g=g*(1-strawMix*0.62)+0xbd*strawMix*0.62;
        b=b*(1-strawMix*0.62)+0xa0*strawMix*0.62;
      }
      ctx.fillStyle=mixSky(r,g,b,t);
      ctx.beginPath();
      ctx.moveTo(pA[0],pA[1]);ctx.lineTo(pB[0],pB[1]);ctx.lineTo(pC[0],pC[1]);ctx.lineTo(pD[0],pD[1]);
      ctx.closePath();ctx.fill();
    }
  }

  // stubble stalks in the scour zone
  ctx.strokeStyle='rgba(200,189,160,0.55)';ctx.lineWidth=0.8;
  for(var s=0;s<420;s++){
    var sx=cam.x-40+((s*7.31)%80), sy=-6+((s*11.7)%40);
    var gh=groundAt(sx,sy);
    if(gh>0.055)continue;
    var p=proj(sx,sy,gh);
    if(p[3]<2||p[0]<-10||p[0]>W+10)continue;
    var t2=ext(p[3]);
    if(t2<0.12)continue;
    ctx.strokeStyle='rgba(200,189,160,'+(0.62*t2)+')';
    ctx.beginPath();ctx.moveTo(p[0],p[1]);
    ctx.lineTo(p[0]+p[2]*0.028*(1+hash(s)), p[1]-p[2]*(0.055+0.05*hash(s*3)));
    ctx.stroke();
  }

  // the bale, forty metres downwind, third buried, never picked up
  drawBale();

  // the fence
  drawFence(i0,i1);

  // saltation carpet — actual grains, true relative scale
  for(i=0;i<NG;i++){
    var o=i*6;
    var gh2=groundAt(G[o],G[o+1]);
    var p=proj(G[o],G[o+1],gh2+G[o+2]);
    if(p[3]<1.5)continue;
    var sz=p[2]*0.0021*G[o+5];
    if(sz<0.45)sz=0.45;
    if(sz>5.5)sz=5.5;
    var t3=ext(p[3],0.004);
    var lum=0.55+0.45*(1-Math.min(1,G[o+2]/0.20));
    ctx.fillStyle='rgba(244,247,249,'+(0.78*t3*lum)+')';
    ctx.fillRect(p[0]-sz*0.5,p[1]-sz*0.5,sz,sz*0.82);
  }
  // streamers: the carpet braids and splits around every obstruction
  ctx.globalAlpha=0.30;
  for(var st=0;st<70;st++){
    var bx=cam.x-40+((st*17.3+timeAcc*2.2)%82);
    var by=-8+((st*23.7)%76);
    var gh3=groundAt(bx,by);
    var p1=proj(bx,by,gh3+0.02);
    var p2=proj(bx+2.6*Math.cos(wind.dir),by+2.6*Math.sin(wind.dir),groundAt(bx+2.6,by+0.6)+0.03);
    if(p1[3]<2)continue;
    var tt=ext(p1[3],0.004);
    ctx.strokeStyle='rgba(238,242,244,'+(0.5*tt)+')';
    ctx.lineWidth=Math.max(0.6,p1[2]*0.0016);
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // suspension: this is what makes the whiteout, and most of it is lost
  for(var k2=0;k2<NSUS;k2++){
    var pp=k2*4;
    var pz=proj(SU[pp],SU[pp+1],SU[pp+2]);
    if(pz[3]<1.5)continue;
    var a=0.16*SU[pp+3]*ext(pz[3],0.002);
    var szs=Math.max(0.6,pz[2]*0.0016);
    ctx.fillStyle='rgba(226,232,236,'+a+')';
    ctx.fillRect(pz[0],pz[1],szs,szs);
  }

  // atmospheric extinction wash toward the far end — arithmetic, not vignette
  var grd=ctx.createLinearGradient(0,0,0,H*0.62);
  grd.addColorStop(0,'rgba(217,221,224,0.55)');
  grd.addColorStop(1,'rgba(217,221,224,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H*0.62);

  drawTruck();
}

function drawBale(){
  var bh=groundAt(BALE.x,BALE.y);
  var r=BALE.r;
  var sink=BALE.sink+Math.max(0,bh)*0.7;
  var cx=BALE.x, cy=BALE.y;
  var pc=proj(cx,cy,bh+r*(1-sink)*0.5);
  if(pc[3]<2)return;
  var t=ext(pc[3]);
  var rad=pc[2]*r*0.86;
  var vis=1-Math.min(0.86,sink);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(pc[0],pc[1],rad,rad*vis*1.05,0,0,Math.PI*2);
  ctx.clip();
  // hay: dull, wind-scoured, not warm
  var base=['#7e7157','#8b7d60','#6d6349'];
  for(var s=0;s<70;s++){
    var ang=hash(s*3.7)*Math.PI*2;
    ctx.strokeStyle=base[s%3];
    ctx.globalAlpha=0.55*t;
    ctx.lineWidth=Math.max(0.7,rad*0.035);
    ctx.beginPath();
    ctx.arc(pc[0],pc[1],rad*(0.12+0.88*hash(s*5.1)),ang,ang+0.6+hash(s)*1.2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // snow plastered on the windward shoulder
  var gsn=ctx.createLinearGradient(pc[0]-rad,pc[1]-rad,pc[0]+rad,pc[1]+rad);
  gsn.addColorStop(0,'rgba(238,242,244,'+(0.80*t)+')');
  gsn.addColorStop(0.42,'rgba(220,229,235,'+(0.30*t)+')');
  gsn.addColorStop(0.72,'rgba(143,163,180,'+(0.22*t)+')');
  gsn.addColorStop(1,'rgba(143,163,180,'+(0.34*t)+')');
  ctx.fillStyle=gsn;ctx.fillRect(pc[0]-rad,pc[1]-rad,rad*2,rad*2);
  ctx.restore();
  // the strip of orange twine
  ctx.strokeStyle='rgba(255,90,31,'+(0.90*t)+')';
  ctx.lineWidth=Math.max(1,rad*0.055);
  ctx.beginPath();
  ctx.ellipse(pc[0]+rad*0.06,pc[1],rad*0.30,rad*vis*1.02,0,-0.5,2.5);
  ctx.stroke();
}

function drawFence(i0,i1){
  var i,k;
  for(i=i1;i>=i0;i--){
    var gh=groundAt(i,0);
    var gap=S.gap[i];
    var top=gap+HF;
    var exposed=top-gh;
    var pL=proj(i,0,0), pR=proj(i+1,0,0);
    if(pL[3]<1.6)continue;
    var t=ext(pL[3]);
    if(t<0.04)continue;
    var sc=pL[2];
    var yBase=pL[1];
    var yTop=proj(i,0,top)[1];
    var yGap=proj(i,0,gap)[1];
    var ySnow=proj(i,0,Math.max(0,gh))[1];
    var wpx=Math.abs(pR[0]-pL[0]);
    if(exposed<=0.02){
      // buried. Out of service. Transport goes straight over.
      continue;
    }
    // wires: top strand and mid strands
    for(var wI=0;wI<3;wI++){
      var wz=gap+HF*(0.06+0.45*wI);
      if(wz<gh)continue;
      var pw=proj(i,0,wz), pw2=proj(i+1,0,wz);
      ctx.strokeStyle=mixSky(0x6b,0x4a,0x35,t*0.8);
      ctx.lineWidth=Math.max(0.5,sc*0.0022);
      ctx.beginPath();ctx.moveTo(pw[0],pw[1]);ctx.lineTo(pw2[0],pw2[1]);ctx.stroke();
    }
    // laths
    for(k=0;k<LATHS;k++){
      if(!S.lath[i*LATHS+k])continue;
      var fx=i+(k+0.28)/LATHS;
      var pa=proj(fx,0,Math.max(gap,gh)), pb=proj(fx,0,top);
      var lw=Math.max(1.0,wpx*0.098);
      var hgt=pa[1]-pb[1];
      if(hgt<=0.5)continue;
      // sandblasted band at exactly saltation height, nowhere else
      var saltZlow=Math.max(gap,gh), saltZhigh=Math.max(gap,gh)+0.16;
      var pS1=proj(fx,0,saltZlow), pS2=proj(fx,0,Math.min(top,saltZhigh));
      var wear=hash(i*17+k*3);
      var bare=wear<0.10;
      ctx.fillStyle=bare?mixSky(0x9a,0x90,0x86,t):mixSky(0x8c,0x3a,0x26,t);
      ctx.fillRect(pb[0]-lw*0.5,pb[1],lw,hgt);
      if(!bare){
        ctx.fillStyle=mixSky(0xb5,0x8f,0x80,t);
        ctx.fillRect(pS2[0]-lw*0.5,pS2[1],lw,Math.max(0.8,pS1[1]-pS2[1]));
      }
      // grain and a lighter windward edge
      ctx.fillStyle='rgba(255,255,255,'+(0.11*t)+')';
      ctx.fillRect(pb[0]-lw*0.5,pb[1],Math.max(0.5,lw*0.22),hgt);
      // twist-wire tie
      if(k%2===0){
        var pt=proj(fx,0,gap+HF*0.51);
        ctx.fillStyle=mixSky(0x6b,0x4a,0x35,t);
        ctx.fillRect(pt[0]-lw*0.6,pt[1]-Math.max(0.7,sc*0.0022),lw*1.2,Math.max(1.2,sc*0.0045));
      }
    }
    // steel T-post every 2.4 m
    if(i%2===0){
      var px=proj(i+0.06,0,Math.max(-0.05,gh-0.05)), px2=proj(i+0.06,0,top+0.10);
      var pw3=Math.max(1.2,wpx*0.15);
      ctx.fillStyle=mixSky(0x55,0x56,0x4f,t);
      ctx.fillRect(px[0]-pw3*0.5,px2[1],pw3,px[1]-px2[1]);
      // punched studs
      ctx.fillStyle=mixSky(0x3f,0x40,0x3b,t*0.9);
      for(var st2=0;st2<5;st2++){
        var zz=gh+0.10+st2*0.26;
        if(zz>top+0.05)break;
        var ps=proj(i+0.06,0,zz);
        ctx.fillRect(ps[0]-pw3*0.16,ps[1],pw3*0.32,Math.max(0.8,sc*0.004));
      }
    }
    // three plastic reflector tabs, hundred-foot intervals. Nowhere else.
    if(i===18||i===48||i===78||i===108||i===138||i===168){
      var pr=proj(i+0.12,0,top-0.16);
      var rw=Math.max(1.6,wpx*0.20);
      ctx.fillStyle='rgba(255,90,31,'+(0.95*t)+')';
      ctx.fillRect(pr[0]-rw*0.5,pr[1],rw,rw*2.1);
    }
  }
}

/* the truck: once, up the grade, gearing down for the drift, and on */
var truck={t:-1, next:120+Math.random()*260};
function drawTruck(){
  if(truck.t<0)return;
  var u=truck.t;
  var wy=68;                       // road grade at the bottom of the field
  var wx=cam.x-52+u*118;
  var gh=groundAt(Math.max(0,Math.min(NX-1,wx)),wy);
  var p=proj(wx,wy,gh+1.05);
  if(p[3]<1.2)return;
  var t=ext(p[3],0.010);
  if(t<0.05)return;
  var w=p[2]*0.0055*640, h=p[2]*0.0055*300;
  ctx.fillStyle=mixSky(0x4a,0x4c,0x50,t*0.85);
  ctx.fillRect(p[0]-w*0.5,p[1]-h,w,h);
  ctx.fillStyle=mixSky(0x33,0x35,0x38,t*0.8);
  ctx.fillRect(p[0]-w*0.5,p[1]-h*0.38,w*0.30,h*0.38);
  // the plume it drags
  for(var s=0;s<18;s++){
    var sx=wx-2.2*s*0.5, sy=wy+hash(s)*1.6-0.8;
    var pz=proj(sx,sy,gh+0.15+hash(s*3)*1.5);
    ctx.fillStyle='rgba(236,240,243,'+(0.30*t*(1-s/18))+')';
    ctx.fillRect(pz[0],pz[1],Math.max(1,pz[2]*0.004),Math.max(1,pz[2]*0.004));
  }
}

/* ---------------------------------------------------------------
   AUDIO — everything synthesised, driven by the same numbers
   --------------------------------------------------------------- */
var AC=null,audio={};
function initAudio(){
  if(AC)return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  var sr=AC.sampleRate;
  // pink-ish noise buffer
  function noiseBuf(sec){
    var b=AC.createBuffer(1,sr*sec,sr),d=b.getChannelData(0);
    var b0=0,b1=0,b2=0;
    for(var i=0;i<d.length;i++){
      var w=Math.random()*2-1;
      b0=0.99765*b0+w*0.0990460;b1=0.96300*b1+w*0.2965164;b2=0.57000*b2+w*1.0526913;
      d[i]=(b0+b1+b2+w*0.1848)*0.16;
    }
    return b;
  }
  audio.master=AC.createGain();audio.master.gain.value=0.0;audio.master.connect(AC.destination);

  // wind bed
  var wn=AC.createBufferSource();wn.buffer=noiseBuf(4);wn.loop=true;
  audio.windLP=AC.createBiquadFilter();audio.windLP.type='lowpass';audio.windLP.frequency.value=520;
  audio.windHP=AC.createBiquadFilter();audio.windHP.type='highpass';audio.windHP.frequency.value=60;
  audio.windG=AC.createGain();audio.windG.gain.value=0.5;
  wn.connect(audio.windHP);audio.windHP.connect(audio.windLP);audio.windLP.connect(audio.windG);
  audio.windG.connect(audio.master);wn.start();

  // dry hiss: grain over packed drift
  var hn=AC.createBufferSource();hn.buffer=noiseBuf(3);hn.loop=true;
  audio.hissBP=AC.createBiquadFilter();audio.hissBP.type='bandpass';audio.hissBP.frequency.value=3400;audio.hissBP.Q.value=0.7;
  audio.hissG=AC.createGain();audio.hissG.gain.value=0.0;
  hn.connect(audio.hissBP);audio.hissBP.connect(audio.hissG);audio.hissG.connect(audio.master);hn.start();

  // rattle: grain on lath
  var rn=AC.createBufferSource();rn.buffer=noiseBuf(2);rn.loop=true;
  audio.ratHP=AC.createBiquadFilter();audio.ratHP.type='highpass';audio.ratHP.frequency.value=1500;
  audio.ratBP=AC.createBiquadFilter();audio.ratBP.type='bandpass';audio.ratBP.frequency.value=5200;audio.ratBP.Q.value=1.1;
  audio.ratG=AC.createGain();audio.ratG.gain.value=0.0;
  rn.connect(audio.ratHP);audio.ratHP.connect(audio.ratBP);audio.ratBP.connect(audio.ratG);audio.ratG.connect(audio.master);rn.start();

  // wire singing: pitch from tension in the top strand
  audio.wireOsc=AC.createOscillator();audio.wireOsc.type='sine';audio.wireOsc.frequency.value=214;
  audio.wireG=AC.createGain();audio.wireG.gain.value=0;
  audio.wireOsc.connect(audio.wireG);audio.wireG.connect(audio.master);audio.wireOsc.start();
  audio.wireOsc2=AC.createOscillator();audio.wireOsc2.type='sine';audio.wireOsc2.frequency.value=428;
  audio.wireG2=AC.createGain();audio.wireG2.gain.value=0;
  audio.wireOsc2.connect(audio.wireG2);audio.wireG2.connect(audio.master);audio.wireOsc2.start();

  audio.noiseBuf=noiseBuf(1);
  audio.master.gain.setTargetAtTime(0.5,AC.currentTime,1.4);
  audio.ready=true;
}
function ping(freq,dur,gain,type,q){
  if(!AC||!audio.ready)return;
  var o=AC.createOscillator();o.type=type||'sine';o.frequency.value=freq;
  var g=AC.createGain();g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(gain,AC.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(audio.master);o.start();o.stop(AC.currentTime+dur+0.05);
}
function knock(){
  if(!AC||!audio.ready)return;
  var s=AC.createBufferSource();s.buffer=audio.noiseBuf;
  var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=180+Math.random()*140;f.Q.value=5;
  var g=AC.createGain();g.gain.setValueAtTime(0.16,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0002,AC.currentTime+0.10);
  s.connect(f);f.connect(g);g.connect(audio.master);s.start();s.stop(AC.currentTime+0.14);
}
var lastPost=0,lastKnock=0;
function updateAudio(dt,t){
  if(!AC||!audio.ready)return;
  var u=wind.u10;
  var lvl=Math.min(0.9,Math.pow((u-8)/9,1.5))*0.42;
  audio.windG.gain.setTargetAtTime(lvl,AC.currentTime,0.12);
  audio.windLP.frequency.setTargetAtTime(300+u*46,AC.currentTime,0.20);
  // hiss follows the actual carpet flux, banded by surface density under the wind
  var rhoNear=S.rho[(YOFF+6)*NX+Math.round(cam.x)]||340;
  audio.hissG.gain.setTargetAtTime(Math.min(0.20,hissLevel*2.6),AC.currentTime,0.15);
  audio.hissBP.frequency.setTargetAtTime(2200+(rhoNear-280)*11,AC.currentTime,0.3);
  // rattle from actual grains hitting lath this frame
  var near=0;
  for(var i=Math.max(0,Math.round(cam.x)-16);i<Math.min(NX,Math.round(cam.x)+16);i++){
    var por=panelPorosity(S,i);
    var exp=Math.max(0,HF+S.gap[i]-S.h[YOFF*NX+i]);
    near+=(1-por)*Math.min(1,exp/HF);
  }
  near/=32;
  audio.ratG.gain.setTargetAtTime(Math.min(0.26,near*hissLevel*7.0+near*0.035),AC.currentTime,0.10);
  audio.ratBP.frequency.setTargetAtTime(4200+u*120,AC.currentTime,0.4);
  // top wire tension: pitch off length, tension, wind loading
  var tens=1+Math.max(0,(u-11))*0.10;
  var f0=196*Math.sqrt(tens);
  audio.wireOsc.frequency.setTargetAtTime(f0,AC.currentTime,0.6);
  audio.wireOsc2.frequency.setTargetAtTime(f0*2.02,AC.currentTime,0.6);
  var wg=Math.max(0,(u-12.4)/7)*0.030;
  audio.wireG.gain.setTargetAtTime(wg,AC.currentTime,0.5);
  audio.wireG2.gain.setTargetAtTime(wg*0.42,AC.currentTime,0.5);
  // T-post rings when a gust loads it
  if(wind.gust>1.15&&t-lastPost>2.2){ lastPost=t; ping(342+Math.random()*70,0.55,0.026,'triangle'); }
  // panel working against its staples
  if(Math.abs(wind.gust)>0.85&&t-lastKnock>1.1+Math.random()*2.4){ lastKnock=t; knock(); }
}
function truckAudio(){
  if(!AC||!audio.ready)return;
  var o=AC.createOscillator();o.type='sawtooth';
  var g=AC.createGain();var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=340;
  var now=AC.currentTime;
  o.frequency.setValueAtTime(48,now);
  o.frequency.linearRampToValueAtTime(76,now+7);
  o.frequency.linearRampToValueAtTime(41,now+9.6);   // gearing down for the drift
  o.frequency.linearRampToValueAtTime(69,now+13);
  o.frequency.linearRampToValueAtTime(52,now+22);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.075,now+7);
  g.gain.exponentialRampToValueAtTime(0.088,now+12);
  g.gain.exponentialRampToValueAtTime(0.0001,now+23);
  o.connect(f);f.connect(g);g.connect(audio.master);o.start(now);o.stop(now+23.5);
}

/* ---------------------------------------------------------------
   INPUT — three things a person could do to a fence with cold hands
   --------------------------------------------------------------- */
var drag={active:false,mode:null,x0:0,y0:0,cam0:0,gap0:0,panel:0,moved:0};
function pick(px,py){
  // find which panel / lath is under the pointer
  var best=null,bd=1e9;
  for(var i=Math.max(0,Math.floor(cam.x-42));i<Math.min(NX,cam.x+42);i++){
    var gh=groundAt(i,0), gap=S.gap[i];
    if(gap+HF-gh<=0.02)continue;
    for(var k=0;k<LATHS;k++){
      var fx=i+(k+0.28)/LATHS;
      var pa=proj(fx,0,Math.max(gap,gh)), pb=proj(fx,0,gap+HF);
      if(pa[3]<1.6)continue;
      var cx2=(pa[0]+pb[0])*0.5, cy2=(pa[1]+pb[1])*0.5;
      var hw=Math.max(4,Math.abs(pa[2])*0.012), hh=Math.max(6,Math.abs(pa[1]-pb[1])*0.5+4);
      if(px>cx2-hw&&px<cx2+hw&&py>cy2-hh&&py<cy2+hh){
        var d=Math.abs(px-cx2)+Math.abs(py-cy2)*0.2;
        if(d<bd){bd=d;best={i:i,k:k};}
      }
    }
  }
  return best;
}
function pointerPos(e){
  var r=cv.getBoundingClientRect();
  var p=(e.touches&&e.touches[0])||e;
  return [p.clientX-r.left,p.clientY-r.top];
}
function down(e){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  var p=pointerPos(e);
  drag.active=true;drag.x0=p[0];drag.y0=p[1];drag.cam0=cam.x;drag.moved=0;drag.mode=null;
  var hit=pick(p[0],p[1]);
  drag.hit=hit;
  if(hit){ drag.panel=hit.i; drag.gap0=S.gap[hit.i]; }
  e.preventDefault();
}
function move(e){
  if(!drag.active)return;
  var p=pointerPos(e);
  var dx=p[0]-drag.x0, dy=p[1]-drag.y0;
  drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  if(!drag.mode&&drag.moved>7){
    drag.mode=(Math.abs(dy)>Math.abs(dx)*1.25 && drag.hit)?'gap':'walk';
  }
  if(drag.mode==='walk'){
    var scl=42/Math.max(240,W);
    cam.x=Math.max(6,Math.min(NX-6,drag.cam0-dx*scl*1.5));
  } else if(drag.mode==='gap'){
    // raise or lower the panel on its posts. Never explained.
    var g=Math.max(0,Math.min(0.42,drag.gap0-dy*0.0016));
    for(var i=Math.max(0,drag.panel-5);i<Math.min(NX,drag.panel+6);i++){
      var w=1-Math.abs(i-drag.panel)/6;
      S.gap[i]=S.gap[i]*(1-w)+g*w;
    }
    if(AC&&audio.ready&&Math.random()<0.12) knock();
  }
  e.preventDefault();
}
function up(e){
  if(!drag.active)return;
  if(drag.moved<7&&drag.hit){
    var idx=drag.hit.i*LATHS+drag.hit.k;
    S.lath[idx]=S.lath[idx]?0:1;
    if(AC&&audio.ready){
      ping(S.lath[idx]?430:610,0.09,0.09,'square');
      knock();
    }
  } else if(drag.moved<7&&!drag.hit){
    // nothing. The ground is not a control.
  }
  drag.active=false;drag.mode=null;drag.hit=null;
  S.camx=cam.x;save();
  e.preventDefault();
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up,{passive:false});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){cam.x=Math.max(6,cam.x-2.5);}
  if(e.key==='ArrowRight'){cam.x=Math.min(NX-6,cam.x+2.5);}
});

/* ---------------------------------------------------------------
   LOOP
   --------------------------------------------------------------- */
var last=performance.now(), timeAcc=0, saveAcc=0, avAcc=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  timeAcc+=dt;
  var wdt=dt*46;            // wind minutes per real second — the drift only grows
  stepWind(dt,timeAcc);
  solveFlow();
  transport(wdt*0.020);
  avAcc+=dt; if(avAcc>0.20){avalanche();avAcc=0;}
  stepGrains(dt);
  S.hours+=wdt/3600;
  // truck: once, up the grade, and on
  truck.next-=dt;
  if(truck.next<=0&&truck.t<0){ truck.t=0; truckAudio(); }
  if(truck.t>=0){ truck.t+=dt/26; if(truck.t>1.05){truck.t=-1;truck.next=340+Math.random()*520;} }
  updateAudio(dt,timeAcc);
  render();
  saveAcc+=dt; if(saveAcc>9){saveAcc=0;S.camx=cam.x;save();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('beforeunload',function(){S.camx=cam.x;save();});
document.addEventListener('visibilitychange',function(){ if(document.hidden){S.camx=cam.x;save();} });

/* Set-back was paced off in October at thirty times the height.
   The tail runs out about thirty-five. Nothing in here marks the road. */
})();
</script>
