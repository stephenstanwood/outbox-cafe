  <meta name="outbox-spec-era" content="A February afternoon in 1982, about ten to three, during a nine-year-old's birthday party at a suburban roller rink on the edge of Winnipeg. It is minus thirty-one outside and the parking lot is full of block-heater cords. Inside, the rink is a varnished maple oval under a low black-painted ceiling. A mirror ball the size of a beach ball hangs dead centre on a chain from a ceiling motor. Two follow-spots on the mezzanine rail have coloured gel frames in front of them that the floor guard swaps by hand. The party table is pushed against the boards at the far curve with half a slab cake on it. Thirty-odd kids in rental skates with orange wheels go round and round counterclockwise, mostly upright. The rink organist plays live from a booth above the skate-rental counter, and the next announced skate is the birthday girl's couples-only snowball.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: a wordless, edge-to-edge view straight down from the rafters onto the whole rink floor, filled with hundreds of travelling squares of reflected light thrown by the turning mirror ball. The spots sweep across the maple in long curving rivers, stretch into skinny ellipses where they hit the floor at a slant near the boards, and climb up and over the skaters, who circle below as soft blurred streaks. The visitor plays the lighting rig. Dragging in circles anywhere spins the ball faster or slower. Clicking either follow-spot on the rail swaps its gel with a clunk. Holding down calls REVERSE SKATE, and the whole crowd brakes, wobbles, turns round and flows the other way, carrying the light with it.">
  <meta name="outbox-spec-subject" content="The pure, show-off glitter of a mirror ball doing its one job above a room full of children who are not looking at it because they are trying not to fall over. That means hundreds of little squares racing over a floor and over moving bodies, bending into commas on curved shoulders and bike helmets, pooling bright where several facets happen to agree, and snapping across the gap of the boards. Underneath them is the slow, lopsided river of skaters: a tight fast knot of show-offs on the inside rail, a gappy outer lane of beginners clutching the boards, one dad in jeans going very slowly backwards, a conga line that keeps forming and breaking, and the birthday girl in a paper crown that catches every spot that touches it. When the snowball starts, the floor half-empties and pairs drift out one by one into the light.">
  <meta name="outbox-spec-tone" content="Wordless and RINKY-LOUD. There is no narrator, no caption and no written sentence; the register lives in the light and the sound, and both are bright, bouncy and slightly too much. Spots fly a touch too fast. The gels are saturated and gaudy. Skaters wobble, catch themselves and get going again. The live rink organ pumps out a jaunty, slightly too-fast waltz with a fat Leslie warble, and a whooshing whirr of urethane wheels on maple swells and thins as the crowd bunches and spreads. It should feel like being nine, a bit sugar-high, with a fresh hand stamp on your wrist, doing your fourth lap in a row without touching the wall. It is warm, noisy, giddy and a bit clumsy, and it is never calm.">
