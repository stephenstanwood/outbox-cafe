  <meta name="outbox-spec-era" content="1963, right now — half past ten on a hot bright harmattan morning in the dye-pit yard at Kofar Mata, Kano, northern Nigeria: forty-odd fermentation pits sunk mouth-flush into the packed earth, the surface of the one in front of you carrying its coppery foam bloom, cotton skeins on the rail behind you still dripping from the eight o'clock dip. Not a look-back at 'the ancient art of indigo' and not a 'synthetic dyes killed it' lament — the pit is alive and working this minute, the liquid warm, the next dip due before the sun gets any higher.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the round mouth of one sunken indigo pit seen from directly overhead and life-size, ringed by a lip of packed earth, and nothing else: no header, no caption, no counter, no title. Across the surface sits a living metallic foam bloom that genuinely drifts, coalesces and heals, and hanging into frame from the top edge are seven cotton skeins on a rail. Press and drag a skein down into the liquid — the surface parts and closes honestly around it, the foam breaks and knits back over the wound where it went in — and release above the earth lip to hang it in the air, where it oxidizes in real time in front of you: out of the vat it is a wet yellow-green, and over roughly twenty seconds it climbs honestly through jade, through a grey-teal, into blue, per skein, on its own clock. Re-dip a skein that has already turned and it goes yellow-green again and comes back deeper. The piece IS the colour arriving in the air.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of dipping cotton in a fermentation indigo pit — that indigo is not soluble and never was, so it has to be chemically reduced in the pit into a soluble yellow-green leuco form, which is the ONLY form that will actually enter a fibre; that the blue you see afterwards is oxygen from ordinary air converting that yellow-green back into insoluble pigment while it is already locked inside the cotton, which is why the cloth changes colour in your hands and not in the vat; that shade is built by repeated short dips rather than one long soak, because a long soak just wastes reduced dye and gives you nothing extra past saturation; that the coppery foam bloom on the surface is the vat telling you its reduction is healthy and that breaking it repeatedly by thrashing the cloth drags air in and spoils the liquid; that you lift slowly and squeeze under the surface, not above it, for the same reason; and that a pit gets measurably weaker across a morning because every skein takes dye out and nothing puts it back until the pit is fed again. Literally leaves, potash, warm water, oxygen, and how many times you dunk it.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the cloth, and that register is WARM, BUSY and CHEMICAL — a thick working surface that is never still, foam knitting and tearing, drips landing and starring the earth lip, colour actively climbing up a hanging skein at a speed you can watch. Hard bright mid-morning light, sharp shadow off the pit lip, dust in the air. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow-and-contemplative, NOT melancholy — this is a hot yard mid-job, not a mood.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Deep vat indigo (#1b2f5e) and the wet leuco yellow-green that comes out of it (#8a9440) as the two working anchors, with the intermediate oxidation greys-and-jades passing through (#3f6b63), all sitting in packed laterite yard earth (#8d5a3a) under hard harmattan light, and exactly one chip of coppery vat-bloom (#b6763a) held strictly for the metallic foam on the surface and the sheen on a freshly lifted skein. Flat, hard, high-contrast, no soft edges, no glow — a pit mouth photographed straight down at half past ten.">
  <meta name="outbox-spec-wildcard" content="The pit is a finite, non-replenishing resource for the whole visit: total reduced dye in the vat is a real quantity that drops with every dip and never recovers, so the surface bloom thins, the yellow-green comes out paler, and late skeins oxidize to a weaker, greyer blue no matter how long they hang. Nothing on the page states this, hints at it, warns about it, or ever resets it — it is discoverable only by dipping enough to notice the twelfth skein is not the colour the second one was.">

<script>
(function(){
"use strict";
var cv=document.getElementById('pit'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,cx=0,cy=0,R=100,railY=30,skW=24,skH=74,T=0;
var earth=document.createElement('canvas'),ectx=earth.getContext('2d');
var stainC=document.createElement('canvas'),sctx=stainC.getContext('2d');
var foamC=document.createElement('canvas'),fctx=foamC.getContext('2d'),fimg=null;
var N=64,fA=null,fB=null,dmg=null,coverage=0.3;
var vat=0.90;
var stains=[],ripples=[],drips=[],motes=[],sk=[],pointers={};

var COTTON=[214,199,172],LEUCO=[138,148,64],JADE=[63,107,99],INDIGO=[27,47,94],WEAK=[80,96,118];
function mix(a,b,t){t=t<0?0:t>1?1:t;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

for(var i=0;i<7;i++){
  sk.push({hx:0,x:0,y:0,px:0,py:0,vx:0,vy:0,tx:0,ty:0,restY:0,drag:false,
    Tm:1,ox:1,wet:0,dipSat:0,applied:0,dips:0,vatAt:vat,prevF:0,
    oxT:rnd(17,23),seed:Math.random()*99,gdx:0,gdy:0});
}
sk[1].Tm=0.70;sk[1].ox=0.52;sk[1].wet=0.55;sk[1].dips=2;sk[1].vatAt=0.95;
sk[4].Tm=0.78;sk[4].ox=0.30;sk[4].wet=0.75;sk[4].dips=1;sk[4].vatAt=0.93;

function buildEarth(){
  earth.width=Math.round(W*DPR);earth.height=Math.round(H*DPR);
  ectx.setTransform(DPR,0,0,DPR,0,0);
  ectx.fillStyle='#8d5a3a';ectx.fillRect(0,0,W,H);
  var n=Math.round(W*H/240);
  for(var i=0;i<n;i++){
    var x=Math.random()*W,y=Math.random()*H,s=Math.random();
    ectx.fillStyle=s<0.42?'rgba(168,110,66,0.55)':s<0.78?'rgba(104,60,32,0.42)':'rgba(206,158,108,0.4)';
    ectx.fillRect(x,y,1+(Math.random()*2|0),1+(Math.random()*2|0));
  }
  for(var p=0;p<Math.round(W*H/9000);p++){
    var px=Math.random()*W,py=Math.random()*H,pr=rnd(1.5,4.5);
    ectx.fillStyle='rgba(198,152,104,0.6)';ectx.beginPath();ectx.ellipse(px,py,pr,pr*0.72,Math.random()*3,0,6.3);ectx.fill();
    ectx.fillStyle='rgba(72,38,18,0.35)';ectx.beginPath();ectx.ellipse(px+1.4,py+1.2,pr*0.9,pr*0.6,0,0,6.3);ectx.fill();
  }
  ectx.strokeStyle='rgba(88,48,24,0.35)';ectx.lineWidth=1;
  for(var c=0;c<16;c++){
    var ax=Math.random()*W,ay=Math.random()*H;ectx.beginPath();ectx.moveTo(ax,ay);
    for(var k=0;k<4;k++){ax+=rnd(-30,30);ay+=rnd(-24,24);ectx.lineTo(ax,ay);}
    ectx.stroke();
  }
}
function drawStain(g,st){
  g.save();g.translate(st.x,st.y);
  g.fillStyle=rgba(st.c,st.a);g.beginPath();
  for(var i=0;i<7;i++){var a=i/7*6.283,r=st.r*(0.6+((st.seed*(i+3))%1)*0.75);
    var X=Math.cos(a)*r,Y=Math.sin(a)*r*0.85;i?g.lineTo(X,Y):g.moveTo(X,Y);}
  g.closePath();g.fill();
  for(var j=0;j<4;j++){var aa=(st.seed*(j+1))%6.283,rr=st.r*(1.4+((st.seed*7*(j+1))%1)*1.6);
    g.fillRect(Math.cos(aa)*rr,Math.sin(aa)*rr,1.6,1.6);}
  g.restore();
}
function buildStains(){
  stainC.width=Math.round(W*DPR);stainC.height=Math.round(H*DPR);
  sctx.setTransform(DPR,0,0,DPR,0,0);sctx.clearRect(0,0,W,H);
  if(!stains.length){
    for(var i=0;i<120;i++){
      var a=rnd(0,6.283),rr=R+rnd(2,40);
      stains.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,r:rnd(2,7),
        c:mix(INDIGO,[12,20,38],Math.random()*0.7),a:rnd(0.35,0.8),seed:Math.random()*9});
    }
    for(var j=0;j<40;j++){
      stains.push({x:rnd(0,W),y:rnd(0,Math.max(40,cy-R+30)),r:rnd(2,6),
        c:mix(INDIGO,JADE,Math.random()*0.5),a:rnd(0.25,0.6),seed:Math.random()*9});
    }
  }
  for(var s=0;s<stains.length;s++)drawStain(sctx,stains[s]);
}
function initFoam(){
  N=clamp(Math.round(2*R/6),48,190);
  foamC.width=N;foamC.height=N;fimg=fctx.createImageData(N,N);
  fA=new Float32Array(N*N);fB=new Float32Array(N*N);dmg=new Float32Array(N*N);
  for(var i=0;i<N*N;i++)fA[i]=Math.random()*0.95;
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  skW=clamp(W/17,15,32);skH=skW*3.1;
  railY=clamp(H*0.045,20,38);
  var topClear=railY+34+skH+28;
  R=Math.min(Math.max(Math.min(W,H)*0.58,W*0.44),Math.max(W,H)*0.78);
  cx=W/2;cy=topClear+R+4;
  for(var i=0;i<7;i++){sk[i].hx=W*(i+0.5)/7;sk[i].restY=railY+34+skH/2;
    if(!sk[i].drag){sk[i].x=sk[i].hx;sk[i].y=sk[i].restY;sk[i].px=sk[i].x;sk[i].py=sk[i].y;}}
  buildEarth();buildStains();initFoam();
  motes=[];for(var m=0;m<70;m++)motes.push({x:Math.random()*W,y:Math.random()*H,vx:rnd(4,22),vy:rnd(-6,10),s:rnd(0.8,2.1),a:rnd(0.12,0.4)});
}
function skeinColor(s){
  var deep=mix(INDIGO,WEAK,clamp((1-s.vatAt)*0.85,0,0.8));
  var tgt=s.ox<0.5?mix(LEUCO,JADE,s.ox/0.5):mix(JADE,deep,(s.ox-0.5)/0.5);
  var c=mix(COTTON,tgt,1-s.Tm);
  if(s.wet>0)c=mix(c,[c[0]*0.86,c[1]*0.86,c[2]*0.9],s.wet*0.6);
  return c;
}
function stamp(wx,wy,rad){
  if(!dmg)return;
  var gx=(wx-(cx-R))/(2*R)*N,gy=(wy-(cy-R))/(2*R)*N,gr=rad/(2*R)*N;
  var i0=Math.max(0,Math.floor(gx-gr)),i1=Math.min(N-1,Math.ceil(gx+gr));
  var j0=Math.max(0,Math.floor(gy-gr)),j1=Math.min(N-1,Math.ceil(gy+gr));
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){
    var dx=i+0.5-gx,dy=j+0.5-gy;
    if(dx*dx+dy*dy<gr*gr)dmg[j*N+i]=1;
  }
}
function update(dt){
  for(var n=0;n<sk.length;n++){
    var s=sk[n];
    if(s.drag){s.x+=(s.tx-s.x)*Math.min(1,dt*22);s.y+=(s.ty-s.y)*Math.min(1,dt*22);}
    else{s.x+=(s.hx-s.x)*Math.min(1,dt*7);s.y+=(s.restY-s.y)*Math.min(1,dt*6.4);}
    s.vx=(s.x-s.px)/Math.max(dt,0.001);s.vy=(s.y-s.py)/Math.max(dt,0.001);
    s.px=s.x;s.py=s.y;
    var half=skH/2-skW*0.4,sub=0,LR=R*0.99;
    for(var k=0;k<9;k++){
      var py=s.y-half+(2*half)*k/8,dx=s.x-cx,dy=py-cy;
      if(dx*dx+dy*dy<LR*LR)sub++;
    }
    var f=sub/9;
    if((f>0)!==(s.prevF>0)){
      var q=R*R-(s.x-cx)*(s.x-cx);
      if(q>0)ripples.push({x:s.x,y:cy-Math.sqrt(q),r:skW*0.6,life:1});
    }
    s.prevF=f;
    if(f>0.02){
      s.dipSat=Math.min(1,s.dipSat+dt/1.15);
      var desired=0.34*vat*s.dipSat*f,d=desired-s.applied;
      if(d>0){s.Tm*=(1-d);s.applied=desired;vat=Math.max(0.05,vat-d*0.145);s.vatAt=vat;}
      s.wet=1;
      var speed=Math.abs(s.vx)*1.0+Math.abs(s.vy)*0.26;
      var rad=skW*0.60+speed*0.085;
      for(var m=0;m<7;m++){
        var sy=s.y-skH/2+skH*m/6,ddx=s.x-cx,ddy=sy-cy;
        if(ddx*ddx+ddy*ddy<R*R)stamp(s.x,sy,rad);
      }
    }else{
      if(s.dipSat>0){s.dips++;s.dipSat=0;s.applied=0;}
      s.wet=Math.max(0,s.wet-dt/34);
      if(s.wet>0.45&&Math.random()<dt*s.wet*2.4&&drips.length<90){
        drips.push({x:s.x+rnd(-skW*0.3,skW*0.3),y:s.y+skH/2,vy:rnd(20,60),
          fall:rnd(26,150),start:s.y+skH/2,c:skeinColor(s)});
      }
    }
    s.ox=clamp(s.ox-dt*f/1.3+dt*(1-f)/s.oxT,0,1);
  }
  for(var r=ripples.length-1;r>=0;r--){
    var rp=ripples[r];rp.r+=dt*95;rp.life-=dt*0.85;
    if(rp.life<=0||rp.r>R)ripples.splice(r,1);
  }
  for(var p=drips.length-1;p>=0;p--){
    var dp=drips[p];dp.vy+=900*dt;dp.y+=dp.vy*dt;
    var inPit=(dp.x-cx)*(dp.x-cx)+(dp.y-cy)*(dp.y-cy)<R*R*0.98;
    if(inPit){
      ripples.push({x:dp.x,y:dp.y,r:2,life:0.8});stamp(dp.x,dp.y,skW*0.32);drips.splice(p,1);
    }else if(dp.y-dp.start>dp.fall||dp.y>H+10){
      if(dp.y<H+8){var st={x:dp.x,y:dp.y,r:rnd(1.8,4.2),c:dp.c,a:rnd(0.4,0.75),seed:Math.random()*9};
        stains.push(st);drawStain(sctx,st);if(stains.length>900)stains.shift();}
      drips.splice(p,1);
    }
  }
  for(var mo=0;mo<motes.length;mo++){
    var M=motes[mo];M.x+=M.vx*dt;M.y+=M.vy*dt;
    if(M.x>W+4){M.x=-4;M.y=Math.random()*H;}
    if(M.y>H+4){M.y=-4;}if(M.y<-6){M.y=H+4;}
  }
}
function stepFoam(dt){
  if(!fA)return;
  var target=0.46*Math.pow(vat,1.25);
  var err=clamp(target-coverage,-0.6,0.6),t=T*0.001;
  for(var j=0;j<N;j++){
    var v=(j+0.5)/N;
    for(var i=0;i<N;i++){
      var u=(i+0.5)/N;
      var vx=Math.sin(v*6.0+t*0.23)*0.85+Math.sin((u*3.4-v*2.2)+t*0.15)*0.55;
      var vy=Math.cos(u*5.2-t*0.19)*0.75+Math.cos((u*2.3+v*3.6)-t*0.12)*0.45;
      var sx=i-vx*dt*3.0,sy=j-vy*dt*3.0;
      if(sx<0)sx=0;if(sy<0)sy=0;if(sx>N-1.002)sx=N-1.002;if(sy>N-1.002)sy=N-1.002;
      var i0=sx|0,j0=sy|0,fx=sx-i0,fy=sy-j0,b0=j0*N+i0;
      var a=fA[b0],b=fA[b0+1],c=fA[b0+N],d=fA[b0+N+1];
      var top=a+(b-a)*fx,bot=c+(d-c)*fx;
      fB[j*N+i]=top+(bot-top)*fy;
    }
  }
  var sum=0,rr=N*0.5-0.5;
  for(var jj=0;jj<N;jj++){
    for(var ii=0;ii<N;ii++){
      var kk=jj*N+ii,gx=ii+0.5-N/2,gy=jj+0.5-N/2;
      if(gx*gx+gy*gy>rr*rr*0.985){fA[kk]=0;dmg[kk]=0;continue;}
      var f0=fB[kk];
      var L=fB[kk-(ii>0?1:0)],Rr=fB[kk+(ii<N-1?1:0)],U=fB[kk-(jj>0?N:0)],D=fB[kk+(jj<N-1?N:0)];
      var f=f0+0.16*((L+Rr+U+D)*0.25-f0);
      f+=dt*24*(f-0.5)*f*(1-f);
      f+=err*dt*1.15;
      f+=(Math.random()-0.44)*0.019;
      if(dmg[kk]>0){f*=(1-dmg[kk]);dmg[kk]=0;}
      if(f<0)f=0;else if(f>1)f=1;
      fA[kk]=f;sum+=f;
    }
  }
  coverage=sum/(N*N*0.775);
  var data=fimg.data;
  for(var q=0,idx=0;q<N*N;q++,idx+=4){
    var fv=fA[q],rC,gC,bC,aC;
    if(fv>0.76){rC=182;gC=118;bC=58;aC=238;}
    else if(fv>0.62){rC=150;gC=94;bC=48;aC=228;}
    else if(fv>0.50){rC=88;gC=64;bC=52;aC=196;}
    else{rC=0;gC=0;bC=0;aC=0;}
    data[idx]=rC;data[idx+1]=gC;data[idx+2]=bC;data[idx+3]=aC;
  }
  fctx.putImageData(fimg,0,0);
}
function hank(x,y,w,h){
  var r=w/2;ctx.beginPath();
  ctx.moveTo(x-r,y-h/2+r);
  ctx.arc(x,y-h/2+r,r,Math.PI,0);
  ctx.lineTo(x+r,y+h/2-r);
  ctx.arc(x,y+h/2-r,r,0,Math.PI);
  ctx.closePath();
}
function drawSkein(s){
  var c=skeinColor(s),top=s.y-skH/2;
  ctx.strokeStyle='#4a2c17';ctx.lineWidth=Math.max(1.6,skW*0.09);
  ctx.beginPath();ctx.moveTo(s.x,railY+11);ctx.lineTo(s.x,top+3);ctx.stroke();
  ctx.fillStyle='rgba(52,24,12,0.34)';hank(s.x+skW*0.30,s.y+skW*0.34,skW,skH);ctx.fill();
  var sub=(s.x-cx)*(s.x-cx)+(s.y-cy)*(s.y-cy)<R*R;
  if(sub||((s.x-cx)*(s.x-cx)+(s.y+skH/2-cy)*(s.y+skH/2-cy)<R*R)){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*0.99,0,6.2832);ctx.clip();
    ctx.fillStyle='#0d1935';hank(s.x,s.y,skW+13,skH+11);ctx.fill();
    ctx.strokeStyle='#37588e';ctx.lineWidth=2;hank(s.x,s.y,skW+13,skH+11);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle=rgb(c);hank(s.x,s.y,skW,skH);ctx.fill();
  ctx.save();hank(s.x,s.y,skW,skH);ctx.clip();
  var dk=[c[0]*0.78,c[1]*0.78,c[2]*0.82],lt=[c[0]*1.14+8,c[1]*1.14+8,c[2]*1.12+8];
  ctx.lineWidth=Math.max(1.1,skW*0.055);
  for(var i=0;i<6;i++){
    var off=(-0.36+i*0.145)*skW+Math.sin(s.seed+i*1.7)*skW*0.03;
    ctx.strokeStyle=(i%2)?rgba(dk,0.75):rgba(lt,0.4);
    ctx.beginPath();ctx.moveTo(s.x+off,s.y-skH/2);ctx.lineTo(s.x+off+Math.sin(s.seed+i)*2,s.y+skH/2);ctx.stroke();
  }
  ctx.fillStyle=rgba(dk,0.9);ctx.fillRect(s.x-skW/2,s.y-skH*0.34,skW,Math.max(3,skW*0.16));
  ctx.fillRect(s.x-skW/2,s.y+skH*0.30,skW,Math.max(2.5,skW*0.12));
  if(s.wet>0.72){
    ctx.fillStyle='rgba(182,118,58,'+((s.wet-0.72)*2.6).toFixed(3)+')';
    ctx.fillRect(s.x-skW*0.30,s.y-skH*0.24,Math.max(2,skW*0.11),skH*0.5);
  }
  ctx.restore();
  if(sub){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*0.99,0,6.2832);ctx.clip();

  }
}
function draw(){
  ctx.drawImage(earth,0,0,W,H);
  ctx.drawImage(stainC,0,0,W,H);
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.clip();
  var base=mix([23,40,79],[62,72,86],clamp((1-vat)*0.30,0,0.3));
  ctx.fillStyle=rgb(base);ctx.fillRect(cx-R,cy-R,2*R,2*R);
  var t=T*0.001;
  for(var i=0;i<3;i++){
    var a=t*0.055+i*2.14,px=cx+Math.cos(a)*R*0.38,py=cy+Math.sin(a*0.83+i)*R*0.32;
    var g=ctx.createRadialGradient(px,py,0,px,py,R*0.9);
    g.addColorStop(0,'rgba(8,16,40,0.5)');g.addColorStop(1,'rgba(8,16,40,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,2*R,2*R);
  }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(foamC,cx-R,cy-R,2*R,2*R);
  ctx.imageSmoothingEnabled=true;
  for(var r=0;r<ripples.length;r++){
    var rp=ripples[r];
    ctx.strokeStyle='rgba(126,158,200,'+(rp.life*0.45).toFixed(3)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,6.2832);ctx.stroke();
    ctx.strokeStyle='rgba(9,18,44,'+(rp.life*0.4).toFixed(3)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r+2.5,0,6.2832);ctx.stroke();
  }
  ctx.fillStyle='rgba(5,11,27,0.32)';
  ctx.beginPath();ctx.rect(cx-R-2,cy-R-2,2*R+4,2*R+4);
  ctx.arc(cx+R*0.062,cy+R*0.055,R,0,6.2832);ctx.fill('evenodd');
  ctx.fillStyle='rgba(255,236,200,0.05)';
  ctx.beginPath();ctx.rect(cx-R-2,cy-R-2,2*R+4,2*R+4);
  ctx.arc(cx-R*0.20,cy-R*0.16,R*0.99,0,6.2832);ctx.fill('evenodd');
  ctx.restore();
  ctx.lineWidth=Math.max(7,R*0.022);
  ctx.strokeStyle='#6d4026';ctx.beginPath();ctx.arc(cx,cy,R+ctx.lineWidth*0.5,0,6.2832);ctx.stroke();
  ctx.lineWidth=Math.max(2.5,R*0.008);ctx.strokeStyle='rgba(224,178,124,0.55)';
  ctx.beginPath();ctx.arc(cx,cy,R+ctx.lineWidth*3.2,0,6.2832);ctx.stroke();
  ctx.fillStyle='rgba(46,22,10,0.4)';ctx.fillRect(0,railY+13,W,10);
  for(var n=0;n<sk.length;n++)drawSkein(sk[n]);
  ctx.fillStyle='#6b4426';ctx.fillRect(0,railY-6,W,15);
  ctx.fillStyle='#8f5f34';ctx.fillRect(0,railY-6,W,4);
  ctx.fillStyle='#4a2c17';ctx.fillRect(0,railY+7,W,2.5);
  for(var h=0;h<sk.length;h++){
    ctx.fillStyle='#3b2412';
    ctx.fillRect(sk[h].hx-2.5+(h===3?2:0),railY-8,5,20);
  }
  for(var d=0;d<drips.length;d++){
    var dp=drips[d];ctx.fillStyle=rgb(dp.c);ctx.fillRect(dp.x-1,dp.y,2.4,5.5);
  }
  ctx.globalAlpha=1;
  for(var m=0;m<motes.length;m++){
    var M=motes[m];ctx.fillStyle='rgba(240,212,172,'+M.a+')';ctx.fillRect(M.x,M.y,M.s,M.s);
  }
  ctx.fillStyle='rgba(214,168,112,0.05)';ctx.fillRect(0,0,W,H);
}
var last=0;
function frame(ts){
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000);last=ts;T=ts;
  update(dt);stepFoam(dt);draw();
  requestAnimationFrame(frame);
}
function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',function(e){
  var p=pt(e),best=null,bd=1e9;
  for(var i=0;i<sk.length;i++){
    var s=sk[i];if(s.drag)continue;
    var dy=Math.max(0,Math.abs(p.y-s.y)-skH/2),dx=Math.abs(p.x-s.x)-skW/2;
    if(dx<0)dx=0;var d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=s;}
  }
  if(best&&bd<44){
    best.drag=true;best.gdx=best.x-p.x;best.gdy=best.y-p.y;
    best.tx=best.x;best.ty=best.y;pointers[e.pointerId]=best;
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',function(e){
  var s=pointers[e.pointerId];if(!s)return;
  var p=pt(e);
  s.tx=clamp(p.x+s.gdx,12,W-12);
  s.ty=clamp(p.y+s.gdy,s.restY,cy+R*0.86);
  e.preventDefault();
},{passive:false});
function release(e){
  var s=pointers[e.pointerId];if(!s)return;
  s.drag=false;delete pointers[e.pointerId];
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('pointerleave',release);
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
