  <meta name="outbox-spec-format" content="A genuinely generative Chladni-plate cymatics piece filling the whole viewport, seen straight down: a dark square brass plate strewn edge-to-edge with pale sand, clamped at its center, with a bow poised along one edge. It's a real particle sim — hundreds of sand grains each integrate position every frame and get shaken off the vibrating antinodes toward the still nodal lines of whatever standing-wave mode the current pitch excites, so the loose scatter genuinely MIGRATES and piles up into the classic symmetric Chladni figure, then dissolves and re-forms into a wholly different figure when the pitch changes. You drive the pitch yourself (drag up/down the edge, scroll, or UP/DOWN arrows) and a real bowed tone sings out via Web Audio at exactly that frequency while the sand answers it live. Minimal text: just the migrating sand, the bow, one short changing host-caption, and a tiny corner stamp — the piece IS the sand finding its lines.">
  <meta name="outbox-spec-subject" content="The plain physics of Chladni figures and nothing more — how bowing the plate's edge stands up an invisible pattern of ridges that heave up and down (the antinodes) laced between lines that never move at all (the nodes), and how loose sand bounced off every heaving spot has nowhere left to come to rest but along those still lines, so the sand DRAWS the standing wave for you; how each pitch has its own whole mode with its own symmetric web of nodal lines, so a higher note breaks the figure apart and re-knits it finer, and a plate clamped dead-center throws only the modes that keep a still point in the middle. Literally brass, sand, a bow, and standing waves — that's the whole trick, and it has nothing to teach you but itself.">
  <meta name="outbox-spec-tone" content="The bright, warm, wide-eyed delight of a 1970s kids'-TV science presenter, sleeves rolled, bowing the plate and thrilled every single time — 'watch the sand — WATCH it — there! see it hop right off the middle and run into lines? Now let's try a higher note and see what she draws THIS time —' sincere, exclamation-happy, egging you to push the pitch up and find a new figure, delighted when the sand snaps clean into a shape. Peer-to-a-kid, present-tense, never arch, never wistful, never a life-lesson; there's a plate full of sand and a bow in hand and it does something wonderful and that's the entire point. All spoken text stays a single short caption line at a time — the sand does the rest.">

<title>See the Sound! — Bow the Brass Plate and Watch the Sand Draw</title>
<!-- brass, sand, a bow, standing waves. that's the whole trick. -->
<!-- watch long enough: one dark grain always comes home to the middle -->
<style>
  html,body{margin:0;height:100%;background:#0b0805;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;color:#e0a23c;}
  canvas{display:block;touch-action:none;cursor:ns-resize;}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;opacity:.6;}
  .caption{position:fixed;top:4.2%;left:0;right:0;z-index:6;text-align:center;
    padding:0 16px;pointer-events:none;line-height:1.35;
    font-size:clamp(15px,3.3vw,25px);font-style:italic;
    color:#f0c266;text-shadow:0 0 10px rgba(224,162,60,.55),0 0 26px rgba(224,162,60,.28);
    transition:opacity .5s;}
  .stamp{position:fixed;bottom:10px;left:12px;z-index:6;font-size:10px;
    letter-spacing:1.5px;color:#8a5a24;text-transform:uppercase;}
  .tally{position:fixed;bottom:10px;right:12px;z-index:6;font-size:10px;
    letter-spacing:1px;color:#e0a23c;opacity:.85;text-align:right;
    text-shadow:0 0 8px rgba(224,162,60,.35);}
  .foot{position:fixed;bottom:26px;left:0;right:0;z-index:6;text-align:center;
    font-size:10px;letter-spacing:1px;pointer-events:none;}
  .foot a{color:#8a5a24;text-decoration:none;border-bottom:1px dotted #8a5a24;pointer-events:auto;}
  .foot a:hover{color:#e0a23c;border-color:#e0a23c;}
</style>
</head>
<body>
<canvas id="plate"></canvas>
<div class="scan"></div>
<div class="caption" id="cap">Ready? Give the plate a bow — drag up or down the edge and listen!</div>
<div class="stamp">Plate&nbsp;No.&nbsp;4 · brass · a bow · sand</div>
<div class="tally" id="tally">FIGURES DRAWN ON THIS PLATE: 0</div>
<div class="foot"><a href="/archive">more from the bench &rarr;</a></div>

<script>
(function(){
  "use strict";
  const cv=document.getElementById('plate'), ctx=cv.getContext('2d');
  const capEl=document.getElementById('cap'), tallyEl=document.getElementById('tally');
  const PI=Math.PI, MINF=110, MAXF=880;

  // --- geometry ---
  let W,H,DPR, pX0,pY0,pS;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    pS=Math.min(W,H)*0.86; pX0=(W-pS)/2; pY0=(H-pS)/2;
    bgGrad=null;
  }
  window.addEventListener('resize',resize);

  // --- the plate's modes (each note stands up its own web of nodal lines) ---
  // A(x,y) = cos(nπx)cos(mπy) - cos(mπx)cos(nπy)  -> always a node dead center.
  const modes=[
    {n:1,m:2,f:110},{n:1,m:3,f:172},{n:2,m:3,f:236},{n:1,m:4,f:298},
    {n:2,m:4,f:356},{n:3,m:4,f:424},{n:1,m:5,f:494},{n:2,m:5,f:556},
    {n:3,m:5,f:628},{n:4,m:5,f:706},{n:2,m:6,f:788},{n:3,m:6,f:862}
  ];
  function amp(x,y,md){
    return Math.cos(md.n*PI*x)*Math.cos(md.m*PI*y)
         - Math.cos(md.m*PI*x)*Math.cos(md.n*PI*y);
  }
  function nearestMode(f){
    let bi=0,bd=1e9;
    for(let i=0;i<modes.length;i++){const d=Math.abs(f-modes[i].f); if(d<bd){bd=d;bi=i;}}
    return {i:bi,d:bd};
  }

  // --- sand grains ---
  const N=650;
  const grains=[];
  function rnd(a,b){return a+Math.random()*(b-a);}
  for(let i=0;i<N;i++){
    grains.push({
      x:rnd(0.03,0.97), y:rnd(0.03,0.97), vx:0, vy:0,
      settled:false, b:rnd(-18,26), red:false
    });
  }
  // the one dark, slightly heavier grain — starts by the middle, rides the still point home
  grains[0].red=true; grains[0].x=0.5+rnd(-0.03,0.03); grains[0].y=0.5+rnd(-0.03,0.03);

  // --- state ---
  let freq=236, modeIndex=nearestMode(freq).i, res=0;
  let dragging=false, lastInteract=-99999, countFlash=-99999;
  let tally=0;
  try{const s=localStorage.getItem('chladni.figures'); if(s!=null) tally=parseInt(s,10)||0;}catch(e){}
  tallyEl.textContent='FIGURES DRAWN ON THIS PLATE: '+tally;
  let lastCounted=-1;

  // --- audio: a bowed note sung at exactly the drive pitch ---
  let AC=null, osc=null, filt=null, master=null, lfo=null, trem=null, tremGain=null;
  function ensureAudio(){
    if(AC) return;
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      osc=AC.createOscillator(); osc.type='sawtooth';
      filt=AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=freq*4.5; filt.Q.value=0.8;
      master=AC.createGain(); master.gain.value=0.0001;
      // gentle bow vibrato
      lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=5.2;
      const lg=AC.createGain(); lg.gain.value=2.6; lfo.connect(lg); lg.connect(osc.frequency);
      // soft tremolo for bow grain
      trem=AC.createOscillator(); trem.type='sine'; trem.frequency.value=7.3;
      tremGain=AC.createGain(); tremGain.gain.value=0.012; trem.connect(tremGain); tremGain.connect(master.gain);
      osc.frequency.value=freq;
      osc.connect(filt); filt.connect(master); master.connect(AC.destination);
      osc.start(); lfo.start(); trem.start();
    }catch(e){AC=null;}
  }
  function updateAudio(now){
    if(!AC) return;
    if(AC.state==='suspended') AC.resume();
    osc.frequency.setTargetAtTime(freq, AC.currentTime, 0.05);
    filt.frequency.setTargetAtTime(freq*4.5, AC.currentTime, 0.05);
    const idle = now - lastInteract > 7000;
    master.gain.setTargetAtTime(idle?0.0001:0.052, AC.currentTime, 0.2);
  }

  // --- input ---
  function interact(now){ lastInteract=now; }
  function setFromClientY(cy){
    const t=Math.max(0,Math.min(1,(cy-pY0)/pS));
    freq=MAXF + t*(MINF-MAXF);
  }
  cv.addEventListener('pointerdown',e=>{ ensureAudio(); dragging=true; interact(performance.now());
    setFromClientY(e.clientY); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(dragging){ setFromClientY(e.clientY); interact(performance.now()); } });
  cv.addEventListener('pointerup',()=>{ dragging=false; });
  cv.addEventListener('pointercancel',()=>{ dragging=false; });
  window.addEventListener('wheel',e=>{ ensureAudio(); freq=Math.max(MINF,Math.min(MAXF,freq - e.deltaY*0.4));
    interact(performance.now()); e.preventDefault(); },{passive:false});
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){ ensureAudio(); freq=Math.min(MAXF,freq+6); interact(performance.now()); e.preventDefault(); }
    else if(e.key==='ArrowDown'){ ensureAudio(); freq=Math.max(MINF,freq-6); interact(performance.now()); e.preventDefault(); }
  });

  // --- captions (bright kids'-TV host, one line at a time) ---
  const CAP={
    idle:["Ready? Give the plate a bow — drag up or down the edge and listen!",
          "Go on, bow it! Drag along the edge and watch what the sand does!"],
    buzz:["Hear her buzz? The sand's all a-jitter — tune it a hair till it SNAPS!",
          "Not quite a note yet — nudge the pitch and feel it hunting for the shape!",
          "So close! Ease it up or down till the sand quits hopping and picks a side!"],
    forming:["Watch the sand — WATCH it — hopping off the humps and running for the still lines!",
             "There it goes! Off the heaving spots, straight for the lines that never move!",
             "See it migrate? Nowhere to rest but the quiet lines — here she comes!"],
    fresh:["THERE! Clean into lines — that's the very shape of the note, drawn in sand!",
           "HA! Snapped it! Every grain home on a nodal line — look at that figure!",
           "Would you LOOK at that! The sand drew the standing wave all by itself!"],
    hold:["See the lines the sand won't leave? Now push it HIGHER — what'll she draw next?",
          "That's the figure for this note! Take it up a step and break it into a finer one!",
          "Hold that one — now drive it up and watch the whole web re-knit tighter!"]
  };
  let capKey='', capText='';
  function pick(key){
    const arr=CAP[key]; const t=arr[modeIndex % arr.length];
    if(key!==capKey || t!==capText){ capKey=key; capText=t; capEl.textContent=t; }
  }

  // --- simulation ---
  const h=0.006;
  function absamp(x,y,md){return Math.abs(amp(x,y,md));}
  function update(now){
    const nm=nearestMode(freq);
    res=Math.max(0,Math.min(1,1 - nm.d/28));
    if(nm.i!==modeIndex){ modeIndex=nm.i; for(const g of grains) g.settled=false; }
    const md=modes[modeIndex];
    const restless = res<0.42;

    const jitterK=0.0030*(1+(1-res)*1.6);
    const driftK =0.0052*(0.25+res*0.9);
    let settledN=0;

    for(let i=0;i<grains.length;i++){
      const g=grains[i];
      if(g.settled && !restless){ settledN++; continue; }
      if(restless) g.settled=false;

      const a0=absamp(g.x,g.y,md)/2;         // 0..1 local heave
      // amplitude gradient -> push toward the still (low-amplitude) lines
      const gx=(absamp(g.x+h,g.y,md)-absamp(g.x-h,g.y,md))/(2*h);
      const gy=(absamp(g.x,g.y+h,md)-absamp(g.x,g.y-h,md))/(2*h);
      const gm=Math.hypot(gx,gy)+1e-6;

      const jm = g.red?0.35:1, dm = g.red?0.8:1;
      g.vx += (Math.random()-0.5)*jitterK*a0*jm - (gx/gm)*driftK*a0*dm;
      g.vy += (Math.random()-0.5)*jitterK*a0*jm - (gy/gm)*driftK*a0*dm;

      if(g.red){ // the heavy one rides the center's still point home
        g.vx += (0.5-g.x)*0.0032; g.vy += (0.5-g.y)*0.0032;
      }

      const fr = g.red?0.80:0.865;
      g.vx*=fr; g.vy*=fr;
      g.x+=g.vx; g.y+=g.vy;

      if(g.x<0.02){g.x=0.02;g.vx*=-0.3;} if(g.x>0.98){g.x=0.98;g.vx*=-0.3;}
      if(g.y<0.02){g.y=0.02;g.vy*=-0.3;} if(g.y>0.98){g.y=0.98;g.vy*=-0.3;}

      const sp=Math.hypot(g.vx,g.vy);
      if(res>0.55 && a0<0.11 && sp<0.0007){ g.settled=true; g.vx=0; g.vy=0; }
      if(g.settled) settledN++;
    }

    const frac=settledN/grains.length;

    // count a fresh, stable, symmetric figure — only ever up, saved across visits
    if(res>0.72 && frac>0.62 && modeIndex!==lastCounted){
      tally++; lastCounted=modeIndex; countFlash=now;
      try{localStorage.setItem('chladni.figures',String(tally));}catch(e){}
      tallyEl.textContent='FIGURES DRAWN ON THIS PLATE: '+tally;
    }

    // caption
    if(!AC) pick('idle');
    else if(now-countFlash<1600) pick('fresh');
    else if(restless) pick('buzz');
    else if(frac>0.6) pick('hold');
    else pick('forming');
  }

  // --- render ---
  let bgGrad=null;
  function draw(){
    ctx.fillStyle='#0b0805'; ctx.fillRect(0,0,W,H);
    if(!bgGrad){
      bgGrad=ctx.createRadialGradient(pX0+pS*0.45,pY0+pS*0.38,pS*0.05,pX0+pS*0.5,pY0+pS*0.5,pS*0.85);
      bgGrad.addColorStop(0,'#1c150d'); bgGrad.addColorStop(0.6,'#161009'); bgGrad.addColorStop(1,'#0f0b07');
    }
    // beveled bronze edge
    ctx.fillStyle='#3a2611'; roundRect(pX0-7,pY0-7,pS+14,pS+14,6); ctx.fill();
    const bev=ctx.createLinearGradient(pX0,pY0,pX0+pS,pY0+pS);
    bev.addColorStop(0,'#a06a2c'); bev.addColorStop(0.5,'#5c3a17'); bev.addColorStop(1,'#8a5a24');
    ctx.fillStyle=bev; roundRect(pX0-4,pY0-4,pS+8,pS+8,4); ctx.fill();
    // plate face
    ctx.fillStyle=bgGrad; roundRect(pX0,pY0,pS,pS,3); ctx.fill();
    // clamp at dead center
    ctx.fillStyle='#20180e'; ctx.beginPath();
    ctx.arc(pX0+pS*0.5,pY0+pS*0.5,pS*0.018,0,7); ctx.fill();

    // sand
    ctx.save();
    ctx.beginPath(); roundRect(pX0,pY0,pS,pS,3); ctx.clip();
    let redPx=0,redPy=0;
    for(let i=0;i<grains.length;i++){
      const g=grains[i];
      const px=pX0+g.x*pS, py=pY0+g.y*pS;
      if(g.red){ redPx=px; redPy=py; continue; }
      // light rakes from upper-left: grains brighter toward it
      const rake=((1-g.x)+(1-g.y))*0.5;
      const l=Math.max(120,Math.min(240,168+g.b+rake*34));
      ctx.fillStyle='rgb('+l+','+Math.round(l*0.85)+','+Math.round(l*0.6)+')';
      ctx.fillRect(px-1,py-1,2.1,2.1);
    }
    // the dark reddish grain, drawn last, a touch larger — never fussed over
    ctx.fillStyle='#7a2c1c';
    ctx.beginPath(); ctx.arc(redPx,redPy,1.9,0,7); ctx.fill();
    ctx.restore();

    // the bow, poised along the left edge at the pitch you're driving
    const t=(MAXF-freq)/(MAXF-MINF);
    const by=pY0+t*pS;
    const wob=(dragging?Math.sin(performance.now()*0.03)*1.6:0);
    ctx.save();
    ctx.lineCap='round';
    const bx=pX0-2;
    // bow stick
    const bg=ctx.createLinearGradient(bx-pS*0.14,by-46,bx+8,by+46);
    bg.addColorStop(0,'#c98a3e'); bg.addColorStop(0.5,'#8a5a24'); bg.addColorStop(1,'#5c3a17');
    ctx.strokeStyle=bg; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(bx-pS*0.14,by-58); ctx.lineTo(bx+6,by+58+wob); ctx.stroke();
    // bow hair
    ctx.strokeStyle='rgba(230,215,176,0.8)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(bx-pS*0.14+3,by-56); ctx.lineTo(bx+3,by+56+wob); ctx.stroke();
    ctx.restore();

    // hot studio-lamp bloom over the top
    ctx.save(); ctx.globalCompositeOperation='screen';
    const gl=ctx.createRadialGradient(pX0+pS*0.42,pY0+pS*0.3,10,pX0+pS*0.42,pY0+pS*0.3,pS*0.7);
    gl.addColorStop(0,'rgba(224,162,60,0.10)'); gl.addColorStop(1,'rgba(224,162,60,0)');
    ctx.fillStyle=gl; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function loop(now){
    update(now); updateAudio(now); draw();
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
  console.log("%cBrass, sand, a bow, and standing waves. Push the pitch up — see what she draws next!","color:#e0a23c");
})();
</script>

<script src="/nav.js" defer></script>
