<meta charset="utf-8">

<title>The Illuminator's Desk — Gild Any Letter You Like</title>
<style>
/* the parchment is scaled goat, and it remembers being an animal — hence the grain */
:root{
  --gold:#d9a441; --gold-lt:#f6dd8f; --ink:#3a2a17; --parch:#f4e7c9;
}
*{box-sizing:border-box}
body{
  margin:0; padding:26px 16px 40px;
  background:
    radial-gradient(circle at 50% -10%, #4a3720 0%, #2a1f12 45%, #140f09 100%);
  color:#e8d9b6;
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  -webkit-text-size-adjust:100%;
}
.desk{max-width:480px;margin:0 auto}
header{text-align:center;margin-bottom:20px}
h1{
  margin:0 0 6px; font-size:clamp(20px,5.4vw,27px); font-weight:400;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-lt);
  text-shadow:0 1px 0 #7a5a1c, 0 0 22px rgba(217,164,65,.35);
}
h1 .amp{color:#c1362b;font-style:italic;text-transform:none;letter-spacing:0}
.sub{margin:0;font-size:13.5px;font-style:italic;color:#b9a37c;line-height:1.5}
svg.plate{width:100%;height:auto;display:block;border-radius:2px;
  box-shadow:0 22px 46px rgba(0,0,0,.65), 0 0 0 1px rgba(180,145,74,.55);}
.margin-note{
  margin:14px 2px 0; text-align:center; font-size:13px; font-style:italic;
  color:#c8b48b; min-height:2.6em; line-height:1.4;
}
.margin-note b{font-style:normal;font-weight:400;color:var(--gold);letter-spacing:.05em}
.rack{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:18px 0 4px}
button{
  font-family:inherit; font-size:15px; width:32px; height:32px; padding:0;
  color:#e8d9b6; background:rgba(255,255,255,.03);
  border:1px solid rgba(217,164,65,.4); border-radius:2px; cursor:pointer;
  transition:background .16s, color .16s, transform .12s;
}
button:hover{background:rgba(217,164,65,.18)}
button:active{transform:translateY(1px)}
button.on{background:var(--gold);color:#2a1f12;border-color:var(--gold-lt);font-weight:bold}
.again{width:auto;padding:0 16px;height:34px;letter-spacing:.1em;font-size:12px;text-transform:uppercase;margin-top:10px;display:block;margin-left:auto;margin-right:auto}
footer{
  margin:30px auto 0; max-width:480px; text-align:center;
  font-size:11.5px; letter-spacing:.08em; color:#8b7952;
}
footer a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(217,164,65,.5)}
footer a:hover{color:var(--gold-lt)}
</style>
</head>
<body>
<div class="desk">
<header>
  <h1>The Illuminator's Desk</h1>
  <p class="sub">Twenty-six capitals, gilded on request.<br>Press a letter — or simply type one.</p>
</header>

<svg class="plate" id="plate" viewBox="0 0 400 520" role="img"
     aria-label="An illuminated manuscript capital on parchment, framed in gold, with vine scrollwork and a small animal drawn in the lower margin.">
  <defs>
    <!-- 23.5 carat; the missing half carat is on loan to the sun -->
    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fdf0bd"/><stop offset=".42" stop-color="#e3b34e"/>
      <stop offset=".58" stop-color="#a8761b"/><stop offset="1" stop-color="#f4d888"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/></filter>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="1.1" fill="#f4e7c9" opacity=".3"/></pattern>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.6" flood-color="#6b4a12" flood-opacity=".45"/></filter>
  </defs>

  <rect width="400" height="520" fill="#f4e7c9"/>
  <rect width="400" height="520" fill="#f4e7c9" filter="url(#grain)"/>
  <rect x="22" y="22" width="356" height="476" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <rect x="29" y="29" width="342" height="462" fill="none" stroke="#c1362b" stroke-width="0.8" opacity=".7"/>

  <g id="vines"></g>
  <rect id="field" x="78" y="110" width="244" height="244" fill="#1e3f8f"/>
  <rect x="78" y="110" width="244" height="244" fill="url(#dots)"/>
  <rect x="78" y="110" width="244" height="244" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text id="glyph" x="200" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia,'Times New Roman',serif" font-size="188"
        fill="url(#gold)" stroke="#5b3d11" stroke-width="1.4" filter="url(#lift)">A</text>

  <line x1="96" y1="404" x2="304" y2="404" stroke="#c1362b" stroke-width="0.7" opacity=".6"/>
  <text id="cap1" x="200" y="424" text-anchor="middle" font-size="13" letter-spacing="1.6"
        fill="#8a5a12" font-family="Georgia,serif">A is for Amber</text>
  <text id="cap2" x="200" y="441" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#3a2a17" font-family="Georgia,serif">warmed until it lets go of the light it kept.</text>

  <g id="marg"></g>
  <text x="200" y="509" text-anchor="middle" font-size="5.6" fill="#9c8656" letter-spacing=".7"
        font-family="Georgia,serif">begun by candle · corrected by daylight · the snail is still ahead on points</text>
</svg>

<p class="margin-note" id="note"></p>

<div class="rack" id="rack"></div>
<button class="again" id="again">Gild it again</button>
</div>

<footer>
  <a href="/archive">Other plates finished at this desk</a>
</footer>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

var PIG={
 A:["Amber","warmed until it lets go of the light it kept."],
 B:["Bell-bronze","poured on a Tuesday, ringing ever since."],
 C:["Cochineal","a red that began as one stubborn little insect."],
 D:["Dawn","which nobody has yet learned to grind into powder."],
 E:["Eggshell","cracked for the yolk, kept for the tempera."],
 F:["Fig-leaf green","picked low down, before the wasps woke."],
 G:["Gold","beaten to a breath, laid down with a held one."],
 H:["Honey","thinned with rainwater, sweetening the size."],
 I:["Indigo","which stains the hands of everyone who loves it."],
 J:["Juniper smoke","for the blue-black of a raven's shoulder."],
 K:["Kettle-black","humblest and most necessary of the pigments."],
 L:["Lapis","hauled over mountains to become one small sky."],
 M:["Malachite","a green with a stone's firm opinion about it."],
 N:["Nutgall","ink that outlives the hand that dipped for it."],
 O:["Ochre","older than the alphabet it has agreed to serve."],
 P:["Pearl-white","scraped from shell, flattered by candlelight."],
 Q:["Quince yellow","the exact colour of patience in a bowl."],
 R:["Rose madder","coaxed from a root that never saw a rose."],
 S:["Saffron","three threads and a whole afternoon's wages."],
 T:["Terre verte","the green hidden beneath every good face."],
 U:["Umber","burnt on purpose, and much the better for it."],
 V:["Vermilion","loud, lovely, and slightly dangerous to keep."],
 W:["Walnut","for the shadow that softens a stern letter."],
 X:["Xanthic yellow","a bee's back leg, after a field of clover."],
 Y:["Yolk","the binder of very nearly everything worth keeping."],
 Z:["Zaffre","cobalt's blue temper, cooled down into glass."]
};
var FIELDS=[{bg:"#1e3f8f",v:"#f4e7c9"},{bg:"#a4302a",v:"#f7ecd0"},
            {bg:"#2c6b57",v:"#f7ecd0"},{bg:"#7b2f57",v:"#f4e7c9"},{bg:"#2a2f4f",v:"#efe0bd"}];

function spiral(cx,cy,a0,r0,turns,dir){
  var d="",n=Math.ceil(turns*18),i,t,r,th,x,y;
  for(i=0;i<=n;i++){
    t=i/n*turns*Math.PI*2; r=r0*Math.exp(-0.30*t); th=a0+dir*t;
    x=cx+Math.cos(th)*r; y=cy+Math.sin(th)*r;
    d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }
  return d;
}
function tendril(g,x0,y0,dx,dy,len,side,col){
  var px=-dy*side, py=dx*side;
  var ex=x0+dx*len+px*len*0.55, ey=y0+dy*len+py*len*0.55;
  var cx=x0+dx*len*0.55+px*len*0.15, cy=y0+dy*len*0.55+py*len*0.15;
  g.appendChild(el("path",{d:"M"+x0+" "+y0+"Q"+cx.toFixed(1)+" "+cy.toFixed(1)+" "+ex.toFixed(1)+" "+ey.toFixed(1),
    fill:"none",stroke:col,"stroke-width":1.9,"stroke-linecap":"round"}));
  var a0=Math.atan2(cy-ey,cx-ex);
  g.appendChild(el("path",{d:spiral(ex,ey,a0,9.5,1.7,side),fill:"none",stroke:col,"stroke-width":1.6,"stroke-linecap":"round"}));
  [0.38,0.68].forEach(function(t){
    var bx=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*ex, by=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*ey;
    var tx=2*(1-t)*(cx-x0)+2*t*(ex-cx), ty=2*(1-t)*(cy-y0)+2*t*(ey-cy);
    var ang=Math.atan2(ty,tx)*180/Math.PI+side*62, s=rnd(0.5,0.78);
    g.appendChild(el("path",{d:"M0 0C6 -7 16 -6 21 0C16 6 6 7 0 0Z",fill:col,opacity:.92,
      transform:"translate("+bx.toFixed(1)+","+by.toFixed(1)+") rotate("+ang.toFixed(1)+") scale("+s.toFixed(2)+")"}));
  });
  g.appendChild(el("circle",{cx:ex.toFixed(1),cy:ey.toFixed(1),r:2.1,fill:"url(#gold)"}));
}

var BEASTS=[
 {cap:"A snail, undefeated in every argument it has ever entered.",
  p:[["M6 36C1 33 4 25 12 25C21 25 25 32 37 33C44 33.5 46 36 41 37Z","f",0],
     ["SPIRAL","s",0],["M11 25L7 15M15 25L15 14","s",1.5],
     ["M7 15a1.6 1.6 0 1 0 .1 0","f",0],["M15 14a1.6 1.6 0 1 0 .1 0","f",0]]},
 {cap:"A hare, announcing nothing in particular, beautifully.",
  p:[["M20 38C10 38 7 27 15 22C22 18 31 22 31 30C31 36 26 38 20 38Z","f",0],
     ["M29 25C28 18 34 15 38 19C41 22 39 28 33 28Z","f",0],
     ["M33 17C31 7 33 3 36 3C39 4 38 12 37 17M38 17C38 9 41 4 43 6C45 9 42 13 41 18","s",1.6],
     ["M40 23L55 15L55 28Z","f",0],["M12 34L6 39M20 38L18 42","s",1.5]]},
 {cap:"A bird who has quietly memorised the entire page.",
  p:[["M14 30C9 20 20 11 31 14C41 17 45 24 40 30C33 36 20 36 14 30Z","f",0],
     ["M23 19C30 17 38 20 41 26C34 28 25 25 23 19Z","s",1.6],
     ["M13 23L2 25L13 29Z","f",0],
     ["M40 27C48 23 53 21 56 18C53 27 47 32 40 31Z","f",0],
     ["M22 33L20 40M30 33L30 40","s",1.5],["M19 21a1.5 1.5 0 1 0 .1 0","f",0]]},
 {cap:"A fish, out for a walk, entirely at its own risk.",
  p:[["M9 22C15 11 34 11 42 22C34 33 15 33 9 22Z","f",0],
     ["M9 22L0 13L2 22L0 31Z","f",0],
     ["M18 31L15 39M26 32L26 39M34 31L37 39","s",1.6],
     ["M35 19a1.5 1.5 0 1 0 .1 0","f",0],["M24 13C24 8 28 6 30 9","s",1.4]]},
 {cap:"A dog, asleep in the margin, where the ink stays warmest.",
  p:[["M30 37C14 38 6 29 11 20C16 11 30 9 37 16C42 21 39 28 32 28C27 28 25 23 28 20","f",0],
     ["M13 16C9 11 12 7 16 9C19 11 17 16 14 17Z","f",0],
     ["M27 20C29 18 32 18 34 20","s",1.4],
     ["M38 26C45 25 48 21 47 17","s",1.4]]}
];

var vines=document.getElementById("vines"),marg=document.getElementById("marg"),
    field=document.getElementById("field"),glyph=document.getElementById("glyph"),
    cap1=document.getElementById("cap1"),cap2=document.getElementById("cap2"),
    note=document.getElementById("note"),rack=document.getElementById("rack"),
    LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),current="A";

var ANCHORS=[[200,110,0,-1,50],[78,232,-1,0,32],[322,232,1,0,32],[200,354,0,1,34],
             [78,110,-.7,-.7,40],[322,110,.7,-.7,40],[78,354,-.7,.7,40],[322,354,.7,.7,40]];

function render(L){
  current=L; clear(vines); clear(marg);
  var pal=pick(FIELDS);
  field.setAttribute("fill",pal.bg);
  glyph.textContent=L;
  ANCHORS.forEach(function(a){
    tendril(vines,a[0],a[1],a[2],a[3],a[4]*rnd(.85,1.1),1,pal.v);
    tendril(vines,a[0],a[1],a[2],a[3],a[4]*rnd(.8,1.05),-1,"#8a5a12");
  });
  var b=pick(BEASTS), g=el("g",{transform:"translate("+rnd(70,300).toFixed(0)+",450) scale(.92)"}),
      ink="#4a3319", body=pal.bg;
  var t=el("title"); t.textContent=b.cap; g.appendChild(t);
  b.p.forEach(function(p){
    var d=p[0]==="SPIRAL"?spiral(28,17,0.4,13.5,2.1,1):p[0];
    g.appendChild(el("path",{d:d,fill:p[1]==="f"?body:"none",stroke:ink,
      "stroke-width":p[2]||1.1,"stroke-linecap":"round","stroke-linejoin":"round"}));
  });
  marg.appendChild(g);
  cap1.textContent=L+" is for "+PIG[L][0];
  cap2.textContent=PIG[L][1];
  note.innerHTML="<b>In the margin:</b> "+b.cap;
  Array.prototype.forEach.call(rack.children,function(btn){
    btn.className=(btn.textContent===L)?"on":"";
  });
}

LETTERS.forEach(function(L){
  var b=document.createElement("button");
  b.type="button"; b.textContent=L; b.title="Gild the letter "+L;
  b.addEventListener("click",function(){render(L);});
  rack.appendChild(b);
});
document.getElementById("again").addEventListener("click",function(){render(current);});
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=(e.key||"").toUpperCase();
  if(k.length===1&&k>="A"&&k<="Z")render(k);
});
render("A");
console.log("%cGold leaf is laid on a breath. Breathe on the size — never on the leaf.",
  "color:#d9a441;font-size:13px;font-family:Georgia,serif");
console.log("%cThe brush is one squirrel hair, charged with static from your own head.",
  "color:#b9a37c;font-style:italic;font-family:Georgia,serif");
})();
</script>

<script src="/nav.js" defer></script>
</body>
