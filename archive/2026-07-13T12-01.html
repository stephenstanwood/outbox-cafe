<title>The Meadow Answers Every Tap</title>
<style>
  /* nothing here grows on its own. it waits to be asked. that is the whole trick. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #4a3b52;
    overflow: hidden;
    background: #b9a7e0;
    user-select: none;
  }
  #scene { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #sky {
    flex: 1 1 auto;
    position: relative;
    background:
      radial-gradient(120% 90% at 78% -10%, #fff3d0 0%, rgba(255,243,208,0) 42%),
      linear-gradient(#ffd8a3 0%, #ffbfbf 34%, #e5b6d8 66%, #c3add8 100%);
    overflow: hidden;
  }
  #sun {
    position: absolute; top: 6%; right: 14%;
    width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(#fffdf3, #ffe6a8 60%, rgba(255,230,168,0));
    filter: blur(1px); animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.08); opacity: .9; } }
  .pollen {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,.7);
    animation: drift 14s linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(0) translateX(0); opacity: 0; }
    10%,90% { opacity: .8; }
    to { transform: translateY(60vh) translateX(30px); opacity: 0; }
  }
  #field {
    flex: 0 0 52%;
    position: relative;
    background:
      radial-gradient(140% 60% at 50% 0%, #a9d17a 0%, #7cbb63 40%, #4f9a58 100%);
    box-shadow: inset 0 8px 22px rgba(80,120,50,.35);
    cursor: crosshair;
    overflow: hidden;
  }
  .flower { position: absolute; transform-origin: bottom center; }
  .grow { animation: sprout .9s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes sprout { from { transform: scale(0); } to { transform: scale(1); } }
  .flower svg { display: block; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  #banner {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.82); color: #6a4a72;
    padding: 8px 18px; border-radius: 999px; font-size: 15px;
    box-shadow: 0 4px 14px rgba(120,90,140,.25);
    max-width: 90vw; text-align: center; pointer-events: none;
    transition: opacity .4s; letter-spacing: .2px;
  }
  #count { font-variant-numeric: tabular-nums; font-weight: bold; }
  footer {
    position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: rgba(255,255,255,.85);
    text-shadow: 0 1px 3px rgba(40,80,30,.5);
  }
  footer a { color: #fff; text-decoration: underline dotted; }
</style>
</head>
<body>
<div id="scene">
  <div id="sky" aria-hidden="true">
    <div id="sun" title="it has been up all morning, holding the door for you"></div>
  </div>
  <div id="field" role="button" aria-label="A soft green meadow. Tap the grass and a flower will grow where you touched it."></div>
</div>

<div id="banner">Tap the grass. Something is waiting to become a flower.</div>

<footer>
  <span id="count">0</span> blooms and counting ·
  <a href="/archive">wander back through the other gardens</a>
  <!-- the meadow never keeps a flower once you leave. it grows them fresh, only for whoever is here. -->
</footer>

<script>
  const field = document.getElementById('field');
  const banner = document.getElementById('banner');
  const counter = document.getElementById('count');
  let planted = 0;

  const notes = [
    "Someone will love that exact one.",
    "That color has no name yet. You just made it.",
    "The bees noticed.",
    "Yes. There. Perfect.",
    "It leaned toward you as it opened.",
    "A little braver than the last.",
    "The field says thank you.",
    "Warm all the way down to the root.",
    "That one will still be here at dusk, in memory.",
    "Plant another. Go on, be greedy with it."
  ];

  // sprinkle drifting pollen in the sky
  const sky = document.getElementById('sky');
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'pollen';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * -40 + '%';
    p.style.animationDelay = (-Math.random() * 14) + 's';
    p.style.animationDuration = (10 + Math.random() * 8) + 's';
    sky.appendChild(p);
  }

  function flowerSVG(hue) {
    const petals = 5 + Math.floor(Math.random() * 4);
    let p = '';
    for (let i = 0; i < petals; i++) {
      const a = i * 360 / petals;
      const light = 66 + Math.random() * 10;
      p += `<ellipse cx="50" cy="40" rx="8.5" ry="20" fill="hsl(${hue} 82% ${light}%)" transform="rotate(${a} 50 62)"/>`;
    }
    const leafSide = Math.random() > .5 ? 1 : -1;
    return `<svg width="100%" height="100%" viewBox="0 0 100 240" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 235 Q${50 + leafSide * 4} 150 50 78" stroke="#3f8a4a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M50 160 q${leafSide * 26} -6 ${leafSide * 30} 16 q${-leafSide * 20} 4 ${-leafSide * 30} -16z" fill="#4d9c55"/>
      ${p}
      <circle cx="50" cy="62" r="11" fill="hsl(${(hue + 30) % 360} 85% 62%)"/>
      <circle cx="50" cy="62" r="5" fill="hsl(${(hue + 45) % 360} 90% 74%)"/>
    </svg>`;
  }

  function plant(clientX, clientY) {
    const rect = field.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    if (x < 0 || x > rect.width || y < 0 || y > rect.height) return;

    // farther up the field = smaller and softer (a little depth)
    const depth = y / rect.height;              // 0 back .. 1 front
    const scale = 0.42 + depth * 0.8;
    const w = 46 * scale;
    const h = w * 2.4;
    const hue = Math.floor(Math.random() * 360);

    const el = document.createElement('div');
    el.className = 'flower grow';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = (x - w / 2) + 'px';
    el.style.top = (y - h) + 'px';
    el.style.zIndex = Math.round(y);
    el.style.filter = `saturate(${0.7 + depth * 0.5}) brightness(${0.86 + depth * 0.18})`;
    el.innerHTML = flowerSVG(hue);
    const svg = el.firstElementChild;
    svg.style.animationDelay = (-Math.random() * 4) + 's';
    svg.style.animationDuration = (3.4 + Math.random() * 2) + 's';
    field.appendChild(el);
    if (field.children.length > 320) field.removeChild(field.firstElementChild);

    planted++;
    counter.textContent = planted;
    banner.textContent = notes[Math.floor(Math.random() * notes.length)];
    banner.style.opacity = 1;
  }

  field.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    plant(e.clientX, e.clientY);
  });

  console.log('%c🌼 The gardener left a note:', 'font-size:14px');
  console.log('Every flower here is grown to order and forgotten on purpose. Nothing is saved, so nothing can wilt. Come back and the field will be empty and glad to see you.');
</script>

<script src="/nav.js" defer></script>
</body>
