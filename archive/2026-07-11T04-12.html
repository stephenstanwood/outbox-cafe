<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throw and Clack</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#33261a;overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #loom{display:block;width:100vw;height:100vh;}
  .beamtext{position:fixed;bottom:5px;z-index:5;font-size:10px;letter-spacing:2px;
    color:#c8ab72;text-shadow:0 1px 0 #241a10, 0 -1px 0 #6a4a2c;pointer-events:none;}
  #stamp{left:14px;text-transform:uppercase;font-family:"Courier New",monospace;font-weight:bold;}
  #rest{right:14px;pointer-events:auto;}
  #rest a{color:#c8ab72;text-decoration:none;border-bottom:1px dotted #8a6a3c;}
  #rest a:hover{color:#e6dabf;}
</style>
</head>
<body>
<canvas id="loom"></canvas>
<div id="stamp" class="beamtext">cloth woven at this loom: 0 in</div>
<div id="rest" class="beamtext"><a href="/archive">the rest of the bolt</a></div>
<script>
(function(){
"use strict";
const HEATHER="#6a4a7c", GOLD="#e0aa2e", CREAM="#e6dabf", PEAT="#33261a", MADDER="#a5341f";
const WOOD="#4a3524", WOODLT="#6a4a2c", BRASS="#8a6a3c";
const cv=document.getElementById("loom"), ctx=cv.getContext("2d");
const stampEl=document.getElementById("stamp");

// ---- persistent tally ----
let inches = parseInt(localStorage.getItem("loom_inches")||"0",10); if(isNaN(inches))inches=0;
let inchFrac=0;
function saveInches(){ localStorage.setItem("loom_inches", String(inches)); }
function updateStamp(){ stampEl.textContent="cloth woven at this loom: "+inches+" in"; }
updateStamp();

// ---- geometry ----
let W,H,DPR,frameW,clothLeft,warpWidth,pickHeight,N,fellY,cap;
// ---- weave state ----
let warpVersions=[], picks=[], weftUnit=[], treadlingSeq=[0,1,2,3];
let tIndex=0, wIndex=0, dir=1, phase=0, beaterAnim=0;
let flawFrac=0.383, flawWarp=0;
const passDuration=720;

// ---- colour cache ----
const cCache=new Map();
function shade(hex,f){
  const q=Math.round(f*40)/40, key=hex+q;
  let v=cCache.get(key); if(v) return v;
  const n=parseInt(hex.slice(1),16);
  let r=Math.min(255,((n>>16)&255)*q), g=Math.min(255,((n>>8)&255)*q), b=Math.min(255,(n&255)*q);
  v="rgb("+(r|0)+","+(g|0)+","+(b|0)+")"; cCache.set(key,v); return v;
}
function tw(shaft,t){ return ((((shaft-t)%4)+4)%4)<2; } // 2/2 twill float

// ---- sett generation ----
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function makeStripes(){
  const pal=[CREAM,CREAM,HEATHER,GOLD,MADDER,CREAM,HEATHER,GOLD];
  const n=5+((Math.random()*4)|0), out=[];
  let last=null;
  for(let i=0;i<n;i++){
    let c=pick(pal); if(c===last)c=pick(pal); last=c;
    const w=(c===MADDER)?(1+((Math.random()*2)|0)):(2+((Math.random()*7)|0));
    out.push({c:c,w:w});
  }
  if(!out.some(s=>s.c===CREAM)) out[0].c=CREAM;
  return out;
}
function expand(stripes){ const a=[]; for(const s of stripes){ for(let i=0;i<s.w;i++)a.push(s.c);} return a; }
function symUnit(stripes){ const a=expand(stripes); return a.concat(a.slice(1,-1).reverse()); }
function makeTreadling(){
  return pick([[0,1,2,3],[0,1,2,3,2,1],[0,1,2,3,0,3,2,1],[3,2,1,0],[0,1,2,3,3,2,1,0]]).slice();
}
function buildWarpVersion(){
  const unit=symUnit(makeStripes());
  const colors=new Array(N), shafts=new Array(N), jit=new Array(N);
  for(let i=0;i<N;i++){
    colors[i]=unit[i%unit.length];
    shafts[i]=i%4;
    jit[i]=0.90+Math.random()*0.18;
  }
  colors[flawWarp]=MADDER; // the one deliberate off-key end, always madder
  return {colors:colors, shafts:shafts, jit:jit};
}
function newSett(){
  warpVersions.push(buildWarpVersion());
  weftUnit=symUnit(makeStripes());
  treadlingSeq=makeTreadling();
  tIndex=0; wIndex=0;
}
function curVer(){ return warpVersions[warpVersions.length-1]; }
function curTreadle(){ return treadlingSeq[tIndex%treadlingSeq.length]; }
function curWeftCol(){ return weftUnit[wIndex%weftUnit.length]; }

// ---- one pick ----
function commit(){
  picks.push({ v:warpVersions.length-1, t:curTreadle(), weft:curWeftCol(), pj:0.90+Math.random()*0.18 });
  tIndex++; wIndex++;
  beaterAnim=1; dir*=-1;
  if(picks.length>cap){
    picks.shift();
    inchFrac += pickHeight/96;
    while(inchFrac>=1){ inchFrac-=1; inches++; saveInches(); updateStamp(); }
    // keep referenced versions only
    const used=picks[0].v;
    while(warpVersions.length>1 && picks.every(p=>p.v>0)){
      warpVersions.shift();
      for(const p of picks)p.v--;
    }
  }
}

// ---- layout ----
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  frameW=Math.max(14,Math.round(W*0.02));
  warpWidth=Math.max(6,Math.round(W/68));
  const avail=W-2*frameW;
  N=Math.floor(avail/warpWidth);
  clothLeft=frameW+(avail-N*warpWidth)/2;
  pickHeight=Math.max(5,warpWidth-2);
  fellY=Math.round(H*0.74);
  cap=Math.ceil(fellY/pickHeight)+3;
  flawWarp=Math.max(1,Math.min(N-2,Math.floor(N*flawFrac)));
  // rebuild
  warpVersions=[]; picks=[]; tIndex=0; wIndex=0; dir=1; phase=0;
  newSett();
  for(let i=0;i<cap;i++) commit(); // pre-wind so cloth already fills to the top
}

// ---- pointer / reading-glass ----
let pointer={x:-999,y:-999,active:false};
let touchStart=null, touchMoved=false;
cv.addEventListener("mousemove",e=>{ pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; });
cv.addEventListener("mouseleave",()=>{ pointer.active=false; });
cv.addEventListener("touchstart",e=>{
  const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY,ts:Date.now()}; touchMoved=false;
  pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true;
},{passive:true});
cv.addEventListener("touchmove",e=>{
  const t=e.touches[0]; if(touchStart&&(Math.abs(t.clientX-touchStart.x)>8||Math.abs(t.clientY-touchStart.y)>8))touchMoved=true;
  pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true;
},{passive:true});
cv.addEventListener("touchend",()=>{
  if(touchStart && !touchMoved && Date.now()-touchStart.ts<320) newSett(); // tap throws a fresh sett
  pointer.active=false; touchStart=null;
});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.key===" "){ e.preventDefault(); newSett(); }
});
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(layout,150); });

// ---- cell lookup for the glass ----
function cellInfo(i,j){
  const M=picks.length;
  if(j<0||j>=M){
    const ver=curVer();
    return {over:tw(i%4,curTreadle()), warp:ver.colors[i], weft:curWeftCol(), wj:ver.jit[i], pj:1};
  }
  const p=picks[j], ver=warpVersions[p.v];
  return {over:tw(ver.shafts[i],p.t), warp:ver.colors[i], weft:p.weft, wj:ver.jit[i], pj:p.pj};
}

// ---- render ----
function drawFrameBeams(){
  // side beams
  const g=ctx.createLinearGradient(0,0,frameW,0);
  g.addColorStop(0,WOODLT); g.addColorStop(0.5,WOOD); g.addColorStop(1,"#3a2818");
  ctx.fillStyle=g; ctx.fillRect(0,0,frameW,H);
  const g2=ctx.createLinearGradient(W-frameW,0,W,0);
  g2.addColorStop(0,"#3a2818"); g2.addColorStop(0.5,WOOD); g2.addColorStop(1,WOODLT);
  ctx.fillStyle=g2; ctx.fillRect(W-frameW,0,frameW,H);
  // grain
  ctx.strokeStyle="rgba(30,20,10,0.4)"; ctx.lineWidth=1;
  for(let k=0;k<3;k++){ const x=4+k*(frameW/3);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+2,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-4-k*(frameW/3),0); ctx.lineTo(W-6-k*(frameW/3),H); ctx.stroke(); }
  // bottom beam
  const bh=26; const gb=ctx.createLinearGradient(0,H-bh,0,H);
  gb.addColorStop(0,WOODLT); gb.addColorStop(1,"#2c1e12");
  ctx.fillStyle=gb; ctx.fillRect(0,H-bh,W,bh);
  ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.fillRect(0,H-bh,W,2);
}

function render(){
  ctx.fillStyle=PEAT; ctx.fillRect(0,0,W,H);
  const M=picks.length;
  const shed=phase*pickHeight;

  // --- committed cloth (scrolling up off the top) ---
  for(let j=M-1;j>=0;j--){
    const yb=fellY-(M-1-j)*pickHeight-shed, yt=yb-pickHeight;
    if(yt> fellY) continue;
    if(yb< -pickHeight) break;
    const p=picks[j], ver=warpVersions[p.v], t=p.t, weft=p.weft, pj=p.pj;
    for(let i=0;i<N;i++){
      const x=clothLeft+i*warpWidth;
      const over=tw(ver.shafts[i],t);
      const base=over?ver.colors[i]:weft;
      ctx.fillStyle=shade(base, ver.jit[i]*pj);
      ctx.fillRect(x,yt,warpWidth+0.6,pickHeight+0.6);
    }
  }
  // faint warp striations for thread definition
  ctx.strokeStyle="rgba(30,20,10,0.10)"; ctx.lineWidth=1; ctx.beginPath();
  for(let i=0;i<=N;i++){ const x=clothLeft+i*warpWidth+0.5; ctx.moveTo(x,0); ctx.lineTo(x,fellY); }
  ctx.stroke();

  // --- the one off-key end, continuous up the whole cloth ---
  ctx.globalAlpha=0.34; ctx.fillStyle=MADDER;
  ctx.fillRect(clothLeft+flawWarp*warpWidth+warpWidth*0.32, 0, Math.max(1.5,warpWidth*0.36), fellY);
  ctx.globalAlpha=1;

  // --- forming pick in the gap at the fell ---
  const passed = dir===1 ? Math.floor(phase*N) : N-1-Math.floor(phase*N);
  const wcol=curWeftCol();
  for(let i=0;i<N;i++){
    const x=clothLeft+i*warpWidth;
    const isPassed = dir===1 ? i<=passed : i>=passed;
    const c = isPassed ? shade(wcol, curVer().jit[i]) : shade(curVer().colors[i],0.85);
    ctx.fillStyle=c;
    ctx.fillRect(x, fellY-shed, warpWidth+0.6, shed+0.6);
  }

  // --- beater / reed just above the fell ---
  const bnudge = beaterAnim*4;
  const beatY=fellY-pickHeight-3+bnudge;
  ctx.fillStyle=shade(WOOD, 0.9+beaterAnim*0.3);
  ctx.fillRect(clothLeft-2, beatY, N*warpWidth+4, 6);
  ctx.strokeStyle="rgba(230,218,191,0.18)"; ctx.lineWidth=1; ctx.beginPath();
  for(let i=0;i<N;i+=2){ const x=clothLeft+i*warpWidth+0.5; ctx.moveTo(x,beatY); ctx.lineTo(x,beatY+6); }
  ctx.stroke();
  if(beaterAnim>0) beaterAnim=Math.max(0,beaterAnim-0.08);

  // --- bare warp under tension below the fell (the open shed) ---
  const ct=curTreadle();
  for(let i=0;i<N;i++){
    const x=clothLeft+i*warpWidth;
    const over=tw(i%4,ct);
    ctx.fillStyle=shade(curVer().colors[i], over?1.06:0.80);
    const w=warpWidth*(over?0.62:0.42);
    ctx.fillRect(x+(warpWidth-w)/2, fellY, w, H-fellY);
  }

  // --- boat shuttle flying, trailing its weft ---
  const sx = clothLeft + (dir===1? phase : 1-phase) * (N*warpWidth);
  const sy = fellY+Math.max(10,pickHeight*1.6);
  const sel = dir===1 ? clothLeft : clothLeft+N*warpWidth;
  ctx.strokeStyle=shade(wcol,1.0); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sel, fellY+2); ctx.lineTo(sx, sy); ctx.stroke();
  drawShuttle(sx,sy,wcol);

  drawFrameBeams();

  // --- reading glass ---
  if(pointer.active && pointer.y < H-26) drawGlass(pointer.x,pointer.y);
}

function drawShuttle(x,y,wcol){
  const w=Math.max(30,warpWidth*3.4), h=Math.max(9,pickHeight*1.9);
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.beginPath();
  ctx.ellipse(1,3,w/2,h/2,0,0,Math.PI*2); ctx.fill();
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,"#7a5836"); g.addColorStop(0.5,"#5a3d22"); g.addColorStop(1,"#3a2614");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-w/2,0);
  ctx.quadraticCurveTo(-w/2+6,-h/2, -w/6,-h/2);
  ctx.lineTo(w/6,-h/2);
  ctx.quadraticCurveTo(w/2-6,-h/2, w/2,0);
  ctx.quadraticCurveTo(w/2-6,h/2, w/6,h/2);
  ctx.lineTo(-w/6,h/2);
  ctx.quadraticCurveTo(-w/2+6,h/2, -w/2,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(20,12,6,0.6)"; ctx.lineWidth=1; ctx.stroke();
  // bobbin of weft
  ctx.fillStyle=shade(wcol,1.05);
  ctx.beginPath(); ctx.ellipse(0,0,w*0.16,h*0.3,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.moveTo(-w*0.16,0); ctx.lineTo(w*0.16,0); ctx.stroke();
  ctx.restore();
}

function drawGlass(mx,my){
  const R=Math.max(48,Math.min(84,Math.min(W,H)*0.11));
  const m=2.35, cw=warpWidth*m, ch=pickHeight*m;
  const i0=Math.round((mx-clothLeft)/warpWidth);
  let j0;
  if(my>=fellY){ j0=picks.length-1; }
  else { const k=Math.round((fellY - phase*pickHeight - my)/pickHeight); j0=(picks.length-1)-k; }
  const cx=Math.ceil(R/cw)+1, cy=Math.ceil(R/ch)+1;
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,R,0,Math.PI*2); ctx.clip();
  ctx.fillStyle=shade(CREAM,0.72); ctx.fillRect(mx-R,my-R,2*R,2*R);
  for(let dy=-cy;dy<=cy;dy++){
    for(let dx=-cx;dx<=cx;dx++){
      const i=i0+dx, j=j0+dy;
      if(i<0||i>=N) continue;
      const info=cellInfo(i,j);
      const px=mx+dx*cw, py=my+dy*ch;
      const wc=shade(info.warp, info.wj), fc=shade(info.weft, info.pj);
      const warpBar=()=>{ ctx.fillStyle=wc; ctx.fillRect(px-cw*0.31, py-ch/2, cw*0.62, ch);
        ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(px-cw*0.31, py-ch/2, cw*0.16, ch); };
      const weftBar=()=>{ ctx.fillStyle=fc; ctx.fillRect(px-cw/2, py-ch*0.31, cw, ch*0.62);
        ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(px-cw/2, py-ch*0.31, cw, ch*0.16); };
      if(info.over){ weftBar(); warpBar(); } else { warpBar(); weftBar(); }
    }
  }
  ctx.restore();
  // rim
  ctx.beginPath(); ctx.arc(mx,my,R+3,0,Math.PI*2);
  ctx.strokeStyle="rgba(0,0,0,0.28)"; ctx.lineWidth=7; ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,R,0,Math.PI*2);
  ctx.strokeStyle=BRASS; ctx.lineWidth=4; ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,R-2,0,Math.PI*2);
  ctx.strokeStyle="rgba(230,218,191,0.5)"; ctx.lineWidth=1.5; ctx.stroke();
}

// ---- loop ----
let last=0;
function frame(ts){
  const dt=Math.min(50, ts-last||16); last=ts;
  phase += dt/passDuration;
  while(phase>=1){ phase-=1; commit(); }
  render();
  requestAnimationFrame(frame);
}

layout();
console.log("%cwatch the cloth climb a while — one warp end runs the whole length in the wrong colour.","color:#a5341f;font-family:Georgia");
requestAnimationFrame(frame);
})();
</script>
