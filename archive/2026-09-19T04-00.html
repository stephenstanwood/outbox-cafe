  <meta name="outbox-spec-era" content="Late April 1971, right now — twenty past three on a warm afternoon in the projection well of a municipal planetarium in Wichita, Kansas, between the 2:30 grade-school show and the 4:00 public sitting. The dome is 40 feet, the star ball is capped and cooling, and the whole ceiling is currently being painted by two converted 500-watt overhead projectors with clock glasses of dyed water and mineral oil sitting on their hot platens. Not a look-back at anything, not a lament, not a memory of vanished venues: the 4:00 is a paying house of 180, the oil in the left glass has been on a hot platen since one o'clock and is thinning, and the magenta dye bottle in the drawer is a third full with no more coming until the school district's purchase order clears in June.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the planetarium dome seen from a seat halfway back, so the image is a real spherical projection: one enormous soft-edged circle of wet colour thrown up onto white acoustic perforated aluminium, with the perf pattern genuinely visible through the light and the dome's curvature genuinely stretching the projected shapes toward the springline. Inside that circle are two overlapping clock glasses of immiscible fluid, several inches across in reality and thirty feet across up there. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label, no readable character anywhere at any time. It is a live immiscible-fluid and thermal-convection engine: dyed water and mineral oil at real interfacial tension, heated from below by a real lamp, breaking into real Bénard cells and real coalescing blobs whose shapes are computed and never drawn, eased or keyframed. The visitor's whole vocabulary is what a hand does on a hot platen — tilt a glass, press a second glass down onto the first to squeeze the film thinner, crank the aperture wheel to open the lamp up — and the cursor is not a pointer but a hand in the light path, which occludes. Nothing scrolls. Nothing resets.">
  <meta name="outbox-spec-subject" content="The flat fluid mechanics and flat dye chemistry of a wet show, and specifically that almost none of what happens up on the dome is chosen by the person doing it. That the whole picture is an immiscibility problem: mineral oil and dyed water will not mix at any temperature the platen can reach, so what the audience is watching is interfacial tension resolving itself over and over, and every round blob up there is round because a sphere is the lowest-area shape a given volume of one fluid can take inside the other, full stop. That BLOB SIZE IS SET BY FILM THICKNESS AND NOTHING ELSE — squeeze a glass down and the same volume of oil is forced into a thinner layer, so it stops being lenses and becomes a mesh of cells, and lifting the glass a sixteenth of an inch reverses it instantly, which means the single most dramatic move in the whole show is a hand pressing down and no audience has ever known that. That HEAT IS THE MOTOR: the lamp puts 500 watts through a condenser lens into the bottom of a glass dish, the fluid at the bottom is warmer and less dense than the fluid at the top, and past a real threshold in that temperature difference the layer stops conducting and starts convecting, organising itself into honest polygonal Bénard cells whose width is roughly the depth of the layer and whose circulation speed goes up with the excess heating — so a projectionist who cranks the aperture for a brighter picture gets a faster picture too, and cannot have one without the other. That VISCOSITY FALLS HARD WITH TEMPERATURE, roughly halving for every twenty or thirty degrees in mineral oil, so a glass that has been sitting on a hot platen since one o'clock is running visibly faster and looser than the identical glass put down five minutes ago, and the two halves of the same show do not match by the middle of the afternoon. That the useful working window is narrow at both ends: too cool and the layer just sits there conducting and does nothing; too hot and the cells lose their geometry, go turbulent, and the colours mechanically stir into an even brown that no amount of tilting will separate — a wet show has an actual expiry. That the COLOURS ARE ANILINE DYES IN THE WATER PHASE ONLY, which is why the oil reads as clear lenses and never as colour, and why every edge you see is a refracting boundary and not a painted line. That those dyes BLEACH under the lamp at a real rate that depends on which dye it is — the reds and magentas go first and fastest, the blue-greens and the copper-sulphate blues hold for hours — so a glass drifts in hue across a single afternoon in a fixed direction, always toward the blue end, and the make-up bottle is the only cure. That LENSING IS THE SECOND PICTURE: an oil lens sitting in water has a genuine focal length, so it projects a real caustic — a bright rim and a hot point — onto the dome, and those caustics are what people actually remember and are not something anybody put there. That the DOME IS A LENS TOO, in the wrong direction: a flat glass projected onto a hemisphere from a fixed point stretches everything toward the edges, so a circle at the middle of the dish is a circle overhead and an oval at the springline, and the geometry cannot be corrected without a fisheye the department did not buy. That the PERFORATED ALUMINIUM eats about a fifth of the light and puts a fine regular grid over everything, which is why the picture is always softer than it looks in the glass. That the lamp's own colour temperature sags as the ballast heats, so the entire dome goes warmer over the afternoon by a real amount and every dye reads differently against it. And the flat arithmetic in the well: two projectors, one aperture wheel that sticks, a third of a bottle of magenta, a house of 180 at four o'clock, and a left-hand glass that has about forty minutes of geometry left in it.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the glass, the heat and the fan, and that register is GREASY, WARM, BRIGHT, SLIGHTLY WOBBLY and PLAINLY HANDMADE — a picture that is enormous and gorgeous and is being produced eight inches across by somebody's fingers on a hot platen; fluid that is genuinely heavy and slow when it is cool and genuinely runny when it is not; a projector fan running the whole time and never once stopping; a wet glass that squeaks against another wet glass; a hand that is in the beam more often than it means to be; light spilling around the edges of the stage and putting a dull amber wash across the lower third of the dome that no projectionist has ever been able to kill. It is a warm room, it is the middle of the afternoon, and the work is cheerful and a bit sticky. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cells go on turning over whether or not anybody touches a glass. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT trippy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT cosmic, NOT reverent — this is two dishes of coloured water on a hot lamp at twenty past three with a paying house at four.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and every colour on the dome is COMPUTED and never chosen. The ground is perforated white acoustic aluminium under a dark room: bare dome (#e4e6e1) where nothing is thrown on it, dropping to a cool unlit grey toward the springline (#9ba1a2), with a real regular perf grid that is visible through every projected shape and genuinely reduces its contrast, and a dull amber spill wash across the lower third from the stage lights that cannot be removed (#c9a375 at ten percent). Against that, the fluid: EVERY PIXEL OF PROJECTED COLOUR IS THE OUTPUT OF DYE ARITHMETIC — each water cell carries an actual concentration of each aniline dye, an actual path length through the layer, and an actual accumulated bleach dose, and its transmitted colour comes out of Beer–Lambert absorption against the lamp's live spectrum and nothing else. So a deep pool of magenta reads a saturated crimson-pink (#d5197c), the same dye stretched thin over a squeezed film reads a pale hot rose (#f2a3c4), copper-sulphate blue-green in depth reads a hard teal (#12a3a0) and thin reads a chalky aqua (#8fd4d0), and where the two overlap the engine multiplies the absorptions honestly and gets a real muddy indigo-brown (#4a4a55) rather than a picked purple. Mineral oil carries no dye at all and renders only as refraction: clear lenses whose rims are computed caustics — a bright thin ring and a hot focal point measurably brighter than the surrounding dome (#fffaf0). Bleaching is live and permanent, so the magentas thin and grey across the afternoon and the teals do not, and the whole dome drifts blue-green while the lamp's own colour temperature sags warm underneath it, and the two drifts do not cancel. Exactly one chip of the aperture wheel's painted index red (#b02a1e) is held strictly for the wheel's own pointer and the metal shade over the platen — the only two solid objects in frame — and it never appears in the projection. Flat, hard, high contrast in the middle of the dome and honestly washed at the edges; no glow filter, no bloom, no lens flare, no soft focus, no gradients other than honest absorption, honest caustics, honest perf grid and honest spill.">
  <meta name="outbox-spec-wildcard" content="THE CURSOR IS NEVER RENDERED AS A CURSOR. The system pointer is hidden and never replaced by a dot, a crosshair, a glyph, a glow, a trail or a custom icon of any kind. The visitor's only evidence of their own position is the shadow their hand casts into the light path and onto the dome — a real soft-edged silhouette whose penumbra width is computed from how far the hand currently is from the lamp, so it is razor-sharp when the hand is down on the platen and enormous and vague when it is lifted away. Move off the projector entirely and there is no shadow and therefore no pointer at all, and the page gives no other feedback about where anything is.">
  <meta name="outbox-spec-forbidden" content="NO psychedelia framing of any kind — no acid, no trip, no expanded consciousness, no Summer of Love, no counterculture, no 'far out', no sixties-as-myth, no Fillmore, no Joshua Light Show hagiography, no Pink Floyd, no Hendrix, no strobe-and-incense, no dropout mysticism, no chakras, no third eye. NO cosmic register whatsoever, despite the room being a planetarium: no stars, no galaxies, no nebula comparison, no 'the universe in a dish', no Sagan, no wonder, no smallness, no awe, no 'we are made of' anything, no the-dome-as-heaven. NO lava-lamp kitsch, NO retro-kitsch, NO camp, NO ironic affection for 1971, NO Austin Powers, NO groovy, NO shag-carpet-and-macramé colour writing, NO Nixon, NO Vietnam drift, NO moon-landing hindsight, NO 1971-as-period-signifier at all. NO nostalgia, NO wistfulness, NO 'nobody does wet shows anymore / lasers killed it / the planetarium closed in 1994' decline narrative — there is a paying house at four. NO craftsman-sage register, NO 'the old light-show men could read a glass from the booth', NO trade mystique, NO artisan sermon, NO analogue-versus-digital argument, NO master-and-apprentice arc, NO reverence for hand skill. NO colour lyricism: no describing the fluid as molten, jewelled, liquid fire, bleeding, breathing or blooming; colour here is dye concentration, path length and remaining bleach headroom. NO fluid lyricism: no dancing, no swirling-as-emotion, no 'shapes that have never existed before', no organic-versus-mechanical framing, no cells-as-life, no amoeba or cellular-division imagery, no microscope-slide reverie. NO physics-as-beauty, NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the wonderful part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, chillout, ambient-visualiser, generative-art-gallery, music-visualiser, VJ-set or screensaver framing whatsoever, and no 'let it wash over you' — the fan is loud, the glass is greasy and there is a hand in the beam. NO Kansas travelogue and NO explaining the Midwest to anybody: no big sky, no wheat, no tornado, no flyover condescension, no Wizard of Oz, no small-city pathos, no municipal-budget satire, no bureaucratic-absurd, no committee minutes, no department-of-X. NO school-group comedy and NO children-as-wonderstruck sentiment. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the darkening room, the bleaching dye or the glass that goes muddy and cannot be fixed — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / found-media / relic framing of any object in the well — both glasses were filled this morning and one of them is too hot right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / booth-operator / log / 3am voice — it is twenty past three in the afternoon and the house lights in the lobby are up. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<body>
<!-- the aperture wheel sticks at the fourth stop. it has always stuck at the fourth stop. -->
<canvas id="dome"></canvas>
<div id="arch"><a href="/archive" aria-label="more"></a></div>
<script>
(function(){
"use strict";
/* ---------------------------------------------------------------
   projection well, municipal planetarium, 40ft dome.
   two overheads, clock glasses, dyed water + mineral oil.
   nothing here is keyframed. all of it is arithmetic.
   --------------------------------------------------------------- */

var cv=document.getElementById('dome'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();window.addEventListener('resize',resize);

/* ---------------- persistence: forward only ------------------- */
var KEY='wichita.well.1971';
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||typeof S.lampHours!=='number'){
  S={
    lampHours:317.4,
    aperture:0.52,
    drops:{mag:41,cyan:96},   /* magenta bottle a third full */
    glass:[
      {hoursOn:2.33,dye:{mag:0.86,cyan:0.22},bleach:{mag:0.19,cyan:0.03},depth:0.62},
      {hoursOn:0.08,dye:{mag:0.31,cyan:0.79},bleach:{mag:0.02,cyan:0.01},depth:0.70}
    ]
  };
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var saveT=0;

/* ---------------- fluid: two glasses -------------------------- */
/* each glass is a coarse grid of parcels. every parcel is either
   water (carries dye) or oil (carries none). interfacial tension
   pulls like-phase parcels together; buoyancy from the convection
   field pushes them around. no sprites. */

var ROOM=22;           /* deg C */
function Glass(idx,cx,cy,rad,seed){
  this.idx=idx;this.cx=cx;this.cy=cy;this.rad=rad;
  this.st=S.glass[idx];
  this.T=ROOM+ (this.st.hoursOn>1? 46 : 9);   /* bulk temp */
  this.press=0;                               /* squeeze, 0..1 */
  this.tiltx=0;this.tilty=0;
  this.n = idx===0?120:112;
  this.p=[];
  var rnd=mulberry(seed);
  for(var i=0;i<this.n;i++){
    var a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*0.86;
    this.p.push({
      x:Math.cos(a)*r,y:Math.sin(a)*r,
      vx:0,vy:0,
      oil: i%3!==0,            /* ~2/3 oil parcels */
      vol: 0.55+rnd()*0.9,
      ph: rnd()*6.283,
      T:0
    });
  }
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var GA=new Glass(0,-0.30,0.02,0.62,20713);
var GB=new Glass(1, 0.31,-0.05,0.60,49102);
var GLASSES=[GA,GB];

/* film thickness: conserve volume. squeezing thins the film,
   which forces the same oil into a wider, shallower footprint.
   blob size follows thickness and nothing else. */
Glass.prototype.thickness=function(){
  return this.st.depth*(1-0.74*this.press);
};

/* Rayleigh-ish threshold: instability scales with depth cubed and
   the temperature difference the platen can hold across the layer. */
Glass.prototype.convect=function(flux){
  var d=this.thickness();
  var dT=flux*22/ (0.4+d);            /* thinner layer, bigger gradient */
  var Ra=dT*d*d*d*1900/Math.max(0.06,this.nu());
  var Rc=1708/1000;                   /* scaled critical */
  this.Ra=Ra; this.Rc=Rc;
  this.excess=Math.max(0,(Ra-Rc)/Rc);
  this.cellW=d*1.02;                  /* cell width ~ layer depth */
  this.speed=Math.min(2.6,Math.sqrt(this.excess)*0.30);
  this.turb=Math.max(0,(this.excess-9.5)/9.5);   /* past this: brown */
  return this.excess;
};
/* kinematic viscosity halves every ~25 deg */
Glass.prototype.nu=function(){
  return 1.0*Math.pow(0.5,(this.T-ROOM)/25);
};

/* ---------------- lamp ---------------------------------------- */
var lamp={
  flux:0, cur:0,
  cct:function(){ /* ballast sags warm with burn hours */
    var s=Math.min(1,S.lampHours/900);
    return 3180 - 260*s - 90*Math.min(1,sessionMin/50);
  }
};
var sessionMin=0;

/* lamp spectrum as three coarse channel weights, warm-biased */
function lampRGB(){
  var k=lamp.cct();
  var t=(k-2700)/700;                  /* 0 warm .. 1 cooler */
  return [1.0, 0.80+0.11*t, 0.55+0.26*t];
}

/* ---------------- dye arithmetic ------------------------------ */
/* Beer-Lambert. two aniline dyes. magenta absorbs green strongly,
   cyan-teal absorbs red. concentration x path length x (1-bleach) */
var EPS_MAG=[0.22,3.10,0.66];
var EPS_CYA=[2.90,0.40,0.35];
function transmit(cm,cc,path,out){
  var L=lampRGB();
  for(var i=0;i<3;i++){
    var A=(EPS_MAG[i]*cm + EPS_CYA[i]*cc)*path;
    out[i]=L[i]*Math.exp(-A);
  }
}

/* ---------------- dome geometry ------------------------------- */
/* seat halfway back. hemisphere seen from inside; a flat glass at
   the projector maps out with honest stretch toward the springline. */
function domeMap(u,v,o){
  /* u,v in glass coords (-1..1) -> screen */
  var r=Math.sqrt(u*u+v*v);
  var stretch=1+0.46*r*r;              /* edge stretch */
  var a=Math.atan2(v,u);
  var rr=r*stretch;
  o.x=DOME.cx+Math.cos(a)*rr*DOME.r;
  o.y=DOME.cy+Math.sin(a)*rr*DOME.r*0.88 + rr*rr*DOME.r*0.06;
  o.s=stretch;
  o.r=rr;
}
var DOME={cx:0,cy:0,r:0};
function layoutDome(){
  DOME.cx=W*0.5;DOME.cy=H*0.47;
  DOME.r=Math.min(W*0.62,H*0.78);
}

/* ---------------- hand in the beam ---------------------------- */
var hand={x:-999,y:-999,z:0.55,on:false,vx:0,vy:0,px:0,py:0,down:false};

/* ---------------- audio --------------------------------------- */
var A=null,fanG,fanOsc,fanOsc2,ballast,ballastG,rev,busG,crowdG,crowdSrc,buffG;
var audioOn=false;
function startAudio(){
  if(audioOn)return;
  try{
    A=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){return;}
  audioOn=true;
  busG=A.createGain();busG.gain.value=0.9;

  /* 40ft hemisphere reverb, computed */
  rev=A.createConvolver();
  var sr=A.sampleRate,len=Math.floor(sr*2.4),buf=A.createBuffer(2,len,sr);
  for(var ch=0;ch<2;ch++){
    var d=buf.getChannelData(ch);
    for(var i=0;i<len;i++){
      var t=i/sr;
      var env=Math.pow(1-t/2.4,2.6)*Math.exp(-t*1.1);
      d[i]=(Math.random()*2-1)*env*0.55;
    }
    /* first-order dome slap at ~ 2*12.2m / 343 */
    var sl=Math.floor(sr*0.071);if(sl<len)d[sl]+=0.5;
    var sl2=Math.floor(sr*0.142);if(sl2<len)d[sl2]+=0.22;
  }
  rev.buffer=buf;
  var revG=A.createGain();revG.gain.value=0.34;
  rev.connect(revG);revG.connect(A.destination);
  busG.connect(A.destination);busG.connect(rev);

  /* fan: broadband + blade passing tone + out-of-true bearing */
  var nlen=sr*3,nb=A.createBuffer(1,nlen,sr),nd=nb.getChannelData(0);
  var last=0;
  for(var j=0;j<nlen;j++){var wn=Math.random()*2-1;last=last*0.86+wn*0.14;nd[j]=last*2.4;}
  var noise=A.createBufferSource();noise.buffer=nb;noise.loop=true;
  var nf=A.createBiquadFilter();nf.type='bandpass';nf.frequency.value=430;nf.Q.value=0.55;
  var ng=A.createGain();ng.gain.value=0.085;
  noise.connect(nf);nf.connect(ng);ng.connect(busG);noise.start();

  fanOsc=A.createOscillator();fanOsc.type='sawtooth';fanOsc.frequency.value=173;
  var ff=A.createBiquadFilter();ff.type='lowpass';ff.frequency.value=900;
  fanG=A.createGain();fanG.gain.value=0.022;
  fanOsc.connect(ff);ff.connect(fanG);fanG.connect(busG);fanOsc.start();

  fanOsc2=A.createOscillator();fanOsc2.type='sine';fanOsc2.frequency.value=28.8; /* bearing, out */
  var bg=A.createGain();bg.gain.value=0.03;
  fanOsc2.connect(bg);bg.connect(busG);fanOsc2.start();

  /* ballast hum at line frequency + harmonic */
  ballast=A.createOscillator();ballast.type='sine';ballast.frequency.value=120;
  var b2=A.createOscillator();b2.type='sine';b2.frequency.value=240;
  ballastG=A.createGain();ballastG.gain.value=0.0;
  var b2g=A.createGain();b2g.gain.value=0.4;
  ballast.connect(ballastG);b2.connect(b2g);b2g.connect(ballastG);
  ballastG.connect(busG);ballast.start();b2.start();

  /* floor buffer, elsewhere in the building, own clock */
  var bfo=A.createOscillator();bfo.type='sawtooth';bfo.frequency.value=61;
  var bff=A.createBiquadFilter();bff.type='lowpass';bff.frequency.value=170;
  buffG=A.createGain();buffG.gain.value=0;
  bfo.connect(bff);bff.connect(buffG);buffG.connect(busG);bfo.start();

  /* house bed, arrives around eight minutes */
  var cl=sr*4,cb=A.createBuffer(2,cl,sr);
  for(var c2=0;c2<2;c2++){
    var cd=cb.getChannelData(c2),lp=0,lp2=0;
    for(var k=0;k<cl;k++){
      var w=Math.random()*2-1;lp=lp*0.93+w*0.07;lp2=lp2*0.72+lp*0.28;
      var mod=0.6+0.4*Math.sin(k/sr*1.7+c2)+0.25*Math.sin(k/sr*0.41);
      cd[k]=lp2*mod*3.2;
    }
  }
  crowdSrc=A.createBufferSource();crowdSrc.buffer=cb;crowdSrc.loop=true;
  var cf=A.createBiquadFilter();cf.type='bandpass';cf.frequency.value=760;cf.Q.value=0.7;
  crowdG=A.createGain();crowdG.gain.value=0;
  crowdSrc.connect(cf);cf.connect(crowdG);crowdG.connect(busG);crowdG.connect(rev);crowdSrc.start();
}
function blip(f,dur,type,gain,filt){
  if(!audioOn)return;
  var o=A.createOscillator();o.type=type||'sine';o.frequency.value=f;
  var g=A.createGain();g.gain.setValueAtTime(0.0001,A.currentTime);
  g.gain.exponentialRampToValueAtTime(gain||0.06,A.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
  var node=o;
  if(filt){var bq=A.createBiquadFilter();bq.type='bandpass';bq.frequency.value=filt;bq.Q.value=3;o.connect(bq);node=bq;}
  node.connect(g);g.connect(busG);g.connect(rev);
  o.start();o.stop(A.currentTime+dur+0.02);
}
var lastSqueak=0;
function squeak(speed,thin){
  if(!audioOn)return;
  var now=A.currentTime;if(now-lastSqueak<0.09)return;lastSqueak=now;
  var base=280+speed*1400*(thin);
  var o=A.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(base*0.8,now);
  o.frequency.linearRampToValueAtTime(base*1.35,now+0.12);
  var bq=A.createBiquadFilter();bq.type='bandpass';bq.frequency.value=base*1.6;bq.Q.value=7;
  var g=A.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.min(0.05,0.006+speed*0.10),now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.19);
  o.connect(bq);bq.connect(g);g.connect(busG);g.connect(rev);
  o.start();o.stop(now+0.22);
}

/* ---------------- interaction --------------------------------- */
/* vocabulary: tilt a glass (drag), press a glass down (hold/press),
   crank the aperture wheel (drag the wheel at lower left).
   nothing is labelled. */
var WHEEL={x:0,y:0,r:0,drag:false,ang:0,stickBuzz:0};
function layoutWheel(){
  WHEEL.r=Math.max(30,Math.min(W,H)*0.062);
  WHEEL.x=W*0.10+WHEEL.r*0.2;
  WHEEL.y=H-WHEEL.r*1.5;
  if(W<520){WHEEL.x=WHEEL.r*1.25;WHEEL.y=H-WHEEL.r*1.35;}
}
WHEEL.ang=S.aperture*Math.PI*1.6;

var grabbed=null,grabDX=0,grabDY=0;
function toGlassSpace(g,mx,my){
  /* invert dome map approximately for hit testing */
  var dx=(mx-DOME.cx)/DOME.r, dy=(my-DOME.cy)/(DOME.r*0.88);
  var r=Math.sqrt(dx*dx+dy*dy);
  var rr=r; for(var i=0;i<4;i++){ rr = r/(1+0.46*rr*rr); }
  var a=Math.atan2(dy,dx);
  return {x:Math.cos(a)*rr,y:Math.sin(a)*rr};
}
function pointer(e){
  var t=e.touches&&e.touches[0]?e.touches[0]:e;
  return {x:t.clientX,y:t.clientY};
}
function down(e){
  startAudio();
  var p=pointer(e);
  hand.on=true;hand.x=p.x;hand.y=p.y;hand.down=true;
  var dw=Math.hypot(p.x-WHEEL.x,p.y-WHEEL.y);
  if(dw<WHEEL.r*1.25){WHEEL.drag=true;grabbed=null;return;}
  var gs=toGlassSpace(null,p.x,p.y);
  var best=null,bd=1e9;
  for(var i=0;i<GLASSES.length;i++){
    var g=GLASSES[i];
    var d=Math.hypot(gs.x-g.cx,gs.y-g.cy);
    if(d<g.rad*1.05&&d<bd){bd=d;best=g;}
  }
  if(best){grabbed=best;grabDX=gs.x-best.cx;grabDY=gs.y-best.cy;
    blip(150+Math.random()*30,0.24,'triangle',0.075,320);  /* ceramic knock */
  }
}
function move(e){
  var p=pointer(e);
  hand.px=hand.x;hand.py=hand.y;
  hand.x=p.x;hand.y=p.y;hand.on=true;
  hand.vx=hand.x-hand.px;hand.vy=hand.y-hand.py;
  if(WHEEL.drag){
    var a=Math.atan2(p.y-WHEEL.y,p.x-WHEEL.x);
    var prev=S.aperture;
    var na=(a+Math.PI*2)%(Math.PI*2);
    var target=na/(Math.PI*1.9);
    target=Math.max(0.06,Math.min(1,target));
    /* the wheel sticks at the fourth stop */
    var stop4=0.44;
    if(prev<stop4&&target>stop4&&target<stop4+0.10){target=stop4;WHEEL.stickBuzz=1;}
    var nStops=12;
    var q=Math.round(target*nStops)/nStops;
    if(Math.abs(q-prev)>0.001){
      blip(1150+Math.random()*140,0.045,'square',0.035,1600);
      S.aperture=q;WHEEL.ang=q*Math.PI*1.9;
    }
    return;
  }
  if(grabbed){
    var gs=toGlassSpace(null,p.x,p.y);
    var nx=gs.x-grabDX,ny=gs.y-grabDY;
    var sp=Math.hypot(nx-grabbed.cx,ny-grabbed.cy);
    grabbed.tiltx=(nx-grabbed.cx)*12;grabbed.tilty=(ny-grabbed.cy)*12;
    grabbed.cx=Math.max(-0.85,Math.min(0.85,nx));
    grabbed.cy=Math.max(-0.75,Math.min(0.75,ny));
    if(sp>0.002)squeak(sp*8,1/(0.25+grabbed.thickness()));
  }
}
function up(){
  hand.down=false;
  if(grabbed){blip(128+Math.random()*20,0.30,'triangle',0.07,280);}
  grabbed=null;WHEEL.drag=false;
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',function(e){e.preventDefault();down(e);},{passive:false});
window.addEventListener('touchmove',function(e){e.preventDefault();move(e);},{passive:false});
window.addEventListener('touchend',function(e){up();});
window.addEventListener('mouseleave',function(){hand.on=false;});
/* hand height in the beam: wheel scrolls it toward / away from the lamp */
window.addEventListener('wheel',function(e){
  hand.z=Math.max(0.06,Math.min(1.0,hand.z+e.deltaY*0.0012));
},{passive:true});
/* pressing the cover glass: hold a modifier or long-press near a glass */
var pressing=false;
window.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Shift'){pressing=true;startAudio();}
  if(e.key==='m'||e.key==='M')addDrop('mag');
  if(e.key==='c'||e.key==='C')addDrop('cyan');
});
window.addEventListener('keyup',function(e){
  if(e.key===' '||e.key==='Shift')pressing=false;
});
function addDrop(which){
  if(S.drops[which]<=0)return;
  S.drops[which]--;
  var g=GLASSES[0].T>GLASSES[1].T?GLASSES[0]:GLASSES[1];
  g.st.dye[which]=Math.min(1.35,g.st.dye[which]+0.055);
  g.st.bleach[which]=Math.max(0,g.st.bleach[which]-0.035);
  blip(660,0.11,'sine',0.05,900);
  save();
}
/* long press = squeeze */
var pressTimer=null;
cv.addEventListener('mousedown',function(){pressTimer=setTimeout(function(){pressing=true;},380);});
window.addEventListener('mouseup',function(){clearTimeout(pressTimer);pressing=false;});
cv.addEventListener('touchstart',function(){pressTimer=setTimeout(function(){pressing=true;},380);},{passive:true});
window.addEventListener('touchend',function(){clearTimeout(pressTimer);pressing=false;});

/* ---------------- perf grid pattern --------------------------- */
var perfCan=document.createElement('canvas'),perfCtx=perfCan.getContext('2d');
function buildPerf(){
  var s=9;
  perfCan.width=s;perfCan.height=s;
  perfCtx.clearRect(0,0,s,s);
  perfCtx.fillStyle='rgba(20,22,24,0.30)';
  perfCtx.beginPath();perfCtx.arc(2.2,2.2,1.25,0,6.283);perfCtx.fill();
  perfCtx.beginPath();perfCtx.arc(6.7,6.7,1.25,0,6.283);perfCtx.fill();
}
buildPerf();
var perfPat=null;

/* ---------------- render -------------------------------------- */
var lastT=performance.now();
var t0=performance.now();
var rgbTmp=[0,0,0];
var mp={x:0,y:0,s:1,r:0};

function frame(now){
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  var elapsed=(now-t0)/1000;
  sessionMin=elapsed/60;
  layoutDome();layoutWheel();

  /* lamp */
  lamp.flux=S.aperture;
  lamp.cur+= (S.aperture-lamp.cur)*Math.min(1,dt*3);
  S.lampHours+=dt/3600;

  /* glasses: heat, viscosity, convection, bleach */
  for(var gi=0;gi<GLASSES.length;gi++){
    var g=GLASSES[gi];
    var heat=lamp.flux*118;
    var loss=(g.T-ROOM)*1.6;
    g.T+=(heat-loss)*dt*0.010;
    g.st.hoursOn+=dt/3600;
    var targetPress=(pressing&&grabbed===g)?0.86:( (pressing&&!grabbed)?0.42:0 );
    g.press+=(targetPress-g.press)*Math.min(1,dt*4.2);
    g.convect(lamp.flux);
    /* bleach: forward only, magenta fast */
    var dose=lamp.flux*dt;
    g.st.bleach.mag=Math.min(0.97,g.st.bleach.mag+dose*0.0042);
    g.st.bleach.cyan=Math.min(0.72,g.st.bleach.cyan+dose*0.00052);
    stepGlass(g,dt);
  }

  /* audio tracking */
  if(audioOn){
    var warm=Math.min(1,elapsed/240);
    fanOsc.frequency.setTargetAtTime(173-5.2*warm,A.currentTime,0.5);
    fanOsc2.frequency.setTargetAtTime(28.8-0.9*warm,A.currentTime,0.5);
    ballastG.gain.setTargetAtTime(0.006+lamp.cur*0.030,A.currentTime,0.3);
    var crowd=Math.max(0,Math.min(1,(elapsed-480)/210));
    crowdG.gain.setTargetAtTime(crowd*0.10,A.currentTime,1.5);
    /* floor buffer on its own irregular clock */
    var bf=(Math.sin(elapsed*0.041)+Math.sin(elapsed*0.0173+1.3)+Math.sin(elapsed*0.0091));
    buffG.gain.setTargetAtTime(bf>1.55?0.020:0,A.currentTime,0.9);
    /* fire door on a closer, twice */
    if(!doorA&&elapsed>163){doorA=true;doorSound();}
    if(!doorB&&elapsed>541){doorB=true;doorSound();}
    if(WHEEL.stickBuzz>0){WHEEL.stickBuzz-=dt*2;if(WHEEL.stickBuzz<=0){blip(340,0.09,'square',0.04,500);}}
  }

  draw(elapsed);

  saveT+=dt;
  if(saveT>4){saveT=0;save();}
  requestAnimationFrame(frame);
}
var doorA=false,doorB=false;
function doorSound(){
  blip(92,0.5,'triangle',0.08,150);
  setTimeout(function(){blip(2100,0.35,'sawtooth',0.012,2600);},120);
  setTimeout(function(){blip(74,0.6,'sine',0.09,110);},1350);
}

/* --------- fluid step: tension vs buoyancy vs drag ------------ */
function stepGlass(g,dt){
  var th=g.thickness();
  var nu=g.nu();
  var drag=Math.min(0.98,nu*3.2);
  var conv=g.speed;
  var cw=Math.max(0.10,g.cellW);
  var k=Math.PI/cw;
  var turb=g.turb;
  var t=performance.now()/1000;
  var P=g.p;
  for(var i=0;i<P.length;i++){
    var a=P[i];
    /* Benard roll velocity field: below threshold it is literally zero */
    var vx=0,vy=0;
    if(conv>0.001){
      var wob=turb>0?Math.sin(t*0.9+a.ph)*turb*0.6:0;
      vx= Math.sin(k*(a.x+wob))*Math.cos(k*a.y)*conv;
      vy=-Math.cos(k*a.x)*Math.sin(k*(a.y+wob))*conv;
      if(turb>0){
        vx+=Math.sin(t*1.7+a.ph*2.1)*turb*conv*0.5;
        vy+=Math.cos(t*1.4+a.ph*1.7)*turb*conv*0.5;
      }
    }
    /* tilt: gravity component from the hand */
    vx+=g.tiltx*0.02;vy+=g.tilty*0.02;
    a.vx+=(vx-a.vx)*Math.min(1,dt*(1.4+2/nu));
    a.vy+=(vy-a.vy)*Math.min(1,dt*(1.4+2/nu));
    a.x+=a.vx*dt*0.55;a.y+=a.vy*dt*0.55;
    /* wall of the clock glass */
    var r=Math.hypot(a.x,a.y);
    if(r>0.90){var s=0.90/r;a.x*=s;a.y*=s;a.vx*=-0.28;a.vy*=-0.28;}
  }
  /* interfacial tension: like-phase attraction, unlike repulsion.
     coefficient falls with temperature. this is what makes them round. */
  var sigma=0.030*Math.pow(0.5,(g.T-ROOM)/60);
  for(var pass=0;pass<1;pass++){
    for(var m=0;m<P.length;m++){
      var A1=P[m];
      for(var n=m+1;n<P.length;n++){
        var B=P[n];
        var dx=B.x-A1.x,dy=B.y-A1.y;
        var d2=dx*dx+dy*dy;
        if(d2>0.075||d2<1e-6)continue;
        var d=Math.sqrt(d2);
        var same=(A1.oil===B.oil);
        var rest=(0.055+th*0.075)*(same?0.85:1.25);
        var f=(d-rest)*(same?sigma*2.6:-sigma*1.15);
        var ux=dx/d,uy=dy/d;
        A1.vx+=ux*f;A1.vy+=uy*f;
        B.vx-=ux*f;B.vy-=uy*f;
      }
    }
  }
  g.tiltx*=0.90;g.tilty*=0.90;
}

/* --------- draw ------------------------------------------------ */
function draw(elapsed){
  /* bare dome: perforated white acoustic aluminium, unlit toward
     the springline, with the stage spill across the lower third */
  var grd=ctx.createRadialGradient(DOME.cx,DOME.cy*0.92,DOME.r*0.10,DOME.cx,DOME.cy,DOME.r*1.35);
  grd.addColorStop(0,'#e4e6e1');
  grd.addColorStop(0.55,'#c9ccc9');
  grd.addColorStop(1,'#9ba1a2');
  ctx.fillStyle='#141416';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(DOME.cx,DOME.cy,DOME.r*1.34,DOME.r*1.16,0,0,6.283);
  ctx.clip();
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  /* projected light: additive over the dome */
  ctx.globalCompositeOperation='screen';
  for(var gi=0;gi<GLASSES.length;gi++)drawGlass(GLASSES[gi],elapsed);

  /* overlap: honest multiplied absorption where both glasses land */
  ctx.globalCompositeOperation='multiply';
  drawOverlap();

  ctx.globalCompositeOperation='source-over';

  /* hand shadow: occludes the beam. penumbra from distance to lamp */
  drawHand();

  /* stage spill: dull amber across the lower third, cannot be killed */
  var sp=ctx.createLinearGradient(0,H*0.58,0,H);
  sp.addColorStop(0,'rgba(201,163,117,0)');
  sp.addColorStop(1,'rgba(201,163,117,0.11)');
  ctx.fillStyle=sp;ctx.fillRect(0,H*0.55,W,H*0.45);

  /* perforation grid over everything, with its real transmission loss */
  if(!perfPat)perfPat=ctx.createPattern(perfCan,'repeat');
  ctx.globalAlpha=0.62;
  ctx.fillStyle=perfPat;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  ctx.restore();

  /* room falloff outside the dome */
  var vg=ctx.createRadialGradient(DOME.cx,DOME.cy,DOME.r*0.75,DOME.cx,DOME.cy,DOME.r*1.5);
  vg.addColorStop(0,'rgba(10,10,11,0)');
  vg.addColorStop(1,'rgba(10,10,11,0.94)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  drawWheel();
  drawShade();
}

function drawGlass(g,elapsed){
  var th=g.thickness();
  var bright=0.30+lamp.cur*0.95;
  var P=g.p;
  /* water parcels first: dye colour by Beer-Lambert */
  for(var i=0;i<P.length;i++){
    var a=P[i];
    if(a.oil)continue;
    var u=g.cx+a.x*g.rad, v=g.cy+a.y*g.rad;
    domeMap(u,v,mp);
    if(mp.r>1.28)continue;
    /* path length through the layer at this parcel */
    var path=th*(1.1+a.vol*0.55);
    var cm=g.st.dye.mag*(1-g.st.bleach.mag)*a.vol*0.9;
    var cc=g.st.dye.cyan*(1-g.st.bleach.cyan)*a.vol*0.9;
    /* turbulence mechanically stirs the phases: dyes average out */
    if(g.turb>0){
      var mix=Math.min(0.85,g.turb*0.8);
      var avg=(cm+cc)*0.5;
      cm=cm*(1-mix)+avg*mix;cc=cc*(1-mix)+avg*mix;
    }
    transmit(cm,cc,path,rgbTmp);
    var R=Math.round(Math.min(255,rgbTmp[0]*255*bright));
    var G=Math.round(Math.min(255,rgbTmp[1]*255*bright));
    var B=Math.round(Math.min(255,rgbTmp[2]*255*bright));
    /* blob radius follows film thickness — thin film, small cells */
    var rad=(0.030+th*0.062)*a.vol*DOME.r*mp.s;
    var rg=ctx.createRadialGradient(mp.x,mp.y,0,mp.x,mp.y,rad);
    rg.addColorStop(0,'rgba('+R+','+G+','+B+',0.92)');
    rg.addColorStop(0.62,'rgba('+R+','+G+','+B+',0.45)');
    rg.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
    ctx.fillStyle=rg;
    ctx.save();
    ctx.translate(mp.x,mp.y);
    /* dome stretch: circle overhead, oval at the springline */
    var ang=Math.atan2(mp.y-DOME.cy,mp.x-DOME.cx);
    ctx.rotate(ang);ctx.scale(1+mp.r*0.55,1);
    ctx.beginPath();ctx.arc(0,0,rad,0,6.283);ctx.fill();
    ctx.restore();
  }
  /* oil lenses: no dye. only refraction — a rim and a focal point */
  for(var j=0;j<P.length;j++){
    var o=P[j];
    if(!o.oil)continue;
    var u2=g.cx+o.x*g.rad,v2=g.cy+o.y*g.rad;
    domeMap(u2,v2,mp);
    if(mp.r>1.28)continue;
    var rad2=(0.026+th*0.058)*o.vol*DOME.r*mp.s;
    /* curvature from contact angle -> focal length -> caustic sharpness.
       squeeze the lens flat and it defocuses honestly. */
    var curv=th*1.5;
    var focus=Math.max(0.06,Math.min(1,curv*1.25));
    var hot=focus*focus*lamp.cur;
    ctx.save();
    ctx.translate(mp.x,mp.y);
    var ang2=Math.atan2(mp.y-DOME.cy,mp.x-DOME.cx);
    ctx.rotate(ang2);ctx.scale(1+mp.r*0.55,1);
    /* bright thin rim */
    ctx.strokeStyle='rgba(255,250,240,'+(0.10+0.34*focus).toFixed(3)+')';
    ctx.lineWidth=Math.max(0.6,rad2*0.11);
    ctx.beginPath();ctx.arc(0,0,rad2*0.94,0,6.283);ctx.stroke();
    /* hot point */
    var fr=rad2*(0.16+(1-focus)*0.72);
    var fg=ctx.createRadialGradient(0,0,0,0,0,fr);
    fg.addColorStop(0,'rgba(255,250,240,'+(0.16+0.62*hot).toFixed(3)+')');
    fg.addColorStop(1,'rgba(255,250,240,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,fr,0,6.283);ctx.fill();
    ctx.restore();
  }
}

/* where the two thrown circles overlap, absorption multiplies:
   a real muddy indigo-brown, never a chosen purple */
function drawOverlap(){
  var a=GA,b=GB;
  domeMap(a.cx,a.cy,mp);var ax=mp.x,ay=mp.y,ar=a.rad*DOME.r*mp.s*1.05;
  domeMap(b.cx,b.cy,mp);var bx=mp.x,by=mp.y,br=b.rad*DOME.r*mp.s*1.05;
  var d=Math.hypot(bx-ax,by-ay);
  if(d>ar+br)return;
  var cmA=a.st.dye.mag*(1-a.st.bleach.mag),ccA=a.st.dye.cyan*(1-a.st.bleach.cyan);
  var cmB=b.st.dye.mag*(1-b.st.bleach.mag),ccB=b.st.dye.cyan*(1-b.st.bleach.cyan);
  transmit(cmA+cmB,ccA+ccB,(a.thickness()+b.thickness())*0.9,rgbTmp);
  var R=Math.round(Math.min(255,110+rgbTmp[0]*160));
  var G=Math.round(Math.min(255,110+rgbTmp[1]*160));
  var B=Math.round(Math.min(255,120+rgbTmp[2]*160));
  ctx.save();
  ctx.beginPath();ctx.arc(ax,ay,ar,0,6.283);ctx.clip();
  var rg=ctx.createRadialGradient(bx,by,0,bx,by,br);
  rg.addColorStop(0,'rgba('+R+','+G+','+B+',0.92)');
  rg.addColorStop(1,'rgba(255,255,255,1)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(bx,by,br,0,6.283);ctx.fill();
  ctx.restore();
}

/* the hand: never a pointer. only its shadow, with a penumbra
   computed from how far it is from the lamp. */
function drawHand(){
  if(!hand.on)return;
  var z=hand.z;                      /* 0 = down on the platen */
  var pen=6+z*z*180;                 /* penumbra width */
  var scale=1+z*1.5;
  var w=DOME.r*0.13*scale, h=DOME.r*0.19*scale;
  var alpha=0.70-z*0.42;
  ctx.save();
  ctx.globalCompositeOperation='multiply';
  ctx.filter='blur('+pen.toFixed(1)+'px)';
  ctx.fillStyle='rgba(28,30,34,'+alpha.toFixed(3)+')';
  ctx.translate(hand.x,hand.y);
  ctx.rotate(-0.30+hand.vx*0.006);
  /* palm */
  ctx.beginPath();
  ctx.ellipse(0,h*0.22,w*0.62,h*0.52,0,0,6.283);ctx.fill();
  /* four fingers and a thumb, splayed a little */
  for(var f=0;f<4;f++){
    var fa=-0.62+f*0.30;
    var fl=h*(0.86-Math.abs(f-1.4)*0.10);
    ctx.save();
    ctx.translate(Math.sin(fa)*w*0.42,-h*0.22);
    ctx.rotate(fa*0.9);
    ctx.beginPath();ctx.ellipse(0,-fl*0.45,w*0.155,fl*0.56,0,0,6.283);ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(-w*0.62,h*0.20);ctx.rotate(-0.95);
  ctx.beginPath();ctx.ellipse(0,-h*0.28,w*0.17,h*0.36,0,0,6.283);ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.filter='none';
}

/* the aperture wheel: painted index red, the only solid in frame
   besides the shade. never appears in the projection. */
function drawWheel(){
  var r=WHEEL.r;
  ctx.save();
  ctx.translate(WHEEL.x,WHEEL.y);
  ctx.fillStyle='rgba(24,25,27,0.94)';
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(120,122,120,0.5)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(0,0,r*0.97,0,6.283);ctx.stroke();
  /* detent stops */
  for(var i=0;i<12;i++){
    var a=i/12*Math.PI*1.9;
    ctx.strokeStyle=(i===5)?'rgba(176,42,30,0.75)':'rgba(140,142,140,0.34)';
    ctx.lineWidth=(i===5)?2:1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72);
    ctx.lineTo(Math.cos(a)*r*0.93,Math.sin(a)*r*0.93);
    ctx.stroke();
  }
  /* pointer, painted index red */
  ctx.rotate(WHEEL.ang+(WHEEL.stickBuzz>0?Math.sin(performance.now()*0.05)*0.02:0));
  ctx.fillStyle='#b02a1e';
  ctx.beginPath();
  ctx.moveTo(r*0.90,0);ctx.lineTo(r*0.20,-r*0.11);ctx.lineTo(r*0.20,r*0.11);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r*0.16,0,6.283);ctx.fill();
  ctx.restore();
}

/* metal shade over the platen, bottom right, catching the spill */
function drawShade(){
  var w=Math.min(W*0.30,190),h=w*0.30;
  var x=W-w*0.86,y=H-h*0.72;
  ctx.save();
  ctx.translate(x,y);ctx.rotate(-0.10);
  ctx.fillStyle='#b02a1e';
  ctx.beginPath();
  ctx.moveTo(-w*0.5,-h*0.5);ctx.lineTo(w*0.5,-h*0.34);
  ctx.lineTo(w*0.5,h*0.5);ctx.lineTo(-w*0.5,h*0.30);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.34)';
  ctx.fillRect(-w*0.5,h*0.16,w,h*0.18);
  ctx.restore();
}

layoutDome();layoutWheel();
requestAnimationFrame(frame);

/* left glass has been on the platen since one o'clock.
   its viscosity is roughly a third of the right-hand glass.
   nothing about that is going to improve before four. */
})();
</script>
