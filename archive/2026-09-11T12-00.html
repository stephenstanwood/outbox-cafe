  <meta name="outbox-spec-era" content="11 June 1972, right now — twenty to seven on a warm, gusty evening on a sloping hayfield two miles east of Rensselaer, Indiana, where a four-man crew out of a tent-and-awning yard is two hours into putting up a 40 × 80 pole tent for a farm dispersal auction that starts at nine tomorrow morning. The centre poles are up and guyed slack, the sidewall is still on the truck, the wind has been backing all evening and there is weather forecast out of the west before midnight. The only copy of the manufacturer's erection sheet — one big sheet, printed both sides, folded down to pocket size — has been in the glovebox since 1968, and it has been folded wrong so many times that it is now stiff along the wrong lines and will not go back the way it came. Not a look-back at anything, not a lament, not a memory of anything vanished: forty-seven numbered steps exist, eleven of them are on panels nobody can currently see at the same time as the panels they refer to, and the guys have to be dressed and the sidewall laced before dark.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport, edge to edge, is one large printed sheet that has been FOLDED WRONG, and the misfold is the only navigation and the only content. No header, no menu, no title, no scrollbar, no index, no site chrome of any kind. The sheet is 42 × 60 cm printed both sides and creased into sixteen panels; folded, exactly two of those sixteen panel faces are presented to the visitor at once, at true pocket size, filling the frame — and because the sheet is folded incorrectly, the two panels showing are never adjacent panels and never belong together. Step 31 sits butted up against a guy-line tension table from the other side of the sheet; half a diagram of a pole cap is butted against the tail of a paragraph that begins somewhere the visitor cannot reach. The visitor's entire vocabulary is two hands on paper: DRAG along any crease to open or close that fold, which really refolds the sheet through a real fold-state machine and brings a different mismatched pair to the front; and PRESS AND HOLD on any crease to work it flat, which softens that crease, makes it fold easier forever, and makes its neighbours stiffer. There is no correct state. The engine knows what the correct fold is, and one crease — the long cross fold, which is split about four centimetres in from the edge — physically cannot carry the fold that would produce it, so the sheet can be worked into every one of its other states and never that one, on this visit or any other. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat rigging arithmetic of a 40 × 80 canvas pole tent going up on a slope before weather, and specifically that a tent is not held up by its poles, it is held down by its guys, and everything else follows from that — that the two centre poles carry the load in pure compression and will happily walk right out from under the peak the moment the guy tensions go uneven, so the rule is that every guy on a bail ring is dressed to the same tension before ANY of them is dressed tight, and a crew that tightens one side to look neat has already lost the tent; that a side pole is not a support but a spacer, standing on its pin in the eave line, doing nothing at all until the corresponding guy is taut, which is exactly why a side pole falls over in the middle of the job and is not a fault; that guy angle is the whole calculation and the number is 45 degrees — a stake driven in close to the eave puts most of the guy's pull straight down into the ground and almost none of it outward where the tension is needed, and a stake driven too far out reduces the downward component and lets the pole lift, and neither of those is an opinion, it is the resolution of one force into two; that STAKE HOLDING POWER is a soil question and not a hardware question, since a 42-inch stake in hayfield loam pulls out at a fraction of what the same stake holds in hardpan, and the honest test is a bar and two men leaning on it and not a chart; that stakes are driven leaning AWAY from the tent at about the same angle as the guy so the load is taken along the stake's length and not across it, and a stake driven plumb bends and then walks; that on a slope every stake on the downhill side is carrying more than its share and the whole tent wants to slide, so the uphill guys are set first and the downhill guys are doubled or double-staked, and a tent set square on a slope is set wrong; that ROPE IS NOT WIRE — manila and cotton guys shrink measurably when they get wet, by real percentages, so a tent dressed bar-tight in dry evening air will rip its own grommet line out at two in the morning in rain, and the correct answer is to leave the guys slack enough that a man can get his fist under a dressed guy, which is exactly what every inexperienced crew tightens out; that this is why the guys must be slacked BEFORE the rain and not during it; that canvas itself shrinks, so the same slack rule applies twice; that the sidewall is laced last and is a sail — a fully walled tent in a 40 mph gust carries an enormous lateral load into the same stakes, and the standard answer to a wind warning is to unlace and roll the windward wall, which sounds like giving up and is the entire safety procedure; that the peak load is what tears a top, since water ponding in a slack section between poles gains weight faster than anybody expects and a hundred gallons standing in a bay will pull the pole out of the peak; that grommet and jump-rope spacing exists so that a torn panel tears to the seam and stops; that the pole tent goes up in a fixed order — lay the top out flat and square on the ground first, lace the sections, rig every side pole and stake before ANY centre pole is raised, and raise the centre poles last, because a top raised out of order cannot be squared afterward and has to come all the way down; and the flat arithmetic on the sheet, which is two centre poles, eighteen side poles, thirty-six stakes plus eight doubles on the low corner, forty-seven printed steps, a sale at nine tomorrow, and dark in about ninety minutes.">
  <meta name="outbox-spec-tone" content="The loud, fast, cheerfully exasperated voice of Vonda Kruzelka-Bandy, forty-seven, who runs the counter and the rental book at the yard and drove out with the second truck because the crew chief quit on Thursday and nobody else knows where the stake bar is. Present tense, second person, addressed to whoever is holding the other corner of the sheet while she reads it. She reads printed steps ALOUD OFF THE SHEET, in whatever order the fold happens to present them, and says out loud each time that it is not the one she wants: she is looking for step 23 and she gets 31, then 8, then a tension table, then 31 again. She does not summarise, does not paraphrase and does not explain the tent to anybody — she reads what is printed, flatly, and then talks over it. She revises her own stake count out loud three separate times and says plainly each time what she had wrong: once because she counted the low corner doubles twice, once because two of the side poles on the truck are the wrong length and don't belong to this top, once because she read the count off the 20-foot canopy panel by mistake. She is specifically and repeatedly annoyed about exactly one thing — that the sheet lives in the glovebox and has been folded by every man who ever drove that truck, and that she has asked twice for the yard to get a second copy from the manufacturer — and she says it three times. She is briefly and genuinely pleased once, about the fact that the guys are all still slack and therefore nothing has to be undone, and she says so purely as a matter of not having to redo anything. She mentions the wind backing twice and the fact that her shoes are wrong for a hayfield once. She never once addresses the visitor as a student, never gives a lesson, and never draws a conclusion. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, NOT a competent-tradesperson-saying-every-figure-twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The sheet is cheap 1968 offset bond in a warm dry cream (#e9e2cd), going measurably greyer and softer along every crease where it has been opened and closed for four years (#cdc4a8), and going darker, oilier and semi-translucent in a broad band across two panels where it has sat in a glovebox against a rubber mat (#b8a97f) — and the printing UNDER that band is honestly harder to read for the whole visit. The job is one-colour offset in a flat brick orange-red (#c2452b): solid and slightly bloomed in the heavy step numbers and rule boxes, starved, broken and pinkish in the small tension tables and in every line of the diagrams (#d9836e), with real make-ready unevenness so one panel is measurably lighter than its neighbours. Crease damage is COMPUTED and never drawn: every crease carries a live fatigue value from the number of times it has been folded across all visits, and its render runs honestly from a clean sharp line, through fibre whitening, to a genuine split with the dark of the field showing through it (#3b3a33) — and printing that lies across a split crease loses a real strip of ink and cannot be read across the gap. The long cross fold is already split four centimetres in at load and has been since before the visitor arrived. The field shows only at the sheet's outer margins as trodden hay in a hard evening green-gold (#9c9a5c) with short raking shadows. Exactly one chip of guy-rope stripe blue (#2f5a86) is held strictly for the manufacturer's part-number block, the small printed square that says which top this sheet belongs to, and the pencilled yard number somebody wrote on the back — it never appears in a step, a diagram, a table or a caption. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest ink starvation, honest crease fatigue and honest glovebox staining.">
  <meta name="outbox-spec-wildcard" content="Panel 9 belongs to a different product. It is printed in the same colour by the same printer on the same sheet — a make-ready economy — and it carries erection steps for a 20 × 20 frame canopy, numbered in the same series, so there are two step 14s, two step 15s and two step 16s on this sheet and nothing distinguishes them except a part-number block in the corner that is under the glovebox stain and cannot be read. The frame-canopy steps are internally correct and completely useless here. The engine treats panel 9 exactly like every other panel: it folds, wears, splits and comes up in the rotation on its honest turn, and it is never flagged, greyed, marked or commented on by the engine in any way. Vonda reads four lines of it aloud, gets most of the way through before she notices, says once that the yard has three of these tops and two of those canopies and somebody in Ohio saved a plate, and goes straight back to counting stakes and never mentions it again. It is panel 9, same steps, same stain over the part number, on every visit.">
  <meta name="outbox-spec-forbidden" content="NO folding-as-metaphor for anything — not memory, not what gets creased in a person, not 'you can never unfold it', not layers, not the shape a life gets pressed into; this is five creases, a split cross fold and a step that continues on a panel you cannot see, and it has nothing to teach anybody. ABSOLUTELY NO origami preciousness, NO paper-as-fragile lyricism, NO map-of-the-territory philosophy, NO Borges, NO 'the instructions are always incomplete' as a statement about anything. NO circus or big-top romance whatsoever: no sawdust, no calliope, no roustabouts as myth, no tent-as-magic, no travelling-show glamour, no Ray Bradbury, no 'and by morning the field was empty' — this is a rental crew and a farm auction. NO bureaucratic-absurd, NO Kafka, NO department-of-X, NO committee-minutes register, NO joke about instruction manuals being unreadable presented as a joke; the sheet is correct and the fold is wrong and nobody on the page finds it funny. NO Americana and NO heartland sentiment: no amber waves, no fireflies-and-porches, no small-town warmth, no farm-crisis pathos, no dispersal-auction melancholy about a family selling up, no 1972-as-period-signifier, no Vietnam or Watergate drift, no Norman Rockwell, no explaining Indiana to anybody. NO nostalgia, NO wistfulness, NO 'nobody puts up canvas anymore / it's all frame and vinyl now / the last of the tent companies' decline narrative — the sale is at nine and the wall is still on the truck. NO craftsman-sage register, NO 'the old tent men could feel a guy go slack', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc. NO storm dread, NO disaster foreshadowing, NO danger-porn about a tent coming down on people, NO safety sermon; the weather is a forecast and a reason to leave the guys slack. NO woman-in-a-man's-trade arc, NO proving-herself, NO crew-of-lovable-characters sketch, NO quitting-boss drama beyond the one flat fact of it. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the paper or the folding. NO sensuous material writing about canvas, manila or paper beyond weight, tension, shrinkage, stiffness and legibility. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the unreachable fold, the two step 14s, or the split that keeps growing — nothing here is wrong. NO archival / museum / cabinet / drawer / found-document / relic framing of the sheet whatsoever, despite it being an old printed document — it lives in a glovebox, it is being used this minute, and it is getting worse while it is used. NO map, atlas, gazetteer or directory framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty to seven in the evening with the sun still well up and the wind backing. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<!-- yard copy. 3 tops, 2 canopies, one plate. do not take it out of the truck again. -->
<script>
(function(){
"use strict";

/* ============================================================
   THE SHEET. 42 x 60 cm, printed both sides.
   Creased into 16 panel faces: 8 front (F1..F8), 8 back (B1..B8).
   Panel grid: 4 columns x 2 rows per side.
   Creases: V1, V2, V3 (three vertical folds between the 4 columns)
            H  (the long cross fold, between the 2 rows)
   Plus the accordion pocket fold C (the outer quarter tuck).
   Five creases total: V1 V2 V3 H C.
   ============================================================ */

var CREASES = ["V1","V2","V3","H","C"];
var NEIGHBOURS = {V1:["V2","C"],V2:["V1","V3"],V3:["V2","H"],H:["V3","C"],C:["H","V1"]};

/* Panel numbering used by the manufacturer, 1..16.
   Front side rows: [1 2 3 4] over [5 6 7 8]
   Back side rows:  [9 10 11 12] over [13 14 15 16]  (back reads right-to-left) */
var PANEL_INDEX = {
  front:[[1,2,3,4],[5,6,7,8]],
  back:[[12,11,10,9],[16,15,14,13]]
};

/* ---------- persistence, forward only ---------- */
var KEY = "rensselaer.sheet.v1";
var S = {
  fatigue:{V1:0.34,V2:0.21,V3:0.48,H:0.66,C:0.29},
  stiff:{V1:0,V2:0,V3:0,H:0,C:0},
  split:{V1:0,V2:0,V3:0,H:4.0,C:0},   /* split length in cm, in from the edge */
  folds:0,
  stain:1.0
};
try{
  var raw = localStorage.getItem(KEY);
  if(raw){
    var got = JSON.parse(raw);
    if(got && got.fatigue){
      CREASES.forEach(function(c){
        if(typeof got.fatigue[c]==="number") S.fatigue[c]=got.fatigue[c];
        if(got.stiff && typeof got.stiff[c]==="number") S.stiff[c]=got.stiff[c];
        if(got.split && typeof got.split[c]==="number") S.split[c]=Math.max(S.split[c],got.split[c]);
      });
      if(typeof got.folds==="number") S.folds=got.folds;
      if(typeof got.stain==="number") S.stain=Math.max(1.0,got.stain);
    }
  }
}catch(e){}
S.split.H = Math.max(S.split.H, 4.0); /* split before anybody got here. only grows. */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ---------- fold state machine ----------
   Each crease: 0 = open, 1 = valley, -1 = mountain. */
var F = {V1:0,V2:1,V3:-1,H:1,C:0};
/* H is currently valley-folded? No — H valley is the manufacturer's fold and it is
   REFUSED. Set the load state honestly: H is mountain. */
F.H = -1;

/* ------------------------------------------------------------
   Which two faces are outermost, given the five crease states.
   Real arithmetic: fold order is C, V1, V2, V3, H. Each fold halves
   the stack and picks which half's outer face survives on each side.
   ------------------------------------------------------------ */
function outerFaces(){
  /* Build a column stack of the 4 columns, front and back. */
  /* Start: columns 0..3, front row chosen by H, back row chosen by H. */
  var topRow, botRow;
  if(F.H === 1){        /* valley: bottom row folds up behind, top row shows */
    topRow = 0; botRow = 1;
  } else if(F.H === -1){ /* mountain: bottom row folds up in front */
    topRow = 1; botRow = 0;
  } else {
    topRow = 0; botRow = 0;
  }
  /* Vertical folds pick a column. Fold C tucks the outer quarter. */
  var col;
  var v = (F.V1||0)*9 + (F.V2||0)*3 + (F.V3||0);
  /* deterministic column selection from the three vertical crease states */
  var colTable = {};
  var k=0;
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++)for(var c=-1;c<=1;c++){
    colTable[a*9+b*3+c] = [0,1,2,3,1,2,0,3,2,1,3,0,2,0,3,1,0,2,3,1,2,3,1,0,3,0,1,2][k%28] % 4;
    k++;
  }
  col = colTable[v];
  if(F.C === 1) col = (col+1)%4;
  else if(F.C === -1) col = (col+3)%4;

  /* Which side faces the visitor on the front and which on the reverse. */
  var frontSide, backSide;
  var mountains = (F.V1===-1?1:0)+(F.V2===-1?1:0)+(F.V3===-1?1:0)+(F.C===-1?1:0);
  var flipped = (mountains % 2) === 1;

  var fRow = flipped ? botRow : topRow;
  var bRow = flipped ? topRow : botRow;

  var faceA = PANEL_INDEX.front[fRow][col];
  var bcol = (F.C===-1) ? (3-col+4)%4 : (3-col);
  var faceB = PANEL_INDEX.back[bRow][bcol];

  if(flipped){ var t=faceA; faceA=faceB; faceB=t; }
  return [faceA, faceB];
}

/* ============================================================
   PRINTED CONTENT. All 47 steps, manufacturer's order, laid
   into 16 panels at real page coordinates. Panel 9 is a
   different product entirely — same plate run.
   ============================================================ */

var STEPS = [
 [1,"Unroll top on the site, flat, seam side down, and square it before anything else is touched. A top raised out of square cannot be squared afterward."],
 [2,"Check the top against the part-number block on this sheet. Do not lace two tops of different runs."],
 [3,"Lay the centre sections first, working outward to the eaves both sides."],
 [4,"Lace all sections through the rope loops, section to section, before any pole is brought up."],
 [5,"Set the eave line on the ground and mark stake positions from the eave, not from the pole."],
 [6,"Guy stakes are set at a distance from the eave equal to the eave height. This gives the guy an angle of 45 degrees."],
 [7,"A stake set close to the eave puts most of the guy's pull straight down into the ground and very little of it outward, where the tension is wanted."],
 [8,"A stake set too far out reduces the downward part of the pull and permits the side pole to lift out of the eave. Neither case is a matter of preference. It is the resolution of one force into two parts."],
 [9,"Drive every stake leaning AWAY from the tent at about the angle of its guy, so the load is carried along the length of the stake and not across it."],
 [10,"A stake driven plumb takes the pull across its length. It will bend, and then it will walk."],
 [11,"Stake holding power is a question of soil and not of hardware. A 42-in. stake in loam holds a fraction of what the same stake holds in hardpan."],
 [12,"Test holding power with a bar and two men leaning on it. No chart is a substitute for the test."],
 [13,"On sloping ground the whole assembly wants to travel downhill. Set the uphill guys first."],
 [14,"Double or double-stake every guy on the downhill side. A top set square on a slope is set wrong."],
 [15,"Rig every side pole and drive every side stake BEFORE any centre pole is raised."],
 [16,"A side pole is a spacer and not a support. It stands on its pin in the eave line and carries nothing until its guy is taut."],
 [17,"A side pole falling over during rigging is not a fault and is not to be corrected by tightening its guy alone."],
 [18,"Bring the centre poles up last, one at a time, with a man on each bail-ring guy."],
 [19,"The centre poles carry the load in pure compression. They are held in place by nothing but the balance of the bail-ring guys."],
 [20,"Dress every guy on a bail ring to the SAME tension before ANY of them is dressed tight."],
 [21,"A crew that tightens one side to make it look neat has already lost the top. The pole will walk out from under the peak."],
 [22,"Sight the centre poles plumb from two directions at 90 degrees. Correct by slacking the opposite guy, never by hauling the near one."],
 [23,"Dressed tension is correct when a man can pass his closed fist between the guy and the ground under the guy at mid-span. Any tighter than this and the guys will",
      "CONT","take up as they wet and tear the grommet line out of the top. This is the tension every green crew tightens out of a job in the first hour."],
 [24,"Manila and cotton guy line shrinks measurably when wet: 2 to 4 per cent on a soaking, more on new line."],
 [25,"Canvas duck shrinks also, on the same wetting, so the slack rule applies twice over."],
 [26,"Slack the guys BEFORE rain, not during it. A guy dressed bar-tight in dry air at nine at night is a torn top at two in the morning."],
 [27,"Do not dress guys tight to hold a top down in wind. The top is held down by the number and holding power of the stakes, not by the tension in the line."],
 [28,"Lace the sidewall last, after all guys are dressed and the top has been sighted."],
 [29,"Sidewall is a sail. A fully walled top in a 40 m.p.h. gust delivers a very large side load into the same stakes."],
 [30,"On a wind warning, unlace and roll the windward wall. This is the standard procedure and not an admission of anything."],
 [31,"Water ponding in a slack bay between poles gains weight faster than is generally expected. One hundred gallons standing in a bay will pull a pole out of the peak."],
 [32,"Push ponded water up and out from beneath with a padded pole. Never from above."],
 [33,"Grommet and jump-rope spacing is set so that a torn panel tears to the seam and stops there."],
 [34,"Inspect the peak ring and the pole cap before raising. A worn cap will let the pole through the top."],
 [35,"Pole pins are to be seated fully in the eave line grommet. A partly seated pin will shear."],
 [36,"Corner poles take the highest single load in the eave line. Corner guys are doubled as a matter of course."],
 [37,"Jump ropes at the eave are dressed after the corner guys and before the intermediate guys."],
 [38,"Re-sight the centre poles after the sidewall is laced. Lacing pulls the eave line in."],
 [39,"Walk every stake at the finish and again at first light. A stake that has moved a half inch will move further."],
 [40,"Keep the stake bar out of the grass. It will not be found again in the dark."],
 [41,"Do not tie a guy off to a truck, a fence post, a tree or a wagon under any circumstances."],
 [42,"Sledge crews work in pairs, opposite sides, never facing."],

/* --- distribute the 47 steps over panels 1..16, skipping panel 9 --- */
var PANEL_CONTENT = {};
(function layout(){
  for(var p=1;p<=16;p++) PANEL_CONTENT[p]={steps:[],extra:null};
  var order=[1,2,3,4,5,6,7,8,10,11,12,13,14,15,16];
  var idx=0;
  /* step 23 must begin on panel 6 and continue on panel 11 */
  var perPanel=[3,3,3,3,3,3,3,3,3,4,3,3,3,3,3];
  var si=0;
  for(var i=0;i<order.length;i++){
    var pn=order[i];
    var n=perPanel[i];
    for(var j=0;j<n && si<STEPS.length;j++){
      PANEL_CONTENT[pn].steps.push(STEPS[si]);
      si++;
    }
  }
  /* force the 23 split: find where 23 landed, put it last on panel 6 */
  var s23=null;
  for(var p2=1;p2<=16;p2++){
    var arr=PANEL_CONTENT[p2].steps;
    for(var q=arr.length-1;q>=0;q--){ if(arr[q][0]===23){ s23=arr.splice(q,1)[0]; } }
  }
  if(s23){
    PANEL_CONTENT[6].steps.push(s23);
  }
  PANEL_CONTENT[11].continuation = s23 ? s23[3] : "";
  PANEL_CONTENT[9].steps = CANOPY.map(function(c){return [c[0],c[1]];});
  PANEL_CONTENT[9].canopy = true;
  PANEL_CONTENT[3].tally = true;
  PANEL_CONTENT[12].tension = true;
  PANEL_CONTENT[7].tension = true;
  PANEL_CONTENT[2].partblock = true;
  PANEL_CONTENT[14].pencil = true;
  PANEL_CONTENT[4].diagram = "cap";
  PANEL_CONTENT[10].diagram = "guy";
  PANEL_CONTENT[15].diagram = "stake";
  PANEL_CONTENT[8].diagram = "plan";
})();

var svg = document.getElementById("sheet");
var SVGNS="http://www.w3.org/2000/svg";
var PW, PH; /* panel width/height in px, pocket size */

function sizeSheet(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var availH = vh - Math.min(vh*0.36, 210) - 16;
  var availW = vw - 20;
  /* two panels side by side, each 10.5 x 15 cm ratio (0.7) */
  var ph = Math.min(availH, availW/(2*0.7));
  var pw = ph*0.7;
  if(pw*2 > availW){ pw = availW/2; ph = pw/0.7; }
  PW = Math.max(96, pw); PH = Math.max(137, ph);
  svg.setAttribute("width", (PW*2).toFixed(1));
  svg.setAttribute("height", PH.toFixed(1));
  svg.setAttribute("viewBox","0 0 "+(PW*2).toFixed(1)+" "+PH.toFixed(1));
}

function el(n,a){var e=document.createElementNS(SVGNS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}

function inkColour(weight, panel){
  /* honest make-ready unevenness: some panels run light */
  var lightPanels={5:1,11:1,14:1};
  var starve = lightPanels[panel]?1:0;
  if(weight==="heavy") return starve? "#cd6249" : "#c2452b";
  if(weight==="rule")  return starve? "#d07253" : "#c2452b";
  return starve? "#e09b88" : "#d9836e";
}

var CHAR_W = 0.505; /* character width factor for the body face */

/* Truncate at the true character position where the line leaves the panel.
   No reflow, no ellipsis. */
function layoutParagraph(text, maxCols, maxLines){
  var words=text.split(" "), lines=[], cur="";
  for(var i=0;i<words.length;i++){
    var t = cur? cur+" "+words[i] : words[i];
    if(t.length>maxCols){ lines.push(cur); cur=words[i]; }
    else cur=t;
  }
  if(cur) lines.push(cur);
  var truncated = lines.length>maxLines;
  return {lines:lines.slice(0,maxLines), truncated:truncated};
}

function drawPanel(g, panel, x0, fs){
  var pad = PW*0.085;
  var w = PW - pad*2;
  var y = pad + fs*1.1;
  var c = PANEL_CONTENT[panel]||{steps:[]};
  var maxCols = Math.max(14, Math.floor(w/(fs*CHAR_W)));
  var lh = fs*1.24;
  var bottom = PH - pad*0.7;

  /* part-number block: the ONLY blue on the front */
  if(c.partblock){
    g.appendChild(el("rect",{x:x0+pad,y:y-fs,width:w*0.62,height:fs*3.2,fill:"none",stroke:"#2f5a86","stroke-width":0.8}));
    var t1=el("text",{x:x0+pad+3,y:y+fs*0.15,fill:"#2f5a86","font-size":fs*0.9,"font-family":"monospace","letter-spacing":"0.06em"});
    t1.textContent="NO. 4080-D  DUCK TOP";
    g.appendChild(t1);
    var t2=el("text",{x:x0+pad+3,y:y+fs*1.35,fill:"#2f5a86","font-size":fs*0.82,"font-family":"monospace"});
    t2.textContent="SER. 1968-11  16 SEC.";
    g.appendChild(t2);
    y += fs*4.2;
  }

  if(c.canopy){
    var hb=el("text",{x:x0+pad,y:y,fill:inkColour("heavy",panel),"font-size":fs*1.02,"font-weight":"700","letter-spacing":"0.08em"});
    hb.textContent="ERECTION — SEC. II";
    g.appendChild(hb);
    y+=lh*1.5;
    /* the part-number block under the stain, unreadable */
    var pb=el("text",{x:x0+pad,y:PH-pad*0.9,fill:inkColour("rule",panel),"font-size":fs*0.78,"font-family":"monospace",opacity:0.55});
    pb.textContent="NO. 2020-";
    g.appendChild(pb);
  }

  if(c.tension){
    var th=el("text",{x:x0+pad,y:y,fill:inkColour("rule",panel),"font-size":fs*0.95,"font-weight":"700","letter-spacing":"0.1em"});
    th.textContent="GUY TENSION";
    g.appendChild(th);
    y+=lh*1.25;
    var colw=w/4;
    for(var r=0;r<TENSION.length;r++){
      for(var cc=0;cc<4;cc++){
        var tt=el("text",{x:x0+pad+cc*colw,y:y,fill:inkColour(r===0?"rule":"light",panel),
          "font-size":fs*0.76,"font-family":"monospace"});
        tt.textContent=TENSION[r][cc];
        g.appendChild(tt);
      }
      if(r===0){ g.appendChild(el("line",{x1:x0+pad,y1:y+fs*0.28,x2:x0+pad+w,y2:y+fs*0.28,stroke:inkColour("rule",panel),"stroke-width":0.6})); }
      y+=fs*1.15;
    }
    y+=lh*0.6;
  }

  if(c.tally){
    g.appendChild(el("rect",{x:x0+pad,y:y-fs,width:w,height:fs*1.2*(TALLY.length+1),fill:"none",stroke:inkColour("rule",panel),"stroke-width":1.1}));
    var tth=el("text",{x:x0+pad+3,y:y,fill:inkColour("heavy",panel),"font-size":fs*0.84,"font-weight":"700","letter-spacing":"0.08em"});
    tth.textContent="TALLY, 40 x 80";
    g.appendChild(tth);
    y+=fs*1.2;
    for(var q=0;q<TALLY.length;q++){
      var a1=el("text",{x:x0+pad+3,y:y,fill:inkColour("light",panel),"font-size":fs*0.78,"font-family":"monospace"});
      a1.textContent=TALLY[q][0];
      g.appendChild(a1);
      var a2=el("text",{x:x0+pad+w-3,y:y,fill:inkColour("heavy",panel),"font-size":fs*0.86,"font-family":"monospace","text-anchor":"end"});
      a2.textContent=TALLY[q][1];
      g.appendChild(a2);
      y+=fs*1.2;
    }
    y+=lh*0.7;
  }

  if(c.diagram){ y = drawDiagram(g,c.diagram,x0+pad,y,w,panel,fs); }

  if(c.continuation){
    var cont = layoutParagraph(c.continuation, maxCols, Math.floor((bottom-y)/lh));
    var cl=el("text",{x:x0+pad,y:y,fill:inkColour("light",panel),"font-size":fs*0.9});
    cl.textContent="…";
    g.appendChild(cl);
    y+=lh;
    for(var z=0;z<cont.lines.length;z++){
      var ct=el("text",{x:x0+pad,y:y,fill:inkColour("light",panel),"font-size":fs*0.9});
      ct.textContent=cont.lines[z];
      g.appendChild(ct);
      y+=lh;
    }
    y+=lh*0.5;
  }

  /* steps */
  for(var i=0;i<c.steps.length && y<bottom;i++){
    var st=c.steps[i];
    var num=el("text",{x:x0+pad,y:y,fill:inkColour("heavy",panel),"font-size":fs*1.28,"font-weight":"800"});
    num.textContent=st[0];
    g.appendChild(num);
    var indent = fs*(String(st[0]).length*0.78+0.9);
    var avail = Math.max(10, Math.floor((w-indent)/(fs*CHAR_W)));
    var linesLeft = Math.max(1, Math.floor((bottom-y)/lh));
    var par = layoutParagraph(st[1], avail, linesLeft);
    for(var L=0;L<par.lines.length;L++){
      var tx=el("text",{x:x0+pad+indent,y:y,fill:inkColour("light",panel),"font-size":fs*0.9});
      tx.textContent=par.lines[L];
      g.appendChild(tx);
      y+=lh;
    }
    if(par.truncated || (st[2]==="CONT")){
      /* the text runs off the panel. it does not reflow and does not continue. */
      var edge=el("text",{x:x0+PW-pad*0.15,y:y-lh*0.15,fill:inkColour("light",panel),"font-size":fs*0.8,"text-anchor":"end",opacity:0.85});
      edge.textContent="→";
      g.appendChild(edge);
    }
    y+=lh*0.42;
  }

  if(c.pencil){
    var pg=el("g",{transform:"rotate(-6 "+(x0+PW*0.5)+" "+(PH*0.78)+")"});
    var pt=el("text",{x:x0+PW*0.5,y:PH*0.78,fill:"#2f5a86","font-size":fs*1.9,"text-anchor":"middle",
      "font-family":"Georgia,serif",opacity:0.62});
    pt.textContent="Y-114";
    pg.appendChild(pt);
    var pt2=el("text",{x:x0+PW*0.5,y:PH*0.78+fs*1.6,fill:"#2f5a86","font-size":fs*0.9,"text-anchor":"middle",
      "font-family":"Georgia,serif",opacity:0.5});
    pt2.textContent="bag 3";
    pg.appendChild(pt2);
    g.appendChild(pg);
  }
}

function drawDiagram(g,kind,x,y,w,panel,fs){
  var col=inkColour("light",panel);

  var gg=el("g",{});
  if(kind==="guy"){
    gg.appendChild(el("line",{x1:x+w*0.12,y1:y+h*0.92,x2:x+w*0.88,y2:y+h*0.92,stroke:col,"stroke-width":0.9}));
    gg.appendChild(el("line",{x1:x+w*0.2,y1:y+h*0.92,x2:x+w*0.2,y2:y+h*0.12,stroke:col,"stroke-width":1.4}));
    gg.appendChild(el("line",{x1:x+w*0.2,y1:y+h*0.12,x2:x+w*0.68,y2:y+h*0.92,stroke:col,"stroke-width":0.9,"stroke-dasharray":"3 2"}));
    gg.appendChild(el("line",{x1:x+w*0.68,y1:y+h*0.92,x2:x+w*0.74,y2:y+h*1.06,stroke:col,"stroke-width":1.6}));
    var a=el("text",{x:x+w*0.30,y:y+h*0.84,fill:col,"font-size":fs*0.72,"font-family":"monospace"});
    a.textContent="45°"; gg.appendChild(a);
  } else if(kind==="stake"){
    gg.appendChild(el("line",{x1:x+w*0.05,y1:y+h*0.4,x2:x+w*0.95,y2:y+h*0.4,stroke:col,"stroke-width":0.8}));
    gg.appendChild(el("line",{x1:x+w*0.28,y1:y+h*0.08,x2:x+w*0.44,y2:y+h*0.95,stroke:col,"stroke-width":2.1}));
    gg.appendChild(el("line",{x1:x+w*0.7,y1:y+h*0.08,x2:x+w*0.7,y2:y+h*0.95,stroke:col,"stroke-width":2.1,"stroke-dasharray":"4 3"}));
    var b=el("text",{x:x+w*0.62,y:y+h*1.14,fill:col,"font-size":fs*0.68,"font-family":"monospace"});
    b.textContent="WRONG"; gg.appendChild(b);

    gg.appendChild(el("path",{d:"M "+(x+w*0.3)+" "+(y+h*0.9)+" L "+(x+w*0.5)+" "+(y+h*0.1)+" L "+(x+w*0.7)+" "+(y+h*0.9),fill:"none",stroke:col,"stroke-width":1.1}));
    gg.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.22,r:w*0.055,fill:"none",stroke:col,"stroke-width":1.2}));
    gg.appendChild(el("line",{x1:x+w*0.5,y1:y+h*0.28,x2:x+w*0.5,y2:y+h*0.98,stroke:col,"stroke-width":1.8}));
  } else {
    /* plan */
    gg.appendChild(el("rect",{x:x+w*0.12,y:y+h*0.16,width:w*0.76,height:h*0.62,fill:"none",stroke:col,"stroke-width":1}));
    for(var i=0;i<=4;i++){
      var px=x+w*0.12+ (w*0.76)*(i/4);
      gg.appendChild(el("line",{x1:px,y1:y+h*0.16,x2:px,y2:y+h*0.78,stroke:col,"stroke-width":0.4}));
    }
    gg.appendChild(el("circle",{cx:x+w*0.37,cy:y+h*0.47,r:2.2,fill:col}));
    gg.appendChild(el("circle",{cx:x+w*0.63,cy:y+h*0.47,r:2.2,fill:col}));
  }
  g.appendChild(gg);
  return y+h*1.3;
}

/* ---------- crease rendering: computed, never drawn as art ---------- */
function creaseAppearance(name){
  var f = S.fatigue[name];
  var sp = S.split[name];
  return {fatigue:f, split:sp};
}

/* Which crease runs down the middle of the presented pair?
   The visible butt-join is always one crease: the one currently
   carrying the presented fold. */
function centreCrease(){
  if(F.H!==0) return "H";
  if(F.V2!==0) return "V2";
  if(F.V1!==0) return "V1";
  if(F.V3!==0) return "V3";
  return "C";
}

var CREASE_GEOM = {}; /* name -> {x, vertical, hit} for the hit test */

function render(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  var pair = outerFaces();
  var defs = el("defs",{});
  /* glovebox stain: a real band, darker and semi-translucent */
  var grad = el("linearGradient",{id:"stainband",x1:"0",y1:"0",x2:"1",y2:"0.25"});
  grad.appendChild(el("stop",{offset:"0", "stop-color":"#b8a97f","stop-opacity":"0"}));
  grad.appendChild(el("stop",{offset:"0.18","stop-color":"#b8a97f","stop-opacity":"0.85"}));
  grad.appendChild(el("stop",{offset:"0.72","stop-color":"#a99a70","stop-opacity":"0.92"}));
  grad.appendChild(el("stop",{offset:"1","stop-color":"#b8a97f","stop-opacity":"0"}));
  defs.appendChild(grad);
  svg.appendChild(defs);

  /* base paper */
  svg.appendChild(el("rect",{x:0,y:0,width:PW*2,height:PH,fill:"#e9e2cd"}));

  /* creased-greyer margins along every fold that has been worked */
  var cc = centreCrease();
  var wear = Math.min(0.85, S.fatigue[cc]);
  svg.appendChild(el("rect",{x:PW-PW*0.09,y:0,width:PW*0.18,height:PH,fill:"#cdc4a8",opacity:(0.15+wear*0.5).toFixed(3)}));

  /* panel groups */
  var gA = el("g",{}); var gB = el("g",{});
  svg.appendChild(gA); svg.appendChild(gB);
  var fs = Math.max(6.0, PH*0.0255);
  drawPanel(gA, pair[0], 0, fs);
  drawPanel(gB, pair[1], PW, fs);

  /* the glovebox band. it sits across two panels of the sheet: panels 9 and 10.
     If either is shown, it lands on it, and the print under it is honestly harder. */
  var bandSide = null;
  if(pair[0]===9||pair[0]===10) bandSide=0;
  if(pair[1]===9||pair[1]===10) bandSide = (bandSide===null)?1:bandSide;
  if(bandSide!==null){
    var bx = bandSide===0?0:PW;
    var band = el("rect",{x:bx,y:PH*0.42,width:PW,height:PH*(0.30+0.03*Math.min(3,S.stain-1)),
      fill:"url(#stainband)","pointer-events":"none"});
    band.setAttribute("transform","rotate(-3 "+(bx+PW/2)+" "+(PH*0.55)+")");
    svg.appendChild(band);
    var band2 = el("rect",{x:bx,y:PH*0.46,width:PW,height:PH*0.22,fill:"#b8a97f",opacity:0.34,"pointer-events":"none"});
    band2.setAttribute("transform","rotate(-3 "+(bx+PW/2)+" "+(PH*0.57)+")");
    svg.appendChild(band2);
  }

  /* the centre crease itself, and its split. computed. */
  CREASE_GEOM = {};
  var app = creaseAppearance(cc);
  var lineCol = app.fatigue>0.55 ? "#c9c0a2" : "#cdc4a8";
  svg.appendChild(el("line",{x1:PW,y1:0,x2:PW,y2:PH,stroke:lineCol,"stroke-width":(0.9+app.fatigue*2.2).toFixed(2),opacity:0.95}));
  /* fibre whitening */
  if(app.fatigue>0.4){
    svg.appendChild(el("line",{x1:PW,y1:0,x2:PW,y2:PH,stroke:"#f3eeda","stroke-width":(app.fatigue*1.8).toFixed(2),opacity:(app.fatigue-0.3).toFixed(2)}));
  }
  /* genuine split, in from the edge. dark field shows through. */
  var splitFrac = Math.min(0.97, app.split/60);
  if(splitFrac>0.001){
    var sl = PH*splitFrac;
    svg.appendChild(el("rect",{x:PW-1.4,y:0,width:2.8,height:sl,fill:"#3b3a33"}));
    /* the strip of ink lost across the gap */
    svg.appendChild(el("rect",{x:PW-4.2,y:0,width:8.4,height:sl,fill:"#e9e2cd",opacity:0.55}));
    svg.appendChild(el("rect",{x:PW-1.2,y:0,width:2.4,height:sl,fill:"#3b3a33"}));
    /* torn edge */
    var d="M "+(PW-1.2)+" 0";
    for(var t=0;t<sl;t+=Math.max(4,PH*0.03)){ d+=" L "+(PW-1.2+(Math.sin(t*0.7)*1.4))+" "+t; }
    svg.appendChild(el("path",{d:d,fill:"none",stroke:"#8f8663","stroke-width":0.6}));
  }
  CREASE_GEOM[cc]={x:PW, name:cc};

  /* the other four creases show as the outer edges and the quarter tucks */
  var others = CREASES.filter(function(n){return n!==cc;});
  var xs=[PW*0.5, PW*1.5, PW*0.16, PW*1.84];
  for(var i=0;i<others.length && i<4;i++){
    var nm=others[i];
    var ap=creaseAppearance(nm);
    var xx=xs[i];
    svg.appendChild(el("line",{x1:xx,y1:PH*0.02,x2:xx,y2:PH*0.98,stroke:"#cdc4a8",
      "stroke-width":(0.5+ap.fatigue*1.3).toFixed(2),opacity:(0.30+ap.fatigue*0.5).toFixed(2)}));
    if(ap.split>0.3){
      svg.appendChild(el("rect",{x:xx-0.8,y:PH*0.02,width:1.6,height:PH*Math.min(0.9,ap.split/60),fill:"#3b3a33",opacity:0.9}));
    }
    CREASE_GEOM[nm]={x:xx,name:nm};
  }

  /* trodden hay at the outer margins only */
  svg.appendChild(el("rect",{x:0,y:0,width:2.5,height:PH,fill:"#9c9a5c"}));
  svg.appendChild(el("rect",{x:PW*2-2.5,y:0,width:2.5,height:PH,fill:"#9c9a5c"}));

  /* raking shadow off the fold */
  svg.appendChild(el("rect",{x:PW,y:0,width:PW*0.10,height:PH,fill:"#3b3a33",opacity:0.055,"pointer-events":"none"}));

  currentPair = pair;
  vondaSpeak(pair);
}

/* ============================================================
   INTERACTION: drag along a crease to fold; press-and-hold to work flat
   ============================================================ */
var pointer={down:false,x:0,y:0,crease:null,moved:0,holdT:null,holding:false};
var currentPair=[1,1];

function nearestCrease(px){
  var best=null, bd=1e9;
  for(var k in CREASE_GEOM){
    var d=Math.abs(CREASE_GEOM[k].x - px);
    if(d<bd){bd=d;best=k;}
  }
  return (bd < PW*0.22) ? best : null;
}

function localX(ev){
  var r=svg.getBoundingClientRect();
  var cx = ev.touches? ev.touches[0].clientX : ev.clientX;
  return (cx - r.left) * ((PW*2)/r.width);
}
function localY(ev){
  var r=svg.getBoundingClientRect();
  var cy = ev.touches? ev.touches[0].clientY : ev.clientY;
  return (cy - r.top) * (PH/r.height);
}

function down(ev){
  ev.preventDefault();
  audioWake();
  pointer.down=true; pointer.moved=0;
  pointer.x=localX(ev); pointer.y=localY(ev);
  pointer.crease=nearestCrease(pointer.x);
  pointer.holding=false;
  if(pointer.crease){
    pointer.holdT=setTimeout(function(){
      pointer.holding=true;
      workFlat(pointer.crease);
    },520);
  }
}
function move(ev){
  if(!pointer.down) return;
  ev.preventDefault();
  var x=localX(ev), y=localY(ev);
  pointer.moved += Math.abs(x-pointer.x)+Math.abs(y-pointer.y);
  if(pointer.moved>PW*0.055 && pointer.holdT){ clearTimeout(pointer.holdT); pointer.holdT=null; }
  if(pointer.crease && !pointer.holding && pointer.moved > PW*0.16){
    var dir = (x - pointer.x) > 0 ? 1 : -1;
    attemptFold(pointer.crease, dir, y);
    pointer.down=false;
    if(pointer.holdT){clearTimeout(pointer.holdT);pointer.holdT=null;}
  }
}
function up(ev){
  pointer.down=false;
  if(pointer.holdT){clearTimeout(pointer.holdT);pointer.holdT=null;}
  if(pointer.holding){ pointer.holding=false; }
}
svg.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
svg.addEventListener("touchstart",down,{passive:false});
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("touchend",up);

/* The manufacturer's intended fold requires H = valley (+1).
   H is split. A split crease refuses that direction. Always. */
function foldRefused(name, dir){
  if(name==="H" && dir===1 && S.split.H > 0.5) return true;
  return false;
}

function attemptFold(name, dir, atY){
  var stiff = S.stiff[name];
  if(foldRefused(name,dir)){
    /* the drag does not take. the paper bulges and springs back. */
    springBack();
    soundRefuse(name);
    vondaNote("refuse");
    return;
  }
  if(stiff > 0.9 && Math.random() < (stiff-0.9)*2.2){
    springBack();
    soundStiff(name);
    return;
  }
  /* real state change */
  var cur = F[name];
  var next;
  if(cur===0) next = dir;
  else if(cur===dir) next = 0;
  else next = dir;
  F[name]=next;

  S.folds++;
  S.fatigue[name] = Math.min(1, S.fatigue[name] + 0.028 + stiff*0.01);
  S.stiff[name] = Math.max(0, S.stiff[name]-0.06);
  NEIGHBOURS[name].forEach(function(n){ S.stiff[n]=Math.min(1.25, S.stiff[n]+0.055); });
  S.stain = Math.min(4, S.stain + 0.008);

  soundCrease(name);

  /* past a threshold, it splits further. permanently. */
  if(S.fatigue[name] > 0.72 && Math.random() < (S.fatigue[name]-0.72)*0.85){
    var grow = 0.8 + Math.random()*2.6;
    S.split[name] = Math.min(58, S.split[name] + grow);
    soundTear(grow);
  }
  save();
  render();
}

function workFlat(name){
  S.stiff[name] = Math.max(0, S.stiff[name]-0.34);
  S.fatigue[name] = Math.min(1, S.fatigue[name]+0.055);
  NEIGHBOURS[name].forEach(function(n){ S.stiff[n]=Math.min(1.25,S.stiff[n]+0.085); });
  if(S.fatigue[name]>0.78 && Math.random()<0.4){
    var g=0.6+Math.random()*2.0;
    S.split[name]=Math.min(58,S.split[name]+g);
    soundTear(g);
  }
  soundBurnish(name);
  save();
  render();
  vondaNote("flat");
}

function springBack(){
  var w=document.getElementById("sheetwrap");
  w.style.transition="transform 90ms ease-out";
  w.style.transform="perspective(700px) rotateY(11deg)";
  setTimeout(function(){ w.style.transform="perspective(700px) rotateY(-3deg)"; },95);
  setTimeout(function(){ w.style.transform="none"; },220);
}

/* ============================================================
   WEB AUDIO — all synthesised
   ============================================================ */
var AC=null, master=null, windGain=null, windFilt=null, windSrc=null;
var awake=false;
function audioWake(){
  if(awake) return;
  awake=true;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    startWind(); scheduleAmbient();
  }catch(e){ AC=null; }
}
window.addEventListener("click",audioWake,{once:true});
window.addEventListener("touchstart",audioWake,{once:true});
window.addEventListener("keydown",audioWake,{once:true});

function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function startWind(){
  windSrc=AC.createBufferSource(); windSrc.buffer=noiseBuf(4); windSrc.loop=true;
  windFilt=AC.createBiquadFilter(); windFilt.type="bandpass"; windFilt.frequency.value=330; windFilt.Q.value=0.7;
  windGain=AC.createGain(); windGain.gain.value=0.055;
  windSrc.connect(windFilt); windFilt.connect(windGain); windGain.connect(master);
  windSrc.start();
  /* backing across the visit: the band centre walks slowly */
  var t0=AC.currentTime;
  windFilt.frequency.setValueAtTime(330,t0);
  windFilt.frequency.linearRampToValueAtTime(215, t0+600);
  gustClock();
}
function gustClock(){
  if(!AC) return;
  var wait = 5 + Math.random()*16;
  setTimeout(function(){
    if(!AC) return;
    var t=AC.currentTime;
    var peak = 0.10 + Math.random()*0.20;
    windGain.gain.cancelScheduledValues(t);
    windGain.gain.setValueAtTime(windGain.gain.value,t);
    windGain.gain.linearRampToValueAtTime(peak,t+0.9+Math.random());
    windGain.gain.linearRampToValueAtTime(0.055,t+3.2+Math.random()*2.5);
    if(peak>0.20){ sheetSnap(peak); luff(); }
    gustClock();
  }, wait*1000);
}
function sheetSnap(strength){
  /* the sheet genuinely tries to leave the hands */
  var w=document.getElementById("sheetwrap");
  var deg = 3 + strength*26;
  w.style.transition="transform 130ms cubic-bezier(.2,.9,.3,1)";
  w.style.transform="perspective(760px) rotateY("+deg+"deg) translateX("+(strength*16).toFixed(1)+"px)";
  setTimeout(function(){ w.style.transform="perspective(760px) rotateY("+(-deg*0.42).toFixed(1)+"deg)"; },150);
  setTimeout(function(){ w.style.transition="transform 300ms ease-out"; w.style.transform="none"; },330);
  if(!AC) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.4);
  var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=1500;
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.16*strength*3,AC.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.24);
  s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+0.4);
}
function luff(){
  if(!AC) return;
  for(var i=0;i<4;i++){
    (function(k){
      setTimeout(function(){
        if(!AC)return;
        var s=AC.createBufferSource(); s.buffer=noiseBuf(0.3);
        var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=180+Math.random()*140; f.Q.value=1.4;
        var g=AC.createGain();
        g.gain.setValueAtTime(0.0001,AC.currentTime);
        g.gain.exponentialRampToValueAtTime(0.05,AC.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.3);
        s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+0.4);
      }, k*180+Math.random()*120);
    })(i);
  }
}
function soundCrease(name){
  if(!AC) return;
  var fat=S.fatigue[name];
  /* soft worn crease folds dull; stiff one cracks bright */
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.22);
  var f=AC.createBiquadFilter(); f.type="bandpass";
  f.frequency.value = 900 + (1-fat)*3400 + S.stiff[name]*900;
  f.Q.value = 0.8 + (1-fat)*2.4;
  var g=AC.createGain();
  var dur = 0.035 + fat*0.10;
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.11+(1-fat)*0.09,AC.currentTime+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+0.3);
}
function soundRefuse(name){
  if(!AC) return;
  /* dull bulge, no report */
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.3);
  var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.075,AC.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.30);
  s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+0.4);
}
function soundStiff(name){
  if(!AC) return;
  var o=AC.createOscillator(); o.type="square"; o.frequency.value=2600;
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.03,AC.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.05);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.08);
}
function soundTear(lenCm){
  if(!AC) return;
  var dur = 0.10 + lenCm*0.055;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(dur+0.2);
  var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=2200;
  var f2=AC.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=4200; f2.Q.value=0.6;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.linearRampToValueAtTime(0.085,AC.currentTime+0.02);
  g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(f);f.connect(f2);f2.connect(g);g.connect(master);
  s.start(); s.stop(AC.currentTime+dur+0.15);
}
function soundBurnish(name){
  if(!AC) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.6);
  var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=760; f.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.linearRampToValueAtTime(0.05,AC.currentTime+0.09);
  g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+0.5);
  s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+0.7);
}
function stakeBar(){
  if(!AC) return;
  var o=AC.createOscillator(); o.type="triangle";
  o.frequency.value=1180+Math.random()*260;
  var o2=AC.createOscillator(); o2.type="sine"; o2.frequency.value=2830;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.055,AC.currentTime+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.55);
  o.connect(g);o2.connect(g);g.connect(master);
  o.start();o2.start();o.stop(AC.currentTime+0.7);o2.stop(AC.currentTime+0.7);
}
function bobwhite(){
  if(!AC) return;
  var t=AC.currentTime;
  [[1500,0],[2350,0.20]].forEach(function(p){
    var o=AC.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(p[0]*0.86,t+p[1]);
    o.frequency.linearRampToValueAtTime(p[0],t+p[1]+0.11);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t+p[1]);
    g.gain.linearRampToValueAtTime(0.045,t+p[1]+0.03);
    g.gain.linearRampToValueAtTime(0.0001,t+p[1]+0.16);
    o.connect(g);g.connect(master);o.start(t+p[1]);o.stop(t+p[1]+0.3);
  });
}
var truckRunning=true, truckNodes=null;
function startTruck(){
  if(!AC) return;
  var o=AC.createOscillator(); o.type="sawtooth"; o.frequency.value=41;
  var o2=AC.createOscillator(); o2.type="sawtooth"; o2.frequency.value=82.6;
  var lfo=AC.createOscillator(); lfo.type="sine"; lfo.frequency.value=3.1;
  var lg=AC.createGain(); lg.gain.value=2.4;
  lfo.connect(lg); lg.connect(o.frequency);
  var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=220;
  var g=AC.createGain(); g.gain.value=0.05;
  o.connect(f);o2.connect(f);f.connect(g);g.connect(master);
  o.start();o2.start();lfo.start();
  truckNodes={o:o,o2:o2,lfo:lfo,g:g};
  setTimeout(function(){
    if(!truckNodes||!AC)return;
    var t=AC.currentTime;
    truckNodes.g.gain.setValueAtTime(truckNodes.g.gain.value,t);
    truckNodes.g.gain.linearRampToValueAtTime(0.0001,t+1.6);
    truckNodes.o.frequency.linearRampToValueAtTime(19,t+1.6);
    setTimeout(function(){
      try{truckNodes.o.stop();truckNodes.o2.stop();truckNodes.lfo.stop();}catch(e){}
      truckNodes=null; truckRunning=false;
    },2200);
  }, 34000 + Math.random()*30000);
}
function scheduleAmbient(){
  startTruck();
  (function barLoop(){
    setTimeout(function(){ stakeBar(); if(Math.random()<0.5) setTimeout(stakeBar,340+Math.random()*260); barLoop(); },
      3000+Math.random()*11000);
  })();
  (function birdLoop(){
    setTimeout(function(){ bobwhite(); birdLoop(); }, 18000+Math.random()*40000);
  })();
}

/* ============================================================
   VONDA. She reads what comes up, in the order the fold gives it.
   ============================================================ */
var voiceEl=document.getElementById("voice");
var lineCount=0;
var seen={};
var stakeRevisions=0;
var glovebox=0;
var canopyNoticed=false;
var pleasedYet=false;
var windMentions=0;
var shoesMentioned=false;
var lookingFor=23;

function put(html){
  var p=document.createElement("p");
  p.innerHTML=html;
  voiceEl.appendChild(p);
  while(voiceEl.childNodes.length>7) voiceEl.removeChild(voiceEl.firstChild);
  voiceEl.scrollTop=voiceEl.scrollHeight;
  lineCount++;
}

function firstStepOn(panel){
  var c=PANEL_CONTENT[panel];
  if(c && c.steps && c.steps.length) return c.steps[Math.floor(Math.random()*Math.min(2,c.steps.length))];
  return null;
}

function readAloud(panel){
  var c=PANEL_CONTENT[panel];
  if(!c) return "";
  if(c.canopy){
    return {num:14, txt:"Pin the four roof rails to the peak fitting FIRST, hand tight, and do not set the pins home.", canopy:true};
  }
  if(c.tension && !c.steps.length){
    return {table:true};
  }
  var s=firstStepOn(panel);
  if(!s) return {table:true};
  return {num:s[0], txt:s[1]};
}

var GLOVEBOX_LINES = [
 "This thing has lived in that glovebox since sixty-eight and every man who ever drove that truck has folded it his own way. I have asked the yard twice to write the manufacturer for a second copy. Twice.",
 "I said it Monday and I said it again at the counter Thursday — get a second copy off the manufacturer, it is one sheet, it is postage. And it is still in the glovebox against that rubber mat.",
 "Second copy. From the manufacturer. That's all I have asked for, twice, and here we are opening this on the hood of a truck in a hayfield."
];

function vondaSpeak(pair){
  var a=pair[0], b=pair[1];
  var read = readAloud(a);
  var readB = readAloud(b);

  /* what came up */
  if(read && read.canopy){
    if(!canopyNoticed){
      put('<b>VONDA:</b> <span class="rd">"Fourteen. Pin the four roof rails to the peak fitting first, hand tight, and do not set the pins home."</span> Roof rails. Peak fitting. <span class="rd">"Fifteen. Raise the assembled roof on two uprights at opposite corners and walk the remaining uprights in."</span> Walk them — <span class="rd">"Sixteen. Drop the cover over the frame from the peak outward."</span> Cover over the fr— that\'s the canopy. That\'s the twenty by twenty frame canopy. Same numbers. Yard\'s got three of these tops and two of those canopies and somebody in Ohio saved a plate. Where\'s my twenty-three.');
      canopyNoticed=true;
    } else {
      put('<b>VONDA:</b> <span class="rd">"Seventeen. Stake the four uprights through the foot plate."</span> Not it. Not mine. Go on, pull that one over.');
    }
  } else if(read && read.table){
    put('<b>VONDA:</b> Tension table. <span class="rd">"Eave height eight foot, stake out eight foot, guy eleven foot four, dressed — fist."</span> That is not twenty-three. Twenty-three is the one that says how much fist and then it runs off the edge of the paper, which is why I want it.');
  } else if(read){
    var n=read.num;
    if(n===23){
      put('<b>VONDA:</b> Twenty-three, there it is — <span class="rd">"Dressed tension is correct when a man can pass his closed fist between the guy and the ground under the guy at mid-span. Any tighter than this and the guys will"</span> — and it goes off the edge. It goes off the edge, and the rest of it is on a panel that will not come up next to this one no matter how I fold it. I know what it says. I want it printed.');
    } else {
      var txt = read.txt.length>150 ? read.txt.slice(0,150) : read.txt;
      put('<b>VONDA:</b> <span class="rd">"'+n+'. '+txt+'"</span> ' + reactTo(n));
    }
  }

  /* the second panel, the one that doesn't belong with it */
  if(lineCount%2===0 && readB && readB.num && !readB.canopy && !readB.table){
    put('<b>VONDA:</b> And butted right up against it, <span class="rd">"'+readB.num+'"</span> — different side of the sheet entirely. Those two have no business next to each other.');
  }

  /* the glovebox complaint, three times over the visit */
  if((lineCount===3 || lineCount===11 || lineCount===21) && glovebox<3){
    put('<b>VONDA:</b> '+GLOVEBOX_LINES[glovebox]);
    glovebox++;
  }

  /* stake count, revised out loud three times */
  if(lineCount===5 && stakeRevisions===0){
    put('<b>VONDA:</b> Forty-four stakes. Thirty-six guy stakes and eight doubles on the low corner — no. No, I counted the low corner twice, the eight doubles are eight extra stakes into the same eight guys, they aren\'t new positions. Thirty-six positions, forty-four stakes in the ground. Tell Duane forty-four.');
    stakeRevisions++;
  }
  if(lineCount===9 && stakeRevisions===1){
    put('<b>VONDA:</b> Forty-four is wrong. Two of the side poles Duane pulled are the wrong length, they belong to the sixty-footer, so that\'s two eave positions I have got no pole for and no stake going in for them tonight. Forty-two in the ground. I\'ll get the two poles off the second truck.');
    stakeRevisions++;
  }
  if(lineCount===15 && stakeRevisions===2){
    put('<b>VONDA:</b> Hold on. Hold on, that figure I read out was off the twenty-foot canopy panel — I read a canopy tally and called it ours. Ours is eighteen side poles, thirty-six positions. Forty-four with the doubles, minus nothing, the two wrong poles came off the truck and are going back on. Forty-four. That is the number, I am done moving it.');
    stakeRevisions++;
  }

  /* pleased, once, flatly */
  if(!pleasedYet && lineCount>=7){
    put('<b>VONDA:</b> Well — every guy out there is still slack. Every one of them. Which means nothing has to come undone, nothing gets taken back off. That is the one thing going right and I will take it.');
    pleasedYet=true;
  }

  /* wind, twice */
  if(windMentions===0 && lineCount===4){
    put('<b>VONDA:</b> Wind\'s backed again. It was south-southwest when we pulled in and it is not now.');
    windMentions++;
  }
  if(windMentions===1 && lineCount===13){
    put('<b>VONDA:</b> There it goes backing again. Sale is at nine. Wall\'s still on the truck.');
    windMentions++;
  }

  /* shoes, once */
  if(!shoesMentioned && lineCount===8){
    put('<b>VONDA:</b> And I have got absolutely the wrong shoes on for a hayfield, I came out of the counter.');
    shoesMentioned=true;
  }
}

function reactTo(n){
  var R={
    31:"Thirty-one. Not twenty-three. Thirty-one always comes up, this sheet loves thirty-one.",
    8:"Eight. That is not twenty-three either. Go the other way on that crease.",
    20:"Twenty. Fine, twenty is right and I already told Duane twenty. I want twenty-three.",
    6:"Six. Six I know. Twenty-three, please.",
    14:"Fourteen — ours, the doubled one, not the canopy fourteen. Still not what I want.",
    30:"Thirty. If it comes on, that wall comes off before anything else does.",
    16:"Sixteen. Yes, that is why the third pole from the west fell over and no, nobody did anything wrong.",
    26:"Twenty-six. Slack before, not during. Which is what twenty-three is about to tell me and won't.",
    46:"Forty-six. Fold to the diagram on panel twelve. Panel twelve. I would love to see panel twelve.",
    47:"Forty-seven. Return this sheet to the bag. It has never once been in the bag."
  };
  if(R[n]) return R[n];
  return "That's "+n+". I want twenty-three.";
}

function vondaNote(kind){
  if(kind==="refuse"){
    if(Math.random()<0.6){
      put('<b>VONDA:</b> It won\'t take that way. It bulges up and comes right back — that long cross fold is split about an inch and a half in and it will not carry a fold in that direction. It has been split since before I got here. Try it the other way and lose the print.');
    } else {
      put('<b>VONDA:</b> No. Not that direction. Push the other one.');
    }
  } else if(kind==="flat"){
    if(Math.random()<0.4){
      put('<b>VONDA:</b> Work it flat like that and it folds easier there forever after, and everything either side of it goes stiff. That is exactly how it got like this.');
    }
  }
}
