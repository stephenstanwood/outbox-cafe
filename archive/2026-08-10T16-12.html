  <meta name="outbox-spec-era" content="1968, right now — twenty past two on a wet grey March afternoon at a bending bench in the tube shop of the Illuminations depot on Rigby Road, Blackpool, England: a ribbon burner running a blue fan of gas flame down the middle of the bench, a rack of clear and phosphor-lined tubing on the wall, chalk pattern lines drawn straight onto the asbestos benchtop, rain going sideways past the roof lights. Not a look-back at 'the great age of neon' and not a 'nobody bends glass by hand anymore' lament — the switch-on is in September, the pattern is chalked, and the gas is already lit.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one bending bench seen from directly overhead and life-size: the ribbon burner's flame fan running across the middle, a chalked pattern line on the benchtop, and ONE length of 15mm glass tubing lying across it with a rubber blow hose taped to the near end. Nothing else — no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The visitor drags the tube bodily through the flame (heat genuinely accumulates only where the glass actually sits in the fan, and conducts along the tube and bleeds away to the cold room), then grabs it either side of the hot zone and bends — the glass yields only where it is honestly soft enough, sags under its own weight while it waits, kinks flat if the bore isn't held open, and cracks clean in half with a real snap if it's dragged cold. Press and hold to blow down the hose: pressure inflates whatever segment is currently soft, pushing the collapsing bore back round and thinning the wall on the outside of the curve. When the shape closes on the chalk line, the tube lifts off the bench, fills, and lights — and the piece IS whatever the visitor's hands actually made, glowing, with every pinch and thin spot showing in the light.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of bending a glass tube for a neon sign by hand — that the working range of the glass is narrow and short, so the whole job is heat management and not strength; that you heat a LENGTH and never a point, because a point heated hard goes to treacle in the middle while the glass two inches away is still rigid and the bend comes out as a hinge instead of a curve; that glass has no melting point in the useful sense, only a viscosity that falls off a cliff, so the same tube is unbendable, perfect, and ruined within about fifteen seconds of each other; that a tube bent without air pressure inside it always collapses on the inside of the curve, because the inside wall goes into compression and buckles, which is why the bender is blowing down a rubber hose the entire time and why a bend is judged by holding it up and looking through the bore and not by looking at its shape; that blowing too hard at the wrong moment balloons the outside wall thin enough to see through and that spot will run hot and blacken first once the sign is up; that soft glass wants preheating and post-flaming or it cracks days later on the wall from stress you cannot see; that a hot bend goes on sagging under its own weight after you stop working it, so it is laid down onto the chalk pattern and held while it stiffens, and the pattern is drawn on the bench because you cannot check a shape against your memory; that brightness in the finished tube is a function of bore diameter and current, so a narrow bore runs brighter and demands more voltage, and a pinched bend is therefore both the brightest spot and the first to fail; that a cold spot anywhere along the tube will collect the mercury and leave a dark patch that never recovers; and that neon gas gives red-orange and only red-orange, while every blue in Blackpool is argon with a bead of mercury in it. Literally glass, gas, gravity, lung pressure, and how long it stays soft.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the flame, the glass and the light, and that register is HOT, LOUD, WET-GREY and BUSY — a ribbon burner roaring flat out under a cold damp workshop, glass going from dead clear to cherry to a sagging honey in a few seconds and stiffening again just as fast, the tick and pop of cooling, drips of condensation running down the roof light, everything happening at working speed with an afternoon's work still to do. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow, NOT glamorous, NOT melancholy — this is a bench with the gas on at twenty past two, not a mood.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Cold wet workshop grey-green (#5c6560) with the asbestos benchtop a chalky bone (#ddd8c8) and its chalk pattern lines in flat white, against which the two working anchors are the heat states of the glass itself: dull cherry (#c22d10) climbing through working orange (#ff8b2b) into a pale straw-white at full softness (#ffe6b0), with cold glass rendered as near-invisible edge-lit outlines (#b9c6c4). Exactly one chip of argon-mercury blue (#4aa8ff) is held strictly for the moment a finished tube lights and for the burner's flame fan. This is the one piece where light genuinely blooms — hot glass throws real colour onto the bench and the lit tube casts a hard blue wash across the chalk — but nothing else glows: everything unheated is flat, damp, matte and hard-edged under grey roof-light.">
  <meta name="outbox-spec-wildcard" content="One finished tube already hangs on the test rack along the very top edge of the frame, permanently lit, bent into a run of joined script — but it hangs almost edge-on to the viewer, so the letters foreshorten into a single tangle of blue and never once resolve into a readable word from this angle. It cannot be touched, dragged, rotated, unlit or reached, it throws a real blue wash down onto the near end of the bench, and it is there identically every visit.">
  <meta name="outbox-spec-forbidden" content="NO neon-as-metaphor for glamour / desire / the electric dream / 'the city's promises' / a light that outlives the shop — it is glass, gas, gravity and lung pressure, and it has nothing to teach anyone. ABSOLUTELY NO vaporwave, synthwave, cyberpunk, neon-noir, rain-slick-street-reflection or Blade-Runner register of any kind, and no pink-and-cyan retro-80s palette drift. NO nostalgia, NO wistfulness, NO 'the last tube benders / the signs are all plastic now / a dying trade' decline narrative — the switch-on is in September and the pattern is chalked. NO seaside-resort melancholy, no faded-glory-of-Blackpool pathos, no end-of-the-pier sentiment. NO ironic or camp affection for old signage, no winking at the script. NO hushed, reverent, meditative or 'watch the glass and let your mind still' register, and NO fire-as-hypnosis. NO sensuous material-porn about molten glass beyond colour, sag and bore. NO cryptic-SCP or ominous dread about the unreadable tube on the rack. NO archival / museum / cabinet / drawer / relic framing of the bench or the tubing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is twenty past two on a wet grey afternoon with the roof lights on. NO signal / transmission / frequency / broadcast framing of the glow or the transformer buzz. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the bench, the flame, the glass and the lit rack, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!-- 12 off, 15mm clear. pattern 68/S/114. sweep the arc in one heat, don't chase it. -->
<style>
  /* chalk stays on the bench. the pattern doesn't lie, your memory does. */
  html,body{margin:0;padding:0;height:100%;background:#5c6560;overflow:hidden;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
  a.arch{position:fixed;right:11px;bottom:9px;color:#ddd8c8;opacity:.20;
         font:13px/1 Georgia,serif;text-decoration:none;letter-spacing:0;z-index:5;}

<body>
<canvas id="c"></canvas>
<a class="arch" href="/archive" title="the rest of the shop" aria-label="the rest of the shop">&#8617;</a>
<script>
(function(){
"use strict";
var cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
var W=0,H=0,DPR=1,S=1,R=10,segLen=4,flameY=0,flameSig=20,fx0=0,fx1=0;
var N=200, ROOM=14, ITER=10;
var nx=new Float32Array(N), ny=new Float32Array(N), px=new Float32Array(N), py=new Float32Array(N);
var T=new Float32Array(N), T2=new Float32Array(N), Tp=new Float32Array(N);
var rest=new Float32Array(N), soft=new Float32Array(N), stiff=new Float32Array(N);
var bore=new Float32Array(N), wall=new Float32Array(N), stressA=new Float32Array(N);
var coldT=new Float32Array(N), lum=new Float32Array(N);
var links=new Uint8Array(N-1);
var chalk=[], benchCan=null, rackPts=[];
var phase='slide', phaseT=0, cov=0, litGain=0, slideFrom=0;
var press=0, blowSet={}, spaceDown=false, blowN=0;
var grab=null, lastBreak=-99, breakPos=0.5, sagDir=1;
var tickQ=[];

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function wrap(a){while(a>Math.PI)a-=6.283185307;while(a<-Math.PI)a+=6.283185307;return a;}

/* ---------------- layout ---------------- */
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=clamp(Math.min(W/1150,H/820),0.5,1.15);
  R=15*S; flameY=H*0.40; flameSig=21*S; fx0=W*0.05; fx1=W*0.95;
  segLen=(780*S)/(N-1);
  buildChalk(); buildBench(); buildRack();
  resetTube();
}
function buildChalk(){
  chalk.length=0;
  var cx=165*S, leg=131*S, topY=flameY+200*S, C=W/2, i, step=5*S;
  var n1=Math.max(4,Math.round(leg/step));
  for(i=0;i<=n1;i++) chalk.push({x:C-cx, y:topY+leg-leg*i/n1});
  var arcLen=Math.PI*cx, n2=Math.max(12,Math.round(arcLen/step));
  for(i=1;i<=n2;i++){ var a=Math.PI + Math.PI*i/n2; chalk.push({x:C+cx*Math.cos(a), y:topY+cx*Math.sin(a)}); }
  for(i=1;i<=n1;i++) chalk.push({x:C+cx, y:topY+leg*i/n1});
}
function buildRack(){
  rackPts=[];
  for(var s=0;s<3;s++){
    var arr=[], n=260;
    for(var i=0;i<=n;i++){
      var t=i/n, x=-50+t*(W+100);
      var y=(15+s*7)*S
        + 11*S*Math.sin(t*47+s*2.1)
        + 6.5*S*Math.sin(t*19.3+1.3+s)
        + 3.2*S*Math.sin(t*93+0.6-s*0.7)
        + 2.0*S*Math.sin(t*131+2.2);
      arr.push({x:x,y:y});
    }
    rackPts.push(arr);
  }
}
function buildBench(){
  benchCan=document.createElement('canvas');
  benchCan.width=Math.round(W*DPR); benchCan.height=Math.round(H*DPR);
  var g=benchCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#5c6560'; g.fillRect(0,0,W,H);
  var bx=W*0.015, by=H*0.055, bw=W*0.97, bh=H*0.90;
  g.fillStyle='#ddd8c8'; g.fillRect(bx,by,bw,bh);
  // chalky mottle
  var i,x,y,r;
  for(i=0;i<2600;i++){
    x=bx+Math.random()*bw; y=by+Math.random()*bh; r=(0.6+Math.random()*3.4)*S;
    var v=Math.random();
    g.fillStyle= v<0.45 ? 'rgba(176,172,158,'+(0.05+Math.random()*0.10)+')'
              : (v<0.8 ? 'rgba(245,242,232,'+(0.05+Math.random()*0.12)+')'
                       : 'rgba(120,118,104,'+(0.03+Math.random()*0.07)+')');
    g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  // long scorch band under the burner
  var sg=g.createLinearGradient(0,flameY-60*S,0,flameY+60*S);
  sg.addColorStop(0,'rgba(96,86,70,0)'); sg.addColorStop(0.5,'rgba(84,74,58,0.30)'); sg.addColorStop(1,'rgba(96,86,70,0)');
  g.fillStyle=sg; g.fillRect(bx,flameY-60*S,bw,120*S);
  // old ghost chalk, wiped
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=2*S;
  for(i=0;i<9;i++){
    g.beginPath();
    var gx=bx+Math.random()*bw, gy=by+40*S+Math.random()*(bh-80*S);
    g.moveTo(gx,gy);
    g.bezierCurveTo(gx+70*S,gy-40*S,gx+140*S,gy+50*S,gx+200*S,gy-10*S);
    g.stroke();
  }
  // burn rings & sooty smears
  for(i=0;i<7;i++){
    x=bx+40*S+Math.random()*(bw-80*S); y=flameY+(Math.random()-0.5)*260*S; r=(10+Math.random()*26)*S;
    g.strokeStyle='rgba(88,76,58,'+(0.10+Math.random()*0.14)+')'; g.lineWidth=(1.5+Math.random()*3)*S;
    g.beginPath(); g.arc(x,y,r,0,6.283); g.stroke();
  }
  // bench edge shadow
  g.strokeStyle='rgba(60,66,62,0.5)'; g.lineWidth=3*S; g.strokeRect(bx,by,bw,bh);
  var eg=g.createLinearGradient(0,by,0,by+26*S);
  eg.addColorStop(0,'rgba(50,56,52,0.35)'); eg.addColorStop(1,'rgba(50,56,52,0)');
  g.fillStyle=eg; g.fillRect(bx,by,bw,26*S);
  // screw heads
  for(i=0;i<10;i++){
    x=bx+30*S+ (bw-60*S)*(i/9); y= (i%2===0)? by+16*S : by+bh-16*S;
    g.fillStyle='rgba(96,98,88,0.55)'; g.beginPath(); g.arc(x,y,3.2*S,0,6.283); g.fill();
    g.strokeStyle='rgba(60,62,56,0.7)'; g.lineWidth=1.1*S;
    g.beginPath(); g.moveTo(x-2.4*S,y-1*S); g.lineTo(x+2.4*S,y+1*S); g.stroke();
  }
}

/* ---------------- tube ---------------- */
function resetTube(){
  var y0=H-78*S, x0=W/2-(segLen*(N-1))/2;
  for(var i=0;i<N;i++){
    nx[i]=x0+i*segLen; ny[i]=y0; px[i]=nx[i]; py[i]=ny[i];
    T[i]=ROOM; Tp[i]=ROOM; rest[i]=0; bore[i]=1; wall[i]=1; stressA[i]=0; coldT[i]=0; lum[i]=0;
    soft[i]=0; stiff[i]=1;
  }
  for(var j=0;j<N-1;j++) links[j]=1;
  phase='slide'; phaseT=0; slideFrom=-W*1.25; cov=0; litGain=0; grab=null;
}
function nearestNode(x,y){
  var best=-1,bd=(46*S)*(46*S);
  for(var i=0;i<N;i++){ var dx=nx[i]-x, dy=ny[i]-y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;} }
  return best;
}
function breakAt(k,kind){
  if(k<1||k>N-3) return;
  if(!links[k]) return;
  links[k]=0;
  breakPos=k/N;
  lastBreak=performance.now()/1000;
  var ang=Math.atan2(ny[k+1]-ny[k],nx[k+1]-nx[k]);
  var ux=Math.cos(ang)*2.1, uy=Math.sin(ang)*2.1;
  px[k]+=ux; py[k]+=uy; px[k+1]-=ux; py[k+1]-=uy;
  px[k-1]+=ux*0.5; py[k-1]+=uy*0.5;
  bore[k]=Math.min(bore[k],0.75); bore[k+1]=Math.min(bore[k+1],0.75);
  snap(kind, k/N);
  if(phase==='work'){ phase='broke'; phaseT=0; grab=null; }
}

/* ---------------- simulation ---------------- */
function sim(dt){
  var i;
  phaseT+=dt;
  if(phase==='slide'){
    var e=clamp(phaseT/0.9,0,1), k=1-Math.pow(1-e,3);
    var y0=H-78*S, x0=W/2-(segLen*(N-1))/2;
    for(i=0;i<N;i++){ nx[i]=x0+i*segLen+slideFrom*(1-k); ny[i]=y0; px[i]=nx[i]; py[i]=ny[i]; }
    if(e>=1){ phase='work'; phaseT=0; }
    return;
  }
  if(phase==='broke' && phaseT>4.2){ resetTube(); return; }
  if(phase==='lit'){
    if(phaseT>15){
      for(i=0;i<N;i++){ ny[i]-=260*S*dt; py[i]=ny[i]; }
      if(ny[0]< -200*S && ny[N-1]< -200*S){ resetTube(); }
    }
    litGain=Math.min(1,litGain+dt*1.6);
  }

  /* pressure */
  blowN=(spaceDown?1:0); for(var kk in blowSet) if(blowSet.hasOwnProperty(kk)) blowN++;
  if(blowN>0) press=Math.min(1,press+dt*2.3); else press*=Math.exp(-dt*5.2);

  /* heat */
  for(i=0;i<N;i++){
    Tp[i]=T[i];
    var ov=0;
    if(nx[i]>fx0-8*S && nx[i]<fx1+8*S){
      var d=(ny[i]-flameY)/flameSig;
      ov=Math.exp(-d*d*0.85);
      if(ov<0.004) ov=0;
    }
    var t=T[i];
    var dT=(1280-t)*0.26*ov - (t-ROOM)*0.10 - 1.6e-11*(Math.pow(t+273,4)-6.79e9);
    T2[i]=t+dT*dt;
  }
  for(i=0;i<N;i++){
    var a=(i>0&&links[i-1])?T2[i-1]:T2[i];
    var b=(i<N-1&&links[i])?T2[i+1]:T2[i];
    T[i]=T2[i]+ (a+b-2*T2[i])*2.0*dt;
    if(T[i]<ROOM) T[i]=ROOM;
    soft[i]=1/(1+Math.exp(-(T[i]-780)/30));
    var st=1-soft[i]; stiff[i]=st*st*Math.sqrt(st);
    if(stiff[i]<0.006) stiff[i]=0.006;
  }

  /* stress from differential cooling; annealed by post-flaming */
  for(i=1;i<N-1;i++){
    if(T[i]>620) stressA[i]*=Math.exp(-dt*1.7);
    if(T[i]>340 && T[i]<720 && T[i]<Tp[i]){
      var cur=Math.abs(T[i-1]-2*T[i]+T[i+1]);
      if(cur>12) stressA[i]+=(cur-12)*dt*0.0016;
    }
    if(stressA[i]>1 && phase==='work'){ breakAt(i,'stress'); }
  }

  /* cooling ticks */
  if(Math.random()<dt*10){
    var hi=-1,hv=0;
    for(i=0;i<N;i++){ var dd=Tp[i]-T[i]; if(T[i]>200 && dd>hv){hv=dd;hi=i;} }
    if(hi>=0 && hv>0.6) tick(hi/N, Math.min(1,hv*2));
  }

  /* plastic flow + bore */
  if(phase==='work'||phase==='broke'){
    for(i=1;i<N-1;i++){
      if(!links[i-1]||!links[i]) continue;
      var a1=Math.atan2(ny[i]-ny[i-1],nx[i]-nx[i-1]);
      var a2=Math.atan2(ny[i+1]-ny[i],nx[i+1]-nx[i]);
      var strain=wrap(a2-a1-rest[i]);
      var s=soft[i];
      var flow=1-Math.exp(-dt*16*Math.pow(s,1.7));
      var dR=strain*flow;
      rest[i]+=dR;
      if(dR!==0){
        var col=Math.abs(dR)*2.6*s;
        bore[i]-=col*Math.max(0,1-press*3.2);
      }
      if(press>0.01 && s>0.05){
        var inf=press*s*dt*1.25;
        bore[i]+=inf;
        if(bore[i]>1) wall[i]-=inf*(0.85+(bore[i]-1)*4.5);
      }
      if(bore[i]<0) bore[i]=0; if(bore[i]>1.55) bore[i]=1.55;
      if(wall[i]<0.05) wall[i]=0.05;
      if(wall[i]<0.30 && phase==='work'){ breakAt(i,'blow'); }
      /* cold overload */
      if(stiff[i]>0.72 && Math.abs(strain)>0.085){
        coldT[i]+=dt;
        if(coldT[i]>0.11 && phase==='work') breakAt(i,'cold');
      } else coldT[i]*=Math.exp(-dt*4);
    }
  }

  /* verlet */
  var fric=0.845;
  for(i=0;i<N;i++){
    var vx=(nx[i]-px[i])*fric, vy=(ny[i]-py[i])*fric;
    px[i]=nx[i]; py[i]=ny[i];
    var ay=210*S*soft[i]*sagDir;
    nx[i]+=vx; ny[i]+=vy+ay*dt*dt;
  }

  /* constraints */
  for(var it=0; it<ITER; it++){
    for(i=0;i<N-1;i++){
      if(!links[i]) continue;
      var dx=nx[i+1]-nx[i], dy=ny[i+1]-ny[i];
      var L=Math.sqrt(dx*dx+dy*dy)||1e-6;
      var diff=(L-segLen)/L*0.5;
      var cx=dx*diff, cy=dy*diff;
      nx[i]+=cx; ny[i]+=cy; nx[i+1]-=cx; ny[i+1]-=cy;
    }
    for(i=1;i<N-1;i++){
      if(!links[i-1]||!links[i]) continue;
      var b1=Math.atan2(ny[i]-ny[i-1],nx[i]-nx[i-1]);
      var b2=Math.atan2(ny[i+1]-ny[i],nx[i+1]-nx[i]);
      var d2=wrap(b2-b1-rest[i]);
      var c2=d2*stiff[i]*0.5*0.5;
      rotAbout(i-1,i,c2); rotAbout(i+1,i,-c2);
    }
    if(grab) applyGrab(0.55);
  }
  if(grab) applyGrab(1.0);

  /* pattern match */
  if(phase==='work'){
    var mx=0; for(i=0;i<N;i++) if(soft[i]>mx) mx=soft[i];
    if((frameCount%6)===0){
      cov=coverage();
      if(cov>0.80 && mx<0.22 && maxT()<430) lightUp();
    }
  }
}
function maxT(){ var m=0; for(var i=0;i<N;i++) if(T[i]>m)m=T[i]; return m; }
function rotAbout(j,p,ang){
  var c=Math.cos(ang), s=Math.sin(ang);
  var dx=nx[j]-nx[p], dy=ny[j]-ny[p];
  nx[j]=nx[p]+dx*c-dy*s; ny[j]=ny[p]+dx*s+dy*c;
}
function applyGrab(mul){
  var g=grab; if(!g) return;
  for(var q=0;q<g.list.length;q++){
    var it=g.list[q], i=it.i;
    var tx=g.x+it.dx, ty=g.y+it.dy;
    var w=it.w*mul;
    nx[i]+=(tx-nx[i])*w; ny[i]+=(ty-ny[i])*w;
  }
}
function coverage(){
  var inC=0, tol=13*S, tol2=tol*tol;
  for(var i=0;i<N;i++){
    var best=1e9;
    for(var j=0;j<chalk.length;j++){
      var dx=nx[i]-chalk[j].x, dy=ny[i]-chalk[j].y, d=dx*dx+dy*dy;
      if(d<best) best=d;
    }
    if(best<tol2) inC++;

  return inC/N;
}
function lightUp(){
  phase='lit'; phaseT=0; grab=null;
  var tot=0;
  for(var i=0;i<N;i++){
    var b=bore[i];
    lum[i]= b<0.105 ? 0 : Math.min(2.4, Math.pow(0.62/Math.max(b,0.20),1.15));
    tot+=Math.min(1.2,b);
  }
  startBuzz(clamp(tot/N,0,1.2));
}

/* ---------------- audio ---------------- */
var A={ok:false};
function audioInit(){
  if(A.ok) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var c=new AC(); A.c=c;
    var master=c.createGain(); master.gain.value=0.85; master.connect(c.destination); A.master=master;
    var len=Math.floor(c.sampleRate*2), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    var last=0;
    for(var i=0;i<len;i++){ var wn=Math.random()*2-1; last=(last+0.02*wn)/1.02; d[i]=last*3.2+wn*0.35; }
    A.noise=buf;
    function src(){ var s=c.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return s; }
    // gas roar
    A.gasF=c.createBiquadFilter(); A.gasF.type='bandpass'; A.gasF.frequency.value=640; A.gasF.Q.value=0.85;
    A.gasG=c.createGain(); A.gasG.gain.value=0.05;
    src().connect(A.gasF); A.gasF.connect(A.gasG); A.gasG.connect(master);
    var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=190;
    A.rumG=c.createGain(); A.rumG.gain.value=0.11;
    src().connect(lp); lp.connect(A.rumG); A.rumG.connect(master);
    // creak
    A.crkF=c.createBiquadFilter(); A.crkF.type='bandpass'; A.crkF.frequency.value=240; A.crkF.Q.value=9;
    A.crkG=c.createGain(); A.crkG.gain.value=0;
    src().connect(A.crkF); A.crkF.connect(A.crkG); A.crkG.connect(master);
    // breath
    var bf=c.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=1050;
    var bf2=c.createBiquadFilter(); bf2.type='bandpass'; bf2.frequency.value=420; bf2.Q.value=1.4;
    A.brG=c.createGain(); A.brG.gain.value=0;
    src().connect(bf); bf.connect(bf2); bf2.connect(A.brG); A.brG.connect(master);
    // transformer
    A.bzG=c.createGain(); A.bzG.gain.value=0;
    var o1=c.createOscillator(); o1.type='sawtooth'; o1.frequency.value=100;
    var o2=c.createOscillator(); o2.type='square'; o2.frequency.value=200;
    var bl=c.createBiquadFilter(); bl.type='lowpass'; bl.frequency.value=680;
    var g2=c.createGain(); g2.gain.value=0.35;
    o1.connect(bl); o2.connect(g2); g2.connect(bl); bl.connect(A.bzG); A.bzG.connect(master);
    o1.start(); o2.start();
    A.ok=true;
  }catch(e){ A.ok=false; }
}
function audioUpdate(){
  if(!A.ok) return;
  try{
    if(A.c.state==='suspended') A.c.resume();
    var i, dmin=1e9, hot=0, crk=0;
    for(i=0;i<N;i++){
      var d=Math.abs(ny[i]-flameY);
      if(nx[i]>fx0&&nx[i]<fx1&&d<dmin) dmin=d;
      if(soft[i]>hot) hot=soft[i];
      var r=(T[i]-Tp[i]);
      if(r>0 && T[i]>500) crk+=r;
    }
    var prox=Math.exp(-Math.pow(dmin/(flameSig*2.1),2));
    if(phase==='slide') prox*=0.3;
    A.gasG.gain.value=0.042+0.062*prox;
    A.gasF.frequency.value=600+980*prox;
    A.rumG.gain.value=0.09+0.05*prox;
    A.crkF.frequency.value=190+900*hot;
    A.crkG.gain.value=Math.min(0.035, hot*0.012+Math.min(crk,4)*0.004);
    A.brG.gain.value=press*0.07;
    if(A.bzG) A.bzG.gain.value=A.bzTarget? A.bzTarget*litGain*0.055 : 0;
  }catch(e){}
}
function startBuzz(v){ if(!A.ok) return; A.bzTarget=clamp(v,0,1.2); }
function snap(kind,pos){
  if(!A.ok) return;
  try{
    var c=A.c, t=c.currentTime;
    var s=c.createBufferSource(); s.buffer=A.noise; s.loop=true;
    var f=c.createBiquadFilter(); f.type='bandpass';
    f.frequency.value= kind==='blow' ? 380+520*pos : 900+2400*(1-pos);
    f.Q.value= kind==='blow'?2.2:7.5;
    var g=c.createGain();
    var peak= kind==='blow'?0.32:0.55;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='blow'?0.22:0.11));
    s.connect(f); f.connect(g); g.connect(A.master);
    s.start(t); s.stop(t+0.3);
    if(kind!=='blow'){
      var o=c.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(1500+2600*(1-pos),t);
      o.frequency.exponentialRampToValueAtTime(300,t+0.09);
      var og=c.createGain();
      og.gain.setValueAtTime(0.22,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
      o.connect(og); og.connect(A.master); o.start(t); o.stop(t+0.14);
    }
  }catch(e){}
}
function tick(pos,amp){
  if(!A.ok) return;
  try{
    var c=A.c,t=c.currentTime;
    var o=c.createOscillator(); o.type='square';
    o.frequency.value=2200+2500*pos;
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.025*amp+0.002,t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
    o.connect(g); g.connect(A.master); o.start(t); o.stop(t+0.05);
  }catch(e){}
}

/* ---------------- colour ---------------- */
function hotColor(t){
  if(t<470) return null;
  var r,g,b;
  if(t<600){ var k=(t-470)/130; r=110+84*k; g=14+31*k; b=6+10*k; }
  else if(t<780){ var k2=(t-600)/180; r=194+61*k2; g=45+94*k2; b=16+27*k2; }
  else { var k3=clamp((t-780)/150,0,1); r=255; g=139+92*k3; b=43+133*k3; }
  return [r|0,g|0,b|0];
}
function heatAlpha(t){ return clamp((t-470)/210,0,1); }

/* ---------------- draw ---------------- */
var frameCount=0;
function draw(time){
  ctx.clearRect(0,0,W,H);
  if(benchCan) ctx.drawImage(benchCan,0,0,W,H);
  drawRoofLight(time);
  drawRackWash();
  drawChalk();
  drawBloom();
  drawBurner(time);
  drawFlame(time,false);
  drawHose();
  if(phase==='lit') drawLit(time); else drawGlass();
  drawFlame(time,true);
  drawRack(time);
  frameCount++;
}
function drawRoofLight(time){
  ctx.save();
  var g=ctx.createLinearGradient(W*0.14,0,W*0.36,H);
  g.addColorStop(0,'rgba(226,231,226,0)'); g.addColorStop(0.35,'rgba(230,235,229,0.10)');
  g.addColorStop(0.65,'rgba(230,235,229,0.10)'); g.addColorStop(1,'rgba(226,231,226,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var g2=ctx.createLinearGradient(W*0.62,0,W*0.84,H);
  g2.addColorStop(0,'rgba(226,231,226,0)'); g2.addColorStop(0.4,'rgba(230,235,229,0.075)');
  g2.addColorStop(0.7,'rgba(230,235,229,0.075)'); g2.addColorStop(1,'rgba(226,231,226,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  // sideways rain streaks in the reflection
  ctx.strokeStyle='rgba(240,244,238,0.055)'; ctx.lineWidth=1;
  for(var i=0;i<26;i++){
    var t=(time*0.28+i*0.137)%1;
    var x=W*0.10+t*W*0.32+ (i%7)*W*0.02;
    var y=(i*97)%H;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+26*S,y+7*S); ctx.stroke();
  }
  // slow condensation drips
  for(var d=0;d<5;d++){
    var tt=((time*0.055)+d*0.21)%1;
    var dx=W*(0.17+d*0.14), dy=tt*H;
    ctx.fillStyle='rgba(238,242,236,0.10)';
    ctx.beginPath(); ctx.ellipse(dx,dy,2.0*S,4.5*S,0,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(238,242,236,0.045)';
    ctx.fillRect(dx-0.7*S,dy-34*S,1.4*S,34*S);
  }
  ctx.restore();
}
function drawRackWash(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  var g=ctx.createLinearGradient(0,0,0,H*0.34);
  g.addColorStop(0,'rgba(74,168,255,0.15)');

  g.addColorStop(1,'rgba(74,168,255,0)');

}
function drawChalk(){
  if(chalk.length<2) return;
  ctx.save();
  var bright=0.42+0.5*clamp((cov-0.35)/0.5,0,1);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(255,255,255,'+(bright*0.30)+')'; ctx.lineWidth=6.5*S;
  path(chalk); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+bright+')'; ctx.lineWidth=2.1*S;
  path(chalk); ctx.stroke();
  // chalk dust flecks along the line
  ctx.fillStyle='rgba(255,255,255,'+(bright*0.5)+')';
  for(var i=0;i<chalk.length;i+=4){
    var p=chalk[i], a=(i*37%11)-5, b=(i*53%11)-5;
    ctx.fillRect(p.x+a*0.6*S,p.y+b*0.6*S,1.1*S,1.1*S);
  }
  // little registration ticks across the pattern
  ctx.strokeStyle='rgba(255,255,255,'+(bright*0.75)+')'; ctx.lineWidth=1.6*S;
  for(var j=0;j<chalk.length;j+=Math.max(8,Math.floor(chalk.length/9))){
    var q=chalk[j], q2=chalk[Math.min(chalk.length-1,j+2)];
    var ang=Math.atan2(q2.y-q.y,q2.x-q.x)+Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(q.x+Math.cos(ang)*7*S,q.y+Math.sin(ang)*7*S);
    ctx.lineTo(q.x-Math.cos(ang)*7*S,q.y-Math.sin(ang)*7*S);
    ctx.stroke();
  }
  ctx.restore();
}
function path(arr){
  ctx.beginPath(); ctx.moveTo(arr[0].x,arr[0].y);
  for(var i=1;i<arr.length;i++) ctx.lineTo(arr[i].x,arr[i].y);
}
function drawBurner(time){
  ctx.save();
  var h=13*S;
  var g=ctx.createLinearGradient(0,flameY-h,0,flameY+h);
  g.addColorStop(0,'#2f3634'); g.addColorStop(0.5,'#454e4a'); g.addColorStop(1,'#262c2a');
  ctx.fillStyle=g; ctx.fillRect(fx0,flameY-h,fx1-fx0,h*2);
  ctx.fillStyle='rgba(20,24,22,0.75)';
  for(var x=fx0+6*S;x<fx1-4*S;x+=5.2*S){ ctx.fillRect(x,flameY-1.6*S,1.7*S,3.2*S); }
  ctx.fillStyle='rgba(150,158,150,0.14)';
  ctx.fillRect(fx0,flameY-h,fx1-fx0,1.4*S);
  ctx.restore();
}
function drawFlame(time,over){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  var al=over?0.30:1.0;
  var g=ctx.createLinearGradient(0,flameY-flameSig*2.2,0,flameY+flameSig*2.2);
  g.addColorStop(0,'rgba(74,168,255,0)');
  g.addColorStop(0.30,'rgba(74,168,255,'+(0.075*al)+')');
  g.addColorStop(0.5,'rgba(150,205,255,'+(0.19*al)+')');
  g.addColorStop(0.70,'rgba(74,168,255,'+(0.075*al)+')');
  g.addColorStop(1,'rgba(74,168,255,0)');
  ctx.fillStyle=g; ctx.fillRect(fx0,flameY-flameSig*2.2,fx1-fx0,flameY*0+flameSig*4.4);
  var step=9*S;
  for(var x=fx0;x<fx1;x+=step){
    var n=Math.sin(x*0.11+time*13)*0.5+Math.sin(x*0.037-time*8.3)*0.5;
    var hgt=flameSig*(1.05+0.42*n);
    var a=(0.16+0.10*n)*al;
    var gg=ctx.createLinearGradient(0,flameY-hgt,0,flameY+hgt);
    gg.addColorStop(0,'rgba(74,168,255,0)');
    gg.addColorStop(0.5,'rgba(196,228,255,'+Math.max(0,a)+')');
    gg.addColorStop(1,'rgba(74,168,255,0)');
    ctx.fillStyle=gg;
    ctx.fillRect(x,flameY-hgt,step*1.05,hgt*2);
  }
  ctx.globalAlpha=0.5*al;
  ctx.strokeStyle='rgba(220,240,255,0.5)'; ctx.lineWidth=1.1*S;
  ctx.beginPath();
  for(var x2=fx0;x2<fx1;x2+=4*S){
    var yy=flameY+Math.sin(x2*0.2+time*17)*1.6*S;
    if(x2===fx0) ctx.moveTo(x2,yy); else ctx.lineTo(x2,yy);
  }
  ctx.stroke();
  ctx.restore();
}
function drawBloom(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(var i=0;i<N;i+=3){
    if(T[i]<520) continue;
    var c=hotColor(T[i]); if(!c) continue;
    var a=heatAlpha(T[i])*0.13;
    var r=(26+34*heatAlpha(T[i]))*S;
    var g=ctx.createRadialGradient(nx[i],ny[i],0,nx[i],ny[i],r);
    g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')');
    g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(nx[i],ny[i],r,0,6.283); ctx.fill();
  }
  ctx.restore();
}
function outerW(i){
  var b=(bore[i]+bore[i+1])*0.5, w=(wall[i]+wall[i+1])*0.5;
  return Math.max(R*0.15, R*(0.19*w+0.81*b));
}
function drawHose(){
  var i=0;
  var ax=nx[0], ay=ny[0];
  var dirx=nx[0]-nx[3], diry=ny[0]-ny[3];
  var L=Math.sqrt(dirx*dirx+diry*diry)||1; dirx/=L; diry/=L;
  var ex=W*0.10, ey=H+70*S;
  var c1x=ax+dirx*90*S, c1y=ay+diry*90*S;
  var c2x=ex-40*S, c2y=ey-150*S;
  ctx.save(); ctx.lineCap='round';
  ctx.strokeStyle='rgba(60,66,62,0.28)'; ctx.lineWidth=9*S;
  ctx.beginPath(); ctx.moveTo(ax+3*S,ay+4*S); ctx.bezierCurveTo(c1x+3*S,c1y+4*S,c2x,c2y,ex,ey); ctx.stroke();
  ctx.strokeStyle='#2c322f'; ctx.lineWidth=7.6*S;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.bezierCurveTo(c1x,c1y,c2x,c2y,ex,ey); ctx.stroke();
  ctx.strokeStyle='rgba(150,160,152,0.16)'; ctx.lineWidth=2.0*S;
  ctx.beginPath(); ctx.moveTo(ax-1*S,ay-1*S); ctx.bezierCurveTo(c1x-1*S,c1y-1*S,c2x-2*S,c2y,ex-2*S,ey); ctx.stroke();
  // tape wraps
  for(var k=0;k<2;k++){
    var t=0.05+k*0.075;
    var bx=bez(ax,c1x,c2x,ex,t), by=bez(ay,c1y,c2y,ey,t);
    var bx2=bez(ax,c1x,c2x,ex,t+0.02), by2=bez(ay,c1y,c2y,ey,t+0.02);
    var an=Math.atan2(by2-by,bx2-bx);
    ctx.save(); ctx.translate(bx,by); ctx.rotate(an);
    ctx.fillStyle='rgba(206,198,176,0.85)';
    ctx.fillRect(-3.4*S,-5.6*S,6.8*S,11.2*S);
    ctx.fillStyle='rgba(150,142,122,0.35)';
    ctx.fillRect(-3.4*S,-5.6*S,6.8*S,1.6*S);
    ctx.restore();
  }
  if(press>0.02){
    ctx.strokeStyle='rgba(180,192,186,'+(0.16*press)+')'; ctx.lineWidth=(9.5+2.5*press)*S;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.bezierCurveTo(c1x,c1y,c2x,c2y,ex,ey); ctx.stroke();
  }
  ctx.restore();
}
function bez(a,b,c,d,t){var u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d;}
function drawGlass(){
  var i;
  ctx.save(); ctx.lineCap='round';
  // shadow
  ctx.strokeStyle='rgba(70,76,70,0.20)';
  for(i=0;i<N-1;i++){
    if(!links[i]) continue;
    ctx.lineWidth=outerW(i)*1.02;
    ctx.beginPath(); ctx.moveTo(nx[i]+2.4*S,ny[i]+3.4*S); ctx.lineTo(nx[i+1]+2.4*S,ny[i+1]+3.4*S); ctx.stroke();
  }
  // body: cold walls
  for(i=0;i<N-1;i++){
    if(!links[i]) continue;
    var t=(T[i]+T[i+1])*0.5;
    var ow=outerW(i);
    ctx.strokeStyle='rgba(185,198,196,'+(0.46-0.30*heatAlpha(t))+')';
    ctx.lineWidth=ow;
    ctx.beginPath(); ctx.moveTo(nx[i],ny[i]); ctx.lineTo(nx[i+1],ny[i+1]); ctx.stroke();
  }
  // bore void
  for(i=0;i<N-1;i++){
    if(!links[i]) continue;
    var b=(bore[i]+bore[i+1])*0.5;
    var w2=(wall[i]+wall[i+1])*0.5;
    var iw=Math.max(0, outerW(i)-2*(0.115*R*w2));
    if(iw<=0.4) continue;
    var t2=(T[i]+T[i+1])*0.5;
    var ha=heatAlpha(t2);
    if(ha<0.02){
      ctx.strokeStyle='rgba(202,197,181,0.50)';
    } else {
      var c=hotColor(t2);
      ctx.strokeStyle='rgba('+(c[0]*0.42|0)+','+(c[1]*0.35|0)+','+(c[2]*0.30|0)+','+(0.28+0.45*ha)+')';
    }
    ctx.lineWidth=iw;
    ctx.beginPath(); ctx.moveTo(nx[i],ny[i]); ctx.lineTo(nx[i+1],ny[i+1]); ctx.stroke();
  }
  // incandescence
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<N-1;i++){
    if(!links[i]) continue;
    var t3=(T[i]+T[i+1])*0.5;
    var c3=hotColor(t3); if(!c3) continue;
    var a3=heatAlpha(t3);
    var w3=(wall[i]+wall[i+1])*0.5;
    ctx.strokeStyle='rgba('+c3[0]+','+c3[1]+','+c3[2]+','+(a3*0.62*Math.min(1,w3+0.25))+')';
    ctx.lineWidth=outerW(i);
    ctx.beginPath(); ctx.moveTo(nx[i],ny[i]); ctx.lineTo(nx[i+1],ny[i+1]); ctx.stroke();
    if(a3>0.55){
      ctx.strokeStyle='rgba(255,230,176,'+((a3-0.55)*0.55)+')';
      ctx.lineWidth=outerW(i)*0.45;
      ctx.beginPath(); ctx.moveTo(nx[i],ny[i]); ctx.lineTo(nx[i+1],ny[i+1]); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
  // fracture faces
  for(i=0;i<N-1;i++){
    if(links[i]) continue;
    ctx.strokeStyle='rgba(240,246,242,0.75)'; ctx.lineWidth=1.6*S;
    fracture(i); fracture(i+1);
  }
  // ends
  ctx.restore();
}
function fracture(i){
  var j=i>0?i-1:1;
  var an=Math.atan2(ny[i]-ny[j],nx[i]-nx[j])+Math.PI/2;
  var r=outerW(Math.min(i,N-2))*0.5;
  ctx.beginPath();
  ctx.moveTo(nx[i]+Math.cos(an)*r,ny[i]+Math.sin(an)*r);
  ctx.lineTo(nx[i]-Math.cos(an)*r*0.6+Math.cos(an+1.6)*1.5*S,ny[i]-Math.sin(an)*r*0.6+Math.sin(an+1.6)*1.5*S);
  ctx.lineTo(nx[i]-Math.cos(an)*r,ny[i]-Math.sin(an)*r);
  ctx.stroke();
}
function drawLit(time){
  var i, lift=clamp(phaseT/0.6,0,1);
  var ox=-3.5*S*lift, oy=-5*S*lift;
  ctx.save(); ctx.lineCap='round';
  // cast shadow on bench
  ctx.strokeStyle='rgba(64,70,66,'+(0.22*lift)+')';
  for(i=0;i<N-1;i++){
    if(!links[i])continue;
    ctx.lineWidth=outerW(i)*1.1;
    ctx.beginPath(); ctx.moveTo(nx[i]+7*S*lift,ny[i]+10*S*lift); ctx.lineTo(nx[i+1]+7*S*lift,ny[i+1]+10*S*lift); ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  var flick=0.94+0.06*Math.sin(time*37)+0.03*Math.sin(time*11.3);
  var layers=[[6.5,0.030],[3.2,0.065],[1.7,0.13]];
  for(var L=0;L<layers.length;L++){
    for(i=0;i<N-1;i++){
      if(!links[i])continue;
      var lv=(lum[i]+lum[i+1])*0.5; if(lv<=0.02) continue;
      ctx.strokeStyle='rgba(74,168,255,'+(layers[L][1]*lv*litGain*flick)+')';
      ctx.lineWidth=outerW(i)*layers[L][0]+2*S;
      ctx.beginPath(); ctx.moveTo(nx[i]+ox,ny[i]+oy); ctx.lineTo(nx[i+1]+ox,ny[i+1]+oy); ctx.stroke();
    }
  }
  for(i=0;i<N-1;i++){
    if(!links[i])continue;
    var lv2=(lum[i]+lum[i+1])*0.5;
    if(lv2<=0.02){
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle='rgba(28,34,38,0.9)'; ctx.lineWidth=Math.max(1.4*S,outerW(i));
      ctx.beginPath(); ctx.moveTo(nx[i]+ox,ny[i]+oy); ctx.lineTo(nx[i+1]+ox,ny[i+1]+oy); ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      continue;
    }
    ctx.strokeStyle='rgba(120,196,255,'+(0.55*Math.min(1.4,lv2)*litGain)+')';
    ctx.lineWidth=Math.max(1.6*S,outerW(i));
    ctx.beginPath(); ctx.moveTo(nx[i]+ox,ny[i]+oy); ctx.lineTo(nx[i+1]+ox,ny[i+1]+oy); ctx.stroke();
    ctx.strokeStyle='rgba(232,246,255,'+(0.45*Math.min(1.5,lv2)*litGain)+')';
    ctx.lineWidth=Math.max(0.9*S,outerW(i)*0.42);
    ctx.beginPath(); ctx.moveTo(nx[i]+ox,ny[i]+oy); ctx.lineTo(nx[i+1]+ox,ny[i+1]+oy); ctx.stroke();
  }
  ctx.restore();
}
function drawRack(time){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  var fl=0.95+0.05*Math.sin(time*29.3);
  for(var s=0;s<rackPts.length;s++){
    var arr=rackPts[s];
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(74,168,255,'+(0.045*fl)+')'; ctx.lineWidth=22*S; path(arr); ctx.stroke();
    ctx.strokeStyle='rgba(74,168,255,'+(0.10*fl)+')'; ctx.lineWidth=9*S; path(arr); ctx.stroke();
    ctx.strokeStyle='rgba(126,198,255,'+(0.55*fl)+')'; ctx.lineWidth=3.0*S; path(arr); ctx.stroke();
    ctx.strokeStyle='rgba(236,248,255,'+(0.50*fl)+')'; ctx.lineWidth=1.15*S; path(arr); ctx.stroke();
  }
  ctx.restore();
  // rack rail, edge on
  ctx.save();
  ctx.fillStyle='rgba(44,50,48,0.85)'; ctx.fillRect(0,0,W,5*S);
  ctx.fillStyle='rgba(120,130,124,0.20)'; ctx.fillRect(0,4.4*S,W,1.1*S);
  for(var x=18*S;x<W;x+=150*S){
    ctx.fillStyle='rgba(40,46,44,0.75)';
    ctx.fillRect(x,0,3.2*S,26*S);
  }
  ctx.restore();
}

/* ---------------- input ---------------- */
function grabAt(x,y,id){
  var g=nearestNode(x,y);
  if(g<0) return false;
  var list=[];
  for(var d=-10;d<=10;d++){
    var i=g+d; if(i<0||i>=N) continue;
    var w=Math.pow(1-Math.abs(d)/11,2)*0.62;
    list.push({i:i,dx:nx[i]-x,dy:ny[i]-y,w:w});
  }
  grab={id:id,x:x,y:y,list:list};
  return true;
}
cvs.addEventListener('pointerdown',function(e){
  e.preventDefault(); audioInit();
  try{cvs.setPointerCapture(e.pointerId);}catch(err){}
  if(!grab && (phase==='work')){
    if(grabAt(e.clientX,e.clientY,e.pointerId)) return;
  }
  blowSet[e.pointerId]=1;
},{passive:false});
cvs.addEventListener('pointermove',function(e){
  e.preventDefault();
  if(grab && grab.id===e.pointerId){ grab.x=e.clientX; grab.y=e.clientY; }
},{passive:false});
function upHandler(e){
  if(grab && grab.id===e.pointerId) grab=null;
  delete blowSet[e.pointerId];
}
cvs.addEventListener('pointerup',upHandler);
cvs.addEventListener('pointercancel',upHandler);
cvs.addEventListener('pointerleave',upHandler);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); audioInit(); spaceDown=true; }
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.key===' ') spaceDown=false;
});
window.addEventListener('blur',function(){ spaceDown=false; blowSet={}; grab=null; });

/* ---------------- loop ---------------- */
var last=0;
function frame(ts){
  var t=ts/1000;
  var dt=last? clamp(t-last,0,0.034) : 0.016;
  last=t;
  try{ sim(dt); audioUpdate(); draw(t); }catch(err){}
  requestAnimationFrame(frame);
}
var rt=null;
window.addEventListener('resize',function(){
  clearTimeout(rt); rt=setTimeout(resize,180);
});
resize();
requestAnimationFrame(frame);
console.log('bench four \u2014 ribbon on full, 14\u00b0 in the shop. heat a length, never a point. blow while it\u2019s soft or the bore shuts. lay it on the chalk and hold it till it stiffens. switch-on\u2019s September.');
})();
</script>
