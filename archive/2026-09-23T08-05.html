  <meta name="outbox-spec-era" content="A Saturday night in late 1999 at a rented videoke machine set up under a tarpaulin in a carport in Marikina, Metro Manila, during a cousin's despedida party. The machine is on loan from a sari-sari store two streets over at 150 pesos for the night. It has a blue-screen MIDI player, a two-digit scoring display and a wired microphone with the cable taped at the joint. The songbook came with it, and it has been passed from party to party for four years.">
  <meta name="outbox-spec-format" content="A BROWSEABLE KARAOKE SONGBOOK. The page is the machine's thick ring-bound song catalogue, laminated page by page, shown as an open binder you flip through. It has coloured tab dividers for ENGLISH / TAGALOG / DUETS / CHRISTMAS / BIRTHDAY / NOVELTY, and every page carries columns of five-digit song codes, titles and artists in tiny dot-matrix type. Over four years of parties the laminate has collected ballpoint stars, highlighter streaks, sticky-note verdicts, scribbled high scores with names beside them, and one page held together with packing tape. The visitor browses by tab, by flipping, or by typing a code into the remote.">
  <meta name="outbox-spec-subject" content="The songbook as a four-year crowd-sourced review of every song worth singing at a party, written onto the laminate by whoever was holding the book. The page tracks which songs reliably score 100 on this particular machine and which ones never do, no matter how well they are sung. It records that the machine seems to reward loudness over pitch, and which duets have started arguments between married couples. It notes that one ballad has been banned from the book by consensus, with the reason crossed out and rewritten three times in three different pens. The regulars appear as initials and first names only, each with their signature song circled.">
  <meta name="outbox-spec-tone" content="The fizzing, all-caps-when-it-matters, heart-and-star-drawing fan energy of Tita Nenita 'Nitz' Dimaculangan-Reyes, 46, who has carried this book to more parties than anyone and who annotates like a superfan live-reviewing a concert. Her notes say things like 'SIGURADO 100 DITO!!! trust me', 'key is TOO HIGH for boys, sorry na', and 'DO NOT let Boyet pick this again (2x)'. She is generous and teasing, never mean, and wildly biased toward power ballads. Other hands occasionally argue back in the margins in different pens, and she always gets the last word.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Videoke blue-screen blue (#1636c4) for the tab dividers, the remote and the score display, on glossy laminated songbook cream (#f5efe0). A single hit of highlighter magenta (#ff2fa0) is reserved for the handwritten high scores and the ballpoint hearts.">
  <meta name="outbox-spec-wildcard" content="The page holding codes 17720 through 17759 is missing, torn out at the rings. All that is left is a stub of laminate and a sticky note from Nitz: 'NASA KAY JUN-JUN, ibalik mo!!!' ('Jun-Jun has it, give it back!!!'). Typing any code in that range still plays an intro and gives a score, but the book flips to the torn stub instead of a song page.">
  <meta name="outbox-spec-forbidden" content="No Y2K or late-nineties nostalgia or retro-kitsch irony, and no 'remember when'. No 'flat arithmetic of X' tradesperson voice: nobody reciting figures twice, revising counts or nursing exactly one grievance. No Filipino-diaspora pathos, no OFW-sacrifice arc, no travelogue explaining the Philippines, and no karaoke-violence or 'My Way killings' reference. No dry deadpan and no lowercase fragments. No archival, museum or cabinet framing of the book: it is going to another party next Saturday.">
