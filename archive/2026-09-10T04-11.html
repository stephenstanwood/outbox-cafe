  <meta name="outbox-spec-era" content="Late April 1971, right now — twenty past three on a warm afternoon in the projection well of a municipal planetarium in Wichita, Kansas, between the 2:30 grade-school show and the 4:00 public sitting. The dome is 40 feet, the star ball is capped and cooling, and the whole ceiling is currently being painted by two converted 500-watt overhead projectors with clock glasses of dyed water and mineral oil sitting on their hot platens. Not a look-back at anything, not a lament, not a memory of vanished venues: the 4:00 is a paying house of 180, the oil in the left glass has been on a hot platen since one o'clock and is thinning, and the magenta dye bottle in the drawer is a third full with no more coming until the school district's purchase order clears in June.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the planetarium dome seen from a seat halfway back, so the image is a real spherical projection: one enormous soft-edged circle of wet colour thrown up onto white acoustic perforated aluminium, with the perf pattern genuinely visible through the light and the dome's curvature genuinely stretching the projected shapes toward the springline. Inside that circle are two overlapping clock glasses of immiscible fluid, several inches across in reality and thirty feet across up there. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label, no readable character anywhere at any time. It is a live immiscible-fluid and thermal-convection engine: dyed water and mineral oil at real interfacial tension, heated from below by a real lamp, breaking into real Bénard cells and real coalescing blobs whose shapes are computed and never drawn, eased or keyframed. The visitor's whole vocabulary is what a hand does on a hot platen — tilt a glass, press a second glass down onto the first to squeeze the film thinner, crank the aperture wheel to open the lamp up — and the cursor is not a pointer but a hand in the light path, which occludes. Nothing scrolls. Nothing resets.">
  <meta name="outbox-spec-subject" content="The flat fluid mechanics and flat dye chemistry of a wet show, and specifically that almost none of what happens up on the dome is chosen by the person doing it. That the whole picture is an immiscibility problem: mineral oil and dyed water will not mix at any temperature the platen can reach, so what the audience is watching is interfacial tension resolving itself over and over, and every round blob up there is round because a sphere is the lowest-area shape a given volume of one fluid can take inside the other, full stop. That BLOB SIZE IS SET BY FILM THICKNESS AND NOTHING ELSE — squeeze a glass down and the same volume of oil is forced into a thinner layer, so it stops being lenses and becomes a mesh of cells, and lifting the glass a sixteenth of an inch reverses it instantly, which means the single most dramatic move in the whole show is a hand pressing down and no audience has ever known that. That HEAT IS THE MOTOR: the lamp puts 500 watts through a condenser lens into the bottom of a glass dish, the fluid at the bottom is warmer and less dense than the fluid at the top, and past a real threshold in that temperature difference the layer stops conducting and starts convecting, organising itself into honest polygonal Bénard cells whose width is roughly the depth of the layer and whose circulation speed goes up with the excess heating — so a projectionist who cranks the aperture for a brighter picture gets a faster picture too, and cannot have one without the other. That VISCOSITY FALLS HARD WITH TEMPERATURE, roughly halving for every twenty or thirty degrees in mineral oil, so a glass that has been sitting on a hot platen since one o'clock is running visibly faster and looser than the identical glass put down five minutes ago, and the two halves of the same show do not match by the middle of the afternoon. That the useful working window is narrow at both ends: too cool and the layer just sits there conducting and does nothing; too hot and the cells lose their geometry, go turbulent, and the colours mechanically stir into an even brown that no amount of tilting will separate — a wet show has an actual expiry. That the COLOURS ARE ANILINE DYES IN THE WATER PHASE ONLY, which is why the oil reads as clear lenses and never as colour, and why every edge you see is a refracting boundary and not a painted line. That those dyes BLEACH under the lamp at a real rate that depends on which dye it is — the reds and magentas go first and fastest, the blue-greens and the copper-sulphate blues hold for hours — so a glass drifts in hue across a single afternoon in a fixed direction, always toward the blue end, and the make-up bottle is the only cure. That LENSING IS THE SECOND PICTURE: an oil lens sitting in water has a genuine focal length, so it projects a real caustic — a bright rim and a hot point — onto the dome, and those caustics are what people actually remember and are not something anybody put there. That the DOME IS A LENS TOO, in the wrong direction: a flat glass projected onto a hemisphere from a fixed point stretches everything toward the edges, so a circle at the middle of the dish is a circle overhead and an oval at the springline, and the geometry cannot be corrected without a fisheye the department did not buy. That the PERFORATED ALUMINIUM eats about a fifth of the light and puts a fine regular grid over everything, which is why the picture is always softer than it looks in the glass. That the lamp's own colour temperature sags as the ballast heats, so the entire dome goes warmer over the afternoon by a real amount and every dye reads differently against it. And the flat arithmetic in the well: two projectors, one aperture wheel that sticks, a third of a bottle of magenta, a house of 180 at four o'clock, and a left-hand glass that has about forty minutes of geometry left in it.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the glass, the heat and the fan, and that register is GREASY, WARM, BRIGHT, SLIGHTLY WOBBLY and PLAINLY HANDMADE — a picture that is enormous and gorgeous and is being produced eight inches across by somebody's fingers on a hot platen; fluid that is genuinely heavy and slow when it is cool and genuinely runny when it is not; a projector fan running the whole time and never once stopping; a wet glass that squeaks against another wet glass; a hand that is in the beam more often than it means to be; light spilling around the edges of the stage and putting a dull amber wash across the lower third of the dome that no projectionist has ever been able to kill. It is a warm room, it is the middle of the afternoon, and the work is cheerful and a bit sticky. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cells go on turning over whether or not anybody touches a glass. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT trippy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT cosmic, NOT reverent — this is two dishes of coloured water on a hot lamp at twenty past three with a paying house at four.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and every colour on the dome is COMPUTED and never chosen. The ground is perforated white acoustic aluminium under a dark room: bare dome (#e4e6e1) where nothing is thrown on it, dropping to a cool unlit grey toward the springline (#9ba1a2), with a real regular perf grid that is visible through every projected shape and genuinely reduces its contrast, and a dull amber spill wash across the lower third from the stage lights that cannot be removed (#c9a375 at ten percent). Against that, the fluid: EVERY PIXEL OF PROJECTED COLOUR IS THE OUTPUT OF DYE ARITHMETIC — each water cell carries an actual concentration of each aniline dye, an actual path length through the layer, and an actual accumulated bleach dose, and its transmitted colour comes out of Beer–Lambert absorption against the lamp's live spectrum and nothing else. So a deep pool of magenta reads a saturated crimson-pink (#d5197c), the same dye stretched thin over a squeezed film reads a pale hot rose (#f2a3c4), copper-sulphate blue-green in depth reads a hard teal (#12a3a0) and thin reads a chalky aqua (#8fd4d0), and where the two overlap the engine multiplies the absorptions honestly and gets a real muddy indigo-brown (#4a4a55) rather than a picked purple. Mineral oil carries no dye at all and renders only as refraction: clear lenses whose rims are computed caustics — a bright thin ring and a hot focal point measurably brighter than the surrounding dome (#fffaf0). Bleaching is live and permanent, so the magentas thin and grey across the afternoon and the teals do not, and the whole dome drifts blue-green while the lamp's own colour temperature sags warm underneath it, and the two drifts do not cancel. Exactly one chip of the aperture wheel's painted index red (#b02a1e) is held strictly for the wheel's own pointer and the metal shade over the platen — the only two solid objects in frame — and it never appears in the projection. Flat, hard, high contrast in the middle of the dome and honestly washed at the edges; no glow filter, no bloom, no lens flare, no soft focus, no gradients other than honest absorption, honest caustics, honest perf grid and honest spill.">
  <meta name="outbox-spec-wildcard" content="THE CURSOR IS NEVER RENDERED AS A CURSOR. The system pointer is hidden and never replaced by a dot, a crosshair, a glyph, a glow, a trail or a custom icon of any kind. The visitor's only evidence of their own position is the shadow their hand casts into the light path and onto the dome — a real soft-edged silhouette whose penumbra width is computed from how far the hand currently is from the lamp, so it is razor-sharp when the hand is down on the platen and enormous and vague when it is lifted away. Move off the projector entirely and there is no shadow and therefore no pointer at all, and the page gives no other feedback about where anything is.">
  <meta name="outbox-spec-forbidden" content="NO psychedelia framing of any kind — no acid, no trip, no expanded consciousness, no Summer of Love, no counterculture, no 'far out', no sixties-as-myth, no Fillmore, no Joshua Light Show hagiography, no Pink Floyd, no Hendrix, no strobe-and-incense, no dropout mysticism, no chakras, no third eye. NO cosmic register whatsoever, despite the room being a planetarium: no stars, no galaxies, no nebula comparison, no 'the universe in a dish', no Sagan, no wonder, no smallness, no awe, no 'we are made of' anything, no the-dome-as-heaven. NO lava-lamp kitsch, NO retro-kitsch, NO camp, NO ironic affection for 1971, NO Austin Powers, NO groovy, NO shag-carpet-and-macramé colour writing, NO Nixon, NO Vietnam drift, NO moon-landing hindsight, NO 1971-as-period-signifier at all. NO nostalgia, NO wistfulness, NO 'nobody does wet shows anymore / lasers killed it / the planetarium closed in 1994' decline narrative — there is a paying house at four. NO craftsman-sage register, NO 'the old light-show men could read a glass from the booth', NO trade mystique, NO artisan sermon, NO analogue-versus-digital argument, NO master-and-apprentice arc, NO reverence for hand skill. NO colour lyricism: no describing the fluid as molten, jewelled, liquid fire, bleeding, breathing or blooming; colour here is dye concentration, path length and remaining bleach headroom. NO fluid lyricism: no dancing, no swirling-as-emotion, no 'shapes that have never existed before', no organic-versus-mechanical framing, no cells-as-life, no amoeba or cellular-division imagery, no microscope-slide reverie. NO physics-as-beauty, NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the wonderful part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, chillout, ambient-visualiser, generative-art-gallery, music-visualiser, VJ-set or screensaver framing whatsoever, and no 'let it wash over you' — the fan is loud, the glass is greasy and there is a hand in the beam. NO Kansas travelogue and NO explaining the Midwest to anybody: no big sky, no wheat, no tornado, no flyover condescension, no Wizard of Oz, no small-city pathos, no municipal-budget satire, no bureaucratic-absurd, no committee minutes, no department-of-X. NO school-group comedy and NO children-as-wonderstruck sentiment. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the darkening room, the bleaching dye or the glass that goes muddy and cannot be fixed — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / found-media / relic framing of any object in the well — both glasses were filled this morning and one of them is too hot right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / booth-operator / log / 3am voice — it is twenty past three in the afternoon and the house lights in the lobby are up. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

var gate=new Float32Array(GS*GS*3);
var absb=new Float32Array(GS*GS*3);
var cauA=new Float32Array(GS*GS);
var covA=new Uint8Array(GS*GS);

var DR=1, DCX=0, DCY=0, TANM=Math.tan(62*Math.PI/180);

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function smoothstep(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}

/* ---------------- persistence ---------------- */
var KEY='wetshow.platen.v1';
var S={ap:5,lampH:0,gl:[{T:61,h:2.20,mm:1,cm:1},{T:43,h:0.28,mm:1,cm:1}],dropsM:46,dropsC:33};

    S.dropsM=clamp(o.dropsM|0,0,46); S.dropsC=clamp(o.dropsC|0,0,33);
  }
}}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({ap:S.ap,lampH:S.lampH,
  gl:[{T:G[0].T,h:G[0].hoursOn,mm:G[0].meanM(),cm:G[0].meanC()},{T:G[1].T,h:G[1].hoursOn,mm:G[1].meanM(),cm:G[1].meanC()}],
  dropsM:S.dropsM,dropsC:S.dropsC})); }catch(e){} }

/* ---------------- glass ---------------- */
var N=64, N2=N*N;
function Glass(cx,cy,rad,st,seed){
  this.cx=cx; this.cy=cy; this.rad=rad;
  this.phi=new Float32Array(N2); this.mu=new Float32Array(N2); this.lp=new Float32Array(N2);
  this.cm=new Float32Array(N2); this.cc=new Float32Array(N2); this.tmp=new Float32Array(N2);
  this.gain=new Float32Array(N2); this.sm=new Float32Array(N2); this.sm2=new Float32Array(N2);
  this.T=st.T; this.hoursOn=st.h; this.squeeze=0; this.sqT=0; this.hRel=1;
  this.Voil=0.30; this.tvx=0; this.tvy=0; this.rnd=seed;
  this.ph=[]; for(var k=0;k<4;k++) this.ph.push({a:this.r()*6.283,p:this.r()*6.283,d:(this.r()-0.5)*0.28});
  var i,j,x,y,o;
  for(j=0;j<N;j++)for(i=0;i<N;i++){
    o=j*N+i; x=(i/(N-1))*2-1; y=(j/(N-1))*2-1;
    this.phi[o]=(this.r()*2-1)*0.9 + 0.6*Math.sin(x*4.1+seed)*Math.cos(y*3.7-seed);
    var band=0.5+0.5*Math.sin(x*2.2+y*1.4+seed*2.0);
    this.cm[o]=(0.35+0.75*band);
    this.cc[o]=(0.35+0.75*(1-band));
    if(x*x+y*y>1){this.cm[o]=0;this.cc[o]=0;}
  }
  var mm=st.mm, cc0=st.cm;
  for(i=0;i<N2;i++){ this.cm[i]*=mm; this.cc[i]*=cc0; }
}
Glass.prototype.r=function(){ this.rnd=(this.rnd*1664525+1013904223)&0x7fffffff; return this.rnd/0x7fffffff; };
Glass.prototype.meanM=function(){var s=0,n=0;for(var i=0;i<N2;i++){s+=this.cm[i];n++;}return clamp(s/n/0.72,0,1);};
Glass.prototype.meanC=function(){var s=0,n=0;for(var i=0;i<N2;i++){s+=this.cc[i];n++;}return clamp(s/n/0.72,0,1);};

function lapl(src,dst){
  var i,j,o,im,ip,jm,jp;
  for(j=0;j<N;j++){
    jm=(j>0?j-1:1)*N; jp=(j<N-1?j+1:N-2)*N; o=j*N;
    for(i=0;i<N;i++){
      im=i>0?i-1:1; ip=i<N-1?i+1:N-2;
      dst[o+i]=src[o+im]+src[o+ip]+src[jm+i]+src[jp+i]-4*src[o+i];
    }
  }
}

var Rac=1708, KAPPA=8e-8, ALPHA=7e-4, GRAV=9.81, KTH=0.13, TROOM=27.5;
Glass.prototype.step=function(dt,ap){
  /* --- thickness from squeeze: volume conserved --- */
  this.sqT += (this.squeeze - this.sqT)*Math.min(1,dt*(this.squeeze>this.sqT?7:11));
  this.hRel = 1 - 0.62*this.sqT;
  var h_mm = 1.6*this.hRel, h_m = h_mm*0.001;
  /* --- bulk temperature: heat in from platen vs loss to room --- */
  var flux = 8200*ap;
  this.T += ((flux*0.00042) - 0.055*(this.T-TROOM))*dt;
  this.T = clamp(this.T,TROOM,118);
  this.hoursOn += dt/3600;
  /* --- viscosity falls with temperature --- */
  var nu = 9e-6*Math.pow(2,-(this.T-40)/25);
  /* --- vertical temperature difference and Rayleigh number --- */
  var dT = Math.min(52, flux*h_m/KTH);
  var Ra = GRAV*ALPHA*dT*h_m*h_m*h_m/(nu*KAPPA);
  var exc = Ra/Rac - 1;
  var U = exc>0 ? Math.min(3.4, 1.35*Math.sqrt(exc)) : 0;
  /* --- cell width scales with layer depth --- */
  var wc = 2.4 + 7.6*Math.pow(this.hRel,0.7);
  var kc = 6.28318/wc;
  var t=nowS();
  var i,j,o,x,y;
  /* --- advection by convection streamfunction + hand tilt --- */
  if(U>0.001 || Math.abs(this.tvx)+Math.abs(this.tvy)>0.001){
    var p=this.ph;
    for(j=0;j<N;j++){
      y=j; o=j*N;
      for(i=0;i<N;i++){
        x=i;
        var vx=0,vy=0;
        for(var m=0;m<4;m++){
          var a=p[m].a+p[m].d*t*0.09;
          var kx=kc*Math.cos(a), ky=kc*Math.sin(a);
          var arg=kx*x+ky*y+p[m].p+t*0.11*(m+1)*0.3;
          var c=Math.cos(arg);
          vx += ky*c; vy += -kx*c;
        }
        var s=U*0.34/kc;
        this.tmp[o+i]=0;
        var sx=x - (vx*s+this.tvx)*dt*3.2;
        var sy=y - (vy*s+this.tvy)*dt*3.2;
        this.lp[o+i]=sx; this.mu[o+i]=sy;
      }
    }
    advect(this.phi,this.lp,this.mu,this.tmp);
    advect(this.cm,this.lp,this.mu,this.tmp);
    advect(this.cc,this.lp,this.mu,this.tmp);
  }
  this.tvx*=Math.exp(-dt*1.9); this.tvy*=Math.exp(-dt*1.9);
  /* --- interfacial tension: Cahn-Hilliard, mobility rises as oil thins --- */
  var eps2 = 0.75 + 3.1*this.hRel*this.hRel;
  var M = 0.055*Math.min(2.4,(9e-6/nu));
  var sub=2;
  for(var s2=0;s2<sub;s2++){
    lapl(this.phi,this.lp);
    for(i=0;i<N2;i++){ var f=this.phi[i]; this.mu[i]=f*f*f-f-eps2*this.lp[i]; }
    lapl(this.mu,this.lp);
    for(i=0;i<N2;i++){ this.phi[i]+=M*this.lp[i]; }
  }
  /* --- conservation: same oil volume in a thinner film = more oil area --- */
  var fo=clamp(this.Voil/this.hRel,0.10,0.88);
  var target=2*fo-1, sum=0;
  for(i=0;i<N2;i++) sum+=this.phi[i];
  var corr=target-sum/N2;
  for(i=0;i<N2;i++){ this.phi[i]=clamp(this.phi[i]+corr*0.55,-1.6,1.6); }
  /* --- dye bleaches forward only, magenta fast --- */
  var bm=Math.exp(-1.35e-3*ap*dt), bc=Math.exp(-1.3e-4*ap*dt);
  for(i=0;i<N2;i++){ this.cm[i]*=bm; this.cc[i]*=bc; }
  /* --- caustic gain from oil-lens curvature --- */
  for(i=0;i<N2;i++) this.sm[i]=clamp((this.phi[i]+1)*0.5,0,1);
  box3(this.sm,this.sm2); box3(this.sm2,this.sm);
  var D=5.2*this.hRel;
  for(j=1;j<N-1;j++){ o=j*N;
    for(i=1;i<N-1;i++){
      var c0=this.sm[o+i];
      var xx=this.sm[o+i+1]-2*c0+this.sm[o+i-1];
      var yy=this.sm[o+N+i]-2*c0+this.sm[o-N+i];
      var xy=(this.sm[o+N+i+1]-this.sm[o+N+i-1]-this.sm[o-N+i+1]+this.sm[o-N+i-1])*0.25;
      var det=(1+D*xx)*(1+D*yy)-(D*xy)*(D*xy);
      var g=1/Math.max(0.22,Math.abs(det));
      this.gain[o+i]=Math.min(4.2,g)-1;
    }
  }
};
function advect(f,sxA,syA,tmp){
  var i,j,o;
  for(j=0;j<N;j++){ o=j*N;
    for(i=0;i<N;i++){
      var sx=clamp(sxA[o+i],0,N-1.001), sy=clamp(syA[o+i],0,N-1.001);
      var x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,b=y0*N+x0;
      tmp[o+i]=f[b]*(1-fx)*(1-fy)+f[b+1]*fx*(1-fy)+f[b+N]*(1-fx)*fy+f[b+N+1]*fx*fy;
    }
  }
  f.set(tmp);
}
function box3(src,dst){
  var i,j,o,jm,jp,im,ip;
  for(j=0;j<N;j++){ jm=(j>0?j-1:0)*N; jp=(j<N-1?j+1:N-1)*N; o=j*N;
    for(i=0;i<N;i++){ im=i>0?i-1:0; ip=i<N-1?i+1:N-1;
      dst[o+i]=(src[o+im]+src[o+i]+src[o+ip]+src[jm+i]+src[jp+i]+src[jm+im]+src[jm+ip]+src[jp+im]+src[jp+ip])/9;
    }
  }
}
var G=[ new Glass(-0.33,-0.04,0.63,S.gl[0],9137), new Glass(0.32,0.07,0.60,S.gl[1],4421) ];

/* ---------------- lamp ---------------- */
function apFrac(){ return 0.10+0.90*(S.ap/8); }
function lampRGB(){
  var K=3360-190*Math.min(1.6,S.lampH)-55*S.ap/8;
  var t=K/100,r,g,b;
  if(t<=66){r=255;} else {r=329.7*Math.pow(t-60,-0.1332);}
  if(t<=66){g=99.47*Math.log(t)-161.12;} else {g=288.12*Math.pow(t-60,-0.0755);}
  if(t>=66){b=255;} else if(t<=19){b=0;} else {b=138.52*Math.log(t-10)-305.04;}

}

/* ---------------- geometry / LUT ---------------- */
function resize(){
  var cw=Math.max(240,innerWidth), ch=Math.max(240,innerHeight);
  var mx=630, s=Math.min(1,mx/Math.max(cw,ch));
  W=Math.max(220,Math.round(cw*s)); H=Math.max(220,Math.round(ch*s));
  cv.width=W; cv.height=H; img=ctx.createImageData(W,H); data=img.data;
  buildLUT();
}
function buildLUT(){
  var n=W*H;
  lutX=new Float32Array(n); lutY=new Float32Array(n); fac=new Float32Array(n);
  baseR=new Float32Array(n); baseG=new Float32Array(n); baseB=new Float32Array(n); stretch=new Float32Array(n);
  DR=0.62*Math.max(W,H); DCX=W*0.5; DCY=H*0.455;
  var A0=DR*0.63662*TANM, PER=4.3;
  for(var y=0,p=0;y<H;y++){
    for(var x=0;x<W;x++,p++){
      var dx=x-DCX, dy=y-DCY, r=Math.sqrt(dx*dx+dy*dy), rr=r/DR;
      /* bare aluminium in a dark room, cooling toward the springline */
      var m=smoothstep(0.35,1.15,rr);
      var br=(0xe4*(1-m)+0x9b*m), bg=(0xe6*(1-m)+0xa1*m), bb=(0xe1*(1-m)+0xa2*m);
      var amb=0.155-0.055*smoothstep(0.2,1.2,rr);
      br*=amb; bg*=amb; bb*=amb;
      /* stage spill across the lower third, cannot be killed */
      var sp=smoothstep(0.52,1.0,y/H)*0.10;
      br+=0xc9*sp; bg+=0xa3*sp; bb+=0x75*sp;
      /* perforated sheet: a real grid, compressed toward the edge */
      var cf=1+1.15*rr*rr;
      var hx=Math.cos(dx*cf*Math.PI/PER), hy=Math.cos(dy*cf*Math.PI/PER);
      var hm=Math.pow(Math.max(0,hx*hy),6);
      var perf=0.80*(1-0.34*hm);
      br*= (0.62+0.38*(1-0.34*hm)); bg*=(0.62+0.38*(1-0.34*hm)); bb*=(0.62+0.38*(1-0.34*hm));
      baseR[p]=br; baseG[p]=bg; baseB[p]=bb;
      /* invert the dome projection: screen -> flat gate */
      var th=(Math.PI/2)*rr;
      var g=(th<1.5533)? Math.tan(th)/TANM : 99;
      if(g<=1.0 && r>0.0001){
        var gx=g*dx/r, gy=g*dy/r;
        var px=(gx+1)*0.5*(GS-2), py=(gy+1)*0.5*(GS-2);
        lutX[p]=clamp(px,0,GS-2.001); lutY[p]=clamp(py,0,GS-2.001);
        var drdg=DR*0.63662*TANM/(1+(g*TANM)*(g*TANM));
        var jac=(drdg*(r/(g*A0)))/1;
        var dim=clamp(1/Math.max(0.12,jac*(1+(g*TANM)*(g*TANM))/(1+(g*TANM)*(g*TANM))),0,1.6);
        dim=clamp((1/ (1+(g*TANM)*(g*TANM)) )*(A0*g/Math.max(1e-4,r)),0.05,1.4);
        var taper=1-smoothstep(0.92,1.0,g);
        fac[p]=dim*perf*taper;
        stretch[p]=clamp(Math.max(0.4,r/Math.max(1e-4,g*A0)),0.4,4.5);
      } else if(r<=0.0001){
        lutX[p]=(GS-2)*0.5; lutY[p]=(GS-2)*0.5; fac[p]=perf; stretch[p]=1;
      } else { lutX[p]=-1; lutY[p]=-1; fac[p]=0; stretch[p]=1; }
    }
  }
}

/* ---------------- gate raster ---------------- */
var EM=[0.09,1.10,0.34], EC=[1.27,0.21,0.22], PATH=2.25;
function renderGate(){
  absb.fill(0); cauA.fill(0); covA.fill(0);
  var lam=lampRGB(), I=Math.pow(apFrac(),1.5)*1.22;
  for(var gi=0;gi<2;gi++){
    var gl=G[gi];
    var cxp=(gl.cx+1)*0.5*GS, cyp=(gl.cy+1)*0.5*GS, rp=gl.rad*0.5*GS;
    var x0=Math.max(0,Math.floor(cxp-rp)), x1=Math.min(GS-1,Math.ceil(cxp+rp));
    var y0=Math.max(0,Math.floor(cyp-rp)), y1=Math.min(GS-1,Math.ceil(cyp+rp));
    var pathL=gl.hRel*PATH;
    for(var y=y0;y<=y1;y++){
      var ly=(y-cyp)/rp;
      for(var x=x0;x<=x1;x++){
        var lx=(x-cxp)/rp, d2=lx*lx+ly*ly;
        if(d2>1) continue;
        var u=(lx*0.5+0.5)*(N-1.001), v=(ly*0.5+0.5)*(N-1.001);
        var iu=u|0, iv=v|0, fu=u-iu, fv=v-iv, b=iv*N+iu;
        var w00=(1-fu)*(1-fv), w10=fu*(1-fv), w01=(1-fu)*fv, w11=fu*fv;
        var ph=gl.phi[b]*w00+gl.phi[b+1]*w10+gl.phi[b+N]*w01+gl.phi[b+N+1]*w11;
        var cm=gl.cm[b]*w00+gl.cm[b+1]*w10+gl.cm[b+N]*w01+gl.cm[b+N+1]*w11;
        var cc=gl.cc[b]*w00+gl.cc[b+1]*w10+gl.cc[b+N]*w01+gl.cc[b+N+1]*w11;
        var gn=gl.gain[b]*w00+gl.gain[b+1]*w10+gl.gain[b+N]*w01+gl.gain[b+N+1]*w11;
        var oil=clamp((ph+1)*0.5,0,1);
        var pl=pathL*(1-oil);
        var mm=cm*pl, ccn=cc*pl;
        var rim=1-smoothstep(0.90,1.0,Math.sqrt(d2));
        var o1=(y*GS+x), o3=o1*3;
        absb[o3]  +=mm*EM[0]+ccn*EC[0] + (1-rim)*1.6;
        absb[o3+1]+=mm*EM[1]+ccn*EC[1] + (1-rim)*1.6;
        absb[o3+2]+=mm*EM[2]+ccn*EC[2] + (1-rim)*1.6;
        cauA[o1]+=Math.max(0,gn)*0.30*rim;
        covA[o1]=1;
      }
    }
  }
  for(var p=0,q=0;p<GS*GS;p++,q+=3){
    if(covA[p]){
      var ca=cauA[p]*I;
      gate[q]  =(lam[0]*Math.exp(-absb[q])*I + ca*1.00);
      gate[q+1]=(lam[1]*Math.exp(-absb[q+1])*I + ca*0.98);
      gate[q+2]=(lam[2]*Math.exp(-absb[q+2])*I + ca*0.94);
    } else {
      gate[q]=lam[0]*I*0.022; gate[q+1]=lam[1]*I*0.022; gate[q+2]=lam[2]*I*0.021;
    }
  }
}

/* ---------------- hand ---------------- */
var hand={x:-999,y:-999,px:-999,py:-999,z:0.55,down:false,vx:0,vy:0,active:false,holdT:0,still:0};
function screenToBuf(cx,cy){ return [cx*(W/innerWidth), cy*(H/innerHeight)]; }
function bufToGate(bx,by){
  var dx=bx-DCX, dy=by-DCY, r=Math.sqrt(dx*dx+dy*dy), rr=r/DR, th=(Math.PI/2)*rr;
  if(th>=1.5533) return null;
  var g=Math.tan(th)/TANM;
  if(g>1.05) return null;
  return [g*dx/(r||1), g*dy/(r||1)];
}

/* ---------------- console (the only solid objects) ---------------- */
var wheel={x:0,y:0,r:30,drag:false,acc:0};
function drawConsole(){
  var r=Math.max(24,Math.min(W,H)*0.082);
  wheel.r=r; wheel.x=r*1.45; wheel.y=H-r*1.35;
  ctx.save();
  /* metal shade over the platen */
  ctx.beginPath();
  ctx.moveTo(W*0.26,H+8); ctx.lineTo(W*0.31,H-H*0.055); ctx.lineTo(W*0.99,H-H*0.038);
  ctx.lineTo(W+8,H+8); ctx.closePath();
  ctx.fillStyle='#0d0e0f'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(W*0.31,H-H*0.055); ctx.lineTo(W*0.99,H-H*0.038);
  ctx.lineWidth=Math.max(1,W*0.0025); ctx.strokeStyle='#b02a1e'; ctx.globalAlpha=0.85; ctx.stroke(); ctx.globalAlpha=1;
  /* aperture wheel */
  ctx.beginPath(); ctx.arc(wheel.x,wheel.y,r,0,6.2832); ctx.fillStyle='#101112'; ctx.fill();
  ctx.beginPath(); ctx.arc(wheel.x,wheel.y,r*0.985,0,6.2832); ctx.lineWidth=Math.max(1,r*0.05); ctx.strokeStyle='#1d1f20'; ctx.stroke();
  for(var i=0;i<9;i++){
    var a=-2.28+i*0.44;
    ctx.beginPath();
    ctx.moveTo(wheel.x+Math.cos(a)*r*0.80,wheel.y+Math.sin(a)*r*0.80);
    ctx.lineTo(wheel.x+Math.cos(a)*r*0.94,wheel.y+Math.sin(a)*r*0.94);
    ctx.lineWidth=Math.max(1,r*0.045); ctx.strokeStyle=(i===3?'#2c2422':'#242627'); ctx.stroke();
  }
  var aa=-2.28+S.ap*0.44;
  ctx.beginPath();
  ctx.moveTo(wheel.x+Math.cos(aa)*r*0.16,wheel.y+Math.sin(aa)*r*0.16);
  ctx.lineTo(wheel.x+Math.cos(aa)*r*0.88,wheel.y+Math.sin(aa)*r*0.88);
  ctx.lineWidth=Math.max(1.4,r*0.085); ctx.lineCap='round'; ctx.strokeStyle='#b02a1e'; ctx.stroke();
  ctx.beginPath(); ctx.arc(wheel.x,wheel.y,r*0.13,0,6.2832); ctx.fillStyle='#1a1b1c'; ctx.fill();
  ctx.restore();
}

/* ---------------- dome pass ---------------- */
function drawDome(){
  renderGate();
  var d=data, p=0, i4=0;
  var hOn = hand.active && hand.x>-500;
  var hr=0,hp=0,hx=0,hy=0,hsx=1,hsy=1,hang=0;
  if(hOn){
    hx=hand.x; hy=hand.y;
    var z=hand.z;
    hr=Math.min(W,H)*(0.055+0.075*z);
    hp=Math.min(W,H)*(0.006+0.10*z);
    hang=Math.atan2(hand.vy,hand.vx);
    hsx=1.55; hsy=0.80;
  }
  var ca=Math.cos(-hang), sa=Math.sin(-hang);
  var ylim0=hOn?Math.max(0,(hy-(hr+hp)*2.2)|0):0;
  var ylim1=hOn?Math.min(H,(hy+(hr+hp)*2.2)|0):-1;
  for(var y=0;y<H;y++){
    var inYs = hOn && y>=ylim0 && y<=ylim1;
    for(var x=0;x<W;x++,p++,i4+=4){
      var r=baseR[p], g=baseG[p], b=baseB[p];
      var gx=lutX[p];
      if(gx>=0){
        var gy=lutY[p];
        var xa=gx|0, ya=gy|0, fx=gx-xa, fy=gy-ya;
        var i00=(ya*GS+xa)*3, i10=i00+3, i01=i00+GS3, i11=i01+3;
        var w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
        var sr=gate[i00]*w00+gate[i10]*w10+gate[i01]*w01+gate[i11]*w11;
        var sg=gate[i00+1]*w00+gate[i10+1]*w10+gate[i01+1]*w01+gate[i11+1]*w11;
        var sb=gate[i00+2]*w00+gate[i10+2]*w10+gate[i01+2]*w01+gate[i11+2]*w11;
        var f=fac[p];
        if(inYs){
          var ddx=x-hx, ddy=y-hy;
          var rx=(ddx*ca-ddy*sa)/hsx, ry=(ddx*sa+ddy*ca)/hsy;
          var dd=Math.sqrt(rx*rx+ry*ry);
          var st=stretch[p];
          var occ=1-0.93*(1-smoothstep(hr*st*0.55,(hr+hp)*st*0.85,dd));
          var dd2=Math.sqrt((rx-hr*0.75)*(rx-hr*0.75)+(ry+hr*0.35)*(ry+hr*0.35));
          occ*=1-0.72*(1-smoothstep(hr*st*0.22,(hr*0.55+hp)*st,dd2));
          f*=occ;
        }
        r+=sr*f*255; g+=sg*f*255; b+=sb*f*255;
      }
      d[i4]=r<0?0:(r>255?255:r);
      d[i4+1]=g<0?0:(g>255?255:g);
      d[i4+2]=b<0?0:(b>255?255:b);
      d[i4+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  drawConsole();
}

/* ---------------- audio ---------------- */
var AU=null;
function nowS(){ return (performance.now()-T0)/1000; }
var T0=performance.now();
function initAudio(){
  if(AU) { if(AU.ac.state==='suspended') AU.ac.resume(); return; }
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  var ac=new C();
  var out=ac.createGain(); out.gain.value=0.9; out.connect(ac.destination);
  /* forty-foot hemisphere, hard plaster and aluminium */
  var len=Math.floor(ac.sampleRate*1.9), ib=ac.createBuffer(2,len,ac.sampleRate);
  for(var ch=0;ch<2;ch++){ var da=ib.getChannelData(ch);
    for(var i=0;i<len;i++){ var t=i/ac.sampleRate;
      var env=Math.exp(-t*3.0)*(t<0.021?t/0.021:1);
      da[i]=(Math.random()*2-1)*env*0.55;
      if(Math.abs(t-0.031)<0.001||Math.abs(t-0.058)<0.001||Math.abs(t-0.094)<0.001) da[i]+= (Math.random()*2-1)*0.5;
    } }
  var conv=ac.createConvolver(); conv.buffer=ib;
  var wet=ac.createGain(); wet.gain.value=0.30; conv.connect(wet); wet.connect(out);
  var dry=ac.createGain(); dry.gain.value=0.86; dry.connect(out);
  var bus=ac.createGain(); bus.connect(dry); bus.connect(conv);

  var nlen=ac.sampleRate*2, nb=ac.createBuffer(1,nlen,ac.sampleRate), nd=nb.getChannelData(0);
  for(var k=0;k<nlen;k++) nd[k]=Math.random()*2-1;

  /* projector fan: air, blade passing, and a bearing slightly out */
  var air=ac.createBufferSource(); air.buffer=nb; air.loop=true;
  var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.8;
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2100;
  var ag=ac.createGain(); ag.gain.value=0.085;
  air.connect(bp); bp.connect(lp); lp.connect(ag); ag.connect(bus); air.start();
  var blade=ac.createOscillator(); blade.type='sawtooth'; blade.frequency.value=171.5;
  var bf=ac.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=520;
  var bg=ac.createGain(); bg.gain.value=0.030;
  blade.connect(bf); bf.connect(bg);
  var wob=ac.createGain(); wob.gain.value=1.0; bg.connect(wob); wob.connect(bus);
  var lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=24.5;
  var lg=ac.createGain(); lg.gain.value=0.30; lfo.connect(lg); lg.connect(wob.gain); lfo.start(); blade.start();

  /* ballast at line frequency */
  var hum=ac.createGain(); hum.gain.value=0.0; hum.connect(bus);
  [120,240,360].forEach(function(f,ix){ var o=ac.createOscillator(); o.type=ix===0?'sine':'triangle'; o.frequency.value=f;
    var gg=ac.createGain(); gg.gain.value=[0.055,0.022,0.010][ix]; o.connect(gg); gg.connect(hum); o.start(); });

  /* somebody running a floor buffer down the corridor */
  var fbs=ac.createBufferSource(); fbs.buffer=nb; fbs.loop=true;
  var fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=190;
  var fg=ac.createGain(); fg.gain.value=0.0;
  fbs.connect(fl); fl.connect(fg); fg.connect(bus); fbs.start();
  (function buff(){ var on=Math.random()<0.55, dur=6+Math.random()*22;
    fg.gain.cancelScheduledValues(ac.currentTime);
    fg.gain.linearRampToValueAtTime(on?0.045:0.0, ac.currentTime+1.6);
    setTimeout(buff, dur*1000); })();

  /* the house coming in */
  var crs=ac.createBufferSource(); crs.buffer=nb; crs.loop=true;
  var cb=ac.createBiquadFilter(); cb.type='bandpass'; cb.frequency.value=620; cb.Q.value=0.55;
  var cg=ac.createGain(); cg.gain.value=0.0;
  crs.connect(cb); cb.connect(cg); cg.connect(bus); crs.start();

  AU={ac:ac,bus:bus,hum:hum,blade:blade,bg:bg,cg:cg,cb:cb,nb:nb,t0:ac.currentTime};

  /* fire door on a closer, twice */
  setTimeout(function(){door();},(150+Math.random()*120)*1000);
  setTimeout(function(){door();},(520+Math.random()*220)*1000);
}
function env(node,g,a,d,peak){ var t=AU.ac.currentTime; g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); node.start(t); node.stop(t+a+d+0.05); }
function knock(){ if(!AU) return; var ac=AU.ac;
  var o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(210,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(96,ac.currentTime+0.09);
  var g=ac.createGain(); o.connect(g); g.connect(AU.bus); env(o,g,0.003,0.13,0.20);
  var n=ac.createBufferSource(); n.buffer=AU.nb; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=1.2;
  var g2=ac.createGain(); n.connect(f); f.connect(g2); g2.connect(AU.bus); env(n,g2,0.002,0.045,0.07);
}
function clickd(stick){ if(!AU) return; var ac=AU.ac;
  var n=ac.createBufferSource(); n.buffer=AU.nb;
  var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=stick?1400:2700; f.Q.value=stick?2.5:5;
  var g=ac.createGain(); n.connect(f); f.connect(g); g.connect(AU.bus);
  env(n,g,0.001,stick?0.10:0.028,stick?0.09:0.11);
}
var lastSq=0;
function squeak(sp,thin){ if(!AU) return; var ac=AU.ac; if(ac.currentTime-lastSq<0.10) return; lastSq=ac.currentTime;
  var n=ac.createBufferSource(); n.buffer=AU.nb;
  var f=ac.createBiquadFilter(); f.type='bandpass';
  f.frequency.value=(700+sp*3200)*(0.45+0.55*thin); f.Q.value=9+sp*10;
  var g=ac.createGain(); n.connect(f); f.connect(g); g.connect(AU.bus);
  env(n,g,0.006,0.05+Math.random()*0.09,Math.min(0.13,0.025+sp*0.10));
}
function door(){ if(!AU) return; var ac=AU.ac;
  var n=ac.createBufferSource(); n.buffer=AU.nb;
  var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.7;
  var g=ac.createGain(); n.connect(f); f.connect(g); g.connect(AU.bus);
  var t=ac.currentTime; g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.05,t+0.5); g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
  n.start(t); n.stop(t+1.6);
  setTimeout(function(){ if(!AU) return; var ac2=AU.ac;
    var o=ac2.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,ac2.currentTime);
    o.frequency.exponentialRampToValueAtTime(52,ac2.currentTime+0.14);
    var gg=ac2.createGain(); o.connect(gg); gg.connect(AU.bus); env(o,gg,0.004,0.22,0.22);
  },1450);
}
function plink(){ if(!AU) return; var ac=AU.ac;
  var o=ac.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(1500,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(680,ac.currentTime+0.10);
  var g=ac.createGain(); o.connect(g); g.connect(AU.bus); env(o,g,0.002,0.13,0.09);
}

/* ---------------- interaction ---------------- */
function overWheel(bx,by){ var dx=bx-wheel.x, dy=by-wheel.y; return dx*dx+dy*dy < wheel.r*wheel.r*1.35; }
function setAp(v,stick){ v=clamp(Math.round(v),0,8); if(v!==S.ap){ S.ap=v; clickd(stick); } }
function pmove(cx,cy){
  var b=screenToBuf(cx,cy);
  hand.px=hand.x; hand.py=hand.y; hand.x=b[0]; hand.y=b[1];
  var dx=hand.x-hand.px, dy=hand.y-hand.py;
  if(hand.px>-500){ hand.vx=hand.vx*0.6+dx*0.4; hand.vy=hand.vy*0.6+dy*0.4; }
  var sp=Math.sqrt(dx*dx+dy*dy);
  if(sp>0.6) hand.still=0; else hand.still+=0.016;
  var gg=bufToGate(hand.x,hand.y);
  hand.active = !!gg && !wheel.drag;
  if(wheel.drag){
    var a=Math.atan2(hand.y-wheel.y,hand.x-wheel.x);
    var idx=(a+2.28)/0.44;
    var stickIdx=3;
    if(Math.abs(idx-stickIdx)<0.62 && S.ap!==stickIdx){ wheel.acc+=Math.abs(sp); if(wheel.acc<26){ setAp(stickIdx,true); return; } }
    else wheel.acc=0;
    setAp(idx,false);
    return;
  }
  if(hand.down && gg){
    for(var i=0;i<2;i++){
      var gl=G[i], lx=(gg[0]-gl.cx)/gl.rad, ly=(gg[1]-gl.cy)/gl.rad;
      if(lx*lx+ly*ly<1){
        gl.tvx += dx*0.045/gl.rad; gl.tvy += dy*0.045/gl.rad;
        gl.tvx=clamp(gl.tvx,-2.2,2.2); gl.tvy=clamp(gl.tvy,-2.2,2.2);
        if(sp>1.1) squeak(clamp(sp/12,0,1), gl.hRel);

    }
  }
}
function pdown(cx,cy){
  initAudio();
  var b=screenToBuf(cx,cy);
  hand.x=b[0]; hand.y=b[1]; hand.px=b[0]; hand.py=b[1];
  if(overWheel(b[0],b[1])){ wheel.drag=true; wheel.acc=0; hand.active=false; return; }
  hand.down=true; hand.holdT=0; hand.still=0;
  var gg=bufToGate(b[0],b[1]);
  if(gg){ hand.active=true; knock(); }
}
function pup(){
  if(wheel.drag){ wheel.drag=false; return; }
  hand.down=false;
  for(var i=0;i<2;i++) G[i].squeeze=0;
}
function dropDye(which,cx,cy){
  var b=screenToBuf(cx,cy), gg=bufToGate(b[0],b[1]); if(!gg) return;
  for(var i=0;i<2;i++){
    var gl=G[i], lx=(gg[0]-gl.cx)/gl.rad, ly=(gg[1]-gl.cy)/gl.rad;
    if(lx*lx+ly*ly<1){
      if(which==='m' && S.dropsM<=0) return;
      if(which==='c' && S.dropsC<=0) return;
      if(which==='m') S.dropsM--; else S.dropsC--;
      var u=(lx*0.5+0.5)*(N-1), v=(ly*0.5+0.5)*(N-1), fld=(which==='m')?gl.cm:gl.cc;
      for(var jj=0;jj<N;jj++)for(var ii=0;ii<N;ii++){
        var dd=Math.sqrt((ii-u)*(ii-u)+(jj-v)*(jj-v));
        if(dd<5.5){ var o=jj*N+ii; fld[o]=Math.min(1.35, fld[o]+0.85*(1-dd/5.5)); }
      }
      plink(); save(); return;
    }
  }
}
cv.addEventListener('pointermove',function(e){ pmove(e.clientX,e.clientY); },{passive:true});
cv.addEventListener('pointerdown',function(e){ cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); pdown(e.clientX,e.clientY); },{passive:true});
window.addEventListener('pointerup',function(e){ pup(); },{passive:true});
cv.addEventListener('pointerleave',function(){ hand.active=false; hand.x=-999; },{passive:true});
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); initAudio(); dropDye('m',e.clientX,e.clientY); });
cv.addEventListener('dblclick',function(e){ initAudio(); dropDye('c',e.clientX,e.clientY); });
cv.addEventListener('wheel',function(e){ e.preventDefault(); initAudio();
  var st=(S.ap===3||S.ap===4)?true:false;
  setAp(S.ap+(e.deltaY>0?-1:1),st&&Math.random()<0.6);
},{passive:false});
window.addEventListener('keydown',function(e){ initAudio();
  if(e.key==='ArrowUp'){ setAp(S.ap+1,false); e.preventDefault(); }
  if(e.key==='ArrowDown'){ setAp(S.ap-1,false); e.preventDefault(); }
});
window.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
window.addEventListener('resize',resize);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });

/* ---------------- loop ---------------- */
var last=performance.now(), simAcc=0, saveAcc=0;
function frame(now){
  var dt=Math.min(0.08,(now-last)/1000); last=now;
  var ap=apFrac();
  S.lampH += dt/3600;
  /* hand height and squeeze */
  var zT = hand.down?0.03:0.55;
  hand.z += (zT-hand.z)*Math.min(1,dt*9);
  if(hand.down){
    hand.holdT+=dt;
    var gg = bufToGate(hand.x,hand.y);
    for(var i=0;i<2;i++){
      var gl=G[i];
      if(gg){ var lx=(gg[0]-gl.cx)/gl.rad, ly=(gg[1]-gl.cy)/gl.rad;
        if(lx*lx+ly*ly<1){ gl.squeeze=clamp(hand.holdT*1.6,0,1); }
      }
    }
    if(hand.still>1.5 && gg){ hand.still=-99; dropDye('m',hand.x*(innerWidth/W),hand.y*(innerHeight/H)); }
  }
  simAcc+=dt;
  while(simAcc>1/30){ var sd=1/30; G[0].step(sd,ap); G[1].step(sd,ap); simAcc-=sd; }
  if(AU){
    var t=AU.ac.currentTime;
    AU.hum.gain.setTargetAtTime(0.028+0.075*ap,t,0.4);
    AU.blade.frequency.setTargetAtTime(171.5-3.2*Math.min(1,nowS()/1400),t,2.0);
    var crowd = smoothstep(480,760,nowS())*0.055*(0.85+0.3*Math.sin(nowS()*0.21));
    AU.cg.gain.setTargetAtTime(crowd,t,1.5);
    AU.cb.frequency.setTargetAtTime(560+180*Math.sin(nowS()*0.07),t,2.0);
  }
  drawDome();
  saveAcc+=dt; if(saveAcc>5){ saveAcc=0; save(); }
  requestAnimationFrame(frame);
}
resize();
for(var w=0;w<90;w++){ G[0].step(1/30,0.5); G[1].step(1/30,0.5); }
requestAnimationFrame(frame);
try{ console.log('%c ','background:#d5197c;padding:2px 40px'); console.log('left glass down at 1:04 — about forty minutes of geometry left in it. house of 180 at four.'); }catch(e){}
})();
</script>
