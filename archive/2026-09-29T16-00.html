  <meta name="outbox-spec-era" content="Right now, 4:41 in the afternoon, in the middle of a municipal leaf-collection season in a mid-sized city that the page never names — the sixth week of a nine-week route cycle, with a vacuum truck working the east side of a residential street and a second crew coming behind it with rakes. The page refuses to say the year and nothing in it tells you: the truck is from one decade, the radios are from another, the route map taped inside the cab door has been photocopied from a photocopy eleven times. Not autumn, not a mood, not a memory of childhood leaf piles: the hopper is at about two-thirds, the transfer site closes at 5:30, there are four hundred and ten linear feet of windrow left on this block, and a car is parked over the pile at 1144.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE PROGRESS BAR, rendered at true scale as a long horizontal strip running the full width of the screen and about an inch tall, sitting dead center with nothing above it and nothing below it — no header, no menu, no title, no footer, no percentage readout, no label, no cancel button, no scrollbar, no vertical scroll at any window size. The strangeness: THE BAR IS THE STREET. Its full length is the block's 1,410 linear feet of curb windrow, its filled portion is what has actually been vacuumed, and it does not advance smoothly — it advances in the real irregular bites a leaf truck takes, stalls entirely when the hose clogs, and OCCASIONALLY GOES BACKWARD, because wind puts leaves back onto curb that was already done and the crew re-does it. Inside the fill, at true relative position, are the actual obstructions the crew is working around: a parked car at 1144 rendering as a hard unfillable gap the bar simply flows past and leaves hollow, a storm grate, two driveway aprons, a section where the windrow is soaked through and moves at a fraction of the rate. The visitor's only vocabulary is what a hand does on a leaf truck: DRAG along the unfilled portion to move the nozzle boom and set where the suction is actually pointed, PRESS AND HOLD anywhere on the bar to run the impeller up, and SCRUB back and forth over a stalled section to work a clog loose. The bar never reaches the end, because the route is longer than the day.">
  <meta name="outbox-spec-subject" content="The flat mechanics of municipal loose-leaf collection, which is almost entirely a moisture-and-bulk-density problem and has nothing whatsoever to do with autumn. That a cubic yard of dry loose leaves weighs something like 250 pounds and the identical cubic yard rained on for two days weighs close to 800, so a truck that fills its 25-yard hopper by volume on a dry Tuesday hits its legal axle weight at half a hopper on a wet Thursday and has to leave — which means the route's real capacity is set by the weather three days ago and not by how much anybody vacuumed. That the blower is not a fan drawing leaves up a tube, it is a HIGH-VELOCITY IMPELLER that the leaves pass THROUGH and get shredded by, which is the entire reason the system works at all: whole leaves at their natural bulk density would fill the hopper in four hundred feet, and the impeller's shredding takes the density up by a factor of three or four. That a shredding impeller is therefore doing the compaction, and an impeller with worn blade tips shreds worse, fills the hopper faster with fewer leaves, and the crew notices it as more trips to the transfer site and not as a blade problem. That AIRSPEED IN THE HOSE IS THE WHOLE VARIABLE AND IT IS NOT ADJUSTABLE UPWARD: the system needs roughly 5,000 feet per minute of air in an 8- or 10-inch tube to keep material in suspension, below that leaves drop out of the airstream and lie down inside the hose, and once they lie down they catch the next thing and the clog builds from that point in both directions. That a clog is therefore almost never at the nozzle where the operator is looking. That AIRSPEED FALLS WHEN THE NOZZLE IS BURIED, because a nozzle jammed into a pile has no air path and the impeller is trying to move solid material with nothing to carry it — so the correct technique is to keep the nozzle at the EDGE of the windrow and let air in behind, which looks slower and is measurably faster, and every new operator buries the nozzle. That WET LEAVES DO NOT MERELY WEIGH MORE, THEY STICK: the friction coefficient of a wet leaf mat against asphalt is high enough that suction alone will not lift a soaked windrow, and the mat has to be broken with a rake first, which is why there is a second crew and why the second crew is the actual rate limit of the operation. That a wet windrow left more than about four days begins to compost — it heats, it mats into a felt, and at that point it is not leaf collection, it is shoveling. That STICKS ARE THE SINGLE MOST EXPENSIVE THING A RESIDENT CAN PUT IN A PILE: a branch over about an inch and a half jams the impeller housing, and clearing it is a shutdown, a lockout and twenty minutes, and the arithmetic is that one branch costs more route-feet than an entire block of leaves gains. That rocks are worse and throw blade balance permanently. That a PARKED CAR IS NOT AN INCONVENIENCE, IT IS A GAP THAT NEVER GETS FILLED: the crew cannot vacuum under it, the route does not come back for nine weeks, and that leaf mass goes into the storm drain at the first rain — which is the actual reason the program exists, because leaf litter in stormwater is a phosphorus load, and a city's entire loose-leaf budget is usually justified on a nutrient-loading number and not on tidiness. That the phosphorus arithmetic is honest and ugly: leaves sitting on pavement leach dissolved phosphorus within days, and pavement leaching is several times worse than leaves on a lawn, so the program's whole benefit depends on getting them off the HARD SURFACE and not on getting them at all. That TRANSFER-SITE CYCLE TIME IS THE REAL SCHEDULE: a round trip is however long it is, the site closes at a stated hour, and a truck that fills its hopper at twenty past five has an hour of leaves it cannot legally leave on the truck overnight in a composting mass because a loaded hopper of wet leaves genuinely self-heats. That STREET SWEEPERS ARE A DIFFERENT MACHINE ENTIRELY and cannot do this — a mechanical broom sweeper's hopper is sized for grit and it fills on leaves in two blocks. That WINDROW PLACEMENT IS A RESIDENT BEHAVIOR PROBLEM WITH A REAL COST: leaves in the gutter line are collectible, leaves on the grass strip behind the curb are not reachable by a truck-mounted boom, and leaves in the street beyond the gutter are a traffic hazard and get a different crew. And the flat arithmetic on the block: 1,410 feet of curb, about 410 left, a hopper at two-thirds, a site that closes at 5:30, one car at 1144, and a wind out of the northwest at eleven.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the bar's own behavior and in the sound, and that register is LOUD, ROUGH, UNEVEN, INTERRUPTED AND SLIGHTLY BEHIND SCHEDULE — a fill that surges when the windrow is dry and loose, crawls when it is soaked, stops dead and stays stopped for a genuinely uncomfortable number of seconds when something jams, and gives back ground it had already taken when a gust comes through. The pace is not graceful and is never rhythmic. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the truck keeps working whether or not anybody touches the bar. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cozy, NOT autumnal, NOT ASMR, NOT oddly-satisfying, NOT a process-video, NOT a screensaver, NOT stately, NOT reverent — this is 4:41 in the afternoon with a hopper at two-thirds and forty-nine minutes until the site closes.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the bar's fill color is COMPUTED and never chosen. The ground is the unfilled portion of the strip: dry asphalt with a curb line, a flat cool gray-black (#3a3b38) going paler and grittier where tires have polished it (#6e6f68), with real aggregate texture and a faint sun-bleached band along the top edge. The filled portion is NOT a color anybody picked — each of the fourteen hundred one-foot segments stores an actual leaf species mix, an actual moisture fraction, an actual days-on-pavement figure and an actual compaction state, and its rendered color falls out of those four: a fresh dry segment of mixed maple and oak reads a bright ochre-russet (#b5732a) with real per-leaf variation and hard edges; the same segment after two days of rain reads a saturated dark umber (#5a3a1c) with a glossy wet specular; a segment that has been down six days and started to heat reads a flat felted gray-brown (#4a4238) with no variation left in it at all, and a segment that is mostly silver maple reads measurably paler and yellower (#c9a441) than the same segment of pin oak. Nobody anywhere picks a leaf color. The unfillable gap at 1144 is bare polished pavement, exactly the ground color, and is distinguishable from unfilled curb only by the fact that the fill goes around it. Exactly one chip of amber beacon orange (#f08a12) is held strictly for three things: the strobe reflection that sweeps the full length of the bar every 1.4 seconds at true rotation rate, the cone markers at the two driveway aprons, and the hard edge of the nozzle boom wherever it currently sits. It never appears in the leaves, never in the pavement, never in the gap. Flat, hard, high contrast; no glow, no bloom, no soft focus, no vignette, no gradients other than honest wetness specular, honest compaction and honest strobe sweep.">
  <meta name="outbox-spec-wildcard" content="Somewhere in the windrow there is a garden hose. About eleven feet of half-inch vinyl hose, run over by a mower at some point and raked into the pile at the end of a yard, and the engine gives it exactly the properties eleven feet of vinyl hose has and no others: it is too flexible to jam the boom and too tough to shred, so it enters the intake, wraps the impeller shaft, and every single revolution after that it drags — a permanent, computed, irreversible parasitic torque that lowers the impeller's attainable rpm by a real amount and therefore lowers the airspeed ceiling for the rest of this visit and every visit after it. It cannot be cleared, cut, backed out, marked, avoided or seen coming; it is at the same segment position on every visit because the yard it came from is still the yard it came from, and a visitor who has already picked it up on a previous visit does not encounter it again and simply has a truck that never quite pulls what it used to.">
  <meta name="outbox-spec-forbidden" content="NO autumn as theme, mood, atmosphere, subtext or shadow anywhere on the page — no fall, no season, no turning, no the-year-winding-down, no harvest, no October light, no crisp air, no sweater weather, no melancholy soft autumn of any kind, and no leaf-as-metaphor for anything: not letting go, not mortality, not what falls away, not impermanence, not cycles, not 'they all come down eventually', not one leaf standing for anybody. A leaf here is 250 pounds per cubic yard dry and 800 wet and it has nothing to teach anybody. NO childhood: no jumping in piles, no raking with a parent, no the-smell-of-burning-leaves, no a-kid-who-would-grow-up-to-be, no coming-of-age, no bittersweet hindsight, no nostalgia of any kind. NO nature writing, NO tree lyricism, NO botany reverie, NO describing color in leaves as blazing, glorious, flame, gold, jewel-toned, or anything other than a computed reflectance; NO smell writing whatsoever. NO New England, NO foliage tourism, NO leaf-peeping, NO postcard register, NO Thoreau, NO Frost, NO 'nothing gold can stay' in any form or paraphrase. NO municipal-worker dignity sermon, NO essential-workers framing, NO invisible-infrastructure essay, NO 'nobody thinks about this until it isn't there', NO awe at systems, NO thank-a-public-works-crew sentiment, NO labor-dignity register, NO thankless-job pathos, NO working-class-pride sentiment, NO union framing. NO city-budget satire, NO bureaucratic-absurd, NO committee minutes, NO department-of-X, NO Kafka, NO form-as-joke, NO parody of officialese, NO council-meeting comedy, NO the-program-is-being-cut drama. NO environmental sermon: the phosphorus number is a number the program is justified on and the page draws no conclusion from it — no stormwater moralising, no climate framing, no composting evangelism, no mulch-in-place advocacy, no resident-behavior scolding beyond a stick being a shutdown and a car being a gap. NO passive-aggressive-neighbor comed atcher / desk / log / 3am voice — it is 4:41 in the afternoon with the sun still up and traffic on the cross street. NO signal / transmission / frequency / broadcast framing, despite the crew having radios. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the bar, the fill, the gap and the one amber chip, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>
<!-- 1410 ft of curb, east side. 1138-1154 is the car. 1096-1099 is the grate.
     1176-1258 went through two days of rain and has not moved since.
     1191 is the end of a yard. there is something in that pile. -->
<canvas id="s"></canvas>
<a id="ar" href="/archive" aria-label="other work from the cafe"></a>
<script>
(function(){
"use strict";
/* ---------- block geometry ---------- */
var N=1410, CAR0=1138, CAR1=1154, GR0=1096, GR1=1099,
    AP=[[1062,1072],[1262,1272]], SOAK0=1176, SOAK1=1258,
    HOSE_FT=1191, BRANCH_FT=1289, START_EDGE=1000,
    HOSE_LEN=16, V_SUSP=5000, RPM_NOM=1820, BLADES=6,
    AXLE=21000, HOP_CY=25, SITE_CLOSE=(17*60+30), CLOCK0=(16*60+41);

var KEY="outbox.windrow.v1";
function rnd(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);}
function cl(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return v<a?a:(v>b?b:v);}

/* ---------- state ---------- */
var S={
  m:new Float32Array(N), w:new Float32Array(N), d:new Float32Array(N), t:new Float32Array(N),
  feet:0, lbs:0, wear:0, trips:0, clogSec:0, route:0, hoseTaken:0, branchDone:0,
  hopM:14000, hopV:16.6, drag:0, last:0
};
var cc=new Array(N);

function seed(){
  for(var i=0;i<N;i++){
    var fr=Math.floor(i/38);
    var moist=0.19+0.23*rnd(fr,7)+0.09*rnd(i,11);
    var days=2+3.1*rnd(fr,13);
    if(i>=SOAK0&&i<=SOAK1){moist=0.81+0.11*rnd(i,17);days=5.1+1.5*rnd(fr,19);}
    if(i>=1092&&i<=1104){moist=Math.max(moist,0.60);}
    var vol=0.092+0.032*rnd(i,23);
    var mass=vol*(250+560*moist);
    var ap=0; for(var k=0;k<AP.length;k++){if(i>=AP[k][0]&&i<=AP[k][1])ap=1;}
    if(ap)mass*=0.15;
    if(i<START_EDGE)mass=0;
    S.m[i]=mass; S.w[i]=moist; S.d[i]=days;
    S.t[i]=cl((moist-0.42)*1.75*(days/6));
  }
}
function load(){
  var raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  seed();
  if(!raw){S.last=Date.now();return;}
  try{
    var o=JSON.parse(raw);
    if(o&&o.m&&o.m.length===N){
      for(var i=0;i<N;i++){S.m[i]=o.m[i]/10;S.w[i]=o.w[i]/100;S.d[i]=o.d[i]/10;S.t[i]=o.t[i]/100;}
      S.feet=o.feet||0;S.lbs=o.lbs||0;S.wear=o.wear||0;S.trips=o.trips||0;S.clogSec=o.clogSec||0;
      S.route=o.route||0;S.hoseTaken=o.hoseTaken||0;S.branchDone=o.branchDone||0;
      S.hopM=o.hopM!==undefined?o.hopM:14000;S.hopV=o.hopV!==undefined?o.hopV:16.6;
      S.drag=o.drag||0;S.last=o.last||Date.now();
      /* days pass between visits. it rains or it does not. */
      var days=Math.min(9,(Date.now()-S.last)/86400000);
      if(days>0.04){
        var dayNo=Math.floor(Date.now()/86400000);
        var wet=rnd(dayNo,91)>0.55?0.34*days:0.03*days;
        for(var j=0;j<N;j++){
          if(S.m[j]<=0.35)continue;
          var ow=S.w[j], nw=cl(ow+wet-0.05*days,0.06,0.96);
          S.m[j]*= (250+560*nw)/(250+560*ow);
          S.w[j]=nw; S.d[j]+=days;
          S.t[j]=cl((nw-0.42)*1.75*(S.d[j]/6));
        }
        S.route=(S.route+Math.max(1,Math.round(days)));
      }
      S.last=Date.now();
    }
  }catch(e){}
}
var saveT=0;
function save(){
  try{
    var m=new Array(N),w=new Array(N),d=new Array(N),t=new Array(N);
    for(var i=0;i<N;i++){m[i]=Math.round(S.m[i]*10);w[i]=Math.round(S.w[i]*100);d[i]=Math.round(S.d[i]*10);t[i]=Math.round(S.t[i]*100);}
    localStorage.setItem(KEY,JSON.stringify({m:m,w:w,d:d,t:t,feet:S.feet,lbs:S.lbs,wear:S.wear,
      trips:S.trips,clogSec:S.clogSec,route:S.route,hoseTaken:S.hoseTaken,branchDone:S.branchDone,
      hopM:S.hopM,hopV:S.hopV,drag:S.drag,last:Date.now()}));
  }catch(e){}
}
load();

/* ---------- canvas ---------- */
var cv=document.getElementById("s"), ctx=cv.getContext("2d"), dpr=1, W=0,H=0,LT=0,LH=0;
var pave=document.createElement("canvas"), vari=document.createElement("canvas"), spJ=null;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,Math.floor(window.innerWidth));
  H=Math.max(52,Math.min(96,Math.floor(window.innerHeight*0.30)));
  cv.style.height=H+"px";
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  LT=4; LH=H-10;
  buildPave(); buildVari();
  spJ=new Int8Array(W); for(var x=0;x<W;x++)spJ[x]=Math.floor(rnd(x,41)*5);
  for(var i=0;i<N;i++)cc[i]=null;
}
function buildPave(){
  pave.width=Math.floor(W*dpr);pave.height=Math.floor(H*dpr);
  var p=pave.getContext("2d");p.setTransform(dpr,0,0,dpr,0,0);
  p.fillStyle="#3a3b38";p.fillRect(0,0,W,H);
  /* tire polish through the middle-low band */
  for(var y=0;y<H;y++){
    var pol=Math.exp(-Math.pow((y-(H*0.60))/(H*0.20),2));
    if(pol>0.02){p.fillStyle="rgba(110,111,104,"+(pol*0.42).toFixed(3)+")";p.fillRect(0,y,W,1);}
  }
  /* aggregate */
  var n=Math.floor(W*H*0.30);
  for(var k=0;k<n;k++){
    var x=Math.random()*W,y=Math.random()*H,v=Math.random();
    var g=v<0.5?(46+Math.random()*16):(88+Math.random()*34);
    p.fillStyle="rgba("+g+","+(g+1)+","+(g-4)+","+(0.22+Math.random()*0.5).toFixed(2)+")";
    p.fillRect(x|0,y|0,1+((Math.random()*2)|0),1);
  }
  /* sun-bleached band along the top edge */
  p.fillStyle="rgba(110,111,104,0.30)";p.fillRect(0,0,W,3);
  p.fillStyle="rgba(110,111,104,0.16)";p.fillRect(0,3,W,2);
  /* curb line at the bottom */
  p.fillStyle="#2b2c2a";p.fillRect(0,H-6,W,3);
  p.fillStyle="rgba(110,111,104,0.5)";p.fillRect(0,H-3,W,1);
  p.fillStyle="#242523";p.fillRect(0,H-2,W,2);
  /* the gap: polished, nothing under it but pavement */
  var gx0=Math.floor(CAR0/N*W),gx1=Math.ceil((CAR1+1)/N*W);
  p.fillStyle="rgba(110,111,104,0.20)";p.fillRect(gx0,6,gx1-gx0,H-13);
}
function buildVari(){
  vari.width=Math.floor(W*dpr);vari.height=Math.floor(H*dpr);
  var v=vari.getContext("2d");v.setTransform(dpr,0,0,dpr,0,0);
  v.clearRect(0,0,W,H);
  var n=Math.floor(W*1.9);
  for(var k=0;k<n;k++){
    var x=Math.random()*W,y=LT+Math.random()*LH;
    var up=Math.random()<0.5;
    v.fillStyle=up?"rgba(255,255,255,"+(0.05+Math.random()*0.10).toFixed(3)+")"
                  :"rgba(0,0,0,"+(0.06+Math.random()*0.13).toFixed(3)+")";
    v.fillRect(x|0,y|0,1+((Math.random()*3)|0),2+((Math.random()*7)|0));
  }
}
window.addEventListener("resize",resize);

/* ---------- computed leaf color ---------- */
function col(i){
  if(cc[i])return cc[i];
  var fr=Math.floor(i/38), mf=0.18+0.64*rnd(fr,3);
  var r=150+51*mf, g=90+74*mf, b=28+37*mf;
  var wv=cl(S.w[i]);
  r+=(90-r)*wv*0.95; g+=(58-g)*wv*0.95; b+=(28-b)*wv*0.95;
  var mt=cl(S.t[i]);
  r+=(74-r)*mt*0.55; g+=(66-g)*mt*0.55; b+=(56-b)*mt*0.55;
  var jit=(rnd(i,53)-0.5)*26*(1-mt)*(1-0.45*wv);
  cc[i]="rgb("+cl(r+jit,10,255).toFixed(0)+","+cl(g+jit*0.8,10,255).toFixed(0)+","+cl(b+jit*0.5,6,255).toFixed(0)+")";
  return cc[i];
}

/* ---------- machine ---------- */
var M={
  rpm:900, thr:0.55, held:false, boom:START_EDGE+2, boomT:START_EDGE+2, truck:START_EDGE-2,
  depth:0.42, depthT:0.42, V:0, block:null, dens:1, jam:0, trip:0, gone:false,
  lastTouch:-9999, edge:START_EDGE, boomV:0, clock:CLOCK0, hoseRub:S.hoseTaken?1:0
};
var wind={sp:11,gust:0,next:14+Math.random()*30};
var scrubV=0, flipR=0, lastPX=0, lastDX=0, down=false;

/* ---------- audio ---------- */
var A=null,master=null,nb=null,air=null,airF=null,airG=null,imp1=null,imp2=null,impG=null,
    dz=null,dzG=null,dzLFO=null,blowF=null,blowG=null,rubG=null,rubL=null,hydG=null,hydF=null,ready=false;
function nbuf(){
  var len=Math.floor(A.sampleRate*3),b=A.createBuffer(1,len,A.sampleRate),c=b.getChannelData(0);
  for(var i=0;i<len;i++)c[i]=Math.random()*2-1;return b;
}
function src(){var s=A.createBufferSource();s.buffer=nb;s.loop=true;s.start();return s;}
function bp(f,q){var x=A.createBiquadFilter();x.type="bandpass";x.frequency.value=f;x.Q.value=q;return x;}
function lp(f){var x=A.createBiquadFilter();x.type="lowpass";x.frequency.value=f;return x;}
function gn(v){var x=A.createGain();x.gain.value=v;return x;}
function initAudio(){
  if(A)return;
  try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  nb=nbuf();
  var comp=A.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
  master=gn(0.0);master.connect(comp);comp.connect(A.destination);
  master.gain.linearRampToValueAtTime(0.62,A.currentTime+1.6);
  /* street bed */
  var sb=src(),sbf=lp(190),sbg=gn(0.055);sb.connect(sbf);sbf.connect(sbg);sbg.connect(master);
  /* leaf blower, four houses down */
  var bl=src();blowF=bp(580,1.3);blowG=gn(0.030);bl.connect(blowF);blowF.connect(blowG);blowG.connect(master);
  /* air rush */
  air=src();airF=bp(900,1.3);airG=gn(0.02);air.connect(airF);airF.connect(airG);airG.connect(master);
  /* diesel PTO at fast idle, with governor hunt */
  dz=src();var dzf=lp(130);dzG=gn(0.0);dz.connect(dzf);dzf.connect(dzG);dzG.connect(master);
  var mod=gn(0.55);dzG.gain.value=0.0;
  dzLFO=A.createOscillator();dzLFO.type="sawtooth";dzLFO.frequency.value=23.6;
  var dzMod=gn(0.35);dzLFO.connect(dzMod);dzMod.connect(dzG.gain);dzLFO.start();
  var hunt=A.createOscillator();hunt.type="sine";hunt.frequency.value=0.31;
  var hg=gn(0.75);hunt.connect(hg);hg.connect(dzLFO.frequency);hunt.start();
  var thump=A.createOscillator();thump.type="sine";thump.frequency.value=47;
  var tg=gn(0.05);thump.connect(tg);tg.connect(master);thump.start();
  /* impeller */
  impG=gn(0.0);var impf=lp(2100);impG.connect(impf);impf.connect(master);
  imp1=A.createOscillator();imp1.type="sawtooth";imp1.frequency.value=180;
  imp2=A.createOscillator();imp2.type="square";imp2.frequency.value=360;
  var g1=gn(0.55),g2=gn(0.16);
  imp1.connect(g1);g1.connect(impG);imp2.connect(g2);g2.connect(impG);
  imp1.start();imp2.start();
  /* eleven feet of vinyl on the shaft */
  var rb=src(),rbf=bp(1500,7);rubG=gn(0.0);rb.connect(rbf);rbf.connect(rubG);rubG.connect(master);
  rubL=A.createOscillator();rubL.type="sine";rubL.frequency.value=30;
  var rlg=gn(0.04);rubL.connect(rlg);rlg.connect(rubG.gain);rubL.start();
  /* boom cylinder */
  var hy=src();hydF=bp(880,9);hydG=gn(0.0);hy.connect(hydF);hydF.connect(hydG);hydG.connect(master);
  ready=true;
}
function burst(cf,q,dur,g){
  if(!ready)return;
  var s=A.createBufferSource();s.buffer=nb;s.loop=true;
  var f=bp(cf,q),x=gn(0);
  var t=A.currentTime;
  x.gain.setValueAtTime(0.0001,t);
  x.gain.linearRampToValueAtTime(g,t+0.005);
  x.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(x);x.connect(master);
  s.start(t+Math.random()*0.004);s.stop(t+dur+0.03);
}
function knock(hard){
  if(!ready)return;
  var t=A.currentTime,o=A.createOscillator(),g=gn(0);
  o.type="sine";o.frequency.setValueAtTime(hard?150:110,t);
  o.frequency.exponentialRampToValueAtTime(hard?38:52,t+(hard?0.20:0.12));
  g.gain.setValueAtTime(hard?0.34:0.16,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(hard?0.26:0.14));
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.30);
  burst(hard?900:1500,1.1,hard?0.13:0.07,hard?0.18:0.09);
}
var carT=30+Math.random()*50, rk=[0.6,1.1], blowT=2;
function carPass(){
  if(!ready)return;
  var s=src(),f=bp(300,0.9),g=gn(0),t=A.currentTime,out=master;
  if(A.createStereoPanner){var p=A.createStereoPanner();p.pan.setValueAtTime(-1,t);p.pan.linearRampToValueAtTime(1,t+4.2);p.connect(master);out=p;}
  f.frequency.setValueAtTime(240,t);
  f.frequency.linearRampToValueAtTime(760,t+2.0);
  f.frequency.linearRampToValueAtTime(280,t+4.2);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.075,t+1.9);
  g.gain.exponentialRampToValueAtTime(0.0001,t+4.3);
  s.connect(f);f.connect(g);g.connect(out);
  s.stop(t+4.4);
}

/* ---------- input ---------- */
function toFt(px){var r=cv.getBoundingClientRect();return cl((px-r.left)/r.width*N,0,N-1);}
function toDepth(py){var r=cv.getBoundingClientRect();return cl((py-r.top)/r.height,0,1);}
function pd(e){
  initAudio(); if(A&&A.state==="suspended")A.resume();
  down=true;M.held=true;M.lastTouch=0;
  M.boomT=toFt(e.clientX);M.depthT=toDepth(e.clientY);
  lastPX=e.clientX;lastDX=0;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
}
function pm(e){
  if(!down)return;
  var dx=e.clientX-lastPX;
  if(dx*lastDX<0&&Math.abs(dx)>1.4)flipR+=1.0;
  lastDX=dx;lastPX=e.clientX;
  scrubV=scrubV*0.80+Math.abs(dx)*(N/Math.max(1,W))*6*0.20;
  M.boomT=toFt(e.clientX);M.depthT=toDepth(e.clientY);M.lastTouch=0;
  e.preventDefault();
}
function pu(e){down=false;M.held=false;e.preventDefault();}
cv.addEventListener("pointerdown",pd);
cv.addEventListener("pointermove",pm);
window.addEventListener("pointerup",pu);
window.addEventListener("pointercancel",pu);
cv.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});

var keys={};
window.addEventListener("keydown",function(e){
  initAudio(); if(A&&A.state==="suspended")A.resume();
  var k=e.key;
  if(k===" "){M.held=true;M.lastTouch=0;e.preventDefault();}
  else if(k==="ArrowLeft"){M.boomT=cl(M.boomT-(e.shiftKey?10:1),0,N-1);M.lastTouch=0;e.preventDefault();}
  else if(k==="ArrowRight"){M.boomT=cl(M.boomT+(e.shiftKey?10:1),0,N-1);M.lastTouch=0;e.preventDefault();}
  else if(k==="ArrowUp"){M.depthT=cl(M.depthT-0.05);M.lastTouch=0;e.preventDefault();}
  else if(k==="ArrowDown"){M.depthT=cl(M.depthT+0.05);M.lastTouch=0;e.preventDefault();}
  else if(k>="1"&&k<="9"){pulse(parseInt(k,10));M.lastTouch=0;e.preventDefault();}
  keys[k]=true;
});
window.addEventListener("keyup",function(e){if(e.key===" ")M.held=false;keys[e.key]=false;});

function pulse(n){
  var p=HOSE_LEN*(n-0.5)/9;
  knock(false);
  burst(2200,1.4,0.10,0.07);
  if(!M.block)return;
  var dist=Math.abs(p-M.block.pos);
  if(dist<1.7){
    M.block.mass-=8+6*Math.random();
    M.block.dens=Math.max(1,M.block.dens-0.35);
    burst(700,0.8,0.30,0.12);
  }else if(dist<3.4){
    M.block.mass-=2.2+2*Math.random();
  }
  if(M.block.mass<=0){M.block=null;M.dens=1;burst(520,0.7,0.55,0.16);}
}

/* ---------- engine ---------- */
var impAccum=0, leafAccum=0, rakeFront=START_EDGE+14;
function edgeOf(){
  for(var i=0;i<N;i++){
    if(i>=CAR0&&i<=CAR1)continue;
    if(S.m[i]>0.35)return i;
  }
  return N-1;
}
function step(dt){
  M.clock+=dt/60;
  /* --- wind on its own clock --- */
  wind.next-=dt;
  if(wind.next<=0){wind.gust=3.5+Math.random()*6;wind.next=16+Math.random()*52;}
  if(wind.gust>0){wind.gust-=dt;wind.sp=11+8*Math.min(1,wind.gust/3);}else wind.sp=10.4+1.2*Math.sin(performance.now()/5200);
  var wf=Math.max(0,wind.sp-6.5); wf=wf*wf*0.00075*dt;
  if(wf>0){
    var e0=M.edge;
    for(var q=0;q<26;q++){
      var i=e0+((Math.random()*46)|0)-4;
      if(i<1||i>=N-1)continue;
      if(i>=CAR0&&i<=CAR1)continue;
      if(S.m[i]<0.5)continue;
      if(S.w[i]>0.34||S.t[i]>0.30)continue;
      var mv=Math.min(S.m[i],wf*(28+40*Math.random()));
      var j=i-(1+((Math.random()*3)|0));
      if(j<0)continue;
      if(j>=CAR0&&j<=CAR1)j=CAR0-1;
      S.m[i]-=mv;
      var ow=S.w[j],om=S.m[j];
      S.m[j]+=mv;
      S.w[j]=(om*ow+mv*S.w[i])/Math.max(0.001,S.m[j]);
      S.t[j]=cl((S.w[j]-0.42)*1.75*(S.d[j]/6));
      cc[i]=null;cc[j]=null;
      if(Math.random()<0.10)burst(3000+Math.random()*1400,1.2,0.05,0.020);
    }
  }
  /* --- boom / truck --- */
  var idle=(M.lastTouch+=dt)>3.5;
  if(idle&&!M.gone){M.boomT=M.edge+2.2;M.depthT+=(0.46-M.depthT)*Math.min(1,dt*0.9);}
  M.truck+=cl(M.boomT-2-M.truck,-2.2*dt,2.2*dt);
  var lo=M.truck-4, hi=M.truck+13;
  var bt=cl(M.boomT,lo,hi);
  var nb2=M.boom+cl(bt-M.boom,-7*dt,7*dt);
  M.boomV=Math.abs(nb2-M.boom)/Math.max(0.001,dt);
  M.boom=nb2;
  M.depth+=cl(M.depthT-M.depth,-1.9*dt,1.9*dt);
  /* --- jam / trip --- */
  if(M.jam>0){
    M.jam-=dt;M.rpm=Math.max(0,M.rpm-520*dt);S.clogSec+=dt;
    if(M.jam<=0){knock(true);}
  }
  if(M.trip>0){
    M.trip-=dt;M.rpm=Math.max(0,M.rpm-300*dt);M.gone=true;
    if(M.trip<=0){M.gone=false;S.hopM=0;S.hopV=0;S.trips++;S.wear+=0.004;knock(false);}
  }
  /* --- throttle / rpm --- */
  var thrT=(M.jam>0||M.gone)?0:(M.held?1.0:(idle?0.70:0.62));
  M.thr+=cl(thrT-M.thr,-dt/2.0,dt/1.2);
  var att=RPM_NOM*(1-S.drag);
  var loadT=0;
  /* --- airflow --- */
  var blockK=1, bm=M.block?M.block.mass*M.block.dens:0;
  blockK=1+bm*0.055;
  var burialK=1+7.2*M.depth*M.depth;
  var seg=Math.round(M.boom);
  if(seg>=GR0&&seg<=GR1)burialK+=1.6;
  var P=Math.pow(M.rpm/RPM_NOM,2);
  M.V=7250*Math.sqrt(Math.max(0.0001,P/(burialK*blockK)));
  /* --- intake --- */
  var rate=0, under=(seg>=CAR0&&seg<=CAR1);
  if(M.jam<=0&&!M.gone&&seg>=0&&seg<N&&!under&&S.m[seg]>0.02){
    /* the rake crew ahead: only broken mat lifts */
    if(rakeFront<M.boom+30)rakeFront+=dt*(0.42+0.22*Math.random());
    if(rakeFront<M.boom)rakeFront=M.boom;
    var prepped=rakeFront>seg+0.5?1:0.22;
    var fric=0.18+0.78*S.t[seg];
    var matF=(1-0.88*fric)*prepped+0.10*prepped;
    var contact=Math.min(1,M.depth*2.25);
    rate=30*contact*(M.V/6000)*matF;
    if(seg>=GR0&&seg<=GR1)rate*=0.45;
    if(rate<0)rate=0;
    var take=Math.min(S.m[seg],rate*dt);
    if(take>0){
      S.m[seg]-=take;cc[seg]=null;
      /* deposition inside the hose when airspeed falls */
      var depF=cl((V_SUSP-M.V)/V_SUSP*1.45,0,0.95);
      var dep=take*depF, carried=take-dep;
      if(dep>0.0001){
        if(!M.block){
          M.block={pos:HOSE_LEN*(0.25+0.6*cl(M.V/V_SUSP)),mass:0,dens:1};
        }
        M.block.mass+=dep;
        S.clogSec+=dt*0.5;
      }
      if(carried>0){
        var dens=250+560*S.w[seg];
        var comp=3.8-1.5*Math.min(1,S.wear/0.6);
        S.hopM+=carried; S.hopV+=carried/(dens*comp);
        S.lbs+=carried; S.wear+=carried*8e-7;
        loadT=rate;
        /* leaf impacts against the housing */
        leafAccum+=rate*1.15*dt;
        while(leafAccum>1){
          leafAccum-=1;
          if(S.w[seg]>0.5)burst(480+Math.random()*360,1.0,0.055+Math.random()*0.04,0.045);
          else burst(2600+Math.random()*2200,1.4,0.018+Math.random()*0.018,0.035);
        }
      }
      /* sticks */
      if(Math.random()<dt*rate*0.011){
        knock(false);M.rpm-=70+Math.random()*90;S.wear+=0.0006;
      }
      /* the yard at 1191 */
      if(!S.hoseTaken&&seg===HOSE_FT&&S.m[seg]<1.2){
        S.hoseTaken=1;S.drag=Math.min(0.45,S.drag+0.075);M.hoseRub=1;
        knock(true);M.rpm-=200;
      }
      /* the branch at 1289 */
      if(!S.branchDone&&seg===BRANCH_FT&&S.m[seg]<1.2){
        S.branchDone=1;knock(true);M.jam=24+Math.random()*13;M.rpm-=500;
      }
      S.feet=Math.max(S.feet,0);
    }
  }
  /* --- rpm dynamics --- */
  if(M.jam<=0&&!M.gone){
    M.rpm+=((M.thr*att-M.rpm)*1.7-loadT*15)*dt;
    M.rpm=cl(M.rpm,0,att);
  }
  /* --- hopper --- */
  if(!M.gone&&(S.hopM>=AXLE||S.hopV>=HOP_CY)){
    M.trip=(M.clock>SITE_CLOSE)?99999:(104+Math.random()*30);
    M.gone=true;
  }
  /* --- scrub --- */
  scrubV*=Math.pow(0.16,dt); flipR*=Math.pow(0.22,dt);
  if(M.block){
    var pw=Math.min(1,scrubV/230)*Math.min(1,flipR/2.6);
    var auth=cl(1-(M.block.pos/HOSE_LEN)*1.05,0.06,1);
    if(down&&pw>0.42){
      M.block.mass-=(pw-0.38)*26*dt*auth;
      M.block.dens=Math.max(1,M.block.dens-dt*0.5);
      if(Math.random()<dt*7)burst(1200+Math.random()*900,1.0,0.07,0.05);
    }else if(down&&scrubV>12&&pw<0.30){
      M.block.dens=Math.min(2.4,M.block.dens+dt*0.28);
    }
    if(M.block.mass<=0){M.block=null;M.dens=1;burst(520,0.7,0.5,0.14);}
    else S.clogSec+=dt*0.3;
  }
  M.edge=edgeOf();
  S.feet=Math.max(S.feet,M.edge-START_EDGE>0?M.edge-START_EDGE:0);
  /* --- ambience timers --- */
  carT-=dt; if(carT<=0){carPass();carT=78+Math.random()*28;}
  for(var r=0;r<2;r++){
    rk[r]-=dt;
    if(rk[r]<=0){
      rk[r]=0.62+Math.random()*0.95;
      var f=2100+Math.random()*1500;
      burst(f,1.1,0.10+Math.random()*0.06,0.040);
      if(Math.random()<0.4)setTimeout(function(ff){return function(){burst(ff*0.8,1.3,0.07,0.022);};}(f),55+Math.random()*60);
    }
  }
  blowT-=dt;
  if(blowT<=0&&ready){
    blowT=1.4+Math.random()*3.4;
    var t=A.currentTime,tf=460+Math.random()*700;
    blowF.frequency.cancelScheduledValues(t);
    blowF.frequency.setTargetAtTime(tf,t,0.28);
    blowG.gain.setTargetAtTime(0.020+Math.random()*0.028,t,0.30);
  }
  /* --- audio params --- */
  if(ready){
    var t2=A.currentTime;
    var bf=Math.max(18,M.rpm/60*BLADES);
    imp1.frequency.setTargetAtTime(bf,t2,0.05);
    imp2.frequency.setTargetAtTime(bf*2.01,t2,0.05);
    impG.gain.setTargetAtTime(M.gone||M.jam>0?0.0:0.055+0.055*(M.rpm/RPM_NOM),t2,0.12);
    var vn=cl(M.V/7250);
    airF.frequency.setTargetAtTime(320+vn*1250,t2,0.12);
    airF.Q.setTargetAtTime(1.2+4.4*(1-vn),t2,0.2);
    airG.gain.setTargetAtTime(M.gone||M.jam>0?0.004:(0.018+0.14*vn*vn),t2,0.15);
    dzG.gain.setTargetAtTime(M.gone?0.0:(M.jam>0?0.0:0.30),t2,0.5);
    dzLFO.frequency.setTargetAtTime(M.gone?18:23.6+2.4*M.thr,t2,0.6);
    rubL.frequency.setTargetAtTime(Math.max(2,M.rpm/60),t2,0.06);
    rubG.gain.setTargetAtTime((M.hoseRub&&!M.gone&&M.jam<=0)?0.038*(M.rpm/RPM_NOM):0,t2,0.2);
    hydF.frequency.setTargetAtTime(760+M.boomV*60,t2,0.08);
    hydG.gain.setTargetAtTime(Math.min(0.05,M.boomV*0.013),t2,0.07);
  }
  saveT-=dt; if(saveT<=0){saveT=4;save();}
}

/* ---------- draw ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(pave,0,0,W,H);
  var runs=[],inR=false,rs=0,x,i;
  for(x=0;x<W;x++){
    i=(x*N/W)|0;
    if(i>=CAR0&&i<=CAR1){ if(inR){runs.push([rs,x]);inR=false;} continue; }
    if(S.m[i]<0.35){
      if(!inR){inR=true;rs=x;}
      ctx.fillStyle=col(i);
      ctx.fillRect(x,LT,1,LH);
    }else if(inR){runs.push([rs,x]);inR=false;}
  }
  if(inR)runs.push([rs,W]);
  ctx.globalCompositeOperation="overlay";
  for(var r=0;r<runs.length;r++){
    ctx.save();ctx.beginPath();ctx.rect(runs[r][0],LT,runs[r][1]-runs[r][0],LH);ctx.clip();
    ctx.drawImage(vari,0,0,W,H);ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
  for(x=0;x<W;x++){
    i=(x*N/W)|0;
    if(i>=CAR0&&i<=CAR1)continue;
    if(S.m[i]>=0.35)continue;
    var mt=S.t[i];
    if(mt>0.22){ctx.fillStyle="rgba(74,66,56,"+(mt*0.62).toFixed(3)+")";ctx.fillRect(x,LT,1,LH);}
    var wv=S.w[i];
    if(wv>0.45&&mt<0.62){
      ctx.fillStyle="rgba(198,188,168,"+((wv-0.45)*0.50*(1-mt)).toFixed(3)+")";
      ctx.fillRect(x,LT+4+spJ[x],1,3);
    }
  }
  /* storm grate */
  var g0=Math.floor(GR0/N*W),g1=Math.ceil((GR1+1)/N*W);
  ctx.fillStyle="#262724";ctx.fillRect(g0,LT+3,Math.max(2,g1-g0),LH-6);
  for(var b=g0;b<g1;b+=3){ctx.fillStyle="rgba(110,111,104,0.55)";ctx.fillRect(b,LT+3,1,LH-6);}
  /* the gap stays pavement */
  var cx0=Math.floor(CAR0/N*W),cx1=Math.ceil((CAR1+1)/N*W);
  ctx.drawImage(pave,cx0*dpr,0,(cx1-cx0)*dpr,H*dpr,cx0,0,cx1-cx0,H);
  /* rake crew scuffs */
  var rx=Math.floor(rakeFront/N*W);
  ctx.fillStyle="rgba(110,111,104,0.30)";ctx.fillRect(rx,H-11,2,5);ctx.fillRect(rx+5,H-10,1,4);
  /* cones at the two aprons — amber */
  for(var k2=0;k2<AP.length;k2++){
    var ax=Math.floor(AP[k2][0]/N*W);
    ctx.fillStyle="#f08a12";
    ctx.beginPath();ctx.moveTo(ax,H-7);ctx.lineTo(ax+3,H-16);ctx.lineTo(ax+6,H-7);ctx.closePath();ctx.fill();
    ctx.fillRect(ax-1,H-7,8,2);
  }
  if(!M.gone){
    /* beacon sweep, 1.4 s */
    var ph=((performance.now()%1400)/1400);
    var c=ph*W*1.3-W*0.15;
    var gr=ctx.createLinearGradient(c-78,0,c+78,0);
    gr.addColorStop(0,"rgba(240,138,18,0)");
    gr.addColorStop(0.5,"rgba(240,138,18,0.26)");
    gr.addColorStop(1,"rgba(240,138,18,0)");
    ctx.fillStyle=gr;ctx.fillRect(c-78,0,156,H);
    ctx.fillStyle="rgba(240,138,18,0.55)";ctx.fillRect(Math.round(c),0,2,H);
    /* the nozzle boom — hard amber edge */
    var bx=Math.round(M.boom/N*W);
    var ny=LT+Math.round(M.depth*(LH-6));
    ctx.fillStyle="#f08a12";
    ctx.fillRect(bx-1,ny,3,H-6-ny);
    var mw=3+Math.round(6*cl(M.V/7250));
    ctx.fillRect(bx-mw,ny,mw*2,2);
    ctx.fillRect(bx-mw,ny-3,2,4);
    ctx.fillRect(bx+mw-2,ny-3,2,4);
  }
}
