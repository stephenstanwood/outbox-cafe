  <meta name="outbox-spec-era" content="Autumn 1983, the first wave of pocket LCD handhelds: a cheap single-screen game-and-clock unit bought from a garage forecourt spinner rack. It has a pale grey-green reflective liquid-crystal window. Every sprite is a fixed segment printed onto the glass in its one permitted position, so the unlit 'ghost' segments are always faintly visible behind the lit ones. There is a two-button-plus-cross membrane pad, a coin-cell battery hatch and a tiny speaker that can only beep. The game is FLOCK WATCH: one sheepdog, five sheep, one hillside and one pen, all drawn in segments.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY: a real, playable sheepdog trial on a fake LCD handheld, rendered edge to edge as the unit itself. You steer the dog only by whistle, never directly. Four whistle commands are bound to the arrow keys and to four on-screen membrane buttons: COME-BYE (circle clockwise), AWAY (circle anticlockwise), WALK UP (move toward the flock) and LIE DOWN (stop dead). Your goal is to gather five sheep off the top of the hill, drive them down through a gate of two hurdles and shut them in the pen before the clock runs out. The sheep genuinely flock and flee from the dog. Every creature is snapped to the nearest pre-printed segment position, so the motion is that jerky, charming LCD hop.">
  <meta name="outbox-spec-subject" content="Wisp, a young, keen and not-quite-trained border collie on her first trial. She wants to do everything right and also wants very badly to run straight at the sheep, which scatters them. The whole game is the tug between your whistles and her enthusiasm. If she is pushed too fast she overruns and splits the flock. If she is left lying down too long she creeps forward on her own. One sheep, the segment with the slightly darker face, is an old ewe called Mrs Pargeter. She always breaks for the wall and has to be headed off. A rabbit segment in the corner lights up occasionally and Wisp is desperate about it.">
  <meta name="outbox-spec-tone" content="Wisp's own thoughts, scrolling across a narrow dot-matrix strip above the field one word-chunk at a time. They are breathless, sincere, all-caps when excited, and devoted to you. 'SHEEP! Sheep sheep sheep. Okay. Lying down. I am lying down SO well.' She repeats your commands back to herself to stay focused. She apologises instantly and completely whenever the flock splits ('that was me. that was entirely me. sorry.'). She is scandalised by Mrs Pargeter and loses her whole train of thought whenever the rabbit appears. When she wins she is overjoyed and a little smug. She is never sad, never sarcastic and never wise, and she never explains herding.">

<script>
(()=>{
const K='#1f261c',W=320,H=220;

let fade=clamp(+LS.g('fw_cell',0)||0,0,1),wheel=+LS.g('fw_wheel',.5);if(!(wheel>=0&&wheel<=1))wheel=.5;
let best=+LS.g('HI',0)||0,mode='game';
function fit(){const r=Math.min(3,window.devicePixelRatio||1);cv.width=W*r;cv.height=H*r}fit();addEventListener('resize',fit);
console.log('%cWisp: I can see the sheep from in here. Can you see the sheep? SHEEP.','font-weight:bold');

/* ---- sound: one tiny speaker ---- */
let AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}

/* ---- Wisp ---- */
const L={
 come:["Come-bye. Come-bye come-bye.","COME-BYE! Round the clock way!","Come-bye. Nice and wide. Being SO wide.","Come-bye! Going! Gone round!"],
 away:["Away. Away away away.","AWAY! The other round!","Away. Not come-bye. Away. Got it. GOT it."],
 walk:["Walk up. Walking up. Walking.","WALK UP! Toward them! YES!","Walk up. Nicely. So nicely."],
 lie:["Lie down. Lying down. I am lying down SO well.","Down! Flat! Flattest dog!","Lie down. Staying. Staying staying staying."],
 fast:["WALK UP WALK UP WALK UP!","FAST! Is this fast? THIS IS FAST!"],
 over:["Oh I'm very close. I'm IN them.","Whoops! Straight through! Hello sheep!"],
 creep:["...still lying down. Mostly.","My feet moved. Not me. My feet.","Just a tiny bit closer. Tiny. Tiny."],
 sorry:["that was me. that was entirely me. sorry.","sorry. sorry. that was all me.","i split them. i'm so sorry. fixing it. fixing it now.","that one was my fault. all of it. sorry."],
 mrs:["MRS PARGETER. Mrs Pargeter is going to the WALL.","She's doing it AGAIN! Mrs PARGETER!","MRS PARGETER! We TALKED about the wall!","The dark face one! She's BREAKING!"],
 wall:["She's just STANDING at the wall. Looking at it.","What is SO good about that wall."],
 rab:["RABBIT","RABBIT. RABBIT RABBIT RABBIT.","rabb— RABBIT! In the CORNER!"],
 rabGone:["Where did it go. Where did it GO. / ...Sheep! Sheep. Yes.","It went. Okay. What was I doing. / SHEEP."],
 derail:["Walk u— RABBIT.","Come-by— is that the RABBIT?","Yes! Absolutely! RABBIT."],
 idle:["Sheep sheep sheep.","Are you watching? You're watching. Good.","I love this. I love this SO much.","Ready. Ready. Ready.","Sheep are eating. Sheep, don't eat, we're busy."],
 zzz:["zzz","zzz... sheep... zzz","zzz","zzz... walk up... zzz","zzz... rab... zzz","zzz"]
};
const NUM=['','ONE','TWO','THREE','FOUR','ALL FIVE'];
let Q=[],buf='',nextSay=0,lastSaid=0;
function say(t,urgent){if(urgent)Q=[];Q.push(...t.split('/').map(s=>s.trim()).filter(Boolean))}
function stripTick(now){
 if(!Q.length){if(mode==='clock'&&now-lastSaid>1600)say(pick(L.zzz));else if(mode==='game'&&S.state==='play'&&now-lastSaid>9000)say(pick(L.idle))}
 if(Q.length&&now>=nextSay){const c=Q.shift();buf=(buf+'   '+c).slice(-260);sayEl.textContent=buf;nextSay=now+420+c.length*38;lastSaid=now}
}

/* ---- the trial ---- */
const HUR=[[96,136],[184,224]],GY=120,PX=236,PY=148;
let S;
function reset(st){
 S={state:st,cmd:'lie',dog:{x:160,y:204},sheep:[],el:0,lieT:0,spr:0,sv:{x:0,y:0},walks:[],rab:0,rabN:60+rnd(80),mb:0,mN:35+rnd(40),split:0,wallCD:0,gated:0,penned:0,sec:150,shut:false};
 [[170,56],[196,50],[214,62],[188,70],[226,48]].forEach((p,i)=>S.sheep.push({x:p[0],y:p[1],vx:0,vy:0,mrs:i===0,gated:false,pen:false}));
}
reset('title');
function cen(){let n=0,x=0,y=0;S.sheep.forEach(s=>{if(!s.pen){n++;x+=s.x;y+=s.y}});return n?{x:x/n,y:y/n,n}:{x:272,y:180,n:0}}
function start(){reset('play');say("OKAY. Okay okay okay. / Sheep! Up there! / Five. I counted. Five. / I am going to be SO good.",true);beep(1000,.05);beep(1500,.07,.07)}
function win(){S.state='won';S.shut=true;const t=Math.max(1,Math.round(S.el/1000));beep(200,.08);beep(160,.1,.1);[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.1,.3+i*.12,.06));
 const nb=!best||t<best;if(nb){best=t;LS.s('HI',String(t))}
 say("ALL FIVE. ALL FIVE IN THE PEN! / We did it! / I did it mostly. / No. WE did it. / I did the running, though."+(nb?" / A NEW HI! Up in the corner! Look at it!":""),true)}
function lose(){S.state='lost';S.sec=0;beep(400,.2);beep(300,.3,.25);say("Is it over? It's over! / That was the BEST first trial. / Again? AGAIN? Press GAME!",true)}

function tick(){
 const play=S.state==='play',d=S.dog,C=cen();
 if(play){
  if(S.rab>0){if(--S.rab===0)say(pick(L.rabGone))}else if(--S.rabN<=0){S.rab=17;S.rabN=90+rnd(110);say(pick(L.rab),true);beep(2600,.03,0,.03)}
  let dx=d.x-C.x,dy=d.y-C.y,r=Math.hypot(dx,dy)||1;
  if(S.spr>0){S.spr--;d.x+=S.sv.x;d.y+=S.sv.y}
  else if(S.cmd==='come'||S.cmd==='away'){const a=Math.atan2(dy,dx)+(S.cmd==='come'?1:-1)*7.5/Math.max(r,24),R=r+(60-r)*.3-.5-rnd(.9);d.x=C.x+Math.cos(a)*R;d.y=C.y+Math.sin(a)*R}
  else if(S.cmd==='walk'){if(r<20&&Math.random()<.35){S.spr=4;S.sv={x:-dx/r*10,y:-dy/r*10};say(pick(L.over),true)}else if(r>8){const st=Math.min(5,r-8);d.x-=dx/r*st;d.y-=dy/r*st}}
  else{S.lieT+=180;if(S.lieT>3600){const st=.9+rnd(1.2);d.x-=dx/r*st;d.y-=dy/r*st;if((S.lieT/180)%20===1)say(pick(L.creep))}}
  if(S.rab>0){const rx=24-d.x,ry=200-d.y,rr=Math.hypot(rx,ry)||1,k=S.cmd==='lie'?.8:2.6;d.x+=rx/rr*k;d.y+=ry/rr*k}
  d.x=clamp(d.x+(Math.random()-.5)*1.2,12,306);d.y=clamp(d.y+(Math.random()-.5)*1.2,44,210);
 }
 const act=S.sheep.filter(s=>!s.pen);
 for(const s of S.sheep){
  if(s.pen){s.x=clamp(s.x+(Math.random()-.5)*2,244,300);s.y=clamp(s.y+(Math.random()-.5)*2,158,202);continue}
  let ax=0,ay=0;
  if(act.length>1){let cx=0,cy=0;act.forEach(o=>{if(o!==s){cx+=o.x;cy+=o.y}});cx/=act.length-1;cy/=act.length-1;if(Math.hypot(cx-s.x,cy-s.y)<110){ax+=(cx-s.x)*.035;ay+=(cy-s.y)*.035}}
  act.forEach(o=>{if(o===s)return;const ox=s.x-o.x,oy=s.y-o.y,od=Math.hypot(ox,oy)||.1;if(od<15){ax+=ox/od*(15-od)*.14;ay+=oy/od*(15-od)*.14}});
  const ex=s.x-d.x,ey=s.y-d.y,ed=Math.hypot(ex,ey)||.1;
  if(ed<62){const p=(62-ed)/62;ax+=ex/ed*p*4.6;ay+=ey/ed*p*4.6}
  if(s.mrs&&play){if(S.mb>0){ax-=2.1;ay+=(Math.random()-.5)}else ax-=.12}
  ax+=(Math.random()-.5)*.5;ay+=(Math.random()-.5)*.5;
  s.vx=s.vx*.55+ax;s.vy=s.vy*.55+ay;const sp=Math.hypot(s.vx,s.vy),mx=S.spr>0?9:7.5;if(sp>mx){s.vx*=mx/sp;s.vy*=mx/sp}
  const px=s.x,py=s.y;s.x+=s.vx;s.y+=s.vy;
  if((py<GY)!==(s.y<GY)){
   if(HUR.some(h=>s.x>h[0]-3&&s.x<h[1]+3)){s.y=py;s.vy*=-.3}
   else if(py<GY&&s.x>136&&s.x<184&&!s.gated&&play){s.gated=true;S.gated++;beep(1200,.04);say(`Through the gate! That's ${NUM[S.gated]}! Did you SEE?`)}
  }
  if(s.x>PX&&s.y>PY&&!(px>PX&&py>PY)){
   if(play&&s.gated&&px<=PX&&s.y>158){s.pen=true;S.penned++;beep(880,.05);beep(1320,.06,.06);say(`In the pen! ${NUM[S.penned]} in! IN!`)}
   else{s.x=px;s.y=py;s.vx*=-.4;s.vy*=-.4}
  }
  s.x=clamp(s.x,20,306);s.y=clamp(s.y,40,210);
 }
 if(play){
  const m=S.sheep[0];
  if(!m.pen){if(S.mb>0)S.mb--;else if(--S.mN<=0){S.mb=20;S.mN=45+rnd(45);say(pick(L.mrs),true)}if(m.x<30&&S.wallCD<=0){say(pick(L.wall));S.wallCD=40}}
  if(S.wallCD>0)S.wallCD--;if(S.split>0)S.split--;
  const a2=S.sheep.filter(s=>!s.pen);
  if(a2.length>1&&S.split<=0){const c=cen();if(a2.some(s=>Math.hypot(s.x-c.x,s.y-c.y)>64)){say(pick(L.sorry),true);S.split=45;beep(300,.08,0,.04)}}
  if(S.penned===5)win();
 }
}

/* ---- glass ---- */
const I=new Map();let gh=.085,vis=1,onT=14,offT=22,DT=16;
function seg(k,on,fn){let v=I.get(k)||0;v+=((on?1:0)-v)*(1-Math.exp(-DT/(on?onT:offT)));I.set(k,v);ctx.globalAlpha=gh+(vis-gh)*v;fn()}
const SG={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','H':'bcefg','I':'bc','-':'g',' ':''};
function digit(k,x,y,w,h,ch){const on=SG[ch]||'',t=Math.max(1.5,w*.18),hh=h/2;
 const R={a:[x+t,y,w-2*t,t],g:[x+t,y+hh-t/2,w-2*t,t],d:[x+t,y+h-t,w-2*t,t],f:[x,y+t*.8,t,hh-t*1.3],b:[x+w-t,y+t*.8,t,hh-t*1.3],e:[x,y+hh+t*.5,t,hh-t*1.3],c:[x+w-t,y+hh+t*.5,t,hh-t*1.3]};

function sheepBody(x,y){ctx.beginPath();blob(x-3,y,3);blob(x+1,y-1.6,3);blob(x+1,y+1.6,3);blob(x-1,y,3.2);ctx.fill();ctx.fillRect(x-4,y+3,1.4,3);ctx.fillRect(x+1,y+3,1.4,3);ctx.lineWidth=1;ctx.strokeRect(x+4.5,y-3.5,3,4)}
function dogStand(x,y){ctx.fillRect(x-5,y-2,10,3.5);ctx.fillRect(x+4,y-6,4,4);ctx.fillRect(x+7,y-4.5,2.5,2);ctx.fillRect(x+4,y-7.6,1.6,2);ctx.fillRect(x-5,y+1,1.5,4);ctx.fillRect(x+3,y+1,1.5,4);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-5,y-1);ctx.lineTo(x-9,y-5);ctx.stroke()}
function dogLie(x,y){ctx.fillRect(x-6,y+1,11,3);ctx.fillRect(x+4,y-2,4,4);ctx.fillRect(x+7,y-.5,3,2);ctx.fillRect(x+5,y+3.5,5,1.2);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x-6,y+3);ctx.lineTo(x-10,y+3.5);ctx.stroke()}
const CMDS=[['away','◀AWAY',88,14],['come','COME-BYE▶',150,14],['walk','▲WALK UP',88,28],['lie','▼LIE DOWN',150,28]];

function draw(now){
 const r=cv.width/W;ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,W,H);
 const cm=.7+.6*wheel;gh=.085*cm;vis=Math.min(1,Math.max(.13,(1-.82*fade)*cm));onT=14+fade*480;offT=22+fade*1300;
 sayEl.style.opacity=vis.toFixed(3);ctx.fillStyle=K;ctx.strokeStyle=K;
 const g=mode==='game';
 seg('rule',true,()=>ctx.fillRect(0,34,320,1));
 seg('hill',true,()=>{ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(10,96);ctx.quadraticCurveTo(110,30,210,38);ctx.quadraticCurveTo(285,44,312,82);ctx.stroke();ctx.setLineDash([])});
 seg('wall',true,()=>{ctx.lineWidth=1;for(let y=40,n=0;y<132;y+=7,n++)ctx.strokeRect(n%2?5:3,y,8,6)});
 HUR.forEach((h,i)=>seg('hur'+i,true,()=>{ctx.fillRect(h[0],GY-6,2,12);ctx.fillRect(h[1]-2,GY-6,2,12);ctx.fillRect(h[0]+(h[1]-h[0])/2-1,GY-6,2,12);[-4,0,3].forEach(o=>ctx.fillRect(h[0],GY+o,h[1]-h[0],1.4))}));
 seg('pen',true,()=>{ctx.fillRect(PX,PY-1,72,2);ctx.fillRect(PX,210,72,2);ctx.fillRect(306,PY-1,2,63);ctx.fillRect(PX,PY-1,2,11)});
 seg('doorS',g&&S.shut,()=>{ctx.fillRect(PX,158,2,52);for(let y=164;y<210;y+=9)ctx.fillRect(PX-3,y,8,1.3)});
 seg('doorO',!(g&&S.shut),()=>{ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PX+1,158);ctx.lineTo(PX-24,168);ctx.stroke()});
 seg('rab',g&&S.rab>0,()=>{ctx.beginPath();blob(24,204,3.4);blob(28.5,200.5,2.3);blob(20,203,1.4);ctx.fill();ctx.fillRect(27.5,193,1.3,6);ctx.fillRect(29.8,193.5,1.3,6)});
 const occ=new Map();
 if(g)S.sheep.forEach(s=>{const k=Math.round((s.x-8)/16)+','+Math.round((s.y-40)/16);occ.set(k,Math.max(occ.get(k)||0,s.mrs?2:1))});
 for(let i=1;i<20;i++)for(let j=0;j<12;j++){const x=8+16*i,y=40+16*j,k=i+','+j,o=occ.get(k)||0;seg('s'+k,o>0,()=>sheepBody(x,y));seg('m'+k,o===2,()=>ctx.fillRect(x+4,y-4,4,5))}
 let dk,pose='lie';
 if(g){dk=clamp(Math.round((S.dog.x-16)/16),0,18)+','+clamp(Math.round((S.dog.y-48)/16),0,10);pose=(S.state==='play'&&(S.cmd!=='lie'||S.spr>0))||S.state==='won'?'st':'lie'}else dk='1,7';
 for(let i=0;i<19;i++)for(let j=0;j<11;j++){const x=16+16*i,y=48+16*j,k=i+','+j;seg('ds'+k,dk===k&&pose==='st',()=>dogStand(x,y));seg('dl'+k,dk===k&&pose==='lie',()=>dogLie(x,y))}
 digit('hH',4,7,8,14,'H');digit('hI',13,7,8,14,'I');
 const bm=best?String(Math.min(9,Math.floor(best/60))):'-',bs=best?String(best%60).padStart(2,'0'):'--';
 digit('b0',28,7,8,14,bm);seg('bc',true,()=>{ctx.fillRect(38.5,10,1.8,1.8);ctx.fillRect(38.5,16,1.8,1.8)});digit('b1',42,7,8,14,bs[0]);digit('b2',52,7,8,14,bs[1]);
 ctx.font='bold 7px ui-monospace,Menlo,monospace';
 CMDS.forEach(c=>seg('c'+c[0],g&&S.state==='play'&&S.cmd===c[0],()=>ctx.fillText(c[1],c[2],c[3])));
 const ts=g?S.sec:150;
 digit('t0',256,5,12,23,String(Math.floor(ts/60)));seg('tc',g||Math.floor(now/500)%2===0,()=>{ctx.fillRect(271,10,2.4,2.4);ctx.fillRect(271,20,2.4,2.4)});
 digit('t1',277,5,12,23,String(ts%60).padStart(2,'0')[0]);digit('t2',293,5,12,23,String(ts%60).padStart(2,'0')[1]);
 const D=new Date(),h=D.getHours(),h12=h%12||12,mm=String(D.getMinutes()).padStart(2,'0'),c=!g;
 digit('k0',96,100,24,44,c&&h12>=10?'1':' ');digit('k1',126,100,24,44,c?String(h12%10):' ');
 seg('kc',c&&D.getSeconds()%2===0,()=>{ctx.fillRect(157,112,4,4);ctx.fillRect(157,128,4,4)});
 digit('k2',168,100,24,44,c?mm[0]:' ');digit('k3',198,100,24,44,c?mm[1]:' ');
 ctx.font='bold 8px ui-monospace,Menlo,monospace';
 seg('am',c&&h<12,()=>ctx.fillText('AM',230,112));seg('pm',c&&h>=12,()=>ctx.fillText('PM',230,126));
 const zi=Math.floor(now/550)%4;
 [[42,148,7],[50,139,9],[60,128,11]].forEach((z,i)=>seg('z'+i,c&&i<zi,()=>{ctx.font='bold '+z[2]+'px ui-monospace,Menlo,monospace';ctx.fillText('z',z[0],z[1])}));
 ctx.globalAlpha=1;
}

/* ---- loop ---- */
let last=performance.now(),acc=0,saveT=0;
function frame(now){
 const dt=Math.min(100,Math.max(0,now-last));last=now;DT=dt||16;
 if(!document.hidden){fade=Math.min(1,fade+dt/900000);saveT+=dt;if(saveT>4000){saveT=0;LS.s('fw_cell',fade.toFixed(4))}}
 if(mode==='game'&&S.state==='play'){S.el+=dt;const sec=Math.max(0,Math.ceil(150-S.el/1000));if(sec!==S.sec){S.sec=sec;beep(sec<=10?2000:1600,.02,0,sec<=10?.05:.012)}if(S.el>=150000)lose()}
 acc+=dt;while(acc>=180){acc-=180;if(mode==='game')tick()}
 stripTick(now);draw(now);requestAnimationFrame(frame);
}

/* ---- pad ---- */
function flash(k){const b=document.querySelector('[data-c="'+k+'"]');if(b){b.classList.add('dn');setTimeout(()=>b.classList.remove('dn'),120)}}
function cmd(k){au();whistle(k);if(mode!=='game')return;if(S.state!=='play'){if(S.state==='title')start();return}
 S.cmd=k;S.lieT=0;
 if(k==='walk'){const n=performance.now();S.walks=S.walks.filter(t=>n-t<2600);S.walks.push(n);
  if(S.walks.length>=3){const C=cen(),dx=C.x-S.dog.x,dy=C.y-S.dog.y,r=Math.hypot(dx,dy)||1;S.spr=5;S.sv={x:dx/r*11,y:dy/r*11};S.walks=[];say(pick(L.fast),true);return}}
 if(S.rab>0&&Math.random()<.6){say(pick(L.derail),true);return}
 say(pick(L[k]),true)}
function gameBtn(){au();beep(1400,.03);if(mode==='clock'){modeBtn();return}start()}
function modeBtn(){au();beep(900,.03);mode=mode==='game'?'clock':'game';
 if(mode==='clock')say('zzz',true);else say("I'm awake! I was awake the whole time. / Sheep?",true)}
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();cmd(b.dataset.c)}));
document.getElementById('bg').addEventListener('pointerdown',e=>{e.preventDefault();gameBtn()});
document.getElementById('bm').addEventListener('pointerdown',e=>{e.preventDefault();modeBtn()});
addEventListener('keydown',e=>{const m={ArrowRight:'come',ArrowLeft:'away',ArrowUp:'walk',ArrowDown:'lie'}[e.key];
 if(m){e.preventDefault();if(!e.repeat){cmd(m);flash(m)}}else if(e.key==='m'||e.key==='M')modeBtn();else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!e.repeat)gameBtn()}});
const hatch=document.getElementById('hatch');
hatch.addEventListener('click',()=>{au();hatch.classList.add('open');setTimeout(()=>hatch.classList.remove('open'),700);
 fade=0;LS.s('fw_cell','0');I.clear();reset('title');mode='game';beep(600,.04);beep(1200,.05,.3);
 say("OH! Hello! Everything's all bright! / Sheep again! / Press GAME! Press GAME!",true)});
const wh=document.getElementById('wheel');let wy=null;
function setW(v){wheel=clamp(v,0,1);wh.style.backgroundPosition='0 '+(wheel*60).toFixed(1)+'px';LS.s('fw_wheel',wheel.toFixed(3))}
wh.addEventListener('pointerdown',e=>{wy=e.clientY;try{wh.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
wh.addEventListener('pointermove',e=>{if(wy===null)return;setW(wheel-(e.clientY-wy)/160);wy=e.clientY});
['pointerup','pointercancel'].forEach(t=>wh.addEventListener(t,()=>{wy=null}));
wh.addEventListener('wheel',e=>{e.preventDefault();setW(wheel-e.deltaY/1200)},{passive:false});
setW(wheel);
say("Is it now? Is it now? / Press GAME. Please press GAME. / I can see sheep. / I can see FIVE sheep.");
requestAnimationFrame(frame);
})();
