  <meta name="outbox-spec-era" content="Mid-January 1974, the third afternoon of a ground blizzard on a north–south county grid road in Emmons County, North Dakota. Nothing has fallen out of the sky since Tuesday: every grain moving across this section is old snow, already fallen once, already packed once, now being moved for the fourth or fifth time by a 26-knot northwesterly that has not dropped below 20 in fifty hours. Two hundred metres of 4-foot lath-and-wire fence stands on steel posts in the stubble, set back from the road grade at the distance somebody paced off in October. The overcast is total and shadowless, there is no horizon, and the drift behind the fence is at about seventy percent of the volume it will hold. Not a look-back at anything, not a lament, not a memory of hard winters: the fence is working right now, it is thirteen inches from being buried in two places, and once it is buried the drift starts walking toward the road.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one stretch of snow fence and the ground downwind of it, seen obliquely from standing height about thirty metres out in the stubble, so the fence runs from lower left to upper right across the frame and the drift lies out toward the viewer with its whole length readable. Wind comes across the frame left to right at a slight angle. There is no header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label and no readable character anywhere at any time — the only thing on the page is weather, ground, and a fence. It is a live aeolian transport engine: several hundred thousand snow grains are moved by a real turbulent boundary layer, they saltate and suspend and deposit according to actual shear stress at the surface, and the drift shape behind the fence is not drawn, sculpted, keyframed or eased — it is whatever the deposition arithmetic has built since the visitor's first visit and it only ever gets bigger. The visitor's entire vocabulary is three things a person could do to a fence with cold hands: DRAG horizontally to walk along the fence line, which is real parallax across two hundred metres of fence with genuinely different porosity, different drift, and different burial depth section by section; CLICK any single lath to pull it out (or push a loose one back in), which permanently changes the porosity of that panel and therefore permanently changes the shape, length and height of the drift downwind of it; and DRAG the wire panel vertically on its posts to raise or lower the bottom gap, which is the single most consequential thing on the page and is never explained. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat mechanics of a snow fence, and specifically that a snow fence does not stop snow and never has — it slows the air, and the air puts down what it can no longer carry, which means the entire device is a deposition problem and not a barrier problem. That mass transport goes roughly as the CUBE of wind speed above the threshold, so a 30-knot wind moves not fifty percent more snow than a 20-knot wind but something over three times as much, and one bad thirty-six-hour blow puts down more than a whole quiet January. That there are two transport modes and they behave completely differently: SALTATION, grains bouncing in a shallow moving carpet within the first ten or fifteen centimetres of the surface, which is where most of the mass actually is; and SUSPENSION, the fine stuff carried up into the air column, which is what makes a whiteout and which is mostly LOST — sublimating in transit, so a long fetch delivers measurably less snow to the fence than a short one because the air ate it on the way. That the threshold friction velocity is a property of the SNOW and not the wind: fresh dry snow starts moving in a breeze, and the same snow eight hours later, wind-packed and slightly sintered, will not move at twice that speed, which is exactly why a ground blizzard runs out of material without anything falling and then finds more when the surface is broken. That POROSITY IS THE WHOLE DESIGN and the answer is counterintuitive — a fence about half open holds far more snow than a solid one, because a solid fence throws a violent lee eddy that scours a pit immediately behind it and drops a short steep drift close in, while a porous fence bleeds enough air through to kill the eddy, so the wake reattaches five or six fence heights downwind and the drift lies out long, shallow and enormous. That an ideally porous fence stores something like six to eight times its own height squared in snow per metre of length, and a solid one stores a fraction of that. That the BOTTOM GAP is the difference between a fence that works for a season and a fence that buries itself in a week: leave roughly a tenth to a seventh of the fence height clear at the ground and the accelerated jet under the panel scours the snow away from the fence's own feet and pushes the whole drift downwind where it belongs; set the panel on the ground and deposition begins at the fence, climbs the fence, and the fence is out of service and cannot be recovered until spring. That SET-BACK is the arithmetic everybody gets wrong: the drift will run out roughly thirty-five times the fence height, so a four-foot fence needs something like forty-five metres of clear ground before the road shoulder, and a fence set close to the road is not a partly-effective fence, it is a machine for putting a drift on the pavement. That deposited drift snow is not the snow that fell — it arrives already broken into rounded grains and packs to two or three times the density of new snowfall, then sinters harder every hour, which is why a two-day-old drift takes a wing plough and a one-hour-old drift takes a broom. That the drift reaches EQUILIBRIUM: once its profile matches the flow, the fence stops capturing and everything arriving simply goes over the top and lands on the road, so a fence at capacity is functionally not there. That scour and deposition are the same process with the sign flipped, so the same wind that is building a five-foot cornice at forty metres is cutting a hollow at two. That the fence itself is the least interesting object on the page — laths, wire, steel posts, four dollars a running foot, and the whole of its behaviour is set by how much air goes through it and how much goes under.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wind, the grains and the flat light, and that register is LOUD, DRY, ABRASIVE, GRANULAR and BUSY — a shallow carpet of snow moving fast and continuously across the whole floor of the frame at all times, in visible streamers that braid and split around every obstruction; grain hitting lath hard enough to be a rattle and not a whisper; the fence panel working measurably against its staples; the whole picture in flat total overcast so there is no shadow anywhere, no horizon anywhere, no modelling except what the drift's own curvature does to multiply-scattered light. The air is not empty and never quiet. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the drift goes on building whether or not anybody touches a lath. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT a screensaver, NOT stately, NOT reverent, NOT bleak, NOT ominous, NOT lonely — this is a working fence in a stubble field on a Thursday with a truck due through and the wind holding steady.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. Snow is NOT white here and its value is COMPUTED, never chosen: the sky is a total overcast dome of near-uniform luminance, so every point on the ground is lit almost entirely by multiply-scattered light and its rendered value falls out of local surface curvature and sky-view factor alone — a convex drift crest sees nearly the whole dome and comes out a hard bright grey-white (#eef2f4), a concave scour hollow sees much less of it and goes a genuine deep blue-grey (#b9c8d4), and the tightest lee pockets and the cornice undercut go further still (#8fa3b4). Because the sky and the far ground converge on the same value (#d9dde0) there is no horizon line rendered anywhere and the top third of the frame and the far fifth of the field are honestly the same tone, which is not a stylistic wash but an arithmetic consequence, and it means the drift's far end genuinely dissolves. Suspended snow in the air column reduces contrast over distance by a real extinction term, so the far posts are measurably softer than the near ones and get softer when the wind gusts. The saltation carpet is rendered as actual grains at true relative scale, each catching the dome as a small flat highlight, so the moving layer reads as a bright granular haze lying along the ground rather than as a filter over the image. Against all of that, the fence is the only warm thing on the page: lath weathered oxide red where the paint has held (#8c3a26), sandblasted to a chalky pink-grey on the windward faces where four winters of saltating grain have taken the paint off at exactly saltation height and nowhere else (#b58f80), and bare grey split lath where a slat has lost it entirely (#9a9086), with steel T-posts and their punched studs in a dull cold grey (#55564f) and rusted twist-wire at every tie (#6b4a35). Stubble showing through the scour zone is bleached wheat straw (#c8bda0), and it is the only thing in frame that is not snow, steel or wood. Exactly one chip of highway-orange delineator (#ff5a1f) is held strictly for the three plastic reflector tabs wired to the fence at hundred-foot intervals and for the strip of orange baling twine on the round bale downwind — it appears nowhere else on the page, never on snow, never on lath, never on steel. Flat, hard, high contrast at the near end and honestly extinguished at the far end; no glow, no bloom, no lens flare, no soft focus, no vignette, no blue-hour tinting, no gradients other than honest sky-view shading, honest atmospheric extinction and honest grain highlight.">
  <meta name="outbox-spec-wildcard" content="There is a single round hay bale sitting out in the stubble about forty metres downwind of the fence, dropped off a truck at some point and never picked up, still with a strip of orange twine round it. The engine treats it exactly as it treats the fence: a real solid obstruction in the flow solve, zero porosity, no bottom gap, so it builds its own honest miniature drift — a scour crescent immediately behind it and a long tapering comet tail running downwind, which is a completely different shape from anything the porous fence produces and sits in the same frame for comparison that nobody makes. It is already about a third buried at load. It cannot be moved, cannot be clicked, cannot be affected in any way, and nothing on the page accounts for it. Same bale, same twine, same place, every visit — and it gets deeper every visit and never comes out.">
  <meta name="outbox-spec-forbidden" content="NO snow-as-metaphor for anything — not blankness, not erasure, not forgetting, not purity, not what covers over, not what accumulates, not 'it buries everything eventually'; this is deposited mass at 350 kilos the cubic metre with a threshold friction velocity, and it has nothing to teach anybody. ABSOLUTELY NO winter lyricism: no describing snow as soft, hushed, gentle, feathered, sugar, lace, ash or falling like anything; no crystal reverie; no 'no two alike'; no white-as-silence, because nothing here is silent and nothing here is falling. NO whiteout as void, abyss, dissolution, the sublime, or nature's indifference; the horizon is missing because sky luminance and ground luminance converge, and that is the entire content of it. NO cozy: no woodstove, no coffee thermos, no snowed-in warmth, no waiting-out-the-storm, no somebody-inside-a-house. NO survival or danger-porn: no getting lost twenty feet from the door, no frozen bodies, no cautionary tale, no dread, no foreshadowed accident, no 'the road is closed and nobody knows'; a truck goes through and keeps going. NO prairie Americana whatsoever: no big sky, no amber waves, no Little House, no homesteader hardship, no Willa Cather, no Fargo, no woodchipper joke, no upper-midwest accent comedy, no aren't-they-hardy condescension, no farm-crisis pathos, no explaining North Dakota to anybody, and NO settler-and-Native history imported as atmosphere or subtext. NO 1974-as-period-signifier, NO oil-crisis drift, NO Watergate, NO 70s retro-kitsch, NO camp affection for the fence, the T-posts or the reflector tabs. NO nostalgia, NO wistfulness, NO 'nobody puts up lath fence anymore / it's all plastic mesh now / the county crews are gone' decline narrative — the fence went up in October and it is working this minute. NO craftsman-sage register, NO 'the old road men knew where to set them', NO folk-wisdom, NO trade mystique, NO master-and-apprentice arc, NO wise-absent-figure who paced it off. NO climate sermon and NO ecological elegy. NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery, chillout or screensaver framing, and no 'let it settle you'; the piece is loud, granular and abrasive from the first frame. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the bale, the missing horizon, the buried sections or the drift that never melts — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object in frame. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a flat grey afternoon. NO signal / transmission / frequency / broadcast framing of the wire's tone or the wind, despite both having a pitch. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the snow, the ground, the fence and the bale, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 *  ground blizzard, third afternoon. every grain here already fell.
 *  fence height H = 4 ft = 1.22 m. 200 m of lath on steel posts.
 *  x runs along the fence (metres from the west end)
 *  y runs downwind from the fence (metres), positive = toward the road
 * ------------------------------------------------------------------ */

var cv = document.getElementById('c'), gx = cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  gx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

/* ---------------- constants ---------------- */
var FH = 1.22;              // fence height, m
var NX = 200;               // 200 columns, 1 m each, along the fence
var NY = 56;                // downwind cells
var DY = 1.0;               // m per downwind cell
var SETBACK = 36.6;         // paced off at 30H in October. wants 35H.
var RHO_NEW = 120, RHO_MAX = 460;
var LATHS_PER_PANEL = 12;   // laths per metre-column
var KEY = 'emmons.co.grid.1974.snowfence.v3';

/* ---------------- state ---------------- */
var S = {
  h: null,        // NX*NY elevation, m
  dens: null,     // NX*NY deposited density kg/m3
  age: null,      // NX*NY sintering age, hours
  laths: null,    // NX * LATHS_PER_PANEL, 1 = in, 0 = pulled
  gap: null,      // NX bottom gap, m
  hours: 0        // cumulative wind hours run
};

function idx(i,j){ return j*NX + i; }

function fresh(){
  S.h    = new Float32Array(NX*NY);
  S.dens = new Float32Array(NX*NY);
  S.age  = new Float32Array(NX*NY);
  S.laths= new Uint8Array(NX*LATHS_PER_PANEL);
  S.gap  = new Float32Array(NX);
  S.hours= 0;

  // October installation, plus about fifty hours of blow already on it.
  for(var i=0;i<NX;i++){
    // porosity varies section to section: whoever wired it wasn't fussy
    var openWant = 0.42 + 0.16*Math.sin(i*0.031) + 0.10*Math.sin(i*0.113+1.7);
    for(var k=0;k<LATHS_PER_PANEL;k++){
      var pulled = (hash(i*17+k*7)%1000)/1000 < (openWant-0.22);
      S.laths[i*LATHS_PER_PANEL+k] = pulled?0:1;
    }
    S.gap[i] = 0.13*FH + 0.05*FH*Math.sin(i*0.07+0.4);
    if(i>128 && i<141) S.gap[i] = 0.012;   // this run got set on the ground
  }

  // seed the drift with fifty hours' worth, roughly the right shape
  for(i=0;i<NX;i++){
    var op = openFraction(i);
    var peak = FH*(0.30 + 0.55*op);
    var runout = FH*(6 + 26*op);
    var close = FH*(1.0 + 5.0*op);
    for(var j=0;j<NY;j++){
      var y=(j+0.5)*DY;
      var e;
      if(y<close*0.55){ e = -0.22*FH*Math.exp(-Math.pow((y-close*0.15)/(close*0.5),2)); }
      else { var t=(y-close*0.55)/runout; e = peak*Math.exp(-Math.pow(t*2.4,1.55))*(1-Math.exp(-t*6)); }
      // the two sections thirteen inches from the top
      if(i>128&&i<141){ e = (FH-0.33)*Math.exp(-Math.pow(y/(FH*3.2),1.6)); }
      e += 0.035*(noise2(i*0.21,j*0.19)-0.5);
      S.h[idx(i,j)] = Math.max(-0.35, e);
      S.dens[idx(i,j)] = 300 + 90*noise2(i*0.4,j*0.3);
      S.age[idx(i,j)] = 20 + 30*noise2(i*0.11+9,j*0.13);
    }
  }
  addBale();
}

function addBale(){
  // round bale, 40 m downwind, dropped off a truck. a third buried at load.
  for(var i=BALE_I-2;i<=BALE_I+2;i++){
    for(var j=BALE_J-1;j<=BALE_J+8;j++){
      if(i<0||i>=NX||j<0||j>=NY) continue;
      var dx=(i-BALE_I), dy=(j-BALE_J);
      if(dy<1.2 && Math.abs(dx)<1.6){ S.h[idx(i,j)] -= 0.10; }
      else if(dy>0){ var t=dy/9; S.h[idx(i,j)] += 0.30*Math.exp(-t*2.2)*Math.exp(-dx*dx/(0.9+t*3)); }
    }
  }
}
var BALE_I = 96, BALE_J = 40, BALE_R = 0.78, BALE_BURY = 0.34;

function hash(n){ n=(n<<13)^n; return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff); }
function noise2(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  function r(a,b){ return (hash(a*374761+b*668265)%10000)/10000; }
  var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return (r(xi,yi)*(1-u)+r(xi+1,yi)*u)*(1-v)+(r(xi,yi+1)*(1-u)+r(xi+1,yi+1)*u)*v;
}

function openFraction(i){
  var n=0; for(var k=0;k<LATHS_PER_PANEL;k++) if(!S.laths[i*LATHS_PER_PANEL+k]) n++;
  var solidH = FH - S.gap[i];
  var latheOpen = n/LATHS_PER_PANEL;
  // gap counts as open area too, weighted by its share of the panel band
  var gapShare = S.gap[i]/FH;
  return Math.min(0.97, latheOpen*(1-gapShare) + gapShare);
}
function burialDepth(i){
  // drift height at the fence line (j=0..1)
  return Math.max(S.h[idx(i,0)], S.h[idx(i,1)]);
}

/* ---------------- persistence, forward only ---------------- */
function save(){
  try{
    var o = {
      v:3, hours:S.hours,
      h:Array.prototype.slice.call(S.h).map(function(v){return Math.round(v*1000);}),
      d:Array.prototype.slice.call(S.dens).map(function(v){return Math.round(v);}),
      a:Array.prototype.slice.call(S.age).map(function(v){return Math.round(v);}),
      l:Array.prototype.slice.call(S.laths).join(''),
      g:Array.prototype.slice.call(S.gap).map(function(v){return Math.round(v*1000);})
    };
    localStorage.setItem(KEY, JSON.stringify(o));
  }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return false;
    var o = JSON.parse(raw); if(!o||o.v!==3) return false;
    fresh();
    for(var n=0;n<NX*NY;n++){
      S.h[n]=o.h[n]/1000; S.dens[n]=o.d[n]; S.age[n]=o.a[n];
    }
    for(n=0;n<S.laths.length;n++) S.laths[n]= o.l.charCodeAt(n)===49?1:0;
    for(n=0;n<NX;n++) S.gap[n]=o.g[n]/1000;
    S.hours = o.hours||0;
    return true;
  }catch(e){ return false; }
}
if(!load()) fresh();

/* ---------------- wind ---------------- */
var wind = {
  mean: 13.4,          // m/s, ~26 kt
  inst: 13.4,
  dir: 0.0,            // radians of backing from due NW
  gustPhase: [0.3,1.9,4.4], gustRate:[0.09,0.031,0.0072],
  ustar: 0.62,
  z0: 0.0018
};
function updateWind(dt, t){
  var g = 0;
  for(var k=0;k<3;k++){
    wind.gustPhase[k] += dt*wind.gustRate[k]*(1+0.3*Math.sin(t*0.013*(k+1)));
    g += Math.sin(wind.gustPhase[k]*6.2831)*[1.9,1.15,0.6][k];
  }
  g += (noise2(t*0.9, 3.1)-0.5)*1.8;
  wind.inst = Math.max(9.0, wind.mean + g);
  wind.dir += dt*0.00016*Math.sin(t*0.0021);      // mean direction backs slowly
  wind.z0 = 0.0012 + 0.0011*(wind.inst/13.4);
  // log profile: u(z)=ustar/k * ln(z/z0). solve ustar from u at 2 m.
  wind.ustar = wind.inst*0.40/Math.log(2.0/wind.z0);
}

/* ---------------- flow solve over the porous fence ---------------- *
 * per column i, per downwind cell j, we compute a shear-stress
 * multiplier from: bleed flow through the panel, the under-jet at the
 * bottom gap, and the lee eddy whose strength scales with (1-porosity).
 * reattachment length runs out with porosity, so the drift lies long.
 * ------------------------------------------------------------------ */
var shearMul = new Float32Array(NX*NY);
var solveTick = 0;

function solveFlow(){
  for(var i=0;i<NX;i++){
    var bur = burialDepth(i);
    var effH = Math.max(0, FH - bur);
    var buried = effH < 0.06;
    var op = openFraction(i);
    var gap = Math.max(0, Math.min(S.gap[i], effH));
    // pressure loss coefficient of a porous screen, k = (1/Cd)*((1-b)/b)^2
    var b = Math.max(0.06, Math.min(0.94, op));
    var kloss = (1/0.62)*Math.pow((1-b)/b, 2);
    var bleed = 1/Math.sqrt(1+kloss);          // fraction of freestream through panel

    // reattachment length in fence heights: solid ~4H, ideal porous ~5.5-6.5H
    var Lr = effH*(2.2 + 8.5*b);
    var eddy = Math.pow(1-b, 1.6);             // lee eddy strength
    var jet  = Math.min(1, gap/(0.14*FH));     // under-jet strength, peaks near H/7

    // upwind of the drift the flow is undisturbed. neighbours smear laterally.
    for(var j=0;j<NY;j++){
      var y=(j+0.5)*DY;
      var m;
      if(buried){
        m = 1.0;   // section out of service. transport passes over unimpeded.
      } else {
        var yh = y/Math.max(0.25,effH);
        // wake velocity deficit, recovering downwind of reattachment
        var deficit = (1-bleed)*Math.exp(-Math.pow(yh/(Lr/effH), 1.35));
        m = (1 - deficit*0.92);
        // the eddy: a scour pit close in behind a solid panel
        if(yh < 1.6){
          m += eddy*1.35*Math.exp(-Math.pow((yh-0.55)/0.7,2));
        }
        // the under-jet scours the fence's own feet clear
        if(yh < 2.6){
          m += jet*1.15*Math.exp(-Math.pow((yh-0.35)/0.85,2));
        }
        // recovery well downwind
        m += (1-m)*Math.max(0, 1-Math.exp(-Math.max(0,yh-(Lr/effH))*0.28));
      }
      // local topography: crests speed up, hollows shelter
      var hh=S.h[idx(i,j)];
      var up = j>0 ? S.h[idx(i,j-1)] : hh;
      var slope = (hh-up)/DY;
      m *= (1 + 2.6*slope);
      // sky/ground scour on the exposed crest of the drift
      shearMul[idx(i,j)] = Math.max(0.05, Math.min(2.4, m));
    }
  }
  // small lateral diffusion so panels talk to their neighbours a little
  var tmp = new Float32Array(NX*NY);
  for(var jj=0;jj<NY;jj++) for(var ii=0;ii<NX;ii++){
    var a=shearMul[idx((ii+NX-1)%NX,jj)], c=shearMul[idx((ii+1)%NX,jj)];
    tmp[idx(ii,jj)] = 0.24*a+0.52*shearMul[idx(ii,jj)]+0.24*c;
  }
  shearMul.set(tmp);
}
solveFlow();

/* ---------------- transport ---------------- *
 * threshold friction velocity is a property of the snow, not the wind.
 * fresh: ~0.16 m/s. sintered 8h: ~0.42. old wind slab: 0.7+.
 * mass flux Q ~ (u*^2 - u*t^2)*u* / g  ->  cube-ish in excess shear.
 * ------------------------------------------------------------------ */
var saltGrainsHitLath = 0;
var suspendLoad = 0;

function ustarT(dens, age){
  var d = Math.min(1, (dens-120)/340);
  var a = Math.min(1, age/12);
  return 0.15 + 0.42*d + 0.22*a;
}

function stepTransport(dtHours){
  var g=9.81, tot=0, hitAcc=0, susp=0;
  for(var i=0;i<NX;i++){
    var flux = 0;       // saltation mass carried into this column from upwind
    // fetch loss: sublimation eats suspended mass over the fetch
    for(var j=0;j<NY;j++){
      var n=idx(i,j);
      var us = wind.ustar*Math.sqrt(shearMul[n]);
      var ut = ustarT(S.dens[n], S.age[n]);
      var cap = 0;
      if(us>ut){
        // integrated flux, proportional to excess shear cubed
        cap = 0.0011*(us*us-ut*ut)*us/g*3600;   // kg/m/hour scale
        cap *= dtHours;
      }
      var dz;
      if(cap > flux){
        // erosion: entrain up to capacity, limited by what's there
        var want = (cap-flux)*0.55;
        var avail = Math.max(0, (S.h[n]+0.42))*S.dens[n]*0.02;
        var take = Math.min(want, avail);
        flux += take;
        dz = -take/Math.max(140,S.dens[n]);
        S.h[n] += dz;
        S.age[n] *= 0.35;                       // freshly broken surface
        S.dens[n] = Math.max(200, S.dens[n]-6*dtHours);
        tot += take;
      } else {
        // deposition: air can't carry it, it goes down
        var drop = (flux-cap)*0.62;
        flux -= drop;
        var rho = 290 + 110*Math.min(1, us/0.9);   // drift snow packs hard
        dz = drop/rho;
        var old = S.h[n];
        S.h[n] += dz;
        var f = dz/Math.max(1e-6, Math.abs(dz)+0.004);
        S.dens[n] = S.dens[n]*(1-0.35*f) + rho*0.35*f;
        S.age[n] *= (1-0.5*f);
      }
      // sublimation loss out of the suspended fraction, all along the fetch
      var lost = flux*0.019*dtHours*(0.5+us);
      flux -= lost;
      susp += Math.max(0, flux)*Math.min(1,us/0.5);
      // sintering
      S.age[n] += dtHours;
      S.dens[n] = Math.min(RHO_MAX, S.dens[n] + 3.4*dtHours*(1-S.dens[n]/RHO_MAX));
      // grains striking the lath: only where the panel is still standing
      if(j===0){
        var effH = Math.max(0, FH - burialDepth(i));
        var solidFrac = 1-openFraction(i);
        hitAcc += flux*solidFrac*(effH/FH);
      }
    }
  }
  saltGrainsHitLath = hitAcc;
  suspendLoad = susp/(NX*NY);
  avalanche(dtHours);
  S.hours += dtHours;
}

function avalanche(dtHours){
  // angle of repose relaxation. drift snow stands steeper as it sinters.
  for(var pass=0;pass<2;pass++){
    for(var i=0;i<NX;i++) for(var j=0;j<NY-1;j++){
      var a=idx(i,j), b=idx(i,j+1);
      var repose = Math.tan((28 + 22*Math.min(1,S.age[a]/16))*Math.PI/180)*DY;
      var d = S.h[a]-S.h[b];
      if(Math.abs(d)>repose){
        var mv = (Math.abs(d)-repose)*0.42*(d>0?1:-1);
        S.h[a]-=mv; S.h[b]+=mv;
        S.age[b]*=0.5;
      }
    }
    for(var jj=0;jj<NY;jj++) for(var ii=0;ii<NX-1;ii++){
      var c=idx(ii,jj), e=idx(ii+1,jj);
      var rep = 0.72;
      var dd = S.h[c]-S.h[e];
      if(Math.abs(dd)>rep){ var m2=(Math.abs(dd)-rep)*0.3*(dd>0?1:-1); S.h[c]-=m2; S.h[e]+=m2; }
    }
  }
}

/* ---------------- camera ---------------- *
 * standing height, 30 m out in the stubble, oblique. fence runs lower
 * left to upper right. x along fence maps to screen with perspective.
 * ------------------------------------------------------------------ */
var cam = { x: 62, eye: 1.62, dist: 30, yaw: 0.34 };
var camTarget = cam.x;

function project(fx, fy, fz){
  // fx metres along fence from west end (relative to cam.x)
  // fy metres downwind of fence line (toward viewer)
  // fz metres elevation
  var ax = fx - cam.x;
  var az = cam.dist - fy;               // depth from eye
  // yaw so the fence runs diagonally
  var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  var rx = ax*cy - az*sy*0.0;           // keep along-fence linear
  var rz = az*cy + ax*sy;
  if(rz < 1.2) rz = 1.2;
  var f = (H*0.86)/rz;
  var sx = W*0.5 + rx*f*0.62;
  var sy2= H*0.50 + (cam.eye - fz)*f*0.55;
  return {x:sx, y:sy2, s:f, z:rz};
}

/* ---------------- rendering: sky-view shading ---------------- *
 * total overcast: every point lit by multiply-scattered dome light.
 * value falls out of local curvature and sky-view factor alone.
 * ------------------------------------------------------------------ */
function shade(skyView){
  // skyView 0..1 -> #8fa3b4 .. #eef2f4 through #b9c8d4
  var t = Math.max(0, Math.min(1, skyView));
  var r,g,b;
  if(t<0.5){
    var u=t/0.5;
    r=143+(185-143)*u; g=163+(200-163)*u; b=180+(212-180)*u;
  }else{
    var u2=(t-0.5)/0.5;
    r=185+(238-185)*u2; g=200+(242-200)*u2; b=212+(244-212)*u2;
  }
  return [r,g,b];
}
function extinct(rgb, depth){
  // suspended snow reduces contrast over distance. sky value #d9dde0.
  var k = 1-Math.exp(-depth*(0.0148 + 0.010*Math.max(0,(wind.inst-11)/6)));
  return [ rgb[0]+(217-rgb[0])*k, rgb[1]+(221-rgb[1])*k, rgb[2]+(224-rgb[2])*k ];
}
function css(rgb,a){ return 'rgba('+(rgb[0]|0)+','+(rgb[1]|0)+','+(rgb[2]|0)+','+(a===undefined?1:a)+')'; }

function skyViewAt(i,j){
  var n=idx(i,j);
  var h=S.h[n];
  var s=0, cnt=0;
  for(var d=1;d<=5;d++){
    var jn=Math.min(NY-1,j+d), jp=Math.max(0,j-d);
    var im=Math.max(0,i-d), ip=Math.min(NX-1,i+d);
    s += (h - S.h[idx(i,jn)])/d + (h - S.h[idx(i,jp)])/d
       + (h - S.h[idx(im,j)])/d + (h - S.h[idx(ip,j)])/d;
    cnt+=4;
  }
  var curv = s/cnt;                        // >0 convex, <0 concave
  var sv = 0.56 + curv*5.6;
  // fence shelters a little sky right at its feet
  var effH = Math.max(0, FH - burialDepth(i));
  if(j<3) sv -= 0.10*(effH/FH)*(1-j/3);
  // bale occludes sky nearby
  var db = Math.hypot(i-BALE_I, (j-BALE_J)*1.0);
  if(db<3.4) sv -= 0.16*(1-db/3.4);
  return sv;
}

/* ---------------- grains ---------------- */
var GN = 2600;
var gr = new Float32Array(GN*5);   // x along fence, y downwind, z, vy, size
for(var q=0;q<GN;q++){
  gr[q*5]   = Math.random()*NX;
  gr[q*5+1] = Math.random()*NY*DY;
  gr[q*5+2] = Math.random()*0.16;
  gr[q*5+3] = 0.4+Math.random()*0.9;
  gr[q*5+4] = 0.4+Math.random()*1.3;
}
var SUS = 900;
var su = new Float32Array(SUS*4);
for(q=0;q<SUS;q++){
  su[q*4]=Math.random()*NX; su[q*4+1]=Math.random()*NY*DY;
  su[q*4+2]=0.2+Math.random()*3.0; su[q*4+3]=Math.random();
}

function groundAt(fx,fy){
  var i=Math.max(0,Math.min(NX-1,Math.round(fx)));
  var j=Math.max(0,Math.min(NY-1,Math.round(fy/DY)));
  return S.h[idx(i,j)];
}
function shearAt(fx,fy){
  var i=Math.max(0,Math.min(NX-1,Math.round(fx)));
  var j=Math.max(0,Math.min(NY-1,Math.round(fy/DY)));
  return shearMul[idx(i,j)];
}

/* ---------------- audio ---------------- */
var A = null, nodes = {};
function initAudio(){
  if(A) return;
  try{
    var AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    A = new AC();
    var master = A.createGain(); master.gain.value=0.0; master.connect(A.destination);
    nodes.master = master;

    // broad wind bed
    var len = A.sampleRate*4, buf=A.createBuffer(1,len,A.sampleRate), d=buf.getChannelData(0);
    var b0=0,b1=0,b2=0;
    for(var n=0;n<len;n++){
      var wn=Math.random()*2-1;
      b0=0.99765*b0+wn*0.0990460; b1=0.96300*b1+wn*0.0505; b2=0.57000*b2+wn*0.1538;
      d[n]=(b0+b1+b2+wn*0.1848)*0.28;
    }
    var src=A.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=0.4;
    var hp=A.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=60;
    var wg=A.createGain(); wg.gain.value=0.5;
    src.connect(hp); hp.connect(lp); lp.connect(wg); wg.connect(master); src.start();
    nodes.windLP=lp; nodes.windG=wg;

    // dry hiss of grain over packed drift
    var s2=A.createBufferSource(); s2.buffer=buf; s2.loop=true; s2.playbackRate.value=1.7;
    var bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3400; bp.Q.value=0.9;
    var hg=A.createGain(); hg.gain.value=0.12;
    s2.connect(bp); bp.connect(hg); hg.connect(master); s2.start();
    nodes.hissBP=bp; nodes.hissG=hg;

    // rattle bus
    var rg=A.createGain(); rg.gain.value=0.5; rg.connect(master); nodes.rattle=rg;

    // wire singing on the top strand
    var osc=A.createOscillator(); osc.type='sawtooth'; osc.frequency.value=142;
    var of=A.createBiquadFilter(); of.type='bandpass'; of.frequency.value=142; of.Q.value=14;
    var og=A.createGain(); og.gain.value=0.0;
    osc.connect(of); of.connect(og); og.connect(master); osc.start();
    nodes.wireOsc=osc; nodes.wireBP=of; nodes.wireG=og;

    master.gain.setTargetAtTime(0.55, A.currentTime, 1.2);
  }catch(e){ A=null; }
}
function tick(name, gainv, freq, decay, type){
  if(!A) return;
  try{
    var o=A.createOscillator(); o.type=type||'triangle'; o.frequency.value=freq;
    var g=A.createGain(); g.gain.setValueAtTime(gainv, A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime+decay);
    o.connect(g); g.connect(nodes.rattle||nodes.master); o.start(); o.stop(A.currentTime+decay+0.02);
  }catch(e){}
}
function noiseHit(gainv, f, decay){
  if(!A) return;
  try{
    var len=Math.max(64, (A.sampleRate*decay)|0);
    var b=A.createBuffer(1,len,A.sampleRate), d=b.getChannelData(0);
    for(var n=0;n<len;n++) d[n]=(Math.random()*2-1)*Math.pow(1-n/len,2.4);
    var s=A.createBufferSource(); s.buffer=b;
    var bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=2.2;
    var g=A.createGain(); g.gain.value=gainv;
    s.connect(bp); bp.connect(g); g.connect(nodes.rattle||nodes.master); s.start();
  }catch(e){}
}
function updateAudio(dt){
  if(!A) return;
  var t=A.currentTime;
  var u=wind.inst;
  nodes.windG.gain.setTargetAtTime(Math.min(0.9, 0.22+0.055*(u-9)), t, 0.25);
  nodes.windLP.frequency.setTargetAtTime(420+95*(u-9), t, 0.3);
  // hiss band set by density under the wind at mid-frame
  var dsurf = S.dens[idx(Math.round(cam.x), 8)]||320;
  nodes.hissBP.frequency.setTargetAtTime(2200+dsurf*4.2, t, 0.4);
  nodes.hissG.gain.setTargetAtTime(Math.min(0.22, 0.03+0.016*(u-9)), t, 0.3);
  // wire: pitch set by tension in the top strand, which rises with load
  var vis = 0, cnt=0;
  for(var i=Math.max(0,Math.round(cam.x)-14); i<Math.min(NX,Math.round(cam.x)+15); i++){
    vis += (1-openFraction(i))*(Math.max(0,FH-burialDepth(i))/FH); cnt++;
  }
  vis = cnt? vis/cnt : 0;
  var f0 = 96 + 78*(u/13.4) + 30*vis;
  nodes.wireOsc.frequency.setTargetAtTime(f0, t, 0.6);
  nodes.wireBP.frequency.setTargetAtTime(f0, t, 0.6);
  nodes.wireG.gain.setTargetAtTime(Math.min(0.055, 0.004+0.0045*(u-11))*(0.3+vis), t, 0.5);

  // grain on lath: rate from actual saltating mass hitting standing panel
  var rate = Math.min(70, saltGrainsHitLath*vis*0.9 + 4*vis*(u-9));
  rateAcc += rate*dt;
  while(rateAcc>1){
    rateAcc-=1;
    noiseHit(0.010+Math.random()*0.020, 1600+Math.random()*4200, 0.012+Math.random()*0.02);
  }
  // post ring under gust load
  if(u>16.2 && Math.random()<dt*1.4){
    tick('post', 0.020, 188+Math.random()*40, 0.42, 'sine');
  }
  // panel working against its staples
  if(Math.random()<dt*0.55*(u/13.4)){
    noiseHit(0.030, 240+Math.random()*180, 0.06);
  }
}
var rateAcc=0;

/* truck: comes up the grade once, gears down for the drift, goes on */
var truck = {t: 40 + Math.random()*130, active:false, p:0, done:false};
function updateTruck(dt){
  if(truck.done) return;
  if(!truck.active){ truck.t-=dt; if(truck.t<=0){ truck.active=true; truck.p=0; startTruck(); } return; }
  truck.p += dt/26;
  if(truck.p>=1){ truck.active=false; truck.done=true; stopTruck(); }
  else if(A && nodes.truckG){
    var env = Math.exp(-Math.pow((truck.p-0.5)/0.30,2));
    var gearDown = truck.p>0.44 && truck.p<0.62;
    nodes.truckG.gain.setTargetAtTime(env*0.10, A.currentTime, 0.3);
    var rpm = gearDown ? 62 : 46 + 22*Math.abs(truck.p-0.5)*2;
    nodes.truckOsc.frequency.setTargetAtTime(rpm, A.currentTime, gearDown?0.15:0.6);
    nodes.truckBP.frequency.setTargetAtTime(rpm*4.5, A.currentTime, 0.4);
  }
}
function startTruck(){
  if(!A) return;
  try{
    var o=A.createOscillator(); o.type='sawtooth'; o.frequency.value=46;
    var bp=A.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=300; bp.Q.value=3;
    var g=A.createGain(); g.gain.value=0;
    o.connect(bp); bp.connect(g); g.connect(nodes.master); o.start();
    nodes.truckOsc=o; nodes.truckBP=bp; nodes.truckG=g;
  }catch(e){}
}
function stopTruck(){
  if(!A||!nodes.truckOsc) return;
  try{ nodes.truckG.gain.setTargetAtTime(0, A.currentTime, 0.4);
       nodes.truckOsc.stop(A.currentTime+2.5); }catch(e){}
  nodes.truckOsc=null;
}

/* ---------------- draw ---------------- */
function draw(){
  gx.fillStyle='#d9dde0'; gx.fillRect(0,0,W,H);

  var i0 = Math.max(0, Math.floor(cam.x-34)), i1 = Math.min(NX-1, Math.ceil(cam.x+34));

  // ---- ground, far to near so near cells overwrite ----
  for(var j=NY-1;j>=0;j--){
    var y0=j*DY, y1=(j+1)*DY;
    for(var i=i1;i>=i0;i--){
      var n=idx(i,j);
      var hA=S.h[n], hB=S.h[idx(i, Math.max(0,j-1))];
      var hC=S.h[idx(Math.min(NX-1,i+1), j)];
      var hD=S.h[idx(Math.min(NX-1,i+1), Math.max(0,j-1))];
      var p1=project(i, y1, hA), p2=project(i+1, y1, hC),
          p3=project(i+1, y0, hD), p4=project(i, y0, hB);
      if(p1.y<-60 && p4.y<-60) continue;
      var sv = skyViewAt(i,j);
      var rgb = extinct(shade(sv), p1.z);
      gx.fillStyle=css(rgb);
      gx.beginPath();
      gx.moveTo(p1.x,p1.y); gx.lineTo(p2.x,p2.y); gx.lineTo(p3.x,p3.y); gx.lineTo(p4.x,p4.y);
      gx.closePath(); gx.fill();

      // stubble showing where the surface has scoured below the field level
      if(hA < -0.06 && p1.z < 22){
        var stub = Math.min(1, (-hA-0.06)/0.22);
        gx.strokeStyle='rgba(200,189,160,'+(0.30*stub*Math.max(0,1-p1.z/24))+')';
        gx.lineWidth=Math.max(0.6, p1.s*0.006);
        for(var sN=0; sN<3; sN++){
          var r1=(hash(i*991+j*77+sN)%1000)/1000, r2=(hash(i*331+j*13+sN*5)%1000)/1000;
          var sp=project(i+r1, y0+r2*DY, hA);
          var tp=project(i+r1+0.03, y0+r2*DY, hA+0.09+0.05*r2);
          gx.beginPath(); gx.moveTo(sp.x,sp.y); gx.lineTo(tp.x,tp.y); gx.stroke();
        }
      }
    }
  }

  // ---- the bale, 40 m downwind ----
  drawBale();

  // ---- saltation carpet: real grains at true relative scale ----
  gx.save();
  for(var q=0;q<GN;q++){
    var fx=gr[q*5], fy=gr[q*5+1], fz=gr[q*5+2];
    if(fx<i0-2||fx>i1+2) continue;
    var gh=groundAt(fx,fy);
    var p=project(fx, fy, gh+fz);
    if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30) continue;
    var sz = Math.max(0.5, gr[q*5+4]*p.s*0.0038);
    var a = Math.max(0, 0.62*Math.exp(-p.z*0.026)) * (1-fz/0.22);
    gx.fillStyle='rgba(240,244,246,'+a.toFixed(3)+')';
    gx.fillRect(p.x, p.y, sz, sz*0.8);
  }
  gx.restore();

  // ---- fence ----
  drawFence(i0,i1);

  // ---- suspension: fine stuff in the air column, extinction over depth ----
  gx.save();
  for(q=0;q<SUS;q++){
    var sx=su[q*4], sy=su[q*4+1], sz2=su[q*4+2];
    if(sx<i0-6||sx>i1+6) continue;
    var pp=project(sx, sy, groundAt(sx,sy)+sz2);
    if(pp.x<-40||pp.x>W+40) continue;
    var aa = 0.055*Math.exp(-sz2*0.24)*(0.5+0.5*su[q*4+3]);
    gx.fillStyle='rgba(226,231,234,'+aa.toFixed(3)+')';
    var s3=Math.max(1.2, pp.s*0.016);
    gx.fillRect(pp.x, pp.y, s3*2.4, s3*0.5);
  }
  gx.restore();

  // ---- streamers braiding across the whole floor of the frame ----
  drawStreamers();

  // ---- truck on the grade at the bottom of frame ----
  if(truck.active) drawTruck();
}

function drawFence(i0,i1){
  for(var i=i1;i>=i0;i--){
    var bur = burialDepth(i);
    var effH = Math.max(0, FH - bur);
    if(effH<=0.02) continue;                       // this section is out of service
    var gap = Math.min(S.gap[i], effH*0.9);
    var baseZ = bur + gap;
    var topZ = FH;
    var deep = project(i+0.5, 0, topZ).z;
    var fade = Math.max(0, Math.exp(-deep*0.0175));

    // wire strands, top and bottom
    for(var s=0;s<2;s++){
      var wz = s===0 ? topZ-0.06 : baseZ+0.05;
      var a1=project(i,0,wz), a2=project(i+1,0,wz);
      gx.strokeStyle='rgba(107,74,53,'+(0.55*fade).toFixed(3)+')';
      gx.lineWidth=Math.max(0.5, a1.s*0.0022);
      gx.beginPath(); gx.moveTo(a1.x,a1.y); gx.lineTo(a2.x,a2.y); gx.stroke();
    }

    // laths
    for(var k=0;k<LATHS_PER_PANEL;k++){
      if(!S.laths[i*LATHS_PER_PANEL+k]) continue;
      var lx = i + (k+0.5)/LATHS_PER_PANEL;
      var lw = 0.62/LATHS_PER_PANEL;
      var t1=project(lx-lw/2, 0, topZ), t2=project(lx+lw/2, 0, topZ),
          b1=project(lx-lw/2, 0, baseZ), b2=project(lx+lw/2, 0, baseZ);
      // paint held / sandblasted / bare, decided by the lath itself
      var hv = hash(i*263+k*29)%100;
      var col;
      if(hv<14) col=[154,144,134];            // lost the paint entirely
      else col=[140,58,38];                   // weathered oxide red
      var c2 = extinct(col, t1.z);
      gx.fillStyle=css(c2, 0.94*fade+0.06);
      gx.beginPath();
      gx.moveTo(t1.x,t1.y); gx.lineTo(t2.x,t2.y); gx.lineTo(b2.x,b2.y); gx.lineTo(b1.x,b1.y);
      gx.closePath(); gx.fill();

      // sandblasted band at exactly saltation height, and nowhere else
      var sbTop = Math.min(topZ, bur+0.16), sbBot = Math.max(baseZ, bur+0.01);
      if(sbTop>sbBot && hv>=14){
        var q1=project(lx-lw/2,0,sbTop), q2=project(lx+lw/2,0,sbTop),
            q3=project(lx+lw/2,0,sbBot), q4=project(lx-lw/2,0,sbBot);
        var cb = extinct([181,143,128], t1.z);
        gx.fillStyle=css(cb, 0.9*fade);
        gx.beginPath(); gx.moveTo(q1.x,q1.y); gx.lineTo(q2.x,q2.y);
        gx.lineTo(q3.x,q3.y); gx.lineTo(q4.x,q4.y); gx.closePath(); gx.fill();
      }
    }

    // steel T-posts every 2.4 m, with punched studs
    if(i%2===0){
      var px = i;
      var pt=project(px,0,FH+0.12), pb=project(px,0,bur-0.05);
      var pc = extinct([85,86,79], pt.z);
      gx.strokeStyle=css(pc, 0.9*fade+0.1);
      gx.lineWidth=Math.max(0.9, pt.s*0.006);
      gx.beginPath(); gx.moveTo(pt.x,pt.y); gx.lineTo(pb.x,pb.y); gx.stroke();
      // punched studs
      gx.fillStyle=css(pc, 0.65*fade);
      for(var st=0; st<7; st++){
        var zz = bur + (st/7)*(FH-bur);
        if(zz>FH) break;
        var sp2=project(px,0,zz);
        gx.fillRect(sp2.x-Math.max(0.6,sp2.s*0.004), sp2.y, Math.max(1.2,sp2.s*0.008), Math.max(0.8,sp2.s*0.003));
      }
      // rusted twist-wire tie
      gx.strokeStyle='rgba(107,74,53,'+(0.7*fade)+')';
      gx.lineWidth=Math.max(0.6,pt.s*0.0026);
      var ty=project(px,0,FH-0.10);
      gx.beginPath(); gx.arc(ty.x, ty.y, Math.max(1,ty.s*0.005), 0, 6.283); gx.stroke();
    }

    // three orange reflector tabs, hundred feet apart. nowhere else on the page.
    if(i===30||i===61||i===92){
      var rz3 = Math.max(bur+0.1, FH-0.22);
      var r1p=project(i+0.4,0,rz3), r2p=project(i+0.75,0,rz3+0.20);
      gx.fillStyle='rgba(255,90,31,'+(0.95*fade).toFixed(3)+')';
      gx.fillRect(Math.min(r1p.x,r2p.x), Math.min(r1p.y,r2p.y),
                  Math.abs(r2p.x-r1p.x)+1, Math.abs(r2p.y-r1p.y)+1);
    }
  }
}

function drawBale(){
  var bz = groundAt(BALE_I, BALE_J*DY);
  var cxp = project(BALE_I, BALE_J*DY, bz + BALE_R*(1-BALE_BURY));
  if(cxp.x < -200 || cxp.x > W+200) return;
  var rad = BALE_R*cxp.s*0.58;
  if(rad<1) return;
  // solid cylinder, no porosity, no bottom gap
  var g2 = gx.createLinearGradient(cxp.x, cxp.y-rad, cxp.x, cxp.y+rad);
  var top = extinct([196,186,158], cxp.z), bot = extinct([120,112,96], cxp.z);
  g2.addColorStop(0, css(top)); g2.addColorStop(0.62, css([ (top[0]+bot[0])/2,(top[1]+bot[1])/2,(top[2]+bot[2])/2 ]));
  g2.addColorStop(1, css(bot));
  gx.fillStyle=g2;
  gx.beginPath();
  gx.ellipse(cxp.x, cxp.y, rad*1.06, rad*0.86, 0, Math.PI*0.02, Math.PI*1.02, false);
  gx.closePath(); gx.fill();
  // snow packed onto its windward shoulder
  gx.fillStyle=css(extinct([230,236,239], cxp.z), 0.7);
  gx.beginPath();
  gx.ellipse(cxp.x-rad*0.22, cxp.y-rad*0.34, rad*0.66, rad*0.28, -0.22, 0, 6.283);
  gx.fill();
  // one strip of orange baling twine
  gx.strokeStyle='rgba(255,90,31,0.82)';
  gx.lineWidth=Math.max(0.8, rad*0.045);
  gx.beginPath();
  gx.ellipse(cxp.x+rad*0.08, cxp.y-rad*0.02, rad*0.30, rad*0.80, 0.04, Math.PI*0.10, Math.PI*0.95);
  gx.stroke();
}

function drawStreamers(){
  var t = perfT*0.001;
  gx.save();
  for(var s=0;s<26;s++){
    var lane = ((s*7.3 + t*3.2) % (NY*DY));
    var fx0 = cam.x - 30 + ((s*13.7 + t*11)% 62);
    var gh = groundAt(fx0, lane);
    var p0 = project(fx0, lane, gh+0.02);
    var p1 = project(fx0+ 7 + 4*Math.sin(s+t), lane + 0.7*Math.sin(t*1.3+s), gh+0.05);
    if(p0.z>34) continue;
    var a = 0.10*Math.exp(-p0.z*0.03)*(0.4+0.6*Math.abs(Math.sin(t*0.7+s)));
    gx.strokeStyle='rgba(238,242,244,'+a.toFixed(3)+')';
    gx.lineWidth=Math.max(1, p0.s*0.010);
    gx.beginPath();
    gx.moveTo(p0.x,p0.y);
    gx.quadraticCurveTo((p0.x+p1.x)/2, (p0.y+p1.y)/2 - p0.s*0.010, p1.x, p1.y);
    gx.stroke();
  }
  gx.restore();
}

function drawTruck(){
  // road grade at the bottom of frame, SETBACK metres downwind
  var p = truck.p;
  var fx = cam.x - 70 + p*140;
  var pr = project(fx, SETBACK, groundAt(Math.max(0,Math.min(NX-1,fx)), SETBACK)+0.9);
  if(pr.x<-260||pr.x>W+260) return;
  var w = Math.max(6, pr.s*0.10), h2=Math.max(3, pr.s*0.045);
  var col = extinct([96,98,94], pr.z);
  gx.fillStyle=css(col, 0.55);
  gx.fillRect(pr.x-w/2, pr.y-h2, w, h2);
  gx.fillStyle=css(extinct([120,124,124], pr.z), 0.45);
  gx.fillRect(pr.x-w/2, pr.y-h2*1.55, w*0.36, h2*0.6);
  // the snow it kicks up
  for(var k2=0;k2<26;k2++){
    var dx = -Math.random()*w*3.2, dy=-Math.random()*h2*2.4;
    gx.fillStyle='rgba(236,240,242,'+(0.14*Math.random()).toFixed(3)+')';
    gx.fillRect(pr.x+dx, pr.y+dy, 2, 1.4);
  }
}

/* ---------------- grain advection ---------------- */
function stepGrains(dt){
  var u = wind.inst;
  for(var q=0;q<GN;q++){
    var fx=gr[q*5], fy=gr[q*5+1], fz=gr[q*5+2];
    var sm = shearAt(fx,fy);
    // wind crosses the frame left to right at a slight angle
    var vx = u*0.42*sm*(0.6+fz*3.4);
    var vy = u*0.055*sm*Math.cos(wind.dir);
    fx += vx*dt; fy += vy*dt;
    fz += gr[q*5+3]*dt*0.9 - 3.2*dt*fz;
    if(fz<0.004){ fz = 0.004 + Math.random()*0.02; gr[q*5+3] = 0.35+Math.random()*1.0*sm; }
    if(fz>0.20){ fz=0.20; gr[q*5+3]*=-0.3; }
    if(fx>NX){ fx-=NX; }
    if(fx<0){ fx+=NX; }
    if(fy>NY*DY){ fy -= NY*DY; }
    if(fy<0) fy += NY*DY;
    // grains lose energy over a low-shear cell: they land
    if(sm<0.34 && Math.random()<dt*2.4){ fx = cam.x-34+Math.random()*68; fy=Math.random()*4; fz=0.01; }
    gr[q*5]=fx; gr[q*5+1]=fy; gr[q*5+2]=fz;
  }
  for(q=0;q<SUS;q++){
    var sx=su[q*4], sy=su[q*4+1], sz=su[q*4+2];
    sx += u*0.30*dt*(0.5+sz*0.20);
    sy += u*0.04*dt;
    sz += (0.35*Math.sin(perfT*0.001+q) - 0.10)*dt;    // settling velocity vs turbulence
    if(sz<0.15){ sz=0.15+Math.random()*0.4; }
    if(sz>4.2) sz=4.2;
    if(sx>NX) sx-=NX; if(sx<0) sx+=NX;
    if(sy>NY*DY) sy-=NY*DY;
    su[q*4]=sx; su[q*4+1]=sy; su[q*4+2]=sz;
  }
}

/* ---------------- input ---------------- */
var drag = null;
function pick(px,py){
  // which lath is under the pointer, if any
  var best=null, bd=1e9;
  var i0=Math.max(0,Math.floor(cam.x-34)), i1=Math.min(NX-1,Math.ceil(cam.x+34));
  for(var i=i0;i<=i1;i++){
    var bur=burialDepth(i), effH=Math.max(0,FH-bur);
    if(effH<=0.02) continue;
    var gap=Math.min(S.gap[i], effH*0.9);
    for(var k=0;k<LATHS_PER_PANEL;k++){
      var lx=i+(k+0.5)/LATHS_PER_PANEL;
      var pT=project(lx,0,FH), pB=project(lx,0,bur+gap);
      var cx=(pT.x+pB.x)/2, cy=(pT.y+pB.y)/2;
      var hw = Math.max(4, pT.s*0.004), hh=Math.abs(pT.y-pB.y)/2+4;
      if(Math.abs(px-cx)<hw+3 && Math.abs(py-cy)<hh){
        var d=Math.abs(px-cx)+Math.abs(py-cy)*0.05;
        if(d<bd){ bd=d; best={i:i,k:k, filled:!!S.laths[i*LATHS_PER_PANEL+k]}; }
      }
    }
  }
  return best;
}

function down(e){
  initAudio();
  if(A && A.state==='suspended') A.resume();
  var r=cv.getBoundingClientRect();
  var px=(e.clientX||0)-r.left, py=(e.clientY||0)-r.top;
  drag = {x0:px, y0:py, px:px, py:py, camX0:cam.x, moved:0, lath:pick(px,py), gap0:null};
  if(drag.lath) drag.gap0 = S.gap[drag.lath.i];
  cv.setPointerCapture && e.pointerId!==undefined && cv.setPointerCapture(e.pointerId);
}
function move(e){
  if(!drag) return;
  var r=cv.getBoundingClientRect();
  var px=(e.clientX||0)-r.left, py=(e.clientY||0)-r.top;
  var dx=px-drag.px, dy=py-drag.py;
  drag.moved += Math.abs(dx)+Math.abs(dy);
  drag.px=px; drag.py=py;
  if(drag.lath && Math.abs(py-drag.y0) > Math.abs(px-drag.x0)*1.25 && Math.abs(py-drag.y0)>8){
    // dragging the wire panel vertically on its posts: changes the bottom gap
    var dg = -(py-drag.y0)/H * FH * 1.5;
    var target = Math.max(0.0, Math.min(FH*0.42, drag.gap0 + dg));
    var span = 9;
    for(var i=Math.max(0,drag.lath.i-span); i<=Math.min(NX-1,drag.lath.i+span); i++){
      var w = 1 - Math.abs(i-drag.lath.i)/(span+1);
      S.gap[i] = S.gap[i]*(1-w) + target*w;
    }
    drag.isGap = true;
    solveFlow();
    if(A && Math.random()<0.25) noiseHit(0.045, 190+Math.random()*140, 0.07);
  } else if(!drag.isGap) {
    // walking along the fence line
    cam.x = drag.camX0 - (px-drag.x0)/W * 52;
    cam.x = Math.max(16, Math.min(NX-16, cam.x));
  }
}
function up(e){
  if(!drag) return;
  if(drag.moved<9 && drag.lath && !drag.isGap){
    var n = drag.lath.i*LATHS_PER_PANEL + drag.lath.k;
    S.laths[n] = S.laths[n] ? 0 : 1;         // pulled out, or pushed back in
    solveFlow();
    if(A) noiseHit(S.laths[n]?0.075:0.10, S.laths[n]?520:900, S.laths[n]?0.10:0.16);
  }
  drag=null; save();
}
cv.addEventListener('pointerdown', down);
window.addEventListener('pointermove', move);
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', function(){drag=null;});
window.addEventListener('blur', function(){ save(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

/* ---------------- loop ---------------- */
var perfT = 0, lastT = 0, physAcc = 0, saveAcc = 0, solveAcc = 0;
function frame(ts){
  if(!lastT) lastT = ts;
  var dt = Math.min(0.05, (ts-lastT)/1000);
  lastT = ts; perfT = ts;

  updateWind(dt, ts*0.001);
  stepGrains(dt);
  updateAudio(dt);
  updateTruck(dt);

  // the drift keeps building whether or not anybody touches a lath.
  // one wall-clock second is about ninety seconds of blow.
  physAcc += dt;
  if(physAcc > 0.14){
    stepTransport(physAcc*0.025);   // hours of wind per physics step
    physAcc = 0;
  }
  solveAcc += dt;
  if(solveAcc > 0.9){ solveFlow(); solveAcc = 0; }
  saveAcc += dt;
  if(saveAcc > 12){ save(); saveAcc = 0; }

  draw();
  requestAnimationFrame(frame);
}
resize();
solveFlow();
requestAnimationFrame(frame);

/* the fence was paced off in October at thirty times its height.
   the drift runs out at about thirty-five. the engine only computes
   where the tail lands; it does not have an opinion about it. */
})();
</script>
