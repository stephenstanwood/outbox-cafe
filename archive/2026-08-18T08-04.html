  <meta name="twitter:image" content="https://ct21rptue7ejhsay.public.blob.vercel-storage.com/thumbs/2026-08-18T08-04.webp">
  <meta name="outbox-spec-era" content="1991, right now — twenty to five on a wet Wednesday afternoon in the returns aisle of a wallpaper-and-paint warehouse in Vantaa, Finland, where a single fluorescent tube has been strobing at the wrong frequency for eleven days and the man sent to change it has instead been standing under it for a quarter of an hour reading the same shelf label over and over because the flicker keeps interrupting his eye. Not a look-back at anything and not a lament for anything — the tube is above him, the ladder is in the van, and the shelf label says something different every time the light comes back on.">
  <meta name="outbox-spec-format" content="THE PAGE IS A SHELF LABEL THAT REWRITES ITSELF EVERY TIME THE LIGHT BLINKS, AND THE LIGHT IS NOT UNDER YOUR CONTROL. The whole viewport, edge to edge, is one printed warehouse shelf-edge ticket seen at life size and dead-on from about forty centimetres away: a plastic C-rail, a strip of continuous-feed dot-matrix paper torn along both perforations, product code, description line, price per roll, and a barcode. That is the entire page — no header, no menu, no scroll, no cursor affordance, no button, nothing else in frame. A real fluorescent flicker engine runs the room: irregular dropouts, a long dim brown-out where the label is barely legible, a hard restrike, a strobe run of eight or ten fast cycles. On EVERY single restrike, one field of the label is different — the description, or the price, or one digit of the code, or the number of bars in the barcode — and it never changes back. The visitor cannot touch the label, cannot pause the flicker, cannot slow it, and cannot make it change; the only thing the pointer can do anywhere on the page is hold still, and holding perfectly still for long enough makes the flicker WORSE, not better. Nothing scrolls. Nothing is ever explained. The label just keeps arriving slightly different out of the dark.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of why a failing fluorescent tube flickers the way it does and what that does to reading — that a fluorescent lamp is not a filament and has no thermal inertia at all, so unlike a bulb it goes genuinely dark between half-cycles and always has, at twice the mains frequency, which is 100 Hz in Finland and is invisible only because the phosphor coating keeps glowing for a few milliseconds after the arc stops; that when the phosphor ages the persistence drops and the 100 Hz starts becoming visible as a shimmer at the edge of vision rather than as flashing, because peripheral vision has a higher flicker fusion threshold than the fovea, which is exactly why a bad tube looks steady when you stare at it and crawls when you look away; that a tube at end of life fails at the CATHODES first — the emissive coating sputters off the filament ends, which is why the blackening always appears as two dark bands a few centimetres in from each end and never in the middle; that once a cathode can no longer emit freely the lamp needs a higher striking voltage than the ballast can reliably supply, so it strikes, runs, drops out, and the glow-bottle starter closes again to preheat, giving the classic slow blink-blink-blink cycle at a couple of seconds' period rather than any fast strobe; that a cold room makes this worse for real, because mercury vapour pressure inside the tube is set by the temperature of the coldest spot on the glass, and at five degrees a tube that works fine in summer simply will not hold an arc; that a magnetic ballast running a dying tube draws more current, runs hot, and buzzes at 50 Hz in the fitting, which is a different sound from the arc itself; that the eye's own response makes all this harder to read than it should be — saccades take about thirty milliseconds and land four or five times a second, so a lamp dropping out on an irregular interval will reliably go dark mid-saccade and the reader will genuinely lose their place several times a minute without knowing why; that this is not eye strain in the fatigue sense but a real interruption of fixation, and it is why people misread digits under bad fluorescent light and why warehouse pickers key in wrong product codes under it; and the flat arithmetic that a 36-watt tube is rated 12,000 hours, this fitting runs 14 hours a day, and it went in in November 1988.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no explanation, no voice. The label speaks only in the flat printed language of stock control — product codes, description lines in clipped Finnish-warehouse abbreviation with occasional English, prices in markkaa per roll, a batch letter — and the piece's register lives entirely in the DRIFT of that language under the flicker, which is patient, ordinary, unbothered and completely uninsistent: descriptions gradually get less like wallpaper and more like other things, prices creep and then correct themselves, the batch letter walks the alphabet, one digit of the code stubbornly refuses to change all afternoon. Nothing is ever emphasised. Nothing is ever pointed at. The label is not haunted, not sinister, not sad, not clever — it is a piece of continuous-feed paper in a plastic rail in a lit aisle at twenty to five, doing what it does. Explicitly NOT eerie, NOT ominous, NOT dreamlike, NOT mysterious, NOT wistful, NOT knowing, NOT winking.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Continuous-feed dot-matrix paper in a cool machine white (#f2f2ec) with its tractor-feed perforation strips a shade greyer (#dcdcd2) and one pale green bar-stripe across the description block (#cfe0c8), printed in a nine-pin ribbon black that is honestly starved and grey down the right-hand third (#2a2a28 fading to #6f6f6a), the individual pin dots visible and slightly overlapping. The plastic C-rail is a yellowed warehouse ivory (#d6cfae). Every single one of these colours is multiplied per-frame by the live lamp state: at full strike everything reads flat and hard, in the brown-out phase the whole page shifts toward a sick green-grey (#8e968a) with the black going muddy, and in the dark half-cycle it drops to a near-black with a faint phosphor afterglow (#161a15) that decays honestly over a few milliseconds rather than snapping off. Exactly one chip of ballast-warning orange (#c86a1c) is held strictly for the batch letter block and the one digit that never changes. No glow, no bloom, no gradients except the honest ribbon starvation and the honest phosphor decay.">
  <meta name="outbox-spec-wildcard" content="The third digit of the product code is a 4 and never changes — every other digit re-rolls freely across the whole session, sometimes several times, but that one digit is a 4 at page load and is a 4 an hour later, and it is rendered in the ballast-orange while every other digit is ribbon-black. Nothing on the page remarks on it, nothing explains it, and it is the same digit in the same position every visit.">
  <meta name="outbox-spec-forbidden" content="NO flickering-light-as-metaphor for memory / instability / a mind coming apart / 'the world rewriting itself' / reality glitching / unreliable perception — it is a sputtered cathode, a starter cycle, and phosphor persistence, and it has nothing to teach anybody. ABSOLUTELY NO liminal-space, backrooms, uncanny-empty-retail, dead-mall, analog-horror, SCP, ARG, cursed-object, or 'something is wrong here' register of any kind — nothing is wrong, a tube is at end of life and a man is going to get the ladder. NO glitch aesthetic, NO datamosh, NO VHS tracking lines, NO corrupted-file visual language, NO vaporwave. NO nostalgia, NO wistfulness, NO 'the big warehouses killed the paint shops' decline narrative, NO Nordic-melancholy, NO Finnish-silence-and-birch-forest lyricism, NO winter-darkness-of-the-soul. NO ominous countdown, NO sense that the changes are building toward anything — they are not, and the piece must never imply otherwise. NO sensuous material writing about light, paper or plastic beyond frequency, decay time, opacity and legibility. NO retail-drudgery sermon and no aren't-warehouses-bleak commentary. NO archival / museum / cabinet / drawer / relic framing of the label. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is twenty to five in the afternoon and the aisle is lit and open. NO signal / transmission / frequency / broadcast framing of the flicker or the hum, despite the piece being literally about a frequency. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<!--
  36 W / T8. 12 000 h nimellinen. Fitting asennettu 11/1988.
  14 h/vrk. Kylmin kohta lasissa n. 5 °C. Kuristin surisee 50 Hz:llä.
  Katodipäät mustuneet n. 4 cm sisään molemmista päistä.
  Tikkaat ovat pakettiautossa.
-->

<script>
(function(){
"use strict";

/* ---------- paper geometry: tractor holes ---------- */
function fillHoles(el){
  var n = Math.max(6, Math.round(el.clientHeight/22));
  el.innerHTML="";
  for(var i=0;i<n;i++){var d=document.createElement("div");d.className="hole";el.appendChild(d);}
}

/* ---------- LAMP: a real end-of-life fluorescent model ---------- */
var lamp = {
  mains: 50,               // Hz, Finland
  ripple: 100,             // Hz, twice mains
  phosphor: 0.62,          // persistence 0..1 — ages down over the session
  emission: 0.55,          // cathode emissive coating remaining 0..1
  roomTemp: 8.4,           // °C in the returns aisle, drifting down
  arcOn: true,
  starterClosed: false,
  preheatUntil: 0,
  nextStrike: 0,
  striking: false,
  current: 1.0,            // ballast current draw multiplier
  afterglow: 0,            // decaying phosphor light after arc stop
  level: 1,
  restrikes: 0,
  failedStrikes: 0,
  t0: performance.now()
};

function requiredStrikeVolts(){
  // colder glass = lower mercury vapour pressure = harder to strike
  var tempTerm = (18 - lamp.roomTemp) * 7.5;
  var emTerm = (1 - lamp.emission) * 320;
  return 180 + tempTerm + emTerm + (Math.random()*38 - 12);
}
function availableBallastVolts(){
  return 402 - (1 - lamp.emission)*40 + Math.sin(performance.now()/9000)*9;
}

/* ---------- LABEL FIELDS ---------- */
// wildcard: index 2 of the code is a 4, always.
var codeDigits = [7,1,4,0,6,2,9];
function rollCode(){
  var i;
  do { i = Math.floor(Math.random()*codeDigits.length); } while (i===2);
  var old = codeDigits[i], nu;
  do { nu = Math.floor(Math.random()*10); } while (nu===old);
  codeDigits[i]=nu;
}

var descSets = [
  // set 0 — plain wallpaper stock control
  ["TAPETTI","VINYYLITAPETTI","POHJAPAPERI","KUITUTAPETTI","PAPERITAPETTI"],
  // set 1 — widening: finishes, borders
  ["TAPETTI","REUNANAUHA","BORDER 10 CM","LASIKUITU","MAALATTAVA","STRUKTUURI"],
  // set 2 — wider still: adjacent warehouse goods
  ["POHJUSTE","LIISTERI","SEINÄPINTA","LATTIALISTA","PEITELISTA","SUOJAPAPERI","TIIVISTE"],
  // set 3 — things a warehouse holds that are not wall coverings
  ["SUODATINKANGAS","HIHNA 25 MM","VERKKO 4 MM","HARSO","SIDEKANGAS","VAIJERI","PUTKI T8"],
  // set 4 — wider yet
  ["LOISTEPUTKI 36W","SYTYTIN FS-2","KURISTIN 36W","PÄÄTYHOLKKI","LIITIN 2-NAP","VASTUS 4R7"],
  // set 5 — plainly other
  ["KATTOPAPERI","SADEKOURU 100","PEITE 4x5 M","HIEKKA 25 KG","KUMILISTA","TIKASOSA 3 M"]
];
var qualifiers = ["PESUNKEST.","VALKOINEN","LUONNONVALK.","HARMAA 04","VIHERTÄVÄ","KUVIOTON",
  "MATTA","PUOLIKIILTO","KELTAINEN 12","SININEN 31","RUSKEA 07","POLTETTU","LEIKKAAMATON",
  "VARASTOSSA","PALAUTUS","MYYNTIERÄ","TARKASTAMATON","VAJAA","EI KOODIA","JÄÄNNÖSERÄ"];
var suffixes = ["/ ROLL","/ RLL","/ M","/ KPL","/ PKT","/ JM","/ NIP"];
var descWidth = 0;          // grows with restrikes
var desc1 = "TAPETTI PESUNKEST.";
var desc2 = "VALKOINEN 53 CM / ROLL · VARASTO 8-4";

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function rollDesc(){
  descWidth = Math.min(descSets.length-1, Math.floor(lamp.restrikes/9));
  var set = descSets[Math.min(descWidth, descSets.length-1)];
  // occasionally reach one set further, briefly
  if(Math.random()<0.18) set = descSets[Math.min(descSets.length-1, descWidth+1)];
  desc1 = pick(set)+" "+pick(qualifiers);
  desc2 = pick(qualifiers)+" "+repeatCm+" CM "+pick(suffixes)+" · VARASTO 8-4";
}
var repeatCm = 53;
function rollRepeat(){
  var steps=[32,45,50,53,53,53,56,64,70,75,88,106];
  var nu; do{ nu=pick(steps);}while(nu===repeatCm);
  repeatCm=nu;
}

var priceMk = 84.50;
function rollPrice(){
  var r = Math.random();
  if(r<0.30){ priceMk = priceMk + (Math.random()*7+0.5); }        // creep up
  else if(r<0.52){ priceMk = Math.max(6, priceMk - (Math.random()*9+0.5)); }
  else if(r<0.66){ priceMk = Math.round(priceMk); }               // correction to round
  else if(r<0.80){ priceMk = Math.round(priceMk/5)*5 - 0.10; }    // to a .90 price point
  else { priceMk = [29.90,44.50,58.00,67.50,84.50,91.00,112.00,138.50,7.20][Math.floor(Math.random()*9)]; }
  priceMk = Math.round(priceMk*100)/100;
  if(priceMk<1) priceMk = 12.40;
}
function alvLine(){
  var netto = priceMk/1.22;
  return "VEROTON "+netto.toFixed(2).replace(".",",")+"  ALV 22% "+(priceMk-netto).toFixed(2).replace(".",",");
}

var batchIdx = 0;
var alphabet = "ABCDEFGHIJKLMNOPQRSTUVXYZÅÄÖ";
function rollBatch(){ batchIdx = (batchIdx + 1) % alphabet.length; }

var extraBars = 0;
function rollBars(){ extraBars = Math.max(0, Math.min(9, extraBars + (Math.random()<0.6?1:-1))); }

var locLines = ["KÄYTÄVÄ 8 · HYLLY 4 · PALAUTUS","KÄYTÄVÄ 8 · HYLLY 4 · ALAHYLLY",
  "KÄYTÄVÄ 8 · HYLLY 4 · TARK.","KÄYTÄVÄ 8 · PÄÄTY · PALAUTUS","KÄYTÄVÄ 8 · HYLLY 4 · VAJAA"];
var locIdx = 0;
function rollLoc(){ locIdx = (locIdx+1)%locLines.length; }

var tinyLines = ["VARASTOERÄ","VARASTOERÄ · EI VAIHTOA","VARASTOERÄ · TARK. 04","PALAUTUSERÄ",
  "VARASTOERÄ · P. 555-PEPR","VARASTOERÄ · VAJAA RLL","VARASTOERÄ · SIIRTO 8-4"];
var tinyIdx = 0;
function rollTiny(){ tinyIdx=(tinyIdx+1)%tinyLines.length; }

var stampVals = ["VA-1991","VA-1991/11","VA-1991 K","VA-1991 R2","VA-1991 · 88","VA-1991 T8"];
var stampIdx=0;
function rollStamp(){ stampIdx=(stampIdx+1)%stampVals.length; }

var fields = [
  {w:22, f:rollCode},
  {w:24, f:rollDesc},
  {w:18, f:rollPrice},
  {w:9,  f:rollRepeat},
  {w:8,  f:rollBatch},
  {w:7,  f:rollBars},
  {w:5,  f:rollLoc},
  {w:4,  f:rollTiny},
  {w:3,  f:rollStamp}
];
var totalW = fields.reduce(function(s,f){return s+f.w;},0);
function driftOnce(){
  var r = Math.random()*totalW, acc=0;
  for(var i=0;i<fields.length;i++){ acc+=fields[i].w; if(r<acc){ fields[i].f(); return; } }
  fields[0].f();
}

/* ---------- BARCODE (honest: encoded from the code digits) ---------- */
var cv = document.getElementById("barcanvas");
var cx = cv.getContext("2d");
// simple 2-of-5-ish widths per digit, plus a modulo-10 check digit
var patterns = ["11221","21112","12112","22111","11212","21211","12211","11122","21121","12121"];
function checkDigit(d){
  var s=0;
  for(var i=0;i<d.length;i++){ s += d[i] * ((i%2===0)?3:1); }
  return (10 - (s%10))%10;
}
function drawBarcode(){
  var digits = codeDigits.slice();
  digits.push(checkDigit(digits));
  var units=[];
  units.push([1,1],[1,0],[1,1],[1,0]); // start
  for(var i=0;i<digits.length;i++){
    var p = patterns[digits[i]];
    for(var j=0;j<5;j++){
      units.push([parseInt(p[j],10), j%2===0?1:0]);
    }
  }
  for(var k=0;k<extraBars;k++){ units.push([1,1],[1,0]); }
  units.push([2,1],[1,0],[1,1]); // stop
  var total=0; units.forEach(function(u){total+=u[0];});
  var w = cv.width, h = cv.height;
  var scale = w/total;
  cx.clearRect(0,0,w,h);
  var x=0;
  for(var m=0;m<units.length;m++){
    var uw = units[m][0]*scale;
    if(units[m][1]===1){
      // ribbon starvation: bars on the right print thinner/greyer
      var frac = x/w;
      var starve = frac>0.62 ? (frac-0.62)/0.38 : 0;
      cx.fillStyle = barInk(starve);
      cx.fillRect(Math.round(x), 0, Math.max(1, Math.round(uw*(1-starve*0.22))), h);
    }
    x+=uw;
  }
  document.getElementById("barnum").textContent = digits.join("");
}
var curInkRGB=[42,42,40];
function barInk(starve){
  var r=Math.round(curInkRGB[0]+(111-curInkRGB[0])*starve);
  var g=Math.round(curInkRGB[1]+(111-curInkRGB[1])*starve);
  var b=Math.round(curInkRGB[2]+(106-curInkRGB[2])*starve);
  return "rgb("+r+","+g+","+b+")";
}

/* ---------- RENDER ---------- */
var codeEl=document.getElementById("code");
function renderLabel(){
  var html="";
  for(var i=0;i<codeDigits.length;i++){
    if(i===3) html+='<span class="starved" style="letter-spacing:0">-</span>';
    html += '<span class="'+(i===2?"orange":"")+'">'+codeDigits[i]+'</span>';
  }
  codeEl.innerHTML=html;
  document.getElementById("desc1").textContent=desc1;
  document.getElementById("desc2").textContent=desc2;
  document.getElementById("spec").innerHTML =
    "TOISTO "+repeatCm+" CM<br>LEVEYS 53 CM · PIT. 10,05 M<br>ERÄ "+alphabet[batchIdx]+" · SIIRTO 8-4";
  document.getElementById("price").textContent = priceMk.toFixed(2).replace(".",",");
  document.getElementById("alv").textContent = alvLine();
  document.getElementById("batch").textContent = alphabet[batchIdx];
  document.getElementById("loc").textContent = locLines[locIdx];
  document.getElementById("tinyline").textContent = tinyLines[tinyIdx];
  document.getElementById("stamp").textContent = stampVals[stampIdx];
  drawBarcode();
}

/* ---------- COLOUR: everything multiplied per-frame by lamp level ---------- */
var root=document.documentElement;
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
function css(c){return "rgb("+c[0]+","+c[1]+","+c[2]+")";}
var DARK=[22,26,21], BROWN=[142,150,138];
function applyLevel(L){
  // L: 0 (dark, phosphor afterglow only) .. 1 (full strike)
  var t = Math.min(1, Math.max(0, L));
  var toBrown = Math.min(1, t/0.55);
  var toFull = t<0.55 ? 0 : (t-0.55)/0.45;
  function shade(full){
    var a = mix(DARK, BROWN, toBrown*0.92);
    return mix(a, full, toFull);
  }
  var paper = shade([242,242,236]);
  var perf  = shade([220,220,210]);
  var rail  = shade([214,207,174]);
  var bar   = shade([207,224,200]);
  // ink goes muddy in brown-out: it approaches the paper colour rather than staying black
  var inkFull=[42,42,40], ink2Full=[111,111,106];
  var ink = mix(mix(DARK,[96,104,94],toBrown), inkFull, toFull);
  var ink2 = mix(mix(DARK,[112,120,110],toBrown), ink2Full, toFull);
  var warn = mix(mix(DARK,[120,104,72],toBrown), [200,106,28], toFull);
  curInkRGB = ink;
  root.style.setProperty("--paper",css(paper));
  root.style.setProperty("--perf",css(perf));
  root.style.setProperty("--perfDot",css(shade([185,185,174])));
  root.style.setProperty("--hole",css(mix(DARK,[22,26,21],1)));
  root.style.setProperty("--rail",css(rail));
  root.style.setProperty("--railTop",css(shade([200,192,160])));
  root.style.setProperty("--railLip",css(shade([189,181,149])));
  root.style.setProperty("--bar",css(bar));
  root.style.setProperty("--ink",css(ink));
  root.style.setProperty("--ink2",css(ink2));
  root.style.setProperty("--warn",css(warn));
  document.getElementById("starve").style.background =
    "linear-gradient(to right, rgba("+paper[0]+","+paper[1]+","+paper[2]+",0) 58%, rgba("+paper[0]+","+paper[1]+","+paper[2]+",.40) 100%)";
  document.getElementById("dots").style.opacity = (0.22+0.36*t).toFixed(3);
  document.getElementById("room").style.background =
    "rgb("+Math.round(11+ t*10)+","+Math.round(13+t*11)+","+Math.round(10+t*9)+")";
  document.querySelector("footer").style.color = css(ink2);
}

/* ---------- AUDIO ---------- */
var A=null, hum=null, humGain=null, harm=[], hiss=null, hissGain=null, rainGain=null, master=null;
function initAudio(){
  if(A) return;
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C) return;
  try{ A = new C(); }catch(e){ return; }
  master = A.createGain(); master.gain.value=0.5; master.connect(A.destination);

  // 50 Hz magnetic ballast hum + harmonics
  humGain = A.createGain(); humGain.gain.value=0.0; humGain.connect(master);
  hum = A.createOscillator(); hum.type="sine"; hum.frequency.value=50;
  var hg=A.createGain(); hg.gain.value=0.55; hum.connect(hg); hg.connect(humGain); hum.start();
  [100,150,200,250,350].forEach(function(f,i){
    var o=A.createOscillator(); o.type= i%2? "square":"triangle"; o.frequency.value=f;
    var g=A.createGain(); g.gain.value=0.16/(i+1.4);
    o.connect(g); g.connect(humGain); o.start(); harm.push([o,g]);
  });

  // arc hiss, gated to arc state
  var bufN = A.sampleRate*2;
  var nb = A.createBuffer(1,bufN,A.sampleRate);
  var nd = nb.getChannelData(0);
  for(var i=0;i<bufN;i++) nd[i]=Math.random()*2-1;
  var noise=A.createBufferSource(); noise.buffer=nb; noise.loop=true;
  var bp=A.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3400; bp.Q.value=0.7;
  hissGain=A.createGain(); hissGain.gain.value=0;
  noise.connect(bp); bp.connect(hissGain); hissGain.connect(master); noise.start();

  // rain on a metal roof, far behind, constant
  var rn=A.createBufferSource(); rn.buffer=nb; rn.loop=true;
  var lp=A.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500;
  var hp=A.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=320;
  rainGain=A.createGain(); rainGain.gain.value=0.030;
  rn.connect(hp); hp.connect(lp); lp.connect(rainGain); rainGain.connect(master); rn.start();
}
function tick(hard){
  if(!A) return;
  var t=A.currentTime;
  var o=A.createOscillator(); o.type="square"; o.frequency.setValueAtTime(hard?1900:1200,t);
  o.frequency.exponentialRampToValueAtTime(140,t+0.035);
  var g=A.createGain();
  g.gain.setValueAtTime(hard?0.10:0.055,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.07);
}
["pointerdown","keydown","pointermove","touchstart"].forEach(function(ev){
  window.addEventListener(ev, function once(){ initAudio(); if(A&&A.state==="suspended") A.resume(); },{once:true,passive:true});
});

/* ---------- POINTER: stillness only ---------- */
var lastPX=null,lastPY=null, motionAccum=0, stillSince=performance.now(), lastNudge=0;
window.addEventListener("pointermove",function(e){
  if(lastPX!==null){
    motionAccum += Math.abs(e.clientX-lastPX)+Math.abs(e.clientY-lastPY);
  }
  lastPX=e.clientX; lastPY=e.clientY;
},{passive:true});
window.addEventListener("touchmove",function(e){
  var t=e.touches[0]; if(!t) return;
  if(lastPX!==null) motionAccum += Math.abs(t.clientX-lastPX)+Math.abs(t.clientY-lastPY);
  lastPX=t.clientX; lastPY=t.clientY;
},{passive:true});

/* ---------- MAIN LOOP ---------- */
var lastFrame=performance.now(), motionWindow=performance.now();
function frame(now){
  var dt=(now-lastFrame)/1000; lastFrame=now;
  if(dt>0.25) dt=0.25;
  var elapsed=(now-lamp.t0)/1000;

  // slow ageing
  lamp.phosphor = Math.max(0.16, 0.62 - elapsed*0.00085);
  lamp.emission = Math.max(0.06, lamp.emission - dt*0.00075);
  lamp.roomTemp = Math.max(4.2, 8.4 - elapsed*0.0022);

  // pointer stillness integrator, evaluated once a second
  if(now-motionWindow>1000){
    var perSec = motionAccum; motionAccum=0; motionWindow=now;
    if(perSec < 6){
      if(now-stillSince>4000 && now-lastNudge>1000){
        lamp.emission = Math.max(0.05, lamp.emission - 0.012);
        lastNudge=now;
      }
    } else {
      stillSince=now;
    }
  }

  // starter / arc state machine
  if(lamp.arcOn){
    // dropout probability rises as emission falls and glass cools
    var instability = (1-lamp.emission)*(1 + (12-lamp.roomTemp)*0.06);
    if(Math.random() < instability*dt*0.75){
      lamp.arcOn=false;
      lamp.starterClosed=true;
      lamp.preheatUntil = now + (1200 + Math.random()*1200);
      lamp.afterglow = lamp.level;
    }
  } else {
    if(lamp.starterClosed && now>lamp.preheatUntil){
      lamp.starterClosed=false;
      tick(true);
      var need=requiredStrikeVolts(), have=availableBallastVolts();
      if(need<=have){
        lamp.arcOn=true; lamp.restrikes++;
        driftOnce(); renderLabel();
      }else{
        lamp.failedStrikes++;
        lamp.starterClosed=true;
        lamp.preheatUntil = now + (700 + Math.random()*900);
      }
    }
  }

  // light level
  var L;
  if(lamp.arcOn){
    var phase = (now/1000)*lamp.ripple*2*Math.PI;
    var depth = 0.10 + (0.62-lamp.phosphor)*1.05;      // less persistence = deeper 100 Hz ripple
    depth = Math.min(0.72, depth);
    var ripple = 1 - depth*(0.5-0.5*Math.cos(phase));
    // brown-out: emerges when required strike volts hover near available
    var margin = availableBallastVolts() - (180 + (18-lamp.roomTemp)*7.5 + (1-lamp.emission)*320);
    var brown = margin < 60 ? Math.max(0.30, Math.min(1, margin/60)) : 1;
    // strobe runs emerge when emission is low: partial re-ignition per half-cycle
    var strobe = 1;
    if(lamp.emission<0.34){
      var s = Math.sin(phase*0.5 + Math.sin(now/430)*3);
      if(s<-(1-(0.34-lamp.emission)*4)) strobe = 0.22;
    }
    L = ripple*brown*strobe;
    lamp.afterglow = L;
    lamp.current = 1 + (1-lamp.emission)*0.9;
  } else {
    // honest phosphor decay: a few ms of afterglow, then near-black
    var tau = 0.004 + lamp.phosphor*0.012;
    lamp.afterglow *= Math.exp(-dt/tau);
    L = lamp.afterglow;
    lamp.current = lamp.starterClosed ? 1.9 : 0.15;
  }
  lamp.level=L;
  applyLevel(L);

  if(A){
    var target = 0.010 + lamp.current*0.017 + (1-lamp.emission)*0.012;
    humGain.gain.value += (target - humGain.gain.value)*Math.min(1,dt*6);
    hissGain.gain.value += (((lamp.arcOn? 0.012*(0.5+L*0.5) : 0)) - hissGain.gain.value)*Math.min(1,dt*14);
    if(hum) hum.detune.value = Math.sin(now/5100)*4;
  }
  requestAnimationFrame(frame);
}

/* ---------- BOOT ---------- */
function boot(){
  fillHoles(document.getElementById("tl"));
  fillHoles(document.getElementById("tr"));
  // canvas at device scale
  var b=document.getElementById("barcanvas");
  b.width = 380; b.height = 60;
  renderLabel();
  requestAnimationFrame(frame);
}
window.addEventListener("resize",function(){
  fillHoles(document.getElementById("tl"));
  fillHoles(document.getElementById("tr"));
});
boot();
