  <meta name="outbox-spec-era" content="Right now — twenty to twelve on a glaring August midday over the parish square at Mqabba, Malta, with the daytime shells going up off the ground battery behind the limestone belfry: no darkness anywhere, forty degrees of sun straight overhead, and colour arriving in the sky as SMOKE rather than as light. Not a festa travelogue, not an outsider's wonder at a foreign festival, and not a look-back at anything — the ground battery is loaded, the midday firing has eleven minutes left in it, and the sky over the square is already getting dirty.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one rectangle of hard cobalt Maltese midday sky, with the cut top corner of a limestone belfry and a strip of flat roof parapet along the very bottom edge and NOTHING else: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The visitor's whole vocabulary is one mortar sat just out of frame at the bottom: press and HOLD anywhere along the lower edge to build lift charge (the mortar's muzzle visibly loads and the hold is felt in the pitch of the launch), drag left or right while holding to tilt the tube, release to fire. A shell climbs on real ballistics trailing a thin grey lift-smoke tail, the time fuse burns on its own honest clock regardless of how high the shell actually got, and then the piece IS the break: a sphere of colour opening in daylight, expanding, shearing, going buoyant, sagging, and dirtying the air it hangs in. Fire fast and the sky fills up with overlapping smoke that never goes away.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of making colour appear in a daylight sky — that a night shell is useless at noon because incandescence cannot out-glare the sun, so a daytime shell contains no stars at all but pellets of an organic dye packed round a cool-burning fuel, and the colour is dye VAPORISED and then re-condensed into airborne particulate, which means the pellet must burn cool or the dye chars and every colour on the shell comes out the same brown-black; that daylight colour is therefore particle density and not brightness, and a thin puff reads as grey no matter what dye is in it; that the break must be packed symmetrically round the burster or the sphere opens lopsided and reads as a smear, which is why the pellets go in in concentric layers and the burster goes dead centre; that the break diameter is set by burster charge and the pellets' burn time, not by shell size, so a small shell with a hot burster throws a wide thin ring and a big one with a soft burster makes a tight dense ball; that the time fuse is lit by the lift charge and burns on its own clock, so a weak lift means the shell breaks low and hard and a strong one means it breaks going down; that smoke is buoyant only while hot and starts sinking within seconds of the pellet burning out, which is why a break rises, stalls, and then sags into a hanging curtain; that wind is not one wind but a shear — near-still at the parapet and moving at height, so the top of a break drifts off the bottom of it and a sphere becomes a leaning ellipse inside ten seconds; that smoke colour composites SUBTRACTIVELY in air, so magenta drifting through chrome yellow gives a dirty orange and three colours crossing gives brown, never a fourth bright hue; that the sky over a battery therefore gets measurably filthier all morning and the last shell of a firing is never seen as clean as the first; and the flat arithmetic that light travels the distance instantly and sound does not, so the gap between seeing the break and hearing it is the height of the break divided by three hundred and forty. Literally dye, a burster, hot particulate, buoyancy, and a shear.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the sky, and that register is LOUD, CONCUSSIVE, GLARING and INCREASINGLY FILTHY — flat overhead sun with no shadow modelling in it, whitewashed limestone blowing out at the edges, hard chalky smoke that opens fast and then hangs there sagging and going brown, one crack arriving late after each break and slapping off the belfry a half-beat after that. Everything happens at working speed with a battery still loaded. Explicitly NOT hushed, NOT awed, NOT dreamlike, NOT slow, NOT twinkling, NOT wistful, NOT a spectacle to be marvelled at — this is midday over a working square and the air is getting used up.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Hard scoured cobalt midday sky (#1f5fb4) paling toward a bleached white-blue at the horizon strip (#a9c9e4) and blown-out sun-struck limestone (#efe6d3) with its shaded parapet face in a warm bone-grey (#c4b699) — those two are the whole ground of the piece. The dye smokes are chalky and opaque rather than luminous: festa magenta (#d2247a), chrome yellow (#e8b21c) and a flat viridian (#1c7a63), all composited subtractively so crossings resolve into dirty orange and a real brown-black (#4a3626) and never into a brighter colour. Exactly one chip of grey lift-smoke (#8f8b82) is held strictly for the climb trail and for the permanent haze layer. Flat, hard, high-contrast, no glow, no bloom, no lens flare, no soft edges anywhere — pigment particulate in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="Exactly one shell per visit — always the fourth one fired, every visit, no matter how it is loaded — is a dud. It climbs normally, the lift smoke reads normally, the fuse time elapses, and then nothing happens: no break, no report, no colour. The shell simply arcs over as a small dark speck, falls, and goes out of frame past the parapet. Nothing on the page marks it, no sound accompanies it, it is never explained, and the fifth shell fires exactly as normal.">
  <meta name="outbox-spec-forbidden" content="NO fireworks-as-metaphor for ephemerality / celebration / joy / 'the beautiful thing that doesn't last' / childhood summer / the-brief-bright-life — it is dye, a burster, hot particulate and a wind shear, and it has nothing to teach anybody. NO awe, NO wonder, NO gasping crowd, NO 'oohs', NO hush-before-the-bang, NO upturned faces. NO night sky of any kind, NO darkness, NO sparkle, NO twinkle, NO glow, NO bloom, NO lens flare — it is noon and nothing in this piece is luminous. NO Mediterranean travelogue, NO exoticising or explaining a Maltese festa to an outsider, NO religious-procession reverence, NO village-characters colour writing. NO nostalgia, NO wistfulness, and NO 'the old pyrotechnicians / nobody makes daytime shells anymore / the factories keep blowing up' decline narrative — the battery is loaded and the midday firing is running. NO danger-porn or disaster foreshadowing about the powder. NO meditative / hypnotic / 'watch the smoke drift and let your mind empty' register — the sky is being wrecked, not soothed. NO sensuous material description of smoke or colour beyond density, hue, buoyancy and how it composites. NO cryptic-SCP or ominous dread about the dud shell. NO archival / museum / cabinet / drawer / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice. NO signal / transmission / frequency / broadcast framing of the reports. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the sky, the belfry corner, the parapet and the smoke, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<title>Eleven Minutes Left on the Midday Battery</title>
<!--
  daylight shell, working notes:
  no stars. a cool-burning fuel with dye pellets packed round the burster in
  concentric layers. the dye is vaporised and re-condensed as particulate.
  burn it hot and every colour comes out the same brown-black.
  colour here is density, not brightness. a thin puff is grey whatever is in it.
  break diameter = burster charge x pellet burn time. shell size sets load, not width.
  fuse is lit by the lift and burns 4.4 s whatever the shell does.
  smoke is buoyant only while hot. then it sags.
  wind at the parapet is not the wind at ninety metres.
  seen instantly, heard at height/340.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#1f5fb4;overflow:hidden;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;}
  a.spk{position:fixed;right:10px;bottom:9px;width:9px;height:9px;background:#4a3626;
    opacity:.34;display:block;z-index:5;transition:opacity .3s;box-shadow:0 1px 0 rgba(255,253,246,.5);}
  a.spk:hover,a.spk:focus{opacity:.85;outline:none;}
</style>

<body>
<canvas id="sky"></canvas>
<a class="spk" href="/archive" aria-label="the rest of the firing"></a>
<script>
(function(){
"use strict";
var cv=document.getElementById('sky'), g2=cv.getContext('2d');
var W=0,H=0,DPR=1,parapetY=0,PPM=1,capH=8;
var NX=1,NY=1,CW=1,CH=1;
var dens=[],tmpF=[],tp=null,tpT=null,vu=null,vv=null,img=null,gcv=null,gctx=null;
var skyGrad=null;

/* ---- dye absorbance per unit density, per rgb channel ---- */
var ABS=[[0.194,1.960,0.738],   /* festa magenta */
         [0.094,0.360,2.210],   /* chrome yellow */
         [2.210,0.738,0.947],   /* flat viridian */
         [0.578,0.607,0.673]];  /* lift smoke grey */
var haze=[0.045,0.055,0.028,0.105];
try{var vs=parseInt(localStorage.getItem('mq_firing')||'0',10)||0;
    localStorage.setItem('mq_firing',String(vs+1));
    var add=Math.min(vs,6)*0.012; haze[0]+=add;haze[1]+=add;haze[3]+=add*1.4;}catch(e){}

var WIND0=0.35, SHEAR=0.055, BUOY=6.4, SETTLE=0.78, DISS=0.9973, HAZEG=1.15e-4;
var K_ALPHA=1.15, DYE_RATE=5.2, FUSE=4.4, GRAV=9.81;

/* ------------------------------------------------------------------ grid */
function alloc(nx,ny){
  var old=dens.length?{n:NX,m:NY,d:dens}:null;
  NX=nx;NY=ny;CW=W/NX;CH=H/NY;
  var n=nx*ny,f;
  dens=[];tmpF=[];
  for(f=0;f<4;f++){dens.push(new Float32Array(n));tmpF.push(new Float32Array(n));}
  tp=new Float32Array(n);tpT=new Float32Array(n);
  vu=new Float32Array(n);vv=new Float32Array(n);
  gcv=document.createElement('canvas');gcv.width=nx;gcv.height=ny;
  gctx=gcv.getContext('2d');img=gctx.createImageData(nx,ny);
  if(old){ /* carry the sky over a resize; it is never cleared */
    for(var j=0;j<ny;j++){var oj=Math.min(old.m-1,Math.floor(j*old.m/ny));
      for(var i=0;i<nx;i++){var oi=Math.min(old.n-1,Math.floor(i*old.n/nx));
        for(f=0;f<4;f++)dens[f][j*nx+i]=old.d[f][oj*old.n+oi];}}
  } else seedMorning();
}
function seedMorning(){ /* two smears left over from earlier in the firing */
  for(var s=0;s<2;s++){
    var cx=W*(0.28+0.4*Math.random()), cy=H*(0.14+0.22*Math.random());
    var rx=W*0.16+W*0.1*Math.random(), ry=H*0.05;
    for(var k=0;k<260;k++){
      var a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());
      splat(cx+Math.cos(a)*rx*r, cy+Math.sin(a)*ry*r, s?1:0, 0.05, 0);
      splat(cx+Math.cos(a)*rx*r*1.1+18, cy+Math.sin(a)*ry*r, 3, 0.035, 0);
    }
  }
}
function splat(px,py,f,amt,temp){
  var gx=px/CW-0.5, gy=py/CH-0.5;
  var i0=Math.floor(gx), j0=Math.floor(gy), fx=gx-i0, fy=gy-j0;
  for(var a=0;a<2;a++)for(var b=0;b<2;b++){
    var i=i0+a,j=j0+b; if(i<0||j<0||i>=NX||j>=NY)continue;
    var w=(a?fx:1-fx)*(b?fy:1-fy), idx=j*NX+i;
    dens[f][idx]+=amt*w;
    if(temp>0){var t=tp[idx]+(temp-tp[idx])*w*0.85; tp[idx]=t>tp[idx]?t:tp[idx];}
  }
}
function sample(a,x,y){
  if(x<0)x=0; else if(x>NX-1.001)x=NX-1.001;
  if(y<0)y=0; else if(y>NY-1.001)y=NY-1.001;
  var i=x|0,j=y|0,fx=x-i,fy=y-j,k=j*NX+i;
  var s0=a[k]+(a[k+1]-a[k])*fx, k2=k+NX;
  var s1=a[k2]+(a[k2+1]-a[k2])*fx;
  return s0+(s1-s0)*fy;
}
var simT=0;
function sim(dt){
  simT+=dt;
  var i,j,idx;
  for(j=0;j<NY;j++){
    var y=(j+0.5)*CH, alt=(parapetY-y)/PPM; if(alt<0)alt=0;
    var base=(WIND0+SHEAR*alt)*PPM;
    for(i=0;i<NX;i++){
      idx=j*NX+i;var T=tp[idx];
      var u=base+5.5*Math.sin(y*0.016+simT*0.33+i*0.021);
      var v=-(BUOY*T)*PPM+(SETTLE*PPM)*(1-(T>1?1:T));
      v+=4.0*Math.sin((i+0.5)*CW*0.019-simT*0.47);
      vu[idx]=u;vv[idx]=v;
    }
  }
  var f;
  for(f=0;f<4;f++){
    var src=dens[f],dst=tmpF[f];
    for(j=0;j<NY;j++)for(i=0;i<NX;i++){
      idx=j*NX+i;
      dst[idx]=sample(src,i-vu[idx]*dt/CW,j-vv[idx]*dt/CH);
    }
    dens[f]=dst;tmpF[f]=src;
  }
  for(j=0;j<NY;j++)for(i=0;i<NX;i++){
    idx=j*NX+i;
    tpT[idx]=sample(tp,i-vu[idx]*dt/CW,j-vv[idx]*dt/CH);
  }
  var sw=tp;tp=tpT;tpT=sw;
  var cool=Math.exp(-dt/1.5);
  for(i=0;i<tp.length;i++)tp[i]*=cool;
  /* light diffusion, dissipation, and the dissipated part folded into haze */
  var kb=0.11;
  for(f=0;f<4;f++){
    var a=dens[f],b=tmpF[f],lost=0;
    for(j=0;j<NY;j++)for(i=0;i<NX;i++){
      idx=j*NX+i;
      var l=i>0?a[idx-1]:a[idx], r=i<NX-1?a[idx+1]:a[idx];
      var d=j>0?a[idx-NX]:a[idx], up=j<NY-1?a[idx+NX]:a[idx];
      var val=(a[idx]*(1-kb)+(l+r+d+up)*kb*0.25)*DISS;
      if(i<2||j<2||i>NX-3||j>NY-3)val*=0.87;
      lost+=a[idx]-val;
      b[idx]=val;
    }
    dens[f]=b;tmpF[f]=a;
    haze[f]+=lost*HAZEG; if(haze[f]>0.95)haze[f]=0.95;
  }
}

/* ------------------------------------------------------------- ballistics */
var shells=[],pellets=[],casings=[],shellCount=0,rattleBudget=0;
function fire(charge,tilt){
  shellCount++;
  var dud=(shellCount===4);
  var m=muzzle(charge,tilt);
  var spd=16+charge*27;
  var s={
    x:(m.x-W*0.5)/PPM, y:(parapetY-m.y)/PPM,
    vx:Math.sin(tilt)*spd, vy:Math.cos(tilt)*spd,
    fuse:FUSE, dud:dud,
    load:0.75+Math.random()*0.6,
    burster:0.68+Math.random()*0.72,
    burn:0.72+Math.random()*0.98,
    cin:(Math.random()*3)|0, cout:(Math.random()*3)|0
  };
  if(Math.random()<0.35)s.cout=s.cin;
  shells.push(s);
  for(var k=0;k<14;k++){
    var a=Math.random()*Math.PI*2,r=Math.random()*9;
    splat(m.x+Math.cos(a)*r,m.y+Math.sin(a)*r,3,0.42,0.75);
  }
  thump(charge);
  var names=['magenta','chrome yellow','viridian'];
  console.log('shell '+shellCount+' \u00b7 lift '+(spd).toFixed(1)+' m/s \u00b7 tilt '+
    (tilt*57.3).toFixed(0)+'\u00b0 \u00b7 fuse '+FUSE.toFixed(1)+' s \u00b7 burster '+
    s.burster.toFixed(2)+' \u00b7 pellet burn '+s.burn.toFixed(2)+' s \u00b7 outer '+
    names[s.cout]+' / inner '+names[s.cin]);
}
function breakShell(s){
  var n=60+((Math.random()*31)|0);
  var base=19*s.burster;
  var px=W*0.5+s.x*PPM, py=parapetY-s.y*PPM;
  rattleBudget=7;
  for(var i=0;i<n;i++){
    /* uniform on a sphere, projected: the limb comes out dense, as it should */
    var u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=Math.sqrt(1-u*u);
    var inner=(i%2===0);
    var sp=base*(inner?0.60:1.0)*(0.9+Math.random()*0.2);
    pellets.push({
      x:s.x, y:s.y,
      vx:r*Math.cos(th)*sp, vy:r*Math.sin(th)*sp,
      t:s.burn*(0.82+Math.random()*0.36),
      c:inner?s.cin:s.cout,
      rate:DYE_RATE*s.load*(0.8+Math.random()*0.4),
      dark:false
    });
  }
  var dist=Math.sqrt(s.x*s.x+s.y*s.y+900)+22;
  report(dist, 0.55+s.burster*0.4);
}
function stepBodies(dt){
  var i,s;
  for(i=shells.length-1;i>=0;i--){
    s=shells[i];
    var v=Math.hypot(s.vx,s.vy), k=0.0012;
    s.vx+=-k*v*s.vx*dt; s.vy+=(-GRAV-k*v*s.vy)*dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.fuse-=dt;
    if(s.fuse>0) splat(W*0.5+s.x*PPM, parapetY-s.y*PPM, 3, 1.5*dt, 0.55);
    if(!s.dud && (s.fuse<=0 || (s.y<=0.5 && s.vy<0))){ breakShell(s); shells.splice(i,1); continue; }
    if(s.y< -14 || Math.abs(s.x)*PPM>W*1.4){ shells.splice(i,1); }
  }
  for(i=pellets.length-1;i>=0;i--){
    var p=pellets[i], pv=Math.hypot(p.vx,p.vy);
    var kd=p.dark?0.028:0.078;
    p.vx+=-kd*pv*p.vx*dt; p.vy+=(-GRAV-kd*pv*p.vy)*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(!p.dark){
      splat(W*0.5+p.x*PPM, parapetY-p.y*PPM, p.c, p.rate*dt, 1.0);
      p.t-=dt; if(p.t<=0)p.dark=true;
    }else if(p.y<=0){
      if(casings.length<420) casings.push({x:W*0.5+p.x*PPM, w:1+((Math.random()*2)|0)});
      if(rattleBudget>0 && Math.random()<0.45){rattleBudget--;rattle();}
      pellets.splice(i,1);continue;
    }
    if(Math.abs(p.x)*PPM>W*1.5 || p.y<-6) pellets.splice(i,1);
  }
}

/* ------------------------------------------------------------------ audio */
var AC=null,NB=null;
function ac(){
  if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    AC=new C();
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function noiseHit(t,gain,lpType,lpFreq,q,dur){
  var a=AC.createBufferSource();a.buffer=NB;
  a.playbackRate.value=0.8+Math.random()*0.4;
  var f=AC.createBiquadFilter();f.type=lpType;f.frequency.value=lpFreq;f.Q.value=q;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  a.connect(f);f.connect(g);g.connect(AC.destination);
  a.start(t,Math.random()*1.5);a.stop(t+dur+0.05);
}
function thump(ch){
  var c=ac();if(!c)return;var t=c.currentTime+0.01;
  noiseHit(t,0.26+ch*0.22,'lowpass',210+(1-ch)*260,0.8,0.13+ch*0.09);
  var o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(96-ch*44,t);
  o.frequency.exponentialRampToValueAtTime(38,t+0.16+ch*0.1);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.30+ch*0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.20+ch*0.12);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.4);
}
function report(distM,pow){
  var c=ac();if(!c)return;
  var t=c.currentTime+distM/340;              /* light is free, sound is not */
  var att=Math.min(1,60/distM);
  noiseHit(t,0.55*pow*att,'lowpass',430,0.7,0.34);
  noiseHit(t,0.30*pow*att,'highpass',1700,0.6,0.05);
  var o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(74,t);
  o.frequency.exponentialRampToValueAtTime(31,t+0.28);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45*pow*att,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.5);
  noiseHit(t+0.052,0.24*pow*att,'bandpass',1150,1.1,0.17);   /* off the belfry */
  noiseHit(t+0.118,0.11*pow*att,'bandpass',780,1.4,0.13);    /* off the far side */
}
function rattle(){
  var c=ac();if(!c)return;
  var t=c.currentTime+0.02+Math.random()*0.5;
  noiseHit(t,0.045+Math.random()*0.04,'highpass',2600,0.7,0.03);
}

/* ----------------------------------------------------------------- inputs */
var charging=false,chargeT=0,tilt=0,pressX=0,everFired=false,idle=0;
function chargeVal(){var c=chargeT/1.55;return c>1?1:c;}
function muzzle(ch,tl){
  var px=W*0.5, py=H-4;
  var L=(H-4-parapetY)+34+ch*26;
  return {x:px+Math.sin(tl)*L, y:py-Math.cos(tl)*L, px:px, py:py, L:L};
}
function down(e){
  if(e.target&&e.target.tagName==='A')return;
  e.preventDefault();ac();
  charging=true;chargeT=0;
  pressX=(e.touches?e.touches[0].clientX:e.clientX);
  everFired=true;
}
function move(e){
  if(!charging)return;e.preventDefault();
  var x=(e.touches?e.touches[0].clientX:e.clientX);
  var t=(x-pressX)/(W*0.5)*0.85;
  tilt=Math.max(-0.62,Math.min(0.62,t));
}
function up(e){
  if(!charging)return;
  if(e&&e.preventDefault)e.preventDefault();
  charging=false;fire(chargeVal(),tilt);chargeT=0;
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});
window.addEventListener('touchcancel',up,{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!charging){e.preventDefault();ac();charging=true;chargeT=0;everFired=true;}
  if(e.code==='ArrowLeft')tilt=Math.max(-0.62,tilt-0.06);
  if(e.code==='ArrowRight')tilt=Math.min(0.62,tilt+0.06);
});
window.addEventListener('keyup',function(e){if(e.code==='Space'&&charging){e.preventDefault();up();}});

/* ------------------------------------------------------------------ paint */
function makeSky(){
  skyGrad=g2.createLinearGradient(0,0,0,parapetY+capH);
  skyGrad.addColorStop(0,'#1a54a6');
  skyGrad.addColorStop(0.42,'#1f5fb4');
  skyGrad.addColorStop(0.82,'#6f9ccd');
  skyGrad.addColorStop(1,'#a9c9e4');
}
function drawBelfry(){
  var bw=Math.max(104,Math.min(W*0.27,250));
  var bx=W-bw;
  var h1=H*0.105, cor=H*0.036, h2=h1+cor;
  g2.fillStyle='#efe6d3';
  g2.beginPath();
  g2.moveTo(bx+22,h1);g2.lineTo(bx+22,H*0.048);g2.lineTo(bx+44,0);g2.lineTo(W,0);g2.lineTo(W,h1);
  g2.closePath();g2.fill();
  g2.fillStyle='#e2d6bd';g2.fillRect(bx+22,H*0.048,9,h1-H*0.048);
  g2.fillStyle='#f7f2e6';g2.fillRect(bx,h1,bw,cor*0.62);
  g2.fillStyle='#e6dcc4';g2.fillRect(bx,h1+cor*0.62,bw,cor*0.38);
  g2.fillStyle='#c4b699';g2.fillRect(bx,h2,bw,3);
  g2.fillStyle='#efe6d3';g2.fillRect(bx+11,h2+3,bw-11,parapetY-h2);
  g2.fillStyle='#e2d6bd';g2.fillRect(bx+11,h2+3,11,parapetY-h2);
  var ax=bx+bw*0.36, aw=bw*0.46, ay=h2+H*0.075, ah=H*0.20;
  g2.fillStyle='#4a3626';
  g2.beginPath();
  g2.moveTo(ax,ay+ah);g2.lineTo(ax,ay+aw*0.5);
  g2.arc(ax+aw*0.5,ay+aw*0.5,aw*0.5,Math.PI,0);
  g2.lineTo(ax+aw,ay+ah);g2.closePath();g2.fill();
  g2.fillStyle='#6a5a44';
  g2.beginPath();
  g2.moveTo(ax+aw*0.30,ay+aw*0.42);g2.lineTo(ax+aw*0.70,ay+aw*0.42);
  g2.lineTo(ax+aw*0.62,ay+aw*0.95);g2.lineTo(ax+aw*0.38,ay+aw*0.95);g2.closePath();g2.fill();
  g2.fillStyle='#c4b699';g2.fillRect(ax-4,ay+ah,aw+8,5);
  var sc=parapetY-H*0.10;
  g2.fillStyle='#f7f2e6';g2.fillRect(bx+11,sc,bw-11,6);
  g2.fillStyle='#c4b699';g2.fillRect(bx+11,sc+6,bw-11,2);
  g2.fillStyle='#fffdf6';g2.fillRect(bx+11,h2+3,2,parapetY-h2);
  g2.fillRect(bx,h1,bw,2);
  g2.fillStyle='#b8a98a';g2.fillRect(bx+bw*0.80,sc+8,4,H*0.035);
}
function drawSmoke(){
  var d=img.data,n=NX*NY,p=0,f;
  var d0=dens[0],d1=dens[1],d2=dens[2],d3=dens[3];
  for(var k=0;k<n;k++,p+=4){
    var a=d0[k],b=d1[k],c=d2[k],e=d3[k];
    var tot=a+b+c+e;
    if(tot<0.012){d[p+3]=0;continue;}
    var ar=a*0.194+b*0.094+c*2.210+e*0.578;
    var ag=a*1.960+b*0.360+c*0.738+e*0.607;
    var ab=a*0.738+b*2.210+c*0.947+e*0.673;
    var al=1-Math.exp(-K_ALPHA*tot);
    d[p]  =252*Math.exp(-ar);
    d[p+1]=247*Math.exp(-ag);
    d[p+2]=238*Math.exp(-ab);
    d[p+3]=al*255;
  }
  gctx.putImageData(img,0,0);
  g2.imageSmoothingEnabled=true;
  if(g2.imageSmoothingQuality)g2.imageSmoothingQuality='medium';
  g2.drawImage(gcv,0,0,W,H);
}
function drawHaze(){
  var tot=haze[0]+haze[1]+haze[2]+haze[3];
  if(tot<0.01)return;
  var ar=haze[0]*0.194+haze[1]*0.094+haze[2]*2.210+haze[3]*0.578;
  var ag=haze[0]*1.960+haze[1]*0.360+haze[2]*0.738+haze[3]*0.607;
  var ab=haze[0]*0.738+haze[1]*2.210+haze[2]*0.947+haze[3]*0.673;
  var r=(252*Math.exp(-ar))|0,g=(247*Math.exp(-ag))|0,b=(238*Math.exp(-ab))|0;
  var al=Math.min(0.52,1-Math.exp(-1.5*tot));
  var gr=g2.createLinearGradient(0,0,0,parapetY);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+','+(al*0.62).toFixed(3)+')');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+','+(al*1.25).toFixed(3)+')');
  g2.fillStyle=gr;g2.fillRect(0,0,W,parapetY+capH);
}
function drawParapet(){
  g2.fillStyle='#c4b699';g2.fillRect(0,parapetY,W,H-parapetY);
  g2.fillStyle='#efe6d3';g2.fillRect(0,parapetY,W,capH);
  g2.fillStyle='#fffdf6';g2.fillRect(0,parapetY,W,2);
  g2.fillStyle='#b8a98a';
  for(var x=((W*0.5)%94);x<W;x+=94){g2.fillRect(x,parapetY+capH,1.5,H-parapetY-capH);}
  g2.fillRect(0,parapetY+capH,W,1.5);
  g2.fillStyle='#4a3626';
  for(var i=0;i<casings.length;i++){
    var cg=casings[i];
    g2.globalAlpha=0.55;
    g2.fillRect(cg.x,parapetY+1.5+((i*7)%4),cg.w,1.4);
  }
  g2.globalAlpha=1;
}
function drawMortar(){
  var ch=charging?chargeVal():0;
  var m=muzzle(ch,tilt);
  g2.save();
  g2.translate(m.px,m.py);g2.rotate(tilt);
  var jt=charging?Math.sin(performance.now()*0.05)*ch*0.7:0;
  g2.translate(jt,0);
  g2.fillStyle='#2f2a22';g2.fillRect(-9.5,-m.L,19,m.L+12);
  g2.fillStyle='#6b6255';g2.fillRect(-9.5,-m.L,1.6,m.L+12);
  g2.fillStyle='#3d372c';g2.fillRect(-12,-m.L-4,24,8);
  g2.fillStyle='#14110d';
  g2.beginPath();g2.ellipse(0,-m.L-3,9,3.1,0,0,Math.PI*2);g2.fill();
  g2.fillStyle='#8f8b82';g2.globalAlpha=0.25+ch*0.35;
  g2.beginPath();g2.ellipse(0,-m.L-6,4+ch*8,2+ch*4,0,0,Math.PI*2);g2.fill();
  g2.globalAlpha=1;
  g2.restore();
}
function drawBodies(){
  g2.fillStyle='#2c261d';
  var i;
  for(i=0;i<shells.length;i++){
    var s=shells[i],x=W*0.5+s.x*PPM,y=parapetY-s.y*PPM;
    if(y<parapetY)g2.fillRect(x-2,y-2,4,4);
  }
  g2.fillStyle='#3a3026';
  for(i=0;i<pellets.length;i++){
    var p=pellets[i];
    if(!p.dark)continue;
    var px=W*0.5+p.x*PPM,py=parapetY-p.y*PPM;
    if(py<parapetY)g2.fillRect(px,py,1.6,1.6);
  }
}
function paint(){
  g2.fillStyle=skyGrad;g2.fillRect(0,0,W,H);
  drawBelfry();
  drawHaze();
  drawSmoke();
  drawBodies();
  drawParapet();
  drawMortar();
}

/* ------------------------------------------------------------------- loop */
var last=performance.now(),acc=0;
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.1)dt=0.1;
  if(charging){
    chargeT+=dt;
    var m=muzzle(chargeVal(),tilt);
    splat(m.x,m.y-4,3,0.9*dt,0.35);
  }
  if(!everFired){ idle+=dt; if(idle>3.2){ everFired=true; fire(0.62,-0.11); } }
  stepBodies(dt);
  acc+=dt;
  var steps=0;
  while(acc>=1/30 && steps<3){ sim(1/30); acc-=1/30; steps++; }
  if(acc>0.3)acc=0;
  paint();
  requestAnimationFrame(frame);
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  g2.setTransform(DPR,0,0,DPR,0,0);
  parapetY=Math.round(H-Math.max(42,H*0.11));
  capH=Math.max(6,Math.round(H*0.014));
  PPM=H/175;
  var nx=Math.max(48,Math.min(150,Math.round(W/11)));
  var ny=Math.max(34,Math.min(150,Math.round(nx*H/W)));
  alloc(nx,ny);
  makeSky();
}
window.addEventListener('resize',function(){resize();});
resize();
requestAnimationFrame(frame);
})();
</script>
