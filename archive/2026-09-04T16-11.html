  <meta name="outbox-spec-era" content="1962, right now — twenty past eight on a warm evening in a shopping-centre car park outside Tulsa, where a travelling sign shop has erected a brand-new 24-foot animated neon roadside sign for a drive-in restaurant and is running it through its full flasher cycle for the first time with the owner watching from his car. The transformers are cold, the mercury tubes are still coming up to colour, and one letter is out.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless in the sense that no page furniture, caption, header, menu, scrollbar, title or instruction exists anywhere; the only readable characters at any time are the ones physically spelled by the neon tubes themselves. The entire viewport, edge to edge, is the sign seen straight-on from about sixty feet at true angular size against dusk sky: a steel can, a painted panel, a channel-letter word, an animated arrow chase of 31 lamps, a starburst, and roughly 180 individually simulated glass tubes. Each tube is a real gas discharge — argon-mercury or neon, with its own bore diameter, its own electrode pair, its own live current, its own warm-up curve and its own phosphor coating — so colour, brightness and even ignition timing are computed from the physics and never chosen. A motor-driven flasher drum turns behind the sign on its own clock, wiping contacts across circuits in a fixed 9-second program, and the whole animation is whatever that drum does. The visitor's entire vocabulary is a hand at the service door: DRAG on any tube to bend it, which really changes its length and therefore its voltage drop, its current, its brightness and its colour; PRESS AND HOLD a tube to crack it, which vents it, kills it permanently, and drops the load on everything sharing that transformer so the neighbouring letters go noticeably brighter; and DRAG the flasher drum's contact fingers to any new position, which permanently rewrites the animation program. Nothing scrolls. Nothing resets.">
  <meta name="outbox-spec-subject" content="The plain electrical business of a neon sign, and specifically that colour is not paint and brightness is not a dimmer — that a tube is a cold-cathode discharge in which a transformer holds a constant current and the tube takes whatever voltage it needs, so a longer tube is a higher voltage and a shop is limited not by how much glass it wants but by how many feet of a given bore one 60 mA 15,000-volt transformer can strike; that pure neon in clear glass is one colour and one colour only, the red-orange everybody calls neon, and every other colour on every sign in America is argon with a bead of mercury in a tube coated on the inside with phosphor, so a green tube and a blue tube and a pink tube are the same gas doing the same thing behind different powder; that a mercury tube is COLD when it strikes and comes up over about two minutes as the mercury vaporises, running dim and blue-violet at first and only reaching its rated colour and output once the tube wall is warm, which is why a sign switched on at dusk is a different sign at nine o'clock; that ambient temperature therefore matters enormously and a mercury tube on a January night in Oklahoma may never fully come up while the identical tube in July is at full output in forty seconds; that bore diameter sets current density, so a 12 mm tube and an 18 mm tube on the same transformer are running at different loadings and look measurably different side by side even in the same colour; that electrodes are the failure point and always have been — sputtering blackens the glass behind them over years and the darkening is a real record of running hours; that a tube with a slow leak goes progressively pink-violet as air contaminates the fill, and a bad tube announces itself by colour long before it announces itself by dying; that flashing is mechanical and always was, a motor turning a drum with contact fingers riding on it, so the animation's timing is fixed by gearing and can only be changed by physically moving a finger; that a chasing arrow is nothing but three interleaved lamp circuits switched in rotation and the apparent motion is entirely in the eye; that every tube on a circuit shares one transformer's current, so losing one tube in a series run puts the whole run out and losing a parallel branch genuinely raises the brightness of what remains; that a transformer runs hot and a can full of transformers in July is a real thermal problem with a real service-life consequence; that GTO cable is rated for the voltage and cannot be run near grounded metal or it will find the can through the insulation and arc; that humidity on a cold morning condenses on the housing and puts a leakage path across an insulator, which is why a sign that works fine at midnight fails at seven; and the flat arithmetic on the clipboard, which is 186 feet of tubing across nine circuits, four transformers, a 9-second flasher cycle, one dead R in the word, and an owner who wants to know tonight whether it can be lit for the weekend.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no written sentence anywhere — the only characters that ever appear are the ones the tubes themselves spell, and one of them is out for the whole visit. The register lives entirely in the behaviour of the glass, the gas and the flasher drum, and that register is HARD, ELECTRICAL, SLIGHTLY UNEVEN and PLAINLY COMMERCIAL — tubes striking with a real snap and a moment of unstable flicker before they settle, mercury tubes crawling up from a weak violet to their rated colour over minutes, transformers buzzing at line frequency with the buzz changing pitch and level as load changes, the flasher drum clacking through its contacts on a fixed mechanical clock that does not care whether anyone is watching, one circuit visibly running hotter and brighter than its neighbours because it is short by one tube. Nothing waits for the visitor. Nothing performs. Nothing is arranged to be admired. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT a screensaver, NOT nostalgic, NOT romantic, NOT lonely-highway, NOT noir — this is a new sign being tested in a car park at twenty past eight with an owner sitting in his car and one letter to fix.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is dusk sky, a real gradient from a dry warm grey-orange along the bottom edge (#9a7a5e) up through a flat dust-hazed blue (#4b5a6e) to a darker cool top (#2b3444), with the sign's steel can, pole and painted panel as near-silhouette in a flat cold dark (#1e2229) carrying one dull specular streak of remaining daylight along the top rail (#6f7a80). Against that, EVERY TUBE'S COLOUR IS COMPUTED AND NEVER CHOSEN: each tube carries a gas fill, a phosphor coating, a bore diameter, a live current density and a live wall temperature, and its rendered hue, saturation and value fall out of those five numbers alone. So clear-glass neon renders as its true red-orange (#ff4a1c) and never varies; argon-mercury tubes begin at strike as a weak, thin, cold blue-violet (#7d6fb8) at low output and travel honestly over minutes toward their coated colour — cool white (#eaf2ff), signal green (#3cf07a), ruby-coated pink (#ff5c9a), or deep blue (#2f7cff) — with a visible mid-warmup stage where the phosphor is only partly excited and the colour is measurably desaturated and wrong. A tube's rendered glow radius and core brightness come from current density, so a 12 mm tube on the same transformer as an 18 mm genuinely burns tighter and hotter. A tube bent longer drops its current and honestly dims and shifts. Blackened glass near old electrodes reads as a real darkening band. A vented tube goes dead grey glass (#5a5e60). The 31 chase lamps are ordinary incandescent, a warm dirty amber (#ffb64a) with real filament thermal lag so they do not switch instantly and never fully extinguish inside the cycle. Exactly one chip of shop-truck fleet green (#2c5c3a) is held strictly for the service-body panel of the sign truck parked at the bottom left corner of frame and for nothing else on the page. Flat, hard, high contrast, no bloom filters, no lens flare, no soft focus, no gradients other than honest glow falloff, honest phosphor warmup and honest sky.">
  <meta name="outbox-spec-wildcard" content="There is one moth. It arrives about forty seconds into every visit, always from the lower right, and works the sign for the rest of the session — flying the honest spiralling approach of an insect using a light for transverse orientation, settling on warm glass, walking a few centimetres, taking off, and being drawn preferentially to whichever tube is currently brightest, recomputed live. When a tube it is sitting on goes out on the flasher cycle it stays put for a second and then leaves. It never touches the cursor, cannot be caught, cannot be shooed, casts a real small shadow on the painted panel behind it, and is never accounted for by anything on the page. If every tube on the sign is dead it lands on the can and stays there.">
  <meta name="outbox-spec-forbidden" content="NO neon-as-metaphor for anything — not desire, not memory, not the glow of a vanished America, not 'something still burning', not the last light on an empty road; it is 186 feet of tubing across four transformers and it has nothing to teach anybody. ABSOLUTELY NO noir: no rain-slick asphalt, no motel sign buzzing over a lonely man, no Hopper, no Nighthawks, no cigarette, no detective, no femme fatale, no Vegas, no Route 66 mythology, no lonely-highway lyricism, no 'the sign flickered and went out'. NO nostalgia, NO wistfulness, NO 'nobody bends glass anymore / plastic and backlit boxes killed it / the last of the neon shops' decline narrative — this sign is brand new, it went up today, and the owner wants to know about the weekend. NO retro-kitsch, NO camp, NO winking at midcentury Americana, NO diner charm, NO chrome-and-jukebox, NO vaporwave, NO synthwave, NO 80s-neon-grid aesthetic drift of any kind, NO Blade Runner, NO cyberpunk. NO craftsman-sage register, NO 'the old benders could feel the glass go', NO trade mystique, NO reverence for hand skill, NO artisan sermon, NO handmade-versus-manufactured comparison. NO glow lyricism, NO sensuous writing about light, colour or darkness beyond current density, phosphor emission, vapour pressure and falloff. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery or screensaver framing whatsoever. NO danger-porn about high voltage: no dread, no foreshadowed shock, no 'fifteen thousand volts will kill a man' — the voltage is a number in a calculation. NO Oklahoma travelogue and NO explaining a place to anybody: no dust bowl, no big sky, no tornado, no oil money, no Bible Belt, no drawl, no dialect spelling. NO consumerism sermon, NO advertising-as-manipulation critique, NO postwar-optimism framing, NO Cold War drift. NO cryptic-SCP, liminal, backrooms, uncanny, analog-horror or ominous framing of the dead letter, the moth, or the sign running to nobody in a car park — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing — the glass was bent this month and the transformers have never been under load before tonight. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past eight and there is still light in the west. NO signal / transmission / frequency / broadcast framing of any circuit, despite the whole thing being electrical. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<style>

  #arch a{display:block;width:14px;height:14px;text-indent:-999px;overflow:hidden;}
  /* the drum turns on a 1750 rpm motor through 62:1 and a 4:1 chain. nine seconds. */
  /* circuit 6 is short one tube. that is why it looks like that. it is not a mistake in the drawing. */

<body>
<canvas id="stage"></canvas>
<div id="arch"><a href="/archive" title="&nbsp;">archive</a></div>
<script>
(function(){
"use strict";
var C=document.getElementById('stage'),X=C.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;C.width=Math.floor(W*DPR);C.height=Math.floor(H*DPR);C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0);layout();}
window.addEventListener('resize',resize);

/* ---------- persistence ---------- */
var KEY='sign.crestline.42.v1';
var save={cracked:{},bends:{},hours:{},fingers:null,amb:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){save.cracked=p.cracked||{};save.bends=p.bends||{};save.hours=p.hours||{};save.fingers=p.fingers||null;save.amb=(typeof p.amb==='number')?p.amb:null;}}}catch(e){}
var saveTimer=0;
function persist(){if(saveTimer)return;saveTimer=setTimeout(function(){saveTimer=0;try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}},700);}

/* ---------- transformers ---------- */
/* four cans. each holds a constant secondary current; open-circuit volts set the max footage it can strike. */
var XF=[
 {id:0,ma:60,ocv:15000,load:0,heat:26,hum:null},
 {id:1,ma:60,ocv:15000,load:0,heat:26,hum:null},
 {id:2,ma:30,ocv:12000,load:0,heat:26,hum:null},
 {id:3,ma:60,ocv:15000,load:0,heat:26,hum:null}
];

/* ---------- tubes ---------- */
/* bore in mm, developed length computed from polyline in feet at layout scale */
var tubes=[];
var PH={
 none:{name:'clear',r:1.00,g:0.29,b:0.11,eff:1.00},
 white:{name:'4500K',r:0.92,g:0.95,b:1.00,eff:0.80},
 green:{name:'signal green',r:0.24,g:0.94,b:0.48,eff:0.92},
 pink:{name:'ruby',r:1.00,g:0.36,b:0.60,eff:0.72},
 blue:{name:'deep blue',r:0.18,g:0.49,b:1.00,eff:0.55}
};
function mkTube(o){
 var t={
  id:tubes.length,
  pts:o.pts.slice(),
  bore:o.bore||15,
  fill:o.fill||'ar',        // 'ne' clear neon, 'ar' argon-mercury
  ph:o.ph||'none',
  cir:o.cir,
  wall:22,                  // deg C tube wall
  cur:0, volt:0, on:false, lit:0, strike:0, flick:0,
  dead:!!o.dead, vented:false,
  hours:0, sput:0,
  leak:!!o.leak,
  seg:o.seg||null,
  base:null
 };
 tubes.push(t);return t;
}
function plen(pts){var L=0;for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];L+=Math.sqrt(dx*dx+dy*dy);}return L;}
/* geometry is in sign-units; one sign-unit = one inch of real sign. 24 foot sign = 288 units wide. */
function feet(t){return plen(t.pts)/12;}

/* ---------- letterforms in sign units (channel letters, word CRESTLINE) ---------- */
/* origin per glyph, 30 wide, 40 tall box */
function G(ch,x,y,s){
 var P=[];
 function A(a){P.push(a.map(function(p){return [x+p[0]*s,y+p[1]*s];}));}
 var w=22,h=30;
 switch(ch){
  case 'C': A([[w,3],[w*0.55,0],[w*0.15,h*0.18],[0,h*0.5],[w*0.15,h*0.82],[w*0.55,h],[w,h-3]]); break;
  case 'R': A([[0,h],[0,0],[w*0.7,0],[w,h*0.16],[w*0.7,h*0.42],[0,h*0.42]]);
            A([[w*0.5,h*0.42],[w,h]]); break;
  case 'E': A([[w,0],[0,0],[0,h],[w,h]]); A([[0,h*0.5],[w*0.78,h*0.5]]); break;
  case 'S': A([[w,3],[w*0.5,0],[w*0.05,h*0.16],[w*0.35,h*0.42],[w*0.8,h*0.5],[w,h*0.74],[w*0.6,h],[0,h-4]]); break;
  case 'T': A([[w*0.5,0],[w*0.5,h]]); A([[0,0],[w,0]]); break;
  case 'L': A([[0,0],[0,h],[w,h]]); break;
  case 'I': A([[w*0.5,0],[w*0.5,h]]); break;
  case 'N': A([[0,h],[0,0],[w,h],[w,0]]); break;
 }
 return P;
}

/* ---------- sign construction ---------- */
var SW=288, SH=216;  // sign units, 24ft wide
var word='CRESTLINE';
var built=false;
function build(){
 tubes.length=0;
 // circuits: 0..8
 // 0: word letters C R E  (xf0, series)
 // 1: word letters S T L  (xf0, series)
 // 2: word letters I N E  (xf1, series)
 // 3: panel border top+bottom (xf1, parallel two branches)
 // 4: starburst (xf2, parallel spokes)
 // 5: arrow outline (xf3, series)
 // 6: script "EAT" underline short run (xf2)  -- one tube short, runs hot
 // 7: panel border sides (xf1 parallel)
 // 8: skirt band under arrow (xf3)
 var lx=26, ly=54, s=1.55;
 var colours=['white','white','white','green','green','green','pink','pink','pink'];
 var cirmap=[0,0,0,1,1,1,2,2,2];
 for(var i=0;i<9;i++){
  var polys=G(word[i],lx+i*29,ly,s);
  for(var k=0;k<polys.length;k++){
   var t=mkTube({pts:polys[k],bore:15,fill:'ar',ph:colours[i],cir:cirmap[i],seg:'L'+i});
   if(word[i]==='R'&&i===1&&k===0){ t.dead=true; t.vented=true; }
  }
 }
 // panel border: top / bottom (circuit 3), sides (circuit 7) — clear neon
 mkTube({pts:[[10,42],[278,42]],bore:18,fill:'ne',cir:3,seg:'BT'});
 mkTube({pts:[[10,116],[278,116]],bore:18,fill:'ne',cir:3,seg:'BB'});
 mkTube({pts:[[10,42],[10,116]],bore:18,fill:'ne',cir:7,seg:'BL'});
 mkTube({pts:[[278,42],[278,116]],bore:18,fill:'ne',cir:7,seg:'BR'});
 // starburst: eight spokes, argon-mercury blue, 12mm, parallel on xf2
 var cx=244,cy=155;
 for(var a=0;a<8;a++){
  var an=a*Math.PI/4+0.19;
  mkTube({pts:[[cx+Math.cos(an)*8,cy+Math.sin(an)*8],[cx+Math.cos(an)*26,cy+Math.sin(an)*26]],bore:12,fill:'ar',ph:'blue',cir:4,seg:'SB'+a});
 }
 // arrow outline, clear neon, series on xf3
 var ax=18,ay=150;
 mkTube({pts:[[ax,ay],[ax+96,ay]],bore:15,fill:'ne',cir:5,seg:'AR1'});
 mkTube({pts:[[ax+96,ay],[ax+96,ay-16],[ax+134,ay+10],[ax+96,ay+36],[ax+96,ay+20],[ax,ay+20]],bore:15,fill:'ne',cir:5,seg:'AR2'});
 mkTube({pts:[[ax,ay+20],[ax,ay]],bore:15,fill:'ne',cir:5,seg:'AR3'});
 // circuit 6: EAT underline, pink, xf2 — short by one tube, runs hot
 mkTube({pts:[[150,190],[214,190]],bore:12,fill:'ar',ph:'pink',cir:6,seg:'U1'});
 mkTube({pts:[[150,196],[214,196]],bore:12,fill:'ar',ph:'pink',cir:6,seg:'U2'});
 // circuit 8: skirt band under arrow, green
 mkTube({pts:[[14,196],[136,196]],bore:15,fill:'ar',ph:'green',cir:8,seg:'SK'});

 // restore
 for(var j=0;j<tubes.length;j++){
  var tt=tubes[j];
  var kk=tt.seg||('t'+j);
  if(save.bends[kk]) tt.pts=save.bends[kk].map(function(p){return [p[0],p[1]];});
  if(save.cracked[kk]){tt.vented=true;tt.dead=true;}
  if(save.hours[kk]) tt.hours=save.hours[kk];
  tt.base=tt.pts.map(function(p){return [p[0],p[1]];});
 }
 built=true;
}

/* circuit → transformer, and series/parallel */
var CIR=[
 {xf:0,ser:true},{xf:0,ser:true},{xf:1,ser:true},
 {xf:1,ser:false},{xf:2,ser:false},{xf:3,ser:true},
 {xf:2,ser:false},{xf:1,ser:false},{xf:3,ser:false}
];

/* ---------- flasher drum ---------- */
/* motor 1750 rpm through 62:1 then 3.14:1 -> drum at ~9.0 s per revolution */
var DRUM_PERIOD=9.0;
var fingers=[
 // each finger: circuit, angular position (turns 0..1), dwell width (turns)
 {c:0,p:0.00,w:0.30},{c:1,p:0.10,w:0.30},{c:2,p:0.20,w:0.30},
 {c:3,p:0.00,w:0.95},{c:7,p:0.00,w:0.95},
 {c:4,p:0.62,w:0.16},
 {c:5,p:0.00,w:0.44},
 {c:6,p:0.50,w:0.42},
 {c:8,p:0.30,w:0.30}
];
if(save.fingers&&save.fingers.length===fingers.length){for(var fi=0;fi<fingers.length;fi++){fingers[fi].p=save.fingers[fi];}}
var drumAngle=0;
var contactState=[];
var lastContact=[];

/* chase lamps: 31 incandescent, three interleaved circuits */
var lamps=[];
function buildLamps(){
 lamps.length=0;
 var ax=18,ay=150;
 // border of arrow, 31 positions along outline
 var outline=[[ax+2,ay+2],[ax+94,ay+2],[ax+94,ay-14],[ax+130,ay+10],[ax+94,ay+34],[ax+94,ay+18],[ax+2,ay+18]];
 var total=plen(outline), step=total/31, acc=0, seg=0, segd=0;
 for(var i=0;i<31;i++){
  var d=i*step, run=0;
  for(var k=1;k<outline.length;k++){
   var dx=outline[k][0]-outline[k-1][0],dy=outline[k][1]-outline[k-1][1],L=Math.hypot(dx,dy);
   if(run+L>=d){var f=(d-run)/L;lamps.push({x:outline[k-1][0]+dx*f,y:outline[k-1][1]+dy*f,ph:i%3,T:0.02});break;}
   run+=L;
  }
 }
 while(lamps.length<31)lamps.push({x:ax+2,y:ay+2,ph:lamps.length%3,T:0.02});
}

/* ---------- physics ---------- */
var ambient = (save.amb!==null?save.amb:29.5);   // deg C, warm evening, falls slowly
var t0=performance.now()/1000, tPrev=t0, elapsed=0;

function tubeVolts(t){
 // rough cold-cathode: ~ 220 V per foot at 15mm/60mA, scaled by bore, plus ~450 V electrode drop
 var f=feet(t);
 var boreF = 15/t.bore;              // narrower bore = higher gradient
 var gasF = (t.fill==='ne')?1.0:0.86;
 return 450 + f*215*boreF*gasF;
}
function solveCircuits(dt){
 for(var i=0;i<XF.length;i++)XF[i].load=0;
 for(var c=0;c<CIR.length;c++){
  var cd=CIR[c], xf=XF[cd.xf];
  var mem=[];
  for(var i=0;i<tubes.length;i++)if(tubes[i].cir===c)mem.push(tubes[i]);
  var energ=contactState[c];
  if(cd.ser){
   var alive=true,V=0;
   for(var i=0;i<mem.length;i++){ if(mem[i].vented){alive=false;} else V+=tubeVolts(mem[i]); }
   var can = alive && V <= xf.ocv*0.92 && energ;
   for(var i=0;i<mem.length;i++){
    var t=mem[i];
    t.on = can && !t.vented;
    t.volt = t.on?tubeVolts(t):0;
    t.cur = t.on?xf.ma:0;
   }
   if(can) xf.load += V*xf.ma/1000;
  }else{
   // parallel branches: each tube its own branch, transformer current splits
   var live=[];
   for(var i=0;i<mem.length;i++){ var t=mem[i]; if(!t.vented && tubeVolts(t)<=xf.ocv*0.92) live.push(t); }
   var n=live.length;
   for(var i=0;i<mem.length;i++){mem[i].on=false;mem[i].cur=0;mem[i].volt=0;}
   if(energ&&n>0){
    var share=xf.ma/n;
    // shorter branches take a little more; normalise by inverse voltage
    var sumInv=0;for(var i=0;i<n;i++)sumInv+=1/tubeVolts(live[i]);
    for(var i=0;i<n;i++){
     var t=live[i];
     t.on=true; t.volt=tubeVolts(t);
     t.cur = xf.ma * ( (1/t.volt) / sumInv );
     xf.load += t.volt*t.cur/1000;
    }
   }
  }
 }
 // transformer heating
 for(var i=0;i<XF.length;i++){
  var x=XF[i];
  var pw=x.load*0.14 + (x.load>0?12:1.5);
  x.heat += ( (ambient + pw*0.9) - x.heat ) * dt*0.03;
 }
}

function stepTubes(dt){
 for(var i=0;i<tubes.length;i++){
  var t=tubes[i];
  if(t.vented){ t.lit=0; t.wall += (ambient-t.wall)*dt*0.08; continue; }
  // ignition transient
  if(t.on && t.lit<0.02 && t.strike<=0){ t.strike=0.34; ignite(t); }
  if(t.strike>0)t.strike-=dt;
  var target = t.on?1:0;
  t.lit += (target-t.lit)*Math.min(1,dt*(t.on?26:15));
  // wall temperature: power in, convection out. bore affects surface area.
  var Pin = t.on ? (t.volt*t.cur/1000)*0.72 : 0;
  var area = feet(t)*(t.bore/15);
  var loss = (t.wall-ambient)*area*0.20;
  t.wall += (Pin - loss)*dt*0.055/Math.max(0.4,area);
  if(t.wall<ambient)t.wall=ambient;
  if(t.on){ t.hours += dt/3600; t.sput = Math.min(1, t.hours*0.6); }
 }
}

/* mercury vapour pressure proxy 0..1 from wall temp; peak around 40-45C */
function hgP(T){
 var x=(T-24)/22;
 if(x<0)x=0;
 return 1-Math.exp(-x*2.1);
}
function tubeColour(t){
 // returns [r,g,b,intensity]
 if(t.vented) return [0.35,0.37,0.377,0];
 var cd = t.cur/ (Math.PI*Math.pow(t.bore/2,2)/100);  // current density proxy
 var dens = Math.min(1.6, cd/9.0);
 if(t.fill==='ne'){
  var i = 0.55+0.45*dens;
  return [1.00,0.29,0.11, i*t.lit];
 }
 var p = hgP(t.wall);
 var ph = PH[t.ph];
 // cold: weak violet argon; warm: phosphor colour
 var vr=0.49,vg=0.435,vb=0.72;
 var mix = Math.pow(p,1.35);
 var r = vr+(ph.r-vr)*mix, g = vg+(ph.g-vg)*mix, b = vb+(ph.b-vb)*mix;
 // mid-warmup desaturation
 var wrong = Math.max(0, 1-Math.abs(mix-0.5)*2)*0.34;
 var m=(r+g+b)/3;
 r+= (m-r)*wrong; g+=(m-g)*wrong; b+=(m-b)*wrong;
 if(t.leak){ r=r*0.7+0.3; b=b*0.7+0.28; g*=0.72; }
 var out = (0.16 + 0.84*p) * ph.eff * (0.5+0.5*dens);
 return [r,g,b, out*t.lit];
}
function brightness(t){var c=tubeColour(t);return c[3]*(0.3+0.7*(t.bore/18));}

/* ---------- layout / transform ---------- */
var SX=1,SY=1,OX=0,OY=0;
function layout(){

 var availW=W-pad*2, availH=H*0.80;
 var sc=Math.min(availW/SW, availH/SH);
 SX=SY=sc;
 OX=(W-SW*sc)/2;
 OY=H*0.09;
}
function tx(x){return OX+x*SX;}
function ty(y){return OY+y*SY;}
function inv(px,py){return [(px-OX)/SX,(py-OY)/SY];}

/* ---------- audio ---------- */
var AC=null,master=null,audioOn=false,xfNodes=[],hissG=null,motorG=null;
function initAudio(){
 if(audioOn)return;
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
 }catch(e){return;}
 audioOn=true;
 master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
 // per-transformer 60 Hz buzz with odd harmonics
 for(var i=0;i<XF.length;i++){
  var g=AC.createGain();g.gain.value=0;g.connect(master);
  var parts=[];
  var harm=[1,3,5,7,9,11];
  for(var h=0;h<harm.length;h++){
   var o=AC.createOscillator();o.type='sine';o.frequency.value=60*harm[h]*(1+ (i-1.5)*0.0012);
   var hg=AC.createGain();hg.gain.value=(h===0?0.5:0.42/Math.pow(harm[h],0.72));
   o.connect(hg);hg.connect(g);o.start();
   parts.push(hg);
  }
  xfNodes.push({g:g,parts:parts});
 }
 // hiss
 var bl=AC.sampleRate*2,buf=AC.createBuffer(1,bl,AC.sampleRate),d=buf.getChannelData(0);
 for(var i=0;i<bl;i++)d[i]=(Math.random()*2-1);
 var ns=AC.createBufferSource();ns.buffer=buf;ns.loop=true;
 var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5200;bp.Q.value=0.8;
 hissG=AC.createGain();hissG.gain.value=0;
 ns.connect(bp);bp.connect(hissG);hissG.connect(master);ns.start();
 // motor hum
 var mo=AC.createOscillator();mo.type='sawtooth';mo.frequency.value=29.2;
 var mlp=AC.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=180;
 motorG=AC.createGain();motorG.gain.value=0.028;
 mo.connect(mlp);mlp.connect(motorG);motorG.connect(master);mo.start();
 // car park bed
 var ns2=AC.createBufferSource();ns2.buffer=buf;ns2.loop=true;
 var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=340;
 var bg=AC.createGain();bg.gain.value=0.017;
 ns2.connect(lp);lp.connect(bg);bg.connect(master);ns2.start();
 scheduleAmbience();
}
function nz(dur,freq,q,gain,type){
 if(!audioOn)return;
 var bl=Math.max(64,Math.floor(AC.sampleRate*dur)),buf=AC.createBuffer(1,bl,AC.sampleRate),d=buf.getChannelData(0);
 for(var i=0;i<bl;i++){var e=Math.pow(1-i/bl,3);d[i]=(Math.random()*2-1)*e;}
 var s=AC.createBufferSource();s.buffer=buf;
 var f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
 var g=AC.createGain();g.gain.value=gain;
 s.connect(f);f.connect(g);g.connect(master);s.start();
}
function ignite(t){
 if(!audioOn)return;
 nz(0.05, 900+ (18-t.bore)*260, 1.4, 0.20);
 var o=AC.createOscillator();o.type='square';o.frequency.value=1400+(18-t.bore)*160;
 var g=AC.createGain();g.gain.value=0.0;g.connect(master);o.connect(g);o.start();
 var now=AC.currentTime;
 g.gain.setValueAtTime(0.05,now);
 g.gain.exponentialRampToValueAtTime(0.0008,now+0.09);
 o.stop(now+0.11);
}
function clack(make){
 if(!audioOn)return;
 nz(0.035, make?2300:1600, 3.0, make?0.16:0.11,'bandpass');
 nz(0.02, 220, 1.0, 0.09,'lowpass');
}
function crackSnd(){
 if(!audioOn)return;
 nz(0.14, 3400, 0.8, 0.30);
 nz(0.30, 800, 0.5, 0.14,'lowpass');
}
function scheduleAmbience(){
 if(!audioOn)return;
 setTimeout(function(){
  var r=Math.random();
  if(r<0.3){nz(0.20,420,1.2,0.055,'bandpass');}                       // car door
  else if(r<0.5){ // screen door spring
   var o=AC.createOscillator();o.type='sawtooth';o.frequency.value=340;
   var g=AC.createGain();g.gain.value=0.02;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=6;
   o.connect(f);f.connect(g);g.connect(master);o.start();
   var n=AC.currentTime;o.frequency.exponentialRampToValueAtTime(140,n+0.5);
   g.gain.exponentialRampToValueAtTime(0.0005,n+0.6);o.stop(n+0.65);
  } else { // cicadas
   var o=AC.createOscillator();o.type='triangle';o.frequency.value=4400+Math.random()*900;
   var g=AC.createGain();g.gain.value=0.0;o.connect(g);g.connect(master);o.start();
   var n=AC.currentTime,dur=1.2+Math.random()*2.4;
   for(var i=0;i<dur*22;i++){g.gain.setValueAtTime(0.010*(0.5+Math.random()*0.5),n+i/22);g.gain.setValueAtTime(0.0,n+i/22+0.022);}
   o.stop(n+dur+0.1);
  }
  scheduleAmbience();
 }, 2600+Math.random()*8000);
}

/* ---------- moth ---------- */
var moth={active:false,x:0,y:0,vx:0,vy:0,ang:0,tgt:null,settled:false,settleT:0,walkA:0,phase:0,flap:0};
function mothTargets(){
 var best=null,bb=-1;
 for(var i=0;i<tubes.length;i++){var t=tubes[i];if(t.vented)continue;var b=brightness(t);if(b>bb){bb=b;best=t;}}
 return (bb>0.05)?best:null;
}
function tubePointAt(t,f){
 var L=plen(t.pts),d=f*L,run=0;
 for(var k=1;k<t.pts.length;k++){
  var dx=t.pts[k][0]-t.pts[k-1][0],dy=t.pts[k][1]-t.pts[k-1][1],l=Math.hypot(dx,dy);
  if(run+l>=d){var q=(d-run)/l;return [t.pts[k-1][0]+dx*q,t.pts[k-1][1]+dy*q];}
  run+=l;
 }
 return t.pts[t.pts.length-1].slice();
}
function stepMoth(dt){
 if(!moth.active){
  if(elapsed>40){moth.active=true;moth.x=SW+18;moth.y=SH+30;moth.vx=-14;moth.vy=-10;}
  return;
 }
 moth.flap+=dt*22;
 var tgt=mothTargets();
 if(moth.settled){
  moth.settleT-=dt;
  // walk along tube
  if(moth.tgt&&!moth.tgt.vented){
   moth.walkA += dt*0.035*(moth.phase?1:-1);
   moth.walkA=Math.max(0.03,Math.min(0.97,moth.walkA));
   var p=tubePointAt(moth.tgt,moth.walkA);
   moth.x=p[0];moth.y=p[1]-1.4;
   if(!moth.tgt.on && moth.settleT>1.0) moth.settleT=1.0;
  } else { moth.settleT=0; }
  if(moth.settleT<=0){moth.settled=false;moth.vx=(Math.random()-0.5)*24;moth.vy=-16-Math.random()*10;}
  return;
 }
 if(tgt){
  var p=tubePointAt(tgt,0.35+0.3*Math.sin(elapsed*0.7+tgt.id));
  var dx=p[0]-moth.x,dy=p[1]-moth.y,d=Math.hypot(dx,dy)+0.001;
  // transverse orientation: keep the light at a constant angle -> spiral
  var ang=Math.atan2(dy,dx)+ (0.85)*Math.sign(Math.sin(elapsed*0.9+tgt.id*1.7));
  moth.vx += Math.cos(ang)*dt*110;
  moth.vy += Math.sin(ang)*dt*110;
  moth.vx += (Math.random()-0.5)*dt*90;
  moth.vy += (Math.random()-0.5)*dt*90;
  var sp=Math.hypot(moth.vx,moth.vy);
  var mx=40; if(sp>mx){moth.vx*=mx/sp;moth.vy*=mx/sp;}
  moth.x+=moth.vx*dt;moth.y+=moth.vy*dt;
  if(d<3.2 && tgt.on && tgt.wall>ambient+2 && Math.random()<dt*3.0){
   moth.settled=true;moth.tgt=tgt;moth.settleT=2.5+Math.random()*7;
   moth.walkA=0.3+Math.random()*0.4;moth.phase=Math.random()<0.5;
  }
 } else {
  // nothing lit: go to the can and stay
  var cx=144,cy=130;
  var dx=cx-moth.x,dy=cy-moth.y,d=Math.hypot(dx,dy)+0.001;
  moth.vx+=dx/d*dt*40;moth.vy+=dy/d*dt*40;
  moth.vx*=0.94;moth.vy*=0.94;
  moth.x+=moth.vx*dt;moth.y+=moth.vy*dt;
  if(d<2){moth.settled=true;moth.tgt=null;moth.settleT=9999;}
 }
 if(moth.x<-30)moth.x=-30;if(moth.x>SW+40)moth.x=SW+40;
 if(moth.y<-20)moth.y=-20;if(moth.y>SH+50)moth.y=SH+50;
}

 var head=Math.atan2(moth.vy,moth.vx);
 X.rotate(moth.settled?0.1:head+1.57);
 X.fillStyle='rgba(196,178,152,0.92)';
 X.beginPath();X.ellipse(-sc*1.1,0,sc*1.3,sc*0.62*flap+sc*0.28,-0.35,0,6.2832);X.fill();
 X.beginPath();X.ellipse(sc*1.1,0,sc*1.3,sc*0.62*flap+sc*0.28,0.35,0,6.2832);X.fill();
 X.fillStyle='rgba(120,104,84,0.95)';
 X.beginPath();X.ellipse(0,0,sc*0.34,sc*1.05,0,0,6.2832);X.fill();
 X.restore();
}

/* ---------- flasher ---------- */
function stepDrum(dt){
 drumAngle=(drumAngle+dt/DRUM_PERIOD)%1;
 var st=[];
 for(var c=0;c<9;c++)st[c]=false;
 for(var i=0;i<fingers.length;i++){
  var f=fingers[i];
  var d=(drumAngle-f.p+1)%1;
  if(d<f.w) st[f.c]=true;
 }
 // three chase circuits derived from the drum directly (interleaved thirds)
 var chase=Math.floor(((drumAngle*9)%1)*3)%3;
 // faster sub-index: 31 lamps in three phases stepping ~7 per second
 var sub=Math.floor(drumAngle*DRUM_PERIOD*7.2)%3;
 st[9]= (sub===0); st[10]=(sub===1); st[11]=(sub===2);
 for(var c=0;c<12;c++){
  if(contactState[c]!==st[c]){ if(c<9) clack(st[c]); }
  contactState[c]=st[c];
 }
}

/* ---------- interaction ---------- */
var drag=null, holdTimer=null, holdTube=null, holdStart=0, pressPos=null;
function nearestTube(sx,sy){
 var p=inv(sx,sy),best=null,bd=1e9,bi=0;
 for(var i=0;i<tubes.length;i++){
  var t=tubes[i];
  for(var k=1;k<t.pts.length;k++){
   var a=t.pts[k-1],b=t.pts[k];
   var dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
   var u=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2));
   var qx=a[0]+dx*u,qy=a[1]+dy*u;
   var d=Math.hypot(p[0]-qx,p[1]-qy);
   if(d<bd){bd=d;best=t;bi=k-1+u;}
  }
 }
 if(bd> 7) return null;
 return {t:best,idx:bi,d:bd};
}
function nearestFinger(sx,sy){
 var best=null,bd=1e9;
 for(var i=0;i<fingers.length;i++){
  var f=fingers[i];
  if(f._sx===undefined)continue;
  var d=Math.hypot(sx-f._sx,sy-f._sy);
  if(d<bd){bd=d;best=f;}
 }
 return (bd<Math.max(18,W*0.03))?best:null;
}
function key(t){return t.seg||('t'+t.id);}
function crack(t){
 if(t.vented)return;
 t.vented=true;t.dead=true;
 save.cracked[key(t)]=1;persist();
 crackSnd();
}
C.addEventListener('pointerdown',function(e){
 initAudio();
 var r=C.getBoundingClientRect();
 var sx=e.clientX-r.left, sy=e.clientY-r.top;
 var f=nearestFinger(sx,sy);
 if(f){drag={kind:'finger',f:f};C.setPointerCapture(e.pointerId);return;}
 var n=nearestTube(sx,sy);
 if(n){
  drag={kind:'tube',t:n.t,idx:n.idx,moved:false};
  holdTube=n.t;holdStart=performance.now();pressPos=[sx,sy];
  C.setPointerCapture(e.pointerId);
 }
});
C.addEventListener('pointermove',function(e){
 if(!drag)return;
 var r=C.getBoundingClientRect();
 var sx=e.clientX-r.left, sy=e.clientY-r.top;
 if(drag.kind==='finger'){
  var f=drag.f;
  var a=Math.atan2(sy-f._cy,sx-f._cx);
  f.p=((a/6.2832)%1+1)%1;
  save.fingers=fingers.map(function(q){return q.p;});persist();
  return;
 }
 var t=drag.t;
 if(t.vented)return;
 if(pressPos&&Math.hypot(sx-pressPos[0],sy-pressPos[1])>4)drag.moved=true;
 if(!drag.moved)return;
 holdTube=null;
 var p=inv(sx,sy);
 // insert or move a bend vertex at drag.idx
 var i0=Math.floor(drag.idx), frac=drag.idx-i0;
 if(drag.vert===undefined){
  if(frac>0.14&&frac<0.86){
   t.pts.splice(i0+1,0,[p[0],p[1]]);
   drag.vert=i0+1;
  } else {
   drag.vert = (frac<=0.14)?i0:i0+1;
   if(drag.vert<=0)drag.vert=Math.min(1,t.pts.length-1);
   if(drag.vert>=t.pts.length-1)drag.vert=Math.max(0,t.pts.length-2);
  }
 }
 var v=drag.vert;
 if(v>0&&v<t.pts.length){ t.pts[v][0]=p[0]; t.pts[v][1]=p[1]; }
 save.bends[key(t)]=t.pts.map(function(q){return [Math.round(q[0]*100)/100,Math.round(q[1]*100)/100];});
 persist();
});
function endPointer(e){
 if(drag&&drag.kind==='tube'&&!drag.moved&&holdTube){
  var held=performance.now()-holdStart;
  if(held>620) crack(holdTube);
 }
 drag=null;holdTube=null;pressPos=null;
}
C.addEventListener('pointerup',endPointer);
C.addEventListener('pointercancel',endPointer);
C.addEventListener('contextmenu',function(e){e.preventDefault();});

/* long-hold while stationary */
function checkHold(){
 if(holdTube && drag && drag.kind==='tube' && !drag.moved){
  if(performance.now()-holdStart>620){ crack(holdTube); holdTube=null; }
 }
}

/* ---------- audio update ---------- */
function updateAudio(){
 if(!audioOn)return;
 var totalLoad=0;
 for(var i=0;i<XF.length;i++){
  var x=XF[i],n=xfNodes[i];
  if(!n)continue;
  var lv=Math.min(1,x.load/700);
  totalLoad+=lv;
  n.g.gain.value = 0.006 + lv*0.030;
  // harmonic content rises with load
  for(var h=1;h<n.parts.length;h++){
   n.parts[h].gain.value = (0.42/Math.pow([1,3,5,7,9,11][h],0.72)) * (0.35+lv*0.95);
  }
 }
 // hiss from tubes near current limit
 var stress=0;
 for(var i=0;i<tubes.length;i++){
  var t=tubes[i];
  if(!t.on)continue;
  var head = t.volt/(XF[CIR[t.cir].xf].ocv*0.92);
  if(head>0.55) stress += (head-0.55);
 }
 if(hissG)hissG.gain.value=Math.min(0.030,stress*0.010);
 if(motorG)motorG.gain.value=0.022+0.008*Math.abs(Math.sin(drumAngle*6.2832*12));
}

/* ---------- main loop ---------- */
function frame(now){
 now/=1000;
 var dt=Math.min(0.05,now-tPrev);tPrev=now;elapsed=now-t0;
 // evening cools
 ambient -= dt*0.0016;
 if(ambient<18)ambient=18;
 save.amb=Math.round(ambient*100)/100;
 stepDrum(dt);
 solveCircuits(dt);
 stepTubes(dt);
 stepMoth(dt);
 checkHold();
 updateAudio();
 // periodic hour write
 if(Math.random()<dt*0.35){
  for(var i=0;i<tubes.length;i++){var t=tubes[i];save.hours[key(t)]=Math.round(t.hours*10000)/10000;}
  persist();
 }

 X.fillStyle=skyGrad();X.fillRect(0,0,W,H);
 drawStructure();
 drawTruck();
 drawCarAndLot();
 for(var i=0;i<tubes.length;i++)drawTube(tubes[i]);
 drawLamps(dt);
 drawDrum();
 drawMoth();
 requestAnimationFrame(frame);
}

build();buildLamps();
for(var i=0;i<12;i++){contactState[i]=false;}
resize();
requestAnimationFrame(frame);

try{

 console.log('CRESTLINE DRIVE-IN — sign 42, erected 4 Sept, tested 8:20 PM');

 console.log('R (second letter) vented at load — cracked electrode seal, not repairable in the field');
 console.log('circuit 6 is short one tube and running above rating; it will be the first to blacken');
 console.log('owner wants an answer about the weekend');
}catch(e){}
})();
