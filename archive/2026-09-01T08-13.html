  <meta name="outbox-spec-era" content="May 1966, right now — twenty past ten on a bright cold morning in the pattern loft over a jobbing grey-iron foundry on the Tammerkoski at Tampere, Finland, with the loft windows on the north side and the floor shaking slightly every time the shakeout runs downstairs. A repeat order came in Monday for forty pump housings that this shop last poured in 1958, and the only pattern anybody can find for it was made off a finished casting instead of off a drawing, which means it is short by a shrinkage and possibly by two. Not a look-back at 'the great foundry days' and not a lament for anything: the moulders want a pattern down the hoist by noon, the office wants a price by half past eleven, and nobody in this building knows for certain what metal the 1958 job was poured in.">
  <meta name="outbox-spec-format" content="A BROWSEABLE PATTERN RACK — the page is a directory made entirely of timber objects stood on their edges, and you browse it by working the wall. The whole viewport, edge to edge, is one bay and a half of open pattern racking seen from standing in the aisle at chest height, running off the top and bottom of frame: split patterns, core boxes, follow boards and loose pieces stacked on edge, every slot with a chalked rack number on the shelf lip and a wired-on job card hanging off the pattern itself. No menu, no index, no scrollbar, no page chrome of any kind. You move UP and DOWN the bays with a vertical drag and ALONG the racking with a horizontal one, and the wall reads as a classification because the patterns are painted in the trade colour code and you can see the code before you can read a word of it. Press any pattern and it comes out into the aisle light onto the bench under the north window, where it can be turned in the hand, pulled apart along its steel dowels, have its core boxes opened, and be worked with the three instruments lying there: three contraction rules, one per metal, which are all a little longer than a metre and are not interchangeable; a bevel for reading the draft off any face; and an open moulding box of green sand in which the pattern can genuinely be rammed up, struck off, and DRAWN. Put a pattern back in a different slot and that is the slot it lives in from then on, chalk and all.">
  <meta name="outbox-spec-subject" content="The flat dimensional arithmetic of a foundry pattern, and specifically the single fact that a pattern is never the size of the thing it makes and never has been — that molten iron fills a cavity and then contracts as it cools solid, so every pattern is deliberately made oversize by the metal's contraction (grey iron about 1.0%, brass and bronze about 1.5%, aluminium about 1.3%, steel about 2.0%), and the patternmaker does not calculate this, he works with a CONTRACTION RULE which is simply a rule with all its divisions stretched by that percentage, so an ordinary metre rule laid on a pattern is not measuring anything anybody wants; that this is exactly why a pattern made off an existing CASTING instead of off a drawing is short by one full shrinkage, and a pattern made off a casting made off that pattern is short by two, and the error is multiplicative and permanent and cannot be sanded in; that DRAFT is the other non-negotiable — every surface parallel to the direction of draw must be tapered, typically one to three degrees, or the sand tears when the pattern lifts, and a face with zero draft is not a tight fit, it is a broken mould every single time; that an UNDERCUT is a face which draws negative, which means the pattern physically cannot come out of the sand at all, and the answer is either a loose piece pinned into the pattern and drawn sideways afterward, or a core, or a different parting line, and choosing between those three IS patternmaking; that the PARTING LINE decides everything downstream and is chosen at the widest section so both halves draw with the maximum taper and the minimum loose pieces, and that split patterns are located to each other by two steel dowels which must not be symmetrical or the halves will go together the wrong way round and nobody will notice until the casting is offset; that MACHINING ALLOWANCE is a separate and additive stock of metal, typically 3 mm on small work and up to 6 mm on a large bottom face, put on only where the drawing shows a red machined surface, so a pattern carries shrinkage everywhere and machining stock only in places; that CORE PRINTS are the parts of the pattern that make no metal at all — they are extensions that print a socket in the sand for the core to sit in, they must be large enough to carry the core's weight and to vent it, and they are painted a separate colour precisely so nobody mistakes them for part of the casting; that a core box is a negative and reads backwards, so a core box for a tapered hole has its draft the other way; that FILLETS at every internal corner are not decoration — a sharp internal corner is where the casting cracks as it cools because the grain grows in from both faces and meets in a plane of weakness, so leather or wax fillets go into every corner and the radius is a real specification; that RAPPING — knocking the pattern to loosen it before drawing — enlarges the cavity by a real and cumulative amount, so an old pattern that has been rapped for eight years produces castings measurably oversize and out of round at the parting; that SECTION THICKNESS governs whether the thing fills at all and whether it solidifies directionally toward the riser, so a thin web joining two heavy bosses will freeze first, cut the feed off, and leave shrinkage cavities in the bosses that no inspection will find until machining opens them; that a pattern belongs to the customer, lives in this rack at the foundry's risk, and is charged for once and stored forever; that the colour code on the rack is a language — black for surfaces left as cast, red for surfaces to be machined, yellow for core prints, red-and-yellow stripes for seats of loose pieces, and clear varnish for a pattern nobody has finished deciding about; and the flat costing arithmetic the office needs by half eleven, which is pattern volume minus core volume times 7.2 kilos the litre for grey iron, plus a moulding time per box, plus a core per casting, plus fettling, times forty, and the whole quote turns on whether that housing pattern is one shrinkage short or two.">
  <meta name="outbox-spec-tone" content="The quick, absorbed, arithmetic-obsessed voice of Sirkku Rautavaara-Lindqvist, twenty-six, an estimator out of the front office who has come up the loft stairs in her coat because she cannot price this job from the file. She is NOT teaching anybody and does not address the visitor at all — she is talking to her clipboard and to the patterns, working aloud because it is faster than thinking silently, and the visitor simply happens to be in the aisle. Present tense, first person, complete sentences that break off mid-figure when a better figure occurs to her. She converts everything into kilos and then into money and says both numbers. She revises her own estimate out loud four separate times and says plainly each time what she got wrong. She is arguing, in absentia and by name, with Manninen in the office, who priced the 1958 order and left no note about the metal, and she says twice that a quote with no metal written on it is not a quote. She is specifically and repeatedly annoyed about the chalk — the loft chalks its rack numbers on the shelf lip and not on the pattern, so a pattern put back one slot along is lost for a year, and she says so three times because it is happening to her right now. She is briefly and genuinely pleased once, about a core box somebody made with the vent already cut in it, and says so as a matter of saved minutes and not of craft. She mentions the hoist twice and the shakeout downstairs once, and that her hands are cold because the loft has no stove and never has. Never wry, never deadpan, never a craftsman-sage, never wistful, never charmed by any of it, never explaining her trade to an audience.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, all of them off the trade colour code. The ground is dry planed pine and rack timber in a warm sanded yellow-brown (#d4a862), going greyer and duller on the shelf edges where forty years of pattern corners have burnished it (#a38a63), and darker in the rack shadow between bays (#5c4a33), with loft floorboards and dust reading as a flat pale scatter across the bottom of frame (#c9b795). Against that, the two anchors are the code itself, painted in real varnish-thick enamel with brush marks that catch a hard specular from the north window: as-cast BLACK (#1d1a17), sitting slightly glossy and chipped to bare pine at every corner and dowel hole; and machined-surface RED (#a83224), which appears only on faces carrying machining stock, so a visitor who never reads a word can see at a glance which patterns are for finished work and which are rough. Exactly one chip of core-print YELLOW (#e0b41a) is held strictly for core prints, wherever they occur, and for the striped seats of loose pieces — it never appears on any surface that becomes metal. Chalk is a soft dry white with real broken coverage over the timber grain (#efe9dc) and is the only thing on the page anybody has written by hand. Green moulding sand on the bench is a dark damp olive-grey with a genuine granular render and a bright struck-off face where the strickle has passed (#4e5344), going paler as it dries. Steel dowels and the contraction rules are dull machine steel (#8d9490). Flat, hard, high-contrast, no glow, no bloom, no soft focus, no gradients other than honest enamel gloss and honest sand moisture — painted pine and green sand under cold north light at twenty past ten.">
  <meta name="outbox-spec-wildcard" content="One pattern in the middle bay — a bearing bracket, rack number chalked but with no job card wired to it — has been altered twice with glued-on wisdom pieces and then partly cut away again, so its two halves no longer dowel true: they close with a real visible step of about two millimetres along one edge, and the engine honestly renders and casts that step into every mould made from it. It can be rammed and drawn and poured like anything else and the resulting casting is genuinely offset at the parting. Sirkku picks it up once, says Ruoho built it up in about 1961 for a job that then changed twice, puts it back in the same slot, and never mentions it again. It is in the same bay, with the same step, on every visit.">
  <meta name="outbox-spec-forbidden" content="NO foundry romance of any kind: no molten iron sublime, no glow on men's faces, no sparks, no Vulcan, no fire-and-danger imagery, no heat-and-noise colour writing, no shakeout as spectacle — the pour happens downstairs and is a cooling model, and this page is a cold loft with a north window. NO pattern-as-metaphor for anything — not templates, not what shapes us, not the negative space of a life, not 'the thing that makes the thing'; it is 1.0% contraction, one degree of draft and a rapped-out parting line, and it has nothing to teach anybody. NO craftsman-sage register, NO 'the old patternmakers could see it in the wood', NO trade-secret mystique, NO reverence for hand skill, NO handmade-versus-machine sermon. NO wood lyricism: no grain, no smell of pine or shellac, no sensuous writing about timber or enamel beyond taper, dowel fit, gloss and chipping. NO vanished-trade lament, NO 'they threw the whole loft in a skip in 1981', NO deindustrialisation narrative, NO Rust Belt, NO nostalgia, NO wistfulness — the moulders want a pattern down the hoist by noon. NO labour sermon, NO dignity-of-the-worker sentiment, NO union framing, NO industrial-drudgery pathos, NO aren't-they-skilled condescension. NO Finland travelogue and NO explaining Finland to anybody: no sauna, no forests, no lakes, no silence-of-Finns joke, no Nordic hush, no midnight sun, no Cold War or neutrality framing, no dialect spelling. NO cryptic-SCP, liminal, uncanny, backrooms or ominous dread about the pattern with no job card, the mismatched halves, or anything in the rack — nothing here is wrong. NO archival / museum / cabinet / drawer / vault / collection / relic framing of the racking whatsoever, despite it being a wall of stored objects — every one of these is customer property in live storage and one of them is going downstairs in an hour. NO detective or mystery-solved arc about the 1958 metal, no reveal, no triumph; it is a costing question with a deadline. NO camp or ironic affection for 1960s industrial ephemera, NO winking at the colour code. NO hushed, meditative, ASMR, oddly-satisfying or screensaver framing of the sand work. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past ten on a bright cold morning. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
"use strict";
/* ------------------------------------------------------------------ */
/*  loft, bay B and half of bay C, over the shakeout                    */
/* ------------------------------------------------------------------ */
var cv=document.getElementById('view'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);sandDirty=true;}
window.addEventListener('resize',resize);

/* ---------------- persistence ---------------- */
var KEY='loft.tammerkoski.bayB.v1';
var save={slots:{},rap:{},tally:{ram:0,clean:0,tore:0},said:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){
  save.slots=o.slots||{};save.rap=o.rap||{};save.tally=o.tally||save.tally;save.said=o.said||{};}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------------- audio ---------------- */
var AC=null,master=null,sndOn=false,windGain=null;
function audio(){ if(AC) return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  master=AC.createGain();master.gain.value=0.0;master.connect(AC.destination);
  // wind at the north window
  var wb=AC.createBufferSource();wb.buffer=noiseBuf(3);wb.loop=true;
  var wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=340;wf.Q.value=0.7;
  windGain=AC.createGain();windGain.gain.value=0.035;
  wb.connect(wf);wf.connect(windGain);windGain.connect(master);wb.start();
  var lfo=AC.createOscillator();lfo.frequency.value=0.09;var lg=AC.createGain();lg.gain.value=0.022;
  lfo.connect(lg);lg.connect(windGain.gain);lfo.start();
  return AC;}
function noiseBuf(sec){var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function env(g,a,d,peak){var t=AC.currentTime;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function knock(mass,vol){ if(!sndOn||!audio())return;
  var f=900/Math.pow(Math.max(0.4,mass),0.25);
  var o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f*0.72,AC.currentTime+0.11);
  var g=AC.createGain();env(g,0.003,0.12,0.16*Math.min(1.4,0.6+vol));
  var nb=AC.createBufferSource();nb.buffer=noiseBuf(0.1);
  var nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=f*2.2;nf.Q.value=1.2;
  var ng=AC.createGain();env(ng,0.001,0.05,0.07);
  o.connect(g);g.connect(master);nb.connect(nf);nf.connect(ng);ng.connect(master);
  o.start();o.stop(AC.currentTime+0.2);nb.start();}
function click(){if(!sndOn||!audio())return;var nb=AC.createBufferSource();nb.buffer=noiseBuf(0.04);
  var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2600;
  var g=AC.createGain();env(g,0.001,0.03,0.11);nb.connect(f);f.connect(g);g.connect(master);nb.start();}
var hissSrc=null,hissF=null,hissG=null;
function hissOn(){if(!sndOn||!audio())return;if(hissSrc)return;
  hissSrc=AC.createBufferSource();hissSrc.buffer=noiseBuf(2);hissSrc.loop=true;
  hissF=AC.createBiquadFilter();hissF.type='bandpass';hissF.frequency.value=1200;hissF.Q.value=0.9;
  hissG=AC.createGain();hissG.gain.value=0.0001;
  hissSrc.connect(hissF);hissF.connect(hissG);hissG.connect(master);hissSrc.start();}
function hissSet(speed){if(!hissG)return;
  hissG.gain.setTargetAtTime(Math.min(0.09,0.006+speed*0.011),AC.currentTime,0.05);
  hissF.frequency.setTargetAtTime(700+Math.min(3400,speed*260),AC.currentTime,0.05);}
function hissOff(){if(!hissSrc)return;try{hissG.gain.setTargetAtTime(0.0001,AC.currentTime,0.05);
  var s=hissSrc;setTimeout(function(){try{s.stop();}catch(e){}},220);}catch(e){}hissSrc=null;hissG=null;}
function crumble(n){ if(!sndOn||!audio())return;
  var grains=Math.min(90,8+Math.floor(n/3));
  for(var i=0;i<grains;i++){(function(k){
    var t=AC.currentTime+Math.random()*0.55*(0.4+n/400);
    var nb=AC.createBufferSource();nb.buffer=noiseBuf(0.05);
    var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=300+Math.random()*1500;f.Q.value=2;
    var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.02+Math.random()*0.03,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05+Math.random()*0.08);
    nb.connect(f);f.connect(g);g.connect(master);nb.start(t);})(i);}}
function ruleSlide(){if(!sndOn||!audio())return;var nb=AC.createBufferSource();nb.buffer=noiseBuf(0.3);
  var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=3;
  var g=AC.createGain();env(g,0.02,0.16,0.035);nb.connect(f);f.connect(g);g.connect(master);nb.start();}
function chalkSqueak(){if(!sndOn||!audio())return;
  for(var i=0;i<7;i++){var t=AC.currentTime+i*0.045+Math.random()*0.02;
    if(Math.random()<0.35)continue;
    var o=AC.createOscillator();o.type='sawtooth';o.frequency.value=1400+Math.random()*900;
    var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.02,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=900;
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+0.06);}}
var shakeAmp=0;
function shakeout(){ if(sndOn&&audio()){
    var nb=AC.createBufferSource();nb.buffer=noiseBuf(1.6);
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=120;
    var g=AC.createGain();env(g,0.25,1.1,0.10);nb.connect(f);f.connect(g);g.connect(master);nb.start();}
  shakeAmp=2.4; sandDirty=true;
  setTimeout(shakeout, 26000+Math.random()*44000);}
setTimeout(shakeout,9000+Math.random()*12000);
function hoist(){ if(sndOn&&audio()){ for(var i=0;i<11;i++){var t=AC.currentTime+i*0.14+Math.random()*0.05;
    var o=AC.createOscillator();o.type='square';o.frequency.value=1800+Math.random()*1200;
    var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.018,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);

/* ---------------- geometry ---------------- */
function totalH(p){var h=0;for(var i=0;i<p.segs.length;i++)h+=p.segs[i].h;return h;}
function partingY(p){var y=0;for(var i=0;i<p.partIdx;i++)y+=p.segs[i].h;return y;}
function rapGrow(p,y){ // radial growth in mm, bell about the parting
  var r=p.rap||0;if(!r)return 0;var H=totalH(p),py=partingY(p);
  return r*Math.exp(-Math.pow((y-py)/(H*0.20),2));}
/* build silhouette: list of {y0,y1,w0,w1,d0,d1,kind,draft,seg,idx,off} */
function profile(p){
  var out=[],y=0,py=partingY(p),T=Math.PI/180;
  for(var i=0;i<p.segs.length;i++){
    var s=p.segs[i],y0=y,y1=y+s.h,t=Math.tan(s.draft*T),w0,w1,d0,d1;
    if(i<p.partIdx){ w1=s.w; w0=s.w-2*s.h*t; d1=s.d; d0=s.d-2*s.h*t; }
    else{ w0=s.w; w1=s.w-2*s.h*t; d0=s.d; d1=s.d-2*s.h*t; }
    var g0=2*rapGrow(p,y0),g1=2*rapGrow(p,y1);
    var off=(p.step&&i>=p.partIdx)?p.step:0;
    out.push({y0:y0,y1:y1,w0:w0+g0,w1:w1+g1,d0:d0,d1:d1,kind:s.kind,draft:s.draft,seg:s,idx:i,off:off,fil:s.fil});
    y=y1;}
  return out;}
function volumes(p){ // mm3
  var pr=profile(p),vol=0,print=0;
  for(var i=0;i<pr.length;i++){var s=pr[i],h=s.y1-s.y0;
    var v=((s.w0*s.d0)+(s.w1*s.d1))/2*h;
    if(s.kind==='print')print+=v; else vol+=v;}
  var core=0;
  if(p.core)core=Math.PI*Math.pow(p.core.dia/2,2)*p.core.len;
  return {pattern:vol,print:print,core:core};}
function costing(p){
  var m=METAL[p.metal],v=volumes(p);
  var castVol=(v.pattern - v.core)/Math.pow(1+m.c,3); // mm3
  var L=castVol/1e6;
  var kg=L*m.rho;
  var mins=6+ (v.pattern/1e6)*2.4 + (p.core?3.2:0) + (p.loose?1.8:0) - (p.core&&p.core.vent?0.8:0);
  var metalCost=kg*0.68, mould=mins*2.15, cores=(p.core?3.40:0), fettle=4.90+kg*0.06;
  var each=metalCost+mould+cores+fettle;
  return {L:L,kg:kg,mins:mins,metalCost:metalCost,mould:mould,cores:cores,fettle:fettle,
          each:each,total:each*(p.qty||0),m:m,v:v};}

function ram(cx,cy,power){

   for(var x=Math.max(0,cx-r);x<Math.min(GW,cx+r);x++){
     var dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy*1.6);if(d>r)continue;
     var i=sIdx(x,y);if(sand[i]<=0)continue;
     sand[i]=Math.min(1.0,sand[i]+power*(1-d/r)*0.30);}
  sandDirty=true;}

function faceColor(kind){return kind==='mach'?'#a83224':kind==='print'?'#e0b41a':kind==='bare'?'#c9a469':'#1d1a17';}
function gloss(c,x,y,w,h){

  g.addColorStop(0,'rgba(255,255,255,0.16)');g.addColorStop(0.35,'rgba(255,255,255,0.02)');
  g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(x,y,w,h);}

/* draw a pattern silhouette; returns transform info */
function drawPattern(c,p,cx,baseY,scale,opt){
  opt=opt||{};
  var pr=profile(p),H=totalH(p),py=partingY(p);
  var sep=(opt.split? 26:0);
  for(var i=0;i<pr.length;i++){
    var s=pr[i];
    var above=s.idx>=p.partIdx;
    var yshift=(above?-sep:0);
    var x0=cx+(s.off*scale)+ (above?0:0);
    var top=baseY-(s.y1*scale)+yshift, bot=baseY-(s.y0*scale)+yshift;
    var hw0=s.w0*scale/2,hw1=s.w1*scale/2;
    c.beginPath();
    c.moveTo(x0-hw0,bot);c.lineTo(x0+hw0,bot);c.lineTo(x0+hw1,top);c.lineTo(x0-hw1,top);c.closePath();
    c.fillStyle=faceColor(s.kind);c.fill();
    // enamel gloss
    c.save();c.clip();gloss(c,x0-hw0,top,hw0*2,bot-top);
    // chipped to bare pine at corners & dowel holes
    c.fillStyle='#c9a469';
    var seedn=(s.idx*37+p.id.length*11);
    for(var k=0;k<5;k++){var rr=((seedn*(k+3))%17)/17;
      var px=(k%2? x0-hw0 : x0+hw0-3)+ (rr*3-1);
      var pyy=(k<3? bot-2-rr*3 : top+rr*3);
      c.fillRect(px,pyy,1.6+rr*2.4,1.4+rr*2);}
    c.restore();
    // striped seat for the loose piece
    if(p.loose&&!above&&s.y0<=p.loose.y&&s.y1>=p.loose.y){
      var ly=baseY-(p.loose.y+p.loose.h/2)*scale;
      var lw=p.loose.proj*scale, lh=p.loose.h*scale;
      var lx=x0+hw0-2;
      if(p.loose.pinned){
        for(var q=0;q<6;q++){c.fillStyle=(q%2)?'#e0b41a':'#a83224';
          c.fillRect(lx,ly-lh/2+q*lh/6,lw,lh/6);}
        c.strokeStyle='rgba(0,0,0,.4)';c.strokeRect(lx,ly-lh/2,lw,lh);
      }else{
        for(var q2=0;q2<6;q2++){c.fillStyle=(q2%2)?'rgba(224,180,26,.45)':'rgba(168,50,36,.45)';
          c.fillRect(lx,ly-lh/2+q2*lh/6,3,lh/6);}
      }
    }
  }
  // dowels (not symmetrical)
  if(p.partIdx>0&&p.partIdx<p.segs.length){
    var dy=baseY-py*scale;
    var half=pr[p.partIdx-1].w1*scale/2;
    c.fillStyle='#8d9490';
    c.fillRect(cx-half*0.62-1.5,dy-(opt.split?sep/2:0)-2,3,4);
    c.fillRect(cx+half*0.30-1.5,dy-(opt.split?sep/2:0)-2,3,4);
    if(opt.split){c.strokeStyle='#8d9490';c.lineWidth=1.2;
      c.beginPath();c.moveTo(cx-half*0.62,dy-sep);c.lineTo(cx-half*0.62,dy);
      c.moveTo(cx+half*0.30,dy-sep);c.lineTo(cx+half*0.30,dy);c.stroke();}
  }
  return {pr:pr,H:H,py:py,scale:scale,cx:cx,baseY:baseY};}

function drawRack(){
  ctx.save();
  ctx.fillStyle='#d4a862';ctx.fillRect(0,0,W,H);
  ctx.translate(-cam.x,-cam.y);

  var ep=posts[0]-14;

  chalkText(ctx,'RAMMED '+tally.ram,0,0,15,0,0.95);
  chalkText(ctx,'DREW CLEAN '+tally.clean,0,26,15,0,0.95);
  chalkText(ctx,'TORE '+tally.tore,0,52,15,0,0.95);

    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(20,sy,world.w-40,3);
    // rack shadow between bays
    ctx.fillStyle='rgba(92,74,51,0.18)';ctx.fillRect(20,sy-34,world.w-40,34);
  }
  // slots
  for(var i=0;i<NSLOT;i++){
    var R=slotRect(i);

      ctx.save();ctx.translate(jx,jy);ctx.rotate(0.06);
      ctx.fillStyle='#e6ddc8';ctx.fillRect(0,0,58,40);
      ctx.strokeStyle='#8d7f63';ctx.strokeRect(0.5,0.5,58,40);

/* ---------------- BENCH ---------------- */
function benchLayout(){
  var stacked=(W/H)<1.15;
  var top=46;
  if(stacked){
    return {stacked:true,
      pat:{x:6,y:top,w:W-12,h:(H-top)*0.44},
      box:{x:6,y:top+(H-top)*0.45,w:W-12,h:(H-top)*0.42}};
  }
  return {stacked:false,
    pat:{x:8,y:top,w:W*0.44,h:H-top-70},
    box:{x:W*0.46,y:top,w:W*0.52,h:H-top-70}};
}
function drawBench(){
  var p=bench.p;if(!p){mode='rack';return;}
  var L=benchLayout();bench.L=L;
  var sh=shakeAmp>0.02?(Math.random()-0.5)*shakeAmp:0;
  ctx.save();ctx.translate(sh,sh*0.6);
  // north window light on the bench
  ctx.fillStyle='#c9b795';ctx.fillRect(0,0,W,H);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,0.20)');g.addColorStop(0.5,'rgba(255,255,255,0.0)');
  g.addColorStop(1,'rgba(92,74,51,0.16)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // bench top boards
  ctx.fillStyle='#d4a862';ctx.fillRect(0,40,W,H-40);
  for(var bx=0;bx<W;bx+=54){ctx.fillStyle='rgba(92,74,51,0.07)';ctx.fillRect(bx,40,1.5,H);}
  ctx.fillStyle='rgba(92,74,51,0.25)';ctx.fillRect(0,40,W,3);

  /* ---- pattern panel ---- */
  var R=L.pat;
  ctx.save();ctx.beginPath();ctx.rect(R.x,R.y,R.w,R.h);ctx.clip();
  var Hm=totalH(p),mw=0,pr=profile(p);
  for(var i=0;i<pr.length;i++)mw=Math.max(mw,pr[i].w0,pr[i].w1);
  if(p.loose&&p.loose.pinned)mw+=p.loose.proj*1.2;
  var sc=Math.min((R.h-70)/Hm,(R.w-90)/mw);
  bench.scale=sc;
  var cx=R.x+R.w*0.46, base=R.y+R.h-30;
  bench.cx=cx;bench.base=base;
  if(bench.place==='bench'){
    ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#5c4a33';
    ctx.beginPath();ctx.ellipse(cx+6,base+3,mw*sc*0.55,6,0,0,7);ctx.fill();ctx.restore();
    drawPattern(ctx,p,cx,base,sc,{split:bench.split});
    // dimension pickups + bevel readouts
    ctx.strokeStyle='rgba(35,29,21,.35)';ctx.setLineDash([3,3]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-mw*sc/2-14,base);ctx.lineTo(cx+mw*sc/2+14,base);ctx.stroke();
    ctx.setLineDash([]);
    if(bench.measure){
      var m=bench.measure;
      ctx.strokeStyle='#8d9490';ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.lineTo(m.x1,m.y1);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.lineTo(m.x1,m.y1);ctx.stroke();
      ctx.lineCap='butt';
    }
    if(bench.bevel){
      ctx.strokeStyle='#a83224';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(bench.bevel.x,bench.bevel.y-12);ctx.lineTo(bench.bevel.x,bench.bevel.y+12);ctx.stroke();}
  }
  // instruments lying on the bench under the pattern
  var ry=R.y+R.h-16;
  var rules=[{c:0,n:'ORDINARY'},{c:0.010,n:'IRON 1.0'},{c:0.015,n:'BRASS 1.5'},{c:0.013,n:'ALU 1.3'}];
  for(var k=0;k<4;k++){

    ctx.fillStyle='rgba(35,29,21,.7)';ctx.font='7px ui-monospace,monospace';
    ctx.fillText(rules[k].n,rx,ry-2);
  }
  // core box
  if(bench.coreOpen&&p.core){
    var bx0=R.x+12,by0=R.y+12,bw=Math.min(150,R.w*0.42),bh=64;
    ctx.fillStyle='#1d1a17';ctx.fillRect(bx0,by0,bw,bh);
    ctx.fillStyle='#c9a469';ctx.fillRect(bx0+2,by0+2,bw-4,bh-4);
    ctx.fillStyle='#e0b41a';ctx.fillRect(bx0+8,by0+bh/2-11,bw-16,22);
    if(bench.coreMade){
      ctx.fillStyle='#4e5344';ctx.fillRect(bx0+10,by0+bh/2-9,bw-20,18);
      for(var gq=0;gq<160;gq++){ctx.fillStyle='rgba(0,0,0,.16)';
        ctx.fillRect(bx0+10+Math.random()*(bw-20),by0+bh/2-9+Math.random()*18,1.2,1.2);}
    }
    ctx.strokeStyle='#5c4a33';ctx.strokeRect(bx0+.5,by0+.5,bw,bh);
    ctx.fillStyle='#231d15';ctx.font='8px ui-monospace,monospace';
    ctx.fillText(p.core.name+(p.core.vent?'  VENT CUT':'  NO VENT'),bx0,by0-3);
  }
  ctx.restore();

  /* ---- sand box ---- */
  var B=L.box;sandRect=B;
  // box timber
  ctx.fillStyle='#5c4a33';ctx.fillRect(B.x-6,B.y-6,B.w+12,B.h+12);
  ctx.fillStyle='#a38a63';ctx.fillRect(B.x-6,B.y-6,B.w+12,5);
  if(sandDirty){renderSand(B);sandDirty=false;}
  ctx.drawImage(sandCanvas,B.x,B.y,B.w,B.h);
  // pattern buried in the box
  if(bench.place==='box'){
    var cw=B.w/GW,ch=B.h/GH;
    var psc=Math.min((B.w*0.62)/mw,(B.h*0.75)/Hm);
    bench.boxScale=psc;
    var pcx=B.x+B.w*0.5;
    var partLine=B.y+STRIKE*ch;
    var by=partLine + bench.patY;
    bench.boxCx=pcx;bench.boxBase=by;
    drawPattern(ctx,p,pcx,by,psc,{});
    if(!bench.drawn){
      ctx.fillStyle='rgba(35,29,21,.7)';ctx.font='9px ui-monospace,monospace';
      ctx.fillText('drag straight up to draw',B.x+8,B.y+B.h-8);
    }
  }
  // poured metal
  if(bench.poured)drawPour(B);
  ctx.fillStyle='rgba(35,29,21,.6)';ctx.font='9px ui-monospace,monospace';
  ctx.fillText(bench.torn?'MOULD TORN — KNOCK OUT AND RAM AGAIN':(bench.drawn?'DRAWN':'GREEN SAND'),B.x+6,B.y-10);
  ctx.restore();
  if(shakeAmp>0)shakeAmp*=0.9;
}
function renderSand(B){
  sandCanvas.width=GW*4;sandCanvas.height=GH*4;
  var c=sandCtx;c.clearRect(0,0,sandCanvas.width,sandCanvas.height);
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var v=sand[sIdx(x,y)];if(v<=0)continue;
    var lum=0.30+v*0.42;
    var r=Math.round(78*lum*1.3),g2=Math.round(83*lum*1.35),b=Math.round(68*lum*1.25);
    c.fillStyle='rgb('+r+','+g2+','+b+')';
    c.fillRect(x*4,y*4,4,4);
    if(((x*7+y*13)%5)===0){c.fillStyle='rgba(0,0,0,0.16)';c.fillRect(x*4+((x*3)%3),y*4+((y*5)%3),1.4,1.4);}
    if(v>0.72&&((x+y)%7===0)){c.fillStyle='rgba(255,255,255,0.10)';c.fillRect(x*4+1,y*4+1,2,1);}
  }
  // bright struck-off face
  for(var xx=0;xx<GW;xx++){for(var yy=0;yy<GH;yy++){
    if(sand[sIdx(xx,yy)]>0){c.fillStyle='rgba(226,222,200,0.22)';c.fillRect(xx*4,yy*4,4,2);break;}}}
}
function drawPour(B){
  var cw=B.w/GW,ch=B.h/GH;
  ctx.save();
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    if(sand[sIdx(x,y)]>0)continue;
    if(y<STRIKE)continue;
    ctx.fillStyle='#7d766c';
    ctx.fillRect(B.x+x*cw,B.y+y*ch,cw+0.5,ch+0.5);}
  if(bench.cut){
    bench.voids.forEach(function(v){
      ctx.fillStyle='#241f19';
      ctx.beginPath();ctx.ellipse(B.x+v.x*cw,B.y+v.y*ch,v.r*cw,v.r*ch,0,0,7);ctx.fill();});
    bench.cracks.forEach(function(cr){
      ctx.strokeStyle='#241f19';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(B.x+cr.x0*cw,B.y+cr.y*ch);
      ctx.lineTo(B.x+cr.x1*cw,B.y+(cr.y+1.6)*ch);ctx.stroke();});
  }
  ctx.restore();
}

/* ---------------- cavity / draw evaluation ---------------- */
function buryPattern(){
  var p=bench.p,B=sandRect;
  var cw=B.w/GW,ch=B.h/GH;
  var pr=profile(p),Hm=totalH(p),mw=0;
  for(var i=0;i<pr.length;i++)mw=Math.max(mw,pr[i].w0,pr[i].w1);
  var psc=Math.min((B.w*0.62)/mw,(B.h*0.75)/Hm);
  bench.boxScale=psc;
  var pcx=B.x+B.w*0.5, partLine=B.y+STRIKE*ch, by=partLine;
  // clear cells occupied by the drag half of the pattern (below parting)
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var wx=B.x+x*cw+cw/2, wy=B.y+y*ch+ch/2;
    if(insidePattern(p,pr,pcx,by,psc,wx,wy,true))sand[sIdx(x,y)]=-1;}
  sandDirty=true;
}
function insidePattern(p,pr,cx,base,sc,wx,wy,dragOnly){
  var mmY=(base-wy)/sc;
  if(mmY<0)return false;
  for(var i=0;i<pr.length;i++){var s=pr[i];
    if(dragOnly&&s.idx>=p.partIdx)continue;
    if(mmY>=s.y0&&mmY<=s.y1){
      var f=(mmY-s.y0)/Math.max(0.001,(s.y1-s.y0));
      var w=s.w0+(s.w1-s.w0)*f;
      var ox=cx+s.off*sc;
      if(Math.abs(wx-ox)<=w*sc/2)return true;
      if(p.loose&&p.loose.pinned&&mmY>=p.loose.y&&mmY<=p.loose.y+p.loose.h){
        if(wx-ox>0&&wx-ox<=(w/2+p.loose.proj)*sc)return true;}
      return false;}}
  return false;}
function evaluateDraw(){
  var p=bench.p,pr=profile(p);
  var bad=[];
  for(var i=0;i<pr.length;i++){var s=pr[i];
    if(s.idx>=p.partIdx)continue;
    var eff=s.draft + (p.rap>0?Math.min(0.35,p.rap*0.6):0);
    if(eff<1.0)bad.push({s:s,sev:Math.max(0.2,(1.0-eff))});}
  if(p.loose&&p.loose.pinned)bad.push({s:null,sev:2.2,loose:true});
  if(!bad.length)return null;
  // density helps a little, rapping helps a little; an undercut never does
  var dens=0,n=0;
  for(var q=0;q<sand.length;q++)if(sand[q]>0){dens+=sand[q];n++;}
  dens=n?dens/n:0.4;
  var worst=0;bad.forEach(function(b){worst=Math.max(worst,b.sev);});
  var help=Math.min(0.45,(dens-0.4)*0.7)+Math.min(0.25,p.rap*0.9);
  var prob=Math.min(0.99,worst-help);
  if(bad.some(function(b){return b.loose;}))prob=1;
  return (Math.random()<prob)?bad:null;
}
function tearMould(bad){
  var B=sandRect,cw=B.w/GW,ch=B.h/GH,p=bench.p;
  var pr=profile(p),lost=0;
  var pcx=bench.boxCx||(B.x+B.w*0.5), base=B.y+STRIKE*ch, psc=bench.boxScale||1;
  bad.forEach(function(b){
    var y0,y1;
    if(b.loose){y0=p.loose.y;y1=p.loose.y+p.loose.h;}
    else{y0=b.s.y0;y1=b.s.y1;}
    for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
      var i=sIdx(x,y);if(sand[i]<=0)continue;
      var wy=B.y+y*ch+ch/2, mmY=(base-wy)/psc;
      if(mmY<y0-4||mmY>y1+4)continue;
      var wx=B.x+x*cw+cw/2;
      // distance out from the pattern edge
      var seg=null;for(var k=0;k<pr.length;k++)if(mmY>=pr[k].y0&&mmY<=pr[k].y1){seg=pr[k];break;}
      if(!seg)continue;
      var f=(mmY-seg.y0)/Math.max(0.001,seg.y1-seg.y0);
      var w=(seg.w0+(seg.w1-seg.w0)*f)*psc/2;
      var dx=Math.abs(wx-(pcx+seg.off*psc));
      if(dx>w-1&&dx<w+ (b.loose? p.loose.proj*psc+16 : 14)){sand[i]=0;lost++;}
    }});
  fallFrames=70;sandDirty=true;
  crumble(lost);
  bench.torn=true;tally.tore++;save.tally=tally;persist();
  if(bad.some(function(b){return b.loose;}))
    say('loose','That is the loose piece fighting the sand. It draws negative — pull the pin and take it out sideways first, then lift. That is what the striped seat is for and it is why the seat is painted at all.');
  else
    say('*draftfail','Torn. That face is under a degree and it will tear every time it is drawn; sanding it will not put draft on it and nobody should try. Ram it again.',true);
  return lost;}
function doDraw(){
  var bad=evaluateDraw();
  if(bad){tearMould(bad);bench.drawn=false;bench.place='bench';bench.patY=0;return;}
  // clean: pattern cells become cavity
  for(var i=0;i<sand.length;i++)if(sand[i]<0)sand[i]=0;
  bench.drawn=true;bench.torn=false;bench.place='bench';bench.patY=0;
  tally.clean++;save.tally=tally;persist();sandDirty=true;
  knock(costing(bench.p).kg||3,0.6);
  say('*clean','Drew clean. That is a mould I can put a price against.',true);
  updateCard();}

/* rapping: cumulative and permanent */
function doRap(){
  var p=bench.p;
  p.rap=(p.rap||0)+0.028+Math.random()*0.012;
  save.rap[p.id]=p.rap;persist();
  knock(costing(p).kg||3,0.9);
  sandDirty=true;updateCard();
  if(p.rap>0.14&&!SAID['rapnote']){
    say('rapnote','That parting is 0.'+String(Math.round(p.rap*1000)).padStart(3,'0')+' of a millimetre wide of where it started and it is not coming back. Every casting off it carries that metal and I am paying for it at 0.68 the kilo.');
    revise(5);}
}

/* pouring: a cooling model over section thickness */
function pour(){
  if(!bench.drawn||bench.torn)return;
  var p=bench.p,pr=profile(p),B=sandRect,cw=B.w/GW,ch=B.h/GH;
  bench.poured=true;bench.cut=false;bench.voids=[];bench.cracks=[];
  var psc=bench.boxScale||1, base=B.y+STRIKE*ch, pcx=bench.boxCx||(B.x+B.w*0.5);
  // freeze times over the buried sections
  var bands=[];
  for(var i=0;i<pr.length;i++){var s=pr[i];if(s.idx>=p.partIdx)continue;
    if(s.kind==='print')continue;
    var wavg=(s.w0+s.w1)/2;
    bands.push({y:(s.y0+s.y1)/2,w:wavg,t:wavg*wavg/1000,seg:s,idx:s.idx});}
  // riser feeds from the parting downward; a thin band above a heavy one cuts the feed
  for(var b=0;b<bands.length;b++){
    var below=bands[b];
    for(var a=b+1;a<bands.length;a++){
      if(bands[a].t<below.t*0.55){ // thin web above a heavy section
        var vol=(below.w-bands[a].w)*0.02;
        bench.voids.push({x:(pcx-B.x)/cw,y:(base-below.y*psc-B.y)/ch,r:Math.max(1.2,vol*0.5)});
        if(!SAID['void'])say('void','Thin web over a heavy boss. The web freezes first, cuts the feed, and leaves a shrinkage cavity in the boss that no one sees until the machine shop opens the face. That is scrap I have not priced.');
        break;}}}
  // sharp internal corners crack
  for(var q=1;q<pr.length;q++){
    if(pr[q].idx>=p.partIdx)continue;
    if((pr[q].fil||0)<3 && Math.abs(pr[q].w0-pr[q-1].w1)>18){
      bench.cracks.push({x0:(pcx-B.x)/cw-4,x1:(pcx-B.x)/cw+5,y:(base-pr[q].y0*psc-B.y)/ch});
      if(!SAID['crack'])say('crack','No fillet in that corner. It cracks there as it cools, straight along the corner, and a fillet is a real dimension on the drawing and not a nicety.');}}
  if(p.core&&!p.core.vent&&!SAID['blown']){
    bench.voids.push({x:(pcx-B.x)/cw,y:(base-totalH(p)*0.4*psc-B.y)/ch,r:3.4});
    say('blown','No vent path in that core. Nothing will tell you. It blows, and the bore comes up full of holes at the machine shop, and the first anyone hears of it is a rejection note.');}
  crumble(40);updateCard();}

/* ---------------- job card ---------------- */
var cardEl=document.getElementById('card');
function updateCard(){
  var p=bench.p;
  if(mode!=='bench'||!p){cardEl.style.display='none';return;}
  cardEl.style.display='block';
  var c=costing(p),sl=slotOf(p.id);
  var mism=(sl>=0&&SLOTNO[sl]!==p.homeNo);
  var rows='';
  function row(a,b,cls){rows+='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+a+'</td><td>'+b+'</td></tr>';}
  row('PATTERN VOL','&nbsp;'+(c.v.pattern/1e6).toFixed(3)+' L');
  if(c.v.core)row('LESS CORE','−'+(c.v.core/1e6).toFixed(3)+' L');
  if(c.v.print)row('PRINTS (no metal)','&nbsp;'+(c.v.print/1e6).toFixed(3)+' L');
  row('SHRINK '+(c.m.c*100).toFixed(1)+'%','÷ '+Math.pow(1+c.m.c,3).toFixed(3));
  row('CASTING','&nbsp;'+c.L.toFixed(3)+' L');
  row(c.m.name+' @'+c.m.rho.toFixed(2),'&nbsp;'+c.kg.toFixed(2)+' kg');
  if(p.rap>0.002)row('RAP ALLOWANCE','+'+(p.rap).toFixed(3)+' mm');
  rows+='<tr><td colspan="2" style="height:4px"></td></tr>';
  row('METAL 0.68/kg',c.metalCost.toFixed(2));
  row('MOULDING '+c.mins.toFixed(1)+' min',c.mould.toFixed(2));
  row('CORE',c.cores.toFixed(2));
  row('FETTLING',c.fettle.toFixed(2));
  row('EACH',c.each.toFixed(2),'tot');
  row('× '+(p.qty||0)+' OFF','<b>'+c.total.toFixed(0)+' mk</b>','tot');
  var head='<div style="font-weight:700;letter-spacing:.05em">'+(p.card||'NO CARD WIRED ON')+'</div>'+
   '<div style="font-size:10px;margin-bottom:4px">'+p.name+'</div>'+
   '<div style="font-size:9.5px;'+(mism?'color:#a83224':'')+'">CARD SAYS '+p.homeNo+
   ' · SHELF SAYS '+(sl>=0?SLOTNO[sl]:'IN HAND')+'</div>';
  var foot='';
  if(!p.metalKnown)foot+='<div class="warn" style="font-size:9.5px;margin-top:4px">METAL NOT STATED ON FILE — figure is provisional</div>';
  if(p.madeOffCasting)foot+='<div style="font-size:9.5px;margin-top:3px">pattern taken off a finished casting</div>';
  if(p.step)foot+='<div style="font-size:9.5px;margin-top:3px">halves close '+p.step.toFixed(1)+' mm out of true</div>';
  cardEl.innerHTML=head+'<table>'+rows+'</table>'+foot;
}

/* ---------------- measuring ---------------- */
function readMeasure(m){
  var sc=bench.scale||1;
  var dx=(m.x1-m.x0)/sc, dy=(m.y1-m.y0)/sc;
  var mm=Math.sqrt(dx*dx+dy*dy);
  var reading=mm/(1+bench.ruleC);
  var names={0:'ordinary rule','0.01':'iron rule','0.015':'brass rule','0.013':'alu rule'};
  var nm=names[String(bench.ruleC)]||'rule';
  var cast=mm/(1+METAL[bench.p.metal].c);
  bench.reading=reading.toFixed(1)+' mm on the '+nm;
  document.getElementById('readout').textContent=
    bench.reading+'  ·  casting will be '+cast.toFixed(1)+' mm';
  // the housing arithmetic falls out
  if(bench.p.id==='PH4'&&bench.ruleC===0.010&&mm>200&&mm<260){revise(2);}
  if(bench.p.id==='PH4'&&bench.ruleC===0&&mm>200&&mm<260&&!SAID['ordinary']){
    say('ordinary','That is the ordinary rule and it is not measuring anything anybody wants. Take the iron rule to it.');}
  ruleSlide();}

/* ---------------- input ---------------- */
var drag=null;
function pos(e){var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;return {x:t.clientX-r.left,y:t.clientY-r.top};}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var q=pos(e);
  if(mode==='rack'){drag={mode:'pan',x:q.x,y:q.y,ox:cam.x,oy:cam.y,moved:0,sx:q.x,sy:q.y};}
  else benchDown(q);});
cv.addEventListener('pointermove',function(e){
  var q=pos(e);
  if(!drag)return;
  if(drag.mode==='pan'){
    cam.x=clamp(drag.ox-(q.x-drag.x),0,Math.max(0,world.w-W));
    cam.y=clamp(drag.oy-(q.y-drag.y),-20,Math.max(0,world.h-H+40));
    drag.moved+=Math.abs(q.x-drag.sx)+Math.abs(q.y-drag.sy);drag.sx=q.x;drag.sy=q.y;
  } else benchMove(q);});
function up(e){var q=drag?null:null;
  if(drag&&drag.mode==='pan'&&drag.moved<8){rackTap(pos(e));}
  else if(drag&&mode==='bench')benchUp(pos(e));
  drag=null;hissOff();}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',function(){drag=null;hissOff();});
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

function rackTap(q){
  var wx=q.x+cam.x, wy=q.y+cam.y;
  for(var i=0;i<NSLOT;i++){
    var R=slotRect(i);
    if(wx>=R.x&&wx<=R.x+R.w&&wy>=R.y&&wy<=R.y+R.h+22){
      if(inHand){
        if(slots[i]===null){
          var from=slotOf(inHand);
          if(from>=0)slots[from]=null;
          slots[i]=inHand;storeSlots();chalkSqueak();
          var p=byId[inHand];
          if(SLOTNO[i]!==p.homeNo){
            say('chalk2','There. I have stood it back one along from where it came out and the lip still reads the old number. That is exactly how a pattern gets lost and it took about four seconds. Somebody chalk the pattern.');
            say('chalk3','Third time I have said it this morning: put the number on the pattern. The lip is a shelf. The shelf does not move. The pattern does.');
          }
          inHand=null;
        }
        return;
      }
      var id=slots[i];if(!id)return;
      openBench(byId[id]);return;}}
}
function openBench(p){
  bench.p=p;bench.split=false;bench.coreOpen=false;bench.coreMade=false;
  bench.place='bench';bench.patY=0;bench.drawn=false;bench.torn=false;bench.poured=false;
  bench.cut=false;bench.voids=[];bench.cracks=[];bench.measure=null;
  mode='bench';document.getElementById('tools').style.display='flex';
  newSand();updateCard();
  var c=costing(p);knock(c.kg,Math.min(1,c.v.pattern/4e6));
  if(p.id==='PH4'){revise(1);
    say('phnote','Pump housing. This is the one. Prints at both ends, flange machined, and the only pattern in the building for it was made off a finished casting in 1958 because there is no drawing in the file.');}
  if(p.id==='BB'){say('ruoho','Bearing bracket. Ruoho built this up in about \'61 for a job that then changed twice after he had glued the wisdom pieces on, and then somebody cut half of it away again. The halves do not dowel true — there is a step of two millimetres along that edge and it casts in every time.');}
  if(p.core&&p.core.vent){say('vent','Whoever made this core box cut the vent in it. That is two minutes a core I do not have to price, and eighty cores on this order, so it is worth having.');}
  if(p.id==='FB'){say('fbnote','Follow board. Nothing on it has draft because nothing on it is meant to draw — it is there to hold the pattern while the drag is rammed. Try to lift it out of green sand and it will tear every face.');}
}
function benchDown(q){
  var L=bench.L||benchLayout();
  var inBox=q.x>=sandRect.x&&q.x<=sandRect.x+sandRect.w&&q.y>=sandRect.y&&q.y<=sandRect.y+sandRect.h;
  var cw=sandRect.w/GW,ch=sandRect.h/GH;
  if(bench.tool==='ram'&&inBox&&!bench.drawn){
    ram(Math.floor((q.x-sandRect.x)/cw),Math.floor((q.y-sandRect.y)/ch),1);
    knock(2,0.4);drag={mode:'ram'};return;}
  if(bench.tool==='strike'&&inBox){hissOn();drag={mode:'strike',lx:q.x,t:Date.now()};return;}
  if(bench.tool==='hand'&&bench.place==='box'&&!bench.drawn){
    drag={mode:'lift',y0:q.y,base:bench.patY};return;}
  if((bench.tool==='rule')&&bench.place==='bench'){
    bench.measure={x0:q.x,y0:q.y,x1:q.x,y1:q.y};drag={mode:'rule'};return;}
  if(bench.tool==='bevel'&&bench.place==='bench'){
    // read the draft off the nearest face
    var p=bench.p,pr=profile(p),sc=bench.scale,base=bench.base;
    var mmY=(base-q.y)/sc;var best=null;
    for(var i=0;i<pr.length;i++)if(mmY>=pr[i].y0&&mmY<=pr[i].y1)best=pr[i];
    if(best){bench.bevel={x:q.x,y:q.y};
      var d=best.draft;
      document.getElementById('readout').textContent=
        'draft '+d.toFixed(1)+'° on that face'+(d<1?' — that will tear':'')+
        (best.kind==='print'?'  · core print':'')+(best.kind==='mach'?'  · +'+(best.seg.mach||3)+' mm machining stock':'');
      click();}
    drag={mode:'bevel'};return;}
  drag={mode:'idle'};}
function benchMove(q){
  if(!drag)return;
  var cw=sandRect.w/GW,ch=sandRect.h/GH;
  if(drag.mode==='ram'){
    var inBox=q.x>=sandRect.x&&q.x<=sandRect.x+sandRect.w&&q.y>=sandRect.y&&q.y<=sandRect.y+sandRect.h;
    if(inBox)ram(Math.floor((q.x-sandRect.x)/cw),Math.floor((q.y-sandRect.y)/ch),0.5);}
  else if(drag.mode==='strike'){
    var sp=Math.abs(q.x-drag.lx)/Math.max(16,(Date.now()-drag.t));drag.lx=q.x;drag.t=Date.now();
    hissSet(sp*30);
    var col=Math.floor((q.x-sandRect.x)/cw);
    for(var y=0;y<STRIKE;y++)for(var dx=-2;dx<=2;dx++){
      var x=col+dx;if(x<0||x>=GW)continue;sand[sIdx(x,y)]=0;}
    sandDirty=true;}
  else if(drag.mode==='lift'){
    bench.patY=Math.min(0,drag.base+(q.y-drag.y0));
    if(bench.patY<-14){doDraw();drag=null;}}
  else if(drag.mode==='rule'&&bench.measure){
    bench.measure.x1=q.x;bench.measure.y1=q.y;}
}
function benchUp(q){
  if(drag&&drag.mode==='rule'&&bench.measure)readMeasure(bench.measure);
  if(drag&&drag.mode==='strike'){
    var full=true;for(var x=0;x<GW;x++)if(sand[sIdx(x,STRIKE-1)]>0){full=false;break;}
    if(full&&!bench.struck){bench.struck=true;tally.ram++;save.tally=tally;persist();
      say('*struck','Struck off level. That is one rammed.',true);}}
}

/* ---------------- buttons ---------------- */
function setTool(t,c){bench.tool=t;if(c!==undefined)bench.ruleC=c;
  document.querySelectorAll('#tools button').forEach(function(b){b.classList.remove('on');});
  if(t==='rule'){document.querySelectorAll('.rule').forEach(function(b){
    if(parseFloat(b.dataset.c)===c)b.classList.add('on');});}
  if(t==='bevel')document.getElementById('btnBevel').classList.add('on');
  if(t==='ram')document.getElementById('btnRam').classList.add('on');
  if(t==='strike')document.getElementById('btnStrike').classList.add('on');
  if(t==='hand')document.getElementById('btnHand').classList.add('on');
  if(t==='rap')document.getElementById('btnRap').classList.add('on');}
document.querySelectorAll('.rule').forEach(function(b){
  b.onclick=function(){setTool('rule',parseFloat(b.dataset.c));ruleSlide();};});
document.getElementById('btnBevel').onclick=function(){setTool('bevel');};
document.getElementById('btnRam').onclick=function(){setTool('ram');};
document.getElementById('btnStrike').onclick=function(){setTool('strike');};
document.getElementById('btnHand').onclick=function(){setTool('hand');};
document.getElementById('btnRap').onclick=function(){doRap();};
document.getElementById('btnSplit').onclick=function(){
  if(!bench.p)return;bench.split=!bench.split;click();
  if(bench.split&&bench.p.step&&!SAID['stepnote'])
    say('stepnote','The dowels are not symmetrical, which is right — you cannot close these halves the wrong way round. They still close two millimetres out of true and that step goes into every mould.');
  if(bench.split&&!bench.p.step&&!SAID['dowel'])
    say('dowel','Two dowels, off centre on purpose, so the halves cannot go together wrong. Nobody would notice until the casting came off offset and by then there are forty of them.');};
document.getElementById('btnCore').onclick=function(){
  var p=bench.p;if(!p||!p.core){say('*nocore','No core box with this one. It is solid where it looks solid.',true);return;}
  if(!bench.coreOpen){bench.coreOpen=true;click();}
  else if(!bench.coreMade){bench.coreMade=true;knock(1.4,0.5);
    revise(3);
    var printVol=volumes(p).print;
    var coreMass=(Math.PI*Math.pow(p.core.dia/2,2)*p.core.len)/1e6*1.6;
    if(printVol/1e6 < coreMass*0.02)
      say('printsmall','Those prints are small for the weight of that core. If it will not sit and vent, it is a chaplet, and a chaplet is another operation I have to price.');
  } else {bench.coreOpen=false;bench.coreMade=false;}};
document.getElementById('btnLoose').onclick=function(){
  var p=bench.p;if(!p||!p.loose){document.getElementById('readout').textContent='no loose piece on this pattern';return;}
  p.loose.pinned=!p.loose.pinned;click();
  document.getElementById('readout').textContent=p.loose.pinned?'loose piece pinned in':'loose piece out — draw the body first';};
document.getElementById('btnSet').onclick=function(){
  if(!bench.p)return;
  if(bench.place==='bench'){bench.place='box';bench.patY=0;bench.drawn=false;
    bench.poured=false;bench.cut=false;bench.struck=false;newSand();buryPattern();setTool('ram');
    knock(costing(bench.p).kg,0.7);
    if(!SAID['setnote'])say('setnote','Set to the parting, which wants to be at the widest section so both halves draw with the most taper and the fewest loose pieces. Ram it, strike it off, then lift it straight up.');}
  else{bench.place='bench';for(var i=0;i<sand.length;i++)if(sand[i]<0)sand[i]=0.34;sandDirty=true;}};
document.getElementById('btnKnock').onclick=function(){
  newSand();bench.drawn=false;bench.torn=false;bench.poured=false;bench.cut=false;
  bench.place='bench';bench.patY=0;bench.struck=false;crumble(120);};
document.getElementById('btnPour').onclick=function(){
  if(!bench.drawn||bench.torn){document.getElementById('readout').textContent='nothing to pour into';return;}
  pour();document.getElementById('readout').textContent='poured — let it go solid, then cut the faces';};
document.getElementById('btnCut').onclick=function(){
  if(!bench.poured){document.getElementById('readout').textContent='nothing cast yet';return;}
  bench.cut=true;
  var p=bench.p,c=costing(p);
  var dim=0,pr=profile(p);for(var i=0;i<pr.length;i++)dim=Math.max(dim,pr[i].w0,pr[i].w1);
  var castDim=dim/(1+METAL[p.metal].c);
  var mach=0;p.segs.forEach(function(s){if(s.mach)mach=Math.max(mach,s.mach);});
  document.getElementById('readout').textContent=
    'casting across the flange '+castDim.toFixed(1)+' mm, less '+mach+' mm stock each face when machined';
  if(p.id==='PH4'&&!SAID['short']){
    say('short','And there it is on the bench in front of me: 233.7 across, and the print wants 236 finished. One shrinkage short, permanent, and it cannot be sanded in because it is under size and not over. Someone puts a pattern on this and the next casting is short by two.');
    revise(4);
    say('mann2','Manninen wrote "as before" on the 1958 card. As before what. I am taking this down to the moulders at eleven and I will price it as grey iron with the shrink put back, and I will write the metal on the card myself, because a quote with no metal written on it is not a quote.');}
  updateCard();};
document.getElementById('btnBack').onclick=function(){
  inHand=bench.p?bench.p.id:null;mode='rack';
  document.getElementById('tools').style.display='none';cardEl.style.display='none';
  bench.p=null;};

/* ---------------- loop ---------------- */
function frame(){
  if(fallFrames>0){sandFall();fallFrames--;}
  if(mode==='rack')drawRack();else drawBench();
  requestAnimationFrame(frame);}
resize();frame();
setTool('hand');

/* 1958 card, as filed */
console.log('%cJ-2210 / 40 OFF PUMP HOUSING 4in / MANNINEN 11.iii.58','font:12px monospace');
console.log('metal: as before. pattern: as before. price: as before. — this is the entire card.');
</script>
