  <meta name="outbox-spec-era" content="Mid-March 1966, right now — a quarter past nine on a cold clear morning in the weighing room of a public grain elevator on a branch line in Kiowa County, Colorado, where the first truck of the morning has just come off the scale and the moisture tester is reading high. The page is not a look-back, not a lament, not a vanished-prairie memory: there are eleven trucks expected before noon, the railroad has promised four hopper cars for Friday and delivered two, and the grader who does the official work is in Lamar until Tuesday.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SINGLE PARAGRAPH OF TEXT THAT REFUSES TO STAY THE SAME LENGTH, and the only thing the visitor can do to it is SQUEEZE IT. No header, no menu, no title, no scrollbar, no site chrome, no links, no buttons, no scroll of any kind at any window size. The paragraph is a working description of the load currently on the scale — what it weighs, what it tests, what it is docked, what it is worth — and it is set at whatever length the frame currently permits, which the visitor controls by DRAGGING THE LEFT AND RIGHT EDGES OF THE PAGE INWARD AND OUTWARD with the mouse. Squeezing the frame narrower does not wrap the text and does not shrink the type: the paragraph REWRITES ITSELF SHORTER, dropping subordinate clauses, then qualifiers, then units, then whole facts, in a fixed order the engine knows and the visitor does not, until at the narrowest setting the entire page is four words wide and says almost nothing. Widening it again makes it grow back — but not identically, because every clause the visitor has crushed out carries a real damage value and the ones crushed most often come back shorter, blunter and eventually not at all. The strangeness: THE NUMBERS CHANGE WHEN THE SENTENCE SHORTENS. A bushel weight given as 57.4 at full width is 57 at three-quarters and 'light' at half and absent below that, and the page never once acknowledges that this is happening. There is no reset, no full-width button, no memory of the original wording shown anywhere, and the visitor cannot type.">
  <meta name="outbox-spec-subject" content="The flat arithmetic of grading and docking a truckload of wheat at the scale, which is almost entirely a moisture-and-test-weight problem and has nothing whatsoever to do with how the grain looks. That the whole transaction is three numbers taken in about ninety seconds — gross weight, test weight, moisture — and every dollar in the settlement comes out of those three and nothing else. That TEST WEIGHT IS NOT A QUALITY, IT IS A PACKING DENSITY: pounds per Winchester bushel, measured by filling a quart kettle from a fixed drop height and striking it off with three zigzag strokes of a stick, and the drop height and the striking are not fussiness — a kettle filled from six inches higher packs measurably tighter and reads nearly half a pound heavier, which is a grade. That 60 pounds is the standard for hard red winter and 58 is the line between No. 1 and No. 2, so half a pound of packing error moves a whole load across a grade line and costs real money in either direction, and this is why the striking stick is chained to the bench. That the bushel is legally a WEIGHT and not a volume anywhere money changes hands — 60 pounds is a bushel whether it fills the kettle or not — so the test weight figure never divides into the settlement and every farmer who assumes it does is wrong, and the reason nobody corrects them is that it takes four minutes. That MOISTURE IS THE ENTIRE FIGHT: wheat is bought and stored at 13.5 percent and above that it will not keep, because grain respires and mold grows on a curve that is not linear at all — 13.5 is indefinite in a cool bin, 15 is a matter of weeks, 17 will heat and go out of condition in a hot bin in days, and the smell of a bin going out is the one thing in the business nobody has to be taught twice. That the shrink arithmetic is honest and is not a penalty: drying 1000 bushels from 15.0 to 13.5 removes real water and leaves fewer real pounds, so the dock is computed as the actual weight of water removed plus a handling factor, and a house that docks by a flat table instead of by the arithmetic is either giving grain away or stealing it, always in the same direction. That the moisture tester is a capacitance meter reading dielectric constant and it is reading the WATER, not the wheat, which is why it must be temperature-corrected — a sample straight off a truck that sat in the sun reads high by real tenths and a frozen sample reads low, and the correction chart is on the wall and gets used about half the time. That the sample is the whole risk: a load is graded off about a quart taken with a probe from five places in a truck holding 400 bushels, and grain STRATIFIES — the fines, the shrunken kernels and the dockage migrate to the center of the spout stream and pack down the middle of the load, so a probe taken only at the corners reads a different grade than the load actually is, and the difference is worth more than anybody's honesty. That DOCKAGE is anything the sieves take out that isn't wheat — chaff, weed seed, dirt, cheat — and it is deducted by weight before anything else is computed, so it comes off the top of the gross and every subsequent percentage is figured on the remainder. That the No. 1 sieve for hard red winter has 0.064 by 3/8 inch slots and a kernel that goes through it is shrunken wheat, which is a different deduction from dockage entirely. That protein is not tested at this house because the equipment is $1,900 and the branch line does not pay a protein premium, so a load of 14-percent milling wheat leaves here at the same price as a load of 11, which everybody knows and nobody can do anything about. That SMUT AND GARLIC ARE INSTANT: a load carrying garlicky bulblets is graded Garlicky regardless of everything else and goes into a separate bin or it contaminates 30,000 bushels, and the test is putting your nose in the pan. That the official grade certificate can only be issued by a licensed inspector and the man here is not one, so every number written on the scale ticket is 'unofficial' in the exact legal sense and binds nobody, and it is what the settlement is paid on. And the flat arithmetic on the bench: two hopper cars promised against four needed, bin 3 at 14.8 and rising, a house that holds 180,000 bushels and is at 141,000 this morning, and eleven trucks before noon.">
  <meta name="outbox-spec-tone" content="The rapid, correcting, figure-first voice of Lurleen Abshagen-Pratt, 43, who has weighed, probed and ticketed at this house for nine years and who is talking across the scale bench to the driver while she works, and who cannot say a number without saying what it is a number OF. She does not narrate, does not reflect, does not address the visitor at all — she is telling a man in a hat what his load did. She revises her own figure three separate times inside the page and says flatly each time what she had wrong: once because the sample came off a truck bed that had been in the sun since seven and she had not corrected for temperature, once because she probed four places instead of five and the fifth came back a full point different, once because she read the dockage percentage against the gross instead of against the net. She is specifically and repeatedly aggrieved about exactly one thing — that bin 3 is sitting at 14.8 and has been climbing for six days, and the two hopper cars that came Friday will not empty it, and she has told the manager twice — and she says it three times, once with a date. She is proud of exactly one thing and says it twice: that nothing has gone out of condition in this house since she took the bench, and she gives the month and the year. She calls the driver 'you' throughout and by name exactly once. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT a craftsman-sage, NOT a woman-in-a-man's-trade arc, NOT charmed by herself, NOT the competent-tradesperson-saying-every-figure-twice voice, and NOT aware of being read.">

  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the text's own weight is COMPUTED and never chosen. The ground is the weighing room's beadboard wall in a dried-out institutional buff that has gone grey-green where the stove is (#cdbf9a), dirtier and darker along the bench line where forearms and grain dust have worked at it for forty years (#a2946f), with a lighter unfaded rectangle where the state license used to hang. The paragraph is set in worn scale-ticket typewriter black (#1f1c17), and its rendering is honest to how many times each clause has been crushed: every clause stores a real damage count, and above a threshold it renders measurably lighter and looser-fitted, with individual characters dropped out where the damage crossed further thresholds, going finally to a rubbed grain-dust grey (#7d7460) before it stops coming back at all. Clauses that have never been squeezed render crisp and dense and are visibly a different colour from their neighbours, and nothing on the page says so. Exactly one chip of grade-stamp red (#b5301f) is held strictly for three things: the moisture figure wherever it currently appears, the word DOCKAGE, and the word UNOFFICIAL. It never appears in the wall, never in ordinary text, never in a weight. Flat, hard, high contrast at full width and honestly worn wherever the frame has been squeezed; no glow, no bloom, no soft focus, no fade-to-transparent, no vignette, no gradients other than honest per-clause damage.">
  <meta name="outbox-spec-wildcard" content="There is a clause in the paragraph that describes a load of milo. There has been no milo through this house since 1961 — the clause is in the tree because the description was built off the previous weigher's ticket wording and nobody edited it out. The engine treats it exactly like every other clause: it has a priority rank, it takes damage, it degrades through its stages, it drops out at the same widths as its neighbours, and it comes back when the frame widens. Lurleen never mentions it, never corrects it, and it is never flagged, marked, greyed or distinguished in any way. It is in the same position in the tree on every visit.">
  <meta name="outbox-spec-forbidden" content="NO grain-as-metaphor for anything — not abundance, not harvest, not what we store against winter, not sifting, not chaff-and-wheat, not 'the weight of a thing'; this is 57.4 pounds per Winchester bushel at 14.8 percent and it has nothing to teach anybody. ABSOLUTELY NO prairie Americana: no big sky, no amber waves, no Grant Wood, no Willa Cather, no Steinbeck, no Dust Bowl imported as memory or subtext, no homesteader hardship, no farm-crisis pathos, no the-land-and-the-people, no Terrence Malick, no golden-light-over-the-fields writing, no explaining Colorado or the High Plains to anybody, no dialect spelling, no aren't-they-plainspoken condescension. NO agrarian sentiment of any kind: no feeding-the-world, no honest-work sermon, no dignity-of-labour framing, no invisible-infrastructure essay, no awe at logistics, no 'somebody has to know these numbers'. NO food writing whatsoever: nothing about bread, nothing about what wheat becomes, no from-field-to-table framing, no sensuous writing about kernels, dust or grain smell beyond what a load going out of condition actually smells like stated flatly once. NO nostalgia, NO wistfulness, NO 'the country elevators are all gone now / the branch line was pulled up in 1979 / the last of the independent houses' decline narrative, NO foreshadowing past Friday, NO hindsight of any kind. NO craftsman-sage register, NO 'the old weighmen could call a grade by hand', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc, NO wise-absent-grader — he is in Lamar until Tuesday and that is all. NO woman-in-a-man's-trade arc, NO proving-herself, NO sexist-driver sketch, NO small-town-characters ensemble. NO commodity-market drama, NO futures-and-speculation subplot, NO the-farmer-gets-cheated exposé, NO capitalism sermon, NO corporate-versus-family framing, NO USDA or bureaucratic satire, NO bureaucratic-absurd, NO committee-minutes, NO department-of-X, NO Kafka, NO parody of officialese — the unofficial certificate is a legal fact stated once. NO 1966-as-period-signifier: no Vietnam, no Cold War drift, no civil-rights subtext, no sixties-as-era, no retro-kitsch, no camp, no ironic affection for beam scales, brass kettles or typewritten tickets. NO measurement-as-philosophy, NO precision-as-virtue essay, NO 'what does it mean to weigh a thing', NO metrology reverie. NO experimental-literature framing of the shrinking text: no Oulipo, no erasure poetry, no found-poem preciousness, no 'what remains speaks louder', no redaction allegory, no compression-as-metaphor for memory or loss or language, no writing-about-writing, no meta commentary on the paragraph's own behaviour, no winking at the reader, no the-page-is-aware-of-itself. NO entropy sermon, NO 'everything gets shorter in the end'. NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page explains nothing and there is no help text anywhere. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the squeezing or the elevator noise. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the clauses that never come back, the milo, or the paragraph that can be permanently ruined — nothing here is wrong. NO archival / museum / cabinet / drawer / ledger / registry / found-document / relic framing of the ticket or the text, despite it being a degrading written record — it was typed nine minutes ago and the driver is waiting for it. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is a quarter past nine in the morning with the stove going and a truck on the scale. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

var byId = {};
for (var i=0;i<CL.length;i++){ CL[i].k = i; byId[CL[i].id] = CL[i]; }
var ORDERED = CL.slice().sort(function(a,b){ return a.p - b.p || a.k - b.k; });

/* ---------- persistence, forward only ---------- */
var KEY = "outbox.scale.41.v1";
var st = { dmg:{}, squeezes:0, words:0, chars:0, narrow:9999 };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) {
    var o = JSON.parse(raw);
    if (o && typeof o === "object") {
      st.dmg = o.dmg || {};
      st.squeezes = o.squeezes|0;
      st.words = o.words|0;
      st.chars = o.chars|0;
      st.narrow = (typeof o.narrow === "number") ? o.narrow : 9999;
    }
  }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
function dmg(id){ return st.dmg[id]|0; }

/* ---------- number staging ---------- */
function numStage(frac){
  if (frac >= 0.86) return 0;
  if (frac >= 0.70) return 1;
  if (frac >= 0.54) return 2;
  if (frac >= 0.36) return 3;
  return 4;
}
function numStr(k, stage){
  var a = NUM[k];
  if (!a) return "";
  return a[Math.min(stage, a.length-1)] || "";
}

/* ---------- clause text at a given stage / damage ---------- */
function tidy(t){
  t = t.replace(/«\s*»/g, "");
  t = t.replace(/ {2,}/g, " ");
  t = t.replace(/\s+([,.;:])/g, "$1");
  t = t.replace(/,\s*\./g, ".");
  t = t.replace(/,\s*,/g, ",");
  t = t.replace(/:\s*\./g, ".");
  t = t.replace(/ {2,}/g, " ");
  t = t.replace(/^[\s,;:]+/, "");
  return t.trim();
}
function marked(c, stage){
  var d = dmg(c.id);
  var t = (d > 7 && c.s) ? c.s : c.f;
  t = t.replace(/%(\w+)%/g, function(m, k){ return numStr(k, stage); });
  return tidy(t);
}
function plainLen(c, stage){
  var t = marked(c, stage);
  var n = 0;
  for (var i=0;i<t.length;i++){ var ch = t.charAt(i); if (ch !== "\u00AB" && ch !== "\u00BB") n++; }
  return n;
}
function plainText(c, stage){
  return marked(c, stage).replace(/[«»]/g, "");
}

/* ---------- deterministic character dropout ---------- */
function hsh(k, n){
  var x = (k * 2654435761 + n * 40503 + 17) >>> 0;
  x ^= x >>> 13; x = (x * 1274126177) >>> 0; x ^= x >>> 16;
  return (x % 100000) / 100000;
}
function esc(ch){
  if (ch === "&") return "&amp;";
  if (ch === "<") return "&lt;";
  if (ch === ">") return "&gt;";
  return ch;
}
function clauseHTML(c, stage){
  var d = dmg(c.id);
  var cls = d === 0 ? "d0" : (d <= 3 ? "d1" : (d <= 7 ? "d2" : "d3"));
  var t = marked(c, stage);
  var rate = d >= 8 ? Math.min(0.42, (d - 7) * 0.055) : 0;
  var out = "", red = false, n = 0;
  for (var i=0;i<t.length;i++){
    var ch = t.charAt(i);
    if (ch === "\u00AB"){ out += '<span class="r">'; red = true; continue; }
    if (ch === "\u00BB"){ if(red){ out += '</span>'; red = false; } continue; }
    n++;
    if (rate > 0 && /[A-Za-z]/.test(ch) && hsh(c.k, n) < rate) out += '<span class="o">' + esc(ch) + '</span>';
    else out += esc(ch);
  }
  if (red) out += '</span>';
  return '<span class="' + cls + '">' + out + '</span>';
}

/* ---------- layout metrics ---------- */
var frame = document.getElementById("frame");
var para  = document.getElementById("para");
var tickL = document.getElementById("tick");
var meas  = document.getElementById("meas");
var edgeL = document.getElementById("edgeL");
var edgeR = document.getElementById("edgeR");

var ch = 9, fs = 14, lh = 22, maxCols = 60, rows = 20, PAD = 14, MARG = 16, MINC = 14;
var cols = null;

function metrics(){
  var w = window.innerWidth, h = window.innerHeight;
  fs = w < 460 ? 11.5 : (w < 760 ? 12.5 : (w < 1200 ? 13.5 : 14));
  lh = Math.round(fs * 1.58 * 10) / 10;
  meas.style.font = fs + "px " + getComputedStyle(document.body).fontFamily;
  meas.textContent = "MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM";
  ch = meas.getBoundingClientRect().width / 40 || (fs * 0.6);
  para.style.font = fs + "px/" + lh + "px " + getComputedStyle(document.body).fontFamily;
  tickL.style.font = fs + "px/" + lh + "px " + getComputedStyle(document.body).fontFamily;
  MARG = w < 460 ? 8 : 16;
  maxCols = Math.max(MINC + 6, Math.floor((w - 2*MARG - 2*PAD) / ch));
  var ph = h - 20 - 46;
  rows = Math.max(4, Math.floor(ph / lh));
}
function capacityFor(c){
  var frac = c / maxCols;
  var full = maxCols * rows * 0.86;
  var cap = Math.round(Math.pow(frac, 2.3) * full);
  return Math.max(16, Math.min(cap, Math.round(c * rows * 0.86)));
}

/* ---------- the fit: greedy knapsack over the tree, priority order ---------- */
function fit(c){
  var cap = capacityFor(c);
  var stage = numStage(c / maxCols);
  var chosen = {}, order = [], used = 0;
  for (var i=0;i<ORDERED.length;i++){
    var cl = ORDERED[i];
    if (dmg(cl.id) > 12) continue;
    if (cl.par){
      if (!chosen[cl.par]) continue;
      if (dmg(cl.par) > 3) continue;
    }
    var len = plainLen(cl, stage) + 1;
    if (used + len <= cap){ chosen[cl.id] = true; order.push(cl.id); used += len; }
  }
  return { chosen: chosen, stage: stage, used: used, cap: cap };
}
function eligibleCount(){
  var ok = {}, n = 0;
  for (var i=0;i<ORDERED.length;i++){
    var cl = ORDERED[i];
    if (dmg(cl.id) > 12) continue;
    if (cl.par){ if (!ok[cl.par]) continue; if (dmg(cl.par) > 3) continue; }
    ok[cl.id] = true; n++;
  }
  return n;
}

/* ---------- render ---------- */
var prev = null, prevCap = -1, prevStage = -1;

function render(c, fromSqueeze){
  cols = Math.max(MINC, Math.min(maxCols, Math.round(c)));
  var f = fit(cols);

  if (fromSqueeze && prev && f.cap < prevCap){
    var crushed = [];
    for (var id in prev){ if (prev[id] && !f.chosen[id]) crushed.push(id); }
    if (crushed.length){
      st.squeezes++;
      for (var j=0;j<crushed.length;j++){
        var cl = byId[crushed[j]];
        var txt = plainText(cl, prevStage);
        st.dmg[cl.id] = (st.dmg[cl.id]|0) + 1;
        st.chars += txt.length;
        st.words += txt.split(/\s+/).filter(function(x){ return x.length; }).length;
      }
      if (cols < st.narrow) st.narrow = cols;
      save();
      relayClack();
    }
  }
  if (cols < st.narrow){ st.narrow = cols; save(); }

  var html = [];
  for (var i=0;i<CL.length;i++){ if (f.chosen[CL[i].id]) html.push(clauseHTML(CL[i], f.stage)); }
  para.innerHTML = html.join(" ");

  var tno = 1180 + st.squeezes;
  var line;
  if (cols < 30) line = "";
  else if (cols < 48) line = "41-" + tno + " \u2014 LOST " + st.words;
  else line = "TICKET NO. 41-" + tno + " \u2014 WORDS LOST: " + st.words;
  if (line) line += ' <a href="/archive" title="other tickets off this bench">\u00b7 other tickets</a>';
  tickL.innerHTML = line;

  var w = Math.round(cols * ch) + 2*PAD;
  frame.style.width = w + "px";
  var left = Math.round((window.innerWidth - w) / 2);
  edgeL.style.left = (left - 5) + "px";
  edgeR.style.left = (left + w - 6) + "px";

  if (f.stage !== prevStage && prevStage !== -1) needleSettle();
  prev = f.chosen; prevCap = f.cap; prevStage = f.stage;
  if (AU) AU.density(cols / maxCols);
}

/* ---------- edges ---------- */
var dragging = null, dragStartX = 0, dragStartCols = 0;

function onDown(which){
  return function(ev){
    startAudio();
    dragging = which;
    dragStartX = (ev.clientX !== undefined) ? ev.clientX : 0;
    dragStartCols = cols;
    if (ev.target.setPointerCapture && ev.pointerId !== undefined){
      try { ev.target.setPointerCapture(ev.pointerId); } catch(e){}
    }
    ev.preventDefault();
  };
}
function onMove(ev){
  if (!dragging) return;
  var x = (ev.clientX !== undefined) ? ev.clientX : dragStartX;
  var dch = (x - dragStartX) / ch;
  var target = dragStartCols + (dragging === "L" ? -2*dch : 2*dch);
  target = Math.max(MINC, Math.min(maxCols, Math.round(target)));
  if (target !== cols){
    var narrowing = target < cols;
    beamTick(narrowing);
    render(target, true);
  }
  ev.preventDefault();
}
function onUp(){
  if (dragging){ dragging = null; settleBeam(); }
}
edgeL.addEventListener("pointerdown", onDown("L"));
edgeR.addEventListener("pointerdown", onDown("R"));
window.addEventListener("pointermove", onMove, {passive:false});
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ---------- keyboard ---------- */
window.addEventListener("keydown", function(ev){
  startAudio();
  var k = ev.key;
  if (k === "ArrowLeft"){
    var step = ev.shiftKey ? 10 : 1;
    beamTick(true); render(cols - step, true); ev.preventDefault();
  } else if (k === "ArrowRight"){
    var s2 = ev.shiftKey ? 10 : 1;
    beamTick(false); render(cols + s2, true); ev.preventDefault();
  } else if (k === "Home"){
    var need = eligibleCount(), want = maxCols;
    for (var c = MINC; c <= maxCols; c++){
      var f = fit(c);
      var n = 0; for (var id in f.chosen) if (f.chosen[id]) n++;
      if (n >= need){ want = c; break; }
    }
    kettleStrike();
    render(want, false);
    ev.preventDefault();
  } else if (k === "End"){
    /* END does nothing. */
  }
});

/* ---------- resize (never counts as a squeeze) ---------- */
var rt = null;
window.addEventListener("resize", function(){
  if (rt) clearTimeout(rt);
  rt = setTimeout(function(){
    var frac = cols / maxCols;
    metrics();
    prev = null; prevCap = -1;
    render(Math.round(frac * maxCols), false);
  }, 90);
});

/* ---------- audio: everything synthesised ---------- */
var AU = null, audioStarted = false;
function startAudio(){
  if (audioStarted) return;
  audioStarted = true;
  var C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  var ctx;
  try { ctx = new C(); } catch(e){ return; }
  if (ctx.state === "suspended" && ctx.resume) { try{ ctx.resume(); }catch(e){} }

  var master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);
  master.gain.setTargetAtTime(0.55, ctx.currentTime, 2.0);

  var nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  var d = nb.getChannelData(0), last = 0;
  for (var i=0;i<d.length;i++){ var w = Math.random()*2-1; last = (last + 0.021*w) / 1.021; d[i] = last * 3.2; }

  function noise(loop){ var s = ctx.createBufferSource(); s.buffer = nb; s.loop = !!loop; return s; }

  /* grain running through a spout */
  var gSrc = noise(true);
  var gBp = ctx.createBiquadFilter(); gBp.type = "bandpass"; gBp.frequency.value = 950; gBp.Q.value = 0.55;
  var gHp = ctx.createBiquadFilter(); gHp.type = "highpass"; gHp.frequency.value = 380;
  var gGain = ctx.createGain(); gGain.gain.value = 0.035;
  gSrc.connect(gBp); gBp.connect(gHp); gHp.connect(gGain); gGain.connect(master);
  gSrc.start();

  /* coal stove, its own irregular clock */
  function stove(){
    var t = ctx.currentTime;
    var s = noise(false); var f = ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600;
    var g = ctx.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0008, t+0.035);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.06);
    setTimeout(stove, 1300 + Math.random()*3400);
  }
  setTimeout(stove, 900);

  /* leg elevator two floors up, out of time with everything */
  function leg(){
    var t = ctx.currentTime;
    var o = ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(74, t);
    o.frequency.exponentialRampToValueAtTime(48, t+0.09);
    var g = ctx.createGain(); g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0006, t+0.11);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.13);
    var s = noise(false); var f = ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=1.1;
    var g2 = ctx.createGain(); g2.gain.setValueAtTime(0.03, t); g2.gain.exponentialRampToValueAtTime(0.0005, t+0.05);
    s.connect(f); f.connect(g2); g2.connect(master); s.start(t); s.stop(t+0.07);
    setTimeout(leg, 332 + (Math.random()*10 - 5));
  }
  setTimeout(leg, 400);

  /* truck idling outside, then shut off */
  function truck(delay, dur){
    setTimeout(function(){
      var t = ctx.currentTime;
      var g = ctx.createGain(); g.gain.setValueAtTime(0.0, t); g.gain.linearRampToValueAtTime(0.055, t+1.2);
      g.connect(master);
      var o1 = ctx.createOscillator(); o1.type="sawtooth"; o1.frequency.value = 27.5;
      var o2 = ctx.createOscillator(); o2.type="sawtooth"; o2.frequency.value = 55.2;
      var lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 180;
      var w = ctx.createOscillator(); w.type="sine"; w.frequency.value = 3.7;
      var wg = ctx.createGain(); wg.gain.value = 5.5; w.connect(wg); wg.connect(o1.frequency);
      o1.connect(lp); o2.connect(lp); lp.connect(g);
      o1.start(t); o2.start(t); w.start(t);
      var off = t + dur;
      g.gain.setValueAtTime(0.055, off);
      g.gain.linearRampToValueAtTime(0.028, off+0.5);
      g.gain.linearRampToValueAtTime(0.040, off+0.75);
      g.gain.linearRampToValueAtTime(0.004, off+1.4);
      g.gain.linearRampToValueAtTime(0.0, off+1.9);
      o1.frequency.setValueAtTime(27.5, off);
      o1.frequency.linearRampToValueAtTime(14, off+1.8);
      o1.stop(off+2.1); o2.stop(off+2.1); w.stop(off+2.1);
    }, delay);
  }
  truck(2500, 17);
  truck(126000, 22);

  /* wall telephone, two rings, answered, no words */
  function ring(at){
    var t = ctx.currentTime + at;
    for (var r=0;r<2;r++){
      var base = t + r*2.1;
      for (var b=0;b<2;b++){
        var o = ctx.createOscillator(); o.type="triangle"; o.frequency.value = b ? 1245 : 985;
        var tr = ctx.createOscillator(); tr.type="square"; tr.frequency.value = 19;
        var trg = ctx.createGain(); trg.gain.value = 0.5;
        var g = ctx.createGain(); g.gain.value = 0.0;
        tr.connect(trg); trg.connect(g.gain);
        var lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 2600;
        o.connect(lp); lp.connect(g);
        var out = ctx.createGain(); out.gain.setValueAtTime(0.0, base);
        out.gain.linearRampToValueAtTime(0.026, base+0.04);
        out.gain.setValueAtTime(0.026, base+1.3);
        out.gain.linearRampToValueAtTime(0.0, base+1.45);
        g.connect(out); out.connect(master);
        o.start(base); tr.start(base); o.stop(base+1.5); tr.stop(base+1.5);
      }
    }
    var pk = t + 4.0;
    var s = noise(false); var f = ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1500;
    var gg = ctx.createGain(); gg.gain.setValueAtTime(0.09, pk); gg.gain.exponentialRampToValueAtTime(0.0006, pk+0.05);
    s.connect(f); f.connect(gg); gg.connect(master); s.start(pk); s.stop(pk+0.08);
    var mur = noise(false); var mf = ctx.createBiquadFilter(); mf.type="lowpass"; mf.frequency.value=320;
    var mg = ctx.createGain(); mg.gain.setValueAtTime(0.0, pk+0.3);
    mg.gain.linearRampToValueAtTime(0.011, pk+0.8); mg.gain.linearRampToValueAtTime(0.0, pk+6.5);
    mur.connect(mf); mf.connect(mg); mg.connect(master); mur.start(pk+0.3); mur.stop(pk+7);
  }
  setTimeout(function(){ ring(0); }, 52000);
  setTimeout(function(){ ring(0); }, 214000);

  AU = {
    ctx: ctx, master: master, noise: noise,
    density: function(f){
      try {
        gGain.gain.setTargetAtTime(0.010 + 0.052 * Math.max(0, Math.min(1, f)), ctx.currentTime, 0.12);
        gBp.frequency.setTargetAtTime(700 + 520 * f, ctx.currentTime, 0.2);
      } catch(e){}
    }
  };
  AU.density(cols / maxCols);
}

var lastTick = 0;
function beamTick(narrowing){
  if (!AU) return;
  var now = AU.ctx.currentTime;
  if (now - lastTick < 0.028) return;
  lastTick = now;
  try {
    var s = AU.noise(false);
    var f = AU.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = narrowing ? 3100 : 2600; f.Q.value = 2.4;
    var g = AU.ctx.createGain(); g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.0006, now + 0.022);
    s.connect(f); f.connect(g); g.connect(AU.master); s.start(now); s.stop(now + 0.04);
    var o = AU.ctx.createOscillator(); o.type = "square"; o.frequency.value = narrowing ? 1420 : 1180;
    var og = AU.ctx.createGain(); og.gain.setValueAtTime(0.035, now); og.gain.exponentialRampToValueAtTime(0.0004, now + 0.028);
    o.connect(og); og.connect(AU.master); o.start(now); o.stop(now + 0.05);
  } catch(e){}
}
function settleBeam(){
  if (!AU) return;
  var t0 = AU.ctx.currentTime;
  for (var i=0;i<3;i++){
    (function(n){
      setTimeout(function(){
        if (!AU) return;
        var t = AU.ctx.currentTime;
        try {
          var o = AU.ctx.createOscillator(); o.type="square"; o.frequency.value = 1280 - n*90;
          var g = AU.ctx.createGain(); g.gain.setValueAtTime(0.03 / (n+1), t); g.gain.exponentialRampToValueAtTime(0.0004, t+0.03);
          o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+0.05);
        } catch(e){}
      }, 90 + n*130);
    })(i);
  }
}
function kettleStrike(){
  if (!AU) return;
  for (var i=0;i<3;i++){
    (function(n){
      setTimeout(function(){
        if (!AU) return;
        var t = AU.ctx.currentTime;

          f.frequency.linearRampToValueAtTime(n%2 ? 2300 : 700, t+0.075); f.Q.value = 1.2;
          var g = AU.ctx.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0006, t+0.09);
          s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+0.11);
          var o = AU.ctx.createOscillator(); o.type="triangle"; o.frequency.value = 430 - n*18;
          var og = AU.ctx.createGain(); og.gain.setValueAtTime(0.05, t); og.gain.exponentialRampToValueAtTime(0.0005, t+0.07);
          o.connect(og); og.connect(AU.master); o.start(t); o.stop(t+0.09);
        } catch(e){}
      }, n * 115);
    })(i);
  }
}
function relayClack(){
  if (!AU) return;
  var t = AU.ctx.currentTime;
  try {
    for (var i=0;i<2;i++){
      var tt = t + i*0.055;
      var s = AU.noise(false);
      var f = AU.ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=1800;
      var g = AU.ctx.createGain(); g.gain.setValueAtTime(0.10, tt); g.gain.exponentialRampToValueAtTime(0.0005, tt+0.018);
      s.connect(f); f.connect(g); g.connect(AU.master); s.start(tt); s.stop(tt+0.03);
    }
  } catch(e){}
}
function needleSettle(){
  if (!AU) return;
  relayClack();
  var t = AU.ctx.currentTime + 0.12;
  try {
    var o = AU.ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(205, t+0.45);
    var lfo = AU.ctx.createOscillator(); lfo.type="sine"; lfo.frequency.value = 7.5;
    var lg = AU.ctx.createGain(); lg.gain.setValueAtTime(22, t); lg.gain.exponentialRampToValueAtTime(0.4, t+0.45);
    lfo.connect(lg); lg.connect(o.frequency);
    var g = AU.ctx.createGain(); g.gain.setValueAtTime(0.028, t); g.gain.exponentialRampToValueAtTime(0.0004, t+0.5);
    o.connect(g); g.connect(AU.master); o.start(t); lfo.start(t); o.stop(t+0.55); lfo.stop(t+0.55);
  } catch(e){}
}
