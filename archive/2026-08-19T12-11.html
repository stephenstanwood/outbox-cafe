  <meta name="twitter:image" content="https://ct21rptue7ejhsay.public.blob.vercel-storage.com/thumbs/2026-08-19T12-11.webp">
  <meta name="outbox-spec-era" content="1988, right now — a quarter past six on a warm May evening in a rented lock-up unit on an industrial estate at Redditch, Worcestershire, where a two-man firm assembles and tests coin-operated pool table mechanisms. The bench holds one cash box mech stripped down, a jam-jar of test coins, and a returns docket from a pub in Kidderminster that says the table has been swallowing tenpences and giving back nothing since Whit.">
  <meta name="outbox-spec-format" content="THE PAGE IS A COIN RETURN SLOT, AND EVERYTHING THAT COMES OUT OF IT COMES OUT INSTEAD OF THE THING YOU PAID FOR. The whole viewport, edge to edge and life-size, is the front escutcheon plate of a coin mechanism seen dead-on: a chrome slot at the top, a push-and-release plunger, and a chipped plastic reject cup at the bottom about the size of a cupped palm. That is the entire page — no header, no menu, no scroll, no title. The visitor's only vocabulary is: drop a coin in the slot (drag one from a small heap resting on the ledge), and push the plunger. The mechanism never once accepts a coin and never once releases a rack of balls. What it DOES do is reject — and the rejected object lands in the cup with a real bounce and a real settle, and it is never the coin you put in. It is a foreign coin. It is a washer. It is a hexagonal brass token stamped for a different trade. It is a coin from a currency that has been demonetised. It is the same tenpence but visibly older by nine years. Each rejected object stays in the cup, stacking up, and can be picked up and turned over with the cursor to read both faces at real engraved detail. The cup fills. It does not empty. There is no accept path anywhere in the mechanism and none is ever mentioned.">
  <meta name="outbox-spec-subject" content="The plain, entirely mechanical business of how a mechanical coin acceptor decides — that it is not reading anything and not recognising anything, it is running a physical obstacle course and a coin either survives it or doesn't; that the first gate is simple thickness and diameter, a slot and a shelf, and anything too fat or too small is gone before it has travelled an inch; that the real work is the CRADLE, a pivoted weighing lever that the coin rides across, calibrated so that a coin of correct mass tips it and a light slug does not; that the magnet is the cleverest part and is not there to attract anything — it is a permanent magnet mounted beside the coin's run so that a NON-magnetic coin rolls past unaffected while a steel washer is dragged to a dead stop mid-run and drops straight out the reject chute, and this is also why a copper coin and a steel coin of identical size behave completely differently on the same path; that eddy-current braking then sorts the non-magnetic ones from each other, because a good conductor rolling past a magnet induces currents in itself that oppose the motion, so a cupro-nickel coin visibly slows and a brass token barely does, and the whole discrimination is that difference in exit speed at the bottom of the run; that the exit speed is what decides which chute the coin lands in, so a mechanism 'accepts' a coin purely by the coin arriving in the right place at the right velocity and knocking the accept lever; that this is why a worn coin fails — mass falls, the cradle doesn't tip; and why a cold coin fails less than a wet one, because water on the run changes friction; that a coin frozen in a freezer and dropped in works measurably better in a badly adjusted mech because its conductivity is up; that the reject chute is not a failure path but the DEFAULT path, and every coin is rejected unless the run actively diverts it; and the flat arithmetic that this mech was calibrated for the pre-1982 tenpence at 11.31 grams and 28.5mm, and the new small one weighs 6.5 grams, so it has no chance at all and never had.">
  <meta name="outbox-spec-tone" content="The talkative, thinking-aloud voice of Denny Follick-Marsh, 34, who assembles these mechs and has the returns docket propped against the jam jar — cheerful, technical, second person, present tense, talking to whoever is stood the other side of the bench while his hands stay busy. He explains the magnet three separate times because people keep getting it backwards and think the magnet grabs the good coins. He is openly cross with the pub landlord in Kidderminster who has been feeding it foreign holiday change and then complaining, and openly cross with the Royal Mint for changing the tenpence, but in a practical way — a spec sheet changed and now four hundred mechs in the field don't work. He keeps a running count of what's fallen out of the cup. He is briefly and genuinely pleased when the visitor works out on their own that the reject path is the default. He mentions the chip shop shutting at seven twice. Never wry, never deadpan, never a craftsman-sage, never wistful, never a lament for anything.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Chipped hammertone grey enamel on the escutcheon plate (#6e7377) with worn chrome around the slot lip carrying a hard specular streak (#e8ecee) and oil-dark shadow inside the slot itself (#1a1d1f), against a bench top of scuffed brown lino (#7a5638). Coins are drawn in their honest actual alloys and nothing else: cupro-nickel white (#b6bcbd), bronze (#8a5a2b), brass token yellow (#b89230), and dull galvanised washer grey (#9aa09c), each with real relief shadow in the engraving and real wear on the high points. Exactly one chip of docket-carbon violet (#4a3560) is held strictly for the returns docket, the calibration figures chalked on the bench, and the count of what's in the cup. Flat, hard, high-contrast, no glow, no bloom, no gradients — metal under one fluorescent batten in a lock-up with the roller door half up at a quarter past six.">
  <meta name="outbox-spec-wildcard" content="One object in the heap is not a coin and is never explained: a small flat oval of grey plastic, about tenpence sized, with a hole punched off-centre and the letters HALF worn nearly off one face. It runs the mech honestly like everything else (too light for the cradle, non-magnetic, non-conductive, out the reject chute every time), it turns over and reads on both faces, and it stacks in the cup with everything else. Denny picks it up once, says it came in a bag of stock from a firm in Dudley that went under, says he keeps meaning to find out what machine it's for, and goes straight back to the docket. He never returns to it. It is in the heap in the same position every visit.">
  <meta name="outbox-spec-forbidden" content="NO coins-as-metaphor for value / worth / what-we-put-in-versus-what-we-get-back / chance / gambling / 'the house always wins' / rejection-as-emotional-state — it is a cradle lever, a magnet, and eddy currents, and it has nothing to teach anybody. NO gambling-machine menace, NO arcade nostalgia, NO 'the pubs are all gastropubs now / nobody plays pool anymore / the coin-op trade is dead' decline narrative — there are four hundred mechs in the field and a docket on the bench. NO liminal / uncanny / backrooms / analog-horror / cryptic-SCP register and NO ominous dread about the cup that never empties or the plastic oval — nothing is wrong, a mech is on a bench being fixed. NO camp or ironic affection for 1980s British pub ephemera, no winking at the hammertone paint, no lads-and-lager comedy, no Midlands-dialect spelling. NO sensuous material writing about metal or coins beyond mass, alloy, wear and diameter. NO numismatic reverence, no history-of-money digression, no 'each coin has been in a thousand pockets'. NO Thatcher-era social commentary and no small-business-struggle pathos. NO archival / museum / cabinet / drawer / collection framing of the coins — they are test slugs in a jam jar. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is a quarter past six on a warm May evening with the roller door up. NO signal / transmission / frequency / broadcast framing of any sound. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

/* mech geometry, in canvas units, resolved at layout */
var cv=document.getElementById("run"),ctx=cv.getContext("2d");
var cupC=document.getElementById("cupcv"),cupX=cupC.getContext("2d");
var W=1,H=1,S=1;
function layout(){
  var r=cv.parentElement.getBoundingClientRect();
  W=Math.max(120,r.width); H=Math.max(120,r.height);
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=W/300;
  var cr=cupC.parentElement.getBoundingClientRect();
  cupW=Math.max(60,cr.width); cupH=Math.max(40,cr.height);
  cupC.width=cupW*dpr; cupC.height=cupH*dpr; cupC.style.width=cupW+"px"; cupC.style.height=cupH+"px";
  cupX.setTransform(dpr,0,0,dpr,0,0);
}
var cupW=196,cupH=112;

/* run path: entry -> diameter gate -> cradle -> magnet zone -> divider */
function geo(){
  return {
    entryX: 0.18*W, entryY: 0.06*H,
    railY0: 0.20*H, railY1: 0.74*H,
    railX0: 0.10*W, railX1: 0.86*W,
    gateX: 0.24*W, gateGap: 30*S,           // slot width in px equivalent -> mm map below
    cradleX0: 0.36*W, cradleX1: 0.55*W, cradleY: 0.44*H,
    magX: 0.66*W, magY: 0.56*H,
    dividerX: 0.72*W, botY: 0.86*H
  };
}
var PX_PER_MM = 1; // resolved in layout draw
function mm(v){ return v*(W/300)*1.15; }

var ACCEPT_VMIN = 118, ACCEPT_VMAX = 168;  // exit-speed window for the accept chute

/* draw a coin face onto a 2d ctx sized d */
function drawCoin(c,sp,d,dpr,flip){
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,d,d);
  var r=d/2-1, cxp=d/2, cyp=d/2;
  c.save();
  if(sp.oval){ c.translate(cxp,cyp); c.scale(1,0.78); c.translate(-cxp,-cyp); }
  // body
  c.beginPath();
  if(sp.id==="tok"){ for(var i=0;i<6;i++){ var a=Math.PI/6+i*Math.PI/3; var x=cxp+r*Math.cos(a),y=cyp+r*Math.sin(a); i?c.lineTo(x,y):c.moveTo(x,y);} c.closePath(); }
  else c.arc(cxp,cyp,r,0,Math.PI*2);
  c.fillStyle=sp.col; c.fill();
  // hard relief shadow, one fluorescent batten above-left
  c.save(); c.clip();
  c.fillStyle="rgba(26,29,31,0.30)";
  c.beginPath(); c.arc(cxp+r*0.30,cyp+r*0.34,r,0,Math.PI*2); c.fill();
  c.fillStyle="rgba(232,236,238,0.22)";
  c.beginPath(); c.arc(cxp-r*0.34,cyp-r*0.40,r*0.92,0,Math.PI*2); c.fill();
  c.restore();
  // rim
  c.lineWidth=Math.max(1,r*0.13); c.strokeStyle=sp.edge;
  c.beginPath();
  if(sp.id==="tok"){ for(var j=0;j<6;j++){ var a2=Math.PI/6+j*Math.PI/3; var x2=cxp+(r-1)*Math.cos(a2),y2=cyp+(r-1)*Math.sin(a2); j?c.lineTo(x2,y2):c.moveTo(x2,y2);} c.closePath(); }
  else c.arc(cxp,cyp,r*0.86,0,Math.PI*2);
  c.stroke();
  // hole
  if(sp.hole){
    var hx=cxp+(sp.holeOff?r*0.34:0), hy=cyp;
    c.beginPath(); c.arc(hx,hy,r*sp.hole,0,Math.PI*2);
    c.fillStyle="#2c2f31"; c.fill();
    c.strokeStyle="rgba(232,236,238,0.28)"; c.lineWidth=1; c.stroke();
  }
  // engraving: legend ring + device
  var txt = flip ? sp.rev : sp.obv;
  engrave(c,cxp,cyp,r,txt,sp);
  // wear on high points
  c.globalAlpha=0.18; c.fillStyle="#e8ecee";
  c.beginPath(); c.ellipse(cxp-r*0.22,cyp-r*0.28,r*0.30,r*0.16,-0.5,0,Math.PI*2); c.fill();
  c.globalAlpha=1;
  c.restore();
}
function engrave(c,cx,cy,r,txt,sp){
  if(r<9)return;
  var fs=Math.max(3.6,r*0.20);
  c.font="700 "+fs.toFixed(1)+"px Helvetica,Arial,sans-serif";
  c.textAlign="center"; c.textBaseline="middle";
  var s=String(txt).replace(/—/g,"-");
  var chars=s.split(""), span=Math.min(Math.PI*1.75, chars.length*0.15);
  var start=-Math.PI/2-span/2;
  for(var i=0;i<chars.length;i++){
    var a=start+span*(i/(chars.length-1||1));
    c.save();
    c.translate(cx+Math.cos(a)*r*0.66, cy+Math.sin(a)*r*0.66);
    c.rotate(a+Math.PI/2);
    c.fillStyle="rgba(26,29,31,0.55)"; c.fillText(chars[i],0.5,0.6);
    c.fillStyle="rgba(232,236,238,0.42)"; c.fillText(chars[i],-0.3,-0.4);
    c.restore();
  }
  // centre device
  c.save();
  c.fillStyle="rgba(26,29,31,0.42)";
  c.beginPath();
  if(sp.id==="half"){ c.font="700 "+(r*0.42).toFixed(1)+"px Helvetica,Arial"; c.fillText("HALF",cx-r*0.16,cy); }
  else if(sp.hole){ }
  else { c.arc(cx,cy,r*0.28,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(232,236,238,0.25)"; c.beginPath(); c.arc(cx-r*0.05,cy-r*0.06,r*0.24,0,Math.PI*2); c.fill(); }
  c.restore();
}

/* ---------- drag from ledge into slot ---------- */
var slot=document.getElementById("slot");
var loaded=null;
function attachDrag(el,sp){
  var ghost=null,ox=0,oy=0;
  function down(e){
    e.preventDefault(); ac();
    var pt=point(e); var r=el.getBoundingClientRect();
    ox=pt.x-r.left; oy=pt.y-r.top;
    ghost=document.createElement("canvas");
    var d=r.width,dpr=Math.min(2,window.devicePixelRatio||1);
    ghost.width=d*dpr;ghost.height=d*dpr;ghost.style.width=d+"px";ghost.style.height=d+"px";
    ghost.className="drag";
    drawCoin(ghost.getContext("2d"),sp,d,dpr,0);
    document.body.appendChild(ghost);
    move(e);
    window.addEventListener("mousemove",move); window.addEventListener("touchmove",move,{passive:false});
    window.addEventListener("mouseup",up); window.addEventListener("touchend",up);
  }
  function move(e){ if(!ghost)return; e.preventDefault(); var pt=point(e);
    ghost.style.left=(pt.x-ox)+"px"; ghost.style.top=(pt.y-oy)+"px";
    var sr=slot.getBoundingClientRect();
    var over = pt.x>sr.left-26&&pt.x<sr.right+26&&pt.y>sr.top-30&&pt.y<sr.bottom+30;
    slot.className=over?"hot":"";
  }
  function up(e){
    window.removeEventListener("mousemove",move); window.removeEventListener("touchmove",move);
    window.removeEventListener("mouseup",up); window.removeEventListener("touchend",up);
    if(!ghost)return;
    var pt=lastPt; var sr=slot.getBoundingClientRect();
    var over = pt&&pt.x>sr.left-26&&pt.x<sr.right+26&&pt.y>sr.top-30&&pt.y<sr.bottom+30;
    ghost.remove(); ghost=null; slot.className="";
    if(over) loadSlot(sp);
    else say("Back on the ledge then. Slot's the chrome bit at the top.");
  }
  el.addEventListener("mousedown",down);
  el.addEventListener("touchstart",down,{passive:false});
}
var lastPt=null;
function point(e){ var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  lastPt={x:t.clientX,y:t.clientY}; return lastPt; }

function loadSlot(sp){
  if(running){ say("Hang on, one's still on the rails."); return; }
  // slot width gate: 30.0 mm wide, 2.2 mm deep. Anything fatter never gets in.
  if(sp.th>2.2){ say("<span class='n'>"+sp.name+"</span> won't even go in. Slot's cut two point two millimetre deep. That's gate one and it isn't clever, it's a gap."); ring(sp.m,1,0.08); return; }
  loaded=sp;
  ring(sp.m, sp.fe?0.72:(sp.col==="#8a5a2b"?0.86:1.0), 0.2);
  say("In the slot: <span class='n'>"+sp.name+"</span>. "+sp.dia.toFixed(1)+" mm across, "+sp.m.toFixed(2)+" g. Push the plunger when you're ready.");
}

/* ---------- plunger ---------- */
var plunger=document.getElementById("plunger");
function push(){
  ac();
  plunger.classList.add("push"); setTimeout(function(){plunger.classList.remove("push");},110);
  if(running){ return; }
  if(!loaded){ say("Nothing in it. Drag one off the ledge into the chrome first."); return; }
  startRun(loaded); loaded=null;
}
plunger.addEventListener("click",push);

/* ---------- the run: real simulation ---------- */
var GRAV=760;          // px/s^2 down the rail
function startRun(sp){
  var g=geo();
  var rpx=mm(sp.dia)/2;
  running={
    sp:sp, x:g.entryX, y:g.railY0, vx:78, vy:0, r:rpx, spin:0,
    stage:"gate", t:0, cradleTipped:false, arrested:false, trace:[],
    braked:0, notes:[]
  };
  stats.run++; save(); paintCounts();
  rumbleOn();
  say("—— <span class='n'>"+sp.name+"</span> away. ——");
}

var lastT=performance.now();
function step(now){
  var dt=Math.min(0.033,(now-lastT)/1000); lastT=now;
  if(running) sim(dt);
  simCup(dt);
  draw();
  drawCup();
  requestAnimationFrame(step);
}
function sim(dt){
  var o=running, sp=o.sp, g=geo();
  o.t+=dt;
  if(o.stage==="gate"){
    // gate one: diameter shelf. Slot mouth passes up to 30.0 mm.
    o.x+=o.vx*dt;
    if(o.x>=g.gateX){
      if(sp.dia>30.0){ o.stage="stuck"; o.notes.push("oversize"); }
      else { o.stage="rail"; o.vx=96; }
    }
  } else if(o.stage==="rail"||o.stage==="magnet"){
    // rail descends from railY0 to railY1 across railX0..railX1 — constant slope
    var slope=(g.railY1-g.railY0)/(g.railX1-g.railX0);
    var ang=Math.atan(slope);
    // gravity along the rail, minus rolling resistance
    var a=GRAV*Math.sin(ang) - 0.16*GRAV*Math.cos(ang)*(sp.oval?2.1:(sp.id==="tok"?1.9:1.0));
    o.vx+=a*Math.cos(ang)*dt;

    // CRADLE: a pivoted weighing lever. Torque balance against the spring.
    if(!o.cradleTipped && o.x>g.cradleX0 && o.x<g.cradleX1){
      if(sp.m>=thresholdG){
        if(!o.cradleDone){ o.cradleDone=true; o.cradleTipped=true; ratchet();
          o.notes.push("cradle tipped at "+sp.m.toFixed(2)+" g against "+thresholdG.toFixed(2)+" g"); }
      } else {
        // lever doesn't tip: the coin drags across a stalled cradle, big friction loss
        o.vx-=(1-sp.m/thresholdG)*205*dt;
        if(!o.cradleDone){ o.cradleDone=true;
          o.notes.push("cradle held — "+sp.m.toFixed(2)+" g under "+thresholdG.toFixed(2)+" g"); }
      }
    }
    // MAGNET: permanent magnet beside the run.
    var dx=o.x-g.magX, dy=o.y-g.magY;
    var dist=Math.max(6, Math.sqrt(dx*dx+dy*dy));
    if(dist<mm(46)){
      if(sp.fe){
        // genuine attractive pull toward the magnet, dragging it off the rail
        var F=1400/(dist*dist)*4200;
        o.vx-=Math.min(700,F)*dt*0.55;
        o.magPull=Math.min(1,(mm(46)-dist)/mm(46));
        if(o.vx<8 && !o.arrested){ o.arrested=true; o.stage="arrested"; o.vx=0; clunk();
          o.notes.push("magnet arrested it dead on the rail"); }
      } else {
        // eddy-current retarding force: proportional to conductivity and velocity
        var k = sp.sig*0.0044*Math.pow(mm(46)/dist,2);
        var drag = k*o.vx;
        o.vx-=drag*dt*10;
        o.braked+=drag*dt*10;
      }
    }
    if(o.vx<3 && !o.arrested && o.stage!=="arrested"){ o.stage="stalled"; o.notes.push("stopped on the rail"); }
    o.x+=o.vx*dt;
    o.y=g.railY0+(o.x-g.railX0)*slope;
    o.spin+=o.vx*dt/Math.max(4,o.r);
    rumbleSet(Math.abs(o.vx));
    if(o.x>=g.dividerX){ decide(); }
  } else if(o.stage==="arrested"||o.stage==="stalled"||o.stage==="stuck"){
    o.hold=(o.hold||0)+dt;
    rumbleSet(0);
    if(o.hold>0.5){ // falls straight out the reject chute
      rumbleOff();
      dropToCup(sp, 60, o.notes, o.stage);
      running=null;
    }
  }
}
function decide(){
  var o=running, sp=o.sp, v=Math.abs(o.vx);
  rumbleOff();
  var accepted = (v>=ACCEPT_VMIN && v<=ACCEPT_VMAX && o.cradleTipped);
  if(accepted){
    o.notes.push("exit "+v.toFixed(0)+" — inside the accept window");
    acceptThrow(sp,v,o.notes);
  } else {
    o.notes.push("exit "+v.toFixed(0)+" — window is "+ACCEPT_VMIN+" to "+ACCEPT_VMAX);
    dropToCup(sp,v,o.notes,"chute");
  }
  running=null;
}

/* ---------- Denny's commentary per object ---------- */
var magnetExplained=0, defaultNoticed=false, halfPicked=false;
function commentary(sp,v,notes,how){
  var n=notes.join("; ");
  var s="";
  if(how==="stuck"){
    s="Straight back out. <span class='n'>"+sp.dia.toFixed(1)+" mm</span> across and the shelf behind the slot passes thirty. Never got an inch in. That's not discrimination, that's a gap being a gap.";
  } else if(how==="arrested"){
    magnetExplained++;
    s="There — dead stop. That's the magnet. And I'll say it plain because everybody has it backwards: <span class='v'>the magnet is not there to grab the good coins.</span> It's a permanent magnet sat beside the run. A tenpence is cupro-nickel, non-magnetic, it rolls past it and doesn't care. That washer is mild steel, so the magnet hauls it off the rail and it stops where it is and falls out. The magnet's only job is to catch iron.";
  } else if(how==="stalled"){
    s="Ran out of road. "+n+". Rolling resistance and the cradle it couldn't shift. Out it comes.";
  } else {
    if(sp.id==="t10new"){
      s="Right, this is the docket, this is the whole docket. <span class='n'>Post-1982 tenpence.</span> Six point five grams. This mech's cradle is set for <span class='v'>eleven point three one grams at twenty-eight and a half mil</span>. Six and a half will not tip that lever. It never could and it never will. The Mint changed the spec sheet and four hundred mechs in the field don't work — not broken, mind, working exactly as cut. Exit "+v.toFixed(0)+". Nowhere near.";
    } else if(sp.id==="t10pre"){
      s="Now that's the coin it was cut for — mass right, diameter right, cradle tipped. But look at the exit: <span class='n'>"+v.toFixed(0)+"</span>. Cupro-nickel's a decent conductor, so past the magnet it induces currents in itself that push back against its own motion and it visibly slows. That's the eddy braking. Whether it makes the window depends on where you've got that screw.";
    } else if(sp.id==="ie10"){
      s="Irish ten. Same diameter, "+sp.m.toFixed(2)+" g, same alloy. Behaves near identical to ours — cradle tips, brakes about the same. This is the sort of thing the landlord's been posting in and then ringing me about.";
    } else if(sp.id==="tok"){
      s="Brass hex token. Watch the exit speed on that — <span class='n'>"+v.toFixed(0)+"</span>. Barely braked. Brass conducts nowhere near as well as cupro-nickel, so the magnet hardly touches it. And it's got six flats so it doesn't roll clean either. Same size as a tenpence, completely different animal on the same path.";
    } else if(sp.id==="bronze"){
      s="Bronze twopence. Ninety-seven per cent copper, so the eddy braking really has something to bite on — see it drag past the magnet. Exit "+v.toFixed(0)+". But it's seven point one two grams, under the cradle, so it was out the moment it hit the lever.";
    } else if(sp.id==="fr1"){
      s="One franc. Nickel, six grams. Brakes hard past the magnet because nickel conducts well, but it's light and the cradle never moved. Exit "+v.toFixed(0)+".";
    } else if(sp.id==="us25"){
      s="Quarter. Five sixty-seven and twenty-four mil. Clad — copper in the middle, cupro-nickel faces. Under the cradle by half. Out.";
    } else if(sp.id==="es5"){
      s="Five peseta. Aluminium-bronze, so it's light and it conducts well — light enough that the cradle stayed put, and it exits at "+v.toFixed(0)+".";
    } else if(sp.id==="nl1"){
      s="Guilder. Twenty-five mil, six grams. Nickel-clad, brakes fair, cradle held. Reject.";
    } else if(sp.id==="wash"){
      magnetExplained++;
      s="Washer got past the magnet that time — you must have shifted something. Three point two grams anyway, the cradle wouldn't look at it.";
    } else if(sp.id==="half"){
      s="Plastic. One point one grams. Non-magnetic — the magnet's got nothing to pull on — and it doesn't conduct at all, so there's no eddy braking either, none. It just rolls. And it's far too light for the cradle. Out it goes, same as everything.";
      if(!halfPicked){ halfPicked=true;
        setTimeout(function(){ say("That grey one — that came in with a bag of stock off a firm in Dudley that went under. I keep meaning to ring round and find out what machine it's off. Anyway."); },900);
        setTimeout(function(){ say("Docket says the Talbot's table's been swallowing tenpences since Whit. It hasn't swallowed one. Every one's gone out the chute. He's been picking them out the cup and putting them back in."); },2400);
      }
    } else {
      s=sp.name+" — "+n+". Exit "+v.toFixed(0)+".";
    }
  }
  say(s);
  if(magnetExplained===2){
    setTimeout(function(){ say("I'll say the magnet a third time because it's the bit people fight me on. <span class='v'>Nothing is attracted to a coin here.</span> Non-magnetic coin: sails past, then gets braked by the currents it induces in itself. Steel: dragged off the rail and killed. Two completely different effects from the same lump of magnet, and neither one of them is 'recognising' anything."); },1100);
  }
  if(!defaultNoticed && stats.run>=4){
    defaultNoticed=true;
    setTimeout(function(){ say("You've worked it out, haven't you — go on, you've spotted it. <span class='v'>The chute is the default.</span> That's exactly right and I'm pleased you got there. This thing does not decide to reject. Reject is where everything goes unless the run actively knocks it sideways at the right speed. It's not a machine that says no. It's a slope that says nothing, and one lever at the bottom that has to be hit just so."); },1500);
  }
}

/* ---------- accept ---------- */
var acceptFlash=0;
function acceptThrow(sp,v,notes){
  acceptFlash=1.6; ratchet(); clunk();
  say("<span class='v'>Accept lever's thrown.</span> "+sp.name+", exit "+v.toFixed(0)+", cradle tipped, right side of the divider. That's the mech doing the one thing it's for.");
  setTimeout(function(){ say("And nothing happens. There's no table on it. It's sat on a bench with the lid off. That lever throws into fresh air."); },800);
  setTimeout(function(){ // it still ends up in the cup afterward, off the accept ramp with no table to take it
    dropToCup(sp,v,notes,"accept");
  },1400);
}

/* ---------- cup physics ---------- */
function dropToCup(sp,v,notes,how){
  var item={
    sp:sp, x:cupW/2+(Math.random()-0.5)*26, y:-14,
    vx:(Math.random()-0.5)*30, vy:Math.max(40,v*0.7),
    r:Math.max(6,mm(sp.dia)/2*0.62), rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*6,
    face:0, rest:false, born:performance.now()
  };
  cupItems.push(item);
  stats.cup++; save(); paintCounts();
  clatter(v,sp.m);
  commentary(sp,v,notes,how);
}
function simCup(dt){
  for(var i=0;i<cupItems.length;i++){
    var it=cupItems[i];
    if(it.held) continue;
    it.vy+=900*dt;
    it.x+=it.vx*dt; it.y+=it.vy*dt; it.rot+=it.vr*dt;
    it.vx*=0.995; it.vr*=0.985;
    // walls
    if(it.x<it.r+6){ it.x=it.r+6; it.vx=-it.vx*0.42; }
    if(it.x>cupW-it.r-6){ it.x=cupW-it.r-6; it.vx=-it.vx*0.42; }
    // floor (rounded)
    var floor=cupH-8-Math.max(0,(Math.abs(it.x-cupW/2)/(cupW/2))*10);
    if(it.y>floor-it.r){
      it.y=floor-it.r;
      if(Math.abs(it.vy)>34){ it.vy=-it.vy*0.34; it.vx*=0.7; clatter(Math.abs(it.vy)*1.4,it.sp.m); }
      else { it.vy=0; it.vx*=0.72; it.vr*=0.6; }
    }
    // stack collision
    for(var j=0;j<cupItems.length;j++){
      if(i===j)continue; var o=cupItems[j];
      var dx=it.x-o.x, dy=it.y-o.y, d=Math.sqrt(dx*dx+dy*dy), md=(it.r+o.r)*0.86;
      if(d<md&&d>0.01){
        var pushv=(md-d)/2, nx=dx/d, ny=dy/d;
        if(!o.held){ o.x-=nx*pushv; o.y-=ny*pushv; }
        it.x+=nx*pushv; it.y+=ny*pushv;
        if(!it.held){ it.vy*=0.5; it.vx+=nx*10; }
      }
    }
  }
}
function drawCup(){
  cupX.clearRect(0,0,cupW,cupH);
  cupX.fillStyle="#4a4f52"; cupX.fillRect(0,0,cupW,cupH);
  // dull worn plastic streaks
  cupX.fillStyle="rgba(232,236,238,0.05)";
  for(var s=0;s<5;s++) cupX.fillRect(10+s*36,0,2,cupH);
  cupItems.forEach(function(it){
    cupX.save();
    cupX.translate(it.x,it.y); cupX.rotate(it.rot);
    var d=it.r*2;
    var tmp=faceCanvas(it.sp,d,it.face);
    cupX.drawImage(tmp,-it.r,-it.r,d,d);
    cupX.restore();
  });
  if(cupItems.length===0){
    cupX.fillStyle="#5c6164"; cupX.font="9px Helvetica,Arial"; cupX.textAlign="center";
    cupX.fillText("REJECT", cupW/2, cupH/2);
  }
}
var faceCache={};
function faceCanvas(sp,d,face){
  var key=sp.id+"_"+Math.round(d)+"_"+face;
  if(faceCache[key])return faceCache[key];
  var c=document.createElement("canvas");
  var dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=d*dpr;c.height=d*dpr;
  drawCoin(c.getContext("2d"),sp,d,dpr,face);
  faceCache[key]=c; return c;
}

/* ---------- pick up / turn over in the cup ---------- */
var holdEl=document.getElementById("hold");
var grabbed=null,gdx=0,gdy=0,turnAcc=0;
function cupPt(e){ var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  var r=cupC.getBoundingClientRect(); return {x:t.clientX-r.left,y:t.clientY-r.top,cx:t.clientX,cy:t.clientY}; }
cupC.addEventListener("mousedown",cupDown); cupC.addEventListener("touchstart",cupDown,{passive:false});
function cupDown(e){
  e.preventDefault(); ac();
  var p=cupPt(e);
  for(var i=cupItems.length-1;i>=0;i--){
    var it=cupItems[i];
    if(Math.hypot(p.x-it.x,p.y-it.y)<it.r+4){
      grabbed=it; it.held=true; it.vx=0;it.vy=0;
      gdx=p.x-it.x; gdy=p.y-it.y; turnAcc=0; lastTurnX=p.x;
      showHold(it);
      window.addEventListener("mousemove",cupMove); window.addEventListener("touchmove",cupMove,{passive:false});
      window.addEventListener("mouseup",cupUp); window.addEventListener("touchend",cupUp);
      return;
    }
  }
}
var lastTurnX=0;
function cupMove(e){
  if(!grabbed)return; e.preventDefault();
  var p=cupPt(e);
  grabbed.x=Math.max(grabbed.r+6,Math.min(cupW-grabbed.r-6,p.x-gdx));
  grabbed.y=Math.min(cupH-6,p.y-gdy);
  // horizontal drag turns it over
  turnAcc+=Math.abs(p.x-lastTurnX); lastTurnX=p.x;
  if(turnAcc>52){ turnAcc=0; grabbed.face=1-grabbed.face; showHold(grabbed); ring(grabbed.sp.m,1.1,0.05); }
}
function cupUp(){
  window.removeEventListener("mousemove",cupMove); window.removeEventListener("touchmove",cupMove);
  window.removeEventListener("mouseup",cupUp); window.removeEventListener("touchend",cupUp);
  if(grabbed){ grabbed.held=false; grabbed.vy=20; grabbed=null; }
  setTimeout(function(){ holdEl.style.display="none"; },2600);
}
function showHold(it){
  var sp=it.sp;
  holdEl.style.display="block";
  holdEl.innerHTML="<h4>"+sp.name+"</h4>"+
    "<div>"+(it.face?"REVERSE":"OBVERSE")+": <b>"+(it.face?sp.rev:sp.obv)+"</b></div>"+
    "<div class='f'>"+sp.dia.toFixed(2)+" mm &middot; "+sp.th.toFixed(2)+" mm thick &middot; "+sp.m.toFixed(2)+" g<br>"+
    (sp.fe?"magnetic (mild steel)":"non-magnetic")+" &middot; conductivity "+(sp.sig?sp.sig+"% IACS":"nil")+"</div>"+
    "<div class='f' style='margin-top:4px'>"+sp.note+"</div>"+
    "<div class='f' style='margin-top:4px;color:#4a3560'>drag sideways to turn it over</div>";
}

/* ---------- draw the run ---------- */
function draw(){
  var g=geo();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#3d4144"; ctx.fillRect(0,0,W,H);
  // interior shadow
  ctx.fillStyle="rgba(26,29,31,0.45)"; ctx.fillRect(0,0,W,H*0.10);
  // rails
  ctx.strokeStyle="#8c9294"; ctx.lineWidth=Math.max(2,3*S);
  ctx.beginPath(); ctx.moveTo(g.railX0,g.railY0); ctx.lineTo(g.railX1,g.railY1); ctx.stroke();
  ctx.strokeStyle="#6a6f72"; ctx.lineWidth=Math.max(1,1.6*S);
  ctx.beginPath(); ctx.moveTo(g.railX0,g.railY0+mm(9)); ctx.lineTo(g.railX1,g.railY1+mm(9)); ctx.stroke();
  // entry throat from slot
  ctx.strokeStyle="#b9bfc2"; ctx.lineWidth=Math.max(2,2.4*S);
  ctx.beginPath(); ctx.moveTo(g.entryX-mm(16),0); ctx.lineTo(g.entryX-mm(6),g.railY0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.entryX+mm(16),0); ctx.lineTo(g.entryX+mm(12),g.railY0-mm(4)); ctx.stroke();
  // gate one: diameter shelf
  ctx.strokeStyle="#e8ecee"; ctx.lineWidth=Math.max(2,2.6*S);
  ctx.beginPath(); ctx.moveTo(g.gateX,g.railY0-mm(31)); ctx.lineTo(g.gateX,g.railY0-mm(2)); ctx.stroke();
  ctx.fillStyle="#8f959a"; ctx.font=(8*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
  ctx.textAlign="left"; ctx.fillText("GATE 30.0", g.gateX+4, g.railY0-mm(24));
  // cradle lever
  var tip = running&&running.cradleTipped ? 1 : 0;
  var cy0=g.cradleY, dropv=tip?mm(7):0;
  ctx.strokeStyle=tip?"#e8ecee":"#b6bcbd"; ctx.lineWidth=Math.max(2,3.4*S);
  ctx.beginPath(); ctx.moveTo(g.cradleX0,cy0); ctx.lineTo(g.cradleX1,cy0+dropv); ctx.stroke();
  // pivot
  ctx.fillStyle="#8c9294"; ctx.beginPath(); ctx.arc(g.cradleX0,cy0,Math.max(2,2.6*S),0,7); ctx.fill();
  // spring
  ctx.strokeStyle="#9aa09c"; ctx.lineWidth=Math.max(1,1.4*S);
  ctx.beginPath();
  var sx=g.cradleX1, sy=cy0+dropv;
  for(var k=0;k<7;k++){ ctx.lineTo(sx+((k%2)?4*S:-4*S), sy+k*(mm(4))); }
  ctx.stroke();
  ctx.fillStyle="#4a3560"; ctx.font="700 "+(8*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
  ctx.fillText(thresholdG.toFixed(2)+" g", g.cradleX0+2, cy0-6);
  // magnet
  var mw=mm(9), mh=mm(26);
  ctx.fillStyle="#575c60"; ctx.fillRect(g.magX-mw/2, g.magY-mh/2, mw, mh);
  ctx.fillStyle="#1a1d1f"; ctx.fillRect(g.magX-mw/2, g.magY-mh/2, mw, mh/2);
  ctx.strokeStyle="#8c9294"; ctx.lineWidth=1; ctx.strokeRect(g.magX-mw/2, g.magY-mh/2, mw, mh);
  ctx.fillStyle="#8f959a"; ctx.font=(7*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
  ctx.fillText("MAG", g.magX-mw/2, g.magY-mh/2-3);
  // divider + two chutes
  ctx.strokeStyle="#e8ecee"; ctx.lineWidth=Math.max(2,2.6*S);
  ctx.beginPath(); ctx.moveTo(g.dividerX, g.railY1+mm(4)); ctx.lineTo(g.dividerX+mm(6), g.botY); ctx.stroke();
  // reject side (left of divider, wide)
  ctx.strokeStyle="#9aa09c"; ctx.lineWidth=Math.max(1,1.8*S);
  ctx.beginPath(); ctx.moveTo(g.railX0+mm(8), g.botY); ctx.lineTo(g.dividerX-mm(2), g.botY); ctx.stroke();
  ctx.fillStyle="#8f959a"; ctx.font=(8*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
  ctx.textAlign="center";
  ctx.fillText("REJECT — DEFAULT", (g.railX0+g.dividerX)/2, g.botY+13);
  // accept side
  ctx.strokeStyle= acceptFlash>0 ? "#4a3560" : "#6a6f72";
  ctx.beginPath(); ctx.moveTo(g.dividerX+mm(8), g.botY); ctx.lineTo(W-mm(4), g.botY); ctx.stroke();
  ctx.fillStyle= acceptFlash>0 ? "#a58ccb" : "#6a6f72";
  ctx.fillText("ACCEPT", (g.dividerX+W)/2, g.botY+13);
  ctx.textAlign="left";
  // accept window figures, chalked in violet
  ctx.fillStyle="#4a3560"; ctx.font="700 "+(8*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
  ctx.fillText("EXIT WINDOW "+ACCEPT_VMIN+"–"+ACCEPT_VMAX, 6, H-6);
  ctx.fillText("CUT FOR 28.5 mm / 11.31 g", 6, H-18);
  if(acceptFlash>0) acceptFlash-=0.016;
  // live velocity readout
  if(running){
    ctx.fillStyle="#b6bcbd"; ctx.font=(9*Math.max(1,S*0.9)).toFixed(0)+"px Helvetica,Arial";
    ctx.fillText("v = "+Math.abs(running.vx).toFixed(0), 6, 14);
    if(running.braked>1){ ctx.fillStyle="#a58ccb"; ctx.fillText("eddy loss "+running.braked.toFixed(0), 6, 26); }
    // the object itself
    var it=running, d=it.r*2;
    ctx.save(); ctx.translate(it.x,it.y-it.r); ctx.rotate(it.spin);
    ctx.drawImage(faceCanvas(it.sp,d,0),-it.r,-it.r,d,d);
    ctx.restore();
    if(it.magPull&&it.sp.fe){
      ctx.strokeStyle="rgba(232,236,238,0.35)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(it.x,it.y-it.r); ctx.lineTo(g.magX,g.magY); ctx.stroke();
    }
  }
}

/* ---------- calibration screw ---------- */
var screw=document.getElementById("screw"), track=document.getElementById("screwtrack"), thrLbl=document.getElementById("thr");
var MING=2.0, MAXG=14.0;
function setThr(g){
  thresholdG=Math.max(MING,Math.min(MAXG,g));
  var f=(thresholdG-MING)/(MAXG-MING);
  screw.style.left=(f*(track.clientWidth-22))+"px";
  thrLbl.textContent=thresholdG.toFixed(2);
}
(function screwDrag(){
  var dragging=false;
  function d(e){ e.preventDefault(); dragging=true; ac(); m(e);
    window.addEventListener("mousemove",m); window.addEventListener("touchmove",m,{passive:false});
    window.addEventListener("mouseup",u); window.addEventListener("touchend",u); }
  function m(e){ if(!dragging)return; e.preventDefault();
    var t=(e.touches&&e.touches[0])||e, r=track.getBoundingClientRect();
    var f=Math.max(0,Math.min(1,(t.clientX-r.left-11)/(r.width-22)));
    var prev=thresholdG;
    setThr(MING+f*(MAXG-MING));
    if(Math.abs(thresholdG-prev)>0.35) ratchet();
  }
  function u(){ dragging=false;
    window.removeEventListener("mousemove",m); window.removeEventListener("touchmove",m);
    window.removeEventListener("mouseup",u); window.removeEventListener("touchend",u);
    say("Cradle spring's now at <span class='v'>"+thresholdG.toFixed(2)+" g</span>. That's the mass a thing has to have to tip the lever. Wind it down far enough and something in that heap will start getting through — and then the exit speed has to land in the window as well, which is the other half of it.");
  }
  screw.addEventListener("mousedown",d); screw.addEventListener("touchstart",d,{passive:false});
})();

/* ---------- sound toggle ---------- */
var sbtn=document.getElementById("snd");
sbtn.addEventListener("click",function(){
  ac();
  soundOn=!soundOn;
  if(master) master.gain.value=soundOn?0.5:0;
  sbtn.textContent=soundOn?"SOUND OFF":"SOUND ON";

document.addEventListener("click",function once(){ ac(); document.removeEventListener("click",once); },{once:true});

/* ---------- keyboard, for the impatient ---------- */
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); push(); }
});

/* ---------- go ---------- */
function boot(){ layout(); heapLayout(); }
boot();
var rt=null;
window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(boot,180); });
requestAnimationFrame(function(t){ lastT=t; step(t); });

setTimeout(function(){ say("Landlord's docket also says he's had four hundred customers complain. He's had four. He's put a nought on it because he thinks I'll come out quicker."); },7000);
setTimeout(function(){ say("If you want a proper look at what's in the cup, pick one up and drag sideways — it'll turn over and you can read the back. They stop where you put them."); },13000);
setTimeout(function(){ say("Wet coin does worse than a cold one, incidentally — water on the run changes the friction and it arrives slow. Cold's the other way. Stick a tenpence in the freezer overnight and its conductivity's up, and in a badly set mech that measurably helps it. Doesn't help this one, because the problem here is mass, not speed."); },21000);
setTimeout(function(){ say("Chip shop's shutting at seven, I did say. There's a kettle if you'd rather."); },31000);

/* worn nearly off: the run is a slope and the lever is a lever, and that is the whole of it */
console.log("MECH 44 · bench two · cradle cut for 11.31 g / 28.5 mm · accept window 118-168 · reject is the default path");
})();
