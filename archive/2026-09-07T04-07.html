  <meta name="outbox-spec-era" content="Mid-January 1974, the third afternoon of a ground blizzard on a north–south county grid road in Emmons County, North Dakota. Nothing has fallen out of the sky since Tuesday: every grain moving across this section is old snow, already fallen once, already packed once, now being moved for the fourth or fifth time by a 26-knot northwesterly that has not dropped below 20 in fifty hours. Two hundred metres of 4-foot lath-and-wire fence stands on steel posts in the stubble, set back from the road grade at the distance somebody paced off in October. The overcast is total and shadowless, there is no horizon, and the drift behind the fence is at about seventy percent of the volume it will hold. Not a look-back at anything, not a lament, not a memory of hard winters: the fence is working right now, it is thirteen inches from being buried in two places, and once it is buried the drift starts walking toward the road.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one stretch of snow fence and the ground downwind of it, seen obliquely from standing height about thirty metres out in the stubble, so the fence runs from lower left to upper right across the frame and the drift lies out toward the viewer with its whole length readable. Wind comes across the frame left to right at a slight angle. There is no header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label and no readable character anywhere at any time — the only thing on the page is weather, ground, and a fence. It is a live aeolian transport engine: several hundred thousand snow grains are moved by a real turbulent boundary layer, they saltate and suspend and deposit according to actual shear stress at the surface, and the drift shape behind the fence is not drawn, sculpted, keyframed or eased — it is whatever the deposition arithmetic has built since the visitor's first visit and it only ever gets bigger. The visitor's entire vocabulary is three things a person could do to a fence with cold hands: DRAG horizontally to walk along the fence line, which is real parallax across two hundred metres of fence with genuinely different porosity, different drift, and different burial depth section by section; CLICK any single lath to pull it out (or push a loose one back in), which permanently changes the porosity of that panel and therefore permanently changes the shape, length and height of the drift downwind of it; and DRAG the wire panel vertically on its posts to raise or lower the bottom gap, which is the single most consequential thing on the page and is never explained. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat mechanics of a snow fence, and specifically that a snow fence does not stop snow and never has — it slows the air, and the air puts down what it can no longer carry, which means the entire device is a deposition problem and not a barrier problem. That mass transport goes roughly as the CUBE of wind speed above the threshold, so a 30-knot wind moves not fifty percent more snow than a 20-knot wind but something over three times as much, and one bad thirty-six-hour blow puts down more than a whole quiet January. That there are two transport modes and they behave completely differently: SALTATION, grains bouncing in a shallow moving carpet within the first ten or fifteen centimetres of the surface, which is where most of the mass actually is; and SUSPENSION, the fine stuff carried up into the air column, which is what makes a whiteout and which is mostly LOST — sublimating in transit, so a long fetch delivers measurably less snow to the fence than a short one because the air ate it on the way. That the threshold friction velocity is a property of the SNOW and not the wind: fresh dry snow starts moving in a breeze, and the same snow eight hours later, wind-packed and slightly sintered, will not move at twice that speed, which is exactly why a ground blizzard runs out of material without anything falling and then finds more when the surface is broken. That POROSITY IS THE WHOLE DESIGN and the answer is counterintuitive — a fence about half open holds far more snow than a solid one, because a solid fence throws a violent lee eddy that scours a pit immediately behind it and drops a short steep drift close in, while a porous fence bleeds enough air through to kill the eddy, so the wake reattaches five or six fence heights downwind and the drift lies out long, shallow and enormous. That an ideally porous fence stores something like six to eight times its own height squared in snow per metre of length, and a solid one stores a fraction of that. That the BOTTOM GAP is the difference between a fence that works for a season and a fence that buries itself in a week: leave roughly a tenth to a seventh of the fence height clear at the ground and the accelerated jet under the panel scours the snow away from the fence's own feet and pushes the whole drift downwind where it belongs; set the panel on the ground and deposition begins at the fence, climbs the fence, and the fence is out of service and cannot be recovered until spring. That SET-BACK is the arithmetic everybody gets wrong: the drift will run out roughly thirty-five times the fence height, so a four-foot fence needs something like forty-five metres of clear ground before the road shoulder, and a fence set close to the road is not a partly-effective fence, it is a machine for putting a drift on the pavement. That deposited drift snow is not the snow that fell — it arrives already broken into rounded grains and packs to two or three times the density of new snowfall, then sinters harder every hour, which is why a two-day-old drift takes a wing plough and a one-hour-old drift takes a broom. That the drift reaches EQUILIBRIUM: once its profile matches the flow, the fence stops capturing and everything arriving simply goes over the top and lands on the road, so a fence at capacity is functionally not there. That scour and deposition are the same process with the sign flipped, so the same wind that is building a five-foot cornice at forty metres is cutting a hollow at two. That the fence itself is the least interesting object on the page — laths, wire, steel posts, four dollars a running foot, and the whole of its behaviour is set by how much air goes through it and how much goes under.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wind, the grains and the flat light, and that register is LOUD, DRY, ABRASIVE, GRANULAR and BUSY — a shallow carpet of snow moving fast and continuously across the whole floor of the frame at all times, in visible streamers that braid and split around every obstruction; grain hitting lath hard enough to be a rattle and not a whisper; the fence panel working measurably against its staples; the whole picture in flat total overcast so there is no shadow anywhere, no horizon anywhere, no modelling except what the drift's own curvature does to multiply-scattered light. The air is not empty and never quiet. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the drift goes on building whether or not anybody touches a lath. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT a screensaver, NOT stately, NOT reverent, NOT bleak, NOT ominous, NOT lonely — this is a working fence in a stubble field on a Thursday with a truck due through and the wind holding steady.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. Snow is NOT white here and its value is COMPUTED, never chosen: the sky is a total overcast dome of near-uniform luminance, so every point on the ground is lit almost entirely by multiply-scattered light and its rendered value falls out of local surface curvature and sky-view factor alone — a convex drift crest sees nearly the whole dome and comes out a hard bright grey-white (#eef2f4), a concave scour hollow sees much less of it and goes a genuine deep blue-grey (#b9c8d4), and the tightest lee pockets and the cornice undercut go further still (#8fa3b4). Because the sky and the far ground converge on the same value (#d9dde0) there is no horizon line rendered anywhere and the top third of the frame and the far fifth of the field are honestly the same tone, which is not a stylistic wash but an arithmetic consequence, and it means the drift's far end genuinely dissolves. Suspended snow in the air column reduces contrast over distance by a real extinction term, so the far posts are measurably softer than the near ones and get softer when the wind gusts. The saltation carpet is rendered as actual grains at true relative scale, each catching the dome as a small flat highlight, so the moving layer reads as a bright granular haze lying along the ground rather than as a filter over the image. Against all of that, the fence is the only warm thing on the page: lath weathered oxide red where the paint has held (#8c3a26), sandblasted to a chalky pink-grey on the windward faces where four winters of saltating grain have taken the paint off at exactly saltation height and nowhere else (#b58f80), and bare grey split lath where a slat has lost it entirely (#9a9086), with steel T-posts and their punched studs in a dull cold grey (#55564f) and rusted twist-wire at every tie (#6b4a35). Stubble showing through the scour zone is bleached wheat straw (#c8bda0), and it is the only thing in frame that is not snow, steel or wood. Exactly one chip of highway-orange delineator (#ff5a1f) is held strictly for the three plastic reflector tabs wired to the fence at hundred-foot intervals and for the strip of orange baling twine on the round bale downwind — it appears nowhere else on the page, never on snow, never on lath, never on steel. Flat, hard, high contrast at the near end and honestly extinguished at the far end; no glow, no bloom, no lens flare, no soft focus, no vignette, no blue-hour tinting, no gradients other than honest sky-view shading, honest atmospheric extinction and honest grain highlight.">
  <meta name="outbox-spec-wildcard" content="There is a single round hay bale sitting out in the stubble about forty metres downwind of the fence, dropped off a truck at some point and never picked up, still with a strip of orange twine round it. The engine treats it exactly as it treats the fence: a real solid obstruction in the flow solve, zero porosity, no bottom gap, so it builds its own honest miniature drift — a scour crescent immediately behind it and a long tapering comet tail running downwind, which is a completely different shape from anything the porous fence produces and sits in the same frame for comparison that nobody makes. It is already about a third buried at load. It cannot be moved, cannot be clicked, cannot be affected in any way, and nothing on the page accounts for it. Same bale, same twine, same place, every visit — and it gets deeper every visit and never comes out.">
  <meta name="outbox-spec-forbidden" content="NO snow-as-metaphor for anything — not blankness, not erasure, not forgetting, not purity, not what covers over, not what accumulates, not 'it buries everything eventually'; this is deposited mass at 350 kilos the cubic metre with a threshold friction velocity, and it has nothing to teach anybody. ABSOLUTELY NO winter lyricism: no describing snow as soft, hushed, gentle, feathered, sugar, lace, ash or falling like anything; no crystal reverie; no 'no two alike'; no white-as-silence, because nothing here is silent and nothing here is falling. NO whiteout as void, abyss, dissolution, the sublime, or nature's indifference; the horizon is missing because sky luminance and ground luminance converge, and that is the entire content of it. NO cozy: no woodstove, no coffee thermos, no snowed-in warmth, no waiting-out-the-storm, no somebody-inside-a-house. NO survival or danger-porn: no getting lost twenty feet from the door, no frozen bodies, no cautionary tale, no dread, no foreshadowed accident, no 'the road is closed and nobody knows'; a truck goes through and keeps going. NO prairie Americana whatsoever: no big sky, no amber waves, no Little House, no homesteader hardship, no Willa Cather, no Fargo, no woodchipper joke, no upper-midwest accent comedy, no aren't-they-hardy condescension, no farm-crisis pathos, no explaining North Dakota to anybody, and NO settler-and-Native history imported as atmosphere or subtext. NO 1974-as-period-signifier, NO oil-crisis drift, NO Watergate, NO 70s retro-kitsch, NO camp affection for the fence, the T-posts or the reflector tabs. NO nostalgia, NO wistfulness, NO 'nobody puts up lath fence anymore / it's all plastic mesh now / the county crews are gone' decline narrative — the fence went up in October and it is working this minute. NO craftsman-sage register, NO 'the old road men knew where to set them', NO folk-wisdom, NO trade mystique, NO master-and-apprentice arc, NO wise-absent-figure who paced it off. NO climate sermon and NO ecological elegy. NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery, chillout or screensaver framing, and no 'let it settle you'; the piece is loud, granular and abrasive from the first frame. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the bale, the missing horizon, the buried sections or the drift that never melts — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object in frame. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a flat grey afternoon. NO signal / transmission / frequency / broadcast framing of the wire's tone or the wind, despite both having a pitch. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the snow, the ground, the fence and the bale, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
/* laths counted west to east from the corner post. panel nine and panel ten
   are the two thirteen inches from the top of the wire. set-back paced off
   in October: thirty heights, not thirty-five. nothing here melts. */
(function(){
"use strict";

var C=document.getElementById('c'),X=C.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(window.innerWidth); H=Math.floor(window.innerHeight);
  C.width=Math.floor(W*DPR); C.height=Math.floor(H*DPR);
  C.style.width=W+'px'; C.style.height=H+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
}
resize(); window.addEventListener('resize',resize);

/* ------------------------------------------------------------------ *
 *  WORLD                                                              *
 *  x : metres along the fence line, 0..200                            *
 *  y : metres downwind of the fence, -12 (upwind) .. 60               *
 * ------------------------------------------------------------------ */
var FENCE_H=1.22;                 // 4 ft
var NX=200, NY=110;               // ground grid
var DX=1.0, DY=0.72;              // metres per cell
var Y0=-14;                       // grid y origin

var LATHS_PER_PANEL=16;
var NPANEL=25;                    // 25 panels * 8 m = 200 m
var PANEL_W=8.0;

var SEED=20740117;
function rnd(){ SEED^=SEED<<13; SEED^=SEED>>>17; SEED^=SEED<<5; SEED>>>=0; return SEED/4294967296; }

/* ---------- state ---------- */
var G={
  h:null,        // elevation, m
  rho:null,      // deposited density kg/m3
  age:null,      // sintering age, hours
  laths:null,    // Uint8Array NPANEL*LATHS_PER_PANEL
  gap:null,      // bottom gap per panel, m
  hours:0
};

function idx(i,j){return j*NX+i;}

function freshWorld(){
  G.h=new Float32Array(NX*NY);
  G.rho=new Float32Array(NX*NY);
  G.age=new Float32Array(NX*NY);
  G.laths=new Uint8Array(NPANEL*LATHS_PER_PANEL);
  G.gap=new Float32Array(NPANEL);
  var i,j,p,k;
  for(p=0;p<NPANEL;p++){
    G.gap[p]=0.14;                       // about h/9 at load
    for(k=0;k<LATHS_PER_PANEL;k++){
      var open = (rnd()<0.06)?0:1;       // a few already gone
      G.laths[p*LATHS_PER_PANEL+k]=open;
    }
  }
  /* two panels start effectively choked with a very tall drift right at them */
  G.gap[9]=0.015; G.gap[10]=0.02;
  for(k=0;k<LATHS_PER_PANEL;k++){
    G.laths[9*LATHS_PER_PANEL+k]=1;
    G.laths[10*LATHS_PER_PANEL+k]=1;
  }
  /* thirty hours of blow already in the ground before anyone arrives */
  for(i=0;i<NX;i++)for(j=0;j<NY;j++){
    var y=Y0+j*DY;
    var base=0.06+0.05*Math.sin(i*0.21)+0.03*Math.sin(i*0.07+1.3);
    var d=0;
    if(y>0.4){
      var t=y/(FENCE_H*35);
      d=Math.exp(-Math.pow((t-0.16)/0.19,2))*0.88;
      d*= 0.55+0.45*Math.sin(i*0.09+0.6);
    } else if(y>-2.2){
      d=-0.10*Math.exp(-Math.pow((y+0.9)/1.1,2));    // footing scour
    }
    /* the two loaded panels: drift piled at the fence, thirteen inches down */
    var px=i/PANEL_W;
    if(px>8.6&&px<11.4&&y>-1.2&&y<5){
      d+= (FENCE_H-0.33)*Math.exp(-Math.pow((y-0.8)/2.0,2))*0.9;
    }
    G.h[idx(i,j)]=base+d;
    G.rho[idx(i,j)]=300+90*rnd();
    G.age[idx(i,j)]=6+24*rnd();
  }
  G.hours=30;
}

function save(){
  try{
    var o={
      v:3,
      h:Array.prototype.slice.call(G.h).map(function(v){return Math.round(v*1000);}),
      r:Array.prototype.slice.call(G.rho).map(function(v){return Math.round(v);}),
      a:Array.prototype.slice.call(G.age).map(function(v){return Math.round(v);}),
      l:Array.prototype.slice.call(G.laths),
      g:Array.prototype.slice.call(G.gap).map(function(v){return Math.round(v*1000);}),
      t:G.hours
    };
    localStorage.setItem('emmons_sec9',JSON.stringify(o));
  }catch(e){}
}
function load(){
  try{
    var s=localStorage.getItem('emmons_sec9'); if(!s) return false;
    var o=JSON.parse(s); if(!o||o.v!==3||!o.h||o.h.length!==NX*NY) return false;
    G.h=new Float32Array(NX*NY); G.rho=new Float32Array(NX*NY); G.age=new Float32Array(NX*NY);
    for(var q=0;q<NX*NY;q++){ G.h[q]=o.h[q]/1000; G.rho[q]=o.r[q]; G.age[q]=o.a[q]; }
    G.laths=new Uint8Array(o.l); G.gap=new Float32Array(NPANEL);
    for(var p=0;p<NPANEL;p++)G.gap[p]=o.g[p]/1000;
    G.hours=o.t||30;
    return true;
  }catch(e){ return false; }
}
if(!load()) freshWorld();

/* ------------------------------------------------------------------ *
 *  BALE — solid, no porosity, no gap. Forty metres downwind.          *
 * ------------------------------------------------------------------ */
var BALE={x:118.0, y:40.0, r:0.78, len:1.5};

/* ------------------------------------------------------------------ *
 *  WIND — log profile, gusts on their own clock, direction backing    *
 * ------------------------------------------------------------------ */
var Wind={
  Uref:13.4,      // m/s at 10 m  (~26 kt)
  U:13.4,
  dir:0.0,        // radians of skew off fence-normal
  g1:0,g2:0,g3:0,
  ustar:0.62
};
var z0=0.00035;   // roughness over packed drift
function windTick(dt,t){
  Wind.g1+= dt*0.31; Wind.g2+= dt*0.113; Wind.g3+= dt*0.047;
  var gust = 0.62*Math.sin(Wind.g1)+0.85*Math.sin(Wind.g2*1.7+1.1)
           + 1.35*Math.sin(Wind.g3*2.3+0.4)+0.55*Math.sin(Wind.g1*0.43+2.2);
  Wind.U = Wind.Uref + gust*1.35;
  if(Wind.U<10.3) Wind.U=10.3;
  Wind.dir = 0.20 + 0.07*Math.sin(t*0.0031) + 0.02*Math.sin(Wind.g2*0.9);
  Wind.ustar = Wind.U*0.41/Math.log(10/z0);
}

/* ------------------------------------------------------------------ *
 *  POROSITY / PRESSURE LOSS per panel                                  *
 * ------------------------------------------------------------------ */
var panelSolid=new Float32Array(NPANEL);
var panelK=new Float32Array(NPANEL);
var panelBuried=new Uint8Array(NPANEL);
var panelDriftH=new Float32Array(NPANEL);

function panelUpdate(){
  for(var p=0;p<NPANEL;p++){
    var s=0;
    for(var k=0;k<LATHS_PER_PANEL;k++) s+=G.laths[p*LATHS_PER_PANEL+k];
    var solid=s/LATHS_PER_PANEL*0.62;              // laths cover 62% when all present
    panelSolid[p]=solid;
    var beta=1-solid;                               // open fraction
    if(beta<0.02)beta=0.02;
    /* pressure loss coefficient of a screen: K = ((1-b^2)/b^2) ish */
    panelK[p]=(1-beta*beta)/(beta*beta);
    if(panelK[p]>420)panelK[p]=420;
    /* drift height at the fence -> burial */
    var i0=Math.floor(p*PANEL_W), i1=Math.min(NX-1,Math.floor((p+1)*PANEL_W));
    var jf=Math.round((0.0-Y0)/DY);
    var mx=0;
    for(var i=i0;i<=i1;i++){
      var hh=G.h[idx(i,jf)]; if(hh>mx)mx=hh;
    }
    panelDriftH[p]=mx;
    var top=G.gap[p]+FENCE_H;
    if(mx>=top-0.02) panelBuried[p]=1;
  }
}
panelUpdate();

/* ------------------------------------------------------------------ *
 *  FLOW SOLVE — shear stress ratio field over the ground              *
 *  Cheap but honest: bleed through screen, under-jet, lee eddy,       *
 *  reattachment at 5-6 H for porous, 1-2 H for solid.                 *
 * ------------------------------------------------------------------ */
var tau=new Float32Array(NX*NY);       // ratio of local shear to upwind shear

function flowSolve(){
  var p,i,j;
  for(i=0;i<NX;i++){
    p=Math.min(NPANEL-1,Math.floor(i/PANEL_W));
    /* neighbouring panels bleed into each other: smooth K along x */
    var pm=Math.max(0,p-1), pp=Math.min(NPANEL-1,p+1);
    var K=(panelK[pm]*0.22+panelK[p]*0.56+panelK[pp]*0.22);
    var bur=panelBuried[p];
    var gap=G.gap[p];
    var solidness=Math.min(1,K/28);          // 0 fully open, 1 near-solid
    if(bur){ solidness=0; K=0; }
    /* reattachment length in fence heights: solid ~2, half-open ~6 */
    var xr = bur?0.6 : (1.6 + 4.9*(1-solidness)*(1-solidness*0.3));
    var Xr = xr*FENCE_H*(0.5+0.5*(1-solidness));
    if(Xr<0.9)Xr=0.9;
    /* momentum deficit right at the fence */
    var def = bur?0.05 : Math.min(0.94, 0.30+0.66*solidness);
    /* under-jet strength from bottom gap; peaks near h/10..h/7 */
    var gr=gap/FENCE_H;
    var jet = bur?0 : Math.max(0, 1.0-Math.pow((gr-0.115)/0.115,2))*Math.min(1,gr*14);
    if(jet<0)jet=0;

    for(j=0;j<NY;j++){
      var y=Y0+j*DY;
      var t;
      if(y<-1.6){
        t=1.0+0.02*Math.sin(i*0.3);                  // undisturbed fetch
      } else if(y<0.0){
        /* upwind bolster: air piling on the panel */
        t=1.0-def*0.55*Math.exp(-Math.pow((y+0.4)/1.1,2))+jet*0.85*Math.exp(-Math.pow((y+0.35)/0.7,2));
      } else {
        var u=y/Xr;
        /* wake recovery: deficit decays, overshoot past reattachment */
        var wake = def*Math.exp(-Math.pow(u*0.82,1.45));
        t = 1.0 - wake;
        /* under-jet scour lane right at the feet */
        t += jet*1.15*Math.exp(-Math.pow((y-0.35)/0.85,2));
        /* solid fences: violent lee eddy, reverse flow scour pit close in */
        if(solidness>0.62 && !bur){
          var e=(solidness-0.62)/0.38;
          t -= e*0.42*Math.exp(-Math.pow((y-0.5)/0.55,2));
          t += e*0.30*Math.exp(-Math.pow((y-2.2)/1.6,2));
        }
        /* far downwind recovery back toward 1 */
        t = t + (1.0-t)*Math.min(1, Math.pow(y/(Xr*8.5),1.6))*0.92;
      }
      /* surface slope effect: windward faces speed up, lees slow down */
      var jm=Math.max(0,j-1), jp2=Math.min(NY-1,j+1);
      var slope=(G.h[idx(i,jp2)]-G.h[idx(i,jm)])/(2*DY);
      t *= (1 - slope*0.95);
      /* elevation exposure: crests see more wind */
      t *= 1 + (G.h[idx(i,j)]-0.12)*0.30;
      if(t<0.02)t=0.02; if(t>2.4)t=2.4;
      tau[idx(i,j)]=t;
    }
  }
  /* the bale: zero porosity, no gap. scour crescent + long comet tail. */
  var bi=Math.round(BALE.x/DX), bj=Math.round((BALE.y-Y0)/DY);
  var buriedFrac=Math.min(0.95,(G.h[idx(bi,bj)]||0.1)/(BALE.r*2));
  var eff=(1-buriedFrac)*1.0;
  for(i=Math.max(0,bi-14);i<Math.min(NX,bi+14);i++){
    for(j=Math.max(0,bj-6);j<Math.min(NY,bj+34);j++){
      var dx=(i-bi)*DX, dy=(j-bj)*DY;
      var lat=Math.abs(dx);
      if(dy>-1.4&&dy<26){
        var spread=0.85+dy*0.16;
        var lateral=Math.exp(-Math.pow(lat/spread,2));
        var q=idx(i,j);
        if(dy<1.6){
          tau[q]*=1-eff*0.72*lateral*Math.exp(-Math.pow((dy-0.4)/1.0,2));
          /* horseshoe scour: accelerated round the shoulders */
          tau[q]*=1+eff*0.55*Math.exp(-Math.pow((lat-1.15)/0.5,2))*Math.exp(-Math.pow(dy/1.6,2));
        } else {
          tau[q]*=1-eff*0.50*lateral*Math.exp(-dy/7.5);
        }
      }
      if(dy<0&&dy>-2.2){
        tau[idx(i,j)]*=1+eff*0.30*Math.exp(-Math.pow(lat/1.2,2));
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 *  TRANSPORT — threshold, cubic flux, saltation + suspension          *
 * ------------------------------------------------------------------ */
var suspend=new Float32Array(NX*NY);
var salt=new Float32Array(NX*NY);
var impactRate=0, hissLevel=0;

function threshold(q){
  /* threshold friction velocity climbs with density and sintering age */
  var d=G.rho[q], a=G.age[q];
  return 0.22 + (d-280)*0.00085 + Math.min(0.30,Math.log(1+a)*0.048);
}

function transportStep(dtH){
  var i,j,q;
  var us=Wind.ustar;
  impactRate=0; hissLevel=0;
  var totalSusp=0;
  /* march downwind, cell column by column: flux carried, delivered, lost */
  for(i=0;i<NX;i++){
    var carry=0.0;
    for(j=0;j<NY;j++){
      q=idx(i,j);
      var ul=us*Math.sqrt(tau[q]);
      var ut=threshold(q);
      var flux;
      if(ul>ut){
        var ex=ul-ut;
        flux = 0.0068*(ul*ex*(ul+ut))*1.0;   // ~ cube of u* above threshold
      } else flux=0;
      var cap=flux;
      var dm=(cap-carry);
      if(dm>0){
        /* erosion: limited by availability and by cohesion */
        var avail=Math.max(0,G.h[q]-0.005);
        var resist=1/(1+G.age[q]*0.035+(G.rho[q]-300)*0.0022);
        var e=Math.min(dm*0.42*resist, avail*24);
        carry+=e;
        G.h[q]-=e*dtH*0.0072;
        if(G.h[q]<0.004)G.h[q]=0.004;
        G.age[q]*=0.55;
        G.rho[q]=Math.max(280,G.rho[q]-4*dtH);
      } else {
        var dep=Math.min(carry, -dm*0.55);
        carry-=dep;
        G.h[q]+=dep*dtH*0.0072;
        var newr=305;
        var m0=G.rho[q], hh=G.h[q];
        G.rho[q]=m0+(newr-m0)*Math.min(0.4,dep*0.05);
        G.age[q]*=0.80;
      }
      /* suspension: fine fraction lifted, sublimating as it goes */
      var lift=Math.max(0,ul-ut)*0.30;
      suspend[q]=suspend[q]*0.86+lift*0.42;
      carry*=0.9982;                      // sublimation loss over the fetch
      salt[q]=carry;
      totalSusp+=suspend[q];
      /* sintering */
      G.age[q]+=dtH;
      G.rho[q]=Math.min(470,G.rho[q]+dtH*1.9*(1-(G.rho[q]-280)/200));
      hissLevel+=carry*(G.rho[q]/400);
    }
  }
  hissLevel/= (NX*NY*0.35);
  suspTotal = totalSusp/(NX*NY);
  /* grain impacts on lath: only where a panel still stands and salt is high */
  var jf=Math.round((0.0-Y0)/DY);
  for(var p=0;p<NPANEL;p++){
    if(panelBuried[p])continue;
    var i0=Math.floor(p*PANEL_W),i1=Math.min(NX-1,Math.floor((p+1)*PANEL_W));
    var s=0;
    for(i=i0;i<=i1;i++) s+=salt[idx(i,Math.max(0,jf-2))];
    impactRate += s*panelSolid[p];
  }
  G.hours+=dtH;
}
var suspTotal=0.4;

/* avalanching: angle of repose relaxation */
function avalanche(){
  var tanA=0.62;   // ~32 degrees for drift snow
  for(var pass=0;pass<2;pass++){
    for(var i=0;i<NX;i++)for(var j=0;j<NY-1;j++){
      var a=idx(i,j),b=idx(i,j+1);
      var d=G.h[a]-G.h[b];
      var lim=tanA*DY*(1+G.age[a]*0.012);
      if(d>lim){ var m=(d-lim)*0.32; G.h[a]-=m; G.h[b]+=m; G.age[b]*=0.6; }
      else if(-d>lim){ var m2=(-d-lim)*0.32; G.h[b]-=m2; G.h[a]+=m2; G.age[a]*=0.6; }
    }
    for(var j2=0;j2<NY;j2++)for(var i2=0;i2<NX-1;i2++){
      var a2=idx(i2,j2),b2=idx(i2+1,j2);
      var d2=G.h[a2]-G.h[b2];
      var lim2=tanA*DX*(1+G.age[a2]*0.012);
      if(d2>lim2){ var m3=(d2-lim2)*0.28; G.h[a2]-=m3; G.h[b2]+=m3; }
      else if(-d2>lim2){ var m4=(-d2-lim2)*0.28; G.h[b2]-=m4; G.h[a2]+=m4; }
    }
  }
}

/* ------------------------------------------------------------------ *
 *  CAMERA / PROJECTION                                                *
 *  Standing height, 30 m out in the stubble, oblique to the fence.    *
 * ------------------------------------------------------------------ */
var cam={ along:26.0, eyeH:1.62, standOff:30.0, yaw:0.36 };

function proj(wx,wy,wz){
  /* world -> camera. camera sits at (cam.along, standOff) looking back at fence */
  var ex=wx-cam.along;
  var ey=cam.standOff-wy;      // depth: distance from viewer toward fence
  var c=Math.cos(cam.yaw), s=Math.sin(cam.yaw);
  var rx=ex*c - ey*s*0.0;      // slight skew keeps fence lower-left to upper-right
  var d = ey + ex*s*0.42;
  if(d<1.2) d=1.2;
  var f = 0.62*Math.min(W,H*1.7);
  var sx = W*0.44 + (ex*c*f)/d;
  var sy = H*0.585 - ((wz-cam.eyeH)* -1 * f)/d - (f*cam.eyeH)/d + (f*cam.eyeH)/d;
  sy = H*0.585 + ((cam.eyeH-wz)*f)/d;
  return {x:sx,y:sy,d:d,f:f};
}

/* atmospheric extinction from suspended snow */
function extinct(d){
  var k=0.0102*(0.55+suspTotal*2.6+ (Wind.U-12)*0.014);
  return Math.exp(-k*d);
}
var FAR=[0.850,0.867,0.878];   // #d9dde0

function shade(lum,d){
  var e=extinct(d);
  var r=lum[0]*e+FAR[0]*(1-e);
  var g=lum[1]*e+FAR[1]*(1-e);
  var b=lum[2]*e+FAR[2]*(1-e);
  return 'rgb('+(r*255|0)+','+(g*255|0)+','+(b*255|0)+')';
}

/* sky-view factor shading: convexity -> bright, concavity -> deep blue-grey */
function groundColour(i,j){
  var q=idx(i,j);
  var im=Math.max(0,i-1), ip=Math.min(NX-1,i+1);
  var jm=Math.max(0,j-1), jp=Math.min(NY-1,j+1);
  var lap = (G.h[idx(im,j)]+G.h[idx(ip,j)]+G.h[idx(i,jm)]+G.h[idx(i,jp)])*0.25 - G.h[q];
  var curv = -lap*11.0;                 // + convex, - concave
  var t=Math.max(-1,Math.min(1,curv));
  var r,g,b;
  if(t>=0){
    /* d9dde0 -> eef2f4 */
    r=0.851+t*(0.933-0.851); g=0.867+t*(0.949-0.867); b=0.878+t*(0.957-0.878);
  } else {
    var u=-t;
    /* d9dde0 -> b9c8d4 -> 8fa3b4 */
    if(u<0.55){ var v=u/0.55;
      r=0.851+v*(0.725-0.851); g=0.867+v*(0.784-0.867); b=0.878+v*(0.831-0.878);
    } else { var v2=(u-0.55)/0.45;
      r=0.725+v2*(0.561-0.725); g=0.784+v2*(0.639-0.784); b=0.831+v2*(0.706-0.831);
    }
  }
  /* older, denser snow reads very slightly harder */
  var dn=(G.rho[q]-300)/180;
  r+=dn*0.012; g+=dn*0.012; b+=dn*0.010;
  return [r,g,b];
}

/* ------------------------------------------------------------------ *
 *  SALTATION PARTICLES                                                *
 * ------------------------------------------------------------------ */
var NP=2600, P=new Float32Array(NP*6);   // x,y,z,vy,vz,life
function seedP(k){
  var o=k*6;
  P[o]=cam.along-34+rnd()*72;
  P[o+1]=Y0-2+rnd()*(NY*DY+8);
  var i=Math.max(0,Math.min(NX-1,Math.round(P[o]/DX)));
  var j=Math.max(0,Math.min(NY-1,Math.round((P[o+1]-Y0)/DY)));
  P[o+2]=G.h[idx(i,j)]+rnd()*0.10;
  P[o+3]=2+rnd()*7;
  P[o+4]=rnd()*0.9;
  P[o+5]=0.4+rnd()*1.4;
}
for(var k=0;k<NP;k++)seedP(k);

function stepP(dt){
  for(var k=0;k<NP;k++){
    var o=k*6;
    var i=Math.max(0,Math.min(NX-1,Math.round(P[o]/DX)));
    var j=Math.max(0,Math.min(NY-1,Math.round((P[o+1]-Y0)/DY)));
    var q=idx(i,j);
    var t=tau[q];
    var sp=Wind.U*0.42*Math.sqrt(t);
    P[o+1]+= sp*dt;
    P[o]  += sp*dt*Math.sin(Wind.dir)*0.55;
    P[o+2]+= P[o+4]*dt;
    P[o+4]-= 9.81*dt*0.42;
    var gh=G.h[q];
    if(P[o+2]<=gh){
      P[o+2]=gh;
      if(t>0.55){ P[o+4]=0.55+rnd()*1.5*Math.sqrt(t); }
      else { P[o+4]=0.1+rnd()*0.4; }
    }
    P[o+5]-=dt;
    if(P[o+5]<=0 || P[o+1]>Y0+NY*DY+4 || P[o]<cam.along-40 || P[o]>cam.along+42) seedP(k);
  }
}

/* suspension puffs, drifting through the air column */
var NS=520, S=new Float32Array(NS*4);
function seedS(k){
  var o=k*4;
  S[o]=cam.along-40+rnd()*84;
  S[o+1]=Y0-4+rnd()*(NY*DY+14);
  S[o+2]=0.15+rnd()*4.2;
  S[o+3]=0.25+rnd()*0.7;
}
for(var k2=0;k2<NS;k2++)seedS(k2);

/* ------------------------------------------------------------------ *
 *  DRAW                                                               *
 * ------------------------------------------------------------------ */
var ribCache=null;

function draw(dt){
  /* sky: uniform overcast, no horizon */
  X.fillStyle='#d9dde0';
  X.fillRect(0,0,W,H);

  /* subtle vertical luminance from suspended snow density in the column */
  var gg=X.createLinearGradient(0,0,0,H*0.62);
  gg.addColorStop(0,'rgba(217,221,224,1)');
  gg.addColorStop(1,'rgba(214,219,223,1)');
  X.fillStyle=gg; X.fillRect(0,0,W,H*0.62);

  /* ---- ground: draw far to near as quads ---- */
  var i0=Math.max(0,Math.floor((cam.along-36)/DX));
  var i1=Math.min(NX-1,Math.ceil((cam.along+38)/DX));
  for(var j=NY-2;j>=0;j--){
    for(var i=i0;i<i1;i++){
      var y0=Y0+j*DY, y1=Y0+(j+1)*DY;
      var x0=i*DX, x1=(i+1)*DX;
      var a=proj(x0,y0,G.h[idx(i,j)]);
      var b=proj(x1,y0,G.h[idx(i+1,j)]);
      var c2=proj(x1,y1,G.h[idx(i+1,j+1)]);
      var d2=proj(x0,y1,G.h[idx(i,j+1)]);
      if(a.y<-60&&b.y<-60&&c2.y<-60&&d2.y<-60)continue;
      if(a.x>W+40&&b.x>W+40)continue;
      if(a.x<-40&&b.x<-40)continue;
      var col=groundColour(i,j);
      X.fillStyle=shade(col,(a.d+c2.d)*0.5);
      X.beginPath();
      X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.lineTo(c2.x,c2.y);X.lineTo(d2.x,d2.y);
      X.closePath(); X.fill();
    }
  }

  /* ---- stubble poking through the scour zones ---- */
  X.strokeStyle='rgba(200,189,160,0.85)'; X.lineWidth=1;
  SEED=99117;
  for(var s=0;s<560;s++){
    var sx=cam.along-34+rnd()*70;
    var sy=Y0+1+rnd()*(NY*DY-2);
    var si=Math.max(0,Math.min(NX-1,Math.round(sx/DX)));
    var sj=Math.max(0,Math.min(NY-1,Math.round((sy-Y0)/DY)));
    var gh=G.h[idx(si,sj)];
    if(gh>0.13)continue;
    var p0=proj(sx,sy,gh);
    var p1=proj(sx+0.02,sy,gh+0.11+rnd()*0.06);
    if(p0.d>34)continue;
    var e=extinct(p0.d);
    X.strokeStyle='rgba(200,189,160,'+(0.80*e).toFixed(2)+')';
    X.beginPath();X.moveTo(p0.x,p0.y);X.lineTo(p1.x,p1.y);X.stroke();
  }

  /* ---- the bale: solid obstruction, one third buried, orange twine ---- */
  drawBale();

  /* ---- fence ---- */
  drawFence();

  /* ---- saltation carpet: grains at true scale ---- */
  for(var k=0;k<NP;k++){
    var o=k*6;
    var pp=proj(P[o],P[o+1],P[o+2]);
    if(pp.d>52||pp.x<-8||pp.x>W+8||pp.y<-8||pp.y>H+8)continue;
    var e=extinct(pp.d);
    var sz=Math.max(0.55,(pp.f*0.0022)/pp.d);
    var hgt=P[o+2];
    var gi=Math.max(0,Math.min(NX-1,Math.round(P[o]/DX)));
    var gj=Math.max(0,Math.min(NY-1,Math.round((P[o+1]-Y0)/DY)));
    var rel=hgt-G.h[idx(gi,gj)];
    var al=(0.55+0.40*Math.max(0,1-rel*7))*e;
    X.fillStyle='rgba(240,244,246,'+al.toFixed(3)+')';
    X.fillRect(pp.x,pp.y,sz,sz*0.9);
  }

  /* ---- suspension: reduces contrast with distance ---- */
  for(var k3=0;k3<NS;k3++){
    var o3=k3*4;
    S[o3+1]+=Wind.U*0.78*dt;
    S[o3]+=Wind.U*0.30*dt*Math.sin(Wind.dir);
    S[o3+2]-=0.09*dt;
    if(S[o3+1]>Y0+NY*DY+16||S[o3+2]<0.05||S[o3]>cam.along+44||S[o3]<cam.along-44)seedS(k3);
    var ps=proj(S[o3],S[o3+1],S[o3+2]);
    if(ps.d>60||ps.x<-40||ps.x>W+40)continue;
    var rr=Math.max(2,(ps.f*0.055)/ps.d)*S[o3+3];
    var alpha=0.030*S[o3+3]*Math.min(1,suspTotal*3.4+0.35);
    X.fillStyle='rgba(226,231,234,'+alpha.toFixed(3)+')';
    X.beginPath();X.arc(ps.x,ps.y,rr,0,6.2832);X.fill();
  }

  /* ---- streamers: braided ribbons of blowing snow low over the ground ---- */
  drawStreamers();

  drawTruck(dt);
}

function drawBale(){
  var bi=Math.round(BALE.x/DX), bj=Math.round((BALE.y-Y0)/DY);
  var gh=G.h[idx(bi,bj)];
  var top=0.10+BALE.r*2;      // bale sits on original ground
  var buried=Math.max(0,Math.min(0.92,gh/(top)));
  var cx=BALE.x, cy=BALE.y;
  var seg=22;
  var pts=[];
  for(var a=0;a<=seg;a++){
    var th=Math.PI*a/seg;
    var wz=0.10+BALE.r+BALE.r*Math.cos(th)*0.98;
    var wy=cy+Math.sin(th)*0.0;
    var px=cx-BALE.len*0.5;
    pts.push([px,wy,wz]);
  }
  /* draw as a cylinder lying with axis across the wind */
  var pL=proj(cx-BALE.len*0.5,cy,0.10+BALE.r);
  var pR=proj(cx+BALE.len*0.5,cy,0.10+BALE.r);
  var pTop=proj(cx,cy,0.10+BALE.r*2);
  var pBot=proj(cx,cy,Math.max(gh,0.10));
  var e=extinct(pL.d);
  var rx=Math.abs(pR.x-pL.x)*0.5+2;
  var ry=Math.abs(pBot.y-pTop.y)*0.5;
  var ccx=(pL.x+pR.x)*0.5, ccy=(pTop.y+pBot.y)*0.5;
  X.save();
  X.beginPath();
  X.ellipse(ccx,ccy,rx,Math.max(3,ry),0,0,6.2832);
  X.clip();
  /* bale body: dull straw, extinguished by distance */
  var bg=X.createLinearGradient(ccx,ccy-ry,ccx,ccy+ry);
  bg.addColorStop(0,shade([0.784,0.741,0.627],pL.d));
  bg.addColorStop(0.55,shade([0.706,0.663,0.549],pL.d));
  bg.addColorStop(1,shade([0.612,0.576,0.478],pL.d));
  X.fillStyle=bg;
  X.fillRect(ccx-rx-2,ccy-ry-2,rx*2+4,ry*2+4);
  /* windings */
  X.strokeStyle='rgba(90,82,64,'+(0.30*e).toFixed(2)+')';
  X.lineWidth=1;
  for(var w=-4;w<=4;w++){
    X.beginPath();
    X.ellipse(ccx,ccy,Math.max(1,rx*(1-Math.abs(w)*0.02)),Math.max(2,ry*(1-Math.abs(w)*0.03)),0,0,6.2832);
    X.stroke();
  }
  /* the one chip of orange: baling twine */
  X.strokeStyle='rgba(255,90,31,'+(0.88*e).toFixed(2)+')';
  X.lineWidth=Math.max(1.2,rx*0.055);
  X.beginPath();
  X.moveTo(ccx-rx*0.18,ccy-ry); X.lineTo(ccx-rx*0.18,ccy+ry);
  X.stroke();
  X.restore();
  /* snow riding up the windward face */
  var pd=proj(cx,cy-BALE.r*0.7,Math.max(gh,0.10));
  X.fillStyle=shade([0.933,0.949,0.957],pd.d);
  X.beginPath();
  X.ellipse(ccx,pBot.y-1,rx*1.02,Math.max(2,ry*0.20),0,0,6.2832);
  X.fill();
}

function drawFence(){
  var jf=Math.round((0.0-Y0)/DY);
  var pStart=Math.max(0,Math.floor((cam.along-36)/PANEL_W));
  var pEnd=Math.min(NPANEL-1,Math.ceil((cam.along+38)/PANEL_W));
  for(var p=pEnd;p>=pStart;p--){
    var x0=p*PANEL_W;
    var gap=G.gap[p];
    var buried=panelBuried[p];
    var ii=Math.max(0,Math.min(NX-1,Math.round((x0+PANEL_W*0.5)/DX)));
    var gnd=G.h[idx(ii,jf)];
    /* posts every 2.67 m */
    for(var t=0;t<=3;t++){
      var px=x0+t*(PANEL_W/3);
      if(px>200)continue;
      var pi=Math.max(0,Math.min(NX-1,Math.round(px/DX)));
      var g2=G.h[idx(pi,jf)];
      var a=proj(px,0,g2);
      var b=proj(px,0,Math.max(g2, gap+FENCE_H+0.16));
      if(a.d>62)continue;
      if(b.y>a.y) continue;
      var e=extinct(a.d);
      var lw=Math.max(0.8,(a.f*0.0055)/a.d);
      X.strokeStyle=shade([0.333,0.337,0.310],a.d);
      X.lineWidth=lw;
      X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke();
      /* punched studs on the T-post */
      X.fillStyle=shade([0.286,0.290,0.267],a.d);
      var nst=8;
      for(var st=1;st<nst;st++){
        var fy=a.y+(b.y-a.y)*(st/nst);
        X.fillRect(b.x-lw*0.8,fy,lw*1.6,Math.max(0.7,lw*0.5));
      }
    }
    if(buried){
      /* buried section: cornice over where the panel was */
      continue;
    }
    /* laths */
    var per=PANEL_W/LATHS_PER_PANEL;
    for(var k=0;k<LATHS_PER_PANEL;k++){
      if(!G.laths[p*LATHS_PER_PANEL+k])continue;
      var lx=x0+(k+0.5)*per;
      if(lx>200)continue;
      var li=Math.max(0,Math.min(NX-1,Math.round(lx/DX)));
      var lg=G.h[idx(li,jf)];
      var zb=Math.max(lg, gap);
      var zt=gap+FENCE_H;
      if(zt<=zb)continue;
      var pb=proj(lx,0,zb), pt2=proj(lx,0,zt);
      if(pb.d>62)continue;
      var e2=extinct(pb.d);
      var wpx=Math.max(0.9,(pb.f*0.036)/pb.d);
      /* lath colour: oxide red held, sandblasted band at saltation height,
         a few bare grey split laths */
      SEED=(p*97+k*13+7)>>>0; rnd();
      var bare = (rnd()<0.09);
      var bandLo=zb, bandHi=Math.min(zt, gap+0.30);
      var yTop=pt2.y, yBot=pb.y;
      var yBandTop=proj(lx,0,bandHi).y;
      X.fillStyle= bare ? shade([0.604,0.565,0.525],pb.d) : shade([0.549,0.227,0.149],pb.d);
      X.fillRect(pb.x-wpx*0.5,yTop,wpx,Math.max(1,yBandTop-yTop));
      X.fillStyle= bare ? shade([0.643,0.604,0.561],pb.d) : shade([0.710,0.561,0.502],pb.d);
      X.fillRect(pb.x-wpx*0.5,yBandTop,wpx,Math.max(1,yBot-yBandTop));
    }
    /* twist wire ties, top and bottom strand */
    var strandZ=[gap+FENCE_H-0.06, gap+FENCE_H*0.5, gap+0.05];
    for(var sIdx=0;sIdx<3;sIdx++){
      var z=strandZ[sIdx];
      var wa=proj(x0,0,z), wb=proj(Math.min(200,x0+PANEL_W),0,z);
      if(wa.d>62)continue;
      X.strokeStyle=shade([0.420,0.290,0.208],wa.d);
      X.lineWidth=Math.max(0.6,(wa.f*0.0016)/wa.d);
      X.beginPath();X.moveTo(wa.x,wa.y);X.lineTo(wb.x,wb.y);X.stroke();
    }
    /* three orange delineator tabs at hundred-foot intervals (x = 30, 91, 152 m) */
    var tabs=[30.4,91.2,152.0];
    for(var tb=0;tb<3;tb++){
      var tx=tabs[tb];
      if(tx<x0||tx>=x0+PANEL_W)continue;
      var tp=proj(tx,0,gap+FENCE_H*0.72);
      if(tp.d>62)continue;
      var e3=extinct(tp.d);
      var tw=Math.max(1.4,(tp.f*0.048)/tp.d);
      X.fillStyle='rgba(255,90,31,'+(0.94*e3).toFixed(2)+')';
      X.fillRect(tp.x-tw*0.5,tp.y-tw*1.5,tw,tw*3);
    }
  }
}

function drawStreamers(){
  /* braided ribbons: sample tau along x, draw low bright bands that split
     around obstructions */
  var jStart=2;
  X.globalCompositeOperation='lighter';
  for(var s=0;s<26;s++){
    var sx=cam.along-32+ (s/26)*66 + ((tNow*Wind.U*0.06+s*3.1)%2.4);
    var si=Math.max(0,Math.min(NX-1,Math.round(sx/DX)));
    X.beginPath();
    var started=false;
    for(var j=jStart;j<NY;j+=2){
      var q=idx(si,j);
      var y=Y0+j*DY;
      var wig=Math.sin(y*0.6+tNow*2.1+s)*0.16*tau[q];
      var pp=proj(sx+wig+y*Math.sin(Wind.dir)*0.10,y,G.h[q]+0.035);
      if(pp.d>44)break;
      if(!started){X.moveTo(pp.x,pp.y);started=true;}else X.lineTo(pp.x,pp.y);
    }
    if(!started)continue;
    var al=0.030+0.035*Math.max(0,(Wind.U-12)/6);
    X.strokeStyle='rgba(238,242,244,'+al.toFixed(3)+')';
    X.lineWidth=2.2;
    X.stroke();
  }
  X.globalCompositeOperation='source-over';
}

/* ------------------------------------------------------------------ *
 *  TRUCK — comes up the grade once, gears down, goes on               *
 * ------------------------------------------------------------------ */
var truck={active:false,t:0,next:70+Math.random()*160,dir:1};
function drawTruck(dt){
  truck.next-=dt;
  if(!truck.active&&truck.next<=0){ truck.active=true; truck.t=0; truck.dir=Math.random()<0.5?1:-1; }
  if(!truck.active)return;
  truck.t+=dt;
  var dur=17;
  if(truck.t>dur){ truck.active=false; truck.next=150+Math.random()*260; return; }
  var u=truck.t/dur;
  /* the road grade is at the bottom of frame, y = 37 m (30 heights set-back) */
  var ry=NY*DY+Y0-2.5;
  var tx = truck.dir>0 ? (cam.along-40+u*90) : (cam.along+46-u*90);
  var pp=proj(tx,ry,0.35);
  if(pp.d>3&&pp.x>-140&&pp.x<W+140){
    var e=extinct(pp.d);
    var wpx=Math.max(6,(pp.f*0.062)/pp.d)*3.0;
    var hpx=wpx*0.44;
    X.fillStyle='rgba(112,116,112,'+(0.55*e).toFixed(2)+')';
    X.fillRect(pp.x-wpx*0.5,pp.y-hpx,wpx,hpx);
    X.fillStyle='rgba(96,100,98,'+(0.45*e).toFixed(2)+')';
    X.fillRect(pp.x-wpx*0.5,pp.y-hpx*1.55,wpx*0.34,hpx*0.6);
    /* snow kicked up behind it */
    for(var q=0;q<14;q++){
      var kx=pp.x-truck.dir*(wpx*0.5+q*wpx*0.16);
      X.fillStyle='rgba(236,240,243,'+(0.10*e*(1-q/14)).toFixed(3)+')';
      X.beginPath();X.arc(kx,pp.y-hpx*0.3-q*1.2,wpx*0.16+q*0.9,0,6.2832);X.fill();
    }
  }
  truckAudio(u);
}

/* ------------------------------------------------------------------ *
 *  AUDIO — all synthesised                                            *
 * ------------------------------------------------------------------ */
var AC=null,nodes={},audioOn=false;
function noiseBuffer(ctx,sec){
  var n=ctx.sampleRate*sec, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function initAudio(){
  if(audioOn)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){return;}
  audioOn=true;
  var master=AC.createGain(); master.gain.value=0.0; master.connect(AC.destination);
  nodes.master=master;
  master.gain.setTargetAtTime(0.55,AC.currentTime,3.0);

  /* wind bed: broadband noise, level and tilt from instantaneous U */
  var src=AC.createBufferSource(); src.buffer=noiseBuffer(AC,4); src.loop=true;
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=0.5;
  var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=60;
  var wg=AC.createGain(); wg.gain.value=0.16;
  src.connect(hp); hp.connect(lp); lp.connect(wg); wg.connect(master);
  src.start();
  nodes.windLP=lp; nodes.windG=wg;

  /* higher band: air past wire and lath edges */
  var src2=AC.createBufferSource(); src2.buffer=noiseBuffer(AC,3); src2.loop=true;
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2300; bp.Q.value=1.1;
  var g2=AC.createGain(); g2.gain.value=0.05;
  src2.connect(bp); bp.connect(g2); g2.connect(master); src2.start();
  nodes.edgeBP=bp; nodes.edgeG=g2;

  /* dry hiss: grain over packed drift, filtered by surface density */
  var src3=AC.createBufferSource(); src3.buffer=noiseBuffer(AC,3); src3.loop=true;
  var bp3=AC.createBiquadFilter(); bp3.type='bandpass'; bp3.frequency.value=5200; bp3.Q.value=0.8;
  var g3=AC.createGain(); g3.gain.value=0.03;
  src3.connect(bp3); bp3.connect(g3); g3.connect(master); src3.start();
  nodes.hissBP=bp3; nodes.hissG=g3;

  /* wire singing: pitch from tension in the top strand */
  var osc=AC.createOscillator(); osc.type='sine'; osc.frequency.value=214;
  var og=AC.createGain(); og.gain.value=0.0;
  var of2=AC.createBiquadFilter(); of2.type='bandpass'; of2.frequency.value=214; of2.Q.value=9;
  osc.connect(of2); of2.connect(og); og.connect(master); osc.start();
  nodes.wireOsc=osc; nodes.wireG=og; nodes.wireF=of2;

  nodes.rattleBus=AC.createGain(); nodes.rattleBus.gain.value=0.55; nodes.rattleBus.connect(master);
}
function click(freq,dur,gain,type,q){
  if(!audioOn)return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=nodes.impBuf||(nodes.impBuf=noiseBuffer(AC,0.25));
  var f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||6;
  var g=AC.createGain(); g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(nodes.rattleBus);
  s.start(t); s.stop(t+dur+0.02);
}
function ring(freq,dur,gain){
  if(!audioOn)return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  var g=AC.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(nodes.rattleBus); o.start(t); o.stop(t+dur+0.03);
}
var rattleAcc=0, postAcc=0, staplesAcc=0;
function audioTick(dt){
  if(!audioOn)return;
  var t=AC.currentTime;
  var u=Wind.U;
  var lv=0.055+Math.pow(Math.max(0,(u-9))/9,1.7)*0.30;
  nodes.windG.gain.setTargetAtTime(lv,t,0.12);
  nodes.windLP.frequency.setTargetAtTime(420+u*74,t,0.18);
  nodes.edgeG.gain.setTargetAtTime(0.012+Math.pow(Math.max(0,(u-11))/7,2)*0.075,t,0.15);
  nodes.edgeBP.frequency.setTargetAtTime(1500+u*115,t,0.2);
  /* hiss band tracks the density of the surface currently under the wind */
  var jf=Math.round((0.0-Y0)/DY)+8;
  var ci=Math.max(0,Math.min(NX-1,Math.round(cam.along/DX)));
  var dens=G.rho[idx(ci,Math.min(NY-1,jf))];
  nodes.hissBP.frequency.setTargetAtTime(2900+(dens-280)*13,t,0.3);
  nodes.hissG.gain.setTargetAtTime(Math.min(0.10,hissLevel*0.9),t,0.2);
  /* wire tension: goes up with load */
  var pitch=186+(u-10)*11.5;
  nodes.wireF.frequency.setTargetAtTime(pitch,t,0.3);
  nodes.wireOsc.frequency.setTargetAtTime(pitch,t,0.4);
  var sing=Math.max(0,(u-13.6))*0.020;
  nodes.wireG.gain.setTargetAtTime(Math.min(0.05,sing),t,0.25);

  /* rattle: driven by grains actually hitting lath */
  var rate=impactRate*13.0;
  rattleAcc+=rate*dt;
  var n=Math.min(9,Math.floor(rattleAcc));
  rattleAcc-=n;
  for(var i=0;i<n;i++){
    click(760+Math.random()*2600, 0.018+Math.random()*0.03,
          0.020+Math.random()*0.05,'bandpass',4+Math.random()*9);
  }
  /* T-post ring on gust loading */
  postAcc+=dt;
  if(u>14.6 && postAcc>0.9 && Math.random()<0.16){
    postAcc=0;
    ring(347+Math.random()*90, 0.55+Math.random()*0.5, 0.020+Math.random()*0.016);
  }
  /* panel working against its staples */
  staplesAcc+=dt;
  if(staplesAcc>0.6 && Math.random()<0.10+Math.max(0,(u-13))*0.05){
    staplesAcc=0;
    click(140+Math.random()*130, 0.09+Math.random()*0.10, 0.055,'lowpass',1.2);
  }
}
var truckSnd=null;
function truckAudio(u){
  if(!audioOn)return;
  if(!truckSnd){
    var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=64;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260;
    var g=AC.createGain(); g.gain.value=0;
    o.connect(f);f.connect(g);g.connect(nodes.master); o.start();
    truckSnd={o:o,g:g,f:f};
  }
  var t=AC.currentTime;
  var env=Math.exp(-Math.pow((u-0.52)/0.30,2))*0.055;
  truckSnd.g.gain.setTargetAtTime(env,t,0.12);
  /* gears down for the drift on the road, then picks up again */
  var rpm = u<0.44 ? 78-u*22 : (u<0.62 ? 52+ (u-0.44)*66 : 64+(u-0.62)*30);
  truckSnd.o.frequency.setTargetAtTime(rpm,t,0.25);
  truckSnd.f.frequency.setTargetAtTime(180+env*2200,t,0.2);
  if(u>0.985){ truckSnd.g.gain.setTargetAtTime(0,t,0.1); }
}

/* ------------------------------------------------------------------ *
 *  INTERACTION                                                        *
 * ------------------------------------------------------------------ */
var drag={on:false,mode:null,x0:0,y0:0,along0:0,gap0:0,panel:-1,moved:0};

function pickLath(mx,my){
  var jf=Math.round((0.0-Y0)/DY);
  var best=null,bd=1e9;
  var pStart=Math.max(0,Math.floor((cam.along-36)/PANEL_W));
  var pEnd=Math.min(NPANEL-1,Math.ceil((cam.along+38)/PANEL_W));
  for(var p=pStart;p<=pEnd;p++){
    if(panelBuried[p])continue;
    var gap=G.gap[p];
    var per=PANEL_W/LATHS_PER_PANEL;
    for(var k=0;k<LATHS_PER_PANEL;k++){
      var lx=p*PANEL_W+(k+0.5)*per;
      if(lx>200)continue;
      var li=Math.max(0,Math.min(NX-1,Math.round(lx/DX)));
      var lg=G.h[idx(li,jf)];
      var zb=Math.max(lg,gap), zt=gap+FENCE_H;
      if(zt<=zb+0.05)continue;
      var pb=proj(lx,0,zb),pt2=proj(lx,0,zt);
      if(pb.d>40)continue;
      var wpx=Math.max(6,(pb.f*0.036)/pb.d);
      if(mx>pb.x-wpx && mx<pb.x+wpx && my>pt2.y-6 && my<pb.y+6){
        var dd=Math.abs(mx-pb.x)+pb.d*0.4;
        if(dd<bd){bd=dd;best={p:p,k:k};}
      }
    }
  }
  return best;
}
function nearPanel(mx,my){
  var pStart=Math.max(0,Math.floor((cam.along-36)/PANEL_W));
  var pEnd=Math.min(NPANEL-1,Math.ceil((cam.along+38)/PANEL_W));
  var best=-1,bd=1e9;
  for(var p=pStart;p<=pEnd;p++){
    var cx=p*PANEL_W+PANEL_W*0.5;
    var pp=proj(cx,0,G.gap[p]+FENCE_H*0.5);
    if(pp.d>44)continue;
    var d=Math.abs(mx-pp.x);
    if(d<bd&&d<Math.max(70,W*0.16)){bd=d;best=p;}
  }
  return best;
}

function pos(ev){
  var r=C.getBoundingClientRect();
  var t=(ev.touches&&ev.touches[0])||ev;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function down(ev){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  var p=pos(ev);
  drag.on=true; drag.x0=p.x; drag.y0=p.y; drag.along0=cam.along; drag.moved=0;
  drag.panel=nearPanel(p.x,p.y);
  drag.gap0= drag.panel>=0 ? G.gap[drag.panel] : 0.12;
  drag.mode=null;
  ev.preventDefault();
}
function move(ev){
  if(!drag.on)return;
  var p=pos(ev);
  var dx=p.x-drag.x0, dy=p.y-drag.y0;
  drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  if(!drag.mode && drag.moved>7){
    drag.mode = Math.abs(dx)>Math.abs(dy)*1.15 ? 'walk':'gap';
  }
  if(drag.mode==='walk'){
    cam.along = drag.along0 - dx*0.075;
    if(cam.along<4)cam.along=4;
    if(cam.along>196)cam.along=196;
  } else if(drag.mode==='gap' && drag.panel>=0){
    /* raise or lower the whole panel on its posts, plus half-effect on neighbours */
    var g=drag.gap0 - dy*0.0016;
    if(g<0)g=0; if(g>0.42)g=0.42;
    G.gap[drag.panel]=g;
    var l=drag.panel-1,r=drag.panel+1;
    if(l>=0)G.gap[l]=G.gap[l]+(g-G.gap[l])*0.12;
    if(r<NPANEL)G.gap[r]=G.gap[r]+(g-G.gap[r])*0.12;
    panelUpdate();
  }
  ev.preventDefault();
}
function up(ev){
  if(!drag.on)return;
  var p=pos(ev.changedTouches?{touches:ev.changedTouches}:ev);
  if(drag.moved<7){
    var hit=pickLath(drag.x0,drag.y0);
    if(hit){
      var q=hit.p*LATHS_PER_PANEL+hit.k;
      G.laths[q]=G.laths[q]?0:1;
      panelUpdate();
      click(G.laths[q]?300:520, 0.14, 0.10,'bandpass',3);
      click(1400,0.05,0.05,'bandpass',7);
    }
  }
  drag.on=false; drag.mode=null;
  save();
  ev.preventDefault&&ev.preventDefault();
}
C.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
C.addEventListener('touchstart',down,{passive:false});
C.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});
window.addEventListener('touchcancel',up,{passive:false});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){cam.along=Math.max(4,cam.along-2.4);}
  if(e.key==='ArrowRight'){cam.along=Math.min(196,cam.along+2.4);}
},{passive:true});

/* ------------------------------------------------------------------ *
 *  LOOP                                                               *
 * ------------------------------------------------------------------ */
var last=performance.now()/1000, tNow=0, acc=0, saveT=0, flowT=0;
function frame(now){
  now/=1000;
  var dt=Math.min(0.05,now-last); last=now;
  tNow+=dt;

  windTick(dt,tNow);
  flowT-=dt;
  if(flowT<=0){ panelUpdate(); flowSolve(); flowT=0.20; }

  /* one wall-clock second is about six minutes of blow */
  acc+=dt;
  while(acc>0.1){
    transportStep(0.0028);
    acc-=0.1;
  }
  if(Math.random()<0.20) avalanche();

  stepP(dt);
  draw(dt);
  audioTick(dt);

  saveT+=dt;
  if(saveT>10){ saveT=0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener('beforeunload',save);
window.addEventListener('visibilitychange',function(){ if(document.hidden)save(); });

/* the round bale, forty metres out, dropped off a truck and left.
   nothing on this page accounts for it. it is one third under and
   it will be more than that the next time anybody looks. */
})();
</script>
