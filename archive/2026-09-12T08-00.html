  <meta name="outbox-spec-era" content="Mid-July 1985, right now — twenty past one on a hot Ozarks afternoon in the dining room of a privately-owned show cave off US-160 in Ozark County, Missouri, forty minutes from anywhere, with the 1:30 tour already lining up at the rail outside the window and the 1:00 not out of the ground yet. The object on the page is the restaurant's paper placemat: 10 × 14, cheap coated stock, printed two colors on a web press in West Plains in a run of forty thousand back in March, sold ad-space-first the way every small-town placemat in America has always been sold, and put down fresh under every plate. It is not old, not found, not saved, not anybody's souvenir — there are about nine thousand left in a carton in the pantry and this one is going in the trash at two o'clock with ketchup on it.">
  <meta name="outbox-spec-format" content="THE PAGE IS ONE PAPER RESTAURANT PLACEMAT, actual size, lying square on a laminated table seen straight down — edge to edge, no header, no menu bar, no scrollbar, no site chrome of any kind. Trimmed at 10 × 14 with a slightly ragged guillotine edge, a printer's imprint line in 5-point type down the bottom margin, and a real ad ring: twelve boxed local-business advertisements running all the way around the perimeter, each one set in whatever type the print shop had and each one ending in a seven-digit phone number with no area code. The middle of the sheet is the cave's own space — a hand-drawn cutaway profile of the cave with the tour route arrowed through it and eleven numbered stops keyed to a list, a boxed TOUR TIMES panel, a paragraph of copy under the heading A WORD ABOUT YOUR CAVE, and, tucked in the lower right where placemats always put it, a small maze headed CAN YOU FIND YOUR WAY TO THE BRIDAL CHAMBER? A restaurant crayon lies across the corner of the mat. The whole page reads exactly as the object reads: you eat off it, you draw on it, and it goes in the trash — except this one doesn't.">
  <meta name="outbox-spec-subject" content="The flat operational business of running a commercial show cave, which is almost entirely a problem of what several hundred warm humid people a day do to a hole in the ground, and none of which is on any sign in the cave. That the cave is 57°F because 57°F is the mean annual air temperature of the hill above it and for no other reason, so the figure is a climate reading and not a feature. That relative humidity sits at 97 to 99 percent all year, which is why the PA amplifier in the Cathedral has been replaced twice in six years and why the tour is given by voice. That every visitor exhales roughly 40 grams of carbon dioxide an hour, which dissolves in the condensation film and turns it into a weak acid, which measurably takes calcite BACK OFF the formations — so the popcorn along the handrail at chest and nose height is corroded and dulled where the same formation eight feet up is not, and the damage tracks attendance and nothing else. That LAMPENFLORA is the single largest maintenance item in the building: algae, moss and cyanobacteria colonize every lit surface within about a metre of a fixture, they arrive on shoes and on air, they are green and then black, and the answer is a scheduled bleach wash on a four-week rotation plus moving the lamps back and aiming them obliquely so no beam lands on wet rock at close range, which is why the new fixtures look badly aimed and are aimed correctly. That LINT is real and is not a joke — cotton fibre, hair and skin shed by bodies drifts onto wet flowstone, mats, holds water, feeds the algae, and stains permanently, and the fix is people on their hands and knees with tweezers and a squeeze bottle in the closed months. That a soda straw grows on the order of a tenth of a millimetre a year, call it an inch a century, so every formation broken off by souvenir hunters between 1928 and 1953 is broken for the length of anybody's interest in it, and the stubs are lit deliberately or not lit at all depending on who is guiding. That the TOUR INTERVAL is not set by the length of the tour, it is set by the narrowest place two groups can physically pass each other, which here is a 31-inch gap at the top of the Long Stairs, so the interval is 22 minutes regardless of how fast anybody walks and a guide who hustles his group only produces a pile-up at the stairs. That the cave BREATHES on barometric pressure — a falling barometer pushes air out the entrance and a rising one pulls it in, at real velocity, which is why the ticket-window screen door bangs before a storm and why the entrance culvert fogs. That heat load is arithmetic: 180 bodies at about 100 watts each plus 4,300 watts of incandescent lighting genuinely raises the near-entrance air a degree and a half on an August afternoon and it takes until morning to come back. That dropped coins are a copper problem in a pool and are fished out with a magnet and a net. That the formation names — the Bridal Chamber, the Frozen Niagara of the Ozarks, the Wedding Cake — were written by a man selling tickets in 1931 and are advertising copy, not geology, and that the 148 steps are the actual reason for the elevator and the elevator is the actual reason the ticket price went up.">
  <meta name="outbox-spec-tone" content="Sincere, chirpy, exclamation-heavy small-town advertising copy, all of it written and set by one person: Dessa Runion-Ploog, thirty-three, who sells the twelve ad boxes door to door every February, drives the copy over to the print shop in West Plains herself, and writes the cave's own center panel because nobody else will. She has also guided tours since she was fifteen, which is the whole texture of the page: the ad boxes are full-throated and generous and every one of them ends in a phone number and an invitation, and then A WORD ABOUT YOUR CAVE starts out just as warm and inside of two sentences has gone into footcandles, four-week bleach rotations, the 31-inch gap at the top of the stairs and the 22-minute interval, because she finds those just as worth printing. She addresses the reader directly and warmly the whole way through — 'While you're waiting on your order', 'Ask your guide', 'Folks always want to know' — and she is proud of exactly one thing and says it three separate times in three different boxes: that the lamps were moved back and re-aimed in 1983 and the green is gone off the Cathedral wall, and she gives the wattage. She thanks the twelve advertisers by name in a line of 6-point type and misspells one of them. She mentions the elevator twice and says once, flatly and without apology, that it is why the ticket is four seventy-five. Never wry, never deadpan, never a craftsman-sage, never wistful, never winking at her own ad copy, never charmed by any of this — she is selling the two o'clock tour and she means every word on the mat.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, all of them off a two-color web job on cheap placemat stock. The ground is coated placemat paper in a warm dry cream (#efe4c8), going greyer and softer along the guillotined edges (#d9cdae) and picking up REAL accumulating damage as the visit runs: grease from a plate rendering as genuine translucency (the paper goes darker and slightly transparent, #ddc9a0, and the ink under it looks wetter), a coffee ring as a hard-edged tannin brown (#a9825a), and a water glass sweating a soft pale halo. The key color is a flat cave-brown ink (#5a3a22), printed with honest web-press behavior — solid and slightly bloomed in the display heads and the ad box rules, starved and broken to a thin grey-brown in every line under about 7 point (#8a705a), with a real 1 mm misregistration between the two units that shows on every box that uses both. Exactly one chip of spot orange (#e0642a) is held strictly for the TOUR TIMES panel rule, the route arrows through the cutaway profile, and the eleven stop numbers — it never appears in an ad box, never in body copy, never in the maze. Crayon laid down by the visitor is a fifth thing and is honest wax: it sits ON the coating rather than in it, it skips over the paper's tooth, it goes waxy-opaque where pressed hard and streaky where pressed light, and it will not go over grease at all. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest ink starvation, honest misregistration and honest grease translucency.">
  <meta name="outbox-spec-wildcard" content="There is a fly printed into the placemat. A real one got onto the plate at the shop in West Plains during make-ready and it is reproduced in flat brown ink, actual size, wings and all, lying on its side in the white space between the TOUR TIMES panel and ad box 7 — on every one of the forty thousand mats and on every visit, in exactly the same position. It is not a smudge, not a defect mark, not a hidden feature: it is simply part of the printing. It can be colored over with the crayon and it is still there under the wax. Nothing on the page accounts for it, Dessa never mentions it in any line of copy, and it cannot be brushed, clicked, moved or removed by anything the visitor can do.">
  <meta name="outbox-spec-forbidden" content="NO caves as metaphor for anything — not the unconscious, not the interior life, not descent, not what's under the surface, not Plato, not the womb, not the underworld, not going into the dark and coming back changed; this is 57°F, 98% humidity, a 22-minute interval and a four-week bleach rotation, and it has nothing to teach anybody. ABSOLUTELY NO subterranean awe or sublime: no vastness, no cathedral hush, no eons, no deep time reverie, no 'older than the human race', no geological-sublime, no the-earth-remembers, no crystal mysticism, no sensuous writing about stone, water or darkness beyond growth rate, wetness, footcandles and staining. NO horror, NO dread, NO getting lost, NO Floyd Collins, NO cave-in, NO Tom Sawyer and Injun Joe, NO bats-as-menace, NO liminal, NO backrooms, NO SCP, NO analog-horror, NO 'do not go past the rope' — nothing here is wrong and nobody is in danger. NO speleology romance and NO caver-versus-tourist snobbery: no wild caving, no vertical rigging, no purist sneer at the handrail and the colored lights, and no apologizing for the colored lights either. NO roadside-Americana kitsch, NO camp, NO ironic affection for hand-painted signs, mimeographed ad copy, fudge shops or 1930s formation names, NO winking at the Bridal Chamber, NO 'so charmingly tacky', NO Wall Drug register, NO retro-kitsch treatment of 1985. NO nostalgia, NO wistfulness, NO 'nobody stops at these places anymore / the interstate killed it / the last of the family cave operations' decline narrative — the 1:30 tour is lining up and there are nine thousand mats in the pantry. NO small-business-struggle pathos, NO plucky-underdog, NO family-legacy sentiment, NO woman-running-the-place arc, NO tourist-trap condescension in either direction. NO Ozarks travelogue and NO explaining Missouri or the rural South to anybody: no hillbilly comedy, no dialect spelling, no poverty pathos, no banjo, no aren't-they-folksy, no dogwood-and-hollers lyricism, no Deliverance, no church, no meth-belt hindsight. NO environmental sermon and NO conservation guilt-trip: lampenflora and lint are maintenance line items with a schedule and a cost, and the corroded popcorn at nose height is a measurement, not an accusation. NO teaching voice from the engine, NO explainer framing, NO science-communicator enthusiasm, NO 'and here's the fascinating part' — the copy is on a placemat because Dessa had space to fill. NO food writing whatsoever: nothing about what is on the plate, how it tastes, or diner-menu charm. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, coloring-book-mindfulness or screensaver framing of the crayon. NO archival / museum / cabinet / drawer / collection / found-ephemera / relic framing of the placemat — it was printed in March, it is under a plate right now, and it is getting grease on it while you look at it. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past one in the afternoon in July with the room full. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

   Printed West Plains, MO. Two units: brown, and one orange.

/* wrapped paragraph, starved ink below 7pt */

  var words=s.split(/\s+/),line='',yy=y,out=[];

var body =
"Welcome, and thank you for stopping! While you're waiting on your order I want to tell you a few things about the cave you're about to walk through, because folks always want to know and there isn't room on the signs. "+
"It is 57 degrees down there today and it will be 57 degrees down there in January. That is not a feature we installed \u2014 57 is simply the average air temperature of the hill sitting on top of the cave, taken over the whole year, and the rock holds that average. "+
"Relative humidity runs 97 to 99 percent every day of the year. That is why we have replaced the amplifier in the Cathedral twice in six years and why your guide will speak to you in a plain voice instead. Stand close and she will not have to shout.";
var y2=para(WX,WY+26,WW,body,10.2,14.4,INK,gw);

var body2 =
"Here is the thing I find worth printing. Every person on a tour breathes out about forty grams of carbon dioxide an hour. Down there it dissolves straight into the film of water on the walls and makes a weak acid, and that acid takes calcite back off the formations. "+
"It is measurable. Look at the popcorn along the handrail at Stop 2, at your chest and at your nose, and then look at the very same formation eight feet over your head. The low stuff is dulled and the high stuff is not, and the difference tracks nothing but how many people have walked by.";
y2=para(WX,y2+10,WW,body2,10.2,14.4,INK,gw);

var body3 =
"Our biggest single maintenance job is not the elevator and it is not the parking lot. It is lampenflora \u2014 algae, moss and cyanobacteria that colonize any lit wet rock within about a yard of a light fixture. It comes in on shoes and on the air, it goes green and then it goes black, and it gets a bleach wash on a four-week rotation, every four weeks, all year. "+
"In 1983 we moved every lamp back and re-aimed them all obliquely so that no beam lands on wet rock up close, and dropped the Cathedral bank from 500 watts down to 4,300 watts total for the whole route. The green is gone off the Cathedral wall. It has stayed gone for two seasons. If the new fixtures look badly aimed to you, they are aimed exactly right.";
y2=para(WX,y2+10,WW,body3,10.2,14.4,INK,gw);

var body4 =
"Lint is not a joke either. Cotton fiber, hair and skin come off of bodies and settle on wet flowstone, where it mats down, holds water, feeds the algae and stains permanently. In January and February we are on our hands and knees with tweezers and a squeeze bottle taking it off by hand. "+
"And a soda straw grows about a tenth of a millimeter a year \u2014 an inch a century \u2014 so the formations that souvenir hunters snapped off between 1928 and 1953 are snapped off for good as far as anybody alive is concerned. Ask your guide whether she lights the stubs at Stop 5. Some of them do and some of them don't.";
y2=para(WX,y2+10,WW,body4,10.2,14.4,INK,gw);

var body5 =
"Why every 22 minutes? Not because the tour takes 22 minutes. Because the narrowest place two groups can get past each other is a 31-inch gap at the top of the Long Stairs, and 22 minutes is what keeps one group clear of it before the next one arrives. A guide who hurries her group does not get anybody out faster; she just makes a pile-up at the stairs. "+
"And if you hear the screen door on the ticket window bang this afternoon with nobody near it, that is the cave breathing. A falling barometer pushes air out the entrance and a rising one pulls it in, at real speed. Watch the culvert fog up before a storm.";
y2=para(WX,y2+10,WW,body5,10.2,14.4,INK,gw);

var body6 =
"Two more and I'll let you eat. On an August afternoon, 180 people at about a hundred watts apiece, plus 4,300 watts of lamps, raises the air near the entrance a degree and a half, and it does not come back down until morning \u2014 that is just arithmetic, and it is why we cap the two o'clock. And please do not throw coins in the Wishing Pool. Copper in that water is a problem, and we fish them out with a magnet and a net.";
y2=para(WX,y2+10,WW,body6,10.2,14.4,INK,gw);

var body7 =

/* ---- MAZE (generated + verified) ---- */
var MX=586,MY=768,MSZ=228;
var COLS=13,ROWS=13, CELL=(MSZ-16)/COLS;
var maze=null;

function genMaze(){
  // recursive backtracker => perfect maze => exactly one path between any two cells
  var g=[],i,j;
  for(i=0;i<ROWS;i++){g.push([]);for(j=0;j<COLS;j++)g[i].push({n:1,s:1,e:1,w:1,v:0});}
  var stack=[[0,0]]; g[0][0].v=1;
  while(stack.length){
    var c=stack[stack.length-1],r=c[0],q=c[1],opts=[];
    if(r>0&&!g[r-1][q].v)opts.push('n'); if(r<ROWS-1&&!g[r+1][q].v)opts.push('s');
    if(q>0&&!g[r][q-1].v)opts.push('w'); if(q<COLS-1&&!g[r][q+1].v)opts.push('e');
    if(!opts.length){stack.pop();continue;}
    var d=opts[(Math.random()*opts.length)|0];
    if(d==='n'){g[r][q].n=0;g[r-1][q].s=0;stack.push([r-1,q]);g[r-1][q].v=1;}
    if(d==='s'){g[r][q].s=0;g[r+1][q].n=0;stack.push([r+1,q]);g[r+1][q].v=1;}
    if(d==='w'){g[r][q].w=0;g[r][q-1].e=0;stack.push([r,q-1]);g[r][q-1].v=1;}
    if(d==='e'){g[r][q].e=0;g[r][q+1].w=0;stack.push([r,q+1]);g[r][q+1].v=1;}
  }
  return g;
}
function solveCount(g,sr,sc,er,ec){
  // count distinct simple paths (perfect maze => must be exactly 1); verify.
  var seen={},prev={},qq=[[sr,sc]],found=false;
  seen[sr+','+sc]=1;
  while(qq.length){
    var c=qq.shift();
    if(c[0]===er&&c[1]===ec){found=true;break;}
    var cell=g[c[0]][c[1]],nb=[];
    if(!cell.n)nb.push([c[0]-1,c[1]]); if(!cell.s)nb.push([c[0]+1,c[1]]);
    if(!cell.w)nb.push([c[0],c[1]-1]); if(!cell.e)nb.push([c[0],c[1]+1]);
    for(var k=0;k<nb.length;k++){var key=nb[k][0]+','+nb[k][1];
      if(!seen[key]){seen[key]=1;prev[key]=c[0]+','+c[1];qq.push(nb[k]);}}
  }
  if(!found)return null;
  var path=[],cur=er+','+ec;
  while(cur){path.push(cur.split(',').map(Number));cur=prev[cur];}
  return path.reverse();
}
var attempts=0, solution=null;
do{ maze=genMaze(); solution=solveCount(maze,ROWS-1,0,0,COLS-1); attempts++; }while(!solution&&attempts<40);
// uniqueness holds by construction (perfect maze, no loops); verified reachable above.

function drawGrease(g){
  var grd=dctx.createRadialGradient(g.x,g.y,g.r*0.15,g.x,g.y,g.r);
  grd.addColorStop(0,'rgba(198,168,116,0.50)');

  var n=26;
  for(var i=0;i<=n;i++){
    var a=i/n*Math.PI*2;
    var rr=g.r*(0.82+0.20*Math.sin(a*3+g.seed)+0.08*Math.sin(a*7+g.seed*2));
    var px=g.x+Math.cos(a)*rr, py=g.y+Math.sin(a)*rr*0.92;
    i?dctx.lineTo(px,py):dctx.moveTo(px,py);
  }
  dctx.closePath();dctx.fillStyle=grd;dctx.fill();
  dctx.restore();
}
function drawRing(g){
  dctx.save();dctx.globalCompositeOperation='multiply';
  dctx.translate(g.x,g.y);dctx.rotate(g.rot);dctx.scale(1,0.985);
  dctx.beginPath();
  for(var i=0;i<=60;i++){var a=i/60*Math.PI*2;var rr=g.r*(1+0.012*Math.sin(a*5+g.seed));
    var px=Math.cos(a)*rr,py=Math.sin(a)*rr; i?dctx.lineTo(px,py):dctx.moveTo(px,py);}
  dctx.closePath();
  dctx.strokeStyle='rgba(169,130,90,0.72)';dctx.lineWidth=3.4;dctx.stroke();
  dctx.strokeStyle='rgba(169,130,90,0.28)';dctx.lineWidth=7;dctx.stroke();
  dctx.beginPath();dctx.arc(0,0,g.r-3,0,Math.PI*2);
  dctx.fillStyle='rgba(169,130,90,0.06)';dctx.fill();
  dctx.restore();
}
function drawDrip(g){
  dctx.save();dctx.globalCompositeOperation='multiply';
  var grd=dctx.createRadialGradient(g.x,g.y,1,g.x,g.y,g.r);
  grd.addColorStop(0,'rgba(190,172,140,0.30)');
  grd.addColorStop(0.7,'rgba(206,190,160,0.16)');
  grd.addColorStop(1,'rgba(206,190,160,0)');
  dctx.beginPath();dctx.arc(g.x,g.y,g.r,0,Math.PI*2);dctx.fillStyle=grd;dctx.fill();
  dctx.strokeStyle='rgba(176,150,112,0.35)';dctx.lineWidth=1.1;
  dctx.beginPath();dctx.arc(g.x,g.y,g.r*0.86,0,Math.PI*2);dctx.stroke();
  dctx.restore();
}
function redrawDamage(){
  dctx.clearRect(0,0,W,H);
  store.grease.forEach(drawGrease);
  store.rings.forEach(drawRing);
  store.drips.forEach(drawDrip);
}

/* ---------- wax ---------- */
function stampWax(x,y,wdt,press){
  var alpha=Math.min(0.95,0.16+press*0.82);
  wctx.save();
  wctx.globalCompositeOperation='multiply';
  wctx.globalAlpha=alpha;
  // tooth-broken edge: draw pattern-masked blob
  var pat=wctx.createPattern(toothCanvas,'repeat');
  wctx.fillStyle='#e0642a';
  wctx.beginPath();wctx.arc(x,y,wdt,0,Math.PI*2);wctx.fill();
  // light strokes get chewed by tooth
  if(press<0.72){
    wctx.globalCompositeOperation='destination-out';
    wctx.globalAlpha=(0.72-press)*1.15;
    wctx.fillStyle=pat;
    wctx.beginPath();wctx.arc(x,y,wdt,0,Math.PI*2);wctx.fill();
  }
  wctx.restore();
}
function isGreased(x,y){
  for(var i=0;i<store.grease.length;i++){
    var g=store.grease[i],dx=x-g.x,dy=(y-g.y)/0.92;
    if(dx*dx+dy*dy < g.r*g.r*0.86) return true;
  }
  return false;
}
function redrawStrokes(){
  wctx.clearRect(0,0,W,H);
  for(var i=0;i<store.strokes.length;i++){
    var st=store.strokes[i];
    for(var j=0;j<st.length;j++) stampWax(st[j][0],st[j][1],st[j][2],st[j][3]);
  }
}
function redrawAll(){redrawDamage();redrawStrokes();}

/* ---------- audio ---------- */
var AC=null,bus=null;
function ac(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  bus=AC.createGain();bus.gain.value=0.5;bus.connect(AC.destination);
  startRoom();
  return AC;
}
function noiseBuf(sec){
  var n=Math.max(1,Math.floor(AC.sampleRate*sec)),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b;
}
/* room bed: forty people eating, no words */
function startRoom(){
  var src=AC.createBufferSource();src.buffer=noiseBuf(4);src.loop=true;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=680;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=110;
  var g=AC.createGain();g.gain.value=0.030;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(bus);src.start();
  // murmur swell
  var lfo=AC.createOscillator();lfo.frequency.value=0.11;
  var lg=AC.createGain();lg.gain.value=0.010;
  lfo.connect(lg);lg.connect(g.gain);lfo.start();
  // occasional cutlery
  setInterval(function(){
    if(Math.random()<0.5)clink(0.006+Math.random()*0.01);
  },1600+Math.random()*2200);
  // chest cooler compressor, irregular
  coolerCycle();
}
function clink(v){
  if(!AC)return;
  var o=AC.createOscillator();o.type='triangle';
  o.frequency.value=2300+Math.random()*2600;
  var g=AC.createGain();g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.09);
  o.connect(g);g.connect(bus);o.start();o.stop(AC.currentTime+0.11);
}
var coolerOn=false,coolerNodes=null;
function coolerCycle(){
  if(!AC)return;
  if(!coolerOn){
    var o=AC.createOscillator();o.type='sawtooth';o.frequency.value=59;
    var o2=AC.createOscillator();o2.type='sine';o2.frequency.value=118.5;
    var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
    var g=AC.createGain();g.gain.value=0;
    g.gain.linearRampToValueAtTime(0.030,AC.currentTime+0.9);
    o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(bus);o.start();o2.start();
    coolerNodes={o:o,o2:o2,g:g};coolerOn=true;
    setTimeout(coolerCycle,(38+Math.random()*70)*1000);
  }else{
    coolerNodes.g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+1.4);
    var n=coolerNodes;setTimeout(function(){try{n.o.stop();n.o2.stop();}catch(e){}},2000);
    coolerOn=false;
    setTimeout(coolerCycle,(45+Math.random()*90)*1000);
  }
}
function plateDown(){
  if(!AC)return;
  var t=AC.currentTime;
  var o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(1180,t);
  o.frequency.exponentialRampToValueAtTime(880,t+0.12);
  var g=AC.createGain();g.gain.setValueAtTime(0.10,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+0.32);
  var s=AC.createBufferSource();s.buffer=noiseBuf(0.06);
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;
  var g2=AC.createGain();g2.gain.setValueAtTime(0.06,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
  s.connect(bp);bp.connect(g2);g2.connect(bus);s.start(t);
}
function cupSound(up){
  if(!AC)return;var t=AC.currentTime;
  var o=AC.createOscillator();o.type='triangle';o.frequency.value=up?1420:760;
  var g=AC.createGain();g.gain.setValueAtTime(up?0.05:0.085,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(up?0.13:0.22));
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+0.25);
}
function busTub(){
  if(!AC)return;var t=AC.currentTime;
  for(var i=0;i<14;i++){
    setTimeout(function(){clink(0.02+Math.random()*0.03);},i*38+Math.random()*40);
  }
  var s=AC.createBufferSource();s.buffer=noiseBuf(0.5);
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
  var g=AC.createGain();g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  s.connect(lp);lp.connect(g);g.connect(bus);s.start(t);
}
function screenDoor(){
  if(!AC)return;var t=AC.currentTime;
  // spring twang then slap
  var o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(320,t);
  o.frequency.exponentialRampToValueAtTime(140,t+0.35);
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=8;
  var g=AC.createGain();g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.4);
  o.connect(bp);bp.connect(g);g.connect(bus);o.start(t);o.stop(t+0.45);
  var s=AC.createBufferSource();s.buffer=noiseBuf(0.12);
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  var g2=AC.createGain();g2.gain.setValueAtTime(0.001,t);
  g2.gain.setValueAtTime(0.11,t+0.42);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.60);
  s.connect(lp);lp.connect(g2);g2.connect(bus);s.start(t+0.40);
}
/* wax scrape: filtered noise, brightness+grain from speed & pressure */
var scrapeSrc=null,scrapeGain=null,scrapeFilt=null,scrapeHP=null;
function scrapeOn(){
  if(!ac()||scrapeSrc)return;
  scrapeSrc=AC.createBufferSource();scrapeSrc.buffer=noiseBuf(2);scrapeSrc.loop=true;
  scrapeFilt=AC.createBiquadFilter();scrapeFilt.type='bandpass';scrapeFilt.frequency.value=1800;scrapeFilt.Q.value=0.8;
  scrapeHP=AC.createBiquadFilter();scrapeHP.type='highpass';scrapeHP.frequency.value=500;
  scrapeGain=AC.createGain();scrapeGain.gain.value=0;
  scrapeSrc.connect(scrapeHP);scrapeHP.connect(scrapeFilt);scrapeFilt.connect(scrapeGain);scrapeGain.connect(bus);
  scrapeSrc.start();
}
function scrapeSet(speed,press){
  if(!scrapeGain)return;
  var t=AC.currentTime;
  scrapeFilt.frequency.setTargetAtTime(900+Math.min(1,speed/6)*4200,t,0.03);
  scrapeGain.gain.setTargetAtTime(0.012+press*0.055+Math.min(1,speed/8)*0.03,t,0.02);
}
function scrapeOff(){
  if(scrapeGain){scrapeGain.gain.setTargetAtTime(0,AC.currentTime,0.05);}
  var s=scrapeSrc,g=scrapeGain;
  scrapeSrc=null;scrapeGain=null;
  if(s)setTimeout(function(){try{s.stop();}catch(e){}},350);
}
function toothTick(){
  if(!AC)return;var t=AC.currentTime;
  var s=AC.createBufferSource();s.buffer=noiseBuf(0.012);
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3600+Math.random()*2000;bp.Q.value=6;
  var g=AC.createGain();g.gain.setValueAtTime(0.028,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.02);
  s.connect(bp);bp.connect(g);g.connect(bus);s.start(t);
}

/* ---------- crayon interaction ---------- */
var crayonEl=document.getElementById('crayon');
var drawing=false,last=null,lastT=0,cur=null,skipAcc=0;
function toMat(e){
  var r=wax.getBoundingClientRect();
  var cx=(e.touches?e.touches[0].clientX:e.clientX);
  var cy=(e.touches?e.touches[0].clientY:e.clientY);
  return [ (cx-r.left)/r.width*W, (cy-r.top)/r.height*H, cx, cy ];
}
function tipWidth(){
  // blunts permanently with use. starts pointed (~2.0), maxes out flat (~7.2)
  return 2.0 + Math.min(5.2, store.wear*0.00042);
}
function placeCrayon(clientX,clientY){
  var r=mat.getBoundingClientRect();
  var px=(clientX-r.left)/r.width*100, py=(clientY-r.top)/r.height*100;
  crayonEl.style.left=(px-3)+'%';
  crayonEl.style.top=(py-1.5)+'%';
}
function down(e){
  ac();
  var p=toMat(e);
  if(p[0]<0||p[0]>W||p[1]<0||p[1]>H)return;
  e.preventDefault();
  drawing=true;cur=[];last=p;lastT=performance.now();
  scrapeOn();
  placeCrayon(p[2],p[3]);
  // sharpen the "tip geometry" visual
  var tp=document.getElementById('tipshape');
  var f=Math.min(1,store.wear*0.00009);
  tp.setAttribute('d','M30 '+(8+f*26)+' L'+(46+f*0)+' 46 L'+(14-f*0)+' 46 Z');
}
function move(e){
  if(!drawing)return;
  e.preventDefault();
  var p=toMat(e),now=performance.now();
  var dt=Math.max(1,now-lastT);
  var dx=p[0]-last[0],dy=p[1]-last[1];
  var dist=Math.sqrt(dx*dx+dy*dy);
  var speed=dist/dt*16.7; // mat units per frame
  // slow = heavy waxy; fast = light and skipping
  var press=Math.max(0.06,Math.min(1,1.05-speed/9));
  scrapeSet(speed,press);
  var w=tipWidth()*(0.85+press*0.45);
  var steps=Math.max(1,Math.ceil(dist/1.6));
  for(var i=1;i<=steps;i++){
    var t=i/steps,x=last[0]+dx*t,y=last[1]+dy*t;
    if(isGreased(x,y))continue;            // wax will not go over grease
    var jx=x+(Math.random()-0.5)*(1-press)*2.2;
    var jy=y+(Math.random()-0.5)*(1-press)*2.2;
    stampWax(jx,jy,w,press);
    cur.push([Math.round(jx*10)/10,Math.round(jy*10)/10,Math.round(w*100)/100,Math.round(press*100)/100]);
  }
  store.wear+=dist*(0.35+press);
  skipAcc+=dist*(1-press);
  if(skipAcc>14){skipAcc=0;toothTick();}
  last=p;lastT=now;
  placeCrayon(p[2],p[3]);
}
function up(){
  if(!drawing)return;
  drawing=false;scrapeOff();
  if(cur&&cur.length){store.strokes.push(cur);save();}
  cur=null;
}
wax.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
wax.addEventListener('touchstart',down,{passive:false});
wax.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);

/* ---------- the mat's own clock ---------- */
/* plate down, plate away, cup twice, one drip. Not triggered by you. */
function addGrease(){
  var g={x:280+Math.random()*380,y:520+Math.random()*420,r:96+Math.random()*54,seed:Math.random()*6.28};
  store.grease.push(g);drawGrease(g);save();
}
function addRing(){
  var g={x:640+Math.random()*260,y:250+Math.random()*760,r:36+Math.random()*6,rot:Math.random()*0.5,seed:Math.random()*6.28};
  store.rings.push(g);drawRing(g);save();
}
function addDrip(){
  var g={x:120+Math.random()*700,y:300+Math.random()*800,r:26+Math.random()*14};
  store.drips.push(g);drawDrip(g);save();
}
var t0=Date.now();
setTimeout(function(){ plateDown(); setTimeout(addGrease,900); },42000);
setTimeout(function(){ busTub(); },78000);
setTimeout(function(){ cupSound(false); setTimeout(addRing,600); },96000);
setTimeout(function(){ cupSound(true); },121000);
setTimeout(function(){ screenDoor(); },150000);
setTimeout(function(){ cupSound(false); setTimeout(addRing,600); },196000);
setTimeout(function(){ addDrip(); },240000);
setTimeout(function(){ plateDown(); setTimeout(addGrease,1200); },300000);
setTimeout(function(){ screenDoor(); },362000);
setTimeout(function(){ busTub(); },420000);
setInterval(function(){ if(Math.random()<0.4) plateDown(); },210000);
setInterval(function(){ if(Math.random()<0.35){ addGrease(); } },260000);

setInterval(function(){
  store.minutes+=1/6; updateImprint(); save();
},10000);

/* first restore + fit */
fit();
save();

/* ---------- console ---------- */
try{
console.log('%cTANGLEWOOD CAVE \u2014 FORM 4409','font:bold 14px Georgia;color:#5a3a22');
console.log('Bleach rotation is four weeks. Lamps re-aimed May 1983, 4,300 W total route load.');
console.log('Interval 22 min, set by the 31-inch gap at the top of the Long Stairs.');
console.log('Set down count: '+store.setdown+'. Strokes on file: '+store.strokes.length+'. Tip wear: '+Math.round(store.wear)+'.');
}catch(e){}
})();
