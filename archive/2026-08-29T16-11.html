  <meta name="outbox-spec-era" content="October 1958 — the mimeographed flip-card era of American college card stunts, viewed from the press-box side of a 40,000-seat poured-concrete bowl somewhere in the Ohio Valley, under flat high overcast at around three in the afternoon. Across the field, 1,440 folding-seat card holders in the east stand are working a fourteen-stunt sequence off hand-collated numbered packets; a stunt director stands on the cinder running track with a whistle and a megaphone he isn't using. Nothing here is being remembered or mourned. The section is on its feet, stunt seven is next, about forty cards blew out of the top rows during the first quarter, and the packets were collated Thursday night on a ping-pong table by eleven people.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — chrome-less, edge to edge, and the only readable characters anywhere on the page are ones that 1,440 people are physically holding up. The entire viewport is the opposite grandstand's card section seen across 180 yards of field at true angular size: a trapezoidal block of concrete risers, 45 rows deep by 32 seats wide, every seat a single 14×22 inch dyed pulp card held at chest height, plus the shaded overhang band across the top of frame and a strip of cinder track along the bottom. No header, no menu, no scrollbar, no title, no caption, no counter, no instructions, no legend. The image only exists at viewport scale — it is 1,440 flat colour rectangles and nothing else, and it resolves into a shape or a letterform only because you are sitting far enough away. Stunts change on a whistle count; the flip crosses the section as a visible wave taking about a second and a quarter, the picture holds for roughly four seconds, and then begins decaying as arms tire and cards sag. The visitor's entire vocabulary is that they are ONE seat in it — row 26, seat 19, assigned once and never reassigned — with their own numbered packet drawn in true perspective at the very bottom edge of frame, foreshortened, close, and out of focus relative to the section. Drag a card up out of the packet to hold it; drag it down to drop it; hold anywhere else to lean forward and steady the view. The section does not need you and does not wait for you.">
  <meta name="outbox-spec-subject" content="The flat mechanics and arithmetic of running a card stunt, and specifically why the design has to be drawn wrong in order to come out right — that a card section is not a grid, it is a raked trapezoid seen obliquely, so a square drawn on square graph paper resolves across the field as a lopsided parallelogram leaning downfield, which is why every stunt is laid out on a pre-distorted skewed grid ruled from the actual seat plan (32 seats in row 1 widening to 41 by row 45, seat pitch 18 inches, row rise 14 inches, row depth 32 inches) and re-projected for the sightline from the press-box side; that the correct viewing point is a single seat and everybody else in the stadium is looking at a slightly wrong picture, and the people IN the section never see it at all, ever, not once; that angular resolution is the whole design constraint — a 14×22 inch card at 180 yards subtends about 4 minutes of arc, which is coarse enough that a diagonal edge has to be staircased and any feature narrower than two seats simply does not exist, so block letters get a minimum stroke width of three cards and serifs are never attempted; that CONTRAST and not brightness carries at distance, which is why chrome yellow on white is invisible at forty yards and card red on white reads clean at two hundred, and why the black-brown is used only as an outline colour and never as a field; that dyed pulp board fades honestly and unevenly — the top nine rows have had direct sun on them since one o'clock and their yellows are measurably paler than the same dye lot in the shade under the overhang, so a solid field is never solid; that the packet system is the entire logistics: each seat gets a numbered stack in flip order with a paste-on flip sheet reading nothing but stunt number and card number, cards are held face-in until the whistle and turned on the count, and a packet collated one card out of order ruins that seat for the rest of the afternoon and there is no fixing it from the track; that reliability is a known rate and gets designed around — roughly one seat in twenty is wrong at any instant (a beat late, a beat early, the card backwards, the wrong card entirely, a seat empty because somebody went for a hot dog), so no stunt is ever drawn with a single-card-wide feature and every design is built to survive five percent noise; that the flip wave is real and directional, propagating from wherever people can hear the whistle best, taking about 1.2 seconds to cross the block, so every stunt is briefly a diagonal smear of the previous stunt before it is anything; that wind is a live loss term — a 14×22 card is a sail, a gust across the open end of the bowl takes cards out of the top rows permanently and they do not come back, and forty gone out of 1,440 is a visible thinning at the top of every subsequent picture; that arms fail on a real curve, so the hold decays measurably after about four seconds as cards drop, tilt, and lean, and the picture goes soft from the bottom rows up where the students are youngest and least interested; and the flat arithmetic that fourteen stunts at roughly eleven seconds each is two and a half minutes of halftime, that 1,440 packets is 20,160 individual cards, and that they were counted twice on Thursday and were still eleven short.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no written sentence anywhere on the page — the only characters that ever appear are block letterforms held up by 1,440 people, and those are never fully correct. The register lives entirely in the behaviour of the cards, the crowd and the light, and that register is BRISK, CROWDED, IMPRECISE and SLIGHTLY RAGGED — a flip that arrives as a wave rather than an instant, five percent of the section visibly wrong at all times, cards tilting, cards sagging, somebody's arm coming down early, a gust putting a shiver through the top nine rows, the whole picture legible for about four seconds and then coming apart from the bottom. Everything happens at working speed on somebody else's clock. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT stately, NOT ceremonial, NOT nostalgic, NOT ASMR, NOT a screensaver, NOT satisfying-video, NOT precious — this is fourteen stunts to get through before the second half kicks off, and stunt nine is going to be a mess.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is poured concrete grandstand riser in a dry pale grey (#a8a49a), going a colder darker grey under the overhang band across the top of frame (#6c6a64) and warmer and dirtier down at the track edge (#b6ab98), with steel seat-back rails as thin hard lines (#5a6060). Against that, the cards are dyed pulp board in the four stock colours, and their rendered value is COMPUTED rather than chosen: chrome yellow (#e8b21c), card red (#a8231f), unbleached white (#efe9d8) and outline black-brown (#2c2620), each carrying a real per-card dye-lot offset of a few percent and a real cumulative sun-bleach term applied to the top nine rows only, so a solid field visibly mottles and the top of every picture reads a half-step paler than the bottom. Each card also carries a live tilt angle and therefore its own honest lambertian shading against the flat overcast, so a section holding steady is flatter and brighter than a section that is tired. Exactly one chip of raw uncoated pulp grey-brown (#8a7f6b) is held strictly for the BACKS of cards — visible only in the instant of a flip, along the leading edge of the flip wave, and on any seat holding a card wrong-way-round for a whole stunt, which is the only way a mistake is ever marked. Crowd fill in the unassigned stands beyond the section is a granular mid-neutral with no individual detail (#8f8a83). Flat, hard, high-contrast, no glow, no bloom, no soft focus, no lens haze, no gradients other than honest bleaching and honest card tilt — dyed board and concrete under a flat white sky at three in the afternoon.">
  <meta name="outbox-spec-wildcard" content="Stunt nine never resolves into anything. It is a genuine design in the sequence, correctly collated, correctly flipped, and it renders as pure incoherent colour noise across the whole section for its full eleven seconds, because the sheet it was drawn from was ruled for a section of a different size and the seat mapping is honestly wrong. The engine computes it exactly as it computes every other stunt and does not flag it, correct it, shorten it, or comment on it in any way; the whistle goes, the wave crosses, 1,440 people hold up a scramble for eleven seconds, and then stunt ten comes up clean. It happens in the same position in the sequence on every visit.">
  <meta name="outbox-spec-forbidden" content="NO card section as metaphor for anything — not crowds, not collective action, not the individual-and-the-mass, not 'we are each one pixel', not democracy, not conformity, not how a picture is made of people; it is a pre-distorted seat map, a five percent error rate and a 1.2-second propagation delay, and it has nothing to teach anybody. ABSOLUTELY NO pixel / screen / display / low-resolution / analog-computer / 'the first bitmap' framing, and NO signal, transmission, broadcast, frequency or message register of any kind despite the whistle and the wave. NO school-spirit sentiment, NO homecoming pathos, NO halftime melancholy, NO Friday-night-lights register, NO fight songs, NO 'the roar of the crowd', NO stadium awe, NO Americana, NO Norman Rockwell warmth, NO postwar-optimism drift. NO football whatsoever: no game, no score, no players, no drama on the field, no rivalry, no outcome — the field is empty and stays empty. NO nostalgia, NO wistfulness, NO 'nobody does card stunts anymore / the jumbotron killed them / the last of the student sections' decline narrative — there are fourteen stunts and stunt seven is next. NO youth lyricism, NO 'they were nineteen and it was October', NO coming-of-age, NO first-love-in-the-stands, NO poignancy about the students, NO nameless-faces sentiment. NO hushed, meditative, hypnotic, ambient-visualiser, generative-art-gallery, ASMR or 'let the colours still you' register. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the scrambled stunt nine, the empty seats, or the cards going over the top of the bowl — nothing here is wrong. NO sensuous material writing about board, dye or light beyond contrast, value, tilt, angular size and fade rate. NO archival, museum, cabinet, drawer, yearbook, found-photograph or relic framing — this is happening across the field this minute and the section is standing up. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is three in the afternoon under a flat white sky. NO society / club / guild / committee-of-hobbyists scaffolding, NO founding date, NO tradition. And beyond the block letterforms held up by the section itself, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, tooltip or narrating voice anywhere on the page.">

<!-- collated Thursday on the ping-pong table, eleven people, counted twice, still eleven short -->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#a8a49a;}
  canvas{display:block;position:fixed;left:0;top:0;}
  #field{width:100vw;height:100vh;z-index:1;}

  #arch{position:fixed;left:8px;bottom:6px;z-index:5;font:400 10px/1 system-ui,-apple-system,sans-serif;
        letter-spacing:.09em;color:rgba(44,38,32,.30);text-decoration:none;}

<body>
<canvas id="field"></canvas>
<canvas id="near"></canvas>
<a id="arch" href="/archive">the other stands</a>
<script>
(function(){
"use strict";
/* ---------- seat plan: 45 rows, 32 seats, pitch 18->23in, rise 14in, depth 32in ---------- */
var ROWS=45, COLS=32, RISE=14, DEPTH=32, BASE=96, DIST=6480, CAMY=660;
var CHEST=60, HW=7, HH=11;                       /* 14 x 22 inch card */
var PAL=[[239,233,216],[168,35,31],[232,178,28],[44,38,32]];
var PULP=[138,127,107];
var seats=[], N=ROWS*COLS;

function rnd(a){var x=Math.sin(a*12.9898)*43758.5453;return x-Math.floor(x);}
function gauss(a){var u=rnd(a)||.5,v=rnd(a+7.77)||.5;return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v);}
function pitchOf(r){return 18+5*(r/(ROWS-1));}

/* ---------- designs: authored on a nominal square sheet, u across, v up ---------- */
function G(g,u,v,x0,x1,y0,y1){
  if(u<x0||u>x1||v<y0||v>y1)return 0;
  var c=Math.floor((u-x0)/(x1-x0)*5), rr=Math.floor((1-(v-y0)/(y1-y0))*7);
  if(c<0)c=0;if(c>4)c=4;if(rr<0)rr=0;if(rr>6)rr=6;
  return g[rr].charCodeAt(c)===49?1:0;
}
var LO=["11111","10001","10001","10001","10001","10001","11111"];
var LV=["10001","10001","10001","10001","10001","01010","00100"];
var LH=["10001","10001","10001","11111","10001","10001","10001"];
var DES=[
 function(u,v){return(u<.095||u>.905||v<.09||v>.91)?1:0;},                                  /* 1 frame */
 function(u,v){return G(LO,u,v,.19,.81,.13,.88)?1:0;},                                      /* 2 O */
 function(u,v){return v>.665?2:(v>.335?0:1);},                                              /* 3 bands */
 function(u,v){var k=(u*.92+(1-v)*.62)*4.0;var m=Math.floor(k)%3;return m===0?1:(m===1?0:2);},/* 4 chevron */
 function(u,v){return G(LV,u,v,.17,.83,.11,.9)?1:0;},                                       /* 5 V */
 function(u,v){var m=Math.max(Math.abs(u-.5),Math.abs(v-.5))*2,b=Math.floor(m*4);return[0,1,0,2][b>3?3:b];}, /* 6 rings */
 function(u,v){var m=Math.abs(u-.5)*1.35+Math.abs(v-.5)*1.15;return m<.40?2:(m<.50?3:1);},   /* 7 diamond */
 function(u,v){return Math.floor(u*8)%2?1:0;},                                              /* 8 bars */
 null,                                                                                      /* 9 plaid */
 function(u,v){return G(LH,u,v,.17,.83,.12,.89)?0:1;},                                      /* 10 H */
 function(u,v){return(Math.floor(u*4)+Math.floor(v*4))%2?1:2;},                             /* 11 blocks */
 function(u,v){var b=Math.abs(v-.5);return((u<.58&&b<.155)||(u>=.5&&b<(.97-u)*.95))?1:0;},  /* 12 arrow */
 function(u,v){var d=Math.sqrt((u-.5)*(u-.5)*1.06+(v-.5)*(v-.5))*2;return d<.70?2:(d<.83?3:0);}, /* 13 disc */
 function(u,v){return(Math.abs(u-.5)<.095||Math.abs(v-.5)<.09)?0:1;}                        /* 14 cross */
];
/* the ninth sheet was ruled for a 38-wide section; the mapping is kept as drawn */
function plaid(u,v){var a=Math.floor(u*23)%3, b=Math.floor(v*29)%3, c=Math.floor((u+v)*17)%2;
  return c? (a===b?1:(a<b?0:2)) : (a===0?3:(b===1?1:0));}

/* ---------- build ---------- */
var uMin=1e9,uMax=-1e9,vMin=1e9,vMax=-1e9;
for(var r=0;r<ROWS;r++)for(var s=0;s<COLS;s++){
  var p=pitchOf(r), x=(s-(COLS-1)/2)*p, y=BASE+r*RISE, z=DIST+r*DEPTH;
  var ax=x/z, ay=(CAMY-(y+CHEST))/z;
  if(ax<uMin)uMin=ax; if(ax>uMax)uMax=ax; if(ay<vMin)vMin=ay; if(ay>vMax)vMax=ay;
  seats.push({r:r,s:s,x:x,y:y,z:z,ax:ax,ay:ay});
}
var LSK="eaststand.v1", store={seat:{r:25,s:18},correct:0,lost:[],visits:0};
try{var raw=localStorage.getItem(LSK); if(raw){var o=JSON.parse(raw); if(o&&o.seat)store=o;}}catch(e){}
store.visits=(store.visits|0)+1; if(!store.lost)store.lost=[];
function save(){try{localStorage.setItem(LSK,JSON.stringify(store));}catch(e){}}

for(var i=0;i<N;i++){
  var q=seats[i];
  q.u=(q.ax-uMin)/(uMax-uMin);
  q.v=(q.vv=(vMax-q.ay)/(vMax-vMin));
  var h=i*0.6180339+3.1;
  q.dye=(rnd(h)-.5)*.085;
  q.tilt0=(rnd(h+1.1)-.5)*.14;
  q.roll0=(rnd(h+2.2)-.5)*.10;
  q.stam=(3.6+7.4*(q.r/44))+gauss(h+3.3)*1.5;         /* front rows tire first */
  var tail=rnd(h+4.4);
  q.react=(0.17+gauss(h+5.5)*0.13);
  if(tail<0.021) q.react=1.4+rnd(h+6.6)*2.6;          /* a beat late */
  if(q.react<-0.13)q.react=-0.13;
  q.absent=rnd(h+8.8)<0.008;                           /* gone for a hot dog */
  q.rev=[];
  q.packet=[];
  for(var k=0;k<14;k++){
    q.rev.push(rnd(h+40+k*3.7)<0.012);
    var c;
    if(k===8){ var idx=q.r*COLS+q.s, wr=Math.floor(idx/38), ws=idx%38;
               c=plaid(ws/37, wr/37.9); }
    else c=DES[k](q.u,q.v);
    q.packet.push(c);
  }
  if(rnd(h+9.9)<0.015){ q.packet.unshift(q.packet[13]); q.packet.pop(); q.mis=true; }
  q.goneAt=-9;
  q.isPlayer=(q.r===store.seat.r&&q.s===store.seat.s);
  if(q.isPlayer)q.absent=false;
}
/* forty out of the top rows during the first quarter */
for(var w=0;w<40;w++){
  var rr2=34+Math.floor(rnd(w*3.7+.5)*11), ss2=Math.floor(rnd(w*5.1+.9)*COLS);
  var q2=seats[rr2*COLS+ss2]; if(!q2||q2.isPlayer)continue;
  q2.packet.splice(Math.floor(rnd(w*2.3+.3)*14),1); q2.packet.push(null);
}
/* and whatever the wind has taken on previous afternoons */
for(var L=0;L<store.lost.length&&L<220;L++){
  var e=store.lost[L], qq=seats[e[0]*COLS+e[1]];
  if(qq&&!qq.isPlayer){ qq.packet.splice(e[2],1); qq.packet.push(null); }
}

/* ---------- camera ---------- */
var cv=document.getElementById("field"), g=cv.getContext("2d");
var nc=document.getElementById("near"), ng=nc.getContext("2d");
var W=0,H=0,DPR=1,F=1,CX=0,HZ=0,crowdPat=null;
function makeCrowd(){
  var c=document.createElement("canvas");c.width=c.height=72;var x=c.getContext("2d");
  var d=x.createImageData(72,72);
  for(var i=0;i<72*72;i++){var n=(rnd(i*1.7)-.5)*46,m=(rnd(i*4.3)-.5)*26;
    d.data[i*4]=143+n+m;d.data[i*4+1]=138+n;d.data[i*4+2]=131+n-m;d.data[i*4+3]=255;}
  x.putImageData(d,0,0);crowdPat=g.createPattern(c,"repeat");
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.6);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";
  g.setTransform(DPR,0,0,DPR,0,0);
  var nh=Math.round(H*0.30);
  nc.width=W*DPR;nc.height=nh*DPR;nc.style.height=nh+"px";ng.setTransform(DPR,0,0,DPR,0,0);
  var angW=uMax-uMin, angH=vMax-vMin;
  F=Math.min(0.90*W/angW, 0.80*H/angH);
  CX=W/2 - F*((uMin+uMax)/2);
  var vc=(vMin+vMax)/2;
  HZ=H*0.455 + F*vc;                    /* screenY = HZ - F*ay */
  makeCrowd();
}
function px(x,y,z){return CX + F*(x/z)*lean.z;}
function py(x,y,z){return HZ - F*((CAMY-y)/z)*lean.z + lean.dy;}

/* ---------- clock ---------- */
var CYC=11.0, FLIPD=0.24, WAVE=1.22;
var t0=performance.now()/1000, stunt=5, nextWhistle=t0+2.6, tNow=t0;
var DIRX=-260, DIRY=BASE-46, DIRZ=DIST-150;
var maxD=1;
for(var i2=0;i2<N;i2++){var q3=seats[i2],dx=q3.x-DIRX,dy=q3.y-DIRY,dz=q3.z-DIRZ;
  q3.dist=Math.sqrt(dx*dx+dy*dy+dz*dz); if(q3.dist>maxD)maxD=q3.dist;}
for(var i3=0;i3<N;i3++){seats[i3].prop=WAVE*seats[i3].dist/maxD;}
for(var i4=0;i4<N;i4++){var q4=seats[i4];q4.oldC=q4.packet[4];q4.newC=q4.packet[5];q4.flipT=t0-3;}

var pendingCheck=-1;
function whistle(){
  stunt=(stunt+1)%14;
  for(var i=0;i<N;i++){var q=seats[i];
    q.oldC=q.newC; q.flipT=tNow+q.prop+q.react;
    var c=q.packet[stunt];
    if(q.rev[stunt]&&c!==null&&c!==undefined)c=-1;      /* card round the wrong way */
    if(q.goneAt===stunt)c=null;
    q.newC=(c===undefined?null:c);
  }
  blowWhistle(); scheduleRiffles(); pendingCheck=tNow+2.4;
}

/* ---------- wind ---------- */
var gust=0,gustT=t0+3.4,gustLen=0,gustAmp=0,tumble=[];
function windStep(dt){
  if(tNow>gustT){ gustLen=0.9+rnd(tNow*3.1)*2.4; gustAmp=0.35+rnd(tNow*7.7)*0.75;
    gustT=tNow+gustLen+2.5+rnd(tNow*1.3)*9.0; gustEnd=tNow+gustLen; }
  var target=(tNow<gustEnd)?gustAmp:0.04;
  gust+=(target-gust)*Math.min(1,dt*3.2);
  if(gust>0.5){
    for(var i=(ROWS-11)*COLS;i<N;i++){
      var q=seats[i];
      if(q.isPlayer||q.absent)continue;
      if(q.newC===null||q.newC===undefined)continue;
      var exp=(q.r-33)/11; if(exp<0)continue;
      if(Math.random()<0.000055*gust*exp*(1+exp)){
        var sx=px(q.x,q.y+CHEST,q.z), sy=py(q.x,q.y+CHEST,q.z);
        tumble.push({x:sx,y:sy,vx:(Math.random()-.3)*26,vy:-40-Math.random()*70,
                     rot:Math.random()*6.28,spin:(Math.random()-.5)*7,c:q.newC,age:0});
        q.packet.splice(stunt,1); q.packet.push(null); q.goneAt=stunt; q.newC=null;
        store.lost.push([q.r,q.s,stunt]); if(store.lost.length>220)store.lost.shift(); save();
      }
    }
  }
}
var gustEnd=t0;

/* ---------- input ---------- */
var raise=0, raiseTarget=0, dragging=false, dragY=0, lean={z:1,dy:0,t:0}, leaning=false;
function inPacket(y){return y>H*0.78;}
cv.addEventListener("pointerdown",function(e){
  startAudio();
  if(inPacket(e.clientY)){dragging=true;dragY=e.clientY;}
  else leaning=true;
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var d=(dragY-e.clientY)/(H*0.22);
  raiseTarget=Math.max(0,Math.min(1,raiseTarget+d));
  dragY=e.clientY;
});
window.addEventListener("pointerup",function(){dragging=false;leaning=false;});
window.addEventListener("pointercancel",function(){dragging=false;leaning=false;});
window.addEventListener("keydown",function(e){
  startAudio();
  if(e.key==="ArrowUp"){raiseTarget=Math.min(1,raiseTarget+0.34);e.preventDefault();}
  if(e.key==="ArrowDown"){raiseTarget=Math.max(0,raiseTarget-0.34);e.preventDefault();}
});

/* ---------- audio ---------- */
var A=null,master=null,noiseBuf=null,bandT=0;
function startAudio(){
  if(A)return;
  try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=A.createGain();master.gain.value=0.85;master.connect(A.destination);
  var len=A.sampleRate*2, b=A.createBuffer(1,len,A.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  noiseBuf=b;
  /* crowd bed */
  var cs=A.createBufferSource();cs.buffer=b;cs.loop=true;
  var cf=A.createBiquadFilter();cf.type="bandpass";cf.frequency.value=620;cf.Q.value=0.55;
  var cg=A.createGain();cg.gain.value=0.075;
  cs.connect(cf);cf.connect(cg);cg.connect(master);cs.start();
  setInterval(function(){ if(!A)return; var t=A.currentTime;
    cg.gain.cancelScheduledValues(t);
    cg.gain.setValueAtTime(cg.gain.value,t);
    cg.gain.linearRampToValueAtTime(0.055+Math.random()*0.09,t+1.2+Math.random()*2.4);
  },2600);
  /* wind on the press-box glass */
  var ws=A.createBufferSource();ws.buffer=b;ws.loop=true;
  var wf=A.createBiquadFilter();wf.type="lowpass";wf.frequency.value=280;
  windG=A.createGain();windG.gain.value=0.02;
  ws.connect(wf);wf.connect(windG);windG.connect(master);ws.start();
  bandT=A.currentTime+0.7;
  bandTick(); benchTick();
}
var windG=null;
function noise(dur,freq,q,gain,pan,t){
  if(!A)return;
  var s=A.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=0.7+Math.random()*0.9;
  var f=A.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=q;
  var gn=A.createGain();gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(gain,t+0.006);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  var p=A.createStereoPanner?A.createStereoPanner():null;
  s.connect(f);f.connect(gn);
  if(p){p.pan.value=pan;gn.connect(p);p.connect(master);}else gn.connect(master);
  s.start(t);s.stop(t+dur+0.02);
}
function blowWhistle(){
  if(!A)return;var t=A.currentTime+0.02;
  noise(0.05,3000,1.2,0.05,0,t);
  for(var k=0;k<2;k++){
    var o=A.createOscillator();o.type="sawtooth";o.frequency.value=k?2645:2370;
    var bp=A.createBiquadFilter();bp.type="bandpass";bp.frequency.value=k?2645:2370;bp.Q.value=9;
    var lfo=A.createOscillator();lfo.type="sine";lfo.frequency.value=23+k*2;
    var lg=A.createGain();lg.gain.value=58;lfo.connect(lg);lg.connect(o.frequency);
    var gn=A.createGain();gn.gain.setValueAtTime(0,t);
    gn.gain.linearRampToValueAtTime(0.055,t+0.02);
    gn.gain.setValueAtTime(0.05,t+0.30);
    gn.gain.exponentialRampToValueAtTime(0.0002,t+0.44);
    o.connect(bp);bp.connect(gn);gn.connect(master);
    o.start(t);lfo.start(t);o.stop(t+0.5);lfo.stop(t+0.5);
  }
}
function scheduleRiffles(){
  if(!A)return;var base=A.currentTime+0.03;
  for(var i=0;i<N;i+=3){
    var q=seats[i]; if(q.absent)continue;
    var when=base+q.prop+q.react;
    if(when<base)when=base;
    noise(0.045,1500+rnd(i)*1400,2.6,0.011,Math.max(-1,Math.min(1,q.x/460)),when);
  }
}
function bandTick(){
  if(!A)return;
  var tune=[0,4,7,4,0,-3,0,2,4,2,0,-1,0,4,7,12,7,4,0,-5];
  var t=A.currentTime+0.1, bpm=112, step=60/bpm;
  for(var i=0;i<8;i++){
    var n=tune[Math.floor(Math.random()*tune.length)];
    var f=196*Math.pow(2,n/12)*0.978;                /* running a little flat */
    var tt=t+i*step;
    for(var k=0;k<2;k++){
      var o=A.createOscillator();o.type=k?"triangle":"sawtooth";
      o.frequency.value=f*(k?2:1)*(1+(Math.random()-.5)*0.006);
      var lp=A.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1200;
      var gn=A.createGain();gn.gain.setValueAtTime(0,tt);
      gn.gain.linearRampToValueAtTime(k?0.007:0.014,tt+0.05);
      gn.gain.exponentialRampToValueAtTime(0.0002,tt+step*0.85);
      var p=A.createStereoPanner?A.createStereoPanner():null;
      o.connect(lp);lp.connect(gn);
      if(p){p.pan.value=-0.62;gn.connect(p);p.connect(master);}else gn.connect(master);
      o.start(tt);o.stop(tt+step);
    }
  }
  setTimeout(bandTick,step*8000*0.98);
}
function benchTick(){
  if(!A)return;var t=A.currentTime+0.05;
  var rat=[1,2.76,5.4,8.9];
  for(var i=0;i<4;i++){
    var o=A.createOscillator();o.type="sine";o.frequency.value=430*rat[i];
    var gn=A.createGain();gn.gain.setValueAtTime(0.02/(i+1),t);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+0.5+i*0.1);
    var p=A.createStereoPanner?A.createStereoPanner():null;
    o.connect(gn); if(p){p.pan.value=0.4;gn.connect(p);p.connect(master);}else gn.connect(master);
    o.start(t);o.stop(t+0.9);
  }
  setTimeout(benchTick,14000+Math.random()*30000);
}

/* ---------- colour ---------- */
function shadeOf(col,q,tilt,roll){
  var base;
  if(col===-1)base=PULP; else base=PAL[col];
  var ny=Math.sin(tilt)*Math.cos(roll);
  var sky=0.5+0.5*ny;
  var val=(0.74+0.32*sky)*(1+q.dye);
  var bl=0;
  if(q.r>35)bl=((q.r-35)/9)*0.17;
  var rr=base[0],gg=base[1],bb=base[2];
  if(bl>0){ rr=rr+(239-rr)*bl*0.62; gg=gg+(233-gg)*bl*0.66; bb=bb+(216-bb)*bl*0.80; }
  rr*=val;gg*=val;bb*=val;
  return "rgb("+(rr|0)+","+(gg|0)+","+(bb|0)+")";
}

/* ---------- draw ---------- */
function drawStand(){
  g.fillStyle="#a8a49a";g.fillRect(0,0,W,H);
  /* crowd band behind everything */
  var topY=py(0,BASE+ROWS*RISE+240,DIST+ROWS*DEPTH), botY=py(0,BASE-260,DIST-260);
  g.save();g.beginPath();g.rect(0,topY,W,Math.max(2,botY-topY));g.clip();
  g.fillStyle=crowdPat||"#8f8a83";g.fillRect(0,topY,W,botY-topY);
  g.fillStyle="rgba(120,116,110,.24)";g.fillRect(0,topY,W,botY-topY);
  g.restore();
  /* the section's own concrete */
  var pad=1.6;
  function cor(r,s){var p=pitchOf(r),x=(s-(COLS-1)/2)*p,y=BASE+r*RISE,z=DIST+r*DEPTH;return[px(x,y,z),py(x,y,z)];}
  var a=cor(-pad,-pad),b=cor(-pad,COLS-1+pad),c=cor(ROWS-1+pad,COLS-1+pad+3),d=cor(ROWS-1+pad,-pad-3);
  g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();
  g.fillStyle="#a8a49a";g.fill();
  g.save();g.clip();
  for(var r=0;r<ROWS+2;r++){
    var L=cor(r,-pad-1),R=cor(r,COLS-1+pad+1);
    g.strokeStyle="rgba(126,122,114,.55)";g.lineWidth=1;
    g.beginPath();g.moveTo(L[0],L[1]);g.lineTo(R[0],R[1]);g.stroke();
    var y2=BASE+r*RISE+13,z2=DIST+r*DEPTH,p2=pitchOf(r);
    g.strokeStyle="rgba(90,96,96,.62)";g.lineWidth=1;
    g.beginPath();
    g.moveTo(px(-(COLS/2+1)*p2,y2,z2),py(-(COLS/2+1)*p2,y2,z2));
    g.lineTo(px((COLS/2+1)*p2,y2,z2),py((COLS/2+1)*p2,y2,z2));
    g.stroke();
  }
  g.restore();
  /* overhang across the top of frame */
  var ohY=py(0,BASE+ROWS*RISE+430,DIST+ROWS*DEPTH+520);
  g.fillStyle="#6c6a64";g.fillRect(0,0,W,ohY);
  g.fillStyle="rgba(50,49,46,.55)";g.fillRect(0,ohY-5,W,5);
  g.fillStyle="rgba(90,96,96,.5)";g.fillRect(0,ohY*0.42,W,1.4);
}
function drawTrack(){
  var ty=py(0,BASE-210,DIST-320);
  if(ty<H){
    g.fillStyle="#b6ab98";g.fillRect(0,ty,W,H-ty);
    g.fillStyle="rgba(150,138,120,.55)";g.fillRect(0,ty,W,2);
    g.strokeStyle="rgba(232,226,210,.30)";g.lineWidth=1.5;
    for(var k=1;k<4;k++){var yy=ty+(H-ty)*(k/4.2);g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke();}
    /* the director, on the cinders, megaphone at his side */
    var dx=px(DIRX,BASE-150,DIST-320), dy=py(DIRX,BASE-150,DIST-320);
    var hgt=Math.max(9,H*0.024);
    g.fillStyle="#2c2620";
    g.fillRect(dx-hgt*0.13,dy-hgt,hgt*0.26,hgt*0.72);
    g.beginPath();g.arc(dx,dy-hgt-hgt*0.12,hgt*0.13,0,6.283);g.fill();
    var swing=(tNow-(nextWhistle-CYC))<0.5?-0.5:0.1;
    g.fillRect(dx+hgt*0.10,dy-hgt+hgt*0.10+swing*hgt*0.3,hgt*0.09,hgt*0.42);
    g.fillStyle="#5a6060";g.fillRect(dx-hgt*0.30,dy-hgt*0.42,hgt*0.13,hgt*0.30);
  }
}
function drawCards(){
  var pR=store.seat.r,pS=store.seat.s;
  for(var r=ROWS-1;r>=0;r--){
    for(var s=0;s<COLS;s++){
      var q=seats[r*COLS+s];
      if(q.absent)continue;
      var col,tilt=Math.PI/2+q.tilt0,roll=q.roll0,dropY=0,hf=1;
      var age=tNow-q.flipT;
      if(age<0){ col=q.oldC; }
      else if(age<FLIPD){
        var p=age/FLIPD, ang=p*Math.PI;
        col=(p<0.5)?q.oldC:q.newC;
        if(Math.abs(Math.cos(ang))<0.62)col=-1;
        hf=Math.max(0.13,Math.abs(Math.cos(ang)));
        tilt=Math.PI/2+q.tilt0+Math.sin(ang)*0.22;
      } else {
        col=q.newC;
        var hold=age-FLIPD;
        if(hold>q.stam){ var f=(hold-q.stam)/0.7;
          if(f>=1){continue;}
          tilt=Math.PI/2+q.tilt0-f*1.05; dropY=-f*16; hf=1-f*0.35; }
        else if(hold>3.9){
          var k=Math.min(1,(hold-3.9)/5.6)*(1.35-0.55*(q.r/44));
          var jj=rnd(q.r*31+q.s*7+Math.floor(tNow*2));
          tilt=Math.PI/2+q.tilt0-k*(0.20+jj*0.30);
          roll=q.roll0+k*(jj-0.5)*0.30;
          dropY=-k*7;
        }
      }
      if(col===null||col===undefined)continue;
      if(q.isPlayer){ if(raise<0.55)continue; col=q.packet[stunt]; if(col===null)continue; hf*=0.6+0.4*raise; }
      /* wind shiver on the exposed rows */
      if(gust>0.05&&q.r>28){
        var ex=(q.r-28)/16;
        var sh=Math.sin(tNow*7.4+q.x*0.0055+q.r*0.32)*gust*ex*0.17;
        tilt+=sh; roll+=sh*0.45;
      }
      var cy=q.y+CHEST+dropY, z=q.z;
      var rx=Math.cos(roll)*HW, ry=Math.sin(roll)*HW;
      var uy=Math.cos(roll)*Math.sin(tilt)*HH*hf, ux=-Math.sin(roll)*Math.sin(tilt)*HH*hf;
      var uz=Math.cos(tilt)*HH*hf;
      var x1=q.x, cs=[];
      cs.push([x1-rx-ux, cy-ry-uy, z-uz]);
      cs.push([x1+rx-ux, cy+ry-uy, z-uz]);
      cs.push([x1+rx+ux, cy+ry+uy, z+uz]);
      cs.push([x1-rx+ux, cy-ry+uy, z+uz]);
      g.beginPath();
      for(var i=0;i<4;i++){var X=px(cs[i][0],cs[i][1],cs[i][2]),Y=py(cs[i][0],cs[i][1],cs[i][2]);
        if(i===0)g.moveTo(X,Y);else g.lineTo(X,Y);}
      g.closePath();
      g.fillStyle=shadeOf(col,q,tilt,roll);
      g.fill();
    }
  }
}
function drawTumble(dt){
  for(var i=tumble.length-1;i>=0;i--){
    var t=tumble[i];
    t.age+=dt; t.x+=t.vx*dt; t.y+=t.vy*dt; t.vy-=14*dt; t.vx+=(Math.random()-.5)*18*dt; t.rot+=t.spin*dt;
    if(t.y<-60||t.age>9){tumble.splice(i,1);continue;}
    g.save();g.translate(t.x,t.y);g.rotate(t.rot);
    var wpx=Math.max(4,F*14/(DIST+900)), hpx=wpx*(22/14)*Math.abs(Math.cos(t.rot*1.7));
    g.fillStyle=(Math.cos(t.rot*1.7)<0)?"rgb(138,127,107)":shadeOf(t.c,{r:40,dye:0},1.2,0);
    g.fillRect(-wpx/2,-hpx/2,wpx,Math.max(1.5,hpx));
    g.restore();
  }
}
/* ---------- the packet in your own hands ---------- */
function drawNear(){
  var h=nc.height/DPR;
  ng.clearRect(0,0,W,h);
  var cxp=W*0.5, baseY=h*1.02, wide=Math.min(W*0.74,h*2.5);
  /* the stack, edge on */
  var left=cxp-wide/2, right=cxp+wide/2;
  for(var k=13;k>=stunt;k--){
    var off=(k-stunt)*Math.max(1.6,h*0.011);
    var y=baseY-off*1.0;
    ng.fillStyle=(k%2)?"rgb(150,139,119)":"rgb(136,125,105)";
    ng.beginPath();
    ng.moveTo(left+off*0.7,y);ng.lineTo(right-off*0.7,y);
    ng.lineTo(right-off*0.7-wide*0.06,y+h*0.05);ng.lineTo(left+off*0.7+wide*0.06,y+h*0.05);
    ng.closePath();ng.fill();
  }
  /* the top card, lifted */
  var lift=raise*h*1.16;
  var q=seats[store.seat.r*COLS+store.seat.s];
  var col=q.packet[stunt];
  var cw=wide*0.86, ch=cw*(22/14)*0.52;
  var topY=baseY-h*0.03-lift;
  var skew=wide*0.05*(1-raise);
  ng.beginPath();
  ng.moveTo(cxp-cw/2+skew,topY-ch);ng.lineTo(cxp+cw/2-skew,topY-ch);
  ng.lineTo(cxp+cw/2,topY);ng.lineTo(cxp-cw/2,topY);ng.closePath();
  if(col===null||col===undefined)ng.fillStyle="rgb(150,139,119)";
  else ng.fillStyle=shadeOf(raise>0.55?col:-1,{r:20,dye:0.01},1.25+raise*0.25,0);
  ng.fill();
  /* the paste-on flip sheet, far too close to read */
  var psW=cw*0.30, psH=ch*0.20;
  ng.fillStyle="rgba(238,232,214,.92)";
  ng.fillRect(cxp-cw*0.40,topY-ch*0.88,psW,psH);
  ng.fillStyle="rgba(44,38,32,.72)";
  for(var m=0;m<3;m++){
    var yy=topY-ch*0.88+psH*(0.22+m*0.28);
    for(var n2=0;n2<4;n2++)
      ng.fillRect(cxp-cw*0.38+n2*psW*0.20+rnd(m*3+n2)*2, yy, psW*0.11, psH*0.14);
  }
  /* thumbs */
  ng.fillStyle="rgba(78,66,56,.78)";
  ng.beginPath();ng.ellipse(cxp-cw*0.44,topY+h*0.01,wide*0.055,h*0.10,0.4,0,6.283);ng.fill();
  ng.beginPath();ng.ellipse(cxp+cw*0.44,topY+h*0.01,wide*0.055,h*0.10,-0.4,0,6.283);ng.fill();
}

/* ---------- loop ---------- */
var last=performance.now()/1000;
function frame(){
  var now=performance.now()/1000; var dt=Math.min(0.06,now-last); last=now; tNow=now;
  if(now>=nextWhistle){ nextWhistle+=CYC; whistle(); }
  if(pendingCheck>0&&now>pendingCheck){
    pendingCheck=-1;
    if(raise>0.55){store.correct=(store.correct|0)+1;save();}
  }
  raise+=(raiseTarget-raise)*Math.min(1,dt*9);
  lean.t+=(leaning?1:0)-lean.t*0+0; 
  var lt=leaning?1:0;
  lean.z+=(1+lt*0.035-lean.z)*Math.min(1,dt*4);
  var jit=leaning?0.12:0.55;
  lean.dy=Math.sin(now*1.7)*jit+Math.sin(now*0.63)*jit*0.8;
  if(windG&&A)windG.gain.value=0.014+gust*0.055;
  windStep(dt);
  drawStand();
  drawCards();
  drawTumble(dt);
  drawTrack();
  drawNear();
  requestAnimationFrame(frame);
}
window.addEventListener("resize",resize);
resize();
requestAnimationFrame(frame);
console.log("row "+(store.seat.r+1)+", seat "+(store.seat.s+1)+" · packet of fourteen · "+(store.correct|0)+" up on the count so far");
console.log("20,160 cards counted twice on the ping-pong table. Still eleven short. Section runs anyway.");
/* the yellow in rows 37-45 has had sun on it since one o'clock and it shows */
})();
</script>
