  <meta name="outbox-spec-era" content="1972 Shōwa-era Japanese pachinko hall on a bright weekday afternoon — the chrome-and-lacquer heyday of the upright mechanical machine, all hand-driven spring launchers before the electric ones came in: a wall of gleaming vertical machines, the constant silvery rain-on-tin roar of steel balls, a tray of borrowed 25-yen balls in your lap, one machine picked out, the glass wiped clean, ready to play RIGHT NOW; not a retro-relic, not a nostalgia piece, not a 'lost golden age of the parlor' elegy — a working machine you sit down at this afternoon, the spring stiff under your thumb, the pins bright, the first ball loaded.">
  <meta name="outbox-spec-format" content="The entire viewport IS the glass-fronted vertical playfield of a single pachinko machine seen dead-on: a lacquered board studded with a real forest of dozens of tiny brass pins, a scatter of catcher-pockets, a slowly rotating three-petal center TULIP that opens and closes on its own, a curved launch-rail up the right edge, and a payout tray across the bottom. A spring-loaded launch KNOB sits at the lower right — click-and-HOLD it to wind the spring (a little power arc fills as you hold), RELEASE to fire one steel ball up the rail, and the ball genuinely rains down through the pin-field on real physics, pinballing off brass, threading gaps, mostly draining out the bottom — but catch a pocket or thread the open tulip and a clattering handful of new balls pays out into your tray. Read the field, feel out the launch strength, empty your tray or fill it. No chrome-of-the-browser, no header, no captions — just the glass, the pins, the falling balls, the tray.">

<title>Ease Off the Spring — Machine No. 14, Kissed the Rail, Fed the Tulip</title>
<meta name="description" content="A working upright pachinko machine, glass wiped, pins bright. Wind the spring, let one fly.">
<!--
  Machine No.14, third row from the door, under the big fluorescent bar.
  Mr. Fukuda plays the one two down and will not stop talking to you (this is a gift).
  Ease off the spring. You want it to just KISS the top rail and drop into that lane.
  (yes, the double really can happen. keep the rail loaded.)
-->
<style>
  :root{
    --red:#c0261f; --brass:#b8873a; --cream:#e9ddc4;
    --steel:#c6cbd0; --gold:#f2b12c; --green:#2f6b52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#14100e;
    -webkit-user-select:none; user-select:none;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif; }
  #stage{ position:fixed; inset:0; }
  #field{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* glass sheen over the whole face */
  #glass{ position:absolute; inset:0; pointer-events:none; z-index:3;
    background:
      linear-gradient(115deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 60%, rgba(255,255,255,.05) 78%, rgba(255,255,255,0) 100%);
    mix-blend-mode:screen; }
  #glass::before{ content:""; position:absolute; left:0; right:0; top:0; height:9%;
    background:linear-gradient(#ffffff55, #ffffff00); opacity:.55; }

  /* the regular, leaning over */
  #chatter{ position:absolute; left:3.2%; bottom:15%; z-index:5; max-width:min(62%,430px);
    pointer-events:none; }
  #chatter .bub{
    display:inline-block; background:rgba(233,221,196,.93); color:#5a2c22;
    border:2px solid #a86f2f; border-radius:14px 14px 14px 3px;
    padding:9px 13px; font-size:clamp(12px,2.5vw,15px); line-height:1.32; font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 #fff8;
    opacity:0; transform:translateY(8px) scale(.98);
    transition:opacity .35s ease, transform .35s ease; letter-spacing:.1px; }
  #chatter.show .bub{ opacity:1; transform:none; }
  #chatter .who{ display:block; font-size:.72em; color:var(--green);
    letter-spacing:.6px; text-transform:uppercase; margin-bottom:2px; opacity:.85; }

  /* enamel tray plate + counters + link, laid over the drawn tray */
  #plate{ position:absolute; left:0; right:0; bottom:0; z-index:4; pointer-events:none;
    padding:0 12px 6px; display:flex; align-items:flex-end; justify-content:space-between;
    gap:8px; font-size:clamp(9px,2vw,12px); }
  .enamel{ color:#dff0e2; background:var(--green);
    border:1px solid #1c4433; border-radius:4px; padding:3px 9px;
    letter-spacing:.5px; font-weight:700; text-transform:uppercase;
    box-shadow:inset 0 1px 0 #6fbf95, inset 0 -2px 4px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    text-shadow:0 1px 1px rgba(0,0,0,.45); white-space:nowrap; }
  #won.flash{ animation:pop .5s ease; }
  @keyframes pop{ 0%{transform:scale(1)} 30%{transform:scale(1.14); box-shadow:0 0 18px var(--gold), inset 0 1px 0 #6fbf95} 100%{transform:scale(1)} }
  #plate a{ pointer-events:auto; color:#cbe6d3; text-decoration:none; border-bottom:1px dotted #7fae94; }
  #plate a:hover{ color:#fff; }

  /* the spring knob */
  #knobwrap{ position:absolute; right:5%; bottom:16%; z-index:6;
    width:clamp(64px,17vw,94px); aspect-ratio:1; border-radius:50%;
    padding:6px; touch-action:none;
    background:conic-gradient(var(--gold) 0deg, rgba(0,0,0,.35) 0deg);
    box-shadow:0 6px 16px rgba(0,0,0,.5); }
  #knob{ width:100%; height:100%; border-radius:50%; border:none; cursor:pointer;
    background:
      radial-gradient(circle at 34% 30%, #fbe7c6 0%, #d8a94e 30%, var(--brass) 62%, #6f5220 100%);
    box-shadow:inset 0 2px 5px #fff8, inset 0 -6px 12px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.6);
    position:relative; transition:transform .06s ease; touch-action:none; }
  #knob:active{ transform:scale(.94); }
  #knob::after{ content:"WIND"; position:absolute; inset:0; display:grid; place-items:center;
    font-size:clamp(9px,2.3vw,12px); font-weight:800; letter-spacing:1px; color:#3a2408;
    text-shadow:0 1px 0 #ffd98a; }
  #knobwrap.armed{ filter:drop-shadow(0 0 8px var(--gold)); }
  #knobhint{ position:absolute; right:5%; bottom:calc(16% + clamp(64px,17vw,94px) + 8px);
    z-index:6; color:#f4e8cd; font-size:clamp(9px,2vw,11px); font-weight:700; text-align:right;
    text-shadow:0 1px 3px #000; opacity:.9; pointer-events:none; max-width:44vw;
    animation:sway 3.6s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{opacity:.55} 50%{opacity:.95} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>
  <div id="chatter"><span class="bub"><span class="who">two machines down</span><span class="txt"></span></span></div>
  <div id="knobhint">hold to wind ↴<br>let go to fire · space = one shot</div>
  <div id="knobwrap"><button id="knob" aria-label="Wind the launch spring"></button></div>
  <div id="plate">
    <span class="enamel" id="tray">IN THE TRAY ▸ 40</span>
    <span class="enamel" id="won">BALLS WON AT THIS MACHINE: 0</span>
    <a href="/archive" title="the rest of the floor">the rest of the floor →</a>
  </div>
  <div id="glass"></div>
</div>

<script>
(function(){
"use strict";
var cv = document.getElementById('field');
var ctx = cv.getContext('2d');
var chatEl = document.getElementById('chatter');
var chatTxt = chatEl.querySelector('.txt');
var trayEl = document.getElementById('tray');
var wonEl = document.getElementById('won');
var knobWrap = document.getElementById('knobwrap');
var knob = document.getElementById('knob');
var hintEl = document.getElementById('knobhint');

/* ---------- persistent tally ---------- */
var lifetime = 0;
try { lifetime = parseInt(localStorage.getItem('outbox_pachinko_won')||'0',10) || 0; } catch(e){}
var ammo = 40;
function saveWon(){ try{ localStorage.setItem('outbox_pachinko_won', String(lifetime)); }catch(e){} }
function drawCounters(){
  wonEl.textContent = 'BALLS WON AT THIS MACHINE: ' + lifetime;
  trayEl.textContent = 'IN THE TRAY ▸ ' + ammo;
}
drawCounters();

/* ---------- geometry (recomputed on resize) ---------- */
var W,H,DPR, frame, rw, railX, railCenterX, fieldLeft, fieldRight, fieldTop, trayTop,
    fieldW, fieldH, fieldCenterX, Rarc, cx, cy, R, PR, G, SPEED_MIN, SPEED_MAX, VCAP;
var pins=[], pockets=[], tulip={};

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  frame = Math.max(7, Math.min(W,H)*0.02);
  rw = Math.max(20, Math.min(W*0.07, 34));
  railX = W - frame - rw;
  railCenterX = W - frame - rw/2;
  fieldLeft = frame; fieldTop = frame;
  fieldRight = railX;
  trayTop = H - Math.max(58, Math.min(H*0.11, 92));
  fieldW = fieldRight - fieldLeft;
  fieldH = trayTop - fieldTop;
  fieldCenterX = (fieldLeft + fieldRight)/2;

  Rarc = Math.min(0.185*H, 0.35*fieldW);
  cy = fieldTop + Rarc;
  cx = railCenterX - Rarc;

  R  = Math.max(4.4, Math.min(H*0.0092, 7));
  PR = Math.max(2.3, Math.min(H*0.0052, 4));

  G = H*1.9; SPEED_MIN = H*1.16; SPEED_MAX = H*2.12; VCAP = H*2.6;

  buildField();
}

function buildField(){
  pins = []; pockets = [];
  tulip = { x: fieldCenterX, y: fieldTop + fieldH*0.55,
            r: Math.max(14, fieldW*0.058), open:0, rot:0, phase:0 };

  var laneHalf = Math.max(fieldW*0.075, R*3.4);
  var startY = fieldTop + fieldH*0.24;
  var endY   = tulip.y - tulip.r*0.55;
  var rowGap = Math.max(fieldH*0.052, PR*7.5);
  var colGap = Math.max(fieldW*0.076, PR*8);
  var row = 0;
  for (var y=startY; y<=fieldTop+fieldH*0.70; y+=rowGap, row++){
    var off = (row%2) ? colGap*0.5 : 0;
    for (var x=fieldLeft+fieldW*0.09+off; x<=fieldRight-fieldW*0.07; x+=colGap){
      // carve a clean lane straight above the tulip
      if (y < endY && Math.abs(x - tulip.x) < laneHalf) continue;
      // keep clear of the tulip body and the throat directly under it
      if (Math.hypot(x-tulip.x, y-tulip.y) < tulip.r*1.35) continue;
      // little jitter so the field looks hand-driven, not a grid
      var jx = (Math.sin(x*3.1+y)*0.5)*PR*1.6;
      pins.push({x:x+jx, y:y});
    }
  }
  // a couple of guide nails just under the tulip so a missed thread still bounces
  pins.push({x: tulip.x - tulip.r*0.9, y: tulip.y + tulip.r*0.95});
  pins.push({x: tulip.x + tulip.r*0.9, y: tulip.y + tulip.r*0.95});

  var py = fieldTop + fieldH*0.72;
  var cr = R*2.5;
  pockets.push({x: fieldLeft+fieldW*0.19, y: py, catchR: cr, pay:[7,15]});
  pockets.push({x: fieldRight-fieldW*0.19, y: py, catchR: cr, pay:[7,15]});
  pockets.push({x: fieldCenterX, y: fieldTop+fieldH*0.85, catchR: cr*0.92, pay:[6,12]});
  // guide nails framing each side pocket mouth
  pockets.forEach(function(p){
    pins.push({x:p.x - p.catchR*1.55, y:p.y - p.catchR*0.35});
    pins.push({x:p.x + p.catchR*1.55, y:p.y - p.catchR*0.35});
  });
}
window.addEventListener('resize', resize);
resize();

/* ---------- balls ---------- */
var balls = [];
var MAXBALLS = 14;
var E_PIN=0.55, E_WALL=0.5, E_DOME=0.62;

function fire(power){
  if (balls.length >= MAXBALLS) return;
  if (ammo <= 0) lendBagful();
  ammo--;
  drawCounters();
  var sp = SPEED_MIN + (SPEED_MAX-SPEED_MIN)*Math.max(0,Math.min(1,power));
  balls.push({
    x: railCenterX, y: trayTop - R - 2,
    vx: 0, vy: -sp, r: R,
    inRail: true, gotIn:false, minX: railCenterX, power: power, dead:0
  });
  hintEl.style.display = 'none';
}

function lendBagful(){
  ammo += 40;
  say(pick(LINES.lend), 'lend');
}

/* ---------- payouts ---------- */
var trayGlow=0, particles=[];
function payout(n, kind){
  ammo += n; lifetime += n; saveWon(); drawCounters();
  trayGlow = Math.min(1.4, trayGlow + (kind==='jackpot'?1.4:0.9));
  wonEl.classList.remove('flash'); void wonEl.offsetWidth; wonEl.classList.add('flash');
  var count = Math.min(n, kind==='jackpot'?60:26);
  for (var i=0;i<count;i++){
    particles.push({
      x: fieldLeft + Math.random()*fieldW,
      y: trayTop - Math.random()*fieldH*0.35,
      vy: 60 + Math.random()*180, r: R*(0.7+Math.random()*0.5),
      life: 0.5 + Math.random()*0.7
    });
  }
  // milestone cheer as the tray gets heavy
  var mark = Math.floor(ammo/60);
  if (mark > lastMark && kind!=='jackpot'){ lastMark = mark; say(pick(LINES.filling),'fill'); }
}
var lastMark = Math.floor(ammo/60);

/* ---------- physics ---------- */
var lastT = performance.now();
function step(dt){
  var tulipCatches = [];
  var drained = [];
  for (var i=balls.length-1; i>=0; i--){
    var b = balls[i];
    var sp = Math.hypot(b.vx,b.vy);
    var sub = Math.max(1, Math.min(8, Math.ceil(sp*dt/(b.r*0.8))));
    var sdt = dt/sub;
    for (var s=0; s<sub && !b.dead; s++){
      b.vy += G*sdt;
      var cur = Math.hypot(b.vx,b.vy);
      if (cur > VCAP){ var k=VCAP/cur; b.vx*=k; b.vy*=k; }
      b.x += b.vx*sdt; b.y += b.vy*sdt;

      // curved top rail (ride the inside of the dome)
      if (b.y <= cy){
        var dxc=b.x-cx, dyc=b.y-cy, dc=Math.hypot(dxc,dyc)||0.001;
        if (dc > Rarc - b.r){
          var nx=dxc/dc, ny=dyc/dc, ov=dc-(Rarc-b.r);
          b.x-=nx*ov; b.y-=ny*ov;
          var vn=b.vx*nx+b.vy*ny;
          if (vn>0){ b.vx-=(1+E_DOME)*vn*nx; b.vy-=(1+E_DOME)*vn*ny; }
        }
      }
      // straight rail lane while still climbing on the right
      if (b.inRail && b.y > cy){
        var mn=railX+b.r, mx=W-frame-b.r;
        if (b.x<mn){ b.x=mn; b.vx=-b.vx*E_WALL; }
        if (b.x>mx){ b.x=mx; b.vx=-b.vx*E_WALL; }
      }
      // once left of the inner rail wall, it's a field ball for good
      if (b.x < fieldRight - b.r){ b.inRail=false; b.gotIn=true; }
      if (b.x < b.minX) b.minX = b.x;
      // inner rail wall keeps field balls out of the launch lane
      if (!b.inRail && b.x > fieldRight - b.r && b.y > cy){
        b.x = fieldRight - b.r; b.vx = -Math.abs(b.vx)*E_WALL;
      }
      // outer field walls
      if (b.x < fieldLeft + b.r){ b.x=fieldLeft+b.r; b.vx=-b.vx*E_WALL; }
      if (b.y < fieldTop + b.r){ b.y=fieldTop+b.r; b.vy=-b.vy*E_WALL; }

      // brass pins
      for (var p=0; p<pins.length; p++){
        var pn=pins[p]; var dx=b.x-pn.x, dy=b.y-pn.y;
        var rr=b.r+PR, d2=dx*dx+dy*dy;
        if (d2 < rr*rr){
          var d=Math.sqrt(d2)||0.001, ux=dx/d, uy=dy/d, ovp=rr-d;
          b.x+=ux*ovp; b.y+=uy*ovp;
          var vn2=b.vx*ux+b.vy*uy;
          if (vn2<0){
            b.vx-=(1+E_PIN)*vn2*ux; b.vy-=(1+E_PIN)*vn2*uy;
            b.vx += (Math.random()-0.5)*10; // no two drops the same
          }
        }
      }

      // the tulip: solid bud when closed, a mouth when open
      var tdx=b.x-tulip.x, tdy=b.y-tulip.y, td=Math.hypot(tdx,tdy);
      if (tulip.open >= 0.55){
        if (td < tulip.r*0.5 && b.vy > 0){ b.dead=1; b.reason='tulip'; tulipCatches.push(b); }
      } else {
        var br = tulip.r*0.5;
        if (td < b.r+br){
          var dd=td||0.001, tx=tdx/dd, ty=tdy/dd, ov2=(b.r+br)-dd;
          b.x+=tx*ov2; b.y+=ty*ov2;
          var vn3=b.vx*tx+b.vy*ty;
          if (vn3<0){ b.vx-=(1+E_PIN)*vn3*tx; b.vy-=(1+E_PIN)*vn3*ty; b.vx+=(Math.random()-0.5)*10; }
        }
      }

      // catcher pockets
      for (var q=0; q<pockets.length; q++){
        var pk=pockets[q];
        if (b.vy>0 && Math.hypot(b.x-pk.x, b.y-pk.y) < pk.catchR){
          b.dead=1; b.reason='pocket'; b.pay=pk.pay; break;
        }
      }

      if (b.y > trayTop + b.r){ b.dead=1; if(!b.reason) b.reason='drain'; }
    }

    if (b.dead){
      if (b.reason==='pocket'){ payout(randInt(b.pay[0],b.pay[1]),'pocket'); say(pick(LINES.pocket),'pocket'); }
      else if (b.reason==='drain'){ drained.push(b); }
      balls.splice(i,1);
    }
  }

  // resolve the tulip: two at once is the jackpot the physics has to earn
  if (tulipCatches.length >= 2){
    payout(randInt(90,140),'jackpot');
    say(LINES.jackpot,'jackpot',7000);
  } else if (tulipCatches.length === 1){
    payout(randInt(22,40),'tulip');
    say(pick(LINES.tulip),'tulip');
  }

  // a drained ball earns a word, but not on every single one
  if (drained.length){
    var b=drained[drained.length-1];
    if (b.reason==='drain' && (b.inRail || !b.gotIn)) { say(pick(LINES.soft),'soft'); }
    else if (b.power > 0.82 && b.minX < fieldCenterX) { say(pick(LINES.hard),'hard'); }
    else if (Math.random() < 0.5) { say(pick(LINES.drain),'drain'); }
  }
}

/* ---------- draw ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);

  // lacquer board
  var bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#d63a30'); bg.addColorStop(0.5,'#c0261f'); bg.addColorStop(1,'#8f1a14');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // cream face inset
  ctx.fillStyle = 'rgba(233,221,196,0.10)';
  roundRect(fieldLeft-2, fieldTop-2, fieldRight-fieldLeft+4, trayTop-fieldTop+4, 8); ctx.fill();

  // curved top rail + straight rail
  ctx.lineCap='round';
  ctx.strokeStyle='#7a5a24'; ctx.lineWidth=R*2.1;
  ctx.beginPath(); ctx.arc(cx,cy,Rarc,0,Math.PI,true); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(railCenterX,cy); ctx.lineTo(railCenterX,trayTop); ctx.stroke();
  ctx.strokeStyle='#e6c778'; ctx.lineWidth=R*0.7;
  ctx.beginPath(); ctx.arc(cx,cy,Rarc,0,Math.PI,true); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(railCenterX,cy); ctx.lineTo(railCenterX,trayTop); ctx.stroke();
  // green enamel bead down the rail
  ctx.strokeStyle=getVar('--green'); ctx.lineWidth=Math.max(2,R*0.5);
  ctx.beginPath(); ctx.moveTo(W-frame, cy); ctx.lineTo(W-frame, trayTop); ctx.stroke();

  // pockets (green enamel cups)
  pockets.forEach(function(p){
    ctx.fillStyle='#123a2b';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.catchR*1.15, p.catchR*0.9, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle=getVar('--green'); ctx.lineWidth=Math.max(2.5,R*0.7);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.catchR, Math.PI*0.08, Math.PI-0.08); ctx.stroke();
    ctx.strokeStyle='#7fce9f'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.catchR, Math.PI*0.1, Math.PI*0.9); ctx.stroke();
  });

  // brass pins
  for (var i=0;i<pins.length;i++){
    var pn=pins[i];
    ctx.beginPath(); ctx.arc(pn.x,pn.y,PR,0,Math.PI*2);
    ctx.fillStyle=getVar('--brass'); ctx.fill();
    ctx.beginPath(); ctx.arc(pn.x-PR*0.32,pn.y-PR*0.32,PR*0.42,0,Math.PI*2);
    ctx.fillStyle='#f2dca0'; ctx.fill();
  }

  drawTulip();

  // steel balls
  for (var b=0;b<balls.length;b++) drawBall(balls[b].x, balls[b].y, balls[b].r);

  drawTray();
}

function drawTulip(){
  var t=tulip;
  // throat
  ctx.save();
  var glow = t.open;
  if (glow>0.05){
    var g=ctx.createRadialGradient(t.x,t.y,1,t.x,t.y,t.r*0.9);
    g.addColorStop(0,'rgba(255,225,140,'+(0.5+0.5*glow)+')');
    g.addColorStop(1,'rgba(242,177,44,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.9,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = t.open>0.5 ? '#7a3410' : '#5a1a12';
  ctx.beginPath(); ctx.arc(t.x,t.y,t.r*0.42,0,Math.PI*2); ctx.fill();
  // three petals
  var dist = t.r*(0.18 + 0.62*t.open);
  for (var k=0;k<3;k++){
    var a = t.rot + k*(Math.PI*2/3);
    var px = t.x + Math.cos(a)*dist, py = t.y + Math.sin(a)*dist;
    ctx.save(); ctx.translate(px,py); ctx.rotate(a+Math.PI/2);
    var pg=ctx.createLinearGradient(0,-t.r*0.55,0,t.r*0.55);
    pg.addColorStop(0,'#ffdf7a'); pg.addColorStop(0.5,getVar('--gold')); pg.addColorStop(1,'#c67f10');
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.ellipse(0,0,t.r*0.34,t.r*0.6,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#8a5410'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawBall(x,y,r){
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.15, x,y,r*1.05);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,'#e2e6ea');
  g.addColorStop(0.7,getVar('--steel')); g.addColorStop(1,'#6d7480');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.arc(x-r*0.34,y-r*0.4,r*0.24,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
}

function drawTray(){
  var trayH = H - trayTop;
  // enamel lip
  ctx.fillStyle = getVar('--green');
  ctx.fillRect(0, trayTop, W, Math.max(4,trayH*0.16));
  ctx.fillStyle='#7fce9f';
  ctx.fillRect(0, trayTop, W, Math.max(1.5,trayH*0.04));
  // tray well
  var tg=ctx.createLinearGradient(0,trayTop,0,H);
  tg.addColorStop(0,'#1d1712'); tg.addColorStop(1,'#0d0a08');
  ctx.fillStyle=tg; ctx.fillRect(0, trayTop+Math.max(4,trayH*0.16), W, trayH);
  // payout flash across the tray
  if (trayGlow>0.02){
    ctx.fillStyle='rgba(242,177,44,'+(0.32*trayGlow)+')';
    ctx.fillRect(0, trayTop, W, trayH);
  }
  // a shimmering heap of won steel, weight from ammo
  var wellTop = trayTop + Math.max(6,trayH*0.2);
  var heap = Math.min(1, ammo/220);
  var rows = Math.floor(2 + heap*3);
  var br = Math.max(3.4, R*0.8);
  for (var ry=0; ry<rows; ry++){
    var yy = H - br*1.4 - ry*br*1.5;
    if (yy < wellTop) break;
    var span = 0.5 + 0.5*heap;
    var count = Math.floor((W*span)/(br*2.1));
    var startx = (W - count*br*2.1)/2 + (ry%2)*br;
    for (var c=0;c<count;c++){
      var gx = startx + c*br*2.1 + Math.sin(c*1.3+ry)*br*0.3;
      drawBall(gx, yy, br);
    }
  }
  // falling payout particles
  for (var i=particles.length-1;i>=0;i--){
    var pt=particles[i];
    drawBall(pt.x, pt.y, pt.r);
  }
}

/* ---------- helpers ---------- */
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
var _cache={};
function getVar(n){ if(!_cache[n]) _cache[n]=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return _cache[n]; }
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------- the regular ---------- */
var LINES = {
  soft:[
    "Ah, too easy on her — she dribbled up the rail and flopped right back. Give the spring a proper squeeze.",
    "Not enough legs on that one, couldn't crest the top. Wind her harder, go on.",
    "Soft! She barely tickled the rail. Lean on that spring a good bit more."
  ],
  hard:[
    "Whoa — full send! Wind her all the way and she rockets clean over the top and dead down the middle every time. Ease off a hair.",
    "Too much thumb on that one — straight over the crest and down the drain. Back off the spring a touch."
  ],
  drain:[
    "Ah, that lane's a mean one — she'll eat a few. No shame in it, load another.",
    "Everybody feeds the machine their first bagful; that's how she learns your face. Wind her again.",
    "So close down the left there — same wind again, let's see her fall different.",
    "Down the middle again, eh? You want it to just KISS the top rail and drop into that clean lane — see it? That one feeds the tulip."
  ],
  pocket:[
    "THERE — that's a good handful, look at your tray fill up!",
    "Ha! Caught the pocket clean — those are all yours.",
    "Yes! Right in the cup. Listen to 'em clatter."
  ],
  tulip:[
    "OH — she threaded the tulip! Now THAT'S the good stuff, look at 'em RAIN!",
    "Right through the open petals! You've got the feel now — keep her raining!",
    "THAT'S the one you were hunting — straight through the tulip. Beautiful, that."
  ],
  jackpot: "OH — you got the DOUBLE, both balls in the tulip at once — I've not seen that in a WEEK! Look at your tray FLOOD!",
  filling:[
    "Would you look at that tray — filling faster than you can feed her now!",
    "You've well and truly got her figured. Grand handful, that.",
    "See? Told you she'd come round. Nowhere I'd rather be than watching this."
  ],
  lend:[
    "Here — take another bagful, they're only borrowed. Wind her up and keep at it.",
    "Empty already? Ha — grab a fresh handful, we're not done. Load one."
  ]
};
var chatTimer=null, chatLock=0;
function say(txt, kind, hold){
  var now = performance.now();
  var ambient = (kind==='soft'||kind==='hard'||kind==='drain');
  if (ambient && now < chatLock) return;      // don't nag on every drop
  chatLock = now + 2200;
  chatTxt.textContent = txt;
  chatEl.classList.add('show');
  if (chatTimer) clearTimeout(chatTimer);
  chatTimer = setTimeout(function(){ chatEl.classList.remove('show'); }, hold||4200);
}
say("Sit down, sit down — she's wiped clean and the pins are bright. Hold that knob to wind the spring, let go to fire. I'll watch.", 'intro', 6500);

/* ---------- knob / input ---------- */
var winding=false, windStart=0, power=0;
function currentPower(){ return Math.min(1, (performance.now()-windStart)/1100); }
function startWind(e){ if(e) e.preventDefault(); winding=true; windStart=performance.now();
  knobWrap.classList.add('armed'); hintEl.style.display='none'; }
function releaseWind(){ if(!winding) return; winding=false;
  knobWrap.classList.remove('armed');
  fire(currentPower());
  knobWrap.style.background='conic-gradient(var(--gold) 0deg, rgba(0,0,0,.35) 0deg)';
}
knob.addEventListener('pointerdown', startWind);
window.addEventListener('pointerup', releaseWind);
window.addEventListener('pointercancel', releaseWind);
window.addEventListener('keydown', function(e){
  if (e.code==='Space'){ e.preventDefault(); if(!e.repeat) fire(0.5); }
});

/* ---------- main loop ---------- */
function frame(now){
  var dt = Math.min(0.033, (now-lastT)/1000); lastT = now;
  if (dt<=0) dt=0.016;

  // tulip timer: closed → opening → open → closing, on its own
  tulip.phase += dt;
  var period = 5.6;
  var ph = tulip.phase % period;
  if (ph < 2.2) tulip.open = 0;
  else if (ph < 2.7) tulip.open = (ph-2.2)/0.5;
  else if (ph < 5.1) tulip.open = 1;
  else tulip.open = 1 - (ph-5.1)/0.5;
  tulip.rot += dt*0.5;

  if (winding){
    power = currentPower();
    knobWrap.style.background = 'conic-gradient(var(--gold) '+(power*360)+'deg, rgba(0,0,0,.35) 0deg)';
  }

  step(dt);

  // particles + glow decay
  if (trayGlow>0) trayGlow = Math.max(0, trayGlow - dt*1.6);
  for (var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.vy += G*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.y > H - p.r || p.life<=0) particles.splice(i,1);
  }

  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

console.log("%cEase off the spring — you want it to just KISS the top rail. Machine No.14 remembers your face.", "color:#2f6b52;font-weight:bold");
})();
</script>
