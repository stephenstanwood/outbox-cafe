  <meta name="outbox-spec-era" content="The second night of a summer shrine festival, mid-August 1958, about half past eight, at a goldfish-scooping stall wedged between a candied-apple stand and a ring toss on the gravel approach to a neighbourhood shrine in Osaka. The stall is one long, shallow galvanised tub painted sky-blue inside, lit by two bare bulbs on a wire and a paper lantern that swings when anyone bumps the pole. Children crouch along the rim in cotton summer robes with paper scoops in their fists. The tub's water is cool, the night air is not, and a taiko practice two streets over keeps dropping in and out of the wind.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: a wordless, edge-to-edge, straight-down view into the scooping tub, filled corner to corner with a living school of about sixty goldfish (orange wakin, red-and-white, a few calico, a few fat black bug-eyes) that wheel, scatter, regroup and nose the surface in endlessly new patterns. The water is a live ripple surface: every touch spreads real rings that bend the fish beneath them, catch the bulb reflections, and bounce off the tub walls. The visitor only plays with the water. Dragging trails a fingertip and the school parts around it, tapping sprinkles a pinch of food that sets off a gold scramble, and holding down lowers a translucent paper scoop that the fish dart away from or, sometimes, swim right over. Nothing is ever caught, and nothing is scored.">
  <meta name="outbox-spec-subject" content="The sheer bright, flickering, crowded joy of a tub full of goldfish seen by a child leaning too far over the edge. It is the way sixty fish make one shape and then sixty shapes, and the way orange looks hotter under a bare bulb. It is the flash of a red tail turning, the bulb's reflection breaking into a hundred wobbling coins when the water is touched, and a lantern's swing passing slowly across the whole tub as a warm smear of light. Fallen festival things drift on the surface: a cherry-red paper scoop with a hole torn through it, a single floating candy wrapper, and a ripple-bent reflection of strings of lanterns overhead. It is pure spectacle, with a few hundred fins and no story.">
  <meta name="outbox-spec-tone" content="Wordless and FESTIVE-GIDDY. The register lives in motion and sound. Fish dart a little too fast and turn a little too sharply, so the whole school feels like a crowd of children let loose. Ripples are splashy and generous. Every pinch of food sets off a happy frenzy, and every scoop lowered causes a squeal of scattering fins. The light is warm, bulb-hot and slightly overexposed, as if seen through excited eyes. It should feel like being seven years old with a coin in your fist and the whole festival roaring behind you. It is bright, busy, delighted and playful, and it is never calm.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Goldfish vermilion-orange (#f25c1f) for every fish body, fin edge and the torn paper scoop, on galvanised tub sky-blue (#7fc4dc). The tub's painted blue goes deeper and greener at the bottom corners where water is thickest (#4a9ab6), and is scratched to bare silver zinc (#c9cfcf) along the rim where hands rest. Fish whites and calico patches are simply the blue showing through translucent fins, and black bug-eyes are the vermilion pushed nearly to char (#2a120a). Bulb reflections and lantern smears are a warm overexposed cream-gold (#ffe9b0) that is allowed to bloom where they hit the water. No other hues.">
  <meta name="outbox-spec-wildcard" content="One fat black bug-eyed goldfish never joins the school and never chases food. It cruises its own slow lap along the tub wall, round and round, and the rest of the school flows around it like water around a stone. Once every few minutes, at a random moment, it swims straight into the middle of the tub, stops dead under the brightest bulb reflection, and puffs a single bubble that rises and pops with a tiny high 'plink'. Every fish in the tub scatters at once, then regroups. It is never explained.">
