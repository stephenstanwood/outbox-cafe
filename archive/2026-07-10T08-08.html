<style>
  html,body{margin:0;height:100%;background:#2f2113;overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;

  #board{position:fixed;inset:0;display:block;cursor:crosshair;}
  .overlay{position:fixed;pointer-events:none;z-index:5;}
  /* Junie's chatter */
  #chatter{top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:10px 14px;}
  #chatter b{
    display:inline-block;max-width:640px;
    background:rgba(165,50,43,.92);color:#fff3df;

    letter-spacing:.2px;transform:rotate(-1deg);}
  #tip{display:block;margin-top:6px;font-size:clamp(11px,2.6vw,13px);
    color:#f2e3c0;font-style:italic;opacity:.85;text-shadow:0 1px 3px #000;}
  /* score strip */

  #score .you{color:#7a4a20;} #score .jun{color:#a5322b;}

<body>
<canvas id="board"></canvas>

<div class="overlay" id="chatter"><b id="say">you're up! drag <u>back</u> off your disc and let 'er RIP.</b><span id="tip">aim at the GAP between two pegs — it doesn't curve, so don't try.</span></div>
<div class="overlay" id="score"><span class="pill"><span class="you">YOU <span id="ys">0</span></span><span class="jun">JUNIE <span id="js">0</span></span><span class="lil">20·15·10·5</span></span></div>
<div class="overlay" id="foot"><a href="/archive">the rest of the games in the cabinet →</a></div>

<script>
"use strict";
/* Junie is eleven and undefeated. she means it. */
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const sayEl=document.getElementById('say'),tipEl=document.getElementById('tip');
const ysEl=document.getElementById('ys'),jsEl=document.getElementById('js');

// ---- geometry (normalised, playR = 1) ----
const rd=0.078, rp=0.026, R15=0.35, R10=0.63, R5=1.0, RHOLE=0.10;
const PEGS=[]; for(let k=0;k<8;k++){const a=(k*45+22.5)*Math.PI/180;PEGS.push({x:R15*Math.cos(a),y:R15*Math.sin(a)});}
// ---- physics ----
const MAXV=0.115, FR_PLAY=0.935, FR_DITCH=0.80, STOP=0.0016, SUBS=9, MAXDRAG=0.5;
const COL={board1:'#efc775',board2:'#dfae5a',rim:'#b5872f',ditch:'#7a5416',
  line:'#a5322b',peg:'#2b2620',cream:'#f2e3c0',walnut:'#5e3a1e'};

let W,H,CX,CY,S; // S = playR in px
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2;CY=H/2;S=Math.min(W,H)*0.42;
}
addEventListener('resize',resize);resize();
const toX=n=>CX+n*S, toY=n=>CY+n*S;

// ---- twenties tally (persist, count-up only) ----
let twenties=0;
try{twenties=parseInt(localStorage.getItem('crok_twenties'))||0;}catch(e){}
function bumpTwenties(){twenties++;try{localStorage.setItem('crok_twenties',twenties);}catch(e){}}

// ---- state ----
let discs=[];
let phase='YOU_AIM';            // YOU_AIM, SIM, JUNIE_AIM, DONE
let shooter=null;               // current your-disc awaiting fire
let dragging=false, ptr={x:0,y:0};
let shotsThisRound=0, simStart=0;
// shot tracking
let shotDisc=null, shotOwner=null, shotWentOff=false, preScores=[];

function mkDisc(nx,ny,owner){return {x:nx,y:ny,vx:0,vy:0,owner,seated:false,isShot:false,minDist:Infinity};}
function dist(d){return Math.hypot(d.x,d.y);}
function speed(d){return Math.hypot(d.vx,d.vy);}
function scoreOf(d){ if(d.off)return 0; if(d.seated)return 20;
  const r=dist(d); if(r<=R15)return 15; if(r<=R10)return 10; if(r<=R5)return 5; return 0;}

function newRound(){discs=[]; // one walnut already parked in the ditch from the last shot
  const a=-0.7*Math.PI; const p=mkDisc(1.05*Math.cos(a),1.05*Math.sin(a),'junie');discs.push(p);
  shotsThisRound=0; newPlayerShot();}
function newPlayerShot(){
  const x=(Math.random()*0.34-0.17);
  shooter=mkDisc(x,0.72,'you'); discs.push(shooter); phase='YOU_AIM';
}

// ---- audio (tiny, guarded) ----
let AC=null;
function actx(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}} return AC;}
function blip(freq,dur,type,vol){const c=actx();if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=freq;
  g.gain.value=vol||0.05;o.connect(g);g.connect(c.destination);o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);o.stop(c.currentTime+dur);}catch(e){}}
function rattle(){blip(720,0.05,'square',0.06);setTimeout(()=>blip(520,0.06,'square',0.05),40);setTimeout(()=>blip(300,0.09,'sine',0.05),90);}

// ---- input ----
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left-CX)/S,y:(t.clientY-r.top-CY)/S};}
cv.addEventListener('pointerdown',e=>{ actx();
  if(phase!=='YOU_AIM'||!shooter)return;
  const p=pos(e);const dd=Math.hypot(p.x-shooter.x,p.y-shooter.y);
  if(dd<0.30){dragging=true;ptr=p;}
});
cv.addEventListener('pointermove',e=>{ if(dragging){ptr=pos(e);} });
function release(){
  if(!dragging||!shooter)return; dragging=false;
  const dx=shooter.x-ptr.x, dy=shooter.y-ptr.y, dl=Math.hypot(dx,dy);
  if(dl<0.035)return; // too small — keep aiming
  const pw=Math.min(dl/MAXDRAG,1); const v=pw*MAXV;
  shooter.vx=dx/dl*v; shooter.vy=dy/dl*v;
  fireBookkeeping(shooter);
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',()=>{dragging=false;});

function fireBookkeeping(d){
  shotDisc=d; shotOwner=d.owner; d.isShot=true; d.minDist=Infinity; shotWentOff=false;
  preScores=discs.filter(x=>x!==d).map(x=>({d:x,s:scoreOf(x)}));
  shotsThisRound++; phase='SIM'; simStart=performance.now();
}

// ---- Junie's turn ----
function junieTurn(){
  phase='JUNIE_AIM'; setSay(pick(["my turn! watch this.","okay okay MY go now.","betcha can't do THIS.","stand back."]),'');
  setTimeout(()=>{
    const jd=mkDisc((Math.random()*0.3-0.15),-0.70,'junie'); discs.push(jd);
    // pick a target: sometimes knock a cream disc near centre, else go for the middle
    const targets=discs.filter(x=>x.owner==='you'&&!x.seated&&dist(x)<R10);
    let tx=0,ty=0,pw;
    if(targets.length&&Math.random()<0.5){const t=targets[Math.floor(Math.random()*targets.length)];tx=t.x;ty=t.y;pw=0.078+Math.random()*0.03;}
    else {tx=(Math.random()*0.16-0.08);ty=(Math.random()*0.16-0.08);pw=0.058+Math.random()*0.028;}
    let ang=Math.atan2(ty-jd.y,tx-jd.x)+ (Math.random()*0.14-0.07);
    jd.vx=Math.cos(ang)*pw; jd.vy=Math.sin(ang)*pw;
    fireBookkeeping(jd);
  },780);
}

// ---- physics step ----
function active(d){return !d.seated && !d.off;}
function step(){
  const A=discs.filter(active);
  for(const d of A){ const f=(dist(d)>1.0)?FR_DITCH:FR_PLAY; d.vx*=f; d.vy*=f; }
  for(let s=0;s<SUBS;s++){
    for(const d of A){ d.x+=d.vx/SUBS; d.y+=d.vy/SUBS;
      if(d.isShot){const r=dist(d); if(r<d.minDist)d.minDist=r;}
      // pegs
      for(const pg of PEGS){const ddx=d.x-pg.x,ddy=d.y-pg.y,ln=Math.hypot(ddx,ddy),mn=rd+rp;
        if(ln<mn&&ln>0){const nx=ddx/ln,ny=ddy/ln;d.x=pg.x+nx*mn;d.y=pg.y+ny*mn;
          const vn=d.vx*nx+d.vy*ny; if(vn<0){d.vx-=1.72*vn*nx;d.vy-=1.72*vn*ny; if(-vn>0.02)blip(760,0.03,'square',0.045);}}}
    }
    // disc-disc
    for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
      const a=A[i],b=A[j],ddx=a.x-b.x,ddy=a.y-b.y,ln=Math.hypot(ddx,ddy),mn=2*rd;
      if(ln<mn&&ln>0){const nx=ddx/ln,ny=ddy/ln,ov=(mn-ln)/2;
        a.x+=nx*ov;a.y+=ny*ov;b.x-=nx*ov;b.y-=ny*ov;
        const rvx=a.vx-b.vx,rvy=a.vy-b.vy,vn=rvx*nx+rvy*ny;
        if(vn<0){const imp=-0.96*vn/2;a.vx+=imp*nx;a.vy+=imp*ny;b.vx-=imp*nx;b.vy-=imp*ny;
          if(-vn>0.02)blip(200,0.05,'sine',0.05);}}
    }
    // seat in 20-hole & fly-off
    for(const d of A){ const r=dist(d);
      if(!d.seated && r<0.045 && speed(d)<0.03){d.seated=true;d.x=0;d.y=0;d.vx=d.vy=0;bumpTwenties();rattle();}
      if(r>1.15){d.off=true; if(d.isShot)shotWentOff=true;}
    }
  }
  discs=discs.filter(d=>!d.off);
  // rest?
  const stillMoving=discs.some(d=>active(d)&&speed(d)>STOP);
  const timedOut=performance.now()-simStart>7000;
  if(!stillMoving||timedOut){
    for(const d of discs)if(active(d)){
      if(dist(d)>1.0&&dist(d)<1.13){const r=1.05,a=Math.atan2(d.y,d.x);d.x=r*Math.cos(a);d.y=r*Math.sin(a);}
      d.vx=d.vy=0;
    }
    onRest();
  }
}

// ---- resolution / chatter ----
function tallies(){
  let y=0,j=0; for(const d of discs){const sc=scoreOf(d); if(d.owner==='you')y+=sc; else j+=sc;}
  ysEl.textContent=y; jsEl.textContent=j;
}
function onRest(){
  phase='DONE'; tallies();
  const fr=shotDisc?scoreOf(shotDisc):0, thr=shotDisc?shotDisc.minDist<0.42:false;
  let knocked=false;
  for(const p of preScores){ if(!discs.includes(p.d)){if(p.d.owner!==shotOwner&&p.s>0)knocked=true;}
    else if(p.d.owner!==shotOwner&&p.s>0&&scoreOf(p.d)===0)knocked=true; }
  const sunk = shotDisc&&shotDisc.seated;
  let line,tip='';
  if(shotOwner==='you'){
    if(sunk){line=pick(["TWENTYYY!! NO WAY. no WAY you sunk that!","OHHH you got the twenty?! okay that's actually insane.","a TWENTY. straight down the middle. ...ugh, do it again i dare you."]);}
    else if(shotWentOff){line=pick(["OFF THE TABLE! that's a big fat zero. everybody does it, my dad STILL does that.","whoop — GONE. off the board. zero points, don't even worry about it.","too hard! it rocketed a peg and flew right off. hilarious. zero."]);}
    else if(knocked){line=pick(["HEY you knocked me into the ditch?! RUDE. ...okay great shot though.","oooh you caromed me clean off! fine. FINE. that was good.","byebye my disc, straight to the ditch. lucky. that was lucky."]);}
    else if(thr&&fr===15){line=pick(["ohh right through the middle for a FIFTEEN. okay okay you're actually kind of good.","threaded it clean and parked a fifteen. see? through the gap, not around it!","fifteen! you cut right past the pegs. now go GREEDY next time."]);}
    else if(thr){line=pick(["you threaded the gap! that's how you do it. now put it deeper.","OHH straight through and it's a "+(fr)+". almost, almost.","clean through the pegs for a "+fr+". so close to the middle i can taste it."]);}
    else if(fr===0){line=pick(["into the ditch, zero. no biggie — watch the GAP next time.","dribbled off into the gutter. zero. go a smidge harder, aim the lane.","ditch! zero points. you gotta thread it, don't just chuck it."]);}
    else if(fr===5){line=pick(["a five, safe and boring. i'd have gone for the middle, but okay.","five points. hugging the outside. scaredy. aim deeper!","that's a five. fine. my turn."]);}
    else {line=pick(["a solid ten! not bad, not bad at all.","ten points, threading it a little. getting warmer!","ten! okay you're figuring out the gap. my go."]);}
    if(Math.random()<0.5)tip=pick(["it doesn't curve — pick a gap between two pegs and aim dead at it.","too soft and you dribble short into the fifteen; too hard and you fly off. find the touch.","the twenty's right there, dead centre. don't chicken out.","pull straight back off the disc for max power. straight, not sideways.","knock MY discs into the ditch — that's worth double the fun."]);
  } else {
    if(sunk){line=pick(["TWENTY! that's how it's DONE. told you i'd win.","boom, straight down the hole. twenty for meee.","did you SEE that? twenty. i'm undefeated for a reason."]);}
    else if(knocked){line=pick(["byebye! into the ditch you go. you're welcome.","knocked yours clean off, ha! this is my board.","see ya! straight to the gutter. it's fine, everybody does that."]);}
    else if(sunk===false&&scoreOf(shotDisc)===15){line=pick(["fifteen, easy. your turn, good luck.","parked a fifteen right in tight. beat that.","fifteen. i barely tried. go."]);}
    else if(scoreOf(shotDisc)===0){line="okay that one didn't count for me, whatever. YOUR go.";}
    else {line=pick(["that'll do. your turn!","points for me. keep up!","alright, go — show me the gap trick."]);}
  }
  setSay(line,tip);
  if(shotsThisRound>=8){
    setTimeout(()=>{ setSay(pick(["round's mine, OBVIOUSLY. rack 'em, go again!","that round's to me. new board, fresh discs — go!","i win the round, big shock. reset! your shoot."]),''); newRound(); },1600);
  } else if(shotOwner==='you'){ setTimeout(junieTurn,1000); }
  else { setTimeout(()=>{ newPlayerShot(); setSay(pick(["your shoot! thread it.","go on, aim the gap!","you're up — greedy this time!"]),''); },800); }
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function setSay(l,t){sayEl.innerHTML=l; if(t){tipEl.textContent=t;tipEl.style.display='block';}else{tipEl.style.display='none';}}

// ---- drawing ----
function drawBoard(){
  ctx.clearRect(0,0,W,H);
  // table
  ctx.fillStyle='#2f2113';ctx.fillRect(0,0,W,H);
  const outer=S*1.12;
  // board rim / ditch
  let g=ctx.createRadialGradient(CX-outer*0.3,CY-outer*0.3,outer*0.1,CX,CY,outer);
  g.addColorStop(0,'#c69a48');g.addColorStop(1,COL.rim);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,outer,0,7);ctx.fill();
  // ditch groove
  ctx.lineWidth=S*0.095;ctx.strokeStyle=COL.ditch;
  ctx.beginPath();ctx.arc(CX,CY,S*1.05,0,7);ctx.stroke();
  ctx.lineWidth=S*0.02;ctx.strokeStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();ctx.arc(CX,CY,S*1.005,0,7);ctx.stroke();
  // play surface + overhead gloss
  g=ctx.createRadialGradient(CX-S*0.4,CY-S*0.45,S*0.05,CX,CY,S*1.05);
  g.addColorStop(0,'#f0cf82');g.addColorStop(0.55,COL.board2);g.addColorStop(1,'#c99a44');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,S,0,7);ctx.fill();
  // faint wood grain
  ctx.strokeStyle='rgba(120,80,25,0.10)';ctx.lineWidth=1;
  for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(CX+ (i-4)*S*0.02,CY,S*(0.2+i*0.09),0,7);ctx.stroke();}
  // ring lines
  ctx.strokeStyle=COL.line;
  ctx.lineWidth=S*0.012;ctx.beginPath();ctx.arc(CX,CY,S*R5,0,7);ctx.stroke();
  ctx.lineWidth=S*0.010;ctx.beginPath();ctx.arc(CX,CY,S*R10,0,7);ctx.stroke();
  ctx.lineWidth=S*0.010;ctx.beginPath();ctx.arc(CX,CY,S*R15,0,7);ctx.stroke();
  // shooting arc hint (bottom quarter line)
  ctx.strokeStyle='rgba(165,50,43,0.35)';ctx.lineWidth=S*0.006;
  ctx.beginPath();ctx.arc(CX,CY,S*0.80,0.20*Math.PI,0.80*Math.PI);ctx.stroke();
  // sunken 20-hole
  const hg=ctx.createRadialGradient(CX,CY-S*0.02,S*0.01,CX,CY,S*RHOLE);
  hg.addColorStop(0,'#4a3212');hg.addColorStop(0.7,'#5e3f18');hg.addColorStop(1,'#3a2810');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(CX,CY,S*RHOLE,0,7);ctx.fill();
  ctx.strokeStyle=COL.line;ctx.lineWidth=S*0.011;ctx.beginPath();ctx.arc(CX,CY,S*RHOLE,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=S*0.02;ctx.beginPath();ctx.arc(CX,CY,S*RHOLE*0.9,0,7);ctx.stroke();
  // edge burn text
  ctx.save();ctx.translate(CX,toY(1.05));ctx.fillStyle='#4a3410';
  ctx.font='700 '+Math.max(9,S*0.032)+'px "Trebuchet MS",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.75;ctx.fillText('TWENTIES SUNK ON THIS BOARD: '+twenties,0,0);ctx.restore();
}
function drawDisc(d){
  const x=toX(d.x),y=toY(d.y),r=S*rd;
  if(d.seated){ // sunk — a little lower, in shadow
    ctx.save();ctx.globalAlpha=0.9;
  }
  ctx.beginPath();ctx.fillStyle='rgba(0,0,0,0.28)';ctx.ellipse(x,y+r*0.28,r,r*0.9,0,0,7);ctx.fill();
  const base=d.owner==='you'?COL.cream:COL.walnut;
  const lg=ctx.createRadialGradient(x-r*0.4,y-r*0.45,r*0.1,x,y,r);
  lg.addColorStop(0,d.owner==='you'?'#fff6e3':'#8a5a30');
  lg.addColorStop(1,base);
  ctx.fillStyle=lg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=r*0.14;ctx.beginPath();ctx.arc(x,y,r*0.92,0,7);ctx.stroke();
  ctx.fillStyle=d.owner==='you'?'rgba(255,255,255,0.5)':'rgba(255,220,180,0.25)';
  ctx.beginPath();ctx.ellipse(x-r*0.32,y-r*0.34,r*0.28,r*0.18,-0.6,0,7);ctx.fill();
  if(d.seated)ctx.restore();
}
function drawPeg(pg){
  const x=toX(pg.x),y=toY(pg.y),r=S*rp;
  ctx.beginPath();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.ellipse(x,y+r*0.4,r*1.05,r*0.85,0,0,7);ctx.fill();
  const pgg=ctx.createRadialGradient(x-r*0.4,y-r*0.5,r*0.1,x,y,r*1.2);
  pgg.addColorStop(0,'#4a4238');pgg.addColorStop(1,COL.peg);
  ctx.fillStyle=pgg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle='rgba(200,200,190,0.35)';ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.32,r*0.28,0,7);ctx.fill();
}
function drawAim(){
  if(!(phase==='YOU_AIM'&&shooter))return;
  const sx=toX(shooter.x),sy=toY(shooter.y);
  // pulsing ready ring
  const pulse=0.5+0.5*Math.sin(performance.now()/300);
  ctx.strokeStyle='rgba(165,50,43,'+(0.3+0.4*pulse)+')';ctx.lineWidth=S*0.012;
  ctx.beginPath();ctx.arc(sx,sy,S*rd*(1.4+0.15*pulse),0,7);ctx.stroke();
  if(!dragging)return;
  const px=toX(ptr.x),py=toY(ptr.y);
  const dx=shooter.x-ptr.x,dy=shooter.y-ptr.y,dl=Math.hypot(dx,dy);
  const pw=Math.min(dl/MAXDRAG,1);
  // rubber band back
  ctx.strokeStyle='rgba(94,58,30,0.85)';ctx.lineWidth=S*0.02;ctx.setLineDash([S*0.03,S*0.02]);
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(94,58,30,0.7)';ctx.beginPath();ctx.arc(px,py,S*0.02,0,7);ctx.fill();
  // forward power arrow
  if(dl>0.01){const ux=dx/dl,uy=dy/dl,len=S*(0.12+pw*0.55);
    const cr=Math.floor(120+pw*135),cg=Math.floor(120-pw*70);
    ctx.strokeStyle='rgb('+cr+','+cg+',43)';ctx.lineWidth=S*0.018;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+ux*len,sy+uy*len);ctx.stroke();
    const hx=sx+ux*len,hy=sy+uy*len,a=Math.atan2(uy,ux);
    ctx.beginPath();ctx.moveTo(hx,hy);
    ctx.lineTo(hx-S*0.05*Math.cos(a-0.4),hy-S*0.05*Math.sin(a-0.4));
    ctx.lineTo(hx-S*0.05*Math.cos(a+0.4),hy-S*0.05*Math.sin(a+0.4));
    ctx.closePath();ctx.fill();
  }
}
function frame(){
  if(phase==='SIM')step();
  drawBoard();
  for(const d of discs)if(!d.seated)drawDisc(d);
  for(const pg of PEGS)drawPeg(pg);
  for(const d of discs)if(d.seated)drawDisc(d);
  drawAim();
  requestAnimationFrame(frame);
}
newRound();tallies();frame();
/* one lane runs straight up the board from your line — the pegs leave a gap
   pointing dead at the twenty. that's the shot. junie already knows. */
console.log("%cthrough the gap. it doesn't curve. — Junie, 11, undefeated","color:#a5322b;font-weight:bold");
</script>
