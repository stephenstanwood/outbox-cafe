  <meta name="outbox-spec-era" content="Easter Monday, April 1988, about five past two in the afternoon, at a spin-art stall halfway down Sideshow Alley at the Royal Easter Show at the Moore Park showground in Sydney. The stall is a plywood booth painted electric blue. A hand-lettered sign promises A MASTERPIECE IN 10 SECONDS, $2. There is a waist-high plastic drum with a turntable motor inside it, a rack of squeeze bottles of fluoro poster paint and a pegboard behind the counter clipped with drying cards. A queue of kids clutching showbags and dagwood dogs is waiting to have a go. The showie running it is wearing a paint-spattered apron and keeps the motor going flat out. The Ferris wheel's generator is thudding behind the booth, a spruiker next door is yelling about the laughing clowns, and a hot westerly keeps flipping the drying cards on their clips.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: a wordless, edge-to-edge view straight down into the spin-art drum, onto a square of white card whirling on the turntable. The visitor squirts paint by pressing and holding anywhere over the card, and the paint flings outward in curving, feathering spiral arms, pooling, splitting and spattering up the drum wall. When the visitor flicks the motor off, the card spins down, lifts out with a flap, and is clipped onto a pegboard strip along the top edge that fills up over the session, while a fresh blank card drops onto the turntable.">
  <meta name="outbox-spec-subject" content="The loud, messy, instant glory of a $2 spin-art card at a show: a paint blob hitting a spinning surface and becoming a comet, a pinwheel, a sea-urchin or a mud-brown disaster in under a second. It covers the way the first squirt near the centre makes a fat star and a squirt near the edge makes a skinny whip. It covers what happens when two colours cross and go to a third, the drips that climb the drum wall and rain back down in specks, and the moment the card stops and you see what you actually made. Every card is different, nearly every card is a bit too much, and the kids love the too-much ones best.">
  <meta name="outbox-spec-tone" content="Wordless and SPLATTY-GIDDY. There is no narrator, no caption and no written sentence anywhere. The register lives in the fling and the noise, and it is generous, gaudy and slightly out of control. Paint flies a touch too far, the motor revs a touch too high, and splatter hits the drum wall with a satisfying spit. The crowd audio gasps and cheers whenever a big arm of colour whips out. It should feel like being eight, sticky with fairy floss, sunburnt on the back of the neck, with your two dollars spent and your hands about to be covered in orange. It is bright, noisy and delighted, and it is never calm.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Fluoro poster-paint flame orange (#ff4a12) and fluoro poster-paint electric magenta-pink (#ff1f8e), the two bottles left on the rack after a long morning, on bright white card stock (#fbfaf6) with a faint cardboard tooth. Where the two paints cross wet, they mix into a real hot coral-red, and where they are laid thick on each other they go to a deep muddy brick (#7a1f18). The drum wall and the shadow at the card's edge are the magenta pushed nearly to plum-black (#2a0716). The pegboard strip along the top is the white card pegged on the same plum-black. No other hues.">
  <meta name="outbox-spec-wildcard" content="Somewhere in every session, a fat bush fly lands on the wet card and stays there. If the visitor squirts paint while it is on the card, it takes off and buzzes a little tiny-footprinted trail of colour across the paint, round and round, before flying off out of the drum. That card's flight-path is the one the crowd cheers loudest at. Once per session, a dagwood-dog sauce splat (rendered as a darker brick blob) lands on the card from somewhere above the frame. Nothing ever explains either.">
