  <meta name="outbox-spec-era" content="Present-tense, right now — a hand-cranked cylinder music box fresh off the bench in a little Erzgebirge (Ore Mountains) wood-toy workshop, the brass barrel just re-pinned this week and clamped in its honey fruitwood case under the work-lamp, the tuned steel comb wiped clean and the crank-handle newly waxed for its first proper wind. Not a dusty heirloom under glass and not a 'nobody makes these anymore' lament — a working box getting its shakedown crank THIS afternoon, the whole tune sitting there bent into the pins, waiting to be turned out.">
  <meta name="outbox-spec-format" content="A genuinely playable hand-crank cylinder music box filling the whole viewport, seen from above: the brass pinned barrel lying along its axis, the graduated steel comb ranked alongside it (long low teeth at one end, short high teeth at the other), and a crank handle standing up at the near end. You actually turn it — click-drag the handle round in circles (or hold LEFT/RIGHT arrows) and the barrel rotates at exactly your speed, each brass pin plucking its comb-tooth as it sweeps under, so the tune plays out at whatever tempo you crank, stalls dead when you stop, and un-spells itself if you wind the other way. No browser chrome, no header, no menu — just the open box, the barrel, the comb, and the crank under your hand.">
  <meta name="outbox-spec-subject" content="The actual little tune pinned onto this one barrel and the plain honest mechanics of how it's made — how every brass pin, set at its exact spot around the drum, catches the tip of one graduated steel tooth and springs it into a ring; how the long fat teeth toll low and slow and the stubby ones ping high and quick; how pins set close together throw a near-simultaneous plink that lands as a chord; how cranking fast just races the same tune and cranking backward unpicks it note by note into cheerful nonsense. Not a metaphor for memory or time or childhood — literally bent brass pins in the right places on a spinning drum, and the tune that has no choice but to fall out of them.">
  <meta name="outbox-spec-tone" content="The bright, chuffed, fast-talking voice of the young apprentice who pinned this barrel herself and cannot wait for you to grab the crank — showing off which fat tooth booms the low note, egging you to wind slow so you can hear each pin catch ('go SLOW, slow, there — hear that? that's one pin, one tooth, that's IT!'), giddy when the tune comes out clean, and delighted rather than embarrassed when you crank it backward into gibberish ('ha — no, keep going, it sounds brilliant wrong!'). Warm, exclamation-happy, present-tense, peer-to-peer — never wistful, never precious, never a life-lesson; it's her tune on the drum and she wants to hear you turn it out.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Polished barrel-brass gold (#c69a3c) and cold tuned-steel comb silver (#cdd2d6) seated in a warm honey-fruitwood case (#9a6528), all on a deeper walnut workbench shadow (#3a2416), with each plucked tooth flashing a pale near-white highlight (#f4efdf) the instant it rings and a chip of waxed-crank amber (#e0a531) at the handle — the warm, hard-lit look of a freshly-waxed music box open on the bench under a workshop lamp.">
  <meta name="outbox-spec-wildcard" content="Exactly one pin on the barrel is bent a hair out of true — set a touch late and leaning, so once every full turn its note comes out flat and a beat behind, a small sour plink dropped into the middle of the tune. It is never labelled, never pointed at, never mentioned in the apprentice's chatter, never fixed; it's simply there in how that one spot on the drum always sounds, coming round again and again for whoever cranks long enough to catch the same wrong note every lap.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'the old music boxes are all silent now / a dying craft / nobody makes these anymore' decline narrative — this is a working box getting its shakedown crank THIS afternoon, the wax still fresh on the handle. NO music-box-as-metaphor-for-memory / lost-childhood / the-turning-of-time / a-tune-that-outlives-us life-lesson framing — it is bent brass pins on a spinning drum plucking steel teeth, nothing more, and it has nothing to teach you. NO archival / museum / cabinet / drawer / vault / estate-sale / heirloom-under-glass framing of the box. NO cryptic-SCP / ominous / 'the tune should not play' / haunted-melody dread about the barrel or the one bent pin. NO dry deadpan understatement — the apprentice is loud, fast, and chuffed. NO mellow seasoned-craftsperson-at-your-elbow coaching voice (no 'now then,' no lifelong-tinkerer wisdom) — she's a giddy young apprentice showing off her own work, peer to peer. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO signal / transmission / frequency / broadcast / relay framing of anything. NO society / club / guild / cabinet-of-hobbyists scaffolding — it's one box on one bench, not a club to join.">

<title>Barrel No. 7 — Wind It Out</title>
<!-- honey case, still tacky with fresh wax. comb wiped clean this morning. one pin leans a little. don't tell her, she knows. -->
<style>
  html,body{margin:0;height:100%;background:#3a2416;overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;color:#f4efdf;}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    filter:blur(9px) brightness(.42) saturate(.8);opacity:.55;z-index:0;pointer-events:none;}
  #c{position:fixed;inset:0;z-index:1;touch-action:none;display:block;}
  #foot{position:fixed;bottom:8px;right:12px;z-index:3;font-size:12px;
    font-style:italic;color:#c69a3c;opacity:.8;}
  #foot a{color:#e0a531;text-decoration:none;border-bottom:1px dotted #c69a3c;}
  #foot a:hover{color:#f4efdf;}
</style>

<body>
<img id="bg" src="https://v3b.fal.media/files/b/0aa27903/kFcf7CWsIozjT69pxl2AM.jpg"
  alt="a honey-fruitwood music box open on the workbench under the lamp; the brass barrel just re-pinned this week" loading="lazy">
<canvas id="c"></canvas>
<div id="foot"><a href="/archive">more off the bench &raquo;</a></div>
<script>
(function(){
"use strict";
var TWO_PI=Math.PI*2;
var W=1000,H=640;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var cw,ch,scale=1,ox=0,oy=0;

// ---- geometry ----
var barrelLeft=110,barrelRight=770,nTeeth=15;
var step=(barrelRight-barrelLeft)/nTeeth, tw=step*0.55;
var yTop=180,yContact=330,bandH=yContact-yTop;
var lenMax=192,lenMin=64;
var cx=852,cy=(yTop+yContact)/2,armR=64;
function toothX(i){return barrelLeft+step*(i+0.5);}
function toothLen(i){return lenMax-(lenMax-lenMin)*(i/(nTeeth-1));}

// ---- comb pitches (long low left → short high right) ----
var comb=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25,
          587.33,659.25,698.46,783.99,880.00,987.77,1046.50];
var teeth=[];for(var i=0;i<nTeeth;i++)teeth.push({flash:0});

// ---- the tune, pinned around the barrel (32 beats = one turn) ----
var beatsPerRev=32;
var notes=[
  {b:0,t:7},{b:0,t:4},{b:0,t:0},
  {b:3,t:9},
  {b:6,t:11},
  {b:8,t:9},{b:8,t:7},
  {b:11,t:12},
  {b:14,t:11},
  {b:16,t:7},{b:16,t:2},{b:16,t:0},
  {b:19,t:9},
  {b:22,t:10,bent:true},   /* leans a hair — comes round flat and a beat behind */
  {b:24,t:8},{b:24,t:5},
  {b:27,t:9},
  {b:30,t:7}
];
var pins=notes.map(function(n){
  var late=n.bent?0.55:0;
  return {tooth:n.t,bent:!!n.bent,phi:((n.b+late)/beatsPerRev)*TWO_PI};
});

// ---- state ----
var rotation=0, lastFrameRotation=0, crankSpin=0;
var keyDir=0, dragging=false, lastAngle=0;
var dispSpeed=0, lastDt=0.016;
var maxRev=0, turns=0;
try{turns=parseInt(localStorage.getItem('barrel7_turns')||'0',10)||0;}catch(e){}

// ---- audio ----
var ac=null,master=null;
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
  }catch(e){ac=null;}
}
function pluck(freq,lowness,vel){
  if(!ac)return;
  var t=ac.currentTime;
  var o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o2.type='sine';
  o.frequency.value=freq;o2.frequency.value=freq*2.01;
  var dur=0.35+lowness*1.7;
  var amp=Math.min(0.32,0.14+Math.min(vel,4)*0.045);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(amp,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  var g2=ac.createGain();g2.gain.value=0.35;o2.connect(g2);g2.connect(g);
  o.connect(g);g.connect(master);
  o.start(t);o2.start(t);o.stop(t+dur);o2.stop(t+dur);
}
function firePin(p,vel){
  var f=p.bent?comb[p.tooth]*0.94:comb[p.tooth];
  teeth[p.tooth].flash=1;
  pluck(f,1-p.tooth/(nTeeth-1),vel);
}
function detect(prev,cur){
  if(prev===cur)return;
  var vel=Math.min(4,Math.abs(dispSpeed));
  for(var i=0;i<pins.length;i++){
    var p=pins[i];
    var a=Math.floor((p.phi-prev)/TWO_PI);
    var b=Math.floor((p.phi-cur)/TWO_PI);
    if(a!==b){var n=Math.min(2,Math.abs(a-b));for(var k=0;k<n;k++)firePin(p,vel);}
  }
}

// ---- input ----
function toLogical(e){
  var r=cv.getBoundingClientRect();
  var px=(e.clientX-r.left-ox)/scale, py=(e.clientY-r.top-oy)/scale;
  return {x:px,y:py};
}
function angleAt(pt){return Math.atan2(pt.y-cy,pt.x-cx);}
cv.addEventListener('pointerdown',function(e){
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  var pt=toLogical(e);
  var dx=pt.x-cx,dy=pt.y-cy;
  if(dx*dx+dy*dy < 150*150){
    dragging=true;lastAngle=angleAt(pt);
    cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var pt=toLogical(e);var a=angleAt(pt);
  var d=a-lastAngle;
  while(d>Math.PI)d-=TWO_PI;while(d<-Math.PI)d+=TWO_PI;
  rotation+=d;crankSpin+=d;lastAngle=a;
});
function endDrag(e){if(dragging){dragging=false;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){keyDir=1;initAudio();if(ac&&ac.state==='suspended')ac.resume();e.preventDefault();}
  else if(e.key==='ArrowLeft'){keyDir=-1;initAudio();if(ac&&ac.state==='suspended')ac.resume();e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowRight'&&keyDir>0)keyDir=0;
  if(e.key==='ArrowLeft'&&keyDir<0)keyDir=0;
});

// ---- resize ----
function resize(){
  cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  scale=Math.min(cw/W,ch/H);
  ox=(cw-W*scale)/2;oy=(ch-H*scale)/2;
}
window.addEventListener('resize',resize);resize();

// ---- helpers ----
function rr(x,y,w,h,r){ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
}
function lerp(a,b,t){return a+(b-a)*t;}
function steelFlash(f){ // steel → near-white highlight
  return 'rgb('+Math.round(lerp(205,244,f))+','+Math.round(lerp(210,239,f))+','+Math.round(lerp(214,223,f))+')';
}

// ---- draw ----
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#3a2416';ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.translate(ox,oy);ctx.scale(scale,scale);

  // case
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;
  var wg=ctx.createLinearGradient(0,16,0,624);
  wg.addColorStop(0,'#a86e2c');wg.addColorStop(.5,'#9a6528');wg.addColorStop(1,'#7d4f1e');
  ctx.fillStyle=wg;rr(16,16,968,608,22);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(58,36,22,.7)';ctx.lineWidth=3;rr(16,16,968,608,22);ctx.stroke();
  // grain
  ctx.strokeStyle='rgba(58,36,22,.14)';ctx.lineWidth=2;
  for(var gi=0;gi<7;gi++){ctx.beginPath();var gy=70+gi*78;
    ctx.moveTo(30,gy);ctx.bezierCurveTo(300,gy-14,700,gy+16,970,gy-6);ctx.stroke();}

  // titles
  ctx.textAlign='center';
  ctx.fillStyle='#e8c876';ctx.font='700 30px "Trebuchet MS",sans-serif';
  ctx.fillText('Barrel No. 7 — Wind It Out',W/2,60);
  ctx.fillStyle='#f4efdf';ctx.font='italic 17px "Trebuchet MS",sans-serif';
  ctx.fillText('I pinned this one myself — grab the handle and give it a proper turn!',W/2,90);

  // barrel body (cylinder, curvature top→bottom)
  var bg=ctx.createLinearGradient(0,yTop,0,yContact);
  bg.addColorStop(0,'#8a6a20');bg.addColorStop(.42,'#e8c25c');
  bg.addColorStop(.5,'#f2d67e');bg.addColorStop(.62,'#c69a3c');bg.addColorStop(1,'#7d5a1a');
  ctx.fillStyle=bg;rr(barrelLeft,yTop,barrelRight-barrelLeft,bandH,10);ctx.fill();
  ctx.strokeStyle='rgba(58,36,22,.5)';ctx.lineWidth=2;rr(barrelLeft,yTop,barrelRight-barrelLeft,bandH,10);ctx.stroke();
  // faint rings
  ctx.strokeStyle='rgba(120,80,20,.25)';ctx.lineWidth=1;
  for(var ri=1;ri<nTeeth;ri++){var rx=barrelLeft+step*ri;ctx.beginPath();ctx.moveTo(rx,yTop+4);ctx.lineTo(rx,yContact-4);ctx.stroke();}

  // pins on the drum surface (scroll down toward the comb)
  for(var pi=0;pi<pins.length;pi++){
    var p=pins[pi];
    var rel=(((p.phi-rotation)%TWO_PI)+TWO_PI)%TWO_PI/TWO_PI;
    var py=yContact-rel*bandH;
    var px=toothX(p.tooth);
    var near=1-rel;                       // brighter/bigger toward front
    var rad=3.2+near*2.6;
    ctx.beginPath();ctx.arc(px,py,rad,0,TWO_PI);
    ctx.fillStyle='rgba('+Math.round(lerp(140,246,near))+','+Math.round(lerp(105,224,near))+','+Math.round(lerp(40,150,near))+',1)';
    ctx.fill();
    ctx.beginPath();ctx.arc(px-rad*0.3,py-rad*0.3,rad*0.4,0,TWO_PI);
    ctx.fillStyle='rgba(244,239,223,'+(0.35+near*0.4)+')';ctx.fill();
  }

  // contact line / comb base
  ctx.fillStyle='#b7bdc2';rr(barrelLeft-8,yContact-3,(barrelRight-barrelLeft)+16,16,4);ctx.fill();
  ctx.fillStyle='rgba(244,239,223,.5)';ctx.fillRect(barrelLeft-8,yContact-3,(barrelRight-barrelLeft)+16,2);

  // teeth (graduated) below, flexing + flashing when rung
  for(var ti=0;ti<nTeeth;ti++){
    var t=teeth[ti];var L=toothLen(ti);var xx=toothX(ti)-tw/2;
    var flex=t.flash*7;
    var ty=yContact+11;
    ctx.fillStyle=steelFlash(t.flash*0.9);
    rr(xx,ty,tw,L+flex,tw*0.4);ctx.fill();
    // tip highlight when ringing
    if(t.flash>0.02){
      ctx.fillStyle='rgba(244,239,223,'+t.flash+')';
      rr(xx,ty+L+flex-10,tw,10,4);ctx.fill();
    }
    // edge shade
    ctx.strokeStyle='rgba(58,36,22,.3)';ctx.lineWidth=1;rr(xx,ty,tw,L+flex,tw*0.4);ctx.stroke();
  }
  // labels by the teeth
  ctx.fillStyle='#e0a531';ctx.font='italic 14px "Trebuchet MS",sans-serif';
  ctx.textAlign='left';ctx.fillText('↑ this fat one BOOMS the low note',barrelLeft-4,yContact+lenMax+34);
  ctx.textAlign='right';ctx.fillText('the stubby ones PING high ↑',barrelRight+4,yContact+lenMin+34);

  // axle + crank
  ctx.strokeStyle='#8f7a55';ctx.lineWidth=10;ctx.beginPath();
  ctx.moveTo(barrelRight,cy);ctx.lineTo(cx-armR,cy);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,90,0,TWO_PI);
  ctx.fillStyle='rgba(205,210,214,.35)';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,20,0,TWO_PI);ctx.fillStyle='#8b9297';ctx.fill();
  var kx=cx+armR*Math.cos(rotation),ky=cy+armR*Math.sin(rotation);
  ctx.strokeStyle='#c69a3c';ctx.lineWidth=13;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(kx,ky);ctx.stroke();
  ctx.beginPath();ctx.arc(kx,ky,18,0,TWO_PI);ctx.fillStyle='#e0a531';ctx.fill();
  ctx.beginPath();ctx.arc(kx-5,ky-6,7,0,TWO_PI);ctx.fillStyle='rgba(244,239,223,.7)';ctx.fill();
  ctx.strokeStyle='rgba(58,36,22,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(kx,ky,18,0,TWO_PI);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#f4efdf';ctx.font='italic 13px "Trebuchet MS",sans-serif';
  ctx.fillText('wind SLOW — catch each pin',cx,cy+118);
  ctx.fillText('(or hold ← / →)',cx,cy+136);

  // live status line
  var msg,col='#f4efdf';
  var sp=dispSpeed;
  if(Math.abs(sp)<0.06){msg='…go on, grab the handle and give it a wind!';}
  else if(sp<0){msg='backwards?! ha — keep going, it sounds BRILLIANT wrong!';col='#e0a531';}
  else if(Math.abs(sp)<1.3){msg='slow… slow… there — that\'s ONE pin, one tooth, THAT\'S it!';col='#f2d67e';}
  else{msg='ha — off it races, same tune only faster!';col='#f2d67e';}
  ctx.fillStyle=col;ctx.font='italic 18px "Trebuchet MS",sans-serif';ctx.textAlign='center';
  ctx.fillText(msg,W/2,150);

  // tally lettered along the case
  ctx.fillStyle='#e8c876';ctx.font='700 15px "Trebuchet MS",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('TIMES THIS TUNE HAS BEEN TURNED OUT: '+turns,W/2,600);

  ctx.restore();
}

// ---- loop ----
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;if(dt<=0)dt=0.001;lastDt=dt;
  var prev=lastFrameRotation;
  if(keyDir){rotation+=keyDir*1.4*dt;crankSpin+=keyDir*1.4*dt;}
  var raw=(rotation-prev)/dt;
  dispSpeed+=(raw-dispSpeed)*Math.min(1,dt*12);
  detect(prev,rotation);
  // decay tooth flashes
  for(var i=0;i<nTeeth;i++){teeth[i].flash-=dt*4;if(teeth[i].flash<0)teeth[i].flash=0;}
  // count clean forward revolutions only, never down
  var nf=Math.floor(rotation/TWO_PI);
  if(nf>maxRev){turns+=(nf-maxRev);maxRev=nf;
    try{localStorage.setItem('barrel7_turns',String(turns));}catch(e){}}
  lastFrameRotation=rotation;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

console.log('%cBarrel No. 7','color:#c69a3c;font-size:16px;font-weight:bold');
console.log('%cthere\'s one pin at beat 22 that leans a touch — flat, and a hair behind. it comes round every lap. she left it.','color:#e0a531;font-style:italic');
})();
</script>
