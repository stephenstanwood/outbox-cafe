  <meta name="outbox-spec-era" content="1911, right now — the ten seconds after the shutter of a cheap tin-and-cardboard box camera is tripped in bright noon sun, seen from INSIDE the light-tight body: the plate has just been struck, the silver halide grains are taking it, and the developing that follows is happening this minute in a red-lit closet down the hall. Not a look-back at 'the dawn of amateur photography' and not a 'nobody makes plates anymore' lament — a live exposure genuinely burning in as you watch, the bellows still warm from the sun on the leather.">
  <meta name="outbox-spec-format" content="The entire viewport is one gelatin dry plate lying face-up under a lens, edge to edge — and the whole page is a genuinely functional silver-grain exposure and development simulator with no words, no chrome, no controls. The plate starts as blank creamy emulsion; a live field of tens of thousands of individual halide grains each accumulates real photon hits from a slowly wheeling projected light field overhead, and grains that cross their threshold flip to developed metallic silver, so a latent image genuinely resolves out of pure speckle in front of you — grainy first, then clumping, then coherent — and the image that emerges is a different soft abstract each load, drifting, over-exposing at the hot centre, thinning to bare creamy nothing at the corners. Move the cursor and you cast a real shadow across the plate that starves those grains; hold still and they take the light. The plate never finishes: as new grains develop, the oldest ones slowly bleach back to cream, so the whole surface ceaselessly resolves and dissolves and re-resolves in place.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical behaviour of silver grains under light — that a photograph is not a picture arriving but a great many independent little crystals each independently deciding they have had enough photons, that this is why an under-exposed area is not dark but SPARSE, why the hot centre of a frame blows out to solid nothing because every grain there has long since flipped and there is no more flipping to be done, why grain clumps unevenly rather than dusting smoothly, why a shadow cast during exposure doesn't erase anything but simply leaves those grains still undecided, and why the shape you see coming up is really just the statistical majority of a crowd. Not a metaphor for memory, for images arriving out of nothing, for how we come into focus, or for what develops slowly in a person — literally gelatin, silver bromide, photons, and a crowd of crystals each doing its own arithmetic.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind on the page. The register lives entirely in the behaviour of the grains, and that register is BUSY and FIDGETY and STATISTICAL — a crowded, twitchy, granular swarm, thousands of small independent decisions clattering along at once, clumping and thinning and never settling. Bright, hot, noon-lit, restless. Explicitly NOT hushed, NOT reverent, NOT slow-and-contemplative, NOT dreamlike, NOT melancholy — the plate is a crowd arguing, not a ghost appearing.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Developed metallic silver worked as a hard cool grey-black (#2b2f33) with a bright specular pewter edge (#a9b2b8) where clumps catch the light, standing on raw unexposed gelatin emulsion in warm creamy bone (#efe6cf); the hot over-exposed centre of the field burns through to a bare bleached highlight (#fdfaf0) and the starved corners go a thin greenish gelatin ivory (#ded4b6) — the hard, high-contrast, close-focus look of a wet plate under a bright bulb, no soft edges, no blur, all speckle and glint.">
  <meta name="outbox-spec-wildcard" content="The page must contain exactly one word, anywhere, ever: struck into the emulsion at the plate's lower edge, permanently developed and never bleaching, is a single ordinary word in a plain block hand — an entirely mundane domestic word (a grocery item, a household object, a plain first name), never a message, never addressed to the viewer. It is never explained, never repeated, never referred to, and the grain field simply develops and dissolves around it.">
  <meta name="outbox-spec-forbidden" content="NO photography-as-metaphor-for-memory / images-arriving-out-of-nothing / 'we develop slowly' / latent-image-of-the-self framing — it is gelatin, silver bromide, and photon arithmetic, nothing more, and it has nothing to teach you. NO melancholy / wistful / soft-nostalgia framing and NO 'the age of the plate is over / nobody coats their own emulsion anymore' decline narrative — this is a live exposure happening this minute in noon sun. NO ghostly / spectral / apparition / 'a face swims up out of the dark' register — the plate is a busy crowd of crystals, not a haunting. NO meditative-zen / mindfulness / 'let the slow resolving still you' register. NO cryptic-SCP / ominous dread about the single struck word — it's just a plain word in the emulsion edge, cheerful and unremarked. NO archival / museum / cabinet / drawer / vault / specimen-plate framing despite the literal plate — it is being exposed, not preserved. NO signal / transmission / frequency / image-as-message framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / darkroom-at-3am / dispatcher voice — it is bright hard noon on the other side of the lens. NO society / club / cabinet-of-hobbyists scaffolding. And beyond that one struck word, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is otherwise entirely silent and entirely visual.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Bromide Does Its Arithmetic at Noon</title>
<meta name="description" content="A live plate under a bright lens: tens of thousands of halide grains each counting their own photons.">
<!-- emulsion poured 11:20, chilled on the sill; the left corner runs thin because the tray sat tipped against the flour tin -->
<style>
  /* the corners are always slow — thinner coat, fewer crystals near enough to talk to */
  html,body{margin:0;padding:0;height:100%;background:#efe6cf;overflow:hidden;}
  body{cursor:none;}
  #plate{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;
  }
  /* bulb sheen on the glass side of the plate; purely optical, sits above the emulsion */
  #sheen{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 42% 30%, rgba(255,253,246,.20), rgba(255,253,246,0) 58%),
      radial-gradient(140% 120% at 78% 96%, rgba(120,112,86,.16), rgba(120,112,86,0) 55%);
    mix-blend-mode:normal;
  }
  #chip{
    position:fixed;right:0;bottom:0;width:26px;height:26px;
    background:linear-gradient(225deg, rgba(43,47,51,.72) 0 50%, rgba(43,47,51,0) 50%);
    display:block;text-indent:-9999px;overflow:hidden;
    opacity:.55;transition:opacity .5s ease;cursor:none;
  }
  #chip:hover,#chip:focus{opacity:1;outline:none;}
  @media (max-width:520px){ #chip{width:34px;height:34px;} }
</style>
</head>
<body>
<canvas id="plate"></canvas>
<div id="sheen"></div>
<a id="chip" href="/archive" aria-label="the other plates">the other plates</a>
<script>
(function(){
  "use strict";
  var cvs = document.getElementById('plate');
  var ctx = cvs.getContext('2d', {alpha:false});
  var WORD = "APRICOTS";

  // --- palette, packed little-endian ABGR -------------------------------
  function pk(r,g,b){ return (255<<24) | (b<<16) | (g<<8) | r; }
  var C_DARK   = pk(0x2b,0x2f,0x33);
  var C_PEWTER = pk(0xa9,0xb2,0xb8);
  var C_BURN   = pk(0xfd,0xfa,0xf0);
  var CREAM = [0xef,0xe6,0xcf], IVORY = [0xde,0xd4,0xb6];

  var CELL, gw, gh, N, COARSE = 4, cw, ch;
  var thr, expA, state, devT, life, sens, tint, base;
  var colIdx, colFrac, rowIdx, rowFrac, light, clump, clumpRaw;
  var img, buf, blobs = [], t = 0, frames = 0;
  var sx = -9, sy = -9, sStr = 0, sTarget = 0;
  var seed = (Date.now() & 0x7fffffff) || 12345;
  function rnd(){ seed ^= seed<<13; seed ^= seed>>>17; seed ^= seed<<5; return ((seed>>>0) % 100000) / 100000; }

  function build(){
    var W = window.innerWidth, H = window.innerHeight;
    CELL = (W < 560 || H < 520) ? 4 : 3;
    gw = Math.max(24, Math.ceil(W / CELL));
    gh = Math.max(24, Math.ceil(H / CELL));
    N = gw * gh;
    cvs.width = gw; cvs.height = gh;

    thr = new Float32Array(N); expA = new Float32Array(N); state = new Uint8Array(N);
    devT = new Float32Array(N); life = new Float32Array(N); sens = new Float32Array(N);
    tint = new Uint8Array(N);  base = new Uint32Array(N);

    var A = gw / gh;
    for (var gy = 0, i = 0; gy < gh; gy++){
      var uy = gy / gh;
      for (var gx = 0; gx < gw; gx++, i++){
        var ux = gx / gh;
        // grain threshold: mostly modest, with a long stubborn tail
        var r1 = rnd(), r2 = rnd();
        thr[i] = 0.75 + 2.1 * r1 * r1 + (r2 > 0.94 ? 2.6 * rnd() : 0);
        sens[i] = 0.55 + 1.05 * rnd();
        life[i] = 6.5 + 21 * rnd();
        tint[i] = (rnd() * 8) | 0;
        // coating thickness: thin and greenish toward the corners, brushed in streaks
        var dx = (ux - A * 0.5) / (A * 0.5), dy = (uy - 0.5) / 0.5;
        var v = Math.min(1, Math.max(0, (dx*dx*0.72 + dy*dy*0.88) * 0.95));
        v += 0.055 * Math.sin(uy * 41.0 + Math.sin(ux * 6.3) * 1.7);
        v += (rnd() - 0.5) * 0.20;
        v = v < 0 ? 0 : v > 1 ? 1 : v;
        var rr = CREAM[0] + (IVORY[0] - CREAM[0]) * v;
        var gg = CREAM[1] + (IVORY[1] - CREAM[1]) * v;
        var bb = CREAM[2] + (IVORY[2] - CREAM[2]) * v;
        if (rnd() < 0.0035){ rr -= 22; gg -= 20; bb -= 14; }   // dust and pinhole in the gelatin
        base[i] = pk(rr|0, gg|0, bb|0);
      }
    }

    cw = Math.ceil(gw / COARSE) + 2;
    ch = Math.ceil(gh / COARSE) + 2;
    light = new Float32Array(cw * ch);
    clump = new Float32Array(cw * ch);
    clumpRaw = new Float32Array(cw * ch);

    colIdx = new Int32Array(gw); colFrac = new Float32Array(gw);
    rowIdx = new Int32Array(gh); rowFrac = new Float32Array(gh);
    for (var x = 0; x < gw; x++){ var f = x / COARSE; colIdx[x] = f|0; colFrac[x] = f - (f|0); }
    for (var y = 0; y < gh; y++){ var g = y / COARSE; rowIdx[y] = g|0; rowFrac[y] = g - (g|0); }

    img = ctx.createImageData(gw, gh);
    buf = new Uint32Array(img.data.buffer);

    blobs = [
      {a: rnd()*6.28, av: 0.190, orb:0.10, rad:0.34, I:1.95, w:0.31, ph:0.0},
      {a: rnd()*6.28, av:-0.131, orb:0.27, rad:0.30, I:1.15, w:0.23, ph:1.7},
      {a: rnd()*6.28, av: 0.088, orb:0.41, rad:0.44, I:0.82, w:0.17, ph:3.1},
      {a: rnd()*6.28, av:-0.059, orb:0.58, rad:0.38, I:0.56, w:0.13, ph:4.6}
    ];
    strikeWord();
    if (window.console && console.log) console.log(N.toLocaleString() + " crystals on the plate. Each one keeps its own count.");
  }

  // --- the one word, struck into the emulsion at the lower edge ---------
  function strikeWord(){
    var oc = document.createElement('canvas');
    oc.width = gw; oc.height = gh;
    var o = oc.getContext('2d');
    var size = Math.max(10, Math.min(gh * 0.075, gw * 0.10));
    o.textBaseline = 'alphabetic';
    var track;
    for (var pass = 0; pass < 14; pass++){
      o.font = '900 ' + size + 'px "Arial Black","Helvetica Neue",Impact,sans-serif';
      track = size * 0.16;
      var wdt = o.measureText(WORD).width + track * (WORD.length - 1);
      if (wdt <= gw * 0.70) break;
      size *= 0.9;
    }
    o.font = '900 ' + size + 'px "Arial Black","Helvetica Neue",Impact,sans-serif';
    o.fillStyle = '#000';
    o.save();
    var x0 = gw * 0.075, y0 = gh - size * 0.42;
    o.translate(x0, y0);
    o.rotate(-0.017);
    var px = 0;
    for (var k = 0; k < WORD.length; k++){
      var ch2 = WORD.charAt(k);
      o.save();
      o.translate(px, (rnd() - 0.5) * size * 0.05);
      o.rotate((rnd() - 0.5) * 0.035);
      o.fillText(ch2, 0, 0);
      o.restore();
      px += o.measureText(ch2).width + track;
    }
    o.restore();
    var d = o.getImageData(0, 0, gw, gh).data;
    for (var i = 0, p = 3; i < N; i++, p += 4){
      if (d[p] > 120 && rnd() > 0.10) state[i] = 3;
    }
  }

  // --- light field: a wheeling noon, plus whatever the cursor blocks ----
  function buildLight(dt){
    var A = gw / gh, i;
    for (i = 0; i < blobs.length; i++) blobs[i].a += blobs[i].av * dt;
    var ccx = A * 0.5 + 0.17 * Math.sin(t * 0.043) + 0.06 * Math.sin(t * 0.011);
    var ccy = 0.46 + 0.12 * Math.sin(t * 0.031 + 1.1);
    var swell = 0.86 + 0.22 * Math.sin(t * 0.067 + 0.4);
    var bx = new Float32Array(blobs.length), by = new Float32Array(blobs.length),
        bi = new Float32Array(blobs.length), br = new Float32Array(blobs.length);
    for (i = 0; i < blobs.length; i++){
      var b = blobs[i];
      bx[i] = ccx + b.orb * Math.cos(b.a) * 1.25;
      by[i] = ccy + b.orb * Math.sin(b.a) * 0.78;
      bi[i] = b.I * swell * (0.72 + 0.44 * Math.sin(t * b.w + b.ph));
      br[i] = b.rad * (0.9 + 0.20 * Math.sin(t * b.w * 0.7 + b.ph * 1.9));
      br[i] = 1 / (br[i] * br[i]);
    }
    sStr += (sTarget - sStr) * Math.min(1, dt * 4.0);
    var sr2 = 1 / (0.135 * 0.135);
    for (var cy = 0; cy < ch; cy++){
      var uy = (cy * COARSE) / gh;
      var row = cy * cw;
      for (var cx = 0; cx < cw; cx++){
        var ux = (cx * COARSE) / gh;
        var L = 0.105 + 0.10 * (1.0 - uy) ;
        for (i = 0; i < blobs.length; i++){
          var dx = ux - bx[i], dy = uy - by[i];
          var q = (dx*dx + dy*dy) * br[i];
          if (q < 1){ var u = 1 - q; L += bi[i] * u * u; }
        }
        if (sStr > 0.004){
          var ex = ux - sx, ey = uy - sy;
          var s = (ex*ex + ey*ey) * sr2;
          if (s < 1){ var w = 1 - s; L *= 1 - 0.965 * sStr * w * w; }
        }
        light[row + cx] = L;
      }
    }
  }

  // neighbouring silver sensitizes the crowd around it; measured coarsely
  function buildClump(){
    clumpRaw.fill(0);
    var i = 0, inv = 1 / (COARSE * COARSE);
    for (var gy = 0; gy < gh; gy++){
      var row = rowIdx[gy] * cw;
      for (var gx = 0; gx < gw; gx++, i++){
        if (state[i] > 0) clumpRaw[row + colIdx[gx]] += 1;
      }
    }
    for (var cy = 1; cy < ch - 1; cy++){
      var r = cy * cw;
      for (var cx = 1; cx < cw - 1; cx++){
        var s = clumpRaw[r+cx-1] + clumpRaw[r+cx] + clumpRaw[r+cx+1]
              + clumpRaw[r-cw+cx-1] + clumpRaw[r-cw+cx] + clumpRaw[r-cw+cx+1]
              + clumpRaw[r+cw+cx-1] + clumpRaw[r+cw+cx] + clumpRaw[r+cw+cx+1];
        var v = (s / 9) * inv;
        clump[r+cx] = v > 1 ? 1 : v;
      }
    }
  }

  var last = 0;
  function frame(ts){
    if (!last) last = ts;
    var dt = (ts - last) / 1000; last = ts;
    if (dt > 0.06) dt = 0.06;
    t += dt;
    buildLight(dt);
    if ((frames % 5) === 0) buildClump();
    frames++;

    var RATE = dt * 1.0, i = 0;
    for (var gy = 0; gy < gh; gy++){
      var ry = rowIdx[gy], fy = rowFrac[gy];
      var r0 = ry * cw, r1 = r0 + cw;
      for (var gx = 0; gx < gw; gx++, i++){
        var s = state[i];
        if (s === 3){ buf[i] = (tint[i] & 7) === 0 ? C_PEWTER : C_DARK; continue; }
        var ci = colIdx[gx], fx = colFrac[gx];
        var a0 = light[r0+ci], a1 = light[r0+ci+1], b0 = light[r1+ci], b1 = light[r1+ci+1];
        var top = a0 + (a1 - a0) * fx, bot = b0 + (b1 - b0) * fx;
        var L = top + (bot - top) * fy;
        var cl = clump[r0 + ci];
        var nb = 0;
        if (i >= gw && state[i-gw] > 0) nb += 1;
        if (gx > 0 && state[i-1] > 0) nb += 1;
        var e = expA[i] + L * sens[i] * (1 + 1.55 * cl + 0.26 * nb) * RATE;
        var th = thr[i];
        if (s === 0){
          if (e >= th){ state[i] = 1; devT[i] = t; s = 1; }
        } else {
          if (s === 1 && e > th * 4.0){ state[i] = 2; s = 2; }
          if (t - devT[i] > life[i] && rnd() < 0.038){
            state[i] = 0; s = 0; e = th * 0.22 * rnd();
            life[i] = 6.5 + 21 * rnd();
          }
        }
        var cap = th * 10;
        expA[i] = e > cap ? cap : e;
        buf[i] = s === 0 ? base[i]
               : s === 2 ? C_BURN
               : ((tint[i] & 7) === 0 && cl > 0.52) ? C_PEWTER : C_DARK;
      }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }

  function setShadow(px, py){
    var H = window.innerHeight;
    sx = px / H; sy = py / H; sTarget = 1;
  }
  window.addEventListener('mousemove', function(e){ setShadow(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('mouseleave', function(){ sTarget = 0; });
  window.addEventListener('touchstart', function(e){
    if (e.touches.length) setShadow(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if (e.touches.length) setShadow(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchend', function(){ sTarget = 0; }, {passive:true});

  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ build(); }, 260);
  });

  build();
  requestAnimationFrame(frame);
})();
</script>
