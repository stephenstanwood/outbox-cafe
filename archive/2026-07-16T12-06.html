  <meta name="outbox-spec-subject" content="The plain physics of window frost and nothing else — that water vapour in the warm room meets glass chilled below freezing and skips liquid entirely, freezing straight onto dust motes and scratches as seed crystals, each new molecule of vapour sticking preferentially to the sharpest existing tips so the ice reaches OUTWARD in branching feathers rather than filling in solid; how the ferns run fastest along the coldest edges and the old putty line, how a warm touch on the glass sublimates a clear bald patch that the frost then creeps back around, how the whole delicate blooming is just cold, damp air, and a sheet of glass, made visible. Not a metaphor for winter or transience or memory or anything at all — literally vapour, a cold pane, and the branching ice that has no choice but to fern out of the two of them.">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern, Split, Fern Again — a pane going over tonight</title>
<meta name="description" content="A single-glazed sash window freezing over this minute: real branching ice ferning in from the edges, a warm fingertip that melts a porthole, spacebar for a fresh cold-snap bloom.">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d1a2b;overflow:hidden;}
  #glass{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:none;}
  .ui{position:fixed;z-index:5;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      color:rgba(180,206,224,0.42);font-size:10px;letter-spacing:0.14em;
      text-shadow:0 0 6px rgba(13,26,43,0.9);pointer-events:none;user-select:none;}
  #tally{left:14px;bottom:12px;}
  #stamp{right:14px;bottom:12px;text-align:right;pointer-events:auto;}
  #stamp .mark{color:rgba(224,162,76,0.5);letter-spacing:0.3em;}
  #stamp a{color:rgba(157,184,204,0.5);text-decoration:none;border-bottom:1px dotted rgba(157,184,204,0.35);}
  #stamp a:hover{color:rgba(232,241,246,0.85);border-bottom-color:rgba(232,241,246,0.6);}
</style>
</head>
<body>
<!-- deep pre-dawn glass, a few degrees below freezing. the ferns pick their own way in.
     look for the one crystal near the right that came out six-fold and symmetrical -->
<canvas id="glass"></canvas>
<div id="tally" class="ui">PANES FROSTED OVER AT THIS WINDOW: <span id="n">0</span></div>
<div id="stamp" class="ui"><span class="mark">&#10039;</span> &nbsp;<a href="/archive">elsewhere on the sill</a></div>

<script>
(function(){
  "use strict";

  // ---- tally: count up, once per load, never resets ----
  var N = 0;
  try { N = parseInt(localStorage.getItem("panesFrostedOver")||"0",10)||0; }
  catch(e){ N = 0; }
  N += 1;
  try { localStorage.setItem("panesFrostedOver", String(N)); } catch(e){}
  document.getElementById("n").textContent = N;

  var cv = document.getElementById("glass");
  var ctx = cv.getContext("2d");
  var fc = document.createElement("canvas");     // accumulating frost layer
  var fx_ctx = fc.getContext("2d");

  var W=0, H=0, dpr=1;
  var tips = [];
  var bloomAge = 0;

  // fixed spot on the glass for the one honest six-fold snowflake
  var SFX=0, SFY=0, sfMax=0, sfLen=0, sfLast=0;

  // warm fingertip
  var fingerX=0, fingerY=0, active=false, pressed=false, wasActive=false, lastFX=0, lastFY=0, pType="mouse";
  var flash=0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fc.width = cv.width; fc.height = cv.height;
    fx_ctx.setTransform(dpr,0,0,dpr,0,0);
    fx_ctx.lineCap = "round"; fx_ctx.lineJoin = "round";
    SFX = W*0.635; SFY = H*0.40;
    sfMax = Math.max(26, Math.min(W,H)*0.085);
    coldSnap(); // fresh bloom on (re)size
  }

  // ---- seeds along the four cold edges & the putty line ----
  function seedEdges(count){
    for(var i=0;i<count;i++){
      var edge = Math.floor(Math.random()*4);
      var x,y,ang;
      var spread = (Math.random()-0.5)*1.2;
      if(edge===0){ x=Math.random()*W; y=-2; ang=Math.PI/2 + spread; }
      else if(edge===1){ x=Math.random()*W; y=H+2; ang=-Math.PI/2 + spread; }
      else if(edge===2){ x=-2; y=Math.random()*H; ang=0 + spread; }
      else { x=W+2; y=Math.random()*H; ang=Math.PI + spread; }
      tips.push({x:x,y:y,px:x,py:y,ang:ang,gen:0,life:40+Math.random()*110});
    }
  }

  // ---- creep-back seeds around a cleared porthole rim ----
  function seedRim(cx,cy){
    var r = clearRadius()*1.05;
    for(var i=0;i<16;i++){
      var a = (i/16)*Math.PI*2 + Math.random()*0.2;
      var x = cx + Math.cos(a)*r;
      var y = cy + Math.sin(a)*r;
      var toC = Math.atan2(cy-y, cx-x) + (Math.random()-0.5)*0.9;
      tips.push({x:x,y:y,px:x,py:y,ang:toC,gen:1,life:24+Math.random()*44});
    }
  }

  function clearRadius(){ return Math.max(34, Math.min(W,H)*0.072); }

  function coldSnap(){
    tips = [];
    fx_ctx.setTransform(1,0,0,1,0,0);
    fx_ctx.clearRect(0,0,fc.width,fc.height);
    fx_ctx.setTransform(dpr,0,0,dpr,0,0);
    bloomAge = 0;
    sfLen = 0; sfLast = 0;
    seedEdges(160);
    flash = 0.22;
  }

  // ---- draw one advancing fern segment onto the frost layer ----
  function drawSeg(px,py,x,y,gen){
    var w1 = Math.max(0.5, 1.7*Math.pow(0.72,gen));
    // crystal mass — builds toward icy cyan-grey where ferns lace up dense
    fx_ctx.strokeStyle = "rgba(157,184,204,0.09)";
    fx_ctx.lineWidth = w1*2.4;
    fx_ctx.beginPath(); fx_ctx.moveTo(px,py); fx_ctx.lineTo(x,y); fx_ctx.stroke();
    // the crisp silver fern line
    fx_ctx.strokeStyle = "rgba(232,241,246,0.42)";
    fx_ctx.lineWidth = w1;
    fx_ctx.beginPath(); fx_ctx.moveTo(px,py); fx_ctx.lineTo(x,y); fx_ctx.stroke();
    // cold near-white glint at the growing tip
    fx_ctx.fillStyle = "rgba(251,253,255,0.55)";
    fx_ctx.beginPath(); fx_ctx.arc(x,y,w1*0.72,0,Math.PI*2); fx_ctx.fill();
  }

  var step = 2.2;

  function advance(){
    bloomAge++;
    // steady seeding, tapering as the pane fills so ferns linger before saturation
    if(bloomAge < 420){ seedEdges(3); }
    else if(tips.length < 130 && (bloomAge % 5 === 0)){ seedEdges(2); }

    var r = clearRadius();
    var r2 = r*r;
    var next = [];
    var branchable = tips.length < 640;

    for(var i=0;i<tips.length;i++){
      var t = tips[i];
      // frozen under the warm fingertip — it just waits there
      if(active){
        var ddx = t.x-fingerX, ddy = t.y-fingerY;
        if(ddx*ddx+ddy*ddy < r2){ next.push(t); continue; }
      }
      t.ang += (Math.random()-0.5)*0.26;
      t.px = t.x; t.py = t.y;
      t.x += Math.cos(t.ang)*step;
      t.y += Math.sin(t.ang)*step;
      drawSeg(t.px,t.py,t.x,t.y,t.gen);
      t.life--;

      if(t.life<=0 || t.x<-24 || t.x>W+24 || t.y<-24 || t.y>H+24) continue;

      // each new molecule sticks to the sharpest tips — ferns split off ferns
      if(branchable && t.gen<6 && t.life>4 && Math.random()<0.065){
        var off = 0.45 + Math.random()*0.6;
        var s = Math.random()<0.5?1:-1;
        next.push({x:t.x,y:t.y,px:t.x,py:t.y,ang:t.ang + off*s,
                   gen:t.gen+1,life:(t.life*0.62)|0});
        if(Math.random()<0.28){
          next.push({x:t.x,y:t.y,px:t.x,py:t.y,ang:t.ang - off*s*0.8,
                     gen:t.gen+1,life:(t.life*0.5)|0});
        }
      }
      next.push(t);
    }
    tips = next;

    growSnowflake();
    if(active) meltPorthole();
  }

  // ---- the one perfect six-fold crystal, growing in symmetric ----
  function growSnowflake(){
    if(sfLen >= sfMax) return;
    sfLen = Math.min(sfMax, sfLen + sfMax/170);
    var from = sfLast, to = sfLen;
    sfLast = sfLen;
    fx_ctx.strokeStyle = "rgba(251,253,255,0.66)";
    var branchAt = [0.30, 0.52, 0.74];
    for(var k=0;k<6;k++){
      var a = k*Math.PI/3;
      var dx = Math.cos(a), dy = Math.sin(a);
      // main arm
      fx_ctx.lineWidth = 1.1;
      fx_ctx.beginPath();
      fx_ctx.moveTo(SFX+dx*from, SFY+dy*from);
      fx_ctx.lineTo(SFX+dx*to,   SFY+dy*to);
      fx_ctx.stroke();
      // symmetric side branches, each drawn once as the arm reaches its anchor
      for(var b=0;b<branchAt.length;b++){
        var d = branchAt[b]*sfMax;
        if(d>from && d<=to){
          var bx = SFX+dx*d, by = SFY+dy*d;
          var blen = sfMax*(0.30 - b*0.06);
          for(var s=-1;s<=1;s+=2){
            var ba = a + s*Math.PI/3;
            fx_ctx.lineWidth = 0.9;
            fx_ctx.beginPath();
            fx_ctx.moveTo(bx,by);
            fx_ctx.lineTo(bx+Math.cos(ba)*blen, by+Math.sin(ba)*blen);
            fx_ctx.stroke();
          }
        }
      }
    }
  }

  // ---- warm fingertip sublimates a clear dark porthole in real time ----
  function meltPorthole(){
    var r = clearRadius();
    // interpolate along the sweep so a fast wipe still clears a continuous streak
    var steps = 1;
    if(pType!=="mouse" || true){
      var mdx = fingerX-lastFX, mdy = fingerY-lastFY;
      var dist = Math.sqrt(mdx*mdx+mdy*mdy);
      steps = Math.max(1, Math.ceil(dist/(r*0.5)));
    }
    fx_ctx.save();
    fx_ctx.globalCompositeOperation = "destination-out";
    for(var s=0;s<=steps;s++){
      var px = lastFX + (fingerX-lastFX)*(s/steps);
      var py = lastFY + (fingerY-lastFY)*(s/steps);
      var g = fx_ctx.createRadialGradient(px,py,0, px,py,r*1.25);
      g.addColorStop(0,"rgba(0,0,0,1)");
      g.addColorStop(0.7,"rgba(0,0,0,0.9)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      fx_ctx.fillStyle = g;
      fx_ctx.beginPath(); fx_ctx.arc(px,py,r*1.25,0,Math.PI*2); fx_ctx.fill();
    }
    fx_ctx.restore();
  }

  // ---- compose the whole pane each frame ----
  function render(){
    // dark pre-dawn window glass
    var bg = ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,"#0b1626");
    bg.addColorStop(0.55,"#0d1a2b");
    bg.addColorStop(1,"#0a1521");
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // faint chip of sodium-streetlamp amber bleeding through the clear glass
    var amb = ctx.createRadialGradient(W*0.72,H*0.66,0, W*0.72,H*0.66, Math.max(W,H)*0.6);
    amb.addColorStop(0,"rgba(224,162,76,0.10)");
    amb.addColorStop(0.4,"rgba(224,162,76,0.04)");
    amb.addColorStop(1,"rgba(224,162,76,0)");
    ctx.fillStyle = amb;
    ctx.fillRect(0,0,W,H);

    // through a melt-porthole the night glows warmer
    if(active){
      var r = clearRadius();
      var pg = ctx.createRadialGradient(fingerX,fingerY,0, fingerX,fingerY,r*1.5);
      pg.addColorStop(0,"rgba(224,162,76,0.42)");
      pg.addColorStop(0.5,"rgba(224,162,76,0.16)");
      pg.addColorStop(1,"rgba(224,162,76,0)");
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(fingerX,fingerY,r*1.5,0,Math.PI*2); ctx.fill();
    }

    // the frost itself
    ctx.drawImage(fc,0,0,W,H);

    // cold-snap flash
    if(flash>0){
      ctx.fillStyle = "rgba(232,241,246,"+flash+")";
      ctx.fillRect(0,0,W,H);
      flash *= 0.9; if(flash<0.01) flash=0;
    }

    // soft vignette to seat it in the sash
    var vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3, W/2,H/2,Math.max(W,H)*0.75);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,"rgba(4,9,16,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }

  function loop(){
    advance();
    render();
    // lifting the fingertip: ice re-nucleates and creeps back around the rim
    if(wasActive && !active){ seedRim(lastFX,lastFY); }
    wasActive = active;
    lastFX = fingerX; lastFY = fingerY;
    requestAnimationFrame(loop);
  }

  // ---- pointer = warm fingertip on the glass ----
  cv.addEventListener("pointermove", function(e){
    pType = e.pointerType || "mouse";
    fingerX = e.clientX; fingerY = e.clientY;
    if(pType==="mouse") active = true;
    else if(pressed) active = true;
  });
  cv.addEventListener("pointerenter", function(e){
    pType = e.pointerType || "mouse";
    fingerX = e.clientX; fingerY = e.clientY; lastFX=fingerX; lastFY=fingerY;
    if(pType==="mouse") active = true;
  });
  cv.addEventListener("pointerdown", function(e){
    pType = e.pointerType || "mouse";
    pressed = true; active = true;
    fingerX = e.clientX; fingerY = e.clientY; lastFX=fingerX; lastFY=fingerY;
  });
  function lift(e){
    pressed = false;
    if((e && e.pointerType==="touch") ) active = false;
  }
  cv.addEventListener("pointerup", lift);
  cv.addEventListener("pointercancel", function(e){ pressed=false; active=false; });
  cv.addEventListener("pointerleave", function(){ pressed=false; active=false; });

  // ---- spacebar = a hard cold-snap, a fresh bloom from all four edges ----
  window.addEventListener("keydown", function(e){
    if(e.code==="Space" || e.key===" "){
      e.preventDefault();
      coldSnap();
    }
  });
  // a tap-hold on touch outside the finger also works; double-tap re-blooms
  var lastTap=0;
  cv.addEventListener("pointerup", function(e){
    if(e.pointerType==="touch"){
      var now=Date.now();
      if(now-lastTap<320) coldSnap();
      lastTap=now;
    }
  });

  window.addEventListener("resize", resize);
  resize();
  loop();

  // for whoever presses in close: the crystal at the right came out six-fold on purpose.
  try{ console.log("%c\u2744 one of these came out symmetrical. it isn't labelled.","color:#9db8cc"); }catch(e){}
})();
</script>
