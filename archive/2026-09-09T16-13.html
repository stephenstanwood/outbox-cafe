  <meta name="outbox-spec-era" content="Autumn 1979 — biro on the unprinted back of a wallpaper roll-end, spread flat on a Formica kitchen table in Dunfermline, Fife, at ten to six in the morning, forty minutes before a taxi comes to take a woman to Aberdeen for six days. The whole page is that one piece of writing, still being written when the visitor arrives.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SENTENCE that has not finished, and its brackets are the only navigation. No header, no menu, no title, no scrollbar, no site chrome. At load you see a single line of handwriting running across the middle of the paper, and somewhere in it a bracketed aside. PRESS the aside and it does not expand inline — the sentence you were reading REDISTRIBUTES AROUND THE FOUR EDGES OF THE SCREEN, physically becoming a rectangular frame of handwriting on all four sides (top edge left-to-right, right edge running down, bottom edge, left edge running up), and the bracketed aside takes the middle of the paper as the new sentence. Do it again and you get two concentric frames of writing with a third sentence in the centre. It goes nine levels deep, so at full depth the visitor is looking at eight nested rectangles of biro handwriting closing in on one short sentence in the middle, and that innermost sentence is the only place on the page where a full stop occurs. PRESS any frame to come back out through it. Nothing scrolls, nothing resets, and the sentence never ends anywhere except at the very bottom.">
  <meta name="outbox-spec-subject" content="The flat working instructions for one kitchen, written for a house-sitter by the person leaving it, and specifically that every single instruction in this room needs an exception and every exception needs an exception. That the oil-fired range does not have a thermostat you can trust and is regulated by the damper wheel on the flue and by nothing else, that the wheel is set at two and a quarter turns off the stop and it is marked with a scratch, and that anybody who shuts it down to one because the kitchen is warm will get soot on the flue and a cooker that will not come back up for a day and a half. That the middle oven is thirty degrees cooler than the top one and always has been because the top oven sits directly over the firebox, so bread goes top and a stew goes middle, and this is a matter of where the heat physically is and not of anybody's preference. That the immersion heater is on a mechanical clock with brass tappets that has to be pushed round by hand if the power has been off, that the clock does not know the power went off, and that the only way to find out is that the tank is cold at seven. That the third gas ring has a worn crown and burns yellow and will black the bottom of any pan put on it, and that the kettle goes on the second ring. That the cold tap in the scullery has to be turned OFF slowly or the whole run of pipe under the floor hammers for a minute and the neighbour bangs on the wall. That the stopcock is under the third floorboard from the back door, that the board lifts with a knife and not a screwdriver, and that the last man who came out could not find it. That the back sash has dropped and will not stay up unless the cast-iron doorstop is put in the gap, and the doorstop lives behind the bin and not in the house. That the cat has a thyroid tablet every morning in a quarter ounce of tinned pilchard and will not take it in anything else, that the vet's number is on the felt-tip line, and that she is thirteen and has never once been out the front. That the milk is two pints Tuesdays and Fridays and there is a note in the empty. That the fridge door does not seal on the hinge side and has to be pushed at the top corner. That the meter is on the stair and takes fifty-pence pieces, that there are eleven of them in the tea caddy, and that eleven is not enough for six days if the immersion is left on, which is the entire reason for the paragraph about the immersion. And around all of it, the plain arithmetic that the taxi comes at half past six, that the sentence is not finished, and that there is about two inches of wallpaper left to write on.">
  <meta name="outbox-spec-tone" content="The fast, warm, cheerfully over-explaining voice of Effie Rattray-Bonar, sixty-one, who is writing this at the table with her coat already over the chair back and who cannot get to the end of a clause without qualifying it. Present tense, second person, addressed directly and affectionately to the house-sitter, who is her nephew's girlfriend and whom she has met twice. She digresses because every instruction genuinely has an exception, and she knows she is doing it — twice, deep inside a bracket, she says plainly that she is going to stop putting things in brackets, and then puts something in a bracket. She never once uses a full stop until the last line, and the page is honest about that: the sentence runs on because she is still thinking. She gives a number for everything she can (two and a quarter turns, thirty degrees, eleven fifty-pences, two pints, quarter ounce) and finds the numbers just as worth writing down as the instructions. She is specifically and repeatedly annoyed about exactly one thing — that the man who came out in March could not find the stopcock and cut a hole in the scullery floor looking for it — and she says it three times at three different depths, once with his firm's name. She is proud of exactly one thing and mentions it twice: that the range has not been out since 1971 and she gives the month. She apologises for the length of the note once, in the middle, and then keeps going for four more levels. Never wry, never deadpan, never wistful, never a wise-old-aunt, never a lovable-eccentric routine, never confiding anything about herself — she has a taxi at half six and the cat needs telling about.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the ink's colour is COMPUTED and never chosen. The paper is the unprinted back of a wallpaper roll-end, a warm sized cream (#e5dcc6) going greyer and slightly furred along the torn long edge (#cbc0a4), with real woodchip lumps standing proud under the writing so the pen skips over them honestly, and a genuine curl-shadow down the right third where it was rolled and has not gone flat. Against that, EVERY STROKE'S COLOUR AND WEIGHT COME OUT OF A REAL BALLPOINT MODEL: the pen stores an actual remaining ink volume, an actual ball-and-socket flow rate and an actual local pressure, so a stroke renders as a dense saturated blue where the flow has caught up (#2b3f8c), a thin starved grey-blue where she has gone too fast (#7f8bb4), and a hard glossy blob where the ball has picked up its own bead and dumped it at the start of a downstroke (#1a2a63). Because the note was written from the outside in, the OUTERMOST FRAMES ARE THE DARKEST and every level inward is measurably paler and skippier than the one containing it, so the page gets physically harder to read the deeper the visitor goes, and nothing anywhere says so. Pressed-through strokes render as real embossing that catches the low kitchen light from the left. Exactly one chip of red felt-tip (#c3352c) is held strictly for three things and nothing else on the page: the vet's telephone number, the underlining of the word STOPCOCK, and the word NOT. Flat, hard, high contrast, no glow, no bloom, no soft focus, no sepia, no gradients other than honest ink starvation, honest pressure and honest paper tooth.">
  <meta name="outbox-spec-wildcard" content="Somewhere in the level 6 sentence there is a bracket that opens and never closes — not at level 7, not at level 9, not anywhere on the paper. The engine treats it exactly as it treats every other bracket except that it has no contents: pressing it does nothing at all, no frame forms, no sentence appears, the paper does not move, and there is no feedback of any kind. It is rendered identically to every working bracket, it persists in the same place on every visit, and nothing on the page accounts for it. Effie never mentions it.">
  <meta name="outbox-spec-forbidden" content="NO note-left-behind sentiment of any kind — this is not a last message, not a legacy, not a voice from the past, not 'and she never came back', not a widow's kitchen, not somebody putting their house in order. She is going to a wedding for six days and the taxi is at half six. NO nostalgia, NO wistfulness, NO elegy for a kitchen, NO domesticity-as-love writing, NO 'a whole life in a set of instructions', NO the-cat-outlives-her, NO decline narrative about oil ranges, immersion heaters, coin meters or milk deliveries. NO handwriting lyricism: no describing the hand as shaky, tender, familiar, spidery or beautiful, and no reading character into loops or pressure — a stroke here is flow rate and pressure. NO Scotland travelogue and NO explaining Scotland to anybody: no heather, no rain-as-mood, no shipyards, no mining pathos, no thrift-and-hardiness sentiment, no dialect spelling, no Scots vocabulary imported for flavour beyond what a woman writing a note would actually put down, no charming-locals sketch, no aren't-they-dour. NO 1979-as-period-signifier: no Winter of Discontent, no Thatcher, no strikes, no devolution referendum, no punk, no retro-kitsch or camp affection for Formica, woodchip wallpaper, coin meters or biro. NO stream-of-consciousness or modernist framing: no Molly Bloom, no Joyce, no 'the sentence as a mind', no digression-as-metaphor for how memory works, no parentheses-as-metaphor for anything at all — the brackets are there because every instruction in this kitchen has an exception. NO writing-about-writing, NO meta commentary on the note's own length or shape beyond her one flat apology, NO winking at the reader, NO the-page-is-aware-of-itself. NO craftsman-sage register, NO folk wisdom, NO 'they knew how to build things then', NO reverence for hand skill, NO wise-old-woman arc, NO lovable-eccentric character sketch. NO teaching voice, NO explainer framing, NO 'and here's the clever part'. NO anxiety framing, NO dread, NO foreshadowing of anything going wrong while she is away, NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous treatment of the unclosed bracket, the fading ink or the embossing — nothing here is wrong. NO archival / museum / cabinet / drawer / found-document / relic framing of the note whatsoever, despite it being handwriting on old paper — it is being written this minute and the pen is still in her hand. NO ledger, registry, inventory, index or catalogue framing, despite it being a list of instructions. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is ten to six in the morning with the light on and the kettle just off. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<body>
<div id="sheet">
  <canvas id="paper" title="the pen is still in her hand"></canvas>
  <canvas id="ink" title="press the bracket"></canvas>
</div>
<a id="away" href="/archive">other papers</a>
<div id="sr" aria-live="off"></div>
<script>
(function(){
"use strict";

/* ---------- the note ---------- */
const RAW = [
`Right then Marilyn, the kettle's just off and the taxi is at half six, so I'll get the whole of it down for you while there's light and paper, and everything in this room hangs off the range, which has ~NOT~ been out since March of 1971 and I would rather it wasn't out when I come back on the Sunday, so the wheel [[1|the damper wheel, and read this bit twice —]] is the only thing regulating it, and the thermostat on the front is a liar and has been a liar since we got it,`,
`two and a quarter turns off the stop, and there's a scratch cut on the rim of the wheel where two and a quarter is, so you line the scratch up with the pipe bracket and that's you, and about Wednesday you'll find the kitchen far too warm and you'll want to shut it down to one, and I'm asking you ~NOT~ to, because [[2|what happens when it's down at one —]] and it is a day and a half of no hot water, no bread and a middle oven that won't do a thing,`,
`the flue sails up with soot the minute it's starved, and once there's soot on it it won't draw, and it won't draw all the time you're stood waiting on it, and it has not been out since March 1971, eight years and a bit, and I'd like to keep it that way, and if the kitchen is genuinely too warm the answer is the back window and never the wheel, [[3|the back window, which is a job in itself —]] and after that the scullery door, and the middle oven runs a good thirty degrees cooler than the top one and always has, because the top oven sits directly over the firebox, so bread goes top and a stew goes middle, and that's where the heat physically is and nothing to do with what anybody prefers,`,
`the sash has dropped, a good inch since the winter, and it will ~NOT~ stay up on its own, so you put the cast-iron doorstop in the gap at the left-hand side, and the doorstop lives outside behind the bin, it is not in the house and it has never been in the house, [[4|so don't go turning the house over for it —]] and put it back behind the bin after, or the window's down again by the morning and you'll not hear it go,`,
`it's a black wedge about the size of a loaf tin and it will be wet, that's all that's wrong with it, wipe it on the mat, and I'm sorry this is such a length, I am, but every single thing in this room has a but hanging off it, and the third gas ring, the one nearest the window, has a worn crown and burns yellow and will black the bottom of any pan you put on it, so the kettle goes on the second ring, and the cold tap in the scullery [[5|the tap, and this one matters to Mrs Dorward next door —]] and the stopcock business, which I'll come to, because the man in March made a right mess of that,`,
`turn it off slowly, count three while you're doing it, because if you snap it shut the whole run of pipe under the floor hammers for the best part of a minute and Mrs Dorward bangs on the wall, and she is quite right to bang, and the __STOPCOCK__, if you ever want it, [[6|where the stopcock is, and I'm going to stop putting things in brackets —]] and the immersion is the other half of the stair, and I'll get to the immersion,`,
`under the third floorboard in from the back door, the third, and it lifts with a knife under the end of it and ~NOT~ a screwdriver, and the man Kellock & Sons sent out in March could not find it and cut a hole in my scullery floor looking for it, a hole, [[x|eight inches across and still there —]] and the tank and the clock [[7|the immersion, the clock and the eleven fifty-pences —]] which is the entire reason I'm going on at such length about the meter,`,
`it's on the mechanical clock on the stair with the wee brass tappets, and if the power's been off at any point the clock does ~NOT~ know it went off, it just carries on from where it stopped, so it'll be an hour and ten out and the tank stone cold at seven, and the only way you find out is the tank being cold at seven, so push the dial round by hand to the right time, [[8|the meter, the caddy and what's left —]] and the tappets are the two wee brass pegs, in is on and out is off,`,
`the meter's on the stair and takes fifty-pence pieces and there are eleven of them in the tea caddy on the shelf, and eleven is plenty for six days and nothing like enough if the immersion is left running all day, and if anybody comes out to anything at all while I'm away you show them the third board yourself, because I am not having another hole cut in that floor, and the fridge door doesn't seal on the hinge side so you give it a push at the top corner and listen for it, and that's me finished with the brackets, [[9|the cat, and the milk —]] and the milk is two pints Tuesdays and Fridays and there's a note in the empty already,`,
`Tam gets one thyroid tablet every morning in a quarter ounce of tinned pilchard and ~NOT~ in anything else, the vet is ##723 4416##, she's thirteen and she has never once been out the front, and there's the taxi and about two inches of paper left, so tell her.`
];

/* ---------- parse ---------- */
const RE=/\[\[(\d+|x)\|([^\]]*)\]\]|~([^~]+)~|__([^_]+)__|##([^#]+)##/g;
function segments(s){
  let out=[],last=0,m; RE.lastIndex=0;
  while((m=RE.exec(s))!==null){
    if(m.index>last) out.push({txt:s.slice(last,m.index)});
    if(m[1]!==undefined) out.push({txt:'('+m[2]+')', br:(m[1]==='x'?'dead':parseInt(m[1],10))});
    else if(m[3]!==undefined) out.push({txt:m[3],red:true});
    else if(m[4]!==undefined) out.push({txt:m[4],red:true,ul:true});
    else out.push({txt:m[5],red:true});
    last=m.index+m[0].length;
  }
  if(last<s.length) out.push({txt:s.slice(last)});
  return out;
}
const LVL = RAW.map(function(s,i){
  const words=[];
  segments(s).forEach(function(sg){
    sg.txt.split(/\s+/).forEach(function(t){
      if(!t) return;
      words.push({txt:t, red:!!sg.red, ul:!!sg.ul, br:sg.br});
    });
  });
  return {words:words, plain:s.replace(RE,function(a,b,c,d,e,f){return c||d||e||f||'';})};
});
document.getElementById('sr').textContent = LVL.map(function(l){return l.plain;}).join(' ');

/* ---------- storage ---------- */
const KEY='effie.wallpaper.v1';
let store;
try{ store = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ store=null; }
if(!store || typeof store.ink!=='number') store={ink:1.0, levelInk:{}, opens:{}, emboss:[], lost:{}};
if(!store.levelInk) store.levelInk={};
if(!store.opens) store.opens={};
if(!Array.isArray(store.emboss)) store.emboss=[];
if(!store.lost) store.lost={};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const embSeen=new Set();
store.emboss.forEach(function(p){ embSeen.add((p[0]>>2)+','+(p[1]>>2)); });

function spendInk(lvl){
  store.ink = Math.max(0.10, store.ink - 0.0035*(lvl+1) - 0.005);
  store.levelInk[lvl] = store.ink;
  store.opens[lvl] = (store.opens[lvl]||0)+1;
  save();
}
function inkFor(lvl){
  const base = (typeof store.levelInk[lvl]==='number') ? store.levelInk[lvl] : store.ink;
  return base * (1 - 0.052*lvl);
}

/* ---------- canvases ---------- */
const pc=document.getElementById('paper'), ic=document.getElementById('ink');
const pctx=pc.getContext('2d'), ctx=ic.getContext('2d');
let W=0,H=0,DPR=1;
const FONT='"Segoe Script","Bradley Hand","Snell Roundhand","Comic Sans MS",cursive';
function fontStr(f){ return 'italic '+f.toFixed(1)+'px '+FONT; }

/* ---------- seeded rng ---------- */
function mk(seed){ let s=seed>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ---------- woodchip lumps ---------- */
const LUMPS=[];
(function(){ const r=mk(20719); for(let i=0;i<420;i++){ LUMPS.push({x:r()*2600, y:r()*2000, r:2.4+r()*4.2}); } })();
function lumpAt(x,y){
  for(let i=0;i<LUMPS.length;i++){ const L=LUMPS[i]; const dx=x-L.x, dy=y-L.y;
    if(dx*dx+dy*dy < L.r*L.r) return L; }
  return null;
}

/* ---------- paper ---------- */
function drawPaper(){
  pctx.setTransform(DPR,0,0,DPR,0,0);
  pctx.clearRect(0,0,W,H);
  pctx.fillStyle='#e5dcc6'; pctx.fillRect(0,0,W,H);
  // tooth
  const r=mk(4471);
  pctx.globalAlpha=0.055;
  for(let i=0;i<Math.min(9000,W*H/26);i++){
    const x=r()*W, y=r()*H;
    pctx.fillStyle = r()<0.5 ? '#8e8467' : '#f3ecd9';
    pctx.fillRect(x,y,1,1);
  }
  pctx.globalAlpha=1;
  // curl shadow down the right third
  const g=pctx.createLinearGradient(W*0.62,0,W,0);
  g.addColorStop(0,'rgba(120,108,80,0)');
  g.addColorStop(0.55,'rgba(120,108,80,0.10)');
  g.addColorStop(0.86,'rgba(120,108,80,0.19)');
  g.addColorStop(1,'rgba(160,150,120,0.05)');
  pctx.fillStyle=g; pctx.fillRect(W*0.62,0,W*0.38,H);
  // woodchip lumps standing proud, light from the left
  pctx.save();
  for(let i=0;i<LUMPS.length;i++){
    const L=LUMPS[i]; if(L.x>W+8||L.y>H+8) continue;
    pctx.beginPath(); pctx.ellipse(L.x,L.y,L.r,L.r*0.72,(L.x%7)*0.4,0,6.2832);
    pctx.fillStyle='rgba(243,236,216,0.55)'; pctx.fill();
    pctx.beginPath(); pctx.ellipse(L.x+L.r*0.45,L.y+L.r*0.3,L.r*0.7,L.r*0.5,0,0,6.2832);
    pctx.fillStyle='rgba(128,116,88,0.16)'; pctx.fill();
  }
  pctx.restore();
  // torn, furred long edge along the bottom
  const tr=mk(881);
  pctx.fillStyle='#cbc0a4';
  for(let x=0;x<W;x+=2){
    const h=4+tr()*7;
    pctx.fillRect(x,H-h,2,h);
  }
  pctx.strokeStyle='rgba(150,140,112,0.5)'; pctx.lineWidth=0.7;
  for(let x=0;x<W;x+=3){
    pctx.beginPath(); pctx.moveTo(x,H-3-tr()*4); pctx.lineTo(x+(tr()-0.5)*3, H-9-tr()*7); pctx.stroke();
  }
  // embossing pressed through, catching the low light from the left
  for(let i=0;i<store.emboss.length;i++){
    const p=store.emboss[i]; const x=p[0], y=p[1];
    if(x<-4||y<-4||x>W+4||y>H+4) continue;
    pctx.beginPath(); pctx.arc(x-0.9,y-0.9,1.7,0,6.2832);
    pctx.fillStyle='rgba(255,251,236,0.62)'; pctx.fill();
    pctx.beginPath(); pctx.arc(x+1.0,y+1.0,1.5,0,6.2832);
    pctx.fillStyle='rgba(122,110,82,0.32)'; pctx.fill();
  }
}

/* ---------- the pen ---------- */
const CURV={a:.7,b:.5,c:.6,d:.55,e:.8,f:.5,g:.8,h:.45,i:.3,j:.5,k:.5,l:.25,m:.6,n:.55,o:.85,p:.6,q:.75,r:.5,s:.85,t:.35,u:.55,v:.5,w:.6,x:.55,y:.6,z:.5,' ':.1,',':.6,'(':.7,')':.7,'—':.15,'.':.9,"'":.3,'-':.15,'&':.9};
function newPen(lvl,f){
  return {rnd:mk((lvl*7919 + Math.round(f*13) + 101)>>>0), speed:0.45, flow:0.82, press:0.5, ink:inkFor(lvl), lvl:lvl};
}
function penStep(p,ch){
  const lc=ch.toLowerCase();
  const curv = (CURV[lc]!==undefined)?CURV[lc]:0.45;
  const isCap = ch!==lc;
  const target = 0.30 + p.rnd()*0.55 - curv*0.18 + (ch===' '?0.45:0);
  p.speed += (target - p.speed)*0.38;
  const tf = 1.06 - p.speed*0.80;
  p.flow += (tf - p.flow)*0.20;                 /* flow lags the hand */
  let press = 0.42 + curv*0.62 - p.speed*0.34 + (isCap?0.14:0) + (p.rnd()-0.5)*0.16;
  p.press = press;
  const sat = Math.max(0, Math.min(1, p.flow)) * (0.34 + 0.66*Math.max(0,Math.min(1,p.ink)));
  const blob = (p.flow>0.93 && press>0.72 && p.speed<0.42);
  let col, a, wgt;
  if(blob){ col='#1a2a63'; a=0.96; wgt=1.35; }
  else if(sat<0.42){ col='#7f8bb4'; a=0.42+sat*0.7; wgt=0.85; }
  else { col='#2b3f8c'; a=0.55+sat*0.42; wgt=1.0+ (sat-0.5)*0.4; }
  return {col:col,a:a,blob:blob,press:press,wgt:wgt,speed:p.speed};
}
const EMB=0.885;
function addEmboss(x,y){
  const k=((x|0)>>2)+','+((y|0)>>2);
  if(embSeen.has(k)) return;
  embSeen.add(k);
  store.emboss.push([Math.round(x),Math.round(y)]);
  if(store.emboss.length>2400) store.emboss.splice(0,400);
}

/* ---------- state ---------- */
let depth=0;
let glyphs=[], hitBr=[], hitDead=[], ringRects=[];
let cursor=0, cursorVisible=false;
let anim=null, recordPass=false;
const RED='#c3352c';

/* ---------- measuring ---------- */
function measure(words,f){
  ctx.font=fontStr(f);
  let sp=ctx.measureText(' ').width*0.92, total=0;
  for(let i=0;i<words.length;i++){
    const w=words[i]; let t=0;
    for(const c of w.txt) t+=ctx.measureText(c).width + f*0.03;
    w.w=t; total+=t;
  }
  return {sp:sp, total: total + sp*(words.length-1)};
}

/* ---------- glyph drawing ---------- */
function drawGlyph(ch,x,f,st,red,pen){
  const j=(pen.rnd()-0.5)*0.10;
  ctx.save();
  ctx.translate(x,0);
  ctx.rotate(j);
  ctx.transform(1,0,-0.20,1,0,0);
  ctx.globalAlpha=st.a;
  ctx.fillStyle = red?RED:st.col;
  ctx.fillText(ch,0,(pen.rnd()-0.5)*f*0.07);
  if(st.wgt>1.05){ ctx.globalAlpha=st.a*0.5; ctx.fillText(ch,0.35,0.2); }
  if(st.blob){
    ctx.globalAlpha=0.85; ctx.fillStyle= red?RED:'#1a2a63';
    ctx.beginPath(); ctx.ellipse(f*0.10,-f*0.16,f*0.075,f*0.055,0,0,6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

/* draws words[from..to) along +x from world origin (ox,oy) rotated rot */
function drawRun(words,from,to,ox,oy,rot,f,sp,pen,opt){
  opt=opt||{};
  ctx.save(); ctx.translate(ox,oy); ctx.rotate(rot); ctx.font=fontStr(f);
  const cs=Math.cos(rot), sn=Math.sin(rot);
  let x=0;
  for(let i=from;i<to;i++){
    const w=words[i];
    const startX=x;
    for(const ch of w.txt){
      if(opt.limit!==undefined && opt.count.n>=opt.limit){ ctx.restore(); return x; }
      const cw=ctx.measureText(ch).width + f*0.03;
      const wx=ox+x*cs, wy=oy+x*sn;
      const st=penStep(pen,ch);
      const L=lumpAt(wx,wy);
      if(L){ st.a*=0.22; }
      drawGlyph(ch,x,f,st,w.red,pen);
      glyphs.push({x:wx,y:wy,f:f});
      if(recordPass && st.press>EMB) addEmboss(wx,wy);
      if(opt.count){ opt.count.n++; if(opt.onChar) opt.onChar(st,L); }
      x+=cw;
    }
    if(w.ul){
      ctx.save(); ctx.globalAlpha=0.9; ctx.strokeStyle=RED; ctx.lineWidth=Math.max(1,f*0.09);
      ctx.beginPath(); ctx.moveTo(startX+f*0.05,f*0.20); ctx.lineTo(x-f*0.12,f*0.22+(pen.rnd()-0.5)*1.2); ctx.stroke(); ctx.restore();
    }
    if(w.br!==undefined){
      const ax=ox+startX*cs, ay=oy+startX*sn, bx=ox+x*cs, by=oy+x*sn;
      const pad=f*0.9;
      const rect={x:Math.min(ax,bx)-pad,y:Math.min(ay,by)-pad,w:Math.abs(bx-ax)+pad*2,h:Math.abs(by-ay)+pad*2};
      if(w.br==='dead') hitDead.push(rect); else hitBr.push({lvl:w.br,rect:rect});
    }
    x+=sp;
  }
  ctx.restore();
  return x;
}

/* cramming into a corner: honestly overwritten, and two of them gone for good */
function cramCorner(words,from,to,cx,cy,f,pen,lvl,sizeKey){
  const s=f*0.62;
  ctx.font=fontStr(s);
  let placed=0;
  for(let i=from;i<to;i++){
    const w=words[i];
    const ang=(-0.78 + (placed%3)*0.42 + (pen.rnd()-0.5)*0.3);
    const ox=cx + (pen.rnd()-0.5)*f*1.1 - w.w*0.31;
    const oy=cy + (placed-1)*s*0.55 + (pen.rnd()-0.5)*f*0.5;
    const illegible = placed>=2;
    ctx.save(); ctx.translate(ox,oy); ctx.rotate(ang); ctx.font=fontStr(s);
    let x=0;
    for(const ch of w.txt){
      const st=penStep(pen,ch);
      drawGlyph(ch,x,s,st,w.red,pen);
      if(illegible){ ctx.save(); ctx.translate((pen.rnd()-0.5)*3,(pen.rnd()-0.5)*3); drawGlyph(ch,x,s,st,w.red,pen); ctx.restore(); }
      x+=ctx.measureText(ch).width+s*0.03;
    }
    if(illegible){
      ctx.globalAlpha=0.75; ctx.strokeStyle='#2b3f8c'; ctx.lineWidth=1.1;
      for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(pen.rnd()*x, -s*0.6+pen.rnd()*s);
        ctx.lineTo(pen.rnd()*x, -s*0.6+pen.rnd()*s); ctx.stroke(); }
      ctx.globalAlpha=1;
      const arr = store.lost[sizeKey] || (store.lost[sizeKey]=[]);
      if(arr.indexOf(w.txt)<0){ arr.push(w.txt); if(arr.length>260) arr.shift(); }
    }
    ctx.restore();
    placed++;
  }
}

/* ---------- geometry ---------- */
function bandFor(d){
  if(d<1) return 0;
  const md=Math.min(W,H);
  const centreMin=Math.max(96, md*0.24);
  let b=(md-centreMin)/(2*d);
  return Math.max(9, Math.min(26, b));
}

function drawRing(i,b,pad){
  const x0=pad+i*b, y0=pad+i*b, x1=W-pad-i*b, y1=H-pad-i*b;
  ringRects.push({lvl:i,x0:x0,y0:y0,x1:x1,y1:y1});
  const rw=x1-x0, rh=y1-y0;
  const corner=b*1.05;
  const capT=Math.max(20,rw-2*corner), capB=capT;
  const capR=Math.max(20,rh-2*corner), capL=capR;
  const caps=[capT,capR,capB,capL];
  const totalCap=capT+capR+capB+capL;
  const words=LVL[i].words;
  let f=Math.max(8, b*0.60);
  let m=measure(words,f);
  if(m.total>totalCap){
    f=Math.max(8, f*Math.min(1, totalCap/m.total));
    m=measure(words,f);
  }
  const sp=m.sp;
  const sizeKey=W+'x'+H+'#'+i;
  const pen=newPen(i,f);
  const targets=caps.map(function(c){ return c/totalCap * m.total; });
  const origins=[
    {ox:x0+corner, oy:y0+b*0.70, rot:0},
    {ox:x1-b*0.85, oy:y0+corner, rot:Math.PI/2},
    {ox:x1-corner, oy:y1-b*0.85, rot:Math.PI},
    {ox:x0+b*0.85, oy:y1-corner, rot:-Math.PI/2}
  ];
  const corners=[
    {x:x1-b*0.5,y:y0+b*0.5},
    {x:x1-b*0.5,y:y1-b*0.5},
    {x:x0+b*0.5,y:y1-b*0.5},
    {x:x0+b*0.5,y:y0+b*0.5}
  ];
  let idx=0, spent=0;
  for(let e=0;e<4;e++){
    const cap=caps[e];
    let used=0, start=idx;
    while(idx<words.length){
      const need=words[idx].w + (idx>start?sp:0);
      if(used+need>cap) break;
      used+=need; idx++;
    }
    drawRun(words,start,idx,origins[e].ox,origins[e].oy,origins[e].rot,f,sp,pen);
    spent+=used;
    // whatever the edge could not hold, up to this edge's share, goes in the corner
    let dumpStart=idx, dumped=0;
    const share=targets[e];
    while(idx<words.length && (used+dumped) < share && dumped < share*0.5){
      dumped+=words[idx].w+sp; idx++;
    }
    if(idx>dumpStart) cramCorner(words,dumpStart,idx,corners[e].x,corners[e].y,f,pen,i,sizeKey);
    if(idx>=words.length) break;
  }
  if(idx<words.length){
    cramCorner(words,idx,Math.min(words.length,idx+3),corners[3].x,corners[3].y,f,pen,i,sizeKey);
  }
}

function drawCentre(lvl,b,pad,limit,onChar){
  const inX=pad+depth*b+ (depth?b*0.4:0), inY=pad+depth*b+(depth?b*0.4:0);
  const cw=W-2*inX, ch=H-2*inY;
  const words=LVL[lvl].words;
  let f=Math.max(9, Math.min(20, cw/23));
  let lines,m,sp;
  for(let tries=0;tries<14;tries++){
    m=measure(words,f); sp=m.sp;
    lines=[]; let cur=[], cx=0;
    for(let i=0;i<words.length;i++){
      const need=words[i].w+(cur.length?sp:0);
      if(cx+need>cw-6 && cur.length){ lines.push(cur); cur=[]; cx=0; }
      cur.push(i); cx+= words[i].w + (cur.length>1?sp:0);
    }
    if(cur.length) lines.push(cur);
    if(lines.length*f*1.42 <= ch-4 || f<=9) break;
    f-=0.7;
  }
  const lh=f*1.42;
  const totalH=lines.length*lh;
  let y=inY + Math.max(0,(ch-totalH)/2) + f;
  const pen=newPen(lvl,f);
  const count={n:0};
  for(let li=0;li<lines.length;li++){
    const ln=lines[li];
    let lw=0; for(let k=0;k<ln.length;k++) lw+=words[ln[k]].w+(k?sp:0);
    const x=inX+Math.max(0,(cw-lw)/2)+(pen.rnd()-0.5)*2;
    drawRun(words,ln[0],ln[ln.length-1]+1,x,y,0,f,sp,pen,{limit:limit,count:count,onChar:onChar});
    y+=lh;
    if(limit!==undefined && count.n>=limit) break;
  }
}

function render(limit,onChar){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  glyphs=[]; hitBr=[]; hitDead=[]; ringRects=[];
  const pad=8;
  const b=bandFor(depth);
  for(let i=0;i<depth;i++) drawRing(i,b,pad);
  drawCentre(depth,b,pad,limit,onChar);
  drawCursorMark();
}

function drawCursorMark(){
  if(!cursorVisible||!glyphs.length) return;
  const g=glyphs[Math.min(cursor,glyphs.length-1)];
  ctx.save();
  ctx.globalAlpha=0.8; ctx.strokeStyle='#1a2a63'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(g.x+g.f*0.2,g.y+g.f*0.22,g.f*0.20,0,6.2832); ctx.stroke();
  ctx.globalAlpha=0.5; ctx.fillStyle='#1a2a63';
  ctx.beginPath(); ctx.arc(g.x+g.f*0.2,g.y+g.f*0.22,g.f*0.06,0,6.2832); ctx.fill();
  ctx.restore();
}

/* ---------- resize ---------- */
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  pc.width=Math.round(W*DPR); pc.height=Math.round(H*DPR);
  ic.width=Math.round(W*DPR); ic.height=Math.round(H*DPR);
  drawPaper(); render();
  save();
}
window.addEventListener('resize',function(){ clearTimeout(resize._t); resize._t=setTimeout(resize,90); });

/* ---------- audio ---------- */
let AC=null, master=null, noiseBuf=null, scratchNode=null, scratchGain=null, scratchFilt=null, carOn=false;
function makeNoise(){
  const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
    noiseBuf=makeNoise();
    ambient();
    setTimeout(startCar, 240000);
  }catch(e){ AC=null; }
}
function burst(freq,q,dur,vol,type){
  if(!AC) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=AC.createGain(); g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(); s.stop(AC.currentTime+dur+0.02);
}
function tone(freq,dur,vol,type,bend){
  if(!AC) return;
  const o=AC.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,AC.currentTime);
  if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(20,bend),AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function scratchOn(){
  if(!AC||scratchNode) return;
  scratchNode=AC.createBufferSource(); scratchNode.buffer=noiseBuf; scratchNode.loop=true;
  scratchFilt=AC.createBiquadFilter(); scratchFilt.type='bandpass'; scratchFilt.frequency.value=2400; scratchFilt.Q.value=1.1;
  scratchGain=AC.createGain(); scratchGain.gain.value=0.0;
  scratchNode.connect(scratchFilt); scratchFilt.connect(scratchGain); scratchGain.connect(master);
  scratchNode.start();
}
function scratchOff(){
  if(scratchNode){ try{ scratchGain.gain.setTargetAtTime(0,AC.currentTime,0.05); const n=scratchNode; setTimeout(function(){ try{n.stop();}catch(e){} },300);}catch(e){}
    scratchNode=null; }
}
function scratchTick(st,lump){
  if(!AC||!scratchGain) return;
  const dry = 1.15 - Math.max(0,Math.min(1,store.ink));       /* scratchier as it runs out */
  const spd = Math.max(0.1,Math.min(1.4,st.speed));
  scratchFilt.frequency.setTargetAtTime(1500+spd*3200+dry*900, AC.currentTime, 0.02);
  scratchGain.gain.setTargetAtTime(0.010+spd*0.016+dry*0.006, AC.currentTime, 0.02);
  if(lump) burst(5200,2.4,0.028,0.055,'highpass');
}
function startCar(){
  if(!AC||carOn) return; carOn=true;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=41;
  const o2=AC.createOscillator(); o2.type='square'; o2.frequency.value=82.5;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
  const g=AC.createGain(); g.gain.value=0.0;
  const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
  const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=300; nf.Q.value=0.6;
  const ng=AC.createGain(); ng.gain.value=0.012;
  const lfo=AC.createOscillator(); lfo.frequency.value=6.3; const lg=AC.createGain(); lg.gain.value=5;
  lfo.connect(lg); lg.connect(o.frequency);
  o.connect(lp); o2.connect(lp); lp.connect(g); n.connect(nf); nf.connect(ng); ng.connect(g);
  g.connect(master);
  o.start(); o2.start(); n.start(); lfo.start();
  g.gain.linearRampToValueAtTime(0.045, AC.currentTime+6);
}
function ambient(){
  // firebox, on its own irregular clock
  (function tick(){ if(!AC) return;
    tone(88,0.05,0.035,'sine',62); burst(3000,3,0.02,0.02,'highpass');
    setTimeout(tick, 900+Math.random()*2600);
  })();
  // immersion tank, knocks twice
  (function knock(){ if(!AC) return;
    setTimeout(function(){ tone(126,0.14,0.06,'sine',96);
      setTimeout(function(){ tone(119,0.13,0.05,'sine',92); },210);
      knock();
    }, 42000+Math.random()*44000);
  })();
  // cat on lino
  (function cat(){ if(!AC) return;
    setTimeout(function(){
      for(let i=0;i<4;i++) setTimeout(function(){ burst(1700,1.6,0.035,0.028,'bandpass'); }, i*175+Math.random()*40);
      cat();
    }, 26000+Math.random()*50000);
  })();
  // milk float, three streets over
  (function float(){ if(!AC) return;
    setTimeout(function(){
      const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=58;
      const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=240;
      const g=AC.createGain(); g.gain.value=0;
      o.connect(f); f.connect(g); g.connect(master); o.start();
      g.gain.linearRampToValueAtTime(0.020, AC.currentTime+3.5);
      o.frequency.linearRampToValueAtTime(64, AC.currentTime+7);
      g.gain.linearRampToValueAtTime(0.0, AC.currentTime+9);
      o.stop(AC.currentTime+9.4);
      float();
    }, 70000+Math.random()*70000);
  })();
}
function draughtSound(){
  if(!AC) return;
  for(let i=0;i<7;i++) setTimeout(function(){ burst(900+Math.random()*1400,0.8,0.09,0.030,'bandpass'); }, i*70+Math.random()*50);
}

/* ---------- writing animation ---------- */
function writeLevel(lvl){
  const chars=LVL[lvl].words.reduce(function(a,w){return a+w.txt.length+1;},0);
  const dur=Math.min(1500, 9*chars);
  const t0=performance.now();
  if(anim) cancelAnimationFrame(anim);
  scratchOn();
  let lastN=0;
  (function step(){
    const t=(performance.now()-t0)/dur;
    const lim=Math.ceil(Math.min(1,t)*chars);
    render(lim, function(st,lump){ if(this) return; });
    // sound driven off the last few glyphs
    if(glyphs.length>lastN){ scratchTick({speed:0.3+Math.random()*0.7}, Math.random()<0.13); lastN=glyphs.length; }
    if(t<1){ anim=requestAnimationFrame(step); }
    else {
      anim=null; scratchOff();
      recordPass=true; render(); recordPass=false;
      drawPaper(); render(); save();
    }
  })();
}

/* ---------- navigation ---------- */
function goIn(){
  if(depth>=LVL.length-1) return;
  depth++; spendInk(depth); writeLevel(depth); cursorVisible=false;
}
function goOut(to){
  if(depth<=0) return;
  depth=Math.max(0,to); cursorVisible=false; render(); save();
}
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }

function press(px,py){
  initAudio();
  const p={x:px,y:py};
  for(let i=0;i<hitDead.length;i++){ if(inRect(p,hitDead[i])) return; }   /* nothing */
  for(let i=0;i<hitBr.length;i++){
    if(hitBr[i].lvl===depth+1 && inRect(p,hitBr[i].rect)){ goIn(); return; }
  }
  for(let i=ringRects.length-1;i>=0;i--){
    const r=ringRects[i];
    const inside = p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1;
    if(!inside) continue;
    const next=ringRects[i+1];
    const inNext = next && p.x>=next.x0&&p.x<=next.x1&&p.y>=next.y0&&p.y<=next.y1;
    const innerX0 = next?next.x0:null;
    if(!inNext && !(i===ringRects.length-1 && insideCentre(p))){ goOut(r.lvl); return; }
  }
}
function insideCentre(p){
  const pad=8, b=bandFor(depth);
  const inX=pad+depth*b, inY=pad+depth*b;
  return p.x>inX && p.x<W-inX && p.y>inY && p.y<H-inY;
}
ic.addEventListener('click',function(e){
  const r=ic.getBoundingClientRect();
  press(e.clientX-r.left, e.clientY-r.top);
});
ic.addEventListener('touchstart',function(e){
  if(!e.touches.length) return;
  const r=ic.getBoundingClientRect(), t=e.touches[0];
  press(t.clientX-r.left, t.clientY-r.top);
},{passive:true});

/* ---------- keys ---------- */
const sheet=document.getElementById('sheet');
window.addEventListener('keydown',function(e){
  initAudio();
  if(e.key==='['){ e.preventDefault(); goIn(); }
  else if(e.key===']'){ e.preventDefault(); goOut(depth-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); cursorVisible=true; cursor=Math.min(glyphs.length-1,cursor+1); render(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); cursorVisible=true; cursor=Math.max(0,cursor-1); render(); }
  else if(e.key===' '){
    e.preventDefault();
    sheet.classList.remove('lifting'); void sheet.offsetWidth; sheet.classList.add('lifting');
    draughtSound();
  }
});
sheet.addEventListener('animationend',function(){ sheet.classList.remove('lifting'); });

/* ---------- go ---------- */
resize();
spendInk(0);
render();
save();

console.log('%cthe doorstop lives behind the bin. it has never been in the house.','color:#2b3f8c;font-style:italic');
console.log('[ in  ·  ] out  ·  arrows to follow the line  ·  space for the draught under the back door');
})();
