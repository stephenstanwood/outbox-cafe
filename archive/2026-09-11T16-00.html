  <meta name="outbox-spec-era" content="September 1993, the Saturday before the eighteenth, on the flat roof of a three-storey block in Estación Central, Santiago — warm spring afternoon, about forty volantines up over six blocks of low roofs, the wind coming down off the cordillera at nine or ten knots and steadying rather than dying, and a hot dusty smell of the empty lot next door. Not a memory, not a look-back, not a childhood: there are two spools of line left on the table downstairs, a man three roofs over on Calle Chorrillos who has taken four kites off this building since Thursday, and about three hours of usable wind.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY that is one fighting kite and one reel, played with a single hand, filling the whole viewport: the sky seen up-and-out from the roof parapet, your own hexagonal paper volantín riding out at the end of a real line, and four or five other people's kites working the same air over the neighbourhood. You FLY it with one continuous gesture — drag toward yourself to haul in, which tensions the line and makes the kite drive hard in whatever direction its nose is pointing; release toward the sky to give line, which goes slack and lets the kite spin loose and reset; small lateral flicks steer, and the kite has no tail so it will not sit still and never does. You FIGHT by putting your line across somebody else's and then working it: contact is real, and cutting is abrasion — the two lines saw against each other at whatever relative speed you actually generate, and the winner is whoever's coating is still on the line at the point of contact. No menu, no levels, no score screen, no scroll: one reel, two spools left, an opponent on Chorrillos, and the wind holding.">
  <meta name="outbox-spec-subject" content="The flat mechanics of cutting somebody's line off a roof, and specifically that a fighting kite is not steered, it is aimed and then released — that a volantín has no tail on purpose, so it is unstable by design and will always rotate to some heading and then FLY that heading the instant the line comes taut, which means the whole control scheme is two states, tirar (pull, line taut, kite drives) and dar hilo (give, line slack, kite spins), and everything anybody does up there is choosing when to switch between them; that the bow in the spine spar sets how hard it drives and how fast it spins, and a spar bowed too much makes a kite that turns beautifully and will not hold a line across the wind; that CUTTING IS SANDING AND NOTHING ELSE — hilo curado is cotton line run through a paste of ground glass and glue, so a line is a file with a finite number of grains on it, and the cut goes to whoever gets more relative motion across the crossing point with more grit still on their line at that exact place; that this is why the classic answer is to give line fast while the other man pulls, because slack line moving through a taut one saws it, and the man who yanks in a panic is doing the sawing for you; that the first fifteen or twenty metres nearest the kite is the only part of a spool that ever sees a fight, so that is the part that goes bald, and a spool that cut six kites on Thursday is smooth where it matters and the rest of it is as sharp as the day it was made and completely useless; that a line under high tension cuts faster and also breaks faster, so there is a real optimum and it is not maximum tension; that WIND GRADIENT is real — the air over a roofline is dirty and gusty for the first several metres and clean above it, which is why a kite launched low fights badly and why the man with the taller building genuinely has an advantage that is not skill; that line SAG is not slack: a hundred metres of cotton has real weight and real drag, so the kite is never where the line points and a beginner aims at the kite instead of at the line; that a cut kite does not dive, it flutters off downwind flat and slow because nothing is holding its nose anywhere, and that is why children run for four blocks and are often right about where it will land; that the cut line falls too, all of it, across roofs and wires and other people's lines, and picking it out of a television aerial is the actual cost of losing; that WIRE IS NOT LINE — anybody flying steel or nylon-cored line cuts everything instantly, cuts hands, and takes the whole afternoon down with it, which is a real argument up here and not a rule anybody enforces; and the flat arithmetic on the parapet, which is two spools left at eight hundred pesos apiece, four kites lost off this roof since Thursday, a volantín that costs less than the line it flies on, and about three hours of wind.">
  <meta name="outbox-spec-tone" content="The loud, fast, running match commentary of Rosita Yáñez, fifty-four, who sells kites and line off a folding table on the corner downstairs and has come up to the roof with her own spool because a man on Chorrillos has taken four kites off this building since Thursday. Present tense, second person, addressed to whoever came up the stairs behind her and is now holding the spare reel and the paper bag. She narrates the fight the way a person narrates a fight nobody else is watching: short bursts with gaps in them, calling shots before she makes them ('now — now I give it — no, not yet'), talking directly AT the kite about half the time and at the man on Chorrillos the rest, knowing perfectly well he cannot hear a word. She is boastful, cheerfully and openly, and the boasts are always priced: she does not say she is good, she says what a spool costs and how many she has sold to people who lost to her. She keeps a running count of cuts today and gets it wrong twice in the other direction, undercounting because she does not count anything she cut by accident. She breaks off mid-sentence three separate times because the wind does something and she has to deal with it, and picks the sentence up afterwards from a different place. She has a long side-argument going about the sausage cart moving to the other corner, which she returns to at random and which has nothing to do with anything. She calls the man on Chorrillos by a nickname and never his name. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT nostalgic, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, and NOT the competent-tradesperson-saying-every-figure-twice voice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is spring Santiago sky, which is not blue at this hour — a hazy, dusty, sun-whitened grey-blue (#a9bfcb) that goes measurably paler and browner toward the horizon at the bottom of frame (#cfc6b3) and cooler and cleaner straight up (#7ea3bd), with the cordillera showing along the lower edge as flat unmodelled haze and nothing else. Against that, the kites: papel volantín is tissue, so its rendered value is COMPUTED from whether the sun is behind it or in front of it — a kite edge-on and lit from behind glows hot and translucent with its spars showing through as hard dark lines, and the same kite banked away goes flat, dull and opaque, and this flips several times a second while it spins. The two paper colours in play are a hot fuchsia (#e2357b) and a hard chrome yellow (#f2c400), both bleached toward white where the sun is straight through them (#fbe9ef) and both dropping to a dirty maroon-olive in silhouette (#5a3a45). Line is rendered honestly: a real hairline in dry cotton grey (#b9ae97) that is genuinely invisible against the pale horizon for most of its length and only picks up a specular glint where the glass coating remains, so the BALD SECTION OF YOUR OWN SPOOL IS VISIBLE AS A LENGTH THAT HAS STOPPED SPARKLING, and nothing on the page ever says so. The roof under the bottom edge is unpainted concrete and tar patch (#8f8b80) with a red-oxide parapet cap (#9c4a2c). Exactly one chip of table-oilcloth cobalt (#1f4fa8) is held strictly for the spool cheeks, the plastic bag the spare line came in, and the price written on masking tape on the reel — it never appears on a kite, in the sky, or on the roof. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest atmospheric haze, honest paper translucency and honest glint on remaining grit.">
  <meta name="outbox-spec-wildcard" content="There is a black plastic bag up there. It came off the empty lot on the first big gust and it is in the wind field like everything else — the engine gives it real drag, real mass and real lift, so it soars, sinks, gets caught in the wake off Chorrillos and climbs again, and about once a session it goes higher than any kite in frame. It cannot be cut, it cannot be hooked, and a line laid across it slides off with no abrasion at all. It never leaves during a visit. Rosita mistakes it for a kite exactly once, early, calls a shot on it, and then says what it is and goes back to the fight and never mentions it again. Same bag, same lot, every visit.">
  <meta name="outbox-spec-forbidden" content="NO kites as metaphor for anything — not freedom, not childhood, not aspiration, not the string that keeps you tethered, not letting go, not what rises and what falls; this is a bowed spar, a slack-line autorotation and a per-centimetre grit value, and it has nothing to teach anybody. ABSOLUTELY NO The Kite Runner, NO 'for you, a thousand times over', NO friendship-across-a-divide arc, NO boy-and-his-kite, NO coming-of-age, NO running-for-the-cut-kite as an image of anything. NO sky lyricism whatsoever: no soaring, no dancing, no the-wind-took-it, no clouds, no light-through-paper reverie, no sensuous writing about tissue paper beyond translucency, weight, tear strength and cost. NO Chile travelogue and NO explaining Chile or Santiago to anybody: no Andes majesty, no Neruda, no magical realism, no empanadas-and-cueca colour writing, no Spanish sprinkled in for flavour beyond the handful of words a person on that roof would actually use in the middle of a fight, no dialect spelling, no charming-neighbours sketch. ABSOLUTELY NO Chilean political history imported as atmosphere or subtext: no 1973, no Pinochet, no plebiscite, no disappeared, no dictatorship allegory, no democracy-restored framing, no poverty pathos, no shantytown sociology, no aren't-they-resilient condescension — it is a Saturday, the wind is good, and she sells line. NO nostalgia, NO wistfulness, NO 'nobody flies kites anymore / the wires took it / the last September like this' decline narrative — there are three hours of wind and two spools left. NO danger-porn about glass line: the wire argument is a flat complaint made in the moment and never a cautionary tale, never foreshadowing, never a lesson. NO craftsman-sage register, NO 'the old flyers could feel the cut coming', NO trade mystique, NO reverence for hand-made line, NO artisan-versus-factory sermon, NO master-and-apprentice arc. NO underdog or revenge arc about the man on Chorrillos, NO rivalry pathos, NO he-taught-me-everything twist; he is a man with a better roof. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the flying. NO cryptic-SCP, liminal, uncanny, backrooms or ominous dread about the plastic bag, the bald line or the kite that never lands — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object on this roof. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a bright warm afternoon. NO signal / transmission / frequency / broadcast framing of any sound on the page. NO society / club / guild / association / cabinet-of-hobbyists scaffolding.">

<!--
  bow the spine and it turns like water and holds nothing.
  the sparkle stops about where the fights happen. nobody says so.
-->
<script>
(function(){
"use strict";

/* ============ storage: forward only ============ */
var KEY="rosita.chorrillos.v1";
var S;
try{ S=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(!S||!S.grit||!S.grit.length){
  S={ spool:1, spools:3, metres:120, grit:null, lost:0, cut:0, pesos:800, bow:0.34 };
  S.grit=new Array(240); for(var i=0;i<240;i++) S.grit[i]=1;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* grit array: index = 0.5 m increments from kite end outward */
var GSEG=0.5;
function gritAt(m){ var i=Math.floor(m/GSEG); if(i<0)i=0; if(i>=S.grit.length)i=S.grit.length-1; return S.grit[i]; }
function wearAt(m,amt){ var i=Math.floor(m/GSEG); if(i<0)i=0; if(i>=S.grit.length)return; S.grit[i]=Math.max(0,S.grit[i]-amt); }

/* ============ canvas ============ */
var c=document.getElementById("c"), g=c.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  c.width=W*DPR; c.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize); resize();

/* world: x right (downwind-ish), y up, in metres. camera pinned at parapet. */
var PPM=0; // pixels per metre, set each frame
function proj(x,y){
  // x metres lateral from roof edge, y metres altitude above parapet
  return [W*0.5 + x*PPM, H*0.86 - y*PPM];
}

/* ============ wind field ============ */
var t=0;
var gustT=0, gustPhase=Math.random()*99, gustVal=0;
var BUILDINGS=[ {x:-26,h:9,w:11},  {x:19,h:14,w:13} ]; // second is Chorrillos, taller
function wind(x,y){
  // base 9-10 knots ~ 4.8 m/s at height, gradient near roofline
  var base=5.0+gustVal*1.5;
  var grad=Math.min(1,Math.pow(Math.max(0,y)/7,0.55));
  var vx=base*(0.35+0.65*grad);
  var vy=0.25*grad;
  // dirty air first several metres
  if(y<7){
    var turb=(1-grad);
    vx+=Math.sin(y*1.9+t*3.1+x*0.31)*1.5*turb;
    vy+=Math.cos(y*2.4+t*2.3+x*0.22)*1.6*turb;
    vy+=Math.sin(t*5.7+x*0.7)*0.8*turb;
  }
  // building wakes
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i];
    var dx=x-b.x, dy=y-(b.h-3);
    if(dx>0&&dx<26&&y<b.h+2&&y>-2){
      var f=(1-dx/26)*Math.max(0,1-Math.abs(dy)/9);
      vx-=base*0.55*f;
      vy+=Math.sin(t*4.2+dx*0.8+i*2)*2.2*f;
      vy-=1.0*f;
    }
  }
  return [vx,vy];
}
function gustStep(dt){
  gustT-=dt;
  if(gustT<=0){ gustT=1.4+Math.random()*5.0; gustPhase=Math.random()*6.28; }
  var target=Math.sin(gustPhase)*0.6+Math.sin(t*0.37)*0.3;
  gustVal+=(target-gustVal)*dt*1.2;
}

/* ============ line: chain of masses ============ */
function Line(anchor,n,len,owner){
  this.owner=owner;
  this.n=n; this.len=len;
  this.p=[]; this.pp=[];
  for(var i=0;i<n;i++){
    var f=i/(n-1);
    this.p.push({x:anchor.x+f*len*0.7, y:anchor.y+f*len*0.55});
    this.pp.push({x:anchor.x+f*len*0.7, y:anchor.y+f*len*0.55});
  }
  this.anchor=anchor;
  this.tension=0;
  this.cutIdx=-1;
  this.free=false;
}
Line.prototype.seglen=function(){ return this.len/(this.n-1); };
Line.prototype.step=function(dt,kite,taut){
  var n=this.n, sl=this.seglen();
  var massPer=0.0016*sl*40; // cotton, feels like weight
  for(var i=1;i<n;i++){
    var P=this.p[i], PP=this.pp[i];
    var vx=(P.x-PP.x), vy=(P.y-PP.y);
    PP.x=P.x; PP.y=P.y;
    var w=wind(P.x,P.y);
    var rvx=w[0]-vx/dt, rvy=w[1]-vy/dt;
    var sp=Math.hypot(rvx,rvy);
    var drag=0.00042*sp*sl*60;
    var ax=rvx*drag/massPer, ay=rvy*drag/massPer-9.81;
    P.x+=vx*0.995+ax*dt*dt;
    P.y+=vy*0.995+ay*dt*dt;
  }
  // constraints, iterated: tension propagates a segment per iteration -> real lag
  var iters=6;
  var maxStretch=0;
  for(var k=0;k<iters;k++){
    this.p[0].x=this.anchor.x; this.p[0].y=this.anchor.y;
    for(var i=0;i<n-1;i++){
      var A=this.p[i],B=this.p[i+1];
      var dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1e-6;
      var diff=(d-sl)/d;
      if(d>sl){
        if(d-sl>maxStretch) maxStretch=d-sl;
        var wA=(i===0)?0:0.5, wB=(i+1===n-1&&kite&&taut)?0.5:0.5;
        if(i===0){ B.x-=dx*diff*1.0; B.y-=dy*diff*1.0; }
        else { A.x+=dx*diff*0.5; A.y+=dy*diff*0.5; B.x-=dx*diff*0.5; B.y-=dy*diff*0.5; }
      }
    }
    if(kite&&!this.free){
      // kite end follows last node when taut
      var last=this.p[n-1];
      if(taut){ last.x+=(kite.x-last.x)*0.5; last.y+=(kite.y-last.y)*0.5; }
      else { last.x=kite.x; last.y=kite.y; }
    }
  }
  this.tension=Math.min(60,maxStretch*900);
};

/* ============ kite ============ */
function Kite(x,y,color,owner){
  this.x=x;this.y=y;this.vx=0;this.vy=0;
  this.head=-Math.PI/2+0.3;   // nose direction
  this.spin=0;
  this.color=color;
  this.owner=owner;
  this.alive=true;
  this.free=false;
  this.bow=0.34;
  this.flutter=0;
  this.aoa=0; this.airspeed=0;
}
Kite.prototype.step=function(dt,tension,anchor){
  var w=wind(this.x,this.y);
  var rvx=w[0]-this.vx, rvy=w[1]-this.vy;
  var sp=Math.hypot(rvx,rvy); this.airspeed=sp;
  var wdir=Math.atan2(rvy,rvx);
  var nose=this.head;
  // angle between nose and relative wind
  var da=Math.atan2(Math.sin(wdir-nose),Math.cos(wdir-nose));
  this.aoa=da;
  var area=0.16;
  var q=0.5*1.2*sp*sp*area;
  // flat plate: normal force ~ sin(2a)-ish, plus drag
  var cn=Math.sin(da)*Math.cos(da)*2.6;
  var cd=0.12+1.0*Math.sin(da)*Math.sin(da);
  var nx=-Math.sin(nose), ny=Math.cos(nose); // normal to spine
  var fx=cn*q*nx + cd*q*Math.cos(wdir);
  var fy=cn*q*ny + cd*q*Math.sin(wdir);
  var mass=0.035;
  if(this.free){
    // no line: flat, slow, downwind. huge drag, near-zero normal authority
    this.vx+=((w[0]-this.vx)*1.9)*dt;
    this.vy+=((w[1]-this.vy)*1.9-1.4)*dt;
    this.spin+=(Math.random()-0.5)*3*dt;
    this.head+=this.spin*dt; this.spin*=0.94;
    this.flutter=0.9;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    return;
  }
  fy-=9.81*mass;
  // line pull toward anchor, magnitude from tension
  var dx=anchor.x-this.x, dy=anchor.y-this.y, dd=Math.hypot(dx,dy)||1;
  fx+=dx/dd*tension*0.11; fy+=dy/dd*tension*0.11;
  this.vx+=fx/mass*dt; this.vy+=fy/mass*dt;
  this.vx*=0.985; this.vy*=0.985;
  this.x+=this.vx*dt; this.y+=this.vy*dt;
  // YAW: centre of pressure ahead of bridle => divergent. bow adds spin damping/rate
  var bowTurn=0.6+this.bow*2.4;      // deep bow: fast turn
  var bowTrack=1.5-this.bow*1.9;     // deep bow: poor tracking
  var tautness=Math.min(1,tension/9);
  // under tension the bridle pulls nose to align: drives on current heading
  var align=Math.atan2(-dy,-dx); // away from anchor
  var ea=Math.atan2(Math.sin(align-this.head),Math.cos(align-this.head));
  this.spin += ea*tautness*bowTrack*5.2*dt;
  // divergent term: any offset grows when slack
  this.spin += Math.sin(da*2)*(1-tautness)*bowTurn*4.5*dt;
  this.spin += (1-tautness)*(0.9*Math.sin(t*3.1+this.x))*bowTurn*dt;
  this.spin*= (1 - dt*(1.6+tautness*3.5));
  this.spin += this.steer||0;
  this.steer=0;
  this.head+=this.spin*dt;
  this.flutter = Math.max(0, 1 - Math.abs(Math.sin(da))*1.6);
  if(this.y<0.4){ this.y=0.4; this.vy=Math.abs(this.vy)*0.2; }
};

/* ============ actors ============ */
var anchor={x:0,y:0.6};
var mine=null, myLine=null;
var pull=0;          // 0..1 haul
var reelOut=0;       // metres out
var lineOutTarget=0;
var afternoonOver=false;

function makeMine(){
  mine=new Kite(3,10,"fuchsia","me");

/* opponent agent on Chorrillos, and two neighbours */
function Agent(x,y,color,fights,name){
  this.anchor={x:x,y:y};
  this.k=new Kite(x+4,y+7,color,name);
  this.k.bow=fights?0.30:0.5;
  this.line=new Line(this.anchor,20,12,name);
  this.out=12;
  this.pull=0.5;
  this.fights=fights;
  this.state="taut"; this.timer=0;
  this.relaunch=0;
  this.grit=new Array(160); for(var i=0;i<160;i++) this.grit[i]=fights?0.9:0.5;
  this.name=name;
}
var chorrillos=new Agent(19,12.5,"yellow",true,"chorrillos");
var neigh=[ new Agent(-26,7.5,"yellow",false,"a"), new Agent(-9,3.0,"fuchsia",false,"b") ];

/* ============ black plastic bag ============ */
var bag={x:-14,y:5,vx:0,vy:0,rot:0,seen:false,high:false};
function bagStep(dt){
  var w=wind(bag.x,bag.y);
  var rvx=w[0]-bag.vx, rvy=w[1]-bag.vy;
  var sp=Math.hypot(rvx,rvy);
  var lift=Math.sin(t*1.7+bag.x*0.3)*0.9;
  bag.vx+=(rvx*sp*0.14)*dt;
  bag.vy+=(rvy*sp*0.14 + lift - 1.6)*dt;
  bag.x+=bag.vx*dt; bag.y+=bag.vy*dt;
  bag.rot+=(bag.vx*0.2+Math.sin(t*4))*dt;
  if(bag.y<1.2){ bag.y=1.2; bag.vy=Math.abs(bag.vy)*0.5+1.2; }
  if(bag.y>34){ bag.vy-=3*dt; }
  if(bag.x>40){ bag.x=-34; bag.vx=0; }
  if(bag.x<-36){ bag.x=-34; }
}

/* ============ audio ============ */
var AC=null, master=null, sndOn=false;
var pap={}, sing={}, rasp={}, reelN={};
function noiseBuf(ctx,sec){
  var b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate);
  var d=b.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function startAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.0; master.connect(AC.destination);
  var nb=noiseBuf(AC,2);
  function noiseChain(){
    var s=AC.createBufferSource(); s.buffer=nb; s.loop=true;
    var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=0.8;
    var gg=AC.createGain(); gg.gain.value=0;
    s.connect(f); f.connect(gg); gg.connect(master); s.start();
    return {s:s,f:f,g:gg};
  }
  pap=noiseChain(); pap.f.type="bandpass";
  rasp=noiseChain(); rasp.f.type="highpass"; rasp.f.frequency.value=2500;
  reelN=noiseChain(); reelN.f.type="bandpass"; reelN.f.frequency.value=420; reelN.f.Q.value=2.4;
  var o=AC.createOscillator(); o.type="sawtooth"; o.frequency.value=180;
  var of=AC.createBiquadFilter(); of.type="lowpass"; of.frequency.value=900;
  var og=AC.createGain(); og.gain.value=0;
  o.connect(of); of.connect(og); og.connect(master); o.start();
  sing={o:o,g:og,f:of};
  // TV through the stairwell
  var tv=noiseChain(); tv.f.type="bandpass"; tv.f.frequency.value=1400; tv.f.Q.value=1.2;
  tv.g.gain.value=0.006;
  setInterval(function(){ if(!AC)return; tv.f.frequency.setTargetAtTime(700+Math.random()*1600,AC.currentTime,0.2);
    tv.g.gain.setTargetAtTime(0.002+Math.random()*0.008,AC.currentTime,0.4); },700);
  // bus on Ecuador
  function bus(){
    if(!AC) return;
    var bo=AC.createOscillator(); bo.type="sawtooth";
    var bf=AC.createBiquadFilter(); bf.type="lowpass"; bf.frequency.value=260;
    var bg=AC.createGain(); bg.gain.value=0;
    bo.connect(bf); bf.connect(bg); bg.connect(master);
    var T=AC.currentTime; bo.start(T);
    var f0=52;
    for(var gear=0;gear<3;gear++){
      var t0=T+gear*1.5;
      bo.frequency.setValueAtTime(f0,t0);
      bo.frequency.linearRampToValueAtTime(f0*1.7,t0+1.2);
      bg.gain.setValueAtTime(0.0,t0);
      bg.gain.linearRampToValueAtTime(0.05,t0+0.4);
      bg.gain.linearRampToValueAtTime(0.012,t0+1.35);
    }
    bg.gain.linearRampToValueAtTime(0,T+5);
    bo.stop(T+5.2);
    setTimeout(bus, 9000+Math.random()*22000);
  }
  setTimeout(bus,3000+Math.random()*6000);
  // dog
  function dog(){
    if(!AC) return;
    var n=2+Math.floor(Math.random()*3);
    for(var i=0;i<n;i++){
      var s=AC.createBufferSource(); s.buffer=nb;
      var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=420+Math.random()*180; f.Q.value=5;
      var gg=AC.createGain();
      var T=AC.currentTime+i*0.34;
      gg.gain.setValueAtTime(0,T); gg.gain.linearRampToValueAtTime(0.05,T+0.02);
      gg.gain.exponentialRampToValueAtTime(0.0005,T+0.19);
      s.connect(f); f.connect(gg); gg.connect(master); s.start(T); s.stop(T+0.25);
    }
    setTimeout(dog, 14000+Math.random()*40000);
  }
  setTimeout(dog,6000+Math.random()*10000);
}
function bagRustle(){
  if(!AC) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(AC,0.4);
  var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=3200;
  var gg=AC.createGain();
  var T=AC.currentTime;
  gg.gain.setValueAtTime(0.0,T); gg.gain.linearRampToValueAtTime(0.035,T+0.05);
  gg.gain.exponentialRampToValueAtTime(0.0004,T+0.4);
  s.connect(f); f.connect(gg); gg.connect(master); s.start(T); s.stop(T+0.42);
}

/* ============ abrasion ============ */
function segIntersect(a,b,cc,d){
  var r={x:b.x-a.x,y:b.y-a.y}, s={x:d.x-cc.x,y:d.y-cc.y};
  var den=r.x*s.y-r.y*s.x;
  if(Math.abs(den)<1e-9) return null;
  var qp={x:cc.x-a.x,y:cc.y-a.y};
  var tt=(qp.x*s.y-qp.y*s.x)/den;
  var uu=(qp.x*r.y-qp.y*r.x)/den;
  if(tt<0||tt>1||uu<0||uu>1) return null;
  return {x:a.x+r.x*tt, y:a.y+r.y*tt, t:tt, u:uu};
}
var contact=null, contactRasp=0, prevContact=null;
function abrade(dt){
  contact=null;
  if(!mine||mine.free||!myLine) return;
  var others=[chorrillos].concat(neigh);
  for(var o=0;o<others.length;o++){
    var A=others[o];
    if(!A.k.alive||A.k.free) continue;
    for(var i=0;i<myLine.n-1;i++){
      for(var j=0;j<A.line.n-1;j++){
        var X=segIntersect(myLine.p[i],myLine.p[i+1],A.line.p[j],A.line.p[j+1]);
        if(!X) continue;
        // metres along MY line from the kite end
        var myM = myLine.len * (1 - (i+X.t)/(myLine.n-1));
        var hisM = A.line.len * (1 - (j+X.u)/(A.line.n-1));
        // relative sliding speed at crossing = difference in line-feed rates + node motion
        var mv = {x:(myLine.p[i+1].x-myLine.pp[i+1].x)/dt, y:(myLine.p[i+1].y-myLine.pp[i+1].y)/dt};
        var av = {x:(A.line.p[j+1].x-A.line.pp[j+1].x)/dt, y:(A.line.p[j+1].y-A.line.pp[j+1].y)/dt};
        var slide=Math.hypot(mv.x-av.x,mv.y-av.y)+Math.abs(feedRate)+Math.abs(A.feedRate||0);
        var nf = Math.min(40,(myLine.tension+A.line.tension)*0.5);
        var work = slide*nf*dt;
        // grit removal both ways
        var mg = gritAt(myM), hg = A.grit[Math.min(A.grit.length-1,Math.floor(hisM/GSEG))]||0;
        wearAt(myM, work*0.0022);
        var hi=Math.min(A.grit.length-1,Math.floor(hisM/GSEG));
        A.grit[hi]=Math.max(0,A.grit[hi]-work*0.0022);
        // strength loss: your grit cuts HIM, his grit cuts YOU
        A.dmg=(A.dmg||0)+work*mg*0.0055;
        myDmg += work*hg*0.0055;
        // tension fatigue
        myDmg += Math.max(0,myLine.tension-34)*dt*0.02;
        A.dmg += Math.max(0,A.line.tension-34)*dt*0.02;
        contact={x:X.x,y:X.y,slide:slide,grit:Math.max(mg,hg),mine:mg,agent:A};
        if(A.dmg>1){ severAgent(A); return; }
        if(myDmg>1){ severMine(myM); return; }
      }
    }
  }
}
var myDmg=0;
var feedRate=0;

function severAgent(A){
  A.k.free=true; A.k.alive=true;
  A.line.free=true;
  A.dmg=0;
  A.relaunch = A.fights? 90 : 40;
  if(A===chorrillos){
    S.cut++;
    // she undercounts twice, on purpose, and never says so
    if(S.cut===3||S.cut===6) S.miscount=(S.miscount||0)+1;
    save();
    say("<em>THERE.</em> There it goes. Off it goes flat, look at it, it doesn't dive, it just leaves. That's "+Math.max(0,S.cut-(S.miscount||0))+" today, Cara'e Palo, and the children are already running for it.",4.6);
  }else{
    say("Ay — no. No no no, that was Señora Pinto's, she doesn't even fight. That one doesn't count.",3.4);
  }
  cutSound();
}
function severMine(m){
  if(!mine) return;
  mine.free=true;
  myLine.free=true;
  myDmg=0;
  S.lost++;
  // the line above the cut is GONE forever
  var lostM=Math.max(0,myLine.len-m);
  S.metres=Math.max(0,S.metres-myLine.len);
  save();
  cutSound();
  say("He got it. He got it he got it — <em>and</em> the line, that's the line down over the aerials again, that's my afternoon picking cotton out of somebody's television. Give me the other reel. In the bag. The <b>bag</b>.",5.2);
  setTimeout(nextSpoolOrEnd, 3200);
}
function cutSound(){
  if(!AC||!sndOn) return;
  var o=AC.createOscillator(); o.type="triangle";
  var gg=AC.createGain(); var T=AC.currentTime;
  o.frequency.setValueAtTime(900,T); o.frequency.exponentialRampToValueAtTime(120,T+0.3);
  gg.gain.setValueAtTime(0.07,T); gg.gain.exponentialRampToValueAtTime(0.0005,T+0.35);
  o.connect(gg); gg.connect(master); o.start(T); o.stop(T+0.4);
}

function nextSpoolOrEnd(){
  // is the current spool bald where it matters?
  var bald=true;
  for(var i=0;i<Math.min(40,S.grit.length);i++) if(S.grit[i]>0.12) bald=false;
  if(S.metres<10 || bald){
    S.spool++;
    if(S.spool>S.spools){ endAfternoon(); return; }
    S.pesos+=800;
    S.metres=120;
    S.grit=new Array(240); for(var j=0;j<240;j++) S.grit[j]=1;
    save();
    bagRustle();
    say("Right. Open it. Cut the tape with your thumb, don't use your teeth. That's another eight hundred pesos, and that's carrete "+S.spool+" of "+S.spools+", and after that there is no after that.",5.0);
  }
  makeMine(); myDmg=0;
}
function endAfternoon(){
  afternoonOver=true; mine=null; myLine=null;
  say("No. That's it. That spool is smooth as a shoelace for the first twenty metres and the rest of it might as well be in the sea. I'm not putting a kite on that. <b>$"+S.pesos+"</b> today, "+Math.max(0,S.cut-(S.miscount||0))+" of his down, and there's still wind, and it's still Saturday. Come down and hold the table, I want a completo. On the OTHER corner.",99);
  save();
}

/* ============ agents think ============ */
function agentStep(A,dt){
  if(A.k.free){
    A.k.step(dt,0,A.anchor);
    A.line.free=true;
    A.line.step(dt,null,false);
    A.relaunch-=dt;
    if(A.relaunch<=0 && A.k.y<-3 || A.relaunch<=0){
      if(A.relaunch<=0){
        A.k=new Kite(A.anchor.x+3,A.anchor.y+5,A.k.color,A.name);
        A.k.bow=A.fights?0.30:0.5;
        A.line=new Line(A.anchor,20,10,A.name);
        A.out=10; A.dmg=0;
        if(A.fights) say("He's up again. Ninety seconds, he doesn't rush, I'll give him that and nothing else.",3.0);
      }
    }
    return;
  }
  A.timer-=dt;
  if(A.timer<=0){
    if(A.fights){
      // real decision with real error
      var dx=(mine?mine.x:0)-A.k.x, dy=(mine?mine.y:0)-A.k.y;
      var near=Math.hypot(dx,dy)<9;
      var err=Math.random();
      if(near){
        // correct play is give line; he does it most of the time
        A.state = (err<0.62)?"give":"taut";
      }else{
        A.state = (err<0.7)?"taut":"give";
      }
      A.timer=0.5+Math.random()*1.1;
    }else{
      A.state=(Math.random()<0.75)?"taut":"give";
      A.timer=1.2+Math.random()*2.4;
    }
  }
  var taut = A.state==="taut";
  A.pull += ((taut?1:0)-A.pull)*dt*3;
  var want = taut ? Math.max(8,A.out-3*dt*6) : Math.min(34,A.out+4.5*dt*6);
  A.feedRate=(want-A.out)/dt;
  A.out=want;
  A.line.len=A.out;
  A.line.step(dt,A.k,taut);
  var tens = taut ? A.line.tension : A.line.tension*0.25;
  A.k.step(dt,tens,A.anchor);
  if(A.fights && Math.random()<dt*0.5){ A.k.steer += (Math.random()-0.5)*0.5; }
}

function drawRoof(){
  var y=H*0.86;
  g.fillStyle="#8f8b80"; g.fillRect(0,y,W,H-y);
  // tar patches
  g.fillStyle="rgba(60,56,52,.28)";
  g.beginPath(); g.ellipse(W*0.22,y+28,60,13,0.1,0,6.3); g.fill();
  g.beginPath(); g.ellipse(W*0.71,y+40,84,16,-0.06,0,6.3); g.fill();
  g.fillStyle="#9c4a2c"; g.fillRect(0,y-9,W,10);
  g.fillStyle="rgba(0,0,0,.14)"; g.fillRect(0,y+1,W,3);
  // wires
  g.strokeStyle="rgba(60,56,52,.45)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,y-46); g.quadraticCurveTo(W*0.5,y-30,W,y-52); g.stroke();
  // the spool on the parapet, cobalt cheeks
  var sx=W-64, sy=y+16;
  g.fillStyle="#1f4fa8";
  g.beginPath(); g.ellipse(sx,sy,15,15,0,0,6.3); g.fill();
  g.fillStyle="#c8bda3";
  g.beginPath(); g.ellipse(sx,sy,15*Math.max(0.15,S.metres/140),9,0,0,6.3); g.fill();
  g.fillStyle="#1f4fa8";
  g.fillRect(sx-30,sy+18,26,10);
}
function paperColour(k,edgeOn,through){
  var base = k.color==="fuchsia"?[226,53,123]:[242,196,0];
  var bl=[251,233,239], si=[90,58,69];
  var mix;
  if(through>0){
    var f=through;
    mix=[base[0]+(bl[0]-base[0])*f, base[1]+(bl[1]-base[1])*f, base[2]+(bl[2]-base[2])*f];
  }else{
    var f2=-through;
    mix=[base[0]+(si[0]-base[0])*f2, base[1]+(si[1]-base[1])*f2, base[2]+(si[2]-base[2])*f2];
  }
  return "rgb("+(mix[0]|0)+","+(mix[1]|0)+","+(mix[2]|0)+")";
}
function drawKite(k){
  if(!k||!k.alive) return;
  var p=proj(k.x,k.y);
  if(p[0]<-120||p[0]>W+120||p[1]<-120||p[1]>H+120) return;
  var scale=PPM*0.55;
  // sun behind/left-high: through-lighting depends on how edge-on we are to it
  var sun=Math.atan2(1,-0.55);
  var da=Math.atan2(Math.sin(k.head-sun),Math.cos(k.head-sun));
  var through=Math.cos(da*2)*0.9; // flips several times per rotation
  var fill=paperColour(k,0,through);
  var alpha= through>0 ? 0.82+0.18*through : 0.98;
  g.save();
  g.translate(p[0],p[1]); g.rotate(k.head+Math.PI/2);
  var w=scale*1.0, h=scale*1.15;
  var bowf=k.bow;
  g.globalAlpha=alpha;
  g.fillStyle=fill;
  g.beginPath();
  g.moveTo(0,-h*0.55);
  g.lineTo(w*0.5*(1-bowf*0.25),-h*0.06);
  g.lineTo(w*0.34,h*0.55);
  g.lineTo(-w*0.34,h*0.55);
  g.lineTo(-w*0.5*(1-bowf*0.25),-h*0.06);
  g.closePath(); g.fill();
  // spars show through when lit from behind
  if(through>0.05){
    g.globalAlpha=Math.min(0.9,0.25+through*0.8);
    g.strokeStyle="#5a3a45"; g.lineWidth=Math.max(0.8,scale*0.05);
    g.beginPath(); g.moveTo(0,-h*0.55); g.lineTo(0,h*0.55); g.stroke();
    g.beginPath();
    g.moveTo(-w*0.5*(1-bowf*0.25),-h*0.06);
    g.quadraticCurveTo(0,-h*0.06+bowf*h*0.42, w*0.5*(1-bowf*0.25),-h*0.06);
    g.stroke();
  }
  g.globalAlpha=1;
  g.restore();
}
function drawLine(L,ownGrit,agent){
  if(!L) return;
  g.lineWidth=1;
  for(var i=0;i<L.n-1;i++){
    var a=proj(L.p[i].x,L.p[i].y), b=proj(L.p[i+1].x,L.p[i+1].y);
    var m = L.len*(1-(i+0.5)/(L.n-1));
    var gr = ownGrit ? gritAt(m) : (agent? (agent.grit[Math.min(agent.grit.length-1,Math.floor(m/GSEG))]||0) : 0.4);
    // honest: hairline cotton grey, near invisible low down
    var hz = 1 - Math.min(1, Math.max(0,(b[1]-H*0.45)/(H*0.42)));
    g.strokeStyle="rgba(185,174,151,"+(0.20+0.42*hz)+")";
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    if(gr>0.18){
      // specular glint only where the coating remains
      var tw=0.35+0.65*Math.abs(Math.sin(t*7+i*1.9));
      g.strokeStyle="rgba(255,252,240,"+(gr*0.5*tw)+")";
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    }
  }
}
function drawBag(){
  var p=proj(bag.x,bag.y);
  var s=PPM*0.30;
  g.save(); g.translate(p[0],p[1]); g.rotate(bag.rot);
  g.fillStyle="rgba(28,26,26,.88)";
  g.beginPath();
  g.moveTo(-s,0);
  g.quadraticCurveTo(-s*0.3,-s*(0.8+0.4*Math.sin(t*6)), s*0.9,-s*0.2);
  g.quadraticCurveTo(s*0.4,s*0.7,-s*0.2,s*0.5);
  g.closePath(); g.fill();
  g.restore();
}

/* ============ loop ============ */
var last=performance.now()/1000;
var idleT=0, kiteChatter=0;
var introDone=false, bagCalled=false;

function frame(){
  var now=performance.now()/1000;
  var dt=Math.min(0.033, now-last); last=now;
  t+=dt;
  gustStep(dt);

  PPM = Math.min(W,H)/46;

  // ---- my control: pull decays toward zero, drag adds
  velY*=Math.pow(0.02,dt);
  pull += (Math.max(0,Math.min(1,velY*4)) - pull)*dt*7;
  if(!dragging) pull*=Math.pow(0.15,dt);

  if(mine && myLine && !mine.free){
    var taut = pull>0.28;
    var want;
    if(taut){ want = Math.max(6, myLine.len - (6+pull*10)*dt); }
    else { want = Math.min(Math.min(38,S.metres), myLine.len + 7*dt); }
    feedRate=(want-myLine.len)/dt;
    myLine.len=want;
    reelOut=want;
    myLine.step(dt, mine, taut);
    var tens = taut ? myLine.tension : myLine.tension*0.20;
    mine.step(dt, tens, anchor);
    if(mine.y<0.6 && mine.x<8 && mine.x>-8){ mine.y=0.6; }
  } else if(mine && mine.free){
    mine.step(dt,0,anchor);
    if(myLine){ myLine.free=true; myLine.step(dt,null,false); }
  }

  agentStep(chorrillos,dt);
  agentStep(neigh[0],dt);
  agentStep(neigh[1],dt);
  bagStep(dt);
  if(mine&&!mine.free) abrade(dt);

  // wear also from tension alone, tiny
  if(mine&&!mine.free&&myLine.tension>28) wearAt(1.5, dt*0.02);

  // ---- render
  skyGradient();
  drawCordillera();
  drawBuildings();
  drawBag();
  drawLine(neigh[0].line,false,neigh[0]); drawKite(neigh[0].k);
  drawLine(neigh[1].line,false,neigh[1]); drawKite(neigh[1].k);
  drawLine(chorrillos.line,false,chorrillos); drawKite(chorrillos.k);
  if(myLine) drawLine(myLine,true,null);
  if(mine) drawKite(mine);
  if(contact){
    var cp=proj(contact.x,contact.y);
    g.strokeStyle="rgba(255,255,250,"+(0.15+contact.grit*0.5)+")";
    g.lineWidth=1;
    g.beginPath(); g.arc(cp[0],cp[1],3+contact.slide*0.3,0,6.3); g.stroke();
  }
  drawRoof();
  drawBow();

  // ---- audio driving
  if(AC&&sndOn&&master){
    var T=AC.currentTime;
    var sp = mine? mine.airspeed : 0;
    var fl = mine? mine.flutter : 0;
    pap.g.gain.setTargetAtTime(Math.min(0.10, 0.006+sp*0.006+fl*0.05), T, 0.08);
    pap.f.frequency.setTargetAtTime(300+sp*180+(1-fl)*900, T, 0.08);
    pap.f.Q.value=0.6+fl*3;
    var tn = myLine? myLine.tension : 0;
    var len = myLine? myLine.len : 20;
    sing.o.frequency.setTargetAtTime(70+tn*7*(20/Math.max(6,len)), T, 0.06);
    sing.g.gain.setTargetAtTime(Math.min(0.05, tn*0.0016*(pull>0.28?1:0.15)), T, 0.09);
    sing.f.frequency.setTargetAtTime(400+tn*40, T, 0.1);
    var raspAmt = contact? Math.min(0.11, contact.slide*0.012) : 0;
    rasp.g.gain.setTargetAtTime(raspAmt, T, 0.03);
    rasp.f.frequency.setTargetAtTime(contact? (900+contact.grit*6500) : 2500, T, 0.05);
    reelN.g.gain.setTargetAtTime(Math.min(0.05,Math.abs(feedRate)*0.012), T, 0.04);
    reelN.f.frequency.setTargetAtTime(300+Math.abs(feedRate)*90, T, 0.05);
  }

  // ---- readout
  document.getElementById("spoolline").textContent = afternoonOver? "sin carrete" : ("carrete "+S.spool+" de "+S.spools);
  document.getElementById("metres").textContent = afternoonOver? "— m · $"+S.pesos : (Math.round(S.metres)+" m · $"+S.pesos);

  // ---- talk
  idleT+=dt;
  if(!introDone && t>1.2){
    introDone=true;
    say("Right — you have the spare reel? Good. Hold the bag flat, don't let it fill. Now: drag DOWN toward you and the line comes hard and it drives on whatever nose it's got. Let go and it goes soft and it spins. That's it. That's the whole thing, there's nothing else, sit down.",6.0);
  }
  if(!bagCalled && t>13){
    bagCalled=true;
    say("There — there, coming up off the lot, high one, is that his? Is that — no. No, that's a bag. That's a plastic bag off the empty lot, it's been up since the first gust. Forget it.",4.4);
    bagRustle();
  }
  if(introDone && bagCalled && t-lastSay>sayHold+2.4 && Math.random()<dt*0.9 && !afternoonOver){
    // situational barks
    var r=Math.random();
    if(mine && mine.y<6 && r<0.3){
      say("Low. You're low, that air over the roofline is filthy, it's all bits, that's why it's fighting you. Give it hilo and let it climb out of that.",3.6);
    } else if(chorrillos.k && mine && Math.hypot(chorrillos.k.x-mine.x,chorrillos.k.y-mine.y)<8 && r<0.6){
      say(["Now — cross him — <em>now I give it</em> — no, not yet. Not yet. NOW.",
           "He's hauling. He's hauling, look at him, he's doing the work for me. Give. Give. Keep giving.",
           "Don't pull into him. Don't. A fresh line and a hard pull and it's your line that goes."][Math.floor(Math.random()*3)],3.8);
    } else {
      bark("idle");
    }
  }
  if(afternoonOver && t-lastSay>40){ lastSay=t; }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* the count she keeps, and the two she leaves out */
try{
  console.log("cuts today (hers):", Math.max(0,(S.cut||0)-(S.miscount||0)), "— actual:", S.cut||0);
  console.log("the bag is not a kite. it was never a kite.");
}catch(e){}

save();
})();
</script>
