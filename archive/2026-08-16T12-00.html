  <meta name="outbox-spec-era" content="1968, right now — twenty past eleven on a Saturday night, second set, on the light platform at the back of a ballroom on Grand River Avenue in Detroit: two 750-watt overhead projectors running hot on a card table, a shoebox of made-up wet slides, a bottle of mineral oil, a bottle of denatured alcohol, and a coffee can of dirty rags. Not a look-back at 'the psychedelic era' and not a 'the ballrooms all closed' lament — the second set started nine minutes ago, the first slide is already cooking itself to mud, and the wall is forty feet wide.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the ballroom's back wall as the projector throws it: one enormous circle of light with a real optical soft edge, a rim of hot lamp-white bleeding to amber, and dark plaster in the corners outside the beam — no header, no caption, no counter, no title, no instructions, nothing to read anywhere. Inside that circle lives a genuine two-phase liquid: dozens of dye-loaded cells riding in oil between two curved clock glasses, and the visitor's cursor IS the pressure of a thumb on the top glass. Press and hold anywhere and the glasses squeeze at that point, splaying the cells outward in real time; drag to slide the top glass across the bottom one, shearing cells until they physically tear in two; roll the wheel to rotate the top glass and set the whole field turning against itself. Cells that touch coalesce for good. The lamp underneath is never off, and its heat is a live field that keeps the whole slide moving whether the visitor touches it or not.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of running a liquid wet slide on an overhead projector — that the whole effect is two liquids that refuse to mix, so the colour is not painted but held in discrete cells with real surface tension, and every shape on that wall is a boundary and not a brushstroke; that the dyes have to be chosen on opposite solubilities, one alcohol-soluble and one water-soluble, or the two colours simply merge into one brown and the slide is dead; that the glasses are curved on purpose, because a flat pair squeezes the liquid out to the edges and a shallow lens keeps it centred where the lamp is brightest; that the actual engine of the piece is the 750-watt lamp, whose heat boils the water phase from below and drives the convection you're watching, which is why a slide comes alive about a minute after you set it down and turns to sludge about eight minutes later; that pressure splays and shear tears, so squeezing gives you rounds and dragging gives you strings, and a torn cell never comes back the same size; that cells which touch merge permanently and a slide therefore gets simpler and coarser the whole night, never more complex; that you cannot get it all in focus, ever, because the liquid sits in a curved lens and the rim is always a different distance from the platen than the centre, so focusing the middle throws the edges soft and that softness is not a fault; and that colour here is subtractive, so red over green is not a third bright colour but a dark one, and three dyes on one slide is how beginners make mud. Literally glass, mineral oil, water, two dyes, and a hot bulb.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, SATURATED and RESTLESS — cells boiling up off the bottom of the frame, rounds bursting into strings under a drag, colours going hard and dark where they overlap, the whole field never once holding still. Explicitly NOT a lava lamp, NOT slow, NOT hypnotic, NOT meditative, NOT dreamy, NOT drifting, NOT soft-focus prettiness, NOT melancholy — this is a working light show at full lamp temperature, twenty past eleven, with somebody's thumb on the glass and the band already three songs into the set.">

  <meta name="outbox-spec-wildcard" content="There is a single human hair lying on the projector's stage, in the light path, permanently — thrown up onto the wall enormously magnified as a soft dark curve across the lower left of the disc, with its own honest focus offset (it sits on the platen, not in the liquid, so it is sharpest at exactly the focus setting where every dye cell is soft). It drifts a fraction only when the glasses are physically slid across it. It is never removed, never labelled, never explained, and it is there identically every visit.">

<style>
  html,body{margin:0;padding:0;height:100%;background:#160f0c;overflow:hidden;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;}
  #wall{position:fixed;inset:0;display:block;}
  /* plaster grain sits over everything outside the beam, and faintly inside it */
  #grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.34;
    background-image:url("https://images.unsplash.com/photo-1585314062340-f1a5a7c9328d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MTk0MTN8MHwxfHNlYXJjaHwxfHxwbGFpbnxlbnwxfHx8fDE3ODYwMTQwNTJ8MA&ixlib=rb-4.1.0&q=80&w=1080");
    background-size:cover;background-position:center;filter:contrast(1.25) brightness(.9);}
  /* the room's own dark, vignetting hard into the corners */
  #room{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 78% 78% at 50% 48%,rgba(22,15,12,0) 52%,rgba(22,15,12,.72) 78%,#160f0c 100%);}
  #arch{position:fixed;left:0;right:0;bottom:4px;text-align:center;font:400 9px/1.2 Georgia,'Times New Roman',serif;
    letter-spacing:.22em;text-transform:uppercase;z-index:5;}
  #arch a{color:rgba(242,166,58,.30);text-decoration:none;}
  #arch a:hover{color:rgba(255,244,220,.72);}

<body>
<canvas id="wall"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="room" aria-hidden="true"></div>
<div id="arch"><a href="/archive">the rest of the box</a></div>

<!--
  clock glasses, 4in, curved. mineral oil, light grade.
  scarlet goes in the alcohol. viridian goes in the water. never three.
  wipe the platen between slides or you get last set's cells in this one.
  the hair has been there since the Wednesday rehearsal. it's magnified about ninety times.
  hold anywhere = thumb on the top glass. drag = shear. wheel = spin the top glass.
  F or shift+wheel racks the focus. it will never all be sharp. that's the curve.
-->

<script>
(function(){
"use strict";
var cv=document.getElementById('wall'),g=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,CX=0,CY=0,R=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  CX=W/2; CY=H*0.475; R=Math.min(W,H)*0.455;
}
resize(); addEventListener('resize',resize);

// ---- dyes. two, on opposite solubilities. -------------------------------
// scarlet is alcohol-soluble. viridian is water-soluble. they do not mix.
// stored as subtractive densities (how much of each channel the dye eats).
var SCARLET={r:0.06,g:0.86,b:0.92};   // #e0271b-ish absorption
var VIRID  ={r:0.94,g:0.16,b:0.36};   // #0f9b7a-ish absorption

// ---- cells --------------------------------------------------------------
var cells=[],NODES=14,START=46;
var seed=20112368;
function rnd(){seed=(seed*1664525+1013904223)&0x7fffffff;return seed/0x7fffffff;}

function makeCell(x,y,area,phase,load){
  var c={x:x,y:y,vx:(rnd()-.5)*0.35,vy:(rnd()-.5)*0.35,
    area:area,phase:phase,load:load,
    spin:(rnd()-.5)*0.01,rot:rnd()*6.283,
    n:[],nv:[],heat:0,age:0,merged:0};
  for(var i=0;i<NODES;i++){c.n.push(1+(rnd()-.5)*0.16);c.nv.push(0);}
  return c;
}
function radiusOf(c){return Math.sqrt(c.area/Math.PI);}

function seedField(){
  cells.length=0;
  for(var i=0;i<START;i++){
    var a=rnd()*6.283, rr=Math.sqrt(rnd())*R*0.80;
    var alcohol = i%2===0;
    var area=(R*R)*(0.0011+rnd()*0.0034);
    cells.push(makeCell(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr,area,alcohol?0:1,
      alcohol?0.72+rnd()*0.28:0.66+rnd()*0.30));
  }
}
seedField();
addEventListener('resize',function(){ // keep the field, just re-centre it
  for(var i=0;i<cells.length;i++){var c=cells[i];
    c.x=Math.max(CX-R,Math.min(CX+R,c.x)); c.y=Math.max(CY-R,Math.min(CY+R,c.y));}
});

// ---- the thumb, the shear, the spin -------------------------------------
var press=false,px=0,py=0,ppx=0,ppy=0,shx=0,shy=0,glassRot=0,glassSpin=0;
var focus=0.30; // 0 = centre sharp / rim soft ... 1 = rim sharp / centre soft
var focusVel=0, fkey=false;

function pt(e){var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return {x:(t.clientX-r.left)*DPR,y:(t.clientY-r.top)*DPR};}
function down(e){var p=pt(e);press=true;px=ppx=p.x;py=ppy=p.y;}
function move(e){var p=pt(e);if(press){ppx=px;ppy=py;px=p.x;py=p.y;
  shx+= (px-ppx)*0.06; shy+=(py-ppy)*0.06;} else {px=p.x;py=p.y;}}
function up(){press=false;}
cv.addEventListener('mousedown',down); addEventListener('mousemove',move); addEventListener('mouseup',up);
cv.addEventListener('touchstart',function(e){e.preventDefault();down(e);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();move(e);},{passive:false});
addEventListener('touchend',up);
addEventListener('wheel',function(e){
  e.preventDefault();
  if(e.shiftKey||fkey){focusVel+= e.deltaY*0.00035;}
  else{glassSpin += e.deltaY*0.000035;}
},{passive:false});
addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){fkey=true;focusVel+=0.012;}
});
addEventListener('keyup',function(e){if(e.key==='f'||e.key==='F')fkey=false;});

// ---- the lamp's heat field ---------------------------------------------
// 750W under the platen. hottest dead centre, falls off to the rim.
function heatAt(x,y){
  var d=Math.hypot(x-CX,y-CY)/R;
  var h=Math.exp(-d*d*2.1);
  return h;
}

// ---- physics ------------------------------------------------------------
var t=0;
function step(dt){
  glassRot+=glassSpin; glassSpin*=0.965;
  shx*=0.90; shy*=0.90;
  focus+=focusVel; focusVel*=0.90;
  if(focus<0){focus=0;focusVel=0;} if(focus>1){focus=1;focusVel=0;}

  var i,j,c,d;
  for(i=0;i<cells.length;i++){
    c=cells[i]; c.age+=dt;
    var h=heatAt(c.x,c.y);
    c.heat += (h - c.heat)*0.06;

    // buoyant convection: water phase boils off the hot floor and climbs.
    // alcohol phase is lighter and lazier about it.
    var buoy = (c.phase===1? 1.35:0.85) * c.heat;
    c.vy -= buoy*0.62*dt*60/16;
    // and the cool rim drags it back down the sides
    var dx=c.x-CX, dy=c.y-CY, dr=Math.hypot(dx,dy)+0.001;
    var rimness=Math.min(1,dr/R);
    c.vy += rimness*rimness*0.72*dt*60/16;
    // turning: the top glass drags everything with it
    c.vx += (-dy/dr)*glassRot*dr*0.055;
    c.vy += ( dx/dr)*glassRot*dr*0.055;
    // shear from the drag, falling off with distance from the thumb
    var tdx=c.x-px, tdy=c.y-py, td=Math.hypot(tdx,tdy);
    var infl=Math.exp(-(td*td)/(R*R*0.10));
    c.vx += shx*infl*0.55; c.vy += shy*infl*0.55;

    // thumb pressure: the glasses squeeze, the cell splays outward
    var squeeze=0;
    if(press){
      squeeze = Math.exp(-(td*td)/(R*R*0.055));
      var pushx=(tdx/(td+1))*squeeze*2.6, pushy=(tdy/(td+1))*squeeze*2.6;
      c.vx+=pushx; c.vy+=pushy;
    }
    c.squeeze=squeeze;

    // curved glass: shallow lens holds the liquid at the middle
    c.vx += -dx*0.00055*(dr/R); c.vy += -dy*0.00055*(dr/R);

    // some jitter from the boil
    c.vx+=(rnd()-.5)*0.10*(0.3+c.heat);
    c.vy+=(rnd()-.5)*0.10*(0.3+c.heat);

    c.vx*=0.955; c.vy*=0.955;
    c.x+=c.vx; c.y+=c.vy;
    c.rot+=c.spin+glassRot*0.5;

    // wrap the boil: things that leave the top of the beam re-enter low
    if(dr>R*1.02){ var f=(R*1.02)/dr; c.x=CX+dx*f; c.y=CY+dy*f; c.vx*=-0.35; c.vy*=-0.35; }

    // --- boundary nodes: real surface tension, real deformation ---
    var rad=radiusOf(c);
    var speed=Math.hypot(c.vx,c.vy);
    var dirA=Math.atan2(c.vy,c.vx);
    var strain=0, maxN=0, minN=9;
    for(j=0;j<NODES;j++){
      var a=c.rot+(j/NODES)*6.283;
      // elongate along travel (shear stretches it into a string)
      var along=Math.cos(a-dirA);
      var target = 1 + along*along*Math.min(0.95,speed*0.30)
                     - (1-along*along)*Math.min(0.42,speed*0.16);
      // squeeze splays into rounds, fattening the near side
      if(c.squeeze>0.01){
        var sa=Math.atan2(tdy,tdx);
        target += Math.cos(a-sa)*c.squeeze*0.62 + c.squeeze*0.16;
      }
      // the boil ruffles the rim
      target += Math.sin(a*3+t*0.004+c.age)*0.05*c.heat;
      var k=0.055 + 0.035*(1/(1+c.area/(R*R*0.004))); // small cells hold tighter
      c.nv[j]+= (target-c.n[j])*k;
      c.nv[j]*=0.86;
      c.n[j]+=c.nv[j];
      if(c.n[j]<0.18)c.n[j]=0.18;
      if(c.n[j]>maxN)maxN=c.n[j];
      if(c.n[j]<minN)minN=c.n[j];
    }
    c.strain = maxN/Math.max(0.2,minN);
    c.rad=rad;
  }

  // --- tearing: strain across the long axis past threshold ---------------
  for(i=cells.length-1;i>=0;i--){
    c=cells[i];
    if(c.strain>3.5 && c.area>(R*R*0.00040) && cells.length<190){
      var dirB=Math.atan2(c.vy,c.vx);
      var half=c.area/2, off=radiusOf(c)*0.95;
      var a1=makeCell(c.x+Math.cos(dirB)*off,c.y+Math.sin(dirB)*off,half,c.phase,c.load);
      var a2=makeCell(c.x-Math.cos(dirB)*off,c.y-Math.sin(dirB)*off,half,c.phase,c.load);
      // torn halves are never the same size again
      var bias=0.30+rnd()*0.40;
      a1.area=c.area*bias; a2.area=c.area*(1-bias);
      a1.vx=c.vx+Math.cos(dirB)*0.7; a1.vy=c.vy+Math.sin(dirB)*0.7;
      a2.vx=c.vx-Math.cos(dirB)*0.7; a2.vy=c.vy-Math.sin(dirB)*0.7;
      cells.splice(i,1); cells.push(a1,a2);
    }
  }

  // --- boiling: a cell parked dead centre bursts into daughters ----------
  for(i=cells.length-1;i>=0;i--){
    c=cells[i];
    if(c.heat>0.90 && c.phase===1 && c.area>(R*R*0.0022) && rnd()<0.010 && cells.length<190){
      var n=3+((rnd()*3)|0), each=c.area/n;
      cells.splice(i,1);
      for(j=0;j<n;j++){
        var ang=(j/n)*6.283+rnd();
        var d2=makeCell(c.x+Math.cos(ang)*c.rad*0.8,c.y+Math.sin(ang)*c.rad*0.8,each,c.phase,c.load);
        d2.vx=c.vx+Math.cos(ang)*1.5; d2.vy=c.vy+Math.sin(ang)*1.5-0.6;
        cells.push(d2);
      }
    }
  }

  // --- coalescence: touching boundaries merge. permanently. -------------
  outer:
  for(i=0;i<cells.length;i++){
    for(j=i+1;j<cells.length;j++){
      var A=cells[i],B=cells[j];
      var ddx=B.x-A.x,ddy=B.y-A.y,dd=Math.hypot(ddx,ddy);
      if(dd < (A.rad+B.rad)*0.82){
        // same phase merges readily; opposite phases only under pressure
        var same = A.phase===B.phase;
        if(!same && !(press && Math.exp(-(Math.hypot(A.x-px,A.y-py)**2)/(R*R*0.05))>0.55)) continue;
        var tot=A.area+B.area;
        var nx=(A.x*A.area+B.x*B.area)/tot, ny=(A.y*A.area+B.y*B.area)/tot;
        var nc=makeCell(nx,ny,tot, same?A.phase : (A.area>B.area?A.phase:B.phase),
          (A.load*A.area+B.load*B.area)/tot);
        nc.vx=(A.vx*A.area+B.vx*B.area)/tot; nc.vy=(A.vy*A.area+B.vy*B.area)/tot;
        nc.merged=1;
        // opposite phases forced together give a dirtier load
        if(!same) nc.load=Math.min(1,nc.load*1.10);
        cells.splice(j,1); cells.splice(i,1); cells.push(nc);
        break outer;
      }
    }
  }
}

// ---- the projector optic ------------------------------------------------
// blur radius per cell: distance from whatever plane the focus knob is on.
// the liquid rides in a curved lens, so the rim sits further from the platen
// than the centre. one radius satisfied at a time. never all of it.
function blurOf(c){
  var d=Math.hypot(c.x-CX,c.y-CY)/R;             // 0 centre, 1 rim
  var plane = focus;                              // which radius is in focus
  var off = Math.abs(d - plane);
  return 1.2 + off*26 + c.heat*1.4;               // px, at DPR scale
}

// the hair sits ON the platen, not in the liquid. its focus offset is fixed
// well outside the liquid's range: sharpest exactly where every cell is soft.
function hairBlur(){ return 1.0 + Math.abs(focus-0.86)*34; }
var hairDrift=0;

// ---- render -------------------------------------------------------------
var buf=document.createElement('canvas'),bg=buf.getContext('2d');
function sizeBuf(){buf.width=W;buf.height=H;}
sizeBuf(); addEventListener('resize',sizeBuf);

function cellPath(ctx,c,scale){
  ctx.beginPath();
  var rad=radiusOf(c)*(scale||1);
  for(var j=0;j<=NODES;j++){
    var jj=j%NODES, a=c.rot+(jj/NODES)*6.283;
    var rr=rad*c.n[jj];
    var x=c.x+Math.cos(a)*rr, y=c.y+Math.sin(a)*rr;
    if(j===0)ctx.moveTo(x,y);
    else{
      var pj=(j-1)%NODES, pa=c.rot+(pj/NODES)*6.283, pr=rad*c.n[pj];
      var mx=(x + c.x+Math.cos(pa)*pr)/2, my=(y + c.y+Math.sin(pa)*pr)/2;
      ctx.quadraticCurveTo(c.x+Math.cos(pa)*pr,c.y+Math.sin(pa)*pr,mx,my);
    }
  }
  ctx.closePath();
}

function draw(){
  // 1. lamp field: blown-out white centre going warm at the rim
  g.fillStyle='#160f0c'; g.fillRect(0,0,W,H);
  var lamp=g.createRadialGradient(CX,CY-R*0.06,R*0.02,CX,CY,R*1.03);
  lamp.addColorStop(0,'#fffdf6');
  lamp.addColorStop(0.36,'#fff4dc');
  lamp.addColorStop(0.74,'#fbd48e');
  lamp.addColorStop(0.93,'#f2a63a');
  lamp.addColorStop(0.985,'#7a4a1c');
  lamp.addColorStop(1,'#160f0c');
  g.save();
  g.beginPath(); g.arc(CX,CY,R*1.005,0,6.283); g.clip();
  g.fillStyle=lamp; g.fillRect(0,0,W,H);

  // 2. the dye stack, composited subtractively.
  //    each cell multiplies the light behind it. red over green = brown.
  //    drawn in ascending blur so the sharp ones read on top.
  var sorted=cells.slice().sort(function(a,b){return blurOf(b)-blurOf(a);});
  g.globalCompositeOperation='multiply';
  for(var i=0;i<sorted.length;i++){
    var c=sorted[i];
    var bl=blurOf(c);
    var dye = c.phase===0?SCARLET:VIRID;
    // transmitted colour = white minus dye absorption × load
    var L=c.load*0.94;
    var rr=Math.round(255*(1-dye.r*L));
    var gg=Math.round(255*(1-dye.g*L));
    var bb=Math.round(255*(1-dye.b*L));

    g.save();
    g.filter='blur('+bl.toFixed(2)+'px)';

    // chromatic fringing: the lens can't hold two colours in one plane.
    // offset the cool channel a hair against the warm one, worse off-axis.
    var fr=(Math.hypot(c.x-CX,c.y-CY)/R)*bl*0.34;
    var fa=Math.atan2(c.y-CY,c.x-CX);
    var ox=Math.cos(fa)*fr, oy=Math.sin(fa)*fr;

    // warm channel
    g.translate(-ox*0.5,-oy*0.5);
    g.fillStyle='rgb('+rr+','+Math.min(255,gg+14)+','+Math.min(255,bb+22)+')';
    cellPath(g,c,1.0); g.fill();
    g.translate(ox,oy);
    // cool channel
    g.fillStyle='rgb('+Math.min(255,rr+18)+','+gg+','+bb+')';
    cellPath(g,c,0.985); g.fill();
    g.restore();

    // hot core: dense middle of a big cell reads darker still
    if(c.area>R*R*0.0016){
      g.save(); g.filter='blur('+(bl*1.5).toFixed(2)+'px)';
      g.fillStyle='rgb('+Math.round(rr*0.86)+','+Math.round(gg*0.86)+','+Math.round(bb*0.86)+')';
      cellPath(g,c,0.58); g.fill(); g.restore();
    }
  }

  // 3. the hair on the platen. it is in the light path, not in the liquid.
  g.save();
  g.globalCompositeOperation='multiply';
  g.filter='blur('+hairBlur().toFixed(2)+'px)';
  g.strokeStyle='rgba(52,34,22,0.80)';
  g.lineWidth=Math.max(2.2,R*0.0125);
  g.lineCap='round';
  var hx=CX-R*0.52+hairDrift, hy=CY+R*0.30;
  g.beginPath();
  g.moveTo(hx-R*0.30,hy-R*0.30);
  g.bezierCurveTo(hx-R*0.06,hy-R*0.02, hx+R*0.16,hy+R*0.24, hx+R*0.46,hy+R*0.16);
  g.stroke();
  g.restore();
  g.globalCompositeOperation='source-over';

  // 4. lamp hot spot bleeding back through everything
  g.globalCompositeOperation='screen';
  var hot=g.createRadialGradient(CX,CY-R*0.05,0,CX,CY,R*0.60);
  hot.addColorStop(0,'rgba(255,250,238,0.42)');
  hot.addColorStop(0.5,'rgba(255,236,196,0.16)');
  hot.addColorStop(1,'rgba(255,214,140,0)');
  g.fillStyle=hot; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='source-over';
  g.restore();

  // 5. the optical soft edge of the beam itself, and lamp flicker on the rim
  var flick=0.985+Math.sin(t*0.031)*0.006+Math.sin(t*0.113)*0.004;
  var edge=g.createRadialGradient(CX,CY,R*0.93,CX,CY,R*1.11*flick);
  edge.addColorStop(0,'rgba(22,15,12,0)');
  edge.addColorStop(0.30,'rgba(120,66,24,0.30)');
  edge.addColorStop(0.62,'rgba(40,24,16,0.86)');
  edge.addColorStop(1,'#160f0c');
  g.fillStyle=edge; g.fillRect(0,0,W,H);

  // 6. a stray spill of lamp light past the mirror, up and to the right
  g.globalCompositeOperation='screen';
  var spill=g.createRadialGradient(CX+R*0.85,CY-R*0.75,0,CX+R*0.85,CY-R*0.75,R*0.72);
  spill.addColorStop(0,'rgba(242,166,58,0.10)');
  spill.addColorStop(1,'rgba(242,166,58,0)');
  g.fillStyle=spill; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='source-over';
}

// ---- run ----------------------------------------------------------------
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt*1000;
  // the glasses sliding across the platen nudge the hair a fraction
  if(press) hairDrift += (shx*0.010);
  hairDrift = Math.max(-R*0.05,Math.min(R*0.05,hairDrift));
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// the slide only gets coarser. it never recovers. that is what a slide does.
})();
</script>
