  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE. The entire viewport is one pachinko playfield seen dead-on and life-size, edge to edge under glass — nothing else, no chrome, no header, no captions, no score. Roughly two hundred individually-placed brass pins in a staggered field, a few painted lacquer channels, three tulip catchers, and a drain lip along the bottom. You press and hold anywhere to draw the thumb flipper back against its spring (it visibly winds, the coil compressing), release to snap a chrome ball up the right-hand launch rail, and then the piece IS the fall: real per-ball rigid-body physics, honest restitution off every pin, balls ricocheting and stacking and jostling each other, dozens in flight at once if you flick fast. The whole page is the cascade of steel down a board of brass.">
  <meta name="outbox-spec-subject" content="The plain mechanics of a pachinko playfield — why the pins sit in a staggered offset grid so that no ball can ever fall straight through a clear column, why a difference of a hair's width at the top rail produces a completely different ball by the third row down, why the spring's compression decides which lane along the top the ball enters and therefore decides almost everything, why the tulips are positioned under the two densest pin clusters where the balls get bled of speed and drop nearly vertical, why two balls in the same channel behave nothing like one, and the ordinary fact that the overwhelming majority of balls simply reach the drain lip and go. Literally steel, brass, a coil spring, and gravity.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind on the page. The register lives entirely in the behaviour and sound of the board, and that register is LOUD, CLATTERING, GREEDY and CHEERFUL — a fast bright mechanical racket, steel on brass, hundreds of small hard collisions overlapping into something like rain on a tin roof, balls shouldering each other out of channels, the flipper spring twanging. Bright fluorescent mid-afternoon, busy, relentless, a bit gaudy. Explicitly NOT hypnotic, NOT meditative, NOT slow, NOT dreamlike, NOT melancholy — the board is a racket, not a trance.">

<body>
<canvas id="board" aria-label="A pachinko playfield: brass pins in a staggered offset grid, three enamel tulip catchers, a thumb flipper on a coil spring. Press and hold anywhere to wind the spring, release to fire a steel ball up the launch rail."></canvas>

<div id="vign"></div>
<footer><a href="/archive">other boards</a></footer>

<script>
/* ------------------------------------------------------------------
   HAND-FLIPPER BOARD No. 6
   Nagoya frame, brass pins set by hammer and eye, 1974.
   No electronics in here. Steel, brass, one coil spring, gravity.
   The pins are staggered so no column is ever clear top to bottom.
   Nothing is counted. Every ball ends at the drain lip.
   ------------------------------------------------------------------ */

(function(){
"use strict";

var cv = document.getElementById('board');
var ctx = cv.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);

var W=0,H=0;           // css pixels
var PIN_R=0, BALL_R=0; // scaled radii
var G=0;               // gravity px/s^2

/* ---------- world containers ---------- */
var pins = [];    // {x,y,r,ring, flash}
var balls = [];   // {x,y,vx,vy,r,m,spin,rot,alive}
var tulips = [];  // {x,y,w,open,anim,petal}
var rails = [];   // painted lacquer channel walls: {x1,y1,x2,y2,t}
var drainMouths = [];

/* ---------- audio: everything synthesised, no files ---------- */
var AC=null, master=null, humOsc=null, humGain=null, humFilt=null, convBus=null;
var audioReady=false;

function initAudio(){
  if(audioReady) return;
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  if(!AudioCtx) return;
  try{
    AC = new AudioCtx();
  }catch(e){ return; }
  master = AC.createGain();
  master.gain.value = 0.55;

  // a hard bright cabinet: tiny box reverb so ticks overlap into rain-on-tin
  var comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 12;
  comp.ratio.value = 6;
  comp.attack.value = 0.002;
  comp.release.value = 0.12;

  var conv = AC.createConvolver();
  var len = Math.floor(AC.sampleRate * 0.24);
  var buf = AC.createBuffer(2, len, AC.sampleRate);
  for(var c=0;c<2;c++){
    var d = buf.getChannelData(c);
    for(var i=0;i<len;i++){
      var t = i/len;
      d[i] = (Math.random()*2-1) * Math.pow(1-t, 4.2) * 0.6;
    }
  }
  conv.buffer = buf;
  var wet = AC.createGain(); wet.gain.value = 0.22;
  convBus = AC.createGain();
  convBus.connect(conv); conv.connect(wet); wet.connect(comp);
  convBus.connect(comp);
  master.connect(convBus);
  comp.connect(AC.destination);

  // launch rail hum — rises in strain as the coil compresses
  humOsc = AC.createOscillator();
  humOsc.type = 'sawtooth';
  humOsc.frequency.value = 62;
  var humOsc2 = AC.createOscillator();
  humOsc2.type='square'; humOsc2.frequency.value=93;
  humFilt = AC.createBiquadFilter();
  humFilt.type='bandpass'; humFilt.Q.value=5.5; humFilt.frequency.value=210;
  humGain = AC.createGain(); humGain.gain.value = 0.0001;
  humOsc.connect(humFilt); humOsc2.connect(humFilt);
  humFilt.connect(humGain); humGain.connect(master);
  humOsc.start(); humOsc2.start();

  audioReady = true;
}

var lastTickAt = 0, ticksThisFrame = 0;

/* steel-on-brass: pitch from pin size, gain & brightness from impact speed */
function tick(vel, pinR, x){
  if(!audioReady) return;
  if(ticksThisFrame > 7) return;
  ticksThisFrame++;
  var now = AC.currentTime;
  var v = Math.min(1, vel / 900);
  if(v < 0.035) return;

  var base = 1180 * (PIN_R / pinR);            // small pins ring higher
  var f = base * (0.86 + Math.random()*0.30) * (1 + v*0.34);
  f = Math.max(300, Math.min(7600, f));

  var o = AC.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f, now);
  o.frequency.exponentialRampToValueAtTime(f*0.55, now+0.045);

  var o2 = AC.createOscillator();
  o2.type = 'square';
  o2.frequency.setValueAtTime(f*2.71, now);   // inharmonic partial = metal, not tone
  o2.frequency.exponentialRampToValueAtTime(f*1.7, now+0.03);
  var g2 = AC.createGain();
  g2.gain.setValueAtTime(0.24*v, now);
  g2.gain.exponentialRampToValueAtTime(0.0001, now+0.035);

  // the strike transient: filtered noise burst
  var nb = AC.createBufferSource();
  var nlen = Math.floor(AC.sampleRate*0.03);
  var nbuf = AC.createBuffer(1,nlen,AC.sampleRate);
  var nd = nbuf.getChannelData(0);
  for(var i=0;i<nlen;i++){ nd[i]=(Math.random()*2-1)*Math.pow(1-i/nlen,7); }
  nb.buffer = nbuf;
  var nf = AC.createBiquadFilter();
  nf.type='highpass'; nf.frequency.value = 2200 + v*3000;
  var ng = AC.createGain();
  ng.gain.value = 0.20*v*v;

  var g = AC.createGain();
  var peak = 0.14 + 0.30*v*v;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(peak, now+0.0012);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.028 + 0.075*v);

  var pan = null;
  if(AC.createStereoPanner){
    pan = AC.createStereoPanner();
    pan.pan.value = Math.max(-0.9, Math.min(0.9, (x/W)*2-1));
  }

  o.connect(g); o2.connect(g2); g2.connect(g);
  nb.connect(nf); nf.connect(ng); ng.connect(g);
  if(pan){ g.connect(pan); pan.connect(master); } else { g.connect(master); }

  o.start(now); o.stop(now+0.16);
  o2.start(now); o2.stop(now+0.06);
  nb.start(now);
}

/* ball on ball: duller, lower, a shoulder rather than a ring */
function clack(vel,x){
  if(!audioReady) return;
  var v=Math.min(1,vel/800);
  if(v<0.10) return;
  var now=AC.currentTime;
  var o=AC.createOscillator();
  o.type='sine';
  var f=520*(0.8+Math.random()*0.5);
  o.frequency.setValueAtTime(f,now);
  o.frequency.exponentialRampToValueAtTime(f*0.4,now+0.05);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.16*v,now+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.06);
  o.connect(g);g.connect(master);
  o.start(now);o.stop(now+0.08);
}

/* the spring letting go */
function twang(power){
  if(!audioReady) return;
  var now=AC.currentTime;
  var o=AC.createOscillator();
  o.type='sawtooth';
  var f=140+power*130;
  o.frequency.setValueAtTime(f*2.4,now);
  o.frequency.exponentialRampToValueAtTime(f*0.7,now+0.13);
  var bp=AC.createBiquadFilter();
  bp.type='bandpass'; bp.Q.value=3.4;
  bp.frequency.setValueAtTime(1400+power*900,now);
  bp.frequency.exponentialRampToValueAtTime(340,now+0.16);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.20+0.14*power,now+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.20);
  o.connect(bp);bp.connect(g);g.connect(master);
  o.start(now);o.stop(now+0.24);
}

/* the drain lip swallowing one */
function drainSound(x){
  if(!audioReady) return;
  var now=AC.currentTime;
  var nb=AC.createBufferSource();
  var nlen=Math.floor(AC.sampleRate*0.16);
  var nbuf=AC.createBuffer(1,nlen,AC.sampleRate);
  var nd=nbuf.getChannelData(0);
  for(var i=0;i<nlen;i++){ nd[i]=(Math.random()*2-1)*Math.pow(1-i/nlen,2.4); }
  nb.buffer=nbuf;
  var f=AC.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(900,now);
  f.frequency.exponentialRampToValueAtTime(200,now+0.15);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.10,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
  nb.connect(f);f.connect(g);g.connect(master);
  nb.start(now);
}

/* petals snapping wide */
function petalSnap(){
  if(!audioReady) return;
  var now=AC.currentTime;
  var o=AC.createOscillator();
  o.type='square';
  o.frequency.setValueAtTime(340,now);
  o.frequency.exponentialRampToValueAtTime(880,now+0.05);
  o.frequency.exponentialRampToValueAtTime(520,now+0.12);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.15,now+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.19);
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=2.2; bp.frequency.value=900;
  o.connect(bp);bp.connect(g);g.connect(master);
  o.start(now);o.stop(now+0.22);
}

/* ------------------------------------------------------------------
   BOARD LAYOUT
   Pins are placed by hand into a staggered offset grid. The offset is
   the whole trick: alternate rows shift half a cell, so a ball that
   clears one pin is standing directly above the next. No clear column.
   ------------------------------------------------------------------ */

var RAIL_X = 0;      // the launch rail sits at the right edge
var RAIL_W = 0;
var DRAIN_Y = 0;
var railTopY = 0;

function layout(){
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  var S = Math.min(W,H);
  PIN_R  = Math.max(2.4, S*0.0072);
  BALL_R = Math.max(4.0, S*0.0148);
  G      = S * 2.15;

  RAIL_W = Math.max(16, S*0.052);
  RAIL_X = W - RAIL_W;
  DRAIN_Y = H - Math.max(34, H*0.085);

  pins.length=0; tulips.length=0; rails.length=0; drainMouths.length=0;

  var fieldL = W*0.045;
  var fieldR = RAIL_X - BALL_R*1.3;
  var fieldW = fieldR - fieldL;

  var topY = H*0.155;            // under the curved top rail
  var botY = DRAIN_Y - H*0.055;

  // spacing chosen so gaps are a hair over one ball wide: it fits, but only just
  var gap = BALL_R*2 + PIN_R*2 + Math.max(3, S*0.0125);
  var cols = Math.max(5, Math.round(fieldW/gap));
  var dx = fieldW/cols;
  var dy = dx * 0.80;
  var rows = Math.max(6, Math.floor((botY-topY)/dy));

  function addPin(x,y,r,ring){
    if(x < fieldL-dx*0.6 || x > fieldR+dx*0.6) return;
    pins.push({x:x,y:y,r:r||PIN_R,flash:0,ring:ring||0});
  }

  // --- the main staggered field ---
  for(var r=0;r<rows;r++){
    var y = topY + r*dy;
    var off = (r%2) ? dx*0.5 : 0;
    // a hand-set board is never perfect; the tap of the hammer wandered
    for(var c=0;c<=cols;c++){
      var x = fieldL + off + c*dx;
      var jx = (hash(r*97+c*13)-0.5)*dx*0.055;
      var jy = (hash(r*31+c*71)-0.5)*dy*0.075;
      // leave a thin lane down the far left for balls that hug the wall
      if(x < fieldL-1) continue;
      if(x > fieldR+1) continue;
      addPin(x+jx, y+jy, PIN_R*(0.93+hash(r*7+c*3)*0.16), r);
    }
  }

  // --- two dense clusters: the bleed zones, where speed dies ---
  // (a ball entering these leaves nearly vertical, which is why the
  //  tulips sit directly under them and nowhere else)
  var clusters = [
    {cx: fieldL + fieldW*0.285, cy: topY + dy*(rows*0.55)},
    {cx: fieldL + fieldW*0.715, cy: topY + dy*(rows*0.48)}
  ];
  for(var k=0;k<clusters.length;k++){
    var cl = clusters[k];
    var rr = Math.min(fieldW*0.115, dy*3.1);
    for(var a=0;a<3;a++){
      var count = 6 + a*4;
      var rad = rr*(0.34 + a*0.30);
      for(var i=0;i<count;i++){
        var th = (i/count)*Math.PI*2 + a*0.41 + k*0.2;
        var px = cl.cx + Math.cos(th)*rad;
        var py = cl.cy + Math.sin(th)*rad*0.86;
        if(px<fieldL||px>fieldR) continue;
        addPin(px,py,PIN_R*0.88,900+k);
      }
    }
  }

  // --- three tulip catchers ---
  var tW = BALL_R*2.35;
  var tys = clusters[0].cy + Math.min(fieldW*0.135, dy*3.6) + BALL_R*1.4;
  tulips.push(mkTulip(clusters[0].cx, tys, tW));
  tulips.push(mkTulip(clusters[1].cx, clusters[1].cy + Math.min(fieldW*0.135, dy*3.6) + BALL_R*1.4, tW));
  tulips.push(mkTulip(fieldL + fieldW*0.50, botY + dy*0.15, tW*1.06));

  // guard pins flanking each tulip mouth
  for(var t=0;t<tulips.length;t++){
    var tu = tulips[t];
    addPin(tu.x - tu.w*1.28, tu.y - BALL_R*1.7, PIN_R*1.05, 800);
    addPin(tu.x + tu.w*1.28, tu.y - BALL_R*1.7, PIN_R*1.05, 800);
  }

  // --- painted lacquer channels: hard walls that steer the fall ---
  var cy0 = topY + dy*1.6;
  rails.push(seg(fieldL - BALL_R*0.6, topY - dy*0.4, fieldL + fieldW*0.10, cy0 + dy*1.2));
  rails.push(seg(fieldR + BALL_R*0.6, topY - dy*0.4, fieldR - fieldW*0.10, cy0 + dy*1.2));
  rails.push(seg(fieldL + fieldW*0.36, topY + dy*0.15, fieldL + fieldW*0.44, topY + dy*1.5));
  rails.push(seg(fieldR - fieldW*0.36, topY + dy*0.15, fieldR - fieldW*0.44, topY + dy*1.5));
  // the two lower deflectors above the drain lip — they decide the last hop
  rails.push(seg(fieldL, DRAIN_Y - H*0.030, fieldL + fieldW*0.235, DRAIN_Y - H*0.004));
  rails.push(seg(fieldR, DRAIN_Y - H*0.030, fieldR - fieldW*0.235, DRAIN_Y - H*0.004));

  railTopY = H*0.085;
}

function seg(x1,y1,x2,y2){
  return {x1:x1,y1:y1,x2:x2,y2:y2,t:Math.max(3,PIN_R*1.05)};
}

function mkTulip(x,y,w){
  return {
    x:x, y:y, w:w, open:false, a:0, target:0,
    caught:0, flash:0
  };
}

function hash(n){
  var s = Math.sin(n*12.9898)*43758.5453;
  return s - Math.floor(s);
}

/* ------------------------------------------------------------------
   THE FLIPPER — a real coil spring at the bottom right.
   Hold to compress. Coil travel is visible. Release to fire.
   Launch velocity is honestly proportional to compression, which
   is to say: the entry lane along the top rail is under your thumb.
   ------------------------------------------------------------------ */

var flip = {
  held:false, t:0, comp:0, recoil:0, pressStart:0
};
var MAX_HOLD = 1.25; // seconds to full compression

function fire(power){
  // power 0..1 -> muzzle speed
  var S = Math.min(W,H);
  var speed = S*(2.02 + power*1.62);
  var x = RAIL_X + RAIL_W*0.5;
  var y = DRAIN_Y - BALL_R*1.2;
  balls.push({
    x:x, y:y,
    vx: -S*0.02*Math.random(),
    vy: -speed,
    r: BALL_R, m: 1,
    rot: Math.random()*6.28, spin:(Math.random()-0.5)*4,
    inRail:true, life:0, sleep:0
  });
  twang(power);
  flip.recoil = 1;
}

/* ------------------------------------------------------------------
   PHYSICS
   Semi-implicit Euler, substepped. Circle vs circle everywhere.
   Restitution off brass is high and bright; off lacquer, lower.
   Two balls in the same channel do not behave like one — that is
   entirely the ball-ball pass below, and it is why cascades jam.
   ------------------------------------------------------------------ */

var REST_PIN  = 0.56;
var REST_BALL = 0.30;
var REST_WALL = 0.42;
var FRICTION  = 0.9992;

// spatial hash for ball-ball
var grid = {};
function gkey(x,y,cs){ return ((x/cs)|0) + ',' + ((y/cs)|0); }

function step(dt){
  var i,j,b;
  // gravity + integrate
  for(i=0;i<balls.length;i++){
    b = balls[i];
    b.vy += G*dt;
    b.vx *= FRICTION; b.vy *= FRICTION;
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.rot += b.spin*dt;
    b.life += dt;
  }

  // --- launch rail: a narrow chute up the right edge, then the curved top ---
  for(i=0;i<balls.length;i++){
    b = balls[i];
    if(b.inRail){
      var lo = RAIL_X + b.r + 2, hi = W - b.r - 6;
      if(b.x < lo){ b.x = lo; b.vx = Math.abs(b.vx)*0.35; }
      if(b.x > hi){ b.x = hi; b.vx = -Math.abs(b.vx)*0.35; }
      b.vy += -G*0.06*dt; // rail is slick, marginal assist
      if(b.y < railTopY + b.r*2.2){
        b.inRail = false;
        // the curved top rail turns it left; how far left it gets
        // before the curve releases it is entirely the spring's doing
        b.vx = -Math.abs(b.vy)*0.90 - Math.min(W,H)*0.10;
        b.vy = Math.abs(b.vy)*0.16;
      }
      if(b.vy > 0 && b.y > DRAIN_Y - b.r*2){
        b.inRail = false; // dribbled — didn't clear the rail
      }
    }
  }

  // --- top curved rail (a hard arc across the head of the board) ---
  for(i=0;i<balls.length;i++){
    b = balls[i];
    if(b.inRail) continue;
    var arcY = topRailY(b.x);
    if(b.y - b.r < arcY){
      b.y = arcY + b.r;
      if(b.vy < 0){ b.vy = -b.vy*0.44; tick(Math.abs(b.vy)*1.1, PIN_R*1.4, b.x); }
    }
  }

  // --- side walls & drain ---
  for(i=balls.length-1;i>=0;i--){
    b = balls[i];
    if(!b.inRail){
      var wl = W*0.030 + b.r;
      var wr = RAIL_X - b.r - 2;
      if(b.x < wl){ b.x = wl; b.vx = Math.abs(b.vx)*REST_WALL; tick(Math.abs(b.vx),PIN_R*1.8,b.x); }
      if(b.x > wr){ b.x = wr; b.vx = -Math.abs(b.vx)*REST_WALL; tick(Math.abs(b.vx),PIN_R*1.8,b.x); }
    }
    if(b.y - b.r > H + 40){ balls.splice(i,1); continue; }
    // the drain lip: past it, gone. Nothing is counted.
    if(!b.inRail && b.y > DRAIN_Y + b.r*0.4 && !b.drained){
      b.drained = true;
      drainSound(b.x);
      splash(b.x, DRAIN_Y);
    }
  }

  // --- pins ---
  for(i=0;i<balls.length;i++){
    b = balls[i];
    if(b.inRail) continue;
    for(j=0;j<pins.length;j++){
      var p = pins[j];
      var ddx = b.x - p.x, ddy = b.y - p.y;
      var rsum = b.r + p.r;
      if(ddx>rsum||ddx<-rsum||ddy>rsum||ddy<-rsum) continue;
      var d2 = ddx*ddx+ddy*ddy;
      if(d2 >= rsum*rsum || d2 === 0) continue;
      var d = Math.sqrt(d2);
      var nx = ddx/d, ny = ddy/d;
      var pen = rsum - d;
      b.x += nx*pen; b.y += ny*pen;
      var vn = b.vx*nx + b.vy*ny;
      if(vn < 0){
        var imp = -(1+REST_PIN)*vn;
        b.vx += nx*imp; b.vy += ny*imp;
        // a hair of tangential scatter: no two strikes are the same
        var tx=-ny, ty=nx;
        var vt = b.vx*tx + b.vy*ty;
        var kick = (Math.random()-0.5)*Math.abs(imp)*0.11;
        b.vx += tx*kick; b.vy += ty*kick;
        b.spin += -vt*0.02;
        p.flash = 1;
        tick(-vn, p.r, b.x);
      }
    }
  }

  // --- lacquer channel walls (capsule collision) ---
  for(i=0;i<balls.length;i++){
    b = balls[i];
    if(b.inRail) continue;
    for(j=0;j<rails.length;j++){
      var s = rails[j];
      var ax=s.x1, ay=s.y1, bx=s.x2, by=s.y2;
      var abx=bx-ax, aby=by-ay;
      var L2 = abx*abx+aby*aby; if(L2===0) continue;
      var t = ((b.x-ax)*abx + (b.y-ay)*aby)/L2;
      t = t<0?0:(t>1?1:t);
      var cx2 = ax+abx*t, cy2 = ay+aby*t;
      var dx2 = b.x-cx2, dy2 = b.y-cy2;
      var rs = b.r + s.t;
      var dd2 = dx2*dx2+dy2*dy2;
      if(dd2 >= rs*rs || dd2===0) continue;
      var dd = Math.sqrt(dd2);
      var nx2 = dx2/dd, ny2 = dy2/dd;
      b.x += nx2*(rs-dd); b.y += ny2*(rs-dd);
      var vn2 = b.vx*nx2 + b.vy*ny2;
      if(vn2<0){
        var im2 = -(1+REST_WALL)*vn2;
        b.vx += nx2*im2; b.vy += ny2*im2;
        tick(-vn2*0.75, PIN_R*2.1, b.x);
      }
    }
  }

  // --- tulips ---
  for(i=0;i<tulips.length;i++){
    var tu = tulips[i];
    tu.a += (tu.target - tu.a)*Math.min(1, dt*11);
    if(tu.flash>0) tu.flash -= dt*3;
    var mouth = tu.w*(1 + tu.a*0.95);   // an open tulip is physically wider
    for(j=balls.length-1;j>=0;j--){
      b = balls[j];
      if(b.inRail || b.drained) continue;
      if(b.y > tu.y - b.r*0.9 && b.y < tu.y + b.r*1.9 &&
         Math.abs(b.x - tu.x) < mouth*0.94 && b.vy > 0){
        // swallowed. it goes down the back of the board and is gone.
        balls.splice(j,1);
        if(!tu.open){
          tu.open = true; tu.target = 1;
          petalSnap();
        }
        tu.flash = 1;
        tu.caught++;
        drainSound(tu.x);
        splash(tu.x, tu.y);
        continue;
      }
      // petal shoulders: hard edges the ball can ride
      var pw = mouth*1.02;
      for(var sgn=-1;sgn<=1;sgn+=2){
        var px2 = tu.x + sgn*pw;
        var py2 = tu.y - BALL_R*0.35 - tu.a*BALL_R*0.5;
        var ex = b.x-px2, ey = b.y-py2;
        var er = b.r + PIN_R*0.95;
        var e2 = ex*ex+ey*ey;
        if(e2 < er*er && e2>0){
          var ed=Math.sqrt(e2), enx=ex/ed, eny=ey/ed;
          b.x += enx*(er-ed); b.y += eny*(er-ed);
          var evn = b.vx*enx + b.vy*eny;
          if(evn<0){
            var eimp = -(1+0.48)*evn;
            b.vx += enx*eimp; b.vy += eny*eimp;
            tick(-evn*0.8, PIN_R*1.1, b.x);
          }
        }
      }
    }
  }

  // --- ball vs ball: this is why a crowd behaves nothing like one ---
  grid = {};
  var cs = BALL_R*2.6;
  for(i=0;i<balls.length;i++){
    b=balls[i];
    var k = gkey(b.x,b.y,cs);
    if(!grid[k]) grid[k]=[];
    grid[k].push(i);
  }
  for(i=0;i<balls.length;i++){
    b = balls[i];
    var gx=(b.x/cs)|0, gy=(b.y/cs)|0;
    for(var ox=-1;ox<=1;ox++)for(var oy=-1;oy<=1;oy++){
      var cell = grid[(gx+ox)+','+(gy+oy)];
      if(!cell) continue;
      for(var q=0;q<cell.length;q++){
        var jj = cell[q];
        if(jj<=i) continue;
        var o = balls[jj];
        var dx3=o.x-b.x, dy3=o.y-b.y;
        var rr3=b.r+o.r;
        if(dx3>rr3||dx3<-rr3||dy3>rr3||dy3<-rr3) continue;
        var d3=dx3*dx3+dy3*dy3;
        if(d3>=rr3*rr3||d3===0) continue;
        var dl=Math.sqrt(d3);
        var nx3=dx3/dl, ny3=dy3/dl;
        var pen3=(rr3-dl)*0.5;
        b.x-=nx3*pen3; b.y-=ny3*pen3;
        o.x+=nx3*pen3; o.y+=ny3*pen3;
        var rvx=o.vx-b.vx, rvy=o.vy-b.vy;
        var vn3=rvx*nx3+rvy*ny3;
        if(vn3<0){
          var im3=-(1+REST_BALL)*vn3*0.5;
          b.vx-=nx3*im3; b.vy-=ny3*im3;
          o.vx+=nx3*im3; o.vy+=ny3*im3;
          clack(-vn3, b.x);
        }
      }
    }
  }

  // pin flash decay
  for(j=0;j<pins.length;j++){ if(pins[j].flash>0) pins[j].flash -= dt*7.5; }
  // spark decay
  for(i=sparks.length-1;i>=0;i--){
    var sp=sparks[i];
    sp.t += dt;
    sp.x += sp.vx*dt; sp.y += sp.vy*dt; sp.vy += G*0.4*dt;
    if(sp.t>sp.life) sparks.splice(i,1);
  }
}

function topRailY(x){
  // a shallow arc across the head of the board; steeper toward the rail
  var u = x / W;
  return railTopY + (1-u)*(1-u)*H*0.020 + Math.pow(u,2.4)*H*0.012;
}

var sparks=[];
function splash(x,y){
  for(var i=0;i<5;i++){
    sparks.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*Math.min(W,H)*0.4,
      vy:-Math.random()*Math.min(W,H)*0.25,
      t:0, life:0.16+Math.random()*0.14
    });
  }
}

/* ------------------------------------------------------------------
   DRAWING — flat, hard, high contrast. No soft edges anywhere.
   ------------------------------------------------------------------ */

var lacquerPattern = null;

function buildLacquer(){
  var pc = document.createElement('canvas');
  pc.width = 64; pc.height = 64;
  var p = pc.getContext('2d');
  p.fillStyle = '#cf2a17';
  p.fillRect(0,0,64,64);
  // brushed lacquer grain, kept hard-edged
  for(var i=0;i<130;i++){
    var y = Math.random()*64;
    p.fillStyle = Math.random()<0.5 ? 'rgba(161,31,16,0.28)' : 'rgba(224,74,50,0.16)';
    p.fillRect(0, y, 64, Math.random()<0.7?1:2);
  }
  lacquerPattern = ctx.createPattern(pc,'repeat');
}

function draw(){
  // --- board face ---
  ctx.fillStyle = lacquerPattern || '#cf2a17';
  ctx.fillRect(0,0,W,H);

  // top zone above the rail: darker lacquer band
  ctx.fillStyle = '#a11f10';
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(W,0);
  ctx.lineTo(W, topRailY(W));
  for(var x=W;x>=0;x-=8) ctx.lineTo(x, topRailY(x));
  ctx.closePath(); ctx.fill();

  // hard brass line marking the top rail itself
  ctx.strokeStyle='#c99a2e'; ctx.lineWidth=Math.max(2,PIN_R*0.7);
  ctx.beginPath();
  ctx.moveTo(0, topRailY(0));
  for(var x2=0;x2<=W;x2+=6) ctx.lineTo(x2, topRailY(x2));
  ctx.stroke();
  ctx.strokeStyle='#6d5013'; ctx.lineWidth=Math.max(1,PIN_R*0.28);
  ctx.beginPath();
  ctx.moveTo(0, topRailY(0)+PIN_R*0.55);
  for(var x3=0;x3<=W;x3+=6) ctx.lineTo(x3, topRailY(x3)+PIN_R*0.55);
  ctx.stroke();

  // painted vermilion side margins (darker, the untouched lacquer)
  ctx.fillStyle='#8e1a0d';
  ctx.fillRect(0,0,W*0.030,H);
  ctx.fillStyle='#8e1a0d';
  ctx.fillRect(RAIL_X - Math.max(2,PIN_R*0.6), 0, Math.max(2,PIN_R*0.6), H);

  // --- the lower well and drain lip ---
  ctx.fillStyle = '#1c1310';
  ctx.fillRect(0, DRAIN_Y, W, H-DRAIN_Y);
  // the lip: a hard brass edge, then nothing
  ctx.fillStyle='#c99a2e';
  ctx.fillRect(0, DRAIN_Y-Math.max(2,PIN_R*0.55), W, Math.max(2,PIN_R*0.55));
  ctx.fillStyle='#6d5013';
  ctx.fillRect(0, DRAIN_Y, W, Math.max(1,PIN_R*0.35));
  // cut the mouths into the lip
  var mouthW = Math.max(BALL_R*3.2, W*0.10);
  var mouths = [W*0.235, W*0.5, RAIL_X*0.80];
  for(var m=0;m<mouths.length;m++){
    ctx.fillStyle='#120c0a';
    ctx.fillRect(mouths[m]-mouthW/2, DRAIN_Y-Math.max(2,PIN_R*0.55), mouthW, Math.max(4,PIN_R*1.5));
  }

  // --- lacquer channel walls ---
  for(var i=0;i<rails.length;i++){
    var s = rails[i];
    ctx.lineCap='butt';
    ctx.strokeStyle='#6d5013';
    ctx.lineWidth = s.t*2 + 2;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    ctx.strokeStyle='#c99a2e';
    ctx.lineWidth = s.t*2 - 1;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    ctx.strokeStyle='#f0d68a';
    ctx.lineWidth = Math.max(1, s.t*0.5);
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1-s.t*0.55); ctx.lineTo(s.x2, s.y2-s.t*0.55); ctx.stroke();
  }

  // --- tulips (drawn under balls) ---
  for(var t=0;t<tulips.length;t++) drawTulip(tulips[t]);

  // --- pins: brass, dead flat, one hard highlight, one hard shadow ---
  for(var p2=0;p2<pins.length;p2++){
    var pn = pins[p2];
    var r = pn.r;
    // shadow puddle on the lacquer, offset down-right, no blur
    ctx.fillStyle='rgba(90,16,8,0.55)';
    ctx.beginPath(); ctx.arc(pn.x+r*0.42, pn.y+r*0.52, r*1.02, 0, 6.2832); ctx.fill();
    // body
    ctx.fillStyle = '#6d5013';
    ctx.beginPath(); ctx.arc(pn.x, pn.y, r*1.06, 0, 6.2832); ctx.fill();
    ctx.fillStyle = pn.flash>0 ? '#f0d68a' : '#c99a2e';
    ctx.beginPath(); ctx.arc(pn.x, pn.y, r*0.86, 0, 6.2832); ctx.fill();
    // specular chip, upper left, hard
    ctx.fillStyle = '#f0d68a';
    ctx.beginPath(); ctx.arc(pn.x-r*0.30, pn.y-r*0.32, r*0.30, 0, 6.2832); ctx.fill();
    if(pn.flash>0){
      ctx.fillStyle='rgba(255,246,214,'+Math.min(0.85,pn.flash)+')';
      ctx.beginPath(); ctx.arc(pn.x, pn.y, r*1.7, 0, 6.2832); ctx.fill();
    }
  }

  // --- the launch rail chute ---
  drawRail();

  // --- balls: hard mirror steel ---
  for(var b2=0;b2<balls.length;b2++) drawBall(balls[b2]);

  // --- sparks off the drain and the tulip mouths ---
  ctx.fillStyle='#eef1f2';
  for(var sp=0;sp<sparks.length;sp++){
    var s2=sparks[sp];
    var a = 1 - s2.t/s2.life;
    ctx.globalAlpha = a*0.8;
    ctx.fillRect(s2.x-1, s2.y-1, 2.2, 2.2);
  }
  ctx.globalAlpha=1;

  // --- the flipper and its coil ---
  drawFlipper();
}

function drawBall(b){
  var r=b.r;
  // hard drop shadow on the board
  ctx.fillStyle='rgba(70,12,6,0.62)';
  ctx.beginPath(); ctx.arc(b.x+r*0.36, b.y+r*0.44, r*0.98, 0,6.2832); ctx.fill();
  // dark rim / underside pickup
  ctx.fillStyle='#2a3034';
  ctx.beginPath(); ctx.arc(b.x, b.y, r, 0,6.2832); ctx.fill();
  // body
  ctx.fillStyle='#8b9498';
  ctx.beginPath(); ctx.arc(b.x, b.y, r*0.90, 0,6.2832); ctx.fill();
  // the dark band a mirror ball always picks up from the well below
  ctx.fillStyle='#4d565a';
  ctx.beginPath();
  ctx.arc(b.x, b.y+r*0.30, r*0.68, 0, Math.PI);
  ctx.closePath(); ctx.fill();
  // specular blowout — one hard chip, fixed light, upper left
  ctx.fillStyle='#eef1f2';
  ctx.beginPath(); ctx.arc(b.x-r*0.33, b.y-r*0.36, r*0.31, 0,6.2832); ctx.fill();
  // a second smaller catch on the lower right (the lacquer reflecting up)
  ctx.fillStyle='#c9603f';
  ctx.beginPath(); ctx.arc(b.x+r*0.38, b.y+r*0.40, r*0.15, 0,6.2832); ctx.fill();
}

function drawTulip(tu){
  var open = tu.a;
  var mouth = tu.w*(1+open*0.95);
  var h = BALL_R*1.9;

  // the throat behind the petals
  ctx.fillStyle='#120c0a';
  ctx.fillRect(tu.x-tu.w*0.72, tu.y-h*0.10, tu.w*1.44, h*1.05);

  // brass sill
  ctx.fillStyle='#6d5013';
  ctx.fillRect(tu.x-mouth*1.15, tu.y+h*0.86, mouth*2.3, Math.max(2,PIN_R*0.7));

  for(var sgn=-1;sgn<=1;sgn+=2){
    var lean = open*0.62;
    var bx = tu.x + sgn*tu.w*0.62;
    var by = tu.y + h*0.88;
    var tx = tu.x + sgn*(tu.w*0.62 + mouth*0.62*lean + tu.w*0.30);
    var ty = tu.y - h*0.42 - open*BALL_R*0.35;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(bx - sgn*PIN_R*0.9, by);
    ctx.lineTo(tx - sgn*PIN_R*0.6, ty);
    ctx.lineTo(tx + sgn*PIN_R*1.5, ty + PIN_R*1.1);
    ctx.lineTo(bx + sgn*PIN_R*1.6, by);
    ctx.closePath();
    ctx.fillStyle = tu.flash>0 ? '#2fa669' : '#1f7a4d';
    ctx.fill();
    // hard enamel highlight along the inside edge
    ctx.strokeStyle='#5fd39a';
    ctx.lineWidth=Math.max(1,PIN_R*0.35);
    ctx.beginPath();
    ctx.moveTo(bx - sgn*PIN_R*0.6, by);
    ctx.lineTo(tx - sgn*PIN_R*0.3, ty);
    ctx.stroke();
    ctx.strokeStyle='#0e4a2c';
    ctx.lineWidth=Math.max(1,PIN_R*0.3);
    ctx.beginPath();
    ctx.moveTo(bx + sgn*PIN_R*1.4, by);
    ctx.lineTo(tx + sgn*PIN_R*1.3, ty + PIN_R*0.9);
    ctx.stroke();
    ctx.restore();

    // brass pivot rivet at the petal hinge
    ctx.fillStyle='#c99a2e';
    ctx.beginPath(); ctx.arc(bx, by-PIN_R*0.3, PIN_R*0.62,0,6.2832); ctx.fill();
    ctx.fillStyle='#f0d68a';
    ctx.beginPath(); ctx.arc(bx-PIN_R*0.2, by-PIN_R*0.5, PIN_R*0.22,0,6.2832); ctx.fill();
  }
}

function drawRail(){
  // the chute up the right edge, brass walled
  var x0 = RAIL_X, w = RAIL_W;
  ctx.fillStyle='#8e1a0d';
  ctx.fillRect(x0, 0, w, H);
  ctx.fillStyle='#120c0a';
  ctx.fillRect(x0+w*0.16, topRailY(x0)-6, w*0.68, DRAIN_Y - topRailY(x0)+8);
  // brass guide strips
  ctx.fillStyle='#c99a2e';
  ctx.fillRect(x0+w*0.13, topRailY(x0)-6, Math.max(2,PIN_R*0.55), DRAIN_Y - topRailY(x0)+8);
  ctx.fillRect(x0+w*0.84, topRailY(x0)-6, Math.max(2,PIN_R*0.55), DRAIN_Y - topRailY(x0)+8);
  ctx.fillStyle='#f0d68a';
  ctx.fillRect(x0+w*0.13, topRailY(x0)-6, Math.max(1,PIN_R*0.22), DRAIN_Y - topRailY(x0)+8);
  // the curve at the head, where the rail lets go to the left
  ctx.strokeStyle='#c99a2e';
  ctx.lineWidth=Math.max(2.5,PIN_R*0.8);
  ctx.beginPath();
  ctx.moveTo(x0+w*0.15, topRailY(x0)+2);
  ctx.quadraticCurveTo(x0+w*0.15, railTopY*0.55, x0-RAIL_W*1.5, railTopY*0.62);
  ctx.stroke();
}

function drawFlipper(){
  var cxp = RAIL_X + RAIL_W*0.5;
  var baseY = H - Math.max(16, H*0.030);
  var travel = Math.max(14, H*0.055);
  var c = flip.comp;
  var recoilPush = flip.recoil>0 ? -flip.recoil*travel*0.28 : 0;
  var headY = baseY - travel*1.15 + c*travel + recoilPush;

  // spring seat
  ctx.fillStyle='#120c0a';
  ctx.fillRect(cxp-RAIL_W*0.42, headY-4, RAIL_W*0.84, baseY-headY+10);

  // the coil — real travel, coils bunch as it compresses
  var coils = 7;
  var span = baseY - headY - 4;
  var pitch = span/coils;
  ctx.strokeStyle = '#8b9498';
  ctx.lineWidth = Math.max(2, RAIL_W*0.11);
  ctx.beginPath();
  for(var i=0;i<=coils*10;i++){
    var u=i/(coils*10);
    var yy = headY + 4 + u*span;
    var xx = cxp + Math.sin(u*coils*Math.PI*2)*RAIL_W*0.30;
    if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
  }
  ctx.stroke();
  ctx.strokeStyle='#eef1f2';
  ctx.lineWidth=Math.max(1, RAIL_W*0.04);
  ctx.beginPath();
  for(var i2=0;i2<=coils*10;i2++){
    var u2=i2/(coils*10);
    var yy2 = headY + 3 + u2*span;
    var xx2 = cxp + Math.sin(u2*coils*Math.PI*2)*RAIL_W*0.30 - RAIL_W*0.05;
    if(i2===0) ctx.moveTo(xx2,yy2); else ctx.lineTo(xx2,yy2);
  }
  ctx.stroke();

  // the thumb flipper head: a brass plate on a steel shaft
  ctx.fillStyle='#2a3034';
  ctx.fillRect(cxp-RAIL_W*0.12, headY-RAIL_W*0.4, RAIL_W*0.24, RAIL_W*0.55);
  ctx.fillStyle= flip.held ? '#f0d68a' : '#c99a2e';
  ctx.fillRect(cxp-RAIL_W*0.46, headY-RAIL_W*0.52, RAIL_W*0.92, RAIL_W*0.30);
  ctx.fillStyle='#6d5013';
  ctx.fillRect(cxp-RAIL_W*0.46, headY-RAIL_W*0.24, RAIL_W*0.92, RAIL_W*0.07);
  ctx.fillStyle='#f0d68a';
  ctx.fillRect(cxp-RAIL_W*0.42, headY-RAIL_W*0.50, RAIL_W*0.30, RAIL_W*0.08);

  // strain marks: hard brass ticks on the housing, filling as you wind
  var marks = 6;
  for(var k=0;k<marks;k++){
    var lit = c > (k+0.5)/marks;
    ctx.fillStyle = lit ? '#f0d68a' : '#5a3a12';
    ctx.fillRect(cxp+RAIL_W*0.48, baseY - 6 - k*(travel/marks*1.05), RAIL_W*0.22, Math.max(2,travel/marks*0.42));
  }
}

/* ------------------------------------------------------------------
   INPUT
   ------------------------------------------------------------------ */

function press(){
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume();
  if(flip.held) return;
  flip.held = true;
  flip.t = 0;
  if(audioReady && humGain){
    humGain.gain.cancelScheduledValues(AC.currentTime);
    humGain.gain.setTargetAtTime(0.030, AC.currentTime, 0.05);
  }
}

function release(){
  if(!flip.held) return;
  flip.held = false;
  var power = Math.min(1, flip.t/MAX_HOLD);
  // a hair's width at the top rail is the whole difference; keep it honest
  fire(power);
  flip.comp = flip.comp; // let it snap back in update()
  if(audioReady && humGain){
    humGain.gain.cancelScheduledValues(AC.currentTime);
    humGain.gain.setTargetAtTime(0.0001, AC.currentTime, 0.04);
  }
}

cv.addEventListener('pointerdown', function(e){ e.preventDefault(); press(); });
window.addEventListener('pointerup', function(e){ release(); });
window.addEventListener('pointercancel', function(){ release(); });
window.addEventListener('blur', function(){ release(); });
window.addEventListener('keydown', function(e){
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); press(); }
});
window.addEventListener('keyup', function(e){
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); release(); }
});
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ------------------------------------------------------------------
   LOOP
   ------------------------------------------------------------------ */

var last = 0;
var acc = 0;
var FIXED = 1/240;   // small fixed step: honest restitution off a 3mm pin
                     // needs a step small enough that nothing tunnels

function frame(ts){
  if(!last) last = ts;
  var dt = (ts-last)/1000;
  last = ts;
  if(dt > 0.09) dt = 0.09;

  ticksThisFrame = 0;

  // flipper spring state
  if(flip.held){
    flip.t += dt;
    var target = Math.min(1, flip.t/MAX_HOLD);
    flip.comp += (target - flip.comp)*Math.min(1, dt*9);
    if(audioReady && humFilt){
      // the rail hums harder the further the coil goes over
      humFilt.frequency.setTargetAtTime(190 + flip.comp*560, AC.currentTime, 0.05);
      humGain.gain.setTargetAtTime(0.020 + flip.comp*0.052, AC.currentTime, 0.06);
    }
  } else {
    flip.comp += (0 - flip.comp)*Math.min(1, dt*26);
    if(flip.recoil>0) flip.recoil -= dt*7;
    if(flip.recoil<0) flip.recoil=0;
  }

  acc += dt;
  var iter = 0;
  while(acc >= FIXED && iter < 24){
    step(FIXED);
    acc -= FIXED;
    iter++;
  }
  if(iter>=24) acc = 0;

  // keep the board from choking; oldest drained balls leave first
  if(balls.length > 210) balls.splice(0, balls.length-210);

  draw();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------
   BOOT
   ------------------------------------------------------------------ */

function boot(){
  layout();
  buildLacquer();
}
boot();

var resizeT=null;
window.addEventListener('resize', function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){
    var oldW=W, oldH=H;
    layout();
    buildLacquer();
    // move the balls with the board rather than dumping them
    for(var i=balls.length-1;i>=0;i--){
      balls[i].x *= W/(oldW||W);
      balls[i].y *= H/(oldH||H);
      balls[i].r = BALL_R;
      if(balls[i].y > H+40) balls.splice(i,1);
    }
  }, 140);
});

requestAnimationFrame(frame);

/* Three balls dropped in at the start so the board is never still.
   Nothing is being counted here. It never was. */
setTimeout(function(){
  for(var i=0;i<3;i++){
    (function(k){
      setTimeout(function(){
        var S=Math.min(W,H);
        balls.push({
          x: W*(0.22+k*0.24), y: railTopY+BALL_R*3,
          vx: (k-1)*S*0.10, vy: S*0.28,
          r: BALL_R, m:1, rot:0, spin:0, inRail:false, life:0
        });
      }, k*420);
    })(i);
  }
}, 700);

/* Board No. 6, hand-set. Pin spacing 11.2mm centre to centre,
   ball 11.0mm, which is the entire design: a ball fits between two
   pins with almost nothing to spare, and "almost nothing to spare"
   is a different number every single time it happens.
   Rows offset half a cell so there is no clear column anywhere.
   The tulips sit under the dense clusters because that is where a
   ball has been bled of sideways speed and arrives nearly vertical.
   Most balls do neither. Most balls reach the lip and go. */
if(window.console && console.log){
  console.log('%c 11.2mm centres. 11.0mm ball. ',
    'background:#cf2a17;color:#f0d68a;padding:3px 6px;font-weight:bold;');
  console.log('%c Hold longer, enter further left. Nothing is being scored. ',
    'background:#1c1310;color:#c99a2e;padding:3px 6px;');
}

})();
</script>
