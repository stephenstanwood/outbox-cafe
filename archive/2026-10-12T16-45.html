  <meta name="outbox-spec-era" content="A hot, bright afternoon in mid-July 1999, about ten past two, in the front window of a narrow sweet shop on the main street of Gränna, a small lakeside town on Vättern in southern Sweden that has made striped peppermint sticks by hand since the 1850s. Today the shop is at full summer pace. A long white marble slab sits right up against the plate glass so passers-by can watch, and a polished steel hook is bolted to the wall at shoulder height. A copper pot of boiled sugar has just been poured out onto the slab. It is already turning from clear amber to an opaque, glossy white as it is worked, and one small slab of it has been coloured red with the last of this morning's colouring. The puller has about four minutes before the sugar sets too hard to shape. Outside, a queue of cyclists, a coach party and a gang of kids with ice-cream cones are pressed three deep against the window, and the shop door is propped open with a wooden wedge.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: a wordless, edge-to-edge view through the shop window onto the marble slab and the steel hook, seen from the street side so the glass's faint reflection and fingerprints sit over everything. The whole page is one live rope of hot sugar. The visitor works it like the puller does. They drag the white mass up and loop it over the hook, then haul it out long and fold it back on itself, again and again, until it goes from glassy to satin. Then they lay the red strip along it and keep pulling, so every fold doubles the stripes into finer and finer bands. Finally they roll the rope out across the marble with both hands, twisting it into a long spiral stick that thins as it goes. A scraper chops the stick into lengths, and the lengths tumble into a growing heap of finished sticks along the bottom edge of the frame.">
  <meta name="outbox-spec-subject" content="The four-minute performance of turning one pour of boiled sugar into a heap of striped sticks before it sets. The piece covers the stretch, when a fat lump on the hook sags into a long glossy curtain and the light runs down it. It covers the fold, when two layers of red become four, then eight, then a stripe so fine it looks pink from across the street. It covers the twist, when a straight-striped rope suddenly becomes a barber's-pole spiral under rolling palms. It also covers the race against the cooling: early sugar droops and drips, late sugar cracks and kinks, and the best sticks come from the middle minute. Every batch comes out a little different. Some are fat with three bold stripes, some are pencil-thin with a hundred, and one or two always come out bent, which is the stick the kids at the window cheer for.">
  <meta name="outbox-spec-tone" content="Wordless and SHOWBOATING, like a candy-puller who knows there is a crowd at the glass and works a little faster and higher than strictly necessary for them. There is no narrator, no caption and no written sentence anywhere. The register lives in the swagger of the motion and in the sound. The sugar is slung over the hook with a big theatrical arc. Long pulls are a touch too long, and folds slap down with a satisfying smack. The street audio through the open door reacts like an audience: a rising 'ooooh' as a pull stretches longer than seems possible, laughter when a rope sags almost to the floor and is caught, and an approving murmur and a few claps as each stick is chopped. A bicycle bell rings, an ice-cream van's chime drifts past, and a gull complains somewhere over the lake. It should feel like being the twelve-year-old summer helper who has finally been allowed to pull the batch and is shamelessly playing to the window. It is quick, cocky, sticky and delighted, and it is never calm.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Polkagris peppermint red (#c8102e), the hard bright red of the colouring and of every stripe, used also for the dot of reflected red that slides along the steel hook. It sits on pulled-sugar satin white (#f8f3ea), which is used for the sugar rope, the marble slab and the street glare. The fresh pour starts as the white deepened toward a glassy translucent honey, made by the red laid very thin over the white, and it clears to opaque satin as it is worked, so you can watch the sugar change. The marble's veining, the hook, the scraper and the shadows under the rope are the red pushed down to a deep oxblood-brown (#3d0a12). Finely doubled stripes read as a true pink where the bands become too thin to separate. Fingerprints and breath-fog on the window are the white at low opacity. No other hues.">
  <meta name="outbox-spec-wildcard" content="A small child outside presses her nose and both palms flat against the window at the lower left. Her breath fogs a white patch on the glass that slowly grows and shrinks in time with her breathing, partly blurring the slab behind it, and her handprints stay on the glass after she shifts. Whenever a pull is long enough to sag nearly off the slab, the fog patch grows fast because she has gasped. Once per session, after a particularly finely striped stick is chopped, a small finger draws a lopsided heart in the fog, and it fades as the fog clears. Nothing ever explains her.">

const sSmack=()=>{burst(900,.12,1.4,'lowpass');tone(110,.1,.25,'sine',60)};
const sClack=()=>{tone(1300+Math.random()*300,.05,.12,'square',700);burst(3000,.04,.2,'highpass')};

const sGlug=()=>{for(let i=0;i<5;i++)tone(160+Math.random()*80,.16,.18,'sine',380+Math.random()*120,i*.17)};
const sChop=()=>{sClack();for(let i=0;i<5;i++)burst(2200,.05,.25+Math.random()*.2,'bandpass',.12+i*.07+Math.random()*.04);exc=Math.min(2,exc+.5)};
function sOoh(){tone(330,1,.07,'triangle',520);tone(500,1,.04,'sine',700,.05);exc=Math.min(2,exc+.4)}
function ambient(){
  if(!AC)return;const r=Math.random();
  if(r<.13){tone(2350,.5,.05,'sine');tone(2350,.5,.05,'sine',0,.14)}
  else if(r<.22){tone(1500,.5,.05,'sawtooth',900);tone(1400,.35,.04,'sawtooth',800,.35)}
  else if(r<.27){[523,659,784,659].forEach((f,i)=>tone(f,.4,.025,'sine',0,i*.38))}
}

/* ---------- setup ---------- */
function resize(){

  [cv,gl].forEach(c=>{c.width=W*DPR;c.height=H*DPR});
  slabY=H*.7;hook={x:W*.56,y:H*.22};
  strip.w=Math.max(54,W*.07);strip.h=14*sc+4;strip.x=W*.05;strip.y=H*.88;
  scr.w=Math.max(80,W*.14);scr.h=16*sc+6;scr.x=W*.82;scr.y=slabY+H*.07;
  buildBg();buildGlass();
  if(!rope.length)pour(true);
}
function buildBg(){
  bgc=document.createElement('canvas');bgc.width=W*DPR;bgc.height=H*DPR;const c=bgc.getContext('2d');c.scale(DPR,DPR);
  seed=11;
  let g=c.createLinearGradient(0,0,0,slabY);g.addColorStop(0,'#2a0509');g.addColorStop(1,'#5a1420');
  c.fillStyle=g;c.fillRect(0,0,W,H);

  for(let y=0;y<slabY;y+=ts){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  const rg=c.createRadialGradient(W*.7,H*.1,10,W*.7,H*.1,W*.7);rg.addColorStop(0,'rgba(248,243,234,.28)');rg.addColorStop(1,'rgba(248,243,234,0)');

  g=c.createLinearGradient(0,slabY-8,0,H);g.addColorStop(0,'#e9e1d2');g.addColorStop(.12,'#f8f3ea');g.addColorStop(1,'#efe7d8');
  c.fillStyle=g;c.fillRect(0,slabY-8,W,H);
  c.fillStyle='rgba(61,10,18,.55)';c.fillRect(0,slabY-10,W,4);
  c.fillStyle='rgba(248,243,234,.9)';c.fillRect(0,slabY-6,W,3);
  c.lineCap='round';
  for(let i=0;i<14;i++){
    c.strokeStyle='rgba(61,10,18,'+(.05+rnd()*.1)+')';c.lineWidth=.6+rnd()*2;
    const x=rnd()*W,y=slabY+rnd()*(H-slabY);c.beginPath();c.moveTo(x,y);
    c.bezierCurveTo(x+rnd()*200-60,y+rnd()*40-20,x+rnd()*300,y+rnd()*60-30,x+100+rnd()*300,y+rnd()*50-25);c.stroke();
  }

  const hx=hook.x,hy=hook.y;
  let pg=c.createRadialGradient(hx-4,hy-4,2,hx,hy,18*sc+6);pg.addColorStop(0,'#f8f3ea');pg.addColorStop(1,'#3d0a12');
  c.fillStyle=pg;c.beginPath();c.arc(hx,hy,16*sc+5,0,7);c.fill();
  c.strokeStyle='#3d0a12';c.lineWidth=2;c.stroke();
  const sg=c.createLinearGradient(hx-10,0,hx+30,0);sg.addColorStop(0,'#3d0a12');sg.addColorStop(.4,'#f8f3ea');sg.addColorStop(1,'#3d0a12');

function buildGlass(){

  for(let i=0;i<16;i++){
    const x=rnd()*W,y=H*.2+rnd()*H*.75,r=8+rnd()*12;
    for(let k=0;k<5;k++){gx.strokeStyle='rgba(248,243,234,'+(.05+rnd()*.04)+')';gx.lineWidth=1;gx.beginPath();gx.ellipse(x,y,r*(.3+k*.18),r*(.4+k*.2),.5,0,6.3);gx.stroke()}

function pour(first){
  th0=Math.min(.045*H,.05*W);r0=W*.0055;v0=th0*th0*r0;rope=[];
  for(let i=0;i<60;i++){const x=W*.16+i*r0,y=first?slabY-th0/2:slabY-th0-60*sc-i;rope.push({x,y,px:x,py:y,rest:r0,tw:0})}

  if(!first)sGlug();
}
const thk=n=>Math.min(Math.sqrt(v0/n.rest),.1*H);

/* ---------- actions ---------- */
function fold(){
  if(rope.length<6)return;
  if(laid)N=Math.min(N*2,4096);
  let x=rope[0].x;
  for(let i=1;i<rope.length;i++){const n=rope[i];n.rest*=.5;n.tw*=.5;x+=n.rest;n.x=x;n.y=slabY-thk(n)/2-26*sc-(rm?0:i*.3);n.px=n.x;n.py=n.y-2}
  rope[0].rest*=.5;work+=1.5;sSmack();exc=Math.min(2,exc+.3);
}
function layStrip(){if(laid||strip.used)return;laid=true;N=2;strip.used=true;work+=.5;sSmack()}
function rollAdd(dx){

  rope.length=n-m;
  sticks.push({cv:sp,cx:(x0+x1)/2-(x0-pad)-pad,x:W*(.12+.76*Math.random()),y:slabY,vy:0,ty:H-(14+Math.random()*.08*H)*Math.max(.6,sc),a:(Math.random()-.5)*(bendy?1.2:.6)});

/* ---------- physics ---------- */
function step(){
  const now=performance.now();T=Math.max(0,1-(now-t0)/240000);satin=Math.min(1,work/9);
  const n=rope.length,g=.5*sc*(rm?.45:1);
  if(keys.ArrowLeft)rollAdd(-7*sc);if(keys.ArrowRight)rollAdd(7*sc);
  let tx=ptr.x,ty=ptr.y;
  if(fling>0){grab=n-1;tx=hook.x+14*sc;ty=hook.y+8*sc;fling--;if(fling===0){grab=-1;fold()}}
  if(grab>=n)grab=-1;
  for(let i=1;i<n;i++){const a=rope[i];
    if(i===grab){a.x+=(tx-a.x)*.55;a.y+=(ty-a.y)*.55;a.px=a.x;a.py=a.y;continue}
    const vx=(a.x-a.px)*.97,vy=(a.y-a.py)*.97;a.px=a.x;a.py=a.y;a.x+=vx;a.y+=vy+g}

    if(d>a.rest*1.02&&T>.02){const add=(d-a.rest)*pl;a.rest+=add;if(grab>=0)work+=add/a.rest*.03}}
  for(let it=0;it<12;it++){
    for(let i=0;i<n-1;i++){const a=rope[i],b=rope[i+1];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.001,df=(d-a.rest)/d;
      const wa=i===0?0:(i===grab?0:1),wb=(i+1===grab)?0:1,ws=wa+wb;if(!ws)continue;
      a.x+=dx*df*wa/ws;a.y+=dy*df*wa/ws;b.x-=dx*df*wb/ws;b.y-=dy*df*wb/ws}
    for(let i=1;i<n;i++){const a=rope[i];if(i===grab)continue;const fy=slabY-thk(a)/2;if(a.y>fy){a.y=fy;a.px=a.x-(a.x-a.px)*.6}}
  }
  const bend=Math.max(0,Math.min(.95,(1-T)*1.2-.15));
  if(bend>0)for(let i=1;i<n-1;i++){const a=rope[i-1],b=rope[i+1],dm=(a.rest+rope[i].rest)*bend;let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||.001;
    if(d<dm){const k=(dm-d)/d*.15;if(i-1>0&&i-1!==grab){a.x-=dx*k;a.y-=dy*k}if(i+1!==grab){b.x+=dx*k;b.y+=dy*k}}}
  rope[0].x=rope[0].px=W*.16;rope[0].y=rope[0].py=slabY-thk(rope[0])/2;
  if(T<=0&&!pourPending){sCrack();rope.length=Math.min(rope.length,4);endPour()}
  // sound mods
  exc*=.995;rollMag*=.9;
  let L=0;for(let i=0;i<rope.length-1;i++)L+=Math.hypot(rope[i+1].x-rope[i].x,rope[i+1].y-rope[i].y);
  const lr=L/(60*r0);oohCd--;
  if(lr>1.9&&oohCd<=0&&grab>=0){oohCd=240;sOoh()}
  exc=Math.min(2,exc+(lr>1.5?.002:0));
  if(AC){const t=AC.currentTime;
    crowdG.gain.setTargetAtTime(.04+exc*.07,t,.2);
    creakG.gain.setTargetAtTime(tens*.05,t,.05);creakO.frequency.setTargetAtTime(150+tens*450,t,.05);
    rollG.gain.setTargetAtTime(rollMag*.5,t,.04)}
}

/* ---------- drawing ---------- */
function drawChain(c,P,Nb,sat,isRope){
  const hon=1-sat,wc=mix(WH,R,.14*hon),wa=(.62+.38*sat).toFixed(2),pink=mix(WH,R,.45);
  if(isRope){ // shadow
    c.strokeStyle='rgba(61,10,18,.28)';c.lineCap='round';c.lineJoin='round';
    for(let i=0;i<P.length-1;i++){const p=P[i],q=P[i+1];c.lineWidth=(p.h+q.h)*1.1;c.beginPath();c.moveTo(p.x+3,p.y+p.h*.7+4);c.lineTo(q.x+3,q.y+q.h*.7+4);c.stroke()}
  }
  for(let i=0;i<P.length-1;i++){
    const p=P[i],q=P[i+1];let dx=q.x-p.x,dy=q.y-p.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const nx=-dy,ny=dx,hm=Math.max(p.h,q.h),K=Math.max(3,Math.min(26,Math.ceil(hm*2/1.7))),twm=(p.tw+q.tw)/2,bw=4*hm/Nb;
    for(let j=0;j<K;j++){
      const u0=-1+2*j/K,u1=Math.min(1,-1+2*(j+1)/K+.05),uc=(u0+u1)/2;
      let col;
      if(Nb<=1)col=wc;
      else if(bw<1.6)col=pink;
      else{let fr=(Math.asin(uc)+twm)/(Math.PI*2);fr-=Math.floor(fr);col=(Math.floor(fr*Nb)%2)?R:wc}
      const sh=.34*Math.pow((uc+1)/2,1.6);
      c.fillStyle=rgba(mix(col,OX,sh),wa);
      c.beginPath();
      c.moveTo(p.x+nx*u0*p.h,p.y+ny*u0*p.h);c.lineTo(q.x+nx*u0*q.h,q.y+ny*u0*q.h);
      c.lineTo(q.x+nx*u1*q.h,q.y+ny*u1*q.h);c.lineTo(p.x+nx*u1*p.h,p.y+ny*u1*p.h);c.closePath();c.fill();
    }
  }
  // gloss line
  c.strokeStyle='rgba(255,252,246,'+(.55-.25*sat)+')';c.lineWidth=2;c.lineCap='round';c.beginPath();
  for(let i=0;i<P.length;i++){const p=P[i],q=P[Math.min(P.length-1,i+1)],o=P[Math.max(0,i-1)];let dx=q.x-o.x,dy=q.y-o.y;const d=Math.hypot(dx,dy)||1;
    const x=p.x+(dy/d)*p.h*.55,y=p.y-(dx/d)*p.h*.55;i?c.lineTo(x,y):c.moveTo(x,y)}
  c.stroke();
}
let tm=0;
function draw(){
  tm+=.016;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.drawImage(bgc,0,0,W,H);
  // red dot sliding on hook
  const u=.5+.5*Math.sin(tm*.9+ptr.x*.004),ang=Math.PI-u*Math.PI*.85,hx=hook.x+14*sc+Math.cos(ang)*14*sc,hy=hook.y+22*sc+Math.sin(ang)*14*sc;
  cx.fillStyle='#c8102e';cx.beginPath();cx.arc(hx,hy,2.8*sc+1,0,7);cx.fill();
  // red strip
  if(!strip.used){
    const sx=strip.drag?ptr.x-strip.w/2:strip.x,sy=strip.drag?ptr.y-strip.h/2:strip.y;
    cx.fillStyle='rgba(61,10,18,.3)';cx.fillRect(sx+3,sy+4,strip.w,strip.h);
    cx.fillStyle='#c8102e';cx.fillRect(sx,sy,strip.w,strip.h);
    cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(sx,sy+2,strip.w,2);
  }
  // rope
  const P=rope.map(n=>({x:n.x,y:n.y,h:thk(n)/2,tw:n.tw}));
  if(P.length>1)drawChain(cx,P,N,satin,true);
  if(hinted&&P.length){const l=P[P.length-1],r=l.h+8+4*Math.sin(tm*5);cx.strokeStyle='rgba(248,243,234,.8)';cx.lineWidth=2;cx.beginPath();cx.arc(l.x,l.y,r,0,7);cx.stroke()}
  // scraper
  scr.a=Math.max(0,scr.a-.07);const off=Math.sin(scr.a*Math.PI)*22*sc;
  cx.save();cx.translate(scr.x,scr.y+off);
  cx.fillStyle='rgba(61,10,18,.25)';cx.fillRect(4,scr.h+2,scr.w,5);
  const bg=cx.createLinearGradient(0,0,0,scr.h);bg.addColorStop(0,'#f8f3ea');bg.addColorStop(1,'#3d0a12');
  cx.fillStyle=bg;cx.fillRect(0,0,scr.w,scr.h);
  cx.fillStyle='#3d0a12';cx.fillRect(scr.w*.3,-scr.h*1.1,scr.w*.4,scr.h*1.1);cx.restore();
  // sticks
  for(const s of sticks){
    if(s.y<s.ty){s.vy+=.9*sc;s.y+=s.vy;if(s.y>=s.ty){s.y=s.ty;if(s.vy>4)sClack();s.vy=0}}
    cx.save();cx.translate(s.x,s.y);cx.rotate(s.a);cx.scale(.7,.7);cx.drawImage(s.cv,-s.cv.width/2,-s.cv.height/2);cx.restore();
  }
}
function loop(){step();draw();requestAnimationFrame(loop)}

/* ---------- input ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
  initAudio();const p=pos(e);ptr.x=p.x;ptr.y=p.y;ptr.lx=p.x;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(!strip.used&&p.x>strip.x-10&&p.x<strip.x+strip.w+10&&p.y>strip.y-10&&p.y<strip.y+strip.h+10){strip.drag=true;return}
  if(p.x>scr.x&&p.x<scr.x+scr.w&&p.y>scr.y-scr.h*1.2&&p.y<scr.y+scr.h+10){chop();return}
  let best=-1,bd=1e9;
  for(let i=1;i<rope.length;i++){const d=Math.hypot(rope[i].x-p.x,rope[i].y-p.y);if(d<bd){bd=d;best=i}}
  if(best>0&&bd<Math.max(thk(rope[best])*.9,32*sc)){grab=best;hinted=false;ptr.mode=1}
  else ptr.mode=2;
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);ptr.x=p.x;ptr.y=p.y;
  if(ptr.mode===2&&p.y>slabY-40*sc){rollAdd(p.x-ptr.lx)}
  ptr.lx=p.x;
});
function up(){
  if(strip.drag){strip.drag=false;let near=false;for(const n of rope)if(Math.hypot(n.x-ptr.x,n.y-ptr.y)<thk(n)+30*sc){near=true;break}if(near)layStrip()}
  if(grab>=0&&fling===0){const n=rope[grab];if(n&&Math.hypot(n.x-hook.x,n.y-hook.y)<90*sc)fold();grab=-1}
  ptr.mode=0;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='Space'){e.preventDefault();if(!fling&&rope.length>6){fling=36;hinted=false}}
  else if(e.key==='f'||e.key==='F')fold();
  else if(e.key==='c'||e.key==='C')chop();
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();keys[e.key]=true}
});
addEventListener('keyup',e=>{keys[e.key]=false});
addEventListener('resize',resize);
resize();
// a lazy layer of red already waiting for anyone who skips the strip
console.log('the middle minute makes the best ones');
loop();
})();
</script>
