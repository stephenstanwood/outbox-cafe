  <meta name="outbox-spec-era" content="Present-tense, right-now — a brand-new tin-and-cardboard kaleidoscope off the spinner rack at a science-museum gift shop, the seam of its barrel still crisp, the mirrors inside still perfectly clean, the object-cell at the far end loaded at the factory this spring with a loose rattle of colored glass chips and beads; not a childhood relic, not a great-aunt's attic find, not a nostalgia object — a cheap wonderful working toy you could buy for six dollars this afternoon and put to your eye on the walk out to the car.">
  <meta name="outbox-spec-format" content="The entire viewport IS the view down the eyepiece of a kaleidoscope — one live sixfold-mirror-symmetric mandala filling a black circular field, edge to edge — built by genuinely reflecting a single small object-cell through six mirrored wedges every frame. Inside that cell a loose scatter of colored glass chips, faceted beads, and slivers of foil tumble under real 2D gravity, sliding and stacking and settling; the six-way reflection turns whatever they happen to form into a blooming symmetric flower of light that re-composes continuously and never once repeats. The dark barrel-vignette rings the field. No page chrome, no header, no menu, no captions, no controls, no text anywhere except one tiny engraved line on the brass eyepiece-rim.">
  <meta name="outbox-spec-subject" content="The plain optical wonder of a kaleidoscope: the way three mirrors and a fistful of loose junk conspire to throw a perfect six-petalled jewel-flower onto your eye, and how a hair's-breadth turn of the barrel spills the whole flower apart and settles a brand-new one that has never existed before and will never exist again. The honest physics of it — the glass chips are just falling, sliding, and heaping in the little wedge-shaped cell, obeying gravity and nothing else, and it is only the mirrors that make the tumbling rubbish gorgeous. Not a metaphor for anything, not a meditation, not a symbol of impermanence or pattern-in-chaos — literally a tube, three mirrors, and a rattle of colored glass, and the endlessly re-forming symmetric bloom that falls out of turning it.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the single tiny engraved tally on the brass rim — the tone is purely the wordless, leaning-in delight of a kid at the eyepiece giving the barrel one more turn just to spill the flower and watch a fresh one settle: greedy to see the next bloom, tickled when the glass heaps into a dense packed rose and thrilled when one turn scatters it into an open airy star. The tumbling is treated as a plain physical pleasure and a genuine visual thrill, not reverent, not hushed, not precious, not a slow-down-and-breathe register. The closest thing to a voice is the glass's own busy refusal to ever settle into the same flower twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Deep velvet eyepiece-black (#0a0910) for the surrounding barrel-vignette and the gaps between the chips, lit by a tumbling jewel-box of glass — ruby (#cf2d40), cobalt (#2a58c0), emerald (#1f9160), warm amber (#e8a72e), and amethyst (#7d43a8) — each chip carrying a hard specular pinpoint highlight where the light catches its facet, the six mirror-seams throwing faint bright axes across the mandala — the exact glowing hard-edged look of colored glass heaped bright against black down the tube of a cheap kaleidoscope held up to a window.">
  <meta name="outbox-spec-wildcard" content="Exactly one object loose in the cell is not glass at all — a single fingernail-sized snipped corner of a child's crayon drawing, a scrap of waxy paper with two crayon strokes and one letter on it, mixed in at the factory by mistake — and it tumbles with all the chips like any other, catching the six-way reflection into the flower whenever the tumble happens to carry it into view. Nothing on the page ever points it out, names it, treats it differently, or explains how a bit of a kid's picture ended up in a kaleidoscope; it is simply there among the glass for whoever turns the barrel long enough to catch it blooming.">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One More Turn of the Barrel</title>
<meta name="description" content="Put your eye to the tube and give it a turn.">
<!-- three mirrors, a fistful of glass. drag to spill the flower, space to flick the barrel. -->
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center;
        -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  .barrel{
    width:96vmin; height:96vmin; position:relative; touch-action:none; cursor:grab;
    box-shadow:0 12px 46px rgba(0,0,0,.85);
  }
  .barrel.dragging{ cursor:grabbing; }
  .rim{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from -20deg,
      #5f4a1e,#d7b877,#8a6a2c,#f4dc9a,#7a5c26,#c9a75d,#5f4a1e,#e6ca86,#6b5220,#d7b877,#5f4a1e);
    box-shadow:inset 0 0 14px rgba(0,0,0,.6);
  }
  .field{
    position:absolute; inset:3.6%; border-radius:50%; overflow:hidden; background:#0a0910;
    box-shadow:inset 0 0 0 2px rgba(20,14,4,.9), inset 0 0 26px rgba(0,0,0,.95);
  }
  .field canvas{ display:block; width:100%; height:100%; }
  .vig{
    position:absolute; inset:3.6%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      rgba(10,9,16,0) 52%, rgba(10,9,16,.35) 74%, rgba(10,9,16,.82) 90%, #05040a 100%);
  }
  svg.rimtext{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .eng{ font-family:Georgia,"Times New Roman",serif; font-size:19px; letter-spacing:5px; font-weight:600; }
  .eng.sh{ fill:#2a2008; }
  .eng.mn{ fill:#ecd189; }
  .rimlink{
    position:absolute; left:50%; bottom:0.35%; transform:translateX(-50%);
    font-family:Georgia,"Times New Roman",serif; font-size:1.5vmin; letter-spacing:.34em;
    color:#dcc07b; text-decoration:none; opacity:.66; pointer-events:auto;
    text-shadow:0 1px 0 #241b06; white-space:nowrap;
  }
  .rimlink:hover{ opacity:1; }
</style>
</head>
<body>
  <div class="barrel" id="barrel" aria-label="kaleidoscope">
    <div class="rim"></div>
    <div class="field" id="field"><canvas id="cv"></canvas></div>
    <div class="vig"></div>
    <svg class="rimtext" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs><path id="toparc" d="M 66,500 A 434,434 0 0 0 934,500"/></defs>
      <text class="eng sh" transform="translate(0,2)"><textPath xlink:href="#toparc" href="#toparc" startOffset="50%" text-anchor="middle" id="tallyShadow">TURNS OF THIS BARREL: 0000</textPath></text>
      <text class="eng mn"><textPath xlink:href="#toparc" href="#toparc" startOffset="50%" text-anchor="middle" id="tallyMain">TURNS OF THIS BARREL: 0000</textPath></text>
    </svg>
    <a class="rimlink" href="/archive">see the rest</a>
  </div>

<script>
(function(){
  "use strict";
  var barrelEl = document.getElementById('barrel');
  var fieldEl  = document.getElementById('field');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var SECT = Math.PI/6;          // fundamental 30° wedge, walls at 0 and 30
  var HALF = SECT/2;             // bisector — default gravity points outward here
  var TURN_UNIT = Math.PI/3;     // ~60° of turning = one tallied turn
  var AIR = 0.90, REST = 0.24;
  var KEY = 'outbox_kaleido_turns_v1';

  var W=0, cx=0, cy=0, R=0, rMin=0, Gs=0, dpr=1;
  var chips = [];
  var barrelAngle = 0, barrelVel = 0, prevBarrel = 0, turnAccum = 0;
  var dragging = false, lastAng = 0;
  var totalTurns = 0;

  var palette = [
    {b:'#cf2d40', l:'#ff828d', g:'rgba(207,45,64,0.30)'},
    {b:'#2a58c0', l:'#7599ee', g:'rgba(42,88,192,0.30)'},
    {b:'#1f9160', l:'#63d8a3', g:'rgba(31,145,96,0.30)'},
    {b:'#e8a72e', l:'#ffd67f', g:'rgba(232,167,46,0.32)'},
    {b:'#7d43a8', l:'#b880e2', g:'rgba(125,67,168,0.30)'}
  ];

  try { totalTurns = parseInt(localStorage.getItem(KEY),10) || 0; } catch(e){ totalTurns = 0; }

  function pad(n){ n = String(n); while(n.length<4) n='0'+n; return n; }
  function updateTally(){
    var s = 'TURNS OF THIS BARREL: ' + pad(totalTurns);
    document.getElementById('tallyMain').textContent = s;
    document.getElementById('tallyShadow').textContent = s;
  }
  function commitTurns(){
    try { localStorage.setItem(KEY, String(totalTurns)); } catch(e){}
    updateTally();
  }

  // ---- geometry / sizing ----
  function sizeUp(){
    W = fieldEl.clientWidth || 300;
    dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W*dpr); cv.height = Math.round(W*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = W/2; cy = W/2;
    var newR = (W/2)*0.94;
    if (chips.length && R>0){
      var f = newR/R;
      for (var i=0;i<chips.length;i++){
        var c=chips[i]; c.x*=f; c.y*=f; c.rad*=f; c.vx*=f; c.vy*=f;
      }
    }
    R = newR; rMin = R*0.05; Gs = R*0.0017;
  }

  function makeVerts(rad){
    var n = 4 + Math.floor(Math.random()*3), v=[];
    for (var i=0;i<n;i++){
      var a = (i/n)*Math.PI*2 + (Math.random()-0.5)*0.5;
      var rr = rad*(0.78 + Math.random()*0.42);
      v.push({x:Math.cos(a)*rr, y:Math.sin(a)*rr});
    }
    return v;
  }

  function initChips(){
    chips.length = 0;
    var GLASS = 22;
    for (var i=0;i<GLASS;i++){
      var rad = R*(0.030 + Math.random()*0.032);
      var th  = 0.06 + Math.random()*(SECT-0.12);
      var rr  = rMin + rad + Math.random()*(R - rMin - 2*rad);
      chips.push({
        x: rr*Math.cos(th), y: rr*Math.sin(th),
        vx:0, vy:0, rot:Math.random()*Math.PI*2, rotV:0,
        rad:rad, verts:makeVerts(rad),
        pal: palette[Math.floor(Math.random()*palette.length)],
        isCrayon:false
      });
    }
    // the one thing in the cell that isn't glass
    var crad = R*0.052, cth = 0.06 + Math.random()*(SECT-0.12);
    var crr = rMin + crad + Math.random()*(R - rMin - 2*crad);
    chips.push({
      x: crr*Math.cos(cth), y: crr*Math.sin(cth),
      vx:0, vy:0, rot:Math.random()*Math.PI*2, rotV:0,
      rad:crad, verts:null, pal:null, isCrayon:true
    });
  }

  // ---- physics ----
  var WNX = 0.5, WNY = -0.8660254; // inward normal of the 30° wall

  function collideWalls(c){
    // wall A (0° line): keep off it
    if (c.y < c.rad){ c.y = c.rad; if (c.vy<0) c.vy = -c.vy*REST; c.vx *= 0.82; c.rotV += (-c.vx)*0.02; }
    // wall B (30° line)
    var d = c.x*WNX + c.y*WNY;
    if (d < c.rad){
      var push = c.rad - d; c.x += WNX*push; c.y += WNY*push;
      var vn = c.vx*WNX + c.vy*WNY;
      if (vn<0){ c.vx -= (1+REST)*vn*WNX; c.vy -= (1+REST)*vn*WNY; }
      c.vx *= 0.86; c.vy *= 0.86; c.rotV += (c.vy)*0.02;
    }
    // outer arc
    var r = Math.hypot(c.x,c.y);
    var maxR = R - c.rad;
    if (r > maxR && r>1e-6){
      var s = maxR/r, rx=c.x/r, ry=c.y/r;
      c.x *= s; c.y *= s;
      var vr = c.vx*rx + c.vy*ry;
      if (vr>0){ c.vx -= (1+REST)*vr*rx; c.vy -= (1+REST)*vr*ry; }
      c.vx *= 0.9; c.vy *= 0.9;
    }
    // inner hub
    var minR = rMin + c.rad;
    r = Math.hypot(c.x,c.y);
    if (r < minR && r>1e-6){ var s2=minR/r; c.x*=s2; c.y*=s2; }
  }

  function collidePairs(){
    for (var i=0;i<chips.length;i++){
      var a = chips[i];
      for (var j=i+1;j<chips.length;j++){
        var b = chips[j];
        var dx = b.x-a.x, dy = b.y-a.y;
        var dist = Math.hypot(dx,dy);
        var md = a.rad + b.rad;
        if (dist < md && dist>1e-6){
          var nx = dx/dist, ny = dy/dist;
          var o = (md-dist)*0.5;
          a.x -= nx*o; a.y -= ny*o; b.x += nx*o; b.y += ny*o;
          var rel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
          if (rel<0){
            var imp = rel*0.5;
            a.vx += imp*nx; a.vy += imp*ny;
            b.vx -= imp*nx; b.vy -= imp*ny;
          }
          a.rotV += (-ny*a.vx + nx*a.vy)*0.004;
          b.rotV += ( ny*b.vx - nx*b.vy)*0.004;
        }
      }
    }
  }

  function step(t){
    // barrel coasting
    if (!dragging){ barrelAngle += barrelVel; barrelVel *= 0.955; }
    // tally the turning
    var d = Math.abs(barrelAngle - prevBarrel);
    turnAccum += d; prevBarrel = barrelAngle;
    while (turnAccum >= TURN_UNIT){ turnAccum -= TURN_UNIT; totalTurns++; commitTurns(); }

    // gravity in the cell frame — rotates opposite the barrel, plus a slow breathing wobble
    var wob = 0.045*Math.sin(t*0.00055);
    var ga = HALF - barrelAngle + wob;
    var gx = Math.cos(ga)*Gs, gy = Math.sin(ga)*Gs;

    for (var s=0;s<2;s++){
      for (var i=0;i<chips.length;i++){
        var c = chips[i];
        c.vx += gx; c.vy += gy;
        c.vx *= AIR; c.vy *= AIR;
        c.x  += c.vx; c.y += c.vy;
        c.rot += c.rotV; c.rotV *= 0.93;
      }
      for (var k=0;k<chips.length;k++) collideWalls(chips[k]);
      collidePairs(); collidePairs();
      for (var k2=0;k2<chips.length;k2++) collideWalls(chips[k2]);
    }
  }

  // ---- rendering ----
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,   x+w,y+h, r);
    ctx.arcTo(x+w,y+h, x,  y+h, r);
    ctx.arcTo(x,  y+h, x,  y,   r);
    ctx.arcTo(x,  y,   x+w,y,   r);
    ctx.closePath();
  }

  function drawGlass(c){
    var v = c.verts, i;
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (i=1;i<v.length;i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.fillStyle = c.pal.b; ctx.fill();
    ctx.lineWidth = Math.max(0.5, c.rad*0.05);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
    // inner facet
    ctx.beginPath();
    var ox=-c.rad*0.14, oy=-c.rad*0.14;
    ctx.moveTo(v[0].x*0.55+ox, v[0].y*0.55+oy);
    for (i=1;i<v.length;i++) ctx.lineTo(v[i].x*0.55+ox, v[i].y*0.55+oy);
    ctx.closePath();
    ctx.fillStyle = c.pal.l; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
    // specular pinpoint + soft glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.arc(-c.rad*0.30,-c.rad*0.30, c.rad*0.5, 0, 6.2832);
    ctx.fillStyle = c.pal.g; ctx.fill();
    ctx.beginPath(); ctx.arc(-c.rad*0.30,-c.rad*0.30, c.rad*0.20, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawCrayon(c){
    var w = c.rad*2.5, h = c.rad*1.8;
    rr(-w/2,-h/2,w,h, c.rad*0.18);
    ctx.fillStyle = '#efe6cf'; ctx.fill();
    ctx.lineWidth = Math.max(0.5,c.rad*0.05);
    ctx.strokeStyle = 'rgba(120,100,60,0.5)'; ctx.stroke();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, c.rad*0.15);
    ctx.strokeStyle = '#cf2d40';
    ctx.beginPath(); ctx.moveTo(-w*0.30,-h*0.16); ctx.lineTo(w*0.24,-h*0.30); ctx.stroke();
    ctx.strokeStyle = '#2a58c0';
    ctx.beginPath(); ctx.moveTo(-w*0.28,h*0.08);
    ctx.quadraticCurveTo(-w*0.02,h*0.34, w*0.20,h*0.16); ctx.stroke();
    ctx.fillStyle = '#c1381f';
    ctx.font = 'bold ' + (c.rad*0.95) + 'px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('M', -w*0.02, h*0.03);
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.arc(-w*0.28,-h*0.24, c.rad*0.16, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawChips(){
    for (var i=0;i<chips.length;i++){
      var c = chips[i];
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      if (c.isCrayon) drawCrayon(c); else drawGlass(c);
      ctx.restore();
    }
  }

  function drawSeams(){
    for (var i=0;i<6;i++){
      var a = i*Math.PI/6;
      var ex = Math.cos(a)*R, ey = Math.sin(a)*R;
      var g1 = ctx.createLinearGradient(0,0, ex,ey);
      g1.addColorStop(0,'rgba(255,246,222,0.11)');
      g1.addColorStop(1,'rgba(255,246,222,0)');
      ctx.strokeStyle = g1; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();
      var g2 = ctx.createLinearGradient(0,0, -ex,-ey);
      g2.addColorStop(0,'rgba(255,246,222,0.11)');
      g2.addColorStop(1,'rgba(255,246,222,0)');
      ctx.strokeStyle = g2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-ex,-ey); ctx.stroke();
    }
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#0a0910';
    ctx.fillRect(0,0,W,W);
    ctx.save();
    ctx.translate(cx, cy);
    for (var k=0;k<6;k++){
      for (var m=0;m<2;m++){
        ctx.save();
        ctx.rotate(barrelAngle + k*Math.PI/3);
        ctx.scale(1, m===0 ? 1 : -1);
        drawChips();
        ctx.restore();
      }
    }
    ctx.save();
    ctx.rotate(barrelAngle);
    ctx.globalCompositeOperation = 'lighter';
    drawSeams();
    ctx.restore();
    ctx.restore();
  }

  function frame(t){
    step(t);
    render();
    requestAnimationFrame(frame);
  }

  // ---- interaction ----
  function angOf(e){
    var r = barrelEl.getBoundingClientRect();
    return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2));
  }
  function norm(a){ while(a> Math.PI)a-=2*Math.PI; while(a<=-Math.PI)a+=2*Math.PI; return a; }

  barrelEl.addEventListener('pointerdown', function(e){
    dragging = true; barrelEl.classList.add('dragging');
    lastAng = angOf(e); barrelVel = 0;
    if (barrelEl.setPointerCapture) { try{ barrelEl.setPointerCapture(e.pointerId); }catch(x){} }
  });
  barrelEl.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var a = angOf(e);
    var d = norm(a - lastAng);
    barrelAngle += d; lastAng = a;
    barrelVel = d*0.55;
  });
  function endDrag(){ dragging = false; barrelEl.classList.remove('dragging'); }
  barrelEl.addEventListener('pointerup', endDrag);
  barrelEl.addEventListener('pointercancel', endDrag);
  barrelEl.addEventListener('lostpointercapture', endDrag);

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      var dir = Math.random()<0.5 ? -1 : 1;
      barrelVel += dir*(0.18 + Math.random()*0.13);
      for (var i=0;i<chips.length;i++){
        var c = chips[i];
        c.vx += (Math.random()-0.5)*R*0.045;
        c.vy += (Math.random()-0.5)*R*0.045;
        c.rotV += (Math.random()-0.5)*0.3;
      }
    }
  });

  window.addEventListener('resize', sizeUp);

  // ---- go ----
  sizeUp();
  initChips();
  updateTally();
  // let the glass fall into its first bloom before the eye arrives
  for (var w=0; w<60; w++) step(w*16);
  prevBarrel = barrelAngle; turnAccum = 0;
  requestAnimationFrame(frame);
})();
</script>
