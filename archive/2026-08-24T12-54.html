  <meta name="outbox-spec-era" content="January 1897, right now — twenty past eight on a Friday evening in the lecture theatre of a subscription institute on Albemarle-adjacent ground, the gas turned down, a carbon arc lamp roaring on a stand at the left of a black-baize-covered table, a zinc tray of soap solution (water, oleate, and a third of glycerine, mixed on Tuesday and better for the keeping), and a rack of bent brass wire frames. The demonstration is running. Not a look-back at 'the great age of popular science' and not a 'nobody does public lectures like this now' lament — the arc is drawing badly, the room is warm, the films are draining faster than they did at rehearsal, and there are eleven frames still to get through before the interval.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the black-baize table seen dead-on and life-size, with a hard raking arc beam coming in from the left and nothing else in frame: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. Standing in the middle of it are brass wire frames carrying live soap films — a plain ring, a square, a bent cube, two rings pulled apart into a catenoid — and each film is a genuine draining liquid membrane whose colour is computed from its actual thickness. The visitor's entire vocabulary is the frame and the air: drag a frame bodily and the film sloshes, drains and re-orders its bands; pull the two rings of the catenoid apart with the cursor and the waist genuinely narrows until the surface can no longer exist and collapses; press and hold anywhere to blow a real jet of warm air across a film, which thins it locally, shoves colour bands sideways in visible Marangoni streaks, and will pop it if held; wheel to dip the whole frame back into the tray and start a fresh film. Films burst on their own schedule whether the visitor touches them or not, tearing open from the thinnest point at real speed and leaving a shivering rim of liquid that snaps back onto the wire.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of why a soap film has colours and why it stops having them before it breaks — that the colour is not pigment and not in the soap, it is interference between light reflected off the front surface and light reflected off the back surface, so the hue at any point on that film is nothing but a readout of its LOCAL THICKNESS in nanometres; that the film is therefore a live thickness map you are looking at directly, which is why a film hung vertically is a stack of horizontal bands and never a random wash — liquid drains downward under gravity and the top gets thinner than the bottom, continuously, so the bands crawl DOWN the film all evening and new ones are born at the top; that the band order is fixed by the arithmetic (twice thickness times refractive index against wavelength) and runs through a repeating sequence of orders — white, straw, amber, magenta, blue, green, yellow again — with each successive order less saturated than the last because more wavelengths start cancelling at once, so a thick film shows muddy pastel and only a thinning one shows clean colour; that the single most important fact about the whole thing is BLACK FILM: once the top of the film drains below about thirty nanometres, less than a quarter wavelength, the two reflections cancel almost perfectly and that region goes not white, not pale, but a deep true black that reads exactly like a hole in the wire — and black film is the last stage before rupture, so black is not absence but imminence; that the film survives at all because pulling on it locally raises surface tension there and hauls liquid back in, which is the elasticity a pure-water film hasn't got and the reason plain water cannot be blown into a bubble at any price; that this same effect makes a warm draught visible — heat lowers tension, liquid runs away from the warm patch, and the colour bands physically stream sideways ahead of the air; that rupture starts at one point and the hole opens at a genuine fixed speed set by tension against the film's own mass, so a thin film tears faster than a thick one and the retreating rim carries all the liquid with it in a visible thickening ring; that a catenoid between two rings is the actual minimal surface, and it exists only while the ring separation is less than about 1.33 times the ring diameter, past which no such surface is possible and it collapses instantly into two flat discs; and that a film's whole life here is about ninety seconds, and every second of it is spent getting thinner.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, RESTLESS and PRECARIOUS — bands of colour visibly racing downward, a black crown eating the top of every film within a minute, films letting go without warning and snapping back to the wire, the arc lamp hissing and flickering hard enough to make every colour jump, the brass warm, the whole table busy. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT fragile-and-precious, NOT slow, NOT soft-focus prettiness, NOT melancholy — this is a working demonstration at twenty past eight with eleven frames still to get through and the films draining faster than they should.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Black-baize table and unlit air as the ground (#0c0a0b), going to a hard sooty near-nothing outside the arc beam, with polished brass wire as the single held anchor (#c08a2e) carrying a hot specular streak where the arc catches it (#f6e0a4). Everything else is COMPUTED, not chosen: film colour is derived per-pixel from real thickness via thin-film interference, so it runs the honest Newton sequence — pale straw, amber, hot magenta, cyan-blue, sap green, degrading in saturation with each successive order into chalky pastel — and the thinnest regions resolve to a genuine dead black (#000000) indistinguishable from the baize behind them. Exactly one chip of arc-lamp violet-white (#e8ecff) is held strictly for the beam itself, the flicker, and the highlight on wet liquid running back down the wire. High contrast, transmissive, genuinely luminous where the film is lit and absolutely dead where it isn't; no ambient fill, no glow-bloom haze, no gradients other than the honest thickness field.">
  <meta name="outbox-spec-wildcard" content="One frame at the right of the table — a bent cube frame with a visible kink in the top-front edge where somebody has straightened it badly — carries a film that is already entirely black film across its whole span, and it stays that way forever: it never colours, never drains further, never bursts no matter how long it is blown on or how hard the frame is dragged, and reads permanently as a square hole cut in the picture with brass around it. It is never labelled, never explained, and it is in the same position with the same kink every visit.">
  <meta name="outbox-spec-forbidden" content="NO soap-film-as-metaphor for fragility / beauty-that-doesn't-last / the-brief-bright-life / a-world-in-a-bubble / childhood wonder / 'everything is temporary' — it is optical path difference, drainage, and thirty nanometres, and it has nothing to teach anybody. NO science-as-magic, NO wonder, NO awe, NO 'the miracle of the ordinary', NO gasping-audience register, NO Victorian-lecture whimsy and NO winking at gentlemen in frock coats. NO hushed, meditative, hypnotic, reverent or 'let the colours still you' register whatsoever, and NO ambient-visualiser or screensaver framing. NO nostalgia, NO wistfulness, NO 'nobody demonstrates anything by hand anymore / the great popular lectures are gone' decline narrative — there are eleven frames left before the interval. NO iridescence-as-luxury, NO oil-slick / holographic / opal / vaporwave / synthwave / late-internet-shimmer aesthetic drift, NO pastel-dreamscape softness. NO sensuous material writing about liquid or light beyond thickness, tension, speed and hue. NO melancholy, NO soft autumn, NO loneliness, NO cryptic-SCP or ominous dread about the permanently black film. NO archival / museum / cabinet / drawer / relic framing of the apparatus — it is on the table and in use this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — the room is warm, full and busy. NO signal / transmission / frequency / broadcast framing of the light. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the baize, the brass, the beam and the films, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!-- mixed Tuesday: water, oleate, one third glycerine. keeps better. -->
<!-- 2 n t cos r = (m + 1/2) lambda. n = 1.34. the half wave is the reason black is black. -->
<div id="arch"><a href="/archive">&#183;&#183;&#183;</a></div>
<script>
(function(){
"use strict";

var cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  layout();
}
window.addEventListener('resize',resize);

/* ---------------------------------------------------------------
   THIN FILM COLOUR. Reflectance integrated over sampled wavelengths.
   Two-beam interference, air/film/air, half-wave shift on front face.
   R(lambda) = R0 * 4 sin^2( 2 pi n t cos(r) / lambda )   (normal-ish)
   --------------------------------------------------------------- */
var LAM=[], NL=0;
(function(){for(var l=400;l<=700;l+=5){LAM.push(l);}NL=LAM.length;})();
// CIE-ish colour matching (coarse gaussian fits, good enough and honest in shape)
function gauss(x,mu,s1,s2){var t=(x-mu)*(x<mu?s1:s2);return Math.exp(-0.5*t*t);}
var CMF=[];
for(var i=0;i<NL;i++){
  var l=LAM[i];
  var xb=1.056*gauss(l,599.8,.0264,.0323)+0.362*gauss(l,442.0,.0624,.0374)-0.065*gauss(l,501.1,.0490,.0382);
  var yb=0.821*gauss(l,568.8,.0213,.0247)+0.286*gauss(l,530.9,.0613,.0322);
  var zb=1.217*gauss(l,437.0,.0845,.0278)+0.681*gauss(l,459.0,.0385,.0725);
  CMF.push([xb,yb,zb]);
}
var CSUM=0;for(i=0;i<NL;i++)CSUM+=CMF[i][1];

var N_FILM=1.34;
// Lookup table: thickness 0..2400nm -> linear rgb
var LUTN=1201, LUT=new Float32Array(LUTN*3);
(function(){
  var R0=0.021; // single-surface reflectance approx for n=1.34
  for(var k=0;k<LUTN;k++){
    var t=k*2.0; // nm
    var X=0,Y=0,Z=0;
    for(var j=0;j<NL;j++){
      var lam=LAM[j];
      var ph=2*Math.PI*N_FILM*t/lam;
      var s=Math.sin(ph);
      var R=4*R0*s*s/(1+4*R0*(1-R0)*s*s*0); // two-beam, keep simple & real
      // illuminant: arc lamp, violet-white, slight blue bias
      var ill=1.0+0.00085*(lam-550);
      var v=R*ill;
      X+=v*CMF[j][0];Y+=v*CMF[j][1];Z+=v*CMF[j][2];
    }
    X/=CSUM;Y/=CSUM;Z/=CSUM;
    var r= 3.2406*X-1.5372*Y-0.4986*Z;
    var gg=-0.9689*X+1.8758*Y+0.0415*Z;
    var b= 0.0557*X-0.2040*Y+1.0570*Z;
    LUT[k*3]=r<0?0:r;LUT[k*3+1]=gg<0?0:gg;LUT[k*3+2]=b<0?0:b;
  }
})();
function lutSample(t,out){
  if(t<=0){out[0]=0;out[1]=0;out[2]=0;return;}
  var f=t*0.5; if(f>LUTN-1.001)f=LUTN-1.001;
  var i0=f|0,fr=f-i0,a=i0*3,b=a+3;
  out[0]=LUT[a]+(LUT[b]-LUT[a])*fr;
  out[1]=LUT[a+1]+(LUT[b+1]-LUT[a+1])*fr;
  out[2]=LUT[a+2]+(LUT[b+2]-LUT[a+2])*fr;
}
function tonemap(v){ // linear -> srgb-ish, boosted
  v*=26.0;
  if(v<=0)return 0;
  if(v>1)v=1;
  v=v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055;
  return v*255;
}

/* ---------------------------------------------------------------
   ARC LAMP — live source, noisy clock
   --------------------------------------------------------------- */
var arc={I:1,ct:1,ang:0,seed:Math.random()*1000,crackle:0};
function noise1(x){var s=Math.sin(x*12.9898)*43758.5453;return s-Math.floor(s);}
function smoothNoise(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return noise1(i)*(1-u)+noise1(i+1)*u;}
function updateArc(t,dt){
  var s=arc.seed;
  var base=0.86+0.14*smoothNoise(t*3.1+s)+0.06*smoothNoise(t*11.0+s*2);
  var spike=0;
  if(Math.random()<dt*2.4){arc.crackle=1;}
  arc.crackle*=Math.pow(0.0006,dt);
  spike=arc.crackle*(0.35+Math.random()*0.5);
  arc.I=Math.max(0.35,base+spike-0.10*(smoothNoise(t*0.7+s*3)>0.82?1:0));
  arc.ct=0.9+0.22*smoothNoise(t*2.2+s*5)+spike*0.3;
  arc.ang=-0.10+0.05*smoothNoise(t*0.9+s*7);
}

/* ---------------------------------------------------------------
   AUDIO — synthesised bed
   --------------------------------------------------------------- */
var AC=null,masterGain=null,hissGain=null,blowGain=null,blowFilt=null,started=false;
function initAudio(){
  if(started)return;
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    AC=new Ctx();
    masterGain=AC.createGain();masterGain.gain.value=0.0;masterGain.connect(AC.destination);
    masterGain.gain.linearRampToValueAtTime(0.5,AC.currentTime+2.0);
    // hiss bed
    var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1);
    var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=0.55;
    var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=800;
    hissGain=AC.createGain();hissGain.gain.value=0.045;
    src.connect(bp);bp.connect(hp);hp.connect(hissGain);hissGain.connect(masterGain);src.start();
    // blow rush
    var src2=AC.createBufferSource();src2.buffer=buf;src2.loop=true;
    blowFilt=AC.createBiquadFilter();blowFilt.type='lowpass';blowFilt.frequency.value=520;blowFilt.Q.value=1.2;
    blowGain=AC.createGain();blowGain.gain.value=0;
    src2.connect(blowFilt);blowFilt.connect(blowGain);blowGain.connect(masterGain);src2.start();
    started=true;
  }catch(e){}
}
window.addEventListener('pointerdown',initAudio,{once:false});
window.addEventListener('keydown',initAudio,{once:true});
function crackleSound(amp){
  if(!AC)return;
  var t=AC.currentTime;
  var o=AC.createOscillator(),gn=AC.createGain(),f=AC.createBiquadFilter();
  o.type='square';o.frequency.value=90+Math.random()*400;
  f.type='bandpass';f.frequency.value=1400+Math.random()*2600;f.Q.value=4;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.05*amp,t+0.002);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(f);f.connect(gn);gn.connect(masterGain);o.start(t);o.stop(t+0.07);
}
function tickSound(area){
  if(!AC)return;
  var t=AC.currentTime;
  var f0=1500/Math.sqrt(Math.max(0.15,area));
  f0=Math.max(320,Math.min(4200,f0));
  var o=AC.createOscillator(),gn=AC.createGain(),bp=AC.createBiquadFilter();
  o.type='triangle';o.frequency.setValueAtTime(f0*1.5,t);
  o.frequency.exponentialRampToValueAtTime(f0*0.72,t+0.09);
  bp.type='bandpass';bp.frequency.value=f0;bp.Q.value=2.5;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.28,t+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(bp);bp.connect(gn);gn.connect(masterGain);o.start(t);o.stop(t+0.25);
  // burst of noise for the rim snap
  if(AC){
    var n=AC.createBufferSource(),nb=AC.createBuffer(1,2048,AC.sampleRate),nd=nb.getChannelData(0);
    for(var i=0;i<2048;i++)nd[i]=(Math.random()*2-1)*(1-i/2048);
    n.buffer=nb;
    var ng=AC.createGain();ng.gain.value=0.16;
    var nf=AC.createBiquadFilter();nf.type='highpass';nf.frequency.value=2200;
    n.connect(nf);nf.connect(ng);ng.connect(masterGain);n.start(t);
  }
}
function slitherSound(v){
  if(!AC)return;
  var t=AC.currentTime;
  var o=AC.createOscillator(),gn=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(180+v*260,t);
  o.frequency.linearRampToValueAtTime(90+v*90,t+0.4);
  f.type='lowpass';f.frequency.setValueAtTime(900+v*900,t);
  f.frequency.exponentialRampToValueAtTime(240,t+0.4);f.Q.value=3;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.05,t+0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
  o.connect(f);f.connect(gn);gn.connect(masterGain);o.start(t);o.stop(t+0.5);
}
function dripSound(){
  if(!AC)return;
  var t=AC.currentTime;
  var o=AC.createOscillator(),gn=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(1250+Math.random()*500,t);
  o.frequency.exponentialRampToValueAtTime(340,t+0.075);
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.10,t+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(gn);gn.connect(masterGain);o.start(t);o.stop(t+0.16);
}

/* ---------------------------------------------------------------
   FILM — thickness field
   --------------------------------------------------------------- */
function Film(cfg){
  this.type=cfg.type;              // 'ring','square','cube','catenoid','void'
  this.x=cfg.x;this.y=cfg.y;       // centre, fractional of viewport
  this.r=cfg.r;                    // radius fraction of min dim
  this.cols=cfg.cols||46;
  this.rows=cfg.rows||46;
  this.eternal=!!cfg.eternal;
  this.sep=cfg.sep||0.72;          // catenoid ratio sep/diameter
  this.vx=0;this.vy=0;
  this.px=this.x;this.py=this.y;
  this.dropTimer=1+Math.random()*3;
  this.drips=[];
  this.reset(true);
}
Film.prototype.reset=function(first){
  var n=this.cols*this.rows;
  this.t=new Float32Array(n);
  this.t2=new Float32Array(n);
  this.mask=new Uint8Array(n);
  this.age=0;
  this.state='live'; // live | bursting | empty
  this.holeR=0;this.holeX=0;this.holeY=0;this.rimMass=0;this.tcv=0;
  this.dipTimer=0;
  this.lifespan=72+Math.random()*38;
  this.collapse=0;
  for(var j=0;j<this.rows;j++){
    for(var i=0;i<this.cols;i++){
      var k=j*this.cols+i;
      var u=(i+0.5)/this.cols, v=(j+0.5)/this.rows;
      this.mask[k]=this.inside(u,v)?1:0;
      if(this.eternal){ this.t[k]=this.mask[k]?14+Math.random()*4:0; }
      else{
        // fresh from tray: ~900nm, thicker at bottom already
        this.t[k]=this.mask[k]?(760+340*v+Math.random()*70):0;
      }
    }
  }
  if(this.eternal)this.lifespan=1e9;
};
Film.prototype.inside=function(u,v){
  var t=this.type;
  if(t==='ring'){var dx=u-0.5,dy=v-0.5;return dx*dx+dy*dy<0.25;}
  if(t==='square'||t==='void')return u>0.02&&u<0.98&&v>0.02&&v<0.98;
  if(t==='cube'){
    // bent-cube: central square film panel with two lobes
    var dx=Math.abs(u-0.5),dy=Math.abs(v-0.5);
    return dx<0.48&&dy<0.48;
  }
  if(t==='catenoid'){
    // waist profile: cosh
    var yy=(v-0.5)*2; // -1..1
    var a=this.neck||0.4;
    var w=a*Math.cosh(yy*this.sepHalf/Math.max(a,0.001));
    if(!isFinite(w))return false;
    return Math.abs(u-0.5)*2<Math.min(w,1);
  }
  return true;
};
Film.prototype.recomputeMask=function(){
  for(var j=0;j<this.rows;j++)for(var i=0;i<this.cols;i++){
    var k=j*this.cols+i,u=(i+0.5)/this.cols,v=(j+0.5)/this.rows;
    var was=this.mask[k],is=this.inside(u,v)?1:0;
    this.mask[k]=is;
    if(is&&!was)this.t[k]=Math.max(this.t[k],220);
    if(!is)this.t[k]=0;
  }
};

/* drainage: q ~ t^3 (Poiseuille in the lamella), downward */
Film.prototype.step=function(dt,jet){
  if(this.state==='empty'){
    this.dipTimer-=dt;
    if(this.dipTimer<=0)this.reset();
    return;
  }
  if(this.state==='bursting'){
    this.holeR+=this.tcv*dt;
    this.rimMass+=this.tcv*dt*40;
    if(this.holeR>1.6){
      this.state='empty';this.dipTimer=0.5+Math.random()*1.8;
      for(var q=0;q<3;q++)this.drips.push({p:Math.random(),v:0.25+Math.random()*0.5,life:1});
      slitherSound(0.5+Math.random()*0.5);
    }
    return;
  }
  if(this.eternal){
    // holds at black film forever. jitter only, never colours, never breaks.
    this.age+=dt;
    return;
  }
  this.age+=dt;
  var C=this.cols,R=this.rows;
  var t=this.t,t2=this.t2,m=this.mask;
  var k,i,j;
  var drainK=dt*1.55e-8; // scaled so t^3 flow gives ~90s life
  // sloshing from frame motion
  var slosh=(this.vy)*dt*900 + 0;
  var slx=(this.vx)*dt*900;
  for(j=0;j<R;j++){
    for(i=0;i<C;i++){
      k=j*C+i;
      if(!m[k]){t2[k]=0;continue;}
      var th=t[k];
      // flux out downward proportional to th^3
      var out=drainK*th*th*th*R;
      // flux in from above
      var inn=0;
      if(j>0&&m[k-C]){var ta=t[k-C];inn=drainK*ta*ta*ta*R;}
      var nt=th-out+inn;
      // lateral smoothing (surface-tension driven levelling, weak)
      var s=0,c=0;
      if(i>0&&m[k-1]){s+=t[k-1];c++;}
      if(i<C-1&&m[k+1]){s+=t[k+1];c++;}
      if(c){nt+=(s/c-th)*dt*1.1;}
      // slosh advection
      if(j>0&&m[k-C]&&slosh<0)nt+=(t[k-C]-th)*Math.min(0.9,-slosh);
      if(j<R-1&&m[k+C]&&slosh>0)nt+=(t[k+C]-th)*Math.min(0.9,slosh);
      if(i>0&&m[k-1]&&slx<0)nt+=(t[k-1]-th)*Math.min(0.9,-slx);
      if(i<C-1&&m[k+1]&&slx>0)nt+=(t[k+1]-th)*Math.min(0.9,slx);
      // meniscus feed at the wire: bottom row and edges hold liquid
      if(j===R-1||!m[k+C])nt+=(1500-nt)*dt*0.55;
      if(i===0||i===C-1||!m[k-1]||!m[k+1])nt+=(900-nt)*dt*0.25;
      // Marangoni: warm jet lowers tension locally -> liquid flows AWAY
      if(jet&&jet.f>0){
        var u=(i+0.5)/C,v=(j+0.5)/R;
        var wx=u-jet.u,wy=v-jet.v;
        var d2=wx*wx+wy*wy;
        var sig=jet.r*jet.r;
        var e=Math.exp(-d2/sig);
        if(e>0.004){
          // gradient of tension pulls liquid outward along +grad(distance)
          var mag=jet.f*e*dt*46.0;
          nt-=nt*mag*0.020;
          // push into neighbours downstream of the jet
          var dxn=wx,dyn=wy,L=Math.sqrt(d2)+1e-5;
          dxn/=L;dyn/=L;
          var ii=i+(dxn>0.35?1:(dxn<-0.35?-1:0));
          var jj=j+(dyn>0.35?1:(dyn<-0.35?-1:0));
          if(ii>=0&&ii<C&&jj>=0&&jj<R){
            var kk=jj*C+ii;
            if(m[kk]){t2[kk]=(t2[kk]||t[kk]);}
          }
          // lateral streaming: advect band pattern outward
          var si=i-(dxn>0?1:-1),sj=j-(dyn>0?1:-1);
          if(si>=0&&si<C&&sj>=0&&sj<R&&m[sj*C+si]){
            nt+=(t[sj*C+si]-nt)*Math.min(0.85,jet.f*e*dt*20);
          }
        }
      }
      if(nt<0.5)nt=0.5;
      if(nt>2400)nt=2400;
      t2[k]=nt;
    }
  }
  var tmp=this.t;this.t=t2;this.t2=tmp;
  // rupture check
  var minT=1e9,mk=-1;
  var tt=this.t;
  for(k=0;k<C*R;k++){
    if(!m[k])continue;
    if(tt[k]<minT){minT=tt[k];mk=k;}
  }
  this.minT=minT;
  if(mk>=0){
    var pr=0;
    if(minT<8)pr=dt*3.2;
    else if(minT<15)pr=dt*0.75;
    else if(minT<26)pr=dt*0.18;
    if(this.age>this.lifespan)pr+=dt*0.5;
    if(pr>0&&Math.random()<pr)this.burst(mk);
  }
};
Film.prototype.burst=function(k){
  if(this.eternal||this.state!=='live')return;
  this.state='bursting';
  var C=this.cols;
  this.holeX=((k%C)+0.5)/C;this.holeY=((k/C|0)+0.5)/this.rows;
  this.holeR=0.0;
  // Taylor-Culick: v = sqrt(2 gamma / (rho h))
  var h=Math.max(6,this.minT||20)*1e-9;
  var gamma=0.030;
  var v=Math.sqrt(2*gamma/(1000*h)); // m/s, ~ 45 m/s for 30nm
  // convert to fractional-frame per second: frame ~ 0.09 m real
  this.tcv=Math.min(26,v/0.9);
  this.rimMass=0;
  tickSound(this.pxRadius?this.pxRadius/120:1);
};

var films=[];
function buildFilms(){
  films=[
    new Film({type:'ring',   x:0.175,y:0.46,r:0.145,cols:52,rows:52}),
    new Film({type:'square', x:0.375,y:0.52,r:0.125,cols:48,rows:52}),
    new Film({type:'catenoid',x:0.575,y:0.46,r:0.115,cols:44,rows:56}),
    new Film({type:'cube',   x:0.775,y:0.55,r:0.105,cols:40,rows:40}),
    new Film({type:'void',   x:0.925,y:0.42,r:0.088,cols:20,rows:20,eternal:true})
  ];
  var cat=films[2];
  cat.sepHalf=0.62;cat.neck=0.55;
  cat.ratio=0.72;
}
buildFilms();
var scaleUnit=1,portrait=false;
function layout(){
  portrait=(W<H*0.95);
  scaleUnit=Math.min(W,H);
  if(portrait){
    // stack vertically
    var pos=[[0.30,0.15],[0.68,0.30],[0.30,0.52],[0.70,0.70],[0.28,0.855]];
    var rr=[0.115,0.100,0.098,0.085,0.070];
    for(var i=0;i<films.length;i++){
      films[i].x=pos[i][0];films[i].y=pos[i][1];films[i].r=rr[i];
      films[i].px=films[i].x;films[i].py=films[i].y;
    }
    scaleUnit=Math.min(W,H*0.62);
  }else{
    var posL=[[0.175,0.46],[0.375,0.52],[0.575,0.46],[0.775,0.55],[0.925,0.40]];
    var rL=[0.145,0.125,0.115,0.105,0.088];
    for(var j=0;j<films.length;j++){
      films[j].x=posL[j][0];films[j].y=posL[j][1];films[j].r=rL[j];
      films[j].px=films[j].x;films[j].py=films[j].y;
    }
  }
}

/* ---------------------------------------------------------------
   POINTER
   --------------------------------------------------------------- */
var ptr={x:-1,y:-1,down:false,downT:0,drag:null,dragOff:[0,0],mode:null,ring:0};
function toFrac(e){
  var r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];
}
function filmPx(f){
  return {cx:f.x*W,cy:f.y*H,rad:f.r*scaleUnit};
}
function hitTest(fx,fy){
  for(var i=0;i<films.length;i++){
    var f=films[i],p=filmPx(f);
    var dx=fx*W-p.cx,dy=fy*H-p.cy;
    var rr=p.rad*(f.type==='catenoid'?1.25:1.15);
    if(dx*dx+dy*dy<rr*rr)return f;
  }
  return null;
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  var p=toFrac(e);ptr.x=p[0];ptr.y=p[1];ptr.down=true;ptr.downT=0;
  var f=hitTest(p[0],p[1]);
  ptr.drag=null;ptr.mode='blow';
  if(f){
    var fp=filmPx(f);
    var dy=p[1]*H-fp.cy;
    if(f.type==='catenoid'&&Math.abs(dy)>fp.rad*0.55){
      ptr.drag=f;ptr.mode='catenoid';ptr.ring=dy<0?-1:1;
    }else if(e.shiftKey||e.button===2){
      ptr.drag=f;ptr.mode='move';ptr.dragOff=[f.x-p[0],f.y-p[1]];
    }
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',function(e){
  var p=toFrac(e);
  if(ptr.down&&ptr.drag&&ptr.mode==='move'){
    ptr.drag.x=p[0]+ptr.dragOff[0];ptr.drag.y=p[1]+ptr.dragOff[1];
  }
  if(ptr.down&&ptr.drag&&ptr.mode==='catenoid'){
    var f=ptr.drag,fp=filmPx(f);
    var d=Math.abs(p[1]*H-fp.cy)/fp.rad;
    f.sepHalf=Math.max(0.10,Math.min(1.5,d));
  }
  // any drag of >0 with pointer down and not on a film: still blow
  if(ptr.down&&!ptr.drag){
    var f2=hitTest(p[0],p[1]);
  }
  ptr.x=p[0];ptr.y=p[1];
},{passive:true});
function up(){ptr.down=false;ptr.drag=null;ptr.mode=null;}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(){ptr.down=false;ptr.x=-1;ptr.y=-1;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();
  var p=toFrac(e);var f=hitTest(p[0],p[1]);
  if(f&&!f.eternal){f.reset();slitherSound(0.4);}
});
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  initAudio();
  var p=toFrac(e);var f=hitTest(p[0],p[1]);
  if(f){
    if(f.type==='catenoid'){
      f.sepHalf=Math.max(0.10,Math.min(1.5,f.sepHalf+(e.deltaY>0?0.05:-0.05)));
    }
    if(!f.eternal&&e.deltaY>0){f.reset();slitherSound(0.35);}
    else if(!f.eternal&&e.deltaY<0){f.reset();slitherSound(0.3);}
  }else{
    for(var i=0;i<films.length;i++)if(!films[i].eternal&&Math.random()<0.5)films[i].reset();
    slitherSound(0.6);
  }
},{passive:false});
// touch: long press on a film re-dips
var touchTimer=null;
cv.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    var r=cv.getBoundingClientRect();
    var p=[(e.touches[0].clientX-r.left)/r.width,(e.touches[0].clientY-r.top)/r.height];
    var f=hitTest(p[0],p[1]);
    if(f&&!f.eternal){f.reset();slitherSound(0.4);}
  }
},{passive:true});

/* ---------------------------------------------------------------
   RENDER
   --------------------------------------------------------------- */
var off=document.createElement('canvas'),og=off.getContext('2d');
var idBuf=null,idW=0,idH=0;
var rgbTmp=[0,0,0];

function beamFactor(px,py){
  // hard raking beam from the left. px,py in css px
  var ax=-0.16*W, ay=0.30*H;      // arc position
  var dx=px-ax, dy=py-ay;
  var d=Math.sqrt(dx*dx+dy*dy)+1;
  var ang=Math.atan2(dy,dx);
  var centre=0.30+arc.ang;
  var spread=0.62;
  var off1=Math.abs(ang-centre)/spread;
  var cone=Math.exp(-off1*off1*2.4);
  var fall=Math.min(1,(1.05*W)/(d*1.02));
  return arc.I*cone*(0.42+0.72*fall);
}

function drawFilm(f,now){
  var p=filmPx(f);
  f.pxRadius=p.rad;
  var C=f.cols,R=f.rows;
  var boxW,boxH;
  if(f.type==='ring'){boxW=p.rad*2;boxH=p.rad*2;}
  else if(f.type==='catenoid'){boxW=p.rad*2.0;boxH=p.rad*2*f.sepHalf;}
  else{boxW=p.rad*1.8;boxH=p.rad*1.8;}
  var x0=p.cx-boxW/2,y0=p.cy-boxH/2;

  // rebuild mask for catenoid each frame (neck solved live)
  if(f.type==='catenoid'){
    // solve a * cosh(s/a) = 1  (rings radius 1, half-separation s)
    var s=f.sepHalf;
    var sol=null;
    for(var a=0.999;a>0.02;a-=0.004){
      var val=a*Math.cosh(s/a);
      if(val<=1.0){sol=a;break;}
    }
    f.neck=sol;
    f.hasSolution=(sol!==null&&s<0.665); // 2s/2r < 1.325
    if(!f.hasSolution){
      if(f.state==='live'){f.state='bursting';f.holeX=0.5;f.holeY=0.5;f.holeR=0;f.tcv=14;tickSound(0.6);}
    }
    f.recomputeMask();
  }

  var pxw=Math.max(2,Math.round(boxW*DPR)),pxh=Math.max(2,Math.round(boxH*DPR));
  var maxD=Math.min(360,Math.max(C,R)*4);
  var rw=Math.min(pxw,maxD),rh=Math.min(pxh,maxD);
  if(off.width!==rw||off.height!==rh){off.width=rw;off.height=rh;}
  var img=og.createImageData(rw,rh);
  var data=img.data;
  var tt=f.t,m=f.mask;
  var burst=(f.state==='bursting');
  var hx=f.holeX,hy=f.holeY,hr=f.holeR;
  var beamAtCentre=beamFactor(p.cx,p.cy);

  for(var yy=0;yy<rh;yy++){
    var v=(yy+0.5)/rh;
    var fy=v*R-0.5;
    var j0=Math.floor(fy);var fj=fy-j0;
    for(var xx=0;xx<rw;xx++){
      var idx=(yy*rw+xx)*4;
      var u=(xx+0.5)/rw;
      var fx=u*C-0.5;
      var i0=Math.floor(fx);var fi=fx-i0;
      var a0=Math.min(R-1,Math.max(0,j0)),a1=Math.min(R-1,Math.max(0,j0+1));
      var b0=Math.min(C-1,Math.max(0,i0)),b1=Math.min(C-1,Math.max(0,i0+1));
      var k00=a0*C+b0,k01=a0*C+b1,k10=a1*C+b0,k11=a1*C+b1;
      var mm=(m[k00]+m[k01]+m[k10]+m[k11]);
      if(mm===0){data[idx+3]=0;continue;}
      var t00=tt[k00],t01=tt[k01],t10=tt[k10],t11=tt[k11];
      var th=(t00*(1-fi)+t01*fi)*(1-fj)+(t10*(1-fi)+t11*fi)*fj;
      var cov=mm/4;
      if(burst){
        var ddx=(u-hx),ddy=(v-hy);
        var dr=Math.sqrt(ddx*ddx+ddy*ddy);
        if(dr<hr){data[idx+3]=0;continue;}
        var rimW=0.030+hr*0.045;
        if(dr<hr+rimW){
          var g2=1-(dr-hr)/rimW;
          th=th+f.rimMass*g2*g2*7.5;
          if(th>2380)th=2380;
        }
      }
      // eternal film: absolutely dead black inside the wire
      if(f.eternal){
        data[idx]=0;data[idx+1]=0;data[idx+2]=0;data[idx+3]=255*cov;
        continue;
      }
      lutSample(th,rgbTmp);
      var bf=beamFactor(x0+u*boxW,y0+v*boxH);
      var ctW=arc.ct;
      var r=tonemap(rgbTmp[0]*bf);
      var gg=tonemap(rgbTmp[1]*bf*1.0);
      var b=tonemap(rgbTmp[2]*bf*(0.94+0.16*ctW));
      // arc violet-white bias in the very brightest
      data[idx]=r|0;data[idx+1]=gg|0;data[idx+2]=b|0;
      data[idx+3]=255*cov;
    }
  }
  og.putImageData(img,0,0);
  g.imageSmoothingEnabled=true;
  g.drawImage(off,0,0,rw,rh,x0*DPR,y0*DPR,boxW*DPR,boxH*DPR);

  drawWire(f,p,boxW,boxH,x0,y0,beamAtCentre);
}

function wireGrad(x1,y1,x2,y2,bf){
  var gr=g.createLinearGradient(x1*DPR,y1*DPR,x2*DPR,y2*DPR);
  var hot=Math.min(1,bf*1.15);
  gr.addColorStop(0,'rgba(70,44,12,1)');
  gr.addColorStop(0.30,'rgba(192,138,46,'+(0.55+0.45*hot)+')');
  gr.addColorStop(0.46,'rgba(246,224,164,'+(0.35+0.65*hot)+')');
  gr.addColorStop(0.62,'rgba(192,138,46,'+(0.5+0.4*hot)+')');
  gr.addColorStop(1,'rgba(52,32,10,1)');
  return gr;
}

function drawWire(f,p,boxW,boxH,x0,y0,bf){
  g.save();
  g.lineCap='round';g.lineJoin='round';
  var lw=Math.max(1.6,p.rad*0.045)*DPR;
  var hot=Math.min(1,bf*1.2);
  if(f.type==='ring'){
    g.lineWidth=lw;
    g.strokeStyle=wireGrad(p.cx-p.rad,p.cy-p.rad,p.cx+p.rad,p.cy+p.rad,bf);
    g.beginPath();g.arc(p.cx*DPR,p.cy*DPR,p.rad*DPR,0,Math.PI*2);g.stroke();
    // specular streak on upper-left
    g.lineWidth=lw*0.42;
    g.strokeStyle='rgba(246,224,164,'+(0.20+0.62*hot)+')';
    g.beginPath();g.arc(p.cx*DPR,p.cy*DPR,p.rad*DPR,Math.PI*0.86,Math.PI*1.42);g.stroke();
    // stem
    g.lineWidth=lw*0.9;
    g.strokeStyle=wireGrad(p.cx,p.cy,p.cx,p.cy+p.rad*2.6,bf*0.8);
    g.beginPath();g.moveTo(p.cx*DPR,(p.cy+p.rad)*DPR);g.lineTo((p.cx+p.rad*0.1)*DPR,(p.cy+p.rad*2.3)*DPR);g.stroke();
  }else if(f.type==='square'){
    var s=p.rad*0.9;
    g.lineWidth=lw;
    g.strokeStyle=wireGrad(p.cx-s,p.cy-s,p.cx+s,p.cy+s,bf);
    g.beginPath();g.rect((p.cx-s)*DPR,(p.cy-s)*DPR,s*2*DPR,s*2*DPR);g.stroke();
    g.lineWidth=lw*0.4;
    g.strokeStyle='rgba(246,224,164,'+(0.18+0.6*hot)+')';
    g.beginPath();g.moveTo((p.cx-s)*DPR,(p.cy+s)*DPR);g.lineTo((p.cx-s)*DPR,(p.cy-s)*DPR);g.lineTo((p.cx+s*0.5)*DPR,(p.cy-s)*DPR);g.stroke();
    g.lineWidth=lw*0.9;
    g.strokeStyle=wireGrad(p.cx,p.cy,p.cx,p.cy+s*2.6,bf*0.8);
    g.beginPath();g.moveTo(p.cx*DPR,(p.cy+s)*DPR);g.lineTo((p.cx-s*0.12)*DPR,(p.cy+s*2.4)*DPR);g.stroke();
  }else if(f.type==='catenoid'){
    var rr=p.rad,hh=p.rad*f.sepHalf;
    g.lineWidth=lw;
    g.strokeStyle=wireGrad(p.cx-rr,p.cy-hh,p.cx+rr,p.cy+hh,bf);
    // two rings drawn as ellipses (seen dead on, slight tilt)
    var ey=rr*0.20;
    g.beginPath();g.ellipse(p.cx*DPR,(p.cy-hh)*DPR,rr*DPR,ey*DPR,0,0,Math.PI*2);g.stroke();
    g.beginPath();g.ellipse(p.cx*DPR,(p.cy+hh)*DPR,rr*DPR,ey*DPR,0,0,Math.PI*2);g.stroke();
    g.lineWidth=lw*0.45;
    g.strokeStyle='rgba(246,224,164,'+(0.2+0.6*hot)+')';
    g.beginPath();g.ellipse(p.cx*DPR,(p.cy-hh)*DPR,rr*DPR,ey*DPR,0,Math.PI*0.95,Math.PI*1.55);g.stroke();
    g.beginPath();g.ellipse(p.cx*DPR,(p.cy+hh)*DPR,rr*DPR,ey*DPR,0,Math.PI*0.95,Math.PI*1.55);g.stroke();
    // support rods
    g.lineWidth=lw*0.75;
    g.strokeStyle=wireGrad(p.cx-rr,p.cy,p.cx-rr,p.cy+hh*2,bf*0.7);
    g.beginPath();g.moveTo((p.cx-rr*1.02)*DPR,(p.cy-hh)*DPR);g.lineTo((p.cx-rr*1.02)*DPR,(p.cy+hh*1.9)*DPR);g.stroke();
  }else if(f.type==='cube'){
    // bent cube: isometric box, one panel filmed
    var s2=p.rad*0.82,d=p.rad*0.40;
    var cx=p.cx,cy=p.cy;
    var A=[cx-s2,cy-s2],B=[cx+s2,cy-s2],Cc=[cx+s2,cy+s2],D=[cx-s2,cy+s2];
    var A2=[A[0]+d,A[1]-d*0.72],B2=[B[0]+d,B[1]-d*0.72],C2=[Cc[0]+d,Cc[1]-d*0.72],D2=[D[0]+d,D[1]-d*0.72];
    g.lineWidth=lw*0.8;
    g.strokeStyle=wireGrad(cx-s2,cy-s2,cx+s2+d,cy+s2,bf*0.72);
    function seg(P,Q){g.beginPath();g.moveTo(P[0]*DPR,P[1]*DPR);g.lineTo(Q[0]*DPR,Q[1]*DPR);g.stroke();}
    seg(A2,B2);seg(B2,C2);seg(C2,D2);seg(D2,A2);
    seg(A,A2);seg(B,B2);seg(Cc,C2);seg(D,D2);
    g.lineWidth=lw;
    g.strokeStyle=wireGrad(cx-s2,cy-s2,cx+s2,cy+s2,bf);
    seg(A,B);seg(B,Cc);seg(Cc,D);seg(D,A);
    g.lineWidth=lw*0.4;
    g.strokeStyle='rgba(246,224,164,'+(0.16+0.55*hot)+')';
    seg([A[0],A[1]],[A[0],A[1]+s2*1.2]);
    g.lineWidth=lw*0.85;
    g.strokeStyle=wireGrad(cx,cy,cx,cy+s2*2.4,bf*0.7);
    g.beginPath();g.moveTo(cx*DPR,(cy+s2)*DPR);g.lineTo((cx+s2*0.14)*DPR,(cy+s2*2.3)*DPR);g.stroke();
  }else if(f.type==='void'){
    // the bent-cube frame with the badly straightened top-front edge
    var s3=p.rad*0.9,d3=p.rad*0.42;
    var cx3=p.cx,cy3=p.cy;
    var A=[cx3-s3,cy3-s3],B=[cx3+s3,cy3-s3],Cc=[cx3+s3,cy3+s3],D=[cx3-s3,cy3+s3];
    var A2=[A[0]+d3,A[1]-d3*0.7],B2=[B[0]+d3,B[1]-d3*0.7],C2=[Cc[0]+d3,Cc[1]-d3*0.7],D2=[D[0]+d3,D[1]-d3*0.7];
    g.lineWidth=lw*0.75;
    g.strokeStyle=wireGrad(cx3-s3,cy3-s3,cx3+s3+d3,cy3+s3,bf*0.62);
    function seg2(P,Q){g.beginPath();g.moveTo(P[0]*DPR,P[1]*DPR);g.lineTo(Q[0]*DPR,Q[1]*DPR);g.stroke();}
    seg2(A2,B2);seg2(B2,C2);seg2(C2,D2);seg2(D2,A2);
    seg2(A,A2);seg2(B,B2);seg2(Cc,C2);seg2(D,D2);
    g.lineWidth=lw;
    g.strokeStyle=wireGrad(cx3-s3,cy3-s3,cx3+s3,cy3+s3,bf);
    seg2(B,Cc);seg2(Cc,D);seg2(D,A);
    // THE KINK — top front edge, straightened badly. Always here. Always the same.
    g.beginPath();
    g.moveTo(A[0]*DPR,A[1]*DPR);
    g.lineTo((A[0]+s3*0.62)*DPR,(A[1]+s3*0.030)*DPR);
    g.lineTo((A[0]+s3*0.90)*DPR,(A[1]-s3*0.115)*DPR);
    g.lineTo((A[0]+s3*1.20)*DPR,(A[1]+s3*0.018)*DPR);
    g.lineTo(B[0]*DPR,B[1]*DPR);
    g.stroke();
    g.lineWidth=lw*0.36;
    g.strokeStyle='rgba(246,224,164,'+(0.14+0.5*hot)+')';
    g.beginPath();
    g.moveTo((A[0]+s3*0.62)*DPR,(A[1]+s3*0.030)*DPR);
    g.lineTo((A[0]+s3*0.90)*DPR,(A[1]-s3*0.115)*DPR);
    g.stroke();
    g.lineWidth=lw*0.85;
    g.strokeStyle=wireGrad(cx3,cy3,cx3,cy3+s3*2.4,bf*0.66);
    g.beginPath();g.moveTo(cx3*DPR,(cy3+s3)*DPR);g.lineTo((cx3-s3*0.10)*DPR,(cy3+s3*2.4)*DPR);g.stroke();
  }
  // drips running down brass
  for(var di=0;di<f.drips.length;di++){
    var dp=f.drips[di];
    var dy2=p.cy+p.rad*(0.9+dp.p*1.6);
    g.fillStyle='rgba(232,236,255,'+(0.55*dp.life*Math.min(1,bf*1.5))+')';
    g.beginPath();g.arc((p.cx+p.rad*0.06)*DPR,dy2*DPR,Math.max(1,lw*0.55),0,Math.PI*2);g.fill();
  }
  g.restore();
}

/* ---------------------------------------------------------------
   TABLE / BEAM / TRAY
   --------------------------------------------------------------- */
function drawGround(){
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#0c0a0b';
  g.fillRect(0,0,cv.width,cv.height);
  // faint baize weave, only where the beam falls
  var ax=-0.16*W,ay=0.30*H;
  var grd=g.createRadialGradient(ax*DPR,ay*DPR,0,ax*DPR,ay*DPR,W*1.5*DPR);
  var k=arc.I;
  grd.addColorStop(0,'rgba(38,32,30,'+(0.55*k)+')');
  grd.addColorStop(0.25,'rgba(24,20,20,'+(0.34*k)+')');
  grd.addColorStop(0.62,'rgba(14,12,12,'+(0.16*k)+')');
  grd.addColorStop(1,'rgba(8,7,8,0)');
  // clipped to the cone
  g.save();
  g.beginPath();
  var c0=0.30+arc.ang;
  var sp=0.60;
  g.moveTo(ax*DPR,ay*DPR);
  g.lineTo((ax+Math.cos(c0-sp)*W*2.2)*DPR,(ay+Math.sin(c0-sp)*W*2.2)*DPR);
  g.lineTo((ax+Math.cos(c0+sp)*W*2.2)*DPR,(ay+Math.sin(c0+sp)*W*2.2)*DPR);
  g.closePath();g.clip();
  g.fillStyle=grd;g.fillRect(0,0,cv.width,cv.height);
  g.restore();

  // arc source itself — the one chip of violet-white
  var glow=g.createRadialGradient((ax+W*0.05)*DPR,ay*DPR,0,(ax+W*0.05)*DPR,ay*DPR,W*0.16*DPR);
  glow.addColorStop(0,'rgba(232,236,255,'+(0.72*arc.I)+')');
  glow.addColorStop(0.18,'rgba(232,236,255,'+(0.20*arc.I)+')');
  glow.addColorStop(1,'rgba(232,236,255,0)');
  g.fillStyle=glow;g.fillRect(0,0,cv.width,cv.height);

  // zinc tray, low left, catching the drip
  var tx=W*0.055,ty=H*0.90,tw=W*(portrait?0.30:0.16),tht=H*0.055;
  g.save();
  var tb=beamFactor(tx+tw/2,ty);
  g.strokeStyle='rgba(150,152,158,'+(0.10+0.26*Math.min(1,tb))+')';
  g.lineWidth=Math.max(1,1.6*DPR);
  g.beginPath();
  g.ellipse((tx+tw/2)*DPR,ty*DPR,tw/2*DPR,tht/2*DPR,0,0,Math.PI*2);
  g.stroke();
  g.fillStyle='rgba(30,32,36,'+(0.35+0.25*Math.min(1,tb))+')';
  g.beginPath();g.ellipse((tx+tw/2)*DPR,ty*DPR,tw/2*DPR,tht/2*DPR,0,0,Math.PI*2);g.fill();
  // wet meniscus glint
  g.strokeStyle='rgba(232,236,255,'+(0.18*Math.min(1,tb)*arc.I)+')';
  g.lineWidth=Math.max(1,1.1*DPR);
  g.beginPath();g.ellipse((tx+tw/2)*DPR,ty*DPR,tw/2*0.82*DPR,tht/2*0.7*DPR,0,Math.PI*0.9,Math.PI*1.5);g.stroke();
  g.restore();
  trayPos=[tx+tw/2,ty];
}
var trayPos=[0,0];

function drawJet(){
  if(!ptr.down||ptr.mode==='move'||ptr.mode==='catenoid')return;
  if(ptr.x<0)return;
  var px=ptr.x*W,py=ptr.y*H;
  var f=Math.min(1,ptr.downT/0.35);
  var rad=Math.min(W,H)*0.075*(0.7+0.5*f);
  var gr=g.createRadialGradient(px*DPR,py*DPR,0,px*DPR,py*DPR,rad*DPR);
  gr.addColorStop(0,'rgba(232,236,255,'+(0.055*f*arc.I)+')');
  gr.addColorStop(0.5,'rgba(232,236,255,'+(0.018*f)+')');
  gr.addColorStop(1,'rgba(232,236,255,0)');
  g.fillStyle=gr;
  g.beginPath();g.arc(px*DPR,py*DPR,rad*DPR,0,Math.PI*2);g.fill();
}

/* ---------------------------------------------------------------
   LOOP
   --------------------------------------------------------------- */
var last=performance.now()/1000, tAcc=0, dripT=2.5;
function frame(){
  var now=performance.now()/1000;
  var dt=Math.min(0.05,now-last);last=now;
  tAcc+=dt;
  updateArc(now,dt);
  if(started&&hissGain){
    hissGain.gain.value=0.030+0.030*arc.I;
    if(arc.crackle>0.35&&Math.random()<0.25)crackleSound(arc.crackle);
  }
  if(ptr.down)ptr.downT+=dt;else ptr.downT=0;
  if(started&&blowGain){
    var target=(ptr.down&&ptr.mode==='blow')?Math.min(0.10,0.026+ptr.downT*0.05):0;
    blowGain.gain.value+=(target-blowGain.gain.value)*Math.min(1,dt*6);
    if(blowFilt)blowFilt.frequency.value=420+ptr.downT*220;
  }
  dripT-=dt;
  if(dripT<=0){dripT=2.2+Math.random()*4.4;dripSound();}

  // frame velocities for slosh
  for(var i=0;i<films.length;i++){
    var f=films[i];
    f.vx=(f.x-f.px)/Math.max(dt,0.001);f.vy=(f.y-f.py)/Math.max(dt,0.001);
    f.px=f.x;f.py=f.y;
    if(Math.abs(f.vy)+Math.abs(f.vx)>1.6&&Math.random()<dt*4&&!f.eternal)slitherSound(0.3);
    // drip decay
    for(var d=f.drips.length-1;d>=0;d--){
      var dp=f.drips[d];dp.p+=dp.v*dt;dp.life-=dt*0.8;
      if(dp.life<=0||dp.p>1)f.drips.splice(d,1);
    }
    // jet mapped to this film's local uv
    var jet=null;
    if(ptr.down&&ptr.mode==='blow'&&ptr.x>=0){
      var p=filmPx(f);
      var boxW,boxH;
      if(f.type==='ring'){boxW=p.rad*2;boxH=p.rad*2;}
      else if(f.type==='catenoid'){boxW=p.rad*2;boxH=p.rad*2*f.sepHalf;}
      else{boxW=p.rad*1.8;boxH=p.rad*1.8;}
      var u=(ptr.x*W-(p.cx-boxW/2))/boxW;
      var v=(ptr.y*H-(p.cy-boxH/2))/boxH;
      if(u>-0.6&&u<1.6&&v>-0.6&&v<1.6){
        jet={u:u,v:v,r:0.20,f:Math.min(1.4,0.35+ptr.downT*0.55)};
      }
    }
    f.step(dt,jet);
  }

  drawGround();
  for(i=0;i<films.length;i++)drawFilm(films[i],now);
  drawJet();

  requestAnimationFrame(frame);
}

resize();
// stagger the dips so the table is never all at once
films[1].age=22;films[3].age=41;films[0].age=8;
requestAnimationFrame(frame);

/* the whole of it, on the back of the programme:
   2 n t = (m + 1/2) lambda   ->  bright
   2 n t = m lambda           ->  dark
   below 30 nm both reflections cancel and you get the black film,
   which is not a hole, though every year somebody puts a finger through it.
   Taylor-Culick: v = sqrt(2 gamma / rho h).  Thirty nanometres tears at
   about forty-five metres a second.  You cannot see the hole open.  You
   see that it has opened.                                                 */
try{
  if(window.console&&console.log){
    console.log('%cn = 1.34 · half-wave shift at the front face · black film below ~30 nm','color:#c08a2e;font:12px Georgia,serif');
    console.log('%ccatenoid exists only while separation / diameter < 1.325','color:#c08a2e;font:12px Georgia,serif');
  }
}catch(e){}
})();
