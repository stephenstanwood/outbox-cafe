  <meta name="outbox-spec-era" content="Late April 1971, right now — twenty past three on a warm afternoon in the projection well of a municipal planetarium in Wichita, Kansas, between the 2:30 grade-school show and the 4:00 public sitting. The dome is 40 feet, the star ball is capped and cooling, and the whole ceiling is currently being painted by two converted 500-watt overhead projectors with clock glasses of dyed water and mineral oil sitting on their hot platens. Not a look-back at anything, not a lament, not a memory of vanished venues: the 4:00 is a paying house of 180, the oil in the left glass has been on a hot platen since one o'clock and is thinning, and the magenta dye bottle in the drawer is a third full with no more coming until the school district's purchase order clears in June.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the planetarium dome seen from a seat halfway back, so the image is a real spherical projection: one enormous soft-edged circle of wet colour thrown up onto white acoustic perforated aluminium, with the perf pattern genuinely visible through the light and the dome's curvature genuinely stretching the projected shapes toward the springline. Inside that circle are two overlapping clock glasses of immiscible fluid, several inches across in reality and thirty feet across up there. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label, no readable character anywhere at any time. It is a live immiscible-fluid and thermal-convection engine: dyed water and mineral oil at real interfacial tension, heated from below by a real lamp, breaking into real Bénard cells and real coalescing blobs whose shapes are computed and never drawn, eased or keyframed. The visitor's whole vocabulary is what a hand does on a hot platen — tilt a glass, press a second glass down onto the first to squeeze the film thinner, crank the aperture wheel to open the lamp up — and the cursor is not a pointer but a hand in the light path, which occludes. Nothing scrolls. Nothing resets.">
  <meta name="outbox-spec-subject" content="The flat fluid mechanics and flat dye chemistry of a wet show, and specifically that almost none of what happens up on the dome is chosen by the person doing it. That the whole picture is an immiscibility problem: mineral oil and dyed water will not mix at any temperature the platen can reach, so what the audience is watching is interfacial tension resolving itself over and over, and every round blob up there is round because a sphere is the lowest-area shape a given volume of one fluid can take inside the other, full stop. That BLOB SIZE IS SET BY FILM THICKNESS AND NOTHING ELSE — squeeze a glass down and the same volume of oil is forced into a thinner layer, so it stops being lenses and becomes a mesh of cells, and lifting the glass a sixteenth of an inch reverses it instantly, which means the single most dramatic move in the whole show is a hand pressing down and no audience has ever known that. That HEAT IS THE MOTOR: the lamp puts 500 watts through a condenser lens into the bottom of a glass dish, the fluid at the bottom is warmer and less dense than the fluid at the top, and past a real threshold in that temperature difference the layer stops conducting and starts convecting, organising itself into honest polygonal Bénard cells whose width is roughly the depth of the layer and whose circulation speed goes up with the excess heating — so a projectionist who cranks the aperture for a brighter picture gets a faster picture too, and cannot have one without the other. That VISCOSITY FALLS HARD WITH TEMPERATURE, roughly halving for every twenty or thirty degrees in mineral oil, so a glass that has been sitting on a hot platen since one o'clock is running visibly faster and looser than the identical glass put down five minutes ago, and the two halves of the same show do not match by the middle of the afternoon. That the useful working window is narrow at both ends: too cool and the layer just sits there conducting and does nothing; too hot and the cells lose their geometry, go turbulent, and the colours mechanically stir into an even brown that no amount of tilting will separate — a wet show has an actual expiry. That the COLOURS ARE ANILINE DYES IN THE WATER PHASE ONLY, which is why the oil reads as clear lenses and never as colour, and why every edge you see is a refracting boundary and not a painted line. That those dyes BLEACH under the lamp at a real rate that depends on which dye it is — the reds and magentas go first and fastest, the blue-greens and the copper-sulphate blues hold for hours — so a glass drifts in hue across a single afternoon in a fixed direction, always toward the blue end, and the make-up bottle is the only cure. That LENSING IS THE SECOND PICTURE: an oil lens sitting in water has a genuine focal length, so it projects a real caustic — a bright rim and a hot point — onto the dome, and those caustics are what people actually remember and are not something anybody put there. That the DOME IS A LENS TOO, in the wrong direction: a flat glass projected onto a hemisphere from a fixed point stretches everything toward the edges, so a circle at the middle of the dish is a circle overhead and an oval at the springline, and the geometry cannot be corrected without a fisheye the department did not buy. That the PERFORATED ALUMINIUM eats about a fifth of the light and puts a fine regular grid over everything, which is why the picture is always softer than it looks in the glass. That the lamp's own colour temperature sags as the ballast heats, so the entire dome goes warmer over the afternoon by a real amount and every dye reads differently against it. And the flat arithmetic in the well: two projectors, one aperture wheel that sticks, a third of a bottle of magenta, a house of 180 at four o'clock, and a left-hand glass that has about forty minutes of geometry left in it.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the glass, the heat and the fan, and that register is GREASY, WARM, BRIGHT, SLIGHTLY WOBBLY and PLAINLY HANDMADE — a picture that is enormous and gorgeous and is being produced eight inches across by somebody's fingers on a hot platen; fluid that is genuinely heavy and slow when it is cool and genuinely runny when it is not; a projector fan running the whole time and never once stopping; a wet glass that squeaks against another wet glass; a hand that is in the beam more often than it means to be; light spilling around the edges of the stage and putting a dull amber wash across the lower third of the dome that no projectionist has ever been able to kill. It is a warm room, it is the middle of the afternoon, and the work is cheerful and a bit sticky. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cells go on turning over whether or not anybody touches a glass. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT trippy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT cosmic, NOT reverent — this is two dishes of coloured water on a hot lamp at twenty past three with a paying house at four.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and every colour on the dome is COMPUTED and never chosen. The ground is perforated white acoustic aluminium under a dark room: bare dome (#e4e6e1) where nothing is thrown on it, dropping to a cool unlit grey toward the springline (#9ba1a2), with a real regular perf grid that is visible through every projected shape and genuinely reduces its contrast, and a dull amber spill wash across the lower third from the stage lights that cannot be removed (#c9a375 at ten percent). Against that, the fluid: EVERY PIXEL OF PROJECTED COLOUR IS THE OUTPUT OF DYE ARITHMETIC — each water cell carries an actual concentration of each aniline dye, an actual path length through the layer, and an actual accumulated bleach dose, and its transmitted colour comes out of Beer–Lambert absorption against the lamp's live spectrum and nothing else. So a deep pool of magenta reads a saturated crimson-pink (#d5197c), the same dye stretched thin over a squeezed film reads a pale hot rose (#f2a3c4), copper-sulphate blue-green in depth reads a hard teal (#12a3a0) and thin reads a chalky aqua (#8fd4d0), and where the two overlap the engine multiplies the absorptions honestly and gets a real muddy indigo-brown (#4a4a55) rather than a picked purple. Mineral oil carries no dye at all and renders only as refraction: clear lenses whose rims are computed caustics — a bright thin ring and a hot focal point measurably brighter than the surrounding dome (#fffaf0). Bleaching is live and permanent, so the magentas thin and grey across the afternoon and the teals do not, and the whole dome drifts blue-green while the lamp's own colour temperature sags warm underneath it, and the two drifts do not cancel. Exactly one chip of the aperture wheel's painted index red (#b02a1e) is held strictly for the wheel's own pointer and the metal shade over the platen — the only two solid objects in frame — and it never appears in the projection. Flat, hard, high contrast in the middle of the dome and honestly washed at the edges; no glow filter, no bloom, no lens flare, no soft focus, no gradients other than honest absorption, honest caustics, honest perf grid and honest spill.">
  <meta name="outbox-spec-wildcard" content="THE CURSOR IS NEVER RENDERED AS A CURSOR. The system pointer is hidden and never replaced by a dot, a crosshair, a glyph, a glow, a trail or a custom icon of any kind. The visitor's only evidence of their own position is the shadow their hand casts into the light path and onto the dome — a real soft-edged silhouette whose penumbra width is computed from how far the hand currently is from the lamp, so it is razor-sharp when the hand is down on the platen and enormous and vague when it is lifted away. Move off the projector entirely and there is no shadow and therefore no pointer at all, and the page gives no other feedback about where anything is.">
  <meta name="outbox-spec-forbidden" content="NO psychedelia framing of any kind — no acid, no trip, no expanded consciousness, no Summer of Love, no counterculture, no 'far out', no sixties-as-myth, no Fillmore, no Joshua Light Show hagiography, no Pink Floyd, no Hendrix, no strobe-and-incense, no dropout mysticism, no chakras, no third eye. NO cosmic register whatsoever, despite the room being a planetarium: no stars, no galaxies, no nebula comparison, no 'the universe in a dish', no Sagan, no wonder, no smallness, no awe, no 'we are made of' anything, no the-dome-as-heaven. NO lava-lamp kitsch, NO retro-kitsch, NO camp, NO ironic affection for 1971, NO Austin Powers, NO groovy, NO shag-carpet-and-macramé colour writing, NO Nixon, NO Vietnam drift, NO moon-landing hindsight, NO 1971-as-period-signifier at all. NO nostalgia, NO wistfulness, NO 'nobody does wet shows anymore / lasers killed it / the planetarium closed in 1994' decline narrative — there is a paying house at four. NO craftsman-sage register, NO 'the old light-show men could read a glass from the booth', NO trade mystique, NO artisan sermon, NO analogue-versus-digital argument, NO master-and-apprentice arc, NO reverence for hand skill. NO colour lyricism: no describing the fluid as molten, jewelled, liquid fire, bleeding, breathing or blooming; colour here is dye concentration, path length and remaining bleach headroom. NO fluid lyricism: no dancing, no swirling-as-emotion, no 'shapes that have never existed before', no organic-versus-mechanical framing, no cells-as-life, no amoeba or cellular-division imagery, no microscope-slide reverie. NO physics-as-beauty, NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the wonderful part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, chillout, ambient-visualiser, generative-art-gallery, music-visualiser, VJ-set or screensaver framing whatsoever, and no 'let it wash over you' — the fan is loud, the glass is greasy and there is a hand in the beam. NO Kansas travelogue and NO explaining the Midwest to anybody: no big sky, no wheat, no tornado, no flyover condescension, no Wizard of Oz, no small-city pathos, no municipal-budget satire, no bureaucratic-absurd, no committee minutes, no department-of-X. NO school-group comedy and NO children-as-wonderstruck sentiment. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the darkening room, the bleaching dye or the glass that goes muddy and cannot be fixed — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / found-media / relic framing of any object in the well — both glasses were filled this morning and one of them is too hot right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / booth-operator / log / 3am voice — it is twenty past three in the afternoon and the house lights in the lobby are up. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<style>
  html,body{margin:0;padding:0;background:#0a0b0c;overflow:hidden;height:100%;width:100%;}
  body{cursor:none;}
  #dome{display:block;width:100vw;height:100vh;touch-action:none;}
  /* the perf grid is drawn in the canvas, not here — it has to sit under the shapes */
  #af{position:fixed;left:0;bottom:0;font-size:9px;color:#3a3c3d;background:transparent;padding:5px 8px;font-family:Georgia,serif;opacity:.30;transition:opacity .4s;z-index:5;}
  #af:hover{opacity:.85;}
  #af a{color:#5d6062;text-decoration:none;border-bottom:1px dotted #45484a;}
  #af a:hover{color:#c9a375;}
  @media (max-width:700px){#af{font-size:8px;}}

<body>
<canvas id="dome"></canvas>
<div id="af"><a href="/archive">the other sittings</a></div>
<!--
  glass A: filled 8:40am, on the platen since one o'clock. running loose.
  glass B: set down five past three, still stiff.
  magenta bottle: a third. cyan: most of one. PO clears in June.
  drag on a glass to tilt. press and hold to squeeze the cover down. wheel the aperture at the lower right of the light.
-->
<script>
(function(){
"use strict";

var cv=document.getElementById("dome"), g=cv.getContext("2d");
var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cv.clientWidth=window.innerWidth;H=cv.clientHeight=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();

/* ---------- persistence, forward only ---------- */
var KEY="wichita.well.1971";
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){S=null;}
if(!S||typeof S.lampHours!=="number"){
  S={lampHours:0,
     glassHours:[2.33,0.08],           // left glass on the platen since one o'clock
     dose:[{m:0,c:0,y:0},{m:0,c:0,y:0}],
     conc:[{m:0.92,c:0.34,y:0.11},{m:0.30,c:0.88,y:0.22}],
     drops:{m:41,c:96},
     aperture:0.55};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var saveT=0;

/* ---------- audio: fan, ballast, dome tail ---------- */
var AC=null,nodes={},audioOn=false;
function startAudio(){
  if(audioOn)return; audioOn=true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  var out=AC.createGain(); out.gain.value=0.0; out.connect(AC.destination);
  nodes.out=out;
  // dome tail: 40ft hemisphere ~ 1.6s
  var len=Math.floor(AC.sampleRate*1.7), buf=AC.createBuffer(2,len,AC.sampleRate);
  for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch);
    for(var i=0;i<len;i++){var t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*(i<AC.sampleRate*0.011?i/(AC.sampleRate*0.011):1);} }
  var cv2=AC.createConvolver(); cv2.buffer=buf;
  var wet=AC.createGain(); wet.gain.value=0.34; cv2.connect(wet); wet.connect(out);
  nodes.rev=cv2;
  // fan: broadband + blade-passing tone + one bearing slightly out
  var nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);
  for(var j=0;j<nd.length;j++)nd[j]=Math.random()*2-1;
  var ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
  var nf=AC.createBiquadFilter();nf.type="bandpass";nf.frequency.value=420;nf.Q.value=0.55;
  var ng=AC.createGain();ng.gain.value=0.085;
  ns.connect(nf);nf.connect(ng);ng.connect(out);ng.connect(cv2);ns.start();
  var blade=AC.createOscillator();blade.type="sawtooth";blade.frequency.value=173;
  var bf=AC.createBiquadFilter();bf.type="lowpass";bf.frequency.value=700;
  var bg=AC.createGain();bg.gain.value=0.026;
  blade.connect(bf);bf.connect(bg);bg.connect(out);bg.connect(cv2);blade.start();
  nodes.blade=blade;
  // bearing: slow amplitude wobble, out of true
  var wob=AC.createOscillator();wob.type="sine";wob.frequency.value=5.7;
  var wg=AC.createGain();wg.gain.value=0.012;wob.connect(wg);wg.connect(bg.gain);wob.start();
  // ballast hum, line frequency + third harmonic
  var hb=AC.createGain();hb.gain.value=0.0; hb.connect(out);hb.connect(cv2);
  [60,180,300].forEach(function(f,k){var o=AC.createOscillator();o.type="sine";o.frequency.value=f;
    var q=AC.createGain();q.gain.value=[0.05,0.028,0.011][k];o.connect(q);q.connect(hb);o.start();});
  nodes.hum=hb;
  out.gain.linearRampToValueAtTime(0.9,AC.currentTime+2.2);
  // floor buffer somewhere in the building, its own irregular clock
  scheduleBuffer(); scheduleDoor(); scheduleHouse();
}
function tone(f,dur,typ,gain,filt){
  if(!AC)return;var o=AC.createOscillator();o.type=typ||"sine";o.frequency.value=f;
  var q=AC.createGain();q.gain.setValueAtTime(0.0001,AC.currentTime);
  q.gain.exponentialRampToValueAtTime(gain,AC.currentTime+0.004);
  q.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  var n=o;
  if(filt){var bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=filt;bp.Q.value=3;o.connect(bp);n=bp;}
  n.connect(q);q.connect(nodes.out);q.connect(nodes.rev);o.start();o.stop(AC.currentTime+dur+0.05);
}
function noiseBurst(dur,fc,q0,gain){
  if(!AC)return;var n=AC.createBufferSource();
  var b=AC.createBuffer(1,Math.ceil(AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  n.buffer=b;var f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=fc;f.Q.value=q0;
  var gg=AC.createGain();gg.gain.setValueAtTime(gain,AC.currentTime);
  gg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  n.connect(f);f.connect(gg);gg.connect(nodes.out);gg.connect(nodes.rev);n.start();
}
function scheduleBuffer(){ // floor machine, irregular
  setTimeout(function(){ if(AC){ var f=88+Math.random()*22;
    var o=AC.createOscillator();o.type="triangle";o.frequency.value=f;
    var q=AC.createGain();q.gain.value=0.0;o.connect(q);q.connect(nodes.rev);o.start();
    q.gain.linearRampToValueAtTime(0.018,AC.currentTime+1.4);
    var dur=6+Math.random()*11;
    q.gain.setValueAtTime(0.018,AC.currentTime+dur);
    q.gain.linearRampToValueAtTime(0.0,AC.currentTime+dur+1.6);
    o.stop(AC.currentTime+dur+2);
  } scheduleBuffer();},18000+Math.random()*44000);
}
var doorsLeft=2;
function scheduleDoor(){
  if(doorsLeft<=0)return;
  setTimeout(function(){ doorsLeft--; noiseBurst(0.09,900,1.2,0.10); setTimeout(function(){tone(96,0.32,"sine",0.09);},520); scheduleDoor(); },
    95000+Math.random()*160000);
}
var house=null;
function scheduleHouse(){
  setTimeout(function(){
    if(!AC)return;
    var b=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*(0.4+0.6*Math.abs(Math.sin(i/9000)));}
    var s=AC.createBufferSource();s.buffer=b;s.loop=true;
    var f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=560;f.Q.value=0.7;
    var q=AC.createGain();q.gain.value=0.0;
    s.connect(f);f.connect(q);q.connect(nodes.rev);q.connect(nodes.out);s.start();
    q.gain.linearRampToValueAtTime(0.055,AC.currentTime+40);
    house=q;
  },8*60*1000);
}
window.addEventListener("pointerdown",startAudio,{once:false});
window.addEventListener("keydown",startAudio,{once:false});

/* ---------- geometry of the well ---------- */
// dome circle: seen from a seat halfway back. springline at the frame edge.
function domeGeom(){
  var cx=W*0.5, cy=H*0.46, R=Math.min(W,H)*0.60;
  return {cx:cx,cy:cy,R:R};
}
// projector at fixed point below/behind. a flat glass coordinate (u,v in -1..1)
// maps onto the hemisphere: honest edge stretch, r_dome = tan-ish of r_glass.
function project(u,v,gl){
  var D=domeGeom();
  var r=Math.sqrt(u*u+v*v), a=Math.atan2(v,u);
  // gnomonic-ish: flat plane -> hemisphere seen from off-axis seat
  var rr=Math.tan(r*0.83)/Math.tan(0.83);            // stretch toward springline
  var ex=gl.ox+rr*Math.cos(a)*gl.scale;
  var ey=gl.oy+rr*Math.sin(a)*gl.scale;
  // seat halfway back: vertical foreshortening near the springline
  var er=Math.sqrt(ex*ex+ey*ey);
  var fore=1-0.16*er*er;
  return {x:D.cx+ex*D.R, y:D.cy+ey*D.R*fore, r:er, stretch:1+0.55*er*er};
}

/* ---------- the fluid engine ---------- */
// Two glasses. Each holds a set of water parcels carrying dye, and oil parcels
// carrying none. Blobs are not sprites: their radius comes out of volume
// conservation against current film thickness, and merging is interfacial-area
// minimisation. Convection is threshold-based on Ra ~ dT * h^3 / (nu * kappa).

function Parcel(gl,phase){
  var a=Math.random()*Math.PI*2,rr=Math.pow(Math.random(),0.55)*0.82;
  this.u=Math.cos(a)*rr; this.v=Math.sin(a)*rr;
  this.vu=0; this.vv=0;
  this.phase=phase;                 // "oil" | "water"
  this.vol=(phase==="oil"?0.0022:0.0030)*(0.45+Math.random()*1.4);
  this.T=0; this.rad=0;
  this.dye=null;
  this.cellPhase=Math.random()*Math.PI*2;
}

function Glass(idx,ox,oy,scale,hours){
  this.idx=idx; this.ox=ox; this.oy=oy; this.scale=scale;
  this.hours=hours;                 // accumulated hours on the platen
  this.Tbulk=22+ (hours>1?46:9);    // left glass came in hot
  this.thick=1.0;                   // film thickness, 1.0 = free
  this.thickTarget=1.0;
  this.tiltU=0; this.tiltV=0;
  this.p=[];
  var nOil=52, nWat=44;
  for(var i=0;i<nOil;i++)this.p.push(new Parcel(this,"oil"));
  for(var k=0;k<nWat;k++){var w=new Parcel(this,"water"); w.dye=idx; this.p.push(w);}
  this.cellK=0; this.Ra=0; this.circ=0; this.nu=0;
}

var GL=[new Glass(0,-0.20,-0.04,0.62,S.glassHours[0]),
        new Glass(1, 0.21, 0.06,0.58,S.glassHours[1])];

/* ---------- dye arithmetic: Beer–Lambert against the live lamp ---------- */
// three aniline stocks: magenta (fast bleach), cyan/copper-sulphate (slow), yellow (mid)
// absorption coefficients per unit conc per unit path, in R,G,B
var DYE={
  m:{a:[0.22,3.30,1.05],bleach:0.000041},
  c:{a:[2.90,0.42,0.30],bleach:0.0000062},
  y:{a:[0.14,0.30,2.60],bleach:0.000019}
};
function lampSpectrum(){
  // colour temperature sags warm as the ballast heats
  var sag=Math.min(1,S.lampHours/2.4);
  return [1.00, 0.965-0.045*sag, 0.905-0.150*sag];
}
function transmit(cm,cc,cy,path,gainOut){
  var L=lampSpectrum(), o=gainOut||[0,0,0];
  for(var i=0;i<3;i++){
    var A=(cm*DYE.m.a[i]+cc*DYE.c.a[i]+cy*DYE.y.a[i])*path;
    o[i]=L[i]*Math.exp(-A);
  }
  return o;
}

/* ---------- interaction state ---------- */
var hand={x:-9999,y:-9999,z:1.0,down:false,inFrame:false}; // z: 1 = up near lamp-ish, 0 = on the platen
var dragging=null, lastPt=null, squeeze=false, squeezeGlass=null;
var aperture=S.aperture;            // 0..1
var wheel={x:0,y:0,r:0};
var wheelDrag=false, wheelDetent=-1, stickyStop=4;

function glassAtScreen(x,y){
  var D=domeGeom(), best=null,bd=1e9;
  for(var i=0;i<GL.length;i++){
    var gl=GL[i];
    var cx=D.cx+gl.ox*D.R, cy=D.cy+gl.oy*D.R;
    var d=Math.hypot(x-cx,y-cy);
    if(d<D.R*gl.scale*1.05 && d<bd){bd=d;best=gl;}
  }
  return best;
}

function pt(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left),y:(e.clientY-r.top)};
}
cv.addEventListener("pointermove",function(e){
  var p=pt(e); hand.x=p.x; hand.y=p.y; hand.inFrame=true;
  if(wheelDrag){
    var a=Math.atan2(p.y-wheel.y,p.x-wheel.x);
    var na=(a+Math.PI*2)%(Math.PI*2);
    var t=na/(Math.PI*2);
    var stops=9, idx=Math.round(t*stops)%stops;
    if(idx!==wheelDetent){
      // one stop sticks honestly
      if(idx===stickyStop && Math.random()<0.62){ /* sticks: no move, small scrape */ noiseBurst(0.035,2200,2.4,0.05); }
      else{ wheelDetent=idx; aperture=0.08+0.92*(idx/(stops-1)); tone(1650+idx*40,0.045,"square",0.055,2400); noiseBurst(0.02,3100,3,0.05); }
    }
    return;
  }
  if(dragging&&lastPt){
    var D=domeGeom();
    var du=(p.x-lastPt.x)/(D.R*dragging.scale);
    var dv=(p.y-lastPt.y)/(D.R*dragging.scale);
    dragging.tiltU+=du*1.5; dragging.tiltV+=dv*1.5;
    var sp=Math.hypot(p.x-lastPt.x,p.y-lastPt.y);
    if(sp>2.0&&Math.random()<0.35){
      // wet squeak: brightness tracks true sliding speed, dulls as film thins
      var br=380+sp*95*dragging.thick;
      noiseBurst(0.055+Math.min(0.10,sp/240),Math.min(4200,br),7+dragging.thick*7,0.035+Math.min(0.05,sp/400));
    }
    lastPt=p;
  }
  if(squeeze&&squeezeGlass){
    hand.z=Math.max(0,Math.min(1,1-(0.55+ (H-p.y)/H*0.4)));
  }
});
cv.addEventListener("pointerleave",function(){hand.inFrame=false;});
cv.addEventListener("pointerdown",function(e){
  startAudio();
  var p=pt(e); hand.x=p.x;hand.y=p.y;hand.inFrame=true;
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  if(Math.hypot(p.x-wheel.x,p.y-wheel.y)<wheel.r*1.5){ wheelDrag=true; return; }
  var gl=glassAtScreen(p.x,p.y);
  if(gl){
    dragging=gl; lastPt=p;
    // press-and-hold squeezes the cover glass down
    squeezeGlass=gl; squeeze=true;
    tone(210+gl.idx*36,0.24,"sine",0.10,520); // ceramic knock, glass onto platen
    noiseBurst(0.03,1400,2,0.05);
  }
});
window.addEventListener("pointerup",function(){
  if(squeezeGlass){ squeezeGlass=null; }
  squeeze=false; dragging=null; lastPt=null; wheelDrag=false; hand.z=1.0;
});
// keyboard: nothing labelled, but the drawer opens
window.addEventListener("keydown",function(e){
  if(e.key==="m"||e.key==="M"){ if(S.drops.m>0){S.drops.m--; addDrop(GL[0],"m",0.09); } }
  if(e.key==="c"||e.key==="C"){ if(S.drops.c>0){S.drops.c--; addDrop(GL[1],"c",0.09); } }
});
function addDrop(gl,which,amt){
  S.conc[gl.idx][which]=Math.min(1.6,S.conc[gl.idx][which]+amt);
  tone(740,0.08,"sine",0.06,900); save();
}

/* ---------- simulation step ---------- */
var last=performance.now(), acc=0;
function step(dt){
  var ap=aperture;
  S.lampHours+=dt/3600;
  // ballast level tracks lamp current
  if(nodes.hum)nodes.hum.gain.value=0.10+0.30*ap;
  if(nodes.blade){ // motor warms, pitch sags a few cents
    var sag=Math.min(1,S.lampHours/1.2);
    nodes.blade.frequency.value=173*(1-0.0075*sag);
  }

  for(var i=0;i<GL.length;i++){
    var gl=GL[i];
    gl.hours+=dt/3600;
    // heat flux from aperture; loss to the room
    var flux=520*ap;                                   // watts through the condenser
    var loss=(gl.Tbulk-23)*3.4;
    gl.Tbulk+=(flux-loss)*dt*0.00042;
    gl.Tbulk=Math.min(148,gl.Tbulk);
    // film thickness: squeezing
    var target=1.0;
    if(squeezeGlass===gl){ target=0.30+0.55*hand.z; }
    gl.thickTarget=target;
    gl.thick+=(gl.thickTarget-gl.thick)*Math.min(1,dt*7.5);
    var h=gl.thick;

    // viscosity halves roughly every 25 degrees
    var nu=1.0*Math.pow(0.5,(gl.Tbulk-24)/25);
    nu=Math.max(0.045,nu); gl.nu=nu;
    // Rayleigh-like number: dT * h^3 / nu ; threshold ~ constant
    var dT=(flux*0.055)/(1+h*2.0);
    var Ra=dT*h*h*h/nu; gl.Ra=Ra;
    var Rac=1.72;
    var excess=Ra/Rac;
    // circulation speed rises with excess above threshold; zero below it
    gl.circ = excess>1 ? Math.min(2.6,Math.sqrt(excess-1)*0.72) : 0;
    // cell width ~ layer depth
    gl.cellK = 3.05/Math.max(0.16,h);
    // above a second threshold, geometry breaks and colours stir toward brown
    var turb = excess>7.5 ? Math.min(1,(excess-7.5)/9) : 0;
    gl.turb=turb;

    // bleach dose: forward only, rate by dye, scaled by aperture
    var d=S.dose[i], c=S.conc[i];
    var doseStep=ap*dt;
    c.m=Math.max(0.0,c.m-DYE.m.bleach*doseStep*c.m*140);
    c.c=Math.max(0.0,c.c-DYE.c.bleach*doseStep*c.c*140);
    c.y=Math.max(0.0,c.y-DYE.y.bleach*doseStep*c.y*140);
    d.m+=doseStep;d.c+=doseStep;d.y+=doseStep;

    // parcels
    var P=gl.p, n=P.length;
    var k=gl.cellK, circ=gl.circ, T=performance.now()/1000;
    for(var a=0;a<n;a++){
      var q=P[a];
      // radius from volume conservation against current film thickness
      var vol=q.vol;
      q.rad=Math.sqrt(vol/(Math.PI*Math.max(0.10,h)))*1.62;
      // Bénard roll velocity field, cells of width ~ h
      var fu=0,fv=0;
      if(circ>0){
        fu = Math.sin(k*q.u+q.cellPhase*0.0)*Math.cos(k*q.v)*circ;
        fv = -Math.cos(k*q.u)*Math.sin(k*q.v+0.0)*circ;
        if(turb>0){
          fu+=Math.sin(k*2.7*q.v+T*1.7+a)*circ*turb*1.4;
          fv+=Math.cos(k*2.3*q.u-T*1.3+a)*circ*turb*1.4;
        }
      }
      // buoyancy + tilt (gravity component from the tilted glass)
      fu+=gl.tiltU*(q.phase==="water"?1.0:0.72)*2.2;
      fv+=gl.tiltV*(q.phase==="water"?1.0:0.72)*2.2;
      // drag scales with viscosity
      var drag=Math.min(0.94, 2.6*nu*dt*8+0.10);
      q.vu+=fu*dt*0.55; q.vv+=fv*dt*0.55;
      q.vu*=(1-drag); q.vv*=(1-drag);
      q.u+=q.vu*dt; q.v+=q.vv*dt;
      // wall of the dish: interfacial pinning at the rim
      var rr=Math.hypot(q.u,q.v);
      if(rr>0.88){var s=0.88/rr;q.u*=s;q.v*=s;q.vu*=-0.34;q.vv*=-0.34;}
    }
    // interfacial-tension resolution between like phases: coalesce toward
    // minimum interface area (nearby same-phase parcels merge, volume conserved)
    for(var b=0;b<n;b++){
      var A1=P[b]; if(A1.vol<=0)continue;
      for(var c2=b+1;c2<n;c2++){
        var B1=P[c2]; if(B1.vol<=0||B1.phase!==A1.phase)continue;
        var dx=B1.u-A1.u, dy=B1.v-A1.v, dd=Math.hypot(dx,dy);
        var touch=(A1.rad+B1.rad)*0.72;
        if(dd<touch){
          // thin films resist merging; thick films merge readily
          if(Math.random()<0.010*h*(1+circ)){
            var tv=A1.vol+B1.vol;
            A1.u=(A1.u*A1.vol+B1.u*B1.vol)/tv; A1.v=(A1.v*A1.vol+B1.v*B1.vol)/tv;
            A1.vol=tv; B1.vol=0; B1.u=99;
          }else if(dd>0.0001){
            var push=(touch-dd)*0.28;
            A1.u-=dx/dd*push; A1.v-=dy/dd*push;
            B1.u+=dx/dd*push; B1.v+=dy/dd*push;
          }
        }
      }
    }
    // volume returns: an emptied parcel refills from the bulk elsewhere,
    // because the dish never loses fluid
    for(var e2=0;e2<n;e2++){
      var z=P[e2];
      if(z.vol<=0){
        var donor=null;
        for(var f2=0;f2<n;f2++){var cand=P[f2];if(cand.phase===z.phase&&cand.vol>0.0045){if(!donor||cand.vol>donor.vol)donor=cand;}}
        if(donor){
          var take=donor.vol*0.42; donor.vol-=take; z.vol=take;
          var an=Math.random()*Math.PI*2, rn=Math.random()*0.8;
          z.u=Math.cos(an)*rn; z.v=Math.sin(an)*rn; z.vu=z.vv=0;
        }else{ z.vol=0.0022; z.u=0;z.v=0; }
      }
    }
    S.glassHours[i]=gl.hours;
  }
  S.aperture=aperture;
  saveT+=dt; if(saveT>4){saveT=0;save();}
}

/* ---------- render ---------- */
var perfCanvas=null,perfScale=0;
function buildPerf(){
  perfCanvas=document.createElement("canvas");
  var sz=64; perfCanvas.width=sz;perfCanvas.height=sz;
  var p=perfCanvas.getContext("2d");
  p.clearRect(0,0,sz,sz);
  p.fillStyle="rgba(30,32,34,0.42)";
  var pitch=8;
  for(var y=0;y<sz;y+=pitch){
    for(var x=(y/pitch%2)*pitch/2;x<sz;x+=pitch){
      p.beginPath();p.arc(x+0.5,y+0.5,1.28,0,6.2832);p.fill();
    }
  }
  perfScale=sz;
}
buildPerf();

function clamp01(v){return v<0?0:v>1?1:v;}

function render(){
  var D=domeGeom();
  // bare dome + springline falloff + dead room
  g.fillStyle="#0a0b0c"; g.fillRect(0,0,W,H);
  var gr=g.createRadialGradient(D.cx,D.cy,D.R*0.05,D.cx,D.cy,D.R*1.02);
  gr.addColorStop(0,"#e4e6e1"); gr.addColorStop(0.62,"#d3d6d3"); gr.addColorStop(0.90,"#a9aeae"); gr.addColorStop(1,"#9ba1a2");
  g.save();
  g.beginPath();g.arc(D.cx,D.cy,D.R,0,6.2832);g.clip();
  g.fillStyle=gr;g.fillRect(D.cx-D.R,D.cy-D.R,D.R*2,D.R*2);

  // ---- projected fluid, additive-through-transmission ----
  g.globalCompositeOperation="multiply";
  var lamp=lampSpectrum();
  for(var i=0;i<GL.length;i++){
    var gl=GL[i], c=S.conc[i], P=gl.p;
    var apGain=0.30+0.70*aperture;
    // water parcels: dye colour by Beer-Lambert, path length = film thickness * chord
    for(var a=0;a<P.length;a++){
      var q=P[a]; if(q.vol<=0||q.phase!=="water")continue;
      var pr=project(q.u+gl.tiltU*0.05,q.v+gl.tiltV*0.05,gl);
      var rad=q.rad*D.R*gl.scale*pr.stretch;
      if(rad<0.7)continue;
      var path=gl.thick*(1.0+q.rad*2.4);
      var col=transmit(c.m*(1+gl.turb*0.0),c.c,c.y,path);
      // turbulence mechanically stirs the phases toward an even brown
      if(gl.turb>0){
        var avg=(col[0]+col[1]+col[2])/3;
        col[0]+= (avg*0.86-col[0])*gl.turb;
        col[1]+= (avg*0.80-col[1])*gl.turb;
        col[2]+= (avg*0.70-col[2])*gl.turb;
      }
      var R=clamp01(col[0]),G2=clamp01(col[1]),B=clamp01(col[2]);
      var grd=g.createRadialGradient(pr.x,pr.y,rad*0.10,pr.x,pr.y,rad);
      var cs="rgba("+(R*255|0)+","+(G2*255|0)+","+(B*255|0)+",1)";
      grd.addColorStop(0,cs);
      grd.addColorStop(0.70,"rgba("+((R*0.35+0.65)*255|0)+","+((G2*0.35+0.65)*255|0)+","+((B*0.35+0.65)*255|0)+",1)");
      grd.addColorStop(1,"rgba(255,255,255,0)");
      g.fillStyle=grd;
      g.save();
      g.translate(pr.x,pr.y);
      // dome stretch: circle at centre, oval at springline
      var ang=Math.atan2(pr.y-D.cy,pr.x-D.cx);
      g.rotate(ang); g.scale(pr.stretch,1);
      g.beginPath();g.arc(0,0,rad,0,6.2832);g.fill();
      g.restore();
    }
  }
  // ---- oil lenses: no dye. refraction only, and their caustics ----
  g.globalCompositeOperation="screen";
  for(var i2=0;i2<GL.length;i2++){
    var gl2=GL[i2],P2=gl2.p;
    for(var b=0;b<P2.length;b++){
      var o=P2[b]; if(o.vol<=0||o.phase!=="oil")continue;
      var pr2=project(o.u+gl2.tiltU*0.05,o.v+gl2.tiltV*0.05,gl2);
      var rad2=o.rad*D.R*gl2.scale*pr2.stretch;
      if(rad2<0.9)continue;
      // curvature from contact angle & film thickness -> focal length
      var curv=Math.min(1.0,gl2.thick*1.15);
      var focus=clamp01(curv);           // squeezed lens defocuses
      // ray-traced caustic: bright rim + hot point
      var rimA=0.10+0.42*focus*aperture;
      g.save();
      g.translate(pr2.x,pr2.y);
      var ang2=Math.atan2(pr2.y-D.cy,pr2.x-D.cx);
      g.rotate(ang2);g.scale(pr2.stretch,1);
      g.beginPath();g.arc(0,0,rad2*0.97,0,6.2832);
      g.strokeStyle="rgba(255,250,240,"+rimA.toFixed(3)+")";
      g.lineWidth=Math.max(0.6,rad2*0.055*(0.4+focus));
      g.stroke();
      // hot point
      var hp=rad2*(0.30-0.22*focus)+1.2;
      var hg=g.createRadialGradient(0,0,0,0,0,Math.max(1.5,hp*2.4));
      hg.addColorStop(0,"rgba(255,250,240,"+(0.16+0.55*focus*focus*aperture).toFixed(3)+")");
      hg.addColorStop(1,"rgba(255,250,240,0)");
      g.fillStyle=hg;g.beginPath();g.arc(0,0,Math.max(1.5,hp*2.4),0,6.2832);g.fill();
      g.restore();
    }
  }
  g.globalCompositeOperation="source-over";

  // ---- the hand in the beam: a real occluding shadow, penumbra by distance ----
  if(hand.inFrame){
    var dz=squeezeGlass?hand.z:1.0;
    var pen=6+dz*74;                       // enormous when lifted, razor sharp on the platen
    var core=Math.min(W,H)*(0.052+dz*0.10);
    var sg=g.createRadialGradient(hand.x,hand.y,core*0.30,hand.x,hand.y,core+pen);
    var dark=0.55-0.20*dz;
    sg.addColorStop(0,"rgba(24,25,27,"+dark.toFixed(3)+")");
    sg.addColorStop(0.42,"rgba(28,29,31,"+(dark*0.72).toFixed(3)+")");
    sg.addColorStop(1,"rgba(28,29,31,0)");
    g.fillStyle=sg;
    g.save();
    g.translate(hand.x,hand.y);
    g.rotate(-0.5);
    g.scale(1.0,0.72);
    g.beginPath();g.arc(0,0,core+pen,0,6.2832);g.fill();
    // four fingers, same penumbra
    for(var f=0;f<4;f++){
      var fa=-0.95+f*0.38;
      var fx=Math.cos(fa)*core*1.25, fy=Math.sin(fa)*core*1.25;
      var fg=g.createRadialGradient(fx,fy,core*0.10,fx,fy,core*0.62+pen*0.7);
      fg.addColorStop(0,"rgba(24,25,27,"+(dark*0.9).toFixed(3)+")");
      fg.addColorStop(1,"rgba(24,25,27,0)");
      g.fillStyle=fg;g.beginPath();g.arc(fx,fy,core*0.62+pen*0.7,0,6.2832);g.fill();
    }
    g.restore();
  }

  // ---- perforated aluminium: real transmission loss + regular grid ----
  var pat=g.createPattern(perfCanvas,"repeat");
  g.globalAlpha=0.55;
  g.fillStyle=pat;
  g.fillRect(D.cx-D.R,D.cy-D.R,D.R*2,D.R*2);
  g.globalAlpha=1;
  // the perf eats about a fifth of the light
  g.fillStyle="rgba(12,14,16,0.055)";
  g.fillRect(D.cx-D.R,D.cy-D.R,D.R*2,D.R*2);

  // ---- amber spill across the lower third, from the stage. cannot be killed ----
  var sp=g.createLinearGradient(0,D.cy+D.R*0.10,0,D.cy+D.R);
  sp.addColorStop(0,"rgba(201,163,117,0)");
  sp.addColorStop(1,"rgba(201,163,117,0.10)");
  g.fillStyle=sp;g.fillRect(D.cx-D.R,D.cy-D.R,D.R*2,D.R*2);

  g.restore();

  // soft edge of the projected circle onto the unlit dome
  var eg=g.createRadialGradient(D.cx,D.cy,D.R*0.93,D.cx,D.cy,D.R*1.06);
  eg.addColorStop(0,"rgba(10,11,12,0)");
  eg.addColorStop(1,"rgba(10,11,12,1)");
  g.fillStyle=eg;g.fillRect(0,0,W,H);

  // ---- the only two solid objects in frame: the shade and the wheel ----
  drawShadeAndWheel(D);
}

function drawShadeAndWheel(D){
  // metal shade over the platen, lower left, cutting into the beam
  var sx=W*0.03, sy=H*0.86, sw=Math.min(W*0.30,200), sh=Math.min(H*0.16,64);
  g.fillStyle="#1a1b1c";
  g.beginPath();
  g.moveTo(sx,H); g.lineTo(sx,sy+sh*0.35); g.lineTo(sx+sw*0.42,sy);
  g.lineTo(sx+sw,sy+sh*0.55); g.lineTo(sx+sw,H); g.closePath(); g.fill();
  g.strokeStyle="#b02a1e"; g.lineWidth=2.0;
  g.beginPath(); g.moveTo(sx,sy+sh*0.35); g.lineTo(sx+sw*0.42,sy); g.lineTo(sx+sw,sy+sh*0.55); g.stroke();

  // aperture wheel, lower right
  var r=Math.min(W,H)*0.052;
  wheel.x=W-r*1.9; wheel.y=H-r*1.9; wheel.r=r;
  g.save();
  g.translate(wheel.x,wheel.y);
  g.fillStyle="#141516"; g.beginPath(); g.arc(0,0,r,0,6.2832); g.fill();
  g.strokeStyle="#2b2d2f"; g.lineWidth=1.4; g.stroke();
  // nine detents
  for(var s=0;s<9;s++){
    var a=s/9*6.2832;
    g.strokeStyle= s===stickyStop ? "#3a3126":"#26282a";
    g.lineWidth=1.6;
    g.beginPath();
    g.moveTo(Math.cos(a)*r*0.76,Math.sin(a)*r*0.76);
    g.lineTo(Math.cos(a)*r*0.95,Math.sin(a)*r*0.95);
    g.stroke();
  }
  // painted index red pointer — never in the projection
  var pa=((aperture-0.08)/0.92)*(8/9)*6.2832;
  g.strokeStyle="#b02a1e"; g.lineWidth=r*0.16; g.lineCap="round";
  g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(pa)*r*0.66,Math.sin(pa)*r*0.66); g.stroke();
  g.fillStyle="#b02a1e"; g.beginPath(); g.arc(0,0,r*0.13,0,6.2832); g.fill();
  g.restore();
}

/* ---------- loop ---------- */
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

console.log("%c ","background:#4a4a55;padding:2px 40px;");
})();
</script>
