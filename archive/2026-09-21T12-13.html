  <meta name="outbox-spec-era" content="Right now, twenty past ten on a wet morning in March 1983 — machine 14 of thirty-one power flat knitting machines in the knitting room of a knitwear factory in Guimarães, northern Portugal, running 12-gauge in a 2/28 wool-acrylic marl and part way through the forty-first sleeve panel of a six-hundred-panel order. Not a look-back, not a lament, not anybody's vanished trade: the panel on the bed is nine courses short of its first fashioning line, the cone on the creel has roughly forty minutes of yarn left on it, the take-down weights have been hung one bar low since somebody rehung them, and the needle standing at position 47 has a latch that does not close.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is machine 14 seen straight on from where a knitter stands: the V of the two needle beds along the top eighth of the frame with the carriage running across it, and below that, filling everything, the knitted panel itself — real loops at real 12-gauge spacing, growing course by course at the top and descending forever under its own take-down weights, so the whole page is a fabric scrolling slowly downward and being made in front of you. It is not an animation of knitting. It is a live loop-mechanical engine: every stitch is an actual loop of actual drawn length held up by nothing except the loop above it, the carriage's cams are actually stroking each latch needle through rise, clear, feed, descent and knock-over, and when a loop lets go it ladders down through fabric knitted minutes or weeks ago, permanently, at the rate the geometry gives. The visitor's whole vocabulary is what a hand does at a knitting machine and nothing else: DRAG UP OR DOWN on the stitch cam to change how far the needles are pulled and therefore how much yarn goes into every loop; PRESS a single needle to push it out of work or back into work; and PULL DOWN anywhere on the hanging fabric to add take-down tension with your own hand, which is the only thing that makes the old loops cast off cleanly. Nothing scrolls by input. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat mechanics of weft knitting on a latch-needle bed, which is entirely a loop-length problem and has almost nothing to do with tightness, tension or anybody's hands. That A STITCH IS A LOOP PULLED THROUGH THE LOOP BELOW IT AND IS HELD UP BY NOTHING ELSE — there is not one knot anywhere in a knitted panel, the whole thing is a single continuous thread, and the only thing keeping any loop closed is the loop sitting in it; so a loop that lets go has nothing beneath it and runs, and a ladder is not damage spreading, it is the plain absence of the only support that ever existed. That the size of a stitch is set by STITCH LENGTH AND NOT BY YARN TENSION: the stitch cam's depth decides how far each needle is drawn down past the knock-over bit and therefore how many millimetres of yarn are taken into every single loop, and that one figure — the run-in — fixes the fabric's width, its weight per square metre and its handle simultaneously and inseparably, which is why the panel's finished width is never measured on the machine and is instead computed from millimetres of yarn per hundred needles. That yarn tension only decides whether the yarn ARRIVES, and a feed running slack lets a needle rob yarn back out of the loops either side of it, so one tight place makes two loose neighbours and the fault is never where it looks. That GAUGE IS THE BED AND CANNOT BE CHANGED: twelve needles to the inch is a hole pattern milled into a steel trick plate, so a finer or coarser fabric is a different machine and not a different setting, and the only latitude anybody has on the floor is run-in and yarn count. That THE LATCH IS THE WHOLE MECHANISM AND IT IS OPERATED BY THE FABRIC ITSELF: as the needle rises, the old loop slides down the shank and flips the latch open; at the top the old loop is cleared behind the latch; the new yarn is laid in the hook; and on the descent the same old loop rides back up and flips the latch SHUT over the new yarn, which is the entire reason a needle needs no external part to close it — the fabric closes its own needles, every loop, every course, several hundred times a second across a bed. That therefore a latch which does not close makes a needle that knits nothing at all: the new yarn is simply pulled straight through, the old loop is not cast off, and the column of stitches at that needle stops existing from that course onward. That TAKE-DOWN IS NOT A DETAIL — the weight hanging on the bottom of the panel is what holds the old loops down against the knock-over bit while the needle rises, and a panel with too little weight on it lets old loops ride up with their needles, get cleared behind the latch a second time and be knitted twice, and once that starts across more than a few needles the whole course presses off the bed at once and the panel falls in the pit. That PLAIN JERSEY CURLS BECAUSE OF LOOP ASYMMETRY and not because of finishing: the legs of a loop lie in one plane and the head and feet in another, so the top and bottom edges roll toward the face and the side edges roll toward the back, always, in that fixed direction, and no amount of pulling flattens a panel that has not been steamed. That FULLY-FASHIONED NARROWING IS A TRANSFER AND NOT A CUT: points lift the outermost loops off their needles and set them down two needles inward, doubling two loops onto one needle, so the panel genuinely loses stitches at the selvedge and leaves a permanent fashioning mark — a small paired distortion in the fabric that is the honest signature of a shaped panel and the reason nobody cuts a sleeve out of yardage if they can help it. That a doubled loop is a thicker loop and takes measurably more yarn, so the run-in changes at a fashioning course and the machine does not know that. That MARL IS TWO PLIES OF DIFFERENT COLOUR TWISTED TOGETHER, so the colour of any given stitch depends on which ply happens to be lying on the surface where the loop bends, which means a marl fabric has a real grain and no two stitches on it are the same colour and no dye lot can be matched by eye. That the yarn's count is a LENGTH PER WEIGHT and not a thickness — 2/28 Nm is two ends of twenty-eight metres to the gram — so a cone's remaining yardage is a real number, the run-in multiplied by the needle count multiplied by the course count consumes it exactly, and a panel's finished weight is known before it is knitted. That a stop motion is a wire resting on the running yarn and nothing more clever than that: when the yarn goes slack or parts, the wire drops, the machine stops mid-traverse, and every needle stands where it stood with its loops still on it.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the steel, the yarn and the wet morning, and that register is OILY, CLATTERY, FAST, INSISTENTLY REGULAR AND SLIGHTLY TOO LOUD — a carriage that crosses at a fixed rate whether or not anybody is standing there; several hundred latch needles knocking over at true pitch in a hard flat spray of clicks; a bed film of clear spindle oil that is visibly wet and that picks up lint in the corners; the yarn hissing through tension discs; the take-down chain taking up one link at a time with a small dead metallic drop; and the panel descending out of the bottom of the frame at a rate that is genuinely slow and genuinely never stops. The light is grey north-light off a wet roof, flat and even and a bit dim, and the fabric reads duller than it will after steaming. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the courses keep coming whether or not anybody touches a cam. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cosy, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a process-video, NOT a screensaver, NOT stately, NOT reverent, NOT tactile-in-the-nice-sense — this is machine 14 at twenty past ten with a cone running out and one needle that has stopped knitting.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the fabric's colour is COMPUTED and never chosen. The machine is 1960s works enamel in a dull grey-green (#5f6b63), chipped through to grey primer along every edge a hip or a trolley has hit (#8b8d87) and gone glossy black-brown with oil and lint in the angle of the bed (#2a2620), with the steel trick plate and the knock-over bits worn to a hard bright polish exactly where needles run (#b9bdba) and dull and slightly rusted where nothing rubs (#7a6f60). The room is lit by flat grey north light off a wet roof, even and a little dim, with no warmth in it at all. Against that, EVERY STITCH'S COLOUR IS THE OUTPUT OF PLY ARITHMETIC: the yarn is a 2/28 marl, two plies twisted at a real twist angle — one undyed cream (#d8cdb4) and one piece-dyed a dull moss (#5d6b3a) — and what renders at any point on any loop is whichever ply is actually on the surface where the yarn bends there, computed from twist angle, loop curvature and viewing angle, so a loop is never one colour, the fabric carries a real diagonal marl grain that reads differently on the legs than on the heads, and nobody anywhere picks a fabric colour. A loop drawn long is thinner and shows more of the ply beneath it and therefore renders measurably paler and greener than a short one, so the run-in setting is visible as colour and nothing on the page says so. Oil picked up off the bed darkens and slightly greases individual stitches, permanently, in a band a few needles wide (#3f4433). Lint accumulates as a pale fibrous fuzz in the bed angle and on the stop wire (#cfc7b2). A ladder renders as what it is: two columns of loop legs standing up unsupported with grey machine showing between them, not a line and not a tear. Exactly one chip of stop-bar red (#b4291f) is held strictly for three things: the painted tip of the needle at position 47, the pointer on the stitch cam dial, and the dropped stop wire. It never appears in the yarn, on the bed, in the oil or anywhere in the fabric. Flat, hard, high contrast at the needle bed and honestly dim and grey at the bottom of the frame; no glow, no bloom, no soft focus, no vignette, no gradients other than honest ply surfacing, honest oil, honest lint and honest north light.">
  <meta name="outbox-spec-wildcard" content="The needle standing at position 47 has a latch that does not close. It was sprung at some point and it stands a few thousandths proud of the others with its tip painted red by whoever found it, and the engine gives it exactly the properties a sprung latch has and no others: the old loop opens it on the rise as normal, but on the descent the latch does not flip over the new yarn, so the hook simply draws the new yarn straight through without casting off. It does this on roughly one course in nine — not on a timer, but because whether the latch catches depends on real loop height, which depends on real take-down tension, which is genuinely varying — and every time it happens that column stops being knitted, a loop is left unsupported, and a ladder runs down through everything below it. It cannot be changed, pulled, disabled, marked, put permanently out of work by any means the visitor has, or worked around; pushing it out of work with the number keys holds for exactly as long as the key is held and it springs back into work the moment the carriage next passes. Same needle, same red tip, same position, every visit, on every panel, forever.">
  <meta name="outbox-spec-forbidden" content="NO textile-as-metaphor of any kind, in any form, ever — no threads of fate, no the fabric of anything, no weaving a story, no unravelling, no dropped stitch as a lesson about life, no 'one loop holding the next', no interconnection, no Penelope, no Ariadne, no the Fates, no Moirai, no spinning-and-cutting imagery, no 'everything is one continuous thread' turned toward any meaning whatsoever; a loop here is a drawn length in millimetres held open by the loop above it and it has nothing to teach anybody. ABSOLUTELY NO knitting-as-comfort register: no cosy, no warm, no wool-as-hug, no jumper-someone-made-for-you, no grandmother, no hands-that-knitted, no lap-blanket sentiment, no hygge, no slow-living, no cottagecore, no meditative-repetitive-motion, no knitting-circle warmth, no craft-as-therapy, no knitting-as-mindfulness. NO craftsman-sage register, NO 'the old knitters could hear a dropped stitch across the room', NO trade mystique, NO reverence for hand skill, NO handmade-versus-machine sermon, NO master-and-apprentice arc, NO dying-art lament. ABSOLUTELY NO Jacquard-punch-card-was-the-first-computer observation or any paraphrase, allusion or sideways gesture toward it, and no Babbage, no Lovelace, no binary, no code-as-textile, no 'programmable' framing of anything — that entire association is banned outright. NO textile-industry labour history imported as subtext or atmosphere: no Lowell mill girls, no Triangle Shirtwaist, no Luddites, no child labour, no sweatshop framing, no fast-fashion sermon, no supply-chain exposé, no globalisation essay, no 'who made your clothes', no dignity-of-labour sermon, no working-class-pride sentiment, no union framing, no immigrant-sacrifice arc, no poverty pathos. NO Portugal travelogue and NO explaining Portugal to anybody: no fado, no saudade, no azulejos, no port, no cork, no salt cod, no tiles, no cobbles, no aren't-they-warm condescension, no Portuguese vocabulary sprinkled for texture beyond a place name, no dialect spelling, no Salazar, no Carnation Revolution, no EEC-accession commentary, no twentieth-century political history of any period used as atmosphere. NO 1983-as-period-signifier: no Cold War drift, no synth-pop, no eighties retro-kitsch, no camp, no ironic affection for works enamel, oil cans, cone creels or punch cards. NO nostalgia, NO wistfulness, NO decline narrative, NO 'the mills all went east / the factory closed in 2003 / the last of the flat machines', NO foreshadowing of anything, NO hindsight of any kind. NO sensuous material writing about wool, yarn or fabric beyond count, ply, twist angle, loop length, areal weight, oil and lint — no describing yarn as soft, springy, alive, breathing, wanting, remembering or falling like anything, and no smell writing at all. NO colour lyricism about the marl: colour here is which ply is on the surface at a given curvature and nothing else. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, process-video, maker-channel, loom-video, ambient-visualiser, generative-art-gallery, music-visualiser, chillout or screensaver framing whatsoever, and no 'watch it grow' — the bed clicks hard, the oil is wet, and things ladder. NO machine-as-creature framing: no the machine breathes, no it wants, no it knows, no tireless, no patient, no relentless-as-character, no automation anxiety, no robots-replacing-anybody. NO physics-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. NO puzzle-game or arcade register: no score, no level, no streak, no congratulations, no encouragement. NO entropy sermon, NO impermanence preciousness about the ladders, NO 'it can never be repaired' pathos, NO perfectionism sermon and NO mistakes-are-beautiful sentiment — a ladder is a released loop and it gets counted by nobody. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about needle 47, the press-off, the cone running down or the fabric that only ever gets longer — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of the machine or the fabric whatsoever, despite the panel being a long accumulating record of everything that has happened on the bed — this is live production, it is going to a make-up room this afternoon, and there are five hundred and fifty-nine panels still to knit. NO ledger, registry, inventory, index, catalogue or directory framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past ten in the morning with grey light on a wet roof and thirty other machines running. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding, and the word guild never appears. And beyond the beds, the needles, the carriage, the yarn, the fabric and the one red-tipped needle, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>
<canvas id="stage"></canvas>
<a id="arch" href="/archive" aria-label="."></a>
<script>
/* ------------------------------------------------------------------
   machine 14. thirty-one flats in the room, this is the fourteenth.
   12 gauge, 2/28 Nm marl, 2.1166 mm needle pitch.
   run-in is millimetres of yarn per loop. width falls out of it.
   nothing here stores a target width.
   needle 47 has a sprung latch. it was like that yesterday.
-------------------------------------------------------------------*/
(function(){
"use strict";

var cv = document.getElementById('stage');
var ctx = cv.getContext('2d', {alpha:false});
var W=0,H=0,DPR=1;

/* ---------- constants of the bed ---------- */
var GAUGE = 12;                  // needles per inch
var PITCH_MM = 25.4/GAUGE;       // 2.1167 mm
var NEEDLES = 0;                 // computed from viewport width
var BED_TOP_FRAC = 0.125;        // top eighth is the V of the beds
var RED = '#b4291f';

/* yarn: two plies twisted. one undyed cream, one piece-dyed moss. */
var PLY_A = [0xd8,0xcd,0xb4];
var PLY_B = [0x5d,0x6b,0x3a];
var TWIST_TPM = 640;             // turns per metre of the folded yarn

/* run-in, mm of yarn drawn into each loop. the whole argument. */
var RUNIN_MIN = 3.6, RUNIN_MAX = 7.4;

/* ---------- persistence ---------- */
var KEY = 'm14.knitroom.v1';
var store = {
  courses: 0,
  cone_m: 0,
  cone_index: 0,
  runin: 5.20,
  pressoffs: 0,
  lint: 0.0,
  oilband: 0,
  out: [],            // needles permanently pushed out of work (none persist by key, but bed marks do)
  fab: null,          // packed fabric
  ladders: [],
  fashion_at: 0
};
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); for(var k in o) if(k in store) store[k]=o[k]; }
  }catch(e){}
  if(!store.cone_m || store.cone_m<=0){
    if(store.cone_index===0){ store.cone_m = 1180 + Math.random()*90; }
  }
  if(store.cone_index===0 && store.courses===0){
    // cone on the creel at ten past ten had roughly forty minutes on it
    store.cone_m = 640 + Math.random()*40;
  }
}
var saveTimer=0;
function save(){
  if(saveTimer) return;
  saveTimer = setTimeout(function(){
    saveTimer=0;
    try{
      store.fab = packFabric();
      localStorage.setItem(KEY, JSON.stringify(store));
    }catch(e){}
  }, 1400);
}

/* ---------- the fabric ---------- */
/* a stitch is an object. it knows what it was drawn through and what
   was drawn through it. that is the only thing holding it up. */
function Stitch(n, c, len, phase, oil){
  this.n=n; this.c=c;
  this.len=len;          // drawn length, mm
  this.ph=phase;         // ply-surface phase at the head
  this.oil=oil;          // oil load 0..1
  this.below=null;       // the loop this one was drawn through
  this.above=null;       // the loop drawn through this one
  this.held=true;        // supported?
  this.dbl=0;            // 1 if a doubled (transferred) loop
  this.fall=0;           // release progress, px of drop
  this.vx=0;             // lateral drift on release
  this.mark=0;           // fashioning distortion magnitude
}

var FAB = [];            // array of courses, each an array of length NEEDLES (may hold null)
var MAXC = 1400;         // how many courses we keep in memory / storage
var live = [];           // live loops on the needles, index by needle
var needleOut = [];      // needle out of work flags
var needleBroken = [];   // sprung latch
var needleOil = [];      // oil film per needle position
var N47 = 47;

function packFabric(){
  // pack only what we can afford: recent courses, coarse.
  var out=[]; var start = Math.max(0, FAB.length-320);
  for(var i=start;i<FAB.length;i++){
    var row=FAB[i], s='';
    for(var j=0;j<NEEDLES;j++){
      var st=row[j];
      if(!st){ s+='.'; continue; }
      var L = Math.round((st.len-RUNIN_MIN)/(RUNIN_MAX-RUNIN_MIN)*35);
      if(L<0)L=0; if(L>35)L=35;
      var ch = String.fromCharCode(48+L);
      if(st.dbl) ch = String.fromCharCode(90+L>122?122:90+ (L%30));
      s += ch;
    }
    out.push(s);
  }
  return {n:NEEDLES, rows:out};
}
function unpackFabric(p){
  if(!p || !p.rows) return false;
  var n = p.n||NEEDLES;
  for(var i=0;i<p.rows.length;i++){
    var s=p.rows[i]; var row=new Array(NEEDLES);
    for(var j=0;j<NEEDLES;j++){
      var src = Math.floor(j*n/NEEDLES);
      var ch = s.charAt(src);
      if(!ch || ch==='.'){ row[j]=null; continue; }
      var code = ch.charCodeAt(0);
      var dbl=0, L;
      if(code>=90 && code<=122){ dbl=1; L=(code-90); }
      else L = code-48;
      var len = RUNIN_MIN + (L/35)*(RUNIN_MAX-RUNIN_MIN);
      var st = new Stitch(j, i, len, hash2(j,i)*6.283, (hash2(j+7,i+3)<0.03)?0.7:0);
      st.dbl=dbl;
      row[j]=st;
    }
    // link
    if(i>0){ var prev=FAB[FAB.length-1];
      for(var k=0;k<NEEDLES;k++){ if(row[k]&&prev&&prev[k]){ row[k].below=prev[k]; prev[k].above=row[k]; } } }
    FAB.push(row);
  }
  return true;
}

/* deterministic hash so ply phase and lint are stable across frames */
function hash2(a,b){
  var h = a*374761393 + b*668265263;
  h = (h ^ (h>>13)) * 1274126177;
  h = (h ^ (h>>16)) >>> 0;
  return h / 4294967296;
}

/* ---------- geometry ---------- */
/* loop pitch: wales are fixed by the bed. courses come from loop length. */
var pxPerMM = 3.0;
function waleSpacingPx(){ return PITCH_MM * pxPerMM; }
function courseHeightPx(len){
  // a longer run-in makes taller AND wider loops but wale pitch is the bed,
  // so extra length goes into course height and into loop bulge.
  return (len*0.285) * pxPerMM;
}
function loopWidthPx(len){
  // rendered loop width — spreads to the bed pitch, then bulges past it
  return Math.min(waleSpacingPx()*1.42, waleSpacingPx()*(0.62 + len*0.072));
}

/* ply surfacing: what colour is actually on top where the yarn bends */
function plyColour(phase, curvature, viewang, len, oil, lint){
  var s = Math.sin(phase + curvature*1.85 + viewang*0.55);
  // longer loops are thinner in section, show more of the under ply
  var thin = (len - RUNIN_MIN)/(RUNIN_MAX-RUNIN_MIN);
  var t = 0.5 + 0.5*s;
  t = t*(1-0.30*thin) + 0.30*thin*0.62;   // pale-green drift on long draws
  var r = PLY_A[0]*t + PLY_B[0]*(1-t);
  var g = PLY_A[1]*t + PLY_B[1]*(1-t);
  var b = PLY_A[2]*t + PLY_B[2]*(1-t);
  if(oil>0){ var o=Math.min(1,oil);
    r = r*(1-o*0.62)+0x3f*o*0.62; g=g*(1-o*0.62)+0x44*o*0.62; b=b*(1-o*0.62)+0x33*o*0.62; }
  if(lint>0){ r=r*(1-lint)+0xcf*lint; g=g*(1-lint)+0xc7*lint; b=b*(1-lint)+0xb2*lint; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

/* ---------- carriage & latch cycle ---------- */
var carriage = {
  x: 0,              // needle position, fractional
  dir: 1,
  speed: 0,          // needles per second
  baseSpeed: 86,
  holding: 0,        // -1 / +1 from arrow keys
  stopped: false
};
var stitchCam = { depth: 0.5 };   // 0..1 maps to RUNIN_MIN..MAX
function runin(){ return RUNIN_MIN + stitchCam.depth*(RUNIN_MAX-RUNIN_MIN); }

var takedown = {
  base: 0.62,        // weights hung one bar low
  hand: 0,           // visitor's pull
  chain: 0,
  chainAcc: 0
};
function tension(){ return Math.min(1.6, takedown.base + takedown.hand); }

/* the tool lying on the bed where the hand is */
var tool = { x:-1, y:-1, on:false, needle:-1 };

/* fabric scroll: the panel descends under take-down, continuously */
var fabricOffset = 0;   // px, how far the top course has descended

/* ---------- audio ---------- */
var AC=null, master=null, pan=true;
var bedBus=null, roomGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  master = AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  var comp = AC.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=6; comp.attack.value=0.002; comp.release.value=0.18;
  comp.connect(master);
  bedBus = comp;
  startRoom();
}
function noiseBuf(sec){
  var n = Math.floor(AC.sampleRate*sec);
  var b = AC.createBuffer(1,n,AC.sampleRate);
  var d = b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
var NB=null;
function getNB(){ if(!NB) NB=noiseBuf(2.0); return NB; }

function click(panv, gain, pitch, bright){
  if(!AC) return;
  var t = AC.currentTime;
  var src = AC.createBufferSource(); src.buffer=getNB(); src.loop=true;
  var bp = AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = pitch; bp.Q.value = 5 + bright*7;
  var hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  var g = AC.createGain();
  g.gain.setValueAtTime(0,t);

/* ---------- setup ---------- */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // pixels per mm chosen so 12 gauge reads as real loops at this width
  var targetNeedles = Math.max(26, Math.min(96, Math.round(W/9.5)));
  pxPerMM = (W*0.94) / (targetNeedles*PITCH_MM);
  var newN = targetNeedles;
  if(newN !== NEEDLES){ rebuildBed(newN); }
}
function rebuildBed(n){
  var old = NEEDLES;
  NEEDLES = n;
  needleOut = new Array(n); needleBroken=new Array(n); needleOil=new Array(n);
  for(var i=0;i<n;i++){
    needleOut[i]=false;
    needleBroken[i]=false;
    // oil band: a few needles wide, off the bed angle, wet
    var band = Math.floor(n*0.31);
    needleOil[i] = (i>=band && i<band+4) ? (0.55 + hash2(i,9)*0.35) : (hash2(i,11)<0.015 ? 0.25 : 0);
  }
  var bi = Math.min(n-1, Math.max(0, Math.round(N47 * n/64)));
  needleBroken[bi]=true; brokenIndex=bi;
  // reshape existing fabric
  if(old>0 && FAB.length){
    for(var c=0;c<FAB.length;c++){
      var row=FAB[c], nr=new Array(n);
      for(var j=0;j<n;j++){ nr[j] = row[Math.floor(j*old/n)] || null; }
      FAB[c]=nr;
    }
  }
  live = new Array(n);
  if(FAB.length){ var lastRow = FAB[FAB.length-1];
    for(var k=0;k<n;k++) live[k] = lastRow[k]||null; }
  carriage.x = Math.min(carriage.x, n+2);
}
var brokenIndex = 0;

/* ---------- knitting a needle ---------- */
var pendingReleases = [];
var fashionCounter = 0;
var FASHION_EVERY = 14;   // courses between fashioning lines on this sleeve
var coursesToFashion = 9; // nine courses short of the first fashioning line
var doublesThisCourse = [];

function courseStart(){
  doublesThisCourse = [];
  coursesToFashion--;
  if(coursesToFashion<=0){
    coursesToFashion = FASHION_EVERY;
    doFashion();
  }
}
function doFashion(){
  // points lift the outermost loops and set them two needles inward.
  // two loops on one needle. the panel genuinely loses stitches.
  var edges = [];
  var l=0; while(l<NEEDLES && (!live[l]||needleOut[l])) l++;
  var r=NEEDLES-1; while(r>=0 && (!live[r]||needleOut[r])) r--;
  if(l>=r-6) return;
  var pairs = [[l, l+2],[r, r-2]];
  for(var i=0;i<pairs.length;i++){
    var from=pairs[i][0], to=pairs[i][1];
    var s = live[from];
    if(!s) continue;
    live[from]=null;
    if(live[to]){ live[to].dbl=1; live[to].mark=1; doublesThisCourse.push(to); }
    // the loop lifted off is still part of the fabric, sitting on its new needle
    if(FAB.length){ var row=FAB[FAB.length-1]; }
    // the vacated needle: nothing on it. it does not ladder — the loop went somewhere.
    markFashionMark(from,to);
  }
}
var fashionMarks=[];
function markFashionMark(a,b){
  fashionMarks.push({c:store.courses, a:a, b:b});
  if(fashionMarks.length>260) fashionMarks.shift();
}

/* one needle's whole latch cycle for this course */
function knitNeedle(i){
  var rl = runin();
  var T = tension();

  if(needleOut[i]){
    // out of work: it holds nothing, does nothing. if it had a loop, that loop
    // is now held by the needles either side as a float — and it lets go.
    if(live[i]){ release(live[i]); live[i]=null; }
    return;
  }

  var old = live[i];

  /* --- take-down check ---
     if the old loop is not held down against the knock-over bit, it rides up
     with the needle, gets cleared behind the latch a second time, and is
     knitted twice. loop height depends on run-in and on tension. */
  var loopHeight = rl / (1 + T*1.55);
  var rideUp = loopHeight > 2.55;

  if(old && rideUp){
    // knitted twice: the loop doubles, the fabric jams
    old.dbl = 1;
    pressRisk[i] = (pressRisk[i]||0) + 1;
    if(pressRisk[i]>3){
      // this needle presses off
      release(old);
      live[i]=null;
      pressRisk[i]=0;
      pressAdjacent(i);
      return;
    }
  } else {
    if(pressRisk[i]>0) pressRisk[i] -= 0.55;
    if(pressRisk[i]<0) pressRisk[i]=0;
  }

  /* --- latch tool fouling ---
     the tool lying on the bed genuinely fouls the needle it rests on. */
  var fouled = (tool.on && tool.needle===i);

  /* --- the sprung latch at 47 ---
     it opens on the rise as normal. on the descent it does not flip shut
     over the new yarn. whether it catches depends on loop height, which
     depends on take-down, which is genuinely varying. */
  var latchFails = false;
  if(needleBroken[i]){
    var p = 0.055 + (loopHeight-1.9)*0.16;
    if(p<0.02) p=0.02; if(p>0.34) p=0.34;
    latchFails = (Math.random() < p);
  }
  if(fouled) latchFails = (Math.random()<0.55);

  if(latchFails){
    // the hook draws the new yarn straight through. the old loop is not
    // cast off. the column at this needle stops existing from here.
    if(old){ release(old); }
    live[i]=null;
    consume(rl*0.55);
    knockSound(i, true, 0.55);
    return;
  }

  /* --- normal: rise, clear, feed, descent, knock-over --- */
  var extra = 0;
  if(old && old.dbl) extra = rl*0.34;     // a doubled loop takes more yarn
  var len = rl + extra;

  var ph = (len/1000)*TWIST_TPM*6.283 + hash2(i, store.courses)*0.9;
  var oil = needleOil[i]*(0.55 + hash2(i,store.courses)*0.5);
  var s = new Stitch(i, store.courses, len, ph, oil);
  if(old && old.dbl){ s.dbl=0; s.mark=0.7; }
  s.below = old;
  if(old){ old.above = s; old.held = true; }
  live[i] = s;

  consume(len);
  knockSound(i,false, 1);
}
var pressRisk = {};

function pressAdjacent(i){
  // if enough adjacent needles are pressing off, the whole course goes.
  var run=0;
  for(var k=Math.max(0,i-9);k<Math.min(NEEDLES,i+10);k++){ if(!live[k]) run++; }
  if(run>14){
    pressOff();
  }
}
function pressOff(){
  // the whole course comes off the bed at once. a genuinely large piece
  // of fabric goes down the pit.
  for(var k=0;k<NEEDLES;k++){
    if(live[k]){ release(live[k]); live[k]=null; }
  }
  store.pressoffs++;
  if(AC){ thud(0,0.34); setTimeout(function(){thud(0.1,0.22);},90); }
  // rethread across the bed on the next few courses
  rethread = 14;
  save();
}
var rethread = 0;

/* a released loop has nothing beneath it. the release walks downward
   through the stored fabric at a rate the geometry gives. */
function release(st){
  if(!st) return;
  if(!st.held) return;
  st.held=false;
  st.vx = (Math.random()-0.5)*0.6;
  pendingReleases.push({st:st, t:0});
}
function stepReleases(dt){
  var T = tension();
  var rate = 9 + T*24;   // courses per second the ladder runs
  for(var i=pendingReleases.length-1;i>=0;i--){
    var r = pendingReleases[i];
    r.t += dt*rate;
    while(r.t >= 1){
      r.t -= 1;
      var nxt = r.st.below;
      if(!nxt){ pendingReleases.splice(i,1); break; }
      if(nxt.held){
        nxt.held=false;
        nxt.vx = (Math.random()-0.5)*0.6;
        if(AC && Math.random()<0.10){
          click((nxt.n/NEEDLES)*1.7-0.85, 0.020, 2600+Math.random()*1800, 0.8);
        }
      }
      r.st = nxt;
    }
  }
  if(pendingReleases.length>400) pendingReleases.splice(0, pendingReleases.length-400);
}

function knockSound(i, broken, g){
  if(!AC) return;
  var panv = (i/(NEEDLES-1))*1.7-0.85;
  var pitch = 2100 + (i/NEEDLES)*1400 + hash2(i,3)*220;
  if(broken){
    // a single transient, honestly different. the latch went up and not back.
    click(panv, 0.030*g, pitch*0.72, 0.2);
  } else {
    // two distinct transients: latch open on the rise, latch shut on the descent
    click(panv, 0.021*g, pitch*1.12, 1.0);
    var self = {p:panv, pi:pitch, gg:g};
    setTimeout(function(){ click(self.p, 0.030*self.gg, self.pi, 0.55); }, 11);
  }
}

/* ---------- yarn ---------- */
function consume(mm){
  store.cone_m -= mm/1000;
  if(store.cone_m <= 0){
    store.cone_m = 0;
    stopMotion();
  }
}
var stopWire = { dropped:false, t:0 };
var rethreadTimer = 0;
function stopMotion(){
  if(stopWire.dropped) return;
  stopWire.dropped = true;
  carriage.stopped = true;
  wireDrop();
  // a new cone is a real drag from the creel and costs real metres of waste.
  rethreadTimer = 4.2 + Math.random()*3.4;
  store.cone_index++;
  save();
}
function threadNewCone(){
  if(store.cone_index >= 6){
    // no more cones on the creel for this shift. the wire stays down.
    rethreadTimer = 9999;
    return;
  }
  store.cone_m = 1050 + Math.random()*180;
  store.cone_m -= 2.6 + Math.random()*1.8;   // waste at the threading
  stopWire.dropped=false;
  carriage.stopped=false;
  if(AC){ bobbinTick(); thud(-0.2,0.18); }
  save();
}

/* ---------- carriage traverse ---------- */
var lastKnittedNeedle = -1;
var courseActive = false;
function stepCarriage(dt){
  if(carriage.stopped){
    if(rethreadTimer<9000){
      rethreadTimer -= dt;
      if(rethreadTimer<=0) threadNewCone();
    }
    return;
  }
  var sp = carriage.baseSpeed;
  if(carriage.holding !== 0){
    // holding the carriage back against its drive: slower course.
    // the loop length does not change. that is the point.
    if((carriage.holding<0 && carriage.dir<0)||(carriage.holding>0&&carriage.dir>0)) sp *= 0.22;
    else sp *= 0.42;
  }
  carriage.speed = sp;
  var prev = carriage.x;
  carriage.x += carriage.dir * sp * dt;

  if(!courseActive){
    courseActive = true;
    courseStart();
    newRow();
  }

  // knit every needle the cam box has passed
  if(carriage.dir>0){
    var from = Math.ceil(prev), to = Math.floor(carriage.x);
    for(var i=Math.max(0,from); i<=Math.min(NEEDLES-1,to); i++) doKnit(i);
  } else {
    var from2 = Math.floor(prev), to2 = Math.ceil(carriage.x);
    for(var j=Math.min(NEEDLES-1,from2); j>=Math.max(0,to2); j--) doKnit(j);
  }

  // end of traverse
  if(carriage.dir>0 && carriage.x > NEEDLES+2){
    carriage.dir=-1; endCourse(0.88);
  } else if(carriage.dir<0 && carriage.x < -2){
    carriage.dir=1; endCourse(-0.88);
  }

  // yarn hiss brightness tracks true run-in
  if(hissFilt){
    var target = 2400 + (runin()-RUNIN_MIN)/(RUNIN_MAX-RUNIN_MIN)*4200;
    hissFilt.frequency.value += (target - hissFilt.frequency.value)*0.06;
    hissGain.gain.value = 0.010 + (sp/carriage.baseSpeed)*0.008;
  }
}
function doKnit(i){
  if(i<0||i>=NEEDLES) return;
  if(rethread>0){
    // rethreading across after a press-off: cast on again as the cam passes
    live[i] = null;
  }
  knitNeedle(i);
  // record into the current row
  var row = FAB[FAB.length-1];
  if(row) row[i] = live[i];
  // a needle held out by a key springs back into work the moment the
  // carriage passes it
  if(heldOut[i]){ /* held only while key is down */ }
}
function endCourse(panv){
  thud(panv, 0.20);
  store.courses++;
  courseActive=false;
  if(rethread>0) rethread--;
  // link the new row to the one below
  var n = FAB.length;
  if(n>=2){
    var a=FAB[n-1], b=FAB[n-2];
    for(var i=0;i<NEEDLES;i++){
      if(a[i] && b[i] && !a[i].below){ a[i].below=b[i]; b[i].above=a[i]; }
    }
  }
  // lint accumulates
  store.lint = Math.min(1, store.lint + 0.00035);
  if(store.courses % 40 === 0) save();
}
function newRow(){
  var row = new Array(NEEDLES);
  for(var i=0;i<NEEDLES;i++) row[i]=null;
  FAB.push(row);
  if(FAB.length>MAXC){
    var dead = FAB.shift();
    for(var k=0;k<dead.length;k++){ if(dead[k]){ dead[k].above=null; if(dead[k].below) dead[k].below.above=null; dead[k].below=null; } }
  }
}

/* ---------- take-down chain ---------- */
function stepTakedown(dt){
  var T = tension();
  // the panel descends. rate is a function of loop length and load.
  var descend = courseHeightPx(runin()) * (carriage.stopped?0:1) * 0;
  takedown.chainAcc += dt * (0.32 + T*0.28);
  if(takedown.chainAcc >= 1){
    takedown.chainAcc -= 1;
    chainDrop();
  }
  // hand take-down decays
  takedown.hand *= Math.pow(0.12, dt);
  if(takedown.hand < 0.001) takedown.hand = 0;
}

/* ---------- rendering ---------- */
var bedH = 0;
function draw(){
  bedH = H*BED_TOP_FRAC;

  // north light off a wet roof: flat, even, a bit dim. no warmth.
  ctx.fillStyle = '#3a3a35';
  ctx.fillRect(0,0,W,H);

  drawFabric();
  drawBed();
  drawCarriage();
  drawTool();
  drawStopWire();
  drawCamDial();
}

function drawFabric(){
  var wp = waleSpacingPx();
  var x0 = (W - NEEDLES*wp)/2;
  var rl = runin();

  // the area below the bed is the panel and whatever is behind it
  ctx.save();
  ctx.beginPath(); ctx.rect(0,bedH,W,H-bedH); ctx.clip();

  // machine grey behind the fabric — visible through ladders
  ctx.fillStyle='#55584f';
  ctx.fillRect(0,bedH,W,H-bedH);
  // the bed angle, glossy black-brown with oil and lint
  var grad = ctx.createLinearGradient(0,bedH,0,bedH+26);
  grad.addColorStop(0,'#2a2620'); grad.addColorStop(1,'#55584f');
  ctx.fillStyle=grad; ctx.fillRect(0,bedH,W,26);

  // walk the fabric upward from the needle bed
  var y = bedH + 4 + fabricOffset;
  var courseCount = FAB.length;
  var drawn = 0;
  for(var c = courseCount-1; c>=0 && y < H+40; c--){
    var row = FAB[c];
    if(!row) continue;
    var ch = 0;
    // course height from the actual mean loop length in this course
    var sum=0, cnt=0;
    for(var q=0;q<NEEDLES;q+=3){ if(row[q]){ sum+=row[q].len; cnt++; } }
    var meanLen = cnt? sum/cnt : rl;
    ch = courseHeightPx(meanLen);
    if(ch<2.0) ch=2.0;

    drawCourse(row, x0, y, wp, ch, c, courseCount);
    y += ch;
    drawn++;
    if(drawn>520) break;
  }

  // the roll below the frame — the panel keeps going
  ctx.restore();
}

function drawCourse(row, x0, y, wp, ch, cIdx, total){
  var age = (total - cIdx);
  // north light falls off very slightly with depth. honestly dim, no vignette.
  var lightMul = 1 - Math.min(0.30, age*0.00060);
  var lintHere = Math.min(0.14, store.lint*0.4);

  for(var i=0;i<NEEDLES;i++){
    var st = row[i];
    if(!st){
      // a wale that is not there. grey machine shows through.
      continue;
    }
    var x = x0 + i*wp + wp*0.5;

    // curl: legs and heads lie in different planes. free edges roll.
    // top and bottom edges roll toward the face; side edges toward the back.
    var curlMag = 1.35 * (1 - (st.len-RUNIN_MIN)/(RUNIN_MAX-RUNIN_MIN)*0.62);
    var edgeL = i, edgeR = NEEDLES-1-i;
    var edgeDist = Math.min(edgeL, edgeR);
    var sideCurl = edgeDist<5 ? (5-edgeDist)/5 : 0;
    var xoff = sideCurl * curlMag * wp * 0.42 * (edgeL<edgeR? 1 : -1);
    var zshade = sideCurl*curlMag*0.30;   // rolled toward the back: darker

    // fashioning distortion: a real paired displacement that stays forever
    if(st.mark>0){ xoff += (i < NEEDLES/2 ? 1 : -1) * st.mark * wp*0.30; }

    // released loops fall
    var yoff = 0;
    if(!st.held){
      st.fall += 0.0;   // handled in drop pass
      continue;
    }

    var lw = loopWidthPx(st.len);
    var lh = ch;

    // curvature at head and legs drives which ply surfaces
    var headCurv = 2.2 + st.len*0.10;
    var legCurv  = 0.35;

    var cHead = plyColour(st.ph, headCurv, 0.0, st.len, st.oil, lintHere);
    var cLeg  = plyColour(st.ph + 1.9, legCurv, 0.35, st.len, st.oil, lintHere);

    var X = x + xoff;
    var half = lw*0.5;

    // the two legs: they lie in the plane of the fabric
    ctx.strokeStyle = shade(cLeg, lightMul*(1-zshade));
    ctx.lineWidth = Math.max(0.9, wp*0.30);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(X-half*0.62, y+lh);
    ctx.quadraticCurveTo(X-half*0.98, y+lh*0.46, X-half*0.30, y+lh*0.04);
    ctx.moveTo(X+half*0.62, y+lh);
    ctx.quadraticCurveTo(X+half*0.98, y+lh*0.46, X+half*0.30, y+lh*0.04);
    ctx.stroke();

    // the head: out of the plane of the legs, so it reads the other ply
    ctx.strokeStyle = shade(cHead, lightMul*(1-zshade*0.5)*1.06);
    ctx.lineWidth = Math.max(1.0, wp*0.34);
    ctx.beginPath();
    ctx.moveTo(X-half*0.30, y+lh*0.04);
    ctx.bezierCurveTo(X-half*0.34, y-lh*0.20, X+half*0.34, y-lh*0.20, X+half*0.30, y+lh*0.04);
    ctx.stroke();

    // doubled loop: thicker, and you can see the second head under the first
    if(st.dbl){
      ctx.strokeStyle = shade(plyColour(st.ph+3.1, headCurv*1.2, 0.2, st.len, st.oil, lintHere), lightMul*0.90);
      ctx.lineWidth = Math.max(1.0, wp*0.30);
      ctx.beginPath();
      ctx.moveTo(X-half*0.38, y+lh*0.22);
      ctx.bezierCurveTo(X-half*0.40, y+lh*0.00, X+half*0.40, y+lh*0.00, X+half*0.38, y+lh*0.22);
      ctx.stroke();
    }
  }

  // ladders: two columns of loop legs standing up unsupported with grey
  // machine showing between them. not a line, not a tear.
  for(var k=0;k<NEEDLES;k++){
    var s2 = row[k];
    if(s2 && !s2.held){
      var xx = x0 + k*wp + wp*0.5;
      var lintK = lintHere;
      var cL = plyColour(s2.ph+1.9, 0.35, 0.35, s2.len, s2.oil, lintK);
      ctx.strokeStyle = shade(cL, lightMul*0.86);
      ctx.lineWidth = Math.max(0.8, wp*0.24);
      var spread = wp*0.44;
      ctx.beginPath();
      ctx.moveTo(xx-spread, y+ch);
      ctx.lineTo(xx-spread*0.94, y);
      ctx.moveTo(xx+spread, y+ch);
      ctx.lineTo(xx+spread*0.94, y);
      ctx.stroke();
      // the free strand where the loop used to be, lying slack across
      if((cIdx+k)%3===0){
        ctx.strokeStyle = shade(cL, lightMul*0.62);
        ctx.lineWidth = Math.max(0.6, wp*0.16);
        ctx.beginPath();
        ctx.moveTo(xx-spread, y+ch*0.55);
        ctx.quadraticCurveTo(xx, y+ch*0.78, xx+spread, y+ch*0.55);
        ctx.stroke();
      }
    }
  }
}

function shade(rgbstr, mul){
  // parse rgb(r,g,b)
  var m = /(\d+),(\d+),(\d+)/.exec(rgbstr);
  if(!m) return rgbstr;
  var r=Math.min(255,(+m[1])*mul)|0, g=Math.min(255,(+m[2])*mul)|0, b=Math.min(255,(+m[3])*mul)|0;
  return 'rgb('+r+','+g+','+b+')';
}

function drawBed(){
  var wp = waleSpacingPx();
  var x0 = (W - NEEDLES*wp)/2;
  var bh = bedH;

  // works enamel, dull grey-green
  ctx.fillStyle='#5f6b63';
  ctx.fillRect(0,0,W,bh);

  // chipped through to grey primer along the edges a hip or trolley has hit
  ctx.fillStyle='#8b8d87';
  for(var c=0;c<48;c++){
    var cx = hash2(c,101)*W, cy = (hash2(c,103)<0.5? hash2(c,107)*5 : bh - hash2(c,109)*7);
    var cw = 3+hash2(c,113)*16, chh = 1+hash2(c,127)*3;
    ctx.fillRect(cx, cy, cw, chh);
  }

  // the V of the two beds: back bed above, front bed below, trick plate between
  var plateY = bh*0.52;
  var plateH = bh*0.20;

  // back bed
  var g1 = ctx.createLinearGradient(0,0,0,plateY);
  g1.addColorStop(0,'#4e5a52'); g1.addColorStop(1,'#6a7670');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,plateY);

  // steel trick plate — worn hard bright exactly where needles run
  ctx.fillStyle='#7a6f60';
  ctx.fillRect(0,plateY,W,plateH);
  ctx.fillStyle='#b9bdba';
  ctx.fillRect(x0-wp, plateY+plateH*0.18, NEEDLES*wp+wp*2, plateH*0.55);

  // trick walls: one hole per needle, milled into the plate. twelve to the inch.
  for(var i=0;i<NEEDLES;i++){
    var x = x0 + i*wp;
    ctx.fillStyle = '#4a463e';
    ctx.fillRect(x + wp*0.72, plateY, Math.max(0.7, wp*0.18), plateH);
  }

  // knock-over bits, bright where they rub
  ctx.fillStyle='#b9bdba';
  ctx.fillRect(0, plateY+plateH, W, 2.2);
  ctx.fillStyle='#8f9490';
  ctx.fillRect(0, plateY+plateH+2.2, W, 1.4);

  // the needles themselves, standing in their tricks
  var camX = x0 + carriage.x*wp;
  for(var n=0;n<NEEDLES;n++){
    drawNeedle(n, x0 + n*wp + wp*0.5, plateY, plateH, camX, wp);
  }

  // below the plate: the angle of the bed, glossy black-brown with oil and lint
  var g2 = ctx.createLinearGradient(0, plateY+plateH+4, 0, bh);
  g2.addColorStop(0,'#3a3630'); g2.addColorStop(1,'#2a2620');
  ctx.fillStyle=g2;
  ctx.fillRect(0, plateY+plateH+4, W, bh-(plateY+plateH+4));

  // a visible wet film of clear spindle oil, catching the flat grey light
  ctx.save();
  ctx.globalAlpha=0.30;
  for(var o=0;o<20;o++){
    var ox = hash2(o,211)*W, oy = plateY+plateH+5 + hash2(o,223)*(bh-plateY-plateH-6);
    var ow = 8+hash2(o,227)*70, oh = 1.2+hash2(o,229)*2.6;
    ctx.fillStyle = '#7d8478';
    ctx.beginPath(); ctx.ellipse(ox,oy,ow*0.5,oh,0,0,6.283); ctx.fill();
  }
  ctx.restore();
  // oil band on the plate, wet and picking up light
  var band = Math.floor(NEEDLES*0.31);
  ctx.save(); ctx.globalAlpha=0.42;
  ctx.fillStyle='#3f4433';
  ctx.fillRect(x0+band*wp, plateY, wp*4, plateH+6);
  ctx.restore();

  // lint: pale fibrous fuzz in the bed angle and in the corners
  var lintAmt = Math.min(1, store.lint);
  ctx.save();
  for(var L=0;L<Math.floor(30+lintAmt*120);L++){
    var lx = hash2(L,307)*W;
    var ly = bh - 1 - hash2(L,311)*(5+lintAmt*13);
    ctx.globalAlpha = 0.18+hash2(L,313)*0.30;
    ctx.strokeStyle='#cfc7b2';
    ctx.lineWidth=0.7;
    ctx.beginPath();
    ctx.moveTo(lx,ly);
    ctx.lineTo(lx+(hash2(L,317)-0.5)*9, ly+(hash2(L,331)-0.5)*3.5);
    ctx.stroke();
  }
  // and in the corners
  for(var L2=0;L2<Math.floor(14+lintAmt*40);L2++){
    var side = (L2%2===0)?0:1;
    var lx2 = side? W-hash2(L2,401)*26 : hash2(L2,401)*26;
    var ly2 = hash2(L2,409)*bh;
    ctx.globalAlpha=0.14+hash2(L2,419)*0.22;
    ctx.strokeStyle='#cfc7b2'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(lx2,ly2); ctx.lineTo(lx2+(hash2(L2,421)-0.5)*8, ly2+(hash2(L2,431)-0.5)*6); ctx.stroke();
  }
  ctx.restore();
}

function drawNeedle(i, x, plateY, plateH, camX, wp){
  var wid = Math.max(0.9, wp*0.22);
  var top = plateY - plateH*0.30;

  // where is this needle in its cycle? distance from the cam box.
  var d = (x - camX)/wp;
  var phase = 0;   // 0 = at rest, 1 = fully cleared
  var ad = Math.abs(d);
  if(ad < 4.2 && !carriage.stopped){
    // rise on the leading side, descent on the trailing side
    var rel = d * carriage.dir;
    if(rel > 0){ phase = Math.max(0, 1 - rel/4.2); }         // rising
    else { phase = Math.max(0, 1 + rel/4.2); }               // descending
  }
  if(needleOut[i] || heldOut[i]) phase = 0;

  var rise = phase * plateH * 1.9;
  var ny = top - rise;

  // shank
  ctx.strokeStyle = (needleOut[i]||heldOut[i]) ? '#7a6f60' : '#b9bdba';
  ctx.lineWidth = wid;
  ctx.beginPath();
  ctx.moveTo(x, plateY+plateH);
  ctx.lineTo(x, ny);
  ctx.stroke();

  // the hook
  ctx.lineWidth = Math.max(0.8, wid*0.9);
  ctx.beginPath();
  ctx.moveTo(x, ny);
  ctx.quadraticCurveTo(x - wp*0.30, ny - wp*0.30, x, ny - wp*0.52);
  ctx.stroke();

  // the latch. the fabric opens it on the rise and shuts it on the descent.
  var latchOpen;
  if(needleBroken[i]){
    // sprung. it opens on the rise as normal, and on the descent it
    // simply does not come back over. it stands a few thousandths proud.
    latchOpen = phase > 0.08 ? 1 : 0.62;
  } else {
    var rel2 = d*carriage.dir;
    latchOpen = (rel2>0) ? Math.min(1, phase*2.4) : Math.max(0, 1 - (1-phase)*2.4);
  }
  var la = -1.25 + latchOpen*2.35;
  var llen = wp*0.62;
  ctx.lineWidth = Math.max(0.7, wid*0.75);
  ctx.beginPath();
  ctx.moveTo(x, ny - wp*0.04);
  ctx.lineTo(x + Math.sin(la)*llen, ny - wp*0.04 - Math.cos(la)*llen);
  ctx.stroke();

  // needle 47: tip painted red by whoever found it
  if(needleBroken[i]){
    ctx.fillStyle = RED;
    var tx = x + Math.sin(la)*llen, ty = ny - wp*0.04 - Math.cos(la)*llen;
    ctx.beginPath(); ctx.arc(tx,ty, Math.max(1.1, wid*0.72), 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(x, ny-wp*0.50, Math.max(1.0, wid*0.6), 0, 6.283); ctx.fill();
  }

  // the loop on this needle, standing in the hook
  var st = live[i];
  if(st){
    var wp2 = wp;
    var cL = plyColour(st.ph, 1.4, 0.1, st.len, st.oil, Math.min(0.14, store.lint*0.4));
    ctx.strokeStyle = cL;
    ctx.lineWidth = Math.max(0.9, wp*0.26);
    var ly = ny + (phase>0.4 ? wp*0.9 : wp*0.28);
    ctx.beginPath();
    ctx.moveTo(x-wp*0.34, ly+wp*0.5);
    ctx.quadraticCurveTo(x, ly-wp*0.18, x+wp*0.34, ly+wp*0.5);
    ctx.stroke();
  }
}

function drawCarriage(){
  if(NEEDLES<2) return;
  var wp = waleSpacingPx();
  var x0 = (W - NEEDLES*wp)/2;
  var cx = x0 + carriage.x*wp;
  var bw = Math.max(52, wp*9);
  var bh = bedH*0.90;

  ctx.save();
  // cam box body: works enamel, chipped
  ctx.fillStyle='#5f6b63';
  ctx.fillRect(cx-bw/2, 0, bw, bh);
  ctx.fillStyle='#4a5349';
  ctx.fillRect(cx-bw/2, bh-8, bw, 8);
  ctx.fillStyle='#8b8d87';
  for(var c=0;c<9;c++){
    var yy = hash2(c,503)*bh;
    ctx.fillRect(cx-bw/2 + hash2(c,509)*bw*0.9, yy, 2+hash2(c,521)*7, 1.5);
  }
  // oil and lint in the angle of the box
  ctx.fillStyle='#2a2620';
  ctx.fillRect(cx-bw/2, bh*0.62, bw, 3);

  // the stitch cam: a wedge whose depth sets how far the needles are drawn
  var d = stitchCam.depth;
  var camTop = bh*0.22;
  ctx.fillStyle='#7a6f60';
  ctx.beginPath();
  ctx.moveTo(cx-bw*0.34, camTop);
  ctx.lineTo(cx+bw*0.34, camTop);
  ctx.lineTo(cx+bw*0.16, camTop + bh*0.18 + d*bh*0.34);
  ctx.lineTo(cx-bw*0.16, camTop + bh*0.18 + d*bh*0.34);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#b9bdba'; ctx.lineWidth=1.2; ctx.stroke();

  ctx.restore();
}

function drawCamDial(){
  // the stitch cam dial: a graduated ring on the end of the cam box.
  // the only red on the machine besides 47 and the stop wire.
  var r = Math.min(28, W*0.052);
  var cx = W - r - 14, cy = bedH*0.40;
  ctx.save();
  ctx.fillStyle='#4a5349';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.283); ctx.fill();
  ctx.strokeStyle='#8b8d87'; ctx.lineWidth=1.4; ctx.stroke();
  // graduations, no numerals anywhere
  ctx.strokeStyle='#b9bdba';
  for(var g=0; g<20; g++){
    var a = -2.35 + (g/19)*4.70;
    var l = (g%5===0)? r*0.30 : r*0.16;
    ctx.lineWidth = (g%5===0)?1.6:0.9;
    ctx.beginPath();
    ctx.moveTo(cx+Math.sin(a)*(r-2), cy-Math.cos(a)*(r-2));
    ctx.lineTo(cx+Math.sin(a)*(r-2-l), cy-Math.cos(a)*(r-2-l));
    ctx.stroke();
  }
  // the pointer
  var pa = -2.35 + stitchCam.depth*4.70;
  ctx.strokeStyle=RED; ctx.lineWidth=2.0; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.sin(pa)*(r*0.78), cy-Math.cos(pa)*(r*0.78));
  ctx.stroke();
  ctx.fillStyle='#7a6f60';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.16,0,6.283); ctx.fill();
  ctx.restore();
}

function drawStopWire(){
  // a wire resting on the running yarn. nothing more clever than that.
  var yx = Math.min(W*0.14, 70);
  var yTop = 4, yBot = bedH*0.40;
  ctx.save();
  ctx.strokeStyle = stopWire.dropped ? RED : '#8f9490';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  if(stopWire.dropped){
    ctx.moveTo(yx, yTop);
    ctx.lineTo(yx+2, yBot+10);
  } else {
    ctx.moveTo(yx, yTop);
    ctx.lineTo(yx+14, yBot*0.72);
  }
  ctx.stroke();
  // lint on the wire
  ctx.globalAlpha=0.5; ctx.strokeStyle='#cfc7b2'; ctx.lineWidth=0.7;
  for(var i=0;i<5;i++){
    var t=i/5;
    var px = yx + (stopWire.dropped?2:14)*t, py = yTop + (yBot-yTop)*t*0.8;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+(hash2(i,601)-0.5)*7, py+(hash2(i,607)-0.5)*4); ctx.stroke();
  }
  ctx.restore();

  // the running yarn from the creel to the feeder
  if(!stopWire.dropped){
    var wp = waleSpacingPx();
    var x0 = (W - NEEDLES*wp)/2;
    var fx = x0 + carriage.x*wp;
    ctx.save();
    ctx.strokeStyle = plyColour(store.courses*0.7, 0.1, 0, runin(), 0, 0);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(yx+14, bedH*0.29);
    ctx.quadraticCurveTo((yx+fx)/2, bedH*0.12, fx, bedH*0.36);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTool(){
  // the system pointer is hidden. the visitor's position is the knitter's
  // steel latch tool lying across the bed. it fouls what it rests on.
  if(!tool.on) return;
  var wp = waleSpacingPx();
  var x0 = (W - NEEDLES*wp)/2;
  ctx.save();
  var tx = tool.x, ty = tool.y;
  ctx.translate(tx,ty);
  ctx.rotate(-0.42);
  // steel shank, worn bright
  var g = ctx.createLinearGradient(-42,0,42,0);
  g.addColorStop(0,'#7a6f60'); g.addColorStop(0.35,'#b9bdba');
  g.addColorStop(0.7,'#9aa09c'); g.addColorStop(1,'#7a6f60');
  ctx.fillStyle = g;
  ctx.fillRect(-44,-2.0, 88, 4.0);
  // the hooked end
  ctx.strokeStyle='#b9bdba'; ctx.lineWidth=3.0; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(44,0);
  ctx.quadraticCurveTo(54,-1, 52,-7);
  ctx.stroke();
  // the handle, dark with oil
  ctx.fillStyle='#2a2620';
  ctx.fillRect(-58,-3.4, 16, 6.8);
  // a bit of lint on it
  ctx.globalAlpha=0.4; ctx.strokeStyle='#cfc7b2'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(10,-2); ctx.lineTo(15,-5); ctx.stroke();
  ctx.restore();
}

/* ---------- input ---------- */
var heldOut = {};

function pointerTo(e){
  var r = cv.getBoundingClientRect();
  var px = (e.clientX!==undefined? e.clientX : (e.touches&&e.touches[0]?e.touches[0].clientX:0)) - r.left;
  var py = (e.clientY!==undefined? e.clientY : (e.touches&&e.touches[0]?e.touches[0].clientY:0)) - r.top;
  return {x:px,y:py};
}
function updateTool(p){
  var wp = waleSpacingPx();
  var x0 = (W - NEEDLES*wp)/2;
  if(p.y < bedH*1.25){
    tool.on = true; tool.x=p.x; tool.y=p.y;
    var n = Math.round((p.x - x0)/wp - 0.5);
    tool.needle = (n>=0 && n<NEEDLES && p.y < bedH) ? n : -1;
  } else {
    tool.on = false; tool.needle=-1;
  }
}

var dragging = null;
cv.addEventListener('pointerdown', function(e){
  audioInit();
  if(AC && AC.state==='suspended') AC.resume();
  var p = pointerTo(e);
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  var r = Math.min(28, W*0.052);
  var dcx = W - r - 14, dcy = bedH*0.40;
  var dd = Math.hypot(p.x-dcx, p.y-dcy);

  if(dd < r*1.9 || (p.y < bedH && Math.abs(p.x - (( (W - waleSpacingPx()*NEEDLES)/2) + carriage.x*waleSpacingPx())) < Math.max(52, waleSpacingPx()*9)/2)){
    dragging = {mode:'cam', y0:p.y, d0:stitchCam.depth};
  } else if(p.y > bedH){
    dragging = {mode:'hand', y0:p.y};
  } else {
    // pressing a single needle pushes it out of work, or back in
    var wp = waleSpacingPx();
    var x0 = (W - wp*NEEDLES)/2;
    var n = Math.round((p.x-x0)/wp - 0.5);
    if(n>=0 && n<NEEDLES){
      needleOut[n] = !needleOut[n];
      if(AC){ click((n/NEEDLES)*1.7-0.85, 0.040, 1400, 0.3); }
      // needle 47 springs back the moment the carriage next passes
      if(needleBroken[n]){ setTimeout(function(){ needleOut[n]=false; }, 60); }
    }
    dragging = {mode:'needle'};
  }
  updateTool(p);
  e.preventDefault();
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  var p = pointerTo(e);
  updateTool(p);
  if(dragging){
    if(dragging.mode==='cam'){
      var dy = (p.y - dragging.y0)/ (H*0.30);
      stitchCam.depth = Math.max(0, Math.min(1, dragging.d0 + dy));
      store.runin = runin();
    } else if(dragging.mode==='hand'){
      var d = p.y - dragging.y0;
      if(d>0){ takedown.hand = Math.min(0.95, d/220); dragging.y0 = Math.max(dragging.y0, p.y-220); }
    }
  }
  e.preventDefault();
}, {passive:false});

window.addEventListener('pointerup', function(){ dragging=null; });
window.addEventListener('pointercancel', function(){ dragging=null; });
cv.addEventListener('pointerleave', function(){ tool.on=false; tool.needle=-1; });

window.addEventListener('keydown', function(e){
  audioInit();
  if(AC && AC.state==='suspended') AC.resume();
  var k = e.key;
  if(k==='ArrowUp'){ nudgeCam(+1); e.preventDefault(); }
  else if(k==='ArrowDown'){ nudgeCam(-1); e.preventDefault(); }
  else if(k==='ArrowLeft'){ carriage.holding=-1; e.preventDefault(); }
  else if(k==='ArrowRight'){ carriage.holding=1; e.preventDefault(); }
  else if(k===' '){ takedown.hand = Math.min(0.95, takedown.hand+0.30); e.preventDefault(); }
  else if(k>='1' && k<='9'){
    var slot = (+k)-1;
    var n = Math.round((slot+0.5)*NEEDLES/9);
    if(n>=NEEDLES) n=NEEDLES-1;
    heldOut[n]=true;
    if(AC) click((n/NEEDLES)*1.7-0.85, 0.035, 1250, 0.3);
    e.preventDefault();
  }
});
window.addEventListener('keyup', function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight') carriage.holding=0;
  if(k>='1'&&k<='9'){
    var slot=(+k)-1;
    var n = Math.round((slot+0.5)*NEEDLES/9);
    if(n>=NEEDLES) n=NEEDLES-1;
    delete heldOut[n];
  }
});
function nudgeCam(dir){
  // a tenth of a millimetre of run-in per press
  var step = 0.1/(RUNIN_MAX-RUNIN_MIN);
  stitchCam.depth = Math.max(0, Math.min(1, stitchCam.depth + dir*step));
  store.runin = runin();
  if(AC){ click(0.75, 0.022, 900, 0.2); }
}

/* ---------- main loop ---------- */
var last = 0;
function frame(t){
  var dt = last? Math.min(0.055, (t-last)/1000) : 0.016;
  last = t;

  stepCarriage(dt);
  stepReleases(dt);
  stepTakedown(dt);
  otherFlatTick(dt);

  // the panel descends out of the bottom of the frame at a rate that is
  // genuinely slow and genuinely never stops
  if(!carriage.stopped){
    var ch = courseHeightPx(runin());
    var coursesPerSec = carriage.speed / (NEEDLES+4) ;
    fabricOffset += ch * coursesPerSec * dt;
    while(fabricOffset > ch){ fabricOffset -= ch; }
  }

  draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
load();
resize();
window.addEventListener('resize', function(){ resize(); });

stitchCam.depth = Math.max(0, Math.min(1, (store.runin - RUNIN_MIN)/(RUNIN_MAX-RUNIN_MIN)));

// restore the fabric, or cast on
if(store.fab && store.fab.rows && store.fab.rows.length){
  unpackFabric(store.fab);
  var lastRow = FAB[FAB.length-1];
  for(var i=0;i<NEEDLES;i++) live[i]=lastRow[i];
} else {
  // forty-one panels in, this one is part way up. cast on a starting depth.
  var seedCourses = 180;
  for(var c=0;c<seedCourses;c++){
    var row = new Array(NEEDLES);
    var rl = RUNIN_MIN + stitchCam.depth*(RUNIN_MAX-RUNIN_MIN);
    for(var n2=0;n2<NEEDLES;n2++){
      var len = rl*(0.985+hash2(n2,c)*0.03);
      var s = new Stitch(n2,c,len,(len/1000)*TWIST_TPM*6.283 + hash2(n2,c)*0.9,
                         (Math.abs(n2-Math.floor(NEEDLES*0.31))<4 ? 0.5+hash2(n2,c)*0.3 : 0));
      if(c>0 && FAB[c-1][n2]){ s.below=FAB[c-1][n2]; FAB[c-1][n2].above=s; }
      row[n2]=s;
    }
    FAB.push(row);
  }
  for(var m=0;m<NEEDLES;m++) live[m]=FAB[FAB.length-1][m];
  store.courses = seedCourses;
  // one old ladder already in the panel, from needle 47, forty courses back
  var bi2 = brokenIndex;
  for(var cc=FAB.length-40; cc>=FAB.length-96 && cc>=0; cc--){
    if(FAB[cc][bi2]) FAB[cc][bi2].held=false;
  }
}

// make sure the sprung needle is where it always is
for(var z=0;z<NEEDLES;z++) needleBroken[z]=false;
needleBroken[brokenIndex]=true;

requestAnimationFrame(frame);

window.addEventListener('beforeunload', function(){
  try{ store.fab = packFabric(); localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
});
setInterval(save, 20000);

/* the cone on the creel at twenty past ten had about forty minutes on it.
   run-in times needle count times course count consumes it exactly. */
})();
</script>
