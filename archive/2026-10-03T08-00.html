  <meta name="outbox-spec-era" content="Autumn 1983, the first wave of pocket LCD handhelds: a cheap single-screen game-and-clock unit bought from a garage forecourt spinner rack. It has a pale grey-green reflective liquid-crystal window. Every sprite is a fixed segment printed onto the glass in its one permitted position, so the unlit 'ghost' segments are always faintly visible behind the lit ones. There is a two-button-plus-cross membrane pad, a coin-cell battery hatch and a tiny speaker that can only beep. The game is FLOCK WATCH: one sheepdog, five sheep, one hillside and one pen, all drawn in segments.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY: a real, playable sheepdog trial on a fake LCD handheld, rendered edge to edge as the unit itself. You steer the dog only by whistle, never directly. Four whistle commands are bound to the arrow keys and to four on-screen membrane buttons: COME-BYE (circle clockwise), AWAY (circle anticlockwise), WALK UP (move toward the flock) and LIE DOWN (stop dead). Your goal is to gather five sheep off the top of the hill, drive them down through a gate of two hurdles and shut them in the pen before the clock runs out. The sheep genuinely flock and flee from the dog. Every creature is snapped to the nearest pre-printed segment position, so the motion is that jerky, charming LCD hop.">
  <meta name="outbox-spec-subject" content="Wisp, a young, keen and not-quite-trained border collie on her first trial. She wants to do everything right and also wants very badly to run straight at the sheep, which scatters them. The whole game is the tug between your whistles and her enthusiasm. If she is pushed too fast she overruns and splits the flock. If she is left lying down too long she creeps forward on her own. One sheep, the segment with the slightly darker face, is an old ewe called Mrs Pargeter. She always breaks for the wall and has to be headed off. A rabbit segment in the corner lights up occasionally and Wisp is desperate about it.">
  <meta name="outbox-spec-tone" content="Wisp's own thoughts, scrolling across a narrow dot-matrix strip above the field one word-chunk at a time. They are breathless, sincere, all-caps when excited, and devoted to you. 'SHEEP! Sheep sheep sheep. Okay. Lying down. I am lying down SO well.' She repeats your commands back to herself to stay focused. She apologises instantly and completely whenever the flock splits ('that was me. that was entirely me. sorry.'). She is scandalised by Mrs Pargeter and loses her whole train of thought whenever the rabbit appears. When she wins she is overjoyed and a little smug. She is never sad, never sarcastic and never wise, and she never explains herding.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Reflective LCD glass grey-green (#a3ad8f) for the screen ground and the handheld's whole face, with liquid-crystal segment black (#1f261c) for every lit sprite, button label and scrolling thought. Ghost segments are the black at about 8% opacity. A faint diagonal glare band across the glass is the only other tone permitted.">
  <meta name="outbox-spec-wildcard" content="The battery really runs down. Across a session of about fifteen real minutes, every segment grows fainter and slower to turn on, with the true LCD ghosting lag, and eventually the sheep leave smeared trails. A little contrast wheel on the unit's side can be dragged to buy back some legibility. Opening the battery hatch by clicking it restores full contrast but resets the current round. The fade level persists in localStorage. The page never mentions any of this.">
