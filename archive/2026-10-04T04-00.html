<style>
/* the glazier's rule: never two rubies touching unless you mean it */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#e9dfc9;color:#3a2a1a;font-family:Georgia,"Times New Roman",serif;text-align:center;transition:background 1.4s}
body.lit{background:#1d1522;color:#f3e6c4}
h1{font-size:clamp(1.7rem,7vw,3rem);margin:.7em .3em .1em;letter-spacing:.02em;font-style:italic}
h1 span{color:#b0122b}body.lit h1 span{color:#ffcf5a}
p.sub{margin:0 1em .6em;font-size:1rem}
svg{width:100%;max-width:460px;display:block;margin:0 auto;touch-action:manipulation}
.pane{stroke:#2b2420;stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill .35s}
.pane:hover{stroke:#6d5c4a}
body.lit #win{filter:brightness(1.35) saturate(1.3) drop-shadow(0 0 10px rgba(255,220,140,.6))}
#pool{opacity:0;transition:opacity 1.6s}body.lit #pool{opacity:.75}
button{font:inherit;font-size:1rem;margin:.3em;padding:.55em 1.1em;border-radius:2em;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:active{transform:scale(.96)}
#say{min-height:1.4em;font-style:italic;margin:.4em 1em}

<body>
<h1>Glaze Me a <span>Window!</span></h1>
<p class="sub">Tap any pane to change its glass. Then open the shutters and let the morning through.</p>
<svg viewBox="0 0 400 540" role="img" aria-label="A round stained-glass rose window with sixty-five panes. If you are hearing this: the center pane is the one the whole window is built to look at.">
<defs><filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<circle cx="200" cy="195" r="182" fill="#8a7a66" stroke="#5a4c3c" stroke-width="4"/>
<g id="win"></g>
<g id="pool" filter="url(#blur)"><use href="#win" transform="translate(200 470) scale(1.15 .2) translate(-200 -195)"/></g>
</svg>
<div><button id="sun">☀ Open the shutters</button><button id="any">✦ Glaze it for me</button></div>
<p id="say">Sixty-five panes. Every one of them waiting for you.</p>
<footer>Lead came by the yard, glass by the heart. Joy is load-bearing. · <a href="/archive">More windows down the nave →</a></footer>
<script>
const G=['#b0122b','#1d3fa8','#1f8a4c','#e8a317','#6b2aa0','#f4efe2'],N=['ruby','cobalt','emerald','amber','violet','clear'];
const cheers=['Oh, that one sings!','Gorgeous. Truly.','A saint would stop to look at that.','Yes! More of that!','The pigeons are going to be so impressed.','That pane has never been happier.','Glorious — keep going!'];
const win=document.getElementById('win'),say=document.getElementById('say'),cx=200,cy=195,ns='http://www.w3.org/2000/svg';
const P=(r,a)=>(cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2);
const rings=[[88,138,16],[138,172,32],[38,88,8]];let panes=[];
rings.forEach(([r0,r1,n],ri)=>{for(let i=0;i<n;i++){const a0=i/n*2*Math.PI-Math.PI/2+.02,a1=(i+1)/n*2*Math.PI-Math.PI/2-.02;
 const p=document.createElementNS(ns,'path');p.setAttribute('d',`M${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z`);
 add(p,ri===0?(i%2?1:3):ri===1?(i%4===0?0:i%2?1:4):(i%2?2:0));}});
const c=document.createElementNS(ns,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',34);add(c,3);
function add(el,k){el.setAttribute('class','pane');el.dataset.k=k;el.setAttribute('fill',G[k]);
 const t=document.createElementNS(ns,'title');t.textContent='pane '+(panes.length+1)+' of 65 — '+N[k];el.appendChild(t);
 el.addEventListener('click',()=>{set(el,(+el.dataset.k+1)%6);say.textContent=cheers[Math.floor(Math.random()*cheers.length)]+' ('+N[el.dataset.k]+')';});
 win.appendChild(el);panes.push(el);}
function set(el,k){el.dataset.k=k;el.setAttribute('fill',G[k]);el.querySelector('title').textContent=el.querySelector('title').textContent.replace(/— \w+$/,'— '+N[k]);}
document.getElementById('sun').onclick=function(){const on=document.body.classList.toggle('lit');this.textContent=on?'☾ Close the shutters':'☀ Open the shutters';
 say.textContent=on?'There it is — your colors, all the way across the floor!':'Rest now, little window. The sun comes back tomorrow.';};
document.getElementById('any').onclick=()=>{const s=Math.floor(Math.random()*6),t=Math.floor(Math.random()*6);
 panes.forEach((p,i)=>set(p,i<16?s:i<48?((i%2)?t:(s+2)%6):i<56?(t+3)%6:(s+1)%6));say.textContent='Freshly glazed! Every rose window is a fingerprint.';};
console.log('%c✦ Glazier\'s secret: the center pane is always glazed last, so the window can see what it became. ✦','color:#e8a317;font-size:14px');
</script>
