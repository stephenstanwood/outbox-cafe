  <meta name="outbox-spec-subject" content="The three-minute ride through the tunnel as pure spectacle, seen by a seven-year-old who has been waiting all week for this. The pre-soak spray arrives as a hard rattle of drops that bead up on the waxy glass. The foam arch lays down a thick, sliding meringue that blots out the world. The giant side brushes arrive from both edges at once, and the top brush rolls up the bonnet like a wave and over the roof with a roar, its thousand strands flicking foam into star shapes on the glass. The mitter curtain is a forest of flapping cloth ribbons. The rinse sheets everything clear in one great sluice. The wax mist hangs in the lamps like a coloured cloud, and the blower comes last, a howling wall of wind that herds the water up and off the windscreen in fat, racing, zig-zag rivulets. Then the car rolls out into daylight, and the whole thing is dazzlingly clean for exactly one second before the next car's spray hits the back window. Every run is a little different: the foam piles differently, the brushes catch at different moments and the rivulets never take the same path twice.">
  <meta name="outbox-spec-tone" content="Wordless and THUNDERING-GIDDY, like a kid on the back seat who is screaming with delight because the brushes are definitely, definitely going to come through the glass. There is no narrator, no caption and no written sentence anywhere. The register lives entirely in scale and noise. Everything is a touch too big and too close: the brushes fill the frame, the foam lands in heaps the size of pillows, and the blower is so loud the image shudders. The car rocks on the conveyor with every brush hit. The sound inside the car is muffled and huge at once: drumming spray on the roof, the whump of foam, the rising and falling roar of brushes, the slap of curtains, two kids shrieking and giggling with no discernible words, and one adult laughing despite himself. It should feel like the best fairground ride of the year, only it costs eighty tolars and Dad is paying. Loud, bouncy, sudsy and ecstatic, never calm.">

    cx.drawImage(S,b.x-r*1.7,b.y-r*1.7,r*3.4,r*3.4,-r,-r,r*2,r*2);
    cx.restore();
    cx.strokeStyle='rgba(10,22,64,.55)';cx.lineWidth=1.2;cx.beginPath();cx.arc(b.x,b.y,r,.2,2.9);cx.stroke();
    cx.strokeStyle='rgba('+Y+',.7)';cx.beginPath();cx.arc(b.x,b.y,r*.88,3.5,5.4);cx.stroke();
    cx.fillStyle='rgba(255,255,255,.7)';cx.fillRect(b.x-r*.45,b.y-r*.5,Math.max(1.5,r*.22),Math.max(1.5,r*.22));}
}
// ---------- car frame
function frame(rock){
  cx.fillStyle='rgba(10,22,64,.2)';
  cx.beginPath();cx.moveTo(0,0);cx.lineTo(W*.16,0);cx.lineTo(W*.05,H);cx.lineTo(0,H);cx.fill();
  cx.beginPath();cx.moveTo(W,0);cx.lineTo(W*.84,0);cx.lineTo(W*.95,H);cx.lineTo(W,H);cx.fill();
  cx.fillStyle=NV;
  cx.beginPath();cx.moveTo(W*.16,0);cx.lineTo(W*.21,0);cx.lineTo(W*.09,H);cx.lineTo(W*.04,H);cx.fill();
  cx.beginPath();cx.moveTo(W*.84,0);cx.lineTo(W*.79,0);cx.lineTo(W*.91,H);cx.lineTo(W*.96,H);cx.fill();
  cx.fillRect(0,0,W,H*.07);
  cx.beginPath();cx.moveTo(0,H*.9);cx.quadraticCurveTo(W/2,H*.8,W,H*.9);cx.lineTo(W,H);cx.lineTo(0,H);cx.fill();
  cx.strokeStyle=NV;cx.lineWidth=5;cx.lineCap='round';
  cx.beginPath();cx.moveTo(W*.3,H*.88);cx.lineTo(W*.6,H*.8);cx.moveTo(W*.38,H*.89);cx.lineTo(W*.7,H*.83);cx.stroke();
  cx.fillRect(W*.47,H*.07,W*.06,H*.035);
  const mx=W*.5,my=H*.105,ang=Math.sin(tt*4)*.1+rock*.05,L=H*.17;
  cx.save();cx.translate(mx,my);cx.rotate(ang);cx.strokeStyle=NV;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,L*.5);cx.stroke();
  cx.translate(0,L*.5);cx.fillStyle=NV;cx.beginPath();cx.moveTo(0,0);cx.lineTo(-L*.22,L*.5);cx.lineTo(-L*.08,L*.5);cx.lineTo(-L*.3,L*.9);cx.lineTo(L*.3,L*.9);cx.lineTo(L*.08,L*.5);cx.lineTo(L*.22,L*.5);cx.closePath();cx.fill();
  cx.fillStyle='rgba('+Y+',.35)';cx.fillRect(-1,L*.1,2,L*.75);cx.restore();
  const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(10,22,64,0)');v.addColorStop(1,'rgba(10,22,64,.75)');cx.fillStyle=v;cx.fillRect(0,0,W,H);
}
// ---------- input
let down=false,dragged=false,dT=0,lx=0,ly=0;
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
function wipe(x0,y0,x1,y1){fx.save();fx.globalCompositeOperation='destination-out';fx.strokeStyle='#000';fx.lineWidth=Math.max(26,W*.04)/2;fx.lineCap='round';fx.beginPath();fx.moveTo(x0/2,y0/2);fx.lineTo(x1/2,y1/2);fx.stroke();fx.restore();}
function doThump(){thump=.35;startAudio();tone(120,50,.25,.35,'sine');burst(300,1,.18,.25,'lowpass');}
cv.addEventListener('pointerdown',e=>{startAudio();down=true;dragged=false;dT=performance.now();[lx,ly]=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e);if(Math.hypot(x-lx,y-ly)>6){if(Math.hypot(x-lx,y-ly)>12)dragged=true;if(dragged){wipe(lx,ly,x,y);if(Math.random()<.35)squeak();}lx=x;ly=y;}});
function up(){if(down&&!dragged&&performance.now()-dT<300)doThump();down=false;nose=false;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{startAudio();
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)doThump();}
  else if(e.code==='ArrowLeft')lookT=-1;else if(e.code==='ArrowRight')lookT=1;
  else if(e.key==='n'||e.key==='N')nose=true;});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'&&lookT<0||e.code==='ArrowRight'&&lookT>0)lookT=0;if(e.key==='n'||e.key==='N')nose=false;});
// ---------- loop
let last=performance.now(),prevN='',clunk=0,kidT=3,flash=1;
function frameLoop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  tt+=dt;if(tt>=T){tt=0;FO.length=0;B.length=0;wet.fill(0);flash=1;sx.clearRect(0,0,W,H);tx.clearRect(0,0,W,H);}
  const[n,p]=station();
  if(n!==prevN){prevN=n;if(n==='side'||n==='top'||n==='blow')setTimeout(kids,200);if(n==='foam')burst(180,1,.8,.4,'lowpass');}
  look+=(lookT-look)*.08;
  const spinRate=(RM?.3:1)*(n==='side'?14:n==='top'?16:2);sp+=dt*spinRate;
  thump=Math.max(0,thump-dt);
  const noseOn=down&&!dragged&&performance.now()-dT>350||nose;
  if(noseOn){fx.fillStyle='rgba('+Y+',.07)';fx.fillRect(0,0,F.width,F.height);}
  fx.fillStyle='rgba('+Y+','+(.0016+.0008)+')';fx.fillRect(0,0,F.width,F.height);
  // scene
  sx.clearRect(0,0,W,H);bg(n,p);
  let br=null;
  if(n==='side')sideBrush(p);
  if(n==='top')br=topBrush(p);
  if(n==='mit')mit(p);
  if(n==='pre'&&p<.45){sx.fillStyle=BL;const m=22,len=H*.35*(1-p/.45);for(let i=0;i<m;i++){sx.globalAlpha=.9;sx.fillRect(i/m*W,0,W/m*.6,len*(.7+.3*Math.sin(i*3+tt*2)));}sx.globalAlpha=1;}
  if(n==='rinse'){sx.strokeStyle='rgba('+Y+',.4)';sx.lineWidth=5;for(let i=0;i<50;i++){const x=rnd(W),y=rnd(H);sx.beginPath();sx.moveTo(x,y);sx.lineTo(x,y+H*.25);sx.stroke();}}
  if(n==='wax'){const a=.4*Math.min(1,p*4,(1-p)*3+.2);const g=sx.createRadialGradient(W/2,H*.4,10,W/2,H*.4,W*.7);g.addColorStop(0,'rgba(200,245,160,'+a+')');g.addColorStop(1,'rgba(150,230,150,'+a*.5+')');sx.fillStyle=g;sx.fillRect(0,0,W,H);}
  leaf();
  updFoam(dt,n,p,br);drawFoam();
  updBeads(dt,n,p);
  // compose
  let amp=n==='top'?5:n==='side'?3.5:n==='blow'?4:n==='mit'?2.5:n==='pre'?1.5:0.6;
  if(RM)amp=0;
  const rock=Math.sin(tt*9)*amp+Math.sin(tt*23)*amp*.4;
  cx.clearRect(0,0,W,H);cx.drawImage(S,0,0);cx.drawImage(Tr,0,0);
  drawBeads();
  cx.globalAlpha=.42;cx.drawImage(F,0,0,W,H);cx.globalAlpha=1;
  frame(rock);
  if(flash>0){cx.fillStyle='rgba('+Y+','+flash+')';cx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*.7);}
  const px=RM?0:rock*(n==='blow'?1.6:1)*1.2,py=RM?0:Math.cos(tt*13)*amp*.5;
  let tf='translate('+px+'px,'+py+'px) rotate('+(RM?0:rock*.08)+'deg)';
  if(noseOn)tf+=' scale(1.1)';
  cv.style.transform=tf;cv.style.filter=noseOn?'blur(1.4px) saturate(1.1)':'none';
  // audio
  if(ac){
    const spr=({pre:1,foam:.15,side:.3,top:.35,mit:.2,rinse:.7,wax:.1})[n]||0;
    setG('spray',spr*.12);
    const bs=(n==='side'||n==='top')?Math.min(1,p*6,(1-p)*6):0;
    setG('brush',bs*.55);setG('clat',bs*.07*(.5+.5*Math.sin(sp)));
    setG('osc',bs*.05);N.osc.o.frequency.setTargetAtTime(35+spinRate*3,ac.currentTime,.1);
    setG('rinse',n==='rinse'?.25:0);setG('blow',n==='blow'?.35:0);
    mf.frequency.setTargetAtTime(noseOn?800:16000,ac.currentTime,.1);
    clunk-=dt;if(clunk<=0){clunk=1.1;tone(75,45,.18,.25,'sine');burst(150,1,.1,.2,'lowpass');}
    if(n==='mit'&&Math.random()<dt*3)burst(900,.8,.12,.3,'lowpass');
    if(n==='foam'&&Math.random()<dt*1.5)burst(160,1,.5,.3,'lowpass');
    if(Math.random()<dt*2&&amp>2)tone(220+rnd(60),170,.2,.05,'sawtooth');
    kidT-=dt;if(kidT<=0){kidT=2+rnd(4);if(n!=='exit'&&n!=='wax'||Math.random()<.3)kids();}
  }
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
})();
