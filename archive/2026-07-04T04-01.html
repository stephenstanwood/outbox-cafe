<title>Set the Glass — a little window to keep while the light comes round</title>
<!-- Tap any pane to cut a new piece. The lead came holds whatever you choose. -->
<style>
  :root{ --glow:#fff3d6; --sky:#f3ede1; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1.1rem;padding:1.4rem 1rem 2rem;
    font-family:Georgia,'Times New Roman',serif;color:#4a4034;
    background:radial-gradient(120% 90% at 50% 18%,var(--sky),#c9bfae 90%);
    transition:background 1.2s ease;}
  h1{font-weight:normal;font-size:1.15rem;letter-spacing:.02em;margin:.2rem 0 0;text-align:center}
  .stone{position:relative;padding:14px;border-radius:150px 150px 10px 10px;
    background:linear-gradient(#6b6255,#4a443a);box-shadow:0 14px 40px rgba(40,30,20,.35),inset 0 0 0 3px #7d745f}
  .light{position:absolute;inset:0;border-radius:150px 150px 10px 10px;
    background:radial-gradient(70% 65% at 50% 42%,var(--glow),transparent 72%);
    filter:blur(6px);transition:background 1.2s ease;pointer-events:none}
  .window{position:relative;width:min(78vw,280px);aspect-ratio:7/11;overflow:hidden;
    border-radius:140px 140px 4px 4px;background:#15141a;
    display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:3px}
  .pane{border-radius:1px;cursor:pointer;transition:background .35s ease,filter .35s;
    box-shadow:inset 0 0 6px rgba(0,0,0,.35);filter:saturate(1.15) brightness(1.05)}
  .pane:active{transform:scale(.94)}
  .dial{display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:#5a5142}
  input[type=range]{width:min(60vw,220px);accent-color:#8a6b3a}
  footer{font-size:.72rem;color:#6b6255;text-align:center;line-height:1.5}
  footer a{color:#6b6255}
  footer small{display:block;opacity:.6;font-size:.66rem;margin-top:.3rem}
</style>
</head>
<body>
  <h1>Set the Glass</h1>
  <div class="stone">
    <div class="window" id="w" role="img"
      aria-label="A tall arched stained-glass window, its panes cut in rings of jewelled colour."></div>
    <div class="light"></div>
  </div>
  <label class="dial">morning
    <input type="range" id="t" min="0" max="100" value="52" aria-label="the hour of the day">
    evening</label>
  <footer>
    Nine colours of glass, and all the day's light to try them by.
    <a href="/archive">the other windows</a>
    <small>held together with soft lead and patience</small>
  </footer>
<script>
  // Jewels a small workshop might actually keep in its bins.
  const glass=['#0b4f9e','#a4172f','#e0912a','#1a7a4a','#6a2a8f',
               '#d14a7a','#e8c14a','#178a8a','#c7d8e6'];
  const cols=7, rows=11, w=document.getElementById('w'), state=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    // Seed rings of colour outward from the heart of the window.
    const d=Math.round(Math.hypot(c-3, r-4.6));
    const i=(d)%glass.length, p=document.createElement('div');
    p.className='pane'; p.style.background=glass[i]; state.push(i);
    const k=state.length-1;
    p.onclick=()=>{ state[k]=(state[k]+1)%glass.length; p.style.background=glass[state[k]]; };
    w.appendChild(p);
  }
  // The light swinging from cool dawn, through white noon, to honeyed dusk.
  const stops=[[201,235,255],[255,245,214],[255,190,120]];
  const t=document.getElementById('t');
  function lerp(a,b,f){return a+(b-a)*f;}
  function light(){
    const v=t.value/100, s=v<.5?0:1, f=(v-s*.5)*2;
    const a=stops[s], b=stops[s+1];
    const col=`rgb(${a.map((x,i)=>Math.round(lerp(x,b[i],f))).join(',')})`;
    document.documentElement.style.setProperty('--glow',col);
    document.documentElement.style.setProperty('--sky',
      v<.5?'#eef1ee':`hsl(${34-v*8} 40% ${88-v*14}%)`);
  }
  t.oninput=light; light();
  console.log('Glass keeps no colour of its own — it only lends the sun a shape.');
</script>

<script src="/nav.js" defer></script>
