  <meta name="outbox-spec-era" content="1963, right now — twenty past six on a warm dry evening in a rented allotment shed at the edge of an ice rink car park in Grand Forks, North Dakota, where a competition ice sculptor's practice block has been left standing in a chest freezer with the lid propped and a shop lamp on it. Nobody is carving. The block is simply freezing further, from the outside in, and a directional freeze rig — a copper cold plate under it and a length of insulated ducting over the sides — is turning cloudy tap-water ice into clear ice one advancing front at a time. Not a look-back at anything and not a lament: the block goes to the fairgrounds Saturday and the front is currently about four centimetres in.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one rectangular block of ice seen straight through, backlit, life-size: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. It is a live solidification simulation. A real freezing front advances inward from the cold plate at the bottom edge, and the piece IS what that front does to dissolved air — gas is rejected ahead of the ice and concentrates until it nucleates, so bubbles are born AT the interface, in bands, and are then captured and frozen in place forever, building a permanent stratigraphy of the last several minutes of freezing. Dendritic ice spikes race ahead of the flat front where supercooling runs deep. The visitor's entire vocabulary is heat and agitation: drag the cursor across the glass to warm a patch, which slows the front there and lets it fall behind its neighbours into a real lobe; press and hold to warm hard enough to melt the front back and release a captured bubble train that rises and re-freezes higher up as a different, coarser band; and flick the cursor quickly to stir the melt, which sweeps rejected gas sideways and produces a genuinely clear, bubble-free stripe. Nothing scrolls, nothing is a menu, nothing is explained. The block finishes freezing in about seven minutes and then simply sits there with everything the visitor did to it recorded in it.">
  <meta name="outbox-spec-subject" content="The plain physics of why clear ice is clear and cloudy ice is cloudy — that the cloudiness is not dirt and not impurity in any useful sense, it is dissolved atmospheric gas, and that ice will not accept gas into its lattice, so every advancing freezing front pushes gas ahead of itself into the remaining liquid; that this means the last water to freeze is the most gas-loaded water in the block, which is exactly why an ordinary ice cube freezing from all six faces inward drives everything it rejects into a white opaque core, and why the trick of directional freezing works — freeze from one face only, keep the far face open, and the gas is driven all the way out to that face and can be thrown away; that bubbles form only when the local gas concentration at the interface exceeds saturation, so they arrive in bursts rather than continuously, producing genuine horizontal banding whose spacing reads out the freezing rate; that faster freezing traps more, because the rejected gas has no time to diffuse away from the front, so a fast front is a cloudy front and a slow one is glass; that constitutional supercooling is what breaks a flat interface into spikes — the liquid immediately ahead of the front is enriched, its freezing point is depressed, and any bump that pokes into fresher water ahead finds itself in colder-than-it-needs water and grows faster, so bumps run away and the interface goes dendritic; that stirring the melt is the whole of the practical answer, because it sweeps the enriched boundary layer away and restores a flat front, which is why the competition men run a pump in the tank; that a bubble already frozen in is not going anywhere unless the ice around it is melted back, and a re-frozen band never matches the band above it because the water it re-froze from has a different gas load; and the flat arithmetic that this block is 25 cm deep, the front is doing about four millimetres an hour on the plate, the shop lamp is putting real heat on the near face and the near face is measurably behind, and it has to be clear to at least twenty centimetres by Saturday.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the ice and the light, and that register is COLD, SLOW-BUT-BUSY, PATIENT and STRUCTURAL — a front that advances at a rate you can genuinely watch if you hold still, bubbles arriving in real bursts of dozens at a time with a faint tick, dendrite spikes shooting ahead in fast little runs and then getting overtaken, the shop lamp throwing one hard bright caustic through the clear part that moves as the clear part gets deeper. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT fragile-and-precious, NOT ASMR, NOT a screensaver — this is a block on a plate in a shed at twenty past six with a deadline on Saturday and the near face running behind.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. Meltwater and liquid phase in a cold dense green-blue (#1d4a5c) going nearly black at depth (#0b1f28), against frozen clear ice which is not white but a pale glassy cyan-grey (#bcd8de) with real refraction — the far edge of the block visibly displaced through it — and a hard bright caustic band where the shop lamp's light is focused by the block's own curvature (#f4fbfc). Trapped gas is the only opaque thing in the piece and it is a true chalky white (#fbfdfd) with a dark refractive rim on every bubble (#5f8894), rendered honestly at real size from real nucleated volume. Copper cold plate along the bottom edge in a dull oxidised brown-orange (#8a5326). Exactly one chip of tungsten lamp amber (#e8a13c) is held strictly for the direct lamp source at the top right corner and the warm cast it throws onto the ice's near face — nowhere else. High contrast, transmissive, genuinely luminous where light passes through clear ice and genuinely dead where bubble bands scatter it; no glow-bloom haze, no gradients other than the honest thermal field and the honest optical depth.">
  <meta name="outbox-spec-wildcard" content="One bubble, nucleated in the first thirty seconds of the freeze and always in the same place — about a third of the way in from the left, four centimetres up from the plate — is enormous, roughly the size of a thumbnail, and shaped wrong: an irregular elongated void rather than a sphere, with a fine tail running downward toward the plate. It is captured immediately and stays for the entire life of the page. It cannot be melted back out no matter how long the cursor is held on it — the ice around it recedes and then simply re-freezes with it still there. Nothing on the page marks it, nothing explains it, and it is in the same position with the same shape every visit.">
  <meta name="outbox-spec-forbidden" content="NO ice-as-metaphor for clarity, purity, coldness-of-feeling, preservation, being-frozen-in-time, what-gets-trapped, or 'the bubbles are memories' — it is a partition coefficient, a boundary layer and a critical capture velocity, and it has nothing to teach anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, ambient-visualiser, screensaver or 'let it still you' framing whatsoever, and NO generative-art-gallery register. NO fragility lyricism, NO ephemerality, NO 'it will melt', NO memento mori — the block is being made, not lost. NO winter melancholy, NO Nordic or northern-plains lyricism, NO prairie loneliness, NO snow-quiet, NO blue-hour reverie. NO climate or glacier framing of any kind, NO ice cores, NO 'trapped air from another century', NO deep-time. NO craft mysticism, NO ice-sculptor-as-artist reverence, NO chainsaw-and-chisel romance, NO competition-drama arc. NO cryptic-SCP, liminal, uncanny, analog-horror or ominous dread about the large bubble or the freezer — nothing is wrong. NO nostalgia, NO wistfulness, NO 'nobody carves ice anymore / the rink closed' decline narrative — the block goes out Saturday. NO sensuous material writing about ice or light beyond thickness, temperature, refraction, scattering and rate. NO archival / museum / cabinet / specimen / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is twenty past six on a warm evening. NO signal / transmission / frequency framing of any sound. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the block, the plate, the lamp and the shed wall, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
'use strict';
var cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
var W=0,H=0,DPR=1,cw=0,ch=0,nx=0,ny=0,cellW=0,cellH=0;
var PLATE=2;
var T,T2,phi,M,Mice,uF,vF,noiz,bden,lampQ,caust,frontRow,frontF,frontPrev,frontVel;
var fieldC,fieldX,fieldImg,fieldData,causC,causX,causImg,causData,bgC,bgX,recC,recX,platC,platX;
var risers=[],captured=[],nucQ=[];
var simT=0,frames=0,lastT=0,running=true,bigDone=false;

var P={plateT:-19.0,airT:9.0,hcTop:0.0016,L:32.0,kin:0.34,kmelt:0.105,
       mC:1.55,k0:0.02,D:0.0135,C0:0.62,Cnuc:1.46,lamp:0.00045,Vc0:0.052,
       liqT0:2.4};

function clamp(a,b,c){return a<b?b:(a>c?c:a);}

/* ---------------------------------------------------------------- layout */
function layout(){
  W=Math.max(240,window.innerWidth); H=Math.max(240,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1,1.6);
  cw=Math.round(W*DPR); ch=Math.round(H*DPR);
  cvs.width=cw; cvs.height=ch; cvs.style.width=W+'px'; cvs.style.height=H+'px';
  var budget=(W<620||H<520)?7600:14500;
  var asp=cw/ch;
  ny=Math.round(Math.sqrt(budget/asp)); nx=Math.round(ny*asp);
  ny=clamp(ny,58,132); nx=clamp(nx,52,196);
  cellW=cw/nx; cellH=ch/ny;
  fieldC=document.createElement('canvas'); fieldC.width=nx; fieldC.height=ny;
  fieldX=fieldC.getContext('2d'); fieldImg=fieldX.createImageData(nx,ny); fieldData=fieldImg.data;
  causC=document.createElement('canvas'); causC.width=nx; causC.height=ny;
  causX=causC.getContext('2d'); causImg=causX.createImageData(nx,ny); causData=causImg.data;
  var oldRec=recC;
  recC=document.createElement('canvas'); recC.width=cw; recC.height=ch; recX=recC.getContext('2d');
  if(oldRec){ try{recX.drawImage(oldRec,0,0,cw,ch);}catch(e){} }
  buildBg(); buildPlate();
}

function buildBg(){
  bgC=document.createElement('canvas'); bgC.width=cw; bgC.height=ch; bgX=bgC.getContext('2d');
  var g=bgX;
  g.fillStyle='#07141a'; g.fillRect(0,0,cw,ch);
  /* shed wall boards behind the block */
  var bw=cw/9;
  for(var i=0;i<10;i++){
    g.fillStyle=(i%2)?'#0a1c23':'#081820';
    g.fillRect(i*bw,0,bw-1,ch);
    g.fillStyle='#050f14'; g.fillRect(i*bw+bw-1,0,1.4,ch);
  }
  /* duct shadow across the top */
  g.fillStyle='#040c11'; g.fillRect(0,0,cw,ch*0.14);
  /* the far edge of the block: two hard vertical lines, the thing you watch bend */
  g.fillStyle='#3d6a74'; g.fillRect(cw*0.615,0,Math.max(2,cw*0.004),ch);
  g.fillStyle='#2b545e'; g.fillRect(cw*0.181,0,Math.max(1.5,cw*0.003),ch);
  /* the far bottom lip, catching plate light */
  g.fillStyle='#17323a'; g.fillRect(0,ch*0.80,cw,ch*0.05);
  g.fillStyle='#22434c'; g.fillRect(0,ch*0.80,cw,1.6);
  /* a cool spill on the wall past the block's right shoulder */
  g.fillStyle='#12292f'; g.fillRect(cw*0.93,ch*0.08,cw*0.07,ch*0.30);
}

function buildPlate(){
  var hpx=Math.ceil(PLATE*cellH)+2;
  platC=document.createElement('canvas'); platC.width=cw; platC.height=hpx;
  platX=platC.getContext('2d');
  var g=platX;
  g.fillStyle='#8a5326'; g.fillRect(0,0,cw,hpx);
  var s=12345;
  function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296;}
  for(var i=0;i<420;i++){
    var x=rnd()*cw,y=rnd()*hpx,w=2+rnd()*22,h=1+rnd()*3;
    g.fillStyle=rnd()>0.5?'rgba(60,34,15,0.45)':'rgba(163,102,52,0.35)';
    g.fillRect(x,y,w,h);
  }
  g.fillStyle='rgba(196,133,74,0.55)'; g.fillRect(0,0,cw,1.4);
  g.fillStyle='rgba(30,16,6,0.6)'; g.fillRect(0,hpx-2,cw,2);
}

/* ---------------------------------------------------------------- fields */
function alloc(){
  var n=nx*ny;
  T=new Float32Array(n); T2=new Float32Array(n); phi=new Float32Array(n);
  M=new Float32Array(n); Mice=new Float32Array(n);
  uF=new Float32Array(n); vF=new Float32Array(n);
  noiz=new Float32Array(n); bden=new Float32Array(n); lampQ=new Float32Array(n);
  caust=new Float32Array(n);
  frontRow=new Int16Array(nx); frontF=new Float32Array(nx);
  frontPrev=new Float32Array(nx); frontVel=new Float32Array(nx);
  var i,x,y;
  for(i=0;i<n;i++){ T[i]=P.liqT0; M[i]=P.C0; phi[i]=0; }
  for(y=ny-PLATE;y<ny;y++)for(x=0;x<nx;x++){ var j=y*nx+x; T[j]=P.plateT; phi[j]=1; M[j]=0; }
  /* seeded, smoothed kinetic noise: the thing bumps grow out of */
  var tmp=new Float32Array(n), s=90210;
  function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296;}
  for(i=0;i<n;i++) tmp[i]=rnd();
  for(var pass=0;pass<3;pass++){
    for(y=0;y<ny;y++)for(x=0;x<nx;x++){
      var l=x>0?x-1:0, r=x<nx-1?x+1:nx-1, u=y>0?y-1:0, d=y<ny-1?y+1:ny-1;
      noiz[y*nx+x]=(tmp[y*nx+l]+tmp[y*nx+r]+tmp[u*nx+x]+tmp[d*nx+x]+tmp[y*nx+x]*2)/6;
    }
    tmp.set(noiz);
  }
  for(i=0;i<n;i++) noiz[i]=0.80+0.42*noiz[i];
  /* radiant load from the lamp at the top right, on the near face */
  var lx=nx*1.03, ly=-0.10*ny;
  for(y=0;y<ny;y++)for(x=0;x<nx;x++){
    var dx=(x-lx)/nx, dy=(y-ly)/ny;
    var dd=Math.sqrt(dx*dx+dy*dy);
    lampQ[y*nx+x]=P.lamp*(0.26+0.74*Math.exp(-dd*1.55));
  }
  for(x=0;x<nx;x++){ frontRow[x]=ny-PLATE; frontF[x]=ny-PLATE; frontPrev[x]=ny-PLATE; }
  risers.length=0; captured.length=0;
}

/* ---------------------------------------------------------------- physics */
function substep(){
  var n=nx*ny,i,x,y,row,rowU,rowD,l,r;
  /* lamp load */
  for(i=0;i<(ny-PLATE)*nx;i++) T[i]+=lampQ[i];
  /* shed air over the open top face */
  for(x=0;x<nx;x++) T[x]+=P.hcTop*(P.airT-T[x]);
  /* conduction; ice conducts better than water */
  for(y=0;y<ny;y++){
    row=y*nx; rowU=(y>0?y-1:0)*nx; rowD=(y<ny-1?y+1:ny-1)*nx;
    for(x=0;x<nx;x++){
      i=row+x; l=row+(x>0?x-1:0); r=row+(x<nx-1?x+1:nx-1);
      var a=0.085+0.115*phi[i];
      T2[i]=T[i]+a*(T[l]+T[r]+T[rowU+x]+T[rowD+x]-4*T[i]);
    }
  }
  var sw=T; T=T2; T2=sw;
  for(y=ny-PLATE;y<ny;y++){ row=y*nx; for(x=0;x<nx;x++) T[row+x]=P.plateT; }

  /* phase change + gas partition */
  var lim=ny-PLATE;
  for(y=0;y<lim;y++){
    row=y*nx;
    for(x=0;x<nx;x++){
      i=row+x;
      var ph=phi[i], lq=1-ph;
      var C=lq>1e-3?M[i]/lq:P.C0;
      var Tl=-P.mC*(C-P.C0);
      if(T[i]<Tl&&ph<0.9999){
        var ns=ph>0.02;
        if(!ns){
          if(phi[i+nx]>0.55)ns=true;
          else if(y>0&&phi[i-nx]>0.55)ns=true;
          else if(x>0&&phi[i-1]>0.55)ns=true;
          else if(x<nx-1&&phi[i+1]>0.55)ns=true;
        }
        if(ns){
          var d=P.kin*(Tl-T[i])*noiz[i];
          if(d>0.30)d=0.30; if(d>lq)d=lq;
          if(d>1e-6){
            phi[i]=ph+d; T[i]+=P.L*d;
            var gas=C*d;
            M[i]-=gas; Mice[i]+=gas*P.k0;
            var rej=gas*(1-P.k0);
            var ws=1-phi[i], wn=0, w1=0,w2=0,w3=0,w4=0;
            if(x>0){w1=1-phi[i-1]; if(w1<0.02)w1=0; wn+=w1;}
            if(x<nx-1){w2=1-phi[i+1]; if(w2<0.02)w2=0; wn+=w2;}
            if(y>0){w3=1-phi[i-nx]; if(w3<0.02)w3=0; wn+=w3;}
            if(y+1<lim){w4=1-phi[i+nx]; if(w4<0.02)w4=0; wn+=w4;}
            var tot=ws+wn;
            if(tot<0.02){ M[i]+=rej; }
            else{
              M[i]+=rej*ws/tot;
              if(w1)M[i-1]+=rej*w1/tot;
              if(w2)M[i+1]+=rej*w2/tot;
              if(w3)M[i-nx]+=rej*w3/tot;
              if(w4)M[i+nx]+=rej*w4/tot;
            }
          }
        }
      } else if(ph>0&&T[i]>Tl){
        var dm=P.kmelt*(T[i]-Tl);
        if(dm>ph)dm=ph; if(dm>0.25)dm=0.25;
        if(dm>1e-6){
          phi[i]=ph-dm; T[i]-=P.L*dm;
          var rel=Mice[i]*(dm/ph);
          Mice[i]-=rel; M[i]+=rel;
        }
      }
    }
  }

  /* gas diffusion in the liquid, flux form, conserved */
  for(y=0;y<lim;y++){
    row=y*nx;
    for(x=0;x<nx;x++){
      i=row+x; var la=1-phi[i];
      if(la<0.03)continue;
      if(x<nx-1){ var j=i+1, lb=1-phi[j];
        if(lb>0.03){ var f=P.D*(M[j]/lb-M[i]/la)*(la<lb?la:lb); M[i]+=f; M[j]-=f; } }
      if(y<lim-1){ var j2=i+nx, lc=1-phi[j2];
        if(lc>0.03){ var f2=P.D*(M[j2]/lc-M[i]/la)*(la<lc?la:lc); M[i]+=f2; M[j2]-=f2; } }
    }
  }

  /* stirring: advect gas and heat sideways, decay the field */
  if(stirLive>0.001){
    for(y=0;y<lim;y++){
      row=y*nx;
      for(x=0;x<nx-1;x++){
        i=row+x; var jj=i+1;
        if(phi[i]>0.75||phi[jj]>0.75)continue;
        var uf=0.5*(uF[i]+uF[jj]); if(uf>0.42)uf=0.42; if(uf<-0.42)uf=-0.42;
        var am=uf*(uf>0?M[i]:M[jj]);
        M[i]-=am; M[jj]+=am;
        var ht=uf*0.5*(uf>0?T[i]:T[jj]);
        T[i]-=ht; T[jj]+=ht;
      }
    }
    for(y=0;y<lim-1;y++){
      row=y*nx;
      for(x=0;x<nx;x++){
        i=row+x; var j3=i+nx;
        if(phi[i]>0.75||phi[j3]>0.75)continue;
        var vf=0.5*(vF[i]+vF[j3]); if(vf>0.42)vf=0.42; if(vf<-0.42)vf=-0.42;
        var am2=vf*(vf>0?M[i]:M[j3]);
        M[i]-=am2; M[j3]+=am2;
      }
    }
    for(i=0;i<n;i++){ uF[i]*=0.984; vF[i]*=0.984; }
    stirLive*=0.984;
  }

  /* nucleation at the interface */
  var nucCount=0;
  for(y=0;y<lim;y++){
    row=y*nx;
    for(x=0;x<nx;x++){
      i=row+x; var lqn=1-phi[i];
      if(lqn<0.34)continue;
      var Cn=M[i]/lqn;
      if(Cn<P.Cnuc)continue;
      var touching=false;
      if(phi[i+nx]>0.5)touching=true;
      else if(y>0&&phi[i-nx]>0.5)touching=true;
      else if(x>0&&phi[i-1]>0.5)touching=true;
      else if(x<nx-1&&phi[i+1]>0.5)touching=true;
      if(!touching)continue;
      if(captured.length>5400)continue;
      var g=(Cn-P.C0*1.16)*lqn*0.86;
      if(g<=0.002)continue;
      M[i]-=g;
      var rc=0.085+0.255*Math.sqrt(g);
      var rp=rc*((cellW+cellH)*0.5);
      if(rp<0.85)rp=0.85;
      var bx=(x+0.28+0.44*noiz[i])*cellW;
      var by=(y+0.55+0.4*noiz[i])*cellH;
      var vel=frontVel[x];
      var vcrit=P.Vc0/rc;
      if(vel>vcrit){ capture(bx,by,rp,g,x,y); }
      else { risers.push({x:bx,y:by,r:rp,g:g,ph:noiz[i]*6.28}); if(risers.length>460)risers.shift(); }
      nucQ.push(rp);
      nucCount++;
      if(nucCount>46)return;
    }
  }
}

function capture(bx,by,rp,g,gx,gy){
  captured.push({x:bx,y:by,r:rp,g:g,live:true});
  drawBub(recX,bx,by,rp);
  var ci=gy*nx+gx;
  if(ci>=0&&ci<nx*ny) bden[ci]+=rp*rp*0.35;
}

function drawBub(g,x,y,r){
  g.beginPath(); g.arc(x,y,r,0,6.2832);
  g.fillStyle='#fbfdfd'; g.fill();
  if(r>1.25){
    g.lineWidth=Math.max(0.65,r*0.36);
    g.strokeStyle='rgba(95,136,148,0.9)';
    g.stroke();
  }
}

/* risers */
function moveRisers(dt){
  var lim=ny-PLATE;
  for(var b=risers.length-1;b>=0;b--){
    var o=risers[b];
    var rc=o.r/((cellW+cellH)*0.5);
    var vy=(2.6+34*rc*rc);
    o.ph+=dt*7;
    var gx=clamp(Math.floor(o.x/cellW),0,nx-1);
    var gy=clamp(Math.floor(o.y/cellH),0,ny-1);
    var idx=gy*nx+gx;
    o.y-=vy*dt*cellH;
    o.x+=(Math.sin(o.ph)*0.35+uF[idx]*26)*dt*cellW;
    if(o.x<2)o.x=2; if(o.x>cw-2)o.x=cw-2;
    if(o.y<cellH*0.8){ risers.splice(b,1); continue; }
    gy=clamp(Math.floor(o.y/cellH),0,ny-1);
    idx=gy*nx+gx;
    if(phi[idx]>0.62&&gy<lim){ capture(o.x,o.y,o.r,o.g,gx,gy); risers.splice(b,1); }
  }
}

/* ---------------------------------------------------------------- front */
function computeFront(dt){
  var lim=ny-PLATE;
  for(var x=0;x<nx;x++){
    var found=lim, y;
    for(y=0;y<lim;y++){ if(phi[y*nx+x]>0.5){ found=y; break; } }
    frontRow[x]=found;
    var frac=found;
    if(found>0&&found<lim) frac=found-clamp(phi[(found-1)*nx+x]/0.5,0,1)*0.75;
    frontPrev[x]=frontF[x];
    frontF[x]=frac;
    if(dt>0.0005){
      var inst=(frontPrev[x]-frac)/dt;
      frontVel[x]=frontVel[x]*0.88+inst*0.12;
    }
  }
}

/* ---------------------------------------------------------------- optics */
function computeCaustic(){
  var n=nx*ny,i;
  for(i=0;i<n;i++) caust[i]*=0.40;
  var lim=ny-PLATE;
  var lx=nx*1.04, ly=-0.12*ny;
  for(var x=1;x<nx-1;x++){
    var fy=frontF[x];
    if(fy>=lim-0.5)continue;
    var sl=(frontF[x+1]-frontF[x-1])*0.5;
    var nlen=Math.sqrt(sl*sl+1);
    var nX=sl/nlen, nY=-1/nlen;
    var dx=x-lx, dy=fy-ly, dl=Math.sqrt(dx*dx+dy*dy);
    dx/=dl; dy/=dl;
    var eta=1/1.13;
    var ci=-(dx*nX+dy*nY);
    var kk=1-eta*eta*(1-ci*ci);
    if(kk<0)continue;
    var ss=eta*ci-Math.sqrt(kk);
    var rx=eta*dx+ss*nX, ry=eta*dy+ss*nY;
    var rl=Math.sqrt(rx*rx+ry*ry); rx/=rl; ry/=rl;
    if(ry<0.04)continue;
    var px=x, py=fy, en=1.0;
    for(var s=0;s<ny;s++){
      px+=rx; py+=ry;
      if(py>=lim-0.5||px<0||px>nx-1)break;
      var gx=px|0, gy=py|0;
      var fx=px-gx, fyy=py-gy;
      var ii=gy*nx+gx;
      caust[ii]+=en*(1-fx)*(1-fyy);
      if(gx<nx-1)caust[ii+1]+=en*fx*(1-fyy);
      if(gy<lim-1){ caust[ii+nx]+=en*(1-fx)*fyy; if(gx<nx-1)caust[ii+nx+1]+=en*fx*fyy; }
      en*=0.988/(1+bden[ii]*0.55);
      if(en<0.02)break;
    }
  }
  var d=causData,p=0;
  for(var y=0;y<ny;y++)for(var xx=0;xx<nx;xx++,p+=4){
    var ii2=y*nx+xx;
    var l=xx>0?caust[ii2-1]:caust[ii2], r=xx<nx-1?caust[ii2+1]:caust[ii2];
    var vv=(caust[ii2]*2+l+r)*0.25;
    var a=vv*0.062;
    if(a>0.85)a=0.85;
    d[p]=244; d[p+1]=251; d[p+2]=252; d[p+3]=a*255;
  }
  causX.putImageData(causImg,0,0);
}

function renderField(){
  var d=fieldData,p=0,lim=ny-PLATE;
  for(var y=0;y<ny;y++){
    for(var x=0;x<nx;x++,p+=4){
      if(y>=lim){ d[p+3]=0; continue; }
      var i=y*nx+x, ph=phi[i];
      var w=clamp((T[i]+1.6)/6.5,0,1);
      var lr=11+18*w, lg=31+43*w, lb=40+52*w, la=0.985;
      var depth=(y-frontF[x])/ny; if(depth<0)depth=0;
      var ia=clamp(0.17+0.62*depth,0,0.74);
      var f=ph<0.14?0:(ph>0.62?1:(ph-0.14)/0.48);
      f=f*f*(3-2*f);
      d[p]=lr+(188-lr)*f; d[p+1]=lg+(216-lg)*f; d[p+2]=lb+(222-lb)*f;
      d[p+3]=(la+(ia-la)*f)*255;
    }
  }
  fieldX.putImageData(fieldImg,0,0);
}

/* the one that came up wrong in the first half minute */
function drawBig(g){
  var bx=cw*0.333, plateY=(ny-PLATE)*cellH;
  var blockH=plateY;
  var by=plateY-blockH*0.163;
  var s=blockH*0.030;
  g.save(); g.translate(bx,by);
  g.beginPath();
  var pts=[[-0.42,-1.55],[0.18,-1.72],[0.62,-1.18],[0.48,-0.42],[0.86,0.10],[0.66,0.78],
           [0.22,1.02],[0.30,1.62],[0.10,1.70],[0.02,1.05],[-0.34,0.90],[-0.70,0.36],
           [-0.52,-0.30],[-0.78,-0.86]];
  g.moveTo(pts[0][0]*s,pts[0][1]*s);
  for(var i=1;i<pts.length;i++){
    var a=pts[i-1],b=pts[i];
    g.quadraticCurveTo((a[0]*0.6+b[0]*0.4)*s*1.06,(a[1]*0.6+b[1]*0.4)*s*1.02,b[0]*s,b[1]*s);
  }
  g.closePath();
  g.fillStyle='#fbfdfd'; g.fill();
  g.lineWidth=Math.max(1,s*0.20); g.strokeStyle='rgba(95,136,148,0.92)'; g.stroke();
  /* the fine tail, running down toward the plate */
  g.beginPath();
  g.moveTo(0.16*s,1.60*s);
  g.quadraticCurveTo(0.52*s,3.1*s,0.24*s,4.9*s);
  g.lineWidth=Math.max(0.9,s*0.16); g.strokeStyle='rgba(251,253,253,0.93)'; g.stroke();
  g.lineWidth=Math.max(0.5,s*0.06); g.strokeStyle='rgba(95,136,148,0.5)'; g.stroke();
  g.restore();
}

/* ---------------------------------------------------------------- render */
function render(dt){
  computeFront(dt);
  renderField();
  if((frames%3)===0) computeCaustic();

  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bgC,0,0);

  /* refraction: the far edge of the block, displaced by the shape of the front */
  var lim=ny-PLATE, step=4;
  for(var sx=0;sx<cw;sx+=step){
    var col=Math.min(nx-1,Math.floor(sx/cellW));
    var fr=frontF[col];
    if(fr>=lim-0.4)continue;
    var fy=fr*cellH;
    var c0=col>0?col-1:0, c1=col<nx-1?col+1:nx-1;
    var sl=(frontF[c1]-frontF[c0])*0.5;
    var thick=(lim-fr)/ny;
    var dd=sl*cellW*1.7*thick+thick*7;
    if(dd>34)dd=34; if(dd<-34)dd=-34;
    var sxs=sx-dd; if(sxs<0)sxs=0; if(sxs>cw-step)sxs=cw-step;
    var hgt=ch-fy;
    if(hgt>1) ctx.drawImage(bgC,sxs,fy,step,hgt,sx,fy,step,hgt);
  }

  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(fieldC,0,0,cw,ch);

  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(causC,0,0,cw,ch);
  ctx.globalCompositeOperation='source-over';

  /* the near face runs behind the far face; you see both through the block */
  ctx.beginPath();
  var started=false;
  for(var x2=0;x2<nx;x2++){
    var lag=1.6+3.4*Math.exp(-((nx-x2)/nx)*1.55);
    var yy=(frontF[x2]+lag)*cellH;
    if(yy>ch)yy=ch;
    if(!started){ ctx.moveTo(x2*cellW,yy); started=true; } else ctx.lineTo((x2+0.5)*cellW,yy);
  }
  ctx.lineWidth=Math.max(1,DPR*1.1);
  ctx.strokeStyle='rgba(188,216,222,0.20)';
  ctx.stroke();

  ctx.drawImage(recC,0,0);
  drawBig(ctx);

  for(var b=0;b<risers.length;b++){
    var o=risers[b];
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,6.2832);
    ctx.fillStyle='rgba(251,253,253,0.86)'; ctx.fill();
    if(o.r>1.3){ ctx.lineWidth=Math.max(0.6,o.r*0.3); ctx.strokeStyle='rgba(95,136,148,0.65)'; ctx.stroke(); }
  }

  /* copper */
  ctx.drawImage(platC,0,(ny-PLATE)*cellH);

  /* the lamp itself, and the warm it throws on the near face — nowhere else */
  var lg=ctx.createLinearGradient(cw,0,cw*0.42,ch*0.5);
  lg.addColorStop(0,'rgba(232,161,60,0.115)');
  lg.addColorStop(1,'rgba(232,161,60,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,cw,ch);
  var lr2=Math.min(cw,ch)*0.017;
  ctx.beginPath(); ctx.arc(cw*0.958,ch*0.048,lr2,0,6.2832);
  ctx.fillStyle='#e8a13c'; ctx.fill();
  ctx.beginPath(); ctx.arc(cw*0.958,ch*0.048,lr2*0.45,0,6.2832);
  ctx.fillStyle='#f4d9a6'; ctx.fill();
}

/* ---------------------------------------------------------------- cursor */
var pX=-1,pY=-1,pIn=false,pressed=false,lastMove=0,pvx=0,pvy=0,lastPX=0,lastPY=0,lastPT=0;
var stirLive=0, meltClock=0;

function pointerPos(e){
  var rect=cvs.getBoundingClientRect();
  pX=(e.clientX-rect.left)*(cw/rect.width);
  pY=(e.clientY-rect.top)*(ch/rect.height);
}
function onMove(e){
  if(e.cancelable)e.preventDefault();
  pointerPos(e); pIn=true;
  var now=performance.now();
  var ddt=Math.max(0.008,(now-lastPT)/1000);
  var vx=(pX-lastPX)/ddt/cellW, vy=(pY-lastPY)/ddt/cellH;
  lastPX=pX; lastPY=pY; lastPT=now; lastMove=now;
  var sp=Math.sqrt(vx*vx+vy*vy);
  pvx=vx; pvy=vy;
  if(sp>44) injectStir(vx,vy,sp);
}
function injectStir(vx,vy,sp){
  var gx=pX/cellW, gy=pY/cellH, R=6.5;
  var amt=clamp(sp/900,0,0.30);
  var x0=Math.max(0,Math.floor(gx-R)),x1=Math.min(nx-1,Math.ceil(gx+R));
  var y0=Math.max(0,Math.floor(gy-R)),y1=Math.min(ny-PLATE-1,Math.ceil(gy+R));
  var nl=Math.sqrt(vx*vx+vy*vy)||1;
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
    var dx=x-gx,dy=y-gy,d2=dx*dx+dy*dy;
    if(d2>R*R)continue;
    var w=Math.exp(-d2/(2*(R*0.5)*(R*0.5)));
    var i=y*nx+x;
    uF[i]+=(vx/nl)*amt*w; vF[i]+=(vy/nl)*amt*w;
    if(uF[i]>0.45)uF[i]=0.45; if(uF[i]<-0.45)uF[i]=-0.45;
    if(vF[i]>0.45)vF[i]=0.45; if(vF[i]<-0.45)vF[i]=-0.45;
  }
  stirLive=Math.max(stirLive,amt*3.2);
  if(A) gurgleTarget=Math.min(0.30,gurgleTarget+amt*0.7);
}
function applyHeat(subs){
  if(!pIn)return;
  var now=performance.now();
  var moving=(now-lastMove)<420;
  if(!pressed&&!moving)return;
  var Q=pressed?0.34:0.075;
  var R=pressed?7.2:6.0;
  var gx=pX/cellW, gy=pY/cellH;
  var x0=Math.max(0,Math.floor(gx-R)),x1=Math.min(nx-1,Math.ceil(gx+R));
  var y0=Math.max(0,Math.floor(gy-R)),y1=Math.min(ny-1,Math.ceil(gy+R));
  var sg=R*0.46;
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
    var dx=x-gx,dy=y-gy,d2=dx*dx+dy*dy;
    if(d2>R*R)continue;
    T[y*nx+x]+=Q*subs*Math.exp(-d2/(2*sg*sg));
  }
  if(pressed){
    meltClock+=subs;
    if(meltClock>22){ meltClock=0; releaseMelted(gx,gy,R); }
  }
}
function releaseMelted(gx,gy,R){
  var cx=gx*cellW, cy=gy*cellH, rr=R*Math.max(cellW,cellH)*1.15;
  var any=false;
  for(var b=0;b<captured.length;b++){
    var o=captured[b];
    if(!o.live)continue;
    var dx=o.x-cx,dy=o.y-cy;
    if(dx*dx+dy*dy>rr*rr)continue;
    var gxx=clamp(Math.floor(o.x/cellW),0,nx-1), gyy=clamp(Math.floor(o.y/cellH),0,ny-1);
    var i=gyy*nx+gxx;
    if(phi[i]<0.5){
      o.live=false; any=true;
      M[i]+=o.g*0.72;                 /* back into the melt, richer than it was */
      bden[i]=Math.max(0,bden[i]-o.r*o.r*0.35);
      risers.push({x:o.x,y:o.y,r:o.r,g:o.g*0.28,ph:Math.random()*6.28});
    }
  }
  if(any){
    recX.save();
    recX.globalCompositeOperation='destination-out';
    recX.beginPath(); recX.arc(cx,cy,rr,0,6.2832); recX.fillStyle='#000'; recX.fill();
    recX.restore();
    for(var k=0;k<captured.length;k++){
      var q=captured[k];
      if(!q.live)continue;
      var ddx=q.x-cx,ddy=q.y-cy;
      if(ddx*ddx+ddy*ddy<=rr*rr*1.02) drawBub(recX,q.x,q.y,q.r);
    }
  }
}

cvs.addEventListener('pointermove',onMove,{passive:false});
cvs.addEventListener('pointerdown',function(e){ if(e.cancelable)e.preventDefault(); pointerPos(e);
  pIn=true; pressed=true; lastMove=performance.now(); lastPX=pX; lastPY=pY; lastPT=lastMove;
  try{cvs.setPointerCapture(e.pointerId);}catch(err){} audioStart(); },{passive:false});
window.addEventListener('pointerup',function(){ pressed=false; });
window.addEventListener('pointercancel',function(){ pressed=false; });
cvs.addEventListener('pointerleave',function(){ pIn=false; pressed=false; });
cvs.addEventListener('pointerenter',function(){ pIn=true; });
window.addEventListener('keydown',audioStart);

/* ---------------------------------------------------------------- audio */
var A=null,master=null,noiseBuf=null,gurgle=null,gurgleG=null,gurgleTarget=0,humG=null;
var humOn=false,humNext=0,popNext=0,doorNext=0,tickBudget=0;
function audioStart(){
  if(A)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    A=new AC();
    master=A.createGain(); master.gain.value=0.9; master.connect(A.destination);
    var len=A.sampleRate*2, buf=A.createBuffer(1,len,A.sampleRate), d=buf.getChannelData(0);
    var last=0;
    for(var i=0;i<len;i++){ var wn=Math.random()*2-1; last=(last+0.02*wn)/1.02; d[i]=wn*0.55+last*3; }
    noiseBuf=buf;
    /* freezer hum */
    var o1=A.createOscillator(); o1.type='sawtooth'; o1.frequency.value=57.4;
    var o2=A.createOscillator(); o2.type='sine'; o2.frequency.value=114.8;
    var hf=A.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=190; hf.Q.value=0.7;
    humG=A.createGain(); humG.gain.value=0.0001;
    o1.connect(hf); o2.connect(hf); hf.connect(humG); humG.connect(master);
    o1.start(); o2.start();
    /* shed wall wind */
    var wsrc=A.createBufferSource(); wsrc.buffer=noiseBuf; wsrc.loop=true;
    var wf=A.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=420;
    var wg=A.createGain(); wg.gain.value=0.020;
    var lfo=A.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.055;
    var lg2=A.createGain(); lg2.gain.value=0.011;
    lfo.connect(lg2); lg2.connect(wg.gain); lfo.start();
    wsrc.connect(wf); wf.connect(wg); wg.connect(master); wsrc.start();
    /* melt gurgle */
    gurgle=A.createBufferSource(); gurgle.buffer=noiseBuf; gurgle.loop=true;
    var gf=A.createBiquadFilter(); gf.type='bandpass'; gf.frequency.value=290; gf.Q.value=1.4;
    gurgleG=A.createGain(); gurgleG.gain.value=0.0001;
    gurgle.connect(gf); gf.connect(gurgleG); gurgleG.connect(master); gurgle.start();
    humNext=A.currentTime+2.5; popNext=A.currentTime+16+Math.random()*20;
    doorNext=A.currentTime+70+Math.random()*90;
  }catch(e){ A=null; }
}
function tick(rp){
  if(!A||tickBudget<=0)return; tickBudget--;
  var t=A.currentTime+Math.random()*0.012;
  var f=clamp(6100-rp*760,780,6200);
  var s=A.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=0.8+Math.random()*0.5;
  var bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=9;
  var g=A.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(clamp(0.035+rp*0.006,0.01,0.075),t+0.0016);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.030);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.05);
}
function copperPop(){
  var t=A.currentTime;
  var s=A.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=1.4;
  var bp=A.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=1500+Math.random()*1300; bp.Q.value=15;
  var g=A.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.10,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.2);
  var o=A.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(2100+Math.random()*700,t);
  o.frequency.exponentialRampToValueAtTime(1500,t+0.14);
  var og=A.createGain(); og.gain.setValueAtTime(0.03,t);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  o.connect(og); og.connect(master); o.start(t); o.stop(t+0.17);
}
function carDoor(){
  var t=A.currentTime;
  for(var k=0;k<2;k++){
    var tt=t+k*0.16;
    var o=A.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(96,tt); o.frequency.exponentialRampToValueAtTime(54,tt+0.11);
    var g=A.createGain(); g.gain.setValueAtTime(0.0001,tt);
    g.gain.exponentialRampToValueAtTime(k?0.055:0.030,tt+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,tt+0.22);
    o.connect(g); g.connect(master); o.start(tt); o.stop(tt+0.25);
    var s=A.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=0.5;
    var lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
    var sg=A.createGain(); sg.gain.setValueAtTime(0.0001,tt);
    sg.gain.exponentialRampToValueAtTime(0.024,tt+0.004);
    sg.gain.exponentialRampToValueAtTime(0.0001,tt+0.09);
    s.connect(lp); lp.connect(sg); sg.connect(master); s.start(tt); s.stop(tt+0.12);
  }
}
function audioTick(){
  if(!A)return;
  var t=A.currentTime;
  if(t>humNext){
    humOn=!humOn;
    humG.gain.cancelScheduledValues(t);
    humG.gain.setValueAtTime(Math.max(0.0001,humG.gain.value),t);
    humG.gain.linearRampToValueAtTime(humOn?0.042:0.0001,t+1.3);
    humNext=t+(humOn?(58+Math.random()*30):(32+Math.random()*22));
    if(humOn){ var c=A.createOscillator(); c.type='square'; c.frequency.value=180;
      var cg=A.createGain(); cg.gain.setValueAtTime(0.02,t); cg.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
      c.connect(cg); cg.connect(master); c.start(t); c.stop(t+0.06); }
  }
  if(t>popNext){ copperPop(); popNext=t+18+Math.random()*34; }
  if(t>doorNext){ carDoor(); doorNext=t+95+Math.random()*120; }
  gurgleTarget*=0.90;
  gurgleG.gain.setTargetAtTime(Math.max(0.0002,gurgleTarget),t,0.14);
}

/* ---------------------------------------------------------------- loop */
function frame(ts){
  requestAnimationFrame(frame);
  if(!running)return;
  if(!lastT)lastT=ts;
  var dt=(ts-lastT)/1000; lastT=ts;
  if(dt>0.12)dt=0.12;
  simT+=dt;
  var subs=clamp(Math.round(dt*180),1,6);
  tickBudget=7;
  nucQ.length=0;
  applyHeat(subs);
  for(var s=0;s<subs;s++) substep();
  moveRisers(dt);
  for(var q=0;q<nucQ.length;q++) tick(nucQ[q]);
  if(!bigDone&&simT>12){ bigDone=true; if(A){ tickBudget=1; tick(11); } }
  audioTick();
  frames++;
  render(dt);
}

/* ---------------------------------------------------------------- boot */
function boot(){
  layout(); alloc(); lastT=0;
}
var rzT=null;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){
    var oldnx=nx,oldny=ny,oldcw=cw,oldch=ch;
    var oT=T,oP=phi,oM=M,oMi=Mice,oB=bden;
    layout();
    if(nx!==oldnx||ny!==oldny){
      var nT=new Float32Array(nx*ny),nP=new Float32Array(nx*ny),nM=new Float32Array(nx*ny),
          nMi=new Float32Array(nx*ny),nB=new Float32Array(nx*ny);
      for(var y=0;y<ny;y++)for(var x=0;x<nx;x++){
        var sx=Math.min(oldnx-1,Math.floor(x*oldnx/nx)), sy=Math.min(oldny-1,Math.floor(y*oldny/ny));
        var si=sy*oldnx+sx, di=y*nx+x;
        nT[di]=oT[si]; nP[di]=oP[si]; nM[di]=oM[si]; nMi[di]=oMi[si]; nB[di]=oB[si];
      }
      var keep={T:nT,phi:nP,M:nM,Mice:nMi,bden:nB};
      alloc();
      T.set(keep.T); phi.set(keep.phi); M.set(keep.M); Mice.set(keep.Mice); bden.set(keep.bden);
      for(var yy=ny-PLATE;yy<ny;yy++)for(var xx=0;xx<nx;xx++){var j=yy*nx+xx;T[j]=P.plateT;phi[j]=1;}
    }
    var kx=cw/oldcw, ky=ch/oldch;
    for(var b=0;b<captured.length;b++){ captured[b].x*=kx; captured[b].y*=ky; captured[b].r*=(kx+ky)/2; }
    for(var r=0;r<risers.length;r++){ risers[r].x*=kx; risers[r].y*=ky; }
  },220);
});
document.addEventListener('visibilitychange',function(){
  running=!document.hidden; lastT=0;
  if(A){ if(document.hidden){ try{A.suspend();}catch(e){} } else { try{A.resume();}catch(e){} } }
});
