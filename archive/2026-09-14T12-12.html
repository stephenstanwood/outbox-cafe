  <meta name="outbox-spec-era" content="Half past four on a warm September afternoon in 1962, inside a working kaleidoscope factory's test bench in Toledo, Ohio — not the toy, the OBJECT-CELL: a shallow glass ampoule two inches across being filled by hand from a tray of chipped mirror glass, bakelite offcuts, dyed cellophane and one screw, and held up against a north window so the filler can see how the tumble reads before the cell is sealed and cemented into a barrel.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — edge to edge, no chrome. The entire viewport is the inside of a three-mirror kaleidoscope barrel looked straight down, so the frame is one continuous hexagonal tiling of true mirror reflections, and at the middle of it sits the object-cell: forty to sixty loose fragments lying on a ground-glass disc, each with real mass, real shape, real thickness and real transparency. The reflection is genuinely computed — one primary wedge of real fragments, and every other wedge in frame is a true mirror image of it through an actual three-mirror system at an actual apex angle, so a fragment sliding through the seam between two mirrors is seen entering and leaving simultaneously and the symmetry is arithmetic, not a CSS rotate. The visitor's whole vocabulary is what a hand does at a filling bench: TILT the barrel by dragging, which is real gravity on real fragments that slide, stack, jam in a corner and refuse to move; TAP anywhere on the barrel wall with a click, which is a real impulse that unjams the stack; and PRESS AND HOLD on the ground glass to run the window light up and down, which changes how much comes through the transparent pieces versus how much bounces off the opaque ones. Nothing scrolls. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat optical and mechanical arithmetic of an object-cell, which is almost entirely a jamming problem and a light-budget problem and has nothing to do with pattern in the abstract. That a three-mirror system with 60-degree apex angles tiles the whole field and a two-mirror 60-degree system gives one isolated rosette on black, and the difference is a property of the barrel and not of what is in the cell. That the number of repeats is 360 divided by the apex angle and any angle that does not divide 360 evenly produces a seam that does not close — a visible mismatch line running down the field forever, which is why 36, 45 and 60 degrees are used and 50 is not. That FRAGMENT SIZE IS SET BY THE WEDGE AND NOT BY TASTE: a piece wider than the primary wedge is reflected into itself and reads as a smear rather than a shape, so the working limit is about a third of the wedge width and everything larger gets crushed. That the cell is a TUMBLER and its whole behaviour is packing density — under about forty percent fill the pieces slide freely and the pattern changes continuously and reads thin, over about seventy percent they bridge against the glass and lock, so a cell that is beautiful on the bench jams in a child's hand within a week, and the working number is around fifty-five percent. That MIXED THICKNESS IS THE ACTUAL FIX for jamming, because fragments of one thickness stack into a regular raft and bridge, and fragments of three different thicknesses cannot, which is why a good cell is deliberately made of the wrong things together. That the SHAPE distribution matters more than the colour distribution: long slivers align with the tilt and give the field its direction, equant chunks tumble and give it its unpredictability, and a cell of all slivers reads as combed hair and never surprises anybody. That LIGHT COMES FROM BEHIND AND NOT FROM THE FRONT — the ground glass diffuses the window and the transparent fragments are seen by transmission while the opaque ones are seen only as silhouettes, so an opaque fragment contributes shape and no colour at all, and a cell of all clear glass has no structure in it. That dyed cellophane transmits richly and blocks almost nothing, so three overlapping pieces multiply into a real dark, and the darks in any kaleidoscope are overlaps and not black objects. That FIRST-SURFACE MIRROR IS THE WHOLE DIFFERENCE and ordinary silvered glass is not acceptable, because a back-silvered mirror puts a faint second reflection off the front face a glass-thickness away, and after four or five bounces that ghost is a visible doubled edge on everything at the outside of the field. That REFLECTIVITY COMPOUNDS: at 92 percent per bounce, the wedge eight reflections out is at half brightness, so the field is genuinely darker toward its edges and no amount of light fixes it. That the mirrors are taped into a triangle with the tape on the outside and one wedge is always fractionally out of true, so one seam in every barrel is slightly open and shows a hairline of black. That the cell body is two watch-glass ampoules cemented rim to rim and the cement has to go on dry or it fogs the inside of the cell permanently. And the flat arithmetic on the bench: sixty barrels to fill by Friday, a tray of chipped glass that only gets finer as the week goes on, and a cell that will not come apart once the cement is on.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the glass, the tumble and the north light, and that register is HARD, CLICKY, GLITTERY, SLIGHTLY GRITTY and FRANKLY MECHANICAL — small pieces of real glass knocking on real glass at true pitch; a raft of fragments that jams with a dull stop rather than a graceful settle; a tilt that produces a whole slide at once and not a slow drift; dust already inside the cell that never comes out and shows against the ground glass; one hairline of black at a seam that never closes; and a field that is measurably dimmer at the outside than at the middle because reflectivity compounds and there is nothing to be done about it. It is a bright afternoon, the window is north and even, the work is fast and repetitive, and the cell is going to be cemented shut whether or not it reads well. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the pieces keep sliding when nobody is touching anything. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT magical, NOT reverent, NOT childlike — this is a test bench at half past four with sixty barrels due Friday.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and every colour in the field is COMPUTED and never chosen. The ground is diffused north window light through ground glass, a flat even cool white (#eceff0) that is the only light source in the piece and that falls off toward the frame edges by a real compounding reflectivity term — 92 percent per bounce, so the outer wedges genuinely render at half the brightness of the central one and the corners of the frame go a dull grey-green (#8d9691) with no way to raise them. Against that, EVERY FRAGMENT'S APPEARANCE IS THE OUTPUT OF ITS MATERIAL AND ITS STACK: each piece carries an actual transmission spectrum, an actual thickness and an actual opacity, and what the visitor sees is Beer–Lambert absorption through however many pieces happen to be overlapping at that point — so dyed cellophane alone reads a thin hot rose (#e4749b) or a thin chrome amber (#e2b23c), two overlapping read a real darkened crimson (#8e3a4c) or olive (#8a7126), and three overlapping read a genuine near-black with a colour cast in it (#2c2230), and nobody anywhere picks a dark. Broken mirror glass carries no colour at all and renders purely as silhouette with one hard specular edge where the fracture caught the light (#f6f8f8 on #2a2e2c). Bakelite offcuts are dense opaque and read as flat shape only: a butterscotch (#b98a2e), a marbled oxblood (#6d2a24), a dead green-black (#25302a). The bare screw is dull cadmium plate (#9aa09c) and is the only thing in the cell that is neither glass nor plastic. First-surface mirror seams render as one hairline of true black (#000000) at the one wedge that is out of true, and nowhere else. Exactly one chip of bench-crayon violet (#5b3f9c) is held strictly for the wax grease-mark on the outside of the barrel rim, visible as a smudge at the very edge of frame where the filler marked which apex angle this barrel is — it never appears inside the cell, never in a fragment, never in the light. Flat, hard, high contrast at the middle and honestly dim at the edges; no glow, no bloom, no lens flare, no soft focus, no rainbow sheen, no gradients other than honest absorption, honest compounding reflectivity and honest specular on fracture.">
  <meta name="outbox-spec-wildcard" content="One fragment in the cell is a fingernail-sized piece of a printed paper label — a scrap of a soup can wrapper that got into the tray off somebody's lunch — and it is completely opaque, so it never shows a single readable character. It renders only as a silhouette with a slightly furred edge where the paper tore, and it is measurably lighter than every other fragment in the cell, which means it rides on top of the pile instead of sinking into it and is almost always visible somewhere in the field. It cannot be removed, cannot be turned face up, cannot be fractured, and never becomes legible under any light setting. The engine treats it as an ordinary body with a real low mass and a real high drag, and flags nothing. Same scrap, same tear, same cell, every visit.">
  <meta name="outbox-spec-forbidden" content="NO kaleidoscope-as-metaphor for anything — not perspective, not how a life rearranges, not fragments making a whole, not beauty out of broken things, not 'the same pieces, a different picture'; this is a fill fraction and a compounding reflectivity term and it has nothing to teach anybody. ABSOLUTELY NO wonder, NO magic, NO enchantment, NO childhood, NO 'the first time you looked into one', NO toy nostalgia, NO Christmas-morning register, NO a-gift-for-a-sick-child sentiment, NO whimsy of any kind. NO symmetry mysticism: no mandala, no sacred geometry, no chakras, no meditation aid, no yantra, no the-universe-is-patterned, no fractal awe, no Golden Ratio, no 'nature does this too', no snowflake comparison. NO psychedelia: no trip, no acid, no sixties counterculture, no lava-lamp kitsch, no Summer of Love, no expanded consciousness, no Pink Floyd, no vaporwave, no synthwave, no VJ-set framing. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, chillout, ambient-visualiser, generative-art-gallery, music-visualiser, kinetic-sand or screensaver framing whatsoever, and no 'let it turn'. NO colour lyricism: no describing anything as jewelled, molten, glowing, blooming, singing, or falling like anything; colour here is transmission times thickness times overlap count. NO glass or light sensuousness beyond transmission, specular, fracture and falloff. NO broken-things sentiment, NO kintsugi, NO 'the chips are the point', NO repair-as-virtue, NO scrap-into-art register, NO found-object preciousness about the tray. NO craftsman-sage register, NO 'the old fillers could shake a cell and know', NO trade mystique, NO reverence for hand skill, NO artisan-versus-factory sermon, NO handmade lament, NO master-and-apprentice arc, NO Brewster-invented-it origin story, NO great-man narrative. NO nostalgia, NO wistfulness, NO 'nobody makes these anymore / plastic killed it / the last of the optical toy shops' decline narrative — sixty barrels are due Friday. NO Ohio or Rust Belt travelogue and NO explaining the Midwest to anybody: no deindustrialisation, no glass-town heritage, no Libbey-Owens history, no factory-labour dignity sermon, no union framing, no immigrant-sacrifice arc, no poverty pathos, no aren't-they-hardworking condescension. NO 1962-as-period-signifier: no Cuban Missile Crisis, no Cold War drift, no Kennedy, no space race, no Mad Men, no mid-century-modern kitsch, no camp, no ironic affection for bakelite, cellophane or cardboard barrels. NO optics-as-wonder, NO teaching voice, NO explainer, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the open seam, the dust that never comes out, the fragments that only ever break smaller, or the cell that cannot be opened — nothing here is wrong. NO archival / museum / cabinet / drawer / specimen / collection / relic framing of the cell or the tray whatsoever, despite it being a container of sorted small objects — the tray was filled this morning and this cell is going under the cement press before the shift ends. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is half past four on a bright afternoon with a north window full of even light. NO signal / transmission / frequency / broadcast framing, despite the piece being entirely about light passing through things. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the mirrors, the fragments, the ground glass and the one violet crayon mark at the rim, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!--
  tray this morning: chipped first-surface offcuts, bakelite crumb, dyed cello, one 6-32 pan head.
  the fingernail of printed paper came off the wrapper of somebody's Chef Pinder's Own —
  twenty-five minutes, whole hot supper — and it will not come out of the tray now, so in it goes.
  apex 60. six around the vertex. one joint taped 0.4 out of true and it stays that way.
-->

<body>
<canvas id="field"></canvas>
<a id="rimmark" href="/archive" aria-label="the rest of the bench"></a>
<script>
(function(){
"use strict";

/* ============================ tiny deterministic rng ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============================ storage ============================ */
var KEY="objcell.toledo.v1";
var store=null;
try{ store=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ store=null; }

var SEED, BAD_EDGE, ERR_RAD, DUSTN, TUMBLE_MS, LIGHT;
if(store && store.v===1){
  SEED=store.seed; BAD_EDGE=store.bad; ERR_RAD=store.err;
  DUSTN=store.dust; TUMBLE_MS=store.tms||0; LIGHT=store.light||0.98;
}else{
  SEED=(Math.random()*4294967295)>>>0;
  var r0=mulberry32(SEED);
  BAD_EDGE=Math.floor(r0()*3);
  ERR_RAD=(0.34+r0()*0.14)*Math.PI/180;   /* the taped joint */
  DUSTN=196+Math.floor(r0()*14);
  TUMBLE_MS=0; LIGHT=0.98;
}

/* the other barrel on the bench. back-silvered stock, ghost a glass-thickness out.
   it is stored and it is never rendered. */
var BARREL_2={ apex:45, firstSurface:false, ghostMM:2.1, taped:true, filled:false };

/* ============================ geometry constants ============================ */
var S3=Math.sqrt(3), H3=S3/2;
var MTRI=[[0,-1],[-H3,0.5],[H3,0.5]];      /* mirror triangle, circumradius 1 */
var WALLR=1.15;                              /* physical cell wall triangle */
var WTRI=MTRI.map(function(p){return [p[0]*WALLR,p[1]*WALLR];});
var WALLS=(function(){
  var w=[];
  for(var i=0;i<3;i++){
    var p=WTRI[i], q=WTRI[(i+1)%3];
    var dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy);
    dx/=L; dy/=L;
    var nx=-dy, ny=dx;                      /* pick inward */
    if(nx*(-p[0])+ny*(-p[1])<0){ nx=-nx; ny=-ny; }
    w.push({px:p[0],py:p[1],nx:nx,ny:ny,mx:(p[0]+q[0])/2,my:(p[1]+q[1])/2});
  }
  return w;
})();
var PAD=0.014;

/* ============================ materials ============================ */
/* transmission is per unit reference thickness 0.030; opaque carries silhouette colour only */
var MAT={
  cRose  :{t:1,T:[0.965,0.490,0.655],th:0.030,dn:0.32,fr:0.66,re:0.05,br:false,w:1.15},
  cAmber :{t:1,T:[0.955,0.755,0.255],th:0.030,dn:0.32,fr:0.66,re:0.05,br:false,w:1.05},
  cTeal  :{t:1,T:[0.430,0.870,0.815],th:0.030,dn:0.32,fr:0.66,re:0.05,br:false,w:0.70},
  gSmoke :{t:1,T:[0.660,0.560,0.535],th:0.072,dn:2.50,fr:0.48,re:0.16,br:true ,w:0.95},
  gClear :{t:1,T:[0.972,0.985,0.990],th:0.062,dn:2.50,fr:0.46,re:0.18,br:true ,w:0.62},
  gMirror:{t:0,C:[42,46,44],spec:1   ,th:0.052,dn:2.50,fr:0.44,re:0.19,br:true ,w:1.30},
  bButter:{t:0,C:[185,138,46]        ,th:0.112,dn:1.36,fr:0.58,re:0.10,br:false,w:0.72},
  bOx    :{t:0,C:[109,42,36]         ,th:0.128,dn:1.36,fr:0.58,re:0.10,br:false,w:0.60},
  bGreen :{t:0,C:[37,48,42]          ,th:0.094,dn:1.36,fr:0.58,re:0.10,br:false,w:0.55},
  screw  :{t:0,C:[154,160,156]       ,th:0.160,dn:7.80,fr:0.40,re:0.12,br:false,w:0},
  paper  :{t:0,C:[52,47,41],fur:1    ,th:0.011,dn:0.10,fr:0.80,re:0.02,br:false,w:0,drag:2.4}
};
var POOL=[]; for(var k in MAT){ if(MAT[k].w>0){ for(var q=0;q<Math.round(MAT[k].w*20);q++) POOL.push(k); } }

/* ============================ polygon helpers ============================ */
function hull(pts){
  pts=pts.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});
  function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var lo=[],i;
  for(i=0;i<pts.length;i++){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],pts[i])<=0)lo.pop(); lo.push(pts[i]); }
  var up=[];
  for(i=pts.length-1;i>=0;i--){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],pts[i])<=0)up.pop(); up.push(pts[i]); }
  lo.pop(); up.pop();
  return lo.concat(up);
}
function polyArea(v){var a=0;for(var i=0;i<v.length;i++){var j=(i+1)%v.length;a+=v[i][0]*v[j][1]-v[j][0]*v[i][1];}return a/2;}
function polyProps(v){
  var a=0,cx=0,cy=0,I=0;
  for(var i=0;i<v.length;i++){
    var j=(i+1)%v.length, x0=v[i][0],y0=v[i][1],x1=v[j][0],y1=v[j][1];
    var cr=x0*y1-x1*y0;
    a+=cr; cx+=(x0+x1)*cr; cy+=(y0+y1)*cr;
    I+=cr*(x0*x0+x0*x1+x1*x1+y0*y0+y0*y1+y1*y1);
  }
  a/=2; cx/=(6*a); cy/=(6*a); I/=12;
  return {area:Math.abs(a),cx:cx,cy:cy,I:Math.abs(I)};
}

/* ============================ body ============================ */
var BID=1;
function Body(mkey,verts,x,y,ang){
  this.m=mkey; var mat=MAT[mkey];
  var p=polyProps(verts);
  this.v=verts.map(function(q){return [q[0]-p.cx,q[1]-p.cy];});
  var p2=polyProps(this.v);
  this.area=p2.area;
  this.th=mat.th;
  this.mass=p2.area*mat.th*mat.dn;
  this.inertia=p2.I*mat.th*mat.dn - this.mass*0; /* about centroid */
  if(this.inertia<=0) this.inertia=this.mass*0.01;
  this.invM=1/this.mass; this.invI=1/this.inertia;
  this.x=x; this.y=y; this.a=ang;
  this.vx=0; this.vy=0; this.w=0;
  this.fr=mat.fr; this.re=mat.re; this.br=mat.br;
  this.drag=mat.drag||0;
  this.rad=0; for(var i=0;i<this.v.length;i++){var d=Math.hypot(this.v[i][0],this.v[i][1]); if(d>this.rad)this.rad=d;}
  this.sortKey=mat.dn*mat.th;
  this.wv=new Array(this.v.length); for(i=0;i<this.v.length;i++) this.wv[i]=[0,0];
  this.id=BID++;
  this.fur=(SEED^ (this.id*2654435761))>>>0;
  this.sync();
}
Body.prototype.sync=function(){
  var c=Math.cos(this.a), s=Math.sin(this.a);
  for(var i=0;i<this.v.length;i++){
    var x=this.v[i][0],y=this.v[i][1];
    this.wv[i][0]=this.x+c*x-s*y;
    this.wv[i][1]=this.y+s*x+c*y;
  }
};

/* ============================ cell generation ============================ */
var bodies=[];
function randConvex(rnd,size,aspect,rot){
  var n=4+Math.floor(rnd()*3), pts=[];
  for(var i=0;i<n;i++){
    var th=rnd()*Math.PI*2, rr=0.45+rnd()*0.55;
    var x=Math.cos(th)*rr*size, y=Math.sin(th)*rr*size/aspect;
    var c=Math.cos(rot),s=Math.sin(rot);
    pts.push([c*x-s*y, s*x+c*y]);
  }
  var h=hull(pts);
  if(h.length<3) return randConvex(rnd,size,aspect,rot);
  return h;
}
function insideWall(x,y,margin){
  for(var i=0;i<3;i++){ var w=WALLS[i]; if((x-w.px)*w.nx+(y-w.py)*w.ny < margin) return false; }
  return true;
}
function buildCell(){
  var rnd=mulberry32(SEED^0x9e3779b9);
  bodies=[];
  var wallArea=Math.abs(polyArea(WTRI));
  var target=0.55*wallArea;            /* fill fraction. never stated, only obeyed. */
  var acc=0, guard=0;
  while(acc<target && bodies.length<58 && guard++<4000){
    var mk=POOL[Math.floor(rnd()*POOL.length)];
    var sliver=rnd()<0.42;
    var size=0.055+rnd()*0.145;
    var aspect=sliver?(2.6+rnd()*2.4):(1.0+rnd()*0.5);
    var verts=randConvex(rnd,size,aspect,rnd()*Math.PI*2);
    var x,y,tries=0;
    do{ x=(rnd()*2-1)*0.9; y=(rnd()*2-1)*0.9; tries++; }while(!insideWall(x,y,0.14)&&tries<80);
    var b=new Body(mk,verts,x,y,rnd()*Math.PI*2);
    bodies.push(b); acc+=b.area;
  }
  /* the one screw */
  var sv=[[-0.115,-0.020],[0.085,-0.028],[0.128,-0.011],[0.128,0.011],[0.085,0.028],[-0.115,0.020]];
  bodies.push(new Body("screw",sv,0.1,0.05,rnd()*6.28));
  /* the fingernail of printed wrapper. same tear, same cell, every visit. */
  var pr=mulberry32(0x50415045);
  var pv=[]; for(var i=0;i<7;i++){ var th=i/7*6.283, rr=0.070*(0.72+pr()*0.5); pv.push([Math.cos(th)*rr*1.25,Math.sin(th)*rr*0.86]); }
  bodies.push(new Body("paper",hull(pv),-0.15,-0.2,pr()*6.28));
}

function serialize(){
  return JSON.stringify({

/* ============================ dust ============================ */
var dust=[];
function buildDust(){
  dust.length=0;
  var rnd=mulberry32(SEED^0x1d1d1d);
  var made=0,guard=0;
  while(made<DUSTN&&guard++<20000){
    var x=(rnd()*2-1)*1.0, y=(rnd()*1.6-1.05);
    var ok=true;
    for(var i=0;i<3;i++){ var p=MTRI[i],q2=MTRI[(i+1)%3];
      var ex=q2[0]-p[0],ey=q2[1]-p[1];
      if((x-p[0])*ey-(y-p[1])*ex>0){ok=false;break;}
    }
    if(!ok) continue;
    dust.push([x,y,0.0022+rnd()*0.0042,0.30+rnd()*0.45]);
    made++;
  }
}
buildDust();

/* ============================ contacts + solver ============================ */
var contacts=[];
var clickEvents=[];
var slideEnergy=0;

function poly_sat(A,B){
  var best=-1e9,bestAxis=null,refA=null;
  function test(P,Q,flip){
    for(var i=0;i<P.wv.length;i++){
      var j=(i+1)%P.wv.length;
      var ex=P.wv[j][0]-P.wv[i][0], ey=P.wv[j][1]-P.wv[i][1];
      var L=Math.hypot(ex,ey); if(L<1e-9) continue;
      var nx=ey/L, ny=-ex/L;
      var maxP=-1e9; for(var a=0;a<P.wv.length;a++){var d=P.wv[a][0]*nx+P.wv[a][1]*ny; if(d>maxP)maxP=d;}
      var minQ=1e9; for(var b=0;b<Q.wv.length;b++){var d2=Q.wv[b][0]*nx+Q.wv[b][1]*ny; if(d2<minQ)minQ=d2;}
      var sep=minQ-maxP;
      if(sep>0) return false;
      if(sep>best){ best=sep; bestAxis={nx:nx,ny:ny,i:i,flip:flip}; refA=P; }
    }
    return true;
  }
  if(!test(A,B,false)) return null;
  if(!test(B,A,true)) return null;
  var ref = bestAxis.flip?B:A, inc = bestAxis.flip?A:B;
  var nx=bestAxis.nx, ny=bestAxis.ny;
  /* incident face: most anti-parallel */
  var bi=0,bd=1e9;
  for(var i=0;i<inc.wv.length;i++){
    var j=(i+1)%inc.wv.length;
    var ex=inc.wv[j][0]-inc.wv[i][0], ey=inc.wv[j][1]-inc.wv[i][1];
    var L=Math.hypot(ex,ey); if(L<1e-9)continue;
    var d=(ey/L)*nx+(-ex/L)*ny;
    if(d<bd){bd=d;bi=i;}
  }
  var p0=inc.wv[bi], p1=inc.wv[(bi+1)%inc.wv.length];
  var r0=ref.wv[bestAxis.i], r1=ref.wv[(bestAxis.i+1)%ref.wv.length];
  var tx=r1[0]-r0[0], ty=r1[1]-r0[1], tl=Math.hypot(tx,ty); if(tl<1e-9) return null;
  tx/=tl; ty/=tl;
  var pts=clipSeg(p0,p1,tx,ty,r0[0]*tx+r0[1]*ty,1);
  if(!pts) return null;
  pts=clipSeg(pts[0],pts[1],-tx,-ty,-(r1[0]*tx+r1[1]*ty),1);
  if(!pts) return null;
  var out=[];
  var refD=r0[0]*nx+r0[1]*ny;
  for(var m=0;m<2;m++){
    var dep=refD-(pts[m][0]*nx+pts[m][1]*ny);
    if(dep>-1e-5) out.push({x:pts[m][0],y:pts[m][1],d:Math.max(0,dep)});
  }
  if(!out.length) return null;
  /* normal must push A away from B */
  var sgn = bestAxis.flip? -1:1;
  return {nx:nx*sgn,ny:ny*sgn,pts:out};
}
function clipSeg(p0,p1,tx,ty,off,keep){
  var d0=(p0[0]*tx+p0[1]*ty)-off, d1=(p1[0]*tx+p1[1]*ty)-off;
  var o0=d0>=0,o1=d1>=0;
  if(o0&&o1) return [p0,p1];
  if(!o0&&!o1) return null;
  var t=d0/(d0-d1);
  var ip=[p0[0]+(p1[0]-p0[0])*t, p0[1]+(p1[1]-p0[1])*t];
  return o0?[p0,ip]:[ip,p1];
}

function collectContacts(){
  contacts.length=0;
  var i,j,b;
  /* walls */
  for(i=0;i<bodies.length;i++){
    b=bodies[i];
    for(var wi=0;wi<3;wi++){
      var w=WALLS[wi];
      for(var vi=0;vi<b.wv.length;vi++){
        var d=(b.wv[vi][0]-w.px)*w.nx+(b.wv[vi][1]-w.py)*w.ny;
        if(d<0) pushContact(b,null,w.nx,w.ny,b.wv[vi][0],b.wv[vi][1],-d);
      }
    }
  }
  /* pairs */
  for(i=0;i<bodies.length;i++){
    var A=bodies[i];
    for(j=i+1;j<bodies.length;j++){
      var B=bodies[j];
      var dx=B.x-A.x, dy=B.y-A.y, rr=A.rad+B.rad;
      if(dx*dx+dy*dy>rr*rr) continue;
      var mf=poly_sat(A,B);
      if(!mf) continue;
      for(var m=0;m<mf.pts.length;m++)
        pushContact(A,B,mf.nx,mf.ny,mf.pts[m].x,mf.pts[m].y,mf.pts[m].d);
    }
  }
}
function pushContact(A,B,nx,ny,px,py,dep){
  var rax=px-A.x, ray=py-A.y;
  var rbx=B?px-B.x:0, rby=B?py-B.y:0;
  var rvx=A.vx-A.w*ray-(B?B.vx-B.w*rby:0);
  var rvy=A.vy+A.w*rax-(B?B.vy+B.w*rbx:0);
  var vn=rvx*nx+rvy*ny;
  var mu=Math.sqrt(A.fr*(B?B.fr:0.52));
  var re=(vn<-0.55)?Math.min(A.re,B?B.re:0.16):0;
  var kn=A.invM+(B?B.invM:0)+(rax*ny-ray*nx)*(rax*ny-ray*nx)*A.invI+(B?(rbx*ny-rby*nx)*(rbx*ny-rby*nx)*B.invI:0);
  var tx=-ny,ty=nx;
  var kt=A.invM+(B?B.invM:0)+(rax*ty-ray*tx)*(rax*ty-ray*tx)*A.invI+(B?(rbx*ty-rby*tx)*(rbx*ty-rby*tx)*B.invI:0);
  contacts.push({A:A,B:B,nx:nx,ny:ny,tx:tx,ty:ty,rax:rax,ray:ray,rbx:rbx,rby:rby,
    d:dep,cn:0,ct:0,mu:mu,re:re,kn:kn>1e-12?kn:1e-12,kt:kt>1e-12?kt:1e-12,vn0:vn});
  if(vn<-0.34){
    var lighter=B?(A.mass<B.mass?A:B):A;
    if(clickEvents.length<9) clickEvents.push({m:lighter.mass,th:lighter.th,mat:lighter.m,v:Math.min(4.2,-vn)});
    if((lighter.br)&&(-vn)>3.0&&lighter.area>0.0062&&bodies.length<106) lighter._frac=Math.max(lighter._frac||0,-vn);
  }else if(vn<-0.02&&vn>-0.34){
    slideEnergy+=Math.abs(rvx*tx+rvy*ty)*0.5;
  }
}
function solve(dt,iters){
  var slop=0.0012, beta=0.20;
  for(var it=0;it<iters;it++){
    for(var i=0;i<contacts.length;i++){
      var c=contacts[i],A=c.A,B=c.B;
      var rvx=A.vx-A.w*c.ray-(B?B.vx-B.w*c.rby:0);
      var rvy=A.vy+A.w*c.rax-(B?B.vy+B.w*c.rbx:0);
      var vn=rvx*c.nx+rvy*c.ny;
      var bias=(beta/dt)*Math.max(0,c.d-slop);
      var lam=-(vn - bias + c.re*c.vn0)/c.kn;
      var n0=c.cn; c.cn=Math.max(0,c.cn+lam); var dn=c.cn-n0;
      applyImp(A,B,c,c.nx*dn,c.ny*dn);
      rvx=A.vx-A.w*c.ray-(B?B.vx-B.w*c.rby:0);
      rvy=A.vy+A.w*c.rax-(B?B.vy+B.w*c.rbx:0);
      var vt=rvx*c.tx+rvy*c.ty;
      var lt=-vt/c.kt, mx=c.mu*c.cn;
      var t0=c.ct; c.ct=Math.max(-mx,Math.min(mx,c.ct+lt)); var dtI=c.ct-t0;
      applyImp(A,B,c,c.tx*dtI,c.ty*dtI);
    }
  }
}
function applyImp(A,B,c,px,py){
  A.vx+=px*A.invM; A.vy+=py*A.invM; A.w+=(c.rax*py-c.ray*px)*A.invI;
  if(B){ B.vx-=px*B.invM; B.vy-=py*B.invM; B.w-=(c.rbx*py-c.rby*px)*B.invI; }
}

/* ============================ fracture ============================ */
var fracEvents=[];
function tryFracture(){
  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];
    if(!b._frac) continue;
    var mag=b._frac; b._frac=0;
    if(!b.br||b.area<0.0062||bodies.length>=106) continue;
    if(Math.random()>Math.min(0.55,(mag-3.0)*0.30)) continue;
    var ang=Math.random()*Math.PI;
    var nx=Math.cos(ang), ny=Math.sin(ang);
    var L=[],R=[];
    var vs=b.v, n=vs.length;
    for(var j=0;j<n;j++){
      var p=vs[j], q=vs[(j+1)%n];
      var dp=p[0]*nx+p[1]*ny, dq=q[0]*nx+q[1]*ny;
      if(dp>=0)L.push(p); else R.push(p);
      if((dp>0)!==(dq>0)){
        var t=dp/(dp-dq);
        var ip=[p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
        L.push(ip); R.push(ip);
      }
    }
    if(L.length<3||R.length<3) continue;
    var la=Math.abs(polyArea(L)), ra=Math.abs(polyArea(R));
    if(la<0.0016||ra<0.0016) continue;
    var ca=Math.cos(b.a), sa=Math.sin(b.a);
    function toW(v){ return v.map(function(p){return [b.x+ca*p[0]-sa*p[1], b.y+sa*p[0]+ca*p[1]];}); }
    var b1=new Body(b.m,toW(L),0,0,0), b2=new Body(b.m,toW(R),0,0,0);
    /* re-seat: Body recenters to its own centroid, so restore world centroids */
    var p1=polyProps(toW(L)), p2=polyProps(toW(R));
    b1.x=p1.cx; b1.y=p1.cy; b2.x=p2.cx; b2.y=p2.cy; b1.sync(); b2.sync();
    b1.vx=b.vx-nx*0.18; b1.vy=b.vy-ny*0.18; b1.w=b.w+ (Math.random()-0.5)*3;
    b2.vx=b.vx+nx*0.18; b2.vy=b.vy+ny*0.18; b2.w=b.w- (Math.random()-0.5)*3;
    bodies.splice(i,1,b1,b2);
    DUSTN+=2+Math.floor(Math.random()*3); buildDust();
    fracEvents.push({m:b.mass,th:b.th});
    save();
    break;
  }
}

/* ============================ canvas / tiling ============================ */
var cv=document.getElementById("field"), ctx=cv.getContext("2d");
var tile=document.createElement("canvas"), tctx=tile.getContext("2d");
var tiles=[], W=0,H=0,DPR=1,Rpx=100,CX=0,CY=0;
var copies=[];

function buildTiling(){
  var R=[];
  for(var i=0;i<3;i++){
    var p=MTRI[i], q=MTRI[(i+1)%3];
    var dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy); dx/=L; dy/=L;
    if(i===BAD_EDGE){ var c=Math.cos(ERR_RAD),s=Math.sin(ERR_RAD); var ndx=dx*c-dy*s, ndy=dx*s+dy*c; dx=ndx; dy=ndy; }
    var a=2*dx*dx-1, b=2*dx*dy, cc=2*dx*dy, d=2*dy*dy-1;
    R.push({a:a,b:b,c:cc,d:d,e:p[0]-(a*p[0]+cc*p[1]),f:p[1]-(b*p[0]+d*p[1])});
  }
  function comp(M,N){
    return {a:M.a*N.a+M.c*N.b, b:M.b*N.a+M.d*N.b,
            c:M.a*N.c+M.c*N.d, d:M.b*N.c+M.d*N.d,
            e:M.a*N.e+M.c*N.f+M.e, f:M.b*N.e+M.d*N.f+M.f};
  }
  var maxR=(Math.hypot(W,H)/2)/Rpx+1.35;
  var seen={}, out=[], queue=[{M:{a:1,b:0,c:0,d:1,e:0,f:0},n:0}];
  seen["0,0"]=1;
  var guard=0;
  while(queue.length&&out.length<520&&guard++<6000){
    var cur=queue.shift();
    out.push(cur);
    if(cur.n>=17) continue;
    for(var i2=0;i2<3;i2++){
      var M2=comp(cur.M,R[i2]);
      var dist=Math.hypot(M2.e,M2.f);
      if(dist>maxR) continue;
      var key=Math.round(M2.e/0.25)+","+Math.round(M2.f/0.25);
      if(seen[key]) continue;
      seen[key]=1;
      queue.push({M:M2,n:cur.n+1});
    }
  }
  out.sort(function(a,b){return b.n-a.n;});
  copies=out;
}

  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  CX=W/2; CY=H/2;
  var m=Math.min(W,H);
  Rpx = m<520 ? m/4.25 : m/5.15;
  var tw=Math.ceil((S3+2*PAD)*Rpx*DPR), th=Math.ceil((1.5+2*PAD)*Rpx*DPR);
  tile.width=tw; tile.height=th;
  tiles=[];
  buildTiling();
}

/* ============================ tile rendering ============================ */
var expTri=MTRI.map(function(p){ var s=1+PAD*0.92/0.5; return [p[0]*s,p[1]*s]; });

function setTileTransform(){
  var S=Rpx*DPR;
  tctx.setTransform(S,0,0,S,(H3+PAD)*S,(1+PAD)*S);
}
function pathPoly(c,v){
  c.beginPath(); c.moveTo(v[0][0],v[0][1]);
  for(var i=1;i<v.length;i++) c.lineTo(v[i][0],v[i][1]);
  c.closePath();
}
function chan(x){ return Math.max(0,Math.min(255,Math.round(x))); }

function drawTile(L){
  tctx.setTransform(1,0,0,1,0,0);
  tctx.clearRect(0,0,tile.width,tile.height);
  setTileTransform();
  tctx.save();
  pathPoly(tctx,expTri); tctx.clip();

  /* ground glass: the only illuminant */
  var Lg=Math.min(1,L);
  tctx.globalCompositeOperation="source-over";
  tctx.fillStyle="rgb("+chan(236*Lg)+","+chan(239*Lg)+","+chan(240*Lg)+")";
  tctx.fillRect(-2,-2,4,4);

  /* dust, resting on the glass, in every wedge */
  for(var i=0;i<dust.length;i++){
    var d=dust[i];
    tctx.fillStyle="rgba(34,39,36,"+(d[3]*(0.30+0.55*Lg)).toFixed(3)+")";
    tctx.fillRect(d[0]-d[2],d[1]-d[2],d[2]*2,d[2]*2);
  }

  /* fragments: heaviest first (they sit lower in the pile), paper last */
  var order=bodies.slice().sort(function(a,b){return a.sortKey-b.sortKey;});
  /* heavy under light -> draw heavy first */
  order.reverse();
  for(var bi=0;bi<order.length;bi++){
    var b=order[bi], mat=MAT[b.m];
    var v=b.wv;
    if(mat.t===1){
      var ex=b.th/0.030;
      var r=Math.pow(mat.T[0],ex), g2=Math.pow(mat.T[1],ex), bl=Math.pow(mat.T[2],ex);
      tctx.globalCompositeOperation="multiply";
      tctx.fillStyle="rgb("+chan(r*255)+","+chan(g2*255)+","+chan(bl*255)+")";
      pathPoly(tctx,v); tctx.fill();
      /* one hard fracture edge where a cut face catches the diffuser */
      if(Lg>0.5){
        tctx.globalCompositeOperation="lighter";
        var li=longestEdge(v);
        tctx.strokeStyle="rgba(246,248,248,"+((Lg-0.5)*0.34).toFixed(3)+")";
        tctx.lineWidth=0.004;
        tctx.beginPath(); tctx.moveTo(v[li][0],v[li][1]); tctx.lineTo(v[(li+1)%v.length][0],v[(li+1)%v.length][1]); tctx.stroke();
      }
    }else{
      tctx.globalCompositeOperation="source-over";
      var c=mat.C;
      tctx.fillStyle="rgb("+chan(c[0]*Lg)+","+chan(c[1]*Lg)+","+chan(c[2]*Lg)+")";
      pathPoly(tctx,v); tctx.fill();
      if(mat.fur) drawFur(b,Lg);
      if(mat.spec&&Lg>0.25){
        tctx.globalCompositeOperation="lighter";
        var li2=longestEdge(v);
        var p0=v[li2], p1=v[(li2+1)%v.length];
        tctx.strokeStyle="rgba(246,248,248,"+(0.30+0.62*Lg).toFixed(3)+")";
        tctx.lineWidth=0.0055;
        tctx.beginPath(); tctx.moveTo(p0[0],p0[1]); tctx.lineTo(p1[0],p1[1]); tctx.stroke();
      }
      if(b.m==="screw"){
        tctx.globalCompositeOperation="source-over";
        tctx.strokeStyle="rgba(24,28,26,"+(0.45*Lg+0.2).toFixed(3)+")";
        tctx.lineWidth=0.0042;
        var ca=Math.cos(b.a),sa=Math.sin(b.a);
        for(var t2=-0.10;t2<0.11;t2+=0.0185){
          var ax=t2,ay=-0.019, bx=t2+0.009,by=0.019;
          tctx.beginPath();
          tctx.moveTo(b.x+ca*ax-sa*ay,b.y+sa*ax+ca*ay);
          tctx.lineTo(b.x+ca*bx-sa*by,b.y+sa*bx+ca*by);
          tctx.stroke();
        }
      }
    }
  }
  /* veiling scatter in the diffuser when the window is run up hard */
  if(L>1){
    tctx.globalCompositeOperation="lighter";
    tctx.fillStyle="rgba(236,239,240,"+Math.min(0.62,(L-1)*0.80).toFixed(3)+")";
    tctx.fillRect(-2,-2,4,4);
  }
  tctx.globalCompositeOperation="source-over";
  tctx.restore();
}
function longestEdge(v){
  var bi=0,bd=-1;
  for(var i=0;i<v.length;i++){
    var j=(i+1)%v.length;
    var d=(v[j][0]-v[i][0])*(v[j][0]-v[i][0])+(v[j][1]-v[i][1])*(v[j][1]-v[i][1]);
    if(d>bd){bd=d;bi=i;}
  }
  return bi;
}
function drawFur(b,Lg){
  var v=b.wv, rnd=mulberry32(b.fur);
  tctx.globalCompositeOperation="source-over";
  var c=MAT.paper.C;
  tctx.fillStyle="rgba("+chan(c[0]*Lg)+","+chan(c[1]*Lg)+","+chan(c[2]*Lg)+",0.72)";
  for(var i=0;i<v.length;i++){
    var j=(i+1)%v.length;
    var ex=v[j][0]-v[i][0], ey=v[j][1]-v[i][1], L=Math.hypot(ex,ey);
    var n=Math.max(3,Math.floor(L/0.006));
    for(var k2=0;k2<n;k2++){
      var t=k2/n;
      var px=v[i][0]+ex*t, py=v[i][1]+ey*t;
      var jx=(rnd()-0.5)*0.011, jy=(rnd()-0.5)*0.011;
      var s=0.0018+rnd()*0.0026;
      tctx.fillRect(px+jx-s/2,py+jy-s/2,s,s);
    }
  }
}

function getTile(n){
  if(tiles[n]) return tiles[n];
  var c=document.createElement("canvas");
  c.width=tile.width; c.height=tile.height;
  tiles[n]=c;
  return c;
}
function makeLevels(used){
  for(var idx=0;idx<used.length;idx++){
    var n=used[idx];
    var c=getTile(n), cc=c.getContext("2d");
    cc.setTransform(1,0,0,1,0,0);
    cc.globalCompositeOperation="source-over";
    cc.clearRect(0,0,c.width,c.height);
    cc.drawImage(tile,0,0);
    if(n>0){
      var att=Math.max(0.30,Math.pow(0.92,n));
      cc.globalCompositeOperation="multiply";
      cc.fillStyle="rgb("+chan(att*255*0.985)+","+chan(att*255)+","+chan(att*255*0.972)+")";
      cc.fillRect(0,0,c.width,c.height);
      cc.globalCompositeOperation="destination-in";
      cc.drawImage(tile,0,0);
      cc.globalCompositeOperation="source-over";
    }
  }
}

function render(){
  drawTile(LIGHT);
  var usedSet={},used=[];
  for(var i=0;i<copies.length;i++){ if(!usedSet[copies[i].n]){usedSet[copies[i].n]=1; used.push(copies[i].n);} }
  makeLevels(used);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,cv.width,cv.height);
  var tw=S3+2*PAD, th=1.5+2*PAD, ox=-(H3+PAD), oy=-(1+PAD);
  for(i=0;i<copies.length;i++){
    var cp=copies[i], M=cp.M;
    ctx.setTransform(DPR*Rpx*M.a, DPR*Rpx*M.b, DPR*Rpx*M.c, DPR*Rpx*M.d,
                     DPR*(CX+Rpx*M.e), DPR*(CY+Rpx*M.f));
    ctx.drawImage(tiles[cp.n], ox, oy, tw, th);
  }
  ctx.setTransform(1,0,0,1,0,0);
}

/* ============================ audio ============================ */
var AC=null, master=null, noiseBuf=null, slitherGain=null, slitherFilt=null, started=false;
function mkNoise(ac,sec,brown){
  var len=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
  var last=0;
  for(var i=0;i<len;i++){
    var w=Math.random()*2-1;
    if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.2; } else d[i]=w;
  }
  return b;
}
function startAudio(){
  if(started) return; started=true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  if(AC.state==="suspended") AC.resume();
  noiseBuf=mkNoise(AC,2.0,false);
  var brown=mkNoise(AC,3.0,true);

  master=AC.createGain(); master.gain.value=0.62;
  /* cardboard barrel: a short comb at the tube's true length, plus its body resonance */
  var dry=AC.createGain(); dry.gain.value=0.80;
  var comb=AC.createDelay(0.05); comb.delayTime.value=1/548;
  var fb=AC.createGain(); fb.gain.value=0.42;
  comb.connect(fb); fb.connect(comb);
  var combG=AC.createGain(); combG.gain.value=0.30;
  var body=AC.createBiquadFilter(); body.type="peaking"; body.frequency.value=286; body.Q.value=1.6; body.gain.value=4.5;
  var hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=90;
  master.connect(dry); master.connect(comb); comb.connect(combG);
  dry.connect(body); combG.connect(body); body.connect(hp); hp.connect(AC.destination);

  /* dry slither of many pieces moving together */
  var sl=AC.createBufferSource(); sl.buffer=noiseBuf; sl.loop=true;
  slitherFilt=AC.createBiquadFilter(); slitherFilt.type="bandpass"; slitherFilt.frequency.value=1200; slitherFilt.Q.value=1.1;
  slitherGain=AC.createGain(); slitherGain.gain.value=0;
  sl.connect(slitherFilt); slitherFilt.connect(slitherGain); slitherGain.connect(master);
  sl.start();

  /* floor fan */
  var fan=AC.createBufferSource(); fan.buffer=brown; fan.loop=true;
  var fanF=AC.createBiquadFilter(); fanF.type="lowpass"; fanF.frequency.value=210; fanF.Q.value=0.7;
  var fanG=AC.createGain(); fanG.gain.value=0.052;
  var fanL=AC.createOscillator(); fanL.frequency.value=0.19;
  var fanLG=AC.createGain(); fanLG.gain.value=0.014;
  fanL.connect(fanLG); fanLG.connect(fanG.gain); fanL.start();
  fan.connect(fanF); fanF.connect(fanG); fanG.connect(AC.destination);
  fan.start();

  /* shop bed, no discernible words */
  var rad=AC.createBufferSource(); rad.buffer=brown; rad.loop=true;
  var f1=AC.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=520; f1.Q.value=5.5;
  var f2=AC.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=1180; f2.Q.value=6.5;
  var radG=AC.createGain(); radG.gain.value=0.0;
  rad.connect(f1); rad.connect(f2);
  var mix=AC.createGain(); mix.gain.value=0.5;
  f1.connect(mix); f2.connect(mix); mix.connect(radG); radG.connect(AC.destination);
  rad.start();
  (function speak(){
    if(!AC) return;
    var t=AC.currentTime;
    var dur=0.10+Math.random()*0.26;
    radG.gain.cancelScheduledValues(t);
    radG.gain.setValueAtTime(radG.gain.value,t);
    radG.gain.linearRampToValueAtTime(0.020+Math.random()*0.016,t+0.035);
    radG.gain.linearRampToValueAtTime(0.0035,t+dur);
    f1.frequency.setValueAtTime(380+Math.random()*420,t);
    f2.frequency.setValueAtTime(900+Math.random()*900,t);
    setTimeout(speak,(dur+0.06+Math.random()*0.30)*1000);
  })();

  /* somebody else's tumbler across the room, on its own clock */
  (function tumbler(){
    if(!AC) return;
    var t=AC.currentTime;
    var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2100+Math.random()*900; bp.Q.value=1.4;
    var g=AC.createGain(); g.gain.value=0;
    var trem=AC.createOscillator(); trem.type="sine"; trem.frequency.value=5.2+Math.random()*3.4;
    var tg=AC.createGain(); tg.gain.value=0.011;
    trem.connect(tg); tg.connect(g.gain); trem.start(t);
    s.connect(bp); bp.connect(g); g.connect(AC.destination);
    var dur=0.7+Math.random()*1.1;
    g.gain.setValueAtTime(0.0,t);
    g.gain.linearRampToValueAtTime(0.013,t+0.09);
    g.gain.setValueAtTime(0.013,t+dur-0.12);
    g.gain.linearRampToValueAtTime(0,t+dur);
    s.start(t); s.stop(t+dur+0.05); trem.stop(t+dur+0.05);
    setTimeout(tumbler,(dur+5.5+Math.random()*9.0)*1000);
  })();

  /* the cementing press, coming down twice */
  function press(delay){
    setTimeout(function(){
      if(!AC) return;
      var t=AC.currentTime;
      for(var k=0;k<2;k++){
        var tt=t+k*0.46;
        var o=AC.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(96,tt); o.frequency.exponentialRampToValueAtTime(48,tt+0.16);
        var g=AC.createGain(); g.gain.setValueAtTime(0.10,tt); g.gain.exponentialRampToValueAtTime(0.0008,tt+0.30);
        o.connect(g); g.connect(AC.destination); o.start(tt); o.stop(tt+0.34);
        var n=AC.createBufferSource(); n.buffer=noiseBuf;
        var nf=AC.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=380; nf.Q.value=1.1;
        var ng=AC.createGain(); ng.gain.setValueAtTime(0.040,tt); ng.gain.exponentialRampToValueAtTime(0.0006,tt+0.10);
        n.connect(nf); nf.connect(ng); ng.connect(AC.destination); n.start(tt); n.stop(tt+0.14);
      }
    },delay);
  }
  press(26000+Math.random()*22000);
  press(150000+Math.random()*90000);
}

function clickSound(ev){
  if(!AC||!master) return;
  var t=AC.currentTime;
  var f=Math.max(380,Math.min(5600, 2500*Math.pow(0.0060/Math.max(0.00018,ev.m),0.34)));
  var dec=0.0055+ev.th*0.90;
  var amp=Math.min(0.20,0.030+ev.v*0.052);
  var n=AC.createBufferSource(); n.buffer=noiseBuf;
  n.playbackRate.value=0.8+Math.random()*0.6;
  var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f;
  bp.Q.value=(ev.mat[0]==="g"||ev.mat[0]==="c")?7.5:2.6;
  var g=AC.createGain(); g.gain.setValueAtTime(amp,t); g.gain.exponentialRampToValueAtTime(0.0004,t+dec);
  n.connect(bp); bp.connect(g); g.connect(master);
  n.start(t); n.stop(t+dec+0.02);
  if(ev.mat[0]==="g"||ev.mat[0]==="c"){
    var o=AC.createOscillator(); o.type="triangle"; o.frequency.value=f*1.55;
    var og=AC.createGain(); og.gain.setValueAtTime(amp*0.45,t); og.gain.exponentialRampToValueAtTime(0.0003,t+dec*0.8);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+dec+0.02);
  }
}
function fracSound(ev){
  if(!AC||!master) return;
  var t=AC.currentTime;
  var n=AC.createBufferSource(); n.buffer=noiseBuf;
  var hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1600;
  var g=AC.createGain(); g.gain.setValueAtTime(0.30,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.055);
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t); n.stop(t+0.08);
  for(var i=0;i<9;i++){
    (function(i){
      setTimeout(function(){ clickSound({m:0.0004+Math.random()*0.0012,th:0.02,mat:"g",v:0.6+Math.random()}); },40+i*(18+Math.random()*44));
    })(i);
  }
}

/* ============================ interaction ============================ */
function ptr(e){
  var t=(e.touches&&e.touches[0])||e;
  return {x:t.clientX,y:t.clientY};
}
function onDown(e){
  startAudio();
  var p=ptr(e);
  downX=p.x; downY=p.y; downT=performance.now();
  dragging=true; dragMode=0;
  cv.classList.add("dragging");
  clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){ if(dragging&&dragMode===0){ dragMode=2; } },330);
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  var p=ptr(e);
  var dx=p.x-downX, dy=p.y-downY;
  if(dragMode===0&&Math.hypot(dx,dy)>7){ dragMode=1; clearTimeout(holdTimer); }
  if(dragMode===1){
    var sc=Math.min(W,H)*0.26;
    tiltX=Math.max(-1.45,Math.min(1.45,dx/sc));
    tiltY=Math.max(-1.45,Math.min(1.45,dy/sc));
  }
  e.preventDefault();
}
function onUp(e){
  clearTimeout(holdTimer);
  if(!dragging) return;
  var wasMode=dragMode;
  dragging=false; dragMode=0;
  cv.classList.remove("dragging");
  cv.classList.remove("dragging");
  if(wasMode===0&&performance.now()-downT<330){
    tapWall(downX,downY);
  }
  if(wasMode===1){ /* the tilt relaxes back toward the hand's rest */ }
  save();
  if(e&&e.preventDefault) e.preventDefault();
}
function tapWall(sx,sy){
  var vx=(sx-CX)/Rpx, vy=(sy-CY)/Rpx;
  var L=Math.hypot(vx,vy)||1;
  vx/=L; vy/=L;
  var best=0,bd=-2;
  for(var i=0;i<3;i++){
    var w=WALLS[i], d=-(w.nx*vx+w.ny*vy);
    if(d>bd){bd=d;best=i;}
  }
  var w2=WALLS[best];
  var mag=1.55;
  for(var j=0;j<bodies.length;j++){
    var b=bodies[j];
    var dist=Math.abs((b.x-w2.px)*w2.nx+(b.y-w2.py)*w2.ny);
    var f=Math.exp(-dist*1.55)*mag;
    b.vx+=w2.nx*f*(0.75+Math.random()*0.6)+(Math.random()-0.5)*0.30;
    b.vy+=w2.ny*f*(0.75+Math.random()*0.6)+(Math.random()-0.5)*0.30;
    b.w+=(Math.random()-0.5)*7.5*f;
    if(b.br&&f>0.85&&b.area>0.0075&&Math.random()<0.22) b._frac=3.4+f;
  }
  if(AC&&master){
    var t=AC.currentTime;
    var n=AC.createBufferSource(); n.buffer=noiseBuf;
    var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=640; bp.Q.value=2.0;
    var g=AC.createGain(); g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0006,t+0.12);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t+0.15);
  }
}
cv.addEventListener("mousedown",onDown);
window.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
cv.addEventListener("touchstart",onDown,{passive:false});
window.addEventListener("touchmove",onMove,{passive:false});
window.addEventListener("touchend",onUp,{passive:false});
window.addEventListener("touchcancel",onUp,{passive:false});
cv.addEventListener("contextmenu",function(e){e.preventDefault();});

var keys={};
window.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"||k===" "||k==="["||k==="]"){
    startAudio(); e.preventDefault();
  }
  if(k===" "&&!keys[k]){ tapWall(CX+(Math.random()-0.5)*W*0.5,CY+(Math.random()-0.5)*H*0.5); }
  if(k==="["){ LIGHT=Math.max(0.18,LIGHT-0.085); save(); }
  if(k==="]"){ LIGHT=Math.min(1.45,LIGHT+0.085); save(); }
  keys[k]=true;
});
window.addEventListener("keyup",function(e){ keys[e.key]=false; if(e.key===" ")save(); });

/* ============================ loop ============================ */
var last=performance.now(), acc=0, saveT=0;
function stepPhysics(dt){
  var i,b;
  for(i=0;i<bodies.length;i++){
    b=bodies[i];
    b.vx+=gx*dt; b.vy+=gy*dt;
    var damp=Math.exp(-(0.55+b.drag)*dt);
    b.vx*=damp; b.vy*=damp;
    b.w*=Math.exp(-(1.5+b.drag*2)*dt);
  }
  clickEvents.length=0; slideEnergy=0;
  collectContacts();
  solve(dt,7);
  for(i=0;i<bodies.length;i++){
    b=bodies[i];
    var sp=Math.hypot(b.vx,b.vy);
    if(sp>7){ b.vx*=7/sp; b.vy*=7/sp; }
    if(b.w>26)b.w=26; if(b.w<-26)b.w=-26;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.a+=b.w*dt;
    b.sync();
    /* keep anything that squeezed out honestly back inside */
    for(var wi=0;wi<3;wi++){
      var w=WALLS[wi];
      var dmin=1e9;
      for(var vi=0;vi<b.wv.length;vi++){
        var d=(b.wv[vi][0]-w.px)*w.nx+(b.wv[vi][1]-w.py)*w.ny;
        if(d<dmin)dmin=d;
      }
      if(dmin<-0.02){ b.x-=w.nx*(dmin+0.02); b.y-=w.ny*(dmin+0.02); b.sync(); }
    }
  }
  tryFracture();
  if(sp!==undefined){}
}
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  /* the hand: what is set by drag, arrows, and the barrel's own slow lean */
  var kx=0,ky=0;
  if(keys.ArrowLeft)kx-=1; if(keys.ArrowRight)kx+=1;
  if(keys.ArrowUp)ky-=1; if(keys.ArrowDown)ky+=1;
  if(kx||ky){ var kl=Math.hypot(kx,ky); keyTilt.x=kx/kl*1.15; keyTilt.y=ky/kl*1.15; }
  else { keyTilt.x*=0.90; keyTilt.y*=0.90; }
  if(!(dragging&&dragMode===1)){ tiltX*=0.965; tiltY*=0.965; }
  wanderPhase+=dt*0.27;
  var wx=Math.cos(wanderPhase)*0.30+Math.cos(wanderPhase*2.31+1.2)*0.13;
  var wy=Math.sin(wanderPhase*0.83)*0.30+Math.sin(wanderPhase*1.77)*0.12;
  gx=(tiltX+keyTilt.x+wx)*G;
  gy=(tiltY+keyTilt.y+wy+0.10)*G;

  /* press and hold runs the window light up and down */
  if(dragging&&dragMode===2){
    LIGHT+=lightDir*dt*0.62;
    if(LIGHT>1.45){LIGHT=1.45;lightDir=-1;}
    if(LIGHT<0.18){LIGHT=0.18;lightDir=1;}
  }

  acc+=dt;
  var guard=0;
  while(acc>=1/120&&guard++<5){ stepPhysics(1/120); acc-=1/120; }

  /* audio from the actual contacts */
  var ce=clickEvents.slice(0,5);
  for(var i=0;i<ce.length;i++) clickSound(ce[i]);
  for(i=0;i<fracEvents.length;i++) fracSound(fracEvents[i]);
  fracEvents.length=0;
  if(slitherGain&&AC){
    var tgt=Math.min(0.055,slideEnergy*0.0085);
    slitherGain.gain.setTargetAtTime(tgt,AC.currentTime,0.06);
    slitherFilt.frequency.setTargetAtTime(760+Math.min(2400,slideEnergy*24),AC.currentTime,0.12);
  }

  /* tumbled minutes, kept and never shown */
  var moving=0;
  for(i=0;i<bodies.length;i++){ if(Math.hypot(bodies[i].vx,bodies[i].vy)>0.05) moving++; }
  if(moving>2) TUMBLE_MS+=dt*1000;

  render();
  saveT+=dt;
  if(saveT>5){ saveT=0; save(); }
  requestAnimationFrame(loop);
}

/* settle the tray before the first look */
resize();
(function warm(){
  for(var i=0;i<200;i++){ gx=0; gy=G*0.4; stepPhysics(1/120); }
  fracEvents.length=0;
})();
save();

document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });
window.addEventListener("pagehide",save);
window.addEventListener("beforeunload",save);
document.getElementById("rimmark").addEventListener("click",function(){ save(); });

requestAnimationFrame(loop);

/* on the bench and not in the barrel */
try{
  console.log("%c ","background:#5b3f9c;padding:6px 40px;border-radius:2px;");
  console.log("apex 60 · six around the vertex · one joint taped "+(ERR_RAD*180/Math.PI).toFixed(2)+" out of true (edge "+BAD_EDGE+")");
  console.log("second barrel: back-silvered stock, ghost "+BARREL_2.ghostMM+"mm, apex "+BARREL_2.apex+", not filled, not shown");
}catch(e){}
})();
</script>
