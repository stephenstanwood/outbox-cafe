  <meta name="outbox-spec-era" content="Easter Saturday 1979, right now — half two on a bright cold windy afternoon in a back garden in Ormskirk, Lancashire, where an 8ft × 6ft aluminium greenhouse has arrived flat in three cardboard bundles from a mail-order horticultural firm in Wexford Horticultural Products' spring list, 214 parts, forty-one bolt sizes, one folded instruction sheet printed in two colours, and a concrete base laid last weekend by somebody who did not check it with a string. Not a look-back at 'when things came in kits' and not a 'you can't get a decent greenhouse now' lament — the wind is up, the glass is stacked against the fence, and the whole thing has to be standing before dark or it blows away.">
  <meta name="outbox-spec-format" content="THE PAGE IS ONE OVERPRINTED SHEET THAT CANNOT BE READ WITHOUT A COLOURED GEL, AND THE GEL IS SMALLER THAN THE SHEET. The whole viewport, edge to edge and life-size, is a single folded instruction sheet printed TWICE, in register, on the same paper: the manufacturer's assembly text in process red, and — set line for line, word position for word position, at identical size and leading — a completely different second text in process cyan. Superimposed they are genuinely illegible, a solid muddy interference pattern of two alphabets sitting on each other. Lying loose on top of the sheet are two small squares of coloured acetate, a red gel and a cyan gel, which the visitor drags about with the cursor: the red gel kills the red printing and lets the cyan text read cleanly through it, the cyan gel does the reverse. Each gel is about the size of a beermat, so at no point can either text be read as a whole — you read one layer through a moving hole, and the two texts describe the same twelve steps of the same afternoon and can never once be seen together. Slide both gels over each other and that patch of paper goes flat black. The sheet is dragged up and down under the gels like paper under a hand. There is no header, no menu, no toggle, no reveal button, and no third state.">
  <meta name="outbox-spec-subject" content="The plain, entirely practical business of erecting a bolt-together aluminium greenhouse on a base that is not square — that everything in the kit is extruded to a thousandth and the concrete is out by an inch and a quarter, and that the whole afternoon is the argument between those two facts; that you assemble all four sides flat on the lawn before anything stands up, because a frame that is square lying down can be pulled square standing up and a frame bolted crooked flat can never be; that the corner bolts go in FINGER TIGHT and stay finger tight until the ridge is on, since the frame has to be allowed to shrug itself into shape and a fully tightened corner is a hinge you have welded shut; that you check square by measuring the two diagonals and not by looking, and that they must agree within about an eighth or every pane will bind; that glass is cut to a fixed size and does not negotiate, so a rebate three-sixteenths narrow at one corner means either the frame moves or the pane goes back in the crate; that the glazing goes bottom row first and each pane is held by clips that spring into the extrusion, and a clip fitted the wrong way round holds nothing and you will find out in the first gale; that the base rail must be bolted down to something before the roof goes on, because an empty aluminium frame with no glass in it has enormous sail area and almost no weight and will go over the fence; that the door runs on two wheels in a top track and the track is the last thing you can adjust, so the door is how you find out whether the whole building is out of true; and the flat arithmetic that 214 parts includes eleven you will not need, four you will be short of, and one bag of M6 bolts that is actually M5.">
  <meta name="outbox-spec-tone" content="TWO VOICES ON THE SAME PAPER, never audible at once. RED — the manufacturer's own copy, written by somebody in the Wexford sales office who has never carried a pane of glass: relentlessly encouraging, second person, faintly salesy, everything described as straightforward and rewarding, generous with phrases like 'you will find this a most satisfying stage' and 'two persons of average ability, one afternoon'; sincere, cheerful, and wrong about roughly a third of it, and it never once anticipates a difficulty. CYAN — Dot Halliwell, fifty-eight, and her sister Eunice, who are actually building the thing and are talking straight past each other while they do it: fast, blunt, practical, arguing about the diagonals, keeping a running count of bolts out loud, Eunice holding the ridge bar above her head for far longer than anybody promised, Dot going back into the house twice for a bigger spanner and once for tea, both of them in a perfectly good mood and both of them competitive about who spotted the base was out. Present tense, bright cold windy afternoon, neighbour's dog going, glass ringing against the fence when the wind gets under it. Never wistful, never a life-lesson, never a portrait of a marriage or a family, never charming-old-ladies comedy — two capable people putting up a greenhouse.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Cheap greyish instruction-sheet newsprint (#e8e4d8) with a slightly browner band down each of the two fold creases (#d9d3c2), printed in exactly two process inks — a hot process red (#e33127) and a cold process cyan (#00a2b3) — laid over each other in true register so their overlap composites subtractively into a muddy near-black (#2a2320) and reads as pure noise. The acetate gels are the same two inks in translucent sheet form, with a visibly thicker darker edge where the acetate is cut (#a8241c and #00757f) and a hairline of chromatic fringing along that edge. Flat, hard, no glow, no gradients, no gloss — two ink passes on cheap paper photographed straight down in bright outdoor daylight.">
  <meta name="outbox-spec-wildcard" content="Exactly one line on the sheet is identical in both inks — the red text and the cyan text say precisely the same words in precisely the same positions, so they overprint into a single clean legible sentence and it is the ONLY thing readable on the whole page without a gel: 'CHECK THE BASE IS SQUARE BEFORE YOU GO ANY FURTHER.' It reads black rather than red or cyan, it stays readable under either gel and under both gels together, neither voice ever refers to it, and it is in the same position — step three, fourth line — every visit.">
  <meta name="outbox-spec-forbidden" content="NO DIY-as-metaphor for marriage, sisterhood, patience, building-a-life, 'the instructions never match the thing' as a comment on anything, or the gap between the promise and the reality of adulthood — it is aluminium extrusion, a diagonal measurement, and an inch and a quarter of bad concrete, and it has nothing to teach anybody. NO nostalgia, NO wistfulness, NO 'you could get a proper greenhouse then / everything's plastic now / nobody builds anything themselves anymore' decline narrative — the glass is against the fence and the wind is getting up. NO camp or ironic affection for 1970s British domestic ephemera, no winking at the mail-order copy, no 'so square it's charming' — the Wexford copywriter is entirely sincere and Dot takes the sheet seriously enough to swear at it. NO cosy-northern-sisters comedy, no charming-old-ladies sketch, no catchphrases, no dialect spelling. NO gardening lyricism whatsoever: no tomatoes-in-August, no green-fingered dreaming, no light-through-glass, no growing-things-as-hope. NO cryptic-SCP or ominous dread about the illegible overprint or the one identical line, and NO liminal / uncanny / hidden-message / palimpsest / 'what's underneath the surface' framing of the two layers — it is two ink passes on one sheet of paper. NO sensuous material writing about glass, metal or ink beyond size, weight, tolerance and how it goes together. NO archival / museum / drawer / found-object / relic framing of the sheet — it came in the box this morning and is being followed right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is half two on a bright cold windy Saturday. NO signal / transmission / frequency framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

var WILD_IDX = -1;
for (var wi=0; wi<PAIRS.length; wi++){ if (PAIRS[wi][0]===WILD){ WILD_IDX=wi; break; } }

/* ---------- canvas setup ---------- */
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W=0,H=0,dpr=1;
var fs=14, lh=22, charW=8.4, marginX=0, sheetW=0, topPad=0, contentH=0;
var paper=null, redL=null, cyanL=null;
var fx1=0, fx2=0;

function mkLayer(){
  var c=document.createElement('canvas');
  return {c:c, x:c.getContext('2d')};
}
redL=mkLayer(); cyanL=mkLayer();

var COLS=54;

function layout(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  [redL,cyanL].forEach(function(l){
    l.c.width=Math.round(W*dpr); l.c.height=Math.round(H*dpr);
  });
  fs = Math.min(17, Math.max(9.2, (W*0.94)/(COLS*0.6)));
  charW = fs*0.6;
  sheetW = COLS*charW;
  marginX = Math.max(4,(W - sheetW)/2);
  lh = Math.round(fs*1.62*100)/100;
  topPad = lh*2.4;
  contentH = topPad + PAIRS.length*lh + lh*3;
  fx1 = marginX + sheetW*0.335;
  fx2 = marginX + sheetW*0.675;
  buildPaper();
  var gw = Math.min(184, Math.max(112, W*0.40));
  var gh = gw*0.78;
  if (!gelsInit){
    gelR = {x: Math.max(6,marginX-10), y: H*0.30, w:gw, h:gh, px:0, py:0, sp:0, ink:0};
    gelC = {x: Math.min(W-gw-6, marginX+sheetW*0.42), y: H*0.58, w:gw, h:gh, px:0, py:0, sp:0, ink:1};
    gelR.px=gelR.x; gelR.py=gelR.y; gelC.px=gelC.x; gelC.py=gelC.y;
    gelsInit=true;
  } else {
    [gelR,gelC].forEach(function(g){ g.w=gw; g.h=gh; clampGel(g); });
  }
  clampSheet();
}

function buildPaper(){
  paper=document.createElement('canvas');
  paper.width=Math.round(W*dpr); paper.height=Math.round(H*dpr);
  var p=paper.getContext('2d');
  p.setTransform(dpr,0,0,dpr,0,0);
  p.fillStyle='#e8e4d8'; p.fillRect(0,0,W,H);
  // fold creases: two browner bands down the sheet
  [fx1,fx2].forEach(function(fx){
    var bw=Math.max(14,sheetW*0.035);
    var g=p.createLinearGradient(fx-bw,0,fx+bw,0);
    g.addColorStop(0,'rgba(217,211,194,0)');
    g.addColorStop(0.42,'rgba(217,211,194,0.95)');
    g.addColorStop(0.5,'rgba(210,203,185,1)');
    g.addColorStop(0.58,'rgba(217,211,194,0.95)');
    g.addColorStop(1,'rgba(217,211,194,0)');
    p.fillStyle=g; p.fillRect(fx-bw,0,bw*2,H);
    p.fillStyle='rgba(196,188,168,0.5)'; p.fillRect(fx-0.5,0,1,H);
  });
  // newsprint speckle
  var n=Math.round(W*H/900);
  for(var i=0;i<n;i++){
    var x=Math.random()*W, y=Math.random()*H;
    var v=Math.random();
    p.fillStyle = v>0.5 ? 'rgba(120,110,92,0.055)' : 'rgba(255,252,244,0.06)';
    p.fillRect(x,y,1,1);
  }
  for(var j=0;j<40;j++){
    p.fillStyle='rgba(130,116,90,0.05)';
    p.fillRect(Math.random()*W,Math.random()*H,Math.random()*3+1,Math.random()*2+1);
  }
}

/* ---------- state ---------- */
var sheetY=0, sheetV=0, gelsInit=false, gelR=null, gelC=null;
var order=[]; // draw / hit order, last = top
var drag=null;
var lastT=performance.now();
var sheetSpeed=0, sheetPrevY=0;

function clampSheet(){
  var min = Math.min(0, H - contentH);
  if (sheetY>0) sheetY=0;
  if (sheetY<min) sheetY=min;
}
function clampGel(g){
  var m=Math.min(g.w,g.h)*0.55;
  if(g.x < -g.w+m) g.x=-g.w+m;
  if(g.x > W-m) g.x=W-m;
  if(g.y < -g.h+m) g.y=-g.h+m;
  if(g.y > H-m) g.y=H-m;
}

/* ---------- ink layers ---------- */
function drawInk(l, which, colour){
  var c=l.x;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  c.font = fs+'px "Courier New", Courier, monospace';
  c.textBaseline='alphabetic';
  c.fillStyle=colour;
  var off = which===1 ? Math.max(0.8, fs*0.075) : 0; // second pass, ~a millimetre out
  var first=Math.max(0, Math.floor((-sheetY - topPad)/lh) - 2);
  var last=Math.min(PAIRS.length-1, first + Math.ceil(H/lh) + 3);
  for(var i=first;i<=last;i++){
    var t=PAIRS[i][which];
    if(!t) continue;
    var y = topPad + sheetY + i*lh;
    if (y < -lh || y > H+lh) continue;
    var xo = (i===WILD_IDX) ? 0 : off;
    c.fillText(t, marginX + xo, y);
  }
}

function punch(l, g){
  var c=l.x;
  c.save();
  c.globalCompositeOperation='destination-out';
  c.fillStyle='#000';
  c.fillRect(g.x+4, g.y+4, g.w-8, g.h-8);
  c.strokeStyle='#000';
  var band=[[3,0.55],[2,0.44],[1,0.32],[0,0.2],[-1,0.11],[-2,0.05]];
  for(var i=0;i<band.length;i++){
    c.globalAlpha=band[i][1];
    c.lineWidth=1.6;
    var ins=band[i][0];
    c.strokeRect(g.x+ins, g.y+ins, g.w-2*ins, g.h-2*ins);
  }
  c.globalAlpha=1;
  c.restore();
}

/* ---------- render ---------- */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.drawImage(paper,0,0,W,H);

  drawInk(redL,0,'#e33127');
  drawInk(cyanL,1,'#00a2b3');
  punch(redL,gelR);
  punch(cyanL,gelC);

  ctx.globalCompositeOperation='multiply';
  ctx.drawImage(redL.c,0,0,W,H);
  ctx.drawImage(cyanL.c,0,0,W,H);

  // acetate tints, in draw order
  for(var i=0;i<order.length;i++){
    var g=order[i];
    ctx.fillStyle = g.ink===0 ? 'rgb(200,54,44)' : 'rgb(18,140,155)';
    ctx.fillRect(g.x,g.y,g.w,g.h);
  }

  ctx.globalCompositeOperation='source-over';
  for(var k=0;k<order.length;k++){
    var gg=order[k];
    // thicker darker cut edge
    ctx.lineWidth=2.6;
    ctx.strokeStyle = gg.ink===0 ? 'rgba(168,36,28,0.92)' : 'rgba(0,117,127,0.92)';
    ctx.strokeRect(gg.x+1.3, gg.y+1.3, gg.w-2.6, gg.h-2.6);
    // hairline of chromatic fringing along the cut
    ctx.lineWidth=1;
    ctx.strokeStyle = gg.ink===0 ? 'rgba(0,162,179,0.30)' : 'rgba(227,49,39,0.28)';
    ctx.strokeRect(gg.x+3.4, gg.y+3.4, gg.w-6.8, gg.h-6.8);
    ctx.strokeStyle='rgba(40,32,26,0.16)';
    ctx.strokeRect(gg.x+0.4, gg.y+0.4, gg.w-0.8, gg.h-0.8);
  }

  // the one line that is set in both inks at once
  if(WILD_IDX>=0){
    var wy = topPad + sheetY + WILD_IDX*lh;
    if(wy>-lh && wy<H+lh){
      ctx.font = fs+'px "Courier New", Courier, monospace';
      ctx.fillStyle='#39302a';
      ctx.fillText(WILD, marginX, wy);
    }
  }
}

/* ---------- audio ---------- */
var AC=null, noiseBuf=null, wind=null, windGain=null, windF=null,
    slitherGain=null, rustleGain=null, started=0;

function makeNoise(ac){
  var len=ac.sampleRate*2;
  var b=ac.createBuffer(1,len,ac.sampleRate);
  var d=b.getChannelData(0);
  var last=0;
  for(var i=0;i<len;i++){
    var wn=Math.random()*2-1;
    last=(last+0.02*wn)/1.02;
    d[i]=last*3.2 + wn*0.35;
  }
  return b;
}
function loopNoise(freq,Q,gain){
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=Q;
  var g=AC.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  return {s:s,f:f,g:g};
}
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return; }
  noiseBuf=makeNoise(AC);
  var w=loopNoise(400,0.55,0.004); wind=w; windGain=w.g; windF=w.f;
  var sl=loopNoise(4300,1.1,0.0); slitherGain=sl.g;
  var ru=loopNoise(820,0.85,0.0); rustleGain=ru.g;
  started=AC.currentTime;
  scheduleRing();
}
function tick(){
  if(!AC) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=1.6;
  var f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800;
  var g=AC.createGain();
  var t=AC.currentTime;
  g.gain.setValueAtTime(0.05,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+0.045);
  s.connect(f); f.connect(g); g.connect(AC.destination);
  s.start(t); s.stop(t+0.06);
}
function scheduleRing(){
  if(!AC) return;
  setTimeout(function(){
    if(AC){
      var s=AC.createBufferSource(); s.buffer=noiseBuf;
      var f=AC.createBiquadFilter(); f.type='bandpass';
      f.frequency.value=1900+Math.random()*1500; f.Q.value=22;
      var g=AC.createGain(); var t=AC.currentTime;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.016,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0002,t+0.75);
      s.connect(f); f.connect(g); g.connect(AC.destination);
      s.start(t); s.stop(t+0.9);
    }
    scheduleRing();
  }, 11000+Math.random()*22000);
}

/* ---------- pointer ---------- */
function pt(e){
  return {x:e.clientX, y:e.clientY};
}
function hit(g,p){ return p.x>=g.x && p.x<=g.x+g.w && p.y>=g.y && p.y<=g.y+g.h; }

cv.addEventListener('pointerdown', function(e){
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('grabbing');
  var p=pt(e);
  var hitG=null;
  for(var i=order.length-1;i>=0;i--){ if(hit(order[i],p)){ hitG=order[i]; break; } }
  if(hitG){
    order.splice(order.indexOf(hitG),1); order.push(hitG);
    drag={type:'gel', g:hitG, dx:p.x-hitG.x, dy:p.y-hitG.y};
  } else {
    drag={type:'sheet', y0:p.y, s0:sheetY, ly:p.y, lt:performance.now()};
    sheetV=0;
  }
  var h=document.getElementById('hint');
  if(h) h.style.opacity='0';
  e.preventDefault();
});
cv.addEventListener('pointermove', function(e){
  if(!drag) return;
  var p=pt(e);
  if(drag.type==='gel'){
    var g=drag.g;
    var pxl=g.x, pxr=g.x+g.w;
    g.x=p.x-drag.dx; g.y=p.y-drag.dy;
    clampGel(g);
    // fold crease crossings
    var nxl=g.x, nxr=g.x+g.w;
    [fx1,fx2].forEach(function(fx){
      if((pxl-fx)*(nxl-fx)<0 || (pxr-fx)*(nxr-fx)<0) tick();
    });
  } else {
    var now=performance.now();
    var target = drag.s0 + (p.y - drag.y0);
    var min=Math.min(0,H-contentH);
    if(target>0) target = target*0.35;
    if(target<min) target = min + (target-min)*0.35;
    var dt=Math.max(8, now-drag.lt);
    sheetV = (target - sheetY) / dt * 16;
    sheetY = target;
    drag.ly=p.y; drag.lt=now;
  }
  e.preventDefault();
},{passive:false});
function up(e){
  if(drag && drag.type==='sheet'){ /* momentum carries */ }
  drag=null;
  cv.classList.remove('grabbing');
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', function(e){
  initAudio();
  sheetY -= e.deltaY*0.6; sheetV = -e.deltaY*0.12;
  clampSheet();
  e.preventDefault();
},{passive:false});

/* ---------- loop ---------- */
function frame(now){
  var dt=Math.min(60, now-lastT); lastT=now;

  if(!drag || drag.type!=='sheet'){
    var min=Math.min(0,H-contentH);
    if(sheetY>0){ sheetY += (0-sheetY)*0.16; sheetV=0; if(Math.abs(sheetY)<0.2) sheetY=0; }
    else if(sheetY<min){ sheetY += (min-sheetY)*0.16; sheetV=0; if(Math.abs(sheetY-min)<0.2) sheetY=min; }
    else if(Math.abs(sheetV)>0.03){
      sheetY += sheetV*(dt/16);
      sheetV *= 0.945;
    } else sheetV=0;
  }

  sheetSpeed = Math.abs(sheetY - sheetPrevY)/Math.max(1,dt/16);
  sheetPrevY = sheetY;

  var totalGelSpeed=0;
  for(var i=0;i<order.length;i++){
    var g=order[i];
    var d=Math.hypot(g.x-g.px, g.y-g.py)/Math.max(1,dt/16);
    g.sp = g.sp*0.6 + d*0.4;
    g.px=g.x; g.py=g.y;
    totalGelSpeed += g.sp;
  }

  if(AC){
    var t=AC.currentTime;
    var elapsed=t-started;
    var wg = 0.0035 + Math.min(1, elapsed/300)*0.028;
    var gust = 0.75 + 0.45*Math.sin(elapsed*0.21) + 0.25*Math.sin(elapsed*0.73+1.1);
    windGain.gain.setTargetAtTime(wg*Math.max(0.4,gust), t, 0.4);
    windF.frequency.setTargetAtTime(340 + 220*Math.max(0,gust-0.6), t, 0.6);
    var sg = Math.min(0.05, totalGelSpeed*0.0032);
    slitherGain.gain.setTargetAtTime(sg, t, 0.05);
    var sf = 3200 + Math.min(3800, totalGelSpeed*95);
    slitherGain.gain.value = slitherGain.gain.value;
    if(slitherGain.gain){ /* band tracks drag speed */ }
    var rg = Math.min(0.075, sheetSpeed*0.0042);
    rustleGain.gain.setTargetAtTime(rg, t, 0.06);
    try{
      slitherGain.context; // no-op guard
    }catch(e){}
    if(slitherFilterRef) slitherFilterRef.frequency.setTargetAtTime(sf, t, 0.08);
  }

  render();
  requestAnimationFrame(frame);
}

var slitherFilterRef=null;
var _origInit=initAudio;
initAudio=function(){
  var was=!!AC;
  _origInit();
  if(!was && AC){
    // capture the slither band filter for speed tracking
    // (rebuild: find via closure not possible, so make a dedicated one)
  }
};

/* dedicated slither with a reachable filter */
(function patchSlither(){
  var realInit=initAudio;
  initAudio=function(){
    var first=!AC;
    realInit();
    if(first && AC && !slitherFilterRef){
      var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=4200; f.Q.value=1.2;
      s.connect(f); f.connect(slitherGain);
      s.start();
      slitherFilterRef=f;
    }
  };
})();

order=[];
window.addEventListener('resize', function(){ layout(); });
layout();
order=[gelR,gelC];
requestAnimationFrame(frame);

console.log('Sheet 86/2, second edition. 214 parts claimed. 209 all told, and one bag marked M6 that is M5. Eleven of them are spares and nobody needs them.');
})();
</script>
