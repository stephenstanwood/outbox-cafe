  <meta name="outbox-spec-era" content="A Sunday afternoon in late May 1974, on the oilcloth-covered folding table of a third birthday party in a patio in Colonia Portales, Mexico City. The streamers are crepe paper and have started to run in the heat. The piñata is already broken. The one thing on the table everyone is waiting for is a gelatina de mosaico turned out of a fluted aluminium ring mould that morning: cubes of strawberry, lime, pineapple and grape gelatin set inside a milky, cinnamon-sweet condensed-milk gelatin. It has been in the refrigerator since seven and is now out on a glass cake stand in full sun, with a knife beside it.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: an endless slicing of one mosaic gelatin, seen from the side at table height, filling the viewport. Each click, tap or press of SPACE draws a knife down through the ring and lifts away a slice, so the cut face turns toward you. That face is a freshly generated cross-section, a new scatter of translucent coloured cubes caught at whatever angle and depth the cut happened to pass through them, suspended in opaque milk-white. So no two faces are ever the same, and the ring never gets smaller. Between cuts, the whole mould wobbles on real spring physics wherever the cursor nudges it. Light from the upper left passes through the coloured cubes and throws soft stained-glass patches of colour onto the white oilcloth below.">
  <meta name="outbox-spec-subject" content="The pure visual joy of a mosaic gelatin being cut at a party: the way a cube sliced corner-first shows a diamond, a cube sliced along its face shows a square, and a cube just grazed shows a sliver. The way cubes that sank while setting crowd the bottom of the ring, and ones that floated sit high and lonely. The way the milk layer goes faintly blue-white where it is thin against a cube. The way every slice leans over, shivers and settles on the stand. Nothing is explained. It is a cross-section generator that happens to be dessert.">
  <meta name="outbox-spec-tone" content="Wordless and GIDDY. The register lives entirely in the wobble and the colour. The mould jiggles a little too much and a little too long, and it overshoots and giggles back. The slices flop over with a soft, cheerful slap. The light is bright, hot early-afternoon sun, and a confetti of coloured light patches dances across the tablecloth every time the gelatin shivers. It should feel like a toddler's party at the exact moment the grown-up picks up the knife: bouncy, bright, faintly ridiculous and entirely delighted. It is not reverent, not slow, not meditative.">
  <meta name="outbox-spec-length" content="medium">

  <meta name="outbox-spec-wildcard" content="A single pink birthday candle shaped like the numeral 3 is stuck in the top of the ring. It is always lit, its flame leans with every wobble, and its wax visibly burns down in real local clock time across the day. It is full-length at midnight and a stub by 23:59. The knife always cuts around it and it never falls over.">

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),bgc=document.createElement('canvas');
const CREAM='#f6efe0',RED='#e2344a',D=Math.PI/180;
const FILL=['226,52,74','168,206,112','242,206,104','122,44,98'];      // strawberry, lime, pineapple, grape
const GLOW=['255,28,60','96,212,40','255,186,16','146,28,176'];
const WT=[3,2.6,2.4,2],SINK=[.7,.7,.92,.5];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
let W,H,dpr,L={},N=[],S=[],RC=[],SL=[],K=null,Q=0,count=0,cutMark=null,lastAct=0,nextBump=0,lean=0;
const C=8,R=7,P={x:-1e4,y:-1e4,vx:0,vy:0,t:0,in:false},W0={s:false,t:0,hz:3,peak:0,lb:0};
const GUESTS=['Tere (it is her birthday)','Beto','Chayo','Memo','Lupita','Paco','Rocío','the Olvera twins','Mr. Anaya from upstairs','Nena','Cuca','whoever is holding the baby'];
let total=0;try{total=+localStorage.getItem('gelatina-slices')||0}catch(e){}
console.log('%c 3 today! ','background:#e2344a;color:#f6efe0;font:bold 16px Georgia;border-radius:6px','— slices cut at this table, ever:',total);

const half=v=>.36+.14*v;
const OUT=(()=>{const p=[];for(let k=0;k<=12;k++){const v=1-k/12*.72;p.push([.5+half(v),v])}
 for(let k=0;k<=44;k++){const a=k/44*Math.PI,b=.025*Math.abs(Math.sin(a*9));p.push([.5+half(.28)*Math.cos(a)*(1+b*.5),.28-(.25+b)*Math.pow(Math.sin(a),.6)])}
 for(let k=0;k<=12;k++){const v=.28+k/12*.72;p.push([.5-half(v),v])}return p})();
const FL=[];for(let k=0;k<=10;k++){const th=-1.25+k*.25,pts=[],vt=.28-.25*Math.pow(Math.cos(th),.6)+.03;
 for(let v=vt;v<=1.001;v+=.05)pts.push([.5+(v<.28?half(.28):half(v))*Math.sin(th),v]);FL.push({th,pts})}
const SO=(()=>{const p=[[-.55,0],[.55,0]];for(let k=1;k<=10;k++){const y=k/10*.7;p.push([.55-.13*y/.7,y])}
 for(let k=0;k<=36;k++){const a=k/36*Math.PI,b=.022*Math.abs(Math.sin(a*6));p.push([.42*Math.cos(a)*(1+b),.7+(.27+b)*Math.pow(Math.sin(a),.6)])}
 for(let k=10;k>=1;k--){const y=k/10*.7;p.push([-(.55-.13*y/.7),y])}return p})();

function R3(p,a,b,c){let[x,y,z]=p,t;t=x*Math.cos(a)-y*Math.sin(a);y=x*Math.sin(a)+y*Math.cos(a);x=t;
 t=y*Math.cos(b)-z*Math.sin(b);z=y*Math.sin(b)+z*Math.cos(b);y=t;t=z*Math.cos(c)-x*Math.sin(c);x=z*Math.sin(c)+x*Math.cos(c);z=t;return[x,y,z]}
function pick(){let r=Math.random()*10;for(let i=0;i<4;i++){r-=WT[i];if(r<0)return i}return 0}
function field(hw,n){const cubes=[],out=[];
 for(let t=0;t<n*8&&cubes.length<n;t++){const s=.07+Math.pow(Math.random(),1.6)*.13,col=pick(),sink=Math.random()<SINK[col];
  const y=sink?s*.55+Math.pow(Math.random(),2.3)*.5:.2+Math.random()*.78,x=(Math.random()*2-1)*hw,z=(Math.random()*2-1)*s*.8;
  if(cubes.some(c=>Math.hypot(c.x-x,c.y-y,c.z-z)<(c.s+s)*.72))continue;
  const flat=Math.random()<.3;cubes.push({x,y,z,s,col,a:Math.random()*6.28,b:flat?0:Math.random()*6.28,c:flat?0:Math.random()*6.28})}
 for(const c of cubes){const V=[];for(let k=0;k<8;k++){const p=R3([(k&1?.5:-.5)*c.s,(k&2?.5:-.5)*c.s,(k&4?.5:-.5)*c.s],c.a,c.b,c.c);V.push([p[0]+c.x,p[1]+c.y,p[2]+c.z])}
  const Pt=[];for(let k=0;k<8;k++)for(const bit of[1,2,4])if(!(k&bit)){const A=V[k],B=V[k|bit];if((A[2]>0)!==(B[2]>0)){const t=A[2]/(A[2]-B[2]);Pt.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t])}}
  if(Pt.length<3)continue;let cx=0,cy=0;Pt.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=Pt.length;cy/=Pt.length;
  Pt.sort((p,q)=>Math.atan2(p[1]-cy,p[0]-cx)-Math.atan2(q[1]-cy,q[0]-cx));
  let ar=0;for(let i=0;i<Pt.length;i++){const p=Pt[i],q=Pt[(i+1)%Pt.length];ar+=p[0]*q[1]-q[0]*p[1]}ar=Math.abs(ar)/2;
  if(ar<4e-5)continue;out.push({pts:Pt,c:c.col,area:ar,cx,cy})}
 return out}

function layout(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
 const port=H>W*1.05;L={port};
 if(port){L.cx=W*.5;L.rw=Math.min(W*.78,H*.5);L.sy=H*.55;L.cloth=H*.62;L.pile=[W*.03,W*.97,H*.79,H*.965]}
 else{L.cx=W*.4;L.rw=Math.min(W*.44,H*.72);L.sy=H*.63;L.cloth=H*.68;L.pile=[W*.7,W*.985,H*.76,H*.96]}
 L.rh=L.rw*.6;L.foot=L.cloth+(H-L.cloth)*.33;L.cols=port?4:3;L.rows=Math.ceil(12/L.cols);
 const cw=(L.pile[1]-L.pile[0])/L.cols;L.sH=Math.min(L.rh*.6,cw*.95/1.1,(L.pile[3]-L.pile[2])*.62);
 N=[];S=[];const x0=L.cx-L.rw/2,y0=L.sy-L.rh;
 for(let j=0;j<R;j++)for(let i=0;i<C;i++){const u=i/(C-1),v=j/(R-1),rx=x0+u*L.rw,ry=y0+v*L.rh;N.push({rx,ry,x:rx,y:ry,vx:0,vy:0,v,pin:j===R-1})}
 for(let j=0;j<R;j++)for(let i=0;i<C;i++)for(const[a,b]of[[1,0],[0,1],[1,1],[-1,1],[2,0],[0,2]]){const i2=i+a,j2=j+b;if(i2<0||i2>=C||j2>=R)continue;
  const p=N[j*C+i],q=N[j2*C+i2];S.push([p,q,Math.hypot(p.rx-q.rx,p.ry-q.ry)])}
 RC=field(.83,42).map(p=>({pts:p.pts.map(q=>[.5+q[0]*.6,1-q[1]]),c:p.c,area:p.area,cu:.5+p.cx*.6,cv:1-p.cy}));
 drawBG()}

function drawBG(){bgc.width=W*dpr;bgc.height=H*dpr;const b=bgc.getContext('2d');b.scale(dpr,dpr);
 let gr=b.createLinearGradient(0,0,0,L.cloth);gr.addColorStop(0,'#fdf8ec');gr.addColorStop(1,'#eddfc3');b.fillStyle=gr;b.fillRect(0,0,W,L.cloth);
 gr=b.createRadialGradient(W*.04,-H*.1,0,W*.04,-H*.1,W*.95);gr.addColorStop(0,'rgba(255,254,238,.95)');gr.addColorStop(1,'rgba(255,254,238,0)');b.fillStyle=gr;b.fillRect(0,0,W,L.cloth);
 for(let s=0;s<4;s++){const y0=H*(.015+s*.045),sag=H*(.07+s*.03),xa=-30+s*W*.06,xb=W+30-s*W*.09,col=s%2?'#ec7482':RED,top=[],bot=[];
  for(let k=0;k<=90;k++){const t=k/90,x=xa+(xb-xa)*t,y=y0+sag*4*t*(1-t)+Math.sin(t*9+s)*3,w=(H*.012+4)*(.75+.35*Math.sin(t*140+s*2));top.push([x,y-w/2]);bot.push([x,y+w/2])}
  for(const[ox,oy,c]of[[14,22,'rgba(120,80,50,.07)'],[0,0,col]]){b.beginPath();top.forEach((p,i)=>i?b.lineTo(p[0]+ox,p[1]+oy):b.moveTo(p[0]+ox,p[1]+oy));
   for(let i=bot.length-1;i>=0;i--)b.lineTo(bot[i][0]+ox,bot[i][1]+oy);b.fillStyle=c;b.fill()}
  b.strokeStyle='rgba(120,10,30,.16)';b.lineWidth=1;for(let i=0;i<top.length;i++){b.beginPath();b.moveTo(top[i][0],top[i][1]);b.lineTo(bot[i][0]+1.5,bot[i][1]);b.stroke()}
  for(let d=0;d<7;d++){const p=bot[(Math.random()*bot.length)|0],len=rnd(15,H*.12),dg=b.createLinearGradient(0,p[1],0,p[1]+len);
   dg.addColorStop(0,'rgba(226,52,74,.35)');dg.addColorStop(1,'rgba(226,52,74,0)');b.strokeStyle=dg;b.lineWidth=rnd(1,2.5);
   b.beginPath();b.moveTo(p[0],p[1]);b.quadraticCurveTo(p[0]+rnd(-3,3),p[1]+len*.5,p[0]+rnd(-4,4),p[1]+len);b.stroke()}}
 gr=b.createLinearGradient(0,L.cloth,0,H);gr.addColorStop(0,'#eadcc0');gr.addColorStop(.07,'#fcf8ee');gr.addColorStop(1,CREAM);b.fillStyle=gr;b.fillRect(0,L.cloth,W,H-L.cloth);
 b.fillStyle='rgba(150,120,90,.2)';b.fillRect(0,L.cloth-1,W,2);
 for(let r=0;r<14;r++){const t=r/13,y=L.cloth+(H-L.cloth)*Math.pow(t,1.7)+3,sc=.3+t*1.2,st=26*sc+6;b.fillStyle='rgba(226,52,74,.08)';
  for(let x=(r%2)*st/2;x<W+st;x+=st){b.beginPath();b.ellipse(x,y,3*sc,1.4*sc,0,0,7);b.fill()}}
 gr=b.createLinearGradient(W*.1,L.cloth,W*.5,H);gr.addColorStop(.3,'rgba(255,255,255,0)');gr.addColorStop(.45,'rgba(255,255,255,.5)');gr.addColorStop(.6,'rgba(255,255,255,0)');b.fillStyle=gr;b.fillRect(0,L.cloth,W,H-L.cloth);
 for(let i=0;i<26;i++){const x=rnd(0,W),y=rnd(L.cloth+6,H),s=3+(y-L.cloth)/(H-L.cloth)*6;b.save();b.translate(x,y);b.rotate(rnd(0,6.3));b.scale(1,.5);
  b.fillStyle=Math.random()<.6?'rgba(226,52,74,.8)':'rgba(236,116,130,.7)';b.fillRect(-s/2,-s/3,s,s*.66);b.restore()}}

function M(u,v){u=clamp(u,0,1);v=clamp(v,0,1);const fi=u*(C-1),fj=v*(R-1),i=Math.min(C-2,fi|0),j=Math.min(R-2,fj|0),a=fi-i,b=fj-j;
 const p=N[j*C+i],q=N[j*C+i+1],r=N[(j+1)*C+i],s=N[(j+1)*C+i+1];
 return[(p.x*(1-a)+q.x*a)*(1-b)+(r.x*(1-a)+s.x*a)*b,(p.y*(1-a)+q.y*a)*(1-b)+(r.y*(1-a)+s.y*a)*b]}
function path(pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}

function phys(h){for(const[p,q,r]of S){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,f=95*(d-r)/d*h;p.vx+=dx*f;p.vy+=dy*f;q.vx-=dx*f;q.vy-=dy*f}
 const lim=L.rw*.3;for(const n of N){if(n.pin){n.x=n.rx;n.y=n.ry;n.vx=n.vy=0;continue}const ka=14*(.4+n.v*n.v*3);
  n.vx+=(n.rx-n.x)*ka*h;n.vy+=(n.ry-n.y)*ka*h;n.vx=clamp(n.vx*.9972,-1400,1400);n.vy=clamp(n.vy*.9972,-1400,1400);
  n.x=clamp(n.x+n.vx*h,n.rx-lim,n.rx+lim);n.y=clamp(n.y+n.vy*h,n.ry-lim,n.ry+lim)}}

let AC=null,NB=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.4|0;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume()}
function squelch(th){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),bp=AC.createBiquadFilter(),gg=AC.createGain(),f=900/th;s.buffer=NB;bp.type='bandpass';bp.Q.value=4;
 bp.frequency.setValueAtTime(f*1.6,t);bp.frequency.exponentialRampToValueAtTime(f*.35,t+.28);gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(.5,t+.02);gg.gain.exponentialRampToValueAtTime(.0001,t+.32);
 s.connect(bp);bp.connect(gg);gg.connect(AC.destination);s.start(t);s.stop(t+.4);
 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(260/th,t);o.frequency.exponentialRampToValueAtTime(70/th,t+.2);og.gain.setValueAtTime(.25,t);og.gain.exponentialRampToValueAtTime(.0001,t+.22);
 o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.25)}
function boing(hz,amp){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gg=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain(),f=120+hz*38;o.type='triangle';
 o.frequency.setValueAtTime(f*1.25,t);o.frequency.exponentialRampToValueAtTime(f*.8,t+.5);lf.frequency.value=hz*2;lg.gain.value=f*.12;lf.connect(lg);lg.connect(o.frequency);
 gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(Math.min(.22,.05+amp*.2),t+.015);gg.gain.exponentialRampToValueAtTime(.0001,t+.55);
 o.connect(gg);gg.connect(AC.destination);o.start(t);lf.start(t);o.stop(t+.6);lf.stop(t+.6)}
function slap(th){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=700/th;
 gg.gain.setValueAtTime(.35,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.09);s.connect(f);f.connect(gg);gg.connect(AC.destination);s.start(t);s.stop(t+.12);boing(2.1+th*.6,.35)}

function slotPos(i){const[x0,x1,y0,y1]=L.pile,c=i%L.cols,r=L.rows-1-Math.floor(i/L.cols),cw=(x1-x0)/L.cols;
 return{x:x0+cw*(c+.5)+(r%2?cw*.18:-cw*.08),y:y0+L.sH*.95+(y1-y0-L.sH*.95)*r/(L.rows-1),sz:L.sH*(.8+.2*r/(L.rows-1)),row:r}}
function cut(){au();lastAct=performance.now();if(K){if(Q<2)Q++;return}const side=Math.random()<.5?-1:1;K={x:L.cx+side*L.rw*rnd(.2,.32),dir:side,t:0,done:false}}
function spawn(){const th=rnd(.6,1.6),polys=field(.55,(34+Math.random()*16)|0),serial=count++,slot=serial%12;
 for(const s of SL)if(s.slot===slot)s.phase='leave';
 const gl=polys.slice().sort((a,b)=>b.area-a.area).slice(0,7);
 SL.push({polys,gl,thick:th,slot,jit:rnd(-.1,.1)*L.sH,phase:'fly',t:0,x0:K.x,y0:L.sy,sz0:L.rh*.95,x:K.x,y:L.sy,sz:L.rh*.95,fx:.06,tilt:0,sh:0,vsh:0,q:0,vq:0,lean:rnd(-.1,.1),dir:K.dir,off:0,voff:0});
 squelch(th);cutMark={x:K.x,a:1};
 for(const n of N){if(n.pin)continue;const f=1-n.v;n.vy+=260*f;n.vx+=-K.dir*140*f+rnd(-15,15)}
 const cnt=[0,0,0,0],sides={3:0,4:0,5:0,6:0};polys.forEach(p=>{cnt[p.c]++;sides[p.pts.length]=(sides[p.pts.length]||0)+1});
 total++;try{localStorage.setItem('gelatina-slices',total)}catch(e){}
 console.log(`slice ${serial+1} → ${GUESTS[serial%GUESTS.length]}: ${cnt[0]} strawberry, ${cnt[1]} lime, ${cnt[2]} pineapple, ${cnt[3]} grape · ${sides[4]} squares & diamonds, ${sides[3]} triangles, ${sides[6]} hexagons${sides[6]?' (corner to corner, lucky!)':''}`)}

function update(dt,now){
 if(P.in){const Rr=L.rw*.32;for(const n of N){if(n.pin)continue;const dx=n.x-P.x,dy=n.y-P.y,d=Math.hypot(dx,dy)||1;if(d<Rr){const f=Math.pow(1-d/Rr,2);
  n.vx+=clamp(P.vx,-2500,2500)*.05*f+dx/d*f*1600*dt;n.vy+=clamp(P.vy,-2500,2500)*.05*f+dy/d*f*1600*dt}}}
 P.vx*=.6;P.vy*=.6;
 if(now-lastAct>4500&&now>nextBump){nextBump=now+rnd(6000,14000);const k=rnd(-1,1);for(const n of N)if(!n.pin){n.vx+=k*90*(1-n.v);n.vy+=40*(1-n.v)}}
 for(let i=0;i<3;i++)phys(dt/3);
 const tv=(N[3].vx+N[4].vx)/2;lean+=(clamp(-tv*.003,-.9,.9)-lean)*Math.min(1,dt*10);
 const top=(N[3].x+N[4].x-N[3].rx-N[4].rx)/2,sg=top>0,ts=now/1000;W0.peak=Math.max(W0.peak,Math.abs(top));
 if(sg!==W0.s){const amp=W0.peak/(L.rw*.05),per=(ts-W0.t)*2;if(amp>.12&&per>.08&&per<2)W0.hz=W0.hz*.6+(1/per)*.4;
  if(amp>.3&&ts-W0.lb>.26){boing(W0.hz,Math.min(1,amp));W0.lb=ts}W0.t=ts;W0.s=sg;W0.peak=0}
 if(K){K.t+=dt;const A=L.sy-L.rh*1.55,B=L.sy-2;
  K.tip=K.t<.24?A+(B-A)*Math.pow(K.t/.24,2):K.t<.3?B:B+(A-B)*sstep(.3,.52,K.t);K.xo=K.t>.3?K.dir*L.rw*.06*sstep(.3,.52,K.t):0;
  if(K.tip>L.sy-L.rh&&K.t<.3)for(const n of N)if(!n.pin&&Math.abs(n.rx-K.x)<L.rw*.14&&n.ry<K.tip)n.vx+=Math.sign(n.rx-K.x)*30;
  if(!K.done&&K.t>=.24){K.done=true;spawn()}
  if(K.t>=.52){K=null;if(Q>0){Q--;cut()}}}
 if(cutMark){cutMark.a-=dt*.5;if(cutMark.a<=0)cutMark=null}
 for(const s of SL){const sp=slotPos(s.slot),tx=sp.x+s.jit;
  if(s.phase==='fly'){s.t+=dt/.62;const t=Math.min(1,s.t),e=1-Math.pow(1-t,2);s.x=s.x0+(tx-s.x0)*e;s.y=s.y0+(sp.y-s.y0)*e-Math.sin(Math.PI*t)*L.rh*.55;
   s.sz=s.sz0+(sp.sz-s.sz0)*e;s.fx=.06+.94*sstep(.1,.8,t);s.tilt=s.dir*.7*Math.sin(Math.PI*t)+s.lean*t;

  else{s.sz=sp.sz;s.y=sp.y;if(s.phase==='leave'){s.voff+=dt*900;s.off+=s.voff*dt}s.x=tx+s.off;s.tilt+=(s.lean-s.tilt)*Math.min(1,dt*6)}
  s.vsh+=-170*s.sh*dt;s.vsh*=Math.exp(-2.4*dt);s.sh=clamp(s.sh+s.vsh*dt,-.4,.4);s.vq+=-220*s.q*dt;s.vq*=Math.exp(-3*dt);s.q=clamp(s.q+s.vq*dt,-.35,.35)}
 SL=SL.filter(s=>s.phase!=='leave'||s.x-s.sz<W+60)}

function glow(x,y,r,col,a){if(!(r>1))return;g.save();g.translate(x,y);g.scale(1,.38);const gr=g.createRadialGradient(0,0,0,0,0,r);
 gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.55,`rgba(${col},${a*.45})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function knifeShape(bl,bw,hl){const gr=g.createLinearGradient(0,0,bw,0);gr.addColorStop(0,'#f4f1ea');gr.addColorStop(.5,'#cdc8bd');gr.addColorStop(1,'#fbf9f4');

 g.strokeStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(bw*.15,-bl*.2);g.lineTo(bw*.18,-bl*.95);g.stroke();
 g.fillStyle=RED;rr(-bw*.15,-bl-hl,bw*1.3,hl,bw*.5);g.fill();g.fillStyle=CREAM;for(let i=1;i<=3;i++){g.beginPath();g.arc(bw*.5,-bl-hl*i/4,bw*.12,0,7);g.fill()}}

function drawStand(){const cx=L.cx,y=L.sy,pw=L.rw*1.2,ph=Math.max(5,L.rw*.026),fw=L.rw*.34,ft=L.foot;
 g.beginPath();g.moveTo(cx-L.rw*.07,y+ph);g.bezierCurveTo(cx-L.rw*.05,y+(ft-y)*.5,cx-fw*.9,ft-(ft-y)*.12,cx-fw,ft);g.lineTo(cx+fw,ft);
 g.bezierCurveTo(cx+fw*.9,ft-(ft-y)*.12,cx+L.rw*.05,y+(ft-y)*.5,cx+L.rw*.07,y+ph);g.closePath();g.fillStyle='rgba(232,238,236,.42)';g.fill();g.strokeStyle='rgba(150,165,168,.5)';g.lineWidth=1.2;g.stroke();
 g.beginPath();g.ellipse(cx,ft,fw,Math.max(3,fw*.12),0,0,7);g.fill();g.stroke();
 g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(cx-L.rw*.03,y+ph*2);g.bezierCurveTo(cx-L.rw*.02,y+(ft-y)*.5,cx-fw*.5,ft-(ft-y)*.15,cx-fw*.62,ft-3);g.stroke();
 g.beginPath();g.ellipse(cx,y+ph*.5,pw/2,ph*1.3,0,0,7);g.fillStyle='rgba(236,242,240,.55)';g.fill();g.strokeStyle='rgba(150,165,168,.6)';g.lineWidth=1.2;g.stroke();
 g.beginPath();g.ellipse(cx,y,pw/2*.97,ph*.9,0,0,7);g.strokeStyle='rgba(255,255,255,.9)';g.stroke()}

function drawCandle(now){const ch=L.rh*.46,a=M(.5,.035),b=M(.5,.45),ang=Math.atan2(a[0]-b[0],b[1]-a[1])*1.4,d=new Date();
 const fr=(d.getHours()*60+d.getMinutes()+d.getSeconds()/60)/1440,yb=.1*ch-ch*(1-.86*fr);
 const wx=yb<-.43*ch?Math.sqrt(Math.max(0,(.22*ch)**2-(yb+.65*ch)**2)):Math.sqrt(Math.max(0,(.26*ch)**2-(yb+.18*ch)**2));
 g.save();g.translate(a[0],a[1]);g.rotate(ang);g.save();g.beginPath();g.rect(-ch,yb,ch*2,ch*1.3);g.clip();
 const three=()=>{g.beginPath();g.arc(0,-.65*ch,.22*ch,200*D,450*D);g.stroke();g.beginPath();g.arc(0,-.18*ch,.26*ch,-90*D,160*D);g.stroke()};
 g.lineCap='round';g.lineWidth=ch*.19;g.strokeStyle='#d6566c';three();g.lineWidth=ch*.15;g.strokeStyle='#f3a3b0';three();
 g.lineWidth=ch*.03;g.strokeStyle='rgba(255,255,255,.7)';g.translate(-ch*.03,-ch*.02);three();g.restore();
 g.fillStyle='#f8c3ca';g.beginPath();g.ellipse(wx,yb,ch*.1,ch*.03,0,0,7);g.fill();
 g.strokeStyle='#f8c3ca';g.lineWidth=ch*.035;[[-.06,.08],[.05,.13]].forEach(([o,l])=>{g.beginPath();g.moveTo(wx+o*ch,yb);g.lineTo(wx+o*ch,yb+l*ch);g.stroke()});
 g.strokeStyle='#3a2a20';g.lineWidth=Math.max(1.5,ch*.02);g.beginPath();g.moveTo(wx,yb);g.lineTo(wx,yb-ch*.07);g.stroke();
 g.translate(wx,yb-ch*.07);g.rotate(-ang*.6+lean);const fl=1+Math.sin(now*.023)*.08+Math.sin(now*.041)*.05,fh=ch*.22*fl,fw=ch*.07;
 let gr=g.createRadialGradient(0,-fh*.5,0,0,-fh*.5,ch*.45);gr.addColorStop(0,'rgba(255,214,120,.35)');gr.addColorStop(1,'rgba(255,214,120,0)');g.fillStyle=gr;g.beginPath();g.arc(0,-fh*.5,ch*.45,0,7);g.fill();
 const flame=(h,w,c)=>{g.beginPath();g.moveTo(0,-h);g.bezierCurveTo(w,-h*.45,w*.9,0,0,0);g.bezierCurveTo(-w*.9,0,-w,-h*.45,0,-h);g.fillStyle=c;g.fill()};
 flame(fh,fw,'rgba(255,170,50,.92)');flame(fh*.62,fw*.6,'#fff6dc');g.restore()}

function drawRing(){const O=OUT.map(p=>M(p[0],p[1]));g.save();path(O);
 const gr=g.createLinearGradient(L.cx-L.rw/2,0,L.cx+L.rw/2,0);gr.addColorStop(0,'#fffbf2');gr.addColorStop(.45,CREAM);gr.addColorStop(1,'#e6d6b9');g.fillStyle=gr;g.fill();g.clip();
 for(const c of RC){path(c.pts.map(q=>M(q[0],q[1])));g.lineJoin='round';g.strokeStyle='rgba(214,228,246,.5)';g.lineWidth=L.rw*.018;g.stroke();
  g.strokeStyle=`rgba(${FILL[c.c]},.14)`;g.lineWidth=L.rw*.01;g.stroke();g.fillStyle=`rgba(${FILL[c.c]},.4)`;g.fill()}

 for(const f of FL){const s=Math.sin(f.th),pts=f.pts.map(q=>M(q[0],q[1]));g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));

  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]+L.rw*.02,p[1]):g.moveTo(p[0]+L.rw*.02,p[1]));g.strokeStyle='rgba(150,115,80,.09)';g.lineWidth=L.rw*.012;g.stroke()}
 const hp=M(.3,.22),hg=g.createRadialGradient(hp[0],hp[1],0,hp[0],hp[1],L.rw*.22);hg.addColorStop(0,'rgba(255,255,255,.75)');hg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=hg;g.fillRect(hp[0]-L.rw*.3,hp[1]-L.rw*.3,L.rw*.6,L.rw*.6);
 if(cutMark){const u=(cutMark.x-(L.cx-L.rw/2))/L.rw;g.beginPath();for(let v=0;v<=1;v+=.1){const p=M(u,v);v?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.strokeStyle=`rgba(170,130,100,${cutMark.a*.6})`;g.lineWidth=2;g.stroke()}
 g.restore();path(O);g.strokeStyle='rgba(190,160,125,.55)';g.lineWidth=1.2;g.stroke()}

 g.translate(s.x,s.y);g.rotate(s.tilt);g.scale(s.sz*s.fx*(1+s.q),-s.sz*(1-s.q));g.transform(1,0,s.sh,1,0,0);

 g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(-.2,.72,.22,.12,-.4,0,7);g.fill();g.restore();

function draw(now){g.setTransform(dpr,0,0,dpr,0,0);g.drawImage(bgc,0,0,W,H);
 const sxC=L.cx+L.rw*.3,syC=L.foot+Math.min(24,(H-L.foot)*.3);g.globalCompositeOperation='multiply';
 g.fillStyle='rgba(205,180,145,.35)';g.beginPath();g.ellipse(sxC+L.rw*.08,syC+6,L.rw*.62,Math.max(10,(H-L.foot)*.16),0,0,7);g.fill();
 for(const c of RC){const p=M(c.cu,c.cv),rx=L.cx-L.rw/2+c.cu*L.rw,ry=L.sy-L.rh+c.cv*L.rh;
  glow(sxC+(rx-L.cx)*.8+(1-c.cv)*L.rw*.18+(p[0]-rx)*2.8,syC+(1-c.cv)*Math.min(30,(H-syC)*.4)+(p[1]-ry)*.5,Math.sqrt(c.area)*L.rh*1.2,GLOW[c.c],.55)}
 for(const s of SL){if(s.phase==='fly')continue;for(const p of s.gl){const X=s.x+(p.cx+s.sh*p.cy)*s.sz*s.fx;glow(X+p.cy*s.sz*.7+s.sz*.25,s.y+3+p.cy*s.sz*.1,Math.sqrt(p.area)*s.sz*1.1,GLOW[p.c],.5)}}
 g.globalCompositeOperation='source-over';
 if(!K){const xe=L.cx-L.rw*.3-10,len=Math.min(L.rw*.6,xe-10),y=(L.cloth+L.foot)/2+6;if(len>30){g.save();g.fillStyle='rgba(120,90,60,.12)';g.fillRect(xe-len,y+3,len,4);
  g.translate(xe,y);g.rotate(-Math.PI/2);knifeShape(len*.64,Math.max(5,len*.07),len*.36);g.restore()}}
 drawStand();drawCandle(now);drawRing();
 const order=SL.filter(s=>s.phase!=='fly').sort((a,b)=>slotPos(a.slot).row-slotPos(b.slot).row);order.forEach(drawSlice);SL.filter(s=>s.phase==='fly').forEach(drawSlice);
 if(K){const bl=L.rh*1.25;g.save();g.translate(K.x+K.xo,K.tip);g.rotate(K.dir*.04);knifeShape(bl,Math.max(10,L.rw*.05),bl*.45);g.restore()}}

let last=performance.now();
function frame(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;update(dt,now);draw(now);requestAnimationFrame(frame)}
cv.addEventListener('pointermove',e=>{const now=performance.now(),dt=Math.max(8,now-P.t)/1000;if(P.in){P.vx=(e.clientX-P.x)/dt;P.vy=(e.clientY-P.y)/dt}
 P.x=e.clientX;P.y=e.clientY;P.t=now;P.in=true;if(Math.abs(P.vx)>400)lastAct=now});
cv.addEventListener('pointerdown',e=>{P.x=e.clientX;P.y=e.clientY;P.t=performance.now();P.in=true;cut()});
cv.addEventListener('pointerleave',()=>{P.in=false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '||e.key==='Enter'){e.preventDefault();cut()}});
