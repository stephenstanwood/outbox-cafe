  <meta name="outbox-spec-era" content="January 1897, right now — twenty past eight on a Friday evening in the lecture theatre of a subscription institute on Albemarle-adjacent ground, the gas turned down, a carbon arc lamp roaring on a stand at the left of a black-baize-covered table, a zinc tray of soap solution (water, oleate, and a third of glycerine, mixed on Tuesday and better for the keeping), and a rack of bent brass wire frames. The demonstration is running. Not a look-back at 'the great age of popular science' and not a 'nobody does public lectures like this now' lament — the arc is drawing badly, the room is warm, the films are draining faster than they did at rehearsal, and there are eleven frames still to get through before the interval.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the black-baize table seen dead-on and life-size, with a hard raking arc beam coming in from the left and nothing else in frame: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. Standing in the middle of it are brass wire frames carrying live soap films — a plain ring, a square, a bent cube, two rings pulled apart into a catenoid — and each film is a genuine draining liquid membrane whose colour is computed from its actual thickness. The visitor's entire vocabulary is the frame and the air: drag a frame bodily and the film sloshes, drains and re-orders its bands; pull the two rings of the catenoid apart with the cursor and the waist genuinely narrows until the surface can no longer exist and collapses; press and hold anywhere to blow a real jet of warm air across a film, which thins it locally, shoves colour bands sideways in visible Marangoni streaks, and will pop it if held; wheel to dip the whole frame back into the tray and start a fresh film. Films burst on their own schedule whether the visitor touches them or not, tearing open from the thinnest point at real speed and leaving a shivering rim of liquid that snaps back onto the wire.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of why a soap film has colours and why it stops having them before it breaks — that the colour is not pigment and not in the soap, it is interference between light reflected off the front surface and light reflected off the back surface, so the hue at any point on that film is nothing but a readout of its LOCAL THICKNESS in nanometres; that the film is therefore a live thickness map you are looking at directly, which is why a film hung vertically is a stack of horizontal bands and never a random wash — liquid drains downward under gravity and the top gets thinner than the bottom, continuously, so the bands crawl DOWN the film all evening and new ones are born at the top; that the band order is fixed by the arithmetic (twice thickness times refractive index against wavelength) and runs through a repeating sequence of orders — white, straw, amber, magenta, blue, green, yellow again — with each successive order less saturated than the last because more wavelengths start cancelling at once, so a thick film shows muddy pastel and only a thinning one shows clean colour; that the single most important fact about the whole thing is BLACK FILM: once the top of the film drains below about thirty nanometres, less than a quarter wavelength, the two reflections cancel almost perfectly and that region goes not white, not pale, but a deep true black that reads exactly like a hole in the wire — and black film is the last stage before rupture, so black is not absence but imminence; that the film survives at all because pulling on it locally raises surface tension there and hauls liquid back in, which is the elasticity a pure-water film hasn't got and the reason plain water cannot be blown into a bubble at any price; that this same effect makes a warm draught visible — heat lowers tension, liquid runs away from the warm patch, and the colour bands physically stream sideways ahead of the air; that rupture starts at one point and the hole opens at a genuine fixed speed set by tension against the film's own mass, so a thin film tears faster than a thick one and the retreating rim carries all the liquid with it in a visible thickening ring; that a catenoid between two rings is the actual minimal surface, and it exists only while the ring separation is less than about 1.33 times the ring diameter, past which no such surface is possible and it collapses instantly into two flat discs; and that a film's whole life here is about ninety seconds, and every second of it is spent getting thinner.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, RESTLESS and PRECARIOUS — bands of colour visibly racing downward, a black crown eating the top of every film within a minute, films letting go without warning and snapping back to the wire, the arc lamp hissing and flickering hard enough to make every colour jump, the brass warm, the whole table busy. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT fragile-and-precious, NOT slow, NOT soft-focus prettiness, NOT melancholy — this is a working demonstration at twenty past eight with eleven frames still to get through and the films draining faster than they should.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Black-baize table and unlit air as the ground (#0c0a0b), going to a hard sooty near-nothing outside the arc beam, with polished brass wire as the single held anchor (#c08a2e) carrying a hot specular streak where the arc catches it (#f6e0a4). Everything else is COMPUTED, not chosen: film colour is derived per-pixel from real thickness via thin-film interference, so it runs the honest Newton sequence — pale straw, amber, hot magenta, cyan-blue, sap green, degrading in saturation with each successive order into chalky pastel — and the thinnest regions resolve to a genuine dead black (#000000) indistinguishable from the baize behind them. Exactly one chip of arc-lamp violet-white (#e8ecff) is held strictly for the beam itself, the flicker, and the highlight on wet liquid running back down the wire. High contrast, transmissive, genuinely luminous where the film is lit and absolutely dead where it isn't; no ambient fill, no glow-bloom haze, no gradients other than the honest thickness field.">
  <meta name="outbox-spec-wildcard" content="One frame at the right of the table — a bent cube frame with a visible kink in the top-front edge where somebody has straightened it badly — carries a film that is already entirely black film across its whole span, and it stays that way forever: it never colours, never drains further, never bursts no matter how long it is blown on or how hard the frame is dragged, and reads permanently as a square hole cut in the picture with brass around it. It is never labelled, never explained, and it is in the same position with the same kink every visit.">
  <meta name="outbox-spec-forbidden" content="NO soap-film-as-metaphor for fragility / beauty-that-doesn't-last / the-brief-bright-life / a-world-in-a-bubble / childhood wonder / 'everything is temporary' — it is optical path difference, drainage, and thirty nanometres, and it has nothing to teach anybody. NO science-as-magic, NO wonder, NO awe, NO 'the miracle of the ordinary', NO gasping-audience register, NO Victorian-lecture whimsy and NO winking at gentlemen in frock coats. NO hushed, meditative, hypnotic, reverent or 'let the colours still you' register whatsoever, and NO ambient-visualiser or screensaver framing. NO nostalgia, NO wistfulness, NO 'nobody demonstrates anything by hand anymore / the great popular lectures are gone' decline narrative — there are eleven frames left before the interval. NO iridescence-as-luxury, NO oil-slick / holographic / opal / vaporwave / synthwave / late-internet-shimmer aesthetic drift, NO pastel-dreamscape softness. NO sensuous material writing about liquid or light beyond thickness, tension, speed and hue. NO melancholy, NO soft autumn, NO loneliness, NO cryptic-SCP or ominous dread about the permanently black film. NO archival / museum / cabinet / drawer / relic framing of the apparatus — it is on the table and in use this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — the room is warm, full and busy. NO signal / transmission / frequency / broadcast framing of the light. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the baize, the brass, the beam and the films, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
"use strict";
/* -------------------------------------------------------------
   thin film. 2 n t cos(theta) + lambda/2. n = 1.34.
   below ~30nm the two reflections cancel and it is black.
   black is not absence, it is the last thing before the hole.
------------------------------------------------------------- */
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,S=1; // S = scale (px per "table unit")
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
/* ---------- colour: integrate reflectance over sampled wavelengths ---------- */
var NW=24, LAM=[], XB=[],YB=[],ZB=[];
function gauss(x,m,s1,s2){var t=(x-m)/(x<m?s1:s2);return Math.exp(-0.5*t*t);}
for(var i=0;i<NW;i++){
  var l=390+(i+0.5)*(340/NW); LAM.push(l);
  XB.push(1.056*gauss(l,599.8,37.9,31.0)+0.362*gauss(l,442.0,16.0,26.7)-0.065*gauss(l,501.1,20.4,26.2));
  YB.push(0.821*gauss(l,568.8,46.9,40.5)+0.286*gauss(l,530.9,16.3,31.1));
  ZB.push(1.217*gauss(l,437.0,11.8,36.0)+0.681*gauss(l,459.0,26.0,13.8));
}
var YSUM=0;for(i=0;i<NW;i++)YSUM+=YB[i];
/* precomputed LUT: thickness 0..1600nm -> rgb */
var LUTN=1601, LUT=new Uint8Array(LUTN*3);
(function buildLUT(){
  var n=1.34, cosT=1.0;
  // amplitude reflectance at air/film (r1) and film/air (r2 = -r1); intensity R = 2r^2(1-cos d)
  var r=(1-n)/(1+n), R0=r*r;
  for(var t=0;t<LUTN;t++){
    var X=0,Y=0,Z=0;
    for(var k=0;k<NW;k++){
      var d=(4*Math.PI*n*t*cosT)/LAM[k]+Math.PI; // half-wave shift included
      var Rf=2*R0*(1-Math.cos(d))/(1+R0*R0-2*R0*Math.cos(d)); // Airy, both surfaces
      X+=Rf*XB[k];Y+=Rf*YB[k];Z+=Rf*ZB[k];
    }
    X/=YSUM;Y/=YSUM;Z/=YSUM;
    var g=6.6; X*=g;Y*=g;Z*=g;
    var rr= 3.2406*X-1.5372*Y-0.4986*Z;
    var gg=-0.9689*X+1.8758*Y+0.0415*Z;
    var bb= 0.0557*X-0.2040*Y+1.0570*Z;
    function enc(v){v=v<0?0:v;v=v>1?1:v;v=v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055;return (v*255)|0;}
    LUT[t*3]=enc(rr);LUT[t*3+1]=enc(gg);LUT[t*3+2]=enc(bb);
  }
})();
function lut(t,out){
  if(t<=0){out[0]=0;out[1]=0;out[2]=0;return;}
  var ti=t|0; if(ti>=LUTN-1){ti=LUTN-2;}
  var f=t-ti,a=ti*3,b=a+3;
  out[0]=LUT[a]+(LUT[b]-LUT[a])*f;
  out[1]=LUT[a+1]+(LUT[b+1]-LUT[a+1])*f;
  out[2]=LUT[a+2]+(LUT[b+2]-LUT[a+2])*f;
}
/* ---------- arc lamp: live, noisy, hissing ---------- */
var Arc={I:1,ct:1,ang:0,seed:Math.random()*1000,crack:0};
function n1(x){var s=Math.sin(x*127.1)*43758.5453;return s-Math.floor(s);}
function fbm(x){return n1(x)*0.5+n1(x*2.13+7.7)*0.28+n1(x*4.7+31.1)*0.14+n1(x*9.3+3.3)*0.08;}
function arcUpdate(T){
  var f=fbm(T*7.0+Arc.seed)*0.9+fbm(T*23.0)*0.35;
  Arc.I=0.72+0.42*f;
  if(Math.random()<0.012){Arc.crack=1;}
  Arc.crack*=0.86;
  Arc.I*=1+Arc.crack*0.55;
  if(Arc.I>1.65)Arc.I=1.65;
  Arc.ct=0.9+0.22*(fbm(T*3.1+11.0)-0.4);
  Arc.ang=-0.06+0.05*(fbm(T*1.7+4.0)-0.5);
}
/* ---------- audio ---------- */
var AC=null,master=null,hissG=null,blowG=null,started=false;
function audioStart(){
  if(started)return; started=true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    // arc hiss bed
    var len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1);
    var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3400;bp.Q.value=0.6;
    var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
    hissG=AC.createGain();hissG.gain.value=0.035;
    src.connect(bp);bp.connect(hp);hp.connect(hissG);hissG.connect(master);src.start();
    // blow bed
    var src2=AC.createBufferSource();src2.buffer=buf;src2.loop=true;
    var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.Q.value=0.9;
    blowG=AC.createGain();blowG.gain.value=0.0;
    src2.connect(lp);lp.connect(blowG);blowG.connect(master);src2.start();
  }catch(e){AC=null;}
}
function tick(freq,vol,dur){ // rupture tick, pitched by area
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='square';o.frequency.value=freq;
  f.type='bandpass';f.frequency.value=freq*1.6;f.Q.value=3;
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(f);f.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur+0.02);
  // noise burst of the rim snapping
  var L=(dur*AC.sampleRate)|0,b=AC.createBuffer(1,L,AC.sampleRate),dd=b.getChannelData(0);
  for(var i=0;i<L;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/L,3);
  var s=AC.createBufferSource();s.buffer=b;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
  var g2=AC.createGain();g2.gain.value=vol*0.9;
  s.connect(hp);hp.connect(g2);g2.connect(master);s.start();
}
function slither(dur,base){ // wet run down brass
  if(!AC)return;
  var L=(dur*AC.sampleRate)|0,b=AC.createBuffer(1,L,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.min(1,i/200)*Math.pow(1-i/L,1.4);
  var s=AC.createBufferSource();s.buffer=b;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=6;
  bp.frequency.setValueAtTime(base,AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(base*0.42,AC.currentTime+dur);
  var g=AC.createGain();g.gain.value=0.09;
  s.connect(bp);bp.connect(g);g.connect(master);s.start();
}
function drip(){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  var t0=AC.currentTime;
  o.frequency.setValueAtTime(760+Math.random()*380,t0);
  o.frequency.exponentialRampToValueAtTime(210,t0+0.09);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.055,t0+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
  o.connect(g);g.connect(master);o.start();o.stop(t0+0.2);
}
/* ---------- frames ---------- */
/* kinds: ring, square, cube, catenoid, blackcube(wildcard) */
var frames=[],drops=[],lastT=0,nextDrip=1.5;
function makeField(cols,rows){
  return {c:cols,r:rows,t:new Float32Array(cols*rows),m:new Uint8Array(cols*rows)};
}
function Frame(kind,fx,fy,fw,fh){
  this.kind=kind;this.fx=fx;this.fy=fy;this.fw=fw;this.fh=fh;
  this.vx=0;this.vy=0;this.grabbed=false;
  this.sep=0.6; this.sepT=0.6; // catenoid ratio (sep / diameter)
  this.age=0;this.alive=true;this.hole=null;
  this.kink=(kind==='blackcube');
  this.cols=44;this.rows=64;
  this.f=makeField(this.cols,this.rows);
  this.dip();
}
Frame.prototype.dip=function(){
  var f=this.f,c=f.c,r=f.r;
  this.alive=true;this.age=0;this.hole=null;this.rim=0;
  for(var y=0;y<r;y++)for(var x=0;x<c;x++){
    var i=y*c+x;
    var base=880+Math.random()*70+ (y/r)*160;
    f.t[i]=base;
  }
  this.mask();
  if(this.kind==='blackcube'){ for(var i2=0;i2<c*r;i2++) f.t[i2]=0; }
  slither(0.5,900+Math.random()*400);
};
Frame.prototype.mask=function(){
  var f=this.f,c=f.c,r=f.r;
  for(var y=0;y<r;y++)for(var x=0;x<c;x++){
    var u=(x+0.5)/c*2-1, v=(y+0.5)/r*2-1, i=y*c+x, in_=0;
    switch(this.kind){
      case 'ring': in_=(u*u+v*v<0.93)?1:0;break;
      case 'square': in_=(Math.abs(u)<0.9&&Math.abs(v)<0.9)?1:0;break;
      case 'cube': case 'blackcube': in_=(Math.abs(u)<0.88&&Math.abs(v)<0.88)?1:0;break;
      case 'catenoid':{
        var yy=(y+0.5)/r; // 0 top ring .. 1 bottom ring
        var w=this.catWidth(yy);
        in_=(Math.abs(u)<w)?1:0;
        break;}
    }
    f.m[i]=in_;
    if(!in_)f.t[i]=0;
  }
};
/* catenoid: r(z) = a cosh((z - z0)/a). solve a for given half-separation h, ring radius 1 */
Frame.prototype.solveA=function(){
  var h=this.sep*0.5; // half separation in ring-radius units (ring radius = 1)
  // solve cosh(h/a) = 1/a  -> find largest root
  var lo=0.001,hi=1.6,a=0,found=false;
  // f(a) = a*cosh(h/a) - 1 ; want zero, upper branch
  var fa=function(a){return a*Math.cosh(h/a)-1;};
  // scan
  var prev=fa(hi),pa=hi;
  for(var s=hi;s>0.02;s-=0.01){
    var v=fa(s);
    if(prev<=0&&v>=0||prev>=0&&v<=0){
      var L=s,R=pa;
      for(var k=0;k<40;k++){var mm=(L+R)/2;if(fa(mm)*fa(L)<=0)R=mm;else L=mm;}
      a=(L+R)/2;found=true;break;
    }
    prev=v;pa=s;
  }
  return found?a:0;
};
Frame.prototype.catWidth=function(yy){
  var a=this.aSolved||0.5;
  if(a<=0)return 0;
  var h=this.sep*0.5;
  var z=(yy-0.5)*2*h;
  var w=a*Math.cosh(z/a);
  return Math.min(1,w)*0.96;
};
/* ---------- layout ---------- */
function layout(){
  var minD=Math.min(W,H);
  var portrait=H>W*1.05;
  var base=portrait?Math.min(W*0.30,150):Math.min(minD*0.24,190);
  var defs;
  if(portrait){
    defs=[
      ['ring',      0.27,0.16, base*1.0, base*1.0],
      ['square',    0.72,0.20, base*0.92,base*0.92],
      ['catenoid',  0.30,0.50, base*0.86,base*1.05],
      ['cube',      0.70,0.55, base*0.86,base*0.86],
      ['blackcube', 0.50,0.84, base*0.82,base*0.82]
    ];
  }else{
    defs=[
      ['ring',      0.24,0.40, base*1.05,base*1.05],
      ['square',    0.42,0.66, base*0.86,base*0.86],
      ['catenoid',  0.47,0.30, base*0.82,base*1.10],
      ['cube',      0.66,0.55, base*0.92,base*0.92],
      ['blackcube', 0.855,0.42,base*0.80,base*0.80]
    ];
  }
  if(frames.length===0){
    for(var i=0;i<defs.length;i++){
      var d=defs[i];
      frames.push(new Frame(d[0],d[1]*W,d[2]*H,d[3],d[4]));
    }
  }else{
    for(var j=0;j<frames.length;j++){
      var d2=defs[j];
      frames[j].fx=d2[1]*W;frames[j].fy=d2[2]*H;frames[j].fw=d2[3];frames[j].fh=d2[4];
    }
  }
}
/* ---------- pointer ---------- */
var P={x:-999,y:-999,down:false,dragging:null,ox:0,oy:0,blowT:0,catGrab:0};
function pos(e){
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX,y:t.clientY};
}
function hitFrame(x,y){
  for(var i=frames.length-1;i>=0;i--){
    var f=frames[i];
    if(x>f.fx-f.fw*0.62&&x<f.fx+f.fw*0.62&&y>f.fy-f.fh*0.62&&y<f.fy+f.fh*0.62)return f;
  }
  return null;
}
function down(e){
  audioStart(); if(AC&&AC.state==='suspended')AC.resume();
  var p=pos(e);P.x=p.x;P.y=p.y;P.down=true;P.blowT=0;
  var f=hitFrame(p.x,p.y);
  if(f){
    if(f.kind==='catenoid'){
      // near top/bottom edge? then pull rings apart
      var dy=(p.y-f.fy)/(f.fh*0.5);
      if(Math.abs(dy)>0.55){P.catGrab=dy>0?1:-1;P.dragging=f;f.grabbed=true;P.ox=p.x-f.fx;P.oy=p.y-f.fy;return;}
    }
    P.catGrab=0;P.dragging=f;f.grabbed=true;P.ox=p.x-f.fx;P.oy=p.y-f.fy;
  }
  if(e.cancelable)e.preventDefault();
}
function move(e){
  var p=pos(e);
  if(P.down&&P.dragging){
    var f=P.dragging;
    if(f.kind==='catenoid'&&P.catGrab!==0){
      var nd=Math.abs(p.y-f.fy)*2/ (f.fw*0.9);
      f.sepT=Math.max(0.12,Math.min(1.85,nd));
    }else{
      var nx=p.x-P.ox, ny=p.y-P.oy;
      f.vx=(nx-f.fx)*0.6;f.vy=(ny-f.fy)*0.6;
      f.fx=Math.max(f.fw*0.5,Math.min(W-f.fw*0.5,nx));
      f.fy=Math.max(f.fh*0.5,Math.min(H-f.fh*0.5,ny));
    }
  }
  P.x=p.x;P.y=p.y;
  if(e.cancelable&&P.down)e.preventDefault();
}
function up(){
  P.down=false;
  if(P.dragging)P.dragging.grabbed=false;
  P.dragging=null;P.catGrab=0;P.blowT=0;
  if(blowG&&AC)blowG.gain.setTargetAtTime(0.0,AC.currentTime,0.06);
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);
window.addEventListener('wheel',function(e){
  audioStart();
  var f=hitFrame(P.x,P.y)||hitFrame(e.clientX,e.clientY);
  if(f&&f.kind!=='blackcube'){f.dip();}
  else if(!f){ for(var i=0;i<frames.length;i++) if(frames[i].kind!=='blackcube'&&!frames[i].alive)frames[i].dip(); }
},{passive:true});
/* ---------- simulation ---------- */
function step(f,dt,T){
  if(f.kind==='blackcube'){ f.age+=dt; return; }
  if(!f.alive){
    f.rim+=dt*f.rimV;
    if(f.rim>1.35){ // fully retracted; auto re-dip after a beat
      if(f.redipAt===undefined)f.redipAt=T+0.7+Math.random()*1.6;
      if(T>f.redipAt){f.redipAt=undefined;f.dip();}
    }
    return;
  }
  f.age+=dt;
  var fl=f.f,c=fl.c,r=fl.r,t=fl.t,m=fl.m;
  var cellH=f.fh/r;
  // gravitational drainage: flux ~ t^3 (Poiseuille in the film), downward
  var k=dt*2.0e-6*(3600/ (cellH*cellH+1) + 22);
  var newT=f.tmp||(f.tmp=new Float32Array(c*r));
  newT.set(t);
  for(var y=r-1;y>=1;y--){
    for(var x=0;x<c;x++){
      var i=y*c+x, up_=i-c;
      if(!m[i]||!m[up_])continue;
      var tu=t[up_];
      var q=k*tu*tu*tu*0.000001*3200;
      if(q>tu*0.32)q=tu*0.32;
      newT[up_]-=q; newT[i]+=q;
    }
  }
  // bottom row loses to the wire (drains onto brass and runs off)
  for(var x2=0;x2<c;x2++){
    var ib=(r-1)*c+x2;
    if(m[ib]){ var loss=newT[ib]*dt*0.55; newT[ib]-=loss; }
  }
  // sloshing from frame motion: lateral advection of thickness
  var sh=(f.vx)*dt*0.5;
  if(Math.abs(f.vx)>2||Math.abs(f.vy)>2){
    var sx=Math.max(-2,Math.min(2, -f.vx*0.03));
    var sy=Math.max(-2,Math.min(2, -f.vy*0.02));
    for(var y3=0;y3<r;y3++)for(var x3=0;x3<c;x3++){
      var i3=y3*c+x3; if(!m[i3])continue;
      var qx=Math.round(x3+sx),qy=Math.round(y3+sy);
      if(qx<0)qx=0;if(qx>=c)qx=c-1;if(qy<0)qy=0;if(qy>=r)qy=r-1;
      var j3=qy*c+qx;
      if(m[j3]) newT[i3]=newT[i3]*0.82+t[j3]*0.18;
    }
  }
  f.vx*=Math.pow(0.02,dt);f.vy*=Math.pow(0.02,dt);
  // Marangoni: warm jet from held cursor
  if(P.down&&!P.dragging){
    var lx=(P.x-(f.fx-f.fw/2))/f.fw*c;
    var ly=(P.y-(f.fy-f.fh/2))/f.fh*r;
    if(lx>-6&&lx<c+6&&ly>-6&&ly<r+6){
      P.blowT+=dt;
      var rad=5.5, str=dt*430*(1+P.blowT*0.5);
      for(var y4=0;y4<r;y4++)for(var x4=0;x4<c;x4++){
        var i4=y4*c+x4;if(!m[i4])continue;
        var dx=x4-lx,dy4=y4-ly,d2=dx*dx+dy4*dy4;
        if(d2>rad*rad*4)continue;
        var g=Math.exp(-d2/(rad*rad));
        // surface tension drops where warm -> liquid pulled toward cold: push out along gradient
        var pull=str*g;
        var take=Math.min(newT[i4]*0.5,pull);
        newT[i4]-=take;
        // deposit ahead of the draught (down-gradient, outward)
        var len=Math.sqrt(d2)+0.001;
        var ox=Math.round(x4+dx/len*3.2), oy=Math.round(y4+dy4/len*3.2);
        if(ox<0)ox=0;if(ox>=c)ox=c-1;if(oy<0)oy=0;if(oy>=r)oy=r-1;
        var o=oy*c+ox; if(m[o]) newT[o]+=take*0.9;
      }
      if(blowG&&AC)blowG.gain.setTargetAtTime(0.09,AC.currentTime,0.08);
    }
  }
  // gentle lateral smoothing (surface elasticity hauling liquid back)
  var sm=f.tmp2||(f.tmp2=new Float32Array(c*r));
  sm.set(newT);
  for(var y5=0;y5<r;y5++)for(var x5=1;x5<c-1;x5++){
    var i5=y5*c+x5;if(!m[i5])continue;
    var a=m[i5-1]?newT[i5-1]:newT[i5], b=m[i5+1]?newT[i5+1]:newT[i5];
    sm[i5]=newT[i5]*0.86+(a+b)*0.07;
  }
  t.set(sm);
  for(var i6=0;i6<c*r;i6++){ if(!m[i6])t[i6]=0; else if(t[i6]<0)t[i6]=0; }
  // rupture: any cell below critical, stochastic
  var thinnest=1e9,ti=-1;
  for(var i7=0;i7<c*r;i7++){ if(m[i7]&&t[i7]<thinnest){thinnest=t[i7];ti=i7;} }
  f.thinnest=thinnest;
  if(ti>=0){
    var crit=11+Math.random()*4;
    var p=0;
    if(thinnest<crit) p=1;
    else if(thinnest<30) p=dt*(30-thinnest)*0.16;
    if(P.down&&!P.dragging&&thinnest<46)p+=dt*0.5;
    if(Math.random()<p) rupture(f,ti%c,(ti/c)|0);
  }
}
function rupture(f,hx,hy){
  f.alive=false;
  f.hole={x:hx/f.f.c,y:hy/f.f.r};
  f.rim=0;
  // Taylor-Culick: v = sqrt(2 sigma / rho h). sigma ~ 0.03 N/m, rho 1000.
  var h=Math.max(8,f.thinnest||30)*1e-9;
  var v=Math.sqrt(2*0.030/(1000*h)); // m/s, ~ 14 m/s at 30nm
  var span=f.fw/900; // pretend metres
  f.rimV=Math.max(1.6,Math.min(11, v*0.02/Math.max(0.06,span)));
  var area=f.fw*f.fh;
  tick(2600-Math.min(1700,area*0.9)+Math.random()*180, 0.16, 0.09+area/280000);
  // droplets run down the wire
  for(var i=0;i<5+Math.random()*5;i++){
    drops.push({x:f.fx+(Math.random()-0.5)*f.fw*0.9, y:f.fy+f.fh*0.42+Math.random()*8,
                vy:10+Math.random()*40, life:1.0, t:220+Math.random()*700});
  }
  slither(0.42,1500+Math.random()*700);
}
/* ---------- render ---------- */
var imgCache={};
function drawFilm(f,T){
  var c=f.f.c,r=f.f.r,t=f.f.t,m=f.f.m;
  var key=c+'x'+r;
  var im=imgCache[key];
  if(!im){im=imgCache[key]=ctx.createImageData(c,r);}
  var d=im.data,o=[0,0,0];
  var gain=Arc.I;
  var hole=f.hole,rim=f.rim||0;
  for(var y=0;y<r;y++){
    for(var x=0;x<c;x++){
      var i=y*c+x,p=i*4;
      if(!m[i]){d[p]=0;d[p+1]=0;d[p+2]=0;d[p+3]=0;continue;}
      var th=t[i];
      if(hole){
        var dx=(x/c-hole.x)*1.0,dy=(y/r-hole.y)*(f.fh/f.fw);
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<rim){d[p+3]=0;continue;}
        if(dist<rim+0.055){ // retreating rim: all swept liquid piled up here
          var q=1-(dist-rim)/0.055;
          th=th+q*q*760;
        }
      }
      lut(th,o);
      // raking beam from the left: brighter on the left of each frame, plus lamp flicker
      var lightx=1.18-0.42*(x/c)+0.10*Math.sin((y/r)*3.0+T*0.6);
      var g2=gain*lightx;
      var rr=o[0]*g2, gg=o[1]*g2*(0.99+0.02*Arc.ct), bb=o[2]*g2*(0.94+0.14*Arc.ct);
      d[p]=rr>255?255:rr;d[p+1]=gg>255?255:gg;d[p+2]=bb>255?255:bb;
      d[p+3]=255;
    }
  }
  ctx.putImageData(im,0,0,0,0,0,0); // ensure imagedata dims valid (no-op draw at 0)
  // scale up via offscreen
  var oc=f.oc;
  if(!oc){oc=f.oc=document.createElement('canvas');oc.width=c;oc.height=r;f.octx=oc.getContext('2d');}
  f.octx.putImageData(im,0,0);
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(oc, f.fx-f.fw/2, f.fy-f.fh/2, f.fw, f.fh);
  ctx.restore();
}
function brass(f,T){
  var x=f.fx,y=f.fy,w=f.fw,h=f.fh;
  var lw=Math.max(2.2,Math.min(5,w*0.028));
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  var hot='rgba(246,224,164,'+(0.55+0.35*Math.min(1,Arc.I-0.4))+')';
  function stroke(path,widen){
    ctx.lineWidth=lw*(widen||1);
    ctx.strokeStyle='#c08a2e';ctx.stroke(path);
    // hot specular streak on the arc-facing (left) side
    ctx.save();
    ctx.lineWidth=lw*0.42*(widen||1);
    ctx.strokeStyle=hot;
    ctx.translate(-lw*0.30,-lw*0.22);
    ctx.stroke(path);
    ctx.restore();
    // dark far side
    ctx.save();
    ctx.lineWidth=lw*0.30*(widen||1);
    ctx.strokeStyle='rgba(28,18,6,0.75)';
    ctx.translate(lw*0.34,lw*0.26);
    ctx.stroke(path);
    ctx.restore();
  }
  var pth=new Path2D();
  if(f.kind==='ring'){
    pth.ellipse(x,y,w*0.485,h*0.485,0,0,Math.PI*2);
    // stem down to the handle
    pth.moveTo(x,y+h*0.485);pth.lineTo(x+3,y+h*0.485+h*0.30);
  }else if(f.kind==='square'){
    var a=w*0.455,b=h*0.455;
    pth.moveTo(x-a,y-b);pth.lineTo(x+a,y-b);pth.lineTo(x+a,y+b);pth.lineTo(x-a,y+b);pth.closePath();
    pth.moveTo(x,y+b);pth.lineTo(x-2,y+b+h*0.28);
  }else if(f.kind==='cube'||f.kind==='blackcube'){
    var a2=w*0.44,b2=h*0.44,off=w*0.20;
    // front face
    pth.moveTo(x-a2,y-b2);
    if(f.kink){ // somebody straightened the top-front edge badly
      pth.lineTo(x-a2*0.18,y-b2-2.5);
      pth.lineTo(x+a2*0.16,y-b2+3.2);
      pth.lineTo(x+a2,y-b2);
    } else pth.lineTo(x+a2,y-b2);
    pth.lineTo(x+a2,y+b2);pth.lineTo(x-a2,y+b2);pth.closePath();
    // back face + struts
    pth.moveTo(x-a2+off,y-b2-off*0.62);pth.lineTo(x+a2+off,y-b2-off*0.62);
    pth.lineTo(x+a2+off,y+b2-off*0.62);
    pth.moveTo(x-a2,y-b2);pth.lineTo(x-a2+off,y-b2-off*0.62);
    pth.moveTo(x+a2,y-b2);pth.lineTo(x+a2+off,y-b2-off*0.62);
    pth.moveTo(x+a2,y+b2);pth.lineTo(x+a2+off,y+b2-off*0.62);
    pth.moveTo(x,y+b2);pth.lineTo(x-2,y+b2+h*0.26);
  }else if(f.kind==='catenoid'){
    var rw=w*0.46, hh=f.fh*0.5;
    pth.ellipse(x,y-hh,rw,rw*0.24,0,0,Math.PI*2);
    pth.moveTo(x+rw,y+hh);
    pth.ellipse(x,y+hh,rw,rw*0.24,0,0,Math.PI*2);
    pth.moveTo(x,y-hh-rw*0.24);pth.lineTo(x,y-hh-h*0.16);
  }
  stroke(pth);
  ctx.restore();
}
function drawCatenoidFilm(f,T){
  if(!f.alive){return;}
  var c=f.f.c,r=f.f.r;
  drawFilm(f,T);
}
/* ---------- main loop ---------- */
var t0=performance.now()/1000;
function loop(now){
  var T=now/1000-t0;
  var dt=Math.min(0.05,T-lastT);if(dt<=0)dt=0.016;lastT=T;
  arcUpdate(T);
  if(hissG&&AC) hissG.gain.value=0.026+0.028*Math.max(0,Arc.I-0.7);
  // baize
  ctx.fillStyle='#0c0a0b';ctx.fillRect(0,0,W,H);
  // raking beam: a hard wedge in from the left, no bloom
  var bx=W*0.02, spread=W*1.25;
  var g=ctx.createLinearGradient(0,H*0.30,W*0.92,H*0.72);
  var bi=0.055+0.05*(Arc.I-0.7);
  g.addColorStop(0,'rgba(232,236,255,'+(0.16*Arc.I).toFixed(3)+')');
  g.addColorStop(0.14,'rgba(232,236,255,'+Math.max(0,bi).toFixed(3)+')');
  g.addColorStop(0.55,'rgba(210,200,190,0.018)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.translate(0,H*0.5);ctx.rotate(Arc.ang);ctx.translate(0,-H*0.5);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-10,H*0.26);ctx.lineTo(W+40,H*0.02);ctx.lineTo(W+40,H*1.02);ctx.lineTo(-10,H*0.74);ctx.closePath();
  ctx.fill();
  ctx.restore();
  // arc source flare at far left edge
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var fr=ctx.createRadialGradient(-W*0.02,H*0.46,0,-W*0.02,H*0.46,W*0.16);
  fr.addColorStop(0,'rgba(232,236,255,'+(0.55*Arc.I).toFixed(3)+')');
  fr.addColorStop(0.35,'rgba(232,236,255,'+(0.09*Arc.I).toFixed(3)+')');
  fr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fr;ctx.fillRect(-W*0.2,H*0.46-W*0.2,W*0.42,W*0.42);
  ctx.restore();
  // catenoid geometry solve
  for(var i=0;i<frames.length;i++){
    var f=frames[i];
    if(f.kind==='catenoid'){
      f.sep+= (f.sepT-f.sep)*Math.min(1,dt*9);
      var prevA=f.aSolved;
      f.aSolved=f.solveA();
      // 1.325 ratio: past it no surface exists
      if(f.sep>1.3247||f.aSolved<=0){
        if(f.alive){ rupture(f, (f.f.c*0.5)|0, (f.f.r*0.5)|0); f.collapsed=true; }
        f.aSolved=0.0001;
      }else{
        if(f.collapsed&&f.sep<1.20){f.collapsed=false;f.dip();}
      }
      f.mask();
    }
    step(f,dt,T);
  }
  // films first
  for(i=0;i<frames.length;i++){
    var fr2=frames[i];
    if(fr2.kind==='blackcube'){
      // permanently black film: a square hole cut in the picture.
      ctx.save();
      ctx.fillStyle='#000000';
      var a=fr2.fw*0.44,b=fr2.fh*0.44;
      ctx.fillRect(fr2.fx-a,fr2.fy-b,a*2,b*2);
      ctx.restore();
      continue;
    }
    drawFilm(fr2,T);
  }
  // brass over films
  for(i=0;i<frames.length;i++) brass(frames[i],T);
  // droplets running down the wire / into the tray
  ctx.save();
  for(i=drops.length-1;i>=0;i--){
    var d=drops[i];
    d.vy+=520*dt; d.y+=d.vy*dt; d.life-=dt*0.32;
    var o=[0,0,0];lut(d.t,o);
    var al=Math.max(0,Math.min(1,d.life));
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba('+(o[0]|0)+','+(o[1]|0)+','+(o[2]|0)+','+al+')';
    ctx.beginPath();ctx.ellipse(d.x,d.y,1.9,3.4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(232,236,255,'+(al*0.5*Arc.I).toFixed(3)+')';
    ctx.beginPath();ctx.ellipse(d.x-0.7,d.y-1.0,0.7,1.1,0,0,Math.PI*2);ctx.fill();
    if(d.y>H+12||d.life<=0){
      if(d.y>H*0.86&&Math.random()<0.5)drip();
      drops.splice(i,1);
    }
  }
  ctx.restore();
  // zinc tray at the foot of the beam — a low bright edge, nothing more
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var tg=ctx.createLinearGradient(0,H-Math.min(70,H*0.10),0,H);
  tg.addColorStop(0,'rgba(0,0,0,0)');
  tg.addColorStop(0.6,'rgba(150,158,170,'+(0.035*Arc.I).toFixed(3)+')');
  tg.addColorStop(1,'rgba(200,210,225,'+(0.085*Arc.I).toFixed(3)+')');
  ctx.fillStyle=tg;ctx.fillRect(0,H-Math.min(70,H*0.10),W,Math.min(70,H*0.10));
  ctx.restore();
  // faint drip on real intervals
  nextDrip-=dt;
  if(nextDrip<=0){ drip(); nextDrip=1.4+Math.random()*3.4; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
/* the top of every film is thirty nanometres inside a minute. that is all black film is. */
console.log('%c2 n t  ·  n = 1.34  ·  black below ~30 nm  ·  Taylor–Culick rim carries every drop it sweeps','color:#c08a2e;font:12px Georgia,serif');
console.log('%ccatenoid exists only while separation < 1.3247 × ring diameter. eleven frames left.','color:#7a6640;font:11px Georgia,serif');
})();
