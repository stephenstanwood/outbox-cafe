  <meta name="outbox-spec-era" content="1937, right now — twenty past eleven on a hot, hard-lit Tuesday morning in the drying yard behind a hand-block textile printing works at Sanganer, outside Jaipur, where two hundred metres of freshly printed cotton have been pegged out flat on gravel in full sun and are being watered off, and the sun is doing the actual chemistry. Not a look-back at 'the old block printers' and not a lament for anything — the cloth is on the ground this minute, the sun is at its worst, and the wash tank is running.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one length of printed cotton pegged flat on bright gravel, seen from directly overhead and life-size: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The cloth carries a live hand-block repeat, printed block by block in real time by an unseen hand — a wooden block descends, presses, lifts, walks one repeat sideways, presses again, with genuine registration error accumulating along the run so the pattern drifts and doubles at the joins exactly like a hand-printed piece does. The visitor's only vocabulary is water and sun: drag anywhere to drag a wet sheet of water across the cloth (a real advancing wetting front that darkens the weave, spreads by capillary action along the warp faster than the weft, and carries loose pigment forward into bleeds), and hold still anywhere to let the sun work on that patch — a live per-pixel exposure field where dyes that need light genuinely deepen and dyes that don't genuinely bleach, at different rates. The piece IS the cloth changing colour under a sun the visitor can't turn off.">
  <meta name="outbox-spec-subject" content="The plain physical business of sun-drying and washing-off a block-printed cotton — that the colour that comes off the block is not the colour the cloth ends up, because the printed paste is mostly thickener and mordant and the dye reaction happens afterward in water and light; that madder-mordanted areas come off the block a dull ochre-grey and only go red once the loose paste is washed away and the sun has had a few hours at them, while indigo-resist areas come off the block as pale wax-white and stay that way; that the fugitive yellows bleach measurably in the same sun that's fixing the reds, so every minute on the gravel is simultaneously improving one colour and destroying another and the whole job is knowing when to lift; that the cloth is laid on gravel rather than grass because gravel dries the underside and grass wicks and stains; that water travels along the warp threads roughly twice as fast as across the weft, so every wet patch spreads as an ellipse and not a circle, and a printer can tell warp from weft at ten paces by watching a splash; that pigment carried in a moving wetting front piles up at the edge where evaporation is fastest — the same reason a spilled cup leaves a ring — and a patch dried too slowly leaves hard tidal edges through the middle of a motif; that the block walks by eye against a pricked registration dot and the error is cumulative, so a hundred-repeat run drifts and the drift shows worst on the fine outline block laid down last; and the flat arithmetic that a black outline block laid over a red field must sit within about a sixteenth of an inch or the whole piece reads as blurred. Literally paste, mordant, gravel, capillary action, and how long you leave it out.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the cloth, the water and the light, and that register is GLARING, WET, BUSY and CHEMICAL — a flat overhead sun with no modelling in it, gravel blowing out white at the edges, water arriving in hard sheets and darkening the weave instantly, colour changing at a speed you can genuinely watch. Everything happens at working speed with a yard full of cloth still to do. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow, NOT reverent, NOT wistful — this is a hot yard at twenty past eleven with the sun working against you as much as for you.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Bleached gravel white-grey (#dcd6c6) with hard-edged pebble shadow (#8b8375) as the ground of the whole piece, and the cloth an unbleached cotton cream (#f0e7d2) whose wet state renders honestly darker and more transparent (#c9bda1). The two working dye anchors are Sanganeri madder red (#a8322a) — which genuinely arrives over time rather than being present at load — and indigo-resist blue (#25436f), with a fugitive turmeric yellow (#d9a72b) that measurably bleaches toward a pale straw (#e5d9a8) under sustained exposure. Exactly one chip of iron-black outline (#241f1d) is held strictly for the fine outline block. Flat, hard, high-contrast, no glow, no bloom, no gradients except the honest wetting fronts and tidal edges — cloth on gravel photographed straight down in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="One repeat near the middle of the run is printed with the wrong colour block — a motif that should be madder is laid in indigo, quietly and correctly, with perfect registration. It develops, wets, bleeds and behaves exactly like every other motif and is never marked, never flagged, never corrected, and appears in the same position on the cloth every visit.">
  <meta name="outbox-spec-forbidden" content="NO textile-as-metaphor for tradition / heritage / patient handwork / 'the slow arts' / what-the-hands-remember — it is paste, mordant, gravel and capillary action, and it has nothing to teach anybody. NO orientalising or travelogue register of any kind: no spice-and-marigold colour writing, no 'ancient craft', no explaining India to an outsider, no sacred-artisan reverence, no saffron-light lyricism. NO nostalgia, NO wistfulness, NO 'the mills killed hand printing / the last block carvers / a vanishing craft' decline narrative — there is a yard full of cloth on the ground this minute. NO sensuous material-porn about fabric or colour beyond hue, value, saturation and wetness. NO meditative / hypnotic / 'let the slow spread still you' register. NO cryptic-SCP or ominous dread about the wrong-colour repeat. NO archival / museum / cabinet / drawer / textile-collection framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is a glaring late-morning sun. NO signal / transmission / frequency framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the cloth, the gravel and the water, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<style>

  #yard{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;}
  /* the gravel blows out white at the frame edge because the sun is straight overhead */
  #edge{position:fixed;inset:0;pointer-events:none;
    box-shadow: inset 0 0 0 0 rgba(255,255,255,0);}
  a.away{position:fixed;right:6px;bottom:4px;font:9px/1 monospace;color:#8b8375;
    opacity:.35;text-decoration:none;letter-spacing:.08em;}

<body>
<canvas id="yard"></canvas>
<div id="edge"></div>
<a class="away" href="/archive">·&nbsp;·&nbsp;·</a>
<script>
/* gravel dries the underside. grass wicks and stains. that is the whole reason. */
(function(){
"use strict";

var cv=document.getElementById('yard'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;

/* ---------- simulation grid ---------- */
var GW=0,GH=0,CELL=6;           // cell size in css px
var sat,satN,pig,pigN,expo;     // saturation, loose pigment, cumulative exposure
var cloth;                      // per-cell dye record

/* dye ids */
var GROUND=0, MADDER=1, TURMERIC=2, INDIGO=3, IRON=4, RESIST=5;

/* palette */
function px(r,g,b){return [r,g,b];}
var C_GRAVEL   = px(220,214,198);
var C_PEBBLE   = px(139,131,117);
var C_CLOTH    = px(240,231,210);
var C_CLOTHWET = px(201,189,161);
var C_MADDER   = px(168,50,42);
var C_MADRAW   = px(150,140,118);  /* what actually comes off the block: dull ochre-grey paste */
var C_TURM     = px(217,167,43);
var C_STRAW    = px(229,217,168);
var C_INDIGO   = px(37,67,111);
var C_IRON     = px(36,31,29);

/* ---------- deterministic prng so the yard is the same yard every visit ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

/* ---------- gravel underneath ---------- */
var gravelCanvas=document.createElement('canvas');
function makeGravel(w,h){
  gravelCanvas.width=w;gravelCanvas.height=h;
  var g=gravelCanvas.getContext('2d');
  g.fillStyle='rgb(220,214,198)';g.fillRect(0,0,w,h);
  var r=mulberry(99117);
  var n=Math.floor(w*h/260);
  for(var i=0;i<n;i++){
    var x=r()*w,y=r()*h,rad=1+r()*3.4;
    var v=r();
    // hard-edged pebble: bright top, hard shadow. no gradients, sun is vertical.
    g.fillStyle='rgba(139,131,117,'+(0.16+v*0.5)+')';
    g.beginPath();g.arc(x+rad*0.35,y+rad*0.4,rad,0,6.2832);g.fill();
    g.fillStyle='rgba(252,250,244,'+(0.35+v*0.5)+')';
    g.beginPath();g.arc(x,y,rad*0.85,0,6.2832);g.fill();
  }
  // blown-out light at the frame edges
  var gr=g.createLinearGradient(0,0,0,h);
  g.globalAlpha=0.5;
  g.fillStyle='rgb(255,253,247)';
  g.fillRect(0,0,w,Math.max(8,h*0.05));
  g.fillRect(0,h-Math.max(8,h*0.05),w,Math.max(8,h*0.05));
  g.globalAlpha=1;
}

/* ---------- the block-walk: lay the run down repeat by repeat ---------- */
/* motif cells get pushed into a queue; a routine stamps them at working speed. */
var stampQueue=[],stampIdx=0;
var repeatW=0,repeatH=0,repeats=0;

function buildRun(){
  stampQueue=[];stampIdx=0;
  var rnd=mulberry(4413);
  repeatW=Math.max(9,Math.round(78/CELL));      // one repeat ≈ 78 css px
  repeatH=Math.max(9,Math.round(78/CELL));
  var cols=Math.ceil(GW/repeatW)+1;
  var rows=Math.ceil(GH/repeatH)+1;
  repeats=cols*rows;

  // registration error accumulates as a random walk along the run
  var errX=0,errY=0;
  var wrongIdx=Math.floor(cols*rows*0.5)+Math.floor(cols*0.5); // the one repeat done in the wrong block
  var k=0;
  for(var ry=0;ry<rows;ry++){
    for(var cx=0;cx<cols;cx++){
      // block walks by eye against a pricked dot. error is cumulative.
      errX+=(rnd()-0.5)*0.62;
      errY+=(rnd()-0.5)*0.30;
      errX=Math.max(-4.2,Math.min(4.2,errX));
      errY=Math.max(-2.4,Math.min(2.4,errY));
      // paste load: block is recharged every 8 or 9 impressions, so one prints starved
      var since=k%9;
      var load=1.0-since*0.075-(rnd()*0.10);
      if(since===8) load*=0.42;              // starved impression
      load=Math.max(0.20,Math.min(1,load));

      stampQueue.push({
        gx:cx*repeatW, gy:ry*repeatH,
        ex:errX, ey:errY, load:load,
        wrong:(k===wrongIdx),
        seed:(k*2654435761)>>>0
      });
      k++;
    }
  }
  // print in reading order but fast enough that the run fills at working speed
}

/* the repeat itself: a colour block (madder field), a turmeric block, an indigo
   ground-figure, and a fine iron outline block laid last — the one that shows drift */
function stampRepeat(s){
  var rnd=mulberry(s.seed);
  var cxr=repeatW/2, cyr=repeatH/2;
  var R=repeatW;
  // ---- COLOUR BLOCK: madder rosette (comes off the block dull ochre-grey) ----
  var petals=8;
  var pr=R*0.30;
  for(var p=0;p<petals;p++){
    var a=p/petals*6.2832;
    var pxc=cxr+Math.cos(a)*R*0.22, pyc=cyr+Math.sin(a)*R*0.22;
    disc(s,pxc,pyc,pr*0.55, s.wrong?INDIGO:MADDER, s.load);
  }
  disc(s,cxr,cyr,R*0.13, s.wrong?INDIGO:MADDER, s.load);

  // ---- TURMERIC block: the four corner buti, fugitive yellow ----
  var off=R*0.42;
  quad(s,cxr-off,cyr-off,R*0.15,TURMERIC,s.load*0.9);
  quad(s,cxr+off,cyr-off,R*0.15,TURMERIC,s.load*0.9);
  quad(s,cxr-off,cyr+off,R*0.15,TURMERIC,s.load*0.9);
  quad(s,cxr+off,cyr+off,R*0.15,TURMERIC,s.load*0.9);

  // ---- INDIGO ground: leaf pair on the diagonal ----
  leaf(s,cxr-R*0.34,cyr+R*0.02,R*0.26,-0.6,INDIGO,s.load);
  leaf(s,cxr+R*0.34,cyr-R*0.02,R*0.26, 2.5,INDIGO,s.load);

  // ---- RESIST: wax-white spots inside the rosette, stay pale ----
  for(var q=0;q<5;q++){
    var aa=q/5*6.2832+0.4;
    disc(s,cxr+Math.cos(aa)*R*0.22,cyr+Math.sin(aa)*R*0.22,R*0.055,RESIST,1);
  }

  // ---- OUTLINE BLOCK last, carrying the full accumulated registration error ----
  // must sit within a sixteenth of an inch of the colour or it reads blurred.
  var ox=s.ex, oy=s.ey;
  ringOutline(s,cxr+ox,cyr+oy,R*0.34,petals,pr*0.55,s.load);
  outlineQuad(s,cxr-off+ox,cyr-off+oy,R*0.15);
  outlineQuad(s,cxr+off+ox,cyr-off+oy,R*0.15);
  outlineQuad(s,cxr-off+ox,cyr+off+oy,R*0.15);
  outlineQuad(s,cxr+off+ox,cyr+off+oy,R*0.15);
  // registration dot, pricked, always present
  setCell(s.gx+Math.round(cxr),s.gy+Math.round(cyr-R*0.47),IRON,0.9);
}

function idx(x,y){return y*GW+x;}
function inb(x,y){return x>=0&&y>=0&&x<GW&&y<GH;}

function setCell(gx,gy,dye,amt){
  if(!inb(gx,gy))return;
  var i=idx(gx,gy);
  var cur=cloth[i*2], curA=cloth[i*2+1]/255;
  if(dye===IRON){ // iron sits on top of whatever's there
    cloth[i*2]=IRON; cloth[i*2+1]=Math.max(cloth[i*2+1],Math.round(Math.min(1,amt)*255));
    return;
  }
  if(dye===RESIST){ cloth[i*2]=RESIST; cloth[i*2+1]=255; return; }
  if(cur===IRON||cur===RESIST){ return; }
  if(amt>curA){ cloth[i*2]=dye; cloth[i*2+1]=Math.round(Math.min(1,amt)*255); }
}

function disc(s,cx,cy,r,dye,load){
  var r2=r*r;
  for(var y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)
    for(var x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
      var dx=x-cx,dy=y-cy,d=dx*dx+dy*dy;
      if(d<=r2){
        var edge=1-Math.sqrt(d)/r;
        setCell(s.gx+x,s.gy+y,dye,load*(0.62+edge*0.5));
      }
    }
}
function quad(s,cx,cy,r,dye,load){
  for(var y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)
    for(var x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
      var dx=Math.abs(x-cx),dy=Math.abs(y-cy);
      if(dx+dy<=r) setCell(s.gx+x,s.gy+y,dye,load);
    }
}
function leaf(s,cx,cy,len,ang,dye,load){
  var ca=Math.cos(ang),sa=Math.sin(ang);
  var steps=Math.ceil(len);
  for(var t=0;t<=steps;t++){
    var f=t/steps;
    var w=Math.sin(f*Math.PI)*len*0.24;
    var bx=cx+ca*(f-0.5)*len, by=cy+sa*(f-0.5)*len;
    for(var u=-Math.ceil(w);u<=Math.ceil(w);u++){
      setCell(s.gx+Math.round(bx-sa*u),s.gy+Math.round(by+ca*u),dye,load*0.95);
    }
  }
}
function ringOutline(s,cx,cy,r,petals,pr,load){
  var n=Math.ceil(r*7);
  for(var p=0;p<petals;p++){
    var a=p/petals*6.2832;
    var px2=cx+Math.cos(a)*r*0.66, py2=cy+Math.sin(a)*r*0.66;
    var m=Math.ceil(pr*7);
    for(var j=0;j<m;j++){
      var b=j/m*6.2832;
      setCell(s.gx+Math.round(px2+Math.cos(b)*pr),s.gy+Math.round(py2+Math.sin(b)*pr),IRON,load);
    }
  }
  for(var k=0;k<n;k++){
    var a2=k/n*6.2832;
    setCell(s.gx+Math.round(cx+Math.cos(a2)*r*0.40),s.gy+Math.round(cy+Math.sin(a2)*r*0.40),IRON,load*0.9);
  }
}
function outlineQuad(s,cx,cy,r){
  var st=Math.ceil(r*4);
  for(var t=0;t<st;t++){
    var f=t/st*4;
    var seg=Math.floor(f),fr=f-seg;
    var pts=[[0,-r],[r,0],[0,r],[-r,0]];
    var a=pts[seg],b=pts[(seg+1)%4];
    setCell(s.gx+Math.round(cx+a[0]+(b[0]-a[0])*fr),s.gy+Math.round(cy+a[1]+(b[1]-a[1])*fr),IRON,0.85);
  }
}

/* ---------- allocation ---------- */
function allocate(){
  GW=Math.max(40,Math.ceil(W/CELL));
  GH=Math.max(40,Math.ceil(H/CELL));
  var n=GW*GH;
  sat=new Float32Array(n); satN=new Float32Array(n);
  pig=new Float32Array(n); pigN=new Float32Array(n);
  expo=new Float32Array(n);
  cloth=new Uint8Array(n*2);
  buildRun();
}

/* ---------- physics ---------- */
/* warp runs left-right on this length. water travels along warp about twice the
   rate it travels across weft, so every splash spreads as an ellipse. */
var K_WARP=0.148, K_WEFT=0.072, EVAP=0.0016;

function stepWater(dt){
  var n=GW*GH;
  for(var y=0;y<GH;y++){
    var yo=y*GW;
    for(var x=0;x<GW;x++){
      var i=yo+x;
      var s0=sat[i];
      var l=x>0?sat[i-1]:s0, r=x<GW-1?sat[i+1]:s0;
      var u=y>0?sat[i-GW]:s0, d=y<GH-1?sat[i+GW]:s0;
      var v=s0 + K_WARP*(l+r-2*s0) + K_WEFT*(u+d-2*s0);
      v-=EVAP*(0.55+0.45*(1-Math.min(1,s0)));      // sun is straight overhead; it goes fast
      sat[i]=v>0?(v<1.6?v:1.6):0;
    }
  }
  // pigment advection: loose paste rides the saturation gradient and piles up
  // where the sheet stops and evaporation is fastest. that's the tidal edge.
  for(var y2=1;y2<GH-1;y2++){
    var yo2=y2*GW;
    for(var x2=1;x2<GW-1;x2++){
      var j=yo2+x2;
      var p=pig[j];
      if(p<0.0018){ pigN[j]=p; continue; }
      var gx=(sat[j+1]-sat[j-1])*0.5, gy=(sat[j+GW]-sat[j-GW])*0.5;
      var move=Math.min(0.42, (Math.abs(gx)+Math.abs(gy))*1.35);
      var keep=p*(1-move);
      pigN[j]=(pigN[j]||0)+keep;
      if(move>0){
        var mag=Math.abs(gx)+Math.abs(gy)+1e-6;
        var wx=gx/mag, wy=gy/mag;
        var tx=x2+(wx>0?1:(wx<0?-1:0)), ty=y2+(wy>0?1:(wy<0?-1:0));
        var carry=p*move;
        if(inb(tx,y2)) pigN[idx(tx,y2)]=(pigN[idx(tx,y2)]||0)+carry*Math.abs(wx);
        if(inb(x2,ty)) pigN[idx(x2,ty)]=(pigN[idx(x2,ty)]||0)+carry*Math.abs(wy);
      }
    }
  }
  for(var q=0;q<n;q++){
    // where it's dry, the carried pigment strands and stays. forever.
    var s=sat[q];
    if(s<0.06){ pigN[q]=(pigN[q]||0)*0.998; }
    pig[q]=pigN[q]||0; pigN[q]=0;
  }
}

/* per-pixel exposure. runs from load, never resets, no reprieve. */
var totalExposure=0;
function stepSun(dt){
  var n=GW*GH,acc=0;
  var step=dt*0.062;
  for(var i=0;i<n;i++){
    expo[i]+=step;
    acc+=expo[i];
  }
  totalExposure=acc/n;
}

/* ---------- rendering ---------- */
var img,imgData,buf,buf32;
function ensureImage(){
  if(!img||img.width!==GW||img.height!==GH){
    img=ctx.createImageData(GW,GH);
    buf=new ArrayBuffer(img.data.length);
    buf32=new Uint32Array(buf);
    imgData=new Uint8ClampedArray(buf);
  }
}
var clothScratch=document.createElement('canvas');
var clothCtx=null;

function render(){
  // gravel first
  ctx.drawImage(gravelCanvas,0,0,W,H);
  ensureImage();
  if(clothScratch.width!==GW||clothScratch.height!==GH){
    clothScratch.width=GW;clothScratch.height=GH;
    clothCtx=clothScratch.getContext('2d');
  }
  var n=GW*GH;
  for(var i=0;i<n;i++){
    var dye=cloth[i*2], amt=cloth[i*2+1]/255;
    var s=Math.min(1,sat[i]);
    var e=expo[i];
    var r,g,b,a;

    // base cloth: unbleached cream, honestly darker and more transparent wet
    var br=C_CLOTH[0]+(C_CLOTHWET[0]-C_CLOTH[0])*s;
    var bg=C_CLOTH[1]+(C_CLOTHWET[1]-C_CLOTH[1])*s;
    var bb=C_CLOTH[2]+(C_CLOTHWET[2]-C_CLOTH[2])*s;
    var alpha=1-s*0.34;                    // wet cotton shows the gravel through

    r=br;g=bg;b=bb;

    if(amt>0.02){
      var dr,dg,db;
      if(dye===MADDER){
        // off the block: dull ochre-grey paste. red arrives with exposure AND wet.
        var wetGain=0.20+0.80*Math.min(1,s*1.6);
        var dev=1-Math.exp(-e*0.055*wetGain);
        dr=C_MADRAW[0]+(C_MADDER[0]-C_MADRAW[0])*dev;
        dg=C_MADRAW[1]+(C_MADDER[1]-C_MADRAW[1])*dev;
        db=C_MADRAW[2]+(C_MADDER[2]-C_MADRAW[2])*dev;
      } else if(dye===TURMERIC){
        // independent, faster clock. the same sun ruins it.
        var bl=1-Math.exp(-e*0.098);
        dr=C_TURM[0]+(C_STRAW[0]-C_TURM[0])*bl;
        dg=C_TURM[1]+(C_STRAW[1]-C_TURM[1])*bl;
        db=C_TURM[2]+(C_STRAW[2]-C_TURM[2])*bl;
      } else if(dye===INDIGO){
        dr=C_INDIGO[0];dg=C_INDIGO[1];db=C_INDIGO[2];   // stable. does neither.
      } else if(dye===IRON){
        dr=C_IRON[0];dg=C_IRON[1];db=C_IRON[2];
      } else { // resist: wax-white, stays that way
        dr=250;dg=246;db=236;
      }
      // wet darkens and slightly desaturates the printed area too
      var wd=1-s*0.16;
      var k=amt*(dye===IRON?1:0.94);
      r=r+(dr*wd-r)*k; g=g+(dg*wd-g)*k; b=b+(db*wd-b)*k;
    }

    // deposited loose pigment: tidal ring. reddish-brown paste solids.
    var p=pig[i];
    if(p>0.004){
      var pk=Math.min(0.72,p*1.5);
      r=r+(126-r)*pk; g=g+(74-g)*pk; b=b+(58-b)*pk;
    }

    buf32[i]=((Math.round(alpha*255)&255)<<24)|((b&255)<<16)|((g&255)<<8)|(r&255);
  }
  img.data.set(imgData);
  clothCtx.putImageData(img,0,0);

  // cloth is pegged flat; it does not float. hard-edged, life-size, no smoothing wash.
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(clothScratch,0,0,W,H);

  // weave: warp threads read stronger than weft under vertical sun
  drawWeave();
}

var weavePat=null;
function makeWeave(){
  var c=document.createElement('canvas');c.width=4;c.height=4;
  var g=c.getContext('2d');
  g.clearRect(0,0,4,4);
  g.fillStyle='rgba(120,110,92,0.10)';g.fillRect(0,0,4,1);
  g.fillStyle='rgba(255,252,244,0.10)';g.fillRect(0,2,1,4);
  weavePat=ctx.createPattern(c,'repeat');
}
function drawWeave(){
  if(!weavePat)makeWeave();
  ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=weavePat;ctx.fillRect(0,0,W,H);ctx.restore();
}

/* ---------- input: water and standing still ---------- */
var pointerDown=false,px_=0,py_=0,lastX=0,lastY=0,dragSpeed=0,idleAt=0;
function toGrid(x,y){return [Math.floor(x/CELL),Math.floor(y/CELL)];}

function pour(gx,gy,strength,speed){
  // a sheet of water, not a droplet. it arrives hard.
  var rad=Math.max(4,Math.round(26/CELL));
  for(var y=gy-rad;y<=gy+rad;y++)
    for(var x=gx-rad-2;x<=gx+rad+2;x++){
      if(!inb(x,y))continue;
      var dx=(x-gx)/(rad*1.25), dy=(y-gy)/rad;
      var d=dx*dx+dy*dy;
      if(d>1)continue;
      var f=(1-d)*strength;
      var i=idx(x,y);
      sat[i]=Math.min(1.45,sat[i]+f*0.55);
      // the front lifts loose surface paste off the print and carries it
      var dye=cloth[i*2],amt=cloth[i*2+1]/255;
      if(amt>0.1&&dye!==IRON&&dye!==RESIST){
        var loose=Math.min(0.16,f*0.05*(1+speed*0.6));
        pig[i]+=loose;
        cloth[i*2+1]=Math.max(0,cloth[i*2+1]-Math.round(loose*46));
      }
    }
  wetSound(speed,strength);
}

function evt(e){
  var t=(e.touches&&e.touches[0])||e;
  var r=cv.getBoundingClientRect();
  return [t.clientX-r.left,t.clientY-r.top];
}
function down(e){e.preventDefault();startAudio();pointerDown=true;var p=evt(e);px_=lastX=p[0];py_=lastY=p[1];idleAt=performance.now();var g=toGrid(p[0],p[1]);pour(g[0],g[1],0.9,0);}
function move(e){
  if(!pointerDown)return;e.preventDefault();
  var p=evt(e);
  var dx=p[0]-lastX,dy=p[1]-lastY;
  var dist=Math.hypot(dx,dy);
  dragSpeed=dragSpeed*0.7+Math.min(1,dist/26)*0.3;
  var steps=Math.max(1,Math.ceil(dist/(CELL*1.2)));
  for(var s=1;s<=steps;s++){
    var x=lastX+dx*s/steps,y=lastY+dy*s/steps;
    var g=toGrid(x,y);
    pour(g[0],g[1],0.44+dragSpeed*0.5,dragSpeed);
  }
  lastX=p[0];lastY=p[1];
  if(dist>1.4)idleAt=performance.now();
  px_=p[0];py_=p[1];
}
function up(e){pointerDown=false;dragSpeed=0;}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);

/* holding still: the sun gets that patch harder than the rest of the yard */
function focusSun(dt){
  if(!pointerDown)return;
  var still=performance.now()-idleAt;
  if(still<120)return;
  var g=toGrid(px_,py_);
  var rad=Math.max(5,Math.round(34/CELL));
  var boost=Math.min(2.6,still/700)*dt*0.11;
  for(var y=g[1]-rad;y<=g[1]+rad;y++)
    for(var x=g[0]-rad;x<=g[0]+rad;x++){
      if(!inb(x,y))continue;
      var dx=(x-g[0])/rad,dy=(y-g[1])/rad,d=dx*dx+dy*dy;
      if(d>1)continue;
      expo[idx(x,y)]+=boost*(1-d);
    }
}

/* ---------- audio: all synthesised, nothing loaded ---------- */
var AC=null,master=null,wetGainNode=null,wetFilter=null,wetSrc=null,cicGain=null,cicOsc=null,gravelGain=null;
function noiseBuffer(ac,secs){
  var b=ac.createBuffer(1,ac.sampleRate*secs,ac.sampleRate);
  var d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return b;
}
function startAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(err){return;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);

  // broad wet rush — band and gain track drag speed and saturation
  wetSrc=AC.createBufferSource();wetSrc.buffer=noiseBuffer(AC,2);wetSrc.loop=true;
  wetFilter=AC.createBiquadFilter();wetFilter.type='bandpass';wetFilter.frequency.value=700;wetFilter.Q.value=0.7;
  wetGainNode=AC.createGain();wetGainNode.gain.value=0.0001;
  wetSrc.connect(wetFilter);wetFilter.connect(wetGainNode);wetGainNode.connect(master);
  wetSrc.start();

  // dry gravel-tick bed
  var gsrc=AC.createBufferSource();gsrc.buffer=noiseBuffer(AC,3);gsrc.loop=true;
  var gf=AC.createBiquadFilter();gf.type='highpass';gf.frequency.value=4200;
  gravelGain=AC.createGain();gravelGain.gain.value=0.010;
  gsrc.connect(gf);gf.connect(gravelGain);gravelGain.connect(master);gsrc.start();

  // cicada shimmer, gain rides total cumulative exposure
  cicOsc=AC.createOscillator();cicOsc.type='sawtooth';cicOsc.frequency.value=3180;
  var cf=AC.createBiquadFilter();cf.type='bandpass';cf.frequency.value=3400;cf.Q.value=9;
  var lfo=AC.createOscillator();lfo.type='sine';lfo.frequency.value=17;
  var lg=AC.createGain();lg.gain.value=0.5;
  cicGain=AC.createGain();cicGain.gain.value=0.0001;
  lfo.connect(lg);lg.connect(cicGain.gain);
  cicOsc.connect(cf);cf.connect(cicGain);cicGain.connect(master);
  cicOsc.start();lfo.start();
}
function wetSound(speed,strength){
  if(!AC||!wetGainNode)return;
  var t=AC.currentTime;
  var target=Math.min(0.16,0.012+speed*0.15+strength*0.03);
  wetGainNode.gain.setTargetAtTime(target,t,0.05);
  wetFilter.frequency.setTargetAtTime(420+speed*2100,t,0.06);
}
function thump(sizePx){
  if(!AC)return;
  var t=AC.currentTime;
  var o=AC.createOscillator();o.type='sine';
  var f=210-Math.min(120,sizePx*0.9);
  o.frequency.setValueAtTime(f*1.7,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(38,f),t+0.05);
  var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.11,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  // damp: the paste is wet, the thud has no ring in it
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;
  o.connect(lp);lp.connect(g);g.connect(master);
  o.start(t);o.stop(t+0.2);
  // the cloth-slap component
  var ns=AC.createBufferSource();ns.buffer=noiseBuffer(AC,0.12);
  var nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=900;nf.Q.value=1.1;
  var ng=AC.createGain();ng.gain.setValueAtTime(0.05,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start(t);
}

/* ---------- loop ---------- */
var last=performance.now(),printAcc=0;
function frame(now){
  var dt=Math.min(50,now-last);last=now;

  // the block-walk: keep printing until the run is down. working speed.
  printAcc+=dt;
  var per=42;
  var laid=0;
  while(printAcc>per&&stampIdx<stampQueue.length&&laid<3){
    printAcc-=per;
    var s=stampQueue[stampIdx++];
    stampRepeat(s);
    if(laid===0) thump(repeatW*CELL*(0.7+s.load*0.5));
    laid++;
  }

  stepWater(dt/16.7);
  stepSun(dt/16.7);
  focusSun(dt/16.7);

  if(AC){
    if(!pointerDown&&wetGainNode) wetGainNode.gain.setTargetAtTime(0.0004,AC.currentTime,0.30);
    if(cicGain) cicGain.gain.setTargetAtTime(Math.min(0.030,totalExposure*0.0022),AC.currentTime,0.9);
    if(gravelGain) gravelGain.gain.setTargetAtTime(0.008+Math.random()*0.006,AC.currentTime,0.5);
  }

  render();
  requestAnimationFrame(frame);
}

/* ---------- boot / resize ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CELL = W<620 ? 5 : 6;
  makeGravel(Math.floor(W),Math.floor(H));
  weavePat=null;
  allocate();
}
var rt=null;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,220);});
resize();
requestAnimationFrame(frame);

/* one repeat past the middle of the run is laid in the indigo block by mistake.
   it registers perfectly. nobody has stopped the run. it will develop, wet and
   bleed like everything else on the gravel and go out with the piece. */
})();
</script>
