  <meta name="outbox-spec-era" content="June 1974 — the cheap four-colour weekly anthology comic, printed rotary on newsprint in Haarlem for a Dutch children's paper: hand-lettered sound effects done at the drawing board with a No. 3 sable and a ruling pen, flat process colour laid under them by hand-cut rubylith, visible dot screen, honest 1.5 mm misregistration on the magenta plate, and the whole sheet folded once down the middle for the post. The strip being lettered is not a comic anybody would print: it is the four minutes of a hailstorm coming over a rose glasshouse on the Zwethlaan outside Naaldwijk, South Holland, at the end of a hot flat afternoon, and it is being drawn and lettered while the hail is still going.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: a comic with the pictures taken out and the talking taken out, so that what is left is only its noise. The entire viewport, edge to edge, is one page of six panels — real borders, real gutters, real tier rhythm, no header, no menu, no title, no scrollbar, no site furniture — and every panel is EMPTY. No figures, no glass, no rain, no balloons, no captions, no narration boxes, no arrows, no motion lines. The only marks inside any panel are hand-lettered onomatopoeia, each one sitting in the exact position, at the exact scale, at the exact tilt and in the exact colour that the vanished drawing would have put it, so the reader assembles a glasshouse, a man on a gravel path, a tarp, a tractor and a hundred and forty broken panes purely out of where the noises are on the page and how big they are. The page LETTERS ITSELF IN REAL TIME at the storm's own speed — sound effects arrive into the panels at their true acoustic moments, small and thin at first in panel one, crowding and overlapping by panel four — and when the sixth panel is full the sheet turns itself over with real newsprint weight and the next page begins, and there is no way to go back. The visitor's entire vocabulary is two hands on the paper: DRAG any lettered effect anywhere inside its own panel, which genuinely re-places it in the missing scene (near the top of frame it is small, distant and quiet, dragged down and forward it is huge, close and loud, and the stereo image and the reverb tail move with it), and PRESS a letterform to re-strike it, which re-inks it — heavier, spreading into the newsprint fibre, one press fatter than the last — until at about the seventh press it has filled in solid and is a black blot that can never be read again and never comes off the page.">
  <meta name="outbox-spec-subject" content="The flat acoustics and flat arithmetic of hail on horticultural glass, and specifically that a grower standing in the packing shed knows the size of the stones and roughly what it is going to cost him without going outside, because the roof is telling him — that 4 mm horticultural float in a 73 by 165 cm Venlo pane is a stiff thin plate with a fundamental around 300 Hz and a dense stack of higher modes above it, so a stone that does not break it produces a bright short tick with almost no body while a stone that flexes it past yield produces a low ringing thump first and the crack afterward, and the two sounds are so different that the ratio of ticks to thumps IS the damage estimate; that a pane rings on for a measurable time after every strike, so a roof taking twenty strikes a second is never silent between them and the whole house goes to a continuous roar not because the hits merged but because the ringing did; that stone diameter shows up honestly in the sound as arrival energy and as spectral brightness — pea hail is broadband hiss with no low end at all, marble hail puts real energy under 500 Hz, and a stone over about 25 mm produces a single event you can pick out of the roar and locate by ear to within two bays; that terminal velocity goes roughly as the square root of diameter, so a 20 mm stone is arriving about 19 metres a second and a 10 mm stone about 14, which means the impact energy of the big one is not twice the small one, it is closer to eleven times, and that ratio is the whole reason a house survives ten minutes of small hail and loses its whole south slope in forty seconds of big; that angle of incidence matters as much as size, because a stone falling straight onto a 22-degree glass slope delivers only part of its momentum normal to the pane and the rest as a skid, so a house with wind behind the hail loses far more glass than a house taking the same stones in dead calm, and the sound of a skid is a scrape and not a tick; that broken panes are heard leaving in two stages, the crack and then the fall, and the fall lands on the crop or on the concrete path and those are different sounds and one of them means you are also picking glass out of the rose beds by hand for a week; that a house is a set of bays and the ear localises by bay, so the sequence of first breakages across a roof is a live readout of the storm cell's track; that glass at the ridge and glass at the gutter fail at different rates because gutter panes are shorter and stiffer; that the tarps in the shed will not save a roof and were never for the roof, they are for the open ends and for the young stock on the outside beds, and getting them on costs three people about ninety seconds a bed; that the tractor is started not to do anything useful but because it is parked under the overhang and the overhang is the first thing to come down; that a replacement pane is cheap and glazing labour is not, that a glazier in Westland in June is booked, that a house with a hundred and forty panes out will not hold its heat curve overnight and the roses will show it in ten days, not tonight; and the flat arithmetic that the cell is running from the southwest at about forty kilometres an hour, that the noise has been continuous for two minutes and eleven seconds, and that everything anybody does now is happening while it is still going on.">
  <meta name="outbox-spec-tone" content="There is no narrator, no dialogue, no caption box, no title and no written sentence anywhere on the page — the only readable characters in the entire piece are the onomatopoeia themselves, and they are the whole voice. The register lives in the LETTERING HAND, and that hand belongs to a working comics letterer doing a rush job at a drawing board: fast, confident, unfussy, brush-and-ruling-pen, letterforms built out of straight strokes and blunt terminals, no calligraphy, no flourish, no decoration, no cleverness. The vocabulary is the honest Dutch comics vocabulary of the period — TIK, TAK, RATEL, KLETS, KRAK, KLIRR, ROFFF, BONK, PLONS, SJIRP, RAM, KREUN — spelled with real doubled and tripled letters when a sound genuinely lasts, and never once with an exclamation mark used for emphasis it hasn't earned. Nothing on the page addresses the visitor, welcomes them, instructs them, thanks them or acknowledges that they exist. Nothing is arranged to be admired; effects overlap, collide, get crowded off their proper position by their neighbours, and one in panel five is lettered slightly too big because the letterer misjudged the space and did not have time to redo it. Explicitly NOT hushed, NOT meditative, NOT dreamy, NOT hypnotic, NOT ASMR, NOT precious, NOT stylish, NOT ominous, NOT witty — this is a strip being lettered at speed on a deadline about a roof that is being hit right now.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, all of them off a cheap four-colour newsprint job. The ground is 1974 comic newsprint in a warm grey-cream (#e6dfc9), yellowing measurably toward the trimmed edges (#d6cba7) and carrying real visible fibre fleck and a faint show-through of the lettering on the reverse. Panel borders and the bulk of the sound lettering are process black (#211f1c) printed with honest dot gain — solid and slightly bloomed at heavy stroke weights, breaking into visible screen dots and going grey-brown at anything under about 6 point (#57514a). Against that, the SFX colour is COMPUTED and never chosen: each effect's spectral centroid maps across the three process inks, so low-body impacts print in flat process cyan (#1f7fb0), mid-range cracks and ticks in a chalky yellow (#e9c11f), and the brightest hardest breaks in magenta (#d0357e) — all as flat rubylith fills under a black outline, and all with a genuine 1.5 mm plate misregistration down and right, so every coloured effect shows a cream sliver on one side and a muddied overlap on the other (#7a3c52). Stroke weight, letter width and outline thickness are driven live by measured loudness; an effect re-struck by the visitor goes progressively heavier and its counters fill in until the letterform is a blot. Exactly one chip of printer's blue pencil (#4a5f8c) is held strictly for the crop marks, the fold rule and the four-digit page slug in the bottom outer corner — it never touches a panel and never touches a letterform. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest dot gain, honest misregistration and honest paper yellowing.">
  <meta name="outbox-spec-wildcard" content="One panel on every page — never the first, never the last, position chosen fresh each time — is completely empty: no lettering, no colour, nothing but its border and the paper inside it. It is not silent (the roar continues under it, because the roar belongs to the page and not to any panel), it is not skipped, it is not shorter, it holds for its full duration, and no effect will ever be placed in it by the engine, by the storm, or by the visitor — an effect dragged into it slides back out. Nothing on the page accounts for it and it happens again on every page, forever.">
  <meta name="outbox-spec-forbidden" content="NO storm-as-metaphor for anything — not fate, not sudden loss, not the fragility of what people build, not 'everything you worked for in four minutes'; this is stone diameter, impact energy, plate stiffness and a glazier's booking calendar, and it has nothing to teach anybody. ABSOLUTELY NO Silver Age camp: no POW, no BIFF, no ZOK, no Batman joke, no winking at comic-book sound effects as a punchline, no Lichtenstein, no pop-art framing, no gallery irony, no 'sound effects are so funny out of context'. NO comics nostalgia, NO 'they don't letter by hand anymore', NO reverence for the letterer's craft, NO craftsman-sage register, NO artisan mystique, NO love-letter-to-print. NO decline narrative of any kind: no 'the Westland glasshouses are all gone', no vanished-trade lament, no small-grower pathos, no ruin, no bankruptcy foreshadowing, no 'he stood in the doorway and watched it happen' — the cell is still overhead and people are moving tarps. NO disaster-porn and NO catastrophe awe: no sublime weather, no wrath, no biblical register, no the-sky-turned-green dread, no slow-motion glass. NO Netherlands travelogue and NO explaining a place to anybody: no tulips, no windmills, no bicycles as charm, no flat-land-big-sky lyricism, no polder poetry, no Dutch phrases sprinkled for flavour beyond what is actually lettered as a noise. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery or screensaver framing of the falling hail or the accumulating lettering. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror, found-media or 'the pictures are missing and that is sinister' framing of the empty panels, the blank panel, or the blotted-out effects — nothing here is wrong, the drawings simply are not there. NO archival / museum / cabinet / drawer / collection / clipping / found-comic / relic framing of the page — it is being lettered this minute and the ink is wet. NO sensuous material writing about glass, ink or paper beyond stiffness, energy, dot gain, spread and legibility. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is late afternoon in flat June light. NO signal / transmission / frequency / broadcast framing of the roar, despite it having a spectrum. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

function rnd(seed){ var s = seed % 2147483647; if(s<=0) s+=2147483646;
  return function(){ s = s*16807 % 2147483647; return (s-1)/2147483646; }; }

function buildPath(word, rough, slantDeg, tracking, R){
  var d="", x=0, tan=Math.tan(slantDeg*Math.PI/180);
  for(var i=0;i<word.length;i++){
    var g=A[word.charAt(i)]; if(!g){ x+=4; continue; }
    for(var j=0;j<g.s.length;j++){
      var poly=g.s[j];
      for(var k=0;k<poly.length;k++){
        var px=poly[k][0]+x, py=poly[k][1];
        px += (R()-0.5)*rough*1.5; py += (R()-0.5)*rough*1.5;
        px += tan*(10-py)*0.9;
        d += (k===0?"M":"L") + px.toFixed(2) + " " + py.toFixed(2) + " ";
      }
    }
    x += g.w + tracking;
  }
  return {d:d, w:x - tracking + 1};
}

function geometry(){

  panels=[];

    panels.push({x:mx+col*(cw+gx), y:my+row*(ch+gy), w:cw, h:ch});

  foldX=W/2;

  var yellow=Math.min(0.5, store.yellow*0.012);
  var g1=el("linearGradient",{id:"pg",x1:"0",y1:"0",x2:"1",y2:"1"});
  layerPaper.appendChild(el("rect",{x:"0",y:"0",width:String(W),height:String(H),fill:"#e6dfc9"}));
  /* yellowing toward the trimmed edges */
  var rg=el("radialGradient",{id:"yel",cx:"0.5",cy:"0.5",r:"0.72"});
  rg.appendChild(el("stop",{offset:"0.38","stop-color":"#e6dfc9","stop-opacity":"0"}));
  rg.appendChild(el("stop",{offset:"1","stop-color":"#d6cba7","stop-opacity":String(0.55+yellow)}));
  svg.querySelector("defs").appendChild(rg);
  layerPaper.appendChild(el("rect",{x:"0",y:"0",width:String(W),height:String(H),fill:"url(#yel)"}));
  layerPaper.appendChild(el("rect",{x:"0",y:"0",width:String(W),height:String(H),filter:"url(#fibre)"}));
  layerPaper.appendChild(el("rect",{x:"0",y:"0",width:String(W),height:String(H),filter:"url(#fleck)"}));
  svg.appendChild(layerPaper);

  /* show-through of the lettering on the reverse */
  var back=el("g",{opacity:"0.075",transform:"translate("+W+",0) scale(-1,1)"});
  var bw=["KLIRR","RATEL","TIK","BONK","KRAK","KLETS","TAK","ROFFF"];
  for(var b=0;b<9;b++){
    var pi=Math.floor(PR()*6), p=panels[pi];

    back.appendChild(el("path",{d:bp.d,fill:"none",stroke:INK_BLACK,"stroke-width":"1.5",
      transform:"translate("+(p.x+PR()*p.w*0.5)+","+(p.y+PR()*p.h*0.7)+") scale("+s+") rotate("+((PR()-0.5)*14)+")"}));
  }
  svg.appendChild(back);

  layerFurn=el("g",{});

  for(var i=0;i<6;i++){
    var p=panels[i], d="", J=1.1;
    var corners=[[p.x,p.y],[p.x+p.w,p.y],[p.x+p.w,p.y+p.h],[p.x,p.y+p.h],[p.x,p.y]];
    for(var c=0;c<corners.length;c++){

    }

  }
  /* blue pencil: crop marks and fold rule */
  var m=10, bl={fill:"none",stroke:BLUE,"stroke-width":"1.1","stroke-linecap":"butt"};
  function line(x1,y1,x2,y2,extra){ var o={}; for(var k in bl)o[k]=bl[k]; if(extra)for(var k2 in extra)o[k2]=extra[k2];
    o.d="M"+x1+" "+y1+"L"+x2+" "+y2; layerFurn.appendChild(el("path",o)); }
  var cm=Math.max(10,W*0.02), off=Math.max(6,W*0.012);
  [[off,off,1,1],[W-off,off,-1,1],[off,H-off,1,-1],[W-off,H-off,-1,-1]].forEach(function(c){
    line(c[0],c[1],c[0]+cm*c[2],c[1]); line(c[0],c[1],c[0],c[1]+cm*c[3]);

  svg.appendChild(layerFurn);

var slugNode=null;

/* ---------- audio ---------- */
var ctx=null, master=null, verbWet=null, noiseBuf=null, roarG=null, roarNodes=[], waterG=null, dieselG=null;
function audioInit(){
  if(ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ctx=new AC();
  master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
  var conv=ctx.createConvolver();
  var len=Math.floor(ctx.sampleRate*1.15), ib=ctx.createBuffer(2,len,ctx.sampleRate);
  for(var c=0;c<2;c++){ var ch=ib.getChannelData(c);
    for(var i=0;i<len;i++){ var t=i/len; ch[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*(1-t*0.4); } }
  conv.buffer=ib;
  verbWet=ctx.createGain(); verbWet.gain.value=0.30;
  conv.connect(verbWet); verbWet.connect(master);
  window.__verbIn=conv;

  var nl=Math.floor(ctx.sampleRate*2); noiseBuf=ctx.createBuffer(1,nl,ctx.sampleRate);
  var nd=noiseBuf.getChannelData(0); for(var i2=0;i2<nl;i2++) nd[i2]=Math.random()*2-1;

  /* the roar is the sum of panes still ringing */
  roarG=ctx.createGain(); roarG.gain.value=0.0; roarG.connect(master);
  var rs=ctx.createBufferSource(); rs.buffer=noiseBuf; rs.loop=true;
  var modes=[302,468,691,982,1338,1810];
  for(var mi=0;mi<modes.length;mi++){
    var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=modes[mi]; bp.Q.value=6.5+mi;
    var g=ctx.createGain(); g.gain.value=0.9/(1+mi*0.5);
    rs.connect(bp); bp.connect(g); g.connect(roarG);
  }
  var rlp=ctx.createBiquadFilter(); rlp.type="lowpass"; rlp.frequency.value=5200;
  roarG.connect(rlp);
  rs.start();

  waterG=ctx.createGain(); waterG.gain.value=0; waterG.connect(master);
  var ws=ctx.createBufferSource(); ws.buffer=noiseBuf; ws.loop=true;
  var wf=ctx.createBiquadFilter(); wf.type="bandpass"; wf.frequency.value=980; wf.Q.value=1.4;
  ws.connect(wf); wf.connect(waterG); ws.start();

  dieselG=ctx.createGain(); dieselG.gain.value=0; dieselG.connect(master);
}
function T(){ return ctx?ctx.currentTime:0; }

function voice(pan, near){
  var pn=ctx.createStereoPanner?ctx.createStereoPanner():null;
  var lp=ctx.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.value=900+9200*near;
  var g=ctx.createGain();
  var send=ctx.createGain(); send.gain.value=0.42-0.34*near;
  lp.connect(g);
  if(pn){ pn.pan.value=Math.max(-1,Math.min(1,pan)); g.connect(pn); pn.connect(master); }
  else g.connect(master);
  g.connect(send); send.connect(window.__verbIn);
  return {inp:lp, gain:g};
}

function modes_for(kind){
  if(kind==="thump") return [[302,1],[468,.42],[691,.22],[982,.10]];
  if(kind==="break") return [[288,1],[451,.6],[672,.4],[958,.28],[1301,.2],[1770,.14]];
  return [[982,.55],[1338,.8],[1810,1],[2404,.7],[3110,.42]];
}

function playEvent(ev, pan, near){
  if(!ctx) return;
  var t0=T()+0.005;
  var v=voice(pan,near);
  var lvl=ev.peak*(0.28+0.72*near)*0.5;
  v.gain.gain.setValueAtTime(lvl,t0);

  /* attack transient: excitation noise through the contact band */
  var ns=ctx.createBufferSource(); ns.buffer=noiseBuf;
  ns.playbackRate.value=0.8+Math.random()*0.5;
  var nb=ctx.createBiquadFilter(); nb.type="bandpass";
  nb.frequency.value=Math.min(9000,ev.centroid*1.15); nb.Q.value=0.8+ev.noise*1.6;
  var ng=ctx.createGain();
  ng.gain.setValueAtTime(0.0001,t0);
  ng.gain.exponentialRampToValueAtTime(Math.max(0.002,ev.noise),t0+ev.attack);
  ng.gain.exponentialRampToValueAtTime(0.0001,t0+ev.attack+ev.decay*0.55);
  ns.connect(nb); nb.connect(ng); ng.connect(v.inp);
  ns.start(t0); ns.stop(t0+Math.min(1.4,ev.attack+ev.decay+0.1));

  /* the plate keeps ringing after the stone has gone */
  var ms=modes_for(ev.kind), det=ev.kind==="break"?0.03:0.012;
  for(var i=0;i<ms.length;i++){
    var o=ctx.createOscillator(); o.type="sine";
    o.frequency.value=ms[i][0]*(1+(Math.random()-0.5)*det);
    var og=ctx.createGain();
    var amp=ms[i][1]*(1-ev.noise*0.45)*0.85;
    og.gain.setValueAtTime(0.0001,t0);
    og.gain.linearRampToValueAtTime(amp,t0+ev.attack*1.2);
    og.gain.exponentialRampToValueAtTime(0.0001,t0+ev.attack+ev.decay*(1-i*0.11));
    o.connect(og); og.connect(v.inp);
    o.start(t0); o.stop(t0+ev.attack+ev.decay+0.06);
  }
  if(ev.kind==="break"){
    /* crack, then the fall — concrete path or into the beds */
    var dly=0.26+Math.random()*0.42;
    var pieces=ev.onConcrete?9:6;
    for(var k=0;k<pieces;k++){
      (function(k){
        var tt=t0+dly+Math.random()*0.34;
        var s2=ctx.createBufferSource(); s2.buffer=noiseBuf; s2.playbackRate.value=1+Math.random();
        var bf=ctx.createBiquadFilter(); bf.type=ev.onConcrete?"highpass":"bandpass";
        bf.frequency.value=ev.onConcrete?(2400+Math.random()*3200):(500+Math.random()*700);
        bf.Q.value=ev.onConcrete?0.7:1.1;
        var g2=ctx.createGain();
        g2.gain.setValueAtTime(0.0001,tt);
        g2.gain.exponentialRampToValueAtTime((ev.onConcrete?0.20:0.11)*(0.4+Math.random()),tt+0.004);
        g2.gain.exponentialRampToValueAtTime(0.0001,tt+(ev.onConcrete?0.13:0.09));
        s2.connect(bf); bf.connect(g2); g2.connect(v.inp);
        s2.start(tt); s2.stop(tt+0.2);
      })(k);
    }
  }
}

/* tarpaulin, diesel, gravel, gutter — their own clocks */
var tarpNext=2.4, gravelNext=6, dieselState=0, dieselStart=0;
function tarpSnap(){
  if(!ctx) return;
  var v=voice((Math.random()-0.5)*1.3,0.55), t0=T()+0.01;
  v.gain.gain.value=0.20;
  var ns=ctx.createBufferSource(); ns.buffer=noiseBuf; ns.playbackRate.value=1.4;
  var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1400; bp.Q.value=0.9;
  var g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.9,t0+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.10+Math.random()*0.09);
  ns.connect(bp); bp.connect(g); g.connect(v.inp); ns.start(t0); ns.stop(t0+0.4);
}
function gravelStep(){
  if(!ctx) return;
  var v=voice(-0.55+Math.random()*0.2,0.85), t0=T()+0.01;
  v.gain.gain.value=0.12;
  for(var i=0;i<3;i++){
    var ns=ctx.createBufferSource(); ns.buffer=noiseBuf; ns.playbackRate.value=1.8;
    var bp=ctx.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=2600;
    var g=ctx.createGain(); var tt=t0+i*0.035;
    g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.5,tt+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,tt+0.05);
    ns.connect(bp); bp.connect(g); g.connect(v.inp); ns.start(tt); ns.stop(tt+0.12);
  }
}
function dieselRun(){
  if(!ctx||dieselState===2) return;
  dieselState=2;
  var t0=T();
  var o1=ctx.createOscillator(); o1.type="sawtooth"; o1.frequency.value=41;
  var o2=ctx.createOscillator(); o2.type="square"; o2.frequency.value=20.5;
  var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=250; lp.Q.value=2;
  var wob=ctx.createOscillator(); wob.type="sine"; wob.frequency.value=6.3;
  var wg=ctx.createGain(); wg.gain.value=9; wob.connect(wg); wg.connect(o1.frequency);
  o1.connect(lp); o2.connect(lp); lp.connect(dieselG);
  dieselG.gain.setValueAtTime(0.0001,t0);
  dieselG.gain.exponentialRampToValueAtTime(0.055,t0+1.4);
  o1.start(t0); o2.start(t0); wob.start(t0);
}

/* ---------- the cell ---------- */
var BAYS=8, stormT=0, breaks=0, ticks=0, recent=[], slopeDeg=22;
function stoneDiameter(mean){
  var u=Math.random(), v=Math.random();
  var g=Math.sqrt(-2*Math.log(u+1e-9))*Math.cos(2*Math.PI*v);
  return Math.max(3, mean*Math.exp(g*0.34));
}
function meanD(t){
  var phase=(t%168)/168;
  var bell=Math.exp(-Math.pow((phase-0.52)/0.24,2));
  return 5.5+19*bell;
}
function intensity(t,bay){
  var lead=bay*0.41;
  var tt=t-lead;
  var phase=(tt%168)/168;
  return 0.22+0.95*Math.exp(-Math.pow((phase-0.5)/0.27,2));
}
function makeImpact(bay,t){
  var d=stoneDiameter(meanD(t));
  var vel=4.3*Math.sqrt(d);
  var mass=900*(Math.PI/6)*Math.pow(d/1000,3);
  var E=0.5*mass*vel*vel;
  var wind=0.35+0.5*Math.abs(Math.sin(t*0.11));
  var theta=(slopeDeg+wind*34*(0.6+Math.random()*0.8))*Math.PI/180;
  var cosT=Math.cos(theta);
  var En=E*cosT*cosT;
  var atGutter=(bay%3===0);
  var thr=(atGutter?3.05:1.95)*(0.78+Math.random()*0.5);
  var kind;
  if(cosT<0.46 && Math.random()<0.55) kind="skid";
  else if(En>thr) kind="break";
  else if(En>thr*0.30) kind="thump";
  else kind="tick";
  var centroid, peak, attack, decay, dur, noise;
  if(kind==="tick"){ centroid=2350+d*46+Math.random()*700; peak=0.16+0.5*(En/thr); attack=0.0009; decay=0.045+d*0.0035; dur=0.05+d*0.003; noise=0.72; }
  else if(kind==="thump"){ centroid=430+d*11; peak=0.44+0.4*(En/thr); attack=0.0035; decay=0.20+d*0.010; dur=0.20+d*0.008; noise=0.32; }
  else if(kind==="skid"){ centroid=1550+Math.random()*900; peak=0.24+0.3*(En/thr); attack=0.010; decay=0.16; dur=0.20+Math.random()*0.18; noise=0.92; }
  else { centroid=2950+Math.random()*1400; peak=0.86+Math.min(0.3,En/thr*0.12); attack=0.0006; decay=0.42; dur=0.34; noise=0.55; }
  return {kind:kind,bay:bay,d:d,vel:vel,E:E,En:En,thr:thr,peak:Math.min(1.15,peak),
    attack:attack,decay:decay,dur:dur,centroid:centroid,noise:noise,
    onConcrete:(bay===0||bay===BAYS-1||Math.random()<0.22), atGutter:atGutter, t:t};
}

/* ---------- lettering ---------- */
var WORDS={
  tick:["TIK","TAK","TSJK","KLIK","TIK"],
  thump:["BONK","ROF","BOMM","BONK","DOF"],
  skid:["SJIRP","SJRRT","SJIRP","RATEL"],
  break:["KRAK","KRAK","KRAKK","BARST"],
  fall_hard:["KLIRR","KLIRR","KLINK","KLIRR"],
  fall_soft:["KLETS","PLOF","KLETS","SJOEF"],
  tarp:["KLETS","RAM","FLAP","RAM"],
  gravel:["KNARS","KNARS","SJIRP"],
  diesel:["KREUN","ROFFF","BROM"],
  water:["PLONS","GLOEP","PLONS"],
  roll:["RATEL","RATELL","RRRATEL"]
};
function wordFor(ev,R){
  var pool;
  if(ev.kind==="break") pool=WORDS["break"];
  else if(ev.kind==="fall") pool=ev.onConcrete?WORDS.fall_hard:WORDS.fall_soft;
  else pool=WORDS[ev.kind]||WORDS.tick;
  var w=pool[Math.floor(R()*pool.length)];
  var rep=Math.max(0,Math.min(3,Math.round(ev.dur*5.2)-1));
  if(rep>0){
    var last=w.charAt(w.length-1);
    if("RFLSNMK".indexOf(last)>=0) w=w+new Array(rep+1).join(last);
  }
  return w;
}

var effects=[], curPanel=store.panel||0, panelStart=0, blankPanel=2, panelCount=0,
    panelCap=[5,9,12,15,10,7], panelDur=[19,20,21,20,20,18], oversizeUsed=false;

function pickBlank(){ blankPanel=1+Math.floor(Math.random()*4); }
pickBlank();

function placeEffect(ev){
  if(curPanel===blankPanel) return null;
  var p=panels[curPanel];
  var R=rnd(Math.floor(Math.random()*1e7)+1);
  var u=0.06+ (ev.bay+0.5)/BAYS *0.86 + (R()-0.5)*0.07;
  var v0=ev.atGutter? 0.60+R()*0.30 : 0.12+R()*0.46;
  if(ev.kind==="fall") v0=Math.min(0.92,v0+0.24);
  var word=wordFor(ev,R);
  var e={
    word:word, u:Math.max(0.05,Math.min(0.95,u)), v:Math.max(0.07,Math.min(0.93,v0)),
    panel:curPanel, ink:0, ev:{kind:ev.kind,peak:ev.peak,attack:ev.attack,decay:ev.decay,
      dur:ev.dur,centroid:ev.centroid,noise:ev.noise,onConcrete:ev.onConcrete},
    rot:(R()-0.5)*17*(0.4+ev.noise), seed:Math.floor(R()*1e6)+1,
    base: 0.05+0.115*Math.min(1,ev.peak)
  };
  /* crowded off its proper position by a neighbour */
  for(var i=0;i<effects.length;i++){
    var o=effects[i]; if(o.panel!==curPanel) continue;
    if(Math.abs(o.u-e.u)<0.13 && Math.abs(o.v-e.v)<0.10){
      e.u=Math.max(0.05,Math.min(0.95,e.u+(e.u>o.u?0.12:-0.12)));
      e.v=Math.max(0.07,Math.min(0.93,e.v+(R()<0.5?0.075:-0.075)));
    }
  }
  if(curPanel===4 && !oversizeUsed && effects.filter(function(x){return x.panel===4;}).length===1){
    e.base*=1.42; oversizeUsed=true;  /* misjudged the space, no time to redo it */
  }
  effects.push(e);
  renderEffect(e);
  panelCount++;
  return e;
}

function scaleOf(e){
  var p=panels[e.panel];
  var near=e.v;
  return (p.h*e.base*(0.42+1.25*near))/10;
}

function renderEffect(e){
  if(e.node&&e.node.parentNode) e.node.parentNode.removeChild(e.node);
  var p=panels[e.panel], R=rnd(e.seed);
  var slant=Math.max(-3,Math.min(17, 15 - e.ev.attack*520));
  var track=1.0+e.ev.dur*3.4;
  var bp=buildPath(e.word, e.ev.noise*1.5 + e.ink*0.25, slant, track, R);
  var s=scaleOf(e);
  var x=p.x+e.u*p.w - bp.w*s*0.5, y=p.y+e.v*p.h - 10*s*0.5;
  var wt=(0.95+2.0*Math.min(1,e.ev.peak)) + e.ink*0.62;
  var small=(10*s)<9;
  var colour=inkFor(e.ev.centroid);
  var g=el("g",{class:"fx",transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+") rotate("+e.rot.toFixed(1)+" "+(bp.w/2)+" 5) scale("+s.toFixed(4)+")"});
  var mis=1.5/ (s*3.78) * 3.78 * 0 + (1.5*3.78/25.4)/s; /* 1.5 mm plate shift, in unit space */
  if(!small){
    g.appendChild(el("path",{d:bp.d,fill:"none",stroke:colour,"stroke-width":String(wt+0.55),
      "stroke-linecap":e.ev.attack<0.003?"butt":"round","stroke-linejoin":"miter",
      transform:"translate("+mis.toFixed(2)+","+mis.toFixed(2)+")"}));
    g.appendChild(el("path",{d:bp.d,fill:"none",stroke:MUD,"stroke-width":String(wt+0.18),
      "stroke-linecap":"butt","stroke-linejoin":"miter","stroke-opacity":"0.85",
      transform:"translate("+(mis*0.45).toFixed(2)+","+(mis*0.45).toFixed(2)+")"}));
  }
  g.appendChild(el("path",{d:bp.d,fill:"none",stroke:small?INK_SMALL:INK_BLACK,
    "stroke-width":String(wt),"stroke-linecap":e.ink>3?"round":(e.ev.attack<0.003?"butt":"round"),
    "stroke-linejoin":e.ink>3?"round":"miter","stroke-opacity":small?"0.86":"1"}));
  /* hit target */
  g.appendChild(el("rect",{x:"-1",y:"-2",width:String(bp.w+2),height:"14",fill:"transparent"}));
  e.pw=bp.w*s; e.ph=10*s; e.x=x; e.y=y;
  /* fold: the ink is cracked along it */
  if(x < foldX+6 && x+e.pw > foldX-6) g.setAttribute("mask","url(#foldmask)");
  layerFx.appendChild(g);
  e.node=g;
  attachHandlers(e);
}

function reflow(){
  for(var i=0;i<effects.length;i++) renderEffect(effects[i]);
}

/* ---------- hands on the paper ---------- */
function attachHandlers(e){
  var g=e.node, moved=false, sx=0, sy=0, ou=0, ov=0, t0=0, id=null;
  g.addEventListener("pointerdown",function(ev2){
    audioResume();
    ev2.preventDefault(); ev2.stopPropagation();
    id=ev2.pointerId; moved=false; sx=ev2.clientX; sy=ev2.clientY; ou=e.u; ov=e.v; t0=Date.now();
    g.setPointerCapture(id); g.classList.add("dragging");
  });
  g.addEventListener("pointermove",function(ev2){
    if(id===null) return;
    var r=svg.getBoundingClientRect();
    var dx=(ev2.clientX-sx)*(W/r.width), dy=(ev2.clientY-sy)*(H/r.height);
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    if(!moved) return;
    var p=panels[e.panel];
    e.u=Math.max(0.055,Math.min(0.945, ou+dx/p.w));
    e.v=Math.max(0.075,Math.min(0.925, ov+dy/p.h));
    renderEffect(e);
  });
  function up(ev2){
    if(id===null) return;
    try{ g.releasePointerCapture(id); }catch(err){}
    g.classList.remove("dragging"); id=null;
    if(moved){
      if(e.x<foldX+6 && e.x+e.pw>foldX-6){ store.foldwear+=1; }
      sound(e); save();
    } else if(Date.now()-t0<600){
      if(e.ink<7){ e.ink++; if(e.ink>=7) e.blot=true; }
      if(e.x<foldX+6 && e.x+e.pw>foldX-6) store.foldwear+=2;
      renderEffect(e); sound(e,true); save(); refreshFold();
    }
  }
  g.addEventListener("pointerup",up);
  g.addEventListener("pointercancel",up);
}

function refreshFold(){
  if(!foldMaskGroup) return;
  var wear=Math.min(9, store.foldwear*0.06);
  var kids=foldMaskGroup.childNodes;
  for(var i=0;i<kids.length;i++){
    var w0=parseFloat(kids[i].getAttribute("width"));
    kids[i].setAttribute("width", String(Math.min(11, w0+0.02*wear)));
  }
}

function sound(e, restruck){
  if(!ctx) return;
  var p=panels[e.panel];
  var px=(p.x+e.u*p.w)/W;
  var pan=(px-0.5)*1.8;
  var near=e.v;
  var ev={kind:e.ev.kind==="fall"?"tick":e.ev.kind, peak:e.ev.peak*(restruck?1+e.ink*0.07:1),
    attack:e.ev.attack, decay:e.ev.decay*(restruck?1+e.ink*0.05:1),
    centroid:e.ev.centroid*(restruck?1-e.ink*0.05:1), noise:e.ev.noise, onConcrete:e.ev.onConcrete};
  playEvent(ev,pan,near);
}

/* ---------- page turn ---------- */
var turning=false;
function turnPage(){
  if(turning) return;
  turning=true;
  var sheet=document.getElementById("sheet");
  sheet.classList.add("turn");
  var sh=document.getElementById("shade");
  sh.style.transition="none";
  var k=0, iv=setInterval(function(){
    k+=0.05;
    var a=Math.sin(Math.min(1,k)*Math.PI);
    sh.style.background="linear-gradient(90deg, rgba(60,54,40,"+(0.30*a).toFixed(3)+") 0%, rgba(60,54,40,0) 55%)";
    if(k>=1){ clearInterval(iv); }
  },40);
  setTimeout(function(){
    sheet.classList.remove("turn");
    sh.style.background="none";
    store.page+=1; store.yellow+=1; store.panel=0;
    effects=[]; curPanel=0; panelCount=0; panelStart=stormT; oversizeUsed=false;
    pickBlank();
    PR=rnd(store.page*7919+13);
    geometry(); drawSheet(); save();
    turning=false;
  },1000);
}

/* ---------- clock ---------- */
var lastTick=0, acc=0, rate=0, waterLevel=0, pendingFalls=[];
function step(now){
  requestAnimationFrame(step);
  if(!lastTick) lastTick=now;
  var dt=Math.min(0.1,(now-lastTick)/1000); lastTick=now;
  if(turning) return;
  stormT+=dt; acc+=dt;

  /* impacts per bay per second */
  var made=0;
  for(var b=0;b<BAYS;b++){
    var lam=intensity(stormT,b)*3.4*dt;
    var n=Math.floor(lam)+((Math.random()<(lam%1))?1:0);
    for(var i=0;i<n;i++){
      var ev=makeImpact(b,stormT);
      made++;
      var near=ev.atGutter?0.72:0.34;
      var pan=((b+0.5)/BAYS-0.5)*1.7;
      if(ctx) playEvent(ev,pan,near);
      if(ev.kind==="break"){
        breaks++;
        if(window.console&&console.log) console.log("bay "+(b+1)+" · "+ev.d.toFixed(0)+" mm · "+ev.vel.toFixed(1)+" m/s · "+ev.En.toFixed(2)+" J normal · thr "+ev.thr.toFixed(2)+" · out");
        pendingFalls.push({t:stormT+0.3+Math.random()*0.4, ev:ev});
      } else ticks++;
      /* lettering: only what the letterer can get down */
      var cap=panelCap[curPanel];
      var got=effects.filter(function(x){return x.panel===curPanel;}).length;
      var wants = ev.kind==="break" || ev.kind==="skid" ||
                  (ev.kind==="thump"&&Math.random()<0.55) ||
                  (ev.kind==="tick"&&Math.random()<(curPanel<2?0.10:0.05));
      if(wants && got<cap && curPanel!==blankPanel) placeEffect(ev);
    }
  }
  rate=rate*0.86+made/Math.max(0.001,dt)*0.14;

  for(var f=pendingFalls.length-1;f>=0;f--){
    if(pendingFalls[f].t<=stormT){
      var fe=pendingFalls[f].ev;
      var got2=effects.filter(function(x){return x.panel===curPanel;}).length;
      if(got2<panelCap[curPanel] && curPanel!==blankPanel && Math.random()<0.7){
        var fev={kind:"fall",bay:fe.bay,atGutter:true,onConcrete:fe.onConcrete,
          peak:0.55,attack:0.002,decay:0.22,dur:0.30,noise:0.8,
          centroid:fe.onConcrete?3600:880};
        placeEffect(fev);
      }
      pendingFalls.splice(f,1);
    }
  }

  if(ctx){
    var target=Math.min(1,rate/22)*0.155;
    roarG.gain.setTargetAtTime(target,T(),0.35);
    waterLevel=Math.min(1, breaks/240 + stormT/900);
    waterG.gain.setTargetAtTime(waterLevel*0.055,T(),1.2);
    tarpNext-=dt;
    if(tarpNext<=0){ tarpSnap(); tarpNext=0.6+Math.random()*2.4;
      if(Math.random()<0.22 && curPanel!==blankPanel && effects.filter(function(x){return x.panel===curPanel;}).length<panelCap[curPanel]){
        placeEffect({kind:"tarp",bay:Math.floor(Math.random()*BAYS),atGutter:true,onConcrete:false,
          peak:0.62,attack:0.0015,decay:0.13,dur:0.16,noise:0.86,centroid:1500});
      }
    }
    gravelNext-=dt;
    if(gravelNext<=0){ gravelStep(); gravelNext=2.5+Math.random()*6; }
    if(dieselState===0 && stormT>26){ dieselState=1; dieselStart=stormT; }
    if(dieselState===1 && stormT>dieselStart+1.4){
      dieselRun();
      if(curPanel!==blankPanel) placeEffect({kind:"diesel",bay:0,atGutter:true,onConcrete:false,
        peak:0.7,attack:0.02,decay:0.5,dur:0.55,noise:0.5,centroid:340});
    }
    if(waterLevel>0.45 && Math.random()<dt*0.35 && curPanel!==blankPanel &&
       effects.filter(function(x){return x.panel===curPanel;}).length<panelCap[curPanel]){
      placeEffect({kind:"water",bay:BAYS-1,atGutter:true,onConcrete:true,
        peak:0.42,attack:0.006,decay:0.18,dur:0.22,noise:0.7,centroid:700});
    }
  }

  /* panel is full, or has held for its time */
  var here=effects.filter(function(x){return x.panel===curPanel;}).length;
  if(stormT-panelStart>panelDur[curPanel] || (curPanel!==blankPanel && here>=panelCap[curPanel])){
    curPanel++; panelStart=stormT; store.panel=curPanel;
    if(curPanel>5){ save(); turnPage(); }
    else save();
  }
}

/* ---------- restore, forward only ---------- */
function serialise(){
  return effects.map(function(e){
    return {word:e.word,u:e.u,v:e.v,panel:e.panel,ink:e.ink,rot:e.rot,seed:e.seed,base:e.base,ev:e.ev};
  });
}
function restore(){
  if(!store.fx||!store.fx.length) return;
  for(var i=0;i<store.fx.length;i++){
    var s=store.fx[i];
    if(s.panel===blankPanel) continue;
    var e={word:s.word,u:s.u,v:s.v,panel:s.panel,ink:s.ink||0,rot:s.rot,seed:s.seed,base:s.base,ev:s.ev};
    effects.push(e); renderEffect(e);
  }
}

function audioResume(){
  audioInit();
  if(ctx && ctx.state==="suspended") ctx.resume();
}
document.addEventListener("pointerdown",audioResume,{passive:true});
document.addEventListener("keydown",audioResume,{passive:true});

window.addEventListener("resize",function(){
  geometry(); drawSheet(); reflow();
});
window.addEventListener("beforeunload",save);

geometry();
drawSheet();
curPanel=Math.min(5,store.panel||0);
if(curPanel>=6){ curPanel=0; store.panel=0; }
restore();
panelStart=0;
requestAnimationFrame(step);

if(window.console&&console.log){
  console.log("Zwethlaan · 8 bays · 4 mm float · 73 × 165 · slope 22° · cell from 225° at 40 km/h");
  console.log("terminal velocity 4.3·√d · a 20 mm stone carries about eleven times the 10 mm stone");
}
})();
