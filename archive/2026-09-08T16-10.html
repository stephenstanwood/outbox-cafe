  <meta name="outbox-spec-era" content="Late April 1961, right now — twenty to twelve on a warm bright Thursday in the ground-floor window of a costume jewellery and button factory showroom on Providence's Broad Street, where a hand-lettered showcard advertising a spring line of enamelled dogwood brooches has been sun-faded for eleven weeks in a south window and the salesman has finally been told to redo it. Not a look-back at anything, not a lament, not a memory of a vanished trade: the buyer from a Boston chain comes through at two, the card must read from the sidewalk, and the sign painter's one-shot lettering enamel has skinned over in the can.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SENTENCE, set at true showcard scale, and every single letterform in it is a separate physical object with its own age. No header, no menu, no title, no scrollbar, no navigation, no site furniture of any kind — twenty-two words, edge to edge, and nothing else. The strangeness is that the sentence is not typeset; it is PAINTED, letter by letter, and the letters are at wildly different stages of the job. Some are finished and hard and already fading. Some are still wet and gloss and sagging under their own weight, running a fraction of a millimetre downward every few seconds and never stopping. Some are only pencilled guidelines with no paint in them at all, so the word is legible as an outline and nothing more. Two words have been painted over a previous, different word and the ghost of the old copy shows through the new coat, permanently, because the primer was too thin. The visitor's entire vocabulary is three things a hand does at a showcard easel: DRAG the brush across any letter to lay another stroke of enamel, which really adds thickness, really increases the sag rate, and really raises the gloss; PRESS AND HOLD on any letter to let it stand in the window light, which runs real UV fade time forward on that letter and only that letter, so the sentence's letters drift out of colour agreement with each other permanently; and CLICK any pencilled guideline to erase it, which removes the only thing telling you where that letter was supposed to sit. There is no correct state. The sentence gets progressively harder to read across the whole life of the page and never gets easier. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat pigment chemistry and flat surface mechanics of a hand-lettered window showcard, and specifically that the sign painter's whole problem is that paint is a liquid for hours and a solid for years and the two states have opposite failure modes. That lettering enamel is a bodied alkyd carrying pigment, and it is thinned to a viscosity where it will FLOW off a quill and level out its own brush marks by capillary action — which is exactly the same property that makes it sag on a vertical card, so the film thickness that gives a clean full-bodied letter is the film thickness that begins to creep, and the difference between them is one loaded stroke. That sag is a function of thickness cubed and of ambient temperature, so a card lettered in a hot south window sags visibly more than the identical card lettered at the back of the shop, and the sag runs on the SAME clock as the skin-over, which means a letter is at maximum risk in the first eight minutes and safe thereafter. That the paint skins from the top down because the alkyd cures by oxygen uptake from the surface inward, which is why a can left open forty minutes has a rubber lid on it and liquid underneath, and why anything picked up through that skin drags lumps into the letter. That the quill is the entire tool: the hair holds a reservoir and lays a stroke of width set by pressure and by how far the heel is loaded, so a stroke is one continuous pull with no going back — a stroke that is gone over a second time while wet does not blend, it drags, because the underlying film has already begun to set. That LETTER SPACING is optical and not metric: the eye reads area between letters and not distance between them, so a round letter beside a round letter must be set tighter than two straight letters or it reads as a hole in the word, and a card spaced by measurement always looks wrong from the sidewalk. That guidelines are pencil on chip board and pencil under enamel is permanent, because the enamel wets the graphite and locks it, so the guideline must be light enough to cover or it shows in the letter for the life of the card. That LIGHTFASTNESS is the whole problem of a south window: the organic reds and the toluidines are fugitive under real UV and shift measurably in weeks, the cadmium yellows hold, the carbon black holds indefinitely, so a card that was a balanced two-colour job in February is a black card with a pink ghost on it in April, and the fading is not uniform because thick film fades slower than thin. That REPAINTING OVER OLD COPY needs an opaque ground and does not get one, so the old word telegraphs through and shows worse over time as the top coat becomes more transparent with age — every alkyd goes clearer as it cures and everything painted out eventually comes back. That gloss is a surface-flatness question and nothing else, so a letter brushed once is glossy and a letter fussed over is dull, and gloss is what carries a card across a sidewalk in sunlight. And the flat arithmetic in the window, which is twenty-two words, four hours until the buyer, a can with a skin on it, and a card that has to read from thirty feet.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no commentary anywhere on the page — the only readable characters are the words of the sentence itself, and they are copy for brooches. The register lives entirely in the enamel, the quill and the window light, and that register is WET, GLOSSY, WARM, SLOW-MOVING and PLAINLY COMMERCIAL — paint that levels visibly, a sag that is not dramatic and cannot be stopped, a skin on the can that has to be picked off, hard flat late-morning sun coming through plate glass at an angle that puts a real hot rectangle across the lower third of the card and fades what sits in it faster than what sits beside it. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the wet letters go on sagging whether or not anybody is looking. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT reverent, NOT precious — this is a showcard being redone in a window at twenty to twelve with a buyer coming at two.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the most important colour on the page is COMPUTED and never chosen. The card is chip board in a hard dry warm grey-buff (#cfc3a6), going measurably yellower and browner inside the hot sun rectangle across the lower third (#c0ae87) and greyer along the handled top edge (#b2a893), with real board tooth that breaks a fast stroke. Against that, EVERY LETTER'S COLOUR IS THE OUTPUT OF THE FILM ARITHMETIC: each letter stores an actual pigment load, an actual wet film thickness, an actual cure fraction and an actual accumulated UV dose, and its rendered hue, value and gloss are interpolated from those four numbers alone — wet and thick it is a saturated deep toluidine red with a hard specular running down its own sag (#c2261f, highlight #f7e2dd), half cured it dulls a step and the specular narrows (#ab2a24), fully cured and unfaded it is flat and dense (#9d2b26), lightly faded it pinks and loses body (#c06a63), badly faded in the sun rectangle it goes a chalky salmon-grey with the board showing through (#cf9b91). Nobody anywhere picks a shade and the disagreement between letters is arithmetic made visible. Pencil guidelines are hard graphite (#6a675e) and go a shade darker and slightly waxy wherever enamel has been laid over them, permanently. Ghost copy showing through a repaint renders as whatever the buried colour currently is, at a real transparency that INCREASES with the top coat's cure age, so the old word is more legible later than it is now. Gloss is a real function of surface flatness: one clean stroke throws a hard bright specular (#fbf6ee), a fussed letter throws none at all. Exactly one chip of cadmium showcard yellow (#e8b21c) is held strictly for the three words of the price line and the rule under them, because cadmium holds and everything else in the window does not — it never appears in the body copy, never in a guideline, never on the board. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest sag, honest gloss, honest fade and honest ghosting.">
  <meta name="outbox-spec-wildcard" content="There is a dead moth on the card. It got onto the wet ground coat in March, is now fully embedded in cured enamel about a third of the way along the second line, and the letter it interrupts was painted around it rather than over it, so that word has a real gap in it with a moth in the gap. The engine treats it as permanent geometry: strokes flow around it, paint laid on it beads and refuses to take, sag tails divert around it, it casts a real small shadow in the raking window light, and it accumulates UV dose like everything else and is measurably paler than it was. It cannot be picked off, scraped, painted over, clicked, moved or removed by anything the visitor can do. Nothing on the page accounts for it. Same moth, same word, same gap, every visit.">
  <meta name="outbox-spec-forbidden" content="NO paint-as-metaphor for anything — not what fades, not what we cover up, not the ghost of the old word as memory or regret, not 'everything painted out eventually comes back' as a statement about people; this is an alkyd clearing as it cures and it has nothing to teach anybody. ABSOLUTELY NO sign-painter romance: no reverence for the hand-lettered, no 'the last of the brush men', no vinyl-killed-it lament, no Better Letters, no craft-revival register, no artisan sermon, no craftsman-sage, no 'the old lettermen could space a word blind', no master-and-apprentice arc, no beautiful-trade elegy. NO nostalgia, NO wistfulness, NO decline narrative of any kind — the buyer comes at two and the card is not finished. NO typography reverence: no love of letterforms, no serif poetry, no Helvetica documentary register, no 'the space between letters is where the magic is', no design-history essay, no Gill, no Bauhaus, no modernist framing. NO colour lyricism: no describing red as warm, bloody, alive, or fading like anything; colour here is pigment class, film thickness and accumulated dose. NO sensuous material writing about enamel, brush hair or board beyond viscosity, thickness, cure fraction, gloss and tooth. NO fading-as-mortality, NO time-passing reverie, NO memento mori, NO 'the sun takes everything', NO entropy sermon, NO the-work-outlives-the-worker. NO Rhode Island or New England travelogue and NO explaining Providence to anybody: no mill-town pathos, no immigrant-labour arc, no Mafia joke, no deindustrialisation, no costume-jewellery-capital-of-the-world boast, no Lovecraft, no 1961-as-period-signifier, no Kennedy, no Cold War drift, no Mad Men register, no mid-century-modern kitsch, no camp or ironic affection for the brooches, the showcard or the copy. NO advertising-as-manipulation critique and NO consumerism sermon. NO retail or salesman comedy, NO Willy Loman, NO boss-as-villain, NO buyer-as-antagonist. NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, process-video, painting-video, ambient-visualiser, generative-art-gallery or screensaver framing whatsoever, and no 'watch it settle'. NO chemistry-as-wonder, NO teaching voice, NO explainer, NO science-communicator enthusiasm — the page explains nothing to anybody. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror, found-signage or ominous dread about the running letters, the ghost copy, the moth or the sentence becoming unreadable — nothing here is wrong. NO erasure-poetry framing, NO 'what remains speaks louder', NO found-poem preciousness about the degrading sentence, NO redaction allegory. NO archival / museum / cabinet / drawer / collection / found-object / relic framing of the card — it was pulled out of the window this morning and it is wet right now. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty to twelve on a bright warm morning with the window full of sun. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- glyphs
   monoline showcard gothic, unit box: cap top y=0, baseline y=1        */
const G = {
 A:{w:.62,s:[[[0,1],[.31,0],[.62,1]],[[.12,.66],[.50,.66]]]},
 B:{w:.60,s:[[[0,0],[0,1]],[[0,0],[.34,0],[.53,.11],[.53,.37],[.34,.49],[0,.49]],[[0,.49],[.38,.49],[.58,.62],[.58,.87],[.38,1],[0,1]]]},
 C:{w:.62,s:[[[.60,.19],[.46,.04],[.26,0],[.09,.13],[.02,.5],[.09,.87],[.26,1],[.46,.96],[.60,.81]]]},
 D:{w:.63,s:[[[0,0],[0,1]],[[0,0],[.30,0],[.55,.17],[.61,.5],[.55,.83],[.30,1],[0,1]]]},
 E:{w:.58,s:[[[0,0],[0,1]],[[0,0],[.55,0]],[[0,.49],[.44,.49]],[[0,1],[.57,1]]]},
 F:{w:.56,s:[[[0,0],[0,1]],[[0,0],[.54,0]],[[0,.49],[.43,.49]]]},
 G:{w:.65,s:[[[.60,.19],[.46,.04],[.26,0],[.09,.13],[.02,.5],[.09,.87],[.28,1],[.48,.96],[.62,.80],[.62,.58]],[[.62,.58],[.38,.58]]]},
 H:{w:.63,s:[[[0,0],[0,1]],[[.63,0],[.63,1]],[[0,.5],[.63,.5]]]},
 I:{w:.22,s:[[[.11,0],[.11,1]]]},
 J:{w:.52,s:[[[.48,0],[.48,.78],[.38,.96],[.20,1],[.05,.85]]]},
 K:{w:.60,s:[[[0,0],[0,1]],[[.57,0],[.05,.56]],[[.21,.40],[.60,1]]]},
 L:{w:.54,s:[[[0,0],[0,1]],[[0,1],[.54,1]]]},
 M:{w:.78,s:[[[0,1],[0,0],[.39,.62],[.78,0],[.78,1]]]},
 N:{w:.64,s:[[[0,1],[0,0],[.64,1],[.64,0]]]},
 O:{w:.66,s:[[[.33,0],[.57,.13],[.66,.5],[.57,.87],[.33,1],[.09,.87],[0,.5],[.09,.13],[.33,0]]]},
 P:{w:.59,s:[[[0,0],[0,1]],[[0,0],[.35,0],[.57,.13],[.57,.38],[.35,.51],[0,.51]]]},
 Q:{w:.66,s:[[[.33,0],[.57,.13],[.66,.5],[.57,.87],[.33,1],[.09,.87],[0,.5],[.09,.13],[.33,0]],[[.40,.76],[.68,1.07]]]},
 R:{w:.61,s:[[[0,0],[0,1]],[[0,0],[.35,0],[.57,.13],[.57,.38],[.35,.51],[0,.51]],[[.28,.51],[.61,1]]]},
 S:{w:.58,s:[[[.56,.15],[.43,.02],[.21,.02],[.05,.16],[.08,.36],[.30,.47],[.49,.57],[.57,.76],[.45,.96],[.21,1],[.04,.85]]]},
 T:{w:.60,s:[[[0,0],[.60,0]],[[.30,0],[.30,1]]]},
 U:{w:.63,s:[[[0,0],[0,.72],[.12,.94],[.31,1],[.51,.94],[.63,.72],[.63,0]]]},
 V:{w:.62,s:[[[0,0],[.31,1],[.62,0]]]},
 W:{w:.86,s:[[[0,0],[.19,1],[.43,.28],[.67,1],[.86,0]]]},
 X:{w:.60,s:[[[0,0],[.60,1]],[[.60,0],[0,1]]]},
 Y:{w:.60,s:[[[0,0],[.30,.52],[.60,0]],[[.30,.52],[.30,1]]]},
 Z:{w:.58,s:[[[0,0],[.58,0],[0,1],[.58,1]]]},
 "_":{w:3.4,s:[[[0,.52],[3.4,.52]]]}
};
const ROUND = "OCGQSDUB";
const DIAG  = "AVWXY";

/* ---------------------------------------------------------------- copy */
const WORDS = [
 "NEW","SPRING","LINE","NOW","SHOWING","ENAMELLED","DOGWOOD","BROOCHES","IN",
 "FOUR","FINISHES","HAND","SET","EVERY","PIECE","BOXED","ASK","INSIDE","FOR",
 "THE","FULL","CARD"];
const PRICE = ["TWO","NINETY","EIGHT"];
const GHOSTS = {3:"JUST", 9:"THREE"};      // painted out; primer too thin
const MOTH_WORD = 6, MOTH_LETTER = 4;      // second O of DOGWOOD, March

/* ---------------------------------------------------------------- consts */
const DIFF = 0.00170;   // oxygen uptake, surface inward
const SAGK = 0.000300;  // creep coefficient, thickness cubed
const LF   = { red: 0.000125, cad: 0.0000075, ghost: 0.000125 };
const SUNFLUX = 1.0, SHADEFLUX = 0.26, HOLDMULT = 90;
const SKIN_AFTER = 40*60; // seconds before the can carries lumps
const KEY = "broadst.showcard.v2";

/* ---------------------------------------------------------------- utils */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const r2=x=>Math.round(x*100)/100, cl=(v,a,b)=>v<a?a:v>b?b:v;
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgba(c,a){return "rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a+")";}
const C_WET=hx("#c2261f"), C_HALF=hx("#ab2a24"), C_CURE=hx("#9d2b26"),
      C_F1=hx("#c06a63"),  C_F2=hx("#cf9b91"),
      C_SPEC=hx("#fbf6ee"), C_HI=hx("#f7e2dd"),
      Y_WET=hx("#f2c437"), Y_CURE=hx("#e8b21c"), Y_FADE=hx("#d9ab3a"),
      PENCIL=hx("#6a675e"), PENCIL_LOCK=hx("#4e4c46");

function filmColour(pig,cure,fade){
  if(pig==="cad"){
    let b = cure<.5 ? mix(Y_WET,Y_CURE,cure*2) : Y_CURE;
    return mix(b,Y_FADE,cl(fade,0,1));
  }
  let b = cure<.5 ? mix(C_WET,C_HALF,cure*2) : mix(C_HALF,C_CURE,(cure-.5)*2);
  return fade<.5 ? mix(b,C_F1,fade*2) : mix(C_F1,C_F2,(fade-.5)*2);
}

/* ---------------------------------------------------------------- resample */
function resample(poly, step){
  const out=[]; let carry=0;
  out.push([poly[0][0],poly[0][1]]);
  for(let i=0;i<poly.length-1;i++){
    const a=poly[i],b=poly[i+1];
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
    let d=step-carry;
    while(d<L){ out.push([a[0]+dx*d/L, a[1]+dy*d/L]); d+=step; }
    carry=L-(d-step);
  }
  const last=poly[poly.length-1];
  const p=out[out.length-1];
  if(Math.hypot(last[0]-p[0],last[1]-p[1])>step*0.35) out.push([last[0],last[1]]);
  return out;
}
const GCACHE={};
function glyphNodes(ch){
  if(GCACHE[ch]) return GCACHE[ch];
  const g=G[ch]||G.I;
  const out=g.s.map(p=>resample(p, ch==="_"?0.22:0.075));
  GCACHE[ch]=out; return out;
}

/* ---------------------------------------------------------------- letters */
const letters=[]; let moth=null;
function buildLetters(){
  letters.length=0;
  const rnd=mulberry32(0x5A1E7C);
  let idx=0;
  const push=(ch,wi,pig)=>{
    const polys=glyphNodes(ch);
    const L={ch,wi,pig,idx:idx++,dose:0,strokes:[],ox:0,oy:0,cap:1,sun:false,meanT:1,bb:null,
              w:(G[ch]||G.I).w};
    const cat=rnd();
    let mode = cat<0.40?"cured":cat<0.62?"wet":cat<0.86?"pencil":"partial";
    if(pig==="cad"||ch==="_") mode="cured";
    for(const poly of polys){
      const nodes=poly.map((p,i)=>({ux:p[0],uy:p[1],dx:0,dy:0,t:0,s:0,sag:0,lump:0,bead:0,
                                    seed:rnd(),void:false}));
      const S={nodes,painted:false,gloss:0,guideErased:false,guideLocked:false,passes:0};
      let m=mode;
      if(mode==="partial") m = rnd()<0.5?"cured":"pencil";
      if(m==="cured"){
        const t=0.82+0.38*rnd(), gl=0.22+0.48*rnd();
        S.painted=true; S.guideLocked=true; S.gloss=gl; S.passes=1;
        for(const n of nodes){ n.t=t*(0.90+0.20*n.seed); n.s=n.t; n.sag=0.004+0.018*n.seed; }
      }else if(m==="wet"){
        const t=1.75+1.05*rnd(), gl=0.74+0.26*rnd();
        S.painted=true; S.guideLocked=true; S.gloss=gl; S.passes=1;
        for(const n of nodes){ n.t=t*(0.88+0.24*n.seed); n.s=0.04+0.22*rnd(); }
      }
      L.strokes.push(S);
    }
    if(mode==="cured"||pig==="cad") L.dose = 160+900*rnd();
    letters.push(L);
    return L;
  };
  for(let w=0;w<WORDS.length;w++){
    const word=WORDS[w];
    for(let i=0;i<word.length;i++){
      const L=push(word[i],w,"red");
      if(w===MOTH_WORD && i===MOTH_LETTER){
        moth={letter:L,cx:0.36,cy:0.58,r:0.27,dose:5200};
        for(const S of L.strokes) for(const n of S.nodes){
          if(Math.hypot(n.ux-moth.cx,n.uy-moth.cy)<moth.r) n.void=true;
        }
      }
    }
  }
  for(let w=0;w<PRICE.length;w++)
    for(let i=0;i<PRICE[w].length;i++) push(PRICE[w][i],100+w,"cad");
  push("_",200,"cad");
}
buildLetters();
const RULE = letters[letters.length-1];

/* ---------------------------------------------------------------- layout */
const cvs=document.getElementById("c"), ctx=cvs.getContext("2d");
let W=0,H=0,dpr=1,board=null,capH=40,sunPoly=null,lines=[],priceY=0,priceCap=20;

function gapMul(a,b){
  const ra=ROUND.indexOf(a)>=0, rb=ROUND.indexOf(b)>=0;
  const da=DIAG.indexOf(a)>=0, db=DIAG.indexOf(b)>=0;
  if(ra&&rb) return 0.52;
  if(ra||rb) return 0.76;
  if((a==="L"&&db)||(a==="T"&&db)||(da&&rb)) return 0.62;
  if(da&&db) return 0.70;
  if(a==="I"||b==="I") return 1.05;
  return 1.0;
}
function wordWidth(word,cap){
  let x=0;
  for(let i=0;i<word.length;i++){
    x+=(G[word[i]]||G.I).w*cap;
    if(i<word.length-1) x+=0.155*cap*gapMul(word[i],word[i+1]);
  }
  return x;
}
function wrap(cap,maxW){
  const ls=[]; let cur=[],cw=0;
  const sp=0.42*cap;
  for(let i=0;i<WORDS.length;i++){
    const ww=wordWidth(WORDS[i],cap);
    if(cur.length && cw+sp+ww>maxW){ ls.push({words:cur,w:cw}); cur=[i]; cw=ww; }
    else { cw += (cur.length?sp:0)+ww; cur.push(i); }
    if(ww>maxW) return null;
  }
  if(cur.length) ls.push({words:cur,w:cw});
  return ls;
}

function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const marg=W*0.045, maxW=W-marg*2;
  let cap=Math.min(H*0.155, W*0.16), best=null;
  for(;cap>4;cap*=0.965){
    const ls=wrap(cap,maxW);
    if(!ls) continue;
    const total=ls.length*1.44*cap + 2.35*cap;
    if(total<=H*0.90){ best={ls,cap}; break; }
  }
  if(!best) best={ls:wrap(6,maxW)||[],cap:6};
  lines=best.ls; capH=best.cap;
  priceCap=capH*0.80;

  const bodyH=lines.length*1.44*capH, blockH=bodyH+2.35*capH;
  let y=(H-blockH)/2 + capH*0.10;
  if(y<H*0.035) y=H*0.035;

  let li=0, li2=0;
  for(const line of lines){
    let x=(W-line.w)/2;
    line.y=y; line.x0=x;
    for(const wi of line.words){
      const word=WORDS[wi];
      line.wordX = line.wordX||{}; line.wordX[wi]=x;
      for(let i=0;i<word.length;i++){
        const L=letters[li2++];
        L.ox=x; L.oy=y; L.cap=capH; L.line=li;
        x+=(G[word[i]]||G.I).w*capH;
        if(i<word.length-1) x+=0.155*capH*gapMul(word[i],word[i+1]);
      }
      x+=0.42*capH;
    }
    y+=1.44*capH; li++;
  }
  // price line
  const psp=0.46*priceCap;
  let pw=0; for(let i=0;i<PRICE.length;i++){ pw+=wordWidth(PRICE[i],priceCap); if(i<PRICE.length-1) pw+=psp; }
  priceY = y + capH*0.42;
  let px=(W-pw)/2;
  for(let w=0;w<PRICE.length;w++){
    const word=PRICE[w];
    for(let i=0;i<word.length;i++){
      const L=letters[li2++];
      L.ox=px; L.oy=priceY; L.cap=priceCap;
      px+=(G[word[i]]||G.I).w*priceCap;
      if(i<word.length-1) px+=0.155*priceCap*gapMul(word[i],word[i+1]);
    }
    px+=psp;
  }
  RULE.cap = pw/3.4;
  RULE.ox=(W-pw)/2; RULE.oy=priceY+priceCap*0.95;

  // sun rectangle: hard raking light across the lower third
  sunPoly=[[W*0.02,H*0.585],[W,H*0.585+H*0.055],[W,H*0.955+H*0.055],[W*0.02,H*0.955]];
  for(const L of letters){
    const b=bbox(L); L.bb=b;
    L.sun = inSun(b.cx,b.cy);
  }
  if(moth){
    moth.px = moth.letter.ox + moth.cx*moth.letter.cap;
    moth.py = moth.letter.oy + moth.cy*moth.letter.cap;
    moth.pr = moth.r*moth.letter.cap;
  }
  makeBoard();
}
function inSun(x,y){
  const t=x/W;
  const top=H*0.585+H*0.055*t, bot=H*0.955+H*0.055*t;
  return x>W*0.02 && y>top && y<bot;
}
function bbox(L){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const S of L.strokes) for(const n of S.nodes){
    const x=L.ox+(n.ux+n.dx)*L.cap, y=L.oy+(n.uy+n.dy+n.sag)*L.cap;
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
  }
  const pad=L.cap*0.16;
  return {x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad,cx:(x0+x1)/2,cy:(y0+y1)/2};
}

/* ---------------------------------------------------------------- board */
function makeBoard(){
  board=document.createElement("canvas");
  board.width=cvs.width; board.height=cvs.height;
  const b=board.getContext("2d");
  b.setTransform(dpr,0,0,dpr,0,0);
  b.fillStyle="#cfc3a6"; b.fillRect(0,0,W,H);
  b.fillStyle="#c0ae87";
  b.beginPath(); b.moveTo(sunPoly[0][0],sunPoly[0][1]);
  for(let i=1;i<sunPoly.length;i++) b.lineTo(sunPoly[i][0],sunPoly[i][1]);
  b.closePath(); b.fill();
  b.fillStyle="rgba(196,176,133,.55)";
  b.fillRect(0,0,W,H*0.052);
  b.fillStyle="#b2a893"; b.globalAlpha=.75; b.fillRect(0,0,W,H*0.028); b.globalAlpha=1;
  b.fillStyle="rgba(178,168,147,.35)"; b.fillRect(0,H*0.028,W,H*0.012);
  // tooth
  const id=b.getImageData(0,0,board.width,board.height), d=id.data;
  const rnd=mulberry32(0x1EA5);
  for(let i=0;i<d.length;i+=4){
    const n=(rnd()-0.5)*17;
    d[i]=cl(d[i]+n,0,255); d[i+1]=cl(d[i+1]+n*0.95,0,255); d[i+2]=cl(d[i+2]+n*0.8,0,255);
  }
  b.putImageData(id,0,0);
  // fibres, thumb smudge on the handled edge
  b.strokeStyle="rgba(150,140,118,.28)"; b.lineWidth=1;
  for(let i=0;i<260;i++){
    const x=rnd()*W,y=rnd()*H,a=rnd()*6.28,l=2+rnd()*9;
    b.beginPath(); b.moveTo(x,y); b.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); b.stroke();
  }
  b.fillStyle="rgba(150,142,124,.16)";
  for(let i=0;i<7;i++) b.beginPath(),b.ellipse(W*(0.12+0.13*i)+rnd()*20,H*0.016,W*0.035,H*0.012,0,0,6.28),b.fill();
}

/* ---------------------------------------------------------------- physics */
let cardMinutes=0, firstSeen=Date.now(), lastSeen=Date.now(), canOpened=Date.now();

function step(dt){
  cardMinutes += dt/60;
  for(const L of letters){
    const flux = L.sun?SUNFLUX:SHADEFLUX;
    L.dose += flux*dt;
    const temp = L.sun?1.45:1.0;
    let tot=0,cnt=0;
    for(const S of L.strokes){
      if(!S.painted) continue;
      for(const n of S.nodes){
        if(n.void||n.t<=0.002) continue;
        n.s += DIFF*dt/(n.s+0.06);
        if(n.s>n.t) n.s=n.t;
        const cure=n.s/n.t, mob=(1-cure)*(1-cure);
        if(mob>1e-5){
          n.sag += SAGK*n.t*n.t*n.t*temp*mob*dt;
        }
        tot+=n.t; cnt++;
      }
    }
    L.meanT = cnt? tot/cnt : 0.9;
  }
  if(moth) moth.dose += (inSun(moth.px||0,moth.py||0)?SUNFLUX:SHADEFLUX)*dt;
}
function fadeOf(L){
  const lf=LF[L.pig]||LF.red;
  return 1-Math.exp(-L.dose*lf/(0.45+L.meanT));
}

/* ---------------------------------------------------------------- render */
function halfW(t,cap){ return cap*(0.042+0.031*Math.min(t,3.2)); }

function strokeBody(nodes,L,col,alpha,glossAmt,curem){
  const cap=L.cap;
  // segments split at voids
  let run=[];
  const flush=()=>{
    if(run.length>=2){
      ctx.beginPath();
      for(let i=0;i<run.length;i++){
        const n=run[i], p=nodeXY(n,L), w=halfW(n.t,cap)*(1+n.lump*0.55);
        const nb=norm(run,i,L);
        if(i===0) ctx.moveTo(p.x+nb.x*w,p.y+nb.y*w); else ctx.lineTo(p.x+nb.x*w,p.y+nb.y*w);
      }
      for(let i=run.length-1;i>=0;i--){
        const n=run[i], p=nodeXY(n,L), w=halfW(n.t,cap)*(1+n.lump*0.55);
        const nb=norm(run,i,L);
        ctx.lineTo(p.x-nb.x*w,p.y-nb.y*w);
      }
      ctx.closePath();
      ctx.fillStyle=rgba(col,alpha); ctx.fill();
      // specular: one clean pull throws a hard line, a fussed letter throws none
      if(glossAmt>0.04){
        ctx.beginPath();
        for(let i=0;i<run.length;i++){
          const n=run[i],p=nodeXY(n,L),w=halfW(n.t,cap),nb=norm(run,i,L);
          const sx=p.x+nb.x*w*0.36-cap*0.012, sy=p.y+nb.y*w*0.36-cap*0.012;
          if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
        }
        ctx.strokeStyle=rgba(curem<0.4?C_HI:C_SPEC, glossAmt);
        ctx.lineWidth=Math.max(0.7,cap*0.017*(1+ (1-curem)));
        ctx.lineCap="round"; ctx.stroke();
      }
    }
    run=[];
  };
  for(const n of nodes){ if(n.void){ flush(); } else run.push(n); }
  flush();
}
function nodeXY(n,L){ return {x:L.ox+(n.ux+n.dx)*L.cap, y:L.oy+(n.uy+n.dy+n.sag)*L.cap}; }
function norm(arr,i,L){
  const a=arr[Math.max(0,i-1)], b=arr[Math.min(arr.length-1,i+1)];
  const pa=nodeXY(a,L), pb=nodeXY(b,L);
  let dx=pb.x-pa.x, dy=pb.y-pa.y, m=Math.hypot(dx,dy)||1;
  return {x:-dy/m, y:dx/m};
}

function drawTails(L,col,alpha){
  const cap=L.cap;
  for(const S of L.strokes){
    if(!S.painted) continue;
    for(const n of S.nodes){
      if(n.void||n.sag<0.018) continue;
      const bx=L.ox+(n.ux+n.dx)*cap, by=L.oy+(n.uy+n.dy)*cap;
      const p=nodeXY(n,L);
      let w=halfW(n.t,cap);
      let ox=0;
      if(moth && moth.letter===L){ // a run diverts round the moth
        const d=Math.hypot(bx-moth.px, p.y-moth.py);
        if(d<moth.pr*1.2) ox = (bx<moth.px?-1:1)*moth.pr*0.32;
      }
      ctx.beginPath();
      ctx.moveTo(bx-w*0.92,by);
      ctx.lineTo(bx+w*0.92,by);
      ctx.lineTo(p.x+ox+w*0.46,p.y);
      ctx.lineTo(p.x+ox-w*0.46,p.y);
      ctx.closePath();
      ctx.fillStyle=rgba(col,alpha*0.94); ctx.fill();
    }
  }
}

function drawGuides(L){
  const cap=L.cap;
  for(const S of L.strokes){
    if(S.painted){
      if(S.guideLocked){ // graphite wetted by enamel, locked under the film
        ctx.beginPath(); let started=false;
        for(const n of S.nodes){
          if(n.void){started=false;continue;}
          const x=L.ox+n.ux*cap, y=L.oy+n.uy*cap;
          if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
        }
        ctx.strokeStyle=rgba(PENCIL_LOCK,0.55); ctx.lineWidth=Math.max(0.6,cap*0.016); ctx.stroke();
      }
      continue;
    }
    if(S.guideErased) continue;
    ctx.beginPath(); let st=false;
    for(const n of S.nodes){
      if(n.void){st=false;continue;}
      const x=L.ox+n.ux*cap, y=L.oy+n.uy*cap;
      if(!st){ctx.moveTo(x,y);st=true;} else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=rgba(PENCIL,0.62); ctx.lineWidth=Math.max(0.6,cap*0.014);
    ctx.setLineDash([cap*0.10,cap*0.055]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function ghostAlpha(){
  const days=(Date.now()-firstSeen)/86400000;
  return cl(0.12+0.44*(1-Math.exp(-days/2.2))+cardMinutes/2600, 0, 0.62);
}
function drawGhosts(){
  const a=ghostAlpha();
  const gcol=filmColour("red",1,1-Math.exp(-5400*LF.ghost/1.35));
  for(const k in GHOSTS){
    const wi=+k, word=GHOSTS[k];
    const firstL=letters.find(L=>L.wi===wi);
    if(!firstL) continue;
    const cap=firstL.cap;
    let x=firstL.ox-cap*0.10;
    for(let i=0;i<word.length;i++){
      const ch=word[i], polys=glyphNodes(ch);
      for(const poly of polys){
        ctx.beginPath();
        for(let j=0;j<poly.length;j++){
          const px=x+poly[j][0]*cap, py=firstL.oy+poly[j][1]*cap+cap*0.012;
          if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.strokeStyle=rgba(gcol,a);
        ctx.lineWidth=cap*0.155; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.stroke();
      }
      x+=(G[ch]||G.I).w*cap;
      if(i<word.length-1) x+=0.155*cap*gapMul(ch,word[i+1]);
    }
  }
}

function drawMoth(){
  if(!moth||!moth.px) return;
  const r=moth.pr, x=moth.px, y=moth.py;
  const f=1-Math.exp(-moth.dose*0.00009);
  const body=mix(hx("#7a6c58"),hx("#c3b39b"),cl(f,0,1));
  const wing=mix(hx("#a08d72"),hx("#d3c6ae"),cl(f,0,1));
  ctx.save();
  ctx.translate(x,y); ctx.rotate(-0.28);
  // shadow in the raking light
  ctx.fillStyle="rgba(96,86,66,.30)";
  ctx.beginPath(); ctx.ellipse(r*0.16,r*0.20,r*0.80,r*0.50,0.35,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*0.16,r*0.22,r*0.72,r*0.44,-0.4,0,6.28); ctx.fill();
  // wings
  ctx.fillStyle=rgba(wing,0.95);
  ctx.beginPath(); ctx.ellipse(r*0.30,-r*0.10,r*0.76,r*0.40,0.42,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*0.30,-r*0.06,r*0.70,r*0.36,-0.46,0,6.28); ctx.fill();
  ctx.fillStyle=rgba(mix(wing,hx("#8b7a61"),0.5),0.5);
  ctx.beginPath(); ctx.ellipse(r*0.44,-r*0.02,r*0.34,r*0.16,0.42,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*0.44,r*0.02,r*0.30,r*0.15,-0.46,0,6.28); ctx.fill();
  // body + the enamel that stopped at its edge
  ctx.fillStyle=rgba(body,0.98);
  ctx.beginPath(); ctx.ellipse(0,0,r*0.15,r*0.52,0,0,6.28); ctx.fill();
  ctx.strokeStyle=rgba(body,0.9); ctx.lineWidth=Math.max(0.7,r*0.05);
  ctx.beginPath(); ctx.moveTo(0,-r*0.44); ctx.lineTo(-r*0.30,-r*0.80); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-r*0.44); ctx.lineTo(r*0.22,-r*0.86); ctx.stroke();
  ctx.restore();
  // cured meniscus where the ground coat pulled up against it
  ctx.beginPath(); ctx.arc(x,y,r*0.98,0,6.28);
  ctx.strokeStyle="rgba(157,43,38,.20)"; ctx.lineWidth=Math.max(0.8,r*0.08); ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(board,0,0,W,H);
  drawGhosts();
  for(const L of letters) drawGuides(L);
  for(const L of letters){
    const fade=fadeOf(L);
    for(const S of L.strokes){
      if(!S.painted) continue;
      let ct=0,cs=0,n=0;
      for(const nd of S.nodes){ if(nd.void)continue; ct+=nd.t; cs+=nd.s; n++; }
      if(!n||ct<=0.001) continue;
      const meanT=ct/n, cure=cl(cs/ct,0,1);
      const col=filmColour(L.pig,cure,fade);
      const alpha=cl((0.52+0.48*Math.min(meanT,1.25)/1.25)*(1-0.30*fade),0.12,1);
      const gl=cl(S.gloss*(0.24+0.62*(1-cure)) + (L.pig==="cad"?0.06:0),0,1);
      drawTails(L,col,alpha);
      strokeBody(S.nodes,L,col,alpha,gl,cure);
      // beads: paint laid on the moth refuses to take
      for(const nd of S.nodes){
        if(nd.bead>0.02){
          const p=nodeXY(nd,L);
          ctx.beginPath(); ctx.arc(p.x,p.y,L.cap*0.022*(1+nd.bead*2),0,6.28);
          ctx.fillStyle=rgba(col,alpha*0.9); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x-L.cap*0.006,p.y-L.cap*0.006,L.cap*0.008,0,6.28);
          ctx.fillStyle=rgba(C_SPEC,0.7); ctx.fill();
        }
      }
    }
  }
  drawMoth();
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------- audio */
const A={ctx:null,started:false};
function noiseBuf(ac,sec){
  const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate), d=b.getChannelData(0);
  let l=0;
  for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; l=(l+0.02*w)/1.02; d[i]=w*0.6+l*2.4; }
  return b;
}
function startAudio(){
  if(A.started) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  A.ctx=new AC(); A.started=true;
  const ac=A.ctx;
  A.master=ac.createGain(); A.master.gain.value=0.85; A.master.connect(ac.destination);
  A.nb=noiseBuf(ac,3);
  // Broad Street bed
  const tr=ac.createBufferSource(); tr.buffer=A.nb; tr.loop=true;
  const trf=ac.createBiquadFilter(); trf.type="lowpass"; trf.frequency.value=360; trf.Q.value=0.6;
  const trg=ac.createGain(); trg.gain.value=0.055;
  tr.connect(trf); trf.connect(trg); trg.connect(A.master); tr.start();
  const lfo=ac.createOscillator(); lfo.frequency.value=0.07;
  const lg=ac.createGain(); lg.gain.value=0.022; lfo.connect(lg); lg.connect(trg.gain); lfo.start();
  // radio in the next room, no words in it
  const rd=ac.createBufferSource(); rd.buffer=A.nb; rd.loop=true;
  const rf=ac.createBiquadFilter(); rf.type="bandpass"; rf.frequency.value=980; rf.Q.value=7;
  const rf2=ac.createBiquadFilter(); rf2.type="lowpass"; rf2.frequency.value=1500;
  A.radioG=ac.createGain(); A.radioG.gain.value=0.012;
  rd.connect(rf); rf.connect(rf2); rf2.connect(A.radioG); A.radioG.connect(A.master); rd.start();
  const rv=ac.createOscillator(); rv.type="sine"; rv.frequency.value=0.9;
  const rvg=ac.createGain(); rvg.gain.value=340; rv.connect(rvg); rvg.connect(rf.frequency); rv.start();
  // quill drag chain
  A.qs=ac.createBufferSource(); A.qs.buffer=A.nb; A.qs.loop=true;
  A.qf=ac.createBiquadFilter(); A.qf.type="bandpass"; A.qf.frequency.value=1700; A.qf.Q.value=1.1;
  A.qg=ac.createGain(); A.qg.gain.value=0.0001;
  A.qs.connect(A.qf); A.qf.connect(A.qg); A.qg.connect(A.master); A.qs.start();

  scheduleBus(); schedulePress(); scheduleCreak();
  setTimeout(screenDoor, 22000+Math.random()*30000);
  setTimeout(screenDoor, 240000+Math.random()*180000);
}
function env(node,g,t0,a,d,peak){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}
function burstNoise(t0,f,q,peak,dur,type){
  const ac=A.ctx; if(!ac) return;
  const s=ac.createBufferSource(); s.buffer=A.nb;
  const bf=ac.createBiquadFilter(); bf.type=type||"bandpass"; bf.frequency.value=f; bf.Q.value=q;
  const g=ac.createGain();
  s.connect(bf); bf.connect(g); g.connect(A.master);
  env(s,g,t0,0.006,dur,peak);
  s.start(t0); s.stop(t0+dur+0.06);
  return {f:bf,g:g};
}
function tone(t0,f,f2,peak,dur,type){
  const ac=A.ctx; if(!ac) return;
  const o=ac.createOscillator(); o.type=type||"sine";
  o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  const g=ac.createGain(); o.connect(g); g.connect(A.master);
  env(o,g,t0,0.008,dur,peak);
  o.start(t0); o.stop(t0+dur+0.08);
}
function scheduleBus(){
  if(!A.ctx) return;
  const t=A.ctx.currentTime+0.2;
  const b=burstNoise(t,180,0.8,0.09,4.6,"lowpass");
  if(b){ b.f.frequency.setValueAtTime(90,t); b.f.frequency.linearRampToValueAtTime(330,t+2.0);
         b.f.frequency.linearRampToValueAtTime(120,t+4.4); }
  tone(t+1.6,86,80,0.055,2.6);      // plate glass takes it up
  tone(t+1.7,231,226,0.020,2.2);
  setTimeout(scheduleBus, 42000+Math.random()*95000);
}
function schedulePress(){
  if(!A.ctx) return;
  const n=4+Math.floor(Math.random()*6), t=A.ctx.currentTime+0.1;
  for(let i=0;i<n;i++){
    const tt=t+i*(0.50+Math.random()*0.10);
    tone(tt,63,44,0.075,0.20);
    burstNoise(tt,1300,2.4,0.030,0.07);
  }
  setTimeout(schedulePress, 17000+Math.random()*54000);
}
function scheduleCreak(){
  if(!A.ctx) return;
  const t=A.ctx.currentTime+0.2;
  const c=burstNoise(t,420,9,0.020,0.55);
  if(c){ c.f.frequency.setValueAtTime(380,t); c.f.frequency.linearRampToValueAtTime(560,t+0.5); }
  setTimeout(scheduleCreak, 30000+Math.random()*70000);
}
function screenDoor(){
  if(!A.ctx) return;
  const t=A.ctx.currentTime+0.1;
  const o=A.ctx.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(70,t+0.45);
  const f=A.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=520; f.Q.value=5;
  const g=A.ctx.createGain(); o.connect(f); f.connect(g); g.connect(A.master);
  env(o,g,t,0.01,0.5,0.035); o.start(t); o.stop(t+0.6);
  tone(t+0.52,110,60,0.09,0.16);
  burstNoise(t+0.52,2100,1.2,0.05,0.09);
}
let lastTack=0;
function tacky(){
  if(!A.ctx) return; const now=performance.now();
  if(now-lastTack<130) return; lastTack=now;
  const t=A.ctx.currentTime;
  const b=burstNoise(t,700,10,0.055,0.10);
  if(b){ b.f.frequency.setValueAtTime(1200,t); b.f.frequency.exponentialRampToValueAtTime(420,t+0.09); }
}
function crackle(){
  if(!A.ctx) return; const t=A.ctx.currentTime;
  for(let i=0;i<12;i++) burstNoise(t+Math.random()*0.5,2400+Math.random()*2600,6,0.016,0.02);
}
function quillSound(speed,load){
  if(!A.ctx||!A.qg) return;
  const t=A.ctx.currentTime;
  const g=cl(0.004+speed*0.0016,0,0.055);
  A.qg.gain.setTargetAtTime(g,t,0.03);
  A.qf.frequency.setTargetAtTime(700+speed*22+load*1500,t,0.05);
  A.qf.Q.setTargetAtTime(0.8+ (1-load)*2.4,t,0.05);
}
function quillOff(){ if(A.qg) A.qg.gain.setTargetAtTime(0.0001,A.ctx.currentTime,0.05); }

/* ---------------------------------------------------------------- input */
let P={down:false,moved:0,L:null,lx:0,ly:0,load:1,holding:false,touched:null,lastMove:0};

function hitLetter(x,y){
  let best=null,bd=1e9;
  for(const L of letters){
    const b=L.bb; if(!b) continue;
    if(x<b.x0-4||x>b.x1+4||y<b.y0-4||y>b.y1+4) continue;
    const d=Math.hypot(x-b.cx,y-b.cy);
    if(d<bd){bd=d;best=L;}
  }
  return best;
}
function hasPaint(L){ return L.strokes.some(S=>S.painted); }

function applyPaint(L,x,y,speed){
  const cap=L.cap;
  const u=(x-L.ox)/cap, v=(y-L.oy)/cap, r=0.215;
  const skinning = (Date.now()-canOpened)/1000 > SKIN_AFTER;
  let hitAny=false;
  for(const S of L.strokes){
    let touchedStroke=false;
    for(const n of S.nodes){
      const d=Math.hypot(u-(n.ux+n.dx), v-(n.uy+n.dy+n.sag));
      if(d>r) continue;
      hitAny=true;
      const fall=1-d/r;
      if(n.void){ n.bead=Math.min(0.55,n.bead+0.05*fall*P.load); continue; }
      const tooth=0.58+0.42*n.seed;
      const fast=cl(1-(speed-160)/900,0.45,1);
      let dep=0.155*fall*P.load*tooth*fast;
      const cure = n.t>0.002 ? n.s/n.t : 0;
      if(cure>0.35 && n.t>0.05){
        // laid across a skinned film: it drags and lifts, both stay deformed
        n.dx += (n.seed-0.5)*0.020*fall;
        n.dy += 0.011*fall;
        n.t  += dep*0.55;
        n.lump=Math.min(1,n.lump+0.22*fall);
        S.gloss*=0.90;
        if(fall>0.55) tacky();
      } else {
        n.t += dep;
      }
      if(skinning && Math.random()<0.018){ n.t+=0.45; n.lump=1; S.gloss*=0.55; }
      touchedStroke=true;
    }
    if(touchedStroke){
      if(!S.painted){ S.painted=true; S.guideLocked=true; S.guideErased=false; }
      if(!P.touched.has(S)){
        P.touched.add(S); S.passes++;
        if(S.passes<=1) S.gloss=Math.max(S.gloss,0.90);
        else S.gloss=Math.max(0.05,S.gloss*0.52);
      }
      P.load=Math.max(0.14,P.load-0.011);
    }
  }
  if(hitAny) L.bb=bbox(L);
}

function pos(e){
  const r=cvs.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
cvs.addEventListener("pointerdown",e=>{
  startAudio();
  const p=pos(e);
  P.down=true; P.moved=0; P.lx=p.x; P.ly=p.y; P.load=1; P.touched=new Set(); P.holding=false;
  P.L=hitLetter(p.x,p.y);
  if((Date.now()-canOpened)/1000>SKIN_AFTER) crackle();  // skin off the rim first
  cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener("pointermove",e=>{
  if(!P.down) return;
  const p=pos(e);
  const dx=p.x-P.lx, dy=p.y-P.ly, d=Math.hypot(dx,dy);
  const now=performance.now();
  const dt=Math.max(8,now-P.lastMove); P.lastMove=now;
  const speed=d/dt*1000;
  P.moved+=d;
  if(P.moved>7){
    const steps=Math.max(1,Math.ceil(d/3));
    for(let i=1;i<=steps;i++){
      const x=P.lx+dx*i/steps, y=P.ly+dy*i/steps;
      const L=hitLetter(x,y);
      if(L) applyPaint(L,x,y,speed);
    }
    quillSound(speed,P.load);
  }
  P.lx=p.x; P.ly=p.y;
});
function endPointer(){
  if(!P.down) return;
  if(P.moved<=7 && P.L){
    if(!hasPaint(P.L)){
      // a tap on a pencilled guideline takes it off the board
      let any=false;
      for(const S of P.L.strokes) if(!S.painted && !S.guideLocked && !S.guideErased){ S.guideErased=true; any=true; }
      if(any){ if(A.ctx){ const t=A.ctx.currentTime; burstNoise(t,3200,3,0.02,0.09);} }
    }
  }
  P.down=false; P.L=null; P.holding=false; quillOff(); save();
}
cvs.addEventListener("pointerup",endPointer);
cvs.addEventListener("pointercancel",endPointer);
cvs.addEventListener("pointerleave",()=>{ if(P.down&&P.moved>7) quillOff(); });
cvs.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------------------------------------------------------------- persist */
function save(){
  try{
    const data={v:2,fs:firstSeen,ls:Date.now(),co:canOpened,mn:r2(cardMinutes),
      md: moth?Math.round(moth.dose):0,
      L:letters.map(L=>[Math.round(L.dose),L.strokes.map(S=>{
        const arr=[S.painted?1:0,r2(S.gloss),S.guideErased?1:0,S.guideLocked?1:0,S.passes];
        const n=[];
        for(const nd of S.nodes) n.push(r2(nd.t),r2(nd.s),r2(nd.sag),r2(nd.dx),r2(nd.dy),r2(nd.lump),r2(nd.bead));
        arr.push(n); return arr;
      })])};
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(e){}
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw) { firstSeen=Date.now(); lastSeen=Date.now(); canOpened=Date.now(); return; }
  let d=null;
  try{ d=JSON.parse(raw); }catch(e){ return; }
  if(!d||!d.L||d.L.length!==letters.length) return;
  firstSeen=d.fs||Date.now(); lastSeen=d.ls||Date.now(); canOpened=d.co||firstSeen;
  cardMinutes=d.mn||0; if(moth) moth.dose=d.md||moth.dose;
  for(let i=0;i<letters.length;i++){
    const L=letters[i], rec=d.L[i];
    L.dose=rec[0]||0;
    const ss=rec[1]||[];
    for(let j=0;j<L.strokes.length && j<ss.length;j++){
      const S=L.strokes[j], r=ss[j];
      S.painted=!!r[0]; S.gloss=r[1]||0; S.guideErased=!!r[2]; S.guideLocked=!!r[3]; S.passes=r[4]||0;
      const n=r[5]||[];
      for(let k=0;k<S.nodes.length;k++){
        const b=k*7; if(b+6>=n.length+1) break;
        const nd=S.nodes[k];
        nd.t=n[b]||0; nd.s=n[b+1]||0; nd.sag=n[b+2]||0;
        nd.dx=n[b+3]||0; nd.dy=n[b+4]||0; nd.lump=n[b+5]||0; nd.bead=n[b+6]||0;
      }
    }
  }
  // the card stood in the window while nobody was here
  const away=cl((Date.now()-lastSeen)/1000,0,4*3600);
  if(away>1){
    const steps=Math.min(300,Math.max(1,Math.round(away/8)));
    const h=away/steps;
    for(let i=0;i<steps;i++) step(h);
  }
}

/* ---------------------------------------------------------------- loop */
let prev=performance.now();
function loop(now){
  let dt=(now-prev)/1000; prev=now;
  if(dt>0.5) dt=0.5;
  step(dt);
  if(P.down && P.moved<=7 && P.L && hasPaint(P.L)){
    // standing in the window light, this letter only
    P.L.dose += HOLDMULT*(P.L.sun?SUNFLUX:SHADEFLUX)*dt;
  }
  draw();
}

window.addEventListener("resize",()=>{ layout(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); else prev=performance.now(); });
window.addEventListener("pagehide",save);
setInterval(save,4000);

layout();
load();
layout();
requestAnimationFrame(loop);

console.log("%cSECOND CARD — 22 x 28 chip, one-shot lettering enamel","color:#9d2b26;font:14px Georgia");
console.log("copy set at 11:40. buyer at 2:00. can opened 11:04, lid on the bench. reads from thirty feet or it does not read.");
console.log("DOGWOOD has the moth in it. paint around it, do not try to pick it, it is in the ground coat since March.");
})();
</script>
