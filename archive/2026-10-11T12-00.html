  <meta name="outbox-spec-era" content="A muggy late afternoon in April 1985, about twenty-five to five, in the back sewing room of a dry-cleaner's on a commercial strip in Memphis, Tennessee. Tonight's wrestling card at the Coliseum starts at eight. The room holds a Singer industrial machine bolted to a scarred table, a box fan pointed at the seamstress, a cork wall of Polaroids of finished ring jackets, a coffee can of loose sequins sorted by colour, and a dress form wearing a floor-length satin entrance robe that is not finished. The wrestler who owns it phoned twice this morning and will be at the counter at six-thirty to collect it. Out front, the steam press is hissing through the wall and the bell over the shop door keeps going.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the whole viewport is the INSIDE LINING of the robe, the wrong side of the work, seen from where the wrestler's back will be. There is no header, no title, no menu and no front view. Everything that matters on the outside is visible only backwards and from behind. The giant sequinned name across the shoulders reads mirror-reversed as rows of knotted thread, sequin backings and pierced satin. Lightning bolts down the sleeves show up as zigzag tracks of tacking stitches. Paper pattern pieces, safety pins and handwritten tags are still pinned in. Light from the room comes through the satin wherever it is thin, so the visitor can only make out the front's design by where light leaks through the stitching. The visitor never gets to turn the robe right-side out.">
  <meta name="outbox-spec-subject" content="The entrance robe of 'The Velvet Avalanche', real name Delroy Thibodeaux-Haskins, a 290-pound babyface who has been promised a title shot tonight and wants to walk out looking like it. The robe is royal-purple satin with roughly four thousand gold sequins spelling AVALANCHE across the back in letters a foot high, plus lightning bolts down both sleeves, a stand-up collar stiffened with buckram, and a hidden inside pocket for his lucky silver dollar. Pinned to the lining are the seamstress's tags and his phoned-in requests: 'MORE SHINE ON THE V', 'collar taller than Jerry's', 'can it have a cape part (no)'. One whole letter, the second N, is still only chalked on the satin and has not been sewn yet. The subject is the fun of reading a spectacular thing entirely from its back side, where every sparkle is a knot and the glamour is all spelled backwards.">
  <meta name="outbox-spec-tone" content="The warm, bossy, sing-song voice of Mrs. Odessa Lamarr-Kowalczyk, 58, who has sewn ring jackets for twenty years and directed a Baptist youth choir for thirty. She talks with pins in her mouth, so her lines come in quick bursts on the tags and in a pencilled running commentary along the lining seams. She hollers sideways at her nephew Marcus, who is supposed to be sorting sequins out front ('Marcus, gold is GOLD, that is BRASS, baby'). She calls the wrestler 'Delroy' and never by his ring name, and she is completely and loudly sure he is going to win tonight. She hums hymn fragments while she sews, rendered as little floating musical notes. She praises good stitches as 'Hallelujah, look at that' and scolds bad ones as 'Lord, no.' She is generous, funny and in a hurry, and she is never wistful, never wry and never sentimental.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Robe-lining satin grape-purple (#4b1d6e) for the whole ground, with a real sheen band that slides across it as the cursor moves, as if the fabric were catching the room light at a new angle. Everything else is in sequin-backing gold (#e7b53c): every thread knot, tacking stitch, sequin rim, safety pin, tag string and Odessa's pencilled notes, which are the gold pushed down to a dull pencil-brass. Where room light leaks through the thin satin, the purple glows lighter, and where it leaks through a sequin hole, a point of gold flares. No other hues.">
  <meta name="outbox-spec-wildcard" content="Inside the hidden silver-dollar pocket, sewn shut, is a folded note from Delroy that can only be read by holding a light-leak halo over the pocket for several seconds. It is backwards, because it was written to be read from the front. The visitor can make out only part of it at a time. Pressing M at any point brings up for one second the reflection in the dressing mirror on the far wall, which is the only glimpse of the right side of the robe the page ever allows, and the mirror flips the backwards lettering so that AVALANCHE finally reads correctly. Nothing explains either.">
  <meta name="outbox-spec-forbidden" content="NO 'wrestling is fake' exposé, kayfabe-breaking wink or ironic distance from the sport, and NO sad-aging-wrestler, concussion, pill or broken-body pathos. NO Memphis travelogue: no Elvis, no Graceland, no Beale Street blues, no barbecue and no Southern dialect spelling. NO 1985 nostalgia or neon-and-spandex retro-kitsch irony. NO seamstress-as-invisible-labour sermon, no dignity-of-craft reverence, no master-and-apprentice arc and no 'the hands that made the stars' framing. NO costume-as-metaphor for identity, masks or performance of self. NO 'flat arithmetic of X' tradesperson voice: no reciting figures, no revised counts and no single grievance with a single point of pride. NO physics-engine solemnity, NO dry deadpan, NO lowercase fragments and NO archival, museum or relic framing of the robe. The robe goes out the door at half past six and the bell is at eight.">
