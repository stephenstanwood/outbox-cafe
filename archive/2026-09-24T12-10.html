  <meta name="outbox-spec-era" content="Autumn 1983, the first wave of pocket LCD handhelds: a cheap single-screen game-and-clock unit bought from a garage forecourt spinner rack. It has a pale grey-green reflective liquid-crystal window. Every sprite is a fixed segment printed onto the glass in its one permitted position, so the unlit 'ghost' segments are always faintly visible behind the lit ones. There is a two-button-plus-cross membrane pad, a coin-cell battery hatch and a tiny speaker that can only beep. The game is FLOCK WATCH: one sheepdog, five sheep, one hillside and one pen, all drawn in segments.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY: a real, playable sheepdog trial on a fake LCD handheld, rendered edge to edge as the unit itself. You steer the dog only by whistle, never directly. Four whistle commands are bound to the arrow keys and to four on-screen membrane buttons: COME-BYE (circle clockwise), AWAY (circle anticlockwise), WALK UP (move toward the flock) and LIE DOWN (stop dead). Your goal is to gather five sheep off the top of the hill, drive them down through a gate of two hurdles and shut them in the pen before the clock runs out. The sheep genuinely flock and flee from the dog. Every creature is snapped to the nearest pre-printed segment position, so the motion is that jerky, charming LCD hop.">
  <meta name="outbox-spec-subject" content="Wisp, a young, keen and not-quite-trained border collie on her first trial. She wants to do everything right and also wants very badly to run straight at the sheep, which scatters them. The whole game is the tug between your whistles and her enthusiasm. If she is pushed too fast she overruns and splits the flock. If she is left lying down too long she creeps forward on her own. One sheep, the segment with the slightly darker face, is an old ewe called Mrs Pargeter. She always breaks for the wall and has to be headed off. A rabbit segment in the corner lights up occasionally and Wisp is desperate about it.">
  <meta name="outbox-spec-tone" content="Wisp's own thoughts, scrolling across a narrow dot-matrix strip above the field one word-chunk at a time. They are breathless, sincere, all-caps when excited, and devoted to you. 'SHEEP! Sheep sheep sheep. Okay. Lying down. I am lying down SO well.' She repeats your commands back to herself to stay focused. She apologises instantly and completely whenever the flock splits ('that was me. that was entirely me. sorry.'). She is scandalised by Mrs Pargeter and loses her whole train of thought whenever the rabbit appears. When she wins she is overjoyed and a little smug. She is never sad, never sarcastic and never wise, and she never explains herding.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Reflective LCD glass grey-green (#a3ad8f) for the screen ground and the handheld's whole face, with liquid-crystal segment black (#1f261c) for every lit sprite, button label and scrolling thought. Ghost segments are the black at about 8% opacity. A faint diagonal glare band across the glass is the only other tone permitted.">
  <meta name="outbox-spec-wildcard" content="The battery really runs down. Across a session of about fifteen real minutes, every segment grows fainter and slower to turn on, with the true LCD ghosting lag, and eventually the sheep leave smeared trails. A little contrast wheel on the unit's side can be dragged to buy back some legibility. Opening the battery hatch by clicking it restores full contrast but resets the current round. The fade level persists in localStorage. The page never mentions any of this.">

function step(){
 for(const s of sheep){let ax=0,ay=0,n=0,cx=0,cy=0;
  for(const o of sheep){if(o===s)continue;const dx=o.x-s.x,dy=o.y-s.y,d=Math.hypot(dx,dy)||.01;if(d<80){cx+=o.x;cy+=o.y;n++}if(d<16){ax-=dx/d*(16-d)/16*2.2;ay-=dy/d*(16-d)/16*2.2}}
  if(n){ax+=(cx/n-s.x)*.025;ay+=(cy/n-s.y)*.025}
  const dx=s.x-dog.x,dy=s.y-dog.y,d=Math.hypot(dx,dy)||.01;
  if(d<62){const k=(62-d)/62*5.5;ax+=dx/d*k;ay+=dy/d*k;if(s.p&&!inPen(s.x,s.y))ax-=1.6}
  if(s.p&&!inPen(s.x,s.y))ax-=.12;
  ax+=(Math.random()-.5)*.5;ay+=(Math.random()-.5)*.5;s.vx=s.vx*.5+ax;s.vy=s.vy*.5+ay;
  const sp=Math.hypot(s.vx,s.vy);if(sp>8){s.vx*=8/sp;s.vy*=8/sp}move(s,s.x+s.vx,s.y+s.vy,1)}
 let fl=sheep.filter(s=>!inPen(s.x,s.y));if(!fl.length)fl=sheep;
 const c={x:fl.reduce((a,s)=>a+s.x,0)/fl.length,y:fl.reduce((a,s)=>a+s.y,0)/fl.length};
 const dx=c.x-dog.x,dy=c.y-dog.y,d=Math.hypot(dx,dy)||.01;let mx=0,my=0;keen=Math.min(1,keen+.003);creeping=false;
 if(cmd==='cb'||cmd==='aw'){const dir=cmd==='cb'?1:-1,rx=-dx/d,ry=-dy/d,R=62-keen*22,rad=(d-R)*.25;mx=-ry*dir*6+dx/d*rad;my=rx*dir*6+dy/d*rad;const m=Math.hypot(mx,my)||1;mx*=6.5/m;my*=6.5/m}
 else if(cmd==='walk'){if(!(walkSpd<=6&&d<30)){mx=dx/d*walkSpd;my=dy/d*walkSpd}}
 else{lieT++;if(lieT>22){creeping=true;mx=dx/d*(1+keen*1.5);my=dy/d*(1+keen*1.5);if(lieT===23){say(pick(L.creep));lastSay=tk}}}
 if(cmd!=='lie'){mx+=dx/d*keen*1.8;my+=dy/d*keen*1.8}
 if(rabbitOn){const rx=RX-dog.x,ry=RY-FY-dog.y,rd=Math.hypot(rx,ry)||1;mx+=rx/rd*2.5;my+=ry/rd*2.5}
 if(Math.abs(mx)>.3)dog.f=mx<0?-1:1;move(dog,dog.x+mx,dog.y+my,0);
 let sp=0;for(const s of fl)sp=Math.max(sp,Math.hypot(s.x-c.x,s.y-c.y));
 if(sp>62&&splitArmed&&tk>cd.split){say(pick(L.split),1);lastSay=tk;cd.split=tk+40;splitArmed=false}if(sp<42)splitArmed=true;
 const p=sheep[0];if(p.x<40&&!inPen(p.x,p.y)&&tk>cd.parg){say(pick(L.parg),1);lastSay=tk;cd.parg=tk+70}
 if(rabbitOn){rabbitOn--;}else if(--rabbitT<=0){rabbitOn=17;rabbitT=80+Math.random()*110;say(pick(L.rabbit),1);lastSay=tk;beep(3000,.02,.02)}
 if(!q.length&&tk-lastSay>38){say(pick(cmd==='lie'?L.lie:L[cmd]));lastSay=tk}
 if(sheep.every(s=>inPen(s.x,s.y))){doorShut=true;state='won';beep(220,.08,.06);beep(160,.14,.06,.09);[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.1,.04,.35+i*.12));
  const tm=Math.ceil(elapsed);say(pick(L.win),1);if(best===null||tm<best){best=tm;LS.set('fw_HI',best);say(L.hi[0])}}}
const T=new Map(),I=new Map();
function targets(){T.clear();if(mode==='clock'){T.set('z',1);return}
 sheep.forEach(s=>{const[i,j]=snapS(s.x,s.y);T.set('s,'+i+','+j,1);if(s.p)T.set('p,'+i+','+j,1)});
 const[i,j]=snapD(dog.x,dog.y),v=(state==='ready'||state==='won'||(cmd==='lie'&&!creeping))?'Z':(dog.f<0?'L':'R');T.set('d,'+i+','+j+','+v,1);
 if(rabbitOn)T.set('r',1);if(doorShut)T.set('door',1);for(let k=0;k<crossed;k++)T.set('g,'+k,1)}
function tick(){tk++;if(!document.hidden){batt=Math.min(1,batt+.18/900);if(tk%28===0)LS.set('fw_batt',batt)}
 if(state==='play'&&mode==='game'){step();if(state==='play'){elapsed+=.18;const nl=150-Math.floor(elapsed);if(nl!==tLeft){tLeft=nl;nl<=10?beep(1600,.05,.04):beep(1200,.02,.015)}if(tLeft<=0){tLeft=0;state='over';beep(400,.2,.05);beep(300,.3,.05,.22);say(L.over[0],1)}}}
 targets()}
function start(){if(state==='over'||state==='won')reset();state='play';say(pick(L.start),1);lastSay=tk;beep(880,.06,.04);beep(1320,.08,.04,.08)}
function whistle(c){au();if(mode==='clock'){say(L.zzz[0]);return}if(state==='over'||state==='won')return;if(state==='ready')start();
 whistleSnd(c);if(c==='walk'){walkSpd=cmd==='walk'?Math.min(11,walkSpd+2.5):3.5;say(walkSpd>6?pick(L.fast):pick(L.walk),1)}else{walkSpd=0;say(pick(L[c]),1)}
 if(c==='lie'){lieT=0;keen*=.5}else keen*=.85;cmd=c;lastSay=tk;targets()}
function frame(){const f=batt,con=cl(1-.85*Math.pow(f,1.2)+wheel*.45*f,.1,1),ga=.08+wheel*.05,on=.35*(1-.9*f)+.02,off=.5*Math.pow(1-f,2.2)+.008;
 for(const k of T.keys())if(!I.has(k))I.set(k,0);
 for(const[k,v]of Array.from(I)){const t=T.has(k)?1:0,nv=v+(t-v)*(t>v?on:off);if(!t&&nv<.004)I.delete(k);else I.set(k,nv)}
 ctx.clearRect(0,0,W,H);ctx.globalAlpha=ga;ctx.drawImage(gh,0,0,W,H);ctx.globalAlpha=.55;printed();ctx.fillStyle='#1f261c';
 for(const[k,v]of I){ctx.globalAlpha=Math.min(1,v)*con;const p=k.split(','),t=p[0];
  if(t==='s'){const[x,y]=sC(+p[1],+p[2]);glyph(ctx,SHEEP,x,y)}else if(t==='p'){const[x,y]=sC(+p[1],+p[2]);glyph(ctx,PFACE,x,y)}
  else if(t==='d'){const[x,y]=dC(+p[1],+p[2]);glyph(ctx,p[3]==='Z'?DOGLIE:DOG,x,y,p[3]==='L')}
  else if(t==='r')glyph(ctx,RABBIT,RX,RY);else if(t==='door')ctx.fillRect(240,FY+PY-1,45,2);
  else if(t==='g')glyph(ctx,SHEEP,100+(+p[1])*16,17,0,.6);else if(t==='z')glyph(ctx,DOGLIE,206,20)}
 ctx.globalAlpha=con;let ds,col=true;
 if(mode==='clock'){const n=new Date(),h=n.getHours(),h12=h%12||12,mm=('0'+n.getMinutes()).slice(-2);ds=[h12>9?'1':' ',String(h12%10),mm[0],mm[1]];col=n.getSeconds()%2===0;if(h>=12){ctx.font='bold 5px monospace';ctx.fillText('PM',221,11)}}
 else{const s=('0'+tLeft%60).slice(-2);ds=[' ',String(Math.floor(tLeft/60)),s[0],s[1]];if(best!==null){const b=('0'+best%60).slice(-2);digit(ctx,24,10,6,12,String(Math.min(9,Math.floor(best/60))));colon(ctx,32.5,13,1.4);digit(ctx,37,10,6,12,b[0]);digit(ctx,45,10,6,12,b[1])}}
 ds.forEach((ch,n)=>digit(ctx,TDX[n],5,11,20,ch));if(col)colon(ctx,261.5,10,2);
 ctx.globalAlpha=1;st.style.setProperty('--con',con.toFixed(3));requestAnimationFrame(frame)}
/* ---- controls ---- */
document.querySelectorAll('.dir').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();whistle(b.dataset.c)}));
$('bA').addEventListener('click',()=>{au();if(mode==='clock')return;if(state!=='play')start()});
$('bB').addEventListener('click',()=>{snd=!snd;au();beep(snd?1800:0,.05,.04)});
$('mode').addEventListener('click',()=>{au();mode=mode==='game'?'clock':'game';beep(1000,.03,.03);if(mode==='clock'){q=[];say(L.zzz[0])}else say(state==='play'?"AWAKE! Awake. Sheep. Where were we. Sheep!":pick(L.ready),1);targets()});
$('hatch').addEventListener('click',()=>{const h=$('hatch');h.classList.add('open');$('ht').textContent='CR2025 +';batt=0;LS.set('fw_batt',0);reset();state='ready';say(pick(L.ready),1);beep(700,.04,.03);targets();setTimeout(()=>{h.classList.remove('open');$('ht').textContent='⊕ 3V'},900)});
let drag=null;const setW=()=>{wh.style.backgroundPosition='0 '+(wheel*60).toFixed(1)+'px'};
wh.addEventListener('pointerdown',e=>{drag={y:e.clientY,v:wheel};try{wh.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
wh.addEventListener('pointermove',e=>{if(!drag)return;wheel=cl(drag.v+(drag.y-e.clientY)/120,0,1);setW()});
const endW=()=>{if(drag){drag=null;LS.set('fw_wheel',wheel)}};wh.addEventListener('pointerup',endW);wh.addEventListener('pointercancel',endW);
const KM={ArrowRight:'cb',ArrowLeft:'aw',ArrowUp:'walk',ArrowDown:'lie'},BM={ArrowRight:'.rt',ArrowLeft:'.lt',ArrowUp:'.up',ArrowDown:'.dn'};
addEventListener('keydown',e=>{if(KM[e.key]){e.preventDefault();if(!e.repeat){whistle(KM[e.key]);const b=document.querySelector(BM[e.key]);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120)}}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();$('bA').click()}else if(e.key==='m'||e.key==='M')$('mode').click();else if(e.key==='b'||e.key==='B')$('bB').click()});
addEventListener('resize',resize);
reset();resize();setW();targets();say(pick(L.ready));pump();setInterval(tick,180);requestAnimationFrame(frame);
console.log('%cWISP: Hello! Hello in there! Are you whistling? You can whistle from out HERE too. Come-bye! COME-BYE!','font-weight:bold');
})();
