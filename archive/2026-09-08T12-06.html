  <meta name="outbox-spec-era" content="Mid-March 1978, right now — twenty past ten on a cold bright morning on the dipping floor of a blue-dyeing workshop in Pápa, western Hungary, where the vat has been reducing since Saturday and 60 metres of resist-printed cotton is hanging on the frame over the mouth of it, printed off pear-wood blocks on Thursday and Friday. Not a look-back at anything, not a lament, not a memory of a vanished trade: the wholesaler in Győr wants 4 pieces in the same shade by Thursday week, the vat has a finite amount of pigment in it and no more is coming until the drum arrives, and every time the cloth goes down it takes air with it.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the mouth of a sunken dipping vat and the length of resist-printed cotton hanging above it, seen from standing on the floor at the winch, so the cloth fills the frame in three slack vertical loops from the top edge down into the liquor at the bottom edge and the vat surface runs across the lower fifth. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no cursor label, no readable character anywhere at any time. It is a live dye-chemistry and oxidation engine: the cloth comes up out of the vat YELLOW-GREEN and turns blue in front of you, cell by cell, at a rate computed from real oxygen diffusion into wet fibre, and the depth of blue is not chosen, animated or eased — it is whatever the accumulated dye loading arithmetic says, and it only ever goes darker. The visitor's whole vocabulary is three things a person does with wet hands at a vat: DRAG the winch chain vertically to lower the frame into the liquor and lift it out again, which is real immersion depth and real dwell and therefore real, permanent, uneven banding down the piece; PRESS AND HOLD anywhere on the liquor to draw the paddle across it, which skims the copper bloom off the surface and drags air down into the vat, permanently costing reduction; and CLICK any point on the cloth to knock the resist paste, which chips it off there forever so blue goes where white was meant to be. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat chemistry of a fermentation indigo vat and the flat mechanics of getting 4 pieces to the same shade, and specifically that indigo does not dissolve in water and never has — the pigment is insoluble, and the entire trade exists because bacteria in a warm bran-and-lime-and-madder vat strip oxygen off it and turn it into the soluble leuco form, which is yellow-green, which is why a working vat is the colour of pond water and why a vat that has gone blue all through is a vat that has died and has to be brought back over days. That the cloth therefore comes OUT green and blues in the air, from the outside of the yarn inward, so the visible change is oxygen arriving and nothing else, and a heavy twill blues measurably slower than a fine plain weave in the same lift. That DEPTH IS DIPS AND NOT TIME: each immersion loads roughly the same fixed quantity of leuco onto the fibre and then the fibre is saturated, so twenty minutes under is worth no more than two, and eight dips of two minutes is a completely different cloth from two dips of eight — everybody who is going to get this wrong gets it wrong in the same direction. That each dip must be followed by a full oxidation in air before the next, because dipping wet green cloth back down puts unfixed leuco straight back into the liquor and wastes pigment out of a vat that has a countable amount left in it. That the vat runs at about pH 11 on slaked lime and the alkali is not incidental — too low and the reduction stalls, too high and the resist paste starts to lift off the printed cloth, so the same correction that saves the vat destroys the pattern. That OXYGEN IS THE ENEMY AND THE VISITOR IS THE SOURCE OF IT: every immersion carries air down on the cloth, every paddle stroke folds air into the surface, and each of those costs real reduction potential that takes hours of standing warm to recover, which is why a vat is skimmed gently, lowered slowly, and never stirred. That the copper-bronze FLOWER on the surface — the bloom of oxidised indigo and froth — is the vat's own readout: a strong flower means a strong reduction, a thin grey scum means the vat is going, and the flower has to be skimmed aside before the cloth goes down or it prints itself onto the face of the piece as bronze streaks that will not wash out. That BANDING is the whole quality problem of a hanging frame, because the bottom of a loop is under for the whole dip and the top of the loop is only under for the part of the travel, so an unwatched piece comes out visibly striped along its length and a merchant who is buying 4 matched pieces will find it in daylight in about four seconds. That the RESIST PASTE — kaolin, gum arabic, a little copper sulphate, printed on with a block — is a physical barrier and not a chemical one, so it fails physically: it goes soft after long soaking, it crazes into hairline cracks as the cloth flexes over the frame, and blue creeps into every crack, which is the fine dark veining on every piece of blueprint ever made and is a fault that everybody long ago stopped calling a fault. That paste knocked off by a chain, a hook or a knuckle takes dye like anything else and cannot be put back. That the final wash in dilute acid removes the paste and drops the whole cloth a visible step lighter as the surface bloom of unfixed pigment comes away, so the piece on the frame is always darker than the piece the merchant sees. And the flat arithmetic on the floor, which is 60 metres on the frame, 4 pieces to match, pigment in the vat for something like 30 more good dips at this strength, and a drum that is not coming this week.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the liquor, the cotton and the chain, and that register is WET, COLD, ALKALINE, HEAVY and MECHANICAL — sixty metres of soaked cotton weighing what soaked cotton weighs, so the loops hang with real sag and swing slowly and out of phase with each other and take a long time to stop; a hand-cranked winch with a real pawl that clacks over its ratchet on the way up and has to be held on the way down; liquor that is thick and slightly slimy and does not splash so much as heave; a steady heavy drip off the bottom of the piece back into the vat that speeds up the moment the cloth clears the surface and then slows for minutes; hard flat March daylight from high windows out of frame, coming in cold and blue-white and raking across a floor that is permanently wet. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cloth blues whether or not anybody is looking at it. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a screensaver, NOT stately, NOT reverent, NOT alchemical, NOT ceremonial — this is a vat in a workshop at twenty past ten with an order on for Thursday week.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the most important colour on the page is COMPUTED and never chosen. The liquor is reduced indigo in a lime vat, which is not blue: a murky, opaque, slightly greenish yellow-olive (#8b8a3f) going browner and denser in the corners where the bran settles (#6a6330), skinned over with a copper-bronze bloom of oxidised pigment and froth (#7d5a30) that carries a genuine metallic sheen and breaks into real drifting plates when the paddle goes through it. Against that, the cotton: unbleached calico ground (#ded4b8) under a chalky pale resist paste (#eee7ce) that is a shade lighter and slightly matte where it sits proud of the weave. EVERY BLUE IN THE PIECE IS THE OUTPUT OF THE CHEMISTRY: each fibre cell carries an actual accumulated dye loading and an actual local oxidation fraction, and its rendered colour is interpolated along a real leuco-to-indigotin path — wet and freshly lifted it is a genuine yellow-green (#7d8a52), half oxidised it is a cold slate-teal (#415f66), one full dip is a thin grey-blue (#5a6f8e), four dips a solid mid indigo (#2b3c68), eight dips near-black with a violet cast (#161e34) — so nobody anywhere picks a shade and the banding down the loops is arithmetic made visible. Crazing in the resist renders as hairline veins of whatever blue the surrounding cloth currently is, at true hair width. Wet cloth is measurably darker and glossier than the same cloth ten minutes later and the drying curve is honest. The floor and vat coping are wet grey concrete with old blue staining in the grain (#5c6470) and standing water throwing the only hard speculars in frame (#e9edf1). Exactly one chip of madder red (#b0342c) is held strictly for the cotton tie knotted through the head end of the piece and the painted number band on the winch drum — it never appears on the cloth, in the liquor, on the floor or in any shadow. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest oxidation, honest wetness and honest bloom sheen.">
  <meta name="outbox-spec-wildcard" content="The surface of the vat reflects nothing, ever. It is the only reflective-looking plane in the frame and it is rendered as completely opaque — no image of the hanging cloth, no image of the winch frame, no window, no ceiling beam, no light source, not even a broken or scattered suggestion of one. This is not stylisation and is never remarked on: a reduced fermentation vat carries a bloom of froth and oxidised pigment across its whole surface and it simply does not return an image. The engine must therefore never take the easy visual win of a rippling reflection, never fake one under the bloom, and never let a skimmed patch briefly show one. Standing water on the concrete floor DOES reflect, hard and bright and specular, which makes the vat's blankness the plainest fact in the picture and is the only reason the rule is visible at all.">
  <meta name="outbox-spec-forbidden" content="NO indigo-as-metaphor for anything — not depth, not melancholy, not the blues, not what lies beneath, not transformation, not becoming, not 'it goes in green and comes out blue' as a statement about people or change; this is leuco oxidising to indigotin at a diffusion-limited rate and it has nothing to teach anybody. ABSOLUTELY NO alchemy, NO magic, NO mystery-of-the-vat, NO 'the vat is alive' sentiment, NO feeding-the-vat-as-tending-a-creature, NO ritual, NO sacred, NO ancient-knowledge, NO recipe-passed-down, NO lunar or seasonal mysticism. NO colour lyricism whatsoever: no describing blue as deep, sad, endless, oceanic, celestial, night-coloured or falling like anything; no reverie about the first blue anybody ever saw; no pigment-history essay, no Tyrian purple comparison, no lapis, no Yves Klein, no 'the most valuable colour in the world'. NO textile romance: no love of cloth, no hand of the fabric, no sensuous writing about cotton beyond weight, water content, yarn count and drape; no slow-fashion sermon, no artisan-versus-factory argument, no natural-versus-synthetic-dye moralising, no environmental sermon about dye effluent. NO craftsman-sage register, NO 'the old dyers could smell when the vat was ready', NO trade mystique, NO master-and-apprentice arc, NO reverent absent teacher, NO hands-that-know. NO nostalgia, NO wistfulness, NO 'nobody blue-prints anymore / the last workshop in the country / it all went to printed polyester' decline narrative — there is an order on for Thursday week and 30 good dips left in the vat. NO Japan and NO japonisme of any kind: no aizome, no shibori as an aesthetic, no wabi-sabi, no Zen, no boro, no imported Japanese vocabulary or framing for a Hungarian workshop. NO Hungary travelogue and NO explaining Hungary or Central Europe to anybody: no paprika, no Danube, no folk-costume charm, no gypsy-band colour writing, no dialect spelling, no charming-villager sketch, NO communist-era framing whatsoever — no Party, no queues, no shortages-as-comedy, no Eastern Bloc greyness, no state-cooperative satire, no bureaucratic-absurd, no department-of-X, no committee minutes, no 1978-as-period-signifier and no hindsight about 1989. NO folk-art preciousness, NO peasant-culture reverence, NO heritage framing, NO UNESCO register, NO 'the patterns mean something'. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, process-video, dye-video, ambient-visualiser, generative-art-gallery, chillout or screensaver framing, and no 'let the colour settle you'. NO chemistry-as-wonder, NO 'and here's the beautiful part', NO teaching voice, NO explainer, NO science-communicator enthusiasm — the page contains no words and explains nothing to anybody. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the reflectionless vat, the banding, the dying reduction or the cloth that never comes clean — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of the cloth, the blocks or the vat — the piece was printed on Thursday, it is dripping this minute, and it is going down again. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past ten on a cold bright morning with the windows full of daylight. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding, despite this being a workshop with a trade behind it — no membership, no tradition, no founding date. And beyond the vat, the cloth, the winch and the wet floor, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
/* pear-wood blocks cut 1961, the small carnation and the double comb.
   vat set Saturday: bran, slaked lime, madder, 3 kg pigment, kept at 27.
   this file does not contain a reset. */
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;

/* ---------- cloth grid ---------- */
/* three vertical loops of 60 m. grid is columns across the frame, rows down the
   hanging length. each cell: loading (dips of fixed leuco), leuco held wet,
   oxidised fraction, wetness, weave thickness, resist thickness/adhesion/soak. */
var GX=112, GY=196;           /* 21952 cells * subcell shading -> several hundred thousand fibre samples */
var N=GX*GY;
var load=new Float32Array(N);     /* fixed indigotin, in dip-equivalents */
var leuco=new Float32Array(N);    /* unoxidised leuco held in fibre */
var oxf=new Float32Array(N);      /* oxidation progress of held leuco */
var wet=new Float32Array(N);      /* water content 0..1 */
var thick=new Float32Array(N);    /* yarn thickness / weave weight */
var shield=new Float32Array(N);   /* 0 face, 1 buried in fold */
var pasteT=new Float32Array(N);   /* resist thickness 0..1 */
var pasteA=new Float32Array(N);   /* adhesion */
var pasteS=new Float32Array(N);   /* cumulative soak */
var craze=new Float32Array(N);    /* crack openness */
var strain=new Float32Array(N);
var dwell=new Float32Array(N);

/* ---------- vat state ---------- */
var V={
  pigment: 3.00,        /* kg total indigo left, countable */
  leucoFrac: 0.86,      /* fraction reduced */
  o2: 0.0035,           /* dissolved oxygen */
  lime: 0.62,           /* free lime -> pH */
  bact: 0.80,           /* bacterial activity */
  temp: 27.2,           /* C */
  bloom: 0.72,          /* surface flower coverage */
  bloomOx: 0.55,
  dips: 0
};

/* ---------- geometry ---------- */
var winch={y:0.10, target:0.10, vel:0, holding:false, pawl:0, lastClack:0, crank:0};
var vatTop=0.795;             /* liquor line, fraction of H */
var t0=performance.now()/1000, T=t0, dtAcc=0;

/* loops: three slack vertical runs. x centres and sag phase */
var loops=[
  {cx:0.215,w:0.150,ph:0.0, sw:0, swv:0, weave:1.00},
  {cx:0.500,w:0.164,ph:1.9, sw:0, swv:0, weave:1.34},  /* the heavy twill piece */
  {cx:0.785,w:0.150,ph:3.7, sw:0, swv:0, weave:0.92}
];

/* ---------- block pattern (resist) ---------- */
function initPattern(){
  for(var y=0;y<GY;y++){
    for(var x=0;x<GX;x++){
      var i=y*GX+x;
      var lx=Math.floor(x/(GX/3));
      var w=loops[Math.min(2,lx)].weave;
      thick[i]=w*(0.92+0.16*hash2(x*3.1,y*1.7));
      shield[i]=0;
      /* pear-wood block: carnation in a diamond lattice + comb bands */
      var u=(x%22)/22, v=(y%26)/26;
      var du=u-0.5, dv=v-0.5;
      var r=Math.sqrt(du*du+dv*dv*1.15);
      var pet=Math.abs(Math.sin(Math.atan2(dv,du)*5.0));
      var flower = r < 0.145+0.115*pet ? 1:0;
      var stem = (Math.abs(du)<0.022 && dv>0.10) ?1:0;
      var lattice = (Math.abs(Math.abs(du)+Math.abs(dv)-0.44)<0.028)?1:0;
      var comb = ((y%78)<3)?1:0;
      var dot = (Math.abs(du)<0.05&&Math.abs(dv+0.33)<0.05)?1:0;
      var p = (flower||stem||lattice||comb||dot)?1:0;
      /* small blocks register slightly off every repeat, as blocks do */
      if(hash2(x*0.7+7,y*0.9)<0.012) p=1-p;
      pasteT[i]=p? (0.72+0.28*hash2(x*5,y*5)) : 0;
      pasteA[i]=p? (0.78+0.20*hash2(x*11+2,y*13)) : 0;
      pasteS[i]=0; craze[i]=0; strain[i]=0;
      load[i]=0; leuco[i]=0; oxf[i]=0; wet[i]=0.02; dwell[i]=0;
    }
  }
}
function hash2(a,b){var s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}

/* ---------- persistence ---------- */
var KEY='papa.vat.frame7';
function save(){
  try{
    var o={
      v:V, w:winch.y, d:V.dips,
      L:Array.prototype.slice.call(pack(load,255,8)),
      P:Array.prototype.slice.call(pack(pasteT,255,1)),
      A:Array.prototype.slice.call(pack(pasteA,255,1)),
      S:Array.prototype.slice.call(pack(pasteS,255,60)),
      C:Array.prototype.slice.call(pack(craze,255,1)),
      D:Array.prototype.slice.call(pack(dwell,255,600))
    };
    localStorage.setItem(KEY,JSON.stringify(o));
  }catch(e){}
}
function pack(arr,mx,scale){var o=new Uint8Array(N);for(var i=0;i<N;i++){var v=arr[i]/scale;if(v<0)v=0;if(v>1)v=1;o[i]=Math.round(v*mx);}return o;}
function unpack(src,arr,scale){for(var i=0;i<N&&i<src.length;i++){arr[i]=(src[i]/255)*scale;}}
function load_(){
  try{
    var s=localStorage.getItem(KEY); if(!s)return false;
    var o=JSON.parse(s); if(!o||!o.L||o.L.length!==N)return false;
    V=o.v; winch.y=winch.target=o.w||0.10;
    unpack(o.L,load,8); unpack(o.P,pasteT,1); unpack(o.A,pasteA,1);
    unpack(o.S,pasteS,60); unpack(o.C,craze,1); unpack(o.D,dwell,600);
    for(var i=0;i<N;i++){oxf[i]=1;leuco[i]=0;wet[i]=0.05;}
    return true;
  }catch(e){return false;}
}

/* ---------- colour ---------- */
/* every blue here is arithmetic: loading + oxidation fraction + wetness.
   nothing on this page picks a shade. */
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
var C_CALICO=[222,212,184], C_PASTE=[238,231,206];
var C_LEUCO=[125,138,82], C_HALF=[65,95,102];
var C_D1=[90,111,142], C_D4=[43,60,104], C_D8=[22,30,52];
function shade(l,ox,w,leu){
  /* fixed pigment colour by dip loading, on a real accumulation curve */
  var base;
  if(l<=0.0001) base=C_CALICO.slice();
  else if(l<1) base=mix(C_CALICO,C_D1,Math.pow(l,0.72));
  else if(l<4) base=mix(C_D1,C_D4,(l-1)/3);
  else if(l<8) base=mix(C_D4,C_D8,(l-4)/4);
  else base=C_D8.slice();
  /* held leuco tints it green until oxygen arrives */
  if(leu>0.002){
    var g=Math.min(1,leu*2.2);
    var wetCol=mix(C_LEUCO,C_HALF,ox);
    base=mix(base,wetCol,g*(1-ox*0.45));
  }
  /* wet cotton is darker and glossier than dry cotton */
  var d=1-0.20*w;
  return [base[0]*d,base[1]*d,base[2]*d];
}

/* ---------- physics step ---------- */
var immTop=1e9;      /* cloth-row fraction currently at/below liquor */
function step(dt){
  if(dt>0.08)dt=0.08;
  /* winch */
  var d=winch.target-winch.y;
  var lim=winch.holding?1.0:0.55;
  winch.vel += (d*7.0 - winch.vel*5.5)*dt;
  if(winch.vel> lim)winch.vel=lim; if(winch.vel<-lim)winch.vel=-lim;
  var pv=winch.y;
  winch.y += winch.vel*dt;
  if(winch.y<0.0)winch.y=0.0,winch.vel=0;
  if(winch.y>0.62)winch.y=0.62,winch.vel=0;
  var speed=Math.abs(winch.y-pv)/Math.max(dt,1e-4);
  winch.crank += speed*9;
  /* pawl clacks over the ratchet on the way up only */
  if(winch.y<pv){ winch.pawl += speed*16; if(winch.pawl>1){winch.pawl-=1; SND.pawl(speed);} }
  if(speed>0.004) SND.slither(speed, wetAvg);

  /* loop swing: heavy soaked cotton, out of phase, slow to settle */
  for(var k=0;k<3;k++){
    var lp=loops[k];
    lp.swv += (-lp.sw*(2.1+k*0.25) - lp.swv*0.62)*dt + (winch.y-pv)*(1.6+k*0.4);
    lp.sw += lp.swv*dt;
  }

  /* vat chemistry */
  var oxConsume = V.o2*V.bact*(0.55+ (V.temp-20)*0.03)*dt*2.4;
  var conv = Math.min(V.leucoFrac, oxConsume*3.2);
  V.leucoFrac -= conv;                  /* oxygen eats reduction, permanently */
  V.o2 = Math.max(0.0004, V.o2 - oxConsume*0.9 - V.o2*0.06*dt);
  /* reduction recovers slowly, set by temperature, lime and bacteria */
  var eq = 0.90*Math.min(1,V.lime/0.55)*Math.min(1,V.bact);
  if(V.leucoFrac<eq){
    V.leucoFrac += (eq-V.leucoFrac)*0.0075*V.bact*(1+(V.temp-24)*0.05)*dt;
  }
  V.bact = Math.max(0.18, V.bact - V.o2*0.15*dt + (0.80-V.bact)*0.0018*dt);
  V.lime = Math.max(0.20, V.lime - 0.00022*dt);
  V.temp += ((26.6+Math.sin(T*0.031)*0.5) - V.temp)*0.02*dt;
  /* bloom is a readout, not decoration */
  var bEq = 0.20 + 0.85*V.leucoFrac;
  V.bloom += (bEq - V.bloom)*0.035*dt;
  V.bloom = Math.max(0,Math.min(1,V.bloom));
  V.bloomOx += ((0.30+0.55*(1-V.leucoFrac)) - V.bloomOx)*0.05*dt;

  /* per-cell */
  var pH = 9.4 + V.lime*3.4;
  var satBase = 0.92*V.leucoFrac*Math.min(1, V.pigment/1.4);
  var lineRow = (vatTop - (0.02 + winch.y*0.0));  /* liquor line in screen frac */
  var wsum=0;
  var pigDrawn=0, pigReturned=0;
  for(var y=0;y<GY;y++){
    /* row -> screen y. cloth hangs from top edge; winch.y lowers everything */
    var rowY = clothRowY(y);
    var sub = rowY - vatTop;     /* >0 = below liquor */
    var under = sub>0;
    var depth = under? Math.min(1, sub/0.20):0;
    for(var x=0;x<GX;x++){
      var i=y*GX+x;
      if(under){
        dwell[i]+=dt;
        /* immersion: air carried down consumes reduction where cloth enters */
        /* uptake, real exponential approach to saturation. first 30 s do the work */
        var sat = satBase/(0.55+thick[i]*0.55);
        var kUp = 0.075/thick[i];
        var take = (sat - leuco[i])*(1-Math.exp(-kUp*dt));
        if(take>0){ leuco[i]+=take; pigDrawn+=take; }
        /* re-dipping wet unoxidised cloth puts leuco straight back in the liquor */
        if(oxf[i]<0.85 && leuco[i]>0.02){
          var back = leuco[i]*(1-oxf[i])*0.35*dt;
          leuco[i]-=back; pigReturned+=back;
        }
        oxf[i]*= Math.exp(-0.85*dt);
        wet[i] += (1-wet[i])*0.9*dt;
        /* resist: physical. soaks, softens, lets go */
        if(pasteT[i]>0){
          pasteS[i]+=dt;
          pasteA[i]-= dt*(0.0022 + (pH-10.4)*0.0030 + pasteS[i]*0.000035);
          if(pasteA[i]<0.055){ pasteT[i]*=Math.exp(-2.6*dt); if(pasteT[i]<0.05){pasteT[i]=0;pasteA[i]=0;} }
        }
      }else{
        /* oxidation: diffusion in from the exposed faces */
        if(leuco[i]>0.0006){
          var rate = 0.115 * (1-0.55*wet[i]) / thick[i] * (1-0.62*shield[i]);
          var dox = (1-oxf[i])*(1-Math.exp(-rate*dt));
          oxf[i]+=dox;
          var fix = leuco[i]*dox;
          load[i]+=fix; leuco[i]-=fix;
          if(leuco[i]<0.0006){ load[i]+=leuco[i]*oxf[i]; leuco[i]=0; oxf[i]=1; }
        }else{ oxf[i]=1; }
        /* drying: bottom of the piece stays wet, dripping, and blues slower */
        var dry = 0.030*(1 - depthBias(y)*0.55);
        wet[i]*= Math.exp(-dry*dt);
      }
      if(load[i]>8)load[i]=8;
      wsum+=wet[i];
    }
  }
  wetAvg = wsum/N;
  V.pigment -= pigDrawn*0.00028;
  V.pigment += pigReturned*0.00028*0.55;   /* returned leuco is mostly wasted to oxygen */
  if(V.pigment<0)V.pigment=0;

  /* strain / crazing where the cloth flexes over the frame head */
  var flex = Math.abs(winch.vel)+Math.abs(loops[0].swv)*0.4;
  if(flex>0.03){
    for(var q=0;q<70;q++){
      var yy=Math.floor(Math.random()*GY), xx=Math.floor(Math.random()*GX);
      var ii=yy*GX+xx;
      if(pasteT[ii]>0.2){
        strain[ii]+= flex*dt*(0.9+pasteS[ii]*0.02);
        if(strain[ii]>0.16 && craze[ii]<1){
          craze[ii]=Math.min(1,craze[ii]+0.34);
          /* cracks run: propagate along a path */
          propagate(xx,yy,0);
        }
      }
    }
  }

  /* drip return, computed from water leaving the cloth */
  var below=0;
  for(var y2=GY-16;y2<GY;y2++){ if(clothRowY(y2)<vatTop) below+=wet[y2*GX+Math.floor(GX/2)]; }
  dripRate = below/16;
  SND.drip(dripRate, T);
}
function propagate(x,y,d){
  if(d>7)return;
  var dx = Math.random()<0.5? (Math.random()<0.5?-1:1):0;
  var dy = dx===0? (Math.random()<0.5?-1:1) : (Math.random()<0.35?(Math.random()<0.5?-1:1):0);
  var nx=x+dx, ny=y+dy;
  if(nx<0||ny<0||nx>=GX||ny>=GY)return;
  var j=ny*GX+nx;
  if(pasteT[j]>0.15 && craze[j]<0.9){ craze[j]=Math.min(1,craze[j]+0.30); propagate(nx,ny,d+1); }
}
var wetAvg=0.1, dripRate=0;

/* cloth row -> screen y fraction. three loops share the same length; row 0 at frame head. */
function clothRowY(y){
  var f=y/(GY-1);
  return 0.045 + f*(0.86) + winch.y;
}
function depthBias(y){ return y/(GY-1); }

/* ---------- render ---------- */
var off=document.createElement('canvas'), octx=off.getContext('2d');
var img=null, idat=null;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(window.innerWidth*DPR); H=Math.floor(window.innerHeight*DPR);
  cv.width=W; cv.height=H;
  off.width=GX*3; off.height=GY*3;
  idat=octx.createImageData(GX*3,GY*3);
}
window.addEventListener('resize',resize);

function drawClothTexture(){
  var d=idat.data, w=GX*3;
  for(var y=0;y<GY;y++){
    for(var x=0;x<GX;x++){
      var i=y*GX+x;
      var col=shade(load[i],oxf[i],wet[i],leuco[i]);
      var pt=pasteT[i], cz=craze[i];
      for(var sy=0;sy<3;sy++){
        for(var sx=0;sx<3;sx++){
          var r=col[0],g=col[1],b=col[2];
          /* plain weave / twill grain at subcell resolution */
          var grain = ((x*3+sx+ (y*3+sy)*(thick[i]>1.15?1:0))%2)?1.03:0.95;
          if(thick[i]>1.15){ grain = (((x*3+sx)+(y*3+sy)*2)%3===0)?1.05:0.94; }
          r*=grain; g*=grain; b*=grain;
          if(pt>0.05){
            /* paste sits proud: chalky, matte, one shade lighter */
            var cov=pt;
            /* crazing: hairline veins carry the surrounding blue at full strength */
            var vein = cz>0.05 && ((x*3+sx)*7+(y*3+sy)*13 + Math.floor(hash2(x,y)*17))%(Math.max(2,Math.round(9-cz*7)))===0;
            if(!vein){
              var pc=C_PASTE;
              /* paste yellows a little where it has soaked */
              var s=Math.min(1,pasteS[i]/90);
              r=r*(1-cov)+ (pc[0]-s*16)*cov;
              g=g*(1-cov)+ (pc[1]-s*20)*cov;
              b=b*(1-cov)+ (pc[2]-s*10)*cov;
              var mt=1-0.03*cov; r*=mt;g*=mt;b*=mt;
            }
          }
          var o=((y*3+sy)*w+(x*3+sx))*4;
          d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
        }
      }
    }
  }
  octx.putImageData(idat,0,0);
}

var texFrame=0;
function render(){
  var g=ctx;
  /* --- back wall / floor: wet grey concrete, old blue staining --- */
  var wallG=g.createLinearGradient(0,0,0,H);
  wallG.addColorStop(0,'#5f6773'); wallG.addColorStop(0.55,'#4d545e'); wallG.addColorStop(1,'#414751');
  g.fillStyle=wallG; g.fillRect(0,0,W,H);
  /* hard flat March daylight raking in from high windows out of frame */
  g.save();
  g.globalAlpha=0.13; g.fillStyle='#e9edf1';
  g.beginPath(); g.moveTo(W*0.02,0); g.lineTo(W*0.36,0); g.lineTo(W*0.62,H*0.80); g.lineTo(W*0.26,H*0.80); g.closePath(); g.fill();
  g.globalAlpha=0.07;
  g.beginPath(); g.moveTo(W*0.46,0); g.lineTo(W*0.68,0); g.lineTo(W*0.94,H*0.80); g.lineTo(W*0.70,H*0.80); g.closePath(); g.fill();
  g.restore();
  /* blue staining in the concrete grain */
  g.save(); g.globalAlpha=0.20;
  for(var s=0;s<40;s++){
    var sx=hash2(s*3.3,1.1)*W, sy=hash2(s*1.7,9.9)*H*0.80;
    g.fillStyle='#5c6470';
    g.fillRect(sx,sy,W*0.02+hash2(s,2)*W*0.06,H*0.004+hash2(s,3)*H*0.012);
  }
  g.restore();

  /* --- winch frame head bar --- */
  g.fillStyle='#3a3f47'; g.fillRect(0,H*0.028+winch.y*H*0.0,W,H*0.016);
  g.fillStyle='#2e333a'; g.fillRect(0,H*0.044,W,H*0.005);

  /* --- cloth texture --- */
  if((texFrame++ %2)===0) drawClothTexture();

  /* draw three loops as slack vertical bands with sag and swing */
  for(var k=0;k<3;k++){
    var lp=loops[k];
    var bw=lp.w*W;
    var sxs=Math.floor(k*GX/3), sxe=Math.floor((k+1)*GX/3);
    var slices=48;
    for(var q=0;q<slices;q++){
      var f0=q/slices, f1=(q+1)/slices;
      var y0=(0.045+f0*0.86+winch.y)*H, y1=(0.045+f1*0.86+winch.y)*H;
      if(y1<0) continue;
      var sag=Math.sin(f0*Math.PI)*lp.sw*W*0.09;
      var sag1=Math.sin(f1*Math.PI)*lp.sw*W*0.09;
      var cx0=lp.cx*W+sag, cx1=lp.cx*W+sag1;
      /* loop narrows very slightly toward the bottom under its own weight */
      var w0=bw*(1-0.05*f0), w1=bw*(1-0.05*f1);
      var srcY=f0*(GY*3), srcH=Math.max(1,(f1-f0)*(GY*3));
      g.save();
      g.beginPath();
      g.moveTo(cx0-w0/2,y0); g.lineTo(cx0+w0/2,y0); g.lineTo(cx1+w1/2,y1); g.lineTo(cx1-w1/2,y1); g.closePath();
      g.clip();
      g.drawImage(off, sxs*3, srcY, (sxe-sxs)*3, srcH, cx1-w1/2, y0, Math.max(w0,w1), y1-y0+1.5);
      g.restore();
      /* fold shading down the sides of the loop: shielded cloth blues late */
      var gr=g.createLinearGradient(cx0-w0/2,0,cx0+w0/2,0);
      gr.addColorStop(0,'rgba(20,24,32,0.34)'); gr.addColorStop(0.14,'rgba(20,24,32,0.05)');
      gr.addColorStop(0.55,'rgba(255,255,255,0.045)');
      gr.addColorStop(0.88,'rgba(20,24,32,0.09)'); gr.addColorStop(1,'rgba(20,24,32,0.40)');
      g.fillStyle=gr; g.fillRect(cx0-w0/2,y0,w0,y1-y0+1.5);
    }
  }
  /* madder tie at the head end, and the painted band on the winch drum */
  g.fillStyle='#b0342c';
  g.fillRect(loops[0].cx*W-loops[0].w*W*0.5, (0.045+winch.y)*H, loops[0].w*W*0.16, H*0.010);
  g.fillRect(W*0.955,H*0.052,W*0.012,H*0.028);

  /* --- the liquor --- */
  drawVat(g);

  /* --- coping and wet floor in front, with the only speculars in frame --- */
  drawFloor(g);
}

var bloomPlates=[];
for(var bp=0;bp<170;bp++){
  bloomPlates.push({x:Math.random(),y:Math.random(),vx:0,vy:0,r:0.02+Math.random()*0.07,a:Math.random()});
}
function drawVat(g){
  var top=vatTop*H;
  /* opaque liquor. this surface returns no image of anything, ever. */
  var lg=g.createLinearGradient(0,top,0,H);
  lg.addColorStop(0,'#8b8a3f'); lg.addColorStop(0.42,'#7c7a39'); lg.addColorStop(1,'#6a6330');
  g.fillStyle=lg; g.fillRect(0,top,W,H-top);
  /* bran settling browner and denser in the corners */
  var cg=g.createRadialGradient(W*0.5,top+ (H-top)*0.3, 0, W*0.5, top+(H-top)*0.3, W*0.72);
  cg.addColorStop(0,'rgba(139,138,63,0)'); cg.addColorStop(1,'rgba(90,82,40,0.85)');
  g.fillStyle=cg; g.fillRect(0,top,W,H-top);

  /* thick heave, no bright splash: the liquor is viscous */
  g.save(); g.globalAlpha=0.22;
  for(var h=0;h<7;h++){
    var ph=T*0.35+h*1.31;
    var yy=top+(H-top)*(0.10+h*0.12)+Math.sin(ph)*H*0.004*(1+heave);
    g.fillStyle= h%2? '#7a7838':'#948f46';
    g.beginPath(); g.moveTo(0,yy);
    for(var xx=0;xx<=W;xx+=W/22){ g.lineTo(xx, yy+Math.sin(xx*0.012/DPR+ph*1.7)*H*0.0035*(0.4+heave)); }
    g.lineTo(W,yy+H*0.012); g.lineTo(0,yy+H*0.012); g.closePath(); g.fill();
  }
  g.restore();

  /* copper-bronze flower: the vat's own readout */
  var cov=V.bloom;
  for(var i=0;i<bloomPlates.length;i++){
    var p=bloomPlates[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.965; p.vy*=0.965;
    p.x+=Math.sin(T*0.11+p.a*6.28)*0.00018;
    if(p.x<-0.1)p.x=1.1; if(p.x>1.1)p.x=-0.1;
    if(p.y<0)p.y=1; if(p.y>1)p.y=0;
    if(p.a>cov) continue;
    var px=p.x*W, py=top+p.y*(H-top);
    var thickB = (cov-p.a)/Math.max(0.02,cov);
    /* colour of the bloom follows surface oxidation */
    var r=125+55*V.bloomOx, gg=90-18*V.bloomOx, b=48-14*V.bloomOx;
    g.save();
    g.globalAlpha=0.30+0.55*thickB;
    g.fillStyle='rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
    g.beginPath();
    var rr=p.r*W*(0.5+thickB*0.8);
    g.moveTo(px+rr,py);
    for(var a2=1;a2<9;a2++){
      var an=a2/9*6.283;
      var rad=rr*(0.62+0.5*hash2(i*1.3+a2, i*0.7));
      g.lineTo(px+Math.cos(an)*rad, py+Math.sin(an)*rad*0.42);
    }
    g.closePath(); g.fill();
    /* metallic sheen on the plate edge — on the froth, not on the liquor */
    g.globalAlpha=0.20*thickB;
    g.strokeStyle='#c08a44'; g.lineWidth=1.2*DPR; g.stroke();
    g.restore();
  }
  /* thin grey scum when the reduction is going */
  if(V.leucoFrac<0.45){
    g.save(); g.globalAlpha=(0.45-V.leucoFrac)*0.9; g.fillStyle='#8d8b7e';
    g.fillRect(0,top,W,(H-top)*0.55); g.restore();
  }

  /* the cloth entering the liquor: no reflection above the line, no image below it */
  g.save();
  g.globalAlpha=0.55; g.fillStyle='#5b5a2c';
  g.fillRect(0,top-H*0.004,W,H*0.008);
  g.restore();

  /* paddle wake — an opaque drag mark in the bloom */
  if(paddle.on||paddle.wake>0.01){
    g.save();
    g.globalAlpha=Math.min(0.6,paddle.wake);
    g.fillStyle='#7c7a37';
    g.beginPath();
    g.ellipse(paddle.x*W, top+paddle.y*(H-top), W*0.11, (H-top)*0.16, 0,0,6.283);
    g.fill();
    g.restore();
    paddle.wake*=0.985;
  }
}

function drawFloor(g){
  var y=H*0.965;
  g.fillStyle='#4b515b'; g.fillRect(0,y,W,H-y);
  g.fillStyle='#5c6470'; g.fillRect(0,y,W,H*0.006);
  /* standing water: the only hard speculars in the picture, and they DO reflect */
  g.save();
  for(var i=0;i<9;i++){
    var px=(hash2(i,4.4))*W, pw=W*(0.03+hash2(i,5)*0.07);
    g.globalAlpha=0.9;
    g.fillStyle='#e9edf1';
    g.fillRect(px, y+H*0.010+hash2(i,6)*H*0.014, pw*0.5, H*0.0018);
    g.globalAlpha=0.35;
    g.fillStyle='#c9d3dc';
    g.fillRect(px-pw*0.2, y+H*0.008+hash2(i,7)*H*0.016, pw, H*0.005);
  }
  g.restore();
  /* the winch chain, hanging down the right, dark and heavy */
  g.save();
  g.strokeStyle='#2b3037'; g.lineWidth=3.2*DPR;
  g.beginPath();
  var chx=W*0.962;
  for(var cy=H*0.06;cy<H*0.90;cy+=8*DPR){
    var w=Math.sin(cy*0.06/DPR + winch.crank*0.9)*2.4*DPR;
    g.moveTo(chx+w-3*DPR,cy); g.lineTo(chx+w+3*DPR,cy+5*DPR);
  }
  g.stroke();
  g.restore();
}

/* ---------- interaction ---------- */
var pointer={down:false,x:0,y:0,mode:null,sy:0,swy:0,moved:0};
var paddle={on:false,x:0.5,y:0.5,wake:0,lastX:0.5,lastY:0.5};
var heave=0;

function pos(e){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height};
}
function down(e){
  e.preventDefault();
  var p=pos(e); pointer.down=true; pointer.x=p.x; pointer.y=p.y; pointer.moved=0;
  if(p.y>vatTop){ pointer.mode='paddle'; paddle.on=true; paddle.x=p.x; paddle.y=(p.y-vatTop)/(1-vatTop); SND.skim(V.bloom); }
  else { pointer.mode='winch'; pointer.sy=p.y; pointer.swy=winch.target; winch.holding=true; }
}
function move(e){
  if(!pointer.down)return;
  e.preventDefault();
  var p=pos(e);
  pointer.moved+=Math.abs(p.y-pointer.y)+Math.abs(p.x-pointer.x);
  if(pointer.mode==='winch'){
    winch.target = Math.max(0, Math.min(0.62, pointer.swy + (p.y-pointer.sy)*1.15));
    /* lowering carries air down on the cloth, proportional to area and speed */
    var v=Math.abs(p.y-pointer.y);
    if(p.y>pointer.y){ V.o2 += v*0.0032; heave=Math.min(1,heave+v*3); SND.heave(v); }
  }else if(pointer.mode==='paddle'){
    var nx=p.x, ny=Math.max(0,Math.min(1,(p.y-vatTop)/(1-vatTop)));
    var dv=Math.abs(nx-paddle.x)+Math.abs(ny-paddle.y);
    /* every stroke folds a computed volume of oxygen into the surface layer */
    V.o2 += dv*0.0095;
    V.bloom = Math.max(0, V.bloom - dv*0.55);
    paddle.wake=Math.min(0.7,paddle.wake+dv*2.2);
    /* push the plates aside — the bloom really moves */
    for(var i=0;i<bloomPlates.length;i++){
      var bp2=bloomPlates[i];
      var dx=bp2.x-nx, dy=bp2.y-ny;
      var d2=dx*dx+dy*dy*0.5;
      if(d2<0.03){ var f=(0.03-d2)*1.6; bp2.vx+=dx*f; bp2.vy+=dy*f; }
    }
    if(dv>0.004) SND.skim(V.bloom);
    paddle.x=nx; paddle.y=ny; heave=Math.min(1,heave+dv*1.4);
  }
  pointer.x=p.x; pointer.y=p.y;
}
function up(e){
  if(pointer.mode==='winch' && pointer.moved<0.012){ knock(pointer.x,pointer.y); }
  pointer.down=false; winch.holding=false; paddle.on=false; pointer.mode=null;
}
function knock(px,py){
  /* click the cloth: chip the resist off there, forever */
  for(var k=0;k<3;k++){
    var lp=loops[k];
    var bw=lp.w;
    if(Math.abs(px-lp.cx)<bw*0.62){
      var f=(py-0.045-winch.y)/0.86;
      if(f<0||f>1)continue;
      var gy=Math.floor(f*(GY-1));
      var gx=Math.floor(k*GX/3 + ((px-(lp.cx-bw/2))/bw)*(GX/3));
      var hit=false;
      for(var dy=-3;dy<=3;dy++)for(var dx=-3;dx<=3;dx++){
        var xx=gx+dx, yy=gy+dy;
        if(xx<0||yy<0||xx>=GX||yy>=GY)continue;
        if(dx*dx+dy*dy>10)continue;
        var i=yy*GX+xx;
        if(pasteT[i]>0){ pasteT[i]=0; pasteA[i]=0; craze[i]=0; hit=true; }
        strain[i]+=0.09;
      }
      if(hit) SND.knock();
      return;
    }
  }
}
cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
window.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- sound: all synthesised, nothing loaded ---------- */
var SND=(function(){
  var ac=null, master=null, started=false;
  var lastSl=0,lastPawl=0,lastDrip=0,lastSkim=0,lastHeave=0;
  function init(){
    if(started)return;
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.42; master.connect(ac.destination);
      started=true;
      stove(); yard(); nextBay(); boots();
    }catch(e){}
  }
  function noiseBuf(dur){
    var n=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function burst(dur,freq,q,gain,type){
    if(!started)return;
    var s=ac.createBufferSource(); s.buffer=noiseBuf(dur);
    var f=ac.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q;
    var g=ac.createGain(); g.gain.setValueAtTime(gain,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start();
    return g;
  }
  return {
    init:init,
    /* heavy wet slither, band-filtered by that section's water content */
    slither:function(sp,w){
      if(!started)return; var t=ac.currentTime; if(t-lastSl<0.10)return; lastSl=t;
      burst(0.30, 380 - w*230, 0.9, Math.min(0.16,sp*0.5));
      burst(0.22, 140, 1.5, Math.min(0.10,sp*0.3),'lowpass');
    },
    /* winch pawl over the ratchet, drum bearing complaining under load */
    pawl:function(sp){
      if(!started)return; var t=ac.currentTime; if(t-lastPawl<0.035)return; lastPawl=t;
      burst(0.045, 1750, 5, 0.16);
      burst(0.030, 620, 3, 0.10);
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.value=118+sp*70;
      g.gain.setValueAtTime(0.010+sp*0.02,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g); g.connect(master); o.start(); o.stop(t+0.18);
    },
    /* drip return: dense on the lift, thinning honestly into single drops */
    drip:function(rate,T){
      if(!started||rate<=0.002)return;
      var t=ac.currentTime;
      var iv=0.045/Math.max(0.03,rate);
      if(t-lastDrip<iv)return; lastDrip=t;
      var f=760+Math.random()*900;
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.42,t+0.05);
      g.gain.setValueAtTime(0.045*Math.min(1,rate+0.25),t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
      o.connect(g); g.connect(master); o.start(); o.stop(t+0.10);
    },
    /* thick low heave, no bright splash: viscous */
    heave:function(v){
      if(!started)return; var t=ac.currentTime; if(t-lastHeave<0.20)return; lastHeave=t;
      burst(0.55, 90, 0.7, Math.min(0.20,v*2.2),'lowpass');
      burst(0.30, 195, 1.1, Math.min(0.09,v*0.9));
    },
    /* dragging skim, duller once the bloom is thin */
    skim:function(bloom){
      if(!started)return; var t=ac.currentTime; if(t-lastSkim<0.09)return; lastSkim=t;
      burst(0.20, 520+bloom*900, 1.3, 0.045+bloom*0.075);
      burst(0.16, 170, 1.0, 0.035,'lowpass');
    },
    knock:function(){ if(!started)return; burst(0.05,2400,7,0.10); burst(0.09,340,2,0.06); }
  };
  /* stove damper in the corner on its own irregular clock */
  function stove(){
    var d=6000+Math.random()*22000;
    setTimeout(function(){
      if(started){ burst(0.12,240,3.5,0.075); setTimeout(function(){burst(0.09,300,4,0.055);},180+Math.random()*400); }
      stove();
    },d);
  }
  /* a lorry backs into the yard once and is not unloaded */
  var lorryDone=false;
  function yard(){
    setTimeout(function(){
      if(started&&!lorryDone){
        lorryDone=true;
        var t=ac.currentTime;
        var o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
        f.type='lowpass'; f.frequency.value=190;
        o.type='sawtooth'; o.frequency.setValueAtTime(52,t);
        o.frequency.linearRampToValueAtTime(44,t+7);
        o.frequency.linearRampToValueAtTime(58,t+11);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.055,t+2);
        g.gain.setValueAtTime(0.055,t+9);
        g.gain.linearRampToValueAtTime(0.0001,t+14);
        o.connect(f); f.connect(g); g.connect(master); o.start(); o.stop(t+15);
      }
    },40000+Math.random()*60000);
  }
  /* another frame being cranked in the next bay, out of time with this one */
  function nextBay(){
    var d=1400+Math.random()*2600;
    setTimeout(function(){
      if(started&&Math.random()<0.55){
        var n=2+Math.floor(Math.random()*7);
        for(var i=0;i<n;i++) (function(i){setTimeout(function(){ if(started) burst(0.035,1350,6,0.028); },i*(150+Math.random()*90));})(i);
      }
      nextBay();
    },d);
  }
  function boots(){
    setTimeout(function(){
      if(started&&Math.random()<0.5){
        var n=2+Math.floor(Math.random()*5);
        for(var i=0;i<n;i++)(function(i){setTimeout(function(){ if(started){burst(0.07,430,1.4,0.045);burst(0.05,1500,2,0.020);} },i*(330+Math.random()*120));})(i);
      }
      boots();
    },7000+Math.random()*17000);
  }
})();
window.addEventListener('pointerdown',SND.init,{once:true});
window.addEventListener('touchstart',SND.init,{once:true});
window.addEventListener('keydown',SND.init,{once:true});

/* ---------- loop ---------- */
var lastT=performance.now();
function frame(now){
  var dt=(now-lastT)/1000; lastT=now; T=now/1000;
  heave*=Math.pow(0.55,dt);
  /* the cloth blues whether or not anybody is here: catch up in real steps */
  var steps=Math.min(4,Math.max(1,Math.round(dt/0.033)));
  for(var i=0;i<steps;i++) step(dt/steps);
  render();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
resize();
initPattern();
var restored=load_();
if(!restored){
  /* printed Thursday and Friday, hung this morning, never been down yet */
  V.dips=0;
}
/* time passes while nobody is at the winch: the vat recovers, slowly */
(function(){
  try{
    var lastVisit=parseFloat(localStorage.getItem(KEY+'.t')||'0');
    var nowS=Date.now()/1000;
    if(lastVisit>0){
      var gap=Math.min(60*60*30, nowS-lastVisit);
      var eq=0.90*Math.min(1,V.lime/0.55)*Math.min(1,V.bact);
      V.leucoFrac += (eq-V.leucoFrac)*(1-Math.exp(-0.0075*V.bact*gap));
      V.o2=Math.max(0.0004,V.o2*Math.exp(-0.02*gap));
      V.bact=Math.min(0.86,V.bact+(0.80-V.bact)*(1-Math.exp(-0.0018*gap)));
      V.lime=Math.max(0.20,V.lime-0.00022*gap);
      for(var i=0;i<N;i++){ wet[i]=0.03; oxf[i]=1; if(leuco[i]>0){load[i]+=leuco[i];leuco[i]=0;} }
    }
  }catch(e){}
})();
setInterval(function(){ save(); try{localStorage.setItem(KEY+'.t',String(Date.now()/1000));}catch(e){} },4000);
window.addEventListener('beforeunload',function(){ save(); try{localStorage.setItem(KEY+'.t',String(Date.now()/1000));}catch(e){} });
requestAnimationFrame(frame);
})();
</script>
