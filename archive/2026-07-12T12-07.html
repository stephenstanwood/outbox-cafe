  <meta name="outbox-spec-era" content="A wet Saturday afternoon in 1972, flat on your belly on the living-room rug with a boxed drawing-gear set spread out on a magazine — the ring pinned down with the little clear plastic pins that came in the box, the fistful of coloured pens and toothed wheels scattered everywhere, one wheel already lost under the settee. Not a boxed collectible behind glass and not a 'they don't make toys like they used to' relic — a working set open on the floor RIGHT NOW, the rain on the window, and a fresh sheet of paper waiting to be scribbled full of loops.">
  <meta name="outbox-spec-format" content="A genuinely playable geared drawing-toy filling the whole viewport, seen straight down on the paper: one big fixed toothed RING lies pinned to the sheet, and a smaller toothed WHEEL sits meshed inside it with a coloured pen poked through one of its little holes. You actually roll it — click-and-drag the wheel and it travels around the inside of the ring under a real no-slip rolling constraint (teeth meshing, the wheel spinning about its own centre exactly as far as its circumference has rolled), and the pen-hole traces a true live hypotrochoid onto the paper stroke by stroke as you go, the many-petalled loop building up in real time under your hand. A rack of different-sized wheels sits along one edge and a row of pen-holes down each wheel; clicking a wheel swaps it into the ring, clicking a hole moves the pen nearer or further from the wheel's centre, and clicking a pen changes the ink colour. It is honest gear-geometry, not a canned spiral: the tooth-count ratio decides how many petals close up and the hole-distance decides how loopy or how tight, and no two setups draw the same figure.">
  <meta name="outbox-spec-subject" content="The plain mechanical delight of the drawing gears and the honest geometry that falls out of them — a small toothed wheel rolling without slipping around the inside of a bigger toothed ring, with a pen jammed through one of its holes, and the enormous looping rosette that the pen is FORCED to trace out of nothing but that rolling. The read of it: how a 32-tooth wheel in a 96-tooth ring closes its pattern after exactly three trips round because 96 over 32 is three, how a wheel whose tooth-count shares no common factor with the ring goes round and round for ages laying petal over petal before it finally meets its own start, how sliding the pen out toward the wheel's rim makes fat pointed petals and sliding it in toward the centre makes a tight round scribble, how the teeth meshing is the whole trick that keeps it from smearing. Not a metaphor for anything, not sacred geometry, not a mandala, not a symbol of pattern-in-chaos — literally a plastic gear, a ring, a pen through a hole, and the closed looping curve that the rolling has no choice but to draw.">
  <meta name="outbox-spec-tone" content="The warm, bossy, show-off-y voice of your big sister Deb, thirteen, who got the drawing-gear set for her birthday and is deigning to let you have a go on the rug — proud of her own good ones taped to the wall, quick to tell you the trick that actually matters ('you have to hold it FLAT and go slow or the teeth jump and it smears, watch, like THIS'), delighted when your loop closes up clean ('ha — see, told you, that one's actually really good, do it again in a different colour'), unbothered and a bit gleeful when it skids ('everybody wrecks the first one, that's why there's loads of paper, start again'), talking up which wheel makes the best flowers and which ring's her favourite. Peer-to-peer, present-tense, chatty, a little smug, generous underneath it — never grand, never wistful, never turning a toy into a life-lesson; it's raining, the box is open, and she genuinely wants to see what you can spin.">

<style>
  :root{
    --cream:#f2e8d0; --grey:#5a544c;
    --mag:#d6357e; --teal:#1f9e8f; --tang:#e8672a; --grape:#6a3d9e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#e7dcc2;overflow:hidden;
    font-family:"Comic Sans MS","Marker Felt","Segoe UI",system-ui,sans-serif;
    color:var(--grey);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #paper{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #paper.grabbing{cursor:grabbing;}

  .panel{position:fixed;background:rgba(242,232,208,.72);backdrop-filter:blur(2px);
    border:1px solid rgba(90,84,76,.25);border-radius:12px;padding:7px;
    box-shadow:0 3px 10px rgba(90,84,76,.18);pointer-events:auto;}

  /* wheel rack — left */
  #wheelRack{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;}
  #wheelRack .lbl,#holeRack .lbl,#penRack .lbl{font-size:9px;letter-spacing:.5px;text-align:center;
    text-transform:uppercase;opacity:.7;margin:0 0 2px;}
  .wheelBtn{width:46px;height:46px;border:none;background:transparent;padding:0;cursor:pointer;
    border-radius:50%;position:relative;line-height:0;}
  .wheelBtn canvas{width:46px;height:46px;display:block;}
  .wheelBtn.sel{outline:3px solid var(--tang);outline-offset:1px;border-radius:50%;}
  .wheelBtn .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none;}

  /* hole rack — right */
  #holeRack{right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;}
  .holeBtn{width:26px;height:26px;border-radius:50%;border:2px solid var(--grey);
    background:#f6f4ee;cursor:pointer;padding:0;position:relative;}
  .holeBtn i{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;
    background:var(--grey);transform:translate(-50%,-50%);}
  .holeBtn.sel{border-color:var(--mag);box-shadow:0 0 0 3px rgba(214,53,126,.35);}

  /* pen rack — bottom */
  #penRack{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;}
  .penBtn{width:20px;height:52px;border:none;border-radius:4px 4px 8px 8px;cursor:pointer;
    padding:0;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .penBtn:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid currentColor;}
  .penBtn.sel{transform:translateY(-8px);}
  .penBtn.sel:before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:rgba(255,255,255,.55);border-radius:4px 4px 0 0;}

  /* Deb speech */
  #deb{left:12px;top:12px;max-width:min(58vw,340px);font-size:14px;line-height:1.35;
    border-radius:14px 14px 14px 2px;}

  /* hint + footer */

  #hint a{color:var(--teal);}
  kbd{background:#fff;border:1px solid rgba(90,84,76,.4);border-bottom-width:2px;border-radius:4px;
    padding:0 4px;font-size:10px;font-family:inherit;}

    pointer-events:none;text-transform:uppercase;}

  #sheetOverlay{position:fixed;inset:-2px;background:linear-gradient(#f4ebd5,#efe4ca);
    transform:translateY(-112%);transition:transform .22s ease-in;pointer-events:none;z-index:5;
    box-shadow:0 8px 18px rgba(90,84,76,.25);}

  @media (max-width:620px){
    #deb{font-size:12px;max-width:70vw;}
    #wheelRack{gap:6px;padding:5px;}

<body>
<canvas id="paper"></canvas>

<div id="sheetOverlay"></div>

<div class="panel" id="deb"></div>

<div class="panel" id="wheelRack"><p class="lbl">wheels</p></div>
<div class="panel" id="holeRack"><p class="lbl">holes</p></div>
<div class="panel" id="penRack"><p class="lbl" style="position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:60px;">inks</p></div>

<div class="panel" id="hint">
  Drag the little wheel round the inside — <b>slow and flat</b> or the teeth jump.<br>
  <kbd>Space</kbd> fresh sheet · <kbd>←</kbd><kbd>→</kbd> shift the pen ·
  <a href="/archive">more up on the wall →</a>
</div>

<div id="tally">CURVES SPUN ON THIS SET: 0</div>

<script>
"use strict";
/* it's raining, the box is open on the magazine, and one toothed wheel is
   already gone under the settee. this is your go. hold it flat. */

const paper = document.getElementById('paper');
const ctx = paper.getContext('2d');
let ink, inkCtx;               // persistent ink layer
let W=0,H=0,DPR=1;

const TALLY_KEY='outbox_curves_spun_on_this_set';
let tally = parseInt(localStorage.getItem(TALLY_KEY)||'0',10)||0;
document.getElementById('tally').textContent='CURVES SPUN ON THIS SET: '+tally;

// ---- the set ----------------------------------------------------------
const RING_TEETH = 96;
const wheels = [
  {N:24, color:'#3a8fd6'},
  {N:32, color:'#e8672a'},
  {N:40, color:'#cf2f36', chipped:true},   // middle red one
  {N:45, color:'#6a3d9e'},
  {N:56, color:'#3a8fd6'}
];
const holeFracs=[0.92,0.72,0.50,0.30,0.12];
const inks=['#d6357e','#1f9e8f','#e8672a','#6a3d9e'];

let wi=2, hi=1, pi=0;          // wheel / hole / pen indices  (start on the red one)

// geometry, recomputed on resize / wheel swap
let cx,cy,R, ringW, toothH, r, diff, ratio, period;
let t=0, figCum=0, lastInk=null, phiPrev=0;

function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}

function setGeom(){
  const m=Math.min(W,H);
  R = m*0.36;
  ringW = Math.max(16, m*0.045);
  toothH = Math.max(4, m*0.012);
  cx=W/2; cy=H/2 - m*0.01;
  const w=wheels[wi];
  r = R * w.N / RING_TEETH;
  diff = R - r;
  ratio = (RING_TEETH - w.N)/w.N;
  const g=gcd(RING_TEETH,w.N);
  period = 2*Math.PI * (w.N/g);   // t travelled before the pen is back at start
}

function penPos(tt){
  const w=wheels[wi];
  const d = holeFracs[hi]*r;
  const phi = -ratio*tt;
  let x = cx + diff*Math.cos(tt) + d*Math.cos(phi);
  let y = cy + diff*Math.sin(tt) + d*Math.sin(phi);
  if(w.chipped){
    // one tooth is chipped: a hair of a slip once every full turn of the wheel
    const rot = phi/(2*Math.PI);
    let f = rot - Math.round(rot);        // 0 at each full rotation
    const bump = 2.6*Math.exp(-Math.pow(f*54,2));
    x += bump*Math.cos(phi);
    y += bump*Math.sin(phi);
  }
  return {x,y};
}

// ---- resize -----------------------------------------------------------
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  paper.width = W*DPR; paper.height=H*DPR;
  paper.style.width=W+'px'; paper.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  ink = document.createElement('canvas');
  ink.width=W*DPR; ink.height=H*DPR;
  inkCtx = ink.getContext('2d');
  inkCtx.setTransform(DPR,0,0,DPR,0,0);
  inkCtx.lineCap='round'; inkCtx.lineJoin='round';

  setGeom();
  lastInk=null; figCum=0;
}
window.addEventListener('resize',resize);

// ---- drawing the gears ------------------------------------------------
function toothedDiskPath(c,gx,gy,rad,N,th,rot,inward){
  c.moveTo(gx+(rad+(inward?0:0))*Math.cos(rot),gy);
  for(let i=0;i<=N*2;i++){
    const a=rot + i*Math.PI/N;
    const rr = (i%2===0) ? rad : (inward? rad-th : rad+th);
    const x=gx+rr*Math.cos(a), y=gy+rr*Math.sin(a);
    if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  c.closePath();
}

function drawRing(){
  ctx.save();
  // soft pencil-grey shadow on the paper
  ctx.beginPath();
  ctx.arc(cx+4,cy+6,R+ringW,0,7);
  ctx.fillStyle='rgba(90,84,76,0.10)';ctx.fill();
  // annulus with internal teeth
  ctx.beginPath();
  ctx.arc(cx,cy,R+ringW,0,Math.PI*2);
  toothedDiskPath(ctx,cx,cy,R,RING_TEETH,toothH,0,true);
  ctx.fillStyle='#7fbf3a';
  ctx.fill('evenodd');
  // specular streak along one edge
  ctx.beginPath();
  ctx.arc(cx,cy,R+ringW-2.5,Math.PI*1.15,Math.PI*1.6);
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx,cy,R+3,Math.PI*0.1,Math.PI*0.5);
  ctx.strokeStyle='rgba(0,0,0,0.10)';ctx.lineWidth=2;ctx.stroke();
  // clear pinning-pins
  for(let k=0;k<4;k++){
    const a=Math.PI/4 + k*Math.PI/2;
    const px=cx+(R+ringW*0.55)*Math.cos(a), py=cy+(R+ringW*0.55)*Math.sin(a);
    ctx.beginPath();ctx.arc(px,py,ringW*0.28,0,7);
    ctx.fillStyle='rgba(246,244,238,0.85)';ctx.fill();
    ctx.beginPath();ctx.arc(px-1.5,py-1.5,ringW*0.1,0,7);
    ctx.fillStyle='#fff';ctx.fill();
  }
  ctx.restore();
}

function drawWheel(){
  const w=wheels[wi];
  const phi=-ratio*t;
  const gx=cx+diff*Math.cos(t), gy=cy+diff*Math.sin(t);
  ctx.save();
  // shadow
  ctx.beginPath();ctx.arc(gx+3,gy+4,r+toothH,0,7);
  ctx.fillStyle='rgba(90,84,76,0.14)';ctx.fill();
  // toothed body
  ctx.beginPath();
  toothedDiskPath(ctx,gx,gy,r,w.N,toothH,phi,false);
  ctx.fillStyle=w.color;ctx.fill();
  // darker inner rim + cream hub
  ctx.beginPath();ctx.arc(gx,gy,r*0.78,0,7);
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fill();
  ctx.beginPath();ctx.arc(gx,gy,r*0.7,0,7);
  ctx.fillStyle=w.color;ctx.fill();
  // specular
  ctx.beginPath();ctx.arc(gx,gy,r-1.5,Math.PI*1.15,Math.PI*1.55);
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2.5;ctx.stroke();
  // hub hole
  ctx.beginPath();ctx.arc(gx,gy,Math.max(3,r*0.09),0,7);
  ctx.fillStyle='#f6f4ee';ctx.fill();
  // pen-holes along the wheel's radius
  for(let i=0;i<holeFracs.length;i++){
    const d=holeFracs[i]*r;
    const hx=gx+d*Math.cos(phi), hy=gy+d*Math.sin(phi);
    ctx.beginPath();ctx.arc(hx,hy,Math.max(3.2,r*0.075),0,7);
    ctx.fillStyle='#f6f4ee';ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.stroke();
    if(i===hi){
      ctx.beginPath();ctx.arc(hx,hy,Math.max(3.2,r*0.075)+2,0,7);
      ctx.strokeStyle=inks[pi];ctx.lineWidth=2.4;ctx.stroke();
      ctx.beginPath();ctx.arc(hx,hy,Math.max(2,r*0.045),0,7);
      ctx.fillStyle=inks[pi];ctx.fill();
    }
  }
  ctx.restore();
}

// ---- the loop ---------------------------------------------------------
function frame(){
  ctx.fillStyle='#f2e8d0';
  ctx.fillRect(0,0,W,H);
  // faint lamp vignette
  const g=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(255,250,235,0.35)');
  g.addColorStop(1,'rgba(120,100,70,0.10)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.drawImage(ink,0,0,W,H);
  drawRing();
  drawWheel();
  requestAnimationFrame(frame);
}

// ---- rolling under the pen -------------------------------------------
const SKID=0.40;
function roll(delta){
  const ad=Math.abs(delta);
  if(ad<1e-5)return;
  const w=wheels[wi];
  if(ad>SKID){
    // teeth jump — a break in the line
    tick(880,0.05,0.16);
    t+=delta; figCum+=ad; lastInk=null;
    if(Math.random()<0.5) say(pick(skidQuips));
    checkClose();
    return;
  }
  const steps=Math.max(1,Math.ceil(ad/0.024));
  const phi0=-ratio*t;
  for(let i=1;i<=steps;i++){
    const tt=t+delta*i/steps;
    const p=penPos(tt);
    if(lastInk){
      inkCtx.strokeStyle=inks[pi];inkCtx.lineWidth=2.2;
      inkCtx.beginPath();inkCtx.moveTo(lastInk.x,lastInk.y);inkCtx.lineTo(p.x,p.y);inkCtx.stroke();
    }
    lastInk=p;
  }
  const phi1=-ratio*(t+delta);
  if(w.chipped && Math.floor(phi0/(2*Math.PI))!==Math.floor(phi1/(2*Math.PI))){
    tick(1500,0.03,0.05);  // the chipped tooth ticking past
  }
  t+=delta; figCum+=ad;
  checkClose();
}
function checkClose(){
  while(figCum>=period-1e-6){
    figCum-=period;
    tally++;
    localStorage.setItem(TALLY_KEY,tally);
    document.getElementById('tally').textContent='CURVES SPUN ON THIS SET: '+tally;
    chime();
    say(pick(closeQuips));
  }
}

// ---- pointer ----------------------------------------------------------
let dragging=false, lastAng=0;
function angAt(e){
  const rct=paper.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rct.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-rct.top;
  return Math.atan2(y-cy,x-cx);
}
function shortest(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}

paper.addEventListener('pointerdown',e=>{
  ensureAudio();
  dragging=true; paper.classList.add('grabbing');
  lastAng=angAt(e);
  lastInk=penPos(t);           // keep the line continuous from where the pen is
  paper.setPointerCapture(e.pointerId);
});
paper.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const a=angAt(e);
  roll(shortest(a-lastAng));
  lastAng=a;
});
function endDrag(){dragging=false;paper.classList.remove('grabbing');}
paper.addEventListener('pointerup',endDrag);
paper.addEventListener('pointercancel',endDrag);

// ---- keyboard ---------------------------------------------------------
window.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();newSheet();}
  else if(e.key==='ArrowLeft'){e.preventDefault();stepHole(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();stepHole(1);}
});
function stepHole(d){
  hi=(hi+d+holeFracs.length)%holeFracs.length;
  lastInk=null; figCum=0; syncHoles();
  say(d>0?"Pen out toward the rim — fat pointy petals now.":"Pen in toward the middle — that goes tight and round.");
}

// ---- fresh sheet ------------------------------------------------------
const overlay=document.getElementById('sheetOverlay');
function newSheet(){
  clackPaper();
  overlay.style.transition='transform .22s ease-in';
  overlay.style.transform='translateY(0)';
  setTimeout(()=>{
    inkCtx.clearRect(0,0,W,H); lastInk=null; figCum=0;
    overlay.style.transition='transform .3s ease-out';
    overlay.style.transform='translateY(112%)';
  },230);
  setTimeout(()=>{
    overlay.style.transition='none';
    overlay.style.transform='translateY(-112%)';
  },560);
  say(pick(sheetQuips));
}

// ---- Deb's voice ------------------------------------------------------
const debEl=document.getElementById('deb');
const closeQuips=[
  "HA — <b>see</b>, it closed up dead clean! Told you. Now do it again in a different colour.",

// ---- build the racks --------------------------------------------------
function miniGear(N,color){
  const c=document.createElement('canvas');c.width=92;c.height=92;
  const x=c.getContext('2d');const cxm=46,cym=46,rad=28,th=6;
  x.beginPath();
  for(let i=0;i<=N*2;i++){const a=i*Math.PI/N;const rr=(i%2===0)?rad:rad+th;
    const px=cxm+rr*Math.cos(a),py=cym+rr*Math.sin(a);i===0?x.moveTo(px,py):x.lineTo(px,py);}
  x.closePath();x.fillStyle=color;x.fill();
  x.beginPath();x.arc(cxm,cym,6,0,7);x.fillStyle='#f6f4ee';x.fill();
  x.beginPath();x.arc(cxm,cym,rad-2,Math.PI*1.15,Math.PI*1.55);
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=4;x.stroke();
  return c;
}

// ---- Web Audio (soft plastic ticks) ----------------------------------
let AC=null;
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tick(freq,dur,vol){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
function chime(){
  if(!AC)return;
  [660,880,990].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.value=f;
    const s=AC.currentTime+i*0.06;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(0.12,s+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);
    o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+0.26);
  });
}
function clackPaper(){
  if(!AC)return;
  const len=AC.sampleRate*0.25;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const dt=buf.getChannelData(0);
  for(let i=0;i<len;i++){dt[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);}
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
  const g=AC.createGain();g.gain.value=0.25;
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start();
}
