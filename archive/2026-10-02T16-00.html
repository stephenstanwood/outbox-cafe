<title>Hold the Burner, Hettie! — One Balloon, One Basket, All of Pennyfeather Meadow Below</title>
<style>
/* The balloon is called Hettie. She was stitched from 14 picnic blankets and one very brave tablecloth. */
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:Georgia,serif;background:#8fd3ff;color:#fff;transition:background .2s}
#stars{position:fixed;inset:0;opacity:0;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 33% 64%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#fff8d0,transparent),radial-gradient(1px 1px at 86% 44%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 36%,#fff,transparent),radial-gradient(1px 1px at 8% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 76%,#fff,transparent)}
#ground{position:fixed;left:0;right:0;bottom:0;height:25vh;background:linear-gradient(#7cc653,#3f8f3a);border-top:6px solid #a6e07a}
#ground i{position:absolute;bottom:40%;font-style:normal;font-size:clamp(18px,5vw,30px)}
.cloud{position:fixed;width:130px;height:44px;background:#fff;border-radius:40px;opacity:.9;box-shadow:30px -16px 0 4px #fff,-24px -8px 0 -2px #fff}
#hettie{position:fixed;left:50%;width:120px;margin-left:-60px}
h1{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:clamp(16px,4.5vw,24px);text-shadow:0 2px 6px #0005;padding:0 12px}
#hud{position:fixed;top:48px;left:0;right:0;text-align:center;font:600 14px/1.5 system-ui,sans-serif;text-shadow:0 1px 3px #0006}
#say{position:fixed;top:86px;left:50%;transform:translateX(-50%);max-width:90vw;background:#fff;color:#c2362b;padding:8px 16px;border-radius:20px;font-style:italic;font-size:clamp(14px,4vw,18px);opacity:0;transition:opacity .5s;text-align:center}
footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;font:12px system-ui,sans-serif;color:#eaffd8}
footer a{color:#fff7b0}
</style>

<script defer src="/_vercel/insights/script.js"></script>

<body>
<div id="stars"></div>
<div class="cloud" data-a="300" style="left:8%"></div><div class="cloud" data-a="340" style="left:62%"></div><div class="cloud" data-a="620" style="left:30%"></div>
<div id="ground"><i style="left:10%">🐄</i><i style="left:24%">🌼</i><i style="left:74%">🐄</i><i style="left:86%">🌻</i><i style="left:58%">🏡</i></div>
<svg id="hettie" viewBox="0 0 120 170" role="img" aria-label="Hettie, a hot air balloon striped tomato-red and custard-yellow, with a wicker basket and one small waving passenger">
<defs><clipPath id="e"><path d="M60 4C28 4 8 28 8 56c0 30 30 48 40 72h24c10-24 40-42 40-72C112 28 92 4 60 4z"/></clipPath></defs>
<g clip-path="url(#e)"><rect width="120" height="140" fill="#e8483a"/><rect x="24" width="14" height="140" fill="#ffd54a"/><rect x="53" width="14" height="140" fill="#ffd54a"/><rect x="82" width="14" height="140" fill="#ffd54a"/></g>
<ellipse id="flame" cx="60" cy="130" rx="5" ry="10" fill="#ffb02e" opacity="0"/>
<path d="M48 128l4 20M72 128l-4 20" stroke="#6b4a2b" stroke-width="2"/>
<rect x="46" y="146" width="28" height="20" rx="3" fill="#b07a3e"/><path d="M46 153h28M46 159h28" stroke="#8a5a2a"/>
<circle cx="60" cy="141" r="5" fill="#f2c9a0"/>
</svg>
<h1>Hold the Burner, Hettie!</h1>
<div id="hud">press &amp; hold anywhere (or space) · <span id="alt">0</span> m · soft landings: <span id="soft">0</span></div>
<div id="say"></div>
<footer>Pennyfeather Meadow Balloon Club · est. whenever it's sunny · <a href="/archive">earlier flights</a></footer>
<script>
console.log("Hettie's logbook: 'Maximum altitude this season: the plum-coloured bit. Minimum: a cow's back (sorry, Daisy).'");
const $=id=>document.getElementById(id),H=$("hettie"),G=$("ground"),F=$("flame"),S=$("say"),clouds=[...document.querySelectorAll(".cloud")];
let alt=0,vel=0,on=false,air=false,soft=0,seen=new Set(),tm;
const notes=[[25,"Hello, rooftops! Hello, washing lines!"],[120,"A heron, going the same way. Neighbours!"],[280,"Cloud! Wet! Wonderful!"],[480,"Somebody's lost kite waves a tail at you."],[720,"The first star — early for once."],[950,"Up here the sky is the colour of a plum."]];
function say(t){S.textContent=t;S.style.opacity=1;clearTimeout(tm);tm=setTimeout(()=>S.style.opacity=0,2600)}
const down=e=>{if(e.target.closest&&e.target.closest("footer"))return;on=true},up=()=>on=false;
addEventListener("pointerdown",down);addEventListener("pointerup",up);addEventListener("pointercancel",up);
addEventListener("keydown",e=>{if(e.code==="Space"){on=true;e.preventDefault()}});addEventListener("keyup",e=>{if(e.code==="Space")on=false});
function tick(now){
 vel+=(on?0.07:0)-0.035;vel*=0.99;vel=Math.max(-3,Math.min(3,vel));alt+=vel;
 if(alt>1100){alt=1100;vel=Math.min(vel,0)}
 if(alt<=0){if(air){if(vel>-1.1){soft++;$("soft").textContent=soft;say(soft%5?"Soft landing! The cows applaud.":"Five soft landings! Daisy has named a calf after you.")}else say("Bump! Nobody saw. (Daisy saw.)")}alt=0;vel=Math.max(vel,0);air=false}else if(alt>6)air=true;
 for(const[a,t]of notes)if(alt>a&&!seen.has(a)){seen.add(a);say(t)}
 const vh=innerHeight,base=vh*.25,k=.6,cam=Math.max(0,alt*k-vh*.3),t=Math.min(1,alt/1000);
 H.style.bottom=(base+alt*k-cam)+"px";H.style.transform=`translateX(${Math.sin(now/1400+alt/90)*Math.min(alt,120)*.25}px)`;
 G.style.transform=`translateY(${cam}px)`;
 clouds.forEach((c,i)=>{c.style.bottom=(base+c.dataset.a*k-cam)+"px";c.style.transform=`translateX(${Math.sin(now/5000+i)*30}px)`});
 document.body.style.background=`linear-gradient(hsl(${200+70*t},75%,${72-58*t}%),hsl(${195+30*t},85%,${82-48*t}%))`;
 $("stars").style.opacity=Math.max(0,(t-.55)*2.2);
 F.style.opacity=on?.9:0;F.setAttribute("ry",on?10+Math.random()*6:10);
 $("alt").textContent=Math.round(alt);
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
