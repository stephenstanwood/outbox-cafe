  <meta name="outbox-spec-era" content="1959 — the chrome-and-neon high tide of the tabletop diner jukebox: a Seeburg-style Wall-O-Matic wallbox bolted to the end of every booth at Rennick's Grill, freshly re-stripped THIS week with the new 45s, the coin slot still warm and the back booth already three nickels deep. Not a preserved relic and not a 'the jukeboxes are all silent now' lament — a working box getting a fresh page of strips slid in behind the glass right now, the levers still stiff from the new springs.">
  <meta name="outbox-spec-format" content="The whole viewport IS the chrome-and-curved-glass tabletop jukebox selector bolted to a diner booth, dead-on and life-size: a stack of printed title-strip pages behind the domed glass, a knurled chrome page-flip lever standing up each side, a row of letter buttons and a row of number buttons along the bottom lip, and a little amber-glowing selection window. You browse it exactly as the wallbox it is — thumb either chrome lever and the title-strip pages riffle over one spread at a time, each spread a column of song strips (TITLE · ARTIST · the two-character A-thru-V / 1-thru-9 selection code); punch a strip's letter and then its number on the keypad and the pick drops into the queue with a hard mechanical clunk and lights up in the window. No browser chrome, no header, no menu — just the wallbox, the domed glass, the strips, and the buttons under your thumb.">
  <meta name="outbox-spec-subject" content="The actual song lineup behind the glass of one particular diner's box, and the plain opinionated business of which forty-fives earn their slot — the slow-dance side that clears the booth for the couples, the novelty record everybody punches exactly once, the accordion polka the corner booth of old fellas will not stop feeding nickels to, the B-side that's quietly better than the hit on the front, the loud one somebody plays to drown out an argument, and the two records that would start a riot if they ever came out. Not a metaphor for youth or a lost America or anything at all — literally printed paper strips, spinning 45s, a coin slot, and one man's running verdict on what's worth the play and what's dead weight taking up a code.">
  <meta name="outbox-spec-tone" content="The brassy, proud, name-dropping voice of Vic Rennick, who owns the grill and re-strips this box himself every couple weeks and has a flat verdict on every single record in it — printed right onto the strips and penciled onto the backs of the ones he's got opinions about ('this one empties the counter by side two, keep it,' 'pure nickel-grabber, the kids love it, I can't stand it'). He brags on his own good ear, gripes about the polka the back booth murders daily, talks up the sleeper B-sides nobody flips to, and can't slot a record without telling you why it made the cut. Present-tense, warm, loud, dead certain he's right about music. Never wistful, never wry, never a lesson — a man who loves his box showing off what's loaded in it, strip by strip.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Cherry-red diner enamel (#c62f35) and warm title-strip cream (#f2e8d0) as the two working colors, set into brushed jukebox chrome (#c9ced3) with hard specular glints along the levers and the button-rims, a band of turquoise Formica-counter teal (#3fb8ac) showing at the very bottom edge, the selection window glowing a soft amber bulb-light (#f3c25a), and the deepest shadow behind the domed glass going near-black (#241d17) — the exact bright, hard-lit, hand-shined look of a chrome tabletop wallbox catching the diner's fluorescents on a busy evening.">
  <meta name="outbox-spec-wildcard" content="Flipped all the way to the very last page behind the glass sits exactly one strip that carries no selection code — just a hand-typed title and, on its back, a single penciled line from Vic that appears nowhere else and never repeats: a record his late partner's kid cut himself on a home acetate that was never pressed, so it lives in the box out of loyalty and is the one strip you physically cannot punch in (the keypad just gives its flat dud-buzz). It is never announced, never pointed at, never counted any differently; you only meet it if you flip the pages all the way to the back.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'the diners and jukeboxes are all gone now / an age of chrome that ended' decline narrative — this is a working box getting fresh strips THIS week, the nickels dropping tonight. NO archival / museum / cabinet / drawer / vault / estate-sale / relic framing of the box or the strips. NO music-as-metaphor-for-youth-or-memory-or-a-lost-America life-lesson framing — it's paper strips, 45s, and one man's opinion, nothing more. NO cryptic-SCP / ominous / cursed-record dread about the box or the uncodeable strip — it's just a record he keeps in out of loyalty. NO dry deadpan understatement — Vic is loud, warm, and boastful. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO signal / transmission / frequency / broadcast / relay framing of anything. NO society / club / cabinet-of-hobbyists scaffolding — it's one man's grill and his box, not a club to join.">

<title>Rennick's Wall-O-Matic — Fresh Strips, Nickels Dropping</title>
<style>
  :root{
    --red:#c62f35; --cream:#f2e8d0; --chrome:#c9ced3;
    --teal:#3fb8ac; --amber:#f3c25a; --dark:#241d17;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#1a1512;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    color:var(--dark);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
    background:
      radial-gradient(140% 100% at 50% 0%, #2c2620 0%, #14100d 70%);
  }
  .machine{
    width:100%; max-width:680px;
    border-radius:26px;
    padding:14px 12px 0;
    background:
      linear-gradient(180deg,#eef1f3 0%,#c6ccd2 18%,#9aa0a7 52%,#7f858c 70%,#b8bec5 100%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.7),
      inset 0 2px 3px rgba(255,255,255,.85),
      inset 0 -3px 6px rgba(0,0,0,.4);
    border:1px solid #71767d;
  }
  /* ---- glass + levers ---- */
  .glass-frame{
    display:flex; align-items:stretch; gap:8px;
  }
  .lever{
    width:44px; flex:0 0 44px;
    border:none; cursor:pointer;
    border-radius:14px;
    background:
      linear-gradient(90deg,#f4f6f8,#aeb4bb 40%,#7c828a 55%,#c8ced4 80%,#e9edf0);
    box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -3px 5px rgba(0,0,0,.45),0 3px 6px rgba(0,0,0,.4);
    position:relative;
    align-self:center; height:200px;
    transition:transform .06s;
  }
  .lever:active{transform:scale(.97);}
  .lever::before{ /* knurl */
    content:""; position:absolute; inset:10px 8px;
    border-radius:8px;
    background:repeating-linear-gradient(90deg,#8a9098 0 2px,#d6dbe0 2px 4px);
    opacity:.55;
  }
  .lever::after{
    content:""; position:absolute; left:50%; top:14px; transform:translateX(-50%);
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#9aa0a7 60%,#5c6169);
    box-shadow:0 2px 3px rgba(0,0,0,.5);
  }
  .lever-arrow{
    position:absolute; left:0; right:0; bottom:16px; text-align:center;
    color:var(--red); font-size:20px; font-weight:bold; font-family:Arial,sans-serif;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .dome{
    flex:1 1 auto;
    border-radius:18px 18px 10px 10px;
    padding:8px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 12%),
      radial-gradient(120% 90% at 50% -10%, #4a3f33, #241d17 70%);
    box-shadow:inset 0 0 0 4px #7f858c, inset 0 6px 18px rgba(0,0,0,.8), inset 0 -4px 10px rgba(0,0,0,.7);
    position:relative; overflow:hidden;
  }
  .dome::after{ /* glass dome sheen */
    content:""; position:absolute; left:-10%; top:-30%; width:70%; height:80%;
    background:linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,0));
    transform:rotate(-8deg); pointer-events:none; border-radius:50%;
  }
  .reflection{
    position:absolute; inset:0; object-fit:cover; width:100%; height:100%;
    opacity:.10; mix-blend-mode:screen; filter:sepia(.5) saturate(1.4) hue-rotate(-8deg);
    pointer-events:none;
  }
  .page-label{
    position:relative; z-index:2;
    text-align:center; color:var(--amber);
    font-family:Arial,sans-serif; font-size:10px; letter-spacing:2px;
    margin:2px 0 6px; text-shadow:0 0 6px rgba(243,194,90,.5);
  }
  .strips{
    position:relative; z-index:2;
    height:236px; overflow:auto;
    display:flex; flex-direction:column; gap:5px;
    padding:2px 3px;
    transition:opacity .12s ease, transform .12s ease;
  }
  .strips.flip{opacity:0; transform:translateY(6px);}
  .strips::-webkit-scrollbar{width:6px;}
  .strips::-webkit-scrollbar-thumb{background:#6b6156;border-radius:3px;}
  .strip{
    position:relative;
    background:linear-gradient(180deg,#f7efd9,#e8dcbe);
    border-radius:3px;
    padding:6px 8px;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7);
    cursor:pointer; min-height:44px;
  }
  .strip .txt{flex:1 1 auto; line-height:1.15;}
  .strip .ttl{font-weight:bold; font-size:13.5px; color:#2b241c;}
  .strip .art{font-style:italic; font-size:11px; color:#6a5c46;}
  .strip .code{
    flex:0 0 auto;
    font-family:Arial,sans-serif; font-weight:bold; font-size:15px;
    color:var(--cream); background:var(--red);
    padding:4px 7px; border-radius:3px; letter-spacing:1px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.4);
  }
  .strip .back{
    display:none; font-size:11.5px; font-style:italic; color:#7a3a2e;
    line-height:1.3; font-family:Georgia,serif;
  }
  .strip.flipped{background:linear-gradient(180deg,#efe4c8,#ddceac);}
  .strip.flipped .front{display:none;}
  .strip.flipped .back{display:block;}
  .strip.nocode .code{display:none;}
  .strip.just-lit{animation:lit .5s ease;}
  @keyframes lit{0%{box-shadow:0 0 0 3px var(--amber),0 1px 2px rgba(0,0,0,.5);}100%{box-shadow:0 1px 2px rgba(0,0,0,.5);}}
  .pencil{ /* little pencil corner on strips Vic marked */
    position:absolute; top:2px; right:2px; width:0;height:0;
    border-style:solid; border-width:0 9px 9px 0; border-color:transparent #c99a3a transparent transparent;
    opacity:.8;
  }
  /* ---- console ---- */
  .console{
    margin-top:12px; padding:10px 8px 4px;
    display:flex; flex-direction:column; gap:9px;
  }
  .window-row{display:flex; gap:8px; align-items:stretch;}
  .window{
    flex:1 1 auto; min-height:52px;
    border-radius:8px;
    background:radial-gradient(120% 130% at 50% 0%, #ffdd93, #e0a63a 75%, #b57e25);
    box-shadow:inset 0 0 14px rgba(120,70,10,.55), inset 0 2px 3px rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.4);
    border:3px solid #7f858c;
    padding:6px 10px;
    display:flex; flex-direction:column; justify-content:center;
    overflow:hidden;
  }
  .window .code-big{
    font-family:Arial,sans-serif; font-weight:bold; font-size:20px; letter-spacing:3px;
    color:#5a2f14; text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .window .now{font-size:12px; font-style:italic; color:#6a3a12; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .queue{
    flex:0 0 138px; max-width:44%;
    background:#241d17; color:var(--amber);
    border-radius:8px; border:3px solid #7f858c;
    padding:5px 7px; font-family:Arial,sans-serif; font-size:10px;
    line-height:1.35; overflow:auto; max-height:64px;
  }
  .queue b{display:block; letter-spacing:1.5px; color:#f7d789; margin-bottom:2px; font-size:9px;}
  .queue .q{color:#e9c86a;}
  .queue .empty{color:#8a7a4a; font-style:italic;}
  .keypad{display:flex; flex-direction:column; gap:7px;}
  .btnrow{display:flex; gap:5px; flex-wrap:nowrap;}
  .btn{
    flex:1 1 0; min-width:0; padding:9px 0;
    font-family:Arial,sans-serif; font-weight:bold; font-size:15px;
    border:none; border-radius:7px; cursor:pointer; color:#2b241c;
    background:linear-gradient(180deg,#fbfcfd,#cdd2d8 55%,#a9aeb5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -3px 4px rgba(0,0,0,.3), 0 2px 3px rgba(0,0,0,.4);
    transition:transform .05s;
  }
  .btn.letter{color:var(--red);}
  .btn:active{transform:translateY(2px); box-shadow:inset 0 2px 5px rgba(0,0,0,.5);}
  .btn.armed{background:linear-gradient(180deg,#ffe6a1,#f3c25a); color:#5a2f14; box-shadow:inset 0 0 0 2px #b57e25;}
  /* ---- rail ---- */
  .rail{
    margin:8px -12px 0; padding:8px 14px 10px;
    background:
      linear-gradient(180deg,#4fc7bb,var(--teal) 60%,#2f9a90);
    border-radius:0 0 24px 24px;
    display:flex; flex-wrap:wrap; gap:6px 12px; justify-content:space-between; align-items:center;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.35);
    border-top:2px solid #7f858c;
  }
  .tally{
    font-family:Arial,sans-serif; font-size:10px; letter-spacing:1px; font-weight:bold;
    color:#0d3b36; text-shadow:0 1px 0 rgba(255,255,255,.25);
  }
  .tally b{color:#fff; font-size:12px;}
  .rail a{color:#0d3b36; font-size:11px; font-style:italic;}
  .maker{
    text-align:center; font-family:Arial,sans-serif; font-size:9px; letter-spacing:2px;
    color:#5c6169; padding:4px 0 8px; text-transform:uppercase;
  }
  @media(max-width:520px){
    .lever{width:34px;flex:0 0 34px;height:170px;}
    .strips{height:210px;}
    .queue{flex:0 0 118px;}
    .btn{font-size:13px;padding:8px 0;}
    .strip .ttl{font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="machine" id="machine">
  <div class="glass-frame">
    <button class="lever" id="leverL" aria-label="Flip pages back"><span class="lever-arrow">&#9664;</span></button>
    <div class="dome">
      <!-- diner glow behind the glass; hand-shined chrome catching the fluorescents -->
      <img class="reflection" src="https://v3b.fal.media/files/b/0aa240c2/8eS5BxyvYEXvhQWOTjaG1.jpg" alt="soft amber diner light pooled behind the curved glass" loading="lazy">
      <div class="page-label" id="pageLabel">PAGE 1</div>
      <div class="strips" id="strips"></div>
    </div>
    <button class="lever" id="leverR" aria-label="Flip pages forward"><span class="lever-arrow">&#9654;</span></button>
  </div>

  <div class="console">
    <div class="window-row">
      <div class="window">
        <div class="code-big" id="winCode">– –</div>
        <div class="now" id="winNow">Punch a letter, then a number. Vic loaded these himself.</div>
      </div>
      <div class="queue" id="queue"><b>QUEUE</b><div class="empty" id="queueBody">nothing dropped yet</div></div>
    </div>
    <div class="keypad">
      <div class="btnrow" id="letters"></div>
      <div class="btnrow" id="numbers"></div>
    </div>
  </div>

  <div class="rail">
    <span class="tally">TUNES PUNCHED IN AT THIS BOOTH: <b id="tally">0</b></span>
    <a href="/archive">the rest of Vic's strips &rsaquo;</a>
  </div>
  <div class="maker">Rennick's Grill &middot; the box on the end of booth four</div>
</div>

<script>
/* Vic re-stripped this box THIS week. Every verdict below is his. */
const PAGES = [
  [
    {t:"Ridin' the Blue Line",a:"The Chandeliers",c:"A1",n:"Empties the counter clean by side two. My finest pick and I know it. Keep it forever."},
    {t:"Cherry-Top Sway",a:"Lorna Priddy",c:"A2",n:"Slow one. Clears the whole booth for the couples. Drop it right at nine sharp, trust me."},
    {t:"The Hiccup Hop",a:"Buster Fye & His Fyeflies",c:"A3",n:"Pure nickel-grabber. Kids punch it once, howl like fools, never touch it again. I can't stand it. It stays."},
    {t:"Two-Lane Hosanna",a:"Sonny Vale",c:"A4",n:"LOUD, top to bottom. This is the one you punch to bury an argument going in booth two."},
    {t:"Mabel, Don't",a:"The Rondelles",c:"A5",n:"Cornball as they come, but it lands every time. Leave it be."}
  ],
  [
    {t:"Accordion Moon (Rennick's Polka)",a:"Stash Wojcik Trio",c:"B1",n:"The corner booth of old fellas will NOT quit feeding this thing. I hear it in my sleep. And it earns its slot, blast it."},
    {t:"Turnpike Angel",a:"Ada Vane",c:"B2",n:"A real torch song. She means every word. You can hear it."},
    {t:"Big Time from Toledo",a:"Duke Farrow Orchestra",c:"B3",n:"Brass wall to wall. Made for the dinner rush when the grill's roaring."},
    {t:"Whisper the Number",a:"The Cufflinks",c:"B4",n:"This is a B-side — quieter than its own front and flat-out better, and NOBODY flips to it. You flip to it."},
    {t:"Rockin' the Rennick",a:"Sonny Vale",c:"B5",n:"He cut this one about MY grill. What kind of man would leave that out."}
  ],
  [
    {t:"Sugar in the Percolator",a:"The Malt Shop Five",c:"C1",n:"Bounce and fizz. Keeps the counter awake at the breakfast hour."},
    {t:"Blue Velvet Booth",a:"Lorna Priddy",c:"C2",n:"My second slow one. Two of hers back to back and the couples never leave. Good for business, I'll say."},
    {t:"Do the Refrigerator",a:"Buster Fye",c:"C3",n:"Second novelty. Once a night, no more. Watch the whole room do the little shiver. Fine. It's loaded."},
    {t:"Steel Guitar Sunday",a:"Hoyt Cabell",c:"C4",n:"Cries just a touch. The truckers pound the button for it at six in the morning."},
    {t:"Countin' Backwards",a:"The Cufflinks",c:"C5",n:"Sleeper of the whole box. Nobody punches it. Their loss, every night."}
  ],
  [
    {t:"Ramble On, Ramona",a:"Sonny Vale",c:"D1",n:"Fast and dumb and I love it dearly. No apology."},
    {t:"The Long Green Line",a:"Duke Farrow Orchestra",c:"D2",n:"Instrumental. Fills the air nice between the ones that matter."},
    {t:"Polka Dot Sky",a:"Stash Wojcik Trio",c:"D3",n:"The old fellas' SECOND polka. Two accordions in one box, heaven help me — and both of 'em stay."},
    {t:"Kiss the Chrome",a:"The Rondelles",c:"D4",n:"Silly thing. Grows on you like a stain. Kept it on purpose."},
    {t:"Last Call Lullaby",a:"Ada Vane",c:"D5",n:"Slowest record I own. This is exactly how the night ought to end. Do not touch it."}
  ],
  [
    {t:"Hot Rod to Heaven",a:"The Detonators",c:"E1",n:"This one would start a riot if it ever came off the shelf — half the room's on its feet. That's why it's up front."},
    {t:"Rip It, Ramp It, Roll It",a:"The Detonators",c:"E2",n:"Their other side. Same riot, higher key. I keep 'em both loaded and pretend I don't know why."},
    {t:"Sweetheart of Section 8",a:"Lorna Priddy",c:"E3",n:"Third slow one from her. I'm not one bit sorry. The couples pay my rent."},
    {t:"Marchetti's Mambo",a:"Tito Marchetti Combo",c:"E4",n:"Struts like it owns the place. Perfect for a busy Saturday."},
    {t:"Nickel in the Slot",a:"The Malt Shop Five",c:"E5",n:"It's a song about doing exactly what you're doing right now. Clever enough? Go on, punch it."}
  ],
  [
    {t:"Home Fries Boogie",a:"Buster Fye",c:"F1",n:"Breakfast novelty. Grease and giggles. Once a morning."},
    {t:"Coffee, Black, and Gone",a:"Hoyt Cabell",c:"F2",n:"Sad-eyed and short. Just the right length for one refill."},
    {t:"The Hempstead Two-Step",a:"Stash Wojcik Trio",c:"F3",n:"Carnival tune — the traveling show out of Frankfort left it with me one fair week. It plays fine. Third accordion. Don't start."},
    {t:"One More for the Grill",a:"Sonny Vale",c:"F4",n:"My closer's closer. Sonny owed me a jingle and paid it in full."},
    {t:"Goodnight, Booth Four",a:"Ada Vane",c:"F5",n:"That's the box. That's the whole box, top to bottom. Now go feed it, would you."}
  ],
  [
    {t:"The Long Way Home (home take)",a:"Ray Marchetti",c:null,n:"Del's boy Ray cut this himself on an acetate the winter before Del and I opened the doors. Never got pressed, never got a code, never will. It rides in the box because Del rode with me. That's all. —V.R."}
  ]
];

const CODES = {};
PAGES.forEach(p=>p.forEach(s=>{ if(s.c) CODES[s.c]={t:s.t,a:s.a}; }));

let page = 0;
let pending = "";
const stripsEl = document.getElementById('strips');
const pageLabel = document.getElementById('pageLabel');
const winCode = document.getElementById('winCode');
const winNow = document.getElementById('winNow');
const queueBody = document.getElementById('queueBody');
const tallyEl = document.getElementById('tally');
const queue = [];

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function riffle(){
  const c=ac(); if(!c) return;
  const dur=0.22, sr=c.sampleRate, buf=c.createBuffer(1,sr*dur,sr), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6); }
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.7;
  const g=c.createGain(); g.gain.value=0.28;
  src.connect(bp); bp.connect(g); g.connect(c.destination);
  bp.frequency.setValueAtTime(2600,c.currentTime);
  bp.frequency.exponentialRampToValueAtTime(900,c.currentTime+dur);
  src.start();
}
function clunk(){
  const c=ac(); if(!c) return; const t=c.currentTime;
  const o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(52,t+0.14);
  const g=c.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.17);
  // little click
  const nb=c.createBuffer(1,c.sampleRate*0.02,c.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);
  const ns=c.createBufferSource(); ns.buffer=nb; const ng=c.createGain(); ng.gain.value=0.35;
  ns.connect(ng); ng.connect(c.destination); ns.start(t);
}
function dud(){
  const c=ac(); if(!c) return; const t=c.currentTime;
  const o=c.createOscillator(); o.type='square'; o.frequency.value=88;
  const g=c.createGain(); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.22,t+0.01); g.gain.setValueAtTime(0.22,t+0.13); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.17);
}

/* ---------- render ---------- */
function renderPage(){
  stripsEl.innerHTML='';
  PAGES[page].forEach(s=>{
    const div=document.createElement('div');
    div.className='strip'+(s.c?'':' nocode');
    div.dataset.code=s.c||'';
    div.innerHTML =
      (s.n?'<span class="pencil" title="Vic marked this one"></span>':'')+
      '<div class="txt">'+
        '<div class="front"><div class="ttl">'+s.t+'</div><div class="art">'+s.a+'</div></div>'+
        '<div class="back">'+s.n+'</div>'+
      '</div>'+
      (s.c?'<div class="code">'+s.c+'</div>':'');
    div.addEventListener('click',()=>div.classList.toggle('flipped'));
    stripsEl.appendChild(div);
  });
  pageLabel.textContent='PAGE '+(page+1)+' \u00B7 OF '+PAGES.length;
}
function flip(dir){
  const np=Math.min(PAGES.length-1,Math.max(0,page+dir));
  riffle();
  if(np===page){ return; }
  stripsEl.classList.add('flip');
  setTimeout(()=>{ page=np; renderPage(); stripsEl.classList.remove('flip'); },120);
}

/* ---------- keypad ---------- */
const LETTERS=['A','B','C','D','E','F','G','H'];
const NUMBERS=['1','2','3','4','5','6','7','8','9'];
const lettersRow=document.getElementById('letters');
const numbersRow=document.getElementById('numbers');
LETTERS.forEach(L=>{ const b=document.createElement('button'); b.className='btn letter'; b.textContent=L; b.dataset.k=L;
  b.addEventListener('click',()=>armLetter(L)); lettersRow.appendChild(b); });
NUMBERS.forEach(N=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=N; b.dataset.k=N;
  b.addEventListener('click',()=>hitNumber(N)); numbersRow.appendChild(b); });

function armLetter(L){
  pending=L;
  document.querySelectorAll('.btn.letter').forEach(b=>b.classList.toggle('armed',b.dataset.k===L));
  winCode.textContent=L+' –';
}
function clearArm(){ pending=''; document.querySelectorAll('.btn.letter').forEach(b=>b.classList.remove('armed')); }
function hitNumber(N){
  if(!pending){ dud(); winNow.textContent='Pick a letter first, friend.'; return; }
  const code=pending+N;
  if(CODES[code]){ register(code); }
  else { dud(); winCode.textContent=code; winNow.textContent="Nothing loaded on "+code+" — dead code, try again."; }
  clearArm();
}
function register(code){
  clunk();
  const s=CODES[code];
  winCode.textContent=code;
  winNow.textContent='\u25B6 '+s.t+' \u2014 '+s.a;
  // light the matching strip if it's on this page
  const strip=[...stripsEl.children].find(d=>d.dataset.code===code);
  if(strip){ strip.classList.remove('just-lit'); void strip.offsetWidth; strip.classList.add('just-lit'); }
  queue.push(code+'  '+s.t);
  drawQueue();
  bumpTally();
}
function drawQueue(){
  if(!queue.length){ queueBody.className='empty'; queueBody.textContent='nothing dropped yet'; return; }
  queueBody.className='';
  queueBody.innerHTML=queue.slice(-14).map(q=>'<div class="q">'+q+'</div>').join('');
  queueBody.scrollTop=queueBody.scrollHeight;
}

/* ---------- tally (localStorage, counts up only) ---------- */
const KEY='rennick_wallobox_punched';
function readTally(){ let v=parseInt(localStorage.getItem(KEY)||'0',10); return isNaN(v)?0:v; }
function bumpTally(){
  let v=readTally()+1;
  try{ localStorage.setItem(KEY,String(v)); }catch(e){}
  tallyEl.textContent=v;
}
tallyEl.textContent=readTally();

/* ---------- wiring ---------- */
document.getElementById('leverL').addEventListener('click',()=>flip(-1));
document.getElementById('leverR').addEventListener('click',()=>flip(1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){ flip(-1); e.preventDefault(); return; }
  if(e.key==='ArrowRight'){ flip(1); e.preventDefault(); return; }
  if(e.key==='Escape'){ clearArm(); winCode.textContent='– –'; return; }
  const k=e.key.toUpperCase();
  if(LETTERS.includes(k)){ armLetter(k); return; }
  if(NUMBERS.includes(k)){ hitNumber(k); return; }
});

renderPage();
drawQueue();

console.log("%cVic Rennick, proprietor:","color:#c62f35;font-weight:bold;font-size:14px");
console.log("%c\"Re-stripped the whole box Tuesday. If you don't hear that B-side on B4 you're not living right. Now drop a nickel.\"","color:#3fb8ac;font-style:italic");
</script>
