  <meta name="outbox-spec-era" content="A wet, gusty Sunday lunchtime in late March 1986, about ten to one, at a pancake house built into the sea-dyke road on the island of Schouwen-Duiveland in Zeeland. The dining room is a long glass box. Its windows face the Oosterschelde on one side and a car park full of caravans and bicycle trailers on the other, and every table has an upturned glass of three wax crayons and a stack of paper placemats. The kitchen runs six cast-iron griddles at once and has a forty-minute wait. Twenty-odd families in damp anoraks are seated and waiting. The children have been given the placemats specifically so that the adults can talk about the storm surge barrier, which opens to traffic in October and which everyone has opinions about.">
  <meta name="outbox-spec-format" content="A KIDS' ACTIVITY PLACEMAT at true size: a thin, slightly absorbent A3 paper sheet, landscape, printed in one ink colour, lying on a pale wood table with a crayon glass at the top edge and a faint wet ring from a lemonade glass. One half is the full children's menu with prices. The other half is crammed with games: a dyke-road maze from the car park to the griddle, a twenty-point dot-to-dot, a spot-the-seven-differences pair of pancake drawings, a word-search of toppings, a colour-me-in mascot, a 'DRAW YOUR DREAM PANCAKE' circle, and a cut-out paper crown along the bottom edge. The visitor does all of it with the crayons, exactly as a restless eight-year-old would, while the order is cooking.">
  <meta name="outbox-spec-subject" content="Captain Stroop, the restaurant's homemade mascot: a round, cheerful pancake with a sailor's cap, a curly treacle moustache and a lifejacket, who appears in every puzzle on the mat. In the maze he is trying to cycle from the car park to the griddle against a headwind. In the dot-to-dot he becomes a large surprise, which is a pancake the size of a cartwheel. In the spot-the-difference, one of the two Captains has lost a button, gained a gull and is holding his fork in the wrong hand. The children's menu is written in his voice, with his named pancakes: the Low Tide (plain with butter and sugar), the High Tide (stacked three high), the Mussel Bed (apple and raisin, 'no actual mussels, promise'), the Lighthouse (bacon and a single cherry on top), the Foghorn (extra syrup, 'for loud children') and the Shipwreck, which is whatever falls apart in the pan, at half price. The page also carries a sidebar of Captain Stroop's Pancake Facts, which are all invented and all sincerely enthusiastic. One example: 'The record for flipping is 4 metres, set by Captain Stroop in a gale!'">
  <meta name="outbox-spec-tone" content="The bouncy, pun-loving, exclamation-heavy voice of Femke Boateng-de Wit, 34, who co-owns the place with her sister. She draws and writes the placemat herself every spring, prints it at the copy shop in Zierikzee, and is clearly having the time of her life. She speaks straight to the kids as 'Crew!' and 'Sailor!' and writes Captain Stroop's lines in big wobbly capitals. She cannot resist a bad food pun ('BATTER up!', 'Don't flip out!', 'Syrup-ly the best!'), and she hides small jokes for the grown-ups in the fine print ('Parents: coffee refills are free. Patience refills are at the counter.'). She cheers every finished puzzle as if it were a gold medal. She is warm, silly and very slightly frazzled by the lunch rush, and she is never sarcastic, never wistful and never wise.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="One-ink copy-shop printing in a slightly blotchy duplicator sea-green (#1f7f6a), with heavier and fuzzier lines where the drum ran low on the right-hand third. It is printed on cheap absorbent placemat paper in warm off-white (#f6f0e0) with visible pulp flecks, a ring of lemonade cockling near one corner, and a pale grease spot shaped like a fork. All visitor marks are in waxy crayon. The crayon glass holds three sticks, but they are only the tomato red (#e2412f), a darker overworked version of the sea-green, and a stub of syrup brown (#7a4a1e), rendered with real waxy grain that skips over the paper texture and builds up shiny where it is scribbled over twice. No other colours.">
  <meta name="outbox-spec-wildcard" content="A herring gull stands on the windowsill outside, pressed against the glass at the top right of the mat, and it moves its head to follow the cursor. If the visitor draws a crayon chip or a pancake anywhere within reach of the window edge, the gull taps the glass twice. Once per session, the first fully coloured-in pancake drawn in the 'DREAM PANCAKE' circle quietly vanishes from the paper, leaving just its crayon outline and a single printed footprint-shaped smudge. The gull looks very pleased. Nothing on the mat explains it, although the fine print of the menu does say 'Captain Stroop is NOT responsible for gulls.'">
  <meta name="outbox-spec-forbidden" content="NO windmill, clog, tulip, cheese, Delft-blue or Golden Age painting kitsch. NO Dutch words sprinkled for flavour beyond names and pancake labels, and NO travelogue explaining the Netherlands or Zeeland to anybody. NO 1953 flood disaster, Delta Works heroism, sea-versus-land struggle or 'a nation below sea level' theme. The barrier is lunch-table small talk. NO water-as-threat, no storm dread and no rising-sea foreshadowing. NO 1986 nostalgia or retro-kitsch irony about paper placemats or crayons in a glass, and no 'remember when'. NO childhood-memory framing, bittersweet hindsight or 'kids' table' melancholy. NO food writing or sensuous description of batter and syrup beyond menu copy. NO dry deadpan, NO lowercase fragments, NO archival or found-ephemera framing of the mat, NO 'flat arithmetic of X' tradesperson voice and NO physics-engine solemnity. The pancakes are coming, and the maze is not finished yet.">
