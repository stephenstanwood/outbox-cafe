  <meta name="outbox-spec-era" content="1963, right now — half past ten on a hot bright harmattan morning in the dye-pit yard at Kofar Mata, Kano, northern Nigeria: forty-odd fermentation pits sunk mouth-flush into the packed earth, the surface of the one in front of you carrying its coppery foam bloom, cotton skeins on the rail behind you still dripping from the eight o'clock dip. Not a look-back at 'the ancient art of indigo' and not a 'synthetic dyes killed it' lament — the pit is alive and working this minute, the liquid warm, the next dip due before the sun gets any higher.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the round mouth of one sunken indigo pit seen from directly overhead and life-size, ringed by a lip of packed earth, and nothing else: no header, no caption, no counter, no title. Across the surface sits a living metallic foam bloom that genuinely drifts, coalesces and heals, and hanging into frame from the top edge are seven cotton skeins on a rail. Press and drag a skein down into the liquid — the surface parts and closes honestly around it, the foam breaks and knits back over the wound where it went in — and release above the earth lip to hang it in the air, where it oxidizes in real time in front of you: out of the vat it is a wet yellow-green, and over roughly twenty seconds it climbs honestly through jade, through a grey-teal, into blue, per skein, on its own clock. Re-dip a skein that has already turned and it goes yellow-green again and comes back deeper. The piece IS the colour arriving in the air.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of dipping cotton in a fermentation indigo pit — that indigo is not soluble and never was, so it has to be chemically reduced in the pit into a soluble yellow-green leuco form, which is the ONLY form that will actually enter a fibre; that the blue you see afterwards is oxygen from ordinary air converting that yellow-green back into insoluble pigment while it is already locked inside the cotton, which is why the cloth changes colour in your hands and not in the vat; that shade is built by repeated short dips rather than one long soak, because a long soak just wastes reduced dye and gives you nothing extra past saturation; that the coppery foam bloom on the surface is the vat telling you its reduction is healthy and that breaking it repeatedly by thrashing the cloth drags air in and spoils the liquid; that you lift slowly and squeeze under the surface, not above it, for the same reason; and that a pit gets measurably weaker across a morning because every skein takes dye out and nothing puts it back until the pit is fed again. Literally leaves, potash, warm water, oxygen, and how many times you dunk it.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the cloth, and that register is WARM, BUSY and CHEMICAL — a thick working surface that is never still, foam knitting and tearing, drips landing and starring the earth lip, colour actively climbing up a hanging skein at a speed you can watch. Hard bright mid-morning light, sharp shadow off the pit lip, dust in the air. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow-and-contemplative, NOT melancholy — this is a hot yard mid-job, not a mood.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Deep vat indigo (#1b2f5e) and the wet leuco yellow-green that comes out of it (#8a9440) as the two working anchors, with the intermediate oxidation greys-and-jades passing through (#3f6b63), all sitting in packed laterite yard earth (#8d5a3a) under hard harmattan light, and exactly one chip of coppery vat-bloom (#b6763a) held strictly for the metallic foam on the surface and the sheen on a freshly lifted skein. Flat, hard, high-contrast, no soft edges, no glow — a pit mouth photographed straight down at half past ten.">
  <meta name="outbox-spec-wildcard" content="The pit is a finite, non-replenishing resource for the whole visit: total reduced dye in the vat is a real quantity that drops with every dip and never recovers, so the surface bloom thins, the yellow-green comes out paler, and late skeins oxidize to a weaker, greyer blue no matter how long they hang. Nothing on the page states this, hints at it, warns about it, or ever resets it — it is discoverable only by dipping enough to notice the twelfth skein is not the colour the second one was.">

<body>
<div id="stage"><canvas id="c"></canvas></div>
<a id="archive" href="/archive" title="other mornings">✳</a>
<script>
(function(){
"use strict";
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var W=0,H=0,DPR=1,CX=0,CY=0,R=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H*0.54;
  R=Math.min(W,H)*0.42;
  layoutSkeins();
  buildEarth();
}

/* ---------- palette ---------- */
var VAT="#1b2f5e", LEUCO="#8a9440", JADE="#3f6b63", EARTH="#8d5a3a", COPPER="#b6763a";
function mix(a,b,t){t=t<0?0:t>1?1:t;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return "rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";}
var C_LEUCO=[138,148,64], C_JADE=[63,107,99], C_GREY=[74,92,104], C_VAT=[27,47,94], C_DRY=[236,229,214];

/* ---------- the vat: finite reduced dye ---------- */
var vat = { dye: 1.0 };          // never replenishes. ever.
function vatStrength(){ return vat.dye; }

/* ---------- earth lip speckle (baked once) ---------- */
var earthCanvas=null;
function buildEarth(){
  earthCanvas=document.createElement("canvas");
  earthCanvas.width=Math.max(1,Math.floor(W*DPR));earthCanvas.height=Math.max(1,Math.floor(H*DPR));
  var g=earthCanvas.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=EARTH;g.fillRect(0,0,W,H);
  // laterite grain
  var n=Math.floor(W*H/220);
  for(var i=0;i<n;i++){
    var x=Math.random()*W,y=Math.random()*H;
    var v=Math.random();
    if(v<0.42) g.fillStyle="rgba(158,102,64,"+(0.10+Math.random()*0.30)+")";
    else if(v<0.78) g.fillStyle="rgba(112,68,40,"+(0.10+Math.random()*0.30)+")";
    else g.fillStyle="rgba(204,158,110,"+(0.06+Math.random()*0.22)+")";
    var s=0.8+Math.random()*2.6;
    g.fillRect(x,y,s,s);
  }
  // scatter of old dried indigo splash on the lip
  for(var k=0;k<90;k++){
    var a=Math.random()*Math.PI*2, rr=R*(1.06+Math.random()*0.9);
    var px=CX+Math.cos(a)*rr, py=CY+Math.sin(a)*rr;
    g.fillStyle="rgba(27,47,94,"+(0.06+Math.random()*0.22)+")";
    g.beginPath();g.arc(px,py,1+Math.random()*4.5,0,6.2832);g.fill();
  }
  // hard harmattan shadow: the lip throws a sharp crescent inward, sun high & left
  g.save();
  g.beginPath();g.arc(CX,CY,R,0,6.2832);g.clip();
  g.fillStyle="rgba(40,20,10,0.0)";g.fillRect(0,0,W,H);
  g.restore();
  // small stones
  for(var s2=0;s2<40;s2++){
    var aa=Math.random()*Math.PI*2, r2=R*(1.1+Math.random()*0.85);
    var sx=CX+Math.cos(aa)*r2, sy=CY+Math.sin(aa)*r2, sz=1.5+Math.random()*4;
    g.fillStyle="rgba(196,152,104,0.55)";g.beginPath();g.arc(sx,sy,sz,0,6.2832);g.fill();
    g.fillStyle="rgba(74,42,22,0.5)";g.beginPath();g.arc(sx+sz*0.5,sy+sz*0.6,sz*0.8,0,6.2832);g.fill();
  }
}

/* ---------- foam field: coalescing cells on the surface ---------- */
var CELLS=170, cells=[];
function initCells(){
  cells=[];
  for(var i=0;i<CELLS;i++){
    var a=Math.random()*6.2832, rr=Math.sqrt(Math.random())*0.94;
    cells.push({
      x:Math.cos(a)*rr, y:Math.sin(a)*rr,       // normalized pit coords
      vx:(Math.random()-0.5)*0.010, vy:(Math.random()-0.5)*0.010,
      r:0.035+Math.random()*0.085,
      life:0.35+Math.random()*0.65,             // 0..1 how knit-together
      seed:Math.random()*100
    });
  }
}
function stirCells(dt,t){
  var s=vatStrength();
  for(var i=0;i<cells.length;i++){
    var c=cells[i];
    // slow convection: warm liquid turning over
    var ang=Math.sin(c.x*3.1+t*0.24+c.seed)*1.0+Math.cos(c.y*2.7-t*0.19)*1.0;
    c.vx+=Math.cos(ang)*0.0022*dt*60*0.016;
    c.vy+=Math.sin(ang)*0.0022*dt*60*0.016;
    // drift toward each other -> coalescence, weakly
    c.vx*=0.985;c.vy*=0.985;
    c.x+=c.vx*dt*60*0.016*4;c.y+=c.vy*dt*60*0.016*4;
    var d=Math.hypot(c.x,c.y);
    if(d>0.93){ c.x*=0.93/d; c.y*=0.93/d; c.vx*=-0.4;c.vy*=-0.4; }
    // heal: bloom knits back at a rate the vat can afford
    var target=Math.min(1, 0.25+s*0.95);
    if(c.life<target) c.life+=dt*0.36*(0.3+s);
    if(c.life>target) c.life-=dt*0.20;
    if(c.life<0)c.life=0;if(c.life>1)c.life=1;
    c.r += (0.030+0.075*s - c.r)*dt*0.5;
  }
}
function tearFoam(px,py,rad,amount){
  for(var i=0;i<cells.length;i++){
    var c=cells[i];
    var d=Math.hypot(c.x-px,c.y-py);
    if(d<rad){
      var f=1-d/rad;
      c.life-=amount*f;
      if(c.life<0)c.life=0;
      // push cells outward, foam shoved aside
      var a=Math.atan2(c.y-py,c.x-px);
      c.vx+=Math.cos(a)*amount*f*0.06;
      c.vy+=Math.sin(a)*amount*f*0.06;
    }
  }
}

/* ---------- skeins ---------- */
var skeins=[];
function makeSkein(i){
  return {
    i:i,
    hx:0, hy:0,          // hang point on rail
    x:0,  y:0,           // current bottom-of-skein position (screen)
    tx:0, ty:0,
    len:0,
    state:"rail",        // rail | held | hanging
    dips:0,
    depth:0,             // 0..1 how deep the last submersion was
    dwell:0,             // seconds under this dip
    load:0,              // leuco taken up this dip (0..1)
    shade:0,             // accumulated indigo depth, multiplicative
    oxid:1,              // 0 = fresh leuco yellow-green, 1 = fully turned
    wet:0,
    strengthAtDip:1,     // vat strength when it last came out
    lastX:0,lastY:0,
    thrash:0,
    dripT:0,
    grabbed:false,
    submerged:false
  };
}
function layoutSkeins(){
  var n=7;
  var railY=Math.max(26, H*0.055);
  if(skeins.length!==n){ skeins=[]; for(var i=0;i<n;i++) skeins.push(makeSkein(i)); }
  var span=Math.min(W*0.90, R*2.25);
  for(var j=0;j<n;j++){
    var s=skeins[j];
    s.hx = CX - span/2 + span*(j/(n-1));
    s.hy = railY;
    s.len = Math.min(H*0.20, R*0.52);
    if(s.state==="rail"){ s.x=s.hx; s.y=s.hy+s.len; s.tx=s.x;s.ty=s.y; }
    if(s.state==="hanging"&&s.y<railY+10){ s.y=railY+s.len; }
  }
}

/* ---------- drip stars on the lip ---------- */
var drips=[];
function addDrip(x,y,col,big){
  drips.push({x:x,y:y,r:0,max:(big?4+Math.random()*5:1.6+Math.random()*3),c:col,a:1,t:0,fixed:false});
}
var splats=[]; // permanent-ish marks on earth

/* ---------- colour of a skein ---------- */
function skeinColor(s){
  // wet leuco yellow-green -> jade -> grey-teal -> vat indigo
  // shade governs how deep the final blue is; vat strength at dip governs richness
  var o=s.oxid;
  var col;
  if(o<0.42){
    col=mix(C_LEUCO,C_JADE,o/0.42);
  }else if(o<0.72){
    col=mix(C_JADE,C_GREY,(o-0.42)/0.30);
  }else{
    col=mix(C_GREY,C_VAT,(o-0.72)/0.28);
  }
  // pale undyed cotton pulls the colour toward cream when shade is low
  var depth=1-Math.pow(1-s.shade,1.0);
  col=mix(C_DRY,col,Math.min(1,0.12+depth*0.95));
  // a weak vat gives a greyer, thinner blue even fully oxidized
  var greyPull=(1-s.strengthAtDip);
  col=mix(col,[96,102,112],greyPull*0.42*o);
  // wetness darkens
  col=mix(col,[col[0]*0.72,col[1]*0.74,col[2]*0.80],s.wet*0.9);
  return col;
}

/* ---------- input ---------- */
var pointer={x:0,y:0,down:false};
var held=null;

function pos(e){
  var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:t.clientX,y:t.clientY};
}
function down(e){
  var p=pos(e);pointer.x=p.x;pointer.y=p.y;pointer.down=true;
  var best=null,bd=1e9;
  for(var i=0;i<skeins.length;i++){
    var s=skeins[i];
    var d=Math.hypot(p.x-s.x,p.y-s.y);
    // also allow grabbing anywhere along the body
    var dm=Math.hypot(p.x-s.x,p.y-(s.y-s.len*0.5));
    d=Math.min(d,dm*1.05);
    if(d<bd){bd=d;best=s;}
  }
  var grabR=Math.max(46,R*0.16);
  if(best&&bd<grabR){ held=best; held.grabbed=true; held.state="held"; held.tx=p.x;held.ty=p.y; e.preventDefault(); }
}
function move(e){
  var p=pos(e);pointer.x=p.x;pointer.y=p.y;
  if(held){ held.tx=p.x;held.ty=p.y; e.preventDefault(); }
}
function up(e){
  if(held){
    held.grabbed=false;
    held.state="hanging";
    held=null;
  }
  pointer.down=false;
}
cv.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("touchend",up);
window.addEventListener("touchcancel",up);

/* ---------- physics / chemistry ---------- */
function updateSkein(s,dt,t){
  var railY=s.hy;
  if(s.state==="held"){
    // follow pointer with a little lag; cannot go above the rail
    var ty=Math.max(railY+s.len*0.35,s.ty);
    s.x+=(s.tx-s.x)*Math.min(1,dt*16);
    s.y+=(ty-s.y)*Math.min(1,dt*16);
  }else if(s.state==="hanging"){
    // settles back to hanging straight from its rail point, but keeps its height
    s.x+=(s.hx-s.x)*Math.min(1,dt*2.2);
    var restY=Math.max(railY+s.len, Math.min(s.y, CY-R*1.02));
    if(s.y>CY-R*0.9){ restY=railY+s.len; }
    s.y+=(restY-s.y)*Math.min(1,dt*2.0);
  }else{
    s.x=s.hx;s.y=s.hy+s.len;
  }

  // is it in the liquid?
  var nx=(s.x-CX)/R, ny=(s.y-CY)/R;
  var insidePit=(nx*nx+ny*ny)<0.97;
  var wasSub=s.submerged;
  s.submerged = insidePit && s.state!=="rail";

  var moved=Math.hypot(s.x-s.lastX,s.y-s.lastY);
  var lateral=Math.abs(s.x-s.lastX);
  s.lastX=s.x;s.lastY=s.y;

  if(s.submerged){
    // how deep: measured from the near edge of the pit toward the centre-ish.
    var d=Math.sqrt(nx*nx+ny*ny);
    var depth=Math.max(0,Math.min(1,(1-d)/0.85));
    s.depth=Math.max(s.depth,depth);
    if(!wasSub){
      // entering: it goes yellow-green again immediately. leuco is what enters fibre.
      s.oxid=0; s.dwell=0; s.load=0; s.dips++;
      tearFoam(nx,ny,0.20,0.85);
      spawnRipple(s.x,s.y,1.0);
    }
    s.dwell+=dt;
    s.wet=Math.min(1,s.wet+dt*3.0);
    s.oxid=0;

    // uptake: fast at first, hard saturation ceiling per dip.
    // a long soak past ~1.6s adds essentially nothing.
    var ceiling=0.055+0.30*vatStrength()*(0.35+0.65*s.depth);
    var rate=2.4;
    s.load += (ceiling-s.load)*Math.min(1,dt*rate);

    // dye actually leaves the pit
    var taken=(ceiling-s.load>0? 0:0);
    var drawn=Math.max(0,(ceiling-s.load));
    vat.dye -= dt*0.0075*(0.25+s.depth)*Math.min(1,s.load/(ceiling+1e-6));
    if(vat.dye<0.02)vat.dye=0.02;

    // foam: a slow vertical lift barely opens it. thrashing sideways wrecks it.
    var lateralN=lateral/R;
    s.thrash=s.thrash*0.9+lateralN*10;
    var tearAmt = 0.06*dt*60*0.016 + lateralN*2.4 + (moved/R)*0.35;
    tearFoam(nx,ny,0.13+lateralN*3.0,Math.min(0.9,tearAmt));
    if(lateralN>0.004){
      // air dragged in: the vat pays for it
      vat.dye-=lateralN*0.010;
      if(vat.dye<0.02)vat.dye=0.02;
      spawnRipple(s.x,s.y,0.5+lateralN*40);
    }
  } else {
    if(wasSub){
      // lifted out. lock in what it took. shade builds multiplicatively.
      s.shade = 1-(1-s.shade)*(1-s.load*1.55);
      if(s.shade>0.985)s.shade=0.985;
      s.strengthAtDip = vatStrength()*0.55+0.45*s.strengthAtDip;
      s.depth=0; s.load=0;
      // squeezing above the surface: not what you'd do, but drips fall regardless
      var nx2=(s.x-CX)/R,ny2=(s.y-CY)/R;
      tearFoam(nx2,ny2,0.14,0.35);
      s.dripT=0;
    }
    // oxidation in air: roughly 20s to arrive
    if(s.dips>0){
      var rate2=1/20;
      // a wetter skein turns a hair slower at first
      var f=(0.72+0.42*(1-s.wet));
      s.oxid=Math.min(1,s.oxid+dt*rate2*f);
      s.wet=Math.max(0,s.wet-dt*0.10);
    }
    // drips
    if(s.wet>0.25&&s.state!=="rail"){
      s.dripT-=dt;
      if(s.dripT<=0){
        s.dripT=0.20+Math.random()*0.9/(s.wet+0.15);
        var col=skeinColor(s);
        var dx=s.x+(Math.random()-0.5)*R*0.10;
        var dnx=(dx-CX)/R, dny=(s.y-CY)/R;
        if(!(dnx*dnx+dny*dny<0.97)){
          falling.push({x:dx,y:s.y,vy:H*0.55,c:col});
        }
      }
    }
  }
}

/* ---------- ripples ---------- */
var ripples=[];
function spawnRipple(x,y,p){
  if(ripples.length>60)return;
  ripples.push({x:x,y:y,r:R*0.02,max:R*(0.10+0.16*Math.min(2,p)),a:0.5*Math.min(1,p)});
}
var falling=[];

/* ---------- render ---------- */
function drawPit(t){
  // liquid body — flat, hard, thick
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,0,6.2832);ctx.clip();

  var s=vatStrength();
  // base vat: darker & warmer when strong, flatter grey-blue when spent
  var base=mix([21,36,72],[44,56,84],1-s);
  ctx.fillStyle=rgb(base);
  ctx.fillRect(CX-R,CY-R,R*2,R*2);

  // thick turning liquid: broad slow lobes of slightly different indigo
  ctx.globalAlpha=0.5;
  for(var i=0;i<14;i++){
    var a=t*0.10+i*0.9;
    var lx=CX+Math.cos(a*0.83+i)*R*0.52;
    var ly=CY+Math.sin(a*0.71+i*1.7)*R*0.52;
    var lr=R*(0.22+0.20*Math.abs(Math.sin(a*0.5+i)));
    var c=mix([16,29,60],[38,62,104],(Math.sin(a+i)*0.5+0.5)*s);
    ctx.fillStyle=rgb(c);
    ctx.beginPath();ctx.arc(lx,ly,lr,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;

  // hard light patch: mid-morning sun straight down the pit mouth, upper-left
  ctx.globalAlpha=0.16*(0.5+0.5*s);
  ctx.fillStyle="#6f86b4";
  ctx.beginPath();ctx.ellipse(CX-R*0.22,CY-R*0.26,R*0.46,R*0.36,-0.5,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;

  // ---- foam bloom: coppery metallic cells ----
  for(var k=0;k<cells.length;k++){
    var c2=cells[k];
    if(c2.life<=0.02)continue;
    var px=CX+c2.x*R, py=CY+c2.y*R, pr=c2.r*R*(0.6+0.6*c2.life);
    var wob=1+0.18*Math.sin(t*1.7+c2.seed);
    ctx.globalAlpha=Math.min(0.95,c2.life*0.72*(0.35+0.75*s));
    ctx.fillStyle=COPPER;
    ctx.beginPath();ctx.ellipse(px,py,pr*wob,pr/wob,c2.seed,0,6.2832);ctx.fill();
    // metallic crust highlight — flat, no glow
    ctx.globalAlpha=Math.min(0.75,c2.life*0.42*(0.3+0.7*s));
    ctx.fillStyle="#d69a5c";
    ctx.beginPath();ctx.ellipse(px-pr*0.22,py-pr*0.24,pr*0.42,pr*0.30,c2.seed*1.3,0,6.2832);ctx.fill();
    // dark rim where the skin is torn thin
    ctx.globalAlpha=Math.min(0.5,(1-c2.life)*0.5);
    ctx.strokeStyle="#2a1c14";ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(px,py,pr*1.02,pr*0.98,0,0,6.2832);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // fine froth speckle, thins as the vat spends
  var speck=Math.floor(150*s);
  ctx.fillStyle="rgba(214,154,92,0.45)";
  for(var q=0;q<speck;q++){
    var aa=(q*2.399+t*0.05), rr=R*Math.sqrt(((q*0.61803)%1))*0.94;
    ctx.fillRect(CX+Math.cos(aa)*rr,CY+Math.sin(aa)*rr,1.4,1.4);
  }

  // ripples
  for(var ri=ripples.length-1;ri>=0;ri--){
    var rp=ripples[ri];
    ctx.globalAlpha=rp.a;
    ctx.strokeStyle="rgba(198,160,120,0.9)";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,6.2832);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // inner shadow off the lip — hard crescent, sun high-left
  ctx.globalAlpha=0.55;
  ctx.fillStyle="#0d1730";
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,6.2832);
  ctx.arc(CX-R*0.11,CY-R*0.13,R*0.985,0,6.2832,true);
  ctx.fill();
  ctx.globalAlpha=1;

  ctx.restore();

  // the lip itself: a hard ring of packed earth, raised
  ctx.save();
  ctx.strokeStyle="rgba(58,32,16,0.85)";
  ctx.lineWidth=Math.max(2,R*0.012);
  ctx.beginPath();ctx.arc(CX,CY,R+ctx.lineWidth*0.4,0,6.2832);ctx.stroke();
  ctx.strokeStyle="rgba(216,168,116,0.75)";
  ctx.lineWidth=Math.max(1.5,R*0.008);
  ctx.beginPath();ctx.arc(CX-R*0.006,CY-R*0.010,R+R*0.020,0,6.2832);ctx.stroke();
  ctx.restore();
}

function drawSkein(s){
  var col=skeinColor(s);
  var top=s.hy;
  var bx=s.x, by=s.y;
  var mx=(s.hx*0.35+bx*0.65);
  var w=Math.max(7,R*0.075);

  // cast shadow on the earth when out over the lip — hard, offset
  var nx=(bx-CX)/R,ny=(by-CY)/R;
  if(!(nx*nx+ny*ny<0.97)){
    ctx.save();
    ctx.globalAlpha=0.30;
    ctx.strokeStyle="#3a2010";
    ctx.lineWidth=w*0.9;ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(s.hx+w*0.9,top+w*0.9);
    ctx.quadraticCurveTo(mx+w*0.9,(top+by)/2+w*0.9,bx+w*0.9,by+w*0.9);
    ctx.stroke();
    ctx.restore();
  }

  // the hank: two strands twisted, drawn as thick strokes
  ctx.save();
  ctx.lineCap="round";
  // dark core
  ctx.strokeStyle=rgb([col[0]*0.68,col[1]*0.70,col[2]*0.76]);
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(s.hx,top);
  ctx.quadraticCurveTo(mx,(top+by)/2,bx,by);
  ctx.stroke();
  // body
  ctx.strokeStyle=rgb(col);
  ctx.lineWidth=w*0.74;
  ctx.beginPath();
  ctx.moveTo(s.hx,top);
  ctx.quadraticCurveTo(mx,(top+by)/2,bx,by);
  ctx.stroke();
  // strand highlight
  ctx.strokeStyle=rgb(mix(col,[255,250,240],0.22));
  ctx.lineWidth=Math.max(1,w*0.16);
  ctx.beginPath();
  ctx.moveTo(s.hx-w*0.16,top);
  ctx.quadraticCurveTo(mx-w*0.16,(top+by)/2,bx-w*0.16,by);
  ctx.stroke();

  // the coppery sheen on a freshly lifted skein, only while properly wet
  if(s.wet>0.45&&s.dips>0){
    ctx.globalAlpha=Math.min(0.55,(s.wet-0.45)*1.6);
    ctx.strokeStyle=COPPER;
    ctx.lineWidth=Math.max(1,w*0.10);
    ctx.beginPath();
    ctx.moveTo(s.hx+w*0.20,top+6);
    ctx.quadraticCurveTo(mx+w*0.20,(top+by)/2,bx+w*0.20,by-4);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  // bottom loop of the hank
  ctx.fillStyle=rgb([col[0]*0.82,col[1]*0.84,col[2]*0.88]);
  ctx.beginPath();ctx.ellipse(bx,by,w*0.62,w*0.44,0,0,6.2832);ctx.fill();
  ctx.fillStyle=rgb(col);
  ctx.beginPath();ctx.ellipse(bx-w*0.06,by-w*0.06,w*0.46,w*0.30,0,0,6.2832);ctx.fill();
  ctx.restore();
}

function drawRail(){
  var y=skeins.length?skeins[0].hy:20;
  ctx.save();
  // rail shadow on the earth
  ctx.fillStyle="rgba(58,32,16,0.30)";
  ctx.fillRect(0,y+R*0.05,W,Math.max(4,R*0.035));
  // the rail: a rough pole
  var g=ctx.createLinearGradient(0,y-10,0,y+10);
  g.addColorStop(0,"#6b4a2c");g.addColorStop(0.4,"#966a41");g.addColorStop(1,"#4a3018");
  ctx.fillStyle=g;
  ctx.fillRect(0,y-Math.max(5,R*0.030),W,Math.max(10,R*0.058));
  // grain
  ctx.strokeStyle="rgba(48,28,14,0.35)";ctx.lineWidth=1;
  for(var i=0;i<30;i++){
    var xx=(i*W/30+((i*37)%11));
    ctx.beginPath();ctx.moveTo(xx,y-R*0.026);ctx.lineTo(xx+18,y+R*0.026);ctx.stroke();
  }
  ctx.restore();
}

function drawDust(t){
  // harmattan haze: a few motes in hard light
  ctx.save();
  ctx.globalAlpha=0.28;
  for(var i=0;i<50;i++){
    var sd=i*7.13;
    var x=((Math.sin(sd)*0.5+0.5)*W + t*(8+ (i%5)*6)) % (W+40) - 20;
    var y=((Math.cos(sd*1.7)*0.5+0.5)*H + Math.sin(t*0.5+i)*14);
    ctx.fillStyle= (i%4===0)?"#e6c9a2":"#f3ddbd";
    ctx.fillRect(x,y,1.6,1.6);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- loop ---------- */
var last=performance.now()/1000, tt=0;
function frame(now){
  now/=1000;
  var dt=Math.min(0.05,now-last);last=now;tt+=dt;

  stirCells(dt,tt);

  for(var i=0;i<skeins.length;i++) updateSkein(skeins[i],dt,tt);

  // ripples
  for(var r=ripples.length-1;r>=0;r--){
    var rp=ripples[r];
    rp.r+=dt*R*0.55;rp.a-=dt*1.1;
    if(rp.a<=0||rp.r>rp.max*3)ripples.splice(r,1);
  }
  // falling drips
  for(var d=falling.length-1;d>=0;d--){
    var f=falling[d];
    f.y+=f.vy*dt; f.vy+=H*1.4*dt;
    var fnx=(f.x-CX)/R,fny=(f.y-CY)/R;
    if(fnx*fnx+fny*fny<0.97){
      spawnRipple(f.x,f.y,0.35);
      tearFoam(fnx,fny,0.05,0.25);
      falling.splice(d,1);continue;
    }
    if(f.y>H+20){falling.splice(d,1);continue;}
    // landed on the earth: star it
    if(f.y>CY+R*0.02 && Math.abs(fnx)>0.99 || (f.y>H*0.90)){
      splats.push({x:f.x,y:f.y,c:f.c,r:2+Math.random()*4,rays:3+((Math.random()*4)|0)});
      falling.splice(d,1);continue;
    }
  }
  if(splats.length>320)splats.splice(0,splats.length-320);

  // ---- draw ----
  ctx.clearRect(0,0,W,H);
  if(earthCanvas) ctx.drawImage(earthCanvas,0,0,W,H);

  // splats on the lip (drawn before the pit so they sit on earth only)
  for(var sp=0;sp<splats.length;sp++){
    var S=splats[sp];
    ctx.fillStyle="rgba("+(S.c[0]|0)+","+(S.c[1]|0)+","+(S.c[2]|0)+",0.55)";
    ctx.beginPath();ctx.arc(S.x,S.y,S.r,0,6.2832);ctx.fill();
    for(var ry=0;ry<S.rays;ry++){
      var a=ry*2.1+S.x*0.01;
      ctx.beginPath();
      ctx.arc(S.x+Math.cos(a)*S.r*2.0,S.y+Math.sin(a)*S.r*2.0,S.r*0.36,0,6.2832);
      ctx.fill();
    }
  }

  drawPit(tt);
  drawRail();

  // falling drips over everything below the rail
  for(var fi=0;fi<falling.length;fi++){
    var ff=falling[fi];
    ctx.fillStyle="rgba("+(ff.c[0]|0)+","+(ff.c[1]|0)+","+(ff.c[2]|0)+",0.9)";
    ctx.beginPath();ctx.ellipse(ff.x,ff.y,2.2,4.4,0,0,6.2832);ctx.fill();
  }

  // skeins: held one on top
  for(var k=0;k<skeins.length;k++) if(skeins[k]!==held) drawSkein(skeins[k]);
  if(held) drawSkein(held);

  drawDust(tt);

  requestAnimationFrame(frame);
}

window.addEventListener("resize",resize);
resize();
initCells();
requestAnimationFrame(frame);

// leaves, potash, warm water. nothing is added back until it is fed.
try{
  var prev=parseInt(localStorage.getItem("kofarmata.mornings")||"0",10)||0;
  localStorage.setItem("kofarmata.mornings",String(prev+1));
}catch(e){}
})();
</script>
