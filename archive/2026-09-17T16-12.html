  <meta name="outbox-spec-era" content="Half past two on a hot bright afternoon in late June 1958, inside the steam-bending room of a hardwood bentwood works in Radomsko, Poland — not the finished chair, not the showroom, not anybody's design heritage: the BENDING STRAP AND FORMER, with a steamed beech rod forty-one minutes out of the retort and cooling at a rate the page renders honestly, being pulled around a cast-iron hoop-back former by two people who have about ninety seconds of workable material and a rod that is already stiffening at the ends.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the bending bench seen straight down from about waist height, filled corner to corner: a cast-iron former bolted to a scarred beech bench, a steel bending strap with its end stops, and ONE steamed beech rod that is being pulled around the former in real time, over and over, forever, by nobody. It is not an animation of wood bending. It is a live viscoelastic beam: the rod is several hundred fibre elements with real moduli that are TEMPERATURE- AND MOISTURE-DEPENDENT and cooling honestly from the outside in, so the bend that succeeds in the first twenty seconds after the retort fails at ninety, and the engine simply keeps trying — pull, set, release, stack, fetch another rod — and the page is the work going on at the bench with the light coming through a high window and moving a hand's width across the frame every few minutes. The visitor's whole vocabulary is what a hand does at a bending bench and nothing else: DRAG the strap's free end around the former, which is a real pull applying real end-compression through the strap into the rod; PRESS AND HOLD anywhere on the rod to clamp it to the former with a real thumb-width contact, which locally arrests springback; and SCRUB sideways across the bench to run the window shutter, which changes how much afternoon comes in and therefore how fast every rod on the bench is losing heat. Nothing scrolls. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat mechanics of bending solid hardwood, which is entirely a COMPRESSION problem and not a bending problem, and which almost everybody has backwards. That wood in tension fails at roughly one percent elongation and will not stretch further no matter what is done to it, while wood in compression will shorten by twenty-five or thirty percent without breaking — so the entire trade consists of making sure the outside of the bend never goes into tension at all. That this is what the STEEL STRAP is for and it is not a support and not a jig: it is a tension member clamped hard against the outer face with end stops at both ends, so when the rod is pulled around the former the strap carries every bit of the tensile load and the wood sees nothing but compression from end to end, and a strap fitted a sixteenth of an inch loose at one stop means the rod takes tension in the first inch of pull and tears out in a long splintered run down the outer face. That HEAT IS THE WHOLE VARIABLE AND MOISTURE IS NOT: steaming does almost nothing to the moisture content of a rod already at twenty percent, it delivers heat, and heat above about 80°C softens the lignin between the fibres so the cell walls can buckle into little accordion folds instead of splitting — which is why a rod dunked in cold water bends nothing and a rod out of a dry heat box bends fine. That the retort gives roughly one hour per inch of thickness and going longer does not help and does hurt, because prolonged steam degrades the wood and a rod boiled for three hours comes out weak and stays weak. That THE CLOCK STARTS THE MOMENT THE DOOR OPENS and the rod cools from the outside in, so the workable window is not a matter of feel but of a real temperature gradient: the outer fibres, which are the ones that must not tear, are also the first ones to go cold and stiff, so a rod that feels warm in the middle can already be unbendable where it counts. That the practical figure is under two minutes from retort to former and that everything about the layout of a bending room — where the retort is, where the bench is, who carries — exists to serve that number. That SPRINGBACK IS NOT A DEFECT, it is elastic recovery, and a bend released off the former immediately gives back a real fraction of itself, so every former in the room is cut tighter than the finished part by an amount that depends on species, thickness and radius and is discovered by ruining things. That the fix is not a better former but SETTING: the bend is held to the former in its strap and dried at the bent shape for hours or days, and drying under restraint is what makes the shape permanent, because the softened lignin re-hardens with the fibres where they now sit. That a part taken off the former too early relaxes in the stack overnight and is a different part in the morning. That SPECIES IS ARITHMETIC AND NOT PREFERENCE: beech, ash, elm and oak bend well because their fibres are long and their rays are strong, and they will take radii of two or three times the thickness, while most softwoods and most tropical hardwoods will not bend at all at any temperature and shatter in a way that looks exactly like a mistake. That GRAIN RUNOUT IS THE SINGLE MOST COMMON CAUSE OF FAILURE and it is invisible on a planed surface: a rod sawn from a board whose grain runs out at one in fifteen has a built-in tension crack waiting on the outer face, and the shop answer is to SPLIT the stock rather than saw it, because a split follows the grain and cannot lie. That KNOTS ARE ABSOLUTE and a knot anywhere on the outer face is not a risk, it is the location where the rod will fail. That the strap must be the correct width for the rod to the fraction, because a strap wider than the piece lets the outer corners squirm out from under it and a strap narrower than the piece leaves two ribbons of unrestrained wood along the edges which go into tension and split first. That a bend that is going wrong announces itself as a faint continuous crackling, and the answer is more pull and faster and not less, because hesitating lets the rod cool. And the flat arithmetic at the bench: a retort that holds twenty-eight rods, a former that makes one hoop back at a time, a set rack with room for ninety, and a rod cooling in your hands right now.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wood, the strap and the hot bright afternoon, and that register is FAST, FORCEFUL, SQUEAKY, DAMP AND SLIGHTLY VIOLENT — a rod that arrives visibly steaming and is on the former inside a count of ten; a steel strap that groans and skids against beech under load; a pull that is genuinely hard and genuinely hurried and never once graceful; the small continuous crackling of compression folds forming, which is the sound of it working and not the sound of it breaking; and every so often a hard bright report and a rod that is scrap and goes into a box under the bench without ceremony. The room is hot and wet, the window light is hard, there is sawdust standing in the air in the beam, and the bench is soaked through at the former. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the rods keep coming out of the retort whether or not anybody touches the strap. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a woodworking-video, NOT a screensaver, NOT stately, NOT reverent, NOT warm, NOT tactile-in-the-nice-sense — this is a bending bench at half past two with a rod in your hands that is getting colder.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the wood's colour is COMPUTED and never chosen. The bench is beech soaked black-green at the former from forty years of hot wet rods, a dark saturated wet-wood tone (#3d3a2b) that is genuinely glossier where it is currently wet and matte a hand's width away, going pale scuffed straw where dry sawdust has settled into the scars (#c4b184). Against that, EVERY ROD'S SURFACE COLOUR IS THE OUTPUT OF ITS OWN TEMPERATURE AND WETNESS: each rod carries a live per-element surface temperature and a live surface moisture film, and its rendered colour is computed from those two alone — a rod straight out of the retort is dark, wet, almost translucent at the edges and reads a deep hot honey (#a5663a) with a real specular sheet of water on it; forty seconds later the ends have gone matte and lighter (#c9a06d) while the middle is still dark, so the temperature gradient is genuinely visible as a colour gradient along the rod and nothing on the page says so; a cold beech rod off the rack is flat pale biscuit with visible ray fleck (#ddc9a2) and no specular at all. Compression folds on the inner face render as real fine cross-grain crinkling that catches the window light. A tension failure renders as what it is: a long pale splintered runout showing bright raw fibre against the wet surface (#e8dcc0), and it does not fade. The steel strap is scaled blue-black tool steel (#2f3338) polished to a hard bright band exactly where the rods have run over it for years (#b0b6ba), and the cast-iron former is dull grey with a rust bloom on the parts nothing rubs (#6a6560, rust #8a5a34). The window beam is a hard slab of afternoon with real standing dust in it and it moves. Exactly one chip of layout blue (#1b4f8f) — the shop's marking crayon — is held strictly for the two tick marks on each former where the strap stops are set, and the crayon stub lying at the bench edge. It never appears on a rod, on the strap, on the bench or in the beam. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest wetness specular, honest cooling gradient, honest ray fleck and honest dust in a beam.">
  <meta name="outbox-spec-wildcard" content="One of the rods in the rack is not beech. It is a length of iroko that came in with a mixed delivery years ago and was never sorted out — it is the right diameter, it is planed like everything else, and at the bench it looks like every other rod. The engine gives it exactly the properties iroko has and no others: interlocked grain, very low lignin softening response to heat, and a compressive yield that barely moves at any temperature the retort can reach. It goes into the retort on its turn, it comes out steaming on its turn, it takes the strap, it takes the pull — and about fifteen degrees into any bend it shatters, hard, in a way that is visually indistinguishable from a grain-runout failure and is not. It cannot be sorted out, marked, set aside or removed by anything the visitor can do, and it is regenerated into the rack on every visit in the same position, because the delivery it came from is still in the yard.">
  <meta name="outbox-spec-forbidden" content="NO bending-as-metaphor for anything — not flexibility, not what yields instead of breaking, not pressure making a shape, not 'the strap carries what the wood cannot', not heat-and-time changing a person; this is a migrating neutral axis and a compressive yield limit that rises as the rod cools, and it has nothing to teach anybody. ABSOLUTELY NO craftsman-sage register: no 'the old benders could tell by the sound', no trade mystique, no reverence for hand skill, no master-and-apprentice arc, no wise-elder-at-the-bench, no dying-art lament, no handmade-versus-machine sermon, no honest-materials sentiment. NO wood lyricism whatsoever: no living material, no the-tree-remembers, no grain-as-biography, no annual-rings-as-years, no warm-to-the-touch, no smell of steam or beech beyond nothing, no describing wood as breathing, wanting, resisting, forgiving, or having a will — a rod here is a stiffness that falls with temperature. NO Thonet hagiography, NO great-man design narrative, NO 'the most successful chair ever made', NO Bauhaus, NO Vienna coffeehouse imagery, NO design-history lecture, NO furniture-as-icon, NO 'you have sat in one and never noticed'. NO Poland travelogue and NO explaining Poland or Central Europe to anybody: no dialect spelling, no Polish vocabulary sprinkled for texture beyond a place name, no aren't-they-stoic, no forests-and-folk-tales, no Catholicism, no poverty pathos. ABSOLUTELY NO twentieth-century political history imported as atmosphere or subtext: no war, no occupation, no communism, no state enterprise satire, no five-year-plan joke, no bureaucratic-absurd, no committee minutes, no department-of-X, no Kafka, no Iron Curtain drift, no shortage comedy, no 1958-as-period-signifier of any kind. NO labour-dignity sermon, NO working-class-pride sentiment, NO union framing, NO thankless-work pathos, NO invisible-infrastructure essay, NO awe at how things are made. NO nostalgia, NO wistfulness, NO decline narrative, NO 'nobody bends solid wood anymore / it's all laminate now / the works closed in 1991', NO foreshadowing of anything, NO hindsight of any kind. NO retro-kitsch, NO camp, NO ironic affection for cast iron, steel straps, drying racks or shop crayon. NO physics-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, process-video, woodworking-video, maker-channel, ambient-visualiser, generative-art-gallery, chillout or screensaver framing whatsoever, and no 'watch it take the shape' — the strap squeals, the room is hot, and things break. NO danger-porn, NO injury foreshadowing, NO safety sermon, NO dread. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous framing of the iroko rod, the scrap box that only fills, or the rods that keep arriving whether or not anybody is there — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of the formers, the rack or the bench whatsoever, despite them being worn old wooden and iron objects — every one of them is live tooling and there are twenty-eight rods in the retort right now. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is half past two on a bright hot afternoon with a high window full of hard light. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding, and the word guild never appears. And beyond the wood, the strap, the former, the bench and the one blue crayon mark, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
"use strict";
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),DPR=Math.min(2,window.devicePixelRatio||1);
var W=0,H=0,C={x:0,y:0},R=100,TH=30,Rc=115,L=450,DS=1,N=240,MAXW=3.35,A0=2.62,bench=null;
var store={rack:[],scrap:0,polish:0,wet:0,hours:0,bent:0,cold:0};
try{var s=localStorage.getItem("bench.radomsko.v1");if(s){var o=JSON.parse(s);for(var k in o)if(k in store)store[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem("bench.radomsko.v1",JSON.stringify(store));}catch(e){}}
var lastSave=0;

/* ---------- seeded noise ---------- */
function rnd(seed){var x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x);}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sig(x){return 1/(1+Math.exp(-x));}
function mix3(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c,al){return"rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+(al===undefined?1:al)+")";}

/* ---------- bench surface, pre-rendered ---------- */
function makeBench(){
  var b=document.createElement("canvas");b.width=W;b.height=H;var g=b.getContext("2d");
  g.fillStyle="#7b6a49";g.fillRect(0,0,W,H);
  var pw=Math.max(70,H*0.19);
  for(var y=-pw;y<H+pw;y+=pw){
    var sh=rnd(y*0.7+3)*0.16-0.08;
    var base=[123+sh*120,106+sh*100,73+sh*70];
    g.fillStyle=rgb(base);g.fillRect(0,y,W,pw-1);
    g.fillStyle="rgba(40,34,22,0.55)";g.fillRect(0,y+pw-2,W,2);
    for(var i=0;i<420;i++){
      var rx=rnd(y*3+i*1.7)*W,ry=y+rnd(y*5+i*2.3)*pw,ln=6+rnd(i*7.7+y)*70;
      g.strokeStyle="rgba("+(58+rnd(i+y)*40|0)+","+(50+rnd(i*2+y)*34|0)+","+(32+rnd(i*3+y)*22|0)+",0.16)";
      g.lineWidth=0.7+rnd(i*11+y)*1.1;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx+ln,ry+(rnd(i*13+y)-0.5)*2.2);g.stroke();
    }
  }
  /* scars with dry sawdust standing in them */
  for(var j=0;j<140;j++){
    var x0=rnd(j*3.1)*W,y0=rnd(j*5.9)*H,a=rnd(j*7.3)*Math.PI,ln2=10+rnd(j*2.2)*90;
    g.strokeStyle="rgba(34,29,19,0.5)";g.lineWidth=1+rnd(j*9)*2.6;
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+Math.cos(a)*ln2,y0+Math.sin(a)*ln2);g.stroke();
    g.strokeStyle="rgba(196,177,132,"+(0.25+rnd(j*4)*0.4)+")";g.lineWidth=0.8+rnd(j*6)*1.3;
    g.beginPath();g.moveTo(x0+1,y0+1);g.lineTo(x0+Math.cos(a)*ln2*0.8+1,y0+Math.sin(a)*ln2*0.8+1);g.stroke();
  }
  for(var d=0;d<900;d++){
    var dx=rnd(d*1.9+11)*W,dy=rnd(d*4.4+7)*H;
    g.fillStyle="rgba(196,177,132,"+(0.05+rnd(d*3.3)*0.28)+")";
    g.fillRect(dx,dy,1+rnd(d)*1.8,0.8+rnd(d*2)*1.4);
  }
  return b;
}

/* ---------- rods ---------- */
var seedCount=0;
function makeRod(kind){
  seedCount++;var sd=seedCount*17.31+rnd(Date.now()*1e-6)*100;
  var r={kind:kind,k:new Float32Array(N),kp:new Float32Array(N),epc:new Float32Array(N),
    T:new Float32Array(N*5),w:new Float32Array(N),fail:-1,prop:0,failT:0,
    runout:0.15+rnd(sd*2.7)*0.85,runPos:0.12+rnd(sd*3.9)*0.76,
    knots:[],fleck:[],seed:sd,arrived:now,state:"hot",tail:0};
  var nk=rnd(sd*5.1)<0.42?(rnd(sd*6.2)<0.3?2:1):0;
  for(var q=0;q<nk;q++)r.knots.push({p:0.08+rnd(sd*7.3+q*3)*0.84,rad:0.03+rnd(sd*8.1+q*5)*0.05});
  for(var f=0;f<170;f++)r.fleck.push([rnd(sd+f*1.7),rnd(sd*2+f*2.3)*2-1,0.2+rnd(sd*3+f*3.1)*0.9]);
  for(var i=0;i<N;i++){for(var j=0;j<5;j++)r.T[i*5+j]=98+rnd(sd+i*0.11+j)*3;r.w[i]=1;}
  return r;
}
function softOf(r,temp){
  if(r.kind==="iroko")return 0.10+0.16*sig((temp-88)/5);
  return sig((temp-72)/10);
}
function tenLimit(r,i){
  var s=i/N,f=1;
  var d=Math.abs(s-r.runPos);if(d<0.2)f*=1-0.58*r.runout*(1-d/0.2);
  for(var q=0;q<r.knots.length;q++){var kd=Math.abs(s-r.knots[q].p);if(kd<r.knots[q].rad*2)f*=0.42+0.3*(kd/(r.knots[q].rad*2));}
  return 0.0104*f;
}
/* real strain distribution about a migrating neutral axis */
function section(kt,sfOut,sfIn,Tp){
  var M=13;
  function stress(xi,xi0){
    var e=kt*(xi-xi0);
    if(e>0)return e;
    var sf=sfIn+(sfOut-sfIn)*(xi+0.5);
    var Ec=0.6+0.4*(1-sf),sy=0.0015+0.0085*(1-sf),ey=sy/Ec,a=-e;
    return -(a<ey?Ec*a:sy+0.012*(a-ey));
  }
  function net(x0){var s=0;for(var m=0;m<M;m++){s+=stress(-0.5+(m+0.5)/M,x0)/M;}return s;}
  var lo=-1.6,hi=1.6,mid=0;
  for(var it=0;it<26;it++){mid=(lo+hi)*0.5;if(net(mid)>-Tp)lo=mid;else hi=mid;}
  mid=(lo+hi)*0.5;
  return{xi0:mid,eOut:kt*(0.5-mid),eIn:kt*(-0.5-mid)};
}

/* ---------- state ---------- */
var now=0,active=null,staged=[],nextRod=4,fetchAt=0,rodsSession=0;
var wrap=0,wrapT=0,effort=0,slackSteps=0,shutter=0.62,amb=36;
var clampP=-1,clampHold=0,yieldCount=0,slideSpeed=0,beamX=0,drips=[],steam=[],dust=[];
var pts=new Float32Array((N+1)*2),ang=new Float32Array(N+1);

function integrate(r){
  var th=A0-Math.PI/2+Math.PI, x=C.x+Rc*Math.cos(A0), y=C.y+Rc*Math.sin(A0);
  th=Math.atan2(-Math.cos(A0),Math.sin(A0));
  th=Math.atan2(-Math.cos(A0),Math.sin(A0));
  pts[0]=x;pts[1]=y;ang[0]=th;
  for(var i=0;i<N;i++){
    pts[(i+1)*2]=pts[i*2]+Math.cos(th)*DS;
    pts[(i+1)*2+1]=pts[i*2+1]+Math.sin(th)*DS;
    th+=r.k[i]*DS;ang[i+1]=th;
  }
}
function fetchRod(){
  if(!staged.length)return;
  var best=0,bt=-1;
  for(var i=0;i<staged.length;i++){var t=staged[i].T[Math.floor(N/2)*5+2];if(t>bt){bt=t;best=i;}}
  active=staged.splice(best,1)[0];wrap=0;wrapT=0;effort=0;
}
function scrapIt(){
  store.scrap++;store.bent++;active=null;fetchAt=now+1.6;save();
}
function rackIt(){
  var samp=[];for(var i=0;i<24;i++)samp.push(active.kp[Math.floor(i*N/24)]*Rc);
  var tm=active.T[Math.floor(N/2)*5],col=rodColor(tm,active.w[Math.floor(N/2)],active);
  store.rack.push({s:samp,c:[col[0]|0,col[1]|0,col[2]|0]});
  if(store.rack.length>90)store.rack.shift();
  store.bent++;active=null;fetchAt=now+1.4;save();
}
function rodColor(T,w,r){
  var a=clamp((T-30)/45,0,1),c=mix3([221,201,162],[201,160,109],a);
  var b=clamp((T-70)/30,0,1);c=mix3(c,[165,102,58],b);
  var wet=clamp(w,0,1);
  return[c[0]*(1-0.23*wet),c[1]*(1-0.25*wet),c[2]*(1-0.20*wet)];
}

/* ---------- audio ---------- */
var AC=null,master=null,nz=null,squealG=null,squealF=null,started=false;
function noiseBuf(sec){
  var b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0),last=0;
  for(var i=0;i<d.length;i++){var v=Math.random()*2-1;last=(last+0.02*v)/1.02;d[i]=v*0.55+last*3;}
  return b;
}
function startAudio(){
  if(started)return;started=true;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.5;
  var comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
  nz=noiseBuf(2.2);
  /* lineshaft and flat belt overhead */
  var o1=AC.createOscillator(),o2=AC.createOscillator(),lg=AC.createGain(),lf=AC.createBiquadFilter();
  o1.frequency.value=41.5;o2.frequency.value=62.8;o2.type="triangle";lf.type="lowpass";lf.frequency.value=180;
  lg.gain.value=0.10;o1.connect(lf);o2.connect(lf);lf.connect(lg);lg.connect(master);o1.start();o2.start();
  var belt=AC.createOscillator(),bg=AC.createGain();belt.frequency.value=2.13;bg.gain.value=0.04;
  belt.connect(bg);bg.connect(lg.gain);belt.start();
  /* hot room */
  var rs=AC.createBufferSource();rs.buffer=nz;rs.loop=true;
  var rf=AC.createBiquadFilter();rf.type="lowpass";rf.frequency.value=780;
  var rg=AC.createGain();rg.gain.value=0.045;rs.connect(rf);rf.connect(rg);rg.connect(master);rs.start();
  /* strap on wet beech */

/* ---------- step ---------- */
function coolRod(r,dt){
  var a=0.62*dt,amb2=amb;
  for(var i=0;i<N;i++){
    var s=i/N,ef=1+2.4*Math.pow(Math.abs(s-0.5)*2,3),h=(0.021+0.010*ef)*dt;
    var b=i*5,t0=r.T[b],t1=r.T[b+1],t2=r.T[b+2],t3=r.T[b+3],t4=r.T[b+4];
    r.T[b]=t0+2*a*(t1-t0)-h*(t0-amb2);
    r.T[b+1]=t1+a*(t0-2*t1+t2);
    r.T[b+2]=t2+a*(t1-2*t2+t3);
    r.T[b+3]=t3+a*(t2-2*t3+t4);
    r.T[b+4]=t4+2*a*(t3-t4)-h*(t4-amb2);
    var dry=dt*(0.0035+0.020*clamp((t0-55)/45,0,1));
    r.w[i]=Math.max(0,r.w[i]-dry);
  }
}
function step(dt){
  amb=lerp(31,42,shutter);
  store.hours+=dt/3600;
  /* retort clock */
  if(now>nextRod){
    nextRod=now+38+Math.random()*12;rodsSession++;
    var kind=(rodsSession===4)?"iroko":"beech";
    var nr=makeRod(kind);nr.tail=staged.length;staged.push(nr);
    if(AC){burst(3400,340,1.25,0.16,1.2,"lowpass");setTimeout(function(){burst(2600,900,0.045,0.22,9);},90);setTimeout(function(){burst(1800,600,0.05,0.18,9);},175);}
  }
  for(var i=staged.length-1;i>=0;i--){
    coolRod(staged[i],dt);
    if(staged[i].T[Math.floor(N/2)*5+2]<38){staged.splice(i,1);store.cold++;save();}
  }
  if(!active&&now>fetchAt)fetchRod();
  if(!active)return;
  var r=active;coolRod(r,dt);
  integrate(r);

  /* pull */
  var pull=0;
  if(keys.ArrowRight)pull=1;if(keys.ArrowLeft)pull=-1;
  if(pull>0)wrapT=clamp(wrapT+1.9*dt,0,MAXW);
  if(pull<0)wrapT=clamp(wrapT-1.9*dt,0,MAXW);
  var lead=wrapT-wrap;
  effort=lerp(effort,clamp(lead/0.24,0,1),1-Math.exp(-dt*7));
  var Tp=0.0008+0.0075*effort;

  var slack=slackSteps*(L*0.0016);
  var eSlack=slack>0?slack/Math.max(Rc*wrap,DS*7):0;

  yieldCount=0;
  if(r.fail<0&&lead>0){
    var front=Math.floor(Rc*wrap/DS);
    var ktFull=TH/Rc;
    var advMax=2.4*dt,adv=0;
    while(adv<advMax&&adv<lead&&r.fail<0){
      var idx=Math.min(N-1,Math.floor(Rc*(wrap+adv)/DS));
      var b=idx*5;
      var sfO=softOf(r,r.T[b]),sfI=softOf(r,r.T[b+4]);
      var ramp=clamp((wrap+adv)/0.55,0,1);ramp=ramp*ramp*(3-2*ramp);
      var kt=ktFull*ramp;
      var sec=section(kt,sfO,sfI,Tp);
      var eOut=sec.eOut+eSlack,eIn=Math.abs(sec.eIn);
      var fold=(r.kind==="iroko")?(0.035+0.025*sfI):(0.05+0.30*sfI);
      var lim=tenLimit(r,idx);
      if(eOut>lim||eIn>fold){
        r.fail=idx;r.failT=now;r.prop=0;
        if(AC){burst(6200,700,0.055,0.95,2.4);burst(1400,260,0.18,0.35,3);}
        break;
      }
      var stress=0.0015+0.0085*(1-sfI);
      var advf=clamp(Tp/(stress*1.05),0,1);advf=Math.pow(advf,0.8);
      var stepv=Math.min(0.012,advMax*advf*0.35+0.0006);
      r.k[idx]=-kt/1;r.k[idx]=-(1/Rc)*ramp;
      var newEp=eIn;
      if(newEp>r.epc[idx]+0.0004){r.epc[idx]=newEp;yieldCount++;}
      adv+=stepv;
      if(advf<0.05)break;
    }
    wrap=clamp(wrap+adv,0,MAXW);
    slideSpeed=lerp(slideSpeed,adv/Math.max(dt,0.001)*0.42,0.25);
  }else{
    slideSpeed=lerp(slideSpeed,0,0.12);
  }
  /* release + springback */
  if(lead<-0.001){
    var back=Math.min(-lead,3.0*dt);wrap=clamp(wrap-back,0,MAXW);
    var f2=Math.floor(Rc*wrap/DS);
    for(var q=Math.max(0,f2);q<N;q++){
      var loc=q/N,cl=(clampP>=0&&Math.abs(loc-clampP)<0.05)?1:0;
      if(!cl)r.k[q]=r.kp[q];
    }
  }
  /* set under restraint */
  var fro=Math.floor(Rc*wrap/DS);
  for(var m=0;m<Math.min(fro,N);m++){
    var lo2=m/N,cl2=(clampP>=0&&Math.abs(lo2-clampP)<0.05)?3.2:0;
    var tt=r.T[m*5+2];
    var dryness=clamp(1-r.w[m],0,1)*0.6+clamp((70-tt)/45,0,1)*0.4;
    var rate=(0.019+0.028*dryness)*(1+cl2);
    r.kp[m]+=(r.k[m]-r.kp[m])*clamp(rate*dt,0,1);
  }
  /* rupture propagation along the grain */
  if(r.fail>=0){
    r.prop=Math.min(1,r.prop+dt*1.5);
    if(r.prop>=1&&now-r.failT>2.4)scrapIt();
  }
  /* drips off the wet rod */
  var wm=r.w[Math.floor(N*0.5)];
  if(wm>0.25&&Math.random()<dt*wm*7){
    var di=Math.floor(Math.random()*fro||Math.random()*N);
    drips.push({x:pts[di*2]+(Math.random()-0.5)*TH,y:pts[di*2+1]+(Math.random()-0.5)*TH,t:0});
    if(AC&&Math.random()<0.5)plink(700+Math.random()*500,0.07,0.06);
    store.wet=Math.min(1,store.wet+0.0012);
  }
  if(wm>0.3&&Math.random()<dt*10){
    var si=Math.floor(Math.random()*N);
    steam.push({x:pts[si*2],y:pts[si*2+1],t:0,vx:(Math.random()-0.5)*8,vy:-10-Math.random()*14});
  }
  store.polish=Math.min(1,store.polish+slideSpeed*dt*0.0016);
}

/* ---------- audio per frame ---------- */
function audioFrame(dt){
  if(!AC)return;
  var n=Math.min(7,yieldCount);
  for(var i=0;i<n;i++){
    if(Math.random()<0.75)burst(1700+Math.random()*3000,900+Math.random()*900,0.009+Math.random()*0.008,0.055+Math.random()*0.05,11);
  }
  var wet=active?active.w[Math.floor(N/2)]:0;
  var sv=clamp(slideSpeed/60,0,1);
  squealF.frequency.value=780+2600*sv+Math.sin(now*11)*90;
  squealG.gain.value=sv*(0.22+0.78*(1-wet))*0.10;
  if(active&&active.fail>=0&&active.prop<1&&Math.random()<0.5)
    burst(900+active.prop*1400,300,0.03,0.22,5);
  if(now-lastBench>7+Math.random()*13){lastBench=now;burst(420,120,0.10,0.16,2.2,"lowpass");}
}

/* ---------- draw ---------- */
function drawFormer(){

function drawRod(r,alive){
  var i,b,col;
  ctx.lineJoin="round";
  for(i=0;i<N-3;i+=3){
    var x0=pts[i*2],y0=pts[i*2+1],x1=pts[(i+3)*2],y1=pts[(i+3)*2+1];
    var tx=x1-x0,ty=y1-y0,ln=Math.hypot(tx,ty)||1;tx/=ln;ty/=ln;
    var nx=-ty,ny=tx,h=TH/2;

    }

        ctx.strokeStyle="rgba(58,44,28,0.5)";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x0-nx*h*0.96,y0-ny*h*0.96);ctx.lineTo(x0-nx*h*0.18,y0-ny*h*0.18);ctx.stroke();
        ctx.strokeStyle="rgba(232,220,190,0.22)";
        ctx.beginPath();ctx.moveTo(x0-nx*h*0.92+1,y0-ny*h*0.92);ctx.lineTo(x0-nx*h*0.24+1,y0-ny*h*0.24);ctx.stroke();
      }
    }
  }

    var s=r.fleck[f][0],ii=Math.min(N-2,Math.floor(s*N)),tT=r.T[ii*5];

function drawRacks(){
  /* cold rack, left margin */

  for(var i=0;i<n;i++){
    var y=H*0.20+i*(TH*0.52);

    ctx.fillRect(mx-TH*0.5,y,TH*0.9,TH*0.38);
    ctx.fillStyle="rgba(120,104,72,0.35)";ctx.fillRect(mx-TH*0.5,y+TH*0.30,TH*0.9,TH*0.08);
  }
  /* drying rack, right margin: set shapes, restrained and permanent */
  var rx=W-W*0.055,base=H*0.16;

  for(var s2=0;s2<shown.length;s2++){
    var sh=shown[s2],sc=(R*0.30)/Math.max(1,Rc*0.30);
    var px=rx,py=base+s2*(H*0.62/Math.max(12,shown.length)),th=-0.5;

      ctx.lineTo(cx,cy);
    }
    ctx.strokeStyle="rgba("+sh.c[0]+","+sh.c[1]+","+sh.c[2]+",0.92)";
    ctx.lineWidth=Math.max(2,TH*0.26);ctx.stroke();
  }
  /* the box under the bench */
  var bx=W*0.03,by=H-Math.min(120,H*0.20),bw=Math.min(130,W*0.26),bh=Math.min(92,H*0.15);
  ctx.fillStyle="rgba(28,24,17,0.86)";ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle="rgba(70,60,40,0.8)";ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  var sn=Math.min(34,store.scrap);
  for(var k2=0;k2<sn;k2++){
    var a=rnd(k2*3.7)*Math.PI,ln=bw*0.18+rnd(k2*2.1)*bw*0.32;
    var sx=bx+bw*0.10+rnd(k2*5.3)*bw*0.75,sy=by+bh*0.14+rnd(k2*7.9)*bh*0.7;
    ctx.strokeStyle="rgba("+(200-rnd(k2)*40|0)+","+(180-rnd(k2*2)*40|0)+","+(145-rnd(k2*3)*35|0)+",0.8)";
    ctx.lineWidth=2+rnd(k2*4)*2.4;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*ln,sy+Math.sin(a)*ln);ctx.stroke();
    ctx.strokeStyle="rgba(232,220,192,0.55)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a+0.12)*ln*0.6,sy+Math.sin(a+0.12)*ln*0.6);ctx.stroke();
  }
  /* crayon stub at the bench edge */
  var cxp=W*0.045-6,cyp=H-Math.min(40,H*0.062);
  ctx.save();ctx.translate(cxp,cyp);ctx.rotate(0.24);
  ctx.fillStyle="#1b4f8f";ctx.fillRect(0,0,34,9);
  ctx.fillStyle="rgba(10,30,60,0.55)";ctx.fillRect(0,6,34,3);
  ctx.fillStyle="#12386a";ctx.beginPath();ctx.moveTo(34,0);ctx.lineTo(42,4.5);ctx.lineTo(34,9);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawStaged(){
  for(var i=0;i<staged.length;i++){
    var r=staged[i],y=H*0.055+i*(TH*0.9),x0=W*0.22,x1=W*0.22+L*0.42;
    var mid=Math.floor(N/2),col=rodColor(r.T[mid*5],r.w[mid],r),ce=rodColor(r.T[5],r.w[0],r);
    var g=ctx.createLinearGradient(x0,y,x1,y);
    g.addColorStop(0,rgb(ce));g.addColorStop(0.5,rgb(col));g.addColorStop(1,rgb(ce));
    ctx.fillStyle=g;ctx.fillRect(x0,y,x1-x0,TH*0.62);
    if(r.w[mid]>0.2){
      ctx.fillStyle="rgba(244,232,206,"+(r.w[mid]*0.22)+")";ctx.fillRect(x0,y+TH*0.08,x1-x0,TH*0.12);
    }
    if(r.T[mid*5]>72&&Math.random()<0.25)steam.push({x:x0+Math.random()*(x1-x0),y:y,t:0,vx:(Math.random()-0.5)*6,vy:-8-Math.random()*10});
  }
}
function drawBeam(dt){
  var per=900,ph=((Date.now()/1000)%per)/per;
  beamX=W*0.06+ph*W*0.55;
  var wdt=Math.max(90,W*0.20),sk=H*0.42,al=0.05+shutter*0.14;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle="rgba(255,236,196,"+al+")";
  ctx.beginPath();
  ctx.moveTo(beamX,0);ctx.lineTo(beamX+wdt,0);
  ctx.lineTo(beamX+wdt+sk,H);ctx.lineTo(beamX+sk,H);ctx.closePath();ctx.fill();
  for(var i=0;i<dust.length;i++){
    var d=dust[i];
    d[0]+=d[2]*dt;d[1]+=d[3]*dt;
    if(d[1]<-10){d[1]=H+10;d[0]=Math.random()*W;}
    if(d[0]<-10)d[0]=W+10;if(d[0]>W+10)d[0]=-10;
    var rel=(d[0]-(beamX+ (d[1]/H)*sk));
    if(rel>0&&rel<wdt){
      ctx.fillStyle="rgba(255,244,214,"+(0.18+d[4]*0.55)*(0.3+shutter*0.7)+")";
      ctx.fillRect(d[0],d[1],1.2+d[4]*1.6,1.2+d[4]*1.4);
    }
  }
  ctx.restore();
}
function drawWet(){
  var wr=R*(1.25+store.wet*0.9);
  ctx.save();
  ctx.globalCompositeOperation="multiply";
  var g=ctx.createRadialGradient(C.x,C.y,R*0.5,C.x,C.y,wr);
  g.addColorStop(0,"rgba(61,58,43,0.95)");g.addColorStop(0.7,"rgba(80,74,56,0.85)");g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(C.x,C.y,wr,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(var i=0;i<18;i++){
    var a=rnd(i*4.1)*Math.PI*2,rr=R*(0.7+rnd(i*2.3)*0.9);
    ctx.fillStyle="rgba(210,196,160,0.055)";
    ctx.beginPath();ctx.ellipse(C.x+Math.cos(a)*rr,C.y+Math.sin(a)*rr,R*0.09,R*0.04,a,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawFx(dt){
  for(var i=drips.length-1;i>=0;i--){
    var d=drips[i];d.t+=dt;
    ctx.fillStyle="rgba(46,42,30,"+clamp(0.5-d.t*0.5,0,0.5)+")";
    ctx.beginPath();ctx.ellipse(d.x,d.y+d.t*22,2+d.t*5,1.4+d.t*3.5,0,0,Math.PI*2);ctx.fill();
    if(d.t>1.1)drips.splice(i,1);
  }
  for(var j=steam.length-1;j>=0;j--){
    var s=steam[j];s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    ctx.strokeStyle="rgba(228,222,206,"+clamp(0.20-s.t*0.20,0,0.2)+")";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+s.vx*0.06,s.y+s.vy*0.06);ctx.stroke();
    if(s.t>1)steam.splice(j,1);
  }
}

/* ---------- loop ---------- */
var last=performance.now()/1000;
function frame(){
  var t=performance.now()/1000,dt=Math.min(0.05,t-last);last=t;now=t;
  step(dt);audioFrame(dt);
  ctx.drawImage(bench,0,0,W,H);
  drawWet();
  drawFormer();
  drawRacks();
  drawStaged();
  if(active){integrate(active);drawRod(active,true);drawStrap(active);
    if(clampP>=0){
      var ci=Math.min(N-1,Math.floor(clampP*N));
      ctx.fillStyle="rgba(24,20,14,0.42)";
      ctx.beginPath();ctx.arc(pts[ci*2],pts[ci*2+1],TH*0.62,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(240,232,210,0.22)";ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(pts[ci*2],pts[ci*2+1],TH*0.62,0,Math.PI*2);ctx.stroke();
    }
  }
  drawFx(dt);
  drawBeam(dt);
  if(t-lastSave>5){lastSave=t;save();}
  requestAnimationFrame(frame);
}
/* first rod is already at the bench */
staged.push(makeRod("beech"));rodsSession=1;nextRod=6;
requestAnimationFrame(frame);
window.addEventListener("beforeunload",save);
})();
</script>
