  <meta name="outbox-spec-era" content="1905 — the pearl-button boom on the upper Mississippi, taken from inside a one-room cutting shop built on piles over the mud at the foot of Cedar Street in Muscatine, Iowa, and not from inside a factory. A hundredweight of Sand Creek shell has been soaking in a tub since morning to soften the periostracum, the treadle lathe is running, the crown saw is water-cooled off a can with a nail hole in it, and the buyer's wagon comes at four and pays by the gross of blanks and not by the pound of shell. This month's shell is running thin, which means the big lines will not come out of it, which is a costing problem and not a mood.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is one solid block of set text — edge to edge, no header, no menu, no title, no scrollbar, no site furniture of any kind — and that block of text is being CUT INTO BUTTONS. Every few seconds a circular saw descends somewhere on the page, cuts a real disc out of the type, and the disc DROPS: it falls with weight, tumbles, and lands in a growing heap along the bottom inch of the frame, carrying away with it every character whose centre lay inside the circle. Where it was, there is a clean round hole with nothing behind it. The text does not reflow, does not reset, does not scroll and never regrows — it is a fixed sheet with an increasing number of holes in it, and it becomes progressively harder to read for the rest of the visit and for every visit afterward. The visitor's entire vocabulary is two hands on the work: DRAG the saw anywhere over the sheet to aim the next cut, which means you choose which words survive and which words become buttons, and NESTING IS REAL — a cut placed tight against an existing hole yields a clean blank, a cut that overlaps one yields a broken blank that shatters as it falls and takes the letters with it anyway; and PRESS any disc in the heap at the bottom to pick it up and read it, three or four characters of a sentence that is no longer on the page. Discs can be set back down but never back in.">
  <meta name="outbox-spec-subject" content="The flat arithmetic of cutting pearl-button blanks out of freshwater mussel shell, and specifically that a shell is not a quantity of material, it is a curved sheet of variable thickness with almost none of it usable — that the cutter is paid by the gross of blanks and the shell is bought by the ton, so the entire trade is a nesting problem and about four-fifths of every shell goes off the bench as grit and waste no matter how good anybody is; that button size is measured in LIGNES, one ligne being one-fortieth of an inch, so a 16-line blank is two-fifths of an inch across and an 18-line is a hair under half, and the jump from 16 to 18 raises the area of every blank by a quarter, which is exactly why a thin run of shell prices out at a smaller line and there is no arguing with the shell; that the crown saw is a toothed steel tube and it does not cut a disc, it cuts an ANNULUS — the kerf itself is destroyed material, so two blanks cut a saw's width apart cost you a saw's width of shell between them forever, and the whole craft is putting the next cut as close to the last hole as the tube will physically sit without the teeth riding into the void and grabbing; that a blank must come out of a region where the shell is thick enough to finish, because the blank goes on to be ground, faced, drilled and polished and loses real thickness at every step, so a blank cut from the thin edge of a shell is not a cheap button, it is nothing at all and is paid for by nobody; that the hinge and the beak of a mussel are the thickest part and also the hardest and dirtiest, and the middle of the valve is the good nacre and is also where the shell is thinnest, which is the permanent tension of the job; that a shell must be soaked until it is soft or the saw chips the nacre and the blank grades down two steps for a fault the size of a pinhead; that water is not optional and is not for the shell, it is for the saw — a dry tube burns its teeth in under a minute and a burnt tube cuts oversize and out of round for the rest of its life; that species matters more than anything anybody at the bench decides, because a niggerhead runs thick and even and a washboard runs heavy and ridged and a paper-shell runs beautiful and useless, and the buyer's price per ton is really a price per predicted blank; that grading happens after cutting and not before, on colour, on evenness of nacre and on the presence of any blister, worm scar or mud line running through the face, and a single dark line across a blank drops it out of the button trade entirely; that the blister is a real risk to the SAW and not a bonus, since a hard lump inside the shell will snatch the tube and can throw a shell across the bench; that the beds are worked with a crowfoot bar dragged over the bottom, that a bar takes what it takes and cannot select, and that the shell arriving in this tub was on the river bottom a week ago; and the flat arithmetic on the bench today, which is a hundredweight of thin Sand Creek shell, a target of eleven gross of 16-line by four o'clock, a rate paid on clean blanks only, and a saw tube that has already been dressed once this week.">
  <meta name="outbox-spec-tone" content="The loud, sincere, entirely un-ironic voice of a small-city booster paragraph read aloud — Emmett Ludlage, forty-six, secretary of the Muscatine Commercial Club, who bought shell on the Cedar for eleven years before he ever wrote a sentence of civic praise and who therefore cannot get through a boast without putting a figure in it. The text on the page is his: exclamatory, generous, addressed to a Prospective Manufacturer and to the visiting Merchant, in full ringing 1905 promotional construction — 'Consider, sir, what is done here', 'We invite comparison', 'The gentleman who supposes' — and every third clause collapses without warning into flat trade arithmetic about kerf widths, lignes, soak times and price per ton, which he clearly finds just as stirring. He praises the water works and the electric plant once each. He is specifically and repeatedly proud of exactly one thing and returns to it three times: that the waste, four-fifths of every shell, is ground and sold and not thrown in the river, and he gives the tonnage. He names two firms and one man by name and gets one of the spellings wrong. He addresses the reader directly and warmly throughout and never once suspects that the sentences are being cut out from under him. Never wry, never deadpan, never wistful, never a huckster, never a craftsman-sage, never lowercase, never fragmentary — this is a full-throated printed paragraph and it means every word.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The sheet is cut mussel shell seen face-on: the ground is the outer valve surface, a chalky dry grey-buff (#cfc7b2) going warmer and dirtier along the hinge edge at the left of frame (#a89madjust) — corrected: warmer and dirtier along the hinge edge at the left of frame (#a89670) and streaked with real mud lines and worm scarring that run under the type and genuinely reduce legibility where they cross it. Wherever the saw has broken through, the exposed nacre face reads as a cool, dense, slightly blue-grey white (#e6ecee) with a computed directional sheen: each cut face carries a real surface-normal and a real layer-count, so the sheen brightens and dulls as the sheet's angle to the bench lamp changes and is never a chosen colour or a painted gradient. Type is a starved job-shop black-brown (#241f1a), solid and slightly bloomed in the display lines of the booster paragraph and broken, grey and thin in the small trade figures (#5d554a), with honest ink starvation over the raised grain of the shell so some words are already half gone before anything is cut. Discs in the heap along the bottom render at their true thickness with a visible sawn edge showing the shell's layering as fine stacked bands (#b8b0a0). Exactly one chip of shell-buyer's blue chalk (#2f5c8a) is held strictly for the grade marks scratched on discs in the heap, the ligne figure, and the word BROKE — it never appears in the printed text and never on the uncut sheet. Flat, hard, high contrast, no glow, no bloom, no soft focus, no rainbow film, no gradients other than honest nacre sheen, honest ink starvation and honest sawn edge.">
  <meta name="outbox-spec-wildcard" content="No punch ever takes a mark of punctuation. Every comma, period, semicolon, colon, exclamation point and hyphen that falls inside a cut circle simply stays behind — left standing in the middle of the empty hole where the shell used to be, in mid-air, at its exact original position, for the rest of the visit and every visit afterward. They accumulate. By late in a sheet's life the holes are full of floating punctuation with no words anywhere near it, and a run of three cuts through a long clause leaves a line of orphaned commas hanging across the page. Nothing on the page accounts for this, Ludlage never mentions it, and the punctuation cannot be picked up, cut, moved or removed by anything the visitor can do.">
  <meta name="outbox-spec-forbidden" content="NO buttons as metaphor for anything — not small things, not fastening, not what holds a life together, not the button jar, not grandmother's sewing tin, not thrift-store sentiment; a blank here is a 16-line disc of nacre with a grade on it and it has nothing to teach anybody. ABSOLUTELY NO pearl or nacre lyricism: no iridescence writing, no rainbow, no opal, no moonlight-on-water, no 'the shell held a whole river inside it', no beauty-from-mud reverie, no hidden-treasure framing, no pearls-as-luck, no sensuous material writing about shell beyond thickness, hardness, grade, sheen and kerf. NO Mississippi River Americana whatsoever: no Twain, no steamboats, no roustabouts, no big-muddy lyricism, no levee, no showboat, no riverboat gambler, no folk-song register, no explaining the Midwest to anybody, no heartland warmth, no Norman Rockwell. NO vanished-industry lament, NO 'the beds were fished out by 1930', NO 'plastic killed it', NO 'the last of the cutting shops', NO deindustrialisation narrative, NO nostalgia, NO wistfulness — the wagon comes at four and there are eleven gross to make. NO conservation sermon and NO ecological elegy about the mussel beds: the crowfoot bar is described as a tool with a yield, once, flatly, and dropped. NO child-labour sermon, NO labour-dignity sentiment, NO union framing, NO immigrant-sacrifice arc, NO poverty pathos, NO aren't-they-hardworking condescension. NO craftsman-sage register, NO 'the old cutters could hear a thin shell', NO trade mystique, NO reverence for hand skill, NO handmade-versus-machine sermon. NO Gilded Age or Progressive Era political framing, NO robber barons, NO tycoon story, NO invention-of-an-industry origin tale, NO John Boepple biography, NO great-man narrative. NO camp, NO retro-kitsch, NO ironic winking at 1905 advertising or booster prose — Ludlage is sincere and the page must let him be sincere without a nudge. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, cutting-video, ambient-visualiser, generative-art-gallery or screensaver framing of the punching whatsoever. NO erasure-poetry framing, NO 'what remains speaks louder', NO redaction, NO censorship allegory, NO found-poem preciousness about the surviving words, NO commentary anywhere on the page about the fact that the text is disappearing. NO cryptic-SCP, liminal, backrooms, uncanny, analog-horror or ominous dread about the holes, the floating punctuation, or a page that can never be made whole — nothing here is wrong. NO archival / museum / cabinet / drawer / specimen / collection / relic framing — this shell was on the river bottom last week and is wet on the bench this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is a hot bright afternoon with the door open onto the water. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding, despite the Commercial Club being named — it is named once as Ludlage's job and is never a setting, a membership, or a tradition.">

  .lead{font-weight:bold;color:#241f1a;}
  .fig{color:#5d554a;}
  #footlink{position:fixed;right:6px;bottom:2px;font-size:10px;font-family:Georgia,serif;color:#6b6355;z-index:40;letter-spacing:.02em;}

<body>
<div id="stage">
  <canvas id="back"></canvas>
  <div id="sheet"></div>
  <canvas id="fore"></canvas>
</div>
<div id="hint"></div>
<div id="footlink"><a href="/archive">the rest of the week's work</a></div>
<!-- Ludlage spells Kloepping with two p's on the shipping tags too. Nobody has told him. -->
<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
   COPY — E. Ludlage, Sec'y, Muscatine Commercial Club, June 1905
 * ------------------------------------------------------------------ */
var BLOCKS = [
 {c:"lead", t:"CONSIDER, SIR, WHAT IS DONE HERE."},
 {c:"body", t:"To the Prospective Manufacturer, and to the visiting Merchant who has come up from Davenport on the morning train and finds our streets smelling frankly of the tub: you are welcome, you are heartily welcome, and I ask only that you walk down Cedar to the water and look in at any door. "},
 {c:"body", t:"There are in this city forty-three cutting shops and eleven finishing houses, and in the shop where I am standing this afternoon there is one man, one treadle lathe, one crown saw and a hundredweight of Sand Creek shell that came off the bar a week ago Tuesday. "},
 {c:"fig",  t:"The shell has been in the tub since seven. It must soak until the outer skin gives under the thumb. Cut it dry and the saw chips the nacre and the blank grades down two steps for a fault you could cover with a pin head. There is no argument to be had with a dry shell. "},
 {c:"body", t:"We invite comparison. We invite it with any town on any river anywhere, and we invite it on the figures. "},
 {c:"fig",  t:"A button is measured in lignes, one ligne being one-fortieth of an inch. A 16-line blank is two-fifths of an inch across; an 18-line is a hair under half. The step from 16 to 18 raises the area of every blank by a full quarter, which is why a thin run of shell prices out at the smaller line, and prices out there whether the cutter likes it or no. This month's Sand Creek is running thin. The big lines will not come out of it. That is a costing matter and it is settled before a wheel turns. "},
 {c:"body", t:"THE GENTLEMAN WHO SUPPOSES that a shell is so much material, to be weighed and divided, has never had one in his hand. It is not material. It is a curved sheet of variable thickness, and almost none of it is usable. "},
 {c:"body", t:"The cutter is paid by the gross of clean blanks. The shell is bought by the ton. Between those two facts lies the entire trade, and the entire trade is a nesting problem. "},
 {c:"fig",  t:"The crown saw is a toothed steel tube. Mark this well, sir: it does not cut a disc. It cuts an annulus. The kerf itself is shell destroyed and gone, so two blanks cut a saw's width apart have cost you a saw's width of shell between them forever and ever. The whole of the craft is setting the next cut as close to the last hole as the tube will physically sit without the teeth riding into the void — and when they ride into the void the tube grabs, and the blank comes away broke, and you are paid nothing at all for it. "},
 {c:"body", t:"NOW ATTEND TO THIS, for it is the thing I am proudest of and I shall say it three times before you leave. "},
 {c:"body", t:"Four-fifths of every shell goes off the bench as grit and chip and waste. Four-fifths! No man's skill alters it. And not one pound of it goes in the river. "},
 {c:"fig",  t:"It is barrelled, hauled up Second, ground fine, and sold: last year eleven hundred and forty tons of it out of this city for poultry grit and for lime, at four dollars and sixty cents the ton delivered. Eleven hundred and forty tons that other towns would have shovelled off the end of a dock. "},
 {c:"body", t:"That is Muscatine, sir. That is what I mean when I say Muscatine. "},
 {c:"fig",  t:"Water is not for the shell. Water is for the saw. The can hangs over the tube with a nail hole punched in the bottom and it drips the whole while it is cutting. Let it run dry and the tube burns its teeth in under one minute, and a burnt tube cuts oversize and out of round for the remainder of its natural life. This tube has been dressed once already this week. "},
 {c:"body", t:"WE INVITE COMPARISON, I say again, and gladly. Our water works pump two million gallons the day and have never yet failed a hydrant. Our electric plant lights the Second Street houses to eleven at night and the cutting shops besides. "},
 {c:"fig",  t:"A blank must come out of a region where the shell is thick enough to finish. It goes on to be ground, faced, drilled and polished, and it loses real thickness at every one of those four steps. A blank cut off the thin edge of a valve is not a cheap button. It is nothing whatever, and nobody pays for it. "},
 {c:"body", t:"Here is the permanent tension of the work, and I set it down plainly for the Prospective Manufacturer: "},
 {c:"fig",  t:"The hinge and the beak are the thickest part of the shell and also the hardest and the dirtiest. The middle of the valve is the good nacre and is also where the shell is worn thinnest. Thick where it is bad; good where it is thin. Every cutter on this street works in the narrow ground between those two sentences. "},
 {c:"body", t:"THE SPECIES DECIDES MORE than any man at the bench decides. A niggerhead runs thick and even. A washboard runs heavy and ridged and will fight the tube. A paper-shell runs beautiful and useless and I would not give you sixty cents a ton for a barge of it. The buyer's price the ton is not a price for weight at all; it is a price for predicted blanks, and Mr. Ansel Roup, who buys for the Barnhart & Deele house at the foot of Iowa Avenue, has been predicting them here nine years and is seldom out by a gross. "},
 {c:"body", t:"Grading is done after the cutting and never before. "},
 {c:"fig",  t:"On colour. On evenness of the nacre. On the presence of any blister, worm scar or mud line running through the face. A single dark line across a blank drops it clean out of the button trade, and I have seen a hundred and forty gross go by on that one rule in an afternoon at Kloepping & Sons and no one grumble, because the rule is the rule. "},
 {c:"body", t:"And do not, sir, call a blister a piece of luck. "},
 {c:"fig",  t:"A blister is a hard lump inside the shell and it is a hazard to the saw. It will snatch the tube and throw the whole valve across the bench and into the wall, and I have the mark on the boards to show you. "},
 {c:"body", t:"The beds are worked with a crowfoot bar dragged over the bottom. A bar takes what it takes and cannot select. The tub yonder was on the river bottom seven days ago and is on this bench today. "},
 {c:"body", t:"AND THE WASTE — the second time of asking, and I do not apologise for it — the four-fifths, is ground and sold and not thrown in the river. Eleven hundred and forty tons. Write it in your book. "},
 {c:"body", t:"Now the arithmetic of this bench, this afternoon, which I give you because a boast without a figure in it is only noise: "},
 {c:"fig",  t:"One hundredweight of thin Sand Creek shell. Target, eleven gross of 16-line before the buyer's wagon comes at four. Rate paid on clean blanks only, with the broke and the off-grade deducted at the tally. One tube, dressed once this week, and running a shade oversize already. "},
 {c:"body", t:"The wagon comes at four. It comes at four whether the shell is thick or thin, and the tally is the tally, and I would not have it otherwise, and neither would any man on Cedar Street. "},
 {c:"body", t:"COME AND SEE US, sir. Come in June when the door is open onto the water and the treadles are all going at once and you can hear them from the bridge. Ask for me at the Commercial Club rooms over the Merchants' Bank; my name is Emmett Ludlage and I bought shell on the Cedar eleven years before ever I wrote a line of praise for this city. "},
 {c:"body", t:"And the waste is ground and sold and not thrown in the river. Eleven hundred and forty tons. That is the third time, and it is the last, and it is true. "}
];

/* ------------------------------------------------------------------ *
   LAYOUT / GLYPH FIELD
 * ------------------------------------------------------------------ */
var stage=document.getElementById('stage'),
    sheetEl=document.getElementById('sheet'),
    backC=document.getElementById('back'), backX=backC.getContext('2d'),
    foreC=document.getElementById('fore'), foreX=foreC.getContext('2d');

var W=0,H=0,DPR=1;
var glyphs=[];      // {ch,x,y,w,h,cx,cy,cls,el,alive,punct}
var cuts=[];        // {x,y,r,kerf}
var heap=[];        // discs
var wear=0, water=1, ligne=16, sawX=0, sawY=0, dragging=false;
var grossClean=0, deducted=0, blankCount=0;
var falling=[], shards=[], splitters=[];
var SAVEKEY='cedar-street-shop-v1';

var PUNCT=".,;:!?-—'\"()&";

function isPunct(ch){ return PUNCT.indexOf(ch)>=0; }

/* thickness field: thick hinge band at left, thin worn middle, ridging */
function thickness(x,y){
  var u=x/Math.max(W,1), v=y/Math.max(H,1);
  var hinge=Math.exp(-Math.pow(u/0.20,2))*1.35;           // thick left edge
  var mid=1.0-0.72*Math.exp(-Math.pow((u-0.55)/0.30,2));  // thin middle
  var ridge=0.13*Math.sin(u*23.0+v*3.1)+0.07*Math.sin(v*17.0+u*5.0);
  var taper=1.0-0.30*Math.pow(Math.max(0,u-0.72)/0.28,1.6); // thin right margin
  var t=(0.55+hinge)*mid*taper+ridge;
  return Math.max(0.02,Math.min(2.2,t));
}
/* mud lines and worm scarring — a scalar 0..1 of dirt */
function dirt(x,y){
  var d=0;
  d+=Math.max(0,0.9-Math.abs(Math.sin(x*0.011+y*0.0042)*1.7+Math.sin(y*0.019)*0.6))*0.7;
  d+=Math.max(0,0.75-Math.abs(Math.sin(x*0.006-y*0.013)*2.2))*0.55;
  d+=Math.max(0,0.55-Math.abs(Math.sin((x+y)*0.031)))*0.30;
  var u=x/Math.max(W,1);
  d+= (1-Math.min(1,u/0.22))*0.35;   // dirtier along hinge edge
  return Math.min(1,d);
}
function nacre(x,y){
  var t=thickness(x,y);
  var n=0.55+0.45*Math.sin(x*0.0091+y*0.0067)*0.5+0.30*t*0.5;
  return Math.max(0,Math.min(1,n*(1-dirt(x,y)*0.55)));
}

/* ------------------------------------------------------------------ *
   BUILD THE SHEET
 * ------------------------------------------------------------------ */
function buildSheet(){
  sheetEl.innerHTML='';
  glyphs=[];
  var pad=6;
  var fs = W<520 ? 10.5 : (W<820 ? 12 : 13.5);
  var lh = fs*1.30;
  var maxW = W-pad*2;

  // measure with a canvas
  var mX=document.createElement('canvas').getContext('2d');
  var fontBody=fs+'px Georgia, "Times New Roman", serif';
  var fontLead='bold '+fs+'px Georgia, "Times New Roman", serif';
  var fontFig=(fs-0.5)+'px Georgia, "Times New Roman", serif';

  var x=pad, y=pad;
  var frag=document.createDocumentFragment();

  for(var b=0;b<BLOCKS.length;b++){
    var blk=BLOCKS[b];
    var font = blk.c==='lead'?fontLead:(blk.c==='fig'?fontFig:fontBody);
    mX.font=font;
    var words=blk.t.split(/(\s+)/);
    for(var wi=0;wi<words.length;wi++){
      var word=words[wi];
      if(word===''||/^\s+$/.test(word)){
        if(x>pad){ x+=mX.measureText(' ').width; }
        continue;
      }
      var ww=mX.measureText(word).width;
      if(x+ww>maxW){ x=pad; y+=lh; }
      if(y>H-38) { b=BLOCKS.length; break; }
      for(var ci=0;ci<word.length;ci++){
        var ch=word[ci];
        var cw=mX.measureText(ch).width;
        var el=document.createElement('span');
        el.textContent=ch;
        el.style.left=x+'px';
        el.style.top=y+'px';
        el.style.font=font;
        var dv=dirt(x+cw/2,y+lh*0.55);
        var base = blk.c==='fig' ? [93,85,74] : [36,31,26];
        // honest ink starvation over raised grain
        var starve = 0.30+0.70*Math.abs(Math.sin(x*0.13+y*0.09)*Math.sin(y*0.21));
        var a = Math.max(0.16, Math.min(1, (blk.c==='fig'?0.80:0.98) * (0.55+0.55*starve) - dv*0.42));
        el.style.color='rgba('+base[0]+','+base[1]+','+base[2]+','+a.toFixed(3)+')';
        frag.appendChild(el);
        glyphs.push({ch:ch,x:x,y:y,w:cw,h:lh,cx:x+cw/2,cy:y+lh*0.56,el:el,alive:true,punct:isPunct(ch)});
        x+=cw;
      }
    }
    x=pad; y+=lh*1.28;
    if(y>H-38) break;
  }
  sheetEl.appendChild(frag);
}

/* ------------------------------------------------------------------ *
   SIZING
 * ------------------------------------------------------------------ */
function resize(){
  W=stage.clientWidth; H=stage.clientHeight; DPR=Math.min(2,window.devicePixelRatio||1);
  [backC,foreC].forEach(function(c){
    c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
    c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  });
  buildSheet();
  applyCutsToGlyphs();
  paintBack();
}

/* ------------------------------------------------------------------ *
   PERSISTENCE
 * ------------------------------------------------------------------ */
function save(){
  try{
    localStorage.setItem(SAVEKEY, JSON.stringify({
      cuts:cuts.map(function(c){return [Math.round(c.x*1000)/1000,Math.round(c.y*1000)/1000,Math.round(c.r*100)/100,Math.round(c.kerf*100)/100,c.rel?1:0,c.nx||0,c.ny||0];}),
      heap:heap.map(function(d){return [Math.round(d.x*1000)/1000,d.hy,Math.round(d.r*10)/10,d.grade,d.txt,d.rot,d.th,d.lg];}),
      wear:Math.round(wear*1000)/1000, water:Math.round(water*100)/100,
      gc:grossClean, dd:deducted, bc:blankCount, ligne:ligne, wsz:[W,H]
    }));
  }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(SAVEKEY); if(!raw) return;
    var d=JSON.parse(raw);
    (d.cuts||[]).forEach(function(c){ cuts.push({x:c[0],y:c[1],r:c[2],kerf:c[3],nx:c[5]||0,ny:c[6]||0}); });
    (d.heap||[]).forEach(function(h){ heap.push({x:h[0],hy:h[1],y:h[1],r:h[2],grade:h[3],txt:h[4],rot:h[5],th:h[6],lg:h[7],vy:0,landed:true}); });
    wear=d.wear||0; water=(d.water===undefined?1:d.water);
    grossClean=d.gc||0; deducted=d.dd||0; blankCount=d.bc||0; ligne=d.ligne||16;
  }catch(e){}
}

/* relative coords: cuts stored in fractions so a resize keeps the sheet riddled */
function toAbs(c){ return {x:c.x*W, y:c.y*H, r:c.r, kerf:c.kerf}; }

/* ------------------------------------------------------------------ *
   CUT GEOMETRY
 * ------------------------------------------------------------------ */
function ligneToPx(l){
  var base = Math.min(W,H)/13;
  return base*(l/16)*(1+wear*0.16);
}
function kerfPx(){ return Math.max(1.6, ligneToPx(ligne)*0.055*(1+wear*0.9)); }

function insideAnyHole(px,py,slack){
  for(var i=0;i<cuts.length;i++){
    var c=cuts[i], ax=c.x*W, ay=c.y*H;
    var dx=px-ax, dy=py-ay;
    if(dx*dx+dy*dy < (c.r+ (slack||0))*(c.r+(slack||0))) return true;
  }
  return false;
}
/* teeth ride into void? sample the annulus */
function teethInVoid(x,y,r){
  var hits=0, N=64;
  for(var i=0;i<N;i++){
    var a=i/N*Math.PI*2;
    var px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    if(insideAnyHole(px,py,-0.5)) hits++;
  }
  return hits;
}

function applyCutsToGlyphs(){
  for(var g=0;g<glyphs.length;g++){
    var gl=glyphs[g];
    if(gl.punct) { gl.el.style.display=''; continue; }   // WILDCARD: punctuation never punched
    var gone=false;
    for(var i=0;i<cuts.length;i++){
      var c=cuts[i], ax=c.x*W, ay=c.y*H;
      var dx=gl.cx-ax, dy=gl.cy-ay;
      if(dx*dx+dy*dy <= (c.r+c.kerf)*(c.r+c.kerf)){ gone=true; break; }
    }
    gl.alive=!gone;
    gl.el.style.display=gone?'none':'';
  }
}

/* ------------------------------------------------------------------ *
   AUDIO
 * ------------------------------------------------------------------ */
var AC=null, master=null, sawNode=null, sawGain=null, sawFilt=null, noiseBuf=null, hissGain=null, hissSrc=null;
function audio(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){ return null; }
  master=AC.createGain(); master.gain.value=0.34; master.connect(AC.destination);
  var len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  noiseBuf=buf;
  // river under the floor
  var riv=AC.createBufferSource(); riv.buffer=buf; riv.loop=true;
  var rf=AC.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=170; rf.Q.value=0.6;
  var rg=AC.createGain(); rg.gain.value=0.10;
  riv.connect(rf); rf.connect(rg); rg.connect(master); riv.start();
  var lfo=AC.createOscillator(); lfo.frequency.value=0.09;
  var lg=AC.createGain(); lg.gain.value=0.035;
  lfo.connect(lg); lg.connect(rg.gain); lfo.start();
  // drip hiss
  hissSrc=AC.createBufferSource(); hissSrc.buffer=buf; hissSrc.loop=true;
  var hf=AC.createBiquadFilter(); hf.type='bandpass'; hf.frequency.value=4200; hf.Q.value=0.8;
  hissGain=AC.createGain(); hissGain.gain.value=0.0;
  hissSrc.connect(hf); hf.connect(hissGain); hissGain.connect(master); hissSrc.start();
  return AC;
}
function sawRun(thick, dur){
  var ac=audio(); if(!ac) return;
  var t=ac.currentTime;
  var teeth=ac.createOscillator(); teeth.type='sawtooth';
  var f0=118+thick*54 + wear*22;
  teeth.frequency.setValueAtTime(f0*0.72,t);
  teeth.frequency.linearRampToValueAtTime(f0,t+dur*0.28);
  teeth.frequency.linearRampToValueAtTime(f0*0.86,t+dur);
  var rough=ac.createBufferSource(); rough.buffer=noiseBuf; rough.loop=true;
  var rg=ac.createGain(); rg.gain.value=0.30+thick*0.30;
  var bp=ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(1400+thick*1500,t);
  bp.frequency.linearRampToValueAtTime(900+thick*900,t+dur);
  bp.Q.value= water>0.05 ? 3.2 : 1.1;
  var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.30,t+0.03);
  g.gain.setValueAtTime(0.30,t+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  var lp=ac.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value= water>0.05 ? 2600 : 5200;   // dry tube gets brighter and nastier
  teeth.connect(g); rough.connect(rg); rg.connect(bp); bp.connect(g); g.connect(lp); lp.connect(master);
  teeth.start(t); rough.start(t); teeth.stop(t+dur+0.05); rough.stop(t+dur+0.05);
}
function snarl(){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  var o=ac.createOscillator(); o.type='square'; o.frequency.setValueAtTime(210,t);
  o.frequency.exponentialRampToValueAtTime(58,t+0.22);
  var n=ac.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
  var nf=ac.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=620; nf.Q.value=1.4;
  var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.42,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  o.connect(g); n.connect(nf); nf.connect(g); g.connect(master);
  o.start(t); n.start(t); o.stop(t+0.34); n.stop(t+0.34);
}
function rattle(lg){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  for(var k=0;k<3;k++){
    var tt=t+k*0.035;
    var o=ac.createOscillator(); o.type='triangle';
    o.frequency.value=(1500-lg*28)*(1+k*0.08);
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,tt);
    g.gain.exponentialRampToValueAtTime(0.10/(k+1),tt+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,tt+0.07);
    o.connect(g); g.connect(master); o.start(tt); o.stop(tt+0.09);
  }
}
function splitSnd(){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  var n=ac.createBufferSource(); n.buffer=noiseBuf;
  var f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2400;
  var g=ac.createGain(); g.gain.setValueAtTime(0.30,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+0.14);
}
function knock(){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  var o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(126,t);
  o.frequency.exponentialRampToValueAtTime(62,t+0.07);
  var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.055,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.10);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.12);
}
function wagon(){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  for(var k=0;k<11;k++){
    var tt=t+k*0.19+Math.random()*0.03;
    var n=ac.createBufferSource(); n.buffer=noiseBuf;
    var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=180+Math.random()*90; f.Q.value=2.0;
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,tt);
    g.gain.exponentialRampToValueAtTime(0.07,tt+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,tt+0.13);
    n.connect(f); f.connect(g); g.connect(master); n.start(tt); n.stop(tt+0.15);
  }
}

/* ------------------------------------------------------------------ *
   CUTTING
 * ------------------------------------------------------------------ */
function textUnder(x,y,r){
  var chars=[];
  for(var g=0;g<glyphs.length;g++){
    var gl=glyphs[g];
    if(!gl.alive||gl.punct) continue;
    var dx=gl.cx-x, dy=gl.cy-y;
    if(dx*dx+dy*dy<=r*r) chars.push({ch:gl.ch,x:gl.cx,g:g});
  }
  chars.sort(function(a,b){return a.x-b.x;});
  var s=chars.map(function(c){return c.ch;}).join('');
  return s.slice(0,5);
}

function doCut(x,y,forceLigne){
  var r=ligneToPx(forceLigne||ligne)/2;
  var kf=kerfPx();
  if(x-r<2||x+r>W-2||y-r<2||y+r>H-46) return;

  var th=thickness(x,y);
  var voidHits=teethInVoid(x,y,r);
  var broken = voidHits>2;

  var dur=0.28+th*0.22;
  sawRun(th,dur);
  if(broken) setTimeout(snarl,60);

  // gather what leaves the sheet
  var carried=textUnder(x,y,r);
  var mud=0, samples=0;
  for(var a=0;a<12;a++){
    for(var b=0;b<3;b++){
      var rr=r*(b+1)/4, aa=a/12*Math.PI*2;
      mud+=dirt(x+Math.cos(aa)*rr,y+Math.sin(aa)*rr); samples++;
    }
  }
  mud/=samples;
  var nv=nacre(x,y);

  cuts.push({x:x/W,y:y/H,r:r,kerf:kf});
  applyCutsToGlyphs();
  paintBack();

  // wear: scaled by local thickness, worse with no water
  wear += (0.014+th*0.021) * (water>0.05?1:3.4);
  water = Math.max(0, water - 0.055 - th*0.02);
  blankCount++;

  var thinFail = th < 0.62;
  var lg=(forceLigne||ligne);
  var disc={
    x:x, y:y, r:r, vy:0, vx:(Math.random()-0.5)*0.6, rot:0, vr:(Math.random()-0.5)*0.22,
    txt:carried, broken:broken, thin:thinFail, th:th, lg:lg, nv:nv, mud:mud,
    grade:null, landed:false, chip: wear>0.9 && Math.random()<0.45
  };
  if(!broken){
    var gr;
    if(mud>0.42) gr='X';
    else if(disc.chip) gr='3';
    else if(nv>0.66&&mud<0.16) gr='1';
    else if(nv>0.44) gr='2';
    else gr='3';
    disc.grade=gr;
    if(gr==='X'||gr==='3') deducted++; else grossClean++;
  } else {
    deducted++;
  }
  falling.push(disc);
  save();
}

/* thin blanks split in the heap a few seconds after landing */
function scheduleSplit(d){
  splitters.push({d:d,t:performance.now()+2200+Math.random()*2200});
}

/* ------------------------------------------------------------------ *
   PAINTING — background sheet: mud, worm scar, holes with nacre faces
 * ------------------------------------------------------------------ */
var lampAngle=-0.75;
function paintBack(){
  var g=backX;
  g.clearRect(0,0,W,H);
  // base valve surface
  g.fillStyle='#cfc7b2'; g.fillRect(0,0,W,H);
  // hinge edge warmer / dirtier at left
  var grad=g.createLinearGradient(0,0,W*0.35,0);
  grad.addColorStop(0,'rgba(168,150,112,0.92)');
  grad.addColorStop(1,'rgba(168,150,112,0)');
  g.fillStyle=grad; g.fillRect(0,0,W*0.35,H);

  // mud lines & worm scarring — coarse cells, honest and hard
  var step=Math.max(5,Math.round(Math.min(W,H)/110));
  for(var y=0;y<H;y+=step){
    for(var x=0;x<W;x+=step){
      var d=dirt(x+step/2,y+step/2);
      if(d>0.30){
        g.fillStyle='rgba(122,104,74,'+((d-0.30)*0.52).toFixed(3)+')';
        g.fillRect(x,y,step,step);
      }
      var t=thickness(x+step/2,y+step/2);
      if(t>1.30){ g.fillStyle='rgba(160,146,112,0.12)'; g.fillRect(x,y,step,step); }
      if(t<0.45){ g.fillStyle='rgba(226,220,204,0.16)'; g.fillRect(x,y,step,step); }
    }
  }
  // worm scars: a few hard scratched lines
  g.strokeStyle='rgba(104,88,62,0.42)'; g.lineWidth=1;
  for(var i=0;i<9;i++){
    var sx=(i*127%W), sy=(i*211%H);
    g.beginPath(); g.moveTo(sx,sy);
    for(var k=1;k<7;k++){
      sx+=Math.cos(i+k*1.7)*W*0.06; sy+=Math.sin(i*2.3+k)*H*0.035;
      g.lineTo(sx,sy);
    }
    g.stroke();
  }

  // HOLES — punched through; exposed nacre reads on the cut face
  for(var c=0;c<cuts.length;c++){
    var cu=cuts[c], ax=cu.x*W, ay=cu.y*H;
    g.save();
    g.beginPath(); g.arc(ax,ay,cu.r+cu.kerf,0,Math.PI*2); g.clip();
    g.clearRect(ax-cu.r-cu.kerf-2,ay-cu.r-cu.kerf-2,(cu.r+cu.kerf)*2+4,(cu.r+cu.kerf)*2+4);
    // nothing behind the hole: the void reads as the bench shadow under the sheet
    g.fillStyle='#8f8a7d'; g.fillRect(ax-cu.r-cu.kerf-2,ay-cu.r-cu.kerf-2,(cu.r+cu.kerf)*2+4,(cu.r+cu.kerf)*2+4);
    g.restore();
    // sawn wall: layered bands, plus directional sheen from bench lamp
    var n=18;
    for(var s=0;s<n;s++){
      var a0=s/n*Math.PI*2, a1=(s+1)/n*Math.PI*2, am=(a0+a1)/2;
      var lam=Math.max(0,Math.cos(am-lampAngle));
      var v=Math.round(150+lam*96);
      g.strokeStyle='rgba('+(v-14)+','+(v+2)+','+(v+6)+',0.95)';
      g.lineWidth=Math.max(1.4,cu.kerf*0.75);
      g.beginPath(); g.arc(ax,ay,cu.r+cu.kerf*0.35,a0,a1+0.02); g.stroke();
    }
    // clean edge
    g.strokeStyle='rgba(36,31,26,0.55)'; g.lineWidth=1;
    g.beginPath(); g.arc(ax,ay,cu.r+cu.kerf,0,Math.PI*2); g.stroke();
  }
}

/* ------------------------------------------------------------------ *
   FOREGROUND — saw, water can, heap, falling discs, tally
 * ------------------------------------------------------------------ */
var HEAPH=0;
function heapTop(){ return H-HEAPH; }

function drawDisc(g,d,x,y,r,rot,alpha){
  g.save(); g.globalAlpha=alpha===undefined?1:alpha;
  g.translate(x,y); g.rotate(rot);
  // face
  var lam=Math.max(0.12,Math.cos(rot-lampAngle))*0.5+0.5;
  var v=Math.round(198+lam*40);
  g.fillStyle='rgb('+(v-16)+','+(v-4)+','+(v)+')';
  g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill();
  // sawn edge: fine stacked layer bands at true thickness
  var thpx=Math.max(1.6, d.th*r*0.24);
  g.fillStyle='#b8b0a0';
  g.fillRect(-r,r*0.02,r*2,thpx);
  g.strokeStyle='rgba(140,132,118,0.9)'; g.lineWidth=0.6;
  for(var i=0;i<Math.max(2,Math.round(thpx/1.6));i++){
    g.beginPath(); g.moveTo(-r,r*0.02+i*1.6); g.lineTo(r,r*0.02+i*1.6); g.stroke();
  }
  g.strokeStyle='rgba(36,31,26,0.45)'; g.lineWidth=1;
  g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.stroke();
  // carried type
  if(d.txt){
    g.fillStyle='rgba(36,31,26,0.86)';
    g.font=Math.max(7,r*0.44)+'px Georgia, serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(d.txt,0,-r*0.05);
  }
  // blue chalk grade mark — only on discs in the heap
  if(d.landed&&d.grade){
    g.fillStyle='#2f5c8a';
    g.font='bold '+Math.max(8,r*0.50)+'px Georgia, serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(d.grade,r*0.50,r*0.46);
  }
  g.restore();
}

var picked=null;
function paintFore(){
  var g=foreX; g.clearRect(0,0,W,H);

  // heap band
  HEAPH=Math.min(H*0.30, 26+Math.min(heap.length,80)*1.05);
  var ht=heapTop();
  g.fillStyle='rgba(140,132,116,0.16)'; g.fillRect(0,ht,W,HEAPH);
  g.strokeStyle='rgba(93,85,74,0.42)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,ht+0.5); g.lineTo(W,ht+0.5); g.stroke();

  for(var i=0;i<heap.length;i++){ var d=heap[i]; drawDisc(g,d,d.x,d.y,d.r,d.rot,d.fading?d.fading:1); }
  for(var f=0;f<falling.length;f++){ var q=falling[f]; drawDisc(g,q,q.x,q.y,q.r,q.rot,1); }
  // shards
  for(var s=0;s<shards.length;s++){
    var sh=shards[s];
    g.save(); g.globalAlpha=Math.max(0,sh.life);
    g.translate(sh.x,sh.y); g.rotate(sh.rot);
    g.fillStyle='#dfe4e6'; g.beginPath();
    g.moveTo(0,0); g.lineTo(sh.s,sh.s*0.4); g.lineTo(sh.s*0.3,sh.s); g.closePath(); g.fill();
    g.restore();
  }

  // picked-up disc, held large
  if(picked){
    g.save();
    g.fillStyle='rgba(207,199,178,0.90)';
    var bw=Math.min(300,W*0.72), bh=96;
    var bx=(W-bw)/2, by=ht-bh-14;
    g.fillRect(bx,by,bw,bh);
    g.strokeStyle='#241f1a'; g.lineWidth=1; g.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
    drawDisc(g,picked,bx+40,by+bh/2,26,0,1);
    g.fillStyle='#241f1a'; g.font='13px Georgia, serif'; g.textAlign='left'; g.textBaseline='middle';
    g.fillText('“'+(picked.txt||'—')+'”', bx+76, by+30);
    g.fillStyle='#2f5c8a'; g.font='bold 12px Georgia, serif';
    g.fillText(picked.lg+' line   grade '+(picked.grade||'—'), bx+76, by+52);
    g.fillStyle='#5d554a'; g.font='11px Georgia, serif';
    g.fillText('set it down anywhere. it does not go back in.', bx+76, by+72);
    g.restore();
  }

  // WATER CAN with the nail hole in it
  var canX=W-46, canY=14;
  g.save();
  g.fillStyle='#8d8677'; g.fillRect(canX,canY,30,22);
  g.strokeStyle='#241f1a'; g.lineWidth=1; g.strokeRect(canX+0.5,canY+0.5,29,21);
  g.fillStyle='rgba(230,236,238,'+(0.25+water*0.6).toFixed(2)+')';
  g.fillRect(canX+2,canY+22-Math.max(2,water*18),26,Math.max(2,water*18));
  g.fillStyle='#241f1a'; g.fillRect(canX+14,canY+22,2,3);
  g.restore();
  if(water>0.03){
    var dy=(performance.now()/6)%38;
    g.fillStyle='rgba(230,236,238,0.85)';
    g.fillRect(canX+14,canY+25+dy,2,4);
  }

  // SAW — toothed tube, drawn where the visitor has it
  var r=ligneToPx(ligne)/2;
  var vo=teethInVoid(sawX,sawY,r);
  g.save();
  g.strokeStyle= vo>2 ? '#2f5c8a' : 'rgba(36,31,26,0.85)';
  g.lineWidth=1.4;
  g.beginPath(); g.arc(sawX,sawY,r,0,Math.PI*2); g.stroke();
  g.strokeStyle='rgba(36,31,26,0.45)';
  g.beginPath(); g.arc(sawX,sawY,r+kerfPx(),0,Math.PI*2); g.stroke();
  var teeth=Math.max(20,Math.round(r*0.85));
  g.strokeStyle='rgba(36,31,26,0.72)'; g.lineWidth=1;
  for(var t=0;t<teeth;t++){
    var a=t/teeth*Math.PI*2 + wear*0.4;
    g.beginPath();
    g.moveTo(sawX+Math.cos(a)*r, sawY+Math.sin(a)*r);
    g.lineTo(sawX+Math.cos(a)*(r+kerfPx()), sawY+Math.sin(a)*(r+kerfPx()));
    g.stroke();
  }
  g.fillStyle='#2f5c8a'; g.font='bold 11px Georgia, serif'; g.textAlign='center';
  g.fillText(ligne, sawX, sawY+4);
  g.restore();

  // tally, small, top left, in trade grey with the ligne in chalk
  g.fillStyle='rgba(93,85,74,0.95)'; g.font='11px Georgia, serif'; g.textAlign='left'; g.textBaseline='top';
  var gross=Math.floor(grossClean/144), rem=grossClean%144;
  g.fillText('CLEAN '+gross+' gr '+rem+'   BROKE & OFF '+deducted+'   TUBE '+(wear<0.5?'true':(wear<1.1?'running large':'oversize, out of round')), 8, 6);
}

/* ------------------------------------------------------------------ *
   PHYSICS / LOOP
 * ------------------------------------------------------------------ */
var lastKnock=0, lastWagon=0, wagonCount=0, start=performance.now();
function tick(now){
  // water can drip
  water=Math.max(0,water-0.000035*16);
  if(hissGain&&AC){ hissGain.gain.value = water>0.03 ? 0.028 : 0.0; }

  // treadle knock on its own honest clock
  if(now-lastKnock>1180){ lastKnock=now; if(AC) knock(); }
  // wagon on planks, twice
  if(wagonCount<2 && now-start> (wagonCount===0?26000:96000)){ wagonCount++; if(AC) wagon(); }

  // falling discs
  for(var i=falling.length-1;i>=0;i--){
    var d=falling[i];
    d.vy+=0.62; d.y+=d.vy; d.x+=d.vx; d.rot+=d.vr;
    if(d.broken && d.y>heapTop()-d.r*1.6){
      // shatters on the way down; its characters are lost from sheet AND heap
      for(var k=0;k<9;k++){
        shards.push({x:d.x,y:d.y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,s:3+Math.random()*5,life:1});
      }
      splitSnd(); falling.splice(i,1); continue;
    }
    if(d.y>=heapTop()+HEAPH*0.35+Math.random()*4){
      d.y=heapTop()+8+ (heap.length%9)*2 + Math.random()*(HEAPH*0.5);
      d.x=Math.max(d.r+4,Math.min(W-d.r-4,d.x));
      d.hy=d.y; d.landed=true; d.vy=0;
      heap.push(d); falling.splice(i,1);
      rattle(d.lg);
      if(d.thin) scheduleSplit(d);
      if(heap.length>140) heap.splice(0,heap.length-140);
      save();
    }
  }
  // shards
  for(var s=shards.length-1;s>=0;s--){
    var sh=shards[s]; sh.vy+=0.5; sh.x+=sh.vx; sh.y+=sh.vy; sh.rot+=sh.vr; sh.life-=0.02;
    if(sh.life<=0) shards.splice(s,1);
  }
  // thin blanks split in the heap
  for(var p=splitters.length-1;p>=0;p--){
    if(now>=splitters[p].t){
      var dd=splitters[p].d, idx=heap.indexOf(dd);
      if(idx>=0){
        for(var q=0;q<7;q++) shards.push({x:dd.x,y:dd.y,vx:(Math.random()-0.5)*3.4,vy:-Math.random()*3,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,s:3+Math.random()*4,life:1});
        heap.splice(idx,1); splitSnd();
        if(dd.grade&&dd.grade!=='X'&&dd.grade!=='3'){ grossClean=Math.max(0,grossClean-1); }
        deducted++;
        save();
      }
      splitters.splice(p,1);
    }
  }

  lampAngle=-0.75+Math.sin(now/5200)*0.55;
  if(Math.floor(now/900)!==Math.floor((now-16)/900)) paintBack();
  paintFore();
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ *
   INPUT — two hands on the work
 * ------------------------------------------------------------------ */
function pos(e){
  var t=e.touches?e.touches[0]:e;
  var r=stage.getBoundingClientRect();
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function onDown(e){
  audio(); if(AC&&AC.state==='suspended') AC.resume();
  var p=pos(e);
  // water can?
  if(p.x>W-52&&p.y<44){ water=Math.min(1,water+0.55); e.preventDefault(); return; }
  // heap?
  if(p.y>heapTop()-6){
    if(picked){ picked=null; e.preventDefault(); return; }
    for(var i=heap.length-1;i>=0;i--){
      var d=heap[i], dx=p.x-d.x, dy=p.y-d.y;
      if(dx*dx+dy*dy<d.r*d.r*1.3){ picked=d; e.preventDefault(); return; }
    }
    picked=null; e.preventDefault(); return;
  }
  picked=null;
  dragging=true; sawX=p.x; sawY=p.y;
  e.preventDefault();
}
function onMove(e){
  var p=pos(e);
  sawX=p.x; sawY=p.y;
  if(dragging) e.preventDefault();
}
function onUp(e){
  if(dragging){ dragging=false; doCut(sawX,sawY); }
  e.preventDefault();
}
stage.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
stage.addEventListener('touchstart',onDown,{passive:false});
stage.addEventListener('touchmove',onMove,{passive:false});
stage.addEventListener('touchend',onUp,{passive:false});

window.addEventListener('keydown',function(e){
  var m={'1':14,'2':16,'3':18,'4':20,'5':24};
  if(m[e.key]){ ligne=m[e.key]; }
  if(e.key===' '){ water=Math.min(1,water+0.55); e.preventDefault(); }
});

window.addEventListener('resize',function(){ resize(); });

/* ------------------------------------------------------------------ *
   BOOT
 * ------------------------------------------------------------------ */
load();
resize();
sawX=W*0.55; sawY=H*0.45;
document.getElementById('hint').textContent='drag the tube, let go to cut · press a blank in the heap · 1–5 sets the line · tap the can';
setTimeout(function(){ document.getElementById('hint').style.opacity='0'; document.getElementById('hint').style.transition='opacity 3s'; }, 14000);
requestAnimationFrame(tick);

console.log('%cSand Creek shell, thin run. Eleven gross of 16-line by four. Rate on clean blanks only.','color:#2f5c8a;font:12px Georgia');
console.log('Waste: 1,140 tons ground and sold last year, $4.60 the ton delivered. Not one pound in the river. — E. Ludlage');
})();
