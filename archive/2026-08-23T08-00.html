  <meta name="outbox-spec-era" content="January 1897, right now — twenty past eight on a Friday evening in the lecture theatre of a subscription institute on Albemarle-adjacent ground, the gas turned down, a carbon arc lamp roaring on a stand at the left of a black-baize-covered table, a zinc tray of soap solution (water, oleate, and a third of glycerine, mixed on Tuesday and better for the keeping), and a rack of bent brass wire frames. The demonstration is running. Not a look-back at 'the great age of popular science' and not a 'nobody does public lectures like this now' lament — the arc is drawing badly, the room is warm, the films are draining faster than they did at rehearsal, and there are eleven frames still to get through before the interval.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the black-baize table seen dead-on and life-size, with a hard raking arc beam coming in from the left and nothing else in frame: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. Standing in the middle of it are brass wire frames carrying live soap films — a plain ring, a square, a bent cube, two rings pulled apart into a catenoid — and each film is a genuine draining liquid membrane whose colour is computed from its actual thickness. The visitor's entire vocabulary is the frame and the air: drag a frame bodily and the film sloshes, drains and re-orders its bands; pull the two rings of the catenoid apart with the cursor and the waist genuinely narrows until the surface can no longer exist and collapses; press and hold anywhere to blow a real jet of warm air across a film, which thins it locally, shoves colour bands sideways in visible Marangoni streaks, and will pop it if held; wheel to dip the whole frame back into the tray and start a fresh film. Films burst on their own schedule whether the visitor touches them or not, tearing open from the thinnest point at real speed and leaving a shivering rim of liquid that snaps back onto the wire.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of why a soap film has colours and why it stops having them before it breaks — that the colour is not pigment and not in the soap, it is interference between light reflected off the front surface and light reflected off the back surface, so the hue at any point on that film is nothing but a readout of its LOCAL THICKNESS in nanometres; that the film is therefore a live thickness map you are looking at directly, which is why a film hung vertically is a stack of horizontal bands and never a random wash — liquid drains downward under gravity and the top gets thinner than the bottom, continuously, so the bands crawl DOWN the film all evening and new ones are born at the top; that the band order is fixed by the arithmetic (twice thickness times refractive index against wavelength) and runs through a repeating sequence of orders — white, straw, amber, magenta, blue, green, yellow again — with each successive order less saturated than the last because more wavelengths start cancelling at once, so a thick film shows muddy pastel and only a thinning one shows clean colour; that the single most important fact about the whole thing is BLACK FILM: once the top of the film drains below about thirty nanometres, less than a quarter wavelength, the two reflections cancel almost perfectly and that region goes not white, not pale, but a deep true black that reads exactly like a hole in the wire — and black film is the last stage before rupture, so black is not absence but imminence; that the film survives at all because pulling on it locally raises surface tension there and hauls liquid back in, which is the elasticity a pure-water film hasn't got and the reason plain water cannot be blown into a bubble at any price; that this same effect makes a warm draught visible — heat lowers tension, liquid runs away from the warm patch, and the colour bands physically stream sideways ahead of the air; that rupture starts at one point and the hole opens at a genuine fixed speed set by tension against the film's own mass, so a thin film tears faster than a thick one and the retreating rim carries all the liquid with it in a visible thickening ring; that a catenoid between two rings is the actual minimal surface, and it exists only while the ring separation is less than about 1.33 times the ring diameter, past which no such surface is possible and it collapses instantly into two flat discs; and that a film's whole life here is about ninety seconds, and every second of it is spent getting thinner.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, RESTLESS and PRECARIOUS — bands of colour visibly racing downward, a black crown eating the top of every film within a minute, films letting go without warning and snapping back to the wire, the arc lamp hissing and flickering hard enough to make every colour jump, the brass warm, the whole table busy. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT fragile-and-precious, NOT slow, NOT soft-focus prettiness, NOT melancholy — this is a working demonstration at twenty past eight with eleven frames still to get through and the films draining faster than they should.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Black-baize table and unlit air as the ground (#0c0a0b), going to a hard sooty near-nothing outside the arc beam, with polished brass wire as the single held anchor (#c08a2e) carrying a hot specular streak where the arc catches it (#f6e0a4). Everything else is COMPUTED, not chosen: film colour is derived per-pixel from real thickness via thin-film interference, so it runs the honest Newton sequence — pale straw, amber, hot magenta, cyan-blue, sap green, degrading in saturation with each successive order into chalky pastel — and the thinnest regions resolve to a genuine dead black (#000000) indistinguishable from the baize behind them. Exactly one chip of arc-lamp violet-white (#e8ecff) is held strictly for the beam itself, the flicker, and the highlight on wet liquid running back down the wire. High contrast, transmissive, genuinely luminous where the film is lit and absolutely dead where it isn't; no ambient fill, no glow-bloom haze, no gradients other than the honest thickness field.">
  <meta name="outbox-spec-wildcard" content="One frame at the right of the table — a bent cube frame with a visible kink in the top-front edge where somebody has straightened it badly — carries a film that is already entirely black film across its whole span, and it stays that way forever: it never colours, never drains further, never bursts no matter how long it is blown on or how hard the frame is dragged, and reads permanently as a square hole cut in the picture with brass around it. It is never labelled, never explained, and it is in the same position with the same kink every visit.">
  <meta name="outbox-spec-forbidden" content="NO soap-film-as-metaphor for fragility / beauty-that-doesn't-last / the-brief-bright-life / a-world-in-a-bubble / childhood wonder / 'everything is temporary' — it is optical path difference, drainage, and thirty nanometres, and it has nothing to teach anybody. NO science-as-magic, NO wonder, NO awe, NO 'the miracle of the ordinary', NO gasping-audience register, NO Victorian-lecture whimsy and NO winking at gentlemen in frock coats. NO hushed, meditative, hypnotic, reverent or 'let the colours still you' register whatsoever, and NO ambient-visualiser or screensaver framing. NO nostalgia, NO wistfulness, NO 'nobody demonstrates anything by hand anymore / the great popular lectures are gone' decline narrative — there are eleven frames left before the interval. NO iridescence-as-luxury, NO oil-slick / holographic / opal / vaporwave / synthwave / late-internet-shimmer aesthetic drift, NO pastel-dreamscape softness. NO sensuous material writing about liquid or light beyond thickness, tension, speed and hue. NO melancholy, NO soft autumn, NO loneliness, NO cryptic-SCP or ominous dread about the permanently black film. NO archival / museum / cabinet / drawer / relic framing of the apparatus — it is on the table and in use this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — the room is warm, full and busy. NO signal / transmission / frequency / broadcast framing of the light. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the baize, the brass, the beam and the films, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
"use strict";
/* 2·n·t = (m ± ½)λ   n = 1.34.  the colour is arithmetic, nothing else. */

/* ---------- thin-film interference lookup: computed, never chosen ---------- */
var NLUT = 1400;
var LR = new Float32Array(NLUT), LG = new Float32Array(NLUT), LB = new Float32Array(NLUT);
(function buildLUT(){
  var lams=[], S=[], xb=[], yb=[], zb=[];
  function g(x,mu,s1,s2){var t=(x-mu)/(x<mu?s1:s2);return Math.exp(-0.5*t*t);}
  function planck(l,T){var lm=l*1e-9;return 1/(Math.pow(lm,5)*(Math.exp(0.014387769/(lm*T))-1));}
  var T=6100, peak=0;
  for(var l=390;l<=730;l+=4){
    lams.push(l);
    var s=planck(l,T); if(l<482) s*=1.09;           // carbon arc leans violet
    S.push(s); if(s>peak)peak=s;
    xb.push(1.056*g(l,599.8,37.9,31.0)+0.362*g(l,442.0,16.0,26.7)-0.065*g(l,501.1,20.4,26.2));
    yb.push(0.821*g(l,568.8,46.9,40.5)+0.286*g(l,530.9,16.3,31.1));
    zb.push(1.217*g(l,437.0,11.8,36.0)+0.681*g(l,459.0,26.0,13.8));
  }
  var K=lams.length, Yw=0;
  for(var k=0;k<K;k++){S[k]/=peak; Yw+=S[k]*yb[k];}
  var n=1.34, R0=Math.pow((n-1)/(n+1),2), maxv=0;
  var tmp=new Float32Array(NLUT*3);
  for(var t=0;t<NLUT;t++){
    var X=0,Y=0,Z=0;
    for(var k2=0;k2<K;k2++){
      var ph=2*Math.PI*n*t/lams[k2];
      var sn=Math.sin(ph);
      var refl=4*R0*sn*sn;                            // half-wave shift included
      var w=S[k2]*refl;
      X+=w*xb[k2]; Y+=w*yb[k2]; Z+=w*zb[k2];
    }
    X/=Yw;Y/=Yw;Z/=Yw;
    var r= 3.2406*X-1.5372*Y-0.4986*Z;
    var gg=-0.9689*X+1.8758*Y+0.0415*Z;
    var b= 0.0557*X-0.2040*Y+1.0570*Z;
    if(r<0)r=0; if(gg<0)gg=0; if(b<0)b=0;
    tmp[t*3]=r;tmp[t*3+1]=gg;tmp[t*3+2]=b;
    if(r>maxv)maxv=r; if(gg>maxv)maxv=gg; if(b>maxv)maxv=b;
  }
  var gain=1/maxv;
  for(var t2=0;t2<NLUT;t2++){LR[t2]=tmp[t2*3]*gain;LG[t2]=tmp[t2*3+1]*gain;LB[t2]=tmp[t2*3+2]*gain;}
})();
var GAM=new Uint8Array(1200);
(function(){ for(var i=0;i<1200;i++){var x=i/1023; x=(x-0.045)/0.955; if(x<0)x=0; if(x>1)x=1;
  GAM[i]=Math.round(255*Math.pow(x,1/2.15));} })();
function px_(v){var i=(v*1023)|0; if(i<0)i=0; if(i>1199)i=1199; return GAM[i];}

/* ---------- drainage sheet ---------- */
var FLOW=1.35e-5, DIFF=0.55, MEN=680;
function Sheet(NX,NY){
  this.NX=NX;this.NY=NY;var N=NX*NY;
  this.h=new Float32Array(N);this.q=new Float32Array(N);this.d=new Float32Array(N);
  this.mask=new Uint8Array(N);this.mask.fill(1);
  this.pinTop=false;
}
Sheet.prototype.dip=function(){
  var NX=this.NX,NY=this.NY,h=this.h;
  for(var j=0;j<NY;j++){
    var base=640+ j/(NY-1)*380;
    for(var i=0;i<NX;i++){
      h[j*NX+i]=base*(0.93+0.14*Math.random())+40*Math.sin(i*0.7+j*0.3);
    }
  }
};
Sheet.prototype.step=function(dt,gx,gy,blow){
  var NX=this.NX,NY=this.NY,h=this.h,q=this.q,d=this.d,mask=this.mask,N=NX*NY;
  var sub=3, sdt=dt/sub;
  for(var s=0;s<sub;s++){
    d.fill(0);
    for(var k=0;k<N;k++){
      if(!mask[k]){q[k]=0;continue;}
      var hc=h[k]; if(hc>1200)hc=1200;
      q[k]=FLOW*hc*hc*hc;
    }
    for(var j=0;j<NY;j++){
      for(var i=0;i<NX;i++){
        var k2=j*NX+i; if(!mask[k2])continue;
        var lim=h[k2]*0.30;
        var fy=q[k2]*gy*sdt; if(fy>lim)fy=lim; if(fy<-lim)fy=-lim;
        if(fy>0){ d[k2]-=fy; if(j<NY-1&&mask[k2+NX])d[k2+NX]+=fy; }
        else if(fy<0){ d[k2]+=fy; if(j>0&&mask[k2-NX])d[k2-NX]-=fy; }
        var fx=q[k2]*gx*sdt; if(fx>lim)fx=lim; if(fx<-lim)fx=-lim;
        if(fx>0){ d[k2]-=fx; if(i<NX-1&&mask[k2+1])d[k2+1]+=fx; }
        else if(fx<0){ d[k2]+=fx; if(i>0&&mask[k2-1])d[k2-1]-=fx; }
      }
    }
    /* Marangoni: warm patch lowers tension, liquid hauls away from it */
    if(blow){
      var s2=blow.sig*blow.sig, KM=blow.k;
      var ci=blow.gx, cj=blow.gy, rad=blow.sig*3.0;
      var i0=Math.max(0,Math.floor(ci-rad)),i1=Math.min(NX-1,Math.ceil(ci+rad));
      var j0=Math.max(0,Math.floor(cj-rad)),j1=Math.min(NY-1,Math.ceil(cj+rad));
      for(var jj=j0;jj<=j1;jj++)for(var ii=i0;ii<=i1;ii++){
        var kk=jj*NX+ii; if(!mask[kk])continue;
        var dx=ii-ci, dy=jj-cj, r2=dx*dx+dy*dy;
        var H=blow.str*Math.exp(-r2/(2*s2));
        if(H<0.004)continue;
        var vx=KM*H*dx/s2, vy=KM*H*dy/s2;
        var lim2=h[kk]*0.30;
        var ax=vx*sdt; if(ax>0.45)ax=0.45; if(ax<-0.45)ax=-0.45;
        var ay=vy*sdt; if(ay>0.45)ay=0.45; if(ay<-0.45)ay=-0.45;
        var tx=h[kk]*Math.abs(ax); if(tx>lim2)tx=lim2;
        var ty=h[kk]*Math.abs(ay); if(ty>lim2)ty=lim2;
        if(ax>0){d[kk]-=tx; if(ii<NX-1&&mask[kk+1])d[kk+1]+=tx;}
        else if(ax<0){d[kk]-=tx; if(ii>0&&mask[kk-1])d[kk-1]+=tx;}
        if(ay>0){d[kk]-=ty; if(jj<NY-1&&mask[kk+NX])d[kk+NX]+=ty;}
        else if(ay<0){d[kk]-=ty; if(jj>0&&mask[kk-NX])d[kk-NX]+=ty;}
        d[kk]-=h[kk]*H*0.55*sdt;                       /* the jet itself thins it */
      }
    }
    for(var k3=0;k3<N;k3++){ if(mask[k3]){h[k3]+=d[k3]; if(h[k3]<0.4)h[k3]=0.4;} }
    /* lateral relaxation + meniscus pinning at the wire */
    for(var j2=1;j2<NY-1;j2++)for(var i2=1;i2<NX-1;i2++){
      var k4=j2*NX+i2; if(!mask[k4])continue;
      var lap=h[k4-1]+h[k4+1]+h[k4-NX]+h[k4+NX]-4*h[k4];
      h[k4]+=DIFF*sdt*lap;
    }
    for(var j3=0;j3<NY;j3++)for(var i3=0;i3<NX;i3++){
      var k5=j3*NX+i3; if(!mask[k5])continue;
      var edge=(i3===0||i3===NX-1||j3===NY-1||!mask[k5-1]||!mask[k5+1]||(j3>0&&!mask[k5-NX])||(j3<NY-1&&!mask[k5+NX]));
      if(edge && (this.pinTop || j3>NY*0.30)){
        var f=Math.min(1,sdt*2.4);
        h[k5]+=(MEN-h[k5])*f;
      }
    }
  }
};
Sheet.prototype.stats=function(){
  var h=this.h,mask=this.mask,N=this.NX*this.NY,mn=1e9,mi=0,black=0,cnt=0,sum=0;
  for(var k=0;k<N;k++){ if(!mask[k])continue; cnt++; sum+=h[k];
    if(h[k]<mn){mn=h[k];mi=k;} if(h[k]<26)black++; }
  return {min:mn,idx:mi,blackFrac:cnt?black/cnt:0,mean:cnt?sum/cnt:0,cells:cnt};
};

/* ---------- lamp ---------- */
var lamp={I:1,warm:1,a1:-0.42,a2:0.40,ox:0,oy:0,t:0,jump:0};
function lampStep(dt){
  lamp.t+=dt;
  var t=lamp.t;
  var n=0.55+0.20*Math.sin(t*7.3)+0.13*Math.sin(t*19.1+1.2)+0.10*Math.sin(t*41.7+2.6)+0.09*Math.sin(t*3.1);
  if(Math.random()<dt*1.6) lamp.jump=(Math.random()-0.5)*0.34;
  lamp.jump*=Math.exp(-dt*6);
  lamp.I=Math.max(0.42,Math.min(1.35,0.80+n*0.30+lamp.jump));
  lamp.warm=1+0.05*Math.sin(t*5.7)+lamp.jump*0.12;
  lamp.a1=-0.44+0.012*Math.sin(t*2.3); lamp.a2=0.42+0.014*Math.sin(t*1.7+2);
}

/* ---------- canvas ---------- */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,SC=1,LX=0,LY=0;
function resize(){
  DPR=Math.min(1.6,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var land=W>H*0.95;
  SC=land?Math.min(W/1180,H/560):Math.min(W/560,H/1020);
  SC=Math.max(0.36,Math.min(1.5,SC));
  LX=-0.10*W; LY=H*0.44;
  layout(land);
  makeBaize();
}
function beamLit(x,y){
  var ang=Math.atan2(y-LY,x-LX);
  var m=1;
  if(ang<lamp.a1) m=Math.max(0.10,1-(lamp.a1-ang)*6.5);
  else if(ang>lamp.a2) m=Math.max(0.10,1-(ang-lamp.a2)*6.5);
  var dist=Math.hypot(x-LX,y-LY)/(W*1.25);
  return m*lamp.I/(0.72+dist*0.9);
}

/* ---------- baize ---------- */
var baize=null;
function makeBaize(){
  var s=128,o=document.createElement('canvas');o.width=o.height=s;
  var g=o.getContext('2d');
  var im=g.createImageData(s,s);
  for(var i=0;i<s*s;i++){
    var n=Math.random();
    var v=n<0.965?0:(n<0.995?6:11);
    im.data[i*4]=12+v; im.data[i*4+1]=10+v*0.8; im.data[i*4+2]=11+v*0.7; im.data[i*4+3]=255;
  }
  g.putImageData(im,0,0);
  baize=ctx.createPattern(o,'repeat');
}

/* ---------- shared render helper ---------- */
function Buf(w,h){
  this.c=document.createElement('canvas');this.c.width=w;this.c.height=h;
  this.g=this.c.getContext('2d');this.img=this.g.createImageData(w,h);this.w=w;this.h=h;
}

/* ---------- flat frame (ring / square) ---------- */
function FlatFrame(kind,x,y,R){
  this.kind=kind;this.x=x;this.y=y;this.R=R;
  this.NX=52;this.NY=62;
  this.sheet=new Sheet(this.NX,this.NY);
  this.buf=new Buf(104,124);
  this.state='gone';this.redipAt=0;this.age=0;
  this.vx=0;this.vy=0;this.px=x;this.py=y;
  this.hole=null;this.drops=[];this.dipT=0;
  this.reset();
}
FlatFrame.prototype.reset=function(){
  var NX=this.NX,NY=this.NY,m=this.sheet.mask;
  for(var j=0;j<NY;j++)for(var i=0;i<NX;i++){
    var u=(i+0.5)/NX-0.5, v=(j+0.5)/NY-0.5, ok;
    if(this.kind==='ring') ok=(u*u+v*v)<0.2401;
    else ok=(Math.abs(u)<0.478&&Math.abs(v)<0.478);
    m[j*NX+i]=ok?1:0;
  }
};
FlatFrame.prototype.dip=function(){
  this.sheet.dip();this.state='live';this.age=0;this.hole=null;this.dipT=0.55;
  for(var i=0;i<3;i++)this.drops.push({s:Math.random()*0.5,v:0.55+Math.random()*0.5,w:1.6+Math.random()});
  if(A)slither(0.45);
};
FlatFrame.prototype.grab=function(px,py){
  var dx=px-this.x,dy=py-this.y,d=Math.hypot(dx,dy);
  if(this.kind==='ring') return Math.abs(d-this.R)<Math.max(16,this.R*0.16);
  var ax=Math.abs(dx),ay=Math.abs(dy),r=this.R*0.95, tol=Math.max(15,this.R*0.15);
  if(ax>r+tol||ay>r+tol)return false;
  return (Math.abs(ax-r)<tol||Math.abs(ay-r)<tol);
};
FlatFrame.prototype.step=function(dt,now){
  var ax=(this.x-this.px)/Math.max(dt,0.001), ay=(this.y-this.py)/Math.max(dt,0.001);
  this.px+=(this.x-this.px)*Math.min(1,dt*9); this.py+=(this.y-this.py)*Math.min(1,dt*9);
  this.dipT=Math.max(0,this.dipT-dt);
  if(this.state==='gone'){
    if(now>this.redipAt) this.dip();
    this.stepDrops(dt); return;
  }
  this.age+=dt;
  var gx=Math.max(-0.9,Math.min(0.9,-ax*0.0022)), gy=1+Math.max(-0.7,Math.min(0.7,-ay*0.0022));
  var blow=null;
  if(pointer.blowing){
    var lx=pointer.x-this.x, ly=pointer.y-this.y;
    var rad=this.R*1.5;
    if(Math.abs(lx)<rad&&Math.abs(ly)<rad){
      var gxx=(lx/(2*this.R)+0.5)*this.NX, gyy=(ly/(2*this.R)+0.5)*this.NY;
      blow={gx:gxx,gy:gyy,sig:this.NX*0.13,str:1.35,k:6.0};
      this.blowDX=Math.max(-5,Math.min(5,lx*0.03));
      this.blowDY=Math.max(-5,Math.min(5,ly*0.03));
    }
  }

FlatFrame.prototype.stepDrops=function(dt){

FlatFrame.prototype.burst=function(idx,minh){

FlatFrame.prototype.render=function(){
  if(this.state!=='gone'){
    var b=this.buf,bw=b.w,bh=b.h,data=b.img.data;

    var lit=beamLit(this.x,this.y)*0.98;

FlatFrame.prototype.drawWire=function(){

  shape();ctx.strokeStyle='rgba(192,138,46,'+Math.min(1,0.55+lit*0.5).toFixed(3)+')';ctx.lineWidth=lw;ctx.stroke();

FlatFrame.prototype.wirePoint=function(s){

/* ---------- catenoid: the actual minimal surface ---------- */
function Catenoid(x,y,R){

  if(A)slither(0.4);

Catenoid.prototype.grab=function(px,py){
  var d1=Math.hypot(px-this.x,py-(this.y-this.sep/2));

  var tol=Math.max(16,this.R*0.3);
  if(d2<this.R+tol&&Math.abs(py-(this.y+this.sep/2))<tol) return 'lower';

    if(A)tick(2400);

  }
  if(this.state==='gone'){ if(now>this.redipAt&&this.c>0)this.dip(); this.stepDrops(dt); return; }
  this.age+=dt;
  var blow=null;

Catenoid.prototype.stepDrops=FlatFrame.prototype.stepDrops;

/* ---------- the bent cube: black film, and it stays black ---------- */
function CubeFrame(x,y,S){
  this.x=x;this.y=y;this.S=S;

CubeFrame.prototype.grab=function(px,py){
  return Math.abs(px-this.x)<this.S*0.95&&Math.abs(py-this.y)<this.S*0.95;
};
CubeFrame.prototype.step=function(){};

  ctx.strokeStyle='rgba(104,74,26,'+(0.30+lit*0.30).toFixed(3)+')';ctx.lineWidth=lw*0.8;ctx.stroke();

  ctx.moveTo(p.f[0][0],p.f[0][1]);
  ctx.lineTo(p.kx,p.ky);
  ctx.lineTo(p.f[1][0],p.f[1][1]);
  ctx.lineTo(p.f[2][0],p.f[2][1]);

  ctx.closePath();
  ctx.fillStyle='#000000';ctx.fill();

  ctx.moveTo(p.f[0][0],p.f[0][1]);ctx.lineTo(p.kx,p.ky);ctx.lineTo(p.f[1][0],p.f[1][1]);
  ctx.lineTo(p.f[2][0],p.f[2][1]);ctx.lineTo(p.f[3][0],p.f[3][1]);ctx.closePath();
  ctx.strokeStyle='rgba(52,34,10,0.95)';ctx.lineWidth=lw*1.5;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.f[0][0],p.f[0][1]);ctx.lineTo(p.kx,p.ky);ctx.lineTo(p.f[1][0],p.f[1][1]);
  ctx.lineTo(p.f[2][0],p.f[2][1]);ctx.lineTo(p.f[3][0],p.f[3][1]);ctx.closePath();

  ctx.moveTo(p.f[3][0],p.f[3][1]);ctx.lineTo(p.f[0][0],p.f[0][1]);ctx.lineTo(p.kx,p.ky);
  ctx.strokeStyle='rgba(246,224,164,'+Math.min(0.95,0.26+lit*0.55).toFixed(3)+')';

/* ---------- layout ---------- */
var frames=[],ring,square,cat,cube;
function layout(land){
  var pos = land ? [[0.155,0.50],[0.375,0.485],[0.615,0.505],[0.855,0.50]]
                 : [[0.30,0.185],[0.71,0.375],[0.31,0.635],[0.72,0.865]];
  var R=96*SC, Rs=88*SC, Rc=64*SC, Sq=100*SC;
  if(!ring){
    ring=new FlatFrame('ring',0,0,R);
    square=new FlatFrame('square',0,0,Rs);
    cat=new Catenoid(0,0,Rc);
    cube=new CubeFrame(0,0,Sq);
    frames=[ring,square,cat,cube];
  }
  ring.R=R;square.R=Rs;cat.R=Rc;cat.sep=Math.min(cat.sep,Rc*1.30);cube.S=Sq*0.82;
  var objs=[ring,square,cat,cube];
  for(var i=0;i<4;i++){objs[i].x=W*pos[i][0];objs[i].y=H*pos[i][1];objs[i].px=objs[i].x;objs[i].py=objs[i].y;}
  ring.buf=new Buf(104,124);square.buf=new Buf(104,124);cat.buf=new Buf(96,120);
}

/* ---------- audio ---------- */
var A=null,master,hissG,blowG,noiseBuf;
function initAudio(){
  if(A)return;

  A=new AC();
  master=A.createGain();master.gain.value=0.5;master.connect(A.destination);
  var n=A.sampleRate*2;noiseBuf=A.createBuffer(1,n,A.sampleRate);
  var d=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  var s=A.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  var bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2700;bp.Q.value=0.7;
  hissG=A.createGain();hissG.gain.value=0.035;
  s.connect(bp);bp.connect(hissG);hissG.connect(master);s.start();
  var s2=A.createBufferSource();s2.buffer=noiseBuf;s2.loop=true;
  var lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
  var g2=A.createGain();g2.gain.value=0.02;
  s2.connect(lp);lp.connect(g2);g2.connect(master);s2.start();
  var s3=A.createBufferSource();s3.buffer=noiseBuf;s3.loop=true;
  var lp3=A.createBiquadFilter();lp3.type='lowpass';lp3.frequency.value=680;lp3.Q.value=1.2;
  blowG=A.createGain();blowG.gain.value=0;
  s3.connect(lp3);lp3.connect(blowG);blowG.connect(master);s3.start();
}
function crackle(){

  var bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200+Math.random()*4200;bp.Q.value=3;
  var g=A.createGain();var t=A.currentTime;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.03+Math.random()*0.06,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.03+Math.random()*0.05);
  s.connect(bp);bp.connect(g);g.connect(master);
  s.start(t,Math.random()*1.5);s.stop(t+0.12);
}
function tick(f){
  if(!A)return;var t=A.currentTime;
  var o=A.createOscillator();o.type='sine';o.frequency.setValueAtTime(Math.min(4000,f),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(90,f*0.35),t+0.07);
  var g=A.createGain();g.gain.setValueAtTime(0.14,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.1);
  var s=A.createBufferSource();s.buffer=noiseBuf;
  var bp=A.createBiquadFilter();bp.type='highpass';bp.frequency.value=1800;
  var g2=A.createGain();g2.gain.setValueAtTime(0.10,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  s.connect(bp);bp.connect(g2);g2.connect(master);s.start(t,Math.random());s.stop(t+0.06);
}
function drip(){
  if(!A)return;var t=A.currentTime;
  var o=A.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(1100+Math.random()*500,t);
  o.frequency.exponentialRampToValueAtTime(300,t+0.06);
  var g=A.createGain();g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.1);
}
function slither(dur){
  if(!A)return;var t=A.currentTime;
  var s=A.createBufferSource();s.buffer=noiseBuf;
  var bp=A.createBiquadFilter();bp.type='bandpass';bp.Q.value=5;
  bp.frequency.setValueAtTime(340,t);bp.frequency.exponentialRampToValueAtTime(1500,t+dur);
  var g=A.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.030,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);
}

/* ---------- pointer ---------- */
var pointer={x:-9999,y:-9999,blowing:false,drag:null,dragKind:null,offx:0,offy:0,lastTap:0};
function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',function(e){
  initAudio(); if(A&&A.state==='suspended')A.resume();
  var p=pos(e);pointer.x=p[0];pointer.y=p[1];
  cv.setPointerCapture(e.pointerId);
  var now=performance.now();
  if(now-pointer.lastTap<330){ nearest(p[0],p[1]).dipNow(); pointer.lastTap=0; return; }
  pointer.lastTap=now;
  var g=cat.grab(p[0],p[1]);
  if(g){pointer.drag=cat;pointer.dragKind=g;pointer.offx=p[0]-cat.x;pointer.offy=p[1]-cat.y;return;}
  for(var i=0;i<frames.length;i++){
    var f=frames[i]; if(f===cat)continue;
    if(f.grab(p[0],p[1])){pointer.drag=f;pointer.dragKind='body';pointer.offx=p[0]-f.x;pointer.offy=p[1]-f.y;return;}
  }
  pointer.blowing=true;
},{passive:false});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);pointer.x=p[0];pointer.y=p[1];
  if(pointer.drag){
    var f=pointer.drag;
    if(f===cat){
      if(pointer.dragKind==='lower'){ cat.sep=Math.max(cat.R*0.18,Math.min(cat.R*2.4,(p[1]-cat.y)*2)); }
      else if(pointer.dragKind==='upper'){ cat.x=p[0]-pointer.offx; cat.y=p[1]-pointer.offy; }
    } else { f.x=p[0]-pointer.offx; f.y=p[1]-pointer.offy; }
  }
},{passive:false});
function release(){ pointer.drag=null;pointer.blowing=false; }
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('pointerleave',function(){pointer.blowing=false;});
function nearest(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<frames.length;i++){var f=frames[i];var d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}}
  return {dipNow:function(){
    if(best===cube)return;
    best.state='gone';best.redipAt=0;best.hole=null;
    if(best.dip)best.dip();
  }};
}
cv.addEventListener('wheel',function(e){
  e.preventDefault(); initAudio(); if(A&&A.state==='suspended')A.resume();
  var p=pos(e); nearest(p[0],p[1]).dipNow();
},{passive:false});
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
var last=performance.now(), crackT=0, dripT=1.4;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  var t=now/1000;
  lampStep(dt);
  if(A){
    hissG.gain.value=0.020+0.030*lamp.I;
    var target=pointer.blowing?0.085:0;
    blowG.gain.value+=(target-blowG.gain.value)*Math.min(1,dt*7);
    crackT-=dt; if(crackT<=0){crackle();crackT=0.05+Math.random()*0.42;}
    dripT-=dt; if(dripT<=0){drip();dripT=2.2+Math.random()*5.5;}
  }
  for(var i=0;i<frames.length;i++) frames[i].step(dt,t);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0c0a0b';ctx.fillRect(0,0,W,H);
  if(baize){ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle=baize;ctx.fillRect(0,0,W,H);ctx.restore();}
  /* raking beam, hard edged */
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var L=Math.max(W,H)*2.2;
  for(var b=0;b<2;b++){
    var a1=lamp.a1*(b?0.5:1), a2=lamp.a2*(b?0.5:1);
    ctx.beginPath();ctx.moveTo(LX,LY);
    ctx.lineTo(LX+Math.cos(a1)*L,LY+Math.sin(a1)*L);
    ctx.lineTo(LX+Math.cos(a2)*L,LY+Math.sin(a2)*L);
    ctx.closePath();
    ctx.fillStyle='rgba(232,236,255,'+((b?0.020:0.016)*lamp.I).toFixed(4)+')';
    ctx.fill();
  }
  var bw2=3+lamp.I*5;
  ctx.fillStyle='rgba(232,236,255,'+(0.16*lamp.I).toFixed(3)+')';
  ctx.fillRect(0,LY-H*0.30,bw2,H*0.60);
  ctx.restore();

  for(var k=0;k<frames.length;k++) frames[k].render();
  requestAnimationFrame(frame);
}
resize();
ring.dip();square.redipAt=0.8;cat.redipAt=1.6;
requestAnimationFrame(frame);

/* first-order thicknesses at normal incidence, n=1.34, for anyone checking the bench */
try{
  var lines=[];
  for(var m=1;m<=4;m++){
    var lam=550;
    lines.push('order '+m+' bright ≈ '+Math.round((m-0.5)*lam/(2*1.34))+' nm   dark ≈ '+Math.round(m*lam/(2*1.34))+' nm');
  }
  lines.push('below ~30 nm the two reflections cancel: black film, and it will go before the interval.');
  console.log(lines.join('\n'));
}catch(e){}
</script>
