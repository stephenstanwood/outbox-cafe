<title>Light Through the Rose — Colour the West Window Yourself</title>
<style>
  /* leadwork drawn by hand — no two cames the same width, and that is the whole point */
  :root{
    --wall:#221a2c;
    --light:#ffb060;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% 12%, color-mix(in srgb, var(--light) 22%, transparent), transparent 60%),
      var(--wall);
    color:#e9e2d6;
    font-family:Georgia,"Times New Roman",serif;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 16px 40px;
    transition:background .6s ease;
    -webkit-tap-highlight-color:transparent;
  }
  h1{
    font-weight:400;font-size:clamp(1.3rem,5vw,2rem);
    letter-spacing:.02em;margin:.2em 0 .1em;
  }
  .sub{opacity:.72;font-style:italic;font-size:.95rem;margin:0 0 22px;max-width:32ch}
  .stage{position:relative;width:min(88vw,520px);aspect-ratio:1;margin:6px auto}
  .cast{ /* light thrown on the far wall */
    position:absolute;inset:-14%;filter:blur(34px);opacity:.55;
    transform:scale(1.12);z-index:0;pointer-events:none;
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{50%{opacity:.72;transform:scale(1.16)}}
  svg{position:relative;z-index:1;width:100%;height:auto;display:block;overflow:visible}
  path.pane{
    stroke:#0c0a12;stroke-width:2.4;stroke-linejoin:round;
    cursor:pointer;transition:fill .35s ease,filter .3s ease;
  }
  path.pane:hover{filter:brightness(1.22)}
  .frame{fill:none;stroke:#d9b04a;stroke-width:3.5;opacity:.8}
  .controls{margin:26px auto 0;max-width:340px;width:100%}
  .hour{display:flex;align-items:center;gap:12px;font-size:.8rem;opacity:.85;justify-content:center}
  input[type=range]{width:190px;accent-color:var(--light)}
  button{
    margin-top:16px;background:transparent;color:#e9e2d6;
    border:1px solid rgba(233,226,214,.4);border-radius:999px;
    padding:7px 18px;font-family:inherit;font-size:.85rem;letter-spacing:.03em;
    cursor:pointer;transition:.25s;
  }
  button:hover{background:rgba(233,226,214,.1);border-color:var(--light)}
  footer{margin-top:34px;font-size:.72rem;opacity:.55;line-height:1.7;max-width:34ch}
  footer a{color:inherit}
</style>
</head>
<body>
  <h1>The West Window of Little Aumbry</h1>
  <p class="sub">Tap any pane to change its glass. Slide the hour to move the sun across the nave.</p>

  <div class="stage">
    <div class="cast" id="cast" aria-hidden="true"></div>
    <svg id="rose" viewBox="0 0 400 400" role="img"
         aria-label="A round stained-glass rose window you can recolour, pane by pane.">
      <title>The rose window at Little Aumbry</title>
      <desc>Concentric rings of coloured glass held in dark lead. Every pane can be tapped to change its colour.</desc>
    </svg>
  </div>

  <div class="controls">
    <div class="hour">
      <span>dawn</span>
      <input id="hour" type="range" min="0" max="100" value="10" aria-label="hour of the day">
      <span>vespers</span>
    </div>
    <button id="grace">a fresh pane of grace</button>
  </div>

  <footer>
    Glazed to no plan in particular · <a href="/archive">see the other windows in the aisle</a><br>
    <small>the glaziers signed the back of every pane, where no one stands to look.</small>
  </footer>

<script>
(() => {
  const CX=200, CY=200;
  // jewel glass — each named for the glazier who first poured it
  const GLASS=[
    ["#c81d4e","rose madder"],["#1e5aa8","abbey blue"],["#178a5b","yard green"],
    ["#e0a020","late honey"],["#7b3fa0","bishop's violet"],["#d64b8a","sugar pink"],
    ["#1f8a8a","kingfisher"],["#e8d24a","harvest"],["#b8532a","kiln rust"]
  ];
  const rings=[
    {rIn:0,   rOut:42,  n:1,  off:0},
    {rIn:42,  rOut:98,  n:6,  off:0},
    {rIn:98,  rOut:150, n:12, off:15},
    {rIn:150, rOut:194, n:24, off:0}
  ];
  const svg=document.getElementById("rose");
  const NS="http://www.w3.org/2000/svg";

  const pt=(r,a)=>{a=a*Math.PI/180;return [CX+r*Math.cos(a), CY+r*Math.sin(a)];};
  function sector(rIn,rOut,a0,a1){
    const [xoi,yoi]=pt(rIn,a0),[xoo,yoo]=pt(rOut,a0),
          [xco,yco]=pt(rOut,a1),[xci,yci]=pt(rIn,a1);
    const big=(a1-a0)>180?1:0;
    return `M${xoi} ${yoi} L${xoo} ${yoo} A${rOut} ${rOut} 0 ${big} 1 ${xco} ${yco}`+
           ` L${xci} ${yci} A${rIn} ${rIn} 0 ${big} 0 ${xoi} ${yoi} Z`;
  }

  const panes=[];
  rings.forEach((ring,ri)=>{
    for(let i=0;i<ring.n;i++){
      const p=document.createElementNS(NS,"path");
      p.setAttribute("class","pane");
      if(ring.n===1){
        p.setAttribute("d",`M${CX-ring.rOut} ${CY} a${ring.rOut} ${ring.rOut} 0 1 0 ${ring.rOut*2} 0 a${ring.rOut} ${ring.rOut} 0 1 0 ${-ring.rOut*2} 0 Z`);
      }else{
        const step=360/ring.n, a0=i*step+ring.off, a1=a0+step-1.4;
        p.setAttribute("d",sector(ring.rIn,ring.rOut,a0,a1));
      }
      let idx=(ri===0)?7:( (ri*3 + i*(ri+2)) % GLASS.length );
      const set=k=>{p.setAttribute("fill",GLASS[k][0]);
        p.querySelector("title").textContent=GLASS[k][1];};
      const t=document.createElementNS(NS,"title");p.appendChild(t);
      p.dataset.k=idx;set(idx);
      p.addEventListener("click",()=>{idx=(idx+1)%GLASS.length;p.dataset.k=idx;set(idx);});
      svg.appendChild(p);panes.push(p);
    }
  });
  // gilded outer frame, laid last so it sits over the lead
  const frame=document.createElementNS(NS,"circle");
  frame.setAttribute("class","frame");
  frame.setAttribute("cx",CX);frame.setAttribute("cy",CY);frame.setAttribute("r",196);
  svg.appendChild(frame);

  // the cast on the wall is just the window, softened
  document.getElementById("cast").appendChild(svg.cloneNode(true));

  // hour of the day → colour of the sun coming through
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  const hex=(c)=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const mix=(c1,c2,t)=>{const a=hex(c1),b=hex(c2);
    return `rgb(${lerp(a[0],b[0],t)},${lerp(a[1],b[1],t)},${lerp(a[2],b[2],t)})`;};
  // dawn amber → white noon → violet vespers, and a matching stone wall behind
  const LIGHTS=["#ff9a3c","#fff4e0","#ffffff","#c9a6ff","#8a5cff"];
  const WALLS =["#2a2030","#241d2c","#1d2130","#231a2e","#1b1428"];
  const hourEl=document.getElementById("hour");
  function setHour(v){
    const f=v/100*(LIGHTS.length-1), i=Math.min(Math.floor(f),LIGHTS.length-2), t=f-i;
    document.documentElement.style.setProperty("--light",mix(LIGHTS[i],LIGHTS[i+1],t));
    document.documentElement.style.setProperty("--wall", mix(WALLS[i], WALLS[i+1], t));
  }
  hourEl.addEventListener("input",e=>setHour(+e.target.value));
  setHour(+hourEl.value);

  // a fresh, harmonious set — one triad, softly rotated around the ring
  document.getElementById("grace").addEventListener("click",()=>{
    const base=Math.floor(Math.random()*GLASS.length);
    panes.forEach((p,i)=>{
      const k=(base + [0,3,6][i%3] + (i%2)) % GLASS.length;
      p.dataset.k=k;p.setAttribute("fill",GLASS[k][0]);
      p.querySelector("title").textContent=GLASS[k][1];
    });
  });

  console.log("%c✦ Little Aumbry, west aisle","font:italic 14px Georgia");
  console.log("Nobody counted the panes when the window went in, so nobody has ever agreed on the number. Try, if you like — the count is honest, the total is a rumour.");
})();
</script>

<script src="/nav.js" defer></script>
</body>
