  <meta name="outbox-spec-era" content="Right now — 10:40 on a hard, glaring April morning behind a house on the edge of Hebron, North Dakota, 22 mph steady out of the northwest with gusts over thirty, two T-posts and forty feet of galvanized line strung between them, a prop pole leaning against the fence, a paper bag of spring-clip wooden pegs, and a galvanized basket of wrung sheets and work shirts sat on an upturned crate. Not a look-back at 'when everyone hung their wash out' and not a 'the dryer killed the clothesline' lament — the basket is full, the wind is up, and the whole load has to be dry before the front comes through this afternoon.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one clothesline seen broadside from about fifteen feet away in flat noon-hard sunlight: line, two posts, a strip of grass, a strip of sky, nothing else — no header, no caption, no counter, no title, no instructions. The wash is a live cloth simulation being blown around by real gusting wind, and the visitor's whole vocabulary is grabbing: drag an item up out of the basket at the bottom edge, drop it over the line, and press to pinch a peg onto it wherever the cursor is. HOW the cloth lands on the line is entirely physical and entirely up to the visitor — a sheet flopped over with a wide bight of fabric on each side hangs and belly-snaps like a sail; the same sheet pegged by two corners hangs as a heavy vertical curtain that barely moves; a shirt hung by its shoulders wraps itself around the line inside of a minute. The piece IS forty feet of cotton getting worked over by moving air.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of hanging a load of wash so it actually dries — that drying is water leaving cloth into moving air, so exposed surface area and airflow are the only two things that matter and everything else is folklore; that a sheet doubled over the line with a generous bight on both sides presents nearly its whole area to the wind and dries in a third the time of the same sheet pegged flat by two corners, which shelters half of itself behind the other half; that cloth pegged across the wind fills like a sail and hammers itself dry while cloth pegged along the wind just streams and sulks; that a shirt goes up by the tail and not the shoulders, because shoulders let the sleeves flag out and whip the body of the shirt into a rope around the line, and because pegs at the shoulder print two dimples that will still be there tonight; that the heavy items go at the ends nearest the posts where the line sags least, since a loaded line sags and a sagging line lets the middle of a sheet drag the grass; that a prop pole under the middle isn't decoration, it's what buys back the sag; that a pinch of clearance between items is worth more than one extra item on the line; that a peg on a doubled seam holds and a peg on a single thickness of wet sheet pulls through in a gust; and the plain fact that a wrung sheet loses most of its weight in the first ten minutes and then argues about the rest. Literally water, wind, cotton, gravity, and a wooden spring clip.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the cloth and the air, and that register is LOUD, HARD, SNAPPING and BUSY — a stiff prairie wind working forty feet of wet cotton over, sheets cracking like a tarp on a truck bed, sleeves flogging, the line thrumming and shedding drops in a gust, everything glaring in flat hard morning light with short black shadows on dry grass. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT gentle, NOT soft-focus, NOT nostalgic, NOT melancholy — nothing here billows prettily in slow motion. It is a windy backyard at twenty past ten and the wash is getting beaten dry.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Sun-bleached cotton white (#f6f2e6) with its shaded folds dropping to a cool blue-grey (#a7b3bd) and wet, still-heavy cloth reading a full shade darker and greyer (#cfcabb), all hung against a hard scoured prairie sky (#4f86c6) that pales toward the horizon, on a strip of dry spring grass gone straw-and-sage (#8c8a5b) with short hard shadows, plus exactly one chip of raw pine peg tan (#c99a5e) held strictly for the wooden clothespins and the prop pole. Flat, hard, high-contrast, no glow, no bloom, no soft edges anywhere — cotton and galvanized wire photographed broadside in unfiltered late-morning sun.">
  <meta name="outbox-spec-wildcard" content="Exactly one item is already on the line when the page loads, out at the far end near the right-hand post: a single small child's sock, sun-faded to nearly nothing, bone dry, pegged with one peg, and stiff enough that the wind barely moves it. It cannot be dried further, it cannot be put in the basket, and its peg never pulls through no matter how hard it gusts. It is never labelled, never explained, never remarked on, and it is there identically every visit.">
  <meta name="outbox-spec-forbidden" content="NO laundry-as-metaphor for cleansing / renewal / starting fresh / airing things out / domestic-labour-made-visible / women's-unseen-work — it is water, wind, cotton and gravity, and it has nothing to teach anyone. NO sheets-as-ghosts, NO sheets-as-sails-of-some-ship, NO flags-of-a-small-country, no lyric simile of any kind attached to hanging cloth. NO nostalgia, NO wistfulness, NO 'nobody hangs their wash out anymore / the smell of line-dried sheets / they've outlawed clotheslines' decline narrative — the basket is full and the front comes through at three. NO meditative / hypnotic / 'watch it billow and let your mind empty' register, NO slow-motion dreamy softness, NO golden hour, NO backlit-glow prettiness — this is flat hard 10:40 sun and a twenty-two mile wind. NO sensuous fabric writing beyond weight, wetness, stiffness and how it catches air. NO melancholy soft autumn. NO archival / museum / cabinet / drawer / relic framing. NO cryptic-SCP or ominous dread about the faded sock. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice. NO signal / transmission / frequency framing of the wind sound. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the line, the wash, the grass and the sky, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- canvas */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,SMALL=false;
var horizon=0,groundY=0,postLx=0,postRx=0,postTopY=0,SP=12,cxc=0,cyc=0;
var bg=document.createElement('canvas'), bgx=bg.getContext('2d');

/* ---------------------------------------------------------------- palette */
var SKY_HI=[0x4f,0x86,0xc6], SKY_LO=[0xa8,0xc4,0xe2];
var GRASS=[0x8c,0x8a,0x5b], GRASS_D=[0x6d,0x6c,0x46], GRASS_L=[0xa2,0x9f,0x6d];
var DRY=[[0xf6,0xf2,0xe6],[0xdc,0xd8,0xc8],[0xa7,0xb3,0xbd]];
var WET=[[0xcf,0xca,0xbb],[0xb6,0xb2,0xa4],[0x8b,0x96,0xa0]];
var PINE=[0xc9,0x9a,0x5e];
var STEEL='#98a2a8', STEEL_D='#6f797f';
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}

/* ---------------------------------------------------------------- kinds */
var KINDS={
  sheet :{nx:11,ny:8, m:1.00, hz:105, sc:1.00},
  shirt :{nx:9, ny:8, m:0.80, hz:330, sc:0.92, shirt:true},
  pillow:{nx:7, ny:7, m:0.70, hz:470, sc:0.90},
  towel :{nx:8, ny:6, m:1.15, hz:210, sc:0.92},
  sock  :{nx:3, ny:5, m:0.34, hz:1500,sc:0.72}
};
var BASKET=['shirt','sheet','shirt','towel','sheet','pillow','shirt','sock','pillow'];

/* ---------------------------------------------------------------- world */
var items=[], pegs=[], drips=[], marks=[], fallenPegs=[], shed=[];
var T=0, MEAN=470, windSpeed=470, gustExtra=0, gustTarget=0, gustTimer=1.2, prevSpeed=470;
var wdx=0.30, wdy=-0.05, wdz=1.0;
var poleX=0, poleActive=false, poleLen=0;
var lineTh=0, lineThV=0;
var grabbed=null, grabPole=false, grabBasket=false;
var down=null;

var G=980;
var KWIND=0.00013;
var LINE_R=5.2;

/* ---------------------------------------------------------------- layout */
function layout(){
  SMALL = W<620;
  horizon = Math.round(H*0.60); groundY = horizon;
  postLx = Math.round(W*0.085); postRx = Math.round(W*0.915);
  postTopY = Math.round(H*0.235);
  SP = Math.max(8, Math.min(16, W/70));
  cxc = W*0.5; cyc = postTopY + (groundY-postTopY)*0.45;
  poleLen = groundY - postTopY - 4;
  if(!poleActive) poleX = postRx-16;
  paintBg();
}
function paintBg(){
  bg.width=Math.floor(W*DPR); bg.height=Math.floor(H*DPR);
  bg.style.width=W+'px'; bg.style.height=H+'px';
  bgx.setTransform(DPR,0,0,DPR,0,0);
  var g=bgx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,rgb(SKY_HI)); g.addColorStop(0.62,rgb(mix(SKY_HI,SKY_LO,0.55))); g.addColorStop(1,rgb(SKY_LO));
  bgx.fillStyle=g; bgx.fillRect(0,0,W,horizon+1);
  /* grass */
  bgx.fillStyle=rgb(GRASS); bgx.fillRect(0,horizon,W,H-horizon);
  bgx.fillStyle=rgb(mix(GRASS,GRASS_D,0.55)); bgx.fillRect(0,horizon,W,Math.max(3,(H-horizon)*0.06));
  var seed=20250405;
  function rnd(){ seed=(seed*1664525+1013904223)&0x7fffffff; return seed/0x7fffffff; }
  var n=Math.floor((W*(H-horizon))/620);
  for(var i=0;i<n;i++){
    var y=horizon+Math.pow(rnd(),0.7)*(H-horizon);
    var x=rnd()*W;
    var d=(y-horizon)/(H-horizon);
    var len=2+d*7, lean=(rnd()-0.5)*3.4;
    bgx.strokeStyle= rnd()<0.5 ? rgb(mix(GRASS,GRASS_D,0.55+rnd()*0.4)) : rgb(mix(GRASS,GRASS_L,0.4+rnd()*0.6));
    bgx.lineWidth= 0.8+d*1.0;
    bgx.beginPath(); bgx.moveTo(x,y); bgx.lineTo(x+lean,y-len); bgx.stroke();
  }
  /* posts + their hard short shadows */
  drawPostBg(postLx); drawPostBg(postRx);
}
function drawPostBg(x){
  var top=postTopY, w=Math.max(4,SP*0.42);
  /* shadow first */
  bgx.fillStyle='rgba(58,58,36,0.34)';
  bgx.beginPath();
  bgx.moveTo(x-w*0.5,groundY); bgx.lineTo(x+w*0.5,groundY);
  bgx.lineTo(x+w*0.5+(groundY-top)*0.30, groundY+(groundY-top)*0.085);
  bgx.lineTo(x-w*0.5+(groundY-top)*0.30, groundY+(groundY-top)*0.085);
  bgx.closePath(); bgx.fill();
  /* T-post: flange + studs */
  bgx.fillStyle=STEEL; bgx.fillRect(x-w*0.5,top,w,groundY-top+3);
  bgx.fillStyle=STEEL_D; bgx.fillRect(x+w*0.18,top,w*0.32,groundY-top+3);
  bgx.fillStyle='#c3c9cc'; bgx.fillRect(x-w*0.5,top,w*0.26,groundY-top+3);
  for(var y=top+9;y<groundY-4;y+=Math.max(9,SP*0.85)){
    bgx.fillStyle=STEEL_D; bgx.fillRect(x-w*0.9,y,w*0.9,Math.max(2,w*0.28));
  }
  bgx.fillStyle='#5f6a70'; bgx.fillRect(x-w*0.7,top-2,w*1.4,3);
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}

/* ---------------------------------------------------------------- the line */
function anchors(){
  var A=[{x:postLx,y:postTopY},{x:postRx,y:postTopY}];
  if(poleActive){
    var ty=groundY-poleLen;
    if(unpropped(poleX)>ty) A.splice(1,0,{x:poleX,y:ty});
  }
  return A;
}
var TENSION=2600;
function spanY(x,a,b){
  var L=b.x-a.x; if(L<=1) return a.y;
  var t=(x-a.x)/L;
  var y=a.y+(b.y-a.y)*t;
  var selfw=0.055*L;           /* bare line sag */
  y += selfw*4*t*(1-t);
  for(var i=0;i<pegs.length;i++){
    var p=pegs[i]; var pxp=pegX(p);
    if(pxp<a.x||pxp>b.x) continue;
    var P=p.item.load*46;
    var q=(pxp-a.x);
    y += (x<=pxp) ? P*(L-q)*(x-a.x)/(TENSION*L) : P*q*(b.x-x)/(TENSION*L);
  }
  return y;
}
function unpropped(x){ return spanY(x,{x:postLx,y:postTopY},{x:postRx,y:postTopY}); }
function lineY(x){
  var A=anchors();
  for(var i=0;i<A.length-1;i++){
    if(x>=A[i].x&&x<=A[i+1].x) return spanY(x,A[i],A[i+1])+thrumAt(x);
  }
  return (x<postLx?spanY(postLx,A[0],A[1]):spanY(postRx,A[A.length-2],A[A.length-1]))+thrumAt(x);
}
function thrumAt(x){
  if(Math.abs(lineTh)<0.02) return 0;
  var t=(x-postLx)/(postRx-postLx); if(t<0||t>1) return 0;
  return lineTh*Math.sin(Math.PI*t)*Math.cos(T*39.0)+lineTh*0.4*Math.sin(3*Math.PI*t)*Math.cos(T*81.0);
}
function pegX(p){ return postLx+p.tx*(postRx-postLx); }

/* ---------------------------------------------------------------- item */
function makeItem(kind,cx,cy,opts){
  opts=opts||{};
  var K=KINDS[kind];
  var nx=K.nx, ny=K.ny;
  if(SMALL){ nx=Math.max(3,nx-2); ny=Math.max(4,ny-2); }
  var s=SP*K.sc;
  var mask=new Uint8Array(nx*ny);
  var i,j;
  for(j=0;j<ny;j++)for(i=0;i<nx;i++){
    var ok=1;
    if(K.shirt){ if(j>2 && (i<2||i>nx-3)) ok=0; }
    mask[j*nx+i]=ok;
  }
  var idx=new Int32Array(nx*ny).fill(-1), n=0;
  for(j=0;j<ny;j++)for(i=0;i<nx;i++) if(mask[j*nx+i]) idx[j*nx+i]=n++;
  var px=new Float32Array(n),py=new Float32Array(n),pz=new Float32Array(n);
  var ox=new Float32Array(n),oy=new Float32Array(n),oz=new Float32Array(n);
  var ax=new Float32Array(n),ay=new Float32Array(n),az=new Float32Array(n);
  var seam=new Uint8Array(n);
  for(j=0;j<ny;j++)for(i=0;i<nx;i++){
    var k=idx[j*nx+i]; if(k<0)continue;
    px[k]=cx+(i-(nx-1)/2)*s; py[k]=cy+(j-(ny-1)/2)*s; pz[k]=(Math.random()-0.5)*1.4;
    ox[k]=px[k]; oy[k]=py[k]; oz[k]=pz[k];
    var edge = (i===0||i===nx-1||j===0||j===ny-1) ||
               !mask[j*nx+Math.max(0,i-1)]||!mask[j*nx+Math.min(nx-1,i+1)]||
               !mask[Math.max(0,j-1)*nx+i]||!mask[Math.min(ny-1,j+1)*nx+i];
    seam[k]=edge?1:0;
  }
  var ca=[],cb=[],cr=[],ctp=[];
  function link(i1,j1,i2,j2,type){
    if(i2<0||i2>=nx||j2<0||j2>=ny)return;
    var a=idx[j1*nx+i1],b=idx[j2*nx+i2]; if(a<0||b<0)return;
    ca.push(a); cb.push(b); ctp.push(type);
    cr.push(Math.hypot(px[a]-px[b],py[a]-py[b]));
  }
  for(j=0;j<ny;j++)for(i=0;i<nx;i++){
    if(!mask[j*nx+i])continue;
    link(i,j,i+1,j,0); link(i,j,i,j+1,0);
    link(i,j,i+1,j+1,1); link(i,j,i+1,j-1,1);
    link(i,j,i+2,j,2); link(i,j,i,j+2,2);
  }
  var quads=[];
  for(j=0;j<ny-1;j++)for(i=0;i<nx-1;i++){
    var a=idx[j*nx+i],b=idx[j*nx+i+1],c=idx[(j+1)*nx+i+1],d=idx[(j+1)*nx+i];
    if(a<0||b<0||c<0||d<0)continue;
    quads.push(a,b,c,d);
  }
  var nq=quads.length/4;
  var it={
    kind:kind,K:K,nx:nx,ny:ny,s:s,n:n,idx:idx,mask:mask,seam:seam,
    px:px,py:py,pz:pz,ox:ox,oy:oy,oz:oz,ax:ax,ay:ay,az:az,
    ca:new Int32Array(ca),cb:new Int32Array(cb),cr:new Float32Array(cr),ct:new Uint8Array(ctp),
    quads:new Int32Array(quads),nq:nq,
    qn:new Float32Array(nq*3),qc:new Float32Array(nq*3),qa:new Float32Array(nq),
    qp:new Float32Array(nq*3),
    area:nq*s*s, water:(opts.water===undefined?1:opts.water),
    faded:!!opts.faded, permanent:!!opts.permanent,
    nodeMass:1, invM:1, bend:0.1, load:1, crackCool:0, dripCool:0, exposure:0, col:null
  };
  updatePhys(it);
  for(var q=0;q<nq*3;q++) it.qp[q]=0;
  return it;
}
function updatePhys(it){
  var w=it.water;
  it.nodeMass = it.K.m*(0.55+2.05*w);
  it.invM = 1/it.nodeMass;
  it.bend = it.faded ? 0.55 : (0.055+0.34*(1-w));
  it.load = it.K.m*it.n*(0.5+1.6*w)*0.014;
  var base = it.faded ? [[0xef,0xec,0xe0],[0xe0,0xdc,0xd0],[0xbf,0xc7,0xcd]] : null;
  var c0,c1,c2;
  if(base){ c0=base[0];c1=base[1];c2=base[2]; }
  else { c0=mix(WET[0],DRY[0],1-w); c1=mix(WET[1],DRY[1],1-w); c2=mix(WET[2],DRY[2],1-w); }
  it.col=[rgb(c0),rgb(c1),rgb(c2)];
}

/* ---------------------------------------------------------------- geometry */
function computeGeom(it,full){
  var px=it.px,py=it.py,pz=it.pz,Q=it.quads,qn=it.qn,qa=it.qa,qc=it.qc;
  for(var q=0;q<it.nq;q++){
    var a=Q[q*4],b=Q[q*4+1],c=Q[q*4+2],d=Q[q*4+3];
    var ux=px[c]-px[a],uy=py[c]-py[a],uz=pz[c]-pz[a];
    var vx=px[d]-px[b],vy=py[d]-py[b],vz=pz[d]-pz[b];
    var nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    var L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1e-6;
    qn[q*3]=nx/L; qn[q*3+1]=ny/L; qn[q*3+2]=nz/L;
    qa[q]=0.5*L;
    if(full){
      qc[q*3]=(px[a]+px[b]+px[c]+px[d])*0.25;
      qc[q*3+1]=(py[a]+py[b]+py[c]+py[d])*0.25;
      qc[q*3+2]=(pz[a]+pz[b]+pz[c]+pz[d])*0.25;
    }
  }
}

/* ---------------------------------------------------------------- physics */
function applyWind(it,dt){
  var px=it.px,py=it.py,pz=it.pz,ox=it.ox,oy=it.oy,oz=it.oz,Q=it.quads,qn=it.qn,qa=it.qa;
  var ax=it.ax,ay=it.ay,az=it.az;
  for(var i=0;i<it.n;i++){ ax[i]=0; ay[i]=0; az[i]=0; }
  var inv=1/Math.max(dt,1e-5);
  for(var q=0;q<it.nq;q++){
    var a=Q[q*4],b=Q[q*4+1],c=Q[q*4+2],d=Q[q*4+3];
    var cx=(px[a]+px[b]+px[c]+px[d])*0.25, cy=(py[a]+py[b]+py[c]+py[d])*0.25;
    var eddy=1+0.32*Math.sin(cx*0.021+T*3.1)*Math.sin(cy*0.017-T*2.2)+0.16*Math.sin(cx*0.061-T*5.4);
    var sp=windSpeed*eddy;
    var wx=wdx*sp, wy=wdy*sp, wz=wdz*sp;
    var vx=((px[a]-ox[a])+(px[b]-ox[b])+(px[c]-ox[c])+(px[d]-ox[d]))*0.25*inv;
    var vy=((py[a]-oy[a])+(py[b]-oy[b])+(py[c]-oy[c])+(py[d]-oy[d]))*0.25*inv;
    var vz=((pz[a]-oz[a])+(pz[b]-oz[b])+(pz[c]-oz[c])+(pz[d]-oz[d]))*0.25*inv;
    var rx=wx-vx, ry=wy-vy, rz=wz-vz;
    var nx=qn[q*3],ny=qn[q*3+1],nz=qn[q*3+2];
    var dn=nx*rx+ny*ry+nz*rz;
    var f=KWIND*qa[q]*dn*Math.abs(dn)*0.25;
    var fx=f*nx, fy=f*ny, fz=f*nz;
    ax[a]+=fx;ay[a]+=fy;az[a]+=fz; ax[b]+=fx;ay[b]+=fy;az[b]+=fz;
    ax[c]+=fx;ay[c]+=fy;az[c]+=fz; ax[d]+=fx;ay[d]+=fy;az[d]+=fz;
  }
}
function integrate(it,dt){
  var px=it.px,py=it.py,pz=it.pz,ox=it.ox,oy=it.oy,oz=it.oz,ax=it.ax,ay=it.ay,az=it.az;
  var dmp=0.9935, im=it.invM, dt2=dt*dt;
  for(var i=0;i<it.n;i++){
    var vx=(px[i]-ox[i])*dmp, vy=(py[i]-oy[i])*dmp, vz=(pz[i]-oz[i])*dmp;
    ox[i]=px[i]; oy[i]=py[i]; oz[i]=pz[i];
    px[i]+=vx+ax[i]*im*dt2;
    py[i]+=vy+(ay[i]*im+G)*dt2;
    pz[i]+=vz+az[i]*im*dt2;
    if(pz[i]>760)pz[i]=760; if(pz[i]<-620)pz[i]=-620;

}
function solve(it){
  var px=it.px,py=it.py,pz=it.pz,ca=it.ca,cb=it.cb,cr=it.cr,ct=it.ct;
  var bend=it.bend, m=ca.length;

    var dx=px[b]-px[a],dy=py[b]-py[a],dz=pz[b]-pz[a];
    var d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d<1e-6)continue;
    var f=((d-rest)/d)*0.5*st;
    dx*=f;dy*=f;dz*=f;

}
function collide(it,last){

    var x=px[i];

      var ly=lineY(x);
      var dy=py[i]-ly, dz=pz[i];
      var r=Math.sqrt(dy*dy+dz*dz);
      if(r<LINE_R){
        if(r<1e-4){ py[i]=ly+LINE_R; }
        else{ var s=LINE_R/r; py[i]=ly+dy*s; pz[i]=dz*s; }

      }
    }
    if(py[i]>groundY){
      py[i]=groundY;
      ox[i]+=(px[i]-ox[i])*0.55;
      oz[i]+=(pz[i]-oz[i])*0.55;
    }
    if(px[i]<6){px[i]=6; ox[i]=px[i]+(ox[i]-px[i])*0.3;}
    if(px[i]>W-6){px[i]=W-6; ox[i]=px[i]+(ox[i]-px[i])*0.3;}
  }
}
function applyPins(it,last){
  for(var i=0;i<pegs.length;i++){
    var p=pegs[i]; if(p.item!==it)continue;
    var x=pegX(p), y=lineY(x)+1.5;
    var k=p.node;
    var t=Math.hypot(it.px[k]-x,it.py[k]-y,it.pz[k]);
    it.px[k]=x; it.py[k]=y; it.pz[k]=0;
    it.ox[k]=x; it.oy[k]=y; it.oz[k]=0;
    if(last&&!p.permanent){
      var thr=p.strong?7.5:2.6;
      p.stress += Math.max(0,t-thr)*0.055;

    }
  }
  if(grabbed&&grabbed.item===it){
    var g=grabbed, gk=g.node;
    it.px[gk]+= (g.x-it.px[gk])*0.55;
    it.py[gk]+= (g.y-it.py[gk])*0.55;
    it.pz[gk]+= (0-it.pz[gk])*0.35;
  }
}

/* ---------------------------------------------------------------- drying */
var occ=Object.create(null);
function dryingPass(dt){
  occ=Object.create(null);
  var CELL=22, it,q,key;
  for(var a=0;a<items.length;a++){
    it=items[a];
    for(q=0;q<it.nq;q++){
      var cx=it.qc[q*3],cy=it.qc[q*3+1],cz=it.qc[q*3+2];
      key=((cx/CELL)|0)+','+((cy/CELL)|0);
      var cur=occ[key];
      if(cur===undefined||cz<cur) occ[key]=cz;
    }
  }
  var wf=Math.pow(Math.max(60,windSpeed)/480,0.72);
  for(a=0;a<items.length;a++){
    it=items[a];
    var E=0;
    for(q=0;q<it.nq;q++){
      var cx=it.qc[q*3],cy=it.qc[q*3+1],cz=it.qc[q*3+2];
      key=((cx/CELL)|0)+','+((cy/CELL)|0);
      var mz=occ[key]; var shelter=1;
      if(mz!==undefined&&cz>mz+5) shelter=Math.max(0.12,1-(cz-mz)/70);
      var nz=it.qn[q*3+2],nx=it.qn[q*3],ny=it.qn[q*3+1];
      var face=Math.abs(nx*wdx+ny*wdy+nz*wdz)/Math.sqrt(wdx*wdx+wdy*wdy+wdz*wdz);
      var down=(cy>groundY-8)?0.22:1;
      E+=it.qa[q]*(0.16+0.84*face)*shelter*down;
    }
    it.exposure=E/Math.max(1,it.area);
    if(it.water>0&&!it.faded){
      it.water-=0.0165*it.exposure*wf*(0.28+0.72*it.water)*dt;
      if(it.water<0)it.water=0;
      updatePhys(it);
      it.dripCool-=dt;
      if(it.water>0.22&&it.dripCool<=0&&Math.random()<it.water*dt*7){
        it.dripCool=0.05;
        var low=0,ly=-1e9;
        for(var i=0;i<it.n;i++) if(it.py[i]>ly){ly=it.py[i];low=i;}
        if(ly<groundY-12) drips.push({x:it.px[low],y:ly+1,z:it.pz[low],vx:(it.px[low]-it.ox[low])*40,vy:0});
      }
    }
  }
}

/* ---------------------------------------------------------------- audio */
var A={ctx:null,on:true,ready:false};
try{ A.on = localStorage.getItem('hebron_line_mute')!=='1'; }catch(e){}
function initAudio(){
  if(A.ctx)return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{
    A.ctx=new C();
    A.master=A.ctx.createGain(); A.master.gain.value=A.on?0.85:0; A.master.connect(A.ctx.destination);
    var sr=A.ctx.sampleRate, len=sr*2;
    var buf=A.ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    A.noise=buf;
    var s1=A.ctx.createBufferSource(); s1.buffer=buf; s1.loop=true;
    A.wf=A.ctx.createBiquadFilter(); A.wf.type='bandpass'; A.wf.Q.value=0.75; A.wf.frequency.value=430;
    A.wg=A.ctx.createGain(); A.wg.gain.value=0.0;
    s1.connect(A.wf); A.wf.connect(A.wg); A.wg.connect(A.master); s1.start();
    var s2=A.ctx.createBufferSource(); s2.buffer=buf; s2.loop=true;
    A.lf=A.ctx.createBiquadFilter(); A.lf.type='lowpass'; A.lf.frequency.value=170; A.lf.Q.value=0.6;
    A.lg=A.ctx.createGain(); A.lg.gain.value=0.0;

}
function burst(freq,Q,dur,amp,type){
  if(!A.ready||!A.on)return;

  var s=c.createBufferSource(); s.buffer=A.noise;

  var f=c.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=Q;
  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);

  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

}
function crack(hz,amp){ burst(hz,1.5,0.13+240/hz*0.001,Math.min(0.5,amp),'bandpass'); if(hz<260) burst(hz*0.5,1.0,0.2,amp*0.5,'lowpass'); }
function clack(){ burst(1750,7,0.035,0.32); setTimeout(function(){burst(1150,6,0.05,0.2);},22); }
function thrum(amp){

  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.28,amp),t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);
  var g2=c.createGain(); g2.gain.value=0.34;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(A.master);

function setMute(m){
  A.on=!m;
  try{localStorage.setItem('hebron_line_mute',m?'1':'0');}catch(e){}

/* ---------------------------------------------------------------- step */
function stepWind(dt){
  T+=dt;
  var surge=0.52*Math.sin(T*0.29)+0.30*Math.sin(T*0.131+1.7)+0.18*Math.sin(T*0.78+0.4);
  gustTimer-=dt;
  if(gustTimer<=0){
    gustTimer=1.5+Math.random()*4.2;
    gustTarget=(Math.random()<0.5)?MEAN*(0.28+Math.random()*0.40):0;
  }
  gustExtra+=(gustTarget-gustExtra)*Math.min(1,dt*(gustTarget>gustExtra?3.4:1.4));
  windSpeed=Math.max(120,MEAN*(1+0.26*surge)+gustExtra);
  wdx=0.30+0.22*Math.sin(T*0.87)+0.09*Math.sin(T*2.3);
  wdy=-0.05+0.07*Math.sin(T*1.61);
  wdz=1.0;
  var dv=(windSpeed-prevSpeed)/Math.max(dt,1e-4);
  if(dv>1100&&lineThV<0.4){ lineThV=Math.min(3.4,dv/900); thrum(0.07+Math.min(0.2,dv/9000)); shedDrops(); }
  prevSpeed=windSpeed;
  lineTh+=lineThV*dt*8; lineThV*=Math.pow(0.06,dt); lineTh*=Math.pow(0.09,dt);
  if(A.ready){
    var w=(windSpeed-120)/700;
    A.wf.frequency.setTargetAtTime(320+w*760,A.ctx.currentTime,0.08);
    A.wg.gain.setTargetAtTime(0.020+w*0.085,A.ctx.currentTime,0.10);
    A.lg.gain.setTargetAtTime(0.010+w*0.055,A.ctx.currentTime,0.14);
  }
}
function shedDrops(){
  for(var i=0;i<pegs.length;i++){
    var p=pegs[i]; if(p.item.water<0.25)continue;
    if(Math.random()<0.55){
      var x=pegX(p);
      drips.push({x:x+(Math.random()-0.5)*10,y:lineY(x)+2,z:0,vx:windSpeed*0.16,vy:0});
    }
  }
}
function physics(dt){
  var sub=2, h=dt/sub;
  for(var s=0;s<sub;s++){
    for(var a=0;a<items.length;a++){
      var it=items[a];
      computeGeom(it,false);
      applyWind(it,h);
      integrate(it,h);
      for(var k=0;k<3;k++){
        solve(it);
        applyPins(it,s===sub-1&&k===2);
        collide(it);
      }
    }
  }
  /* pegs that pulled through */
  for(var i=pegs.length-1;i>=0;i--){
    if(pegs[i].pop){
      var x=pegX(pegs[i]);
      fallenPegs.push({x:x+(Math.random()-0.5)*30,y:groundY+4+Math.random()*(H-groundY-14),r:Math.random()*3});
      pegs.splice(i,1);
      crack(560,0.34); burst(1400,5,0.05,0.22);
    }
  }
}
function stepParticles(dt){
  for(var i=drips.length-1;i>=0;i--){
    var d=drips[i];
    d.vy+=G*dt*0.9; d.vx+=(windSpeed*wdx*0.55-d.vx)*dt*1.6;
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.y>=groundY){
      marks.push({x:d.x,y:groundY+Math.random()*(H-groundY)*0.35,r:3+Math.random()*5,a:0.30});
      if(marks.length>170) marks.shift();
      drips.splice(i,1);
    } else if(d.x<-40||d.x>W+40) drips.splice(i,1);
  }
  for(i=marks.length-1;i>=0;i--){ marks[i].a-=dt*0.012; if(marks[i].a<=0) marks.splice(i,1); }
}
function crackPass(dt){
  for(var a=0;a<items.length;a++){
    var it=items[a]; it.crackCool-=dt;
    var acc=0,tot=0;
    for(var q=0;q<it.nq;q++){
      var dx=it.qn[q*3]-it.qp[q*3], dy=it.qn[q*3+1]-it.qp[q*3+1], dz=it.qn[q*3+2]-it.qp[q*3+2];
      var m=Math.sqrt(dx*dx+dy*dy+dz*dz);
      acc+=m*it.qa[q]; tot+=it.qa[q];
      it.qp[q*3]=it.qn[q*3]; it.qp[q*3+1]=it.qn[q*3+1]; it.qp[q*3+2]=it.qn[q*3+2];
    }
    var rate=(acc/Math.max(1,tot))/Math.max(dt,1e-4);
    if(rate>7.2&&it.crackCool<=0&&!it.faded){
      it.crackCool=0.16+Math.random()*0.22;
      crack(it.K.hz*(0.85+Math.random()*0.3), Math.min(0.42,0.06+(rate-7)*0.03));
    }
  }
}

/* ---------------------------------------------------------------- render */
var QP=[],qpN=0;
function getQ(){ if(qpN<QP.length) return QP[qpN++]; var o={}; QP.push(o); qpN++; return o; }
var LX=0.46,LY=-0.78,LZ=0.43;
function proj(x,y,z){
  var f=1500/(1500-Math.max(-900,Math.min(900,z)));
  return [cxc+(x-cxc)*f, cyc+(y-cyc)*f];
}
function draw(){
  ctx.drawImage(bg,0,0,W,H);
  /* wet grass */
  for(var i=0;i<marks.length;i++){
    var m=marks[i];
    ctx.fillStyle='rgba(78,78,52,'+m.a.toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(m.x,m.y,m.r,m.r*0.42,0,0,6.2832); ctx.fill();
  }
  /* fallen pegs */
  for(i=0;i<fallenPegs.length;i++){
    var fp=fallenPegs[i];
    ctx.save(); ctx.translate(fp.x,fp.y); ctx.rotate(fp.r);
    ctx.fillStyle='rgba(58,58,36,0.34)'; ctx.fillRect(-3,4,11,3);
    ctx.fillStyle=rgb(PINE); ctx.fillRect(-4,-2,10,4);
    ctx.fillStyle=rgb(mix(PINE,[0x7a,0x5a,0x30],0.4)); ctx.fillRect(-4,-2,10,1.2);
    ctx.restore();
  }
  /* item ground shadows */
  for(i=0;i<items.length;i++){
    var it=items[i];
    var minx=1e9,maxx=-1e9,cy=0;
    for(var k=0;k<it.n;k++){ if(it.px[k]<minx)minx=it.px[k]; if(it.px[k]>maxx)maxx=it.px[k]; cy+=it.py[k]; }
    cy/=it.n;
    var w=(maxx-minx)*0.46, cx=(minx+maxx)*0.5+(groundY-cy)*0.30;
    var alpha=Math.max(0,Math.min(0.30,0.30-(groundY-cy)/(H*1.5)));
    if(alpha>0.01&&w>2){
      ctx.fillStyle='rgba(56,56,34,'+alpha.toFixed(3)+')';
      ctx.beginPath(); ctx.ellipse(cx,groundY+(groundY-cy)*0.055+5,w,Math.max(3,w*0.10),0,0,6.2832); ctx.fill();
    }
  }
  drawPole();
  drawCrateAndBasket();

  /* gather quads */
  qpN=0; var list=[];
  for(i=0;i<items.length;i++){
    var itm=items[i];
    computeGeom(itm,true);
    for(var q=0;q<itm.nq;q++){
      var o=getQ();
      o.it=itm; o.q=q; o.z=itm.qc[q*3+2];
      list.push(o);
    }
  }
  list.sort(function(a,b){return a.z-b.z;});
  var split=0; while(split<list.length&&list[split].z<0) split++;
  for(i=0;i<split;i++) paintQuad(list[i]);
  drawLine();
  for(i=split;i<list.length;i++) paintQuad(list[i]);
  drawPegs();
  /* drips */
  ctx.fillStyle='rgba(120,138,152,0.9)';
  for(i=0;i<drips.length;i++){
    var d=drips[i], p=proj(d.x,d.y,d.z);
    ctx.fillRect(p[0]-0.9,p[1]-3,1.8,4.2);
  }
  drawMute();
}
function paintQuad(o){
  var it=o.it,q=o.q,Q=it.quads,px=it.px,py=it.py,pz=it.pz;
  var a=Q[q*4],b=Q[q*4+1],c=Q[q*4+2],d=Q[q*4+3];
  var lam=Math.abs(it.qn[q*3]*LX+it.qn[q*3+1]*LY+it.qn[q*3+2]*LZ);
  var ci = lam>0.70?0 : (lam>0.34?1:2);
  ctx.fillStyle=it.col[ci]; ctx.strokeStyle=it.col[ci]; ctx.lineWidth=1;
  var A=proj(px[a],py[a],pz[a]),B=proj(px[b],py[b],pz[b]),C=proj(px[c],py[c],pz[c]),D=proj(px[d],py[d],pz[d]);
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.lineTo(D[0],D[1]); ctx.closePath();
  ctx.fill(); ctx.stroke();
}
function drawLine(){
  ctx.strokeStyle='#5c666c'; ctx.lineWidth=2.0;
  ctx.beginPath();
  var step=Math.max(4,(postRx-postLx)/220);
  for(var x=postLx;x<=postRx;x+=step){ var y=lineY(x); if(x===postLx)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.lineTo(postRx,lineY(postRx)); ctx.stroke();
  ctx.strokeStyle='#c2c9cd'; ctx.lineWidth=0.8;
  ctx.beginPath();
  for(x=postLx;x<=postRx;x+=step){ y=lineY(x)-0.8; if(x===postLx)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();
}
function drawPegs(){
  for(var i=0;i<pegs.length;i++){
    var p=pegs[i], x=pegX(p), y=lineY(x);
    ctx.save(); ctx.translate(x,y);
    var st=Math.min(1,p.stress);
    ctx.fillStyle='rgba(46,46,30,0.30)'; ctx.fillRect(-3.4,-8.6,7,17.5);
    ctx.fillStyle=rgb(mix(PINE,[0xf0,0xd8,0xb2],0.25)); ctx.fillRect(-3.4,-9,6.8,17);
    ctx.fillStyle=rgb(mix(PINE,[0x74,0x54,0x2c],0.45+0.3*st));
    ctx.fillRect(1.0,-9,2.4,17);
    ctx.fillRect(-3.4,-1.2,6.8,1.3);
    ctx.strokeStyle='#8d979d'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.arc(0,0.2,3.9,-0.5,3.6); ctx.stroke();
    ctx.restore();
  }
}
function drawPole(){
  var w=Math.max(5,SP*0.36);

    var top=Math.min(ty,ly);
    ctx.fillStyle='rgba(56,56,34,0.30)';

    ctx.moveTo(poleX-w*0.5,groundY); ctx.lineTo(poleX+w*0.5,groundY);
    ctx.lineTo(poleX+w*0.5+(groundY-top)*0.30,groundY+(groundY-top)*0.075);
    ctx.lineTo(poleX-w*0.5+(groundY-top)*0.30,groundY+(groundY-top)*0.075);

    ctx.fillStyle=rgb(mix(PINE,[0x7a,0x58,0x2e],0.42)); ctx.fillRect(poleX+w*0.12,top-2,w*0.38,groundY-top+4);
    ctx.fillStyle=rgb(mix(PINE,[0xff,0xf0,0xd4],0.35)); ctx.fillRect(poleX-w*0.5,top-2,w*0.22,groundY-top+4);

    ctx.beginPath(); ctx.moveTo(poleX-w*0.5,top-2); ctx.lineTo(poleX,top+5); ctx.lineTo(poleX+w*0.5,top-2); ctx.closePath(); ctx.fill();
  } else {

    ctx.strokeStyle=rgb(PINE); ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(tx,ty2); ctx.stroke();
    ctx.strokeStyle=rgb(mix(PINE,[0x7a,0x58,0x2e],0.42)); ctx.lineWidth=w*0.34;
    ctx.beginPath(); ctx.moveTo(bx+w*0.28,by); ctx.lineTo(tx+w*0.28,ty2); ctx.stroke();
  }
}
function basketRect(){
  var bw=Math.max(96,Math.min(210,W*0.20)), bh=bw*0.44;
  var x=Math.max(14,W*0.14), y=H-bh-Math.max(10,H*0.035);
  return {x:x,y:y,w:bw,h:bh};
}
function drawCrateAndBasket(){
  var b=basketRect();
  var cw=b.w*1.22, ch=b.h*0.62, cx=b.x+b.w*0.5-cw*0.5, cy=b.y+b.h-4;
  ctx.fillStyle='rgba(56,56,34,0.32)';
  ctx.fillRect(cx+ch*0.32,cy+ch-2,cw,Math.max(4,ch*0.20));
  /* crate (grey, weathered) */
  ctx.fillStyle='#8d959b'; ctx.fillRect(cx,cy,cw,ch);
  ctx.fillStyle='#727b81'; ctx.fillRect(cx,cy+ch*0.42,cw,ch*0.10);
  ctx.fillStyle='#a6aeb3'; ctx.fillRect(cx,cy,cw,ch*0.09);
  ctx.fillStyle='#6a7378'; ctx.fillRect(cx,cy,ch*0.16,ch);
  ctx.fillStyle='#6a7378'; ctx.fillRect(cx+cw-ch*0.16,cy,ch*0.16,ch);
  /* basket */
  ctx.fillStyle='#b8bec2'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#9aa2a7';
  for(var i=1;i<7;i++) ctx.fillRect(b.x+b.w*i/7,b.y,Math.max(1,b.w*0.012),b.h);
  for(i=1;i<3;i++) ctx.fillRect(b.x,b.y+b.h*i/3,b.w,Math.max(1,b.h*0.05));
  ctx.fillStyle='#d3d8da'; ctx.fillRect(b.x-3,b.y-4,b.w+6,5);
  ctx.fillStyle='#788186'; ctx.fillRect(b.x,b.y+b.h-3,b.w,3);
  /* wash still in it */
  var rem=BASKET.length;
  for(i=0;i<rem;i++){
    var t=i/Math.max(1,rem);
    var lx=b.x+6+((i*37)%Math.max(1,(b.w-24))), ly=b.y-2-i*Math.min(5,b.h*0.10);
    if(ly<b.y-b.h*0.62) ly=b.y-b.h*0.62-((i%3)*2);
    ctx.fillStyle=rgb(mix(WET[0],WET[1],(i%3)/2));
    ctx.beginPath();
    ctx.ellipse(lx+8,ly,10+(i%3)*4,5+(i%2)*2,(i%5)*0.2,0,6.2832);
    ctx.fill();
    ctx.fillStyle=rgb(WET[2]);
    ctx.beginPath();
    ctx.ellipse(lx+8,ly+3,8+(i%3)*3,2.2,(i%5)*0.2,0,6.2832);
    ctx.fill();
  }
  /* pine peg heap on the crate corner */
  for(i=0;i<7;i++){
    var px2=cx+cw-16-((i*7)%22), py2=cy-4-((i*3)%6);
    ctx.save(); ctx.translate(px2,py2); ctx.rotate((i*1.7)%3.14);
    ctx.fillStyle=rgb(mix(PINE,[0x90,0x6c,0x3c],(i%3)*0.18));
    ctx.fillRect(-5,-1.6,10,3.2); ctx.restore();
  }
}
function drawMute(){
  var x=W-22,y=H-22;
  ctx.save();
  ctx.strokeStyle=A.on?'rgba(201,154,94,0.85)':'rgba(201,154,94,0.42)';
  ctx.fillStyle=A.on?'rgba(201,154,94,0.85)':'rgba(0,0,0,0)';
  ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x,y,4.2,0,6.2832); if(A.on)ctx.fill(); else ctx.stroke();
  if(A.on){
    ctx.beginPath(); ctx.arc(x,y,7.6,-0.9,0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,10.8,-0.8,0.8); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x-7,y-7); ctx.lineTo(x+7,y+7); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------------------------------------------------------- input */
function pos(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left),y:(e.clientY-r.top)};
}
function nearestNode(it,x,y){
  var best=-1,bd=1e9;
  for(var i=0;i<it.n;i++){
    var f=1500/(1500-Math.max(-900,Math.min(900,it.pz[i])));
    var sx=cxc+(it.px[i]-cxc)*f, sy=cyc+(it.py[i]-cyc)*f;
    var d=(sx-x)*(sx-x)+(sy-y)*(sy-y);
    if(d<bd){bd=d;best=i;}
  }
  return {i:best,d:Math.sqrt(bd)};
}
function hitItem(x,y){
  var bestIt=null,bestN=-1,bd=1e9;
  for(var a=items.length-1;a>=0;a--){
    var r=nearestNode(items[a],x,y);
    var lim=items[a].s*0.95+8;
    if(r.d<lim&&r.d<bd){bd=r.d;bestIt=items[a];bestN=r.i;}
  }
  return bestIt?{item:bestIt,node:bestN,d:bd}:null;
}
function isDoubled(it,node){
  var x=it.px[node],y=it.py[node],z=it.pz[node];
  for(var i=0;i<it.n;i++){
    if(i===node)continue;
    if(Math.abs(it.px[i]-x)<it.s*0.6&&Math.abs(it.py[i]-y)<it.s*0.6&&Math.abs(it.pz[i]-z)<it.s*1.4) return true;
  }
  return false;
}
function placePeg(it,node){
  var x=it.px[node];
  if(x<postLx-6||x>postRx+6) return false;
  var ly=lineY(x);
  if(Math.abs(it.py[node]-ly)>SP*2.2||Math.abs(it.pz[node])>SP*2.4) return false;
  for(var i=0;i<pegs.length;i++) if(pegs[i].item===it&&pegs[i].node===node) return false;
  var strong = it.seam[node]===1 || isDoubled(it,node);
  pegs.push({item:it,node:node,tx:(x-postLx)/(postRx-postLx),stress:0,strong:strong,permanent:false});
  clack();
  return true;
}
function pegNear(x,y){
  for(var i=0;i<pegs.length;i++){
    var p=pegs[i];
    var pxp=pegX(p),pyp=lineY(pxp);
    if(Math.abs(pxp-x)<11&&Math.abs(pyp-y)<14) return i;
  }
  return -1;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  initAudio(); if(A.ctx&&A.ctx.state==='suspended') A.ctx.resume();
  var p=pos(e);
  down={x:p.x,y:p.y,t:performance.now(),moved:0};
  cv.classList.add('grabbing');
  /* mute glyph */
  if(Math.hypot(p.x-(W-22),p.y-(H-22))<20){ setMute(A.on); down.mode='mute'; return; }
  /* cloth */
  var h=hitItem(p.x,p.y);
  if(h){ grabbed={item:h.item,node:h.node,x:p.x,y:p.y}; down.mode='cloth'; return; }
  /* pole */
  var poleHit=false;
  if(poleActive){ if(Math.abs(p.x-poleX)<18&&p.y>groundY-poleLen-10&&p.y<groundY+10) poleHit=true; }
  else { if(p.x>postRx-24&&p.x<postRx+40&&p.y>postTopY+20&&p.y<groundY+18) poleHit=true; }
  if(poleHit){ grabPole=true; poleActive=true; poleX=Math.max(postLx+18,Math.min(postRx+40,p.x)); down.mode='pole'; return; }
  /* basket */
  var b=basketRect();
  if(p.x>b.x-14&&p.x<b.x+b.w+14&&p.y>b.y-b.h*0.8&&p.y<b.y+b.h+14&&BASKET.length){
    var kind=BASKET.pop();
    var it=makeItem(kind,p.x,Math.min(p.y,H-40),{water:1});
    items.push(it);
    var r=nearestNode(it,p.x,p.y);
    grabbed={item:it,node:r.i,x:p.x,y:p.y};
    down.mode='cloth';
    return;
  }
  down.mode='none';
});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);
  if(down){ down.moved=Math.max(down.moved,Math.hypot(p.x-down.x,p.y-down.y)); }
  if(grabbed){ grabbed.x=p.x; grabbed.y=Math.min(p.y,groundY+ (H-groundY)*0.5); }
  if(grabPole){ poleX=Math.max(postLx-30,Math.min(W-10,p.x)); }
});
function endPointer(e){
  var p=pos(e);
  cv.classList.remove('grabbing');
  if(down&&down.mode==='cloth'&&down.moved<8&&performance.now()-down.t<520){
    var pi=pegNear(p.x,p.y);
    if(pi>=0&&!pegs[pi].permanent){ 
      var xx=pegX(pegs[pi]);
      fallenPegs.push({x:xx+(Math.random()-0.5)*24,y:groundY+8+Math.random()*(H-groundY-18),r:Math.random()*3});
      pegs.splice(pi,1); clack();
    } else if(grabbed){
      var g=grabbed;
      var r=nearestNode(g.item,p.x,p.y);
      placePeg(g.item,r.i);
    }
  }
  if(grabPole){
    if(poleX<postLx+14||poleX>postRx-14) poleActive=false;
  }
  grabbed=null; grabPole=false; down=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',function(e){grabbed=null;grabPole=false;down=null;cv.classList.remove('grabbing');});
window.addEventListener('keydown',function(e){ if(e.key==='m'||e.key==='M'){ initAudio(); setMute(A.on); } });
window.addEventListener('resize',function(){ resize(); });

/* ---------------------------------------------------------------- boot */
resize();
/* one thing already up, out at the far end. */
(function(){
  var s=makeItem('sock', postRx-Math.max(34,SP*3.4), postTopY+SP*2.2, {water:0,faded:true,permanent:true});
  s.water=0; updatePhys(s); s.bend=0.55;
  items.push(s);
  var top=s.idx[0*s.nx+((s.nx-1)>>1)];
  var x=s.px[top];
  pegs.push({item:s,node:top,tx:(x-postLx)/(postRx-postLx),stress:0,strong:true,permanent:true});
  for(var i=0;i<s.n;i++){ s.py[i]-= (s.py[top]-lineY(x)); s.oy[i]=s.py[i]; }
})();

var last=performance.now(), acc=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  stepWind(dt);
  physics(dt);
  for(var a=0;a<items.length;a++) computeGeom(items[a],true);
  dryingPass(dt);
  crackPass(dt);
  stepParticles(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
