  <meta name="outbox-spec-era" content="Spring 1999, at the exact crest of the American yo-yo boom — the eight months when two companies had demonstrators driving rented minivans between four school assemblies a day, when a ball-bearing transaxle model was $29.99 at a mall cart and a wooden fixed-axle was $3.99 at a drugstore, and when the only thing three hundred kids on a gym floor actually wanted to see was one throw held long enough to do something inside it. The setting is a middle-school gymnasium in Lubbock, Texas, with the bleachers folded out on one side only, a folding table of stock by the double doors, and the 9:40 assembly coming in while the 8:15 is still going out. Not a look-back, not a memory of a fad, not anybody's childhood: the demonstrator has two more schools today, a box of 96 to move before the district's PO closes on Friday, and a voice that is already going.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY that is one yo-yo, one string and one hand, filling the whole frame: a straight-on view of a throw from about waist height, the yo-yo at the bottom of ten inches of doubled cotton, the gym floor a few inches below it, and nothing else on the page. You play it with a single continuous gesture — DRAG DOWN AND RELEASE to throw, and the speed, the straightness and the length of that drag set the entire rest of the throw, because everything that happens afterward is spent spin. While it is sleeping you TUG to bring it back, TILT by dragging sideways to swing it, PINCH the string by pressing and holding anywhere along its length (which is how every trick in the piece is actually made — the string is a real line you can touch at any point, and putting a finger on it at the right height makes a loop the yo-yo can be dropped into), and you can LET IT DIE, which it will do on its own in a few seconds if you do nothing. There is no trick list, no menu, no level select, no score screen and no scroll: one yo-yo, one string that is getting worse, and about four and a half seconds of spin to spend.">
  <meta name="outbox-spec-subject" content="The flat mechanics of sleeper-based yo-yo play, which is entirely a spin-budget problem and has nothing to do with dexterity. That SPIN TIME IS THE ONLY CURRENCY ON THE PAGE: a throw generates a fixed amount of angular momentum and every single thing done afterward — every swing, every string contact, every loop dropped into — takes some of it back, so a trick is not a shape you make, it is a purchase, and the question is never 'can I do it' but 'is there enough left'. That the throw comes off a WRIST SNAP AND NOT AN ARM: the yo-yo is accelerated over about eight inches of string and then the string runs out, so the useful work is done in the first fraction of the drop and a long slow arm throw with the same total distance puts measurably less spin on it than a short fast wrist one, which is why the biggest kid in the gym throws worst. That a CROOKED THROW COSTS MORE THAN A SLOW ONE: a yo-yo thrown off-plane precesses, the string rubs the inside of one half instead of riding free in the gap, and friction takes the spin at several times the rate of a clean throw, so a bad throw is not a shorter throw, it is a completely different order of magnitude. That RESPONSE IS THE WHOLE DESIGN TRADE: a fixed-axle wooden yo-yo has its string looped around a bare wooden shaft, so friction is enormous, it sleeps two seconds and comes back on the smallest tug, while a transaxle spins the sleeve on a bearing so the string contacts almost nothing, sleeps four or five times as long, and consequently does not come back at all unless you make it — and every kid who buys the expensive one goes home with a yo-yo that will not return, which is a design consequence and not a defect. That the RETURN IS NOT A PULL, IT IS A BIND: a tug lifts the string off the axle and lets it grab, which converts the remaining spin into climbing, so a yo-yo with plenty of spin comes up hard and one nearly dead does not come up at all and has to be wound by hand, forty-five seconds, in front of everybody. That STRING TENSION IS A REAL ACCUMULATING VARIABLE nobody mentions: the string is two plies twisted together, every throw adds a half-twist in the same direction, and after about thirty throws the loop at the axle has tightened enough to close the gap, the yo-yo starts snagging and returning on its own mid-trick, and the fix is to let it hang and unwind, which takes fifteen seconds and looks like nothing. That STRING LENGTH IS CUT TO THE PERSON: the yo-yo should hang at about navel height, and a string an inch too long means every loop trick lands wrong and the yo-yo taps the floor, which is the single most common problem in a gym full of kids using factory-length string out of the bag. That THE STRING IS THE THING TO WATCH AND NOBODY WATCHES IT — every trick is made by putting a finger against the string at a specific height and the yo-yo simply falls into whatever shape that makes, so the hand holding the yo-yo is doing almost nothing and the other hand is doing all of it. That A SNAGGED STRING IS A BURN: a spinning yo-yo whose string grabs a finger transfers real energy into skin, and the demonstrator's middle finger has a shiny patch on it. That the string is cotton, costs eleven cents, frays at exactly one place — where it crosses the axle — and parts without warning. And the flat arithmetic at the table: four and a half seconds off a good throw, ninety-six units in the box, a PO that has to be in by Friday, and two more schools today.">
  <meta name="outbox-spec-tone" content="The loud, hoarse, call-and-response gym-assembly voice of Dez Pilkington-Aquino, twenty-three, who has been doing four schools a day for eleven weeks and is working a wireless mic that pops on every plosive. He is not narrating and not reflecting — he is WORKING A ROOM, so the register is direct address at volume to three hundred people sitting on a floor, in short punchy units with built-in pauses where a crowd noise goes. He runs everything as a count and a callback: 'On three. One. Two — hands DOWN, hands down — three.' He repeats the same four instructions constantly because the room turns over every forty minutes and he has genuinely said each of them two hundred times this month: watch the string not the yo-yo; it's the wrist; throw it straight or it's dead; nobody winds it for you. He talks to the yo-yo about a third of the time, on mic, and at a specific kid in the third row of bleachers the rest. He is openly, cheerfully selling the entire time and never once pretends otherwise — every few lines he names the table by the double doors, gives a price with cents on it, and says what time he has to pack up. He is hoarse and says so twice, both times as a reason he is going to do a trick instead of explaining it. He gets a call-and-response wrong once, restarts it from the top, and does not comment. He is cheerfully boastful in a specific, priced way: he does not say he is good, he says how many throws he has done since January and how many strings he has gone through. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT a craftsman-sage, NOT a burnt-out-carny, NOT secretly sad about the job, NOT a mentor, NOT charmed by himself, NOT a nineties-nostalgia narrator, and NOT aware of being read.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the yo-yo's own appearance is COMPUTED and never chosen. The ground is sealed gymnasium maple under fluorescents — a warm dry honey (#c8934a) with a hard specular strip where the high windows land, going greyer and duller in the worn lane under the bleachers (#a4834f), with two painted court lines crossing the lower frame in flaking volleyball blue. The yo-yo body is a translucent injection-moulded shell in promotional Duncan blue (#12457e), and it is rendered honestly against its own spin: at high RPM the printed logo on the side face smears into a continuous ring and the sidewall reads a single flat tone, at middling RPM the logo becomes a strobing ghost that appears to rotate backwards at whatever rate the frame timing and the true angular velocity actually produce, and near the end of a sleep it resolves into readable lettering — so THE VISITOR CAN SEE HOW MUCH SPIN IS LEFT BY WHETHER THEY CAN READ THE WORD, and nothing on the page ever says so. The string is real cotton rendered at real diameter: bright and tight and pale (#e8e2d0) when fresh, taking a live per-segment fray value that renders as a fuzzed, thickened, slightly greyed run (#b3ab96) concentrated exactly where it crosses the axle, plus a live twist count that visibly tightens the ply spacing along its whole length. Exactly one chip of sticker fluorescent orange (#f26a1b) is held strictly for the price cards on the folding table at the edge of frame, the foil sticker on the yo-yo's own sidewall, and the tape flag on the demo case — it never appears on the string, the floor, the hand or the body. Flat, hard, high contrast; no glow, no bloom, no motion-blur streaks, no lens flare, no gradients other than honest specular on sealed maple, honest fray, and honest strobing against true RPM.">
  <meta name="outbox-spec-wildcard" content="The last unsold unit in the demo case is a Yomega Brain with a worn centrifugal clutch. The engine gives it exactly the properties a worn Brain has and no others: the clutch springs are fatigued, so instead of releasing at a low RPM it grabs the axle at roughly 2.8 seconds into every single sleep regardless of how good the throw was, and the yo-yo returns to the hand whether or not anything is happening at that moment. It throws, sleeps, binds and winds like any other yo-yo, it is dealt into the case rotation exactly as often as the rest, it is not excluded from any physics, and it cannot be marked, swapped, set aside, adjusted, opened or thrown away by anything the visitor can do — it is the same unit, with the same 2.8 seconds, on every visit. Dez sells one off the table in the middle of the page at a price with cents on it, mentions that this one's clutch is gone and that it is therefore the one he demos with, and never mentions it again.">
  <meta name="outbox-spec-forbidden" content="NO yo-yo-as-metaphor for anything — not what comes back to you, not ups and downs, not tension and release, not the string that connects, not letting go and pulling in, not 'it always returns'; this is angular momentum against a friction term and it has nothing to teach anybody. ABSOLUTELY NO skill-as-discipline sermon: no ten-thousand-hours, no practice-makes, no flow state, no mastery arc, no zen, no mindfulness, no breath, no the-body-knows, no muscle-memory mysticism, no martial-arts framing, no 'the yo-yo teaches patience'. NO nineties nostalgia of any kind: no Pogs, no Tamagotchi, no Furby, no dial-up, no 'remember when', no fad-cycle essay, no 'and by autumn it was over', no hindsight, no foreshadowing past Friday, no camp, no retro-kitsch, no ironic affection for mall kiosks, foil stickers, wireless mics or promotional blue plastic, no vaporwave, no Y2K aesthetic. NO childhood-wonder register: no the-gym-fell-silent, no a-kid-in-the-third-row-who-would-grow-up-to-be, no coming-of-age, no innocence, no a-teacher-who-noticed, no the-one-kid-who-got-it. NO burnt-out-performer arc: no the-loneliness-of-the-road, no minivan melancholy, no he-used-to-want-something-else, no sad-clown, no carny pathos, no the-applause-fades. NO sales cynicism and NO anti-consumerism sermon: the table by the double doors has prices on it and the page treats the $29.99 exactly as it treats the four and a half seconds. NO craftsman-sage register, NO trade mystique, NO 'the old demonstrators could read a throw across a gym', NO master-and-apprentice arc, NO reverence for hand skill, NO handmade-versus-plastic argument, NO wooden-fixed-axle purism. NO Texas travelogue and NO explaining West Texas or Lubbock to anybody: no oil, no dust, no Friday-night-lights, no Buddy Holly, no big-sky, no drawl, no dialect spelling, no aren't-they-friendly condescension, no small-town pathos, no school-funding commentary, no teacher-underpaid subplot. NO physics-as-wonder, NO teaching voice from the engine, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — there is no help text anywhere and nothing on the page explains the machine to anybody. NO arcade or scoreboard register: no score, no combo, no streak, no level, no unlock, no achievement, no congratulations, no encouragement, no 'nice one', no trick names displayed at any time. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, process-video, ambient-visualiser or screensaver framing of the spinning. NO sensuous material writing about plastic, cotton or maple beyond friction, tension, fray, twist and specular. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the clutch that always grabs at 2.8 seconds, the string that only frays, or the yo-yo that goes under the bleachers — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of the demo case, despite it being a case of dated plastic objects — it is stock, it is for sale, and ninety-six of them have to move by Friday. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — the gym lights are on, the bleachers are full, and the 9:40 is coming in. NO signal / transmission / frequency / broadcast framing, despite the mic. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
(function(){
"use strict";

// ---------- persistence (forward only) ----------
var KEY="lbk99.gym.demo.v1";
var P;
try{ P = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ P=null; }
if(!P||typeof P!=="object") P={};
function num(k,d){ return (typeof P[k]==="number"&&isFinite(P[k]))?P[k]:d; }
var state={
  throws: num("throws", 41180),
  strings: num("strings", 6),
  hands: num("hands", 0),
  twist: num("twist", 0),
  burn: num("burn", 0.12),
  unit: num("unit", 0),
  fray: Array.isArray(P.fray)?P.fray.slice():null
};
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      throws:state.throws, strings:state.strings, hands:state.hands,
      twist:state.twist, burn:state.burn, unit:state.unit,
      fray:seg.map(function(s){return Math.round(s.fray*1000)/1000;})
    }));
  }catch(e){}
}

// ---------- canvas ----------
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
var HAND={x:0,y:0}, FLOOR=0, SCALE=1;
function layout(){
  SCALE = Math.min(W,H)/560;
  HAND.x = W*0.5;
  HAND.y = H*0.30;
  FLOOR  = H*0.845;
}

// ---------- the case rotation ----------
// 0 fixed-axle wood, 1 transaxle, 2 the Brain with the gone clutch
var UNITS=[
  {name:"wood",   R:18, gapBase:0.055, baseFric:0.86, mass:1.0, sleeveBearing:false, clutch:false, color:"#7a4a22", trans:false},
  {name:"trans",  R:20, gapBase:0.115, baseFric:0.115,mass:1.05, sleeveBearing:true,  clutch:false, color:"#12457e", trans:true},
  {name:"brain",  R:20, gapBase:0.105, baseFric:0.145,mass:1.06, sleeveBearing:true,  clutch:true,  color:"#12457e", trans:true}
];
var U=UNITS[state.unit%3];

// ---------- string: real segment chain ----------
var N=26;
var seg=[];
function buildString(keepFray){
  var old=seg;
  seg=[];
  for(var i=0;i<N;i++){
    seg.push({x:HAND.x, y:HAND.y+i*4, px:HAND.x, py:HAND.y+i*4, fray:0});
  }
  if(keepFray&&state.fray&&state.fray.length===N){
    for(var j=0;j<N;j++) seg[j].fray=state.fray[j]||0;
  } else if(keepFray&&old.length===N){
    for(var k=0;k<N;k++) seg[k].fray=old[k].fray;
  }
  state.fray=null;
}

// ---------- yo-yo ----------
var yo={
  x:0,y:0,px:0,py:0,
  spin:0,           // rad/s, signed
  theta:0,          // visible rotation
  tilt:0,           // radians off-plane at release
  prec:0,           // precession phase
  attached:true,    // string wound on axle & paying out
  payout:0,         // how much string is out (0..1 of L)
  dead:false,
  wound:1,          // 1 = fully wound onto axle
  born:0,
  clutchGrab:false
};
var L0=0;           // full string length px
function stringLen(){ return Math.min(H*0.46, 250*SCALE); }

function resetToHand(){
  L0=stringLen();
  yo.x=HAND.x; yo.y=HAND.y+6; yo.px=yo.x; yo.py=yo.y;
  yo.spin=0; yo.tilt=0; yo.prec=0; yo.payout=0; yo.wound=1;
  yo.attached=true; yo.dead=false; yo.clutchGrab=false;
  for(var i=0;i<N;i++){ seg[i].x=HAND.x; seg[i].y=HAND.y+i*0.5; seg[i].px=seg[i].x; seg[i].py=seg[i].y; }
}

// ---------- input ----------
var drag={on:false,x0:0,y0:0,x:0,y:0,t0:0,vy:0,vx:0,dev:0,path:[]};
var pin={on:false,x:0,y:0,idx:-1,key:-1};
var winding={on:false,lastAng:0,accum:0};
var lastThrow={speed:1.0, dev:0.06, len:0.7};
var keys={};

function localPt(e){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function nearestSegIdx(p){
  var best=-1,bd=1e9;
  for(var i=1;i<N;i++){
    var d=(seg[i].x-p.x)*(seg[i].x-p.x)+(seg[i].y-p.y)*(seg[i].y-p.y);
    if(d<bd){bd=d;best=i;}
  }
  return bd < (34*SCALE)*(34*SCALE) ? best : -1;
}

function onDown(e){
  e.preventDefault(); resumeAudio();
  var p=localPt(e);
  // hand-winding: circles near the yo-yo when it's dead at the bottom
  if(yo.dead && Math.abs(yo.spin)<0.4){
    var dh=Math.hypot(p.x-yo.x,p.y-yo.y);
    if(dh<90*SCALE){
      winding.on=true; winding.lastAng=Math.atan2(p.y-yo.y,p.x-yo.x); winding.accum=0;
      say("wind"); return;
    }
  }
  if(!yo.attached){
    var idx=nearestSegIdx(p);
    if(idx>0){ pin.on=true; pin.idx=idx; pin.x=p.x; pin.y=p.y; pin.key=-1; return; }
  }
  drag.on=true; drag.x0=p.x; drag.y0=p.y; drag.x=p.x; drag.y=p.y;
  drag.t0=performance.now(); drag.path=[{x:p.x,y:p.y,t:drag.t0}];
}
function onMove(e){
  var p=localPt(e);
  if(winding.on){
    var a=Math.atan2(p.y-yo.y,p.x-yo.x);
    var d=a-winding.lastAng;
    while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    winding.accum+=Math.abs(d); winding.lastAng=a;
    if(winding.accum>Math.PI*2){
      winding.accum-=Math.PI*2;
      yo.wound=Math.min(1, yo.wound+0.055);   // ~18 turns, about 45 seconds honestly done
      tick();
      if(yo.wound>=1){
        state.hands++; save(); resetToHand(); winding.on=false; say("wound");
      }
    }
    e.preventDefault(); return;
  }
  if(pin.on){ pin.x=p.x; pin.y=p.y; e.preventDefault(); return; }
  if(drag.on){
    drag.x=p.x; drag.y=p.y;
    drag.path.push({x:p.x,y:p.y,t:performance.now()});
    if(drag.path.length>40) drag.path.shift();
    e.preventDefault();
  }
}
function onUp(e){
  if(winding.on){ winding.on=false; return; }
  if(pin.on){ pin.on=false; pin.idx=-1; return; }
  if(!drag.on) return;
  drag.on=false;
  var dy=drag.y-drag.y0, dx=drag.x-drag.x0;
  if(!yo.attached){
    // a downward tug while sleeping = bind attempt; sideways = swing impulse
    if(dy<-14){ attemptBind(); }
    else if(Math.abs(dx)>16){ swing(dx>0?1:-1, Math.min(1,Math.abs(dx)/120)); }
    return;
  }
  if(dy<18){ return; }
  // measure wrist speed over the last ~90ms of the gesture
  var now=performance.now(), vsum=0, vn=0, i;
  for(i=drag.path.length-1;i>0;i--){
    var a=drag.path[i], b=drag.path[i-1];
    if(now-a.t>110) break;
    var dt=Math.max(4,a.t-b.t);
    vsum+=Math.hypot(a.x-b.x,a.y-b.y)/dt; vn++;
  }
  var v = vn? vsum/vn : Math.hypot(dx,dy)/Math.max(30,now-drag.t0);
  var dev = Math.abs(Math.atan2(dx,Math.max(1,dy)));      // radians off vertical
  var len = Math.min(1.4, Math.hypot(dx,dy)/(220*SCALE));
  doThrow(v/ (1.05*SCALE), dev, len);
}
cv.addEventListener("mousedown",onDown);
window.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
cv.addEventListener("touchstart",onDown,{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
window.addEventListener("touchend",onUp);
window.addEventListener("touchcancel",onUp);

window.addEventListener("keydown",function(e){
  if(keys[e.key]) return;
  keys[e.key]=true;
  resumeAudio();
  if(e.code==="Space"){ e.preventDefault(); if(yo.attached) doThrow(lastThrow.speed,lastThrow.dev,lastThrow.len); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(!yo.attached) attemptBind(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); if(!yo.attached) swing(-1,0.8); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); if(!yo.attached) swing(1,0.8); }
  else if(e.key>="1"&&e.key<="9"){
    e.preventDefault();
    if(!yo.attached){
      var n=parseInt(e.key,10);
      pin.on=true; pin.key=n;
      pin.idx=Math.max(1,Math.min(N-2, Math.round(N*n/10)));
    }
  }
  else if(e.key==="w"||e.key==="W"){
    if(yo.dead&&Math.abs(yo.spin)<0.4){ winding.on=true; winding.accum=0; winding.lastAng=0; keys.__w=true; }
  }
});
window.addEventListener("keyup",function(e){
  keys[e.key]=false;
  if(e.key>="1"&&e.key<="9"&&pin.key===parseInt(e.key,10)){ pin.on=false; pin.idx=-1; pin.key=-1; }
  if(e.key==="w"||e.key==="W"){ winding.on=false; keys.__w=false; }
});

// keyboard wind accumulates on its own clock
var wAcc=0;

// ---------- the physics ----------
function responseGap(){
  // twist tightens the axle loop; wear at the axle crossing narrows it too
  var t=Math.min(1, state.twist/34);
  var axleWear = seg[N-1].fray;
  return Math.max(0.006, U.gapBase*(1-0.80*t) - axleWear*0.018);
}
function doThrow(v, dev, len){
  if(!yo.attached) return;
  if(yo.wound<0.55){ say("nowind"); return; }
  L0=stringLen();
  // wrist snap: usable work is done in the first ~8 inches, so velocity dominates
  var wrist = Math.pow(Math.min(2.6, v), 1.45);
  var reach = 0.55+0.45*Math.min(1,len);
  var w = 170*wrist*reach*yo.wound;
  yo.spin = -Math.max(6, Math.min(560, w));
  yo.tilt = dev * (drag.x>drag.x0?1:-1);
  yo.prec = 0;
  yo.attached=false; yo.dead=false; yo.payout=0; yo.born=performance.now();
  yo.clutchGrab=false;
  yo.x=HAND.x; yo.y=HAND.y+10; yo.px=yo.x; yo.py=yo.y-Math.max(7,v*7);
  state.throws++; state.twist+=0.5; lastThrow={speed:v,dev:dev,len:len};
  save();
  throwSound(Math.abs(yo.spin), dev);
  if(dev>0.28) say("crooked");
  else if(Math.abs(yo.spin)>380) say("good");
  else say("throw");
}
function swing(dir,amt){
  if(yo.attached) return;
  yo.px -= dir*16*amt*SCALE;
  // a swing is a purchase
  yo.spin *= (1 - 0.055*amt);
}
function attemptBind(){
  if(yo.attached) return;
  var s=Math.abs(yo.spin);
  var gap=responseGap();
  var grabQuality = 1 - gap*4.2;            // tighter gap grabs sooner
  var need = 78 + gap*900;
  if(s > need){
    yo.attached=true; yo.dead=false;
    var climb = Math.min(1, (s-need)/300)*0.9 + 0.1*grabQuality;
    yo.py = yo.y + (14+22*climb)*SCALE;     // impulse upward
    yo.spin *= 0.28;
    say("bind");
  } else if(s > need*0.42){
    yo.py = yo.y + 7*SCALE;                 // comes partway and drops back
    yo.spin *= 0.55;
    say("partway");
  } else {
    yo.spin*=0.9;
    say("nothing");
  }
}

var last=performance.now(), acc=0;
function step(dt){
  var g = 1750*SCALE;
  L0=stringLen();

  if(yo.attached){
    // verlet under string constraint from the hand, short leash while wound
    var vx=(yo.x-yo.px), vy=(yo.y-yo.py);
    yo.px=yo.x; yo.py=yo.y;
    yo.x+=vx*0.985; yo.y+=vy*0.985 + g*dt*dt;
    var maxLen = 12*SCALE + (1-yo.wound)*L0;
    var dx=yo.x-HAND.x, dy=yo.y-HAND.y, d=Math.hypot(dx,dy)||1;
    if(d>maxLen){
      var over=d-maxLen;
      yo.x-=dx/d*over; yo.y-=dy/d*over;
      if(vy>4*SCALE){ knock(Math.min(1,vy/(26*SCALE))); }
      yo.px=yo.x+ (yo.x-(yo.px))*0.0;
      yo.py=yo.y+ Math.min(0, -(vy*0.22));
    }
    if(yo.y<HAND.y+8 && Math.abs(vy)<0.6){ yo.y=HAND.y+8; yo.px=yo.x; yo.py=yo.y; }
    yo.spin*=Math.pow(0.12,dt);
  } else {
    var vx2=(yo.x-yo.px), vy2=(yo.y-yo.py);
    yo.px=yo.x; yo.py=yo.y;
    yo.x+=vx2*0.992; yo.y+=vy2*0.992 + g*dt*dt;

    // string constraint from hand, or from the pin if one is set
    var anchorX=HAND.x, anchorY=HAND.y, span=L0;
    if(pin.on && pin.idx>0){
      var f=pin.idx/(N-1);
      var px = (pin.key>0)? HAND.x + (Math.sin(performance.now()/900)*4*SCALE) : pin.x;
      var py = (pin.key>0)? HAND.y + f*L0 : pin.y;
      anchorX=px; anchorY=py; span=L0*(1-f);
      pin.x=px; pin.y=py;
    }
    var ddx=yo.x-anchorX, ddy=yo.y-anchorY, dd=Math.hypot(ddx,ddy)||1;
    var tension=0;
    if(dd>span){
      var o=dd-span;
      tension=o/(span||1);
      yo.x-=ddx/dd*o; yo.y-=ddy/dd*o;
      // tangential damping — string contact costs spin
      var contactAngle = Math.abs(Math.atan2(ddx,ddy));
      var gap=responseGap();
      var fric = (U.baseFric + contactAngle*0.9 + tension*3.4) * (1 - gap*2.6);
      yo.spin *= Math.pow(Math.max(0.05,1-fric*0.5), dt);
    }
    // floor
    if(yo.y > FLOOR - U.R*SCALE){
      yo.y = FLOOR - U.R*SCALE;
      var bounce=(yo.py-yo.y);
      if(bounce>2*SCALE){ floorTap(Math.min(1,bounce/(20*SCALE))); }
      yo.py = yo.y + bounce*0.42;
      // rolling on sealed maple: real friction coefficient
      yo.spin *= Math.pow(0.36, dt);
      yo.x += yo.spin*dt*0.10*SCALE*0;
      yo.px += (yo.spin>0?-1:1)*Math.min(3,Math.abs(yo.spin)*0.0022)*SCALE*dt*40;
    }

    // precession from an off-plane release: string rubs one inner wall
    if(Math.abs(yo.tilt)>0.05){
      yo.prec += dt*Math.abs(yo.spin)*0.014;
      var rub = Math.abs(yo.tilt)*Math.abs(yo.tilt)*9.6;
      yo.spin *= Math.pow(Math.max(0.02,1-rub*0.34), dt);
      yo.tilt *= Math.pow(0.86,dt);
      hissLevel = Math.min(1, Math.abs(yo.tilt)*3.4*Math.min(1,Math.abs(yo.spin)/160));
    } else hissLevel *= Math.pow(0.1,dt);

    // baseline bearing / axle friction
    var gap2=responseGap();
    yo.spin *= Math.pow(Math.max(0.02, 1 - (U.baseFric*0.10 + (0.03-Math.min(0.03,gap2))*5.2)), dt);

    // the worn clutch: 2.8 seconds, every time, regardless
    if(U.clutch && !yo.clutchGrab && (performance.now()-yo.born)/1000 > 2.8){
      yo.clutchGrab=true;
      if(Math.abs(yo.spin)>30){
        yo.attached=true;
        yo.py = yo.y + 26*SCALE;
        yo.spin*=0.3;
        knock(0.55);
        say("clutch");
      }
    }

    // twist past threshold: snags on its own
    if(state.twist>32 && Math.random()<dt*0.55 && Math.abs(yo.spin)>60){
      yo.attached=true; yo.py=yo.y+18*SCALE; yo.spin*=0.4; knock(0.4); say("snag");
    }

    // dead
    if(Math.abs(yo.spin)<3.5){
      if(!yo.dead){ yo.dead=true; say("dead"); }
    }

    // wear: fastest where the string crosses the axle, faster under tension
    var wear = dt*(0.0016 + tension*0.020 + Math.abs(yo.tilt)*0.012)*(Math.min(1,Math.abs(yo.spin)/260)+0.25);
    seg[N-1].fray = Math.min(1.6, seg[N-1].fray + wear*3.1);
    seg[N-2].fray = Math.min(1.6, seg[N-2].fray + wear*1.5);
    if(pin.on&&pin.idx>0){
      seg[pin.idx].fray=Math.min(1.6,seg[pin.idx].fray+wear*1.1);
      if(Math.abs(yo.spin)>200){
        state.burn=Math.min(1,state.burn+dt*0.0055);
      }
    }
    if(seg[N-1].fray>1.32){ partString(); }
  }

  // hanging free & unspooled unwinds the twist
  if(!yo.attached && !pin.on && Math.abs(yo.spin)<40 && Math.abs(yo.x-HAND.x)<7*SCALE){
    state.twist=Math.max(0,state.twist-dt*1.7);
  }
  if(yo.attached && Math.abs(yo.spin)<2){
    state.twist=Math.max(0,state.twist-dt*0.30);
  }

  // keyboard winding
  if(keys.__w && yo.dead && Math.abs(yo.spin)<0.4){
    wAcc+=dt;
    if(wAcc>0.42){ wAcc=0; yo.wound=Math.min(1,yo.wound+0.055); tick();
      if(yo.wound>=1){ state.hands++; save(); resetToHand(); keys.__w=false; say("wound"); } }
  }

  // string solve
  solveString(dt);

  // visible rotation
  yo.theta += yo.spin*dt;
  hum(Math.abs(yo.spin));
}

function partString(){
  state.strings=Math.max(0,state.strings-1);
  snapSound();
  yo.attached=false; yo.dead=false;
  // leaves at whatever velocity and angle it had, then rolls, then goes under the bleachers
  gone={on:true, x:yo.x, y:yo.y, vx:(yo.x-yo.px)*1.5, vy:(yo.y-yo.py)*1.5, spin:yo.spin, t:0};
  say("parted");
  for(var i=0;i<N;i++) seg[i].fray=0;
  state.twist=0;
  state.unit=(state.unit+1)%3; U=UNITS[state.unit];
  save();
  setTimeout(function(){ buildString(false); resetToHand(); save(); }, 2600);
}
var gone={on:false,x:0,y:0,vx:0,vy:0,spin:0,t:0};

function solveString(dt){
  var topX=HAND.x, topY=HAND.y;
  var i,it;
  // integrate
  for(i=0;i<N;i++){
    var s=seg[i];
    var vx=(s.x-s.px)*0.965, vy=(s.y-s.py)*0.965;
    s.px=s.x; s.py=s.y;
    s.x+=vx; s.y+=vy + (yo.attached?520:640)*SCALE*dt*dt;
  }
  var totalLen = yo.attached ? Math.max(14*SCALE,(1-yo.wound)*L0+12*SCALE) : L0;
  var segLen = totalLen/(N-1);
  for(it=0; it<7; it++){
    seg[0].x=topX; seg[0].y=topY;
    seg[N-1].x=yo.x; seg[N-1].y=yo.y;
    if(pin.on && pin.idx>0 && pin.idx<N-1){
      seg[pin.idx].x=pin.x; seg[pin.idx].y=pin.y;
    }
    for(i=0;i<N-1;i++){
      var a=seg[i], b=seg[i+1];
      var dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.0001;
      if(d>segLen){                       // rope: resists stretch only, goes slack honestly
        var diff=(d-segLen)/d*0.5;
        var ox=dx*diff, oy=dy*diff;
        var aFix = (i===0||(pin.on&&i===pin.idx))?0:1;
        var bFix = (i+1===N-1||(pin.on&&i+1===pin.idx))?0:1;
        var tot=aFix+bFix; if(tot===0) continue;
        a.x+=ox*(aFix/tot)*2*0.5; a.y+=oy*(aFix/tot)*2*0.5;
        b.x-=ox*(bFix/tot)*2*0.5; b.y-=oy*(bFix/tot)*2*0.5;
      }
    }
  }
  seg[0].x=topX; seg[0].y=topY;
  seg[N-1].x=yo.x; seg[N-1].y=yo.y;
  if(pin.on&&pin.idx>0&&pin.idx<N-1){ seg[pin.idx].x=pin.x; seg[pin.idx].y=pin.y; }
}

// ---------- audio ----------
var AC=null, master=null, whineOsc=null, whineGain=null, hissSrc=null, hissGain=null, hissLevel=0;
var conv=null, bball=null;
function resumeAudio(){
  if(AC){ if(AC.state==="suspended") AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.42;
  // gym reverb: hard surfaces, long-ish, bright
  conv=AC.createConvolver();
  var len=Math.floor(AC.sampleRate*1.9), buf=AC.createBuffer(2,len,AC.sampleRate);
  for(var ch=0;ch<2;ch++){
    var d=buf.getChannelData(ch);
    for(var i=0;i<len;i++){
      var t=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,2.1)*(1+0.3*Math.sin(i*0.0009));
    }
  }
  conv.buffer=buf;
  var wet=AC.createGain(); wet.gain.value=0.34;
  master.connect(AC.destination); master.connect(conv); conv.connect(wet); wet.connect(AC.destination);

  whineOsc=AC.createOscillator(); whineOsc.type="sawtooth";
  var wf=AC.createBiquadFilter(); wf.type="bandpass"; wf.Q.value=9; wf.frequency.value=1800;
  whineGain=AC.createGain(); whineGain.gain.value=0;
  whineOsc.connect(wf); wf.connect(whineGain); whineGain.connect(master);
  whineOsc.frequency.value=200; whineOsc.start();

  // cotton hiss on an inner wall
  var nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), nd=nb.getChannelData(0);
  for(var j=0;j<nd.length;j++) nd[j]=Math.random()*2-1;
  hissSrc=AC.createBufferSource(); hissSrc.buffer=nb; hissSrc.loop=true;
  var hf=AC.createBiquadFilter(); hf.type="bandpass"; hf.frequency.value=4200; hf.Q.value=1.4;
  hissGain=AC.createGain(); hissGain.gain.value=0;
  hissSrc.connect(hf); hf.connect(hissGain); hissGain.connect(master); hissSrc.start();

  // three hundred kids on a floor
  var cb=AC.createBufferSource(); cb.buffer=nb; cb.loop=true;
  var cf=AC.createBiquadFilter(); cf.type="lowpass"; cf.frequency.value=680;
  var cf2=AC.createBiquadFilter(); cf2.type="highpass"; cf2.frequency.value=160;
  var cg=AC.createGain(); cg.gain.value=0.028;
  cb.connect(cf); cf.connect(cf2); cf2.connect(cg); cg.connect(master); cb.start();
  var lfo=AC.createOscillator(); lfo.frequency.value=0.19;
  var lg=AC.createGain(); lg.gain.value=0.014;
  lfo.connect(lg); lg.connect(cg.gain); lfo.start();

  scheduleBall(); scheduleBleacher(); scheduleDoor();
}
function hum(s){
  if(!whineGain) return;
  var v=Math.min(1,s/460);
  whineGain.gain.setTargetAtTime(v*0.055, AC.currentTime, 0.05);
  whineOsc.frequency.setTargetAtTime(90+s*3.1, AC.currentTime, 0.04);
  if(hissGain) hissGain.gain.setTargetAtTime(hissLevel*0.09, AC.currentTime, 0.05);
}
function blip(f,d,type,g,slide){
  if(!AC) return;
  var o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), AC.currentTime+d);
  gn.gain.value=0; gn.gain.linearRampToValueAtTime(g||0.14, AC.currentTime+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime+d);
  o.connect(gn); gn.connect(master); o.start(); o.stop(AC.currentTime+d+0.04);
}
function knock(v){ blip(190+v*90, 0.10, "triangle", 0.13*v+0.04, 90); blip(430,0.05,"square",0.04*v); }
function floorTap(v){ blip(126, 0.30, "sine", 0.12*v, 78); blip(320,0.09,"triangle",0.05*v,180); }
function tick(){ blip(1400,0.03,"square",0.035,900); }
function snapSound(){ blip(2400,0.06,"square",0.16,300); blip(700,0.18,"sawtooth",0.09,120); }
function throwSound(s,dev){ blip(120+s*0.25,0.09,"triangle",0.08,80); if(dev>0.25) blip(3000,0.2,"sawtooth",0.05,1200); }
function scheduleBall(){
  if(!AC) return;
  blip(96,0.22,"sine",0.055,58); blip(240,0.05,"triangle",0.02);
  setTimeout(scheduleBall, 520+Math.random()*1500);
}
function scheduleBleacher(){
  if(!AC) return;
  setTimeout(function(){
    blip(70,0.4,"square",0.03,45); blip(1100,0.07,"sawtooth",0.018,400);
    scheduleBleacher();
  }, 6000+Math.random()*16000);
}
function scheduleDoor(){
  if(!AC) return;
  setTimeout(function(){
    blip(1600,0.05,"square",0.07,600);
    setTimeout(function(){ blip(150,0.5,"sine",0.06,60); },120);
    setTimeout(function(){ blip(1500,0.05,"square",0.06,560); },520);
    scheduleDoor();
  }, 22000+Math.random()*40000);
}

// ---------- drawing ----------
function draw(){
  // FLOOR: sealed maple under fluorescents
  ctx.fillStyle="#1a1611"; ctx.fillRect(0,0,W,H);
  // upper gym volume
  var g=ctx.createLinearGradient(0,0,0,FLOOR);
  g.addColorStop(0,"#20201d"); g.addColorStop(1,"#2c2822");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,FLOOR);

  ctx.fillStyle="#c8934a"; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  // board seams
  ctx.strokeStyle="rgba(90,58,24,.32)"; ctx.lineWidth=1;
  for(var bx=0;bx<H-FLOOR;bx+=9){
    ctx.beginPath(); ctx.moveTo(0,FLOOR+bx+0.5); ctx.lineTo(W,FLOOR+bx+0.5); ctx.stroke();
  }
  // worn lane under the bleachers (left band)
  ctx.fillStyle="rgba(164,131,79,.85)"; ctx.fillRect(0,FLOOR,W*0.26,H-FLOOR);
  // hard specular strip where the high windows land
  ctx.fillStyle="rgba(255,236,196,.30)";
  ctx.fillRect(W*0.46,FLOOR,W*0.11,H-FLOOR);
  ctx.fillStyle="rgba(255,240,206,.16)";
  ctx.fillRect(W*0.61,FLOOR,W*0.05,H-FLOOR);
  // two painted court lines, flaking volleyball blue
  ctx.strokeStyle="rgba(47,93,134,.72)"; ctx.lineWidth=3*SCALE;
  ctx.beginPath(); ctx.moveTo(0,FLOOR+(H-FLOOR)*0.42); ctx.lineTo(W,FLOOR+(H-FLOOR)*0.42); ctx.stroke();
  ctx.save(); ctx.globalAlpha=.55;
  ctx.beginPath(); ctx.moveTo(W*0.70,FLOOR); ctx.lineTo(W*0.84,H); ctx.stroke(); ctx.restore();
  // flaking
  ctx.fillStyle="rgba(200,147,74,.9)";
  for(var fk=0;fk<70;fk++){
    var fy=FLOOR+(H-FLOOR)*0.42 + (Math.sin(fk*13.7)*1.6);
    ctx.fillRect((fk*97)%W, fy-1.5*SCALE, 2+((fk*7)%5), 3*SCALE);
  }

  // bleachers, folded out on one side only
  ctx.fillStyle="#241f18";
  ctx.fillRect(0,0,W*0.20,FLOOR);
  ctx.strokeStyle="rgba(200,147,74,.10)"; ctx.lineWidth=1;
  for(var bb=0;bb<9;bb++){
    var byy=FLOOR-bb*(FLOOR/9.5);
    ctx.beginPath(); ctx.moveTo(0,byy); ctx.lineTo(W*0.20-bb*4,byy); ctx.stroke();
  }

  // folding table of stock, right edge
  drawTable();

  // the hand
  drawHand();

  // the string
  drawString();

  // the yo-yo
  if(gone.on) drawGone(); else drawYoyo(yo.x,yo.y);

  // pin finger
  if(pin.on){
    ctx.fillStyle="#d9a877";
    ctx.beginPath(); ctx.ellipse(pin.x,pin.y,7*SCALE,9*SCALE,0,0,7); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,"+(0.10+state.burn*0.5)+")";
    ctx.beginPath(); ctx.ellipse(pin.x,pin.y+2*SCALE,3.4*SCALE,3.8*SCALE,0,0,7); ctx.fill();
  }
}

function drawTable(){
  var tx=W-56*SCALE, ty=FLOOR-46*SCALE;
  ctx.fillStyle="#3a332a"; ctx.fillRect(tx,ty,70*SCALE,7*SCALE);
  ctx.fillStyle="#2a251e"; ctx.fillRect(tx+6*SCALE,ty+7*SCALE,4*SCALE,44*SCALE);
  // stacked stock
  for(var i=0;i<4;i++){
    ctx.fillStyle= (i%2)? "#12457e":"#0e3563";
    ctx.fillRect(tx+12*SCALE+i*11*SCALE, ty-9*SCALE, 9*SCALE, 9*SCALE);
  }
  // price cards — the only orange on the floor
  ctx.fillStyle="#f26a1b";
  ctx.fillRect(tx+10*SCALE, ty-20*SCALE, 20*SCALE, 8*SCALE);
  ctx.fillRect(tx+36*SCALE, ty-20*SCALE, 20*SCALE, 8*SCALE);
  ctx.fillStyle="#2a1405";
  ctx.font="bold "+(5*SCALE)+"px Helvetica, Arial, sans-serif";
  ctx.fillText("3.99", tx+13*SCALE, ty-14*SCALE);
  ctx.fillText("29.99", tx+38*SCALE, ty-14*SCALE);
  // demo case with tape flag
  ctx.fillStyle="#4a4238"; ctx.fillRect(tx-30*SCALE, ty-14*SCALE, 26*SCALE, 14*SCALE);
  ctx.fillStyle="#f26a1b"; ctx.fillRect(tx-24*SCALE, ty-17*SCALE, 12*SCALE, 4*SCALE);
}

function drawHand(){
  ctx.fillStyle="#d9a877";
  ctx.beginPath();
  ctx.ellipse(HAND.x, HAND.y-14*SCALE, 20*SCALE, 24*SCALE, 0.12, 0, 7);
  ctx.fill();
  ctx.fillStyle="#c0916a";
  ctx.fillRect(HAND.x-7*SCALE, HAND.y-40*SCALE, 26*SCALE, 26*SCALE);
  // the middle finger with the shiny patch, which grows
  ctx.fillStyle="#d9a877";
  ctx.beginPath(); ctx.ellipse(HAND.x-2*SCALE, HAND.y+2*SCALE, 6*SCALE, 12*SCALE, 0.05,0,7); ctx.fill();
  var b=state.burn;
  ctx.fillStyle="rgba(255,244,228,"+(0.16+b*0.55)+")";
  ctx.beginPath(); ctx.ellipse(HAND.x-2*SCALE, HAND.y+4*SCALE, (2.2+b*3.2)*SCALE, (3.4+b*4.4)*SCALE, 0,0,7); ctx.fill();
}

function drawString(){
  var twistTight = Math.min(1, state.twist/34);
  for(var i=0;i<N-1;i++){
    var a=seg[i], b=seg[i+1];
    var fr=Math.max(a.fray,b.fray);
    var wdt = (1.5 + fr*2.6)*SCALE;
    var col = fr>0.08 ? "#b3ab96" : "#e8e2d0";
    ctx.strokeStyle=col; ctx.lineWidth=wdt; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    // two plies, spacing tightens with accumulated twist
    var dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    var nx=-dy/d, ny=dx/d;
    var sp=(0.75 - 0.52*twistTight)*SCALE;
    ctx.strokeStyle="rgba(120,114,96,"+(0.30+0.25*twistTight)+")"; ctx.lineWidth=0.6*SCALE;
    ctx.beginPath(); ctx.moveTo(a.x+nx*sp,a.y+ny*sp); ctx.lineTo(b.x+nx*sp,b.y+ny*sp); ctx.stroke();
    // fuzz
    if(fr>0.25){
      ctx.strokeStyle="rgba(179,171,150,.55)"; ctx.lineWidth=0.7*SCALE;
      for(var f=0;f<Math.min(6,Math.floor(fr*6));f++){
        var t=(f+0.3)/6;
        var mx=a.x+dx*t, my=a.y+dy*t;
        var ang=(f*2.1+i)*1.7;
        ctx.beginPath(); ctx.moveTo(mx,my);
        ctx.lineTo(mx+Math.cos(ang)*fr*4*SCALE, my+Math.sin(ang)*fr*4*SCALE);
        ctx.stroke();
      }
    }
  }
}

function drawYoyo(x,y){
  var s=Math.abs(yo.spin);
  var R=U.R*SCALE;
  var wob=Math.sin(yo.prec)*Math.abs(yo.tilt)*R*0.55;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(yo.tilt*0.5*Math.sin(yo.prec));

  // body
  ctx.fillStyle = U.trans ? "#12457e" : "#7a4a22";
  ctx.beginPath(); ctx.arc(wob*0.3,0,R,0,7); ctx.fill();
  // translucent shell: inner core reads through
  if(U.trans){
    ctx.fillStyle="rgba(28,88,150,.75)";
    ctx.beginPath(); ctx.arc(wob*0.3,0,R*0.66,0,7); ctx.fill();
  } else {
    ctx.fillStyle="rgba(146,94,48,.85)";
    ctx.beginPath(); ctx.arc(wob*0.3,0,R*0.66,0,7); ctx.fill();
  }
  // rim
  ctx.strokeStyle= U.trans? "#0a2e57":"#4e2e13"; ctx.lineWidth=1.6*SCALE;
  ctx.beginPath(); ctx.arc(wob*0.3,0,R-0.8*SCALE,0,7); ctx.stroke();

  // --- the printed mark, rendered honestly against true angular velocity ---
  // high RPM: smears to a continuous ring, sidewall reads flat.
  // middling: strobes, apparent backward rotation from frame timing vs true w.
  // near-dead: resolves into readable lettering.
  var ringAlpha = Math.min(1, s/240);
  if(ringAlpha>0.03){
    ctx.strokeStyle="rgba(232,226,208,"+(0.30*ringAlpha)+")";
    ctx.lineWidth=R*0.20;
    ctx.beginPath(); ctx.arc(wob*0.3,0,R*0.55,0,7); ctx.stroke();
  }
  var strobe = 1-Math.min(1,s/300);
  if(s<330){
    // aliased against the real frame rate — this is where it appears to walk backwards
    var apparent = yo.theta % (Math.PI*2);
    var ghosts = s>70? 3 : 1;
    for(var gI=0; gI<ghosts; gI++){
      var ga = apparent + gI*(Math.PI*2/3);
      ctx.save(); ctx.translate(wob*0.3,0); ctx.rotate(ga);
      ctx.globalAlpha = (s<40? 1 : 0.30+0.50*strobe) * (gI===0?1:0.5);
      ctx.fillStyle = U.trans? "#e8e2d0":"#e8e2d0";
      ctx.font="bold "+(R*0.34)+"px Helvetica, Arial, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("PRO", 0, -R*0.48);
      ctx.restore();
    }
  }
  // the foil sticker — orange, only ever here
  ctx.save(); ctx.translate(wob*0.3,0); ctx.rotate(yo.theta*0.999);
  ctx.fillStyle="#f26a1b";
  ctx.globalAlpha = s>300? 0.22 : 0.95;
  ctx.beginPath(); ctx.arc(R*0.40, R*0.10, R*0.11, 0, 7); ctx.fill();
  ctx.restore();
  if(s>300){
    ctx.strokeStyle="rgba(242,106,27,.30)"; ctx.lineWidth=R*0.20;
    ctx.beginPath(); ctx.arc(wob*0.3,0,R*0.42,0,7); ctx.stroke();
  }

  // axle gap seen edge-on
  ctx.fillStyle="rgba(10,20,34,.55)";
  ctx.fillRect(wob*0.3-R*0.06, -R*0.20, R*0.12, R*0.40);

  ctx.restore();
}

function drawGone(){
  gone.t+=1/60;
  gone.vy+=44*SCALE*(1/60);
  gone.x+=gone.vx; gone.y+=gone.vy;
  if(gone.y>FLOOR-U.R*SCALE){
    gone.y=FLOOR-U.R*SCALE; gone.vy*=-0.34; gone.vx*= 0.985;
    if(Math.abs(gone.vy)<1.2) gone.vy=0;
    if(gone.vx>-2.2*SCALE) gone.vx-=0.30*SCALE;    // rolls left, toward the bleachers
  }
  gone.spin*=0.995;
  var save=yo.theta, sx=yo.x, sy=yo.y, sp=yo.spin, tl=yo.tilt;
  yo.theta+=gone.spin/60; yo.spin=Math.abs(gone.spin); yo.tilt=0;
  drawYoyo(gone.x,gone.y);
  yo.theta=save; yo.x=sx; yo.y=sy; yo.spin=sp; yo.tilt=tl;
  if(gone.x< W*0.20){ gone.on=false; }
}

// ---------- the lid of the case ----------
var lidEl=document.getElementById("lid");
function paintLid(){
  lidEl.innerHTML =
    '<span id="tape">DEMO</span>\n'+
    'THROWS SINCE JAN: <b>'+state.throws.toLocaleString()+'</b>\n'+

}

// ---------- boot ----------
resize();
buildString(true);
if(!state.fray){} // consumed
resetToHand();
paintLid();
window.addEventListener("resize",function(){ resize(); L0=stringLen(); });

say("sell",true);
setInterval(function(){ if(performance.now()-lastSay>9000) say("sell",true); },3000);

function loop(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now;
  acc+=dt;
  while(acc>1/120){ step(1/120); acc-=1/120; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// drag guide: show the gesture while it's being made
var origDraw=draw;
draw=function(){
  origDraw();
  if(drag.on && yo.attached){
    ctx.strokeStyle="rgba(232,226,208,.25)"; ctx.lineWidth=1.2*SCALE;
    ctx.setLineDash([4*SCALE,5*SCALE]);
    ctx.beginPath(); ctx.moveTo(drag.x0,drag.y0); ctx.lineTo(drag.x,drag.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(winding.on){
    ctx.strokeStyle="rgba(232,226,208,.16)"; ctx.lineWidth=1.2*SCALE;
    ctx.beginPath(); ctx.arc(yo.x,yo.y,34*SCALE,0,7); ctx.stroke();
    ctx.strokeStyle="rgba(242,106,27,.55)";
    ctx.beginPath(); ctx.arc(yo.x,yo.y,34*SCALE,-Math.PI/2,-Math.PI/2+Math.PI*2*yo.wound); ctx.stroke();
  }
};
