  <meta name="outbox-spec-format" content="THE PAGE IS ONE CONTINUOUS SUSTAINED NOTE, HELD IN TEXT, AND NOTHING ELSE. The entire viewport, edge to edge, is a single unbroken word — the word a held whistle looks like when a person tries to write it down — running as one uninterrupted string across every line of the page from top-left to bottom-right with no spaces, no punctuation, no title, no header, no paragraphs, no sentences: 'whooooooooooo...' at enormous length. But the string is not decorative filler: its letters are the pitch trace. The vowel spelled at each character position encodes the actual frequency of the note at that instant (oo lower, ee higher, uh in between), the density of repeated letters encodes duration, the letters swell in size where the note gets louder and thin out where it fades, and every wobble of vibrato shows as a real oscillation in the spelling. The visitor's only interaction is to hold a key down to sustain their own note into the string and slide the cursor up and down the viewport to bend its pitch — their whistle is appended to the end of the word, in the same unbroken run, and the word keeps growing. Nothing scrolls away. The word is the page.">
  <meta name="outbox-spec-subject" content="The plain physical business of holding a whistled note steady for the compulsory round — that a whistle is a Helmholtz resonator made of a mouth cavity and a tongue and nothing else, so pitch is set by the VOLUME of the cavity and not by lip tension, which is why a whistler flattens by opening the jaw and sharpens by humping the tongue forward, and why swallowing kills a note dead mid-phrase; that the compulsory is thirty seconds of one held tone and the judges score three things separately — pitch drift in cents from the reference, vibrato rate in cycles per second, and vibrato DEPTH, and a whistler with lovely wide vibrato and four cents of drift scores below a dull steady one; that vibrato is diaphragm and not throat, so a throat vibrato reads as a wobble with a hard edge on it and every judge on the table hears it; that the note goes sharp as the mouth dries out, honestly and measurably, roughly two cents a second past the twenty-second mark, which is exactly why the good ones start a hair flat on purpose; that cold air and a cold vestibule make everybody sharp on entry and the reference has to be re-struck between contestants for that reason; that breath support falls off at the end of a long note and the pitch sags with it, so the last four seconds of a thirty-second hold is where the round is actually decided; and the flat arithmetic that a hundred cents is a semitone, the tolerance band is eight cents either side, and eight cents at that pitch is about four and a half hertz — countable as beats against the fork if anybody bothers to count">

<title>Thirty Seconds Held — Compulsory Round, Fargo</title>
<style>
  html,body{margin:0;padding:0;background:#e6ddc6;}
  body{
    font-family:"Courier New",Courier,monospace;
    color:#1d3f8f;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    cursor:crosshair;
  }
  #band{
    position:fixed;left:0;right:0;top:0;bottom:0;
    pointer-events:none;z-index:2;
  }
  .rule{
    position:absolute;left:0;right:0;height:1px;
    background:#c4331e;opacity:.45;
  }
  .rule.center{opacity:.16;}
  #word{
    position:relative;z-index:1;
    padding:18px 10px 90px 10px;
    line-height:1.02;
    word-break:break-all;
    overflow-wrap:anywhere;
    font-size:15px;
    letter-spacing:0;
  }
  #word span{display:inline;}
  #foot{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    background:#e6ddc6;
    border-top:1px solid #8fa4cf;
    font-size:10px;letter-spacing:.14em;
    padding:5px 10px 6px 10px;
    color:#8fa4cf;
    display:flex;justify-content:space-between;gap:10px;
    font-family:"Courier New",Courier,monospace;
  }
  #foot a{color:#1d3f8f;text-decoration:none;border-bottom:1px solid #8fa4cf;}
  #foot a:hover{color:#c4331e;border-bottom-color:#c4331e;}
  #cents{font-variant-numeric:tabular-nums;}
  .hot{color:#c4331e;}

    #foot{font-size:9px;letter-spacing:.08em;}

<body>
<!-- reference struck at 987.77 hz, b5. fork lives in a coat pocket. re-struck between contestants because the vestibule is cold and everybody comes in sharp. -->
<div id="band">
  <div class="rule" id="ruleHi"></div>
  <div class="rule center" id="ruleMid"></div>
  <div class="rule" id="ruleLo"></div>
</div>
<div id="word" aria-label="one held note, written out"></div>
<div id="foot">
  <span id="hud">hold any key · slide to bend</span>
  <span id="cents">+0.0¢</span>
  <a href="/archive">the rest of the morning</a>
</div>
<script>
(function(){
"use strict";

var REF = 987.767;              /* b5, the reference the fork gives */
var CENT = Math.pow(2,1/1200);
var TOL  = 8;                   /* cents either side. about 4.6 hz up here. */

var wordEl  = document.getElementById("word");
var centsEl = document.getElementById("cents");
var hudEl   = document.getElementById("hud");

/* ---- the vowel ladder. low cavity volume is bright; a wide jaw is flat. ---- */
/* mapping is honest: cents from reference -> which vowel gets printed. */
var LADDER = [
  {c:-70,v:"oo"},
  {c:-42,v:"oh"},
  {c:-18,v:"o"},
  {c:  0,v:"u"},
  {c: 18,v:"e"},
  {c: 44,v:"ee"},
  {c: 999,v:"i"}
];
function vowelFor(cents){
  for(var i=0;i<LADDER.length;i++){ if(cents < LADDER[i].c) return LADDER[i].v; }
  return "i";
}

/* ---- audio ---- */
var AC=null, master=null, refOsc=null, refGain=null;
var toneOsc=null, toneGain=null, noiseSrc=null, noiseGain=null, noiseFilt=null;
var audioReady=false;

function makeNoise(ctx){
  var len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1);
  var s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; return s;
}

function initAudio(){
  if(audioReady) return;
  var C = window.AudioContext||window.webkitAudioContext;
  if(!C) return;
  try{
    AC=new C();
    master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);

    refGain=AC.createGain(); refGain.gain.value=0.0; refGain.connect(master);
    refOsc=AC.createOscillator(); refOsc.type="sine"; refOsc.frequency.value=REF;
    refOsc.connect(refGain); refOsc.start();

    toneGain=AC.createGain(); toneGain.gain.value=0.0; toneGain.connect(master);
    toneOsc=AC.createOscillator(); toneOsc.type="sine"; toneOsc.frequency.value=REF;
    toneOsc.connect(toneGain); toneOsc.start();

    noiseFilt=AC.createBiquadFilter(); noiseFilt.type="bandpass";
    noiseFilt.frequency.value=REF; noiseFilt.Q.value=6;
    noiseGain=AC.createGain(); noiseGain.gain.value=0.0;
    noiseSrc=makeNoise(AC); noiseSrc.connect(noiseFilt);
    noiseFilt.connect(noiseGain); noiseGain.connect(master);
    noiseSrc.start();

    audioReady=true;
  }catch(e){ audioReady=false; }
}
function strikeFork(){
  if(!audioReady) return;
  var t=AC.currentTime;
  refGain.gain.cancelScheduledValues(t);
  refGain.gain.setValueAtTime(refGain.gain.value,t);
  refGain.gain.linearRampToValueAtTime(0.09,t+0.01);
  refGain.gain.setTargetAtTime(0.0001,t+0.02,7.5);
}

/* ---- the model ---- */
var st = {
  holding:false,
  phraseT:0,          /* seconds into current hold */
  bend:0,             /* cents from cursor y */
  cents:0,            /* actual instantaneous cents from ref */
  amp:0,
  vibPhase:0,
  vibRate:5.4,        /* cycles per second, diaphragm */
  vibDepth:0,         /* cents peak */
  entryOffset:-3.2,   /* good ones start a hair flat on purpose */
  runVowel:null,
  runCount:0,
  emitAcc:0,
  charCount:0
};

var EMIT_HZ = 34;              /* characters per second of held note */
var CLOCK   = 30;              /* the compulsory */

/* the single capital G. position fixed on load, never announced. */
var G_AT = 400 + Math.floor(Math.random()*1400);
var gPlaced=false;

/* ---- pre-roll: the contestant already on the floor ---- */
var pending=[];  /* queued chars to flush */
function push(ch, cents, amp){
  pending.push({ch:ch,c:cents,a:amp});
}

function emitFrom(cents, amp){
  var v = vowelFor(cents);
  var out = "";
  if(st.runVowel===v){ st.runCount++; } else { st.runVowel=v; st.runCount=1; }
  /* the run-length is real: the letter simply repeats while the pitch sits in its band */
  out = v.charAt(st.runCount>1 && v.length>1 ? 1 : 0);
  if(v.length>1 && st.runCount===1) out = v; /* first hit of a digraph prints both */
  return out;
}

function flush(){
  if(!pending.length) return;
  var frag=document.createDocumentFragment();
  var i,p,ch,sp,wt,size,col,dev;
  for(i=0;i<pending.length;i++){
    p=pending[i];
    for(var k=0;k<p.ch.length;k++){
      ch=p.ch.charAt(k);
      st.charCount++;
      if(!gPlaced && st.charCount>=G_AT){ ch="G"; gPlaced=true; }
      sp=document.createElement("span");
      sp.textContent=ch;
      /* amplitude -> weight and size, honestly */
      wt = 300 + Math.round(Math.max(0,Math.min(1,p.a))*600);
      size = 0.72 + Math.max(0,Math.min(1,p.a))*0.85;
      dev = Math.abs(p.c);
      if(dev>TOL){ col="#c4331e"; }
      else if(p.a<0.28){ col="#8fa4cf"; }
      else if(p.a>0.72){ col="#0f2050"; }
      else { col="#1d3f8f"; }
      sp.style.fontWeight=wt;
      sp.style.fontSize=size.toFixed(2)+"em";
      sp.style.color=col;
      frag.appendChild(sp);
    }
  }
  pending.length=0;
  wordEl.appendChild(frag);
}

/* ---- generate one whole compulsory hold, as a script the model plays ---- */
/* used for the note already in progress when you arrive, and for anything
   that keeps the word going. this is the same physics the live key uses. */
function scriptedHold(seconds, opts){
  opts=opts||{};
  var t=0, dt=1/EMIT_HZ;
  var entry = (opts.entry===undefined)? (-4+Math.random()*2.5) : opts.entry;
  var rate  = (opts.rate===undefined)? (4.8+Math.random()*1.6) : opts.rate;
  var depth = (opts.depth===undefined)? (7+Math.random()*14) : opts.depth;
  var throaty = !!opts.throaty;
  var wander = (opts.wander===undefined)?1:opts.wander;
  var ph=Math.random()*6.283;
  var slowPhase=Math.random()*6.283;
  while(t<seconds){
    var c = entry;
    /* the mouth dries. past twenty seconds it sharpens, about two cents a second. */
    if(t>20) c += (t-20)*2.0;
    else c += t*0.10;
    /* slow unintentional wander */
    c += Math.sin(slowPhase + t*0.55)*1.7*wander + Math.sin(slowPhase*2.3 + t*0.19)*2.4*wander;
    /* breath support goes at the end. the pitch sags and the note thins. */
    var sag=0, ampEnv;
    if(t> seconds-4.5){
      var f=(t-(seconds-4.5))/4.5;
      sag = -f*f*16;
    }
    c += sag;
    /* vibrato: diaphragm. a throat vibrato has a hard edge — squared off. */
    ph += 6.283*rate*dt;
    var vw = Math.sin(ph);
    if(throaty){ vw = Math.sign(vw)*Math.pow(Math.abs(vw),0.32); }
    var dEnv = Math.min(1,t/1.6);
    c += vw*depth*0.5*dEnv;

    ampEnv = Math.min(1, t/0.35);
    if(t>seconds-4.5){ ampEnv *= Math.max(0.12, 1-((t-(seconds-4.5))/4.5)*0.85); }
    ampEnv *= 0.86 + 0.14*Math.sin(ph);
    push(emitFrom(c,ampEnv), c, ampEnv);
    t+=dt;
  }
  /* the breath at the end of a phrase — a thin tail of h */
  var tail = 2+Math.floor(Math.random()*4);
  for(var i=0;i<tail;i++){ st.runVowel="h"; push("h", 0, 0.14); }
  st.runVowel=null;
}

/* ---- the note already going when the page opens ---- */
/* three contestants have been through. this is the fourth, mid-hold. */
scriptedHold(30, {entry:-3.5, rate:5.2, depth:11, wander:1.0});
scriptedHold(30, {entry:-1.0, rate:6.6, depth:23, wander:1.4, throaty:true});
scriptedHold(30, {entry:-4.4, rate:5.0, depth:6,  wander:0.5});
scriptedHold(21, {entry:-2.8, rate:5.6, depth:14, wander:0.9});
flush();

/* ---- the tolerance rules, drawn at true ±8 cents ---- */
/* the viewport maps linearly to a bend range; the rules sit where 8 cents lands. */
var BEND_RANGE = 120;   /* top of screen = -? see mapping below */
function yToBend(y){
  var h=window.innerHeight||600;
  var f = 1 - (y/h);        /* 0 bottom .. 1 top */
  return (f-0.5)*2*BEND_RANGE;   /* top = +120 cents (tongue forward), bottom = -120 */
}
function bendToY(c){
  var h=window.innerHeight||600;
  var f = c/(2*BEND_RANGE) + 0.5;
  return (1-f)*h;
}
function layoutRules(){
  document.getElementById("ruleHi").style.top = bendToY(TOL)+"px";
  document.getElementById("ruleLo").style.top = bendToY(-TOL)+"px";
  document.getElementById("ruleMid").style.top = bendToY(0)+"px";
}
layoutRules();
window.addEventListener("resize",layoutRules);

/* ---- pointer ---- */
var pointerY=null;
function onMove(e){
  var y = (e.touches&&e.touches[0]) ? e.touches[0].clientY : e.clientY;
  if(typeof y==="number") pointerY=y;
}
window.addEventListener("mousemove",onMove,{passive:true});
window.addEventListener("touchmove",onMove,{passive:true});

/* ---- holding ---- */
function begin(){
  if(st.holding) return;
  initAudio();
  if(AC && AC.state==="suspended"){ AC.resume(); }
  strikeFork();
  st.holding=true;
  st.phraseT=0;
  st.vibPhase=Math.random()*6.283;
  st.vibRate=5.0+Math.random()*1.4;
  st.entryOffset=-3.2;
  st.runVowel=null; st.runCount=0;
  if(audioReady){
    var t=AC.currentTime;
    toneGain.gain.cancelScheduledValues(t);
    toneGain.gain.setValueAtTime(toneGain.gain.value,t);
    toneGain.gain.linearRampToValueAtTime(0.085,t+0.06);
    noiseGain.gain.cancelScheduledValues(t);
    noiseGain.gain.setValueAtTime(noiseGain.gain.value,t);
    noiseGain.gain.linearRampToValueAtTime(0.006,t+0.06);
  }
  hudEl.textContent="holding · 30.0";
}
function end(){
  if(!st.holding) return;
  st.holding=false;
  if(audioReady){
    var t=AC.currentTime;
    toneGain.gain.cancelScheduledValues(t);
    toneGain.gain.setValueAtTime(toneGain.gain.value,t);
    toneGain.gain.linearRampToValueAtTime(0.0001,t+0.10);
    noiseGain.gain.cancelScheduledValues(t);
    noiseGain.gain.setValueAtTime(noiseGain.gain.value,t);
    noiseGain.gain.linearRampToValueAtTime(0.0001,t+0.16);
  }
  var tail=2+Math.floor(Math.random()*3);
  st.runVowel="h";
  for(var i=0;i<tail;i++) push("h",0,0.13);
  st.runVowel=null;
  flush();
  hudEl.textContent="hold any key · slide to bend";
  window.scrollTo(0,document.body.scrollHeight);
}

window.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Tab") return;
  if(e.repeat){ e.preventDefault(); return; }
  e.preventDefault();
  begin();
},{passive:false});
window.addEventListener("keyup",function(e){ end(); });
window.addEventListener("blur",end);

/* touch / mouse hold, so a phone can do it too */
function pdown(e){ onMove(e); begin(); }
window.addEventListener("mousedown",pdown);
window.addEventListener("mouseup",end);
window.addEventListener("touchstart",function(e){ pdown(e); },{passive:true});
window.addEventListener("touchend",end);
window.addEventListener("touchcancel",end);

/* ---- live loop ---- */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.12) dt=0.12;

  if(st.holding){
    st.phraseT+=dt;
    if(st.phraseT>CLOCK){ end(); }
  }

  if(st.holding){
    var t=st.phraseT;
    var bend = pointerY===null ? 0 : yToBend(pointerY);
    /* cursor bend is where the tongue is. it moves, but not instantly. */
    st.bend += (bend-st.bend)*Math.min(1,dt*11);

    var c = st.entryOffset + st.bend;
    /* the mouth dries out. two cents a second past twenty. */
    if(t>20) c += (t-20)*2.0; else c += t*0.10;
    /* support sags in the last four and a half seconds */
    var supp=1;
    if(t>CLOCK-4.5){
      var f=(t-(CLOCK-4.5))/4.5;
      c -= f*f*15;
      supp = Math.max(0.13, 1-f*0.85);
    }
    /* vibrato — diaphragm, so a clean sine. depth grows in over the first bar. */
    st.vibPhase += 6.283*st.vibRate*dt;
    var depth = 9*Math.min(1,t/1.7)*supp;
    c += Math.sin(st.vibPhase)*depth*0.5;

    st.amp = Math.min(1,t/0.3)*supp*(0.84+0.16*Math.sin(st.vibPhase));
    st.cents=c;

    if(audioReady){
      var hz=REF*Math.pow(CENT,c);
      toneOsc.frequency.setTargetAtTime(hz,AC.currentTime,0.005);
      noiseFilt.frequency.setTargetAtTime(hz,AC.currentTime,0.01);
      toneGain.gain.setTargetAtTime(0.085*supp,AC.currentTime,0.05);
    }

    /* emit characters at the honest rate */
    st.emitAcc += dt*EMIT_HZ;
    var n=Math.floor(st.emitAcc);
    if(n>0){
      st.emitAcc-=n;
      if(n>12) n=12;
      for(var i=0;i<n;i++){ push(emitFrom(c,st.amp), c, st.amp); }
      flush();
      window.scrollTo(0,document.body.scrollHeight);
    }

    centsEl.textContent=(c>=0?"+":"")+c.toFixed(1)+"\u00A2";
    centsEl.className = Math.abs(c)>TOL ? "hot" : "";
    hudEl.textContent="holding \u00b7 "+(CLOCK-t).toFixed(1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* eight cents at b5 is about four and a half hertz. countable, if anybody counts. */
console.log("ref 987.767 hz \u00b7 tolerance \u00b18\u00a2 \u00b7 that is "+
  (REF*Math.pow(CENT,8)-REF).toFixed(2)+" hz sharp side, "+
  (REF-REF*Math.pow(CENT,-8)).toFixed(2)+" hz flat side");
/* card table, folding chairs, three judges, a fork in a coat pocket.
   somebody's mother bought that coat at Castellane's. */
})();
</script>

<script src="/nav.js" defer></script>
