  <meta name="outbox-spec-format" content="The whole viewport IS the bar-skittles table seen at a three-quarter angle, edge to edge: a felt-topped board with a stout post at the back, nine numbered pins standing in their diamond, and a fist-sized ball hanging on a short chain from the top of the post. You genuinely play a leg of Devil Among the Tailors — press and HOLD (mouse or SPACEBAR) to wind the ball up and back around the post along a taut charge-arc, then RELEASE to let it swing round on its chain in a real arc that sweeps across the diamond, felling whatever pins it actually catches. You get three throws to knock down all nine; pins that fall stay down till the leg ends, the count is chalked live, and a clean sweep resets fresh. No browser chrome, no header, no menu — just the board, the pins, and the chain in your hand.">
  <meta name="outbox-spec-subject" content="The plain, opinionated, entirely practical craft of one game of Devil Among the Tailors — bar skittles — and the honest physics of it: how you wind the ball back around the post and let it swing on its chain so it curves across the diamond rather than straight through, why a lazy loop only clips the near corner while a good hard wind carries the ball right round to sweep the back pins, the knack of leaving yourself an easy spare on the second throw instead of scattering everything at once, and the daft satisfaction of a full nine off a single swing. Not a metaphor for anything, not the soul of the old pub, not a lesson about aim in life — literally nine turned pins, a ball on a chain, a swing, and how many you knock flat.">
  <meta name="outbox-spec-tone" content="The loud, chuffed, endlessly-advising voice of Cliff, forty-odd years the man to beat on this board, who cannot watch you take a throw without calling the shot — brassy and generous, egging you on ('wind her right BACK, all the way round the post — no, further! — now LET her go'), crowing when the pins go over ('THERE — see that? that's the swing I mean, boy'), ribbing you warmly when you clip one measly corner-pin ('ooh, one. one! we'll say nothing about that one'), and openly delighted the instant you take a full nine off him. Peer-to-peer, present-tense, competitive but kind underneath, thrilled to have someone to play. Never wistful, never a life-lesson, never the mellow old-timer-at-the-bar sage — a man who loves this daft game and wants you to get a proper swing in.">

  <meta name="outbox-spec-wildcard" content="Exactly one pin — the centre king-pin, the one with the little red '9' and a hair of a grinning devil-face painted on it — is stood a touch stubborner than the rest: it takes a genuinely solid direct hit to go over, shrugging off the glancing clips that flatten its neighbours, so it is nearly always the last pin left standing between you and a full house. It is never labelled, never explained, never pointed at in Cliff's chatter, never scored any differently; it is simply the same stubborn devil in the middle every leg, for whoever plays long enough to notice the one pin that will not go easy.">

<title>Devil Among the Tailors — Wind Her Round the Post</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#160c07;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;color:#f2ece0;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #board{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:pointer;}
  #corner{position:fixed;right:9px;bottom:7px;z-index:5;font-size:11px;font-style:italic;
    color:#cdbf9d;opacity:.72;text-decoration:none;letter-spacing:.3px;
    text-shadow:0 1px 2px #000;}
  #corner:hover{opacity:1;color:#f2ece0;}

<body>
<canvas id="board" aria-label="A bar-skittles table — nine cream pins in a diamond, a boxwood ball on a chain hanging from a mahogany post. Hold to wind, release to swing."></canvas>
<a id="corner" href="/archive">other tables in the back &rsaquo;</a>
<script>
(function(){
"use strict";
var cv=document.getElementById('board'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,S=1,ox=0,oy=0,postH=0,tilt=0.60;

// ---- persistent tallies (only ever climb) ----
function loadN(k){var v=parseInt(localStorage.getItem(k),10);return isNaN(v)?0:v;}
var fullHouses=loadN('dat.house.v1');
var bestLeg=loadN('dat.best.v1');

// ---- pins: nine in a diamond, king in the centre ----
var SP=42, DC=168;
var layout=[[0,-2],[-1,-1],[1,-1],[-2,0],[0,0],[2,0],[-1,1],[1,1],[0,2]];
var pins=[];
function buildPins(){
  pins=layout.map(function(p){
    return {gx:p[0]*SP, gy:DC+p[1]*SP, king:(p[0]===0&&p[1]===0),
            standing:true, tp:0, tsign:1};
  });
}
buildPins();

// ---- state ----
var mode='ready';           // ready | wind | swing | settle
var charge=0, windStart=0;
var windPhi=0, phi=0, omega=0, omega0=0, Rstart=0, R=0;
var bgx=0, bgy=0;           // ball position, game plane
var swingSteps=0;
var throwsLeft=3;
var throwStartStanding=9;
var settleFrames=0, pendingAction='ready';
var spaceHeld=false;
var msg="Devil Among the Tailors! Press & HOLD (or SPACE) — wind her right back round the post — then LET her go.";

// ---- audio ----
var AC=null, noiseBuf=null;
function ensureAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    var n=AC.sampleRate*0.3, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1);
    noiseBuf=b;
  }catch(e){AC=null;}
}
function knockSound(v){
  if(!AC) return;
  var t=AC.currentTime, g=AC.createGain();
  var amp=Math.min(0.5,0.14+v*0.012);
  g.gain.setValueAtTime(amp,t); g.gain.exponentialRampToValueAtTime(0.0008,t+0.16);
  g.connect(AC.destination);
  var o=AC.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(150+Math.random()*70,t);
  o.frequency.exponentialRampToValueAtTime(70,t+0.14);
  o.connect(g); o.start(t); o.stop(t+0.17);
  // wooden click
  var cg=AC.createGain(); cg.gain.setValueAtTime(amp*0.6,t); cg.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
  var ns=AC.createBufferSource(); ns.buffer=noiseBuf;
  ns.connect(f); f.connect(cg); cg.connect(AC.destination); ns.start(t); ns.stop(t+0.06);
}
function whoosh(c){
  if(!AC) return;
  var t=AC.currentTime, g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06+c*0.05,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0006,t+0.42);
  var f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(400,t); f.frequency.linearRampToValueAtTime(1400,t+0.4);
  var ns=AC.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
  ns.connect(f); f.connect(g); g.connect(AC.destination); ns.start(t); ns.stop(t+0.45);
}
function chime(){
  if(!AC) return;
  var t=AC.currentTime, notes=[660,880,1320];
  notes.forEach(function(fr,i){
    var g=AC.createGain(), o=AC.createOscillator();
    o.type='sine'; o.frequency.value=fr;
    var st=t+i*0.11;
    g.gain.setValueAtTime(0.0001,st); g.gain.linearRampToValueAtTime(0.16,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0006,st+0.8);
    o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+0.85);
  });
}

// ---- messages ----
var readyLines=[
  "Right — wind her back round the post and LET her go.",
  "Board's stood fresh. Wind her round proper, mind.",
  "Your ball, boy. All the way round the post now."
];
function say(t){msg=t;}
function pickReady(){ say(readyLines[(Math.random()*readyLines.length)|0]); }

// ---- input ----
function startWind(){
  ensureAudio(); if(AC&&AC.state==='suspended') AC.resume();
  if(mode!=='ready') return;
  mode='wind'; charge=0; windStart=performance.now();
  say("Back… back… wind her right round…");
}
function release(){
  if(mode!=='wind') return;
  throwStartStanding=pins.filter(function(p){return p.standing;}).length;
  omega0=-(0.055+0.10*charge);
  omega=omega0;
  Rstart=96+162*charge;
  phi=windPhi;
  R=Rstart; bgx=R*Math.cos(phi); bgy=R*Math.sin(phi);
  swingSteps=0;
  mode='swing';
  whoosh(charge);
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();startWind();});
window.addEventListener('pointerup',function(){release();});
window.addEventListener('pointercancel',function(){release();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){e.preventDefault(); if(!spaceHeld){spaceHeld=true;startWind();}}
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.key===' '){spaceHeld=false;release();}
});

// ---- collision ----
function collide(v){
  for(var i=0;i<pins.length;i++){
    var p=pins[i]; if(!p.standing) continue;
    var dx=bgx-p.gx, dy=bgy-p.gy, d=Math.sqrt(dx*dx+dy*dy);
    var hit=false;
    if(p.king){ if(d<24 && v>6.5) hit=true; }
    else { if(d<38 && v>1.4) hit=true; }
    if(hit){
      p.standing=false; p.tp=0;
      p.tsign=(p.gx-bgx)>0?1:((p.gx-bgx)<0?-1:(Math.random()<0.5?1:-1));
      knockSound(v);
    }
  }
}

// ---- update ----
function endSwing(){
  var standingNow=pins.filter(function(p){return p.standing;}).length;
  var knocked=throwStartStanding-standingNow;
  if(standingNow===0){
    fullHouses++; localStorage.setItem('dat.house.v1',fullHouses);
    if(9>bestLeg){bestLeg=9; localStorage.setItem('dat.best.v1',bestLeg);}
    chime();
    say("ALL NINE — that's a HOUSE! Get IN — THAT'S the swing, boy!");
    pendingAction='resetleg';
  }else{
    throwsLeft--;
    if(throwsLeft<=0){
      var felled=9-standingNow;
      if(felled>bestLeg){bestLeg=felled; localStorage.setItem('dat.best.v1',bestLeg);}
      say("Leg's done — "+felled+" down, re-standing 'em. Go again, wind her round proper.");
      pendingAction='resetleg';
    }else{
      var lastStanding=pins.filter(function(p){return p.standing;});
      if(standingNow===1 && lastStanding[0].king){
        say("Just the one in the middle now — proper CRACK at it, none of your glancing stuff!");
      }else if(knocked===0){
        say("Clean miss! Whooshed straight past 'em — wind her HARDER, boy.");
      }else if(knocked===1){
        say("Ooh, one. One! We'll say nothing about that one.");
      }else if(knocked<=3){
        say("That's a start — now leave yourself an easy spare, don't scatter the lot.");
      }else if(knocked<=6){
        say("THERE — see that swing? That's the one I mean.");
      }else{
        say("Hah! Nearly the lot — one cheeky devil left standing.");
      }
      pendingAction='ready';
    }
  }
  mode='settle'; settleFrames=0;
}
function resetLeg(){ buildPins(); throwsLeft=3; mode='ready'; pickReady(); }

function update(dtf){
  var now=performance.now();
  if(mode==='wind'){
    charge=Math.min(1,(now-windStart)/1100);
    windPhi=Math.PI/2 + charge*1.7*Math.PI;
    var Rw=62+charge*34;
    bgx=Rw*Math.cos(windPhi); bgy=Rw*Math.sin(windPhi); R=Rw;
    if(charge>0.72) say("FURTHER… all the way ROUND… now let her GO!");
    else if(charge>0.3) say("Back… keep her going round…");
  }else if(mode==='swing'){
    var sub=5;
    for(var k=0;k<sub;k++){
      phi += omega*dtf/sub;
      omega *= Math.pow(0.986, dtf/sub);
      var e=Math.abs(omega)/Math.abs(omega0); if(e>1)e=1; if(e<0)e=0;
      R=78+(Rstart-78)*e;
      bgx=R*Math.cos(phi); bgy=R*Math.sin(phi);
      var v=Math.abs(omega)*R;
      collide(v);
    }
    swingSteps+=dtf;
    if(Math.abs(omega)<0.006 || swingSteps>900) endSwing();
  }else if(mode==='settle'){
    settleFrames+=dtf;
    if(settleFrames>72){ if(pendingAction==='resetleg') resetLeg(); else mode='ready'; }
  }
  // topple animation
  for(var i=0;i<pins.length;i++){
    var p=pins[i];
    if(!p.standing && p.tp<1){ p.tp=Math.min(1,p.tp+0.09*dtf); }
  }
}

// ---- coordinate helpers ----
function sx(gx){return ox+gx*S;}
function sy(gy){return oy+gy*S*tilt;}

// ---- pin silhouette ----
var PROF=[[0,0.30],[0.06,0.40],[0.13,0.26],[0.22,0.20],[0.30,0.20],
          [0.52,0.46],[0.72,0.40],[0.88,0.34],[0.96,0.44],[1,0.50]];
function pinPath(w,h){
  ctx.beginPath();
  var i,t,rf,x,y;
  for(i=PROF.length-1;i>=0;i--){ t=PROF[i][0]; rf=PROF[i][1];
    x=-rf*w; y=-(1-t)*h; if(i===PROF.length-1)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  for(i=0;i<PROF.length;i++){ t=PROF[i][0]; rf=PROF[i][1];
    x=rf*w; y=-(1-t)*h; ctx.lineTo(x,y); }
  ctx.closePath();
}
function drawPin(p){
  var px=sx(p.gx), by=sy(p.gy);
  var h=48*S, w=20*S;
  var topAngle = p.standing?0 : p.tsign*1.5*p.tp;
  // ground shadow
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.30)';
  ctx.beginPath();
  var shx=px+Math.sin(topAngle)*h*0.4*p.tp;
  ctx.ellipse(shx, by+2*S, w*0.65+h*0.4*p.tp, w*0.26, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(px,by);
  ctx.rotate(topAngle);
  pinPath(w,h);
  var g=ctx.createLinearGradient(-w,0,w,0);
  g.addColorStop(0,'#f8f2e2'); g.addColorStop(0.4,'#efe4c9');
  g.addColorStop(0.75,'#dccdad'); g.addColorStop(1,'#c7b58f');
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba(120,104,72,0.55)'; ctx.stroke();
  // bright specular down the pin
  ctx.beginPath();
  ctx.moveTo(-w*0.20,-h*0.12); ctx.lineTo(-w*0.14,-h*0.86);
  ctx.lineWidth=2.2*S; ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,252,240,0.55)'; ctx.stroke();
  if(p.king){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#b5262b';
    ctx.font='bold '+(13*S)+'px Georgia';
    ctx.fillText('9',0,-h*0.44);
    // hair of a grinning devil-face
    ctx.strokeStyle='rgba(150,40,40,0.75)'; ctx.lineWidth=1.1*S;
    ctx.beginPath(); ctx.arc(0,-h*0.30, w*0.16, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    ctx.fillStyle='rgba(120,30,30,0.8)';
    ctx.beginPath(); ctx.arc(-w*0.11,-h*0.37, 0.8*S,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc( w*0.11,-h*0.37, 0.8*S,0,7); ctx.fill();
  }
  ctx.restore();
}

// ---- draw ----
function roundedChalk(txt,x,y,size,color,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.font=size+'px Georgia'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=color; ctx.fillText(txt,0,0);
  ctx.restore();
}
function wrapDraw(txt,cx,y,maxw,size){
  ctx.font='italic '+size+'px Georgia';
  var words=txt.split(' '), line='', lines=[];
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxw && line){lines.push(line);line=words[i];}
    else line=test;
  }
  if(line)lines.push(line);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(var j=0;j<lines.length;j++){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillText(lines[j],cx+1,y+j*(size+4)+1);
    ctx.fillStyle='#f4efe2'; ctx.fillText(lines[j],cx,y+j*(size+4));
  }
}
function draw(){
  // felt
  var g=ctx.createRadialGradient(W*0.5,H*0.30,40, W*0.5,H*0.5,Math.max(W,H)*0.75);
  g.addColorStop(0,'#2a6f4b'); g.addColorStop(0.45,'#1f5c3d'); g.addColorStop(1,'#123venue'.replace('venue','824'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // brass-lamp pool of light
  var lamp=ctx.createRadialGradient(W*0.5,oy*0.9,10, W*0.5,oy*0.9,Math.max(W,H)*0.5);
  lamp.addColorStop(0,'rgba(255,224,150,0.20)'); lamp.addColorStop(0.5,'rgba(255,210,130,0.05)');
  lamp.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lamp; ctx.fillRect(0,0,W,H);
  // mahogany board edge
  ctx.lineWidth=Math.max(14,26*S); ctx.strokeStyle='#3a2115';
  ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth);
  ctx.lineWidth=Math.max(4,7*S); ctx.strokeStyle='#5a3620';
  ctx.strokeRect(ctx.lineWidth/2+Math.max(14,26*S)*0.5, ctx.lineWidth/2+Math.max(14,26*S)*0.5,
    W-ctx.lineWidth-Math.max(14,26*S), H-ctx.lineWidth-Math.max(14,26*S));

  // faint chalk diamond spots
  ctx.save(); ctx.strokeStyle='rgba(240,236,220,0.10)'; ctx.lineWidth=1;
  for(var i=0;i<layout.length;i++){
    ctx.beginPath();
    ctx.ellipse(sx(layout[i][0]*SP), sy(DC+layout[i][1]*SP)+3*S, 11*S,5*S,0,0,7); ctx.stroke();
  }
  ctx.restore();

  // the post (at back), then chain pivot
  var ptx=ox, ptopY=oy-postH, pbaseY=sy(-6);
  ctx.save();
  var pg=ctx.createLinearGradient(ptx-12*S,0,ptx+12*S,0);
  pg.addColorStop(0,'#insertA'.replace('insertA','2a170d'));
  pg.addColorStop(0.4,'#3a2115'); pg.addColorStop(0.6,'#5a3620'); pg.addColorStop(1,'#22130a');
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.moveTo(ptx-9*S,pbaseY); ctx.lineTo(ptx-7*S,ptopY);
  ctx.lineTo(ptx+7*S,ptopY); ctx.lineTo(ptx+9*S,pbaseY); ctx.closePath(); ctx.fill();
  // brass cap / eyelet at top
  ctx.fillStyle='#c9a24a';
  ctx.beginPath(); ctx.ellipse(ptx,ptopY,9*S,5*S,0,0,7); ctx.fill();
  ctx.fillStyle='#8a6a26';
  ctx.beginPath(); ctx.arc(ptx,ptopY,2.4*S,0,7); ctx.fill();
  ctx.restore();

  // pins, back to front
  var order=pins.slice().sort(function(a,b){return a.gy-b.gy;});
  for(var k=0;k<order.length;k++) drawPin(order[k]);

  // ball + chain
  var bx,byGround,lift;
  if(mode==='wind'||mode==='swing'){
    bx=sx(bgx); byGround=sy(bgy); lift=14*S;
  }else{
    bx=ox; byGround=oy-postH*0.30; lift=0;
  }
  var byBall=byGround-lift;
  // chain
  ctx.strokeStyle='#8f8578'; ctx.lineWidth=2.2*S; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ptx,ptopY); ctx.lineTo(bx,byBall); ctx.stroke();
  ctx.strokeStyle='rgba(220,220,210,0.35)'; ctx.lineWidth=0.9*S;
  ctx.beginPath(); ctx.moveTo(ptx,ptopY); ctx.lineTo(bx,byBall); ctx.stroke();
  // ball ground shadow
  if(mode==='wind'||mode==='swing'){
    ctx.fillStyle='rgba(0,0,0,0.30)';
    ctx.beginPath(); ctx.ellipse(bx,byGround+2*S,15*S,6*S,0,0,7); ctx.fill();
  }
  // ball
  var bg=ctx.createRadialGradient(bx-5*S,byBall-6*S,2, bx,byBall,17*S);
  bg.addColorStop(0,'#e0b56a'); bg.addColorStop(0.5,'#b98a3e'); bg.addColorStop(1,'#7c5a24');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(bx,byBall,15*S,0,7); ctx.fill();
  ctx.strokeStyle='rgba(60,40,15,0.5)'; ctx.lineWidth=1; ctx.stroke();
  // charge glow while winding
  if(mode==='wind'){
    ctx.strokeStyle='rgba(255,220,140,'+(0.25+charge*0.5)+')';
    ctx.lineWidth=2.5*S;
    ctx.beginPath(); ctx.arc(bx,byBall,(18+charge*8)*S,0,7); ctx.stroke();
  }

  // chalk scoreboard (upper-left, on the wall behind)
  var standing=pins.filter(function(p){return p.standing;}).length;
  var down=9-standing;
  var cs=Math.max(11,13*S);
  roundedChalk('DEVIL AMONG THE TAILORS', 18, 30, Math.max(12,15*S)+0, '#f2ece0', -0.015);
  roundedChalk('STANDING '+standing+'   DOWN ', 18, 30+cs+8, cs, 'rgba(242,236,224,0.92)', 0.01);
  // red tally figure for down count
  ctx.font=cs+'px Georgia'; ctx.fillStyle='rgba(242,236,224,0.92)';
  var wlab=ctx.measureText('STANDING '+standing+'   DOWN ').width;
  roundedChalk(''+down, 18+wlab, 30+cs+8, cs, '#b5262b', 0.01);
  roundedChalk('THROW '+(Math.min(3,4-throwsLeft))+' of 3', 18, 30+2*(cs+8), cs, 'rgba(242,236,224,0.85)', -0.008);
  var small=Math.max(10,11.5*S);
  roundedChalk('FULL HOUSES TAKEN ON THIS BOARD: '+fullHouses, 18, 30+2*(cs+8)+small+12, small, 'rgba(240,235,222,0.78)', 0.012);
  roundedChalk('BEST LEG (PINS IN 3): '+bestLeg, 18, 30+2*(cs+8)+2*small+18, small, 'rgba(240,235,222,0.78)', -0.01);

  // Cliff, down the bottom
  wrapDraw(msg, W/2, H-30, Math.min(W-48, 560), Math.max(13,15*S));
}

// ---- loop ----
var last=performance.now();
function frame(now){
  var dtf=(now-last)/16.667; if(dtf>2.5)dtf=2.5; if(dtf<=0)dtf=1; last=now;
  update(dtf); draw();
  requestAnimationFrame(frame);
}

// ---- resize ----
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W/430,(H-90)/301,1.9); if(S<0.5)S=0.5;
  postH=150*S; ox=W/2; oy=postH+34;
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);

// for whoever pokes about
console.log("%cCliff:","color:#b5262b;font-weight:bold"," wind her right BACK round the post — no, further! — now LET her go, boy.");
})();
</script>
