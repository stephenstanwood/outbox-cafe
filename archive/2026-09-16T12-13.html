  <meta name="outbox-spec-era" content="Tuesday 18 November 1834, right now — half past eleven on a raw bright morning in the back room of a chandler's shop in Hoxton Old Town, London, where a character plate for a melodrama that opened at the Royal Coburg eleven days ago has just come off the press, been hung on a line over the stove to dry, and is being sold over the counter at a penny the sheet plain and twopence coloured. Not a look-back at anything, not a lament, not a memory of a vanished trade: the piece will be off the Coburg bill inside six weeks, a rival in Duke's Court has had a plate of the same play out since Saturday afternoon, the boy who lays on the colour is paid by the gross and has 140 sheets still to do, and the block for figure 4's arm has split across the shoulder since the third pull.">
  <meta name="outbox-spec-format" content="A JUVENILE DRAMA CHARACTER PLATE — the page IS one sheet of penny toy-theatre printing, edge to edge at true size (a folio sheet about 8½ × 10¾ inches, deckled on one long edge where it was torn off the ream), lying square on a damp-stained deal counter seen straight down. No header, no menu, no scrollbar, no site chrome of any kind. It reads exactly as the object reads: a printed title band across the head naming the play and the theatre, eleven numbered figures crowded onto the sheet in profile and in two attitudes apiece with their character names set in tiny type beneath each pair, a plate number in the top right, a publisher's imprint line at the foot with a street address and a price line, two boxed lines of the publisher's own advertising puffery squeezed into whatever white space was left between the figures' feet, and a printed instruction in 6-point down the left margin about pasting to card and cutting. A pair of scissors lies across the lower right corner, a saucer with four cakes of colour and a puddle of gum water sits at the top left, and a strip of tin slides is stuck under the counter's edge at the bottom of frame where the little stage is.">
  <meta name="outbox-spec-subject" content="The flat mechanics and flat arithmetic of the juvenile drama trade, which is a piracy business and a printing business and has almost nothing to do with theatre. That the figures are not designed: they are COPIED, by a man sitting in the pit with a card and a pencil stub taking the costumes off the actual actors on the actual second night, because the costumes are the only thing the boys will check and a wrong sash gets a sheet sent back. That SPEED IS THE ENTIRE BUSINESS — a plate that is out eleven days after an opening sells and a plate that is out five weeks after it sells nothing at all, so a block is cut at a rate that would disgrace any other printing office, the figures are drawn without shading because shading is cutting time, and every character is shown in profile because profile is the only attitude that reads at two inches high and the only one that can be cut around with a child's scissors without losing a nose. That each character is given exactly TWO attitudes and no more — one standing and one striking — because two is what fits on the sheet at eleven characters and because a third costs a third more block. That the figures are drawn at a size set by the stage and not by the sheet: a toy proscenium is nine inches wide, a figure taller than two and a quarter inches cannot pass under the wings, and every plate in London is drawn to that number without it being printed anywhere. That the PENNY PRICE IS THE FIXED POINT and everything else is worked backwards from it — paper at so much the ream, an impression that must stay legible for eight hundred pulls off a worn block, and a margin of a fraction of a farthing a sheet, which is why a plate must sell in hundreds or not at all. That TWOPENCE COLOURED IS NOT TWICE THE WORK, IT IS ALL OF IT: the colouring is laid on by hand with four cakes — Prussian blue, chrome yellow, carmine lake and a made-up green — by a family at a table working assembly fashion, one colour to a person, at a rate per gross, and the reason the colour goes outside the line is not carelessness but that the rate is per gross. That the paper is barely sized, so a brush carrying too much gum water bleeds into the fibre and takes the neighbouring figure with it, and a brush carrying too little leaves the cake sitting on the surface and it lifts off when the sheet is pasted. That GUM ARABIC IS THE WHOLE CONTROL: thin gum floods, thick gum drags and dries streaky, and the working proportion is judged by how the puddle strings off the brush and is never written down. That the sheets must be PASTED TO CARD before cutting or the figure folds in half at the ankles the first time it is pushed on, and that the paste has to dry flat under a weight or the whole figure curls off its slide. That a figure is cut out and mounted on a TIN SLIDE — a strip of tinplate with a bent tab — and pushed on from the wings, which is why every figure faces one way only and why a character who must cross the stage needs a second slide bent the other way and therefore a second impression of the same figure, and this is the actual reason plates give two attitudes and nobody says so. That the scissors are the point of failure: an arm raised away from the body has to be cut around at a width of about a sixteenth of an inch of paper and it tears, and once torn it is gone, which is why the better-drawn plates keep every limb touching the mass of the body somewhere. That the BOOK OF WORDS is a separate sixpence and is where the money actually is, and the plate exists partly to sell it. That a rival can buy a penny sheet over your counter on Saturday, have a block cut from it by Wednesday and sell it in Duke's Court for the same penny, and there is nothing whatsoever to be done about that, which is why the imprint line is set in the largest type on the sheet. And the flat arithmetic on the counter: eleven figures, one split block, 140 sheets still to colour, and a play that comes off the bill on the 29th of next month.">
  <meta name="outbox-spec-tone" content="The loud, competitive, boasting-in-type voice of Jabez Cotterill-Drewe, 38, who cuts, prints, publishes and sells from this back room and who writes every line of type on the sheet himself, including the two boxed advertisements crammed between the figures' feet. It is not narration and it is not conversation — it is COPY, set to be read by a boy holding the sheet in a shop, and it does only what trade copy does: it names, it prices, it claims, and it attacks. He states where the likenesses were taken and on what night, and he states it twice, in two different boxes, because he knows it is the thing that sells. He gives a figure for everything: the price plain, the price coloured, the price of the Book of Words, the number of characters on the sheet, the number of plates already published in the series, and the number of new plates promised before Christmas. He is specifically and repeatedly aggrieved about exactly one thing — that a man in Duke's Court has copied three of his plates off the counter and sold them at the same price, and he says it three times, once with the man's name and once with the date the first one appeared — and he never uses the word piracy, only 'copied', and gives the plate numbers. He is proud of exactly one thing and states it twice: that no figure on any plate of his has ever been drawn from a printed account of a piece rather than from the piece itself, and he gives the number of productions he has sat through to say so. The key to the figures is set flat and functional — number, character name, act — and carries no voice at all, which makes the two advertisement boxes shout harder. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT a craftsman-sage, NOT a lovable-rogue printer, NOT Dickensian pastiche, NOT a barker or a showman, NOT charmed by himself, NOT the competent-tradesperson-saying-every-figure-twice voice, and NOT addressing the visitor as anything other than somebody who might hand over a penny.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and every applied colour on the sheet is COMPUTED and never chosen. The paper is cheap barely-sized printing stock in a warm grey-white (#e6e0cf), going browner along the deckled long edge (#d2c7ac) and carrying a real damp stain from the counter up through the lower left corner that has cockled the fibre and made it measurably thirstier there. The impression is a tired wood block printed in a lampblack ink that has gone thin and slightly brown in the worn areas (#2a2620 at the fresh lines, fading to #55503f wherever the block is polished down), with genuine ink squash at every line junction, a real bruise along figure 4's shoulder where the block has split, and two places where the sheet took no ink at all because the packing was low. Against that, EVERY STROKE OF COLOUR IS THE OUTPUT OF PIGMENT ARITHMETIC: each of the four cakes carries an actual pigment concentration, an actual particle coarseness and an actual gum-arabic fraction, and what renders is that load multiplied by how much water the brush is carrying and by the local sizing of the paper under it — so Prussian blue laid thin over the sized middle of the sheet reads a hard flat slate (#2c4f77) and the identical load laid on the damp-stained corner wicks into the fibre and goes soft, pale and haloed (#7d93ac); chrome yellow at full strength is opaque and slightly chalky (#d9a41c) and at half strength is a transparent wash that lets the line through (#e8cd7e); carmine lake is thin and staining and always goes outside the line by a real amount (#a8323c, bleeding to #c9757b at the edge); the made-up green is blue over yellow, laid wet on wet, so it is genuinely mottled and genuinely different every time and is sometimes just blue with yellow floating on it (#4e6b33). Overlaps multiply honestly and there is no such thing as opaque coverage on this paper. Exactly one chip of the shop's own stamp red (#c0331e) is held strictly for three things: the PRICE 1d handstamp in the lower right corner, the plate number in the head, and the rule under the imprint line — it never appears in a figure, never in the colouring saucer, never on the counter. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest ink squash, honest paper absorption and honest pigment load.">
  <meta name="outbox-spec-wildcard" content="Figure 6 is from the wrong play. The block for it was cut for a nautical drama two years ago, it has a boat cloak and a pistol and belongs to nothing on this sheet, and it is on the plate because it filled a hole in the forme and the forme was locked up at six in the morning. The engine treats it exactly as it treats every other figure: it is numbered 6, it is listed in the printed key with a character name that appears nowhere in the play named in the title band, it takes colour, it cuts, it pastes, it mounts on a slide and it walks on and off the stage like anything else. It cannot be struck out, skipped, marked, moved or removed by anything the visitor can do, and nothing on the page accounts for it — Jabez's advertising copy counts eleven characters twice and never mentions it. Same figure, same cloak, same key entry, every visit.">
  <meta name="outbox-spec-forbidden" content="NO toy-theatre-as-metaphor for anything — not childhood, not imagination, not the little stage as the whole world, not 'we are all figures pushed on from the wings', not flat characters, not playing a part; this is a two-and-a-quarter-inch figure on a bent tinplate slide and it has nothing to teach anybody. ABSOLUTELY NO childhood-wonder register: no enchantment, no magic of the theatre, no a-child's-first-play, no Christmas, no Stevenson's essay, no 'penny plain and twopence coloured' quoted as an epigraph or invoked as a phrase about anything, no nursery nostalgia, no lost-toys melancholy, no the-toys-remember. NO Victoriana whimsy of any kind: no Dickens pastiche, no Ye Olde spelling, no 'thee' or 'prithee', no gaslight-and-fog atmosphere, no cobbles-and-costermongers colour writing, no lovable-rogue printer, no plucky-urchin, no music-hall register, no steampunk, no penny-dreadful gothic, no Jack the Ripper drift, no London-as-character. NO theatre romance whatsoever: no greasepaint, no the-show-must-go-on, no footlights reverie, no actors-as-magicians, no the-audience-holds-its-breath — the Coburg is a building with a bill that changes and a second night on which a man sat in the pit with a pencil. NO child-labour sermon and NO poverty pathos: the boy colouring is on a rate per gross and the rate is a number, not an accusation, and the page must not editorialise in either direction. NO class commentary, NO Industrial Revolution essay, NO empire subtext, NO 'the birth of popular culture' thesis, NO media-history lecture, NO 'this is where cinema came from'. NO piracy-and-copyright essay: the man in Duke's Court is a competitor with a name and a date and the page draws no conclusion about intellectual property, ever. NO craftsman-sage register, NO 'the old block-cutters could take a costume off an actor in one look', NO trade mystique, NO reverence for hand skill, NO handmade-versus-machine sermon, NO master-and-apprentice arc, NO wise-elder figure. NO nostalgia, NO wistfulness, NO decline narrative, NO 'nobody makes these anymore', NO foreshadowing of anything past the 29th of next month, NO hindsight of any kind and NO knowing wink at the future. NO sensuous material writing about paper, ink or pigment beyond sizing, absorption, load, gum fraction and legibility; no describing colour as jewelled, glowing, singing or blooming. NO print-history reverence, NO typography love, NO letterform poetry, NO ephemera-collector register. ABSOLUTELY NO archival / museum / cabinet / drawer / collection / specimen / found-document / relic framing of the sheet whatsoever, despite it being a fragile printed paper object — it came off the press this morning, it is still faintly damp, it costs a penny, and it is going to be cut up with scissors. NO ledger, registry, inventory, index, catalogue or directory framing, despite the sheet carrying a numbered key. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, process-video, colouring-book-mindfulness, ambient-visualiser or screensaver framing of the brushwork or the cutting. NO puzzle-game or arcade register: no score, no level, no congratulations, no encouragement. NO teaching voice, NO explainer framing, NO tutorial register, NO 'and here's the clever part' — nothing on the page explains anything to anybody and there is no help text. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about figure 6, the split block, the torn limbs or the sheet that never resets — nothing here is wrong. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is half past eleven in the morning with the shop door open and the stove going. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
/* -------------------------------------------------------------
   Plate 47. Jabez sets his own type and cuts his own blocks.
   Key entry for 6 is "WALTER GRYMES, A SEAFARING MAN" — that block
   was cut for THE BLACK SCHOONER in '32. It filled a hole in the
   forme. The forme was locked at six this morning.
-------------------------------------------------------------- */
(function(){
"use strict";

/* ========== storage ========== */
var KEY="plate47.hoxton.v1";
var S=null;
function blank(){
  return {
    pulled:1, coloured:0,
    split:0.0,                 // extra length on fig 4's shoulder, in sheet units
    cakes:[1,1,1,1],
    gum:1, water:1,
    gumRatio:0.52,             // working proportion. never printed.
    load:0, loadPig:0, loadGum:0.52,
    pasted:false,
    paint:null, wetv:null, cells:null,
    cuts:[],                   // arrays of {x,y}
    scraps:[],                 // {x,y,pts,folded}
    mounted:{L:null,R:null},
    stagePos:{L:-1,R:-1}
  };
}
try{ S=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(!S || !S.cakes){ S=blank(); }
if(typeof S.gumRatio!=="number") S.gumRatio=0.52;
if(!S.mounted) S.mounted={L:null,R:null};
if(!S.stagePos) S.stagePos={L:-1,R:-1};

var saveT=0;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{
      S.paint=packPaint(); S.wetv=packWet(); S.cells=packCells();
      localStorage.setItem(KEY,JSON.stringify(S));
    }catch(e){}
  },500);
}

/* ========== geometry / fibre grid ========== */
var SW=680, SH=Math.round(680*10.75/8.5); // internal sheet px (860)
var GW=136, GH=172;                        // fibre cells (5px each)
var CELL=SW/GW;

var sheet=document.getElementById("sheet");
var cFib=document.getElementById("fibre"), cPaint=document.getElementById("paint"),
    cWet=document.getElementById("wet"), cImp=document.getElementById("impression"),
    cCut=document.getElementById("cuts");
[cFib,cPaint,cWet,cImp,cCut].forEach(function(c){ c.width=SW; c.height=SH; });
var gF=cFib.getContext("2d"), gP=cPaint.getContext("2d"),
    gW=cWet.getContext("2d"), gI=cImp.getContext("2d"), gC=cCut.getContext("2d");

/* sizing map: the lower-left corner is damp and under-sized forever */
var sizing=new Float32Array(GW*GH);
var wet=new Float32Array(GW*GH);
var pig=[new Float32Array(GW*GH),new Float32Array(GW*GH),new Float32Array(GW*GH),new Float32Array(GW*GH)];
var gumf=new Float32Array(GW*GH);

function hash(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
(function buildSizing(){
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var i=y*GW+x;
    var base=0.62+0.22*hash(x*0.7,y*0.7)+0.1*hash(x*0.13,y*0.21);
    // damp stain: lower left
    var dx=(x-10)/GW, dy=(y-GH+14)/GH;
    var d=Math.sqrt((dx*dx)*1.0+(dy*dy)*1.4);
    var stain=Math.max(0,1-d/0.55);
    base-= stain*0.48;
    // deckle edge on the right runs a shade browner & thirstier
    if(x>GW-4) base-=0.1;
    sizing[i]=Math.max(0.1,Math.min(1,base));
  }
})();
function stainAmt(x,y){
  var dx=(x-10)/GW, dy=(y-GH+14)/GH;
  var d=Math.sqrt((dx*dx)+(dy*dy)*1.4);
  return Math.max(0,1-d/0.55);
}

/* restore packed state */
function packPaint(){
  var a=[]; for(var p=0;p<4;p++){ var s=""; for(var i=0;i<GW*GH;i++){ s+=String.fromCharCode(32+Math.min(90,Math.round(pig[p][i]*90))); } a.push(s); }
  return a;
}
function packWet(){ var s=""; for(var i=0;i<GW*GH;i++) s+=String.fromCharCode(32+Math.min(90,Math.round(wet[i]*90))); return s; }
function packCells(){ var s=""; for(var i=0;i<GW*GH;i++) s+=String.fromCharCode(32+Math.min(90,Math.round(gumf[i]*90))); return s; }
if(S.paint){ try{ for(var p=0;p<4;p++){ var st=S.paint[p]; for(var i=0;i<GW*GH;i++) pig[p][i]=(st.charCodeAt(i)-32)/90; } }catch(e){} }
if(S.wetv){ try{ for(var i2=0;i2<GW*GH;i2++) wet[i2]=(S.wetv.charCodeAt(i2)-32)/90; }catch(e){} }
if(S.cells){ try{ for(var i3=0;i3<GW*GH;i3++) gumf[i3]=(S.cells.charCodeAt(i3)-32)/90; }catch(e){} }

/* ========== pigment arithmetic ========== */
/* each cake: [concentration, coarseness, own gum fraction, base rgb thin, base rgb thick] */
var PIG=[
  {name:"Prussian blue", conc:0.86, coarse:0.22, gum:0.60, thin:[124,147,172], thick:[44,79,119]},
  {name:"chrome yellow", conc:0.70, coarse:0.55, gum:0.45, thin:[232,205,126], thick:[217,164,28]},
  {name:"carmine lake",  conc:0.95, coarse:0.08, gum:0.38, thin:[201,117,123], thick:[168,50,60]},
  {name:"green",         conc:0.62, coarse:0.40, gum:0.55, thin:[126,150,101], thick:[78,107,51]}
];

/* ========== fibre texture (static) ========== */
(function drawFibre(){
  gF.clearRect(0,0,SW,SH);
  var img=gF.createImageData(SW,SH), d=img.data;
  for(var y=0;y<SH;y++)for(var x=0;x<SW;x++){
    var k=(y*SW+x)*4;
    var gx=Math.floor(x/CELL), gy=Math.floor(y/CELL);
    var sz=sizing[gy*GW+gx];
    var n=hash(x*0.53,y*0.91), n2=hash(x*0.07,y*0.11);
    var v=245-(1-sz)*38 - n*14 - n2*9;
    var st=stainAmt(gx,gy);
    var r=v, g=v-3-st*16, b=v-10-st*38;
    d[k]=r; d[k+1]=g; d[k+2]=b; d[k+3]=Math.round(26+ (1-sz)*46 + st*40);
  }
  gF.putImageData(img,0,0);
})();

/* ========== the block: eleven figures ========== */
/* each figure has two attitudes: standing, striking. profile. no shading. */
var FIGS=[
  {n:1,  name:"CAPT. RODERIC VANE",     act:"ACT I", col:0, row:0},
  {n:2,  name:"MARIAN TRELAWNY",        act:"ACT I", col:1, row:0},
  {n:3,  name:"OLD GURNEY, A LIMER",    act:"ACT I", col:2, row:0},
  {n:4,  name:"SILAS BRACK",            act:"ACT II",col:3, row:0},
  {n:5,  name:"LUCY, HER MAID",         act:"ACT I", col:0, row:1},
  {n:6,  name:"WALTER GRYMES, A SEAFARING MAN", act:"ACT II", col:1, row:1},
  {n:7,  name:"THE REVENUE OFFICER",    act:"ACT II",col:2, row:1},
  {n:8,  name:"DAME PENHALE",           act:"ACT II",col:3, row:1},
  {n:9,  name:"JEM, A WRECKER",         act:"ACT III",col:0, row:2},
  {n:10, name:"SIR HUGH ASHENDEN",      act:"ACT III",col:1, row:2},
  {n:11, name:"MARIAN (in the storm)",  act:"ACT III",col:2, row:2}
];

/* layout: 4 columns x 3 rows of figure-pairs, in the body of the sheet */
var BODY={x:SW*0.085, y:SH*0.112, w:SW*0.875, h:SH*0.70};
function cellBox(col,row){
  var cw=BODY.w/4, ch=BODY.h/3;
  return {x:BODY.x+col*cw, y:BODY.y+row*ch, w:cw, h:ch};
}

/* figure drawing — flat profile outlines, no shading. built from segment lists. */
function figurePath(g, f, x, y, h, striking){
  // h = figure height in px; profile facing right.
  var u=h/100;
  g.beginPath();
  var head=[x, y];
  // head
  g.moveTo(x-6*u, y+8*u);
  g.bezierCurveTo(x-6*u,y-1*u, x+7*u,y-2*u, x+7*u,y+8*u);
  g.bezierCurveTo(x+7*u,y+15*u, x-3*u,y+17*u, x-5*u,y+13*u);
  g.closePath();
  g.stroke();
  // hat / headgear varies
  g.beginPath();
  if(f.n===1||f.n===7||f.n===10){ g.moveTo(x-11*u,y+3*u); g.lineTo(x+11*u,y+2*u); g.lineTo(x+7*u,y-4*u); g.lineTo(x-4*u,y-5*u); g.closePath(); }
  else if(f.n===6){ /* boat cloak hood + brim */ g.moveTo(x-13*u,y+5*u); g.lineTo(x+12*u,y+3*u); g.lineTo(x+4*u,y-6*u); g.lineTo(x-6*u,y-5*u); g.closePath(); }
  else if(f.n===3||f.n===9){ g.moveTo(x-8*u,y+1*u); g.lineTo(x+8*u,y+0*u); g.lineTo(x+5*u,y-5*u); g.lineTo(x-5*u,y-4*u); g.closePath(); }
  else { /* bonnet / hair */ g.moveTo(x-8*u,y+12*u); g.bezierCurveTo(x-11*u,y+2*u,x+3*u,y-6*u,x+8*u,y+4*u); }
  g.stroke();
  // body / coat / skirt
  g.beginPath();
  var female=(f.n===2||f.n===5||f.n===8||f.n===11);
  g.moveTo(x-5*u,y+17*u);
  if(female){
    g.lineTo(x-6*u,y+42*u);
    g.lineTo(x-16*u,y+96*u);
    g.lineTo(x+15*u,y+96*u);
    g.lineTo(x+6*u,y+42*u);
    g.lineTo(x+5*u,y+17*u);
  } else if(f.n===6){
    // boat cloak — falls to the calf, hangs wide
    g.lineTo(x-14*u,y+62*u);
    g.lineTo(x-11*u,y+78*u);
    g.lineTo(x+13*u,y+78*u);
    g.lineTo(x+10*u,y+44*u);
    g.lineTo(x+5*u,y+17*u);
  } else {
    g.lineTo(x-7*u,y+46*u);
    g.lineTo(x-6*u,y+62*u);
    g.lineTo(x+8*u,y+62*u);
    g.lineTo(x+7*u,y+44*u);
    g.lineTo(x+5*u,y+17*u);
  }
  g.closePath(); g.stroke();
  // legs
  if(!female){
    g.beginPath();
    g.moveTo(x-5*u,y+62*u); g.lineTo(x-7*u,y+92*u); g.lineTo(x-13*u,y+96*u); g.lineTo(x-1*u,y+96*u); g.lineTo(x+1*u,y+62*u);
    g.stroke();
    g.beginPath();
    g.moveTo(x+3*u,y+62*u); g.lineTo(x+6*u,y+92*u); g.lineTo(x+14*u,y+96*u); g.lineTo(x+2*u,y+96*u);
    g.stroke();
  } else {
    g.beginPath(); g.moveTo(x-16*u,y+96*u); g.lineTo(x+15*u,y+96*u); g.stroke();
  }
  // arm — the whole argument. standing: arm along the body. striking: arm out.
  g.beginPath();
  if(!striking){
    g.moveTo(x+2*u,y+20*u); g.lineTo(x+7*u,y+40*u); g.lineTo(x+4*u,y+56*u); g.lineTo(x-1*u,y+56*u); g.lineTo(x-2*u,y+38*u); g.closePath();
  } else {
    g.moveTo(x+2*u,y+20*u); g.lineTo(x+18*u,y+12*u); g.lineTo(x+26*u,y-2*u); g.lineTo(x+22*u,y-6*u); g.lineTo(x+15*u,y+5*u); g.lineTo(x+1*u,y+14*u); g.closePath();
  }
  g.stroke();
  // props
  g.beginPath();
  if(f.n===6){ // pistol, always. it came with the block.
    if(striking){ g.moveTo(x+26*u,y-3*u); g.lineTo(x+38*u,y-7*u); g.lineTo(x+38*u,y-2*u); g.lineTo(x+29*u,y+1*u); g.lineTo(x+28*u,y+6*u); g.lineTo(x+25*u,y+2*u); g.closePath(); }
    else { g.moveTo(x+4*u,y+56*u); g.lineTo(x+12*u,y+62*u); g.lineTo(x+10*u,y+66*u); g.lineTo(x+2*u,y+60*u); g.closePath(); }
  } else if(f.n===1||f.n===7||f.n===10){
    if(striking){ g.moveTo(x+26*u,y-2*u); g.lineTo(x+46*u,y-22*u); g.lineTo(x+48*u,y-19*u); g.lineTo(x+28*u,y+2*u); g.closePath(); }
  } else if(f.n===9||f.n===3){
    if(striking){ g.moveTo(x+25*u,y-2*u); g.lineTo(x+30*u,y-24*u); g.lineTo(x+34*u,y-24*u); g.lineTo(x+29*u,y+1*u); g.closePath(); }
  } else if(f.n===11 && striking){
    g.moveTo(x-16*u,y+96*u); g.lineTo(x-26*u,y+72*u); g.lineTo(x-22*u,y+70*u); g.lineTo(x-13*u,y+92*u); g.closePath();
  }
  g.stroke();
  // sash / belt — the only thing the boys check
  g.beginPath();
  g.moveTo(x-6*u,y+30*u); g.lineTo(x+7*u,y+26*u); g.lineTo(x+8*u,y+33*u); g.lineTo(x-5*u,y+37*u); g.closePath();
  g.stroke();
}

/* ink squash, worn block, low packing */
function drawImpression(){
  gI.clearRect(0,0,SW,SH);
  var count=S.pulled;
  // two places where the sheet took no ink at all (low packing)
  gI.save();
  gI.lineJoin="round"; gI.lineCap="round";
  FIGS.forEach(function(f){
    var b=cellBox(f.col,f.row);
    var fh=b.h*0.60;
    var baseY=b.y+b.h*0.10;
    for(var a=0;a<2;a++){
      var cx=b.x+b.w*(a===0?0.30:0.70);
      // wear: worn areas print lighter with each pull
      var wear=Math.min(0.55, (count-1)*0.012 + (f.row===2?0.10:0) + (a?0.05:0));
      var col=mix([42,38,32],[85,80,63], wear + 0.18*hash(f.n,a));
      gI.strokeStyle="rgba("+col[0]+","+col[1]+","+col[2]+",0.95)";
      gI.lineWidth=1.9;
      figurePath(gI,f,cx,baseY,fh,a===1);
      // ink squash at junctions: a second, fatter, fainter pass
      gI.globalAlpha=0.30; gI.lineWidth=3.4;
      gI.strokeStyle="rgba("+col[0]+","+col[1]+","+col[2]+",1)";
      figurePath(gI,f,cx,baseY,fh,a===1);
      gI.globalAlpha=1;
      // fig 4's shoulder: the split
      if(f.n===4){
        var sy=baseY+fh*0.20, sx=cx-fh*0.05;
        var len=fh*(0.14+S.split);
        gI.strokeStyle="rgba(38,34,28,0.88)";
        gI.lineWidth=1.1+S.split*7;
        gI.beginPath();
        gI.moveTo(sx,sy);
        gI.lineTo(sx+len*0.75, sy+len*0.45);
        gI.stroke();
        // bruise
        var grd=gI.createRadialGradient(sx+len*0.3,sy+len*0.2,1,sx+len*0.3,sy+len*0.2,len*1.1+6);
        grd.addColorStop(0,"rgba(45,40,32,0.34)"); grd.addColorStop(1,"rgba(45,40,32,0)");
        gI.fillStyle=grd; gI.beginPath(); gI.arc(sx+len*0.3,sy+len*0.2,len*1.1+6,0,6.3); gI.fill();
      }
    }
  });
  gI.restore();
  // low packing: two patches took no ink
  gI.globalCompositeOperation="destination-out";
  gI.beginPath(); gI.ellipse(SW*0.62,SH*0.33,26,13,0.4,0,6.3); gI.fill();
  gI.beginPath(); gI.ellipse(SW*0.22,SH*0.585,17,20,-0.3,0,6.3); gI.fill();
  gI.globalCompositeOperation="source-over";
}
function mix(a,b,t){ t=Math.max(0,Math.min(1,t)); return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]; }
drawImpression();

/* ========== typesetting on the sheet ========== */
(function setType(){
  var L=document.getElementById("typelayer");
  var h="";
  h+='<div class="txt band">'+
       '<div class="play">The Wrecker&rsquo;s Daughter</div>'+
       '<div class="rule"></div>'+
       '<div class="sub">As now performing at the Royal Coburg Theatre &mdash; Eleven Characters &mdash; Two Attitudes each</div>'+
       '<div class="rule2"></div>'+
     '</div>';
  h+='<div class="txt plateno">PLATE 47</div>';
  h+='<div class="txt marginal">PASTE THIS SHEET ON THIN CARD AND LET IT DRY FLAT UNDER A WEIGHT BEFORE ANY CUTTING IS BEGUN. CUT ROUND THE OUTER LINE ONLY.</div>';

  // key names under each pair
  FIGS.forEach(function(f){
    var b=cellBox(f.col,f.row);
    var left=(b.x/SW*100), top=((b.y+b.h*0.755)/SH*100), w=(b.w/SW*100);
    h+='<div class="txt keyname" style="left:'+left.toFixed(2)+'%;top:'+top.toFixed(2)+'%;width:'+w.toFixed(2)+'%"><b>'+f.n+'.</b> '+f.name+'<br><i>'+f.act+'</i></div>';
  });

  // two boxes of puffery, squeezed into what was left
  var b1=cellBox(3,2);
  h+='<div class="txt advt" style="left:'+((b1.x+2)/SW*100).toFixed(2)+'%;top:'+((b1.y+6)/SH*100).toFixed(2)+'%;width:'+((b1.w-6)/SW*100).toFixed(2)+'%">'+
     '<b>EVERY DRESS ON THIS SHEET TAKEN IN THE PIT ON THE SECOND NIGHT, THURSDAY THE 8th.</b> Not one figure of mine was ever drawn from a printed account of a piece. '+
     'Eleven characters. Book of Words, SIXPENCE, containing the whole of the dialogue and the business.'+
     '</div>';
  var b2=cellBox(0,2);
  h+='<div class="txt advt" style="left:'+((b2.x+SW*0.135)/SW*100).toFixed(2)+'%;top:'+((b2.y+b2.h*0.905)/SH*100).toFixed(2)+'%;width:'+((SW*0.60)/SW*100).toFixed(2)+'%">'+
     '<b>46 PLATES PUBLISHED. SIX MORE BEFORE CHRISTMAS.</b> The dresses on this sheet were taken from the actors themselves in the pit of the Coburg, second night, Thursday the 8th of this month &mdash; 212 pieces sat through and no figure of mine yet copied out of a newspaper. '+
     'PLATES 29, 31 and 38 have been COPIED off my counter by MOSS SHERRICK of Duke&rsquo;s Court and sold at my own price, the first of them on the 3rd of September. ASK FOR THE IMPRINT.'+
     '</div>';

  h+='<div class="txt imprint">'+
       '<div class="redrule"></div>'+
       '<div class="big">J. COTTERILL-DREWE, 14 PITFIELD PASSAGE, HOXTON OLD TOWN</div>'+
       '<div class="small">Penny plain. Twopence coloured. Book of Words sixpence. Tin slides a halfpenny the dozen. Plates 29, 31 and 38 copied by M. Sherrick, Duke&rsquo;s Court &mdash; look for this name at the foot of the sheet.</div>'+
       '<div class="live" id="livecount">PLATE 47 &mdash; SHEETS PULLED: 1 &mdash; SHEETS COLOURED: 0</div>'+
     '</div>';
  h+='<div class="stamp">PRICE 1d</div>';
  L.innerHTML=h;
})();

/* ========== audio ========== */
var AC=null, bed=null;
function ac(){
  if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  startBed();
  return AC;
}
function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
var brushSrc=null,brushGain=null,brushFilt=null;
function brushOn(){
  var a=ac(); if(!a) return;
  if(brushSrc) return;
  brushSrc=a.createBufferSource(); brushSrc.buffer=noiseBuf(2); brushSrc.loop=true;
  brushFilt=a.createBiquadFilter(); brushFilt.type="bandpass"; brushFilt.frequency.value=1800; brushFilt.Q.value=0.7;
  brushGain=a.createGain(); brushGain.gain.value=0;
  brushSrc.connect(brushFilt).connect(brushGain).connect(a.destination);
  brushSrc.start();
}
function brushOff(){
  if(!brushSrc) return;
  try{ brushGain.gain.setTargetAtTime(0,AC.currentTime,0.03); var s=brushSrc; setTimeout(function(){try{s.stop();}catch(e){}},200);}catch(e){}
  brushSrc=null;
}
function brushSet(speed,wetness,load){
  if(!brushGain) return;
  var t=AC.currentTime;
  brushGain.gain.setTargetAtTime(Math.min(0.09,0.012+speed*0.05),t,0.02);
  // dry brush = brighter, grainier
  brushFilt.frequency.setTargetAtTime(900+ (1-wetness)*3200 + (1-load)*1500 + speed*600, t, 0.04);
  brushFilt.Q.setTargetAtTime(0.5+(1-load)*2.2,t,0.05);
}
function tick(pitch,dur,gainv,type){
  var a=ac(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.value=pitch;
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(gainv,a.currentTime+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(dur||0.09));
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.09)+0.02);
}
function noiseHit(freq,Q,dur,gainv,type){
  var a=ac(); if(!a) return;
  var s=a.createBufferSource(); s.buffer=noiseBuf(dur+0.05);
  var f=a.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq; f.Q.value=Q;
  var g=a.createGain();
  g.gain.setValueAtTime(gainv,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(); s.stop(a.currentTime+dur+0.05);
}
function snip(len){ noiseHit(2600+Math.random()*900,4,0.045+len*0.0004,0.08); }
function tearSound(){ noiseHit(1100,1.1,0.30,0.11,"bandpass"); noiseHit(420,0.8,0.22,0.07); }
function tinRing(){ tick(2480,0.34,0.035,"triangle"); tick(3710,0.28,0.016,"sine"); }
function wetTick(rem){ noiseHit(700+rem*1700,6,0.055,0.06); tick(320+rem*420,0.05,0.02,"sine"); }
function peelSound(){ noiseHit(1500,0.8,0.5,0.045,"highpass"); }
function startBed(){
  if(bed||!AC) return; bed={};
  var a=AC;
  var g=a.createGain(); g.gain.value=0.055; g.connect(a.destination); bed.g=g;
  // shop bed: two people at the counter, no words
  var mur=a.createBufferSource(); mur.buffer=noiseBuf(4); mur.loop=true;
  var mf=a.createBiquadFilter(); mf.type="bandpass"; mf.frequency.value=320; mf.Q.value=1.3;
  var mg=a.createGain(); mg.gain.value=0.16;
  mur.connect(mf).connect(mg).connect(g); mur.start();
  var lfo=a.createOscillator(); lfo.frequency.value=0.7; var lg=a.createGain(); lg.gain.value=0.12;
  lfo.connect(lg).connect(mg.gain); lfo.start();
  // stove ticking
  (function stove(){
    if(!AC) return;
    noiseHit(2100,9,0.02,0.02);
    setTimeout(stove, 1400+Math.random()*2600);
  })();
  // press worked in the same room, irregular, frisket slapping down
  (function press(){
    if(!AC) return;
    noiseHit(180,0.9,0.18,0.10,"lowpass");           // bar pulled
    setTimeout(function(){ noiseHit(900,1.2,0.07,0.07); },300);  // frisket slap
    setTimeout(function(){ noiseHit(140,0.7,0.22,0.09,"lowpass"); },1050); // bed run out
    setTimeout(press, 4200+Math.random()*5200);
  })();
  // handcart on cobbles outside
  (function cart(){
    if(!AC) return;
    var n=8+Math.floor(Math.random()*10);
    for(var i=0;i<n;i++){ (function(i){ setTimeout(function(){ noiseHit(90+Math.random()*130,1.4,0.06,0.035,"lowpass"); }, i*115+Math.random()*40); })(i); }
    setTimeout(cart, 16000+Math.random()*24000);
  })();
}
document.addEventListener("pointerdown",function once(){ ac(); document.removeEventListener("pointerdown",once); },{once:true});

/* ========== brush state ========== */
var mode="brush"; // brush | scissors
var curPig=0;
var brush={load:S.load||0, pig:S.loadPig||0, gum:S.loadGum||0.52, water:0.5};
brush.pig=curPig;

function charge(p){
  if(S.cakes[p]<=0.001){ wetTick(0); return; }
  var take=Math.min(S.cakes[p],0.016);
  S.cakes[p]-=take;
  curPig=p; brush.pig=p;
  brush.load=Math.min(1, brush.load*0.2 + 0.85);
  brush.gum = brush.gum*0.35 + S.gumRatio*0.65;
  wetTick(S.cakes[p]);
  ui(); save();
}
function loadGum(){
  if(S.gum<=0.001) return;
  S.gum-=0.010;
  S.gumRatio=Math.min(0.95,S.gumRatio+0.055);
  brush.gum=Math.min(0.95,brush.gum+0.09);
  tick(220,0.11,0.03,"sine"); ui(); save();
}
function loadWater(){
  if(S.water<=0.001) return;
  S.water-=0.010;
  S.gumRatio=Math.max(0.10,S.gumRatio-0.060);
  brush.gum=Math.max(0.08,brush.gum-0.10);
  brush.load=Math.min(1,brush.load+0.25);
  tick(520,0.09,0.025,"sine"); ui(); save();
}

/* ========== painting ========== */
function paintAt(gx,gy,speed){
  if(brush.load<=0.002) return false;
  var rad=2.0 + brush.load*1.4 + (1-brush.gum)*0.9;
  var deposited=0;
  var P=PIG[brush.pig];
  for(var dy=-3;dy<=3;dy++)for(var dx=-3;dx<=3;dx++){
    var x=gx+dx, y=gy+dy; if(x<0||y<0||x>=GW||y>=GH) continue;
    var dist=Math.sqrt(dx*dx+dy*dy); if(dist>rad) continue;
    var i=y*GW+x;
    var falloff=1-dist/rad;
    var sz=sizing[i];
    // thick gum drags: less flows off the brush. thin gum floods.
    var flow=(0.34 - brush.gum*0.16) * falloff * brush.load;
    // under-sized paper drinks more
    var take=flow*(1 + (1-sz)*0.9)*P.conc;
    pig[brush.pig][i]=Math.min(1.6, pig[brush.pig][i]+take);
    wet[i]=Math.min(1.3, wet[i]+flow*(1.5 - brush.gum*0.6)*(1+(1-sz)*0.5));
    gumf[i]=Math.min(1, gumf[i]*0.7 + brush.gum*0.3);
    deposited+=take;
  }
  // honest depletion along the stroke
  brush.load=Math.max(0, brush.load - deposited*0.55 - 0.004 - speed*0.0015);
  return true;
}

/* capillary bleed + drying, on a real clock */
var lastTick=performance.now();
function physics(dt){
  var steps=Math.min(3,Math.max(1,Math.round(dt/40)));
  for(var s=0;s<steps;s++){
    for(var y=1;y<GH-1;y++){
      for(var x=1;x<GW-1;x++){
        var i=y*GW+x;
        var w=wet[i]; if(w<=0.004) continue;
        var sz=sizing[i];
        // capillary rate: unsized, wet, thin-gum => runs
        var rate=0.055*(1-sz*0.78)*Math.min(1,w)*(1.25-gumf[i]*0.8);
        if(rate<=0) continue;
        var nb=[i-1,i+1,i-GW,i+GW];
        for(var k=0;k<4;k++){
          var j=nb[k];
          var grad=w-wet[j]; if(grad<=0) continue;
          var flow=rate*grad*0.25;
          wet[i]-=flow; wet[j]+=flow;
          for(var p=0;p<4;p++){
            if(pig[p][i]<=0.002) continue;
            // lake is thin and staining: it travels further
            var mob=(p===2?1.65:(p===0?1.0:(p===1?0.55:0.8)));
            var move=pig[p][i]*flow*1.4*mob;
            pig[p][i]-=move; pig[p][j]=Math.min(1.7,pig[p][j]+move);
          }
        }
        // drying
        wet[i]=Math.max(0, wet[i]-0.0055*(0.6+sz*0.9)*(1.1-gumf[i]*0.35));
      }
    }
  }
}

/* render */
var dirty=true;
function render(){
  var img=gP.createImageData(GW,GH), d=img.data;
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var i=y*GW+x, k=i*4;
    var r=255,g=255,b=255,anyt=0;
    for(var p=0;p<4;p++){
      var v=pig[p][i]; if(v<=0.004) continue;
      var P=PIG[p], sz=sizing[i];
      // load * water carried * local sizing => thin wash vs flat body
      var strength=Math.min(1, v*(0.55+sz*0.75));
      var c=mix(P.thin,P.thick,strength);
      // wicked into unsized fibre: pale and haloed
      if(sz<0.42){ c=mix(c,P.thin,(0.42-sz)*1.5); }
      // thick gum sits up and dries streaky
      if(gumf[i]>0.72){
        var streak=hash(x*3.1,y*0.4);
        c=mix(c,[Math.min(255,c[0]+26),Math.min(255,c[1]+22),Math.min(255,c[2]+18)],streak*0.45);
      }
      var alpha=Math.min(0.95, v*(0.75+P.coarse*0.35));
      // overlaps multiply honestly
      r=r*(1-alpha)+ (r*c[0]/255)*alpha;
      g=g*(1-alpha)+ (g*c[1]/255)*alpha;
      b=b*(1-alpha)+ (b*c[2]/255)*alpha;
      anyt=Math.max(anyt,alpha);
    }
    d[k]=r; d[k+1]=g; d[k+2]=b; d[k+3]=Math.round(anyt*255);
  }
  var tmp=document.createElement("canvas"); tmp.width=GW; tmp.height=GH;
  tmp.getContext("2d").putImageData(img,0,0);
  gP.clearRect(0,0,SW,SH);
  gP.imageSmoothingEnabled=true;
  gP.globalCompositeOperation="multiply";
  gP.drawImage(tmp,0,0,SW,SH);
  gP.globalCompositeOperation="source-over";

  // wet sheen layer (barely: no glow, just a damp darkening)
  var wi=gW.createImageData(GW,GH), wd=wi.data;
  for(var i2=0;i2<GW*GH;i2++){
    var ww=Math.min(1,wet[i2]);
    wd[i2*4]=206; wd[i2*4+1]=198; wd[i2*4+2]=176; wd[i2*4+3]=Math.round(ww*70);
  }
  var t2=document.createElement("canvas"); t2.width=GW;t2.height=GH;
  t2.getContext("2d").putImageData(wi,0,0);
  gW.clearRect(0,0,SW,SH); gW.drawImage(t2,0,0,SW,SH);
}

/* ========== cutting ========== */
var cutting=null;
function drawCuts(){
  gC.clearRect(0,0,SW,SH);
  gC.lineCap="round"; gC.lineJoin="round";
  S.cuts.forEach(function(path){
    if(path.length<2) return;
    // the cut itself: paper removed, counter shows through
    gC.strokeStyle="rgba(58,48,38,0.92)"; gC.lineWidth=3.2;
    gC.beginPath(); gC.moveTo(path[0].x,path[0].y);
    for(var i=1;i<path.length;i++) gC.lineTo(path[i].x,path[i].y);
    gC.stroke();
    gC.strokeStyle="rgba(214,205,182,0.55)"; gC.lineWidth=1.2;
    gC.beginPath(); gC.moveTo(path[0].x,path[0].y);
    for(var j=1;j<path.length;j++) gC.lineTo(path[j].x,path[j].y);
    gC.stroke();
  });
  if(cutting&&cutting.length>1){
    gC.strokeStyle="rgba(58,48,38,0.9)"; gC.lineWidth=3.2;
    gC.beginPath(); gC.moveTo(cutting[0].x,cutting[0].y);
    for(var m=1;m<cutting.length;m++) gC.lineTo(cutting[m].x,cutting[m].y);
    gC.stroke();
  }
}
/* did this cut sever a raised arm? check against the striking-attitude arm boxes */
function armBoxes(){
  var out=[];
  FIGS.forEach(function(f){
    var b=cellBox(f.col,f.row);
    var fh=b.h*0.60, u=fh/100;
    var cx=b.x+b.w*0.70, cy=b.y+b.h*0.10;
    out.push({f:f, x:cx+1*u, y:cy-8*u, w:27*u, h:26*u, cx:cx, cy:cy, fh:fh});
  });
  return out;
}
function finishCut(path){
  if(path.length<3) return;
  S.cuts.push(path.map(function(p){return {x:Math.round(p.x),y:Math.round(p.y)};}));
  // length of the cut drives the per-snip rhythm (already played live)
  var boxes=armBoxes(), tore=false;
  boxes.forEach(function(bx){
    if(bx.torn) return;
    var inside=0;
    for(var i=0;i<path.length;i++){
      var p=path[i];
      if(p.x>bx.x&&p.x<bx.x+bx.w&&p.y>bx.y&&p.y<bx.y+bx.h) inside++;
    }
    if(inside>3){
      tore=true;
      // the arm comes off. a sixteenth of an inch of paper and it is gone.
      makeScrap(bx);
    }
  });
  if(tore) tearSound();
  // a closed-ish path makes a loose figure
  var a=path[0], z=path[path.length-1];
  var d=Math.hypot(a.x-z.x,a.y-z.y);
  if(d<34 && path.length>18){ makeFigureScrap(path); }
  drawCuts(); save();
}
var scrapEl=[];
function makeScrap(bx){
  var s={x:bx.x, y:bx.y, w:bx.w, h:bx.h, kind:"limb", n:bx.f.n, fold:false,
         left:20+Math.random()*60, top:6+Math.random()*30, rot:(Math.random()*40-20)};
  S.scraps.push(s); spawnScrap(s);
}
function makeFigureScrap(path){
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  path.forEach(function(p){minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y);});
  var w=maxx-minx, h=maxy-miny; if(w<12||h<20) return;
  var s={x:minx,y:miny,w:w,h:h,kind:"figure",pasted:S.pasted,fold:false,
         left:10+Math.random()*70, top:4+Math.random()*30, rot:(Math.random()*24-12)};
  S.scraps.push(s); spawnScrap(s);
}
function scrapCanvas(s){
  var c=document.createElement("canvas");
  var sc=1.0;
  c.width=Math.max(4,Math.round(s.w*sc)); c.height=Math.max(4,Math.round(s.h*sc));
  var g=c.getContext("2d");
  g.drawImage(cFib,s.x,s.y,s.w,s.h,0,0,c.width,c.height);
  g.drawImage(cPaint,s.x,s.y,s.w,s.h,0,0,c.width,c.height);
  g.drawImage(cImp,s.x,s.y,s.w,s.h,0,0,c.width,c.height);
  // paper body behind
  var out=document.createElement("canvas"); out.width=c.width; out.height=c.height;
  var og=out.getContext("2d");
  og.fillStyle="#e6e0cf"; og.fillRect(0,0,out.width,out.height);
  og.drawImage(c,0,0);
  if(s.fold){
    og.strokeStyle="rgba(70,60,44,0.65)"; og.lineWidth=1.4;
    og.beginPath(); og.moveTo(0,out.height*0.72); og.lineTo(out.width,out.height*0.76); og.stroke();
    og.fillStyle="rgba(0,0,0,0.18)"; og.fillRect(0,out.height*0.72,out.width,out.height*0.28);
  }
  return out;
}
function spawnScrap(s){
  var yard=document.getElementById("scrapyard");
  var img=document.createElement("img");
  img.className="scrap";
  img.alt="loose scrap cut from the sheet";
  img.src=scrapCanvas(s).toDataURL();
  var maxw=Math.min(90, s.w*0.55);
  img.style.width=maxw+"px";
  img.style.left=s.left+"%"; img.style.top=s.top+"px";
  img.style.transform="rotate("+s.rot+"deg)";
  img.dataset.kind=s.kind;
  img._s=s;
  yard.appendChild(img);
  scrapEl.push(img);
  dragScrap(img);
}
S.scraps.forEach(spawnScrap);

function dragScrap(img){
  var dx=0,dy=0,drag=false;
  img.addEventListener("pointerdown",function(e){
    drag=true; img.setPointerCapture(e.pointerId);
    var r=img.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top;
    img.style.cursor="grabbing"; e.preventDefault();
  });
  img.addEventListener("pointermove",function(e){
    if(!drag) return;
    var yr=document.getElementById("scrapyard").getBoundingClientRect();
    img.style.left=((e.clientX-dx-yr.left)/yr.width*100)+"%";
    img.style.top=(e.clientY-dy-yr.top)+"px";
  });
  img.addEventListener("pointerup",function(e){
    drag=false; img.style.cursor="grab";
    img._s.left=parseFloat(img.style.left); img._s.top=parseFloat(img.style.top);
    // dropped on a slide?
    document.querySelectorAll(".slide").forEach(function(sl){
      var r=sl.getBoundingClientRect();
      if(e.clientX>r.left-24&&e.clientX<r.right+24&&e.clientY>r.top-24&&e.clientY<r.bottom+24){
        mount(sl.dataset.hand, img);
      }
    });
    save();
  });
}

/* ========== mounting & the little stage ========== */
var stage=document.getElementById("stage");
var onstage={L:null,R:null};
function mount(hand,img){
  tinRing();
  var s=img._s;
  if(!s.pasted && s.kind==="figure" && !s.fold){
    // not pasted to card: it folds at its narrowest point, once, forever
    s.fold=true; img.src=scrapCanvas(s).toDataURL();
    noiseHit(600,1.2,0.16,0.05);
  } else if(s.kind==="limb" && !s.fold){
    s.fold=true; img.src=scrapCanvas(s).toDataURL();
  }
  if(onstage[hand]){ try{ onstage[hand].remove(); }catch(e){} }
  var f=document.createElement("img");
  f.className="figonstage";
  f.alt="figure mounted on a tin slide";
  f.src=img.src;
  f.style.height=Math.min(95, s.h*0.30)+"px";
  if(hand==="R") f.style.transform="scaleX(-1)";
  stage.appendChild(f);
  onstage[hand]=f;
  S.stagePos[hand]= (hand==="L") ? -0.1 : 1.1;
  S.mounted[hand]=true;
  placeFig(hand);
  document.querySelectorAll(".slide").forEach(function(sl){ sl.classList.toggle("sel", sl.dataset.hand===hand); });
  selSlide=hand;
  save();
}
function placeFig(hand){
  var f=onstage[hand]; if(!f) return;
  var p=S.stagePos[hand];
  f.style.left=(p*100)+"%";
}
var selSlide="L";
document.querySelectorAll(".slide").forEach(function(sl){
  sl.addEventListener("click",function(){
    selSlide=sl.dataset.hand;
    document.querySelectorAll(".slide").forEach(function(s2){s2.classList.toggle("sel",s2===sl);});
    tinRing();
  });
});
document.querySelector(".slide.L").classList.add("sel");
function push(dir){
  var hand=selSlide;
  if(!onstage[hand]) { tinRing(); return; }
  var p=S.stagePos[hand];
  // a figure on a left-hand slide physically cannot come in from the right
  if(hand==="L"){ p=Math.max(-0.12, Math.min(0.72, p+dir*0.07)); }
  else          { p=Math.max(0.16, Math.min(1.10, p+dir*0.07)); }
  S.stagePos[hand]=p;
  placeFig(hand);
  noiseHit(3000,7,0.02,0.012);
  save();
}

/* ========== input on the sheet ========== */
function toSheet(e){
  var r=sheet.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*SW, y:(e.clientY-r.top)/r.height*SH };
}
var down=false, lastP=null, lastT=0, cutAccum=0;
sheet.addEventListener("pointerdown",function(e){
  ac(); down=true; sheet.setPointerCapture(e.pointerId);
  lastP=toSheet(e); lastT=performance.now();
  if(mode==="scissors"){ cutting=[lastP]; cutAccum=0; }
  else { brushOn(); }
  e.preventDefault();
});
sheet.addEventListener("pointermove",function(e){
  if(!down) return;
  var p=toSheet(e), now=performance.now();
  var dist=Math.hypot(p.x-lastP.x,p.y-lastP.y);
  var dt=Math.max(1,now-lastT);
  var speed=Math.min(1,dist/dt*0.9);
  if(mode==="scissors"){
    cutting.push(p);
    cutAccum+=dist;
    if(cutAccum>14){ snip(cutAccum); cutAccum=0; }
    drawCuts();
  } else {
    var steps=Math.max(1,Math.ceil(dist/3));
    var painted=false;
    for(var i=0;i<steps;i++){
      var t=i/steps;
      var x=lastP.x+(p.x-lastP.x)*t, y=lastP.y+(p.y-lastP.y)*t;
      if(paintAt(Math.floor(x/CELL),Math.floor(y/CELL),speed)) painted=true;
    }
    if(painted && !S._colouredThisSheet){ S._colouredThisSheet=true; S.coloured++; ui(); }
    var wetHere=wet[Math.floor(p.y/CELL)*GW+Math.floor(p.x/CELL)]||0;
    brushSet(speed, Math.min(1,wetHere), brush.load);
    dirty=true; ui();
  }
  lastP=p; lastT=now;
});
function endPointer(){
  if(!down) return; down=false;
  if(mode==="scissors"&&cutting){ finishCut(cutting); cutting=null; }
  brushOff(); save();
}
sheet.addEventListener("pointerup",endPointer);
sheet.addEventListener("pointercancel",endPointer);
sheet.addEventListener("pointerleave",endPointer);

/* ========== blow ========== */
function blow(){
  if(!lastP) return;
  var gx=Math.floor(lastP.x/CELL), gy=Math.floor(lastP.y/CELL);
  for(var dy=-7;dy<=7;dy++)for(var dx=-7;dx<=7;dx++){
    var x=gx+dx,y=gy+dy; if(x<1||y<1||x>=GW-1||y>=GH-1) continue;
    var d=Math.sqrt(dx*dx+dy*dy); if(d>7) continue;
    var i=y*GW+x, f=1-d/7;
    // drying, faster
    wet[i]=Math.max(0,wet[i]-0.10*f);
    // but it drives a little pigment outward
    var ox=x+(dx>0?1:dx<0?-1:0), oy=y+(dy>0?1:dy<0?-1:0);
    var j=oy*GW+ox;
    for(var p=0;p<4;p++){ var m=pig[p][i]*0.09*f; pig[p][i]-=m; pig[p][j]+=m; }
  }
  noiseHit(500,0.6,0.35,0.05,"lowpass");
  dirty=true;
}

/* ========== pull a fresh sheet — one way ========== */
function pullSheet(){
  S.pulled++;
  S.split=Math.min(0.85, S.split+0.028);       // the split lengthens, honestly
  S._colouredThisSheet=false;
  // the sheet on the counter is a new pull: colour and cuts stay on the counter's record,
  // but the impression is re-inked and re-worn.
  peelSound();
  setTimeout(function(){ noiseHit(160,0.8,0.2,0.09,"lowpass"); },260);
  drawImpression();
  ui(); save();
}

/* ========== paste ========== */
function paste(){
  S.pasted=true;
  document.getElementById("btnpaste").classList.add("on");
  document.getElementById("btnpaste").textContent="PASTED — DRYING FLAT";
  noiseHit(340,0.5,0.45,0.05,"lowpass");
  save();
}
if(S.pasted){ var bp=document.getElementById("btnpaste"); bp.classList.add("on"); bp.textContent="PASTED — DRYING FLAT"; }

/* ========== ui ========== */
function bar(v,col){
  return '<span class="bar"><i style="background:'+col+';transform:scaleX('+Math.max(0,Math.min(1,v)).toFixed(3)+')"></i></span>';
}
function ui(){
  var r=document.getElementById("readout");
  r.innerHTML=
    "BRUSH "+bar(brush.load,"#cbbf9f")+" &nbsp;"+PIG[brush.pig].name+
    " &nbsp;&nbsp;GUM "+bar(S.gumRatio,"#a89468")+
    "<br>CAKES &nbsp;"+
    bar(S.cakes[0],"#2c4f77")+" "+bar(S.cakes[1],"#d9a41c")+" "+
    bar(S.cakes[2],"#a8323c")+" "+bar(S.cakes[3],"#4e6b33")+
    " &nbsp;&nbsp;GUM POT "+bar(S.gum,"#8f7c52")+" WATER "+bar(S.water,"#5e7f96");
  var lc=document.getElementById("livecount");
  if(lc) lc.textContent="PLATE 47 — SHEETS PULLED: "+S.pulled+" — SHEETS COLOURED: "+S.coloured;
  document.querySelectorAll(".cake").forEach(function(c){ c.classList.toggle("sel", +c.dataset.p===brush.pig); });
}
document.querySelectorAll(".cake").forEach(function(c){
  c.addEventListener("click",function(){ ac(); charge(+c.dataset.p); });
});
document.getElementById("potgum").addEventListener("click",function(){ac();loadGum();});
document.getElementById("potwater").addEventListener("click",function(){ac();loadWater();});
document.getElementById("btnscissors").addEventListener("click",function(){ toggleScissors(); });
document.getElementById("btnblow").addEventListener("click",function(){ ac(); blow(); });
document.getElementById("btnpaste").addEventListener("click",function(){ ac(); paste(); });
document.getElementById("btnpull").addEventListener("click",function(){ ac(); pullSheet(); });
function toggleScissors(){
  ac();
  mode = (mode==="scissors")?"brush":"scissors";
  var b=document.getElementById("btnscissors");
  b.classList.toggle("on", mode==="scissors");
  sheet.style.cursor = mode==="scissors" ? "crosshair" : "cell";
}
sheet.style.cursor="cell";

document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k>="1"&&k<="4"){ ac(); charge(+k-1); e.preventDefault(); }
  else if(k==="g"||k==="G"){ ac(); loadGum(); }
  else if(k==="w"||k==="W"){ ac(); loadWater(); }
  else if(k==="s"||k==="S"){ toggleScissors(); }
  else if(k==="ArrowLeft"){ push(-1); e.preventDefault(); }
  else if(k==="ArrowRight"){ push(1); e.preventDefault(); }
  else if(k===" "){ ac(); blow(); e.preventDefault(); }
});

/* ========== main loop ========== */
var acc=0, saveClock=0;
function loop(t){
  var dt=Math.min(120,t-lastTick); lastTick=t;
  physics(dt);
  acc+=dt;
  if(acc>70){ render(); acc=0; }
  saveClock+=dt;
  if(saveClock>4000){ saveClock=0; save(); }
  requestAnimationFrame(loop);
}
render(); drawCuts(); ui();
["L","R"].forEach(function(h){ if(S.stagePos[h]>-1 && S.mounted[h]) {} });
requestAnimationFrame(loop);

   more than that already. Figure 6 stays where it is. */

console.log("6 — WALTER GRYMES. Block cut 1832 for THE BLACK SCHOONER. Filled a hole in the forme.");
})();
