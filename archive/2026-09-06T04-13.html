  <meta name="outbox-spec-era" content="30 May 1984, right now — about twenty past eleven on a hot flat morning in a small concrete-block back yard behind a plumbing supply in Mobile, Alabama, where the deep partial phase of that day's annular eclipse is about forty minutes from maximum and nobody in the yard is looking up. Washing has been on the line since eight, the fig by the fence is fully leafed, and the whole visible frame is one lime-washed side wall taking hard mid-morning light. Not a look-back, not a portent, not an event: the light on the wall is dropping and the shapes on it are changing, and the wall is the only thing in frame.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one lime-washed cement-render wall at true standing distance: chalky, patched, faintly trowel-swirled, with a hairline crack running from the upper left down past centre. NOTHING ELSE IS IN FRAME EXCEPT SHADOWS. Everything the visitor sees on the wall is cast by objects permanently out of view — a fig branch above and left, a wrought-iron burglar grille on a window to the right, six pegged items on a clothesline running across, a wire birdcage on a hook, and a length of hose looped on a nail. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instruction, no readable character anywhere at any time. The piece is a real solar-projection engine: the sun is a DISC of true angular diameter and not a point, so every shadow edge carries a genuine penumbra whose width is computed from that occluder's actual distance from the wall — the grille four inches off the render throws a razor edge, the fig at four metres throws an edge you can put a thumb across — and every gap in the fig canopy small enough to act as a pinhole projects a real inverted image of the sun's current shape onto the render. The visitor's entire vocabulary is three gestures at the wall: DRAG horizontally to run the morning forward or back, which moves real solar altitude and azimuth so every shadow lengthens, shears and rotates together and the atmospheric path length honestly changes the colour of the direct beam; PRESS AND HOLD anywhere to put a gust through the yard, which swings the fig, the line and the cage on real pendulum periods set by their real lengths and smears their penumbras honestly while the rigid grille does not move at all; and CLICK any pegged item on the line to unpeg it or peg it back, which permanently changes what is on the line and therefore what is on the wall. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The plain optics of shadows on a wall during a deep partial eclipse, and specifically that the sun is not a point and therefore a shadow is not a shape — that the solar disc subtends about half a degree, so every shadow edge is a penumbra whose width equals the occluder's distance from the wall times the tangent of that half-degree, which works out to roughly one centimetre of blur per metre of gap; that this is why a grille bolted a hand's width off the render prints hard enough to read the twist marks in the iron while a fig leaf four metres out prints as a soft grey nothing with no leaf shape in it at all, and why the same branch's small twigs vanish entirely from the wall while its trunk stays legible — an occluder narrower than its own penumbra cannot cast a shadow, full stop, and that limit is a length, not an opinion; that a gap in a canopy smaller than about the same limit stops being a hole and starts being a PINHOLE, which means it projects an inverted image of the source and not an image of itself, so a triangular gap, a slit and a ragged tear all print the same round dapple, all the same size, all the same way up, spaced across the wall wherever the canopy happens to be thin; that this is why every dapple under a tree is round on an ordinary day and why every one of them turns into a crescent during a partial eclipse, all pointing the same direction, all thinning together, because they are photographs of the sun and always were; that the crescents are the ONLY reliable readout in the yard, since human vision compensates for overall brightness so ruthlessly that a sky at forty percent of full sun still reads as ordinary daylight to somebody not paying attention; that the honest tells are three and all of them are on the wall — the shadow contrast RATIO climbs, because the sky dome keeps filling the shadows at nearly full strength while the direct beam is being cut, so shadows go relatively lighter and bluer and the whole wall flattens; the penumbra becomes ASYMMETRIC, sharp along the edge corresponding to the occluded limb of the sun and soft along the edge corresponding to the surviving crescent, so every shadow in the yard develops a hard side and a woolly side and they all agree on which side; and the colour does NOT warm, which is what separates a deep eclipse from a cloud or from late afternoon, because the beam is being blocked by a rock and not filtered through more atmosphere, so the light goes down without going red and everything on the wall goes slightly steely; that air temperature falls a real three or four degrees over the hour with a real lag behind the light, which is why a tin roof out of frame ticks as it contracts on the way down and does not tick on the way up; that birds go quiet at an illumination level and not at a moment, so they stop and start honestly on the same curve as the wall; that shadow EDGE VELOCITY is a plain consequence of geometry — a shadow of a thing one metre out moves across the render at a couple of millimetres a minute, and the shadow of a thing at eight metres moves eight times as fast, so the whole picture on the wall shears rather than slides and nothing on it stays in the same relationship to anything else; and that wind moves a shadow far faster than the sun ever does, so a gust rearranges everything the sun spent twenty minutes doing and puts it back within a second, except for the crescents, which stay exactly where the canopy holds them.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wall, the light and the air, and that register is HOT, HARD, DOMESTIC, CHALKY and NOT STILL — direct sun coming in at a real angle and raking across a render that is genuinely uneven, so the wall's own trowel swirl and its patched section catch the light differently and the shadows break over the texture instead of lying on it; whitewash that is faintly powdery and that scatters a little light back up into the underside of every shadow; a clothesline that is never quite at rest because the yard is never quite at rest; wet cotton that hangs heavy and dry cotton that lifts; a fig canopy that moves in real gusts with a real settling time and then goes back to a slow constant tremble; a rigid iron grille that does absolutely nothing all morning. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the light goes down whether or not anyone drags anything. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT a screensaver, NOT stately, NOT reverent, NOT ominous, NOT sacred — this is a side wall behind a plumbing supply at twenty past eleven with washing out and a fig that needs cutting back.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The lit render is lime wash over grey cement in a chalky warm off-white (#eae3d2), going a shade cooler and denser across the patched section low and right where somebody re-rendered around a filled pipe hole (#d6d0c0), with real trowel-swirl relief that takes the raking beam directionally and a hairline crack reading as one thin hard line (#9c9484). Against that, EVERY SHADOW'S COLOUR IS COMPUTED FROM TWO ILLUMINANTS AND IS NEVER CHOSEN: the wall is lit by a direct solar beam with a live intensity, a live spectrum set by real atmospheric path length, and a live UNOCCULTED FRACTION of the solar disc; and separately by the whole sky dome, which is markedly bluer and whose own intensity falls with the sun's but not at the same rate. A shadow is simply the render lit by sky alone, so it comes out a cool slate blue-grey (#7d8ba0) whose value and saturation move honestly against the lit wall all morning — as the disc is eaten the shadow-to-lit ratio climbs, the shadows lighten relative to their surroundings, the whole wall loses contrast and goes steely, and the piece's entire colour arc is that one ratio and nothing else. Penumbra bands are computed area-integrals of the visible solar crescent behind each occluder edge, so they are genuinely asymmetric — one side of every shadow tightens to a hard line, the other spreads soft and dirty (#a8aeb2) — and no gradient anywhere on the page is drawn by hand. Pinhole dapples render as real projected images of the current solar shape, brighter than the lit wall around them at their centres (#fbf8ee) with their own small penumbral fringe. Wet cotton on the line casts a shadow with real partial transmission, so a damp sheet prints paler than a dry towel and a doubled hem prints darker than either. Exactly one chip of oxide-red porch paint (#a0342a) is held strictly for the single iron hook screwed into the top right corner of the render — the only actual object in frame, everything else being a shadow of something out of view — and it appears nowhere else. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest penumbra integration, honest sky fill and honest lime-wash scatter.">
  <meta name="outbox-spec-wildcard" content="One gap in the fig canopy — high and slightly left of centre on the wall — is far too big to act as a pinhole: about four centimetres across at four metres out, well over the limit. It therefore never forms an image of anything. While every dapple around it thins into a crescent and swings its horns around together, that one stays a shapeless soft-edged bright blob that only gets dimmer and slightly lopsided, and at maximum it is the single brightest patch on the whole wall and the only round thing left in the yard. The engine computes it exactly as it computes every other gap and does not flag it, mark it, brighten it or comment on it in any way. It is the same gap, in the same place, on every visit.">
  <meta name="outbox-spec-forbidden" content="NO eclipse-as-metaphor and NO cosmic awe of any kind — not smallness, not wonder, not the universe as clockwork, not a reminder of anything, not 'the light went strange and everyone went quiet'; this is a solar disc of half a degree, a pinhole limit and a shadow-to-sky ratio, and it has nothing to teach anybody. ABSOLUTELY NO Annie Dillard, NO totality-as-transcendence, NO the-primal-fear-of-the-dark, NO omen, NO portent, NO ancient-peoples-thought, NO dragon-eats-the-sun folklore, NO astrology, NO ritual, NO sacred, NO reverence, NO holding-of-breath, NO hair-standing-up. NO astronomy-as-poetry: no celestial mechanics reverie, no orbits-as-beauty, no the-numbers-are-sublime, no Sagan register, no space lyricism, no the-moon-as-character. NO safety sermon and NO danger framing: nobody looks at the sun, nobody is warned, pinhole projection is a geometric fact here and not a technique being taught. NO teaching voice, NO explainer, NO classroom, NO science-communicator enthusiasm, NO 'and here's the amazing part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery, chillout or screensaver framing whatsoever, and no 'let the light settle you'. NO light-and-shadow lyricism as such: no describing light as gold, honey, liquid, soft, gentle, holy, forgiving or falling like anything; light here is intensity, spectrum, angular size and path length. NO Southern Gothic, NO heat-and-cicadas mood writing, NO Alabama travelogue, NO explaining the Deep South to anybody, NO poverty pathos, NO race or history commentary imported as atmosphere, NO front-porch folksiness, NO dialect anything, NO Faulkner. NO 1984-as-period-signifier, NO Reagan-era drift, NO Cold War, NO Orwell joke, NO 80s retro-kitsch, NO camp affection for the clothesline or the tin roof. NO nostalgia, NO wistfulness, NO 'nobody hangs washing out anymore', NO summer-of-childhood sentiment, NO memory framing, NO 'somebody's mother is inside', NO absent-family melancholy, NO loneliness, NO an-empty-yard-means-something. NO domesticity sentiment, NO smell-of-clean-laundry, NO comfort, NO home. NO Plato's cave, NO shadows-as-illusion, NO the-thing-and-its-image, NO philosophy of representation, NO 'you never see the objects, only their shadows' presented as a point — the objects are out of frame because the camera is aimed at the wall. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror, dread or wrongness about the darkening, the quiet canary or the gap that never makes a crescent — nothing here is wrong. NO archival / museum / cabinet / drawer / photograph / relic framing — this is happening on a wall this minute and the washing is still damp. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past eleven in the morning in full hard sun. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the wall, the shadows and the one red hook, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>

<a id="arch" href="/archive" aria-label="more"></a>
<script>
/* ---------------------------------------------------------------
   side wall, plumbing supply, back yard. render is 3.2 m wide.
   sun disc radius 0.266 deg. pinhole limit = 2*d*tan(0.266deg).
   nothing here is drawn by hand except the hook.
   "if the door is open, you are welcome inside" — over the office door,
   out of frame, north side.
----------------------------------------------------------------*/
(function(){
"use strict";
var cv=document.getElementById('wall'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var GX=0,GY=0,GW=0,GH=0; // grid rect in css px
var COLS=0,ROWS=0,CELL=9; // sampling cell size px
var wallW=3.2; // metres across the visible render

// ---------- persistence ----------
var KEY='wall.limewash.1984';
var S={items:null,gusts:0,minutes:0};
try{var raw=localStorage.getItem(KEY); if(raw)S=JSON.parse(raw);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// ---------- solar geometry ----------
var SUN_R=0.00464; // radians, angular radius of solar disc (~0.266 deg)
var TAN_R=Math.tan(SUN_R);
var t0=11.333; // hours local, start
var tH=t0;     // draggable solar time
var clockStart=performance.now();

// eclipse own clock, independent of tH
var ecl={c1:10.05,max:11.99,c4:13.72,magMax:0.955}; // fraction of solar diameter covered
function eclipseAt(hr){
  if(hr<=ecl.c1||hr>=ecl.c4) return {sep:2,mr:0.72};
  var f;
  if(hr<ecl.max) f=(hr-ecl.c1)/(ecl.max-ecl.c1); else f=(ecl.c4-hr)/(ecl.c4-ecl.max);
  f=Math.max(0,Math.min(1,f));
  var mr=1.06; // lunar/solar radius ratio for this annular-ish geometry (slightly >1 near max not used)
  mr=0.985;
  // separation in solar radii: at f=1 separation = (1+mr) - 2*mag
  var sepMax=1+mr;
  var sep=sepMax-(2*ecl.magMax)*f;
  return {sep:sep,mr:mr,f:f};
}

// solar disc occultation: given moon at separation sep (units of solar radius),
// return unocculted fraction, and a shape mask sampler.
var eclState={sep:2,mr:0.985,frac:1,ang:0};
function circleOverlap(d,r1,r2){
  if(d>=r1+r2)return 0;
  if(d<=Math.abs(r1-r2))return Math.PI*Math.min(r1,r2)*Math.min(r1,r2);
  var a=(d*d+r1*r1-r2*r2)/(2*d*r1); a=Math.max(-1,Math.min(1,a));
  var b=(d*d+r2*r2-r1*r1)/(2*d*r2); b=Math.max(-1,Math.min(1,b));
  var A1=r1*r1*Math.acos(a), A2=r2*r2*Math.acos(b);
  var s=0.5*Math.sqrt(Math.max(0,(-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2)));
  return A1+A2-s;
}
function updateEclipse(hr){
  var e=eclipseAt(hr);
  eclState.sep=e.sep; eclState.mr=e.mr;
  var ov=circleOverlap(Math.max(0.0001,e.sep),1,e.mr);
  eclState.frac=Math.max(0,1-ov/Math.PI);
}
// point test inside visible solar crescent, unit solar disc coords (x,y)
// moon centre placed along direction 'ang' from sun centre.
function inSun(x,y){
  if(x*x+y*y>1)return false;
  var mx=Math.cos(eclState.ang)*eclState.sep, my=Math.sin(eclState.ang)*eclState.sep;
  var dx=x-mx,dy=y-my;
  return (dx*dx+dy*dy) > eclState.mr*eclState.mr;
}

// ---------- sun position ----------
// Mobile AL, 30 May. crude but honest-shaped: altitude peaks ~78deg near 12:40
function sunDir(hr){
  var ha=(hr-12.65)*15*Math.PI/180;
  var dec=21.7*Math.PI/180, lat=30.7*Math.PI/180;
  var sinAlt=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha);
  sinAlt=Math.max(-0.2,Math.min(1,sinAlt));
  var alt=Math.asin(sinAlt);
  var cosAz=(Math.sin(dec)-Math.sin(alt)*Math.sin(lat))/(Math.cos(alt)*Math.cos(lat));
  cosAz=Math.max(-1,Math.min(1,cosAz));
  var az=Math.acos(cosAz); if(ha>0)az=2*Math.PI-az; // from north, clockwise
  return {alt:alt,az:az};
}
// wall faces roughly ESE (azimuth of outward normal = 110 deg)
var WALL_AZ=118*Math.PI/180;
function beamVector(hr){
  var s=sunDir(hr);
  var rel=s.az-WALL_AZ;
  // direction from wall towards sun, in wall coords: x right, y up, z out of wall
  var cz=Math.cos(s.alt)*Math.cos(rel);
  var cx=Math.cos(s.alt)*Math.sin(rel);
  var cy=Math.sin(s.alt);
  return {x:cx,y:cy,z:cz,alt:s.alt,az:s.az,rel:rel};
}
function airmass(alt){
  var z=Math.PI/2-alt, c=Math.cos(z);
  return 1/(c+0.50572*Math.pow(Math.max(0.001,96.07995-z*180/Math.PI),-1.6364));
}

// ---------- wind ----------
var wind={g:0,target:0,phase:0,held:false,lastT:0};
// pendulums
function Pend(len,damp){this.len=len;this.a=0;this.v=0;this.d=damp;this.prev=0;}
Pend.prototype.step=function(dt,drive){
  var w2=9.81/this.len;
  this.prev=this.a;
  this.v+= (-w2*this.a - this.d*this.v + drive)*dt;
  this.a+= this.v*dt;
  if(this.a>0.5)this.a=0.5; if(this.a<-0.5)this.a=-0.5;
};

// ---------- occluders ----------
// distances from wall plane in metres. positions in wall coords (m), origin at
// centre of visible render, x right, y up.
var fig={d:4.0,x:-0.55,y:1.15,limb:null,gaps:[],p:new Pend(3.1,0.55)};
var line={d:1.55,y:0.62,sag:0.06,p:new Pend(2.6,0.7)};
var cage={d:2.35,x:1.05,y:1.02,p:new Pend(0.42,0.9)};
var hose={d:0.55,x:-1.35,y:0.30};
var grille={d:0.10,x:1.15,y:0.05};

// fig limb: a polyline of thicknesses (metres)
fig.limb=[
  {x:-1.85,y:1.72,r:0.075},{x:-1.42,y:1.55,r:0.068},{x:-1.05,y:1.40,r:0.058},
  {x:-0.72,y:1.34,r:0.049},{x:-0.40,y:1.36,r:0.041},{x:-0.08,y:1.44,r:0.033},
  {x:0.24,y:1.58,r:0.024},{x:0.52,y:1.74,r:0.017},{x:0.74,y:1.92,r:0.010}
];
// secondary limbs & twigs (many are narrower than their own penumbra -> vanish)
fig.twigs=[];
(function(){
  var rnd=mulberry(20406);
  for(var i=0;i<26;i++){
    var bx=-1.7+rnd()*2.4, by=1.30+rnd()*0.55;
    var ang=(-0.4+rnd()*1.5);
    var L=0.25+rnd()*0.75;
    var r=0.0035+rnd()*0.030;
    fig.twigs.push({x0:bx,y0:by,x1:bx+Math.cos(ang)*L,y1:by+Math.sin(ang)*L,r:r});
  }
})();

// canopy gap field: each gap has diameter (m) and position (as an angular
// offset of the whole canopy relative to the wall — projected via the beam)
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
(function(){
  var rnd=mulberry(77113);
  for(var i=0;i<58;i++){
    var gx=-1.55+rnd()*3.0;
    var gy=0.90+rnd()*1.15;
    var dia=0.0016+Math.pow(rnd(),2.3)*0.020; // most under the pinhole limit
    fig.gaps.push({x:gx,y:gy,d:dia,e:0.55+rnd()*0.45,rot:rnd()*6.283});
  }
  // THE gap. high, slightly left of centre. 4.1 cm across at 4 m out.
  fig.gaps.push({x:-0.34,y:1.62,d:0.041,e:1,rot:0,big:true});
})();

// ---------- line items ----------
var DEF=[
  {k:'sheet', w:0.86,h:1.02, thick:0.62, weave:0.10, wet:0.86, dry:0.00040, on:true},
  {k:'shirt', w:0.44,h:0.60, thick:0.44, weave:0.20, wet:0.62, dry:0.00062, on:true},
  {k:'towel', w:0.40,h:0.72, thick:0.86, weave:0.04, wet:0.30, dry:0.00030, on:true},
  {k:'pillow',w:0.48,h:0.44, thick:0.55, weave:0.13, wet:0.70, dry:0.00050, on:true},
  {k:'jeans', w:0.42,h:0.86, thick:0.93, weave:0.02, wet:0.88, dry:0.00021, on:true},
  {k:'sock',  w:0.13,h:0.26, thick:0.50, weave:0.16, wet:0.24, dry:0.00090, on:true}
];
var items=[];
function initItems(){
  var stored=S.items;
  for(var i=0;i<DEF.length;i++){
    var d=DEF[i];
    var it={k:d.k,w:d.w,h:d.h,thick:d.thick,weave:d.weave,wet:d.wet,dryk:d.dry,on:d.on,
            x:-1.30+i*0.52, p:new Pend(0.9,0.9)};
    if(stored&&stored[i]){ it.wet=Math.min(it.wet,stored[i].wet); it.on=!!stored[i].on; it.x=stored[i].x; }
    it.p.len=0.55+it.h*0.55+it.wet*0.35;
    items.push(it);
  }
}
initItems();
function persistItems(){
  S.items=items.map(function(it){return {wet:it.wet,on:it.on,x:it.x};});
  save();
}

// ---------- wall height field (trowel swirl, patch, crack) ----------
var heightField=null,patchField=null,crackField=null;
function buildFields(){
  heightField=new Float32Array(COLS*ROWS);
  patchField=new Float32Array(COLS*ROWS);
  crackField=new Float32Array(COLS*ROWS);
  var rnd=mulberry(9051);
  var seeds=[];
  for(var s=0;s<26;s++)seeds.push({x:rnd(),y:rnd(),r:0.06+rnd()*0.16,a:rnd()*6.283,amp:(rnd()-0.5)});
  for(var j=0;j<ROWS;j++){
    for(var i=0;i<COLS;i++){
      var u=i/COLS,v=j/ROWS,h=0;
      for(var s2=0;s2<seeds.length;s2++){
        var sd=seeds[s2],dx=u-sd.x,dy=(v-sd.y)*0.72;
        var dd=Math.sqrt(dx*dx+dy*dy);
        if(dd<sd.r){
          var arc=Math.atan2(dy,dx)-sd.a;
          h+= sd.amp*(1-dd/sd.r)*Math.cos(arc*2.0+dd/sd.r*7.5)*0.85;
        }
      }
      h+= (Math.sin(u*61.3+v*17.1)+Math.sin(u*23.7-v*47.9))*0.09;
      h+= (rnd()-0.5)*0.14;
      heightField[j*COLS+i]=h;
      // patch: low and right, around a filled pipe hole
      var px=(u-0.74)/0.20, py=(v-0.79)/0.155;
      var pr=Math.sqrt(px*px+py*py);
      var edge=1+0.16*Math.sin(Math.atan2(py,px)*5.0+1.4)+0.09*Math.sin(Math.atan2(py,px)*9.0);
      patchField[j*COLS+i]= pr<edge ? Math.min(1,(edge-pr)*7.5) : 0;
      // hairline crack: upper-left down past centre
      var cx=0.215+0.30*v+0.052*Math.sin(v*11.0)+0.020*Math.sin(v*27.0);
      var cd=Math.abs(u-cx);
      var alive=(v>0.06&&v<0.74)?1:0;
      crackField[j*COLS+i]= alive? Math.max(0,1-cd*COLS*0.62) : 0;
    }
  }
}

// ---------- occlusion sampling ----------
// For a wall point P (metres), and an occluder at distance d, the sun's disc
// projects to a circle of radius d*tan(SUN_R) in the occluder's plane.
// We sample the disc with N points, test each ray against silhouettes.
var NS=13;
var discSamples=[];
(function(){
  discSamples.push({x:0,y:0,w:1});
  var rings=[{r:0.45,n:4},{r:0.78,n:8}];
  for(var i=0;i<rings.length;i++){
    for(var k=0;k<rings[i].n;k++){
      var a=(k/rings[i].n)*6.2832+i*0.4;
      discSamples.push({x:Math.cos(a)*rings[i].r,y:Math.sin(a)*rings[i].r,w:1});
    }
  }
  NS=discSamples.length;
})();

function segDist(px,py,x0,y0,x1,y1){
  var vx=x1-x0,vy=y1-y0,wx=px-x0,wy=py-y0;
  var L=vx*vx+vy*vy; var t=L>0?(wx*vx+wy*vy)/L:0;
  t=Math.max(0,Math.min(1,t));
  var dx=px-(x0+vx*t),dy=py-(y0+vy*t);
  return Math.sqrt(dx*dx+dy*dy);
}

// ---------- audio ----------
var AC=null,master=null,audioOn=false;
function initAudio(){
  if(AC)return;

    AC=new (window.AudioContext||window.webkitAudioContext)();

function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);

}
var NB=null;

// ---------- thermal ----------
var temp={T:33.6,base:33.6};

// ---------- sizing ----------
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CELL = W<560?7:(W<1000?7:8);
  COLS=Math.ceil(W/CELL)+1; ROWS=Math.ceil(H/CELL)+1;
  GX=0;GY=0;GW=W;GH=H;
  buildFields();
  buf=new Float32Array(COLS*ROWS*3);
}
var buf=null;
window.addEventListener('resize',resize);

// wall coords <-> screen
function mPerPxX(){ return wallW/W; }
function toWallX(px){ return (px-W/2)*mPerPxX(); }
function toWallY(py){ return (H/2-py)*mPerPxX(); }
function toPxX(mx){ return W/2+mx/mPerPxX(); }
function toPxY(my){ return H/2-my/mPerPxX(); }

// ---------- shadow computation ----------
var beam={x:0,y:0,z:1,alt:1.0};
var frameCache={};

function projOffset(d){ // shift of an occluder's shadow, metres, per metre of distance
  // ray from wall point P towards sun; occluder plane at z=d.
  return {ox: -beam.x/beam.z*d, oy: -beam.y/beam.z*d};
}

// coverage of the solar disc at wall point (wx,wy) by occluders. returns
// {vis: 0..1 direct visible fraction, trans: transmitted colour weight}
function coverageAt(wx,wy,dapAcc){
  var vis=0, transSum=0;
  var mx=Math.cos(eclState.ang)*eclState.sep, my=Math.sin(eclState.ang)*eclState.sep;
  var mr2=eclState.mr*eclState.mr;

  for(var s=0;s<NS;s++){
    var sx=discSamples[s].x, sy=discSamples[s].y;
    // sun-disc sample must be in the unocculted crescent
    var ddx=sx-mx, ddy=sy-my;
    if(ddx*ddx+ddy*ddy<=mr2) continue; // this bit of sun is behind the moon
    var t=1.0; // transmission along this ray
    // angular offset of this sample, radians
    var ax=sx*SUN_R, ay=sy*SUN_R;
    // direction of this ray (perturbed beam)
    var bx=beam.x+ax, by=beam.y+ay, bz=beam.z;

    // --- grille (d=0.10) ---
    var d=grille.d, px=wx+bx/bz*d, py=wy+by/bz*d;
    if(t>0.02) t*=grilleTrans(px,py);
    // --- hose loop (d=0.55) ---
    d=hose.d; px=wx+bx/bz*d; py=wy+by/bz*d;
    if(t>0.02) t*=hoseTrans(px,py);
    // --- line + items (d=1.55) ---
    d=line.d; px=wx+bx/bz*d; py=wy+by/bz*d;
    if(t>0.02) t*=lineTrans(px,py);
    // --- birdcage (d=2.35) ---
    d=cage.d; px=wx+bx/bz*d; py=wy+by/bz*d;
    if(t>0.02) t*=cageTrans(px,py);
    // --- fig (d=4.0) ---
    d=fig.d; px=wx+bx/bz*d; py=wy+by/bz*d;
    if(t>0.02) t*=figTrans(px,py);

    vis+=1; transSum+=t;
  }
  var n=NS;
  // normalise against the full disc sample count so eclipse reduces the beam
  return {frac: transSum/n, litFrac: vis/n};
}

// --- silhouettes (return transmission 0..1 for a ray through that plane) ---
function grilleTrans(px,py){
  // wrought iron grille: frame + verticals + two twisted scrolls. bars 0.014 m
  var gx=px-grille.x, gy=py-grille.y;
  if(gx<-0.52||gx>0.52||gy<-0.52||gy>0.66) return 1;
  var bar=0.0075;
  // frame
  if(Math.abs(Math.abs(gx)-0.50)<bar+0.003) return 0;
  if(Math.abs(gy-0.64)<bar+0.003||Math.abs(gy+0.50)<bar+0.003) return 0;
  // verticals with slight twist-mark thickening
  for(var i=-2;i<=2;i++){
    var xv=i*0.20;
    var tw=bar*(1+0.35*Math.sin(py*46+i));
    if(Math.abs(gx-xv)<tw) return 0;
  }
  // one horizontal mid rail
  if(Math.abs(gy-0.07)<bar*1.1) return 0;
  // scrolls
  var r=Math.sqrt((gx+0.10)*(gx+0.10)+(gy-0.34)*(gy-0.34));
  if(Math.abs(r-0.11)<bar*0.9) return 0;
  var r2=Math.sqrt((gx-0.28)*(gx-0.28)+(gy+0.24)*(gy+0.24));
  if(Math.abs(r2-0.09)<bar*0.9) return 0;
  return 1;
}
function hoseTrans(px,py){
  var hx=px-hose.x, hy=py-hose.y;
  var R=0.17, tube=0.0115;
  var r=Math.sqrt(hx*hx+hy*hy*1.12);
  if(Math.abs(r-R)<tube) return 0;
  // the tail hanging off
  if(px>hose.x+0.06&&px<hose.x+0.10&&py<hose.y-0.14&&py>hose.y-0.46) return 0;
  return 1;
}
function lineTrans(px,py){
  // catenary
  var ang=line.p.a;
  var yline=line.y - line.sag*Math.cosh((px)*1.05)*0.5 + ang*0.18*px;
  if(Math.abs(py-yline)<0.0022) return 0; // the wire itself: 4.4 mm
  var out=1;
  for(var i=0;i<items.length;i++){
    var it=items[i]; if(!it.on)continue;
    var sw=it.p.a;
    var ix=it.x + sw*0.10;
    var itop=yline-0.012;
    var lx=px-ix - sw*(itop-py)*0.55;
    var ly=py-itop;
    if(ly>0||ly< -it.h) continue;
    var halfw=it.w*0.5*(1+0.05*Math.sin(ly*9));
    if(Math.abs(lx)>halfw) continue;
    // cloth transmission: thickness * (1-weave openness), modulated by wetness
    var tau = (1-it.weave) * (it.thick*0.62 + it.wet*0.34);
    // doubled hem across the bottom 6 cm and the peg fold at the top
    if(ly> -0.055 || ly< -it.h+0.05) tau=Math.min(1,tau*1.55);
    out*= Math.max(0, 1-tau);
    if(out<0.02)return out;
  }
  return out;
}
function cageTrans(px,py){
  var swing=cage.p.a;
  var cx=px-(cage.x+swing*0.32), cy=py-cage.y;
  var w=0.19,h=0.27;
  if(cx<-w||cx>w||cy<-h||cy>h+0.13) return 1;
  // dome top
  if(cy>h){ var rr=Math.sqrt(cx*cx+(cy-h)*(cy-h)); if(Math.abs(rr-w)>0.004) return 1; }
  var wire=0.0018;
  if(Math.abs(Math.abs(cx)-w)<wire*1.6) return 0;
  if(Math.abs(cy+h)<wire*2.4) return 0;
  for(var i=-6;i<=6;i++){ if(Math.abs(cx-i*(w/6))<wire) return 0; }
  if(Math.abs(cy-(-h+0.06))<wire*1.5) return 0;
  if(Math.abs(cy-(h-0.02))<wire*1.5) return 0;
  // perch and the small dark mass on it
  if(Math.abs(cy-(-h+0.13))<wire*1.4) return 0;
  return 1;
}
function figTrans(px,py){
  var sw=fig.p.a;
  var fx=px-sw*0.55, fy=py;
  // canopy: dense mass, with gaps
  var cxm=fig.x, cym=fig.y;
  var dx=(fx-cxm)/1.75, dy=(fy-cym)/0.80;
  var edge=Math.sqrt(dx*dx+dy*dy);
  var lobed=1+0.20*Math.sin(Math.atan2(dy,dx)*3.2+0.6)+0.11*Math.sin(Math.atan2(dy,dx)*6.7);
  var inCanopy = edge<lobed;
  // limb (thick, always casts)
  for(var i=0;i<fig.limb.length-1;i++){
    var a=fig.limb[i],b=fig.limb[i+1];
    var dd=segDist(fx,fy,a.x-sw*0.35,a.y,b.x-sw*0.35,b.y);
    if(dd<(a.r+b.r)*0.5) return 0;
  }
  // twigs (thin — most are narrower than their own penumbra and so cannot
  // print; they are still tested here, honestly, and simply lose)
  for(var j=0;j<fig.twigs.length;j++){
    var tg=fig.twigs[j];
    var dd2=segDist(fx,fy,tg.x0-sw*0.42,tg.y0,tg.x1-sw*0.42,tg.y1);
    if(dd2<tg.r) return 0;
  }
  if(!inCanopy) return 1;
  // inside canopy: opaque except at gaps
  for(var g=0;g<fig.gaps.length;g++){
    var ga=fig.gaps[g];
    var gxx=fx-(ga.x-sw*0.50), gyy=(fy-ga.y)/ga.e;
    var rr=Math.sqrt(gxx*gxx+gyy*gyy);
    if(rr<ga.d*0.5) return 1;
  }
  return 0.02; // a little light through leaf edges
}

// ---------- sky / beam colour ----------
function beamColour(hr,frac){
  var am=airmass(beam.alt);
  // Rayleigh-ish transmission per channel
  var tr=Math.exp(-0.098*am), tg=Math.exp(-0.165*am), tb=Math.exp(-0.283*am);
  var I=Math.max(0,Math.sin(beam.alt));
  // The disc is eaten by rock, not by air: intensity falls, spectrum does not warm.
  var k=I*frac;
  return {r:tr*k, g:tg*k, b:tb*k, k:k, am:am};
}
function skyColour(hr,frac){
  var I=Math.max(0.02,Math.sin(beam.alt));
  // sky dome keeps filling shadows at nearly full strength as the disc shrinks:
  // multiple-scattering means the dome dims slower than the direct beam.
  var f=Math.pow(Math.max(0.02,frac),0.62);
  var k=I*f*0.30;
  return {r:k*0.66, g:k*0.80, b:k*1.00, k:k};
}

// ---------- render ----------
var lastFrame=performance.now();
var elapsed=(S.minutes||0);
var gustCount=(S.gusts||0);
var tickTimer=0,tempPrev=temp.T;
var runSeconds=0;
var doorAt=[38,131], doorDone=[false,false];

function step(now){
  var dt=Math.min(0.05,(now-lastFrame)/1000); lastFrame=now;
  runSeconds+=dt;

  // the morning advances on its own whether or not anyone drags it
  if(!dragging) tH += dt*(1/900); // ~4 s of morning per second of real time

  // eclipse keeps its OWN clock, indifferent to tH
  var eclHour = t0 + runSeconds*(1/900) + (S.minutes||0)/60;
  updateEclipse(eclHour);
  // orientation of the moon relative to sun: slowly rotating track
  eclState.ang = 2.55 - (eclHour-ecl.c1)*0.30;

  beam=beamVector(tH);
  if(beam.z<0.05)beam.z=0.05;

  // wind
  if(wind.held) wind.target=Math.min(1,wind.target+dt*2.4);
  else wind.target*=Math.exp(-dt*0.9);
  wind.phase+=dt*(1.4+wind.target*3.4);
  var base=0.055+0.045*Math.sin(runSeconds*0.31)+0.03*Math.sin(runSeconds*0.77+1.1);
  wind.g = base + wind.target*(0.75+0.30*Math.sin(wind.phase*2.1)+0.18*Math.sin(wind.phase*5.3));

  var drive=wind.g*wind.g*Math.sign(wind.g);
  fig.p.step(dt, drive*2.6 + (Math.random()-0.5)*0.05);
  line.p.step(dt, drive*0.9);
  cage.p.step(dt, drive*3.4);
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(!it.on)continue;
    var heavy=1/(0.55+it.wet*0.95+it.thick*0.35);
    it.p.len=0.50+it.h*0.60+it.wet*0.40;
    it.p.step(dt, drive*3.0*heavy + (Math.random()-0.5)*0.03*heavy);
    // drying is forward only
    var dryRate=it.dryk*(0.35+beamColour(tH,eclState.frac).k*1.5)*(1+wind.g*2.2);
    it.wet=Math.max(0,it.wet-dryRate*dt*60);
  }

  // thermal lag: illumination drives an equilibrium; T chases it with a real tau
  var lum=Math.max(0,Math.sin(beam.alt))*eclState.frac;
  var Teq=29.0+lum*5.4;
  var tau=210; // seconds
  tempPrev=temp.T;
  temp.T += (Teq-temp.T)*(1-Math.exp(-dt/tau));
  // roof ticks only on the way DOWN (tin contracting)
  if(temp.T<tempPrev-1e-6){
    tickTimer-=dt*(tempPrev-temp.T)*9000;
    if(tickTimer<0){ roofTick(); tickTimer=0.25+Math.random()*1.6; }
  }

  // canary: sings at an illumination level, not a moment
  var lvl=lum;
  if(audioOn){
    if(lvl>0.30){
      canary.next-=dt;
      if(canary.next<=0){ canaryChirp(lvl); canary.next=0.9+Math.random()*3.6*(1.2-lvl); }
    } else { canary.next=1.2; }
    // pulley squeak tracks true line velocity
    var lv=Math.abs(line.p.v)+Math.abs(items[0]?items[0].p.v:0)*0.4;
    pulley.g.gain.value=Math.min(0.05,lv*0.035);
    pulley.o.frequency.value=340+lv*640;
    pulley.f.frequency.value=780+lv*1300;
    // saw two yards over
    saw.next-=dt;
    if(saw.next<=0){ var dur=1.6+Math.random()*4.2; sawStart(dur); saw.next=dur+3+Math.random()*16; }
    // screen door, twice
    for(var dsi=0;dsi<doorAt.length;dsi++){
      if(!doorDone[dsi]&&runSeconds>doorAt[dsi]){ doorDone[dsi]=true; screenDoor(); }
    }
    if(!truck.done&&runSeconds>truck.at){ truck.done=true; truckArrive(); }
  }

  draw();
  elapsed=(S.minutes||0)+runSeconds/60;
  if(Math.floor(runSeconds)%10===0&&Math.floor(runSeconds)!==step._lastSave){
    step._lastSave=Math.floor(runSeconds);
    S.minutes=elapsed; S.gusts=gustCount; persistItems();
  }
  requestAnimationFrame(step);
}

function draw(){
  var frac=eclState.frac;
  var B=beamColour(tH,frac), SK=skyColour(tH,frac);
  // exposure: human vision compensates ruthlessly for overall brightness
  var rawLum=B.k*0.82+SK.k;
  var exposure = 0.98/Math.pow(Math.max(0.06,rawLum),0.78);
  exposure=Math.min(exposure,2.6);

  // wall base albedos
  var A_main=[0.918,0.890,0.824];   // #eae3d2 lime wash
  var A_patch=[0.840,0.816,0.753];  // #d6d0c0 re-render
  var A_crack=[0.612,0.580,0.518];  // #9c9484

  // surface normal from height field: raking beam is shaded against real normals
  var relief = 0.055/Math.max(0.18,Math.sin(beam.alt));

  ctx.clearRect(0,0,W,H);
  var img=ctx.createImageData(COLS,ROWS);
  var D=img.data;

  var vx=beam.x, vy=beam.y, vz=beam.z;
  var vlen=Math.sqrt(vx*vx+vy*vy+vz*vz);
  vx/=vlen; vy/=vlen; vz/=vlen;

  var pinLimits=2*fig.d*TAN_R;

  for(var j=0;j<ROWS;j++){
    var wy=toWallY(j*CELL);
    for(var i=0;i<COLS;i++){
      var idx=j*COLS+i;
      var wx=toWallX(i*CELL);

      var cov=coverageAt(wx,wy);
      var direct=cov.frac;

      // dapples: pinhole projection of the CURRENT solar shape
      var dap=dappleAt(wx,wy);

      // wall relief shading
      var hL=heightField[idx];
      var hx=(heightField[j*COLS+Math.min(COLS-1,i+1)]-heightField[j*COLS+Math.max(0,i-1)]);
      var hy=(heightField[Math.min(ROWS-1,j+1)*COLS+i]-heightField[Math.max(0,j-1)*COLS+i]);
      var nx=-hx*relief, ny=hy*relief, nz=1;
      var nl=Math.sqrt(nx*nx+ny*ny+1);
      var lambert=Math.max(0,(nx*vx+ny*vy+nz*vz)/nl);

      var pf=patchField[idx], cf=crackField[idx];
      var ar=A_main[0]*(1-pf)+A_patch[0]*pf;
      var ag=A_main[1]*(1-pf)+A_patch[1]*pf;
      var ab=A_main[2]*(1-pf)+A_patch[2]*pf;
      if(cf>0){ ar=ar*(1-cf)+A_crack[0]*cf; ag=ag*(1-cf)+A_crack[1]*cf; ab=ab*(1-cf)+A_crack[2]*cf; }
      // chalky micro-grain
      var grain=1+((idx*2654435761)%1000)/1000*0.028-0.014;
      ar*=grain; ag*=grain; ab*=grain;

      // lime wash scatters a little light back up under every shadow
      var scatter=0.055*(B.k*0.5+SK.k);

      var db=direct*lambert+dap;
      var r=ar*(B.r*db + SK.r + scatter);
      var g=ag*(B.g*db + SK.g + scatter);
      var b=ab*(B.b*db + SK.b + scatter);

      r*=exposure; g*=exposure; b*=exposure;
      // gentle roll-off, no bloom
      r=r/(1+r*0.28); g=g/(1+g*0.28); b=b/(1+b*0.28);

      var o=idx*4;
      D[o]=Math.max(0,Math.min(255,Math.round(Math.pow(r,0.86)*255)));
      D[o+1]=Math.max(0,Math.min(255,Math.round(Math.pow(g,0.86)*255)));
      D[o+2]=Math.max(0,Math.min(255,Math.round(Math.pow(b,0.86)*255)));
      D[o+3]=255;
    }
  }
  // upscale the sampled field
  if(!draw._tmp||draw._tmp.width!==COLS||draw._tmp.height!==ROWS){
    draw._tmp=document.createElement('canvas');
    draw._tmp.width=COLS; draw._tmp.height=ROWS;
    draw._tc=draw._tmp.getContext('2d');
  }
  draw._tc.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(draw._tmp,0,0,COLS,ROWS,-CELL*0.5,-CELL*0.5,COLS*CELL,ROWS*CELL);

  drawCrackLine();
  drawHook();
}

// ---------- dapples ----------
// Every gap in the canopy is tested against the pinhole limit for its distance.
// Under the limit it is a pinhole: it projects an inverted image of the sun's
// CURRENT shape, magnified by the distance, all of them the same size and the
// same way up. Over the limit it projects a soft patch of its own shape.
function dappleAt(wx,wy){
  var d=fig.d, sw=fig.p.a;
  var limit=2*d*TAN_R; // ~3.7 cm at 4 m
  var img=d*2*TAN_R;   // projected solar image diameter, same number
  var sum=0;
  var mx=Math.cos(eclState.ang)*eclState.sep, my=Math.sin(eclState.ang)*eclState.sep;
  var mr2=eclState.mr*eclState.mr;
  for(var g=0;g<fig.gaps.length;g++){
    var ga=fig.gaps[g];
    // where does this gap's projection land on the wall?
    var cx=(ga.x-sw*0.50) - beam.x/beam.z*d;
    var cy= ga.y            - beam.y/beam.z*d;
    var dx=wx-cx, dy=wy-cy;
    var rad = img*0.5 + ga.d*0.5;
    if(dx*dx+dy*dy > rad*rad*1.25) continue;

    if(ga.d < limit*0.92){
      // PINHOLE. image is the inverted solar shape at scale img/2.
      var u = -dx/(img*0.5), v = -dy/(img*0.5); // inverted
      var rr=u*u+v*v;
      if(rr>1.35) continue;
      var mdx=u-mx, mdy=v-my;
      var inside = (rr<=1) && (mdx*mdx+mdy*mdy>mr2);
      var soft=0;
      if(inside) soft=1;
      else {
        // small penumbral fringe from the finite pinhole width
        var fr=Math.max(0, 1 - (Math.sqrt(rr)-1)/(ga.d/img*1.6+0.10));
        var mdist=Math.sqrt(mdx*mdx+mdy*mdy);
        var mf=Math.max(0, Math.min(1,(mdist-eclState.mr)/(ga.d/img*1.4+0.09)));
        soft=Math.max(0,Math.min(1,fr))*mf*0.55;
      }
      // brightness scales with hole area over image area
      var eff=(ga.d*ga.d)/(img*img)*2.55;
      sum += soft*Math.min(1.5,eff)*1.35;
    } else {
      // TOO BIG. never an image of anything. a shapeless soft-edged patch that
      // only dims and goes a little lopsided as the disc is eaten.
      var pen=img*0.5;
      var rr2=Math.sqrt(dx*dx+dy*dy);
      var inner=ga.d*0.5-pen, outer=ga.d*0.5+pen;
      var f;
      if(rr2<=inner) f=1;
      else if(rr2>=outer) f=0;
      else f=1-(rr2-inner)/(outer-inner);
      // lopsided: the surviving crescent sits off-centre, so the patch's soft
      // edge is not the same all the way round
      var ang=Math.atan2(dy,dx);
      var lean=Math.cos(ang-eclState.ang-Math.PI);
      f*= 1 - (1-eclState.frac)*0.30*lean;
      sum += Math.max(0,f)*0.62;
    }
  }
  return sum;
}

// ---------- hairline crack overlay (one thin hard line) ----------
function drawCrackLine(){
  ctx.save();
  ctx.strokeStyle='rgba(156,148,132,0.55)';
  ctx.lineWidth=Math.max(0.7,W*0.0008);
  ctx.beginPath();
  for(var v=0.06;v<=0.74;v+=0.01){
    var u=0.215+0.30*v+0.052*Math.sin(v*11.0)+0.020*Math.sin(v*27.0);
    var x=u*W, y=v*H;
    if(v===0.06)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------- the one real object in frame ----------
function drawHook(){
  var frac=eclState.frac;
  var B=beamColour(tH,frac);
  var lum=Math.min(1,B.k*1.6+0.28);
  var hx=W*0.912, hy=H*0.088, s=Math.min(W,H)*0.030;
  ctx.save();
  // shadow of the hook, 3 cm off the render: nearly hard
  ctx.translate(-beam.x/beam.z*0.03/mPerPxX(), beam.y/beam.z*0.03/mPerPxX());
  ctx.strokeStyle='rgba(105,116,132,'+(0.34+0.26*B.k)+')';
  ctx.lineWidth=s*0.20; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy); ctx.lineTo(hx,hy+s*0.62);
  ctx.arc(hx-s*0.34,hy+s*0.62,s*0.34,0,Math.PI*0.95,false);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  var r=Math.round(160*lum), g=Math.round(52*lum), b=Math.round(42*lum);
  ctx.strokeStyle='rgb('+r+','+g+','+b+')';
  ctx.lineWidth=s*0.20; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy); ctx.lineTo(hx,hy+s*0.62);
  ctx.arc(hx-s*0.34,hy+s*0.62,s*0.34,0,Math.PI*0.95,false);
  ctx.stroke();
  // the screw plate
  ctx.fillStyle='rgb('+Math.round(150*lum)+','+Math.round(50*lum)+','+Math.round(40*lum)+')';
  ctx.beginPath(); ctx.ellipse(hx,hy,s*0.17,s*0.13,0,0,6.2832); ctx.fill();
  ctx.restore();
}

// ---------- input ----------
var dragging=false,lastX=0,downX=0,downY=0,downT=0,moved=0,holdTimer=null;

function pt(e){
  if(e.touches&&e.touches[0])return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function onDown(e){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  var p=pt(e);
  dragging=true; lastX=p.x; downX=p.x; downY=p.y; downT=performance.now(); moved=0;
  holdTimer=setTimeout(function(){
    if(moved<8){ wind.held=true; gustCount++; S.gusts=gustCount; save(); leafRattle(); }
  },210);
  e.preventDefault();
}
function onMove(e){
  if(!dragging)return;
  var p=pt(e);
  var dx=p.x-lastX; lastX=p.x;
  moved+=Math.abs(dx);
  if(!wind.held){
    tH += dx*(2.6/W); // drag the morning forward and back
    tH=Math.max(8.4,Math.min(15.6,tH));
  }
  e.preventDefault();
}
function onUp(e){
  clearTimeout(holdTimer);
  var wasHeld=wind.held;
  wind.held=false;
  if(dragging&&!wasHeld&&moved<8&&performance.now()-downT<600){
    hitTestLine(downX,downY);
  }
  dragging=false;
  persistItems();
  if(e&&e.cancelable)e.preventDefault();
}
cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove,{passive:false});
window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function leafRattle(){
  if(!audioOn)return;
  var n=14+Math.floor(wind.target*30+18);
  for(var i=0;i<n;i++){
    (function(i){
      setTimeout(function(){
        var amp=Math.max(0.004,0.030*Math.exp(-i/(n*0.45)));
        burst(2400+Math.random()*3400,3.5,0.03+Math.random()*0.04,amp);
      }, i*(20+Math.random()*70));
    })(i);
  }
  // wet cotton snapping, band-filtered by each item's actual wetness
  for(var k=0;k<items.length;k++){
    var it=items[k]; if(!it.on)continue;
    (function(it,k){
      setTimeout(function(){
        var f=560+(1-it.wet)*2900;
        burst(f,it.wet>0.45?1.6:4.0,it.wet>0.45?0.10:0.055,0.028+ (1-it.wet)*0.030);
      },120+k*(90+Math.random()*180));
    })(it,k);
  }
}

// click an item on the line -> unpeg / peg back into the gap you drop it in
function hitTestLine(px,py){
  var wx=toWallX(px), wy=toWallY(py);
  // trace back from the wall to the line plane along the beam
  var d=line.d;
  var lx=wx+beam.x/beam.z*d, ly=wy+beam.y/beam.z*d;
  var yline=line.y - line.sag*Math.cosh(lx*1.05)*0.5;
  // hit an existing item?
  for(var i=0;i<items.length;i++){
    var it=items[i]; if(!it.on)continue;
    var ix=it.x+it.p.a*0.10;
    if(Math.abs(lx-ix)<it.w*0.5 && ly<yline && ly>yline-it.h){
      it.on=false; pegSound(it,false); persistItems(); return;
    }
  }
  // otherwise peg the first unpegged item back at exactly this spacing, forever
  if(ly<yline+0.30 && ly>yline-1.20 && Math.abs(lx)<1.6){
    for(var j=0;j<items.length;j++){
      if(!items[j].on){
        items[j].on=true;
        items[j].x=Math.max(-1.42,Math.min(1.42,lx));
        items[j].p.a=0; items[j].p.v=0.5;
        pegSound(items[j],true);
        persistItems(); return;
      }
    }
  }
}
function pegSound(it,on){
  if(!audioOn)return;
  burst(on?1900:1300,7,0.045,0.055);
  setTimeout(function(){
    var f=520+(1-it.wet)*2400;
    burst(f,it.wet>0.45?1.8:3.6,0.09,0.030);
  },70);
  line.p.v += on?0.45:-0.40;
}

// ---------- go ----------
resize();
requestAnimationFrame(step);

// pinhole limit at four metres, in centimetres: 2*400*tan(0.266°) ≈ 3.7
// the gap high and left of centre is 4.1. it never makes a crescent.
})();
</script>
<!-- render: lime wash over grey cement, 3.2 m of it. patch low right around a
     filled pipe hole. one hook, oxide red, top right corner — the only object
     actually in frame. everything else is a shadow of something out of view.
     the grille is four inches off the wall. the fig is four metres out.
     an occluder narrower than its own penumbra cannot cast a shadow. -->
