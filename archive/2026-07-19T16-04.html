  <meta name="outbox-spec-era" content="2003 — a glossy Flash-portal browser toy of the free-game-website boom, chunky beveled buttons with candy-gradient sheen, a rounded drop-shadowed play area, that cheerful mid-loading-bar Y2K web-plaything look, the kind of tiny time-waster you'd bookmark between classes. Not a look-back at 'the age of Flash games' and not a 'nobody makes these anymore' lament — a live little toy you're clicking around in RIGHT NOW, sheen still on the buttons.">
  <meta name="outbox-spec-format" content="The whole viewport IS the face of a stylized apartment block at dusk — a tidy grid of windows, each either glowing warm-amber (awake) or gone dark (asleep) — and it is a GENUINELY SOLVABLE Lights-Out toggle puzzle: click any window and it flips that window PLUS its four orthogonal neighbours between lit and dark, and your job is to get every window in the block dark at once. A glossy 'TUCK 'EM IN — SHOW ME' reveal button is withheld until pressed, then lights up the exact set of windows you need to click; a 'NEW BLOCK' button deals a fresh guaranteed-solvable scramble.">
  <meta name="outbox-spec-subject" content="The plain switch-arithmetic of an all-windows-dark toggle puzzle and nothing more — how each window flips itself and its four neighbours together, how clicking the same window twice cancels clean out so the ORDER you click never matters, only which windows you end up having pressed; the tidy 'clear the top row, then chase the leftover lights straight down' knack that solves any solvable block, and how a board that won't quite go dark just means one press-set short of parity. Not a metaphor for a city or the little lives behind the glass or anything at all — literally a grid of windows and the honest on-off sums of who flips whom.">
  <meta name="outbox-spec-tone" content="The chirpy, bossy, exclamation-happy voice of Mrs. Pomandy, who runs this block and takes it as a personal mission to get every last tenant's light off before her own tea goes cold — coaxing you through it ('go on, poke the middle one — see? knocks four out at once, that's the good stuff!'), cheerfully ribbing the board when it fights back ('ooh, you left one glowing top-left, no no no, chase it DOWN'), thrilled to bits when the whole face goes dark ('THERE — every soul in bed, lights out, lovely!'). Warm, brisk, peer-to-peer, delighted to have a hand on the puzzle with you. Never wistful, never a life-lesson, never precious about the block; there's a building to put to sleep and it's a game.">

<title>Tuck 'Em In! — Mrs. Pomandy's Block at Bedtime</title>
<style>
  /* dusk brickwork, one lamp still on up top — never you mind that one */
  :root{
    --amber:#f5c542;
    --navy:#1b2a4a;
    --slate:#2f4262;
    --aqua:#4bb3e0;
    --red:#c85a3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 52px),
      radial-gradient(140% 120% at 50% -10%, #26406e 0%, var(--navy) 55%, #12203c 100%);
    color:#e9eefb;
    font-family:"Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px 28px;
  }
  .cabinet{
    width:100%;max-width:430px;
    background:linear-gradient(180deg,#223760 0%,#1a2b4c 100%);
    border-radius:22px;
    padding:16px 16px 20px;
    box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
  }
  .marquee{
    text-align:center;
    font-weight:bold;
    font-size:clamp(22px,7vw,30px);
    letter-spacing:.5px;
    color:var(--amber);
    text-shadow:0 2px 0 #7a5a10, 0 0 16px rgba(245,197,66,.35);
    margin:2px 0 2px;
  }
  .sub{
    text-align:center;font-size:12px;color:#a9bbe0;
    margin-bottom:12px;font-style:italic;
  }
  .attic{
    display:flex;justify-content:flex-start;
    padding-left:6px;margin-bottom:9px;
  }
  .win{
    border-radius:5px;
    aspect-ratio:1/1.18;
    width:clamp(40px,14.5vw,58px);
    background:linear-gradient(160deg,#3a5075 0%, var(--slate) 60%, #263a5c 100%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.25), inset 0 3px 6px rgba(0,0,0,.35);
    position:relative;
    cursor:pointer;
    transition:background .12s ease, box-shadow .12s ease, transform .06s ease;
  }
  .win::after{ /* window cross-bar */
    content:"";position:absolute;inset:22% 46% 22% 46%;
    background:rgba(0,0,0,.22);border-radius:1px;
  }
  .win.lit{
    background:linear-gradient(160deg,#fff0b8 0%, var(--amber) 55%, #e0a81f 100%);
    box-shadow:inset 0 0 0 2px rgba(120,80,0,.4), 0 0 14px rgba(245,197,66,.55),
               inset 0 3px 6px rgba(255,255,255,.4);
  }
  .win.lit::after{background:rgba(150,100,10,.4)}
  .attic .win{cursor:default}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    padding:12px;
    background:linear-gradient(180deg,#14223e,#0f1b32);
    border-radius:14px;
    box-shadow:inset 0 3px 10px rgba(0,0,0,.5);
  }
  .grid .win:active{transform:translateY(1px) scale(.97)}
  .win.hint{
    outline:3px solid var(--aqua);
    outline-offset:-1px;
    animation:pulse .9s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 4px 1px rgba(75,179,224,.5), inset 0 3px 6px rgba(0,0,0,.35)}
    50%{box-shadow:0 0 16px 4px rgba(75,179,224,.9), inset 0 3px 6px rgba(0,0,0,.2)}
  }
  .chatter{
    min-height:44px;
    margin:14px 2px 12px;
    text-align:center;
    font-size:15px;
    line-height:1.35;
    color:#fbe9b8;
    font-weight:bold;
  }
  .chatter b{color:var(--amber)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button.toy{
    flex:1 1 auto;
    min-width:150px;
    border:none;cursor:pointer;
    font-family:inherit;font-weight:bold;
    font-size:14px;letter-spacing:.3px;
    color:#08334a;
    padding:13px 12px 15px;
    border-radius:13px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #8fe0ff 0%, var(--aqua) 48%, #2b8fc4 100%);
    box-shadow:0 5px 0 #1f6f9c, 0 8px 14px rgba(0,0,0,.4),
               inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .05s ease, box-shadow .05s ease;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  button.toy:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #1f6f9c, 0 2px 6px rgba(0,0,0,.4),
               inset 0 1px 0 rgba(255,255,255,.9);
  }
  .tally{
    text-align:center;margin-top:18px;
    font-size:12px;font-weight:bold;letter-spacing:.6px;
    color:var(--red);
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .tally .n{
    font-size:15px;
    background:rgba(200,90,60,.16);
    padding:1px 7px;border-radius:6px;
  }
  footer{
    margin-top:16px;text-align:center;font-size:11px;color:#7f92bb;
  }
  footer a{color:var(--aqua);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .solved .grid{box-shadow:inset 0 3px 10px rgba(0,0,0,.5), 0 0 26px rgba(245,197,66,.35)}
</style>

<body>
  <div class="cabinet" id="cabinet">
    <div class="marquee">Tuck 'Em In!</div>
    <div class="sub">Mrs. Pomandy's block — get every window dark before the tea goes cold!</div>

    <!-- one lamp up top, still going. leave 'em be. -->
    <div class="attic"><div class="win lit" aria-hidden="true"></div></div>

    <div class="grid" id="grid"></div>

    <div class="chatter" id="chatter">Right then — poke a window and watch it knock its four neighbours out with it! That's the good stuff.</div>

    <div class="controls">
      <button class="toy" id="showBtn">TUCK 'EM IN — SHOW ME</button>
      <button class="toy" id="newBtn">NEW BLOCK</button>
    </div>

    <div class="tally">WHOLE BLOCKS PUT TO BED: <span class="n" id="tallyN">0</span></div>
  </div>

  <footer>
    Same block, same lamp on up top, every visit. &nbsp;·&nbsp;
    <a href="/archive">peek at the other blocks →</a>
  </footer>

<script>
(function(){
  "use strict";
  const N = 5, SIZE = N*N;
  const grid = document.getElementById('grid');
  const chatter = document.getElementById('chatter');
  const tallyN = document.getElementById('tallyN');
  const cabinet = document.getElementById('cabinet');

  // ---- toggle masks: a press flips itself + 4 orthogonal neighbours ----
  const masks = [];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let m = 1<<(r*N+c);
    if(r>0)   m |= 1<<((r-1)*N+c);
    if(r<N-1) m |= 1<<((r+1)*N+c);
    if(c>0)   m |= 1<<(r*N+(c-1));
    if(c<N-1) m |= 1<<(r*N+(c+1));
    masks.push(m);
  }

  let board = 0;          // bitmask, 1 = lit
  let solvedThisBlock = false;
  const cells = [];

  // ---- build the window buttons ----
  for(let i=0;i<SIZE;i++){
    const w = document.createElement('div');
    w.className = 'win';
    w.dataset.i = i;
    w.setAttribute('role','button');
    w.setAttribute('tabindex','0');
    w.addEventListener('click', ()=>press(i,true));
    w.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); press(i,true);} });
    grid.appendChild(w);
    cells.push(w);
  }

  function render(){
    for(let i=0;i<SIZE;i++){
      cells[i].classList.toggle('lit', !!((board>>i)&1));
    }
  }

  // ---- Web Audio: soft light-clicks and a bedtime chime ----
  let AC=null;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){AC=null;} } return AC; }
  function click(i){
    const a=ac(); if(!a) return;
    const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='triangle';
    o.frequency.value = 540 + (i%N)*22 + Math.floor(i/N)*9;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.14,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.1);
  }
  function chime(){
    const a=ac(); if(!a) return;
    [523,659,784,1047].forEach((f,k)=>{
      const t=a.currentTime+k*0.11, o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.42);
    });
  }

  // ---- chatter ----
  const nudges = [
    "See? One poke, five out. That's arithmetic doing your bedtime for you!",
    "Go on, poke a middle one — knocks four out at once, lovely stuff.",
    "Clear that top row first, dear, then chase the leftovers straight DOWN.",
    "Click the same window twice and it cancels clean out — order never matters, only WHICH ones!",
    "Nearly there! One press-set short is all a stubborn board ever is.",
    "Ooh, don't fuss the corners till last, they only reach three.",
  ];
  function say(html){ chatter.innerHTML = html; }
  function nudge(){ say(nudges[Math.floor(Math.random()*nudges.length)]); }

  // ---- a press ----
  function press(i, fromUser){
    if(fromUser) click(i);
    board ^= masks[i];
    clearHints();
    render();
    if(board===0){ win(); }
    else if(fromUser && Math.random()<0.5){
      const litCount = bits(board);
      if(litCount<=2) say("So close I can taste the tea! Chase what's left <b>down and left</b>.");
      else nudge();
    }
    return board;
  }

  function bits(x){ let n=0; while(x){ n+=x&1; x>>=1; } return n; }

  function win(){
    if(solvedThisBlock) return;
    solvedThisBlock = true;
    cabinet.classList.add('solved');
    chime();
    say("<b>THERE — every soul in bed, lights out, lovely!</b> Deal a fresh block, I've got a whole street to see to.");
    let n = getTally()+1;
    setTally(n);
  }

  // ---- solver: Gaussian elimination over GF(2), A x = board ----
  function solve(target){
    const coef = new Array(SIZE), rhs = new Array(SIZE), where = new Array(SIZE).fill(-1);
    for(let i=0;i<SIZE;i++){ coef[i]=masks[i]; rhs[i]=(target>>i)&1; }
    let row=0;
    for(let col=0; col<SIZE && row<SIZE; col++){
      let sel=-1;
      for(let r=row;r<SIZE;r++){ if((coef[r]>>col)&1){ sel=r; break; } }
      if(sel<0) continue;
      [coef[row],coef[sel]]=[coef[sel],coef[row]];
      [rhs[row],rhs[sel]]=[rhs[sel],rhs[row]];
      where[col]=row;
      for(let r=0;r<SIZE;r++){
        if(r!==row && ((coef[r]>>col)&1)){ coef[r]^=coef[row]; rhs[r]^=rhs[row]; }
      }
      row++;
    }
    for(let r=row;r<SIZE;r++){ if(coef[r]===0 && rhs[r]===1) return null; }
    let x=0;
    for(let col=0;col<SIZE;col++){ if(where[col]>=0 && rhs[where[col]]) x|=(1<<col); }
    return x;
  }

  // ---- hints ----
  let hintTimers = [];
  function clearHints(){
    hintTimers.forEach(clearTimeout); hintTimers=[];
    cells.forEach(c=>c.classList.remove('hint'));
  }
  function showHint(){
    clearHints();
    if(board===0){ say("Already dark as a pocket, this one! Deal a NEW BLOCK for a proper poke."); return; }
    const sol = solve(board);
    if(sol===null){ say("Hm! Won't quite go — deal a fresh block, dear."); return; }
    const list=[];
    for(let i=0;i<SIZE;i++){ if((sol>>i)&1) list.push(i); }
    say("Right, poke <b>these exact ones</b> — any order you like, it all comes to the same sum!");
    list.forEach((idx,k)=>{
      hintTimers.push(setTimeout(()=>{ cells[idx].classList.add('hint'); }, k*160));
    });
  }

  // ---- scramble: random real presses => always solvable ----
  function newBlock(){
    clearHints();
    cabinet.classList.remove('solved');
    solvedThisBlock=false;
    do{
      board=0;
      const k = 6 + Math.floor(Math.random()*9);
      for(let p=0;p<k;p++){ board ^= masks[Math.floor(Math.random()*SIZE)]; }
    } while(board===0);
    render();
    say("Fresh block, all tucked up crooked! Clear the <b>top row</b> first, then chase 'em down.");
  }

  // ---- tally in localStorage ----
  function getTally(){ let v=parseInt(localStorage.getItem('pomandy_blocks')||'0',10); return isNaN(v)?0:v; }
  function setTally(n){ localStorage.setItem('pomandy_blocks', String(n)); tallyN.textContent=n; }

  document.getElementById('showBtn').addEventListener('click', showHint);
  document.getElementById('newBtn').addEventListener('click', newBlock);

  // ---- boot ----
  tallyN.textContent = getTally();
  newBlock();

  console.log("%cchase it DOWN, dear!","color:#f5c542;font-weight:bold");
  console.log("switch-sum: each press adds its 5-window mask mod 2. order never matters, only the set.");
})();
</script>
