  <meta name="outbox-spec-era" content="January 1988, right now — twenty past seven on a 39°C evening in the back room of a rented house in Prospect, north of Adelaide, with the ceiling fan switched off on purpose because the draught moves the handbell leathers and the noise of it eats the striking. Four people sit round a card table with eight handbells laid on a folded blanket, two bells to a pair of hands. They started at ten past seven. If nothing goes wrong they will finish at about ten past ten, and nothing going wrong means no person mishandling a single blow for two hours fifty minutes. Not a look-back at anything and not a lament for anything: they are eleven minutes in, 380 rows down out of 5040, the room is not getting cooler, and there is no way to stop and start again.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport, edge to edge, is ONE NARROW COLUMN OF SEVEN-DIGIT ROWS climbing upward in real time, and that is the whole page. No header, no menu, no title, no scrollbar, no scrollback, no controls, no legend, no explanation, nothing else drawn anywhere. A new row is struck at the bottom of the column roughly every 2.1 seconds; every row already rung shifts up one line and fades one step toward the wall colour behind it; rows that reach the top edge leave and cannot be brought back by any means at all — there is no scrolling, no history, no log. The page is attempting the full extent: all 5,040 arrangements of seven bells, each occurring exactly once and the last returning to 1234567, which takes about two hours and fifty minutes of sitting there. The visitor's entire vocabulary is two gestures and neither is a button. (1) Click any digit and that bell is COUNTED — it renders bold for the remainder of the peal, so its path visibly hunts up and down through every subsequent row as a line you can follow with your eye, and clicking a second bell replaces the first, because nobody can count two. (2) Press and hold anywhere for two full seconds and the ringing STANDS: the column stops mid-row, dead, permanently, and the page for the rest of that visit and every visit afterward shows nothing but the row it stopped on. Nothing scrolls. Nothing restarts. There is no reset.">
  <meta name="outbox-spec-subject" content="The flat combinatorial and physical business of ringing a peal of triples on handbells, and specifically why the whole thing is an arithmetic obligation carried by four sets of arms — that seven working bells have exactly 7! = 5,040 possible orders, that a peal on seven is therefore not an arbitrary length but the complete extent, every arrangement once and none twice, and that the eighth bell covers behind every row and is never part of the permutation; that a change is not a tune but a permutation applied to the previous row, and the only legal moves are swapping adjacent pairs or leaving a bell in the place it just occupied, because a bell physically cannot move more than one position per blow at handstroke-and-backstroke speed; that a METHOD is therefore just a place notation — a repeating string like x.14.x.36 telling you which places make and which pairs cross — and everything the ringers hear falls out of that string and nothing else; that a plain course of Plain Bob Triples produces only 112 rows and then closes on itself, which is why CALLS exist: a bob alters one lead end and shunts the composition into rows it hasn't been to, and it is a documented fact that no extent of Plain Bob Triples can be obtained with plain leads and bobs alone (Thompson proved it in 1886), so singles are structurally compulsory and not a matter of taste; that FALSENESS is the only failure that cannot be argued about — if any one of the 5,040 rows repeats, the peal is not short or scrappy, it does not exist, and a composition is checked for falseness on paper for hours before anybody picks a bell up; that a conductor is not keeping time, she is holding a COURSING ORDER in her head — the cyclic order in which the bells follow each other round — and calling from it, because at handbell speed there is no time to read a row and decide, so she has to already know what the row will be before it happens; that tower ringers use ropesight, watching bodies and ropes, and handbell ringers have nothing to watch at all, so they think in PAIRS and not in places — each person owns two bells and learns the two paths as a single interlocking shape, which is why the notation a handbell ringer writes for themselves is unreadable to a tower ringer; that STRIKING is judged on the gaps and not on the notes — the ear hears an even row as one clean sequence and hears a bell a twentieth of a second late as a fault every time, and a whole peal can be rung with every row correct and still be a bad peal; that handstroke leads open with a small extra gap on purpose and always have; that a bell's tone is honestly inharmonic — hum, prime, a minor-third tierce, quint and a nominal an octave above the hum — which is why bells clash where tuned pipes wouldn't; that fatigue is a real term, that a wrist holding a handbell for two hours fifty gets a real tremor and the tremor lands as bad striking, and that the commonest way a peal is lost is not ignorance but somebody's attention going for one blow at row 3,100 and never coming back; and the flat arithmetic that at 2.1 seconds a row, 5,040 rows is 2h 56m, that they are 380 rows in, that the shortest peal length on seven is 5,040 and there is no negotiating it down, and that nobody in this room can stop.">
  <meta name="outbox-spec-tone" content="The page is almost wordless, and the only words on it are what a conductor actually says out loud, appearing on the line where they occur and nowhere else: BOB, SINGLE, GO NEXT, THAT'S ALL. They are said by Roslyn 'Ros' Tregaskis-Hoy, 34, a hydrographic technician who conducts from the 7-8 and who is not narrating anything, because narrating costs her the coursing order and the coursing order is the only thing keeping 5,040 rows honest. Her presence is entirely in the calls: they arrive early enough to be acted on and never a syllable earlier, they are flat and identical every time, and she never once explains, encourages, apologises, or comments on the ringing. Exactly three times in the whole extent she says something that is not a call — 'Up a bit, four,' 'Steady,' and, much later, 'Well struck' — each once, each on its own line, each in the same weight as the calls, each never repeated or referred to. She does not address the visitor, does not know the visitor is there, does not welcome, thank, warn or say goodbye. Nothing on the page is ever in the first person. Explicitly NOT a teacher, NOT a guide, NOT wry, NOT reverent, NOT a craftsman-sage, NOT a voice-over: four people are doing a hard physical arithmetic in a hot room and one of them occasionally has to say a word so the other three know where they are going.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is the back room's flat 1970s ochre distemper (#e8dcb8), going a shade dirtier and greener along the skirting line at the very bottom of the frame (#cdbe93) with honest patchiness where a picture used to hang. The rows are set in the hard blue-black of a duplicated method sheet (#26313f) for the row just struck, and every older row is composited honestly toward the wall colour by age, stepping through (#4c5764), (#7d8189), (#a8a48f) and reaching the wall itself (#cdbe93) exactly as it leaves the top edge, so the column is a real legibility gradient and the top third of the page is nearly gone. A counted bell renders at full #26313f forever, so the bold digit visibly threads a dark line up through rows that have otherwise faded, which is the only structure ever made visible. Exactly one chip of handbell leather tan (#a8642a) is held strictly for the conductor's calls, the three non-call lines, and — if it ever happens — the word FALSE; it never touches a digit. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than the honest fade of age — printed weight on painted plaster under a single 60-watt fitting on a hot summer evening.">
  <meta name="outbox-spec-wildcard" content="One row in the extent — always the 2,519th, every visit, in every session that gets that far — is drawn sitting about a third of a line low, below its own baseline, as though it had dropped through the ruling. It is a perfectly correct row, it is not false, it is struck on time, it fades and leaves at the same rate as everything else, and no call, no mark, no colour and no sound distinguishes it. It is simply low, in the same place, every time.">
  <meta name="outbox-spec-forbidden" content="NO bells as metaphor for anything — not time, not mortality, not summoning, not mourning, not memory, not 'something calling you home'; these are eight tuned lumps of bell metal being struck in a computed order, and they have nothing to teach anybody. ABSOLUTELY NO church, no faith, no belfry reverence, no Sunday-morning-over-the-fields, no English-village pastoral, no lychgate, no Nine Tailors, no murder-mystery register, no funeral toll, no wedding peal sentiment — there is no church anywhere in this piece and there must not be one. NO mathematical mysticism: no sublime order, no 'the beauty of permutation', no group theory as poetry, no Borges, no infinity, no cosmic patterning, no fractal awe. NO meditative, hypnotic, trance, ambient, ASMR, screensaver or 'let the rows still you' register whatsoever. NO endurance-as-spiritual-ordeal framing, NO transcendence, NO flow-state lyricism, NO 'they were no longer four people' — four people are tired and hot and counting. NO nostalgia, NO wistfulness, NO 'nobody rings peals anymore / the last of the handbell bands / a dying art' decline narrative — they are 380 rows in and it is quarter to eight. NO society / club / guild / association / band-of-hobbyists scaffolding, NO fictional-organisation framing, NO founding date, NO membership, NO tradition. NO heat-as-oppression pathos, NO Australian-larrikin comedy, NO dialect spelling, NO explaining Australia to anybody, NO 1988-Bicentenary framing, NO suburban-malaise register. NO danger, NO dread, NO countdown tension, NO ominous or cryptic or SCP or liminal framing of the fading rows, the unrecoverable scrollback, the low row at 2,519, or the possibility of FALSE — nothing here is wrong or uncanny, a lost peal is simply a lost peal. NO sensuous material writing about bronze, sound, or light beyond pitch, partial, decay, spacing and weight. NO archival / museum / cabinet / drawer / peal-board / found-record framing — this is happening this minute on a card table. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice. NO signal / transmission / frequency / broadcast / message framing of the ringing, despite it being a sequence of tones. NO instructional UI text, captions, header, footer, credits, tally, title overlay, tooltip, hint, or narrating voice anywhere on the page — the only words that may ever appear are the conductor's four calls and her three non-call lines.">

<script>
"use strict";
/* -------------------------------------------------------------
   Plain Bob Triples.  7.1.7.1.7.1.7.1.7.1.7.1.7.127
   bob 147   single 12347   lead 14 changes   360 leads   5040 rows
   ------------------------------------------------------------- */
console.log("%c7.1.7.1.7.1.7.1.7.1.7.1.7.127   bob 147   single 12347","color:#a8642a");

var N=7;
function applyPN(row,places){
  var out=row.slice(),i=0;
  while(i<N){
    if(places.indexOf(i+1)>=0){out[i]=row[i];i++;}
    else if(i+1<N){out[i]=row[i+1];out[i+1]=row[i];i+=2;}
    else {out[i]=row[i];i++;}
  }
  return out;
}
var LEAD_CH=[];
for(var i=0;i<13;i++) LEAD_CH.push(i%2===0?[7]:[1]);
var LE={p:[1,2,7],b:[1,4,7],s:[1,2,3,4,7]};
function leadRows(h,call){
  var r=h.slice(),out=[],k;
  for(k=0;k<LEAD_CH.length;k++){r=applyPN(r,LEAD_CH[k]);out.push(r);}
  r=applyPN(r,LE[call]);out.push(r);
  return out;
}
var ID=[1,2,3,4,5,6,7];
function compose(a,b){var o=[],j;for(j=0;j<N;j++)o.push(a[b[j]-1]);return o;}
function inv(p){var o=new Array(N),j;for(j=0;j<N;j++)o[p[j]-1]=j+1;return o;}
var Mp=leadRows(ID,'p')[13], Mb=leadRows(ID,'b')[13], Ms=leadRows(ID,'s')[13];
var D=compose(Mb,inv(Mp)), E=compose(Ms,inv(Mp));
function key(r){return r.join('');}

/* ---- build a true 5040: plain courses spliced by q-sets of bobs,
        which cannot on their own close (60 courses, -2 each time),
        so a q-set of singles is required to finish. ---------- */
function buildComposition(){
  var nodes=[],idx={},q=[[1,2,3,4,5,6,7]],seenN={};
  seenN[key(q[0])]=true;
  while(q.length){
    var h=q.shift(); idx[key(h)]=nodes.length; nodes.push(h);
    var succ=[compose(h,Mp),compose(h,Mb),compose(h,Ms)];
    for(var s=0;s<3;s++){var k2=key(succ[s]); if(!seenN[k2]){seenN[k2]=true;q.push(succ[s]);}}
  }
  var n=nodes.length; // 360
  var par,rank;
  function find(x){while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;}
  function uni(a,b){a=find(a);b=find(b);if(a===b)return false;if(rank[a]<rank[b]){var t=a;a=b;b=t;}par[b]=a;if(rank[a]===rank[b])rank[a]++;return true;}
  var Dm=D, D2=compose(D,D);
  // q-sets
  var bobsets=[],mark={},a,b,c,ka;
  for(a=0;a<n;a++){
    ka=key(nodes[a]); if(mark[ka])continue;
    var hb=compose(nodes[a],Dm), hc=compose(nodes[a],D2);
    var kb=key(hb),kc=key(hc);
    if(kb===ka||kc===ka||kb===kc)continue;
    if(idx[kb]===undefined||idx[kc]===undefined)continue;
    mark[ka]=mark[kb]=mark[kc]=1;
    bobsets.push([idx[ka],idx[kb],idx[kc]]);
  }
  var singsets=[],mark2={};
  for(a=0;a<n;a++){
    ka=key(nodes[a]); if(mark2[ka])continue;
    var he=compose(nodes[a],E), ke=key(he);
    if(ke===ka||idx[ke]===undefined)continue;
    mark2[ka]=mark2[ke]=1;
    singsets.push([idx[ka],idx[ke]]);
  }
  function shuffled(arr,rnd){var x=arr.slice(),j,t,i2;for(i2=x.length-1;i2>0;i2--){j=Math.floor(rnd()*(i2+1));t=x[i2];x[i2]=x[j];x[j]=t;}return x;}
  var seed=20880116;
  function rnd(){seed=(seed*1664525+1013904223)&0x7fffffff;return seed/0x7fffffff;}

  for(var attempt=0;attempt<80;attempt++){
    par=[];rank=[];
    for(a=0;a<n;a++){par.push(a);rank.push(0);}
    var call=[];for(a=0;a<n;a++)call.push('p');
    var assigned=[];for(a=0;a<n;a++)assigned.push(false);
    for(a=0;a<n;a++) uni(a, idx[key(compose(nodes[a],Mp))]);
    var comps=function(){var s2={},cnt=0;for(var z=0;z<n;z++){var r2=find(z);if(!s2[r2]){s2[r2]=1;cnt++;}}return cnt;};
    var pass;
    var bs=shuffled(bobsets,rnd), ss=shuffled(singsets,rnd);
    for(pass=0;pass<8;pass++){
      var progress=false,t2;
      for(t2=0;t2<bs.length;t2++){
        var Q=bs[t2];
        if(assigned[Q[0]]||assigned[Q[1]]||assigned[Q[2]])continue;
        var r0=find(Q[0]),r1=find(Q[1]),r3=find(Q[2]);
        if(r0!==r1&&r1!==r3&&r0!==r3){
          call[Q[0]]='b';call[Q[1]]='b';call[Q[2]]='b';
          assigned[Q[0]]=assigned[Q[1]]=assigned[Q[2]]=true;
          uni(Q[0],Q[1]);uni(Q[1],Q[2]);progress=true;
        }
      }
      if(comps()===1)break;
      for(t2=0;t2<ss.length;t2++){
        var P2=ss[t2];
        if(assigned[P2[0]]||assigned[P2[1]])continue;
        if(find(P2[0])!==find(P2[1])){
          call[P2[0]]='s';call[P2[1]]='s';
          assigned[P2[0]]=assigned[P2[1]]=true;
          uni(P2[0],P2[1]);progress=true;
          if(comps()===1)break;
        }
      }
      if(comps()===1)break;
      if(!progress){bs=shuffled(bobsets,rnd);ss=shuffled(singsets,rnd);}
    }
    // verify by walking
    var map={};
    for(a=0;a<n;a++) map[key(nodes[a])]=call[a];
    var h2=[1,2,3,4,5,6,7],cnt2=0,ok=true,vis={};
    for(var st=0;st<n;st++){
      var kk=key(h2);
      if(vis[kk]){ok=false;break;}
      vis[kk]=1;cnt2++;
      var cc=map[kk]||'p';
      h2=(cc==='b')?compose(h2,Mb):(cc==='s')?compose(h2,Ms):compose(h2,Mp);
    }
    if(ok&&cnt2===n&&key(h2)==='1234567') return map;
  }
  return null;
}
var calls=buildComposition()||{};

/* ------------------------ engine state ------------------------ */
var LS={};
try{LS=window.localStorage;}catch(e){LS={getItem:function(){return null;},setItem:function(){}};}
function gi(k,d){var v=null;try{v=LS.getItem(k);}catch(e){}return v===null?d:v;}
function si(k,v){try{LS.setItem(k,v);}catch(e){}}

var STOOD=gi('pbt.stood',null);
var FALSEROW=gi('pbt.false',null);
var DONEROW=gi('pbt.done',null);
var counted=parseInt(gi('pbt.count','0'),10)||0;

var leadHead=[1,2,3,4,5,6,7],curRows=null,curCall='p',posInLead=0,rowIndex=0;
var seen={};
function loadLead(){ curCall=calls[key(leadHead)]||'p'; curRows=leadRows(leadHead,curCall); posInLead=0; }
loadLead();
var wentFalse=false, falseRowStr=null;
function advance(){
  if(rowIndex>=5040) return null;
  var r=curRows[posInLead];
  posInLead++; rowIndex++;
  var s=key(r);
  if(seen[s]){ wentFalse=true; falseRowStr=s; return r; }
  seen[s]=1;
  if(posInLead===14){ leadHead=r; loadLead(); }
  return r;
}

/* ------------------------ the column ------------------------ */
var col=document.getElementById('col');
var vh=window.innerHeight, vw=window.innerWidth;
var LH=Math.max(19,Math.min(30,Math.round(vh/30)));
var BASE=46;
var totalY=0, lines=[];
var ANCH=[[0x26,0x31,0x3f],[0x4c,0x57,0x64],[0x7d,0x81,0x89],[0xa8,0xa4,0x8f],[0xcd,0xbe,0x93]];
var TAN=[0xa8,0x64,0x2a], WALL=[0xcd,0xbe,0x93];
function hx(c){var f=function(x){x=Math.max(0,Math.min(255,Math.round(x)));var t=x.toString(16);return t.length<2?'0'+t:t;};return '#'+f(c[0])+f(c[1])+f(c[2]);}
function fadeCol(f){
  f=Math.max(0,Math.min(0.9999,f));
  var seg=f*(ANCH.length-1), i=Math.floor(seg), t=seg-i;
  var a=ANCH[i], b=ANCH[Math.min(ANCH.length-1,i+1)];
  return hx([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);
}
function fadeTan(f){
  f=Math.max(0,Math.min(1,f));
  return hx([TAN[0]+(WALL[0]-TAN[0])*f,TAN[1]+(WALL[1]-TAN[1])*f,TAN[2]+(WALL[2]-TAN[2])*f]);
}
function pushRow(rowArr,spacing,low){
  totalY+=LH*spacing;
  var el=document.createElement('div');
  el.className='ln';
  for(var i=0;i<7;i++){
    var sp=document.createElement('span');
    sp.textContent=String(rowArr[i]);
    sp.setAttribute('data-b',rowArr[i]);
    el.appendChild(sp);
  }
  col.appendChild(el);
  lines.push({el:el,y:totalY,low:low||0,kind:'row'});
  reflow();
}
function pushSay(text,spacing){
  totalY+=LH*spacing;
  var el=document.createElement('div');
  el.className='ln say';
  el.textContent=text;
  col.appendChild(el);
  lines.push({el:el,y:totalY,low:0,kind:'say'});
  reflow();
}
function reflow(){
  var vis=Math.max(6,(vh-BASE)/LH);
  for(var i=lines.length-1,age=0;i>=0;i--,age++){
    var L=lines[i];
    var b=BASE+(totalY-L.y)-(L.low||0);
    L.el.style.bottom=b+'px';
    var f=age/vis;
    if(L.kind==='say'){ L.el.style.color=fadeTan(Math.min(1,f*1.05)); }
    else{
      var c=fadeCol(f), kids=L.el.childNodes;
      for(var k=0;k<kids.length;k++){
        var bel=parseInt(kids[k].getAttribute('data-b'),10);
        if(counted&&bel===counted){kids[k].style.color='#26313f';kids[k].style.fontWeight='700';}
        else{kids[k].style.color=c;kids[k].style.fontWeight='400';}
      }
    }
    if(b>vh+LH*2){ if(L.el.parentNode)L.el.parentNode.removeChild(L.el); lines.splice(i,1); }
  }
}
window.addEventListener('resize',function(){
  vh=window.innerHeight;vw=window.innerWidth;
  LH=Math.max(19,Math.min(30,Math.round(vh/30)));
  reflow();
});

/* ------------------------ sound ------------------------ */
var AC=null,master=null,audioOn=false,carDone=false,carAt=60+Math.random()*340;
var NOM={1:523.25,2:493.88,3:440.00,4:392.00,5:349.23,6:329.63,7:293.66,8:261.63};
function initAudio(){
  if(audioOn)return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{ AC=new C(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
  audioOn=true;
  startRoom();
}
function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=Math.random()*2-1;
  return b;
}
function strike(bell,when,vol){
  if(!audioOn)return;
  var nom=NOM[bell];
  var parts=[[0.2500,1.00,0.34],[0.5000,0.72,0.30],[0.5990,0.55,0.20],[0.7510,0.44,0.16],[1.0000,0.30,0.26]];
  var dur=1.0+(bell/8)*5.6;
  for(var p=0;p<parts.length;p++){
    var o=AC.createOscillator(),g=AC.createGain();
    var det=1+(p*0.0007)*((bell%2)?1:-1);
    o.type='sine'; o.frequency.value=nom*parts[p][0]*det;
    var pk=vol*parts[p][2]*0.055;
    g.gain.setValueAtTime(0.0001,when);
    g.gain.linearRampToValueAtTime(pk,when+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur*parts[p][1]);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when+dur*parts[p][1]+0.03);
  }
  // card table taking it, faintly
  var lo=AC.createOscillator(),lg=AC.createGain();
  lo.type='sine'; lo.frequency.value=92+bell*3;
  lg.gain.setValueAtTime(0.0001,when);
  lg.gain.linearRampToValueAtTime(vol*0.010,when+0.006);
  lg.gain.exponentialRampToValueAtTime(0.0001,when+0.20);
  lo.connect(lg);lg.connect(master);lo.start(when);lo.stop(when+0.22);
}
function clack(when){
  if(!audioOn)return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.05);
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2100; f.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.012,when);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.045);
  s.connect(f);f.connect(g);g.connect(master);
  s.start(when);s.stop(when+0.06);
}
function startRoom(){
  // cicadas, on their own clock
  var cs=AC.createBufferSource(); cs.buffer=noiseBuf(2.0); cs.loop=true;
  var cf=AC.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=4600; cf.Q.value=3.2;
  var cg=AC.createGain(); cg.gain.value=0.0085;
  var lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=6.7;
  var lg=AC.createGain(); lg.gain.value=0.0045;
  lfo.connect(lg); lg.connect(cg.gain);
  cs.connect(cf);cf.connect(cg);cg.connect(master);
  cs.start();lfo.start();
  // fridge compressor, two rooms away
  var fo=AC.createOscillator(),fo2=AC.createOscillator(),fg=AC.createGain();
  fo.type='sine';fo.frequency.value=118.5; fo2.type='sine';fo2.frequency.value=237.4;
  var fg2=AC.createGain();fg2.gain.value=0.28;
  fo.connect(fg);fo2.connect(fg2);fg2.connect(fg);
  fg.gain.value=0.0; fg.connect(master);
  fo.start();fo2.start();
  var t=AC.currentTime;
  for(var c=0;c<40;c++){
    var on=t+c*330+ (c%3)*11;
    fg.gain.setValueAtTime(0.0,on);
    fg.gain.linearRampToValueAtTime(0.0075,on+2.2);
    fg.gain.setValueAtTime(0.0075,on+205);
    fg.gain.linearRampToValueAtTime(0.0,on+208);
  }
}
function passCar(){
  if(!audioOn||carDone)return; carDone=true;
  var t=AC.currentTime+0.2;
  var s=AC.createBufferSource(); s.buffer=noiseBuf(8); s.loop=false;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(240,t); f.Q.value=0.9;
  f.frequency.linearRampToValueAtTime(680,t+3.2);
  f.frequency.linearRampToValueAtTime(190,t+7.5);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.020,t+3.0);
  g.gain.linearRampToValueAtTime(0.0001,t+7.6);
  s.connect(f);f.connect(g);g.connect(master);
  s.start(t);s.stop(t+8);
}

/* ------------------------ striking ------------------------ */
var BI=0.25;           // blow interval
var OFF={1:0.002,2:0.002,3:-0.003,4:-0.003,5:0.019,6:0.019,7:0.000,8:0.000}; // 5-6 honestly a shade late
function gauss(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);}

/* ------------------------ run ------------------------ */
function finalOnly(rowStr,extraWord){
  var arr=rowStr.split('').map(Number);
  totalY=0;lines=[];col.innerHTML='';
  pushRow(arr,0,0);
  var L=lines[lines.length-1],kids=L.el.childNodes;
  for(var k=0;k<kids.length;k++){
    var bel=parseInt(kids[k].getAttribute('data-b'),10);
    kids[k].style.color='#26313f';
    kids[k].style.fontWeight=(counted&&bel===counted)?'700':'400';
  }
  if(extraWord){
    var el=document.createElement('div');
    el.className='ln say';
    el.textContent=extraWord;
    el.style.color='#a8642a';
    el.style.bottom=(BASE-LH*1.15)+'px';
    col.appendChild(el);
  }
}

var running=true;
if(FALSEROW){ finalOnly(FALSEROW,'FALSE'); running=false; }
else if(STOOD){ finalOnly(STOOD,null); running=false; }
else if(DONEROW){ finalOnly(DONEROW,null); running=false; }

var t0=0,dueT=0,prevStart=null,started=false;
var SAYS={611:'Up a bit, four,',2308:'Steady,',4402:'Well struck'};

if(running){
  var startAt=parseInt(gi('pbt.pos','380'),10);
  if(!(startAt>=0&&startAt<5040)) startAt=380;
  if(startAt<380) startAt=380;
  while(rowIndex<startAt){ if(!advance()) break; if(wentFalse) break; }
  if(wentFalse){ si('pbt.false',falseRowStr); finalOnly(falseRowStr,'FALSE'); running=false; }
}

function emit(){
  // conductor's line, if any, sits on the line just under the ringing
  if(posInLead===10){
    var lastLeadStart=rowIndex+ (14-posInLead);
    if(rowIndex+4>=5040) pushSay("THAT'S ALL",0.62);
    else if(rowIndex+18>=5040) pushSay("GO NEXT",0.62);
    if(curCall==='b') pushSay('BOB',0.62);
    else if(curCall==='s') pushSay('SINGLE',0.62);
  }
  var nextNo=rowIndex+1;
  if(SAYS[nextNo]) pushSay(SAYS[nextNo],0.62);

  var hand=(nextNo%2===1);
  var nomStart=dueT;
  var r=advance();
  if(!r){ running=false; si('pbt.done','1234567'); return; }
  if(wentFalse){
    si('pbt.false',falseRowStr);
    pushRow(r,1,0);
    pushSay('FALSE',0.62);
    running=false;
    return;
  }
  var sigma=0.0055+0.0215*(rowIndex/5040);
  var blows=[],k,bell,t;
  for(k=0;k<8;k++){
    bell=(k<7)?r[k]:8;
    t=nomStart+(hand?BI:0)+k*BI+OFF[bell]+gauss()*sigma;
    blows.push([bell,t]);
  }
  var actual=blows[0][1];
  var spacing=1;
  if(prevStart!==null) spacing=Math.max(0.55,Math.min(1.8,(actual-prevStart)/2.125));
  prevStart=actual;

  var low=(rowIndex===2519)?Math.round(LH/3):0;
  pushRow(r,spacing,low);

  var lateBy=(performance.now()/1000-t0)-nomStart;
  if(audioOn&&lateBy<0.9){
    var base=AC.currentTime+0.06;
    for(k=0;k<8;k++) strike(blows[k][0],base+(blows[k][1]-nomStart),k===7?0.95:1.0);
    if(hand) clack(base-0.02);
    if(!carDone&&(performance.now()/1000-t0)>carAt) passCar();
  }

  dueT=nomStart+(hand?BI:0)+8*BI;
  if(rowIndex%20===0) si('pbt.pos',String(rowIndex));
  var tot=parseInt(gi('pbt.rows','0'),10)||0;
  if(rowIndex%20===0) si('pbt.rows',String(tot+20));
}

function frame(){
  if(!running){ return; }
  var now=performance.now()/1000;
  var guard=0;
  while(running&&now-t0>=dueT&&guard<220){ emit(); guard++; }
  requestAnimationFrame(frame);
}
if(running){
  t0=performance.now()/1000;
  dueT=0;
  requestAnimationFrame(frame);
}

/* ------------------------ two gestures ------------------------ */
var holdTimer=null,downAt=0;
function stand(){
  if(!running)return;
  running=false;
  var last=null;
  for(var i=lines.length-1;i>=0;i--){ if(lines[i].kind==='row'){ last=lines[i]; break; } }
  var s='';
  if(last){ var kids=last.el.childNodes; for(var k=0;k<kids.length;k++) s+=kids[k].textContent; }
  else s='1234567';
  si('pbt.stood',s);
  si('pbt.pos',String(rowIndex));
  finalOnly(s,null);
}
document.addEventListener('pointerdown',function(ev){
  initAudio();
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  downAt=performance.now();
  if(holdTimer)clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){holdTimer=null;stand();},2000);
},{passive:true});
function up(ev){
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  var el=ev.target;
  if(performance.now()-downAt<2000&&el&&el.getAttribute&&el.getAttribute('data-b')){
    var b=parseInt(el.getAttribute('data-b'),10);
    counted=(counted===b)?0:b;
    si('pbt.count',String(counted));
    reflow();
  }
}
document.addEventListener('pointerup',up,{passive:true});
document.addEventListener('pointercancel',function(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}},{passive:true});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
