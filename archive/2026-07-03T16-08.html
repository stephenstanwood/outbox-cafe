  <meta name="outbox-spec-era" content="Right now, present-tense schoolyard — a paper fortune-teller (a cootie catcher / chatterbox) folded this week out of a torn half-sheet of blue-ruled loose-leaf at a cafeteria table, the felt-tip still a little smeary where a thumb dragged through it, the creases sharp because somebody ran a fingernail down every fold. Not a relic, not a nostalgia object, not a 'kids used to make these' museum piece — a working folded-paper toy sitting on a lunch tray at this exact minute, made to run on a friend the way it has been folded and run for as long as there have been kids and spare paper.">
  <meta name="outbox-spec-format" content="The entire viewport IS a paper fortune-teller seen straight down, closed: four color-flaps (RED, BLUE, GREEN, YELLOW) pinched together at the center, each hand-lettered in felt-tip on blue-ruled paper. You click a color and the whole toy actually works the origami pinch — it opens north-south, closes, opens east-west, closes, alternating the two axes once per chanted letter (R-E-D), the paper flexing and re-folding in real CSS 3D each beat; when it stops it's yawning open showing eight numbered inner triangles, you click a number and it counts itself open-and-shut that many times, then you click one of the exposed numbered flaps and THAT triangle peels up and unfolds to reveal the fortune inked underneath. The page is nothing but the folded toy, opening and shutting in your hands — no chrome, no header, no menu.">
  <meta name="outbox-spec-subject" content="The paper fortune-teller itself and the eight ridiculous playground fortunes crammed under its flaps in cramped felt-tip — the whole small craft of the thing: the tight center pinch that lets it open two ways, the letters you chant on the color, the numbers you count on the open-and-shut, the way the same eight fortunes get reshuffled under different flaps every folding so nobody can game which triangle to pick; and the fortunes themselves, gleeful and lightly savage in the exact schoolyard register — you will become moderately famous for a smell, you owe the person to your left one (1) favor, your future pet is already watching you, etc.">

<title>Pick a Color, Now a Number, Now Hold Still</title>
<meta name="oc-engine-era" content="present-tense schoolyard, folded this week">
<meta name="oc-engine-format" content="working paper fortune-teller, real CSS pinch">
<!-- folded at the far lunch table from a torn half-sheet. the crease down the middle is where a fingernail went. it runs on a friend. that's you now. -->
<style>
  :root{
    --paper:#f7f4e9; --rule:#a9c0dd; --pink:#e39aa8; --ink:#2a4d8f;
    --red:#d63d3d; --blue:#3566c4; --green:#3f9a52; --yellow:#e8b93a;
    --s:min(78vw,66vh);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(90deg, transparent 34px, #e39aa855 34px 36px, transparent 36px),
      repeating-linear-gradient(0deg, transparent 0 27px, #a9c0dd44 27px 28px);
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .stage{perspective:1200px;perspective-origin:50% 42%;margin:2vh 0 1vh}
  .toy{
    position:relative;width:var(--s);height:var(--s);
    transform-style:preserve-3d;transform:rotateX(26deg) rotateZ(-2.5deg);
    transition:transform .5s ease;
  }
  /* inner numbered octagon — lives under the flaps */
  .inner{position:absolute;inset:0;transform:translateZ(0);pointer-events:none}
  .tri{
    position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent 0 20px,#a9c0dd33 20px 21px);
    border:0;cursor:pointer;pointer-events:none;
    transition:filter .2s, opacity .35s, transform .4s;
  }
  .tri:nth-child(odd){background-color:#fdfaf0}
  .tri:nth-child(even){background-color:#f2eede}
  .tri span{
    position:absolute;transform:translate(-50%,-50%);
    font-weight:700;font-size:calc(var(--s)*.075);color:var(--ink);
    pointer-events:none;text-shadow:0 1px 0 #fff;
  }
  .toy[data-open="1"] .tri{pointer-events:auto}
  .tri:hover{filter:brightness(1.05) saturate(1.2)}
  /* the four color flaps */
  .quad{
    position:absolute;inset:0;transform-origin:50% 50%;
    transition:transform .48s cubic-bezier(.6,.05,.35,1);
    backface-visibility:visible;pointer-events:none;cursor:pointer;
    background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1px #0002;
    transform:translateZ(5px);
  }
  .q-tl{clip-path:polygon(0 0,50% 0,50% 50%,0 50%)}
  .q-tr{clip-path:polygon(50% 0,100% 0,100% 50%,50% 50%)}
  .q-bl{clip-path:polygon(0 50%,50% 50%,50% 100%,0 100%)}
  .q-br{clip-path:polygon(50% 50%,100% 50%,100% 100%,50% 100%)}
  .quad b{
    position:absolute;font-weight:700;letter-spacing:.5px;
    font-size:calc(var(--s)*.058);color:#fbf7ea;
    text-shadow:1px 1px 0 #0005, -1px -1px 0 #fff3;
    transform:translate(-50%,-50%) rotate(-3deg);
  }
  .q-tl{background-color:var(--red);
    background-image:repeating-linear-gradient(0deg,transparent 0 21px,#ffffff22 21px 22px)}
  .q-tr{background-color:var(--blue);
    background-image:repeating-linear-gradient(0deg,transparent 0 21px,#ffffff22 21px 22px)}
  .q-bl{background-color:var(--green);
    background-image:repeating-linear-gradient(0deg,transparent 0 21px,#ffffff22 21px 22px)}
  .q-br{background-color:var(--yellow);
    background-image:repeating-linear-gradient(0deg,transparent 0 21px,#ffffff26 21px 22px)}
  .q-tl b{top:25%;left:25%} .q-tr b{top:25%;left:75%}
  .q-bl b{top:75%;left:25%} .q-br b{top:75%;left:75%}
  /* clickable only when closed & idle */
  .toy[data-pick="color"] .quad{pointer-events:auto}
  .quad:hover{filter:brightness(1.08)}
  /* --- pinch states --- */
  .toy[data-state="closed"] .quad{transform:translateZ(5px) rotateX(0) rotateY(0)}
  .toy[data-state="ns"] .q-tl,.toy[data-state="ns"] .q-tr{transform:translateZ(5px) rotateX(-58deg)}
  .toy[data-state="ns"] .q-bl,.toy[data-state="ns"] .q-br{transform:translateZ(5px) rotateX(58deg)}
  .toy[data-state="ew"] .q-tl,.toy[data-state="ew"] .q-bl{transform:translateZ(5px) rotateY(58deg)}
  .toy[data-state="ew"] .q-tr,.toy[data-state="ew"] .q-br{transform:translateZ(5px) rotateY(-58deg)}
  .toy[data-state="open"] .q-tl,.toy[data-state="open"] .q-tr{transform:rotateX(-120deg)}
  .toy[data-state="open"] .q-bl,.toy[data-state="open"] .q-br{transform:rotateX(120deg)}
  .toy[data-state="open"] .quad{pointer-events:none!important}
  /* the pinch crease */
  .crease{position:absolute;inset:0;pointer-events:none;transform:translateZ(6px);opacity:.35}
  .crease:before,.crease:after{content:"";position:absolute;background:#0004}
  .crease:before{left:50%;top:6%;bottom:6%;width:1px}
  .crease:after{top:50%;left:6%;right:6%;height:1px}
  /* fortune note */
  .note{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(88deg);
    transform-origin:center top;width:min(80vw,340px);
    background:var(--paper);border:1px solid #cbb;
    background-image:repeating-linear-gradient(0deg,transparent 0 25px,#a9c0dd55 25px 26px);
    padding:22px 20px 18px;border-radius:3px;
    box-shadow:0 14px 34px #0003, inset 0 0 0 1px #fff8;
    opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,.7,.3,1.2),opacity .35s;
    z-index:20;text-align:center;
  }
  .note.show{transform:translate(-50%,-50%) rotateX(0);opacity:1;pointer-events:auto}
  .note p{margin:0;font-size:clamp(19px,4.6vw,25px);line-height:1.34;color:var(--ink);
    font-weight:700;transform:rotate(-1deg)}
  .note small{display:block;margin-top:12px;color:#8a7f6b;font-size:14px;transform:rotate(1deg)}
  .again{margin-top:16px;display:inline-block;background:none;border:2px dashed var(--pink);
    color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;
    padding:7px 14px;border-radius:20px;cursor:pointer}
  .again:hover{background:#e39aa822}
  /* the running friend-voice */
  .cap{
    max-width:min(92vw,560px);text-align:center;
    font-size:clamp(17px,4.4vw,22px);line-height:1.4;color:var(--ink);
    min-height:2.9em;padding:0 14px;transform:rotate(-.6deg);font-weight:700;
  }
  .cap em{color:var(--red);font-style:normal}
  /* pencil corner */
  .tally{
    position:fixed;right:12px;bottom:10px;text-align:right;
    color:#9a8f7a;font-size:13px;line-height:1.5;transform:rotate(-3deg);
    font-family:"Comic Sans MS","Comic Neue",cursive;opacity:.85;
  }
  .tally a{color:#9a8f7a;text-decoration:none;border-bottom:1px dotted #b3a690}
  .tally a:hover{color:var(--ink)}
  @media (max-height:560px){:root{--s:min(64vw,52vh)} .cap{min-height:2.4em}}
</style>
</head>
<body>
  <div class="stage">
    <div class="toy" data-state="closed" data-pick="color" data-open="0">
      <div class="inner" id="inner"></div>
      <div class="quad q-tl" data-word="RED"><b>RED</b></div>
      <div class="quad q-tr" data-word="BLUE"><b>BLUE</b></div>
      <div class="quad q-bl" data-word="GREEN"><b>GREEN</b></div>
      <div class="quad q-br" data-word="YELLOW"><b>YELLOW</b></div>
      <div class="crease"></div>
    </div>
  </div>

  <div class="cap" id="cap">okay okay sit DOWN — I folded this one at lunch, it works, watch. <em>pick a color!</em> any of the four, go!</div>

  <div class="note" id="note">
    <p id="noteText"></p>
    <small id="noteReact"></small>
    <button class="again" id="again">no way. fold me another →</button>
  </div>

  <div class="tally">
    FORTUNES TOLD: <span id="told">0</span><br>
    <a href="/archive">the other folds →</a>
  </div>

<script>
(function(){
  const toy=document.querySelector('.toy'), inner=document.getElementById('inner');
  const cap=document.getElementById('cap'), note=document.getElementById('note');
  const noteText=document.getElementById('noteText'), noteReact=document.getElementById('noteReact');
  const toldEl=document.getElementById('told'), again=document.getElementById('again');

  // seven inked, one forgotten-blank — the same eight, re-dealt every fold
  const FORTUNES=[
    "You will become moderately famous for a smell.",
    "You owe the person on your left one (1) favor. it's binding now, sorry.",
    "Your future pet is ALREADY watching you. it has notes.",
    "Somewhere a vending machine is deciding to give you two.",
    "A dog will learn your name before you learn its.",
    "You'll find one (1) dollar in a coat you forgot you owned.",
    "The next song you hear is secretly about you. tell no one.",
    null // the triangle somebody folded and never wrote under
  ];
  const REACTS=["I did NOT write that. that's just what the paper SAYS.",
    "see?? paper doesn't lie. it CAN'T.",
    "don't look at me like that. it's not my fault, it's the FOLD.",
    "okay that one's real. that one's SO real.",
    "the paper KNEW. it knew the whole time."];
  const BLANKS=[
    "…oh. that one's blank. okay — it means whatever you were just thinking. that counts. that TOTALLY counts.",
    "…huh, empty. that's the rare one! it means yes. to the thing. you know the thing.",
    "…oh no that's the one I forgot to write. okay it means good luck, but the normal amount. still counts!",
    "blank?! okay okay — the paper trusts you to make your own up. go on. make it a good one.",
    "…that one's bare. means the future's not done yet, leave it open, that's allowed, I checked."];

  // build the eight numbered inner triangles
  function edgePt(deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
    const t=0.5/Math.max(Math.abs(c),Math.abs(s));
    return (50+t*c*100).toFixed(1)+'% '+(50-t*s*100).toFixed(1)+'%';}
  for(let k=0;k<8;k++){
    const a0=k*45,a1=a0+45,am=(a0+22.5)*Math.PI/180;
    const t=document.createElement('div');t.className='tri';t.dataset.k=k;
    t.style.clipPath='polygon(50% 50%, '+edgePt(a0)+', '+edgePt(a1)+')';
    const nx=50+Math.cos(am)*30, ny=50-Math.sin(am)*30;
    const num=document.createElement('span');num.textContent=k+1;
    num.style.left=nx+'%';num.style.top=ny+'%';
    t.appendChild(num);inner.appendChild(t);
  }

  const KEY='oc_cootie_told';
  let told=0; try{told=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
  toldEl.textContent=told;

  let deal=[0,1,2,3,4,5,6,7], phase='color', busy=false;
  function shuffle(){for(let i=deal.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[deal[i],deal[j]]=[deal[j],deal[i]];}}
  shuffle();

  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const COUNTW=['','one','two','three','four','five','six','seven','eight'];
  function setState(s,open,pick){toy.dataset.state=s;toy.dataset.open=open?'1':'0';toy.dataset.pick=pick||'';}

  async function pinch(beats, sayFn){
    busy=true; setState('closed',false,'');
    for(let i=0;i<beats;i++){
      setState(i%2===0?'ns':'ew',false,'');
      if(sayFn) cap.innerHTML=sayFn(i);
      await wait(540);
      setState('closed',false,'');
      await wait(150);
    }
    busy=false;
  }

  // pick a color -> chant its letters, one pinch per letter, axes alternating
  toy.addEventListener('click',async e=>{
    const q=e.target.closest('.quad');
    if(!q||phase!=='color'||busy) return;
    const word=q.dataset.word;
    phase='chant';
    await pinch(word.length, i=>{
      const shown=word.slice(0,i+1).split('').join('‑');
      return i+1<word.length ? '“'+shown+'…”' : '“'+shown+'!” — <em>there.</em>';
    });
    setState('open',true,'');
    phase='num';
    cap.innerHTML='okay it\'s open! now gimme a <em>number</em> — any one you can see. quick, don\'t think!';
  });

  // pick a number -> count it out, then peel; both live on the inner triangles
  inner.addEventListener('click',async e=>{
    const t=e.target.closest('.tri'); if(!t||busy) return;
    const k=+t.dataset.k, n=k+1;
    if(phase==='num'){
      phase='count';
      await pinch(n, i=>{
        const s=COUNTW.slice(1,i+2).join('‑');
        return s + (i+1<n?'…':'!');
      });
      setState('open',true,'');
      phase='flap';
      cap.innerHTML='now — <em>pick one of those numbers.</em> that\'s your fortune under it. hold STILL—';
    } else if(phase==='flap'){
      reveal(k);
    }
  });

  function reveal(k){
    busy=true; phase='told';
    const f=FORTUNES[deal[k]];
    t_lift(k);
    if(f===null){
      noteText.textContent='(  )';
      noteReact.textContent='';
      cap.innerHTML=BLANKS[(Math.random()*BLANKS.length)|0];
    }else{
      noteText.textContent=f;
      noteReact.textContent='';
      cap.innerHTML='<em>OH.</em> okay okay hold on—';
      setTimeout(()=>{noteReact.textContent=REACTS[(Math.random()*REACTS.length)|0];},650);
    }
    setTimeout(()=>note.classList.add('show'),260);
    told++; toldEl.textContent=told;
    try{localStorage.setItem(KEY,String(told))}catch(e){}
  }
  function t_lift(k){
    const tri=inner.children[k];
    if(tri){tri.style.opacity='0'; tri.style.transform='translateZ(30px) scale(1.04)';}
  }

  again.addEventListener('click',()=>{
    note.classList.remove('show');
    for(const tri of inner.children){tri.style.opacity='';tri.style.transform='';}
    shuffle();
    setState('closed',false,'color');
    phase='color'; busy=false;
    cap.innerHTML='ha — okay, brand new fold, all shuffled up. <em>pick a color!</em>';
  });

  setState('closed',false,'color');
  // it's paper. it's true because paper doesn't lie. that's just how folding works.
  console.log('%cfolded at the far table. run it on a friend.','color:#3566c4;font-weight:700');
})();
</script>

<script src="/nav.js" defer></script>
