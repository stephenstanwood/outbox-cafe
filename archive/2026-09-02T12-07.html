  <meta name="outbox-spec-era" content="1953 — the classroom-apparatus years of the bubble raft. A shallow japanned metal tray of soap-and-glycerine solution on the demonstration bench of a technical institute physics room in Kingston, Ontario, with a 60-watt lamp on a stand hung over it, a hypodermic needle lying in the liquid at one corner, and a rubber bulb clamped to the bench feeding it at a set rate. Not a look-back at the golden age of demonstration physics, not a lament for anything, and not a memory: the bulb is running now, bubbles are arriving at about four a second, and the raft has already reached the far end of the tray.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the tray seen straight down at life size: a rectangle of soap solution filling the frame corner to corner, one lamp off the upper left throwing a single hard specular point onto every bubble, the needle tip breaking the surface at the lower left corner and putting up a steady stream of identical bubbles. Nothing else. No header, no menu, no scrollbar, no title, no caption, no counter, no legend, no instructions, no readable character anywhere at any time. It is a live two-dimensional packing simulation: several thousand equal bubbles floating shoulder to shoulder, pulled together by meniscus attraction and held apart by their own walls, arranging themselves into hexagonal patches that are visibly not all in the same orientation — so the tray is covered in real grains with real boundaries between them, real dislocations sitting inside the grains, and real holes where a bubble has burst. The visitor's whole vocabulary is a hand at a bench: drag slowly across the raft to shear it (the grains deform, dislocations glide along their close-packed rows and run out at the edge, and the raft is permanently a different shape than it was); press and hold anywhere to warm that patch, which lets boundaries move and lets big grains eat small ones; click once to burst a bubble and leave a hole that genuinely wanders; and drag the needle itself to blow the incoming stream in somewhere else. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The plain mechanical business of what a raft of equal-sized bubbles does when you crowd it, and specifically that a metal bends the way it does because of the mistakes in it and not because of the neatness in it — that bubbles a millimetre or two across floating on soap solution are pulled toward each other by the curvature of the liquid where it climbs their sides and pushed apart by their own films, which gives a real interatomic-style potential with a real equilibrium spacing, and equal-sized bubbles therefore pack six-around-one into a hexagonal lattice with no instruction from anybody; that the raft does NOT come out as one crystal, because bubbles arriving at different places start their own patches at their own arbitrary angles and those patches grow until they meet, so the tray fills with GRAINS and the mismatched seams between them are GRAIN BOUNDARIES, which are simply rows of bubbles that cannot satisfy both neighbours at once and sit slightly loose, slightly dark, and slightly off-spacing; that a boundary between two grains nearly aligned is a thin tidy row of isolated defects and a boundary between grains at a big angle is a wide messy band, so boundary energy is honestly a function of misorientation and can be seen to be one; that a DISLOCATION is the single most important object in the whole tray — an extra half-row of bubbles wedged in where it does not fit, showing up as one bubble with five neighbours sitting next to one with seven, with a visible fan of strained spacing around it — and it is not damage, it is the mechanism by which anything ever changes shape, because pushing a whole close-packed row past another all at once takes an enormous force and moving one dislocation one step at a time takes almost nothing, which is exactly why real metal is thousands of times weaker than its bonds say it should be; that shearing the raft therefore does not slide blocks, it makes dislocations GLIDE along the close-packed directions in little jerks, and each one that reaches the edge of the raft leaves a real step there and is gone; that this is why deformation is permanent — the raft does not spring back, and the steps at the edge are a running record of how much has gone through; that WORK HARDENING falls straight out of it, because dislocations moving on crossing rows run into each other, tangle, and jam, so the more the raft is sheared the harder it gets to shear further, and a heavily worked patch goes visibly strained and mottled and stops responding; that ANNEALING is the cure and it is only heat and time — warm the raft and boundaries become mobile, small grains shrink and vanish into big ones because a boundary's curvature drives it toward its own centre, tangles unpick, and a worked patch goes back to clean flat hexagons that will shear easily all over again; that a VACANCY, the hole left when a bubble bursts, is a real diffusing object that hops as neighbours fall into it, wanders through the lattice, and is finally swallowed at a boundary or an edge, and that vacancies are how anything moves through a solid at all; that an ODDLY SIZED bubble is an impurity atom and behaves like one — too big and it pushes its neighbours apart and carries a permanent strain field, too small and the lattice sags in around it, and either way the strain field attracts dislocations, pins them, and locally strengthens the raft, which is the entire principle of alloying sitting in a soap tray; that bubbles have a real lifetime and the film drains and thins from the top so the oldest bubbles in the tray are the ones that pop, and a raft left alone slowly develops holes and loosens; that the whole demonstration only works because the bubbles are the same size to within a few percent, which is a matter of a constant air pressure at the needle and nothing else, and a bulb squeezed unevenly puts a polydisperse mess on the surface that never orders at all.">
  <meta name="outbox-spec-tone" content="There is no written voice, no caption, no narrator and no text of any kind. The register lives entirely in the behaviour of the liquid, the bubbles and the lamp, and that register is BRISK, WET, BRIGHT, CROWDED and PLAINLY WORKADAY — bubbles arriving at a steady four a second with a small audible break of the surface each time, the raft shoving itself outward as it fills, patches snapping into register with a visible little collective jolt, boundaries jerking rather than gliding smoothly, bubbles popping at their own honest rate with a flat wet tick and leaving the raft to close up around them, the liquid surface visibly shivering when the bench is knocked. The lamp is hard, close and slightly too hot, throwing one sharp point on every bubble and a hard-edged shadow of the needle across the tray floor. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the incoming stream does not stop for anything. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT satisfying-video, NOT a screensaver, NOT stately, NOT precious, NOT fragile — this is a tray running on a bench with the bulb going and the raft already crowding the far end.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The tray is japanned sheet metal in a hard flat brown-black (#1b1a17), scratched to bare tin along the near lip (#9aa09b) and holding an old ring of dried soap residue a centimetre in from every edge (#6a6350). The liquid is soap-and-glycerine solution, slightly cloudy and slightly yellow, reading as a warm pale straw over the black (#d9cfa8) and going a shade deeper and greener where it is thickest at the meniscus against the tray wall (#b3ab7f). Against that, every bubble's rendered appearance is COMPUTED and never chosen: each is drawn from its actual radius and its actual position relative to the single lamp at the upper left, giving one hard small specular point (#fdfdfa), a broad soft transmitted brightening through the middle of the dome, and a dark contact rim whose thickness and darkness come from how many neighbours it is actually pressing against (#7c7563) — so a bubble with six tight neighbours is ringed all the way round and dark, a bubble at a grain boundary is ringed unevenly and visibly loose, and a bubble beside a vacancy has one bright open side. This means the grains, the boundaries and every dislocation in the tray are legible purely as a pattern of light and dark rims, with nothing marked, outlined, tinted or annotated. The strain field around an oversize bubble reads as a genuine local widening of the bright gaps. Exactly one chip of rubber-tubing vermilion (#a83224) is held strictly for the length of red rubber tube running from the bulb to the needle at the lower left corner of frame, and for nothing else on the page. Flat, hard, high contrast, no glow, no bloom, no soft focus, no iridescence, no rainbow film colour, no gradients other than honest specular, honest transmission and honest rim contact — soap and tin under one 60-watt lamp on a bench.">
  <meta name="outbox-spec-wildcard" content="One bubble in the tray is oversize — noticeably bigger than every other, put up by the first hard squeeze of the bulb before the pressure settled. It is present in the raft at load on every visit, always. It is treated by the engine exactly as physics treats it and in no other way: it cannot sit in the lattice, it holds a permanent strain field of widened gaps around itself, it catches and pins any dislocation that glides near it, and it works its way over time to a grain boundary and sits in it. It cannot be popped by clicking — the click lands, the neighbours jostle, and it is still there. Nothing on the page marks it, points at it, or accounts for it, and it does not behave strangely in any way; it is simply the wrong size, permanently, and everything around it has to arrange itself accordingly.">
  <meta name="outbox-spec-forbidden" content="NO bubble-raft-as-metaphor for anything — not society, not crowds, not individuals-in-a-mass, not conformity, not how communities form and fracture, not 'we are all just bubbles', not the-flaw-that-makes-it-strong, not the beauty of imperfection; these are equal-sized bubbles in a soap tray obeying a pairwise potential, and they have nothing to teach anybody. ABSOLUTELY NO fragility lyricism, NO ephemerality, NO 'and then it pops', NO memento mori, NO childhood-bubbles sentiment, NO wonder, NO awe. NO crystal or lattice mysticism: no sacred geometry, no hexagon reverence, no honeycomb-and-bees, no golden ratio, no nature's-perfect-packing, no mathematics-as-poetry, no order-out-of-chaos, no fractal or infinity framing, no sublime pattern reverie. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery, lava-lamp or screensaver framing whatsoever, and no 'let it calm you'. NO iridescence, NO rainbow film colour, NO oil-slick, NO holographic, NO opal, NO pastel dreamscape, NO soft-focus prettiness of any kind. NO great-men-of-science reverence: no Bragg, no Cavendish, no Royal Institution, no Nobel, no lone-genius-at-the-bench, no eureka, no history-of-physics essay, no 'the demonstration that changed metallurgy'. NO wartime or armaments framing of metals, NO steel-town or deindustrialisation drift, NO Rust Belt, NO labour sermon. NO teaching voice, NO classroom scene, NO chalk-and-blackboard nostalgia, NO 'a schoolboy could see it', NO textbook pedagogy — the page explains nothing to anybody because the page contains no words. NO nostalgia, NO wistfulness, NO 'nobody builds demonstration apparatus anymore / it's all simulations now' decline narrative — the bulb is running and the tray is filling. NO sensuous material writing about soap, glycerine or light beyond radius, spacing, contact, specular and rate. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the oversize bubble, the burst holes, or the raft that is already there when you arrive — nothing here is wrong. NO archival / museum / cabinet / drawer / specimen / relic framing of the apparatus. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is a bright cold afternoon with a hot lamp on the bench. NO signal / transmission / frequency / broadcast framing of any sound on the page. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the tray, the liquid, the bubbles, the needle and the lamp, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:crosshair;}

    background:radial-gradient(circle at 60% 40%, #d9cfa8 0 22%, transparent 23%);}

<body>
<canvas id="tray"></canvas>
<div id="archway" title=""><a href="/archive">.</a></div>
<script>
/* bulb pressure settles after the first squeeze. the first squeeze already happened. */
(function(){
"use strict";

var cv = document.getElementById('tray');
var ctx = cv.getContext('2d');
var W=0,H=0,DPR=1;

// ---------------------------------------------------------------- constants
var R0 = 9.2;                 // mean bubble radius, px at dpr 1
var SP = 2.02*R0;             // equilibrium spacing target
var K_REP = 0.62;             // film wall stiffness
var K_ATT = 0.115;            // meniscus pull
var LAM  = 0.62*R0;           // meniscus decay length
var CUT  = 3.35*R0;
var DAMP = 0.86;              // liquid drag
var DT   = 1.0;
var MAXN = 2600;

var LAMPX=-0.45, LAMPY=-0.62; // unit-ish direction of the lamp, upper left

// ---------------------------------------------------------------- state
var px=new Float32Array(MAXN), py=new Float32Array(MAXN),
    vx=new Float32Array(MAXN), vy=new Float32Array(MAXN),
    rr=new Float32Array(MAXN), age=new Float32Array(MAXN),
    life=new Float32Array(MAXN), coord=new Uint8Array(MAXN),
    rimD=new Float32Array(MAXN), moved=new Float32Array(MAXN);
var alive=new Uint8Array(MAXN);
var N=0;
var oversizeIdx=-1;

var needle={x:0,y:0};
var bulbPhase=0, pressure=1.0;
var heat=null, heatW=0, heatH=0, HCELL=26;
var frame=0, tSec=0;
var edgeSteps=[];             // permanent record of dislocations run out at the rim
var rearrangeCount=0, smoothRearrange=0;
var wallPush=0, smoothWall=0;

var pointer={down:false,x:0,y:0,px:0,py:0,t0:0,moved:0,draggingNeedle:false};

var LS='bubbleraft.kingston.1953.v3';

// ---------------------------------------------------------------- grid
var cellSize, gcols, grows, heads, nexts=new Int32Array(MAXN);

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = Math.max(320, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  cv.width = Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cellSize = CUT;
  gcols = Math.ceil(W/cellSize)+2; grows = Math.ceil(H/cellSize)+2;
  heads = new Int32Array(gcols*grows);
  heatW = Math.ceil(W/HCELL)+1; heatH=Math.ceil(H/HCELL)+1;
  var nh = new Float32Array(heatW*heatH);
  if(heat){ for(var i=0;i<Math.min(nh.length,heat.length);i++) nh[i]=heat[i]; }
  heat = nh;
}

function rebuild(){
  heads.fill(-1);
  for(var i=0;i<N;i++){
    if(!alive[i]) continue;
    var cx=(px[i]/cellSize|0)+1, cy=(py[i]/cellSize|0)+1;
    if(cx<0)cx=0; if(cy<0)cy=0; if(cx>=gcols)cx=gcols-1; if(cy>=grows)cy=grows-1;
    var c=cy*gcols+cx; nexts[i]=heads[c]; heads[c]=i;
  }
}

// ---------------------------------------------------------------- audio
var AC=null, master=null, bedGain=null, shuffleGain=null, shuffleSrc=null, shuffleFilt=null;
var humOsc=null;
function noiseBuffer(sec){
  var len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}
function initAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value=0.0; master.connect(AC.destination);
  master.gain.setTargetAtTime(0.82, AC.currentTime, 1.4);

  // lamp transformer hum, 60 Hz + a little third
  humOsc = AC.createOscillator(); humOsc.type='sawtooth'; humOsc.frequency.value=60;
  var hg=AC.createGain(); hg.gain.value=0.0075;
  var hf=AC.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=340;
  humOsc.connect(hf); hf.connect(hg); hg.connect(master); humOsc.start();

  // granular shuffling of bubbles rearranging
  shuffleSrc=AC.createBufferSource(); shuffleSrc.buffer=noiseBuffer(2.4); shuffleSrc.loop=true;
  shuffleFilt=AC.createBiquadFilter(); shuffleFilt.type='bandpass'; shuffleFilt.frequency.value=1400; shuffleFilt.Q.value=0.7;
  shuffleGain=AC.createGain(); shuffleGain.gain.value=0.0;
  shuffleSrc.connect(shuffleFilt); shuffleFilt.connect(shuffleGain); shuffleGain.connect(master);
  shuffleSrc.start();

  bedGain=AC.createGain(); bedGain.gain.value=0.85; bedGain.connect(master);
  scheduleRoom();
}
function env(node,g,a,d,peak){
  var t=AC.currentTime;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function sndArrive(radius){
  if(!AC) return;
  var t=AC.currentTime;
  var f = 900*(R0/radius);
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f*1.55,t);
  o.frequency.exponentialRampToValueAtTime(f*0.72,t+0.05);
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.05,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.1);
  // wet break of the surface
  var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.06);
  var bf=AC.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=f*2.1; bf.Q.value=1.6;
  var ng=AC.createGain(); ng.gain.setValueAtTime(0.03,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
  n.connect(bf); bf.connect(ng); ng.connect(master); n.start(t);
}
function sndPop(radius){
  if(!AC) return;
  var t=AC.currentTime;
  var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.05);
  var bf=AC.createBiquadFilter(); bf.type='highpass'; bf.frequency.value=1600;
  var g=AC.createGain(); g.gain.setValueAtTime(0.11,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.022);
  n.connect(bf); bf.connect(g); g.connect(master); n.start(t);
  // fluid slap after
  var o=AC.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(340*(R0/radius),t+0.014);
  o.frequency.exponentialRampToValueAtTime(150,t+0.09);
  var og=AC.createGain(); og.gain.setValueAtTime(0.0001,t+0.014);
  og.gain.exponentialRampToValueAtTime(0.036,t+0.02);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
  o.connect(og); og.connect(master); o.start(t+0.014); o.stop(t+0.13);
}
function sndChuff(){
  if(!AC) return;
  var t=AC.currentTime;
  var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.26);
  var bf=AC.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=420; bf.Q.value=0.8;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.030,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  n.connect(bf); bf.connect(g); g.connect(bedGain); n.start(t);
}
function sndSlosh(amt){
  if(!AC) return;
  var t=AC.currentTime;
  var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.7);
  var bf=AC.createBiquadFilter(); bf.type='lowpass'; bf.frequency.setValueAtTime(300,t);
  bf.frequency.exponentialRampToValueAtTime(120,t+0.55);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.min(0.1,0.03+amt*0.09),t+0.09);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.62);
  n.connect(bf); bf.connect(g); g.connect(master); n.start(t);
}
// room bed: radiator knocks, corridor footsteps, a heavy door on a closer
function scheduleRoom(){
  if(!AC) return;
  var t=AC.currentTime;
  function knock(when,f){
    var o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f,when);
    o.frequency.exponentialRampToValueAtTime(f*0.55,when+0.06);
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(0.05,when+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,when+0.16);
    o.connect(g); g.connect(bedGain); o.start(when); o.stop(when+0.2);
  }
  function step(when){
    var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.12);
    var bf=AC.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=210+Math.random()*130; bf.Q.value=1.1;
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(0.013+Math.random()*0.008,when+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,when+0.1);
    n.connect(bf); bf.connect(g); g.connect(bedGain); n.start(when);
  }
  function door(when){
    var n=AC.createBufferSource(); n.buffer=noiseBuffer(1.6);
    var bf=AC.createBiquadFilter(); bf.type='lowpass'; bf.frequency.setValueAtTime(700,when);
    bf.frequency.exponentialRampToValueAtTime(180,when+1.2);
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(0.010,when+0.4);
    g.gain.setValueAtTime(0.010,when+1.1);
    g.gain.exponentialRampToValueAtTime(0.0001,when+1.25);
    n.connect(bf); bf.connect(g); g.connect(bedGain); n.start(when);
    // the latch
    var k=AC.createOscillator(); k.type='square'; k.frequency.setValueAtTime(520,when+1.28);
    var kg=AC.createGain(); kg.gain.setValueAtTime(0.0001,when+1.28);
    kg.gain.exponentialRampToValueAtTime(0.045,when+1.29);
    kg.gain.exponentialRampToValueAtTime(0.0001,when+1.4);
    k.connect(kg); kg.connect(bedGain); k.start(when+1.28); k.stop(when+1.45);
  }
  var span=14;
  var now=t+0.3;
  // radiator: a run of knocks
  if(Math.random()<0.75){
    var k0=now+Math.random()*span, cnt=2+(Math.random()*4|0);
    for(var i=0;i<cnt;i++) knock(k0+i*(0.19+Math.random()*0.12), 150+Math.random()*90);
  }
  if(Math.random()<0.5){
    var s0=now+Math.random()*span, sn=5+(Math.random()*9|0), sp=0.42+Math.random()*0.12;
    for(var j=0;j<sn;j++) step(s0+j*sp);
  }
  if(Math.random()<0.28) door(now+Math.random()*span);
  setTimeout(scheduleRoom, span*1000);
}

// ---------------------------------------------------------------- creation
function addBubble(x,y,r,ageInit){
  if(N>=MAXN){
    // reuse a dead slot
    var slot=-1;
    for(var i=0;i<N;i++) if(!alive[i]){slot=i;break;}
    if(slot<0) return -1;
    setB(slot,x,y,r,ageInit); return slot;
  }
  var k=N++; setB(k,x,y,r,ageInit); return k;
}
function setB(k,x,y,r,ageInit){
  px[k]=x; py[k]=y; vx[k]=0; vy[k]=0; rr[k]=r; alive[k]=1;
  age[k]= ageInit||0;
  life[k]= 3600 + Math.random()*5400;   // frames; film drains from the top
  coord[k]=0; rimD[k]=0; moved[k]=0;
}
function reuseOrAdd(x,y,r){
  for(var i=0;i<N;i++) if(!alive[i]){ setB(i,x,y,r,0); return i; }
  return addBubble(x,y,r,0);
}

// ---------------------------------------------------------------- persistence
function save(){
  try{
    var xs=[],ys=[],rs=[],as=[];
    for(var i=0;i<N;i++){ if(!alive[i])continue;
      xs.push(Math.round(px[i]*10)/10); ys.push(Math.round(py[i]*10)/10);
      rs.push(Math.round(rr[i]*100)/100); as.push(Math.round(age[i]));
    }
    var o={w:W,h:H,x:xs,y:ys,r:rs,a:as,
           nx:Math.round(needle.x),ny:Math.round(needle.y),
           steps:edgeSteps.slice(-260),
           heat:0, ov:1};
    localStorage.setItem(LS, JSON.stringify(o));
  }catch(e){}
}
function load(){
  try{
    var s=localStorage.getItem(LS); if(!s) return false;
    var o=JSON.parse(s); if(!o||!o.x||!o.x.length) return false;
    var sx = W/(o.w||W), sy=H/(o.h||H);
    var sc = Math.min(sx,sy);
    N=0;
    for(var i=0;i<o.x.length && i<MAXN;i++){
      var X=o.x[i]*sx, Y=o.y[i]*sy;
      if(X<-40||X>W+40||Y<-40||Y>H+40) continue;
      addBubble(X,Y,o.r[i], o.a[i]||0);
    }
    needle.x = (o.nx!=null? o.nx*sx : W*0.085);
    needle.y = (o.ny!=null? o.ny*sy : H*0.905);
    if(o.steps) edgeSteps=o.steps.slice(0);
    // find the oversize one
    var mx=0, mi=-1;
    for(var j=0;j<N;j++) if(alive[j]&&rr[j]>mx){mx=rr[j];mi=j;}
    if(mi>=0 && mx > R0*1.22) oversizeIdx=mi;
    return N>40;
  }catch(e){ return false; }
}

// ---------------------------------------------------------------- seeding
function seed(){
  needle.x = W*0.085; needle.y = H*0.905;
  // nucleate a handful of patches at arbitrary angles and let them grow.
  // never a stored grid: they are laid down then relaxed by the potential alone.
  var target = Math.min(MAXN-260, Math.floor(W*H/(SP*SP*0.92)) );
  var seeds = 6 + (Math.random()*5|0);
  var cs=[];
  for(var s=0;s<seeds;s++){
    cs.push({x:0.1*W+Math.random()*0.8*W, y:0.1*H+Math.random()*0.8*H,
             th:Math.random()*Math.PI/3});
  }
  var placed=0, guard=0;
  var ax=SP, ay=SP*0.8660254;
  for(var s2=0; s2<seeds && placed<target; s2++){
    var c=cs[s2], ct=Math.cos(c.th), st=Math.sin(c.th);
    var rad=Math.ceil(Math.sqrt(target/seeds)/1.5)+8;
    for(var row=-rad; row<=rad && placed<target; row++){
      for(var col=-rad; col<=rad && placed<target; col++){
        var lx=col*ax + (row&1?ax*0.5:0), ly=row*ay;
        var X=c.x + lx*ct - ly*st, Y=c.y + lx*st + ly*ct;
        if(X<SP*0.6||X>W-SP*0.6||Y<SP*0.6||Y>H-SP*0.6) continue;
        // whichever seed claims it first
        var best=s2, bd=(X-c.x)*(X-c.x)+(Y-c.y)*(Y-c.y);
        var ok=true;
        for(var q=0;q<seeds;q++){ if(q===s2)continue;
          var d2=(X-cs[q].x)*(X-cs[q].x)+(Y-cs[q].y)*(Y-cs[q].y);
          if(d2<bd){ ok=false; break; }
        }
        if(!ok) continue;
        addBubble(X+(Math.random()-0.5)*1.1, Y+(Math.random()-0.5)*1.1,
                  R0*(0.985+Math.random()*0.03), Math.random()*1400);
        placed++;
      }
    }
    guard++;
  }
  // the first hard squeeze of the bulb, before the pressure settled.
  var oi=-1, bestd=1e18;
  var tx=W*0.42, ty=H*0.5;
  for(var i=0;i<N;i++){ if(!alive[i])continue;
    var d=(px[i]-tx)*(px[i]-tx)+(py[i]-ty)*(py[i]-ty);
    if(d<bestd){bestd=d;oi=i;}
  }
  if(oi>=0){ rr[oi]=R0*1.46; age[oi]=1e6; oversizeIdx=oi; }
  // a few holes already in it
  for(var h=0;h<5;h++){
    var k=(Math.random()*N)|0;
    if(alive[k] && k!==oversizeIdx) alive[k]=0;
  }
}

// ---------------------------------------------------------------- physics
function heatAt(x,y){
  var i=(x/HCELL)|0, j=(y/HCELL)|0;
  if(i<0||j<0||i>=heatW||j>=heatH) return 0;
  return heat[j*heatW+i];
}
function addHeat(x,y,amt,rad){
  var i0=Math.max(0,((x-rad)/HCELL)|0), i1=Math.min(heatW-1,((x+rad)/HCELL)|0);
  var j0=Math.max(0,((y-rad)/HCELL)|0), j1=Math.min(heatH-1,((y+rad)/HCELL)|0);
  for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){
    var dx=(i+0.5)*HCELL-x, dy=(j+0.5)*HCELL-y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<rad){ var f=1-d/rad; heat[j*heatW+i]=Math.min(1.6, heat[j*heatW+i]+amt*f*f); }
  }
}
function diffuseHeat(){
  // cheap: decay plus a little spread every few frames
  for(var i=0;i<heat.length;i++) heat[i]*=0.982;
  if((frame&3)===0){
    var nh=new Float32Array(heat.length);
    for(var j=0;j<heatH;j++)for(var i2=0;i2<heatW;i2++){
      var c=j*heatW+i2, s=heat[c]*4;
      s+= i2>0?heat[c-1]:heat[c];
      s+= i2<heatW-1?heat[c+1]:heat[c];
      s+= j>0?heat[c-heatW]:heat[c];
      s+= j<heatH-1?heat[c+heatW]:heat[c];
      nh[c]=s/8;
    }
    heat=nh;
  }
}

var contactBuf = new Int32Array(MAXN*7); // not used for identity, only counting

function step(){
  rebuild();
  var i,j,k,cx,cy,ci;
  rearrangeCount=0;
  var wallForce=0;

  for(i=0;i<N;i++){
    if(!alive[i]) continue;
    coord[i]=0; rimD[i]=0;
  }

  // pairwise
  for(i=0;i<N;i++){
    if(!alive[i]) continue;
    var xi=px[i], yi=py[i], ri=rr[i];
    var gcx=(xi/cellSize|0)+1, gcy=(yi/cellSize|0)+1;
    if(gcx<0)gcx=0; if(gcy<0)gcy=0; if(gcx>=gcols)gcx=gcols-1; if(gcy>=grows)gcy=grows-1;
    for(cy=gcy-1; cy<=gcy+1; cy++){
      if(cy<0||cy>=grows) continue;
      for(cx=gcx-1; cx<=gcx+1; cx++){
        if(cx<0||cx>=gcols) continue;
        for(j=heads[cy*gcols+cx]; j!==-1; j=nexts[j]){
          if(j<=i) continue;
          if(!alive[j]) continue;
          var dx=px[j]-xi, dy=py[j]-yi;
          var d2=dx*dx+dy*dy;
          if(d2>CUT*CUT || d2<1e-9) continue;
          var d=Math.sqrt(d2);
          var eq = (ri+rr[j])*1.005;      // equilibrium spacing from real radii
          var f=0;
          if(d<eq){
            // film wall repulsion, steep
            var o=(eq-d)/eq;
            f = -K_REP*(o + 6.5*o*o*o)*eq;
          }
          // meniscus attraction: liquid climbing the sides
          var s=(d-eq)/LAM;
          f += K_ATT*Math.exp(-s*s*0.34)* (d>eq? 1 : 1) * (d-eq>0? 1:0.55) * Math.min(1,eq/d) * eq * 0.55;
          // long tail so bubbles find the raft
          f += K_ATT*0.22*Math.exp(-(d-eq)/(LAM*2.6))*eq*0.35;

          var nxu=dx/d, nyu=dy/d;
          var fxv=f*nxu, fyv=f*nyu;
          vx[i]+=fxv; vy[i]+=fyv;
          vx[j]-=fxv; vy[j]-=fyv;

          if(d < eq*1.14){
            if(coord[i]<12) coord[i]++;
            if(coord[j]<12) coord[j]++;
            var tight = 1-Math.min(1,Math.abs(d-eq)/(eq*0.14));
            rimD[i]+=tight; rimD[j]+=tight;
          }
        }
      }
    }
  }

  // walls (meniscus against the tray wall) + thermal jitter + integrate
  var margin = SP*0.62;
  for(i=0;i<N;i++){
    if(!alive[i]) continue;
    var T = heatAt(px[i],py[i]);
    if(T>0.004){
      var jt = T*0.55;
      vx[i]+= (Math.random()-0.5)*jt;
      vy[i]+= (Math.random()-0.5)*jt;
    }
    var wf=0;
    if(px[i]<margin){ var e=(margin-px[i]); vx[i]+= e*0.10; wf+=e; }
    if(px[i]>W-margin){ var e2=(px[i]-(W-margin)); vx[i]-= e2*0.10; wf+=e2; }
    if(py[i]<margin){ var e3=(margin-py[i]); vy[i]+= e3*0.10; wf+=e3; }
    if(py[i]>H-margin){ var e4=(py[i]-(H-margin)); vy[i]-= e4*0.10; wf+=e4; }
    wallForce+=wf;

    var dmp = DAMP - Math.min(0.10, T*0.05);
    vx[i]*=dmp; vy[i]*=dmp;
    var sp2=vx[i]*vx[i]+vy[i]*vy[i];
    if(sp2>36){ var sc=6/Math.sqrt(sp2); vx[i]*=sc; vy[i]*=sc; }
    var ox=px[i], oy=py[i];
    px[i]+=vx[i]*DT; py[i]+=vy[i]*DT;
    var mv=Math.abs(px[i]-ox)+Math.abs(py[i]-oy);
    moved[i]=moved[i]*0.9+mv*0.1;
    if(mv>0.42) rearrangeCount++;
    // hard clamp inside the tray
    if(px[i]<2) {px[i]=2; vx[i]*=-0.2;}
    if(px[i]>W-2){px[i]=W-2; vx[i]*=-0.2;}
    if(py[i]<2) {py[i]=2; vy[i]*=-0.2;}
    if(py[i]>H-2){py[i]=H-2; vy[i]*=-0.2;}
    age[i]+=1;
  }

  wallPush = wallForce/Math.max(1,countAlive());
  if(wallPush>smoothWall+0.55 && frame%9===0){ sndSlosh(Math.min(1,(wallPush-smoothWall)/3)); }
  smoothWall = smoothWall*0.96+wallPush*0.04;
}

var _aliveCache=0,_aliveFrame=-1;
function countAlive(){
  if(_aliveFrame===frame) return _aliveCache;
  var c=0; for(var i=0;i<N;i++) if(alive[i])c++;
  _aliveCache=c; _aliveFrame=frame; return c;
}

// ---------------------------------------------------------------- stream
var arriveAcc=0;
function stream(){
  // bulb has a real clock; pressure wobbles a touch with the valve
  bulbPhase+=1/60;
  var per = 1.35;
  if(bulbPhase>per){ bulbPhase-=per; pressure = 0.97+Math.random()*0.06; sndChuff(); }
  var rate = 4.0*pressure;               // bubbles per second
  arriveAcc += rate/60;
  var full = countAlive() > Math.min(MAXN-30, (W*H)/(SP*SP*0.80));
  while(arriveAcc>=1){
    arriveAcc-=1;
    if(countAlive()>=MAXN-4) { crowdPop(); continue; }
    var jr = R0*(0.982 + (pressure-1)*0.5 + (Math.random()-0.5)*0.026);
    var ang = -Math.PI*0.5 + (Math.random()-0.5)*0.6;
    var nx = needle.x + Math.cos(ang)*R0*1.1;
    var ny = needle.y + Math.sin(ang)*R0*1.1;
    nx=Math.max(SP*0.6,Math.min(W-SP*0.6,nx));
    ny=Math.max(SP*0.6,Math.min(H-SP*0.6,ny));
    var k=reuseOrAdd(nx,ny,jr);
    if(k>=0){
      vx[k]=(Math.random()-0.5)*0.7; vy[k]=-0.55+(Math.random()-0.5)*0.4;
      sndArrive(jr);
    }
    if(full) crowdPop();
  }
}
function crowdPop(){
  // internal strain pops the oldest
  var best=-1, bo=-1;
  for(var t=0;t<24;t++){
    var i=(Math.random()*N)|0;
    if(!alive[i]||i===oversizeIdx) continue;
    if(age[i]>bo){bo=age[i];best=i;}
  }
  if(best>=0 && bo>900){ alive[best]=0; sndPop(rr[best]); }
}

// film drains from the top; the oldest go first
function aging(){
  if(frame%7) return;
  for(var t=0;t<8;t++){
    var i=(Math.random()*N)|0;
    if(!alive[i]||i===oversizeIdx) continue;
    if(age[i]>life[i]){
      // a warm patch thins faster
      alive[i]=0; sndPop(rr[i]); break;
    }
  }
}

// ---------------------------------------------------------------- edge steps
// a dislocation running out at the rim leaves a real step there.
function noteEdgeStep(x,y){
  edgeSteps.push([Math.round(x),Math.round(y),0]);
  if(edgeSteps.length>320) edgeSteps.shift();
}
var lastCoordScan=0;
function watchDislocations(){
  if(frame%10) return;
  // find 5-coordinated bubbles near the rim moving outward: they've run out.
  var m=SP*1.5;
  for(var i=0;i<N;i++){
    if(!alive[i])continue;
    if(coord[i]>=6) continue;
    var nearEdge = px[i]<m||px[i]>W-m||py[i]<m||py[i]>H-m;
    if(!nearEdge) continue;
    if(moved[i]>0.30 && Math.random()<0.10){
      var ex=Math.max(0,Math.min(W,px[i])), ey=Math.max(0,Math.min(H,py[i]));
      noteEdgeStep(ex,ey);
    }
  }
}

// ---------------------------------------------------------------- render
function render(){
  // tray floor: japanned sheet metal
  ctx.fillStyle='#1b1a17';
  ctx.fillRect(0,0,W,H);

  // the liquid, warm pale straw over the black
  ctx.fillStyle='#d9cfa8';
  ctx.fillRect(0,0,W,H);

  // deeper and greener at the meniscus against the wall
  var mw=Math.min(W,H)*0.055+10;
  var g1=ctx.createLinearGradient(0,0,mw,0);
  g1.addColorStop(0,'#b3ab7f'); g1.addColorStop(1,'rgba(179,171,127,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,mw,H);
  var g2=ctx.createLinearGradient(W,0,W-mw,0);
  g2.addColorStop(0,'#b3ab7f'); g2.addColorStop(1,'rgba(179,171,127,0)');
  ctx.fillStyle=g2; ctx.fillRect(W-mw,0,mw,H);
  var g3=ctx.createLinearGradient(0,0,0,mw);
  g3.addColorStop(0,'#b3ab7f'); g3.addColorStop(1,'rgba(179,171,127,0)');
  ctx.fillStyle=g3; ctx.fillRect(0,0,W,mw);
  var g4=ctx.createLinearGradient(0,H,0,H-mw);
  g4.addColorStop(0,'#b3ab7f'); g4.addColorStop(1,'rgba(179,171,127,0)');
  ctx.fillStyle=g4; ctx.fillRect(0,H-mw,W,mw);

  // dried soap residue, a centimetre in from every edge
  ctx.strokeStyle='rgba(106,99,80,0.55)'; ctx.lineWidth=2.4;
  ctx.setLineDash([9,5,3,6]);
  ctx.strokeRect(mw*0.62, mw*0.62, W-mw*1.24, H-mw*1.24);
  ctx.setLineDash([]);

  // scratched to bare tin along the near lip
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.strokeStyle='#9aa09b';
  for(var s=0;s<26;s++){
    var yy=H-4-((s*2.7)%13);
    var x0=(s*W/26)+((s*37)%23);
    ctx.lineWidth=(s%3===0)?1.6:0.8;
    ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+16+((s*53)%40),yy-1.5); ctx.stroke();
  }
  ctx.restore();

  // permanent steps worked into the rim of the raft
  ctx.save();
  for(var e=0;e<edgeSteps.length;e++){
    var st=edgeSteps[e];
    ctx.globalAlpha=0.13+0.10*(e/edgeSteps.length);
    ctx.fillStyle='#6a6350';
    ctx.fillRect(st[0]-R0*0.9, st[1]-1.4, R0*1.8, 2.8);
  }
  ctx.restore();

  // hard-edged shadow of the needle across the tray floor
  drawNeedleShadow();

  // ---- bubbles: every appearance computed from radius, position, contacts
  for(var i=0;i<N;i++){
    if(!alive[i]) continue;
    var x=px[i], y=py[i], r=rr[i];
    var c=coord[i], tight=Math.min(1, rimD[i]/6);

    // dark contact rim: thickness and darkness from how many neighbours it presses
    var rimA = 0.14 + 0.55*Math.min(1, c/6) * (0.45+0.55*tight);
    var rimW = 1.0 + 1.9*Math.min(1, c/6)*(0.4+0.6*tight);

    // dome body: transmitted brightening through the middle
    var lx = x + LAMPX*r*0.42, ly = y + LAMPY*r*0.42;
    var grd = ctx.createRadialGradient(lx,ly,r*0.06, x,y, r*1.02);
    grd.addColorStop(0,'#efe7c6');
    grd.addColorStop(0.42,'#e4d9b2');
    grd.addColorStop(0.80,'#cfc49c');
    grd.addColorStop(1,'#b9b089');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(x,y,r*0.99,0,6.2831853); ctx.fill();

    // contact rim
    ctx.strokeStyle='rgba(124,117,99,'+rimA.toFixed(3)+')';
    ctx.lineWidth=rimW;
    ctx.beginPath(); ctx.arc(x,y,r*0.94,0,6.2831853); ctx.stroke();

    // one hard small specular point from the single lamp
    var sx = x + LAMPX*r*0.60, sy = y + LAMPY*r*0.60;
    var sr = Math.max(0.75, r*0.155);
    ctx.fillStyle='#fdfdfa';
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,6.2831853); ctx.fill();
    // faint second bounce off the tray floor, low and dim
    ctx.fillStyle='rgba(217,207,168,0.55)';
    ctx.beginPath(); ctx.arc(x-LAMPX*r*0.48, y-LAMPY*r*0.44, sr*0.55,0,6.2831853); ctx.fill();
  }

  drawNeedle();
}

function drawNeedleShadow(){
  ctx.save();
  ctx.globalAlpha=0.30;
  ctx.fillStyle='#6a6350';
  ctx.translate(needle.x, needle.y);
  var ang = Math.atan2(needle.y-(-H*0.2), needle.x-(-W*0.2));
  ctx.rotate(ang);
  // shadow thrown down-right of the lamp at upper left
  ctx.translate(6,6);
  ctx.beginPath();
  ctx.moveTo(0,-2.4); ctx.lineTo(-Math.min(W,H)*0.55,-5.5);
  ctx.lineTo(-Math.min(W,H)*0.55,5.5); ctx.lineTo(0,2.4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawNeedle(){
  var ang = Math.atan2(needle.y-(-H*0.2), needle.x-(-W*0.2));
  ctx.save();
  ctx.translate(needle.x,needle.y);
  ctx.rotate(ang);
  // steel shaft
  var L=Math.min(W,H)*0.55;
  var lg=ctx.createLinearGradient(0,-3,0,3);
  lg.addColorStop(0,'#c3c8c2'); lg.addColorStop(0.4,'#9aa09b');
  lg.addColorStop(0.62,'#5e625d'); lg.addColorStop(1,'#3a3d39');
  ctx.fillStyle=lg;
  ctx.beginPath();
  ctx.moveTo(0.5,-1.5); ctx.lineTo(-L,-4.0); ctx.lineTo(-L,4.0); ctx.lineTo(0.5,1.5);
  ctx.closePath(); ctx.fill();
  // bevel at the tip
  ctx.fillStyle='#d5dad4';
  ctx.beginPath(); ctx.moveTo(0.5,-1.5); ctx.lineTo(-7,-2.4); ctx.lineTo(-7,-0.4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // the length of red rubber tube from the bulb — the only red on the page
  ctx.save();
  ctx.strokeStyle='#a83224';
  ctx.lineCap='round';
  var tx = needle.x + Math.cos(ang)*L*0.98, ty = needle.y + Math.sin(ang)*L*0.98;
  var wob = Math.sin(bulbPhase*4.6)*4;
  ctx.lineWidth=8.5;
  ctx.beginPath();
  ctx.moveTo(tx,ty);
  ctx.bezierCurveTo(tx+40+wob, ty+34, -30, H+50, -60, H+120);
  ctx.stroke();
  ctx.lineWidth=8.5;
  ctx.beginPath();
  ctx.moveTo(tx,ty);
  ctx.bezierCurveTo(tx-10, ty+60+wob, tx+70, H+30, tx+10, H+140);
  ctx.stroke();
  ctx.restore();

  // clamp collar
  ctx.save();
  ctx.fillStyle='#3a3d39';
  ctx.beginPath();
  ctx.arc(needle.x+Math.cos(ang)*L*0.55, needle.y+Math.sin(ang)*L*0.55, 6.5,0,6.2831853);
  ctx.fill();
  ctx.fillStyle='#9aa09b';
  ctx.beginPath();
  ctx.arc(needle.x+Math.cos(ang)*L*0.55-1.4, needle.y+Math.sin(ang)*L*0.55-1.4, 2.4,0,6.2831853);
  ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- input
function toLocal(ev){
  var r=cv.getBoundingClientRect();
  var t = (ev.touches && ev.touches[0]) || ev;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function onDown(ev){
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  var p=toLocal(ev);
  pointer.down=true; pointer.x=p.x; pointer.y=p.y; pointer.px=p.x; pointer.py=p.y;
  pointer.t0=performance.now(); pointer.moved=0;
  var dn=Math.hypot(p.x-needle.x,p.y-needle.y);
  pointer.draggingNeedle = dn < Math.max(34, R0*3.2);
  ev.preventDefault();
}
function onMove(ev){
  var p=toLocal(ev);
  if(!pointer.down){ pointer.x=p.x; pointer.y=p.y; return; }
  var dx=p.x-pointer.px, dy=p.y-pointer.py;
  pointer.moved += Math.abs(dx)+Math.abs(dy);
  pointer.px=pointer.x; pointer.py=pointer.y;
  pointer.x=p.x; pointer.y=p.y;

  if(pointer.draggingNeedle){
    needle.x=Math.max(6,Math.min(W-6,p.x));
    needle.y=Math.max(6,Math.min(H-6,p.y));
  } else {
    // a real velocity field applied to the bubbles under the hand
    var rad=Math.max(38, Math.min(W,H)*0.10);
    var r2=rad*rad;
    for(var i=0;i<N;i++){
      if(!alive[i])continue;
      var ddx=px[i]-p.x, ddy=py[i]-p.y;
      var d2=ddx*ddx+ddy*ddy;
      if(d2>r2) continue;
      var f=1-Math.sqrt(d2)/rad;
      f=f*f;
      vx[i]+=dx*f*0.34; vy[i]+=dy*f*0.34;
    }
  }
  ev.preventDefault();
}
function onUp(ev){
  if(pointer.down){
    var dur=performance.now()-pointer.t0;
    if(!pointer.draggingNeedle && pointer.moved<7 && dur<520){
      burstAt(pointer.x,pointer.y);
    }
  }
  pointer.down=false; pointer.draggingNeedle=false;
  if(ev) ev.preventDefault();
}
function burstAt(x,y){
  var best=-1,bd=1e18;
  for(var i=0;i<N;i++){
    if(!alive[i])continue;
    var d=(px[i]-x)*(px[i]-x)+(py[i]-y)*(py[i]-y);
    if(d<bd){bd=d;best=i;}
  }
  if(best<0) return;
  if(bd > (R0*3)*(R0*3)) return;
  if(best===oversizeIdx){
    // the click lands. the neighbours jostle. it is still there.
    for(var j=0;j<N;j++){
      if(!alive[j])continue;
      var dx=px[j]-px[best], dy=py[j]-py[best];
      var d2=dx*dx+dy*dy;
      if(d2<(SP*2.6)*(SP*2.6) && d2>1e-6){
        var d=Math.sqrt(d2), f=(1-d/(SP*2.6))*1.5;
        vx[j]+=dx/d*f; vy[j]+=dy/d*f;
      }
    }
    if(AC){
      var t=AC.currentTime;
      var n=AC.createBufferSource(); n.buffer=noiseBuffer(0.08);
      var bf=AC.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=520;
      var g=AC.createGain(); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      n.connect(bf); bf.connect(g); g.connect(master); n.start(t);
    }
    return;
  }
  alive[best]=0;
  sndPop(rr[best]);
}

cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove,{passive:false});
window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp,{passive:false});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',function(){ resize(); });

// press and hold anywhere warms that patch
function holdHeat(){
  if(pointer.down && !pointer.draggingNeedle){
    var dur=performance.now()-pointer.t0;
    if(dur>220 && pointer.moved<Math.max(40, dur*0.06)){
      addHeat(pointer.x, pointer.y, 0.048, Math.max(46, Math.min(W,H)*0.12));
    }
  }
}

// ---------------------------------------------------------------- loop
function loop(){
  frame++;
  tSec=frame/60;
  holdHeat();
  stream();
  step();
  aging();
  watchDislocations();
  diffuseHeat();
  render();

  // shuffling sound tracks the number of bubbles genuinely rearranging
  if(shuffleGain){
    smoothRearrange = smoothRearrange*0.90 + rearrangeCount*0.10;
    var n = Math.min(1, smoothRearrange/70);
    shuffleGain.gain.value = 0.0006 + n*0.052;
    shuffleFilt.frequency.value = 700 + n*3600;
    shuffleFilt.Q.value = 0.6 + (1-n)*1.6;
  }

  if(frame%420===0) save();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- boot
resize();
if(!load()) seed();
// make sure the oversize bubble is present in the raft at load, on every visit, always.
(function ensureOversize(){
  var mx=0,mi=-1;
  for(var i=0;i<N;i++){ if(!alive[i])continue; if(rr[i]>mx){mx=rr[i];mi=i;} }
  if(mi<0 || mx < R0*1.22){
    // pick one nearer the middle and make it the wrong size
    var tx=W*0.45,ty=H*0.48,bd=1e18,b=-1;
    for(var j=0;j<N;j++){ if(!alive[j])continue;
      var d=(px[j]-tx)*(px[j]-tx)+(py[j]-ty)*(py[j]-ty); if(d<bd){bd=d;b=j;} }
    if(b<0) b=addBubble(tx,ty,R0*1.46,1e6);
    rr[b]=R0*1.46; alive[b]=1; oversizeIdx=b;
  } else oversizeIdx=mi;
})();
// settle for a moment before the first frame so nothing arrives on top of itself
for(var w=0; w<12; w++){ step(); }
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });
requestAnimationFrame(loop);

})();
</script>
