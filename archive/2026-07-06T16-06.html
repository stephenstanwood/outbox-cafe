  <meta name="outbox-spec-era" content="1972 — the warm groovy heyday of the liquid-motion novelty lamp glowing on a bedsit shelf in a dim room, the astronaut-age fascination with a blob of wax that never holds a shape; a lamp plugged in and running RIGHT NOW, the bulb humming, the wax just come up to heat, not a thrift-store find and not a nostalgia object but a lamp on and lava-ing this minute in a darkened room.">
  <meta name="outbox-spec-format" content="The entire viewport IS the tall glass flask of a single liquid-motion lamp seen dead-on in a dark room, edge to edge, filled with a live generative metaball fluid: a dozen fat globs of glowing wax that genuinely heat, swell, tear free of the molten pool at the base, drift upward through the colored liquid, flatten and cool and sink at the top, merge into each other when they touch and pinch apart when they stretch too thin — a real continuous buoyancy-and-surface-tension simulation, never scripted, never repeating, computed every frame. A soft warm glow pools at the base where the bulb sits; the wax catches the light brightest at its rounded tops. No chrome, no captions, no header, no controls, no text anywhere — just the glass and the endlessly climbing, merging, falling wax.">
  <meta name="outbox-spec-subject" content="The plain hypnotic physical fact of the wax in a liquid-motion lamp: how a warmed glob at the bottom grows just buoyant enough to neck off the molten pool and lift, wobbling, up through the clear liquid; how two rising blobs nose into each other and fuse into one lazy amoeba; how a big one at the top cools, gets heavy, sags, and pours slowly back down the glass wall to remelt into the pool; the constant unhurried birth-rise-merge-cool-fall of it. Not a metaphor for anything, not a mood-lamp to meditate by, not a symbol of the slow life — literally heated wax and a slightly-lighter liquid trading places forever, and the fat wobbling shapes that fall out of the physics.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page — the tone is purely the wordless warm delight of sitting in a dark room watching the wax climb: greedy to see which two blobs will kiss and merge, tickled when a fat one finally tears loose of the base and wobbles up, satisfied when a heavy one sags back down the glass. The motion is treated as a plain physical pleasure and a genuine visual warmth — not reverent, not hushed, not precious, not solemn, not a slow-down-and-breathe register. The closest thing to a voice is the wax's own patient refusal to ever hold the same shape for even a second.">

<title>Warm Enough to Climb</title>
<!-- the bulb's been on maybe twenty minutes. the wax is just now loose enough to go. rest a fingertip low on the glass and shove a column up if you're impatient. tap space and the pool throws a whole handful. -->
<style>
  html,body{margin:0;height:100%;background:#0d0518;overflow:hidden;}
  #glass{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair;}
  /* faint reflection down the curved face of the flask */
  #sheen{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(105deg,
      rgba(122,75,176,0.10) 0%,
      rgba(122,75,176,0.0) 14%,
      rgba(0,0,0,0) 70%,
      rgba(255,178,74,0.06) 100%);
    mix-blend-mode:screen;}
  /* barely-there vignette so the liquid pools to near-black at the rim */
  #rim{position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 min(22vw,180px) min(6vw,50px) rgba(11,4,20,0.9);}
  a#shelf{position:fixed;right:14px;bottom:12px;z-index:5;
    color:#ffb24a;font:400 13px/1 serif;text-decoration:none;
    opacity:0.12;transition:opacity .5s;letter-spacing:.1em;}
  a#shelf:hover,a#shelf:focus{opacity:0.62;}
</style>
</head>
<body>
<canvas id="glass"></canvas>
<div id="sheen"></div>
<div id="rim"></div>
<a id="shelf" href="/archive" aria-label="the rest of the shelf" title="the rest of the shelf">◦</a>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('glass');
  const ctx = cv.getContext('2d');

  // --- offscreen field buffer (blobs are computed here, small, then scaled up) ---
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  let FW = 180, FH = 300;      // field resolution (recomputed on resize to hold aspect)
  let field = new Float32Array(FW*FH);
  let img = octx.createImageData(FW,FH);
  let dat = img.data;

  // --- the wax ---
  const N = 16;
  const bx=new Float32Array(N), by=new Float32Array(N),
        vx=new Float32Array(N), vy=new Float32Array(N),
        br=new Float32Array(N), br2=new Float32Array(N),
        tp=new Float32Array(N);
  for(let k=0;k<N;k++){
    bx[k]=FW*(0.2+0.6*Math.random());
    by[k]=FH*(0.72+0.26*Math.random());
    vx[k]=(Math.random()-0.5)*4;
    vy[k]=0;
    br[k]=15+Math.random()*13;
    br2[k]=br[k]*br[k];
    tp[k]=0.6+Math.random()*0.8;
  }

  // molten pool that sits over the bulb; risers neck off of it
  const POOL_AMT=1.55, POOL_H=20;
  const TE=1.3;                 // wax threshold

  // physics constants (field-units / second)
  const G=140, BUOY=90;

  // input state
  let curX=-999, curY=-999, curOn=false;
  let burst=0;                  // spacebar heat burst timer
  let runT=0, runNext=0;        // the run-away column
  let last=performance.now(), t0=performance.now();

  function resize(){
    const w=window.innerWidth, h=window.innerHeight;
    cv.width=w; cv.height=h;
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    // hold roundness: match field aspect to the viewport
    const nfw=Math.max(120,Math.min(520,Math.round(FH*w/h)));
    if(nfw!==FW){
      const r=nfw/FW;
      for(let k=0;k<N;k++) bx[k]*=r;
      FW=nfw;
      field=new Float32Array(FW*FH);
      off.width=FW; off.height=FH;
      img=octx.createImageData(FW,FH); dat=img.data;
    }
  }
  off.width=FW; off.height=FH;

  function pointer(x,y){
    const r=cv.getBoundingClientRect();
    curX=(x-r.left)/r.width*FW;
    curY=(y-r.top)/r.height*FH;
    curOn=true;
  }
  cv.addEventListener('pointermove',e=>{pointer(e.clientX,e.clientY);},{passive:true});
  cv.addEventListener('pointerdown',e=>{pointer(e.clientX,e.clientY);},{passive:true});
  cv.addEventListener('pointerleave',()=>{curOn=false;});
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.key===' '){ e.preventDefault(); burst=1.1; }
  });
  window.addEventListener('resize',resize);
  window.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});

  function step(dt){
    const cx=FW*0.5;

    // maybe the lamp runs away — rare, unannounced
    if(runT<=0){
      runNext-=dt;
      if(runNext<=0 && Math.random()<0.00016*60*dt*60){ /*noop shape*/ }
      if(Math.random()<1.6e-4){ runT=4+Math.random()*2.5; }
    } else {
      runT-=dt;
    }
    const running = runT>0;

    // pair forces: kiss in mid-range, ease apart when crushed
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        let dx=bx[j]-bx[i], dy=by[j]-by[i];
        let d2=dx*dx+dy*dy; if(d2<1)d2=1;
        const d=Math.sqrt(d2);
        const reach=(br[i]+br[j]);
        const nx=dx/d, ny=dy/d;
        if(d<reach*0.7){                       // too close — pinch apart
          const f=(reach*0.7-d)*6.0*dt;
          vx[i]-=nx*f; vy[i]-=ny*f; vx[j]+=nx*f; vy[j]+=ny*f;
        } else if(d<reach*1.45){               // surface tension — nose together
          const f=1.4*dt;
          vx[i]+=nx*f; vy[i]+=ny*f; vx[j]-=nx*f; vy[j]-=ny*f;
        }
      }
    }

    for(let k=0;k<N;k++){
      const dyb=FH-1-by[k];                     // height above the base
      // heat from the bulb, strongest right at the pool
      let baseHeat=2.6*(1+burst*3.2);
      if(dyb<FH*0.26){ tp[k]+=baseHeat*(1-dyb/(FH*0.26))*dt; }
      // the higher it drifts, the faster it gives up its heat
      const cool=0.25+1.4*(by[k]/FH<1?(1-by[k]/FH):0)+0.0;
      const coolRate=0.25+1.35*(1-by[k]/FH);
      tp[k]-=tp[k]*coolRate*dt;

      // cursor is a warm spot on the glass: nearby wax heats and gathers
      if(curOn){
        const dx=curX-bx[k], dy=curY-by[k];
        const dd=Math.sqrt(dx*dx+dy*dy);
        const R=62;
        if(dd<R){
          const fall=1-dd/R;
          tp[k]+=4.2*fall*fall*dt;
          vx[k]+=dx*2.2*fall*dt;
          vy[k]+=dy*1.6*fall*dt;
        }
      }

      // run-away: everything crowds the centreline and lifts as one column
      if(running){
        tp[k]+=3.0*dt;
        vx[k]+=(cx-bx[k])*3.2*dt;
        vy[k]-=tp[k]*42*dt;
      }

      // buoyancy vs. gravity
      vy[k]-=tp[k]*BUOY*dt;
      vy[k]+=G*dt;
      // a little wobble so nothing rises dead straight
      vx[k]+=(Math.random()-0.5)*26*dt;
      // soft walls
      const m=br[k]*0.6;
      if(bx[k]<m) vx[k]+=(m-bx[k])*10*dt;
      if(bx[k]>FW-m) vx[k]-=(bx[k]-(FW-m))*10*dt;

      vx[k]*=0.94; vy[k]*=0.985;
      bx[k]+=vx[k]*dt; by[k]+=vy[k]*dt;

      // stay inside the flask
      if(by[k]>FH-4){ by[k]=FH-4; vy[k]*=-0.2; }
      if(by[k]<6){ by[k]=6; vy[k]*=-0.3; }
      if(bx[k]<2){bx[k]=2;} if(bx[k]>FW-2){bx[k]=FW-2;}
    }
    if(burst>0) burst-=dt*1.4; if(burst<0)burst=0;
  }

  // --- rendering ---
  function lerp(a,b,t){return a+(b-a)*t;}
  function clamp01(v){return v<0?0:v>1?1:v;}

  // palette
  const TAN_R=0xd8, TAN_G=0x54, TAN_B=0x16;   // deep tangerine (cool wax)
  const HOT_R=0xff, HOT_G=0xd6, HOT_B=0x9a;   // near-white lit top
  const GRP_R=0x2e, GRP_G=0x0f, GRP_B=0x47;   // grape liquid
  const DRK_R=0x16, DRK_G=0x07, DRK_B=0x22;   // near-black rim
  const AMB_R=0xff, AMB_G=0xb2, AMB_B=0x4a;   // bulb glow
  const VIO_R=0x7a, VIO_G=0x4b, VIO_B=0xb0;   // backlit rim

  function draw(){
    const cx=FW*0.5, icx=1/cx;
    // pass 1 — metaball field (blobs + the pool over the bulb)
    for(let y=0;y<FH;y++){
      const dyb=FH-1-y;
      const pool=POOL_AMT*Math.exp(-(dyb*dyb)/(POOL_H*POOL_H));
      const row=y*FW;
      for(let x=0;x<FW;x++){
        let f=pool;
        for(let k=0;k<N;k++){
          const dx=x-bx[k], dy=y-by[k];
          f+=br2[k]/(dx*dx+dy*dy+4);
        }
        field[row+x]=f;
      }
    }
    // pass 2 — colour it: purple liquid, amber bulb bloom, glowing tangerine wax
    let p=0;
    for(let y=0;y<FH;y++){
      const dyb=FH-1-y, bn=dyb/FH;
      const row=y*FW;
      for(let x=0;x<FW;x++){
        const i=row+x, f=field[i];
        // liquid + rim vignette
        const ex=1-Math.abs(x-cx)*icx;          // 1 centre → 0 edge
        const bgt=ex*0.75;
        let r=lerp(DRK_R,GRP_R,bgt),
            g=lerp(DRK_G,GRP_G,bgt),
            b=lerp(DRK_B,GRP_B,bgt);
        // warm bulb glow blooming from the base
        const gdx=(x-cx)*icx;
        let glow=1-(bn*2.0); if(glow<0)glow=0;
        glow*= (1-Math.abs(gdx)*0.85); if(glow<0)glow=0;
        glow=glow*glow*0.85;
        r+=(AMB_R-r)*glow; g+=(AMB_G-g)*glow; b+=(AMB_B-b)*glow;
        // soft halo of wax-light leaking into the liquid
        const halo=clamp01(f/TE)*0.22;
        r+=(255-r)*halo*0.55; g+=(0x9a-g<0?0:(0x9a-g))*halo*0.4; b+=(0x33-b<0?0:0)*halo;

        // the wax itself
        const wa=(function(){const t=clamp01((f-TE*0.9)/(TE*0.25));return t*t*(3-2*t);})();
        if(wa>0.002){
          // neighbours → surface direction (for the lit top)
          const gy=(y>0&&y<FH-1)?(field[i+FW]-field[i-FW]):0;
          let hl=gy*0.85; hl=hl<0?0:hl>1?1:hl;
          const ci=clamp01((f-TE)/(TE*1.6));
          let wr=lerp(TAN_R,HOT_R,ci),
              wg=lerp(TAN_G,HOT_G,ci),
              wb=lerp(TAN_B,HOT_B,ci);
          // rounded tops catch the light brightest
          wr=lerp(wr,255,hl*0.7); wg=lerp(wg,HOT_G,hl*0.7); wb=lerp(wb,HOT_B,hl*0.7);
          // one cool violet rim where the glass backlights the edge
          let rim=(1-ci); rim=rim*rim*0.28;
          wr=lerp(wr,VIO_R,rim); wg=lerp(wg,VIO_G,rim); wb=lerp(wb,VIO_B,rim);
          r=lerp(r,wr,wa); g=lerp(g,wg,wa); b=lerp(b,wb,wa);
        }
        dat[p]=r; dat[p+1]=g; dat[p+2]=b; dat[p+3]=255;
        p+=4;
      }
    }
    octx.putImageData(img,0,0);
    // scale the small field up across the whole flask (smoothing melts the pixels)
    ctx.drawImage(off,0,0,FW,FH,0,0,cv.width,cv.height);
  }

  function frame(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05)dt=0.05; if(dt<=0)dt=0.016;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  console.log("%cwarm enough to climb. watch which two kiss.","color:#ff7a2c;font:14px serif;");
  requestAnimationFrame(frame);
})();
</script>
