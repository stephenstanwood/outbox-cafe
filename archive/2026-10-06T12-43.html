  <meta name="outbox-spec-era" content="The third morning of the international kite festival, April 1994, about ten past nine, at a family kite stall in the covered lane behind the festival field in Weifang, Shandong. The back wall of the stall is a floor-to-ceiling pegboard of hand-painted silk-and-bamboo kites hung three deep. Every kite has a hand-lettered card tag on a red string. Foreign teams with team jackets and kit bags are drifting through the lane looking for spares before the noon heats. Outside the awning the wind is a gusty south-westerly that keeps lifting the tags and slapping them against the bamboo. A competitor's loudspeaker two stalls down is announcing nothing anyone can make out.">
  <meta name="outbox-spec-format" content="A BROWSEABLE STALL WALL. The page is the pegboard itself, shown straight on at true size and wider than the screen, so the visitor pans across it by dragging or with the arrow keys. About forty kites hang on it: swallows, butterflies, goldfish, hawks, a dragon-head, box kites, a pair of mandarin ducks, and a tiny palm-sized kite pinned among the big ones. Clicking a kite lifts it off its peg and turns it over to show the back of its tag: name, wingspan, wind range, the maker's mark, a price in yuan scratched out and rewritten, and a hand-rated scorecard. Every tag can be returned to its peg, and the wall can also be browsed by a little row of string-tied category cards hanging along the top: BIRDS / INSECTS / FISH / HARD-WING / SOFT / LONG ONES / NOT FOR SALE.">
  <meta name="outbox-spec-subject" content="The stall's whole stock, rated kite by kite by the person who actually test-flies every one of them on the field before breakfast. Each tag is a frank, partisan verdict: which swallow climbs like it is late for something, which butterfly sulks in anything under force three, which hawk is gorgeous and pulls left 'because Uncle painted the left wing heavier and will not admit it', which goldfish has won a prize two years running, and which box kite a German team bought last festival and came back to complain about and then bought a second one. There are running rivalries between kites on the wall ('the blue swallow is NOT better than the red swallow, whatever the blue swallow's tag says'). There are notes on what each kite has done on the field: tangled with a Dutch team's train, sat at 200 metres through a whole lunch break, came down in the reservoir once and was fine. Taken together, the wall is a live leaderboard written by one very opinionated flyer.">
  <meta name="outbox-spec-tone" content="The brash, sporty, fiercely loyal pundit-voice of Wang Lifen, 16, the maker's granddaughter, who has flown every kite on the wall and writes the tags in two languages in thick marker. She writes like a sports columnist calling a season. She gives ratings out of five little swallow stamps, and adds bold verdicts ('CHAMPION. Do not argue.'), rivalry trash talk aimed at kites rather than people, and sudden demotions with dates ('was 5 swallows until Tuesday. Now 4. It knows what it did.'). She makes recommendations straight at the buyer ('You are a beginner? Take the fat goldfish. The fat goldfish forgives everything.'). She also bickers in the margins with her grandfather, whose rare corrections appear in small neat brush characters and who she always overrules. She is cocky, generous, funny and never mean. She is entirely sincere about which kite is best.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Kite-silk cinnabar red (#d7261e) for every tag string, rating stamp, marker verdict and the painted bodies of the kites, on split-bamboo and mulberry-paper straw (#ecd9a4) for the pegboard, the tags and the kite frames showing through translucent silk. Grandfather's brush notes are the cinnabar pushed nearly to lacquer-black (#3a0d0a). Painted colours inside the kites appear only as tints of these two, deepened where silk overlaps silk. Sunlight coming through the silk is allowed to glow.">
  <meta name="outbox-spec-wildcard" content="The centipede dragon kite is too long for the wall: its head hangs at the far left and its body of roughly ninety linked discs runs off the right edge of the pegboard and keeps going, coiled along the lane outside. Panning right follows it disc after disc, past the stall, past the neighbour's tea urn, and around a corner, and there are little tags on random discs along the way ('still going', 'yes, still', 'Grandpa says 182 metres, I say 190'). Its main tag reads NOT FOR SALE, NOT FOR SALE, NOT FOR SALE. The keyboard shortcut END jumps straight to the tail, where there is one final tag nobody would see otherwise.">
  <meta name="outbox-spec-forbidden" content="NO kite-as-metaphor for anything: not freedom, not letting go, not dreams, not the string that holds us, not soaring spirit. NO China travelogue and NO explaining Weifang, Shandong or Chinese kite tradition to anybody. No Chinese words sprinkled for flavour, no dragons-and-lanterns exotica, no ancient-wisdom register, no 'thousands of years of craft' reverence. NO mocking or cutesy broken-English humour on the bilingual tags: Lifen's English is confident and plain. NO 1994-as-period-signifier, no reform-era subtext, no political hindsight, no nostalgia. NO craftsman-sage grandfather, no dying-art lament, no master-and-apprentice arc, no heritage framing. NO 'flat arithmetic of X' tradesperson voice: no figure-reciting, no revised counts, no single grievance and single point of pride. NO physics-engine solemnity or 'computed and never chosen' rigour-as-aesthetic. NO dry deadpan, NO lowercase fragments, NO hushed or meditative sky-gazing, and NO archival, museum or cabinet framing of the wall. This is stock, and the noon heats start in three hours.">
