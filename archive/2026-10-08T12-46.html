  <meta name="outbox-spec-era" content="A hot, windless Sunday mid-morning in late February 1993, about a quarter past ten, at a roadside farm stall made of corrugated iron and gum poles beside a long straight national road in the Karoo. The counter is a trestle table under a shade-cloth awning, crowded with jars of preserves in rows, a tray of rusks wrapped in cling film, a bag of dried peaches and a Bakers biscuit tin with a slot cut in the lid for money. There is nobody behind the counter. A hand-painted board says PAY IN THE TIN, WE TRUST YOU, THE DOG DOES NOT. A windpump is creaking in the paddock behind. Every few minutes a lorry goes past at a hundred and ten and the whole awning lifts and drops, and the jars clink against each other.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE JAR, seen head-on at true size, and the page is nothing but the label on it. The label is a strip of paper wrapped round a glass cylinder, so the writing curves away and foreshortens at both edges. The visitor reads by turning the jar, never by scrolling. The strangeness is that the label never stops: the maker ran out of room and kept going, so the handwriting spirals down the jar in a helix, overlaps its own beginning, climbs onto the gingham lid cover, runs round the rubber band and finishes underneath on the base. To read it all, the visitor has to rotate the jar round and round and tip it upside down. There is no header, no title, no menu and no page outside the jar.">
  <meta name="outbox-spec-subject" content="One jar of whole green-fig preserve, batch of eleven, made this week. The label began as an ordinary label (GREEN FIG PRESERVE, 1993, R6.50) and then turned into everything the maker thought a buyer ought to know. That includes the ingredients, which keep getting longer with afterthoughts ('figs, sugar, lemon, ginger, a clove, ANOTHER clove because the first one sank'). It covers four serving suggestions that escalate from 'with cheese' to 'with cheese AND on the cheese', a full account of the stall's agricultural-show second place last year with a firm opinion about first place, and instructions for opening the lid that should not be necessary but are. There are also notes on the figs from the tree by the dam, which 'tried to drop early and was told no', a section headed WHAT TO DO IF YOU ARE A LORRY DRIVER, a postscript about the dog, and a second postscript about a different dog.">
  <meta name="outbox-spec-tone" content="The exuberant, bossy, wildly digressive fountain-pen voice of Mrs. Ronel Pieterse-Mabuza, 63, who makes every jar on the table and cannot write a label without writing a letter. She underlines whole sentences twice and uses CAPITALS for anything she feels strongly about, which is most things. She addresses the buyer as 'Dear Traveller', and she starts new thoughts mid-line with 'ALSO,' or 'Furthermore!'. She answers objections nobody has raised ('Yes it is worth six rand fifty. Taste it and then talk to me.'), and she is enormously, sincerely confident that this is the best fig preserve on the road. Her handwriting gets smaller and more crammed as space runs out, then large again on the lid where she found fresh room, with an audible sense of relief ('AH. Space.'). She is warm, funny and generous, and she is never wistful, never sly and never wise.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Felt-tip fig green (#3d7a2a), the one pen she had on the kitchen table, used for every word, underline, arrow and doodled fig, on brown kraft-paper label stock (#c9a26b) with real paper tooth. The ink feathers into the fibres where she pressed hard and goes pale and streaky where the pen was drying out near the base. The glass, the syrup and the figs seen through gaps in the label are only these two colours deepened together, so the syrup reads as a dark translucent olive-amber and the figs as dense green-brown shapes. The gingham lid cover is the green checked over the kraft. Sun through the jar may throw one honest bright caustic of the kraft colour onto the table. No other hues.">
  <meta name="outbox-spec-wildcard" content="A small ladybird is walking across the label at its own slow pace, in jar-space, so it travels with the paper when the jar turns and can be lost round the back. Wherever it is on the helix, it is always walking toward the next occurrence of the word PERFECT, and it stops on that word when it arrives, then sets off for the next one. Halfway down the jar, one sentence has been crossed out and rewritten above itself in different, neater ink by somebody else: 'Gran, they do not need to know about the dog TWICE.' Ronel has drawn an arrow back to it and written 'They do.' Nothing explains either.">
  <meta name="outbox-spec-forbidden" content="NO South Africa travelogue and NO explaining the Karoo, farm stalls or South Africans to anybody. No Afrikaans or isiXhosa words sprinkled for flavour beyond names, no dialect spelling, and no 1993 political subtext, transition-era hindsight, land question or reconciliation framing. NO grandmother's-kitchen nostalgia, no 'remember when', and no preserving-as-metaphor for memory, time, love, keeping things or bottling summer. NO artisanal, small-batch, foodie, farmers-market-Instagram or slow-food register, and no lush food writing about fruit and syrup beyond what Ronel herself says. NO open-road, lonely-highway, desert-emptiness or road-movie lyricism, NO heat-shimmer dread and no liminal-roadside register. NO honesty-box-as-metaphor for trust or human goodness. NO archival, museum, found-ephemera or collectible framing of the jar: it is for sale and costs six rand fifty. NO 'flat arithmetic of X' tradesperson voice, NO physics-engine solemnity or 'computed and never chosen' rigour-as-aesthetic, NO dry deadpan, NO lowercase fragments and NO meta-joke about the page's own shape. A lorry is coming and the dog is asleep.">

<style>

<body>
<canvas id="c" role="img" aria-label="A jar of green fig preserve with a very long handwritten label. Drag to turn it, tilt it to see the lid and the base."></canvas>
<div class="sr" id="sr"></div>
<footer>Turn the jar: drag, scroll or arrow keys. Double-tap to stand it up. &middot; <a href="/archive">more jars from the stall</a></footer>
<script>
(function(){
'use strict';
var KR='#c9a26b',GR='#3d7a2a',TAU=Math.PI*2;
var FF='"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS",cursive';

var BODY="GREEN FIG PRESERVE. 1993. R6.50. _WHOLE FIGS!_ Dear Traveller, this was a label and then I had OPINIONS. Batch of eleven, made THIS WEEK, so you hold the freshest jar on the road. INGREDIENTS: figs, sugar, lemon, ginger, a clove, ANOTHER clove because the first one sank. ALSO, a third clove, because I stopped trusting the second. Furthermore! The figs are from the tree by the dam, which tried to drop early and was told NO. SERVING: 1. With cheese. 2. With cheese AND bread. 3. On the cheese. 4. With cheese AND on the cheese AND from a spoon, standing up, in the road. It is PERFECT on toast, but you knew that. Yes it is worth six rand fifty. Taste it and then talk to me. SECOND PLACE at the agricultural show last year. _SECOND._ First place was a plum jam with a ribbon on, and I will say only that you cannot spread a ribbon. TO OPEN: turn the lid to the LEFT. Left. Not right, not up, not with your teeth. If it sticks, hot water on the lid, or hand it to the strongest person in the car. WHAT TO DO IF YOU ARE A LORRY DRIVER: slow down! It is a hundred and ten and my jars get NERVOUS. Wave. Buy two. PS. The dog is asleep. Let him. He does not take money and he does not mind. PPS. There is also a different dog, brown, not mine, Thursdays only. Do not feed him. Gran, they do not need to know about the dog TWICE. They do.";
var LID="AH. Space. Dear Traveller, the LID! Room for everything. The figs are WHOLE, which is why they are all looking at you. Keep it out of the sun, though I know you will not. Good for a year, or until Tuesday, whichever comes first. Signed, Mrs. Ronel Pieterse-Mabuza (the stall, not the jar).";
var BASE="UNDERNEATH, since you have gone and tipped it! Hello! Batch eleven. The syrup will run to the lid and then run back, it is a JAR, it has done this before. Pay in the tin, we trust you, the dog does not. R6.50. Thank you, Dear Traveller. Drive carefully. FIGS!";
var RING="NOT A GOOD RUBBER BAND. I KNOW. IT HOLDS. ALSO the gingham is because I LIKE it. ";

document.getElementById('sr').textContent=(BODY+' '+LID+' '+BASE).replace(/_/g,'');
try{console.log('Batch of eleven. The tree by the dam was told no.');}catch(e){}

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var R=120,RL=125,BT=200,BB=-200,TOP=242,PSI0=-0.9,BW=42;
var W=0,H=0,dpr=1,sc=1,cx=0,cy=0,cphi=1,sphi=0;
var rot=0,lag=0,rotV=reduce?0:0.9,tilt=0.14,tiltD=0.14,need=true,drag=false;

function hash(i){var x=Math.sin(i*12.9898+4.1)*43758.5453;return x-Math.floor(x);}

/* paper with tooth */
var tile=document.createElement('canvas');tile.width=tile.height=128;
var tc=tile.getContext('2d');tc.fillStyle=KR;tc.fillRect(0,0,128,128);
var i;
for(i=0;i<2800;i++){tc.fillStyle=Math.random()<0.5?'rgba(255,232,175,.11)':'rgba(70,45,10,.09)';tc.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*2,1);}
for(i=0;i<140;i++){var fx=Math.random()*128,fy=Math.random()*128;tc.strokeStyle='rgba(80,50,15,.07)';tc.beginPath();tc.moveTo(fx,fy);tc.lineTo(fx+Math.random()*12-6,fy+Math.random()*4-2);tc.stroke();}
var pat=ctx.createPattern(tile,'repeat');

/* layout: measure each character along the strip */
function layout(txt,fn){
  var chars=[],ul=false,k,c;
  for(k=0;k<txt.length;k++){c=txt.charAt(k);if(c==='_'){ul=!ul;continue;}chars.push([c,ul]);}
  var n=chars.length,out=[],s=0;
  for(k=0;k<n;k++){
    var f=fn(k,n);ctx.font=f+'px '+FF;
    var w=ctx.measureText(chars[k][0]).width+f*0.05;
    out.push({c:chars[k][0],ul:chars[k][1],f:f,w:w,s:s+w/2,j:hash(k+3)});
    s+=w;
  }
  return {ch:out,len:s};
}
function spiral(lay,r0,pitch,rEnd,psi0){
  var psi=psi0,r=r0;
  lay.ch.forEach(function(k){
    if(r<rEnd){k.skip=true;return;}
    var d=k.w/r;
    k.psi=psi+d/2;k.r=r-pitch*(d/2)/TAU;
    psi+=d;r-=pitch*d/TAU;
  });
}

var body=layout(BODY,function(i,n){return i<33?22:16.5-6.5*Math.pow((i-33)/(n-33),0.85);});
var tEnd=body.len/(TAU*R);
var nT=Math.ceil(tEnd)+1,byTurn=[];
for(i=0;i<nT;i++)byTurn.push([]);
body.ch.forEach(function(k,idx){k.t=k.s/(TAU*R);k.ink=(k.j>0.92?0.72:1)*(1-0.12*idx/body.ch.length);byTurn[Math.floor(k.t)].push(k);});
var lid=layout(LID,function(i,n){return 21-4*i/n;});spiral(lid,RL-12,26,12,-1.4);
lid.ch.forEach(function(k){k.ink=1;});
var base=layout(BASE,function(i,n){return 14.5-2*i/n;});spiral(base,R-10,17,9,-1.3);
base.ch.forEach(function(k){k.ink=0.45+0.4*k.j;});
var ring=layout(RING,function(){return 7.5;});

function dTop(t){var u=Math.min(Math.max(t/tEnd,0),1.05);return 40+300*(u*(1.35-0.35*u));}

/* projection */
function P(X,Y,Z){var ym=Y-21;return [cx+sc*X,cy-sc*(ym*cphi-Z*sphi)];}
function V(X,Y,Z){return [sc*X,-sc*(Y*cphi-Z*sphi)];}
function setT(a,b,p){ctx.setTransform(dpr*a[0],dpr*a[1],dpr*b[0],dpr*b[1],dpr*p[0],dpr*p[1]);}
function ident(){ctx.setTransform(dpr,0,0,dpr,0,0);}
function cyl(a,y,r){return P(r*Math.sin(a),y,r*Math.cos(a));}

function glyph(k,pos,T,U,alpha,ink){
  if(k.c===' ')return;
  var p=P(pos[0],pos[1],pos[2]),a=V(T[0],T[1],T[2]),b=V(-U[0],-U[1],-U[2]);
  setT(a,b,p);
  ctx.font=k.f+'px '+FF;
  ctx.globalAlpha=alpha*ink*0.28;ctx.lineWidth=1.3;ctx.strokeText(k.c,-k.w/2,0);
  ctx.globalAlpha=alpha*ink;ctx.fillText(k.c,-k.w/2,0);
  if(k.ul){ctx.fillRect(-k.w/2,2.6,k.w,1.1);ctx.fillRect(-k.w/2,4.8,k.w,1.1);}
}
function inkColor(c){ctx.fillStyle=c;ctx.strokeStyle=c;}

/* syrup + figs */
var figs=[];
for(i=0;i<11;i++)figs.push({a:i*0.57+hash(i)*0.5,rho:28+hash(i+9)*58,y:BB+48+(i/10)*(BT-BB-100)+(hash(i+20)-0.5)*24,s:0.8+hash(i+40)*0.5});
function sil(){
  var tp=P(0,BT,0),bt=P(0,BB,0),rx=R*sc,ry=Math.max(0.01,rx*Math.abs(sphi));
  ctx.beginPath();
  ctx.ellipse(tp[0],tp[1],rx,ry,0,0,TAU);
  ctx.moveTo(bt[0]+rx,bt[1]);ctx.ellipse(bt[0],bt[1],rx,ry,0,0,TAU);
  ctx.moveTo(tp[0]-rx,tp[1]);ctx.lineTo(bt[0]-rx,bt[1]);ctx.lineTo(bt[0]+rx,bt[1]);ctx.lineTo(tp[0]+rx,tp[1]);ctx.closePath();
}
function drawGlass(){
  var rx=R*sc;
  ctx.save();sil();ctx.clip();
  var g=ctx.createLinearGradient(cx-rx,0,cx+rx,0);
  g.addColorStop(0,'#26240f');g.addColorStop(0.3,'#5a5222');g.addColorStop(0.5,'#6d6228');g.addColorStop(0.75,'#4a4520');g.addColorStop(1,'#222009');
  ctx.fillStyle=g;ctx.fillRect(cx-rx-2,0,rx*2+4,H);
  var arr=figs.map(function(f){var a=f.a-lag;return {f:f,X:f.rho*Math.sin(a),Z:f.rho*Math.cos(a)};});
  arr.sort(function(p,q){return p.Z-q.Z;});
  arr.forEach(function(o){
    var p=P(o.X,o.f.y,o.Z),rr=22*o.f.s*sc;
    var gg=ctx.createRadialGradient(p[0]-rr*0.3,p[1]-rr*0.3,1,p[0],p[1],rr*1.1);
    gg.addColorStop(0,'#4d5c28');gg.addColorStop(0.6,'#2f3e18');gg.addColorStop(1,'#1b230c');
    ctx.globalAlpha=o.Z>0?0.95:0.5;
    ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(p[0],p[1],rr,rr*0.78,-0.25,0,TAU);ctx.fill();
    ctx.fillStyle='#1b230c';ctx.beginPath();ctx.ellipse(p[0]+rr*0.1,p[1]-rr*0.72,rr*0.22,rr*0.16,0,0,TAU);ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawBody(){
  var n,i2,N=96;
  for(n=0;n<nT;n++){
    for(i2=0;i2<N;i2++){
      var t0=n+i2/N,t1=n+(i2+1)/N;
      if(t0>=tEnd)break;
      var a0=TAU*t0+PSI0-rot,a1=TAU*t1+PSI0-rot;
      var nd=Math.cos((a0+a1)/2)*cphi;
      if(nd<=0.02)continue;
      var y0=BT-dTop(t0),y1=BT-dTop(t1),rb=R+0.8;
      var q0=cyl(a0,y0,rb),q1=cyl(a1,y1,rb),q2=cyl(a1,y1-BW,rb),q3=cyl(a0,y0-BW,rb);
      ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.lineTo(q3[0],q3[1]);ctx.closePath();
      ctx.globalAlpha=1;ctx.fillStyle=pat;ctx.fill();
      ctx.strokeStyle=KR;ctx.lineWidth=0.6;ctx.stroke();
      ctx.fillStyle='rgba(25,20,6,'+((1-nd)*0.6).toFixed(3)+')';ctx.fill();
    }
    inkColor(GR);
    var list=byTurn[n];
    for(i2=0;i2<list.length;i2++){
      var k=list[i2],a=k.s/R+PSI0-rot,nd2=Math.cos(a)*cphi;
      if(nd2<0.08)continue;
      var Y=BT-dTop(k.t)-(4+k.f*0.85);
      var sl=-(dTop(k.t+0.005)-dTop(k.t-0.005))/(0.01*TAU*R);
      var tl=Math.sqrt(1+sl*sl);
      glyph(k,[R*1.004*Math.sin(a),Y,R*1.004*Math.cos(a)],[Math.cos(a)/tl,sl/tl,-Math.sin(a)/tl],[0,1,0],Math.pow(nd2,0.75),k.ink);
    }
    ident();
  }
  ctx.globalAlpha=1;
}

function drawSkirt(){
  var N=96,rows=3,y0=196,h=(TOP-y0)/rows,i2,j;
  for(i2=0;i2<N;i2++){
    var a0=TAU*i2/N-rot,a1=TAU*(i2+1)/N-rot,nd=Math.cos((a0+a1)/2)*cphi;
    if(nd<=0.02)continue;
    for(j=0;j<rows;j++){
      var ya=y0+j*h,yb=ya+h;
      var q0=cyl(a0,yb,RL),q1=cyl(a1,yb,RL),q2=cyl(a1,ya,RL),q3=cyl(a0,ya,RL);
      var idx=((i2>>1)&1)+(j&1);
      ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.lineTo(q3[0],q3[1]);ctx.closePath();
      ctx.globalAlpha=1;ctx.fillStyle=KR;ctx.fill();
      if(idx){ctx.fillStyle='rgba(61,122,42,'+(idx===1?0.34:0.62)+')';ctx.fill();}
      ctx.fillStyle='rgba(25,20,6,'+((1-nd)*0.55).toFixed(3)+')';ctx.fill();
    }
    /* rubber band */
    var b0=cyl(a0,212,RL+1.2),b1=cyl(a1,212,RL+1.2),b2=cyl(a1,203.5,RL+1.2),b3=cyl(a0,203.5,RL+1.2);
    ctx.beginPath();ctx.moveTo(b0[0],b0[1]);ctx.lineTo(b1[0],b1[1]);ctx.lineTo(b2[0],b2[1]);ctx.lineTo(b3[0],b3[1]);ctx.closePath();
    ctx.fillStyle='#2b5a1e';ctx.strokeStyle='#2b5a1e';ctx.lineWidth=0.6;ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(25,20,6,'+((1-nd)*0.5).toFixed(3)+')';ctx.fill();
  }
  inkColor(KR);
  ring.ch.forEach(function(k){
    var a=k.s/RL+0.4-rot,nd=Math.cos(a)*cphi;
    if(nd<0.1)return;
    glyph(k,[(RL+1.5)*Math.sin(a),205.3,(RL+1.5)*Math.cos(a)],[Math.cos(a),0,-Math.sin(a)],[0,1,0],Math.pow(nd,0.75),0.95);
  });
  ident();ctx.globalAlpha=1;
}

function drawDisk(top){
  var Y=top?TOP:BB,r=top?RL:R-1;
  var o=P(0,Y,0),eu=V(Math.cos(rot),0,Math.sin(rot)),ev=V(-Math.sin(rot),0,Math.cos(rot));
  ctx.save();
  setT(eu,ev,o);
  ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.clip();
  ctx.globalAlpha=1;ctx.fillStyle=top?KR:pat;ctx.fillRect(-r,-r,2*r,2*r);
  if(top){
    ctx.fillStyle='rgba(61,122,42,.24)';
    var q;
    for(q=-8;q<8;q++){if((q&1)===0){ctx.fillRect(-r,q*16,2*r,16);ctx.fillRect(q*16,-r,16,2*r);}}
  }
  var rg=ctx.createRadialGradient(0,0,r*0.6,0,0,r);
  rg.addColorStop(0,'rgba(25,20,6,0)');rg.addColorStop(1,'rgba(25,20,6,.38)');
  ctx.fillStyle=rg;ctx.fillRect(-r,-r,2*r,2*r);
  ctx.restore();
  var lay=top?lid:base,v=Math.min(1,Math.abs(sphi)*2.4),s=top?-1:1;
  inkColor(GR);
  lay.ch.forEach(function(k){
    if(k.skip)return;
    var a=k.psi-rot;
    glyph(k,[k.r*Math.sin(a),Y+(top?0.3:-0.3),k.r*Math.cos(a)],[Math.cos(a),0,-Math.sin(a)],[s*Math.sin(a),0,s*Math.cos(a)],v,k.ink);
  });
  ident();ctx.globalAlpha=1;
}

function draw(){
  cphi=Math.cos(tiltD);sphi=Math.sin(tiltD);
  ident();ctx.globalAlpha=1;
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171b0c');g.addColorStop(1,'#2d2a15');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var bt=P(0,BB,0);
  if(cphi>0.4){
    ctx.fillStyle='rgba(0,0,0,'+(0.38*cphi).toFixed(3)+')';
    ctx.beginPath();ctx.ellipse(bt[0],bt[1]+sc*6,R*sc*1.12,R*sc*0.3,0,0,TAU);ctx.fill();
    ctx.save();
    ctx.translate(bt[0]+sc*(R*1.3+14*Math.sin(rot*0.7)),bt[1]+sc*10);ctx.scale(1,0.38);
    var cg=ctx.createRadialGradient(0,0,0,0,0,sc*64);
    cg.addColorStop(0,'rgba(201,162,107,'+(0.5*cphi).toFixed(3)+')');cg.addColorStop(1,'rgba(201,162,107,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,sc*64,0,TAU);ctx.fill();
    ctx.restore();
  }
  drawGlass();
  drawBody();
  /* glass sheen */
  var tp=P(0,BT,0),rx=R*sc;
  var sg=ctx.createLinearGradient(cx-rx*0.7,0,cx-rx*0.45,0);
  sg.addColorStop(0,'rgba(201,162,107,0)');sg.addColorStop(0.5,'rgba(201,162,107,.14)');sg.addColorStop(1,'rgba(201,162,107,0)');
  ctx.fillStyle=sg;ctx.fillRect(cx-rx*0.7,tp[1],rx*0.25,bt[1]-tp[1]);
  sil();ctx.strokeStyle='rgba(201,162,107,.3)';ctx.lineWidth=1.5;ctx.stroke();
  drawSkirt();
  if(sphi>0.02)drawDisk(true);
  if(sphi<-0.02)drawDisk(false);
  ctx.globalAlpha=1;ident();
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  sc=Math.min(W/(2*RL+36),(H-44)*0.9/(TOP-BB+40));
  cx=W/2;cy=H/2-8;need=true;
}
window.addEventListener('resize',resize);resize();

/* motion */
var last=performance.now(),maxV=reduce?2:10,lastMove=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000||0.016);last=now;
  if(!drag){
    rot+=rotV*dt;rotV*=Math.pow(0.16,dt);
    if(Math.abs(rotV)<0.004)rotV=0;
  }
  var lg=reduce?1:(1-Math.exp(-dt*3.2));
  lag+=(rot-lag)*lg;
  tiltD+=(tilt-tiltD)*(1-Math.exp(-dt*10));
  if(rotV>maxV)rotV=maxV;if(rotV<-maxV)rotV=-maxV;
  var moving=drag||rotV!==0||Math.abs(tilt-tiltD)>1e-4||Math.abs(rot-lag)>1e-4;
  if(moving||need){need=false;draw();}
  requestAnimationFrame(frame);
}

var px=0,py=0,pt=0;
cv.addEventListener('pointerdown',function(e){
  drag=true;px=e.clientX;py=e.clientY;pt=performance.now();lastMove=pt;rotV=0;
  try{cv.setPointerCapture(e.pointerId);}catch(x){}
});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;
  var now=performance.now(),dx=e.clientX-px,dy=e.clientY-py,dtm=Math.max((now-pt)/1000,0.008);
  var dR=-dx/(sc*R);
  rot+=dR;
  rotV=0.6*rotV+0.4*(dR/dtm);
  tilt=Math.max(-1.52,Math.min(1.52,tilt+dy*0.006));
  px=e.clientX;py=e.clientY;pt=now;lastMove=now;need=true;
});
function up(){
  if(!drag)return;drag=false;
  if(performance.now()-lastMove>90)rotV=0;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  rotV+=(e.deltaY+e.deltaX)*0.004;need=true;
},{passive:false});
cv.addEventListener('dblclick',function(){tilt=0.14;need=true;});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'){rotV+=1.4;}
  else if(k==='ArrowRight'){rotV-=1.4;}
  else if(k==='ArrowUp'){tilt=Math.max(-1.52,tilt-0.16);}
  else if(k==='ArrowDown'){tilt=Math.min(1.52,tilt+0.16);}
  else return;
  e.preventDefault();need=true;
});

requestAnimationFrame(frame);
})();
</script>
