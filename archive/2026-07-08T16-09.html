  <meta name="outbox-spec-era" content="Undated / out of time — the plain physical fact of frost creeping across a cold windowpane at first light, the exact thing that happens on a single-glazed kitchen window on any hard clear morning and looked no different a hundred winters ago; not pinned to a decade because a dendrite grows the way a dendrite has always grown — supercooled vapor lands on the coldest glass, freezes onto the nearest speck of dust or scratch, and branches out at its fixed crystal angles, ferns reaching in from every edge to interlock across the pane, and it is doing this right now on some cold pane somewhere while the sky behind it just begins to go amber. Not a relic, not a nostalgia piece, not a 'nobody has real winters anymore' elegy — a live pane whitening over this minute, one fern racing another to the middle.">
  <meta name="outbox-spec-format" content="The entire viewport IS a dark cold windowpane at dawn, edge to edge, with live generative frost genuinely growing across it — real dendritic ice-crystal growth seeded at the coldest corners and edges and at a scatter of tiny dust-nucleation points, each crystal branching inward at its fixed sixty-degree angles into interlocking feathery ferns, the black glass slowly whitening as the ferns race one another toward the center and knit shut. It is a true crystal-growth simulation computed every frame, never scripted, never the same pane twice. Where the cursor rests it is a warm fingertip on the glass: the frost there melts back to a clear dark porthole showing the blue predawn beyond, and the instant you move off, fresh crystals creep back in from the ferns at its rim and slowly heal the clear spot over. No page chrome, no header, no menu, no captions, no controls, no text anywhere except one tiny line scratched into the very corner of the glass.">
  <meta name="outbox-spec-subject" content="The plain quiet marvel of window frost — the honest physics of it: water vapor in the cold room deposits straight onto glass that has dropped below freezing, latching first onto a scratch or a mote of dust and then growing outward as a dendrite, branching and re-branching at the fixed angles the ice lattice allows, ferns fanning from the cold edges because that's where the glass chills first, neighboring ferns interlocking and crowding until the whole pane is a white thicket, and a warm touch driving it back to clear glass that re-freezes the moment the warmth leaves. Not a metaphor for winter or memory or the cold outside a warm house, not a fragile-beauty parable — literally cold glass, vapor, and the branching ice that falls out of the way crystals are obliged to grow, and the small live pleasure of watching one fern reach the middle before the others.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the one tiny scratched tally in the corner — the tone is purely the wordless, leaning-in delight of watching frost take a window: greedy to see which fern reaches the center first, tickled when two ferns collide and lock teeth, satisfied when your warm fingertip clears a dark porthole and then thrilled to watch it creep shut again. The growth is treated as a plain physical fact and a genuine visual pleasure — bright and busy, not reverent, not hushed, not precious, not melancholy, not a slow-down-and-breathe register. The closest thing to a voice is the ice's own patient, branching refusal to ever draw the same pane twice.">

  <meta name="outbox-spec-wildcard" content="Rarely and unpredictably (roughly one pane in twenty, never announced, never the same trigger), instead of the usual ferns creeping in from the edges the frost seeds a single crystal in the dead center of the pane and grows outward from it into a near-perfect six-armed radial star — real six-fold symmetry, each arm mirroring the others branch for branch as it reaches toward the corners — before the ordinary edge-ferns finally arrive to fill the rest of the glass around it. It is never explained, never labeled, never marked by any counter, never rewarded; it simply falls out of the physics for whoever watches long enough to catch a pane that happens to freeze from its own middle.">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Race to the Middle</title>
<meta name="description" content="A cold pane at first light, ferning shut, one crystal racing the next to the center.">
<!-- supercooled vapor lands on the coldest glass, freezes onto the nearest speck, branches at its fixed angles. watch which one reaches the middle first. -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d141f;overflow:hidden;}
  body{font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:none;}
  #glass{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;}
  /* the only two things scratched into the glass */
  .scratch{
    position:fixed;bottom:9px;z-index:5;
    font-size:9.5px;letter-spacing:.09em;line-height:1;
    color:rgba(238,244,250,.42);
    text-shadow:0 0 1px rgba(16,23,34,.9), 0 1px 0 rgba(169,200,224,.15);
    transform:rotate(-.6deg);
    pointer-events:none;
  }
  #tally{left:11px;}
  #back{right:11px;transform:rotate(.5deg);pointer-events:auto;text-decoration:none;color:rgba(169,200,224,.34);}
  #back:hover{color:rgba(238,244,250,.6);}
</style>
</head>
<body>
<canvas id="glass"></canvas>
<div id="tally" class="scratch">PANES FROSTED OVER HERE: 0</div>
<a id="back" class="scratch" href="/archive" title="the rest of the glass">the rest of the glass →</a>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('glass');
  var ctx = cv.getContext('2d');
  var tallyEl = document.getElementById('tally');

  // ---- persistent tally --------------------------------------------------
  var KEY = 'outbox-frost-panes';
  var panes = 0;
  try { panes = parseInt(localStorage.getItem(KEY)||'0',10)||0; } catch(e){}
  function drawTally(){ tallyEl.textContent = 'PANES FROSTED OVER HERE: ' + panes; }
  drawTally();

  // ---- geometry & buffers ------------------------------------------------
  var W, H, CELL = 5, cols, rows, cx, cy;
  var occ, warmth, total, occCount;
  var frost, fctx;                 // persistent fern layer
  var bg;                          // predawn-glass gradient
  var STEP = 6, R6 = Math.PI/3;

  function setup(){
    W = cv.width = Math.max(2, Math.floor(window.innerWidth));
    H = cv.height = Math.max(2, Math.floor(window.innerHeight));
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    cx = W/2; cy = H/2;
    cols = Math.ceil(W/CELL)+1; rows = Math.ceil(H/CELL)+1;
    total = cols*rows;
    occ = new Uint8Array(total);
    warmth = new Float32Array(total);
    frost = document.createElement('canvas');
    frost.width = W; frost.height = H;
    fctx = frost.getContext('2d');
    // predawn glass: indigo core -> near-black cold corners, dawn-amber at the sill
    bg = ctx.createRadialGradient(cx, cy*0.92, 30, cx, cy, Math.hypot(W,H)*0.62);
    bg.addColorStop(0, '#1a2436');
    bg.addColorStop(0.7, '#141d2c');
    bg.addColorStop(1, '#101722');
    reseed();
  }

  // ---- tips (crystal growth agents) --------------------------------------
  var tips, state, hold, thawY, cycle, star, edgeSeeded, MAXT = 3200;

  function cellIdx(x,y){
    var gx = x/CELL|0, gy = y/CELL|0;
    if(gx<0||gy<0||gx>=cols||gy>=rows) return -1;
    return gy*cols+gx;
  }
  function mark(x,y){
    var i = cellIdx(x,y);
    if(i>=0 && !occ[i]){ occ[i]=1; occCount++; }
  }

  function newTip(x,y,a,gen,life,st){
    return {x:x,y:y,a:a,gen:gen,life:life,grace:2,star:!!st,alive:true};
  }

  function reseed(){
    tips = []; state = 'growing'; hold = 0; thawY = H; cycle = 0;
    occCount = 0; occ.fill(0); warmth.fill(0);
    fctx.clearRect(0,0,W,H);
    star = Math.random() < 0.05;      // one pane in twenty freezes from its own middle
    edgeSeeded = !star;
    if(star){
      // a single seed in the dead center, six arms mirrored branch-for-branch
      for(var s=-1;s<=1;s++) tips.push(newTip(0,0, s*0.12, 0, 150, true));
    } else {
      seedEdges();
    }
  }

  function seedEdges(){
    var n = Math.round((W+H)/34);
    for(var k=0;k<n;k++){
      var e = Math.random(), x, y, a;
      if(e<0.28){ x=Math.random()*W; y=1; a=Math.PI/2; }
      else if(e<0.56){ x=Math.random()*W; y=H-1; a=-Math.PI/2; }
      else if(e<0.78){ x=1; y=Math.random()*H; a=0; }
      else { x=W-1; y=Math.random()*H; a=Math.PI; }
      a += (Math.random()-0.5)*0.9;
      tips.push(newTip(x,y,a,0, 70+Math.random()*40, false));
    }
    // scatter of dust-motes out in the glass, each a fresh nucleus
    var motes = 4 + (Math.random()*5|0);
    for(var m=0;m<motes;m++){
      tips.push(newTip(0.15*W+Math.random()*0.7*W, 0.12*H+Math.random()*0.7*H,
                       Math.random()*Math.PI*2, 1, 46, false));
    }
    edgeSeeded = true;
  }

  // draw one dendrite segment onto the fern layer
  function seg(x0,y0,x1,y1,thin){
    fctx.globalCompositeOperation = 'lighter';
    fctx.lineCap = 'round';
    fctx.strokeStyle = 'rgba(108,138,178,0.085)'; // glacier-blue shadow pooling in the hollows
    fctx.lineWidth = 3.2;
    fctx.beginPath(); fctx.moveTo(x0,y0); fctx.lineTo(x1,y1); fctx.stroke();
    if(thin){ fctx.strokeStyle='rgba(111,147,182,0.55)'; fctx.lineWidth=0.8; }
    else    { fctx.strokeStyle='rgba(222,235,249,0.78)'; fctx.lineWidth=1.15; }
    fctx.beginPath(); fctx.moveTo(x0,y0); fctx.lineTo(x1,y1); fctx.stroke();
  }

  var ROT = [];
  for(var q=0;q<6;q++) ROT.push([Math.cos(q*R6), Math.sin(q*R6)]);
  function starSeg(rx0,ry0,rx1,ry1,thin){
    for(var q=0;q<6;q++){
      var c=ROT[q][0], s=ROT[q][1];
      var ax=rx0*c-ry0*s+cx, ay=rx0*s+ry0*c+cy;
      var bx=rx1*c-ry1*s+cx, by=rx1*s+ry1*c+cy;
      seg(ax,ay,bx,by,thin);
      mark(bx,by);
    }
  }

  function stepTip(t){
    var nx, ny;
    if(t.star){ nx = t.x + Math.cos(t.a)*STEP; ny = t.y + Math.sin(t.a)*STEP; }
    else      { nx = t.x + Math.cos(t.a)*STEP; ny = t.y + Math.sin(t.a)*STEP; }

    // absolute cell for interlock / warmth test
    var ax = t.star ? t.x + cx : t.x;      // representative absolute (arm 0)
    var ay = t.star ? t.y + cy : t.y;
    var bx = t.star ? nx + cx : nx;
    var by = t.star ? ny + cy : ny;

    if(bx<0||by<0||bx>=W||by>=H){ t.alive=false; return; }
    var i = cellIdx(bx,by);
    if(i<0){ t.alive=false; return; }
    if(warmth[i] > 0.4){ t.alive=false; return; }        // a warm fingertip holds the ferns back
    if(t.grace<=0 && occ[i]){ t.alive=false; return; }   // two ferns lock teeth and stop

    if(t.star) starSeg(t.x,t.y,nx,ny, t.gen>=2);
    else { seg(ax,ay,bx,by, t.gen>=2); mark(bx,by); }

    t.x=nx; t.y=ny;
    t.a += (Math.random()-0.5)*0.16;   // slight wander down the main stem
    t.grace--; t.life--;

    if(t.life<=0 || Math.random()<0.012){ t.alive=false; }

    if(tips.length < MAXT){
      // branch off at the lattice's fixed sixty-degree turn
      if(Math.random() < 0.075){
        var g=t.gen+1;
        tips.push(newTip(t.x,t.y, t.a + R6 + (Math.random()-0.5)*0.2, g, Math.max(8,52-g*10), t.star));
        if(Math.random()<0.5)
          tips.push(newTip(t.x,t.y, t.a - R6 + (Math.random()-0.5)*0.2, g, Math.max(8,52-g*10), t.star));
      }
      // short feathery barbs give the fern its texture
      if(Math.random() < 0.20){
        var side = Math.random()<0.5 ? 1 : -1;
        tips.push(newTip(t.x,t.y, t.a + side*R6, t.gen+2, 5+Math.random()*7, t.star));
      }
    }
  }

  // ---- pointer: the warm fingertip --------------------------------------
  var px=-999, py=-999, warm=false, RAD=52;
  function pos(e){
    var p = e.touches ? e.touches[0] : e;
    px = p.clientX; py = p.clientY; warm = true;
  }
  window.addEventListener('mousemove', pos);
  window.addEventListener('mousedown', pos);
  window.addEventListener('mouseleave', function(){ warm=false; });
  window.addEventListener('touchstart', function(e){ pos(e); }, {passive:true});
  window.addEventListener('touchmove', function(e){ pos(e); }, {passive:true});
  window.addEventListener('touchend', function(){ warm=false; });

  function applyWarm(){
    if(!warm) return;
    var g0x = (px-RAD)/CELL|0, g1x=(px+RAD)/CELL|0;
    var g0y = (py-RAD)/CELL|0, g1y=(py+RAD)/CELL|0;
    var r2 = RAD*RAD;
    for(var gy=g0y; gy<=g1y; gy++){
      if(gy<0||gy>=rows) continue;
      for(var gx=g0x; gx<=g1x; gx++){
        if(gx<0||gx>=cols) continue;
        var dx=gx*CELL-px, dy=gy*CELL-py;
        if(dx*dx+dy*dy > r2) continue;
        var i=gy*cols+gx;
        warmth[i]=1;
        if(occ[i]){ occ[i]=0; occCount--; }
      }
    }
    // melt the fern layer back to clear dark glass, soft-edged porthole
    fctx.globalCompositeOperation = 'destination-out';
    var rg = fctx.createRadialGradient(px,py,RAD*0.35, px,py,RAD);
    rg.addColorStop(0,'rgba(0,0,0,1)');
    rg.addColorStop(0.7,'rgba(0,0,0,0.85)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle = rg;
    fctx.beginPath(); fctx.arc(px,py,RAD,0,7); fctx.fill();
  }

  // fresh crystals creep back in from the ferns at the porthole's rim
  function healPass(){
    if(tips.length > MAXT-40) return;
    var spawned=0, tries=1400;
    while(tries-- > 0 && spawned < 4){
      var i = Math.random()*total|0;
      if(occ[i] || warmth[i] > 0.2) continue;
      var gx=i%cols, gy=(i/cols)|0;
      // needs a frosted neighbour to grow out of
      var L = gx>0 && occ[i-1], Rr = gx<cols-1 && occ[i+1];
      var U = gy>0 && occ[i-cols], D = gy<rows-1 && occ[i+cols];
      if(!(L||Rr||U||D)) continue;
      var a = Math.atan2((D?1:0)-(U?1:0), (Rr?1:0)-(L?1:0)) + Math.PI + (Math.random()-0.5)*0.6;
      tips.push(newTip(gx*CELL, gy*CELL, a, 1, 22, false));
      spawned++;
    }
  }

  // ---- spacebar: a warm breath on the glass ------------------------------
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      if(state==='thawing') return;
      breath();
    }
  });
  var breathing=0;
  function breath(){ breathing = 1; }   // handled in loop: fog & clear in one soft sweep

  // ---- main loop ---------------------------------------------------------
  function frame(){
    // growth
    if(state==='growing'){
      cycle++;
      var alive=0;
      for(var k=0;k<tips.length;k++){ if(tips[k].alive){ stepTip(tips[k]); if(tips[k].alive) alive++; } }
      if(tips.length>4000) tips = tips.filter(function(t){return t.alive;});
      else tips = tips.filter(function(t){return t.alive;});
      // for the wildcard star, the ordinary edge-ferns arrive a moment later
      if(star && !edgeSeeded && cycle>170) seedEdges();
      applyWarm();
      if(cycle % 2 === 0) healPass();
      var cover = occCount/total;
      var done = (alive===0 && cycle>90) || cover>0.34 || cycle>4200;
      if(done && (!warm)){                     // the pane has ferned shut
        panes++; try{ localStorage.setItem(KEY, String(panes)); }catch(e){}
        drawTally();
        state='holding'; hold=70;
      }
    } else if(state==='holding'){
      applyWarm();
      if(--hold<=0){ state='thawing'; thawY=H+40; }
    } else if(state==='thawing'){
      // the rising dawn-amber warmth thaws it clear from the bottom up
      thawY -= H/110 + 2;
      fctx.globalCompositeOperation='destination-out';
      var tg = fctx.createLinearGradient(0, thawY-70, 0, thawY+30);
      tg.addColorStop(0,'rgba(0,0,0,0)');
      tg.addColorStop(1,'rgba(0,0,0,1)');
      fctx.fillStyle=tg;
      fctx.fillRect(0, thawY-70, W, H-(thawY-70)+80);
      for(var w=0; w<total; w++) if((w%cols)*0+ ((w/cols|0)*CELL) > thawY-40) { occ[w]=0; }
      if(thawY < -30){ reseed(); }
    }

    // warmth cools as the finger moves on
    if(state!=='thawing'){
      for(var d=0; d<total; d++) warmth[d]*=0.9;
    }

    // spacebar breath: fog the whole pane and start fresh
    if(breathing>0){
      fctx.globalCompositeOperation='destination-out';
      fctx.fillStyle='rgba(0,0,0,'+(0.5)+')';
      fctx.fillRect(0,0,W,H);
      breathing++;
      if(breathing>4){ breathing=0; reseed(); }
    }

    // ---- composite the pane -------------------------------------------
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    // dawn coming up behind the glass along the sill
    var amberTop = (state==='thawing') ? Math.max(0, thawY-60) : H*0.82;
    var ag = ctx.createLinearGradient(0, amberTop, 0, H);
    var strength = (state==='thawing') ? 0.5 : 0.22;
    ag.addColorStop(0,'rgba(224,176,122,0)');
    ag.addColorStop(1,'rgba(224,176,122,'+strength+')');
    ctx.fillStyle=ag; ctx.fillRect(0,amberTop,W,H-amberTop);
    // the frost itself
    ctx.globalCompositeOperation='source-over';
    ctx.drawImage(frost,0,0);
    // a faint cool breath-ring where the fingertip rests
    if(warm && state!=='thawing'){
      var rr = ctx.createRadialGradient(px,py,RAD*0.6, px,py,RAD*1.25);
      rr.addColorStop(0,'rgba(111,147,182,0)');
      rr.addColorStop(1,'rgba(111,147,182,0.10)');
      ctx.fillStyle=rr; ctx.beginPath(); ctx.arc(px,py,RAD*1.25,0,7); ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  // ---- boot --------------------------------------------------------------
  var rz;
  window.addEventListener('resize', function(){ clearTimeout(rz); rz=setTimeout(setup,220); });
  setup();
  requestAnimationFrame(frame);

  console.log('%c one fern reaches the middle before the others. move the mouse to warm the glass — spacebar for a fresh breath.',
    'color:#a9c8e0');
})();
</script>
