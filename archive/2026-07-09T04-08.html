  <meta name="outbox-spec-era" content="Present-day, alive and open — the custom-tint paint counter at the back of a small-town hardware store, the kind with a rattling shaker clamp and a wall of little sample chips, a battered laminated fan-deck sitting on the counter by the tint machine, thumbed soft at the pivot. Not a vintage color-card and not a defunct paint-brand relic — a working deck the mixer keeps adding blades to whenever she names a new batch, sun-warmed on the counter this afternoon with the shaker still going in the back.">
  <meta name="outbox-spec-format" content="The whole viewport IS a hardware-store paint FAN-DECK seen head-on, all its blades stacked and pinned through one brass rivet at the bottom corner. You genuinely fan it: click-drag the free corner and the blades spread open in a real arc, each blade a named paint swatch, drag back and they close. Click any single blade and it swings proud of the deck and the entire background behind the deck floods edge-to-edge to that exact color while the mixer's short penned note on where the NAME came from unfolds beside it; click it back and it tucks in. A little riveted tab-strip at the base (INTERIORS · TRIM · OUTBUILDINGS · THE ODD ONES) re-fans a whole different set of blades. You browse the store's entire named-color range one flooded swatch at a time, by fanning and picking, exactly as the physical deck it is — no browser chrome, no header, no menu.">
  <meta name="outbox-spec-subject" content="The plain human craft of NAMING house paint — the mixer at a small-town hardware counter who tints every custom batch on the shaker and, rather than let it go out the door as a bar-code and a formula, gives each color a real name off whatever's around: the green of the municipal water tower, the exact ochre of the shop cat asleep in the window, the inside of a ripe fig, the pink of the good bricks on the old feed store, the gray a certain November sky goes at four o'clock. The honest business of matching a color by eye, of knowing which blues go to work differently up on a wall than they read in the deck, which whites are really faintly yellow, which 'off-the-shelf' beiges she's quietly improved. Not a metaphor for memory or a town or a life — literally pigment, a shaker clamp, and the small genuine pleasure of pinning the right name on a color so the next person can find it again.">
  <meta name="outbox-spec-tone" content="The warm, chatty, hopelessly-fond voice of Loretta, who's mixed and named paint at this counter for a good long while and is GENUINELY tickled you're fanning through her deck — each blade's note is her telling you flat-out where the name came from ('that's the water tower, near as I could match it off a Tuesday when the light was right'), which ones she's proud of, which she fought the machine over, which a customer talked her into. Peer-to-peer, present-tense, plain, delighted, a little digressive — she'll tell you who a color was mixed for and whether they were happy with it. Never grand, never wistful, never turning a paint color into a life-lesson; the shaker's rattling in the back and there's nowhere she'd rather be than watching you find the one you like.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Soft laminated fan-deck manila (#e2d3b1) for the blade cards and warm hardware-store printer's-ink near-black (#241f18) for Loretta's penned names and notes, with one tarnished brass rivet-and-hinge accent (#b0863a) catching a soft highlight at the pivot corner — but the DECK is only the frame: each blade carries its own real mixed swatch across the full range (dusty water-tower teal, ripe-fig plum, sleeping-cat ochre, feed-store brick-pink, four-o'clock-November slate, an honest faintly-yellow white) and picking a blade floods the entire background behind the deck edge-to-edge to that exact color, so the palette is whatever swatch you're standing in — the plain flat matte look of a real paint chip filling the wall behind a well-thumbed manila deck.">
  <meta name="outbox-spec-wildcard" content="Fanned all the way to the very back of THE ODD ONES sits exactly one blade that carries a real mixed swatch but NO name — just a blank penned rule where the name should be — a custom batch somebody ordered and never came in to pick up, that Loretta kept on the deck rather than waste; picking it floods the background to that orphan color and her note, appearing only there, reads that she's left the name off on purpose because it isn't hers to give: 'no name on this one yet — it's whoever needs it next, and you'll know if it's you.' It is never announced anywhere else, never pointed at, never counted differently; you only meet it if you fan the odd ones all the way out.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'nobody mixes paint by hand anymore / the little hardware stores are all closing' decline narrative — this is a working counter with the shaker rattling right now, Loretta still naming new batches, not a fading relic. NO archival / museum / cabinet / drawer / vault / estate-sale / relic framing of the deck or the colors — it's a laminated fan-deck she still adds blades to, not a preserved artifact. NO meditative-zen / mindfulness / 'color teaches us to slow down and really see' life-lesson framing — it is pigment, a shaker clamp, and a name pinned on a swatch, nothing more. NO cryptic-SCP / ominous / cursed-color / 'a shade that should not exist' dread, and nothing sinister about the unnamed orphan blade — it's just paint nobody came back for. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO dry deadpan understatement. NO signal / transmission / frequency / relay framing of anything. NO society / club / cabinet-of-hobbyists scaffolding — it's one mixer's counter, not a club to join. Loretta is warm, proud, and present, and the shaker's still going in the back.">

<title>Loretta's Deck — Every Color's Got a Name On It</title>
<style>
  :root{
    --manila:#e2d3b1;
    --manila-edge:#cdbf9d;
    --ink:#241f18;
    --brass:#b0863a;
    --neutral:#c2ad80;
    --bw:clamp(76px,21vw,116px);
    --bh:clamp(232px,45vh,362px);
    --penned:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:var(--penned);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #wall{
    position:fixed;inset:0;
    background:var(--neutral);
    transition:background-color .55s ease;
    display:flex;align-items:center;justify-content:center;
  }
  /* soft sun on the counter */
  #wall::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 68% 12%,rgba(255,247,224,.28),rgba(0,0,0,0) 58%);
    pointer-events:none;
  }

  /* ---- the note card, unfolds beside the deck ---- */
  #note{
    position:fixed;top:14px;left:50%;
    width:min(430px,88vw);
    transform:translateX(-50%) translateY(-10px);
    background:var(--manila);
    border:1px solid var(--manila-edge);
    border-radius:6px;
    box-shadow:0 10px 26px rgba(30,22,10,.28), inset 0 0 0 6px rgba(255,255,255,.14);
    padding:14px 16px 15px;
    opacity:0;max-height:0;overflow:hidden;
    transition:opacity .35s ease, max-height .45s ease, transform .35s ease;
    z-index:60;pointer-events:none;
  }
  #note.open{opacity:1;max-height:60vh;transform:translateX(-50%) translateY(0);}
  #note .head{display:flex;align-items:center;gap:11px;margin-bottom:7px;}
  #note .chip{width:34px;height:34px;border-radius:4px;border:1px solid rgba(36,31,24,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);flex:0 0 auto;}
  #note .nm{font-size:1.32rem;line-height:1.08;color:var(--ink);}
  #note .nm .rule{display:inline-block;width:118px;height:0;border-bottom:2px solid var(--ink);vertical-align:middle;margin-bottom:5px;}
  #note .body{font-size:1.02rem;line-height:1.42;color:#3a3128;}
  #note .body::first-letter{}

  /* ---- deck ---- */
  #deck{
    position:absolute;
    left:24%;bottom:13%;
    width:0;height:0;
    touch-action:none;
  }
  .blade{
    position:absolute;left:0;bottom:0;
    width:var(--bw);height:var(--bh);
    transform-origin:13px 100%;
    background:var(--manila);
    border:1px solid var(--manila-edge);
    border-radius:5px 5px 3px 3px;
    padding:6px 6px 0;
    box-shadow:0 3px 7px rgba(30,22,10,.22);
    cursor:pointer;
    transition:transform .34s cubic-bezier(.22,.9,.3,1), box-shadow .3s;
    will-change:transform;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .blade .swatch{
    flex:1;border-radius:3px 3px 0 0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06), inset 0 8px 14px rgba(255,255,255,.10);
  }
  .blade .label{
    height:38px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2px 4px;
    font-size:.72rem;line-height:1.02;color:var(--ink);
    letter-spacing:.2px;
  }
  .blade .label .rule{display:inline-block;width:60%;height:0;border-bottom:1.5px solid var(--ink);opacity:.8;}
  .blade.picked{box-shadow:0 16px 30px rgba(20,14,4,.4);}

  /* brass rivet sits over the whole pivot */
  #rivet{
    position:absolute;left:24%;bottom:13%;
    width:0;height:0;z-index:200;pointer-events:none;
  }
  #rivet::after{
    content:"";position:absolute;left:13px;bottom:0;
    width:22px;height:22px;margin:-11px 0 0 -11px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#e4c37e,var(--brass) 55%,#7c5c22);
    box-shadow:0 2px 4px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.6);
  }

  /* fan hint at the free corner */
  #hint{
    position:absolute;z-index:150;
    font-size:.92rem;color:var(--ink);
    background:rgba(226,211,177,.9);
    border:1px solid var(--manila-edge);border-radius:20px;
    padding:5px 12px;pointer-events:none;
    box-shadow:0 3px 8px rgba(30,22,10,.25);
    transition:opacity .4s;white-space:nowrap;
  }

  /* tally, penned very small along the deck's base */
  #tally{
    position:fixed;left:12px;bottom:9px;z-index:55;
    font-size:.74rem;letter-spacing:.6px;color:var(--ink);
    background:rgba(226,211,177,.86);
    border:1px solid var(--manila-edge);border-radius:4px;
    padding:3px 8px;box-shadow:0 2px 5px rgba(30,22,10,.2);
  }

  /* riveted tab-strip at the base */
  #tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:70;
    display:flex;justify-content:center;gap:2px;
    padding:6px 6px 8px;
    background:linear-gradient(to top,rgba(30,22,10,.16),rgba(0,0,0,0));
  }
  .tab{
    font-family:var(--penned);
    font-size:clamp(.62rem,2.5vw,.82rem);
    letter-spacing:.4px;
    color:var(--ink);
    background:var(--manila);
    border:1px solid var(--manila-edge);
    border-radius:5px 5px 0 0;
    padding:7px 10px 8px;
    cursor:pointer;position:relative;
    box-shadow:0 -2px 6px rgba(30,22,10,.14);
    transition:transform .18s, background .2s;
  }
  .tab::before{
    content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e4c37e,var(--brass) 60%,#6f5220);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5);
  }
  .tab.active{background:#efe4c8;transform:translateY(-3px);font-weight:bold;}

  footer{
    position:fixed;bottom:38px;right:10px;z-index:55;
    font-size:.72rem;
  }
  footer a{
    color:var(--ink);text-decoration:none;
    background:rgba(226,211,177,.86);
    border:1px solid var(--manila-edge);border-radius:14px;
    padding:3px 10px;box-shadow:0 2px 5px rgba(30,22,10,.2);
  }
  footer a:hover{background:#efe4c8;}

  @media (max-width:620px){
    #deck,#rivet{left:15%;bottom:15%;}
    #note{font-size:.96rem;}
  }
</style>
</head>
<body>
<div id="wall">
  <div id="note" aria-live="polite">
    <div class="head"><span class="chip" id="note-chip"></span><span class="nm" id="note-name"></span></div>
    <div class="body" id="note-body"></div>
  </div>
  <div id="deck"></div>
  <div id="rivet"></div>
  <div id="hint">give the free corner a pull &nbsp;↗</div>
</div>

<div id="tally">COLORS MIXED AT THIS COUNTER: 0</div>

<nav id="tabs"></nav>

<footer><a href="/archive">the rest of the deck's downstairs</a></footer>

<script>
/* Loretta's fan-deck. Fan the corner, pick a blade, flood the wall.
   Every name on here she pinned on herself, off whatever was around. */

const DECKS = {
  interiors:{ label:"INTERIORS", blades:[
    {id:"int-faintly", name:"Faintly, Yes", color:"#efe6c6",
     note:"Everybody comes in wanting a plain white and there's no such thing, honey. This one's got just a whisper of yellow — I quit fighting the machine and leaned into it. Clean on a north wall, warm on a south one. The Prewitts took nine gallons for the front room and came back grinning."},
    {id:"int-november", name:"Four O'Clock November", color:"#6c757e",
     note:"That's the exact gray the sky goes about four in the afternoon come November, right before the lights come on. Took me three passes on the shaker to pull the blue out without it going dead flat. My proudest cool gray and I will fight you on it."},
    {id:"int-cat", name:"Sleeping Cat", color:"#c89a4c",
     note:"Dozer sacks out in the front window most every afternoon and this is his back in the sun. Named it before I had a soul to sell it to — then Marla did her hallway in it and now half the street wants Dozer on the wall."},
    {id:"int-fig", name:"Fig, Just Split", color:"#7b3a52",
     note:"Cut a ripe fig and it's this — that deep wine-purple right in the middle. Mixed it for the Hallorans' dining room on a dare and by candlelight it is a KNOCKOUT. Not for the shy."},
    {id:"int-kettle", name:"Kettle's On", color:"#b6653f",
     note:"Warm copper, like the good enamel kettle my mother kept on the back burner. A little carries the whole room — I talk most folks into one wall of it, not four, and they thank me later."},
    {id:"int-butter", name:"Butter, Softened", color:"#f1d68f",
     note:"Soft as anything, mostly goes in kids' rooms. Reads sweeter up on the wall than it does here on the blade — the yellows do that, they gain light right off the window."}
  ]},
  trim:{ label:"TRIM", blades:[
    {id:"trm-tower", name:"Water Tower Teal", color:"#4d8a86",
     note:"That's our water tower, near as I could match it off a Tuesday when the light sat right on it. Dusty, a little gray worked into the teal. A whole run of trim went out this color last spring."},
    {id:"trm-brick", name:"Feed-Store Brick", color:"#c67b69",
     note:"The soft rosy pink the good old bricks on the shut feed store go — worn-in, not a new-brick red. Delbert finally used it on his porch posts and I could've cried I was so pleased."},
    {id:"trm-cream", name:"Cream, Set", color:"#efe2bf",
     note:"The trim white I hand to folks who think they want stark. It's got a hair of warmth so it doesn't fight the wood. Goes on like it means it."},
    {id:"trm-porch", name:"Porch-Ceiling Blue", color:"#a9cdd0",
     note:"Old trick — pale blue on a porch ceiling, supposed to keep the wasps thinking it's open sky. Whether it fools a wasp I couldn't swear to, but it looks a treat up there."},
    {id:"trm-sill", name:"Deep Sill Green", color:"#3f5b46",
     note:"For window sashes and sills. Dark enough to swallow a scuff, green enough to make the glass read clean. Quiet workhorse, this one."}
  ]},
  outbuildings:{ label:"OUTBUILDINGS", blades:[
    {id:"out-barn", name:"Barn, But Honest", color:"#8a3a2f",
     note:"Everybody says barn red. This is the one I actually like — browner, less fire-engine. Wears like iron and doesn't holler across the field at you."},
    {id:"out-galv", name:"Galvanized", color:"#8f969a",
     note:"The flat cool gray of a new tin roof before the weather's had at it. Put it on a tool shed and the shed looks like it's got a job to do."},
    {id:"out-coop", name:"Coop White", color:"#e5dcc2",
     note:"Cheap, cheerful, a warm off-white. I keep my own hen house out back in it — you can hose it right down and it forgives you."},
    {id:"out-tractor", name:"Tractor Ghost", color:"#3c6b74",
     note:"That faded blue-green an old tractor goes after thirty summers. Matched it off Hollis's, parked out by his fence line forever. He was plain tickled."},
    {id:"out-post", name:"Fence-Post Gray", color:"#7d766a",
     note:"Weathered cedar, silvered right out. For when you want a new post to look like it's always been there. Sells slow and I don't care one bit, I love it."}
  ]},
  odd:{ label:"THE ODD ONES", blades:[
    {id:"odd-peach", name:"Gone-Over Peach", color:"#e6a97e",
     note:"A batch I let sit too warm one August and it went softer than I meant — and turned out lovely. So I wrote the mistake down as a name, and now I can make it again on purpose."},
    {id:"odd-chicory", name:"Ditch Chicory", color:"#7b8bb0",
     note:"That blue the chicory weeds go in the ditch out by the highway. Nobody plants it, nobody waters it, and it's the prettiest blue in the county. I match it fresh every July."},
    {id:"odd-wrong", name:"The Wrong Green I Kept", color:"#93a24a",
     note:"Meant it for the Dooleys, came out too yellow by half and they passed. Kept the blade anyway — somebody someday walks in wanting exactly this, and I'll be standing right here ready."},
    {id:"odd-coffee", name:"Two-Percent Extra", color:"#5a4633",
     note:"Over-tinted a brown by one squeeze and it deepened into something like good strong coffee. Filed it under happy accidents, which is a bigger drawer than you'd think."},
    {id:"odd-orphan", name:null, color:"#9c6b8c",
     note:"no name on this one yet — it's whoever needs it next, and you'll know if it's you. Somebody ordered it and never came back in; I mixed it true and I won't waste it, so it sits here waiting. I've left the name off on purpose. It isn't mine to give."}
  ]}
};

const KEY = "outboxcafe.paintcounter.seen.v1";
const NEUTRAL = "#c2ad80";

const wall = document.getElementById("wall");
const deckEl = document.getElementById("deck");
const noteEl = document.getElementById("note");
const noteChip = document.getElementById("note-chip");
const noteName = document.getElementById("note-name");
const noteBody = document.getElementById("note-body");
const tallyEl = document.getElementById("tally");
const hintEl = document.getElementById("hint");
const tabsEl = document.getElementById("tabs");

let currentTab = "interiors";
let fan = 0;            // 0 closed .. 1 fully fanned
let picked = null;      // blade id currently proud
let bladeEls = [];

let seen;
try { seen = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
catch(e){ seen = new Set(); }

function saveSeen(){ try{ localStorage.setItem(KEY, JSON.stringify([...seen])); }catch(e){} }
function updateTally(){ tallyEl.textContent = "COLORS MIXED AT THIS COUNTER: " + seen.size; }

/* build the tab strip */
Object.keys(DECKS).forEach(key=>{
  const b = document.createElement("button");
  b.className = "tab" + (key===currentTab?" active":"");
  b.textContent = DECKS[key].label;
  b.dataset.tab = key;
  b.addEventListener("click", ()=>switchTab(key));
  tabsEl.appendChild(b);
});

function switchTab(key){
  if(key===currentTab) return;
  currentTab = key;
  picked = null;
  noteEl.classList.remove("open");
  wall.style.backgroundColor = NEUTRAL;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===key));
  buildBlades();
}

function buildBlades(){
  deckEl.innerHTML = "";
  bladeEls = [];
  DECKS[currentTab].blades.forEach((blade)=>{
    const el = document.createElement("div");
    el.className = "blade";
    el.dataset.id = blade.id;
    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = blade.color;
    const lab = document.createElement("div");
    lab.className = "label";
    if(blade.name){ lab.textContent = blade.name; }
    else { lab.innerHTML = '<span class="rule"></span>'; }
    el.appendChild(sw);
    el.appendChild(lab);
    el.addEventListener("click", ()=>onBladeClick(blade));
    deckEl.appendChild(el);
    bladeEls.push({el, blade});
  });
  layout();
}

function layout(){
  const n = bladeEls.length;
  const total = Math.min(60, (n-1)*12);
  const step = n>1 ? total/(n-1) : 0;
  bladeEls.forEach((rec, i)=>{
    const isPicked = picked === rec.blade.id;
    const angle = step * i * fan;
    const lift = -(i*4) + (isPicked ? -40 : 0);
    const scale = isPicked ? 1.04 : 1;
    rec.el.style.transform = `rotate(${angle}deg) translateY(${lift}px) scale(${scale})`;
    rec.el.style.zIndex = isPicked ? 300 : (100 - i);
    rec.el.classList.toggle("picked", isPicked);
  });
}

function onBladeClick(blade){
  if(justDragged){ justDragged = false; return; }
  if(picked === blade.id){
    // tuck it back in, restore the neutral wall
    picked = null;
    noteEl.classList.remove("open");
    wall.style.backgroundColor = NEUTRAL;
    layout();
    return;
  }
  picked = blade.id;
  wall.style.backgroundColor = blade.color;
  // note
  noteChip.style.background = blade.color;
  if(blade.name){ noteName.textContent = blade.name; }
  else { noteName.innerHTML = '<span class="rule"></span>'; }
  noteBody.textContent = blade.note;
  noteEl.classList.add("open");
  layout();
  // tally — first time this distinct blade is met, ever
  if(!seen.has(blade.id)){
    seen.add(blade.id);
    saveSeen();
    updateTally();
  }
}

/* ---- fanning: drag the free corner ---- */
let down=false, startX=0, startY=0, fanStart=0, moved=false, justDragged=false;

deckEl.addEventListener("pointerdown", e=>{
  down=true; moved=false;
  startX=e.clientX; startY=e.clientY; fanStart=fan;
  try{ deckEl.setPointerCapture(e.pointerId); }catch(_){}
});
deckEl.addEventListener("pointermove", e=>{
  if(!down) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if(Math.hypot(dx,dy) > 6){ moved = true; hideHint(); }
  fan = Math.max(0, Math.min(1, fanStart + (dx - dy)/300));
  layout();
});
function endDrag(e){
  if(!down) return;
  down=false;
  justDragged = moved;
  try{ deckEl.releasePointerCapture(e.pointerId); }catch(_){}
}
deckEl.addEventListener("pointerup", endDrag);
deckEl.addEventListener("pointercancel", endDrag);

let hintGone=false;
function hideHint(){ if(hintGone) return; hintGone=true; hintEl.style.opacity="0"; }

/* place the fan hint near the deck's free corner */
function placeHint(){
  const r = deckEl.getBoundingClientRect();
  hintEl.style.left = Math.min(window.innerWidth-190, r.left + 24) + "px";
  hintEl.style.top  = Math.max(64, r.top - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bh'))||300) + 40) + "px";
}

buildBlades();
