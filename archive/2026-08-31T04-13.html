  <meta name="outbox-spec-era" content="September 1965 — the last forty minutes of benching at an open dahlia show staged in a drill hall in Neath, West Glamorgan. Rain on the roof lights, both doors propped, blooms still arriving out of the backs of vans wrapped in wet newspaper, and the hall heating up fast because the boiler was lit at seven and there is no way to turn it down. Judging starts at ten and everyone is out at five to. Two hundred and eleven vases are already standing on the staging, something like thirty of them are in a class they will not survive, and the blooms are opening where they stand.">
  <meta name="outbox-spec-format" content="A BROWSEABLE SHOW BENCH — the whole page is a directory made of objects, and you browse it by walking it. The entire viewport, edge to edge, is one continuous paper-covered staging trestle seen from a standing lean at working height, running off both sides of frame: vases in class order, a printed class card in front of every one, an exhibitor number on a slip and nothing else — no names, no menu, no index, no vertical scroll, no scrollbar, no site chrome. You move ALONG the bench with a horizontal drag and the classes go past you in order (CLASS 9, VASE OF THREE MEDIUM DECORATIVE; CLASS 14, THREE POMPON; CLASS 22, THREE SMALL SEMI-CACTUS), the run of colour changing as the size bands change. Press any vase and it slides forward to the front edge of the bench, where its three blooms can be turned individually and where the three instruments of the job are lying: a pair of vernier callipers that you drag open across the actual rendered bloom and that read whatever it actually measures, the folded show schedule which you pick up and hold beside it, and the steward's pencil, which re-cards an entry into another class. Put a vase back in a different place on the bench and that is where it is judged from. Two hundred and eleven entries, thirty-four classes, one bench, forty minutes.">
  <meta name="outbox-spec-subject" content="The flat measuring-and-classifying business of getting two hundred entries into the right classes before judging, and specifically why a bloom's class is a measurement taken at ten o'clock and not a decision taken in somebody's garden on Friday night — that the schedule bands dahlias by the greatest width across the bloom, measured at its widest point with the callipers held flat and not tipped, so miniature is under 115 mm, small 115 to 170, medium 170 to 220, large 220 to 260, and giant anything over that, and there is no rounding and no benefit of the doubt; that the ball classes are stricter still because they band by size AND demand the shape hold all the way to the middle — pompon under 52 mm and genuinely globular, miniature ball 52 to 90, ball 90 to 115 — and that a pompon which is 51 mm and slightly flattened on one face is beaten by a 48 mm one that is round in every direction; that FORM is a separate axis from size and is decided entirely by what the ray florets do — decorative rays broad and flat with blunt or slightly involute margins, cactus rays revolute (rolled backwards into a quill) for MORE than half their length, semi-cactus revolute for less than half, and that the boundary between cactus and semi-cactus is a ruler laid along a single floret and not an opinion, which is why the same variety turns up honestly in both classes on the same bench; that the whole trap of a warm hall is that a bloom is not a finished object — the outer florets go on reflexing and the flower goes on widening for hours after it is cut, at a rate that tracks air temperature, so a pompon measured at 50 mm in a cold shed at six in the morning is over 52 by half past ten and is out, and the correct answer is to cut the night before, stand everything in deep cold water overnight to harden it, and bring it in late rather than early; that a VASE OF THREE is not three blooms, it is one exhibit, and uniformity carries as much weight as quality — three matched blooms at 165 mm beat two superb ones at 210 and one at 160, because the odd one destroys the vase and the judge will say so in one word on the card; that the CENTRE is where most exhibits are actually lost, since a bloom whose disc has blown open and is showing its own centre is finished no matter how big it is, and tightness beats size at every level of every schedule; that presentation is mechanical — blooms face the front, stems in proportion to the bloom (a giant on a short stem reads wrong and a small on a long one reads worse), plain water, no packing visible above the rim, foliage as the schedule allows and no more; that rain marks the outer florets and Thursday's downpour is on a lot of what is standing here, and a marked outer floret can be removed but the scar of removing it cannot; that earwigs come in with the blooms and come out of them in a warm hall about an hour after they arrive; that disbudding six weeks ago is what actually decided every stem length on this bench and there is nothing to be done about it today; and the flat arithmetic that entries close at ten, the callipers read to a tenth of a millimetre, the hall is up four degrees since eight o'clock, and a re-carded entry has to be physically carried to the other end of the staging by somebody.">
  <meta name="outbox-spec-tone" content="The fast, cheerful, apologetic-but-completely-immovable voice of Sioned Cadwaladr, twenty-four, second season as staging steward, who is carrying two vases at a time down the bench while she talks and is therefore speaking in bursts with a pencil in her teeth half the time. Present tense, second person, addressed to whoever is walking the bench with her carrying the schedule. She measures out loud and says the figure twice every time, once as the callipers read it and once as she writes it. She is polite and absolutely unbudgeable about the 52 mm line and says so in the same flat friendly way each time it comes up. She keeps a running count out loud of vases still to check and minutes to ten. She is specifically and repeatedly annoyed about exactly one thing — people who measure at home in a cold shed and then bench it in a hall with the boiler on — and says it twice, once about a particular class and once about nobody in particular. She is genuinely and briefly delighted when the visitor spots that two entries in the same class are carrying the same exhibitor number, and says so as a matter of the paperwork and not of cleverness. She mentions the rain on the roof lights twice and the tea urn in the side room once, and that the far trestle rocks if you set anything down hard. Never wry, never deadpan, never a craftsman-sage, never wistful, never a plucky-underdog or rivalry arc, and never charmed by any of this.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The staging is trestle board under unbleached lining paper in a warm dry off-white (#efe9dc), going a shade greyer and softer where it has been damp under a vase (#d9d2c0) and darker along the front lip where the board's edge throws a hard close shadow (#b9b0a0); behind and above, the drill hall goes to a flat dark green-black of stage curtain and unlit roof (#23281f), with the roof-light rain reading only as a mottled cool wash across the paper (#e6e8e5). Show vases are dark bottle glass (#2f4436) with a real water line and a visible refracted stem kink. Every bloom's colour is COMPUTED, not chosen: each variety carries an anthocyanin fraction, a carotenoid fraction and a white ground, plus a per-floret variation term and a live turgor value, so an under-hardened bloom renders measurably paler, flatter and more translucent than the same variety stood in deep water overnight, and the reverse of every ray floret renders lighter than its face because it is thinner — which means a fully revolute cactus bloom reads pale and a decorative of the identical pigment reads dense. Foliage is a single dull mid-green with a hard specular where the hall lights catch a wet leaf (#4d5c33). Exactly one chip of steward's slip red (#bb2f22) is held strictly for the re-carding slips, the callipers' vernier index line, and the word MOVED — it never touches a bloom. Flat, hard, high-contrast, no glow, no bloom, no soft focus, no gradients other than honest turgor and honest floret thickness — paper, glass and petal under hall lights on a wet morning.">
  <meta name="outbox-spec-wildcard" content="Not one colour word appears anywhere in the writing — no name of any hue, shade, tint or tone, not once, in any label, any voice line, any class card, any slip or any instrument. The blooms are rendered in full colour and are referred to in words only by class number, exhibitor number, form, measurement and condition. The engine must not work around this with near-misses like 'dark' or 'pale' used as colour; it simply never comes up, because on this bench nobody needs to say it.">
  <meta name="outbox-spec-forbidden" content="NO flowers-as-metaphor for anything — not beauty, not brevity, not care, not what somebody's grandfather grew, not 'a whole year in one morning'; a dahlia here is a diameter, a revolute fraction and a centre that has or has not blown, and it has nothing to teach anybody. NO horticultural lyricism whatsoever: no describing scent, no light through petals, no 'they blaze', no garden-as-refuge, no soil-under-the-fingernails dignity, no seasons-turning, no growing-things-as-hope. NO nostalgia, NO wistfulness, NO 'nobody shows dahlias anymore / the halls are all closed / the last of the exhibitors' decline narrative — there are thirty vases still to check and judging starts at ten. NO Welsh or 1960s-Britain social framing of any kind: no coalfield, no chapel, no male voice choirs, no valleys pathos, no dialect spelling, no explaining Wales to anybody, no working-class-dignity sermon. NO eccentric-hobbyist comedy, NO obsessive-grower caricature, NO quaint-village-show whimsy, NO Ealing register, NO winking at how seriously these people take it — everybody here is competent and the rules are arithmetic. NO rivalry arc, NO underdog, NO who-wins tension, NO judging drama, NO reveal; the judging happens after the page ends and is never described. NO camp or ironic affection for prize cards, trestles or mid-century show ephemera. NO cryptic-SCP, liminal or uncanny dread about any entry on the bench — nothing is wrong. NO sensuous material writing about petals, glass or water beyond width, thickness, turgor, translucency and rate. NO archival / museum / cabinet / drawer / collection / specimen framing — every one of these was cut last night and is standing in water this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is a wet mid-morning with the boiler on and the doors propped. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / association / committee-of-hobbyists scaffolding, NO founding date, NO membership, NO tradition — it is an open show in a hired hall and the schedule is a folded card.">

<script>
"use strict";
/* staging engine — every width on this bench is the consequence of its florets and nothing else */
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);buildPaper();}
window.addEventListener("resize",resize);

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mul(19650911);
function rr(a,b){return a+(b-a)*rng();}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}

/* ---------- the printed schedule ---------- */
var BANDS=[["miniature",0,115],["small",115,170],["medium",170,220],["large",220,260],["giant",260,999]];
var CLASSES=[
 {n:1,t:"VASE OF THREE",d:"GIANT DECORATIVE",band:"giant",form:"decorative",cnt:3},
 {n:2,t:"VASE OF THREE",d:"GIANT SEMI-CACTUS",band:"giant",form:"semi-cactus",cnt:3},
 {n:3,t:"ONE BLOOM",d:"GIANT, ANY FORM",band:"giant",form:"any",cnt:1},
 {n:4,t:"VASE OF THREE",d:"LARGE DECORATIVE",band:"large",form:"decorative",cnt:3},
 {n:5,t:"VASE OF THREE",d:"LARGE SEMI-CACTUS",band:"large",form:"semi-cactus",cnt:3},
 {n:6,t:"VASE OF THREE",d:"LARGE CACTUS",band:"large",form:"cactus",cnt:3},
 {n:7,t:"ONE BLOOM",d:"LARGE, ANY FORM",band:"large",form:"any",cnt:1},
 {n:8,t:"VASE OF THREE",d:"MEDIUM CACTUS",band:"medium",form:"cactus",cnt:3},
 {n:9,t:"VASE OF THREE",d:"MEDIUM DECORATIVE",band:"medium",form:"decorative",cnt:3},
 {n:10,t:"VASE OF THREE",d:"MEDIUM SEMI-CACTUS",band:"medium",form:"semi-cactus",cnt:3},
 {n:11,t:"ONE BLOOM",d:"MEDIUM, ANY FORM",band:"medium",form:"any",cnt:1},
 {n:12,t:"VASE OF THREE",d:"BALL",band:"ball",form:"ball",cnt:3},
 {n:13,t:"VASE OF THREE",d:"MINIATURE BALL",band:"miniature ball",form:"ball",cnt:3},
 {n:14,t:"VASE OF THREE",d:"POMPON",band:"pompon",form:"ball",cnt:3},
 {n:15,t:"VASE OF SIX",d:"POMPON",band:"pompon",form:"ball",cnt:6},
 {n:16,t:"ONE BLOOM",d:"BALL, ANY SIZE",band:"any ball",form:"ball",cnt:1},
 {n:17,t:"VASE OF THREE",d:"MINIATURE DECORATIVE",band:"miniature",form:"decorative",cnt:3},
 {n:18,t:"VASE OF THREE",d:"MINIATURE CACTUS",band:"miniature",form:"cactus",cnt:3},
 {n:19,t:"VASE OF THREE",d:"MINIATURE SEMI-CACTUS",band:"miniature",form:"semi-cactus",cnt:3},
 {n:20,t:"VASE OF SIX",d:"MINIATURE, ANY FORM",band:"miniature",form:"any",cnt:6},
 {n:21,t:"VASE OF THREE",d:"SMALL DECORATIVE",band:"small",form:"decorative",cnt:3},
 {n:22,t:"VASE OF THREE",d:"SMALL SEMI-CACTUS",band:"small",form:"semi-cactus",cnt:3},
 {n:23,t:"VASE OF THREE",d:"SMALL CACTUS",band:"small",form:"cactus",cnt:3},
 {n:24,t:"ONE BLOOM",d:"SMALL, ANY FORM",band:"small",form:"any",cnt:1},
 {n:25,t:"VASE OF THREE",d:"NOVICE, ANY FORM ANY SIZE",band:"any",form:"any",cnt:3},
 {n:26,t:"VASE OF THREE",d:"MEDIUM, ANY FORM",band:"medium",form:"any",cnt:3},
 {n:27,t:"VASE OF THREE",d:"LARGE, ANY FORM",band:"large",form:"any",cnt:3},
 {n:28,t:"VASE OF SIX",d:"ANY FORM ANY SIZE",band:"any",form:"any",cnt:6},
 {n:29,t:"VASE OF THREE",d:"POMPON, DISTINCT",band:"pompon",form:"ball",cnt:3},
 {n:30,t:"ONE BLOOM",d:"ANY FORM ANY SIZE",band:"any",form:"any",cnt:1},
 {n:31,t:"VASE OF THREE",d:"MINIATURE BALL, DISTINCT",band:"miniature ball",form:"ball",cnt:3},
 {n:32,t:"VASE OF THREE",d:"SEMI-CACTUS, ANY SIZE",band:"any",form:"semi-cactus",cnt:3},
 {n:33,t:"VASE OF THREE",d:"CACTUS, ANY SIZE",band:"any",form:"cactus",cnt:3},
 {n:34,t:"VASE OF THREE",d:"DECORATIVE, ANY SIZE",band:"any",form:"decorative",cnt:3}
];
function bandRange(b){
 if(b==="pompon")return[0,52];if(b==="miniature ball")return[52,90];if(b==="ball")return[90,115];
 if(b==="any ball")return[0,115];if(b==="any")return[0,999];
 for(var i=0;i<BANDS.length;i++)if(BANDS[i][0]===b)return[BANDS[i][1],BANDS[i][2]];return[0,999];}
function bandLabel(b){var r=bandRange(b);if(b==="any")return"ANY SIZE";if(b==="any ball")return"UNDER 115 mm";
 return (r[0]?r[0]:"UNDER ")+(r[0]?"\u2013"+(r[1]>=999?"":r[1]):r[1])+" mm";}

/* ---------- pigment: three fractions and a ground ---------- */
var VARS=[];
(function(){for(var i=0;i<26;i++){VARS.push({a:rng()*rng(),c:rng()*0.95,g:0.05+rng()*0.55,v:0.02+rng()*0.07});}})();
function petalRGB(p,turgor,thin,jit){
 var a=Math.min(1,p.a*(1+jit)),c=Math.min(1,p.c*(1+jit*0.6));
 var r=255*(1-0.06*a-0.03*c), g=255*(1-0.80*a-0.30*c), b=255*(1-0.86*a-0.92*c);
 var gr=p.g*(1-0.35*a);
 r=r+(252-r)*gr; g=g+(246-g)*gr; b=b+(232-b)*gr;
 var t=0.30+0.70*turgor;               /* an under-hardened bloom renders flatter */
 r=239+(r-239)*t; g=233+(g-233)*t; b=220+(b-220)*t;
 if(thin){ r=r+(255-r)*0.42; g=g+(252-g)*0.42; b=b+(244-b)*0.42; }
 return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
}

/* ---------- a bloom is grown, not drawn ---------- */
function makeBloom(pg,Rmm,revTarget,globTarget,hardened){
 var b={pg:pg,R:Rmm,rot:rng()*6.283,reflex:0,discExp:rng()*0.14,blown:false,
   hardened:hardened,turgor:hardened?rr(0.86,1.0):rr(0.52,0.80),
   asp:rr(1.005,1.055),aspA:rng()*3.14,discRate:rr(0.7,1.5),fl:[]};
 var rays=Math.round(38+ (globTarget>0.78?70:24)*rng() + (1-revTarget)*46 + (globTarget>0.78?42:0));
 for(var i=0;i<rays;i++){
  var t=i/rays;
  var ang=i*2.3999632+rr(-0.05,0.05);
  var lenBase=Rmm*(1-0.52*Math.pow(t,1.05))*rr(0.93,1.05);
  var rb=Rmm*0.055*(0.35+0.7*t);
  var rev=Math.min(0.95,Math.max(0,revTarget*(1.10-0.42*t)+rr(-0.05,0.05)));
  b.fl.push({t:t,ang:ang,rb:rb,len:lenBase,
    w:Rmm*(globTarget>0.78?0.115:0.20)*(1-0.35*t)*rr(0.85,1.12),
    rev:rev,curl:rr(-0.16,0.16)+(globTarget>0.78?0.30:0),
    jit:rr(-1,1)*pg.v, lift:globTarget*(1-t)});
 }
 b.depth0=Rmm*2*globTarget*rr(0.96,1.04);
 return b;
}
function tipR(b,f){return (f.rb+f.len*(1+b.reflex*(1-f.t)*0.62))*(1+(b.asp-1)*Math.cos(2*(f.ang-b.aspA)));}
function widthAt(b,theta){ /* support width of the actual outline along theta */
 var hi=-1e9,lo=-1e9;
 for(var i=0;i<b.fl.length;i++){var f=b.fl[i];var r=tipR(b,f),a=f.ang+b.rot-theta;
  var x=r*Math.cos(a); if(x>hi)hi=x; if(-x>lo)lo=-x;}
 return (hi+lo)*2/2*1; }
function greatest(b){var m=0;for(var k=0;k<36;k++){var w=widthAt(b,k*Math.PI/36);if(w>m)m=w;}return m;}
function depth(b){return b.depth0*(1-Math.min(0.55,b.reflex*0.9));}
function glob(b){return depth(b)/Math.max(1,greatest(b));}
function meanRev(b){var s=0,n=0;for(var i=0;i<b.fl.length;i++){if(b.fl[i].t<0.5){s+=b.fl[i].rev;n++;}}return n?s/n:0;}
function step(b,ds,T){
 var drive=Math.max(0,(T-14.5))/9.0*(b.hardened?0.42:1.18);
 b.reflex+=ds*drive*0.0000225;
 b.discExp+=ds*drive*0.00021*b.discRate;
 if(b.discExp>=1&&!b.blown){b.blown=true;}
}
/* the decision tree, off the printed schedule, on the current geometry */
function classify(b){
 var d=greatest(b),g=glob(b),rv=meanRev(b);
 if(g>=0.80&&d<115){
   var bd=d<52?"pompon":(d<90?"miniature ball":"ball");
   return {d:d,g:g,rv:rv,form:"ball",band:bd};
 }
 var form=rv>0.5?"cactus":(rv>0.06?"semi-cactus":"decorative");
 var band="giant";
 for(var i=0;i<BANDS.length;i++){if(d>=BANDS[i][1]&&d<BANDS[i][2]){band=BANDS[i][0];break;}}
 return {d:d,g:g,rv:rv,form:form,band:band};
}
function fits(cl,r){
 var bandOK;
 if(cl.band==="any")bandOK=true;
 else if(cl.band==="any ball")bandOK=(r.form==="ball");
 else if(cl.band==="pompon"||cl.band==="miniature ball"||cl.band==="ball")bandOK=(r.form==="ball"&&r.band===cl.band);
 else bandOK=(r.band===cl.band&&r.form!=="ball");
 var formOK=(cl.form==="any")||(cl.form===r.form);
 return bandOK&&formOK;
}

/* ---------- the bench: 211 entries in class order ---------- */
var ENTRIES=[],SLOT=118,classRun={};
(function(){
 var counts=[],tot=0;
 for(var i=0;i<CLASSES.length;i++){var c=Math.round(rr(3,9));counts.push(c);tot+=c;}

/* ---------- vase ranking: a vase is one exhibit ---------- */
function scoreVase(en){
 var ds=[],dp=[],ct=[],blown=false;
 for(var i=0;i<en.bl.length;i++){var b=en.bl[i];ds.push(greatest(b));dp.push(depth(b));ct.push(1-Math.min(1,b.discExp));if(b.blown)blown=true;}
 var mean=function(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;};
 var spread=function(a){var mx=Math.max.apply(null,a),mn=Math.min.apply(null,a);return (mx-mn)/Math.max(1,mean(a));};
 var q=0.55*mean(ct)+0.45*mean(en.bl.map(function(b){return b.turgor;}));
 var u=1-Math.min(1,spread(ds)*4.2)-Math.min(0.5,spread(dp)*1.6)-Math.min(0.4,spread(ct)*1.1);
 u=Math.max(0,u);
 var s=0.45*q+0.55*u;
 if(blown)s=0;
 return {s:s,u:u,q:q,sd:spread(ds)*100,blown:blown,mean:mean(ds)};
}

}

/* ---------- drawing a bloom ---------- */
function drawBloom(g,b,cx,cy,s){
 var fl=b.fl;
 for(var i=0;i<fl.length;i++){
  var f=fl[i];
  var a=f.ang+b.rot;
  var asp=(1+(b.asp-1)*Math.cos(2*(f.ang-b.aspA)));
  var L=f.len*(1+b.reflex*(1-f.t)*0.62)*asp*s, rb=f.rb*s*asp, w=f.w*s;
  var face=petalRGB(b.pg,b.turgor,false,f.jit), rev=petalRGB(b.pg,b.turgor,true,f.jit);
  var split=1-f.rev;
  var pts=[],pts2=[];
  var N=9;
  for(var k=0;k<=N;k++){
   var u=k/N, ang=a+f.curl*u*u*0.7;
   var rad=rb+L*u;
   var hw=w*(0.42+0.58*Math.sin(Math.PI*Math.pow(u,0.62)));
   if(u>split)hw*=0.24+0.10*(1-u);
   var px=cx+Math.cos(ang)*rad, py=cy+Math.sin(ang)*rad*(1-0.10*f.lift);
   var nx=-Math.sin(ang)*hw, ny=Math.cos(ang)*hw*0.96;
   (u<=split+1e-6?pts:pts2).push([px+nx,py+ny,px-nx,py-ny]);
   if(Math.abs(u-split)<1/(2*N)) pts2.push([px+nx,py+ny,px-nx,py-ny]);
  }
  function poly(arr,col){
   if(arr.length<2)return;
   g.beginPath();g.moveTo(arr[0][0],arr[0][1]);
   for(var q=1;q<arr.length;q++)g.lineTo(arr[q][0],arr[q][1]);
   for(var q2=arr.length-1;q2>=0;q2--)g.lineTo(arr[q2][2],arr[q2][3]);
   g.closePath();g.fillStyle=col;g.fill();
   g.strokeStyle="rgba(35,40,31,0.30)";g.lineWidth=Math.max(0.4,s*0.5);g.stroke();
  }
  poly(pts,face); if(f.rev>0.02)poly(pts2,rev);
 }
 /* centre */
 var dr=b.R*s*0.11*(1+b.discExp*1.5);
 if(b.blown){
  g.beginPath();g.arc(cx,cy,dr*1.25,0,6.283);
  g.fillStyle=petalRGB({a:b.pg.a*0.2,c:Math.min(1,b.pg.c*0.6+0.5),g:0.1,v:0},b.turgor,false,0);g.fill();
  g.strokeStyle="rgba(35,40,31,0.55)";g.lineWidth=Math.max(0.6,s*0.7);g.stroke();
  for(var d2=0;d2<16;d2++){var aa=d2/16*6.283+b.rot;
   g.beginPath();g.arc(cx+Math.cos(aa)*dr*0.85,cy+Math.sin(aa)*dr*0.85,Math.max(0.6,dr*0.16),0,6.283);

  g.fillStyle=petalRGB(b.pg,Math.min(1,b.turgor+0.1),false,-0.2);g.fill();
  g.strokeStyle="rgba(35,40,31,0.25)";g.lineWidth=Math.max(0.4,s*0.4);g.stroke();
 }
}

   g.font="9.5px 'Courier New',monospace";g.fillText(cl.d.slice(0,24),6,30);g.fillText(bandLabel(cl.band),6,40);}
 else{g.font="11px 'Courier New',monospace";g.fillText("CL "+cl.n,4,14);}
 g.restore();
 g.save();g.translate(x+cw/2-(big?46:22),baseY+8+chh+3);g.rotate(-0.03);
 g.fillStyle=e.moved?"#bb2f22":"#efe9dc";g.fillRect(0,0,(big?46:24),(big?18:12));
 g.fillStyle=e.moved?"#efe9dc":"#23281f";g.font=(big?"12px":"9px")+" 'Courier New',monospace";
 g.fillText(String(e.num),3,(big?13:9));
 g.restore();
}
function frontLayout(){
 var e=front,n=e.bl.length;
 var maxd=0;for(var i=0;i<n;i++)maxd=Math.max(maxd,greatest(e.bl[i]));
 var cols=Math.min(3,n);
 var s=Math.min(1.9,(W*0.80)/(cols*maxd+cols*16));
 s=Math.max(0.30,s);
 var baseY=H-Math.max(78,H*0.155);
 return {s:s,baseY:baseY,cx:W/2,maxd:maxd,cols:cols};
}
function bloomPos(i,L){
 var col=(i%3)-1,row=Math.floor(i/3);
 var sp=Math.min(W*0.30,L.maxd*L.s*0.62+30);
 return {x:L.cx+col*sp,y:L.baseY-150*L.s-90-row*70*L.s};
}
function drawFront(horizon,lip){
 var e=front,L=frontLayout(),a=frontT;
 ctx.save();ctx.globalAlpha=a;
 ctx.fillStyle="rgba(185,176,160,0.45)";ctx.fillRect(0,lip-2,W,H-lip+2);
 ctx.save();ctx.translate(0,(1-a)*160);
 var vh=150*L.s+70;
 /* shadow */
 ctx.fillStyle="rgba(35,40,31,0.28)";
 ctx.beginPath();ctx.ellipse(L.cx+22,L.baseY+6,70*L.s+40,16,0,0,6.283);ctx.fill();
 /* blooms and vase */
 for(var i=0;i<e.bl.length;i++){
  var b=e.bl[i],p=bloomPos(i,L);
  ctx.strokeStyle="#4d5c33";ctx.lineWidth=3.2;
  ctx.beginPath();ctx.moveTo(L.cx,L.baseY-vh*0.62);ctx.lineTo(p.x,p.y);ctx.stroke();
  var spr=bloomSprite(b,L.s);
  ctx.drawImage(spr,p.x-spr.width/2,p.y-spr.height/2);
  if(selBloom===i){
   ctx.strokeStyle="rgba(187,47,34,0.0)";
  }
  /* exhibitor-facing marks */
  if(b.blown){ctx.fillStyle="#bb2f22";ctx.font="10px 'Courier New',monospace";ctx.textAlign="center";
   ctx.fillText("CENTRE OPEN",p.x,p.y+spr.height/2+12);}
 }
 var vw=44;
 var top=L.baseY-vh,wl=L.baseY-vh*e.water;
 ctx.fillStyle="#2f4436";
 ctx.beginPath();ctx.moveTo(L.cx-vw*0.42,top);ctx.lineTo(L.cx+vw*0.42,top);ctx.lineTo(L.cx+vw*0.5,L.baseY);ctx.lineTo(L.cx-vw*0.5,L.baseY);ctx.closePath();ctx.fill();
 ctx.fillStyle="rgba(35,40,31,0.55)";ctx.fillRect(L.cx-vw*0.5,wl,vw,L.baseY-wl);
 ctx.fillStyle="rgba(230,232,229,0.55)";ctx.fillRect(L.cx-vw*0.5,wl-2,vw,1.8);
 ctx.fillStyle="rgba(230,232,229,0.15)";ctx.fillRect(L.cx-vw*0.30,top,vw*0.12,L.baseY-top);
 ctx.strokeStyle="rgba(77,92,51,0.9)";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(L.cx,wl);ctx.lineTo(L.cx+8,L.baseY-4);ctx.stroke();
 /* the card in front of it */
 var cl=clsOf(carrying?classAtX(pan+W/2):e.cls);
 ctx.save();ctx.translate(L.cx-84,L.baseY+10);ctx.rotate(0.015);
 ctx.fillStyle="#efe9dc";ctx.fillRect(0,0,168,46);ctx.strokeStyle="#b9b0a0";ctx.strokeRect(0.5,0.5,167,45);
 ctx.fillStyle="#23281f";ctx.textAlign="left";ctx.font="15px 'Courier New',monospace";
 ctx.fillText("CLASS "+cl.n,7,19);
 ctx.font="9.5px 'Courier New',monospace";ctx.fillText(cl.t+" \u00B7 "+cl.d.slice(0,20),7,32);
 ctx.fillText(bandLabel(cl.band)+(cl.form!=="any"?"  \u00B7  "+cl.form.toUpperCase():""),7,42);
 ctx.restore();
 ctx.save();ctx.translate(L.cx+92,L.baseY+10);ctx.rotate(-0.04);
 ctx.fillStyle=pencilMark?"#bb2f22":"#efe9dc";ctx.fillRect(0,0,58,26);
 ctx.fillStyle=pencilMark?"#efe9dc":"#23281f";ctx.font="14px 'Courier New',monospace";ctx.fillText(String(e.num),6,18);
 if(pencilMark){ctx.font="9px 'Courier New',monospace";ctx.fillText("MOVED",6,26.5);}
 ctx.restore();
 /* the callipers */
 drawCallipers(L);
 ctx.restore();ctx.restore();
}
var selBloom=0;
function drawCallipers(L){
 var b=front.bl[selBloom]; if(!b)return;
 var p=bloomPos(selBloom,L);
 var mmpx=L.s;
 var half=cal.open*mmpx/2;
 var y=p.y;
 var read=cal.open*Math.cos(cal.tilt);
 ctx.save();
 ctx.translate(0,0);
 ctx.strokeStyle="#23281f";ctx.lineWidth=3;
 var beamY=y+ (bloomSprite(b,L.s).height/2)+26;
 ctx.beginPath();ctx.moveTo(p.x-half-40,beamY);ctx.lineTo(p.x+half+16,beamY);ctx.stroke();
 ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(p.x-half,beamY);ctx.lineTo(p.x-half,y+Math.sin(cal.tilt)*10);ctx.stroke();
 ctx.beginPath();ctx.moveTo(p.x+half,beamY);ctx.lineTo(p.x+half,y-Math.sin(cal.tilt)*10);ctx.stroke();
 ctx.fillStyle="#23281f";
 ctx.fillRect(p.x+half-4,beamY-9,26,18);
 ctx.fillStyle="#efe9dc";ctx.font="12px 'Courier New',monospace";ctx.textAlign="left";
 var boxX=p.x-half-46;
 ctx.fillStyle="#23281f";ctx.fillRect(boxX-46,beamY-13,90,26);
 ctx.fillStyle="#efe9dc";ctx.fillText(f1(read)+" mm",boxX-40,beamY+4);
 ctx.strokeStyle="#bb2f22";ctx.lineWidth=1.6;
 ctx.beginPath();ctx.moveTo(boxX+40,beamY-13);ctx.lineTo(boxX+40,beamY+13);ctx.stroke();
 if(cal.tilt>0.02){ctx.fillStyle="#efe9dc";ctx.font="10px 'Courier New',monospace";
  ctx.fillText("TIPPED "+(cal.tilt*57.3).toFixed(0)+"\u00B0",boxX-40,beamY+22);}
 ctx.restore();
}

/* ---------- hud ---------- */
var hudEl=document.getElementById("hud");
function hud(){
 var s="<b>"+clockStr()+"</b> \u00B7 "+temp.toFixed(1)+"&deg;<br>"+
  (front? "CLASS "+(carrying?classAtX(pan+W/2):front.cls)+" \u00B7 No. "+front.num : "211 vases \u00B7 34 classes")+
  "<br>"+minsToTen()+" min to ten";
 if(hudEl.innerHTML!==s)hudEl.innerHTML=s;
}

/* ---------- interaction ---------- */
var bar=document.getElementById("bar");
function pickEntry(sx,sy){
 var lip=H-Math.max(66,H*0.13),by=lip-10;
 for(var i=0;i<ENTRIES.length;i++){
  var e=ENTRIES[i],x=e.x-pan;
  if(Math.abs(sx-x)<46&&sy>by-140&&sy<by+42)return e;
 }
 return null;
}
function checkEntry(e){
 if(!e.checked){e.checked=true;counts.checked++;save();}
 var cl=clsOf(e.cls),out=[],over52=false;
 for(var i=0;i<e.bl.length;i++){
  var r=classify(e.bl[i]);
  if(!fits(cl,r))out.push({i:i,r:r});
  if(cl.band==="pompon"&&r.d>=52)over52=true;
 }
 if(over52){counts.over++;save();}
 var v=scoreVase(e),rk=rankIn(e.cls),pos=1;
 for(var q=0;q<rk.length;q++)if(rk[q].e===e)pos=q+1;
 var d0=greatest(e.bl[0]);
 say("Number "+e.num+", class "+cl.n+". "+f1(d0)+" on the first one. "+f1(d0)+", writing it.",true);
 if(out.length){
  var o=out[0];
  if(cl.band==="pompon"&&o.r.d>=52){
   said.fifty++;
   say("That's "+f1(o.r.d)+". "+f1(o.r.d)+" \u2014 and fifty-two is fifty-two. There's no rounding on it and I'm sorry, but it's out of "+cl.n+".");
   if(said.fifty===2)say("I do know. I'm not being awkward with you. It's a figure on a card and the callipers read what they read.");
  } else if(o.r.form!=="ball"&&cl.form!=="any"&&o.r.form!==cl.form){
   say("Bloom "+(o.i+1)+" is measuring "+o.r.form+" \u2014 the roll runs back "+(o.r.rv*100).toFixed(0)+" per cent of the floret. Class "+cl.n+" wants "+cl.form+". That's a ruler along one floret, not an argument.");
  } else {
   say("Bloom "+(o.i+1)+" reads "+f1(o.r.d)+". "+f1(o.r.d)+". That's "+o.r.band+", and this class is "+bandLabel(cl.band).toLowerCase()+". It wants re-carding.");
  }
 } else if(v.blown){
  say("One of these has its centre showing. That's finished, whatever it measures, and nothing on the bench brings it back.");
 } else {
  say("All in. Spread across the three is "+v.sd.toFixed(1)+" per cent on width \u2014 that's what carries the vase, not the best bloom in it. Standing "+pos+" of "+rk.length+" in the class as it is this minute.");
 }
 var dup=ENTRIES.filter(function(x){return x.cls===e.cls&&x.num===e.num;});
 if(dup.length>1&&!said.dup){ /* the visitor has to notice the slip */ }
}
function down(x,y){
 audio();
 if(front&&frontT>0.5){
  var L=frontLayout();
  for(var i=0;i<front.bl.length;i++){
   var p=bloomPos(i,L),spr=bloomSprite(front.bl[i],L.s);
   if(Math.abs(x-p.x)<spr.width/2+12&&Math.abs(y-p.y)<spr.height/2+12){
    mode="bloom";activeB=i;selBloom=i;lastX=x;lastY=y;
    cal.open=Math.max(widthAt(front.bl[i],0),cal.open);
    return;
   }
   var beamY=p.y+spr.height/2+26;
   if(i===selBloom&&Math.abs(y-beamY)<26){mode="cal";lastX=x;lastY=y;return;}
  }
  var slipX=L.cx+92,slipY=L.baseY+10;
  if(x>slipX-6&&x<slipX+64&&y>slipY-6&&y<slipY+34){slipTap();return;}
 }
 mode="pan";dragging=true;lastX=x;lastY=y;vel=0;downX=x;downY=y;downT=performance.now();
}
var mode="pan",activeB=0,lastY=0,downX=0,downY=0,downT=0;
function move(x,y){
 if(mode==="pan"&&dragging){var dx=x-lastX;pan-=dx;vel=-dx;lastX=x;
  pan=Math.max(-60,Math.min(BENCH_W-W*0.4,pan));}
 else if(mode==="bloom"){var b=front.bl[activeB];b.rot+=(x-lastX)*0.012;lastX=x;
  cal.open=Math.max(cal.open,widthAt(b,0));}
 else if(mode==="cal"){
  var L=frontLayout(),b=front.bl[selBloom];
  var d=(x-lastX)*2/L.s;
  var prev=cal.open;
  cal.open=Math.max(4,Math.min(340,cal.open+d));
  var w=widthAt(b,0);
  if(cal.open<w){ if(prev>=w){cal.contact=true;vernierTick();
    var rd=w*Math.cos(cal.tilt);
    say(f1(rd)+". "+f1(rd)+", writing it.",true);}
   cal.open=w; }
  else cal.contact=false;
  cal.tilt=Math.max(0,Math.min(0.62,cal.tilt+(y-lastY)*0.006));
  if(Math.abs(x-lastX)>0.6)ratchet(Math.abs(x-lastX));
  lastX=x;lastY=y;
 }
}
function up(x,y){
 var dt=performance.now()-downT, moved=Math.abs(x-downX)+Math.abs(y-downY);
 if(mode==="pan"&&dragging&&moved<9&&dt<600){
  var e=pickEntry(x,y);
  if(e){ if(front===e&&frontT>0.6){ /* nothing */ }
    else { front=e;frontT=0;selBloom=0;carrying=false;pencilMark=false;
      var L=frontLayout();cal.open=widthAt(e.bl[0],0)+26;cal.tilt=0;
      knock(e.water);bar.style.display="block";checkEntry(e);
      if(e.x>BENCH_W-900){trestle();say("Careful \u2014 that end's the far trestle.");}
    }
  } else if(front&&frontT>0.6&&y<H*0.34){ /* tap the hall: put it back */ }
 }
 dragging=false;mode="pan";
}
function slipTap(){
 if(!front)return;
 var dup=ENTRIES.filter(function(x){return x.cls===front.cls&&x.num===front.num;});
 crackle();
 if(dup.length>1){
  if(!said.dup){said.dup=true;
   say("Oh \u2014 well spotted, that's number "+front.num+" twice in class "+front.cls+". That's a paperwork thing, that. One of them's meant to be somewhere else and the entry book will say which. I'll run one down to the table.",true);
  } else say("Still the two of "+front.num+" in class "+front.cls+". It's gone down to the table.",true);
 } else {
  say("Number "+front.num+", one entry in class "+front.cls+". That agrees with the book.",true);
 }
}
cv.addEventListener("pointerdown",function(ev){cv.setPointerCapture(ev.pointerId);down(ev.clientX,ev.clientY);});
cv.addEventListener("pointermove",function(ev){if(ev.buttons||mode!=="pan")if(dragging||mode!=="pan")move(ev.clientX,ev.clientY);});
cv.addEventListener("pointerup",function(ev){up(ev.clientX,ev.clientY);});
cv.addEventListener("pointercancel",function(){dragging=false;mode="pan";});

document.getElementById("bPen").addEventListener("click",function(){
 if(!front)return;audio();crackle();
 pencilMark=true;carrying=true;
 say("Right \u2014 pencil on the slip, and now it wants carrying. Drag the bench along to the class you want and set it down there. That's where it gets judged from. I'm not stopping the clock for it.",true);
});
document.getElementById("bSet").addEventListener("click",function(){
 if(!front)return;audio();
 var newCls=carrying?classAtX(pan+W/2):front.cls;
 var oldCls=front.cls;
 if(newCls!==oldCls){
  front.cls=newCls;front.moved=true;counts.moved++;save();
  var r=classRun[newCls];front.x=Math.round((r.x0+r.x1)/2);
  var cl=clsOf(newCls),ok=true;
  for(var i=0;i<front.bl.length;i++)if(!fits(cl,classify(front.bl[i])))ok=false;
  say("Down in class "+newCls+", number "+front.num+". "+(ok?"That's in, on this minute's figures.":"That's still not in \u2014 check it again, it's moved since you carded it."),true);
  knock(front.water);
 } else { knock(front.water); say("Back down in "+oldCls+" then. Fine.",true); }
 front=null;frontT=0;carrying=false;pencilMark=false;bar.style.display="none";
});
var panel=document.getElementById("panel");
document.getElementById("bSch").addEventListener("click",function(){
 audio();crackle();
 var rows="";
 for(var i=0;i<CLASSES.length;i++){var c=CLASSES[i];
  rows+="<tr><td class='num'>"+c.n+"</td><td>"+c.t+" \u2014 "+c.d+"<br><span style='opacity:.65'>"+bandLabel(c.band)+"</span></td></tr>";}
 panel.innerHTML="<span class='close' id='pc'>PUT DOWN</span><h2>SCHEDULE \u2014 OPEN SHOW</h2>"+
 "<p>Blooms are banded on the greatest width across the bloom, measured at its widest point, callipers held flat and not tipped. There is no rounding.</p>"+
 "<table><tr><td class='num'>\u2014</td><td>MINIATURE under 115 mm \u00B7 SMALL 115\u2013170 \u00B7 MEDIUM 170\u2013220 \u00B7 LARGE 220\u2013260 \u00B7 GIANT over 260</td></tr>"+
 "<tr><td class='num'>\u2014</td><td>POMPON under 52 mm and globular throughout \u00B7 MINIATURE BALL 52\u201390 \u00B7 BALL 90\u2013115</td></tr>"+
 "<tr><td class='num'>\u2014</td><td>CACTUS: rays revolute for more than half their length. SEMI-CACTUS: revolute for less than half. DECORATIVE: rays broad and flat, margins blunt or slightly involute.</td></tr>"+
 "<tr><td class='num'>\u2014</td><td>A vase is one exhibit. Uniformity is weighed with quality. Blooms to face the front, stems in proportion, plain water, no packing above the rim.</td></tr></table>"+
 "<h2>CLASSES</h2><table>"+rows+"</table><p style='opacity:.6'>Entries close at ten. Judging at ten. Hall to be cleared of exhibitors at five to.</p>";
 panel.style.display="block";
 document.getElementById("pc").onclick=function(){panel.style.display="none";crackle();};
});

/* ---------- loop ---------- */
var last=performance.now();
function loop(now){
 var dt=Math.min(0.1,(now-last)/1000);last=now;
 tick(dt);urnTickAudio(dt);voiceStep(dt);
 ambT-=dt;if(ambT<=0){ambT=13+Math.random()*10;ambientLine();}
 if(!dragging&&mode==="pan"){pan+=vel;vel*=0.92;if(Math.abs(vel)<0.05)vel=0;
  pan=Math.max(-60,Math.min(BENCH_W-W*0.4,pan));}
 if(front)frontT=Math.min(1,frontT+dt*3.2);
 draw();
 requestAnimationFrame(loop);
}
resize();
say("Right \u2014 you've got the schedule, I've got these two. Press any vase and I'll bring it to the front.");
say("Callipers flat on the bloom. Turn it until you find the widest across; the handy width isn't the width.");
requestAnimationFrame(loop);
console.log("%c211 vases benched \u00B7 34 classes \u00B7 boiler lit at seven","font:12px monospace");
console.log("no bloom on this bench stores a form. it stores florets. ask it again in ten minutes and it may answer differently.");
