  <meta name="outbox-spec-format" content="The entire viewport IS the projected wall behind the band — one huge live oil-and-water 'wet show' thrown edge to edge and slightly out of focus, no ballroom furniture, no band, no chrome, just the projection. Immiscible colored oil beads up into glowing amoeba-blobs floating on a backlit water field; they genuinely heave, bulge, split, drift, and merge under a real metaball fluid sim every frame, blooming outward from the hot center and thinning at the cool black rim, so the wall breathes and re-forms and never once repeats. It is a real physics field, not a canned loop. No page chrome, no header, no menu, no captions, no controls, no text anywhere except one tiny stamp in the corner.">
  <meta name="outbox-spec-subject" content="The plain physics of a liquid light show and nothing else — that oil and water flatly refuse to mix, so a few drops of tinted oil bead up into fat lenses riding on the water skin, and the projector's hot lamp underneath drives convection that makes those beads heave, bulge, pinch off smaller beads, and swim into one another and merge; press the glass and the blobs flee that warm spot, tilt the dish and they all slide downhill and pool. The read of it: how two blobs of the same oil flow together into one bigger blob when they touch but two colors sit shouldered up against each other along a bright seam, how heat from the center makes everything bloom outward while the cooling rim lets it thicken and slow, how the whole projected field is just surface tension and a hot lamp made enormous on a wall. Not a metaphor for consciousness or the '60s or altered states or anything at all — literally colored oil, water that won't take it, a hot bulb, and the pulsing amoeba-light that falls out of the three of them.">

<title>The Wet Show — Oil Won't Take the Water</title>
<style>
  html,body{margin:0;height:100%;background:#0a0410;overflow:hidden;}
  #wall{
    position:fixed;inset:0;width:100vw;height:100vh;display:block;
    filter:blur(3px) saturate(1.25) brightness(1.05);
    image-rendering:auto;
  }
  .corner{
    position:fixed;z-index:10;pointer-events:none;
    font-family:"Courier New",monospace;
    color:#f5cf9a;opacity:.55;
    letter-spacing:.18em;font-size:10px;
    text-shadow:0 0 6px rgba(0,0,0,.9);
    user-select:none;
  }
  #stamp{top:14px;left:16px;}
  #tally{bottom:14px;left:16px;}
  #back{
    position:fixed;z-index:10;bottom:14px;right:16px;
    font-family:"Courier New",monospace;font-size:10px;
    letter-spacing:.18em;color:#e0a0c6;opacity:.45;
    text-decoration:none;text-shadow:0 0 6px rgba(0,0,0,.9);
  }
  #back:hover{opacity:.85;color:#12c2e9;}
</style>

<body>
<canvas id="wall"></canvas>
<div id="stamp" class="corner">GLASSWING LIGHTS &nbsp;&middot;&nbsp; REEL 12</div>
<div id="tally" class="corner">SETS RUN ON THIS WALL: 0</div>
<a id="back" href="/archive">&larr; the other reels</a>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('wall');
  var ctx = canvas.getContext('2d');

  // small offscreen field buffer — we throw it huge and slightly out of focus
  var buf = document.createElement('canvas');
  var bctx = buf.getContext('2d');
  var imgData, data, bw, bh, cx, cy, maxD, rimDist;
  var BUF_MAX = 160;

  var W = 0, H = 0;

  // ---- the oil beads ----
  // col: 0 magenta, 1 cyan, 2 chartreuse
  var COLS = [
    [224, 33, 138],  // #e0218a
    [18, 194, 233],  // #12c2e9
    [198, 242, 78]   // #c6f24e
  ];
  var GOLD = [245,166,35], RIM=[10,4,16];
  var blobs = [];

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function pickCol(){
    var r = Math.random();
    if(r < 0.42) return 0;      // magenta plentiful
    if(r < 0.82) return 1;      // cyan plentiful
    return 2;                    // chartreuse threads through
  }

  function spawnBlob(nearCenter){
    var ang = rnd(0, Math.PI*2);
    var r = nearCenter ? rnd(0.05,0.18)*maxD : rnd(0.1,0.55)*maxD;
    var x = cx + Math.cos(ang)*r;
    var y = cy + Math.sin(ang)*r;
    var rad = rnd(9, 20);
    blobs.push({
      x:x, y:y,
      vx:Math.cos(ang)*rnd(0.1,0.5),
      vy:Math.sin(ang)*rnd(0.1,0.5),
      r:rad, col:pickCol()
    });
  }

  function initBlobs(){
    blobs = [];
    for(var i=0;i<15;i++) spawnBlob(false);
  }

  // ---- pointer: a warm thumb on the glass ----
  var press = {x:0,y:0,active:false};
  var pulseGlow = 0;

  function setPress(clientX, clientY){
    var rect = canvas.getBoundingClientRect();
    press.x = (clientX-rect.left)/rect.width * bw;
    press.y = (clientY-rect.top)/rect.height * bh;
    press.active = true;
  }

  window.addEventListener('pointermove', function(e){ setPress(e.clientX,e.clientY); });
  window.addEventListener('pointerdown', function(e){ setPress(e.clientX,e.clientY); });
  window.addEventListener('pointerup', function(){ press.active=false; });
  window.addEventListener('pointerleave', function(){ press.active=false; });
  window.addEventListener('touchmove', function(e){
    if(e.touches.length){ setPress(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, {passive:false});
  window.addEventListener('touchend', function(){ press.active=false; });

  // ---- spacebar: pulse to the downbeat, one hard convective throb ----
  function throb(){
    pulseGlow = 1;
    for(var i=0;i<blobs.length;i++){
      var b = blobs[i];
      var dx = b.x-cx, dy = b.y-cy;
      var d = Math.sqrt(dx*dx+dy*dy)||0.001;
      var f = 2.2*(1 - Math.min(d/maxD,0.9));
      b.vx += (dx/d)*f;
      b.vy += (dy/d)*f;
    }
  }
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' || e.key===' '){ e.preventDefault(); throb(); }
  });
  // a tap on the wall also throbs (phones)
  window.addEventListener('touchstart', function(){ throb(); });

  // ---- physics: surface tension, convection, merge, split ----
  var CONV = 0.055, DAMP = 0.905, SWIRL = 0.012, MAXR = 30;

  function step(){
    var i, b;
    // integrate
    for(i=0;i<blobs.length;i++){
      b = blobs[i];
      var dx = b.x-cx, dy = b.y-cy;
      var d = Math.sqrt(dx*dx+dy*dy)||0.001;
      var nx=dx/d, ny=dy/d;
      // hot centre pushes outward; cool rim pulls it back to recirculate
      var push = CONV*(1 - d/rimDist);
      b.vx += nx*push;  b.vy += ny*push;
      // gentle blooming rotation
      b.vx += -ny*SWIRL; b.vy += nx*SWIRL;
      // heat rises a touch
      b.vy -= 0.006;
      // restless jitter — never holds a shape a second
      b.vx += (Math.random()-0.5)*0.05;
      b.vy += (Math.random()-0.5)*0.05;

      // the warm thumb: blobs flee the pressed spot
      if(press.active){
        var px = b.x-press.x, py = b.y-press.y;
        var pd = Math.sqrt(px*px+py*py)||0.001;
        var R = bw*0.20;
        if(pd < R){
          var f = 0.9*(1 - pd/R);
          b.vx += (px/pd)*f;
          b.vy += (py/pd)*f;
        }
      }

      b.vx *= DAMP; b.vy *= DAMP;
      b.x += b.vx; b.y += b.vy;

      // soft walls
      var m = b.r*0.4;
      if(b.x < m){ b.x=m; b.vx*=-0.4; }
      if(b.x > bw-m){ b.x=bw-m; b.vx*=-0.4; }
      if(b.y < m){ b.y=m; b.vy*=-0.4; }
      if(b.y > bh-m){ b.y=bh-m; b.vy*=-0.4; }
    }

    // MERGE: two beads of the same oil flow together into one bigger bead
    for(i=0;i<blobs.length;i++){
      var a = blobs[i];
      if(!a) continue;
      for(var j=i+1;j<blobs.length;j++){
        var c = blobs[j];
        if(!c || c.col!==a.col) continue;
        var ddx=a.x-c.x, ddy=a.y-c.y;
        var dist=Math.sqrt(ddx*ddx+ddy*ddy);
        if(dist < (a.r+c.r)*0.72){
          var ar=a.r*a.r, cr=c.r*c.r;
          var tot=ar+cr;
          a.x=(a.x*ar+c.x*cr)/tot;
          a.y=(a.y*ar+c.y*cr)/tot;
          a.vx=(a.vx*ar+c.vx*cr)/tot;
          a.vy=(a.vy*ar+c.vy*cr)/tot;
          a.r=Math.sqrt(tot);
          blobs[j]=null;
        }
      }
    }
    for(i=blobs.length-1;i>=0;i--){ if(!blobs[i]) blobs.splice(i,1); }

    // SPLIT: a fat lens stretched thin pinches off a smaller bead
    for(i=0;i<blobs.length;i++){
      b=blobs[i];
      if(b.r>MAXR && Math.random()<0.03){
        var na=(b.r*b.r)/2;
        var nr=Math.sqrt(na);
        b.r=nr;
        var ang=rnd(0,Math.PI*2);
        blobs.push({
          x:b.x+Math.cos(ang)*nr, y:b.y+Math.sin(ang)*nr,
          vx:b.vx+Math.cos(ang)*0.6, vy:b.vy+Math.sin(ang)*0.6,
          r:nr, col:b.col
        });
        b.vx -= Math.cos(ang)*0.6; b.vy -= Math.sin(ang)*0.6;
      }
    }

    // the lamp keeps feeding fresh beads up from the hot centre
    if(blobs.length < 12) spawnBlob(true);
    while(blobs.length > 26){ blobs.pop(); }

    if(pulseGlow>0.001) pulseGlow*=0.93; else pulseGlow=0;
  }

  // ---- render the field as glowing additive metaballs ----
  function smooth(a,bv,x){
    var t=(x-a)/(bv-a);
    if(t<0)t=0; else if(t>1)t=1;
    return t*t*(3-2*t);
  }

  var t0 = performance.now();
  function render(){
    var n = blobs.length;
    var bx=new Float32Array(n), by=new Float32Array(n), br2=new Float32Array(n);
    var bc=new Uint8Array(n);
    for(var i=0;i<n;i++){ bx[i]=blobs[i].x; by[i]=blobs[i].y; br2[i]=blobs[i].r*blobs[i].r; bc[i]=blobs[i].col; }

    var basePulse = 0.9 + 0.08*Math.sin((performance.now()-t0)*0.0009) + pulseGlow*0.9;

    var Mr=COLS[0][0],Mg=COLS[0][1],Mb=COLS[0][2];
    var Cr=COLS[1][0],Cg=COLS[1][1],Cb=COLS[1][2];
    var Gr=COLS[2][0],Gg=COLS[2][1],Gb=COLS[2][2];
    var K=0.82;

    var idx=0;
    for(var py=0; py<bh; py++){
      var dyc=py-cy;
      for(var px=0; px<bw; px++){
        var fm=0,fc=0,fg=0;
        for(var k=0;k<n;k++){
          var dx=px-bx[k], dy=py-by[k];
          var d2=dx*dx+dy*dy;
          var v=br2[k]/(d2+0.7);
          var col=bc[k];
          if(col===0) fm+=v; else if(col===1) fc+=v; else fg+=v;
        }
        // hot gold backlight blooming from centre, thinning to black rim
        var dxc=px-cx;
        var dn=Math.sqrt(dxc*dxc+dyc*dyc)/maxD;
        var glow=1-dn; if(glow<0)glow=0;
        var back=basePulse*Math.pow(glow,1.4);
        if(back>1.25)back=1.25;
        var R=RIM[0]+(GOLD[0]-RIM[0])*back;
        var G=RIM[1]+(GOLD[1]-RIM[1])*back;
        var B=RIM[2]+(GOLD[2]-RIM[2])*back;

        // beads glow translucent; overlaps bloom brighter (additive)
        var em=smooth(0.7,2.2,fm)*K;
        var ec=smooth(0.7,2.2,fc)*K;
        var eg=smooth(0.7,2.2,fg)*K;
        R += em*Mr + ec*Cr + eg*Gr;
        G += em*Mg + ec*Cg + eg*Gg;
        B += em*Mb + ec*Cb + eg*Gb;

        if(R>255)R=255; if(G>255)G=255; if(B>255)B=255;
        data[idx]=R; data[idx+1]=G; data[idx+2]=B; data[idx+3]=255;
        idx+=4;
      }
    }
    bctx.putImageData(imgData,0,0);
    ctx.drawImage(buf,0,0,bw,bh,0,0,W,H);
  }

  function loop(){
    step();
    render();
    requestAnimationFrame(loop);
  }

  // ---- sizing ----
  function resize(){
    var oldbw=bw, oldbh=bh;
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W; canvas.height=H;
    var scale=BUF_MAX/Math.max(W,H);
    bw=Math.max(40,Math.round(W*scale));
    bh=Math.max(40,Math.round(H*scale));
    buf.width=bw; buf.height=bh;
    imgData=bctx.createImageData(bw,bh);
    data=imgData.data;
    var ncx=bw/2, ncy=bh*0.5;
    var nmaxD=Math.sqrt(ncx*ncx+ncy*ncy);
    if(oldbw && blobs.length){
      var sx=bw/oldbw, sy=bh/oldbh;
      for(var i=0;i<blobs.length;i++){
        blobs[i].x*=sx; blobs[i].y*=sy;
        blobs[i].r*= (sx+sy)/2;
      }
    }
    cx=ncx; cy=ncy; maxD=nmaxD; rimDist=maxD*0.8;
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    if(!blobs.length) initBlobs();
  }

  // ---- persistent tally: only ever counts up, once per load ----
  try{
    var key='glasswing_wetshow_sets';
    var n=parseInt(localStorage.getItem(key)||'0',10);
    if(isNaN(n)||n<0) n=0;
    n+=1;
    localStorage.setItem(key,String(n));
    document.getElementById('tally').textContent='SETS RUN ON THIS WALL: '+n;
  }catch(e){
    document.getElementById('tally').textContent='SETS RUN ON THIS WALL: 1';
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);

  // for the curious poking at the glass:
  console.log('%coil beads up, water refuses it, the bulb underneath is hot — press the wall, or hit space for a throb.', 'color:#e0218a');
})();
</script>
