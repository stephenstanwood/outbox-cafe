<body>
<!-- reference struck at 1046.5 Hz between contestants. cold vestibule, everybody sharp on entry.
     eight cents either side. four and a half hertz. countable if anybody bothers. -->
<div id="band" aria-hidden="true">
  <div class="rule" id="ruleHi"></div>
  <div class="fork" id="ruleRef"></div>
  <div class="rule" id="ruleLo"></div>
</div>
<div id="word" aria-label="one continuous whistled note, spelled"></div>
<button id="pad" aria-label="hold to sustain a note; move up and down to bend it"></button>
<div id="hint">HOLD ANY KEY · MOVE UP AND DOWN TO BEND</div>
<div id="meter"></div>
<footer><a href="/archive">the rest of the morning&rsquo;s sheets</a></footer>

<script>
(function(){
"use strict";

/* ---------- the reference ---------- */
var REF = 1046.502;          /* C6, struck fresh between contestants */
var TOL_CENTS = 8;           /* tolerance band. ~4.5 Hz at this pitch. */
var LOW_CENTS = -700, HIGH_CENTS = 700;  /* working range of the trace */

/* ---------- vowel ladder: low to high ---------- */
/* oo -> ooh -> oh -> uh -> eh -> ee   (h is a passing letter, not a vowel band) */
var LADDER = [
  {c:-700,l:"o"},{c:-520,l:"o"},{c:-400,l:"o"},
  {c:-260,l:"h"},{c:-150,l:"u"},{c:-40,l:"u"},
  {c:40,l:"e"},{c:150,l:"e"},{c:300,l:"i"},{c:460,l:"e"},{c:700,l:"e"}
];
function vowelFor(cents){
  /* honest mapping: frequency in cents against reference -> one letter */
  if(cents < -430) return "o";
  if(cents < -230) return "o";
  if(cents < -95)  return "h";
  if(cents < 20)   return "u";
  if(cents < 150)  return "e";
  if(cents < 330)  return "e";
  return "i";
}
/* second-order spelling: which of the doubled forms.  oo / oh / uh / eh / ee / ii */
function pairFor(cents){
  if(cents < -430) return ["o","o"];
  if(cents < -230) return ["o","o"];
  if(cents < -95)  return ["o","h"];
  if(cents < 20)   return ["u","h"];
  if(cents < 150)  return ["e","h"];
  if(cents < 330)  return ["e","e"];
  return ["i","i"];
}

/* ---------- the word ---------- */
var wordEl = document.getElementById("word");
var meterEl = document.getElementById("meter");
var hintEl = document.getElementById("hint");
var padEl = document.getElementById("pad");
var ruleHi = document.getElementById("ruleHi");
var ruleLo = document.getElementById("ruleLo");
var ruleRef= document.getElementById("ruleRef");

var chars = [];              /* {l, amp, out} */
var MAXCHARS = 26000;        /* the word only grows; this is only a DOM ceiling */
var pending = "";            /* buffered emission */
var lastLetter = null;
var runLen = 0;

/* the single capital G — position fixed the moment the page loads, and only that.
   it is a letter in the word. it does not mean anything. */
var G_AT = 340 + Math.floor(Math.random()*1);  /* placeholder, set below */
(function(){
  var seedKey = "vestibule.g";
  var s = null;
  try { s = window.localStorage.getItem(seedKey); } catch(e){}
  if(s === null || isNaN(parseInt(s,10))){
    s = String(210 + Math.floor(Math.random()*900));
    try { window.localStorage.setItem(seedKey, s); } catch(e){}
  }
  G_AT = parseInt(s,10);
})();
var gPlaced = false;

/* ---------- oscillator model ---------- */
var state = {
  active:false,
  t0:0,                  /* phrase start, seconds */
  base:0,                /* cents at attack, set by cursor Y */
  target:0,              /* cents commanded by cursor Y right now */
  cur:0,                 /* smoothed cents */
  amp:0,
  vibPhase:0,
  vibRate:5.4,           /* cycles per second — diaphragm */
  vibDepth:0,            /* cents, peak */
  drySharp:0,            /* accumulated mouth-drying, cents */
  supportSag:0,          /* breath support decay, cents flat */
  phraseLen:0,
  entryChill:0           /* cold vestibule: everybody sharp on entry */
};

/* ---------- audio ---------- */
var AC=null, refOsc=null, refGain=null, toneOsc=null, toneGain=null, noiseSrc=null, noiseGain=null, toneFilt=null;
var audioReady=false;
function ensureAudio(){
  if(audioReady) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  try{
    AC = new Ctx();
  }catch(e){ return; }
  /* the fork, struck and held soft so the beat is countable */
  refGain = AC.createGain(); refGain.gain.value = 0.0; refGain.connect(AC.destination);
  refOsc = AC.createOscillator(); refOsc.type="sine"; refOsc.frequency.value = REF;
  refOsc.connect(refGain); refOsc.start();

  toneGain = AC.createGain(); toneGain.gain.value = 0.0;
  toneFilt = AC.createBiquadFilter(); toneFilt.type="lowpass"; toneFilt.frequency.value=4200;
  toneOsc = AC.createOscillator(); toneOsc.type="sine"; toneOsc.frequency.value = REF;
  toneOsc.connect(toneFilt); toneFilt.connect(toneGain); toneGain.connect(AC.destination);
  toneOsc.start();

  /* a trace of breath noise — a whistle is a mouth, it leaks */
  var len = AC.sampleRate * 2;
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1)*0.5; }
  noiseSrc = AC.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  var nf = AC.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=2600; nf.Q.value=1.1;
  noiseGain = AC.createGain(); noiseGain.gain.value = 0.0;
  noiseSrc.connect(nf); nf.connect(noiseGain); noiseGain.connect(AC.destination);
  noiseSrc.start();
  audioReady = true;
}
function resumeAudio(){
  ensureAudio();
  if(AC && AC.state === "suspended"){ AC.resume().catch(function(){}); }
}
function strikeFork(){
  if(!audioReady||!AC) return;
  var t = AC.currentTime;
  refGain.gain.cancelScheduledValues(t);
  refGain.gain.setValueAtTime(refGain.gain.value, t);
  refGain.gain.linearRampToValueAtTime(0.075, t+0.012);
  refGain.gain.exponentialRampToValueAtTime(0.010, t+2.6);
}

/* ---------- geometry: where the vermilion rules sit ---------- */
function layoutBand(){
  var h = window.innerHeight;
  function yFor(cents){
    /* top of viewport = HIGH_CENTS, bottom = LOW_CENTS */
    var f = (HIGH_CENTS - cents) / (HIGH_CENTS - LOW_CENTS);
    return Math.round(f*h);
  }
  ruleHi.style.top = yFor(TOL_CENTS)+"px";
  ruleLo.style.top = yFor(-TOL_CENTS)+"px";
  ruleRef.style.top = yFor(0)+"px";
}
window.addEventListener("resize", layoutBand);

function centsFromY(y){
  var h = window.innerHeight || 1;
  var f = 1 - (y/h);
  return LOW_CENTS + f*(HIGH_CENTS-LOW_CENTS);
}

/* ---------- emission ---------- */
var EMIT_HZ = 34;                 /* characters per second of held note */
var emitAcc = 0;
var lastFrame = 0;

function pushChar(letter, amp, outside){
  chars.push({l:letter, a:amp, o:outside});
  if(chars.length > MAXCHARS){ chars.splice(0, 4000); gPlaced = gPlaced; }
}

/* build spans in batches so the word keeps growing without re-rendering everything */
var rendered = 0;
var curSpan = null, curKey = "";
function flushRender(){
  while(rendered < chars.length){
    var c = chars[rendered];
    var idx = rendered;
    rendered++;
    var w, sz, col;
    var a = c.a;
    /* amplitude drives weight and size, honestly */
    if(a > 0.80){ w=800; sz=1.32; col="#0f2050"; }
    else if(a > 0.62){ w=700; sz=1.18; col="#14306e"; }
    else if(a > 0.44){ w=600; sz=1.06; col="#1d3f8f"; }
    else if(a > 0.28){ w=400; sz=0.96; col="#3d5da5"; }
    else if(a > 0.15){ w=300; sz=0.88; col="#6c85bd"; }
    else { w=300; sz=0.80; col="#8fa4cf"; }
    if(c.o){ col = "#c4331e"; }
    var letter = c.l;
    if(!gPlaced && idx === G_AT){ letter = "G"; gPlaced = true; }
    var key = w+"|"+sz+"|"+col;
    if(key !== curKey){
      curSpan = document.createElement("span");
      curSpan.style.fontWeight = w;
      curSpan.style.fontSize = sz.toFixed(2)+"em";
      curSpan.style.color = col;
      wordEl.appendChild(curSpan);
      curKey = key;
    }
    curSpan.appendChild(document.createTextNode(letter));
  }
}

/* ---------- the compulsory: a running thirty-second model ---------- */
function updateModel(dt, now){
  if(state.active){
    var el = now - state.t0;
    state.phraseLen = el;

    /* cursor bend, smoothed the way a jaw actually moves */
    var k = 1 - Math.exp(-dt*9.0);
    state.cur += (state.target - state.cur)*k;

    /* cold vestibule entry: sharp on attack, settles over the first two seconds */
    state.entryChill = 9 * Math.exp(-el/1.4);

    /* mouth dries. past twenty seconds, ~2 cents a second, honestly. */
    if(el > 20){ state.drySharp = (el-20)*2.0; }
    else { state.drySharp = Math.max(0, (el-9)*0.28); }

    /* breath support falls off. the last four seconds is where the round is decided. */
    if(el > 24){
      var s = (el-24);
      state.supportSag = s*s*1.55;
    } else { state.supportSag = 0; }

    /* amplitude: confident attack, a long hold, a thin end */
    var amp;
    if(el < 0.18) amp = el/0.18;
    else if(el < 19) amp = 0.94 - (el-0.18)*0.008;
    else if(el < 26) amp = 0.79 - (el-19)*0.030;
    else amp = Math.max(0.10, 0.58 - (el-26)*0.115);
    state.amp = amp;

    /* vibrato: diaphragm. it enters after the note settles and widens as the support goes. */
    var depth;
    if(el < 1.6) depth = 0;
    else if(el < 22) depth = Math.min(11, (el-1.6)*2.4);
    else depth = 11 + (el-22)*2.6;
    state.vibDepth = depth;
    state.vibRate = 5.4 + (el>24 ? (el-24)*0.42 : 0) - (el>27 ? (el-27)*0.9 : 0);
    if(state.vibRate < 3.1) state.vibRate = 3.1;
    state.vibPhase += dt * state.vibRate * Math.PI*2;

    if(el >= 30){ endPhrase(true); }
  }
}

function instantCents(){
  var vib = Math.sin(state.vibPhase) * state.vibDepth;
  /* a hard edge on a throat wobble would print as a spike; this one is round. */
  return state.cur + state.entryChill + state.drySharp - state.supportSag + vib;
}

function centsToHz(c){ return REF * Math.pow(2, c/1200); }

/* ---------- run-length spelling ---------- */
var bandHold = 0;
var lastBand = null;
var pairToggle = 0;

function emitOne(){
  var c = instantCents();
  var pr = pairFor(c);
  var band = pr[0]+pr[1];
  if(band !== lastBand){ lastBand = band; bandHold = 0; pairToggle = 0; }
  bandHold++;
  /* long clean runs when the pitch sits; the pair alternates only on the boundary of a band,
     so a churning unsteady note prints alternating letters and a steady one prints one letter */
  var letter;
  if(bandHold <= 2){ letter = pr[0]; }
  else { letter = pr[1] === pr[0] ? pr[0] : (bandHold % 7 === 0 ? pr[1] : pr[0]); }
  /* h shows where the tone thins to breath */
  if(state.amp < 0.17 && Math.random() < 0.42) letter = "h";
  var outside = Math.abs(c) > TOL_CENTS;
  pushChar(letter, state.amp, outside);
}

/* ---------- audio follow ---------- */
function updateAudio(){
  if(!audioReady||!AC) return;
  var t = AC.currentTime;
  if(state.active){
    var hz = centsToHz(instantCents());
    toneOsc.frequency.setTargetAtTime(hz, t, 0.012);
    toneGain.gain.setTargetAtTime(0.085*state.amp, t, 0.03);
    noiseGain.gain.setTargetAtTime(0.0055*state.amp + (state.amp<0.3?0.004:0), t, 0.05);
    toneFilt.frequency.setTargetAtTime(Math.min(9000, hz*3.4), t, 0.05);
  } else {
    toneGain.gain.setTargetAtTime(0.0, t, 0.05);
    noiseGain.gain.setTargetAtTime(0.0, t, 0.08);
  }
}

/* ---------- phrase control ---------- */
function startPhrase(){
  if(state.active) return;
  resumeAudio();
  strikeFork();
  var now = performance.now()/1000;
  state.active = true;
  state.t0 = now;
  state.cur = state.target;
  state.base = state.target;
  state.vibPhase = 0;
  state.vibDepth = 0;
  state.drySharp = 0;
  state.supportSag = 0;
  state.entryChill = 9;
  lastBand = null;
  if(hintEl){ hintEl.style.opacity = "0"; }
}
function endPhrase(){
  if(!state.active) return;
  state.active = false;
  state.amp = 0;
  state.phraseLen = 0;
  lastBand = null;
  if(audioReady && AC){
    var t = AC.currentTime;
    refGain.gain.cancelScheduledValues(t);
    refGain.gain.setValueAtTime(refGain.gain.value, t);
    refGain.gain.exponentialRampToValueAtTime(0.0005, t+0.9);
  }
}

/* ---------- input ---------- */
var heldKeys = 0;
window.addEventListener("keydown", function(e){
  if(e.repeat) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key === "Tab") return;
  e.preventDefault();
  heldKeys++;
  startPhrase();
}, {passive:false});
window.addEventListener("keyup", function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  heldKeys = Math.max(0, heldKeys-1);
  if(heldKeys === 0) endPhrase();
});
window.addEventListener("blur", function(){ heldKeys=0; endPhrase(); });

window.addEventListener("mousemove", function(e){
  state.target = centsFromY(e.clientY);
});
padEl.addEventListener("mousedown", function(e){
  e.preventDefault();
  state.target = centsFromY(e.clientY);
  startPhrase();
});
window.addEventListener("mouseup", function(){
  if(heldKeys===0) endPhrase();
});
padEl.addEventListener("touchstart", function(e){
  e.preventDefault();
  var t = e.touches[0];
  state.target = centsFromY(t.clientY);
  startPhrase();
}, {passive:false});
padEl.addEventListener("touchmove", function(e){
  e.preventDefault();
  var t = e.touches[0];
  state.target = centsFromY(t.clientY);
}, {passive:false});
padEl.addEventListener("touchend", function(e){
  e.preventDefault();
  endPhrase();
}, {passive:false});
padEl.addEventListener("touchcancel", function(){ endPhrase(); });

/* ---------- the note already running when you walk in ---------- */
/* somebody is mid-compulsory. the word starts with theirs. */
function seedRun(){
  var c = -140;
  var vp = 0;
  var t = 0;
  var n = 1500;
  var savedBand = null, hold=0;
  for(var i=0;i<n;i++){
    t += 1/EMIT_HZ;
    var el = (t % 31.5);
    var entry = 9*Math.exp(-el/1.4);
    var dry = el>20 ? (el-20)*2.0 : Math.max(0,(el-9)*0.28);
    var sag = el>24 ? (el-24)*(el-24)*1.55 : 0;
    var depth = el<1.6?0:(el<22? Math.min(11,(el-1.6)*2.4) : 11+(el-22)*2.6);
    var rate = 5.4 + (el>24?(el-24)*0.42:0);
    vp += (1/EMIT_HZ)*rate*Math.PI*2;
    var base = -140 + Math.sin(t*0.21)*26 + Math.sin(t*0.07)*14;
    var cc = base + entry + dry - sag + Math.sin(vp)*depth;
    var amp;
    if(el<0.18) amp = el/0.18;
    else if(el<19) amp = 0.94-(el-0.18)*0.008;
    else if(el<26) amp = 0.79-(el-19)*0.030;
    else amp = Math.max(0.10, 0.58-(el-26)*0.115);
    var pr = pairFor(cc);
    var band = pr[0]+pr[1];
    if(band!==savedBand){ savedBand=band; hold=0; }
    hold++;
    var letter;
    if(hold<=2) letter = pr[0];
    else letter = pr[1]===pr[0] ? pr[0] : (hold%7===0 ? pr[1] : pr[0]);
    if(amp<0.17 && ((i*7919)%100)<42) letter="h";
    pushChar(letter, amp, Math.abs(cc)>TOL_CENTS);
  }
}

/* ---------- meter ---------- */
var meterTick = 0;
function updateMeter(){
  var c = state.active ? instantCents() : null;
  if(c === null){
    meterEl.innerHTML = '<span style="color:#8fa4cf">ref 1046.5 &middot; band &plusmn;8&cent; &middot; 4.5 Hz</span>';
    return;
  }
  var hz = centsToHz(c);
  var beat = Math.abs(hz - REF);
  var out = Math.abs(c) > TOL_CENTS;
  var el = state.phraseLen;
  meterEl.innerHTML =
    '<b>' + hz.toFixed(1) + ' Hz</b><br>' +
    '<span class="' + (out?'out':'') + '">' + (c>=0?'+':'') + c.toFixed(1) + '&cent;</span>' +
    ' &middot; beat ' + beat.toFixed(1) + '/s<br>' +
    'vib ' + state.vibRate.toFixed(1) + ' c/s &middot; d ' + state.vibDepth.toFixed(0) + '&cent;<br>' +
    'held ' + el.toFixed(1) + ' / 30.0';
}

/* ---------- loop ---------- */
function frame(ts){
  var now = ts/1000;
  if(!lastFrame) lastFrame = now;
  var dt = Math.min(0.06, now - lastFrame);
  lastFrame = now;

  updateModel(dt, now);

  if(state.active){
    emitAcc += dt*EMIT_HZ;
    var k = 0;
    while(emitAcc >= 1 && k < 20){ emitOne(); emitAcc -= 1; k++; }
  } else {
    emitAcc = 0;
  }

  flushRender();
  updateAudio();
  meterTick++;
  if(meterTick % 4 === 0) updateMeter();

  window.requestAnimationFrame(frame);
}

/* ---------- go ---------- */
layoutBand();
seedRun();
flushRender();
updateMeter();
window.requestAnimationFrame(frame);

/* fade the hint after a while whether or not anybody whistles */
setTimeout(function(){ if(hintEl && !state.active) hintEl.style.opacity="0.35"; }, 9000);

document.addEventListener("visibilitychange", function(){
  if(document.hidden){ heldKeys=0; endPhrase(); }
});

/* the fork is struck between contestants. one click anywhere wakes the audio. */
window.addEventListener("pointerdown", resumeAudio, {once:false});
