  <meta name="outbox-spec-era" content="1997 — the plain amateur home-PC captioning look of a backyard-camcorder VHS someone transferred to their computer and lovingly subtitled themselves: fat centered white caption-cards in a letterboxed black frame, a soft VHS-jitter to the text, a little running timecode ticking in the corner (00:04:12:19), the whole picture-area a permanent black rectangle because the volunteer who made this only ever finished the captions and never the video. Not a lost tape, not a decayed relic, not a 'home movies fade away' elegy — a caption track that plays this minute, cheerful and complete, describing a party you assemble entirely in your head.">
  <meta name="outbox-spec-format" content="The entire viewport IS a letterboxed video frame that is pure black where the picture should be — no picture ever loads, ever — and centered in it, one at a time, fat white closed-caption cards fade up, hold, and fade out in a real timed subtitle track that auto-advances and loops forever, each card describing a SOUND or an OFF-SCREEN happening ([kids shrieking past the camera], [the screen door bangs], [somebody's dog, uninvited]) so that a whole warm backyard birthday party genuinely assembles itself in the visitor's head purely from the captions, while the rectangle where the video would be stays flatly, cheerfully black the entire time. Clicking anywhere HOLDS the current caption on screen (a freeze-frame of a frame that isn't there) until you click again to let the party roll on. No chrome, no header, no menu, no controls but the timecode in the corner — just the black frame, the white cards, and the party you never see.">
  <meta name="outbox-spec-subject" content="The descriptive closed-captions for a Saturday-afternoon backyard 8th-birthday party — Delia's, the volunteer keeps letting slip — captioned by a warm, hopelessly-invested woman who was only supposed to transcribe the sounds for the hard-of-hearing but cannot stop editorializing: naming who's who ([Grandpa Reuel laughing — he's the loudest, he always is]), calling the shots ([the piñata — third swing — she's got it, oh she's GOT it]), narrating the cake (chocolate, she made it herself, you can tell), the sprinkler someone turns on early, the one cousin who cries at the candles, the dad on the fold-out chair who falls asleep by 00:31. The whole party is real and complete and happening; you just never get the picture, only her captions of it, and by the end you'd know that yard anywhere.">
  <meta name="outbox-spec-tone" content="The warm, chatty, hopelessly-over-sharing voice of the volunteer captioner herself, breaking every rule of professional captioning because she can't help it — she's supposed to type only what a deaf viewer needs ([applause], [laughter], [dog barking]) but keeps folding in who it is and what it means and how she feels about it ([applause — that's for Delia blowing all eight, first try, bless her]), gossiping in the brackets, defending the sleepy dad, gently narrating the boy who spills his pop. Present-tense, generous, delighted, a little unable to stop, genuinely tickled you sat down to watch a party that has no picture. Never wistful, never precious, never 'these were simpler times' — the sprinkler's on, the cake's cut, and she is having the time of her life describing it to you.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Warm caption-cream white (#f2ead6) for the fat centered subtitle cards, dropped on true letterbox black (#080808) with the faint charcoal seam of the top-and-bottom bars (#141414), a soft VHS-blue for the running timecode ticking in the corner (#5a7fa8), and one warm sodium-porchlight amber (#e0a24c) bleeding very faintly into the black lower edge as the captioned afternoon tips toward evening — the exact plain look of homemade white-on-black VHS captions, a little jittery, dropped over a picture that never comes.">
  <meta name="outbox-spec-wildcard" content="Exactly one caption in the loop is [ SILENCE ] — the single stretch where the camcorder mic caught nothing and the captioner honestly had nothing to bracket — and it holds noticeably longer than any other card, a long quiet beat of white letters on black, before the very next card lets the party crash back in ([— and there they all go again]). It is never explained, never marked by the timecode differently, never repeated elsewhere; it is just the one held breath in the middle of a loud afternoon.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'home movies are lost / fade / nobody keeps tapes anymore' decline narrative — this is a cheerful complete caption track playing right now of a party in full swing, not a decayed or grieved-over relic. NO archival / museum / cabinet / drawer / vault / estate-sale framing of the tape or the captions. NO cryptic-SCP / ominous / 'the video should not be watched' / uncanny-missing-footage dread about the black frame — the picture just isn't finished, and that's fine and funny, not sinister. NO signal / transmission / broadcast / feed / channel / frequency framing of the captions or the timecode — it is a homemade caption file over a home tape, not a signal. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism as the PAGE's voice — the captions are bracketed fragments by nature, but the captioner inside the brackets is a warm full-sentence human, and the piece must never read as cold hyperminimalism. NO dry deadpan understatement. She is delighted and present and the sprinkler is on.">

<title>Delia's, in the Yard — Captioned by Someone Who Was There</title>
<!--
  the picture never gets finished. that's alright.
  she only ever meant to type the sounds for the folks who couldn't hear them,
  and then she couldn't stop. you'd know that yard anywhere by the end.
  (chocolate cake. she made it herself. you can tell.)
-->
<style>
  :root{
    --cream:#f2ead6;
    --black:#080808;
    --bar:#141414;
    --vhsblue:#5a7fa8;
    --amber:#e0a24c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--black);overflow:hidden;}
  body{
    font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    color:var(--cream);
    cursor:pointer;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* the whole viewport is the frame; letterbox bars top and bottom */
  #frame{
    position:fixed;inset:0;
    background:var(--black);
    overflow:hidden;
  }
  .bar{
    position:absolute;left:0;right:0;height:9vh;
    background:var(--bar);
    z-index:3;
  }
  #barTop{top:0;box-shadow:0 1px 0 #1c1c1c, 0 2px 6px rgba(0,0,0,.8);}
  #barBot{bottom:0;box-shadow:0 -1px 0 #1c1c1c, 0 -2px 6px rgba(0,0,0,.8);}

  /* sodium porchlight bleeding into the lower edge as it tips to evening */
  #amberBleed{
    position:absolute;left:0;right:0;bottom:0;height:40vh;
    background:radial-gradient(120% 100% at 50% 130%, var(--amber) 0%, rgba(224,162,76,0.35) 30%, rgba(224,162,76,0) 62%);
    opacity:0;pointer-events:none;z-index:1;mix-blend-mode:screen;
  }

  /* faint vignette so the black has a little depth */
  #vign{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(130% 120% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* the caption card, fat and centered */
  #capWrap{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:4;padding:14vh 6vw;pointer-events:none;
  }
  #cap{
    max-width:900px;
    font-weight:700;
    font-size:clamp(1.35rem,4.6vw,2.9rem);
    line-height:1.28;
    text-align:center;
    color:var(--cream);
    text-shadow:0 0 2px rgba(242,234,214,.35), 0 1px 0 rgba(0,0,0,.9);
    opacity:0;
    will-change:opacity,transform,filter;
    animation:jitter 2.7s steps(1) infinite;
  }
  #cap.silence{
    letter-spacing:.42em;
    font-size:clamp(1.5rem,5vw,3rem);
  }

  /* the soft VHS wobble on the letters */
  @keyframes jitter{
    0%   {transform:translate(0,0);            filter:none;}
    18%  {transform:translate(0.6px,-0.4px);   filter:none;}
    22%  {transform:translate(-0.7px,0.3px);   filter:blur(.35px);}
    24%  {transform:translate(0.4px,0.4px);    filter:none;}
    55%  {transform:translate(-0.4px,-0.3px);  filter:none;}
    58%  {transform:translate(0.9px,0.5px);    filter:blur(.4px);}
    61%  {transform:translate(-0.3px,0.2px);   filter:none;}
    100% {transform:translate(0,0);            filter:none;}
  }

  /* running timecode, up in the corner, VHS blue */
  #tc{
    position:absolute;top:calc(9vh + 12px);right:16px;
    font-family:"Courier New",Courier,monospace;
    font-weight:700;
    font-size:clamp(.8rem,2.6vw,1.05rem);
    letter-spacing:.06em;
    color:var(--vhsblue);
    text-shadow:0 0 4px rgba(90,127,168,.5);
    z-index:5;
    animation:jitter 2.7s steps(1) infinite;
  }
  /* tally, very small, lower-right */
  #tally{
    position:absolute;bottom:calc(9vh + 10px);right:16px;
    font-family:"Courier New",Courier,monospace;
    font-size:clamp(.58rem,2vw,.72rem);
    letter-spacing:.12em;
    color:rgba(90,127,168,.68);
    z-index:5;text-align:right;
  }

  /* held state: a faint pair of pause bars, and the caption sits still */
  #frame.held #cap{animation:none;}
  #frame.held #tc{animation:none;color:#7d9dc2;}
  #held{
    position:absolute;bottom:calc(9vh + 8px);left:16px;
    z-index:5;opacity:0;transition:opacity .25s;
    color:rgba(90,127,168,.7);
    font-family:"Courier New",Courier,monospace;
    font-size:clamp(.58rem,2vw,.72rem);letter-spacing:.15em;
  }
  #frame.held #held{opacity:1;}

  footer{
    position:absolute;bottom:calc(9vh + 8px);left:50%;transform:translateX(-50%);
    z-index:5;
    font-family:"Courier New",Courier,monospace;
    font-size:clamp(.55rem,1.9vw,.68rem);
    letter-spacing:.1em;
    color:rgba(140,150,160,.34);
    white-space:nowrap;
  }
  footer a{color:rgba(90,127,168,.55);text-decoration:none;border-bottom:1px dotted rgba(90,127,168,.35);}
  footer a:hover{color:var(--amber);border-color:var(--amber);}

  @media (max-height:520px){
    .bar{height:7vh;}
    #capWrap{padding:9vh 5vw;}
  }
</style>
</head>
<body>
<div id="frame">
  <div id="amberBleed"></div>
  <div id="vign"></div>
  <div class="bar" id="barTop"></div>
  <div class="bar" id="barBot"></div>

  <div id="capWrap"><div id="cap"></div></div>

  <div id="tc">00:00:00:00</div>
  <div id="tally">PARTIES WATCHED HERE: 0</div>
  <div id="held">— HELD —</div>

  <footer>tap to hold the frame &nbsp;·&nbsp; <a href="/archive">the rest of the reels</a></footer>
</div>

<script>
(function(){
  "use strict";
  var FPS = 30;

  // her captions, in order, each with its own tape timecode + how long it holds (ms real)
  var CARDS = [
    {tc:"00:00:03:09", hold:4200, text:"[ tape hiss — then the whole yard of it, all at once ]"},
    {tc:"00:00:12:00", hold:4400, text:"[ someone hollers \u201cTESTING\u201d right into the mic \u2014 that\u2019s Marv, he does this every single time ]"},
    {tc:"00:00:28:14", hold:3900, text:"[ the screen door bangs \u2014 here they come ]"},
    {tc:"00:01:05:22", hold:4300, text:"[ kids shrieking past the camera \u2014 all of them, I count six ]"},
    {tc:"00:01:51:07", hold:4200, text:"[ Grandpa Reuel laughing \u2014 he\u2019s the loudest, he always is ]"},
    {tc:"00:02:44:19", hold:4400, text:"[ the sprinkler kicks on \u2014 somebody\u2019s turned it on early, and it isn\u2019t even cake time ]"},
    {tc:"00:04:12:19", hold:4300, text:"[ Delia hollers \u201cIT\u2019S COLD\u201d \u2014 she means the water, she loves it really ]"},
    {tc:"00:05:33:02", hold:3900, text:"[ a dog barking \u2014 somebody\u2019s dog, uninvited, and having a wonderful time ]"},
    {tc:"00:07:08:15", hold:4100, text:"[ paper plates \u2014 the wind takes one, off across the grass, and off two kids go after it ]"},
    {tc:"00:09:19:00", hold:4500, text:"[ the pi\u00f1ata \u2014 third swing \u2014 she\u2019s got it \u2014 oh, she\u2019s GOT it ]"},
    {tc:"00:10:41:11", hold:4200, text:"[ candy everywhere \u2014 and the almighty scramble ]"},
    {tc:"00:12:55:26", hold:4400, text:"[ the boy in the red shirt spills his pop \u2014 it\u2019s alright, honey, it\u2019s only pop ]"},
    {tc:"00:15:02:08", hold:4600, text:"[ here comes the cake \u2014 chocolate, she made it herself, you can tell ]"},
    {tc:"00:16:20:19", hold:9200, text:"[ SILENCE ]", silence:true},
    {tc:"00:16:59:03", hold:4000, text:"[ \u2014 and there they all go again ]"},
    {tc:"00:17:44:12", hold:4600, text:"[ Happy Birthday \u2014 all of it \u2014 every verse, gloriously off-key ]"},
    {tc:"00:19:10:00", hold:4500, text:"[ applause \u2014 that\u2019s for Delia blowing out all eight, first try, bless her ]"},
    {tc:"00:20:33:21", hold:4300, text:"[ one cousin crying \u2014 the candles, they always frighten the little one ]"},
    {tc:"00:22:47:14", hold:4000, text:"[ forks on paper plates \u2014 that lovely racket ]"},
    {tc:"00:26:12:05", hold:4600, text:"[ the dad on the fold-out chair \u2014 out cold \u2014 and honestly, who could blame him ]"},
    {tc:"00:29:40:18", hold:4300, text:"[ the sprinkler again \u2014 the whole pack of them through it now ]"},
    {tc:"00:32:15:00", hold:4500, text:"[ the porch light comes on \u2014 amber over everybody ]"},
    {tc:"00:33:51:11", hold:5200, text:"[ somebody says \u201cagain \u2014 do it again\u201d \u2014 and you know what, let\u2019s ]"}
  ];
  var LOOP_END = "00:34:20:00"; // where the corner drifts to before it wraps home

  function toFrames(s){
    var p = s.split(":").map(Number);
    return (((p[0]*60)+p[1])*60 + p[2])*FPS + p[3];
  }
  function fmt(fr){
    fr = Math.max(0, Math.floor(fr));
    var f = fr % FPS;
    var ts = Math.floor(fr / FPS);
    var s = ts % 60;
    var m = Math.floor(ts/60) % 60;
    var h = Math.floor(ts/3600);
    function p2(n){return (n<10?"0":"")+n;}
    return p2(h)+":"+p2(m)+":"+p2(s)+":"+p2(f);
  }

  var startFrames = CARDS.map(function(c){return toFrames(c.tc);});
  var loopEndFrames = toFrames(LOOP_END);
  var totalFrames = loopEndFrames;

  var capEl   = document.getElementById("cap");
  var tcEl    = document.getElementById("tc");
  var tallyEl = document.getElementById("tally");
  var amberEl = document.getElementById("amberBleed");
  var frameEl = document.getElementById("frame");

  // persistent tally — only ever counts up
  var TKEY = "outbox_delia_parties_watched";
  var tally = 0;
  try{ tally = parseInt(localStorage.getItem(TKEY) || "0", 10) || 0; }catch(e){ tally = 0; }
  function drawTally(){ tallyEl.textContent = "PARTIES WATCHED HERE: " + tally; }
  drawTally();

  var idx = 0;
  var elapsed = 0;          // ms into current card
  var last = null;
  var paused = false;
  var FADE = 620;           // ms fade in / out
  var SILENCE_FADE = 1100;

  function currentFade(){ return CARDS[idx].silence ? SILENCE_FADE : FADE; }

  function setCard(i){
    var c = CARDS[i];
    capEl.textContent = c.text;
    capEl.classList.toggle("silence", !!c.silence);
    capEl.style.opacity = "0";
  }
  setCard(0);

  function opacityFor(t, dur){
    var f = currentFade();
    if(t < f) return t / f;
    if(t > dur - f) return Math.max(0, (dur - t) / f);
    return 1;
  }

  function tick(now){
    if(last === null) last = now;
    var dt = now - last;
    last = now;
    if(dt > 120) dt = 120; // guard against tab-switch jumps

    if(!paused){
      elapsed += dt;
      var card = CARDS[idx];
      var dur = card.hold;

      // caption opacity
      capEl.style.opacity = opacityFor(elapsed, dur).toFixed(3);

      // corner timecode: drift from this card's tape frame toward the next
      var from = startFrames[idx];
      var to   = (idx < CARDS.length - 1) ? startFrames[idx+1] : loopEndFrames;
      var prog = Math.min(1, elapsed / dur);
      var nowFrames = from + (to - from) * prog;
      tcEl.textContent = fmt(nowFrames);

      // amber warms as the afternoon tips toward evening
      amberEl.style.opacity = (0.06 + 0.72 * (nowFrames / totalFrames)).toFixed(3);

      if(elapsed >= dur){
        elapsed = 0;
        idx++;
        if(idx >= CARDS.length){
          // the loop rolls back home to 00:00 — one more party watched
          idx = 0;
          tally++;
          try{ localStorage.setItem(TKEY, String(tally)); }catch(e){}
          drawTally();
        }
        setCard(idx);
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // click anywhere holds the current caption on the frame; click again lets it roll on
  function toggleHold(e){
    if(e.target && e.target.tagName === "A") return; // let the archive link work
    paused = !paused;
    frameEl.classList.toggle("held", paused);
    last = null; // don't accumulate the paused gap
  }
  document.addEventListener("click", toggleHold, {passive:true});
  document.addEventListener("keydown", function(ev){
    if(ev.code === "Space" || ev.key === " "){ ev.preventDefault(); toggleHold({target:null}); }
  });

  // for whoever gets curious enough to open this up
  console.log("%cDelia's, in the yard.", "color:#e0a24c;font-size:15px;font-weight:bold;");
  console.log("%cI only ever finished the captions. Never did get the picture rendered — the boys said it'd take all night and I said, well, the sounds ARE the party, aren't they. And they are. You listen. That's Reuel. You'd know him anywhere.", "color:#5a7fa8;font-style:italic;");
})();
</script>
