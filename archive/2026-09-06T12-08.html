  <meta name="outbox-spec-era" content="11 June 1972, right now — twenty to seven on a warm, gusty evening on a sloping hayfield two miles east of Rensselaer, Indiana, where a four-man crew out of a tent-and-awning yard is two hours into putting up a 40 × 80 pole tent for a farm dispersal auction that starts at nine tomorrow morning. The centre poles are up and guyed slack, the sidewall is still on the truck, the wind has been backing all evening and there is weather forecast out of the west before midnight. The only copy of the manufacturer's erection sheet — one big sheet, printed both sides, folded down to pocket size — has been in the glovebox since 1968, and it has been folded wrong so many times that it is now stiff along the wrong lines and will not go back the way it came. Not a look-back at anything, not a lament, not a memory of anything vanished: forty-seven numbered steps exist, eleven of them are on panels nobody can currently see at the same time as the panels they refer to, and the guys have to be dressed and the sidewall laced before dark.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport, edge to edge, is one large printed sheet that has been FOLDED WRONG, and the misfold is the only navigation and the only content. No header, no menu, no title, no scrollbar, no index, no site chrome of any kind. The sheet is 42 × 60 cm printed both sides and creased into sixteen panels; folded, exactly two of those sixteen panel faces are presented to the visitor at once, at true pocket size, filling the frame — and because the sheet is folded incorrectly, the two panels showing are never adjacent panels and never belong together. Step 31 sits butted up against a guy-line tension table from the other side of the sheet; half a diagram of a pole cap is butted against the tail of a paragraph that begins somewhere the visitor cannot reach. The visitor's entire vocabulary is two hands on paper: DRAG along any crease to open or close that fold, which really refolds the sheet through a real fold-state machine and brings a different mismatched pair to the front; and PRESS AND HOLD on any crease to work it flat, which softens that crease, makes it fold easier forever, and makes its neighbours stiffer. There is no correct state. The engine knows what the correct fold is, and one crease — the long cross fold, which is split about four centimetres in from the edge — physically cannot carry the fold that would produce it, so the sheet can be worked into every one of its other states and never that one, on this visit or any other. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat rigging arithmetic of a 40 × 80 canvas pole tent going up on a slope before weather, and specifically that a tent is not held up by its poles, it is held down by its guys, and everything else follows from that — that the two centre poles carry the load in pure compression and will happily walk right out from under the peak the moment the guy tensions go uneven, so the rule is that every guy on a bail ring is dressed to the same tension before ANY of them is dressed tight, and a crew that tightens one side to look neat has already lost the tent; that a side pole is not a support but a spacer, standing on its pin in the eave line, doing nothing at all until the corresponding guy is taut, which is exactly why a side pole falls over in the middle of the job and is not a fault; that guy angle is the whole calculation and the number is 45 degrees — a stake driven in close to the eave puts most of the guy's pull straight down into the ground and almost none of it outward where the tension is needed, and a stake driven too far out reduces the downward component and lets the pole lift, and neither of those is an opinion, it is the resolution of one force into two; that STAKE HOLDING POWER is a soil question and not a hardware question, since a 42-inch stake in hayfield loam pulls out at a fraction of what the same stake holds in hardpan, and the honest test is a bar and two men leaning on it and not a chart; that stakes are driven leaning AWAY from the tent at about the same angle as the guy so the load is taken along the stake's length and not across it, and a stake driven plumb bends and then walks; that on a slope every stake on the downhill side is carrying more than its share and the whole tent wants to slide, so the uphill guys are set first and the downhill guys are doubled or double-staked, and a tent set square on a slope is set wrong; that ROPE IS NOT WIRE — manila and cotton guys shrink measurably when they get wet, by real percentages, so a tent dressed bar-tight in dry evening air will rip its own grommet line out at two in the morning in rain, and the correct answer is to leave the guys slack enough that a man can get his fist under a dressed guy, which is exactly what every inexperienced crew tightens out; that this is why the guys must be slacked BEFORE the rain and not during it; that canvas itself shrinks, so the same slack rule applies twice; that the sidewall is laced last and is a sail — a fully walled tent in a 40 mph gust carries an enormous lateral load into the same stakes, and the standard answer to a wind warning is to unlace and roll the windward wall, which sounds like giving up and is the entire safety procedure; that the peak load is what tears a top, since water ponding in a slack section between poles gains weight faster than anybody expects and a hundred gallons standing in a bay will pull the pole out of the peak; that grommet and jump-rope spacing exists so that a torn panel tears to the seam and stops; that the pole tent goes up in a fixed order — lay the top out flat and square on the ground first, lace the sections, rig every side pole and stake before ANY centre pole is raised, and raise the centre poles last, because a top raised out of order cannot be squared afterward and has to come all the way down; and the flat arithmetic on the sheet, which is two centre poles, eighteen side poles, thirty-six stakes plus eight doubles on the low corner, forty-seven printed steps, a sale at nine tomorrow, and dark in about ninety minutes.">
  <meta name="outbox-spec-tone" content="The loud, fast, cheerfully exasperated voice of Vonda Kruzelka-Bandy, forty-seven, who runs the counter and the rental book at the yard and drove out with the second truck because the crew chief quit on Thursday and nobody else knows where the stake bar is. Present tense, second person, addressed to whoever is holding the other corner of the sheet while she reads it. She reads printed steps ALOUD OFF THE SHEET, in whatever order the fold happens to present them, and says out loud each time that it is not the one she wants: she is looking for step 23 and she gets 31, then 8, then a tension table, then 31 again. She does not summarise, does not paraphrase and does not explain the tent to anybody — she reads what is printed, flatly, and then talks over it. She revises her own stake count out loud three separate times and says plainly each time what she had wrong: once because she counted the low corner doubles twice, once because two of the side poles on the truck are the wrong length and don't belong to this top, once because she read the count off the 20-foot canopy panel by mistake. She is specifically and repeatedly annoyed about exactly one thing — that the sheet lives in the glovebox and has been folded by every man who ever drove that truck, and that she has asked twice for the yard to get a second copy from the manufacturer — and she says it three times. She is briefly and genuinely pleased once, about the fact that the guys are all still slack and therefore nothing has to be undone, and she says so purely as a matter of not having to redo anything. She mentions the wind backing twice and the fact that her shoes are wrong for a hayfield once. She never once addresses the visitor as a student, never gives a lesson, and never draws a conclusion. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, NOT a competent-tradesperson-saying-every-figure-twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The sheet is cheap 1968 offset bond in a warm dry cream (#e9e2cd), going measurably greyer and softer along every crease where it has been opened and closed for four years (#cdc4a8), and going darker, oilier and semi-translucent in a broad band across two panels where it has sat in a glovebox against a rubber mat (#b8a97f) — and the printing UNDER that band is honestly harder to read for the whole visit. The job is one-colour offset in a flat brick orange-red (#c2452b): solid and slightly bloomed in the heavy step numbers and rule boxes, starved, broken and pinkish in the small tension tables and in every line of the diagrams (#d9836e), with real make-ready unevenness so one panel is measurably lighter than its neighbours. Crease damage is COMPUTED and never drawn: every crease carries a live fatigue value from the number of times it has been folded across all visits, and its render runs honestly from a clean sharp line, through fibre whitening, to a genuine split with the dark of the field showing through it (#3b3a33) — and printing that lies across a split crease loses a real strip of ink and cannot be read across the gap. The long cross fold is already split four centimetres in at load and has been since before the visitor arrived. The field shows only at the sheet's outer margins as trodden hay in a hard evening green-gold (#9c9a5c) with short raking shadows. Exactly one chip of guy-rope stripe blue (#2f5a86) is held strictly for the manufacturer's part-number block, the small printed square that says which top this sheet belongs to, and the pencilled yard number somebody wrote on the back — it never appears in a step, a diagram, a table or a caption. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest ink starvation, honest crease fatigue and honest glovebox staining.">
  <meta name="outbox-spec-wildcard" content="Panel 9 belongs to a different product. It is printed in the same colour by the same printer on the same sheet — a make-ready economy — and it carries erection steps for a 20 × 20 frame canopy, numbered in the same series, so there are two step 14s, two step 15s and two step 16s on this sheet and nothing distinguishes them except a part-number block in the corner that is under the glovebox stain and cannot be read. The frame-canopy steps are internally correct and completely useless here. The engine treats panel 9 exactly like every other panel: it folds, wears, splits and comes up in the rotation on its honest turn, and it is never flagged, greyed, marked or commented on by the engine in any way. Vonda reads four lines of it aloud, gets most of the way through before she notices, says once that the yard has three of these tops and two of those canopies and somebody in Ohio saved a plate, and goes straight back to counting stakes and never mentions it again. It is panel 9, same steps, same stain over the part number, on every visit.">
  <meta name="outbox-spec-forbidden" content="NO folding-as-metaphor for anything — not memory, not what gets creased in a person, not 'you can never unfold it', not layers, not the shape a life gets pressed into; this is five creases, a split cross fold and a step that continues on a panel you cannot see, and it has nothing to teach anybody. ABSOLUTELY NO origami preciousness, NO paper-as-fragile lyricism, NO map-of-the-territory philosophy, NO Borges, NO 'the instructions are always incomplete' as a statement about anything. NO circus or big-top romance whatsoever: no sawdust, no calliope, no roustabouts as myth, no tent-as-magic, no travelling-show glamour, no Ray Bradbury, no 'and by morning the field was empty' — this is a rental crew and a farm auction. NO bureaucratic-absurd, NO Kafka, NO department-of-X, NO committee-minutes register, NO joke about instruction manuals being unreadable presented as a joke; the sheet is correct and the fold is wrong and nobody on the page finds it funny. NO Americana and NO heartland sentiment: no amber waves, no fireflies-and-porches, no small-town warmth, no farm-crisis pathos, no dispersal-auction melancholy about a family selling up, no 1972-as-period-signifier, no Vietnam or Watergate drift, no Norman Rockwell, no explaining Indiana to anybody. NO nostalgia, NO wistfulness, NO 'nobody puts up canvas anymore / it's all frame and vinyl now / the last of the tent companies' decline narrative — the sale is at nine and the wall is still on the truck. NO craftsman-sage register, NO 'the old tent men could feel a guy go slack', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc. NO storm dread, NO disaster foreshadowing, NO danger-porn about a tent coming down on people, NO safety sermon; the weather is a forecast and a reason to leave the guys slack. NO woman-in-a-man's-trade arc, NO proving-herself, NO crew-of-lovable-characters sketch, NO quitting-boss drama beyond the one flat fact of it. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the paper or the folding. NO sensuous material writing about canvas, manila or paper beyond weight, tension, shrinkage, stiffness and legibility. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the unreachable fold, the two step 14s, or the split that keeps growing — nothing here is wrong. NO archival / museum / cabinet / drawer / found-document / relic framing of the sheet whatsoever, despite it being an old printed document — it lives in a glovebox, it is being used this minute, and it is getting worse while it is used. NO map, atlas, gazetteer or directory framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty to seven in the evening with the sun still well up and the wind backing. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
/* ------------------------------------------------------------------
   Sheet 4471-B.  16 panel faces, 8 a side.  Five creases.
   Front side panels 1..8 laid out 4 across x 2 down.
   Back side panels 9..16, mirrored left-right on the same grid.
   Creases:  V1 (between cols 1-2), V2 (cols 2-3, the long cross fold,
   split), V3 (cols 3-4), H1 (between rows), and the short end fold F.
   ------------------------------------------------------------------ */

const LSK = 'sheet4471b.v1';

/* ---------- printed content, real page coordinates (percent of panel) ---------- */
/* Steps 1..47 in manufacturer's order, distributed across panels in order.
   Panel 9 is the 20x20 frame canopy plate. Some steps run off the panel edge
   and their continuation lives on the next panel; truncation is by character
   position, never reflowed. */

const STEPS = [
 [1,"LAY TOP OUT FLAT ON THE GROUND, PEAK SEAM UP, AND SQUARE IT TO THE STAKE LINE BEFORE ANYTHING ELSE IS DONE."],
 [2,"LACE SECTIONS AT THE JUMP ROPES, WORKING FROM ONE END. DO NOT SKIP GROMMETS TO SAVE TIME."],
 [3,"A TOP RAISED OUT OF SQUARE CANNOT BE SQUARED AFTERWARD. IT MUST COME ALL THE WAY DOWN."],
 [4,"PACE THE EAVE LINE AND MARK EVERY SIDE POLE PIN POSITION WITH A STAKE LAID FLAT."],
 [5,"STAKE LINE IS SET OUT FROM THE EAVE SO THAT GUY ANGLE IS 45 DEGREES. NO OTHER FIGURE."],
 [6,"AT 45 DEGREES THE GUY'S PULL RESOLVES HALF DOWN INTO THE STAKE AND HALF OUT ALONG THE EAVE."],
 [7,"STAKE SET CLOSE IN PUTS NEARLY ALL PULL STRAIGHT DOWN AND ALMOST NONE OUTWARD."],
 [8,"STAKE SET TOO FAR OUT REDUCES THE DOWNWARD COMPONENT AND THE POLE WILL LIFT."],
 [9,"DRIVE STAKES LEANING AWAY FROM THE TENT AT THE ANGLE OF THE GUY THEY CARRY."],
 [10,"A STAKE DRIVEN PLUMB TAKES ITS LOAD ACROSS ITS LENGTH. IT BENDS, THEN IT WALKS."],
 [11,"HOLDING POWER IS A SOIL QUESTION. THE SAME 42 IN. STAKE HOLDS A FRACTION IN LOAM OF WHAT IT HOLDS IN HARDPAN."],
 [12,"TEST BY BAR: TWO MEN LEANING. DO NOT SUBSTITUTE THE TABLE FOR THE TEST."],
 [13,"ON GRADE, EVERY DOWNHILL STAKE CARRIES MORE THAN ITS SHARE AND THE WHOLE TOP WANTS TO SLIDE."],
 [14,"SET ALL UPHILL GUYS FIRST. DOUBLE OR DOUBLE-STAKE EVERY GUY ON THE LOW SIDE."],
 [15,"A TOP SET SQUARE ON A SLOPE IS SET WRONG. IT IS SET TO THE GRADE."],
 [16,"RIG EVERY SIDE POLE AND EVERY STAKE BEFORE ANY CENTRE POLE IS RAISED."],
 [17,"A SIDE POLE IS NOT A SUPPORT. IT IS A SPACER STANDING ON ITS PIN IN THE EAVE LINE."],
 [18,"UNTIL ITS GUY IS TAUT A SIDE POLE DOES NOTHING AT ALL AND WILL FALL OVER. THIS IS NOT A FAULT."],
 [19,"SET SIDE POLE PINS IN THE EAVE GROMMET, BUTT ON THE GROUND, LEANING OUT SLIGHTLY."],
 [20,"REEVE GUYS THROUGH THE EAVE RINGS AND HITCH TO THE STAKES HAND-SLACK ONLY."],
 [21,"RAISE CENTRE POLES LAST. WALK THE POLE UP UNDER THE PEAK, PIN THROUGH THE PEAK RING."],
 [22,"THE TWO CENTRE POLES CARRY THE WHOLE LOAD IN PURE COMPRESSION AND NOTHING ELSE."],
 [23,"THE TENT IS NOT HELD UP BY ITS POLES. IT IS HELD DOWN BY ITS GUYS, AND EVERY FIGURE ON THIS SHEET FOLLOWS FROM THAT ONE"],
 [24,"DRESS EVERY GUY ON A BAIL RING TO THE SAME TENSION BEFORE ANY ONE OF THEM IS DRESSED TIGHT."],
 [25,"UNEVEN BAIL TENSION WILL WALK A CENTRE POLE OUT FROM UNDER THE PEAK WHILE YOU WATCH IT."],
 [26,"A CREW THAT TIGHTENS ONE SIDE TO LOOK NEAT HAS ALREADY LOST THE TOP."],
 [27,"MANILA AND COTTON GUY LINE SHRINKS WHEN WET. FIGURE 4 TO 7 PER CENT ON LENGTH."],
 [28,"ROPE IS NOT WIRE. A TOP DRESSED BAR-TIGHT IN DRY AIR WILL PULL ITS OWN GROMMET LINE OUT IN RAIN."],
 [29,"CORRECT DRESSED TENSION: A MAN'S FIST PASSES UNDER THE GUY. THAT IS THE WHOLE SPECIFICATION."],
 [30,"SLACK THE GUYS BEFORE THE RAIN, NOT DURING IT. IN RAIN THE HITCHES ARE ALREADY LOADED."],
 [31,"CANVAS SHRINKS ALSO. THE SLACK RULE APPLIES TWICE, ONCE FOR THE LINE AND ONCE FOR THE TOP."],
 [32,"IN DRY WEATHER RE-DRESS GUYS EACH MORNING. THEY WILL HAVE GONE OFF OVERNIGHT."],
 [33,"LACE SIDEWALL LAST, AFTER GUYS ARE DRESSED AND CHECKED ROUND."],
 [34,"A FULLY WALLED TOP IS A SAIL. IN A 40 M.P.H. GUST THE LATERAL LOAD GOES INTO THE SAME STAKES."],
 [35,"ON A WIND WARNING, UNLACE AND ROLL THE WINDWARD WALL. THIS IS THE PROCEDURE, NOT A RETREAT."],
 [36,"ROLL WALL UP TO THE EAVE AND TIE OFF AT EVERY THIRD GROMMET SO IT CANNOT DROP."],
 [37,"PEAK LOAD IS WHAT TEARS A TOP. WATCH FOR PONDING IN ANY SLACK BAY BETWEEN POLES."],
 [38,"ONE HUNDRED GALLONS STANDING IN A BAY WILL PULL A POLE CLEAN OUT OF THE PEAK."],
 [39,"PUSH PONDED WATER OUT FROM UNDERNEATH WITH A POLE. DO NOT CLIMB ON THE TOP."],
 [40,"GROMMET AND JUMP-ROPE SPACING IS FIGURED SO A TORN PANEL TEARS TO THE SEAM AND STOPS THERE."],
 [41,"DO NOT PATCH ACROSS A SEAM. A PATCH ACROSS A SEAM CARRIES THE TEAR PAST IT."],
 [42,"CHECK ROUND AFTER ONE HOUR. STAKES WILL HAVE SETTLED AND GUYS WILL READ UNEVEN."],
 [43,"40 x 80: TWO CENTRE POLES, EIGHTEEN SIDE POLES, THIRTY-SIX STAKES. ADD EIGHT DOUBLES ON GRADE."],
 [44,"CENTRE POLES 22 FT. SIDE POLES 8 FT. DO NOT MIX 7 FT. CANOPY POLES INTO THE EAVE LINE."],
 [45,"KEEP THE STAKE BAR WITH THE STAKE BUNDLE. IT IS PART OF THE RIG."],
 [46,"AT STRIKE, SLACK ALL GUYS ROUND BEFORE ANY CENTRE POLE IS DROPPED."],
 [47,"FOLD TOP TO ITS ORIGINAL CREASES, PEAK SEAM OUT. DO NOT FOLD ACROSS A WET SEAM."]
];

/* frame canopy plate — panel 9 — same numbering series, internally correct */
const CANOPY = [
 [12,"20 x 20 FRAME CANOPY. ASSEMBLE ALL FOUR EAVE RAILS AND CORNER FITTINGS ON THE GROUND."],
 [13,"PIN HIP RAILS TO THE CROWN FITTING. FOUR HIPS, ONE CROWN, NO CENTRE POLE."],
 [14,"SPREAD TOP OVER THE ASSEMBLED FRAME AND HOOK EVERY EAVE GROMMET BEFORE LIFTING."],
 [15,"RAISE ON THE LEGS, ONE CORNER AT A TIME, AND PIN EACH LEG AT ITS SECOND HOLE."],
 [16,"THE FRAME IS SELF-SUPPORTING. GUYS AND STAKES ARE FOR WIND ONLY, NOT FOR LOAD."],
 [17,"WEIGHT OR STAKE ALL FOUR LEGS. DO NOT LEAVE A FRAME CANOPY STANDING UNSECURED."]
];

/* panel content builders --------------------------------------------------- */
/* Each panel gets a list of draw ops in panel-local percent coords. */

function stepBlock(items, opts){
  opts = opts || {};
  const out=[]; let y = opts.top!==undefined?opts.top:9;
  const lh = opts.lh||4.6;
  items.forEach(([n,txt])=>{
    out.push({t:'step', n:n, txt:txt, x:opts.x||7, y:y, w:opts.w||86, clip:opts.clip!==false});
    const lines = Math.ceil((txt.length)/ (opts.cpl||34));
    y += lh*(lines) + 3.4;
  });
  return out;
}

function slice(a,b){ return STEPS.slice(a-1,b); }

/* ---------- fold arithmetic ----------
   Column index from V1,V2,V3.  Each vertical crease folded pushes the outer
   stack over.  Column selection: the outermost column on the front is decided
   by the parity/direction of the folded verticals; the row by H1; the side
   presented by F.  This is a real map from 5 crease states to a pair of faces
   and it is the only thing that chooses what you read.                       */

function outerFaces(f){
  const v=[f.V1,f.V2,f.V3];
  const nFolded = v.filter(x=>x!==0).length;
  /* column 0..3 across the flat sheet */
  let col;
  if(nFolded===0) col = 0;
  else if(nFolded===1) col = (v[0]!==0)?1:((v[1]!==0)?2:3);
  else if(nFolded===2){
    if(v[0]!==0 && v[1]!==0) col = 2;
    else if(v[1]!==0 && v[2]!==0) col = 3;
    else col = 1;
  } else col = 2;
  /* direction shifts which of the pair sits outside */
  const dirSum = v.reduce((a,b)=>a+b,0);
  const row = (f.H1===0) ? 0 : (f.H1>0?1:0);
  const endflip = (f.F>=0)?0:1;

  /* front grid: panels 1..8 -> row*4+col+1 ; back grid mirrored */
  const frontIdx = row*4 + col + 1;
  const backCol = 3-col;
  const backIdx = 9 + row*4 + backCol;

  /* which two faces are OUTERMOST: one from the front stack, one from the
     back stack, and the end fold plus direction sum decide the offset that
     makes them non-adjacent.                                               */
  const off = ((dirSum+4)%4);
  const a = frontIdx;
  let b = backIdx + (endflip? 0 : 0);
  /* nudge the back-face pick by the direction sum so mismatch is arithmetic */
  let bAdj = 9 + ((backIdx-9 + off) % 8);
  if(bAdj === a) bAdj = 9 + ((bAdj-9+3)%8);
  return [a, bAdj];
}

/* the manufacturer's intended fold requires a valley on V2 */
const CORRECT = {V1:1,V2:1,V3:-1,H1:1,F:1};

function lawful(next){
  /* a split crease cannot carry a valley: the paper bulges and springs back */
  if(next.V2===1 && S.split.V2 > 0) return false;
  return true;
}

/* ---------- rendering ---------- */
const packet = document.getElementById('packet');

function panelSize(){
  const vw = Math.min(window.innerWidth, 1100);
  const vh = window.innerHeight;
  /* two panel faces side by side, true pocket size, filling the frame */
  const availW = vw * 0.94;
  const availH = vh * 0.66;
  /* each panel 10.5 x 15 cm ratio */
  let h = Math.min(availH, availW/2 * (15/10.5));
  let w = h * (10.5/15);
  if(w*2 > availW){ w = availW/2; h = w*(15/10.5); }
  return [Math.floor(w), Math.floor(h)];
}

  if(f<30) return 'rgba(205,196,168,0)';

  return 'rgba(233,230,215,.95)';
}

let creaseEls=[];
function draw(){
  const [w,h] = panelSize();
  W=w;H=h;
  const [a,b] = outerFaces(S.fold);
  packet.innerHTML='';
  packet.appendChild(renderPanel(a,w,h,'front'));
  packet.appendChild(renderPanel(b,w,h,'back'));
  packet.style.width=(w*2)+'px'; packet.style.height=h+'px';

  /* crease grabbers, drawn on top, positioned at the real physical edges */
  creaseEls=[];
  const layout = [
    {id:'V2', o:'v', x:w},                   /* the shared physical edge: long cross fold */
    {id:'V1', o:'v', x:w*0.5},
    {id:'V3', o:'v', x:w*1.5},
    {id:'H1', o:'h', y:h*0.5},
    {id:'F',  o:'v', x:w*1.82}
  ];
  layout.forEach(L=>{
    const g=document.createElement('div');
    g.className='grab '+L.o;
    if(L.o==='v'){ g.style.left=L.x+'px'; } else { g.style.top=L.y+'px'; }
    g.dataset.crease=L.id;
    const line=document.createElement('i');
    g.appendChild(line);
    packet.appendChild(g);
    creaseEls.push(g);
    paintCrease(g,L.id);
    attachHandlers(g,L.id);
  });
  document.getElementById('count').textContent =
    'FOLDS '+String(S.folds).padStart(4,'0');
}

function paintCrease(g,id){
  const f=S.fat[id], sp=S.split[id];
  const line=g.querySelector('i');
  const long = (g.classList.contains('v')) ? H : (W*2);
  let bg;
  if(f<28) bg='rgba(59,58,51,.30)';
  else if(f<58) bg='linear-gradient(90deg, rgba(233,230,215,.85), rgba(205,196,168,.9))';
  else bg='rgba(240,237,224,.95)';
  line.style.background = 'transparent';
  line.innerHTML='';
  const seg=document.createElement('div');
  seg.style.position='absolute'; seg.style.inset='0';
  seg.style.background=bg;
  line.appendChild(seg);
  /* split: real dark gap of the field, growing from one end only */
  if(sp>0){
    const frac = Math.min(1, sp/ (g.classList.contains('v') ? 15 : 21));
    const gap=document.createElement('div');
    gap.style.position='absolute';
    gap.style.background='var(--dark)';
    if(g.classList.contains('v')){
      gap.style.left='0'; gap.style.right='0'; gap.style.top='0';
      gap.style.height=(frac*100)+'%';
      gap.style.width='3px';
    } else {
      gap.style.top='0'; gap.style.bottom='0'; gap.style.left='0';
      gap.style.width=(frac*100)+'%';
      gap.style.height='3px';
    }
    gap.style.boxShadow='0 0 0 1px rgba(240,237,224,.6)';
    line.appendChild(gap);
    /* printing lying across the split loses a strip of ink */
    const eat=document.createElement('div');
    eat.style.position='absolute';
    eat.style.background='var(--cream)';
    if(g.classList.contains('v')){
      eat.style.left='-3px';eat.style.width='9px';eat.style.top='0';
      eat.style.height=(frac*100)+'%';
      eat.style.zIndex='-1';
    } else {
      eat.style.top='-3px';eat.style.height='9px';eat.style.left='0';
      eat.style.width=(frac*100)+'%';
    }
    line.appendChild(eat);
  }
  line.style.height = g.classList.contains('h') ? '3px':'';
  line.style.width  = g.classList.contains('v') ? '3px':'';
  line.style.left   = g.classList.contains('v') ? '16px':'0';
  line.style.top    = g.classList.contains('h') ? '16px':'0';
  if(g.classList.contains('h')){ line.style.right='0'; line.style.bottom=''; }
  else { line.style.bottom='0'; line.style.right=''; }
}

/* ---------- interaction ---------- */
let dragging=null, dragStart=null, holdTimer=null, holdCrease=null;

function attachHandlers(g,id){
  g.addEventListener('pointerdown', e=>{
    g.setPointerCapture && g.setPointerCapture(e.pointerId);
    dragging=id; dragStart={x:e.clientX,y:e.clientY,moved:false,t:Date.now()};
    holdCrease=id;
    holdTimer=setTimeout(()=>{ if(!dragStart.moved) workFlat(id); holdTimer=null; }, 620);
    e.preventDefault();
  });
  g.addEventListener('pointermove', e=>{
    if(dragging!==id||!dragStart) return;
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.abs(dx)+Math.abs(dy)>16 && !dragStart.moved){
      dragStart.moved=true;
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
      const vertical = g.classList.contains('v');
      const dir = vertical ? (dx>0?1:-1) : (dy>0?1:-1);
      attemptFold(id, dir);
    }
  });
  const up = ()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} dragging=null; dragStart=null; };
  g.addEventListener('pointerup', up);
  g.addEventListener('pointercancel', up);
  g.addEventListener('lostpointercapture', up);
}

function neighbours(id){
  const order=['V1','V2','V3','H1','F'];
  const i=order.indexOf(id);
  const n=[];
  if(order[i-1]) n.push(order[i-1]);
  if(order[i+1]) n.push(order[i+1]);
  return n;
}

function attemptFold(id, dir){
  const next = Object.assign({},S.fold);
  const cur = S.fold[id];
  /* drag toward: open -> valley/mountain, folded -> open */
  let target;
  if(cur===0) target = dir>0?1:-1;
  else target = 0;
  next[id]=target;

  /* stiffness resists */
  const resist = S.stiff[id];
  if(resist > 74 && Math.random() < 0.34){
    bulge(); crackle(id, true); return;
  }
  if(!lawful(next)){
    /* split crease refuses a valley: the paper bulges and springs back */
    bulge(); refuseNoise(); vondaRefused(); return;
  }
  S.fold=next;
  S.folds++;
  /* real fatigue on this crease, real stiffness on the neighbours */
  S.fat[id]=Math.min(100, S.fat[id] + 2.4 + Math.random()*1.5);
  neighbours(id).forEach(n=>{
    S.stiff[n]=Math.min(100, S.stiff[n]+3.1);
    S.stiff[id]=Math.max(0, S.stiff[id]-4.5);
  });
  S.stain = Math.min(72, S.stain + 0.09);
  /* past threshold, it splits further. only ever grows. */
  if(S.fat[id] > 66 && Math.random() < (S.fat[id]-60)/240){
    const add = 0.6 + Math.random()*1.3;
    S.split[id] = +(S.split[id]+add).toFixed(2);
    tearHiss(add);
  }
  crackle(id,false);
  save();
  draw();
  vondaFold(id);
}

function workFlat(id){
  S.fat[id]=Math.min(100,S.fat[id]+5.2);
  S.stiff[id]=Math.max(0,S.stiff[id]-26);
  neighbours(id).forEach(n=>{ S.stiff[n]=Math.min(100,S.stiff[n]+5.6); });
  if(S.fat[id]>72){ const add=0.5+Math.random()*1.1; S.split[id]=+(S.split[id]+add).toFixed(2); tearHiss(add); }
  rubNoise(id);
  save();
  creaseEls.forEach(g=>paintCrease(g,g.dataset.crease));
  document.getElementById('count').textContent='FOLDS '+String(S.folds).padStart(4,'0');
  vondaFlat(id);
}

function bulge(){
  packet.style.transition='transform .09s ease-out';
  packet.style.transform='perspective(900px) rotateY(4deg) scale(1.012)';

  setTimeout(()=>{ packet.style.transition=''; },300);
}

/* ---------- Web Audio: crease report, tearing, wind, canvas, bar, truck, bobwhite ---------- */
let AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function noiseBuf(ctx,sec){
  const b=ctx.createBuffer(1, Math.floor(ctx.sampleRate*sec), ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function crackle(id, stuck){
  const ctx=ac(); if(!ctx) return;
  const f=S.fat[id];
  const bright = 1 - Math.min(1,f/100);          /* worn crease folds dull */
  const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,0.16);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 900 + bright*3600;
  bp.Q.value = 0.8 + bright*2.2;
  const g=ctx.createGain();
  const t=ctx.currentTime;
  const peak = (stuck?0.06:0.16) * (0.45+bright*0.8);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(stuck?0.09:0.05+bright*0.10));
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start(t); src.stop(t+0.2);
}
function refuseNoise(){
  const ctx=ac(); if(!ctx) return;
  const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,0.4);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
  const g=ctx.createGain(); const t=ctx.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.09,t+0.07);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
  src.connect(lp).connect(g).connect(ctx.destination);
  src.start(t); src.stop(t+0.45);
}
function rubNoise(id){
  const ctx=ac(); if(!ctx) return;
  const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,0.7); src.loop=false;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=0.7;
  const g=ctx.createGain(); const t=ctx.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.045,t+0.10);
  g.gain.linearRampToValueAtTime(0.038,t+0.45);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.66);
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start(t); src.stop(t+0.72);
}
function tearHiss(cm){
  const ctx=ac(); if(!ctx) return;
  const dur=0.10+cm*0.11;
  const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,dur+0.1);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
  const g=ctx.createGain(); const t=ctx.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.13,t+0.02);
  g.gain.linearRampToValueAtTime(0.09,t+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(hp).connect(g).connect(ctx.destination);
  src.start(t); src.stop(t+dur+0.1);
}

/* wind bed, backing slowly, gusting on its own clock */
let windNode=null, windFilter=null, windGain=null, windAngle=248;
function startBed(){
  const ctx=ac(); if(!ctx||windNode) return;
  const buf=noiseBuf(ctx,4);
  windNode=ctx.createBufferSource(); windNode.buffer=buf; windNode.loop=true;
  windFilter=ctx.createBiquadFilter(); windFilter.type='lowpass';
  windFilter.frequency.value=430; windFilter.Q.value=0.5;
  windGain=ctx.createGain(); windGain.gain.value=0.05;
  windNode.connect(windFilter).connect(windGain).connect(ctx.destination);
  windNode.start();
  gustClock();
  luffClock();
  barClock();
  bobwhiteClock();
  truckOnce();
  setInterval(()=>{ /* the wind backs across the visit */
    windAngle -= 0.35;
    if(windFilter) windFilter.frequency.value = 380 + ((windAngle%40)*4);
  }, 9000);
}
function gustClock(){
  const ctx=ac(); if(!ctx) return;
  const wait = 5200 + Math.random()*11000;
  setTimeout(()=>{
    const t=ctx.currentTime, mag=0.06+Math.random()*0.16;
    if(windGain){
      windGain.gain.cancelScheduledValues(t);
      windGain.gain.setValueAtTime(windGain.gain.value,t);
      windGain.gain.linearRampToValueAtTime(0.05+mag,t+0.9+Math.random());
      windGain.gain.linearRampToValueAtTime(0.05,t+3.2+Math.random()*2);
    }
    if(windFilter){
      windFilter.frequency.setValueAtTime(windFilter.frequency.value,t);
      windFilter.frequency.linearRampToValueAtTime(700+mag*2600,t+1.0);
      windFilter.frequency.linearRampToValueAtTime(420,t+3.6);
    }
    if(mag>0.13) snapSheet(mag);
    gustClock();
  }, wait);
}
function snapSheet(mag){
  /* the sheet genuinely tries to leave the hands */
  const deg = (Math.random()<0.5?-1:1)*(1.2+mag*9);
  const px = (Math.random()<0.5?-1:1)*(4+mag*26);
  packet.style.transition='transform .13s cubic-bezier(.3,1.6,.5,1)';
  packet.style.transform='perspective(1000px) rotate('+deg.toFixed(2)+'deg) translateX('+px.toFixed(1)+'px) rotateY('+(deg*1.4).toFixed(1)+'deg)';
  setTimeout(()=>{ packet.style.transition='transform .5s cubic-bezier(.2,.8,.3,1)';
    packet.style.transform='perspective(1000px) rotate(0deg) translateX(0) rotateY(0)'; }, 150+Math.random()*180);
  const ctx=ac(); if(!ctx) return;
  const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,0.2);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2100; bp.Q.value=1.1;
  const g=ctx.createGain(); const t=ctx.currentTime;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  s.connect(bp).connect(g).connect(ctx.destination); s.start(t); s.stop(t+0.22);
}
function luffClock(){
  const ctx=ac(); if(!ctx) return;
  setTimeout(()=>{
    const n=2+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,0.22);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=280+Math.random()*260; bp.Q.value=0.9;
      const g=ctx.createGain(); const t=ctx.currentTime+i*(0.16+Math.random()*0.2);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.055,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.19);
      s.connect(bp).connect(g).connect(ctx.destination); s.start(t); s.stop(t+0.25);
    }
    luffClock();
  }, 7000+Math.random()*13000);
}
function barClock(){
  const ctx=ac(); if(!ctx) return;
  setTimeout(()=>{
    const hits=1+Math.floor(Math.random()*3);
    for(let i=0;i<hits;i++){
      const t=ctx.currentTime+i*(0.42+Math.random()*0.25);
      [1440,2170,3060].forEach((f,k)=>{
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*(1+Math.random()*0.01);
        const g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.05/(k+1),t+0.004);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.6-k*0.12);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.7);
      });
    }
    barClock();
  }, 11000+Math.random()*22000);
}
function bobwhiteClock(){
  const ctx=ac(); if(!ctx) return;
  setTimeout(()=>{
    const t0=ctx.currentTime;
    const notes=[[1050,0,0.11],[1560,0.20,0.20]];
    notes.forEach(([f,off,dur])=>{
      const o=ctx.createOscillator(); o.type='sine';
      const t=t0+off;
      o.frequency.setValueAtTime(f*0.94,t);
      o.frequency.linearRampToValueAtTime(f*1.06,t+dur*0.8);
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.045,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+0.05);
    });
    bobwhiteClock();
  }, 16000+Math.random()*30000);
}
let truckDone=false;
function truckOnce(){
  if(truckDone) return; truckDone=true;
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime+3;
  const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=41;
  const o2=ctx.createOscillator(); o2.type='square'; o2.frequency.value=82.5;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170;
  const g=ctx.createGain(); g.gain.value=0.0001;
  o.connect(lp); o2.connect(lp); lp.connect(g).connect(ctx.destination);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.055,t+1.4);
  const off = t+16+Math.random()*14;
  g.gain.setValueAtTime(0.055,off);
  o.frequency.setValueAtTime(41,off);
  o.frequency.linearRampToValueAtTime(21,off+1.1);
  o2.frequency.setValueAtTime(82.5,off);
  o2.frequency.linearRampToValueAtTime(38,off+1.1);
  g.gain.linearRampToValueAtTime(0.0001,off+1.25);
  o.start(t); o2.start(t); o.stop(off+1.6); o2.stop(off+1.6);
}

/* ---------- Vonda ---------- */
const V = document.getElementById('vonda');
function say(lines){
  const olds=[...V.children];
  olds.forEach(el=>{
    if(el.classList.contains('old')){ el.classList.remove('old'); el.classList.add('older'); }
    else if(!el.classList.contains('older')) el.classList.add('old');
  });
  while(V.children.length>7) V.removeChild(V.firstChild);
  lines.forEach(([kind,txt])=>{
    const p=document.createElement('p');
    if(kind==='r') p.className='reads';
    p.textContent=txt;
    V.appendChild(p);
  });
  V.scrollTop = V.scrollHeight;
}

let glovebox=0, count=0, canopySaid=false, pleasedSaid=false, windSaid=0, shoesSaid=false, refusedCount=0;

function readPrintedFrom(idx){
  const p=PANELS[idx];
  if(!p) return null;
  const first=(p.ops||[]).find(o=>o.t==='step'||o.t==='contin'||o.t==='table');
  if(!first) return null;
  if(first.t==='table') return {kind:'table', txt:first.rows[0]+' / '+first.rows[1]};
  if(first.t==='contin') return {kind:'contin', n:first.n, txt:'…'+first.txt.slice(first.from,first.from+58)};
  return {kind:'step', n:first.n, txt:first.n+'. '+first.txt.slice(0,74)+(first.txt.length>74?'—':'')};
}

const gloveLines = [
  "And this is why I asked Dale twice to write the manufacturer for a second copy of this sheet, because this one lives in the glovebox.",
  "Second copy. That's all I've asked for. Twice. This sheet has been folded by every man who ever drove that truck and it shows.",
  "Third time I'm saying it and I'll say it at the counter Monday: the sheet should not live in a glovebox. Get a second copy."
];

const stakeRevisions = [
  "Hold on. Forty-four. No — thirty-six. I counted the eight doubles on the low corner twice, once as stakes and once as doubles. Thirty-six and eight doubles.",
  "Change that again. Two of the side poles on the truck are seven-footers off a canopy, they don't belong to this top, so that's sixteen side poles rigged and two guys with nothing under them. Thirty-six stakes stands, sixteen poles pinned tonight.",
  "No — I read that count off the twenty-foot canopy panel. That's the wrong plate. It's eighteen side poles on this top and thirty-six stakes and eight doubles, and I want the bar."
];

function vondaFold(id){
  count++;
  const [a,b]=outerFaces(S.fold);
  const ra=readPrintedFrom(a), rb=readPrintedFrom(b);
  const lines=[];

  if(a===9 || b===9){
    const c = PANELS[9].ops.filter(o=>o.t==='step');
    if(!canopySaid){
      lines.push(['r', '14. '+CANOPY[2][1].slice(0,72)]);
      lines.push(['r', '15. '+CANOPY[3][1].slice(0,72)]);
      lines.push(['r', '16. '+CANOPY[4][1].slice(0,72)]);
      lines.push(['r', '17. '+CANOPY[5][1].slice(0,70)]);
      lines.push(['v', "Pin each leg at its second — no. No. There's no legs on this. That's the frame canopy. Two step fourteens on the one sheet, same numbers, and the part block that would tell you is under the stain and I can't read it. Yard's got three of these tops and two of those canopies and somebody in Ohio saved a plate. Anyway. Thirty-six stakes."]);
      canopySaid=true;
    } else {
      lines.push(['r', (ra&&ra.txt)||'—']);
      lines.push(['v', "That's the canopy side again. Not it."]);
    }
  } else {
    if(ra){
      if(ra.kind==='table'){ lines.push(['r', ra.txt]); lines.push(['v', "That's a tension table. That is not twenty-three."]); }
      else if(ra.kind==='contin'){ lines.push(['r', ra.txt]); lines.push(['v', "That's the tail of something. Begins on a panel I haven't got out. Not it."]); }
      else { lines.push(['r', ra.txt]); lines.push(['v', ra.n===23?"There's twenty-three — no, that's where it starts and it runs off the edge, look, it stops dead at the fold. The rest of it's on the back of a panel that's inside right now. Not it.":"That's "+ra.n+". I want twenty-three."]); }
    }
    if(rb && rb.kind!=='step'){
      lines.push(['r', rb.txt]);
    } else if(rb){
      lines.push(['r', rb.txt.slice(0,66)]);
    }
  }

  /* the three flat, named revisions of her own stake count */
  if(count===3) lines.push(['v', stakeRevisions[0]]);
  if(count===7) lines.push(['v', stakeRevisions[1]]);
  if(count===12) lines.push(['v', stakeRevisions[2]]);

  if(count===2||count===9||count===16){
    lines.push(['v', gloveLines[glovebox++ % 3]]);
  }
  if(count===5 && !pleasedSaid){
    lines.push(['v', "Good — the guys are all still hand-slack, every one of them, nobody's dressed anything tight yet. So there's nothing to undo. That's the whole of why I'm pleased about it: no redoing."]);
    pleasedSaid=true;
  }
  if(count===4 && windSaid===0){ lines.push(['v', "Wind's backed again. It was out of the south when we pulled in and it's coming round west now."]); windSaid=1; }
  if(count===11 && windSaid===1){ lines.push(['v', "Backing more. West-northwest. Walls stay on the truck till the guys are round."]); windSaid=2; }
  if(count===6 && !shoesSaid){ lines.push(['v', "My shoes are completely wrong for a hayfield, by the way. Hold your corner up, it's dragging."]); shoesSaid=true; }
  if(count===14) lines.push(['v', "Dark in about ninety minutes and the sale's at nine. Hold it flat and let me try the long one again."]);

  say(lines);
}

function vondaRefused(){
  refusedCount++;
  const msgs=[
    "No. It won't take that way. Feel it bulge? It's split in from the edge there and it just springs back at you. Try it the other direction.",
    "That one won't go valley. Won't. Push it and it stands up in the middle. Go round it.",
    "Same thing. It's split at the end and it will not carry that fold. Other way, or take a different crease."
  ];
  say([['v', msgs[(refusedCount-1)%3]]]);
}

function vondaFlat(id){
  const msgs=[
    "Yeah, work it flat with your thumb, right along there. It'll go easier after.",
    "That's softer now. It'll want to fold that way whether you want it to or not.",
    "Rub it. Fine. The two either side of it are stiffer for it, that's how it goes.",
    "Softer. And now the next one over is a fight. Hold your corner."
  ];
  say([['v', msgs[Math.floor(Math.random()*msgs.length)]]]);
}
