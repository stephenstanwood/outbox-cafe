  <meta name="outbox-spec-era" content="Half past two on a hot bright afternoon in late June 1958, inside the steam-bending room of a hardwood bentwood works in Radomsko, Poland — not the finished chair, not the showroom, not anybody's design heritage: the BENDING STRAP AND FORMER, with a steamed beech rod forty-one minutes out of the retort and cooling at a rate the page renders honestly, being pulled around a cast-iron hoop-back former by two people who have about ninety seconds of workable material and a rod that is already stiffening at the ends.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the bending bench seen straight down from about waist height, filled corner to corner: a cast-iron former bolted to a scarred beech bench, a steel bending strap with its end stops, and ONE steamed beech rod that is being pulled around the former in real time, over and over, forever, by nobody. It is not an animation of wood bending. It is a live viscoelastic beam: the rod is several hundred fibre elements with real moduli that are TEMPERATURE- AND MOISTURE-DEPENDENT and cooling honestly from the outside in, so the bend that succeeds in the first twenty seconds after the retort fails at ninety, and the engine simply keeps trying — pull, set, release, stack, fetch another rod — and the page is the work going on at the bench with the light coming through a high window and moving a hand's width across the frame every few minutes. The visitor's whole vocabulary is what a hand does at a bending bench and nothing else: DRAG the strap's free end around the former, which is a real pull applying real end-compression through the strap into the rod; PRESS AND HOLD anywhere on the rod to clamp it to the former with a real thumb-width contact, which locally arrests springback; and SCRUB sideways across the bench to run the window shutter, which changes how much afternoon comes in and therefore how fast every rod on the bench is losing heat. Nothing scrolls. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat mechanics of bending solid hardwood, which is entirely a COMPRESSION problem and not a bending problem, and which almost everybody has backwards. That wood in tension fails at roughly one percent elongation and will not stretch further no matter what is done to it, while wood in compression will shorten by twenty-five or thirty percent without breaking — so the entire trade consists of making sure the outside of the bend never goes into tension at all. That this is what the STEEL STRAP is for and it is not a support and not a jig: it is a tension member clamped hard against the outer face with end stops at both ends, so when the rod is pulled around the former the strap carries every bit of the tensile load and the wood sees nothing but compression from end to end, and a strap fitted a sixteenth of an inch loose at one stop means the rod takes tension in the first inch of pull and tears out in a long splintered run down the outer face. That HEAT IS THE WHOLE VARIABLE AND MOISTURE IS NOT: steaming does almost nothing to the moisture content of a rod already at twenty percent, it delivers heat, and heat above about 80°C softens the lignin between the fibres so the cell walls can buckle into little accordion folds instead of splitting — which is why a rod dunked in cold water bends nothing and a rod out of a dry heat box bends fine. That the retort gives roughly one hour per inch of thickness and going longer does not help and does hurt, because prolonged steam degrades the wood and a rod boiled for three hours comes out weak and stays weak. That THE CLOCK STARTS THE MOMENT THE DOOR OPENS and the rod cools from the outside in, so the workable window is not a matter of feel but of a real temperature gradient: the outer fibres, which are the ones that must not tear, are also the first ones to go cold and stiff, so a rod that feels warm in the middle can already be unbendable where it counts. That the practical figure is under two minutes from retort to former and that everything about the layout of a bending room — where the retort is, where the bench is, who carries — exists to serve that number. That SPRINGBACK IS NOT A DEFECT, it is elastic recovery, and a bend released off the former immediately gives back a real fraction of itself, so every former in the room is cut tighter than the finished part by an amount that depends on species, thickness and radius and is discovered by ruining things. That the fix is not a better former but SETTING: the bend is held to the former in its strap and dried at the bent shape for hours or days, and drying under restraint is what makes the shape permanent, because the softened lignin re-hardens with the fibres where they now sit. That a part taken off the former too early relaxes in the stack overnight and is a different part in the morning. That SPECIES IS ARITHMETIC AND NOT PREFERENCE: beech, ash, elm and oak bend well because their fibres are long and their rays are strong, and they will take radii of two or three times the thickness, while most softwoods and most tropical hardwoods will not bend at all at any temperature and shatter in a way that looks exactly like a mistake. That GRAIN RUNOUT IS THE SINGLE MOST COMMON CAUSE OF FAILURE and it is invisible on a planed surface: a rod sawn from a board whose grain runs out at one in fifteen has a built-in tension crack waiting on the outer face, and the shop answer is to SPLIT the stock rather than saw it, because a split follows the grain and cannot lie. That KNOTS ARE ABSOLUTE and a knot anywhere on the outer face is not a risk, it is the location where the rod will fail. That the strap must be the correct width for the rod to the fraction, because a strap wider than the piece lets the outer corners squirm out from under it and a strap narrower than the piece leaves two ribbons of unrestrained wood along the edges which go into tension and split first. That a bend that is going wrong announces itself as a faint continuous crackling, and the answer is more pull and faster and not less, because hesitating lets the rod cool. And the flat arithmetic at the bench: a retort that holds twenty-eight rods, a former that makes one hoop back at a time, a set rack with room for ninety, and a rod cooling in your hands right now.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the wood, the strap and the hot bright afternoon, and that register is FAST, FORCEFUL, SQUEAKY, DAMP AND SLIGHTLY VIOLENT — a rod that arrives visibly steaming and is on the former inside a count of ten; a steel strap that groans and skids against beech under load; a pull that is genuinely hard and genuinely hurried and never once graceful; the small continuous crackling of compression folds forming, which is the sound of it working and not the sound of it breaking; and every so often a hard bright report and a rod that is scrap and goes into a box under the bench without ceremony. The room is hot and wet, the window light is hard, there is sawdust standing in the air in the beam, and the bench is soaked through at the former. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the rods keep coming out of the retort whether or not anybody touches the strap. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a woodworking-video, NOT a screensaver, NOT stately, NOT reverent, NOT warm, NOT tactile-in-the-nice-sense — this is a bending bench at half past two with a rod in your hands that is getting colder.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the wood's colour is COMPUTED and never chosen. The bench is beech soaked black-green at the former from forty years of hot wet rods, a dark saturated wet-wood tone (#3d3a2b) that is genuinely glossier where it is currently wet and matte a hand's width away, going pale scuffed straw where dry sawdust has settled into the scars (#c4b184). Against that, EVERY ROD'S SURFACE COLOUR IS THE OUTPUT OF ITS OWN TEMPERATURE AND WETNESS: each rod carries a live per-element surface temperature and a live surface moisture film, and its rendered colour is computed from those two alone — a rod straight out of the retort is dark, wet, almost translucent at the edges and reads a deep hot honey (#a5663a) with a real specular sheet of water on it; forty seconds later the ends have gone matte and lighter (#c9a06d) while the middle is still dark, so the temperature gradient is genuinely visible as a colour gradient along the rod and nothing on the page says so; a cold beech rod off the rack is flat pale biscuit with visible ray fleck (#ddc9a2) and no specular at all. Compression folds on the inner face render as real fine cross-grain crinkling that catches the window light. A tension failure renders as what it is: a long pale splintered runout showing bright raw fibre against the wet surface (#e8dcc0), and it does not fade. The steel strap is scaled blue-black tool steel (#2f3338) polished to a hard bright band exactly where the rods have run over it for years (#b0b6ba), and the cast-iron former is dull grey with a rust bloom on the parts nothing rubs (#6a6560, rust #8a5a34). The window beam is a hard slab of afternoon with real standing dust in it and it moves. Exactly one chip of layout blue (#1b4f8f) — the shop's marking crayon — is held strictly for the two tick marks on each former where the strap stops are set, and the crayon stub lying at the bench edge. It never appears on a rod, on the strap, on the bench or in the beam. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest wetness specular, honest cooling gradient, honest ray fleck and honest dust in a beam.">
  <meta name="outbox-spec-wildcard" content="One of the rods in the rack is not beech. It is a length of iroko that came in with a mixed delivery years ago and was never sorted out — it is the right diameter, it is planed like everything else, and at the bench it looks like every other rod. The engine gives it exactly the properties iroko has and no others: interlocked grain, very low lignin softening response to heat, and a compressive yield that barely moves at any temperature the retort can reach. It goes into the retort on its turn, it comes out steaming on its turn, it takes the strap, it takes the pull — and about fifteen degrees into any bend it shatters, hard, in a way that is visually indistinguishable from a grain-runout failure and is not. It cannot be sorted out, marked, set aside or removed by anything the visitor can do, and it is regenerated into the rack on every visit in the same position, because the delivery it came from is still in the yard.">
  <meta name="outbox-spec-forbidden" content="NO bending-as-metaphor for anything — not flexibility, not what yields instead of breaking, not pressure making a shape, not 'the strap carries what the wood cannot', not heat-and-time changing a person; this is a migrating neutral axis and a compressive yield limit that rises as the rod cools, and it has nothing to teach anybody. ABSOLUTELY NO craftsman-sage register: no 'the old benders could tell by the sound', no trade mystique, no reverence for hand skill, no master-and-apprentice arc, no wise-elder-at-the-bench, no dying-art lament, no handmade-versus-machine sermon, no honest-materials sentiment. NO wood lyricism whatsoever: no living material, no the-tree-remembers, no grain-as-biography, no annual-rings-as-years, no warm-to-the-touch, no smell of steam or beech beyond nothing, no describing wood as breathing, wanting, resisting, forgiving, or having a will — a rod here is a stiffness that falls with temperature. NO Thonet hagiography, NO great-man design narrative, NO 'the most successful chair ever made', NO Bauhaus, NO Vienna coffeehouse imagery, NO design-history lecture, NO furniture-as-icon, NO 'you have sat in one and never noticed'. NO Poland travelogue and NO explaining Poland or Central Europe to anybody: no dialect spelling, no Polish vocabulary sprinkled for texture beyond a place name, no aren't-they-stoic, no forests-and-folk-tales, no Catholicism, no poverty pathos. ABSOLUTELY NO twentieth-century political history imported as atmosphere or subtext: no war, no occupation, no communism, no state enterprise satire, no five-year-plan joke, no bureaucratic-absurd, no committee minutes, no department-of-X, no Kafka, no Iron Curtain drift, no shortage comedy, no 1958-as-period-signifier of any kind. NO labour-dignity sermon, NO working-class-pride sentiment, NO union framing, NO thankless-work pathos, NO invisible-infrastructure essay, NO awe at how things are made. NO nostalgia, NO wistfulness, NO decline narrative, NO 'nobody bends solid wood anymore / it's all laminate now / the works closed in 1991', NO foreshadowing of anything, NO hindsight of any kind. NO retro-kitsch, NO camp, NO ironic affection for cast iron, steel straps, drying racks or shop crayon. NO physics-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, process-video, woodworking-video, maker-channel, ambient-visualiser, generative-art-gallery, chillout or screensaver framing whatsoever, and no 'watch it take the shape' — the strap squeals, the room is hot, and things break. NO danger-porn, NO injury foreshadowing, NO safety sermon, NO dread. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous framing of the iroko rod, the scrap box that only fills, or the rods that keep arriving whether or not anybody is there — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of the formers, the rack or the bench whatsoever, despite them being worn old wooden and iron objects — every one of them is live tooling and there are twenty-eight rods in the retort right now. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is half past two on a bright hot afternoon with a high window full of hard light. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding, and the word guild never appears. And beyond the wood, the strap, the former, the bench and the one blue crayon mark, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!-- former cut 19mm tight on the hoop back. discovered by ruining things. -->
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),g=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);layout();}
window.addEventListener('resize',resize);

/* ---------- persistence ---------- */
var KEY='radomsko.bench.v1';
var save={racked:[],scrap:[],polish:0,soak:0,retortHours:0,visits:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){save.racked=p.racked||[];save.scrap=p.scrap||[];save.polish=p.polish||0;save.soak=p.soak||0;save.retortHours=p.retortHours||0;save.visits=p.visits||0;}}}catch(e){}
save.visits++;
var saveTimer=0;
function persist(){if(saveTimer)return;saveTimer=setTimeout(function(){saveTimer=0;try{
  if(save.racked.length>140)save.racked=save.racked.slice(-140);
  if(save.scrap.length>400)save.scrap=save.scrap.slice(-400);
  localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}},900);}

/* ---------- rng ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry((Date.now()^0x9e3779b9)>>>0);

/* ---------- layout ---------- */
var L={};
function layout(){
  var m=Math.min(W,H);
  L.cx=W*0.44;L.cy=H*0.52;
  L.R=m*0.22;                       // former radius
  L.benchTop=0;L.benchBot=H;
  L.rodLen=Math.min(W*0.82,m*1.55); // rod arc length in px
  L.rodW=Math.max(9,m*0.038);       // rod thickness in px
  L.strapW=L.rodW*1.02;
  L.rackX=W*0.945;
  L.boxX=W*0.06;L.boxY=H*0.90;
  L.crayonX=W*0.10;L.crayonY=H*0.12;
}

/* ---------- constants (the arithmetic) ---------- */
var N=260;                    // fibre elements along length
var LAYERS=7;                 // radial stations through thickness
var AMB0=31;                  // hot room, half past two
var RETORT_T=99;
var HOURS_PER_VISIT=0;

/* ---------- rod model ---------- */
var rodSeq=0;
function makeRod(spec){
  var r={};
  r.id=++rodSeq;
  r.iroko=!!(spec&&spec.iroko);
  var s=mulberry(((spec&&spec.seed)||(Date.now()^rodSeq*2654435761))>>>0);
  r.seed=(spec&&spec.seed)||((Math.random()*1e9)|0);
  r.runout=r.iroko?0.02:(s()<0.22?0.028+s()*0.055:0.004+s()*0.020); // slope of grain
  r.knots=[];
  var nk=r.iroko?0:(s()<0.34?(s()<0.25?2:1):0);
  for(var k=0;k<nk;k++)r.knots.push({p:0.12+s()*0.76,sz:0.02+s()*0.035,face:s()<0.55?1:-1});
  r.fleck=[];for(var f=0;f<90;f++)r.fleck.push({p:s(),o:s()*2-1,l:0.004+s()*0.012,a:0.05+s()*0.14});
  r.T=new Float32Array(N*LAYERS);
  r.M=new Float32Array(N);        // surface water film
  r.theta=new Float32Array(N);    // cumulative curvature (rad per element)
  r.perm=new Float32Array(N);     // permanent set
  r.eps=new Float32Array(N);      // outer-fibre tensile strain
  r.fold=new Float32Array(N);     // compression folds accumulated
  r.dry=new Float32Array(N);      // set-under-restraint progress
  r.broken=-1;r.tear=0;r.tearDir=1;r.shatter=0;
  r.state='new';
  r.born=now;
  r.arcFrac=0;                    // how far pulled round former
  r.onBench=true;
  r.wet=0;
  r.polishContrib=0;
  return r;
}
function steamRod(r){
  for(var i=0;i<N;i++){
    var taper=1-0.22*Math.pow(Math.abs(i/(N-1)*2-1),2.0); // thin-ish ends
    for(var j=0;j<LAYERS;j++)r.T[i*LAYERS+j]=RETORT_T-1.5+Math.random()*0.8;
    r.M[i]=0.86+Math.random()*0.1;
    r.taper=taper;
  }
  r.tap=new Float32Array(N);
  for(i=0;i<N;i++)r.tap[i]=1-0.20*Math.pow(Math.abs(i/(N-1)*2-1),2.2);
  r.state='hot';r.born=now;r.wet=1;
}
function rodThick(r,i){return r.tap?r.tap[i]:1;}

/* thermal: explicit diffusion across LAYERS, surface loses to ambient */
function coolRod(r,dt,amb){
  var alpha=0.85;                                     // through-thickness diffusivity term
  var hBase=0.46;                                     // surface film coefficient
  for(var i=0;i<N;i++){
    var th=rodThick(r,i);
    var base=i*LAYERS;
    var h=hBase/(0.55+th*0.8);                        // thin ends lose faster
    var surf=r.T[base+LAYERS-1];
    // evaporation cooling while wet
    var evap=r.M[i]*0.30*Math.max(0,(surf-amb)/70);
    var tmp=[];
    for(var j=0;j<LAYERS;j++){
      var t=r.T[base+j];
      var up=j<LAYERS-1?r.T[base+j+1]:t;
      var dn=j>0?r.T[base+j-1]:r.T[base+1];
      var d=alpha*(up+dn-2*t)/(th*th*2.2);
      if(j===LAYERS-1)d-=(h*(t-amb)+evap*12)/th;
      tmp.push(t+d*dt);
    }
    for(j=0;j<LAYERS;j++)r.T[base+j]=tmp[j];
    var dm=(0.030+0.055*Math.max(0,(surf-amb)/70))*dt;
    r.M[i]=Math.max(0,r.M[i]-dm);
  }
  r.wet=0;for(i=0;i<N;i+=6)r.wet+=r.M[i];r.wet/=Math.ceil(N/6);
}
function surfT(r,i){return r.T[i*LAYERS+LAYERS-1];}
function coreT(r,i){return r.T[i*LAYERS+1];}
function meanT(r){var s=0;for(var i=0;i<N;i+=8)s+=surfT(r,i);return s/Math.ceil(N/8);}

/* lignin softening -> compressive yield strain limit (fraction) */
function compYield(r,T){
  if(r.iroko){ // interlocked, barely responds
    return 0.022+0.010*Math.max(0,Math.min(1,(T-70)/60));
  }
  var x=(T-58)/44; if(x<0)x=0; if(x>1)x=1;
  var soft=x*x*(3-2*x);
  return 0.028+0.255*soft;      // up to ~28% shortening when hot
}
/* tensile limit: wood in tension will not go past ~1% ever */
function tensYield(r,T){ return r.iroko?0.0085:0.0098+0.0016*Math.max(0,Math.min(1,(T-60)/40)); }
function Ecomp(r,T){var y=compYield(r,T);return 1/(0.55+y*8);}
function Etens(r,T){return r.iroko?1.35:1.15-0.25*Math.max(0,Math.min(1,(T-55)/45));}

/* ---------- world state ---------- */
var now=0,last=0;
var ambient=AMB0;
var shutter=0.62;               // 0 shut, 1 wide -> more sun, hotter room? no: draught & bright
var pull=0;                     // strap pull, 0..1 of full hoop
var pullVel=0;
var strapSpan=1.0;              // end-stop spacing multiplier; 1.000 = exact
var clamps={};                  // index -> strength
var active=null;
var bench=[];                   // cold rods lying about
var racked=[];
var scrapCount=save.scrap.length;
var polish=save.polish;
var soak=save.soak;
var retortHours=save.retortHours;
var nextRod=2.0;
var retortDoorT=-99;
var beamPhase=(Date.now()/1000/240)%1;

/* the rack: one of them is not beech, same position every visit */
var rackRods=[];
(function buildRack(){
  var rr=mulberry(0x1eec0);
  for(var i=0;i<12;i++){
    rackRods.push({seed:(rr()*1e9)|0,iroko:(i===7)});
  }
})();
var rackPtr=0;

/* ---------- audio ---------- */
var AC=null,master=null,noiseBuf=null,audioOn=false;
var crackGain=null,crackFilt=null,squealOsc=null,squealGain=null,squealFilt=null;
function initAudio(){
  if(audioOn)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){return;}
  audioOn=true;
  master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  var len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  // room tone
  var rm=AC.createBufferSource();rm.buffer=noiseBuf;rm.loop=true;
  var rf=AC.createBiquadFilter();rf.type='lowpass';rf.frequency.value=380;rf.Q.value=0.4;
  var rg=AC.createGain();rg.gain.value=0.035;
  rm.connect(rf);rf.connect(rg);rg.connect(master);rm.start();
  // lineshaft + flat belt overhead
  var ls=AC.createOscillator();ls.type='sawtooth';ls.frequency.value=44;
  var lsf=AC.createBiquadFilter();lsf.type='lowpass';lsf.frequency.value=190;
  var lsg=AC.createGain();lsg.gain.value=0.028;
  ls.connect(lsf);lsf.connect(lsg);lsg.connect(master);ls.start();
  var lfo=AC.createOscillator();lfo.frequency.value=2.9;var lg=AC.createGain();lg.gain.value=0.012;
  lfo.connect(lg);lg.connect(lsg.gain);lfo.start();
  var belt=AC.createBufferSource();belt.buffer=noiseBuf;belt.loop=true;
  var bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1400;bf.Q.value=1.1;
  var bg=AC.createGain();bg.gain.value=0.0;belt.connect(bf);bf.connect(bg);bg.connect(master);belt.start();
  var bl=AC.createOscillator();bl.frequency.value=1.37;var blg=AC.createGain();blg.gain.value=0.014;
  bl.connect(blg);blg.connect(bg.gain);bl.start();
  // crackle bus
  var cs=AC.createBufferSource();cs.buffer=noiseBuf;cs.loop=true;
  crackFilt=AC.createBiquadFilter();crackFilt.type='bandpass';crackFilt.frequency.value=2600;crackFilt.Q.value=2.4;
  crackGain=AC.createGain();crackGain.gain.value=0;
  cs.connect(crackFilt);crackFilt.connect(crackGain);crackGain.connect(master);cs.start();
  // strap squeal

/* ---------- former geometry ---------- */
/* the former is a hoop-back: a circular arc of TOTAL sweep, centred at cx,cy */
var SWEEP=Math.PI*1.16;
function formerPt(a){return {x:L.cx+Math.cos(a)*L.R,y:L.cy+Math.sin(a)*L.R};}
var A0=Math.PI*0.92; // start angle of the wrap

/* ---------- rod supply ---------- */
function fetchRod(){
  var spec=rackRods[rackPtr%rackRods.length];rackPtr++;
  var r=makeRod({seed:spec.seed+rackPtr*97,iroko:spec.iroko});
  steamRod(r);
  retortDoorT=now;retortRelease();
  return r;
}

/* ---------- bending solve ---------- */
var yieldCount=0,slideSpeed=0,lastPull=0;
function solve(dt){
  var r=active;if(!r)return;
  yieldCount=0;
  var target=pull;                      // 0..1 of full sweep
  var k=target*SWEEP/N;                 // required curvature per element (rad)
  var slackErr=(strapSpan-1.0);         // + = stops set long -> rod takes tension
  for(var i=0;i<N;i++){
    // how much of the rod is currently against the former
    var frac=i/(N-1);
    var engaged=frac<=Math.min(1,target*1.06+0.02)?1:0;
    if(!engaged){ r.dry[i]*=1; continue; }
    var Ts=surfT(r,i),Tc=coreT(r,i);
    var th=rodThick(r,i);
    var cy=compYield(r,Tc*0.4+Ts*0.6);
    var ty=tensYield(r,Ts);
    // knot local anomaly
    var knotF=1;
    for(var q=0;q<r.knots.length;q++){var kn=r.knots[q];var d=Math.abs(frac-kn.p);
      if(d<kn.sz){knotF=1-0.62*(1-d/kn.sz);}}
    // nominal bending strain at the faces from curvature k about mid-thickness
    var halfT=0.5*th;
    var kappa=k*(1/ (L.R/ (L.rodW))); // dimensionless
    var nominal=Math.max(0,target)*0.30*th;
    // neutral axis migration: compression side yields, axis walks outward
    var Ec=Ecomp(r,Ts),Et=Etens(r,Ts);
    var ratio=Ec/(Ec+Et);
    var na=0.5-0.5*Math.min(0.94,(1-ratio)*1.9*Math.min(1,nominal/Math.max(cy,0.01)));
    // na in [0.03,0.5]: distance of neutral axis from OUTER face, fraction of thickness
    var outerArm=na, innerArm=1-na;
    // strap: if span correct, strap carries tension -> outer strain forced ~0
    var strapCarry=1-Math.min(1,Math.max(0,slackErr)*160);
    var epsOut=nominal*outerArm*2*(1-strapCarry)*knotF;
    if(slackErr<0){ // strap set short: extra end compression, good, up to a point
      epsOut=0; }
    var epsIn=nominal*innerArm*2*(1+Math.max(0,-slackErr)*40);
    // clamp reduces local springback and adds contact
    var cl=clamps[Math.floor(frac*9)]?1:0;
    // compression yield -> folds
    if(epsIn>cy){
      var over=epsIn-cy;
      r.fold[i]=Math.min(1,r.fold[i]+over*dt*9);
      yieldCount++;
      // yielding relieves the outer fibre a little
      epsOut*=0.86;
    }
    r.eps[i]=Math.max(r.eps[i]*0.995,epsOut/Math.max(ty,1e-5));
    // iroko: brittle shatter past a real angle
    if(r.iroko && target*SWEEP>0.26 && r.broken<0){
      var chance=(target*SWEEP-0.26)*dt*4.2;
      if(Math.random()<chance){ initFail(r,Math.floor(0.2*N+Math.random()*0.6*N),true); }
    }
    // tension rupture
    if(r.broken<0 && r.eps[i]>1.0){
      initFail(r,i,false);
    }
    // curvature actually achieved: limited by how fast it can be pulled
    var want=k;
    r.theta[i]+= (want-r.theta[i])*Math.min(1,dt*14);
    // set under restraint: drying converts elastic to permanent
    var held=(cl?2.6:1.0);
    var dryRate=(0.0016+0.0070*Math.max(0,(Ts-ambient)/60)+0.0026*(1-r.M[i]))*held;
    r.dry[i]=Math.min(1,r.dry[i]+dryRate*dt);
    r.perm[i]=r.theta[i]*r.dry[i];
  }
  if(r.broken>=0 && r.tear<1){
    var spd=(0.30+r.runout*8)*dt;
    r.tear=Math.min(1,r.tear+spd);
  }
}
function initFail(r,i,shatter){
  r.broken=i;r.tear=0.001;r.tearDir=Math.random()<0.5?-1:1;
  r.shatter=shatter?1:0;
  crackReport(true);
  tearRun(shatter?0.35:(0.35+r.runout*22));
  setTimeout(function(){ if(active===r){ scrapRod(r); } },shatter?520:900+r.runout*9000);
}
function scrapRod(r){
  r.state='scrap';
  save.scrap.push({s:r.seed,i:r.iroko?1:0,b:r.broken/N,ru:r.runout,sh:r.shatter});
  scrapCount=save.scrap.length;
  persist();
  active=null;pull=0;clamps={};
}
function rackRod(r){
  var avg=0;for(var i=0;i<N;i++)avg+=r.perm[i];avg/=N;
  var setFrac=0;for(i=0;i<N;i++)setFrac+=r.dry[i];setFrac/=N;
  // springback: elastic recovery of the unset portion
  var recov=(1-setFrac)*(0.42+0.30*Math.max(0,Math.min(1,(ambient-meanT(r))/-1||0)));
  recov=Math.max(0.03,Math.min(0.92,(1-setFrac)*0.78));
  var finalSweep=pull*SWEEP*(1-recov);
  save.racked.push({s:r.seed,a:finalSweep,w:Math.round(r.wet*100)/100,i:r.iroko?1:0});
  polish+=0.9+pull*2.4; save.polish=polish;
  soak+=r.wet*1.4; save.soak=soak;
  persist();
  active=null;pull=0;clamps={};
}

/* ---------- drawing helpers ---------- */
function rodColour(T,M,fold,broken){
  // computed from temperature and surface water only
  var x=Math.max(0,Math.min(1,(T-ambient)/(RETORT_T-ambient)));
  // cold pale biscuit #ddc9a2  -> warm #c9a06d -> hot honey #a5663a
  var c1=[0xdd,0xc9,0xa2],c2=[0xc9,0xa0,0x6d],c3=[0xa5,0x66,0x3a];
  var r,gg,b;
  if(x<0.5){var t=x/0.5;r=c1[0]+(c2[0]-c1[0])*t;gg=c1[1]+(c2[1]-c1[1])*t;b=c1[2]+(c2[2]-c1[2])*t;}
  else{var t2=(x-0.5)/0.5;r=c2[0]+(c3[0]-c2[0])*t2;gg=c2[1]+(c3[1]-c2[1])*t2;b=c2[2]+(c3[2]-c2[2])*t2;}
  // wet darkens
  var w=Math.max(0,Math.min(1,M));
  r*= (1-0.30*w); gg*=(1-0.34*w); b*=(1-0.36*w);
  return 'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
}

function benchBackdrop(){
  g.fillStyle='#3d3a2b';g.fillRect(0,0,W,H);
  // dry sawdust in the scars, pale straw
  g.save();
  var seed=mulberry(20585);
  for(var i=0;i<150;i++){
    var x=seed()*W,y=seed()*H,l=18+seed()*140,a=(seed()-0.5)*0.22;
    var dCx=Math.hypot(x-L.cx,y-L.cy);
    var wetness=Math.max(0,1-dCx/(L.R*2.3));
    g.globalAlpha=0.05+0.10*(1-wetness)*seed();
    g.strokeStyle='#c4b184';g.lineWidth=0.6+seed()*1.6;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  // long bench boards
  g.globalAlpha=0.16;g.strokeStyle='#241f19';g.lineWidth=2;
  for(i=1;i<5;i++){var yy=H*i/5;g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke();}
  g.restore();
  // soaked black-green at the former, glossier where wet
  var soakR=L.R*(1.45+Math.min(1.5,soak/900));
  var grd=g.createRadialGradient(L.cx,L.cy,L.R*0.2,L.cx,L.cy,soakR);
  grd.addColorStop(0,'rgba(20,24,16,0.80)');
  grd.addColorStop(0.55,'rgba(26,30,20,0.46)');
  grd.addColorStop(1,'rgba(30,34,24,0)');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  // gloss on the wet patch
  g.save();g.globalCompositeOperation='screen';
  var gl=g.createRadialGradient(L.cx-L.R*0.5,L.cy-L.R*0.6,0,L.cx-L.R*0.5,L.cy-L.R*0.6,soakR*0.8);
  gl.addColorStop(0,'rgba(150,160,130,0.10)');gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl;g.fillRect(0,0,W,H);g.restore();
  // scrap box under the bench: a dark rectangle with rod ends in it
  drawScrapBox();
  drawRack();
  drawCrayon();
}

function drawScrapBox(){
  var bw=Math.min(W*0.20,150),bh=Math.min(H*0.16,110);
  var x=L.boxX,y=L.boxY-bh;
  g.save();
  g.fillStyle='rgba(16,15,11,0.85)';g.fillRect(x,y,bw,bh);
  g.strokeStyle='#2a281e';g.lineWidth=2;g.strokeRect(x,y,bw,bh);
  var s=mulberry(9001);
  var n=Math.min(save.scrap.length,90);
  for(var i=0;i<n;i++){
    var it=save.scrap[save.scrap.length-1-i];
    var px=x+4+s()*(bw-8),py=y+bh-4-s()*(bh-8);
    var ln=10+s()*(bw*0.55),a=(s()-0.5)*2.2;
    g.globalAlpha=0.55+s()*0.4;
    g.strokeStyle=it&&it.i?'#b08a4c':'#c8ab7c';
    g.lineWidth=Math.max(1.6,L.rodW*0.28);
    g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*ln,py+Math.sin(a)*ln);g.stroke();
    // splintered pale end
    g.strokeStyle='#e8dcc0';g.lineWidth=1;
    g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a+0.3)*ln*0.22,py+Math.sin(a+0.3)*ln*0.22);g.stroke();
  }
  g.restore();
}

function drawRack(){
  g.save();
  var x=L.rackX;
  g.strokeStyle='#4a4535';g.lineWidth=3;
  g.beginPath();g.moveTo(x-W*0.03,0);g.lineTo(x-W*0.03,H);g.stroke();
  var n=Math.min(save.racked.length,60);
  for(var i=0;i<n;i++){
    var it=save.racked[save.racked.length-1-i];
    var yy=H*0.06+i*(H*0.88/Math.max(12,n));
    if(yy>H)break;
    var a=it.a||0;
    var rr=Math.max(10,L.R*0.30);
    g.globalAlpha=0.85;
    g.strokeStyle=it.i?'#c0a46f':'#ddc9a2';
    g.lineWidth=Math.max(2,L.rodW*0.36);
    g.lineCap='round';
    g.beginPath();
    var steps=26;
    for(var k2=0;k2<=steps;k2++){
      var t=k2/steps;
      var ang=Math.PI*0.5-a*0.5+a*t;
      var px=x-Math.cos(ang- Math.PI*0.5)*0-(rr*Math.sin(ang))+rr*0.2;
      var py=yy+rr*Math.cos(ang)*0.55;
      px=x - rr*0.9 + rr*0.9*Math.cos(ang-Math.PI*0.5)*1.0;
      px=x - Math.abs(Math.sin(ang))*rr*0.9;
      if(k2===0)g.moveTo(px,py);else g.lineTo(px,py);
    }
    g.stroke();
  }
  g.restore();
}

function drawCrayon(){
  // the one chip of layout blue: crayon stub at bench edge
  g.save();
  g.translate(L.crayonX,L.crayonY);g.rotate(0.42);

function drawFormer(){
  g.save();
  // cast iron body
  g.lineCap='butt';
  g.strokeStyle='#6a6560';g.lineWidth=L.R*0.30;
  g.beginPath();g.arc(L.cx,L.cy,L.R-L.R*0.15,A0-0.12,A0+SWEEP+0.12);g.stroke();
  // rust bloom where nothing rubs
  g.globalAlpha=0.5;g.strokeStyle='#8a5a34';g.lineWidth=L.R*0.10;
  g.beginPath();g.arc(L.cx,L.cy,L.R-L.R*0.27,A0+SWEEP*0.05,A0+SWEEP*0.42);g.stroke();
  g.beginPath();g.arc(L.cx,L.cy,L.R-L.R*0.27,A0+SWEEP*0.70,A0+SWEEP*0.96);g.stroke();
  g.globalAlpha=1;
  // bright rubbed band on the working face

  // bolts
  for(var i=0;i<=4;i++){
    var a=A0+SWEEP*i/4;var p=formerPt(a);

    g.fillStyle='#4e4a45';g.beginPath();g.arc(bx,by,L.R*0.045,0,6.3);g.fill();
    g.fillStyle='#8f8880';g.beginPath();g.arc(bx-1,by-1,L.R*0.022,0,6.3);g.fill();
  }

    var x2=L.cx+Math.cos(a)*(L.R+L.R*0.06),y2=L.cy+Math.sin(a)*(L.R+L.R*0.06);
    g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  });
  g.restore();
}

function drawStrapAndRod(){
  var r=active;
  var off=L.rodW*0.5+L.strapW*0.5;
  var wrap=(r?pull:0)*SWEEP;
  // --- the rod ---
  if(r){
    var pts=[],i;
    var straightFrom=wrap; // beyond the wrap the rod runs off tangentially
    var tp=formerPt(A0+wrap);
    var tdir={x:-Math.sin(A0+wrap),y:Math.cos(A0+wrap)};
    for(i=0;i<N;i++){
      var f=i/(N-1);
      var along=f*SWEEP;
      var px,py,nx,ny;
      if(along<=wrap){
        var a=A0+along;
        var rad=L.R+L.rodW*0.5;
        px=L.cx+Math.cos(a)*rad;py=L.cy+Math.sin(a)*rad;
        nx=Math.cos(a);ny=Math.sin(a);
      }else{
        var ext=(along-wrap)*L.R;
        px=tp.x+tdir.x*ext;py=tp.y+tdir.y*ext;
        nx=Math.cos(A0+wrap);ny=Math.sin(A0+wrap);
        // sagging of the free end, slight
        px+=nx*L.rodW*0.5;py+=ny*L.rodW*0.5;
      }
      pts.push({x:px,y:py,nx:nx,ny:ny,f:f,i:i});
    }
    // draw as thick band with per-element colour
    for(i=0;i<N-1;i++){
      var p=pts[i],q=pts[i+1];
      if(r.broken>=0){
        var bf=r.broken/N;
        if(p.f>bf && p.f<bf+r.tear*0.5) { /* still drawn, torn below */ }
      }
      var T=surfT(r,i),M=r.M[i];
      var th=L.rodW*rodThick(r,i);
      g.strokeStyle=rodColour(T,M,r.fold[i],false);
      g.lineWidth=th;g.lineCap='butt';
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();
    }
    // ray fleck (cold rods show it)
    g.save();
    for(var k=0;k<r.fleck.length;k++){
      var fl=r.fleck[k];var idx=Math.min(N-2,Math.floor(fl.p*(N-1)));
      var pp=pts[idx];var Tf=surfT(r,idx);
      var cold=Math.max(0,1-(Tf-ambient)/(RETORT_T-ambient));
      g.globalAlpha=fl.a*cold*0.8;
      g.strokeStyle='#b39a70';g.lineWidth=1;
      var w2=L.rodW*0.5*rodThick(r,idx);
      g.beginPath();
      g.moveTo(pp.x+pp.nx*fl.o*w2,pp.y+pp.ny*fl.o*w2);
      var idx2=Math.min(N-2,idx+Math.floor(fl.l*N));
      var p2=pts[idx2];
      g.lineTo(p2.x+p2.nx*(fl.o*0.7)*w2,p2.y+p2.ny*(fl.o*0.7)*w2);
      g.stroke();
    }
    g.restore();
    // compression folds on the inner face
    g.save();
    for(i=2;i<N-2;i+=2){
      var fo=r.fold[i];if(fo<=0.02)continue;
      var pi=pts[i];var w3=L.rodW*0.5*rodThick(r,i);
      g.globalAlpha=Math.min(0.75,fo*0.9);
      g.strokeStyle='rgba(60,42,26,1)';g.lineWidth=0.9;
      g.beginPath();
      g.moveTo(pi.x-pi.nx*w3*0.96,pi.y-pi.ny*w3*0.96);
      g.lineTo(pi.x-pi.nx*w3*(0.96-0.55*fo),pi.y-pi.ny*w3*(0.96-0.55*fo));
      g.stroke();
      g.globalAlpha=Math.min(0.5,fo*0.6);
      g.strokeStyle='rgba(235,215,180,1)';
      g.beginPath();
      g.moveTo(pi.x-pi.nx*w3*0.90,pi.y-pi.ny*w3*0.90);
      g.lineTo(pi.x-pi.nx*w3*(0.90-0.35*fo),pi.y-pi.ny*w3*(0.90-0.35*fo));
      g.stroke();
    }
    g.restore();
    // knots: only visible when the light and wet catch them
    g.save();
    for(k=0;k<r.knots.length;k++){
      var kn=r.knots[k];var ki=Math.min(N-1,Math.floor(kn.p*(N-1)));
      var kp=pts[ki];var kw=L.rodW*0.5*rodThick(r,ki);
      g.globalAlpha=0.20+0.25*(1-r.M[ki]);
      g.fillStyle='#6b4a2c';
      g.beginPath();
      g.ellipse(kp.x+kp.nx*kn.face*kw*0.45,kp.y+kp.ny*kn.face*kw*0.45,kw*0.42,kw*0.26,Math.atan2(kp.ny,kp.nx),0,6.3);
      g.fill();
    }
    g.restore();
    // specular water sheet
    g.save();g.globalCompositeOperation='screen';
    for(i=0;i<N-1;i+=3){
      var m=r.M[i];if(m<0.05)continue;
      var pa=pts[i],pb=pts[Math.min(N-1,i+3)];
      var w4=L.rodW*0.5*rodThick(r,i);
      g.globalAlpha=Math.min(0.55,m*0.55)*beamAt(pa.x,pa.y);
      g.strokeStyle='rgba(215,225,205,1)';g.lineWidth=Math.max(1,L.rodW*0.16);
      g.beginPath();
      g.moveTo(pa.x+pa.nx*w4*0.38,pa.y+pa.ny*w4*0.38);
      g.lineTo(pb.x+pb.nx*w4*0.38,pb.y+pb.ny*w4*0.38);
      g.stroke();
    }
    g.restore();
    // steam off a fresh rod
    if(r.wet>0.5){
      g.save();g.globalCompositeOperation='screen';
      for(k=0;k<26;k++){
        var si=Math.floor(Math.random()*(N-1));
        var sp=pts[si];
        var ph=(now*0.7+k*0.37)%1;
        g.globalAlpha=(1-ph)*0.055*r.wet;
        g.fillStyle='#cfd6c4';
        g.beginPath();g.arc(sp.x+(Math.random()-0.5)*14,sp.y-ph*46-6,6+ph*18,0,6.3);g.fill();
      }
      g.restore();
    }
    // tension rupture: permanent splintered runout
    if(r.broken>=0 && r.tear>0){
      g.save();
      var bi=r.broken;
      var runLen=Math.floor(r.tear*(0.06+r.runout*16)*N);
      g.strokeStyle='#e8dcc0';
      for(var s2=0;s2<Math.max(3,runLen);s2++){
        var ii=Math.max(0,Math.min(N-2,bi+r.tearDir*s2));
        var sp2=pts[ii];
        var w5=L.rodW*0.5*rodThick(r,ii);
        var lift=Math.min(1,s2/Math.max(4,runLen))*(r.shatter?1.6:1.0);
        g.globalAlpha=0.85;
        g.lineWidth=Math.max(1,L.rodW*0.10*(1-lift*0.4));
        g.beginPath();
        g.moveTo(sp2.x+sp2.nx*w5*0.55,sp2.y+sp2.ny*w5*0.55);
        g.lineTo(sp2.x+sp2.nx*w5*(0.55+lift*1.5),sp2.y+sp2.ny*w5*(0.55+lift*1.5));
        g.stroke();
      }
      if(r.shatter){
        // hard brittle break: fragments
        var bp=pts[bi];
        g.globalAlpha=0.9;g.strokeStyle='#e8dcc0';g.lineWidth=Math.max(1.4,L.rodW*0.14);
        for(var fz=0;fz<9;fz++){
          var ang=Math.random()*6.28;var ln2=L.rodW*(0.6+Math.random()*2.4)*r.tear;
          g.beginPath();g.moveTo(bp.x,bp.y);g.lineTo(bp.x+Math.cos(ang)*ln2,bp.y+Math.sin(ang)*ln2);g.stroke();
        }
      }
      g.restore();
    }
  }
  // --- the strap ---
  g.save();
  var sr=L.R+L.rodW+L.strapW*0.5;
  var strapEnd=A0+Math.max(0.02,wrap)+0.10;
  g.lineCap='butt';
  g.strokeStyle='#2f3338';g.lineWidth=L.strapW;
  g.beginPath();g.arc(L.cx,L.cy,sr,A0-0.10,strapEnd);g.stroke();
  // polished band where the rods have run for years
  g.globalAlpha=Math.min(0.9,0.22+polish/420);
  g.strokeStyle='#b0b6ba';g.lineWidth=L.strapW*0.34;
  g.beginPath();g.arc(L.cx,L.cy,sr-L.strapW*0.16,A0-0.10,strapEnd);g.stroke();
  g.globalAlpha=1;
  // free tail running off tangentially
  var te=formerPt(strapEnd);
  var tdx=-Math.sin(strapEnd),tdy=Math.cos(strapEnd);
  var ex=L.cx+Math.cos(strapEnd)*sr, ey=L.cy+Math.sin(strapEnd)*sr;
  var tailLen=Math.max(30,L.R*1.5*(1-pull*0.55));
  g.strokeStyle='#2f3338';g.lineWidth=L.strapW;
  g.beginPath();g.moveTo(ex,ey);g.lineTo(ex+tdx*tailLen,ey+tdy*tailLen);g.stroke();
  g.strokeStyle='#b0b6ba';g.globalAlpha=Math.min(0.8,0.18+polish/500);g.lineWidth=L.strapW*0.3;
  g.beginPath();g.moveTo(ex,ey);g.lineTo(ex+tdx*tailLen,ey+tdy*tailLen);g.stroke();
  g.globalAlpha=1;
  // end stops — their spacing is strapSpan
  var stopOff=(strapSpan-1.0)*L.R*3.2;
  drawStop(L.cx+Math.cos(A0-0.10)*sr,L.cy+Math.sin(A0-0.10)*sr,A0-0.10,-stopOff);
  drawStop(ex+tdx*tailLen*0.86,ey+tdy*tailLen*0.86,strapEnd,stopOff);
  g.restore();
  // handle blob at the tail end (what the hand has)
  g.save();
  g.fillStyle='#4a4136';
  g.beginPath();g.arc(ex+tdx*tailLen,ey+tdy*tailLen,L.strapW*0.85,0,6.3);g.fill();
  g.fillStyle='#5d5245';
  g.beginPath();g.arc(ex+tdx*tailLen-2,ey+tdy*tailLen-2,L.strapW*0.5,0,6.3);g.fill();
  g.restore();
}
function drawStop(x,y,a,off){
  g.save();
  g.translate(x+Math.cos(a)*off,y+Math.sin(a)*off);
  g.rotate(a);
  g.fillStyle='#22262a';g.fillRect(-L.strapW*0.32,-L.strapW*0.95,L.strapW*0.64,L.strapW*1.9);
  g.fillStyle='#7d858a';g.fillRect(-L.strapW*0.32,-L.strapW*0.95,L.strapW*0.20,L.strapW*1.9);
  g.restore();
}

/* ---------- window beam ---------- */
var dust=[];
(function(){for(var i=0;i<170;i++)dust.push({x:Math.random(),y:Math.random(),s:Math.random(),v:Math.random()*0.4+0.1,p:Math.random()*6.28});})();
function beamX(){ return W*(0.06+beamPhase*0.72); }
function beamW(){ return W*0.30*(0.35+shutter*0.95); }
function beamAt(x,y){
  var bx=beamX(),bw=beamW();
  var d=Math.abs(x-bx)/(bw*0.5);
  return Math.max(0,1-d*d)*(0.35+shutter*0.8);
}
function drawBeam(){
  var bx=beamX(),bw=beamW();
  g.save();
  g.globalCompositeOperation='screen';
  var grd=g.createLinearGradient(bx-bw*0.6,0,bx+bw*0.6,0);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(0.5,'rgba(236,226,190,'+(0.10+shutter*0.16).toFixed(3)+')');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;
  g.beginPath();
  g.moveTo(bx-bw*0.62,0);g.lineTo(bx+bw*0.38,0);
  g.lineTo(bx+bw*0.72,H);g.lineTo(bx-bw*0.34,H);
  g.closePath();g.fill();
  // hard edges
  g.globalAlpha=0.10+shutter*0.14;
  g.strokeStyle='rgba(245,235,200,1)';g.lineWidth=1.5;
  g.beginPath();g.moveTo(bx-bw*0.62,0);g.lineTo(bx-bw*0.34,H);g.stroke();
  g.beginPath();g.moveTo(bx+bw*0.38,0);g.lineTo(bx+bw*0.72,H);g.stroke();
  g.globalAlpha=1;
  // standing dust
  for(var i=0;i<dust.length;i++){
    var d=dust[i];
    var x=bx-bw*0.5+d.x*bw+Math.sin(now*0.18*d.v+d.p)*8;
    var y=((d.y+now*0.006*d.v)%1)*H;
    var vis=Math.max(0,1-Math.abs(x-bx)/(bw*0.55));
    g.globalAlpha=vis*(0.10+shutter*0.30)*(0.3+d.s*0.7);
    g.fillStyle='#f2e8cd';
    g.beginPath();g.arc(x,y,0.6+d.s*1.5,0,6.3);g.fill();
  }
  g.restore();
}

/* ---------- interaction ---------- */
var dragging=false,dragMode=null,lastPt=null;
function ptFromEvent(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0].clientX))-r.left;
  var y=(e.clientY!==undefined?e.clientY:(e.touches&&e.touches[0].clientY))-r.top;
  return {x:x,y:y};
}
cv.addEventListener('pointerdown',function(e){
  initAudio();
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  var p=ptFromEvent(e);lastPt=p;
  var dr=Math.hypot(p.x-L.cx,p.y-L.cy);
  if(active && dr>L.R*0.72 && dr<L.R*1.55){
    // on the rod: clamp
    var a=Math.atan2(p.y-L.cy,p.x-L.cx);
    var rel=a-A0;while(rel<0)rel+=6.283;while(rel>6.283)rel-=6.283;
    if(rel<SWEEP){ dragMode='clamp'; clamps[Math.floor(rel/SWEEP*9)]=1; }
    else dragMode='pull';
  }else if(dr>L.R*1.5){
    dragMode='shutter';
  }else{
    dragMode='pull';
  }
  dragging=true;
  e.preventDefault();
});
window.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var p=ptFromEvent(e);
  if(dragMode==='pull'){
    var a=Math.atan2(p.y-L.cy,p.x-L.cx);
    var rel=a-A0;while(rel<-3.14159)rel+=6.283;while(rel>3.14159)rel-=6.283;
    if(rel<0)rel=0;
    var target=Math.max(0,Math.min(1,rel/SWEEP));
    var delta=target-pull;
    pullVel+=delta*3.2;
  }else if(dragMode==='shutter'){
    shutter=Math.max(0,Math.min(1,shutter+(p.x-lastPt.x)/W*1.6));
  }else if(dragMode==='clamp'){
    var a2=Math.atan2(p.y-L.cy,p.x-L.cx);
    var rel2=a2-A0;while(rel2<0)rel2+=6.283;
    if(rel2<SWEEP){clamps={};clamps[Math.floor(rel2/SWEEP*9)]=1;}
  }
  lastPt=p;
  e.preventDefault();
},{passive:false});
window.addEventListener('pointerup',function(){dragging=false;if(dragMode==='clamp')clamps={};dragMode=null;});
window.addEventListener('pointercancel',function(){dragging=false;clamps={};dragMode=null;});

var keys={};
window.addEventListener('keydown',function(e){
  initAudio();
  keys[e.key]=true;
  if(e.key>='1'&&e.key<='9'){clamps[parseInt(e.key,10)-1]=1;e.preventDefault();}
  if(e.key===' '){ if(active&&active.broken<0){rackRod(active);} e.preventDefault(); }
  if(e.key==='ArrowUp'){strapSpan=Math.min(1.02,strapSpan+0.0009);e.preventDefault();}
  if(e.key==='ArrowDown'){strapSpan=Math.max(0.985,strapSpan-0.0009);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();
});
window.addEventListener('keyup',function(e){
  keys[e.key]=false;
  if(e.key>='1'&&e.key<='9')delete clamps[parseInt(e.key,10)-1];
});

/* ---------- main loop ---------- */
var otherBenchT=3+Math.random()*5;
var dripT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var t=ts/1000;
  if(!last)last=t;
  var dt=Math.min(0.05,t-last);last=t;now+=dt;
  retortHours+=dt/3600;save.retortHours=retortHours;
  beamPhase=(beamPhase+dt/1400)%1;

  ambient=AMB0+shutter*7.5;   // shutter open = hot bright afternoon in the room

  // keyboard pull
  if(keys['ArrowRight'])pullVel+=1.35*dt*6;
  if(keys['ArrowLeft'])pullVel-=1.35*dt*6;
  pullVel*=Math.pow(0.02,dt);
  var prev=pull;
  pull=Math.max(0,Math.min(1,pull+pullVel*dt));
  slideSpeed=Math.abs(pull-prev)/Math.max(dt,0.001);

  // retort runs on its own clock
  nextRod-=dt;
  if(nextRod<=0){
    nextRod=26+Math.random()*16;
    if(active){
      // the one in hand goes cold on the bench
      bench.push(active);active=null;pull=0;clamps={};
    }
    active=fetchRod();
  }
  if(!active && bench.length===0 && now>1.2 && nextRod>24){ active=fetchRod(); nextRod=26+Math.random()*16; }

  if(active)coolRod(active,dt*2.2,ambient);
  for(var i=bench.length-1;i>=0;i--){
    coolRod(bench[i],dt*2.2,ambient);
    if(meanT(bench[i])<ambient+1.4){
      save.racked.push({s:bench[i].seed,a:0.02,w:0,i:bench[i].iroko?1:0});
      persist();bench.splice(i,1);
    }
  }
  solve(dt);

  // audio drive
  if(audioOn){
    var busy=Math.min(1,yieldCount/70);
    crackGain.gain.value=busy*0.16;
    crackFilt.frequency.value=1700+busy*2400+Math.sin(now*3)*180;
    crackFilt.Q.value=1.6+busy*3;
    var wet=active?active.wet:0;
    var sq=Math.min(1,slideSpeed*2.1);
    squealGain.gain.value=sq*0.085*(1-wet*0.62);
    squealFilt.frequency.value=1200+sq*2600+Math.sin(now*11)*160;
    squealOsc.frequency.value=900+sq*2200;
    dripT-=dt;
    if(dripT<=0 && active){ dripT=0.25+(1-active.wet)*3.5+Math.random()*0.5; if(active.wet>0.14)drip(); }
    otherBenchT-=dt;
    if(otherBenchT<=0){otherBenchT=4+Math.random()*9;otherBench();}
  }

  // draw
  benchBackdrop();
  drawFormer();
  drawStrapAndRod();
  // cold rods lying on the bench
  for(i=0;i<bench.length;i++){
    var br=bench[i];
    var yy=H*0.16+i*L.rodW*2.1;
    g.save();
    g.lineWidth=L.rodW*0.9;g.lineCap='round';
    var seg=10;
    for(var k=0;k<seg;k++){
      var ii=Math.floor(k/seg*(N-1));
      g.strokeStyle=rodColour(surfT(br,ii),br.M[ii],0,false);
      var x1=W*0.12+k/seg*W*0.34,x2=W*0.12+(k+1)/seg*W*0.34;
      g.beginPath();g.moveTo(x1,yy);g.lineTo(x2,yy);g.stroke();
    }
    g.restore();
  }
  drawBeam();
  // vignette, flat and hard
  g.save();
  var vg=g.createRadialGradient(W*0.5,H*0.5,Math.min(W,H)*0.35,W*0.5,H*0.5,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,9,6,0.50)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  g.restore();
}

resize();
active=fetchRod();
requestAnimationFrame(frame);

// twenty-eight in the retort, one former, ninety in the set rack
})();
</script>
