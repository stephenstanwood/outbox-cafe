  <meta name="outbox-spec-era" content="Right now, 4:41 in the afternoon, in the middle of a municipal leaf-collection season in a mid-sized city that the page never names — the sixth week of a nine-week route cycle, with a vacuum truck working the east side of a residential street and a second crew coming behind it with rakes. The page refuses to say the year and nothing in it tells you: the truck is from one decade, the radios are from another, the route map taped inside the cab door has been photocopied from a photocopy eleven times. Not autumn, not a mood, not a memory of childhood leaf piles: the hopper is at about two-thirds, the transfer site closes at 5:30, there are four hundred and ten linear feet of windrow left on this block, and a car is parked over the pile at 1144.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE PROGRESS BAR, rendered at true scale as a long horizontal strip running the full width of the screen and about an inch tall, sitting dead center with nothing above it and nothing below it — no header, no menu, no title, no footer, no percentage readout, no label, no cancel button, no scrollbar, no vertical scroll at any window size. The strangeness: THE BAR IS THE STREET. Its full length is the block's 1,410 linear feet of curb windrow, its filled portion is what has actually been vacuumed, and it does not advance smoothly — it advances in the real irregular bites a leaf truck takes, stalls entirely when the hose clogs, and OCCASIONALLY GOES BACKWARD, because wind puts leaves back onto curb that was already done and the crew re-does it. Inside the fill, at true relative position, are the actual obstructions the crew is working around: a parked car at 1144 rendering as a hard unfillable gap the bar simply flows past and leaves hollow, a storm grate, two driveway aprons, a section where the windrow is soaked through and moves at a fraction of the rate. The visitor's only vocabulary is what a hand does on a leaf truck: DRAG along the unfilled portion to move the nozzle boom and set where the suction is actually pointed, PRESS AND HOLD anywhere on the bar to run the impeller up, and SCRUB back and forth over a stalled section to work a clog loose. The bar never reaches the end, because the route is longer than the day.">
  <meta name="outbox-spec-subject" content="The flat mechanics of municipal loose-leaf collection, which is almost entirely a moisture-and-bulk-density problem and has nothing whatsoever to do with autumn. That a cubic yard of dry loose leaves weighs something like 250 pounds and the identical cubic yard rained on for two days weighs close to 800, so a truck that fills its 25-yard hopper by volume on a dry Tuesday hits its legal axle weight at half a hopper on a wet Thursday and has to leave — which means the route's real capacity is set by the weather three days ago and not by how much anybody vacuumed. That the blower is not a fan drawing leaves up a tube, it is a HIGH-VELOCITY IMPELLER that the leaves pass THROUGH and get shredded by, which is the entire reason the system works at all: whole leaves at their natural bulk density would fill the hopper in four hundred feet, and the impeller's shredding takes the density up by a factor of three or four. That a shredding impeller is therefore doing the compaction, and an impeller with worn blade tips shreds worse, fills the hopper faster with fewer leaves, and the crew notices it as more trips to the transfer site and not as a blade problem. That AIRSPEED IN THE HOSE IS THE WHOLE VARIABLE AND IT IS NOT ADJUSTABLE UPWARD: the system needs roughly 5,000 feet per minute of air in an 8- or 10-inch tube to keep material in suspension, below that leaves drop out of the airstream and lie down inside the hose, and once they lie down they catch the next thing and the clog builds from that point in both directions. That a clog is therefore almost never at the nozzle where the operator is looking. That AIRSPEED FALLS WHEN THE NOZZLE IS BURIED, because a nozzle jammed into a pile has no air path and the impeller is trying to move solid material with nothing to carry it — so the correct technique is to keep the nozzle at the EDGE of the windrow and let air in behind, which looks slower and is measurably faster, and every new operator buries the nozzle. That WET LEAVES DO NOT MERELY WEIGH MORE, THEY STICK: the friction coefficient of a wet leaf mat against asphalt is high enough that suction alone will not lift a soaked windrow, and the mat has to be broken with a rake first, which is why there is a second crew and why the second crew is the actual rate limit of the operation. That a wet windrow left more than about four days begins to compost — it heats, it mats into a felt, and at that point it is not leaf collection, it is shoveling. That STICKS ARE THE SINGLE MOST EXPENSIVE THING A RESIDENT CAN PUT IN A PILE: a branch over about an inch and a half jams the impeller housing, and clearing it is a shutdown, a lockout and twenty minutes, and the arithmetic is that one branch costs more route-feet than an entire block of leaves gains. That rocks are worse and throw blade balance permanently. That a PARKED CAR IS NOT AN INCONVENIENCE, IT IS A GAP THAT NEVER GETS FILLED: the crew cannot vacuum under it, the route does not come back for nine weeks, and that leaf mass goes into the storm drain at the first rain — which is the actual reason the program exists, because leaf litter in stormwater is a phosphorus load, and a city's entire loose-leaf budget is usually justified on a nutrient-loading number and not on tidiness. That the phosphorus arithmetic is honest and ugly: leaves sitting on pavement leach dissolved phosphorus within days, and pavement leaching is several times worse than leaves on a lawn, so the program's whole benefit depends on getting them off the HARD SURFACE and not on getting them at all. That TRANSFER-SITE CYCLE TIME IS THE REAL SCHEDULE: a round trip is however long it is, the site closes at a stated hour, and a truck that fills its hopper at twenty past five has an hour of leaves it cannot legally leave on the truck overnight in a composting mass because a loaded hopper of wet leaves genuinely self-heats. That STREET SWEEPERS ARE A DIFFERENT MACHINE ENTIRELY and cannot do this — a mechanical broom sweeper's hopper is sized for grit and it fills on leaves in two blocks. That WINDROW PLACEMENT IS A RESIDENT BEHAVIOR PROBLEM WITH A REAL COST: leaves in the gutter line are collectible, leaves on the grass strip behind the curb are not reachable by a truck-mounted boom, and leaves in the street beyond the gutter are a traffic hazard and get a different crew. And the flat arithmetic on the block: 1,410 feet of curb, about 410 left, a hopper at two-thirds, a site that closes at 5:30, one car at 1144, and a wind out of the northwest at eleven.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the bar's own behavior and in the sound, and that register is LOUD, ROUGH, UNEVEN, INTERRUPTED AND SLIGHTLY BEHIND SCHEDULE — a fill that surges when the windrow is dry and loose, crawls when it is soaked, stops dead and stays stopped for a genuinely uncomfortable number of seconds when something jams, and gives back ground it had already taken when a gust comes through. The pace is not graceful and is never rhythmic. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the truck keeps working whether or not anybody touches the bar. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cozy, NOT autumnal, NOT ASMR, NOT oddly-satisfying, NOT a process-video, NOT a screensaver, NOT stately, NOT reverent — this is 4:41 in the afternoon with a hopper at two-thirds and forty-nine minutes until the site closes.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the bar's fill color is COMPUTED and never chosen. The ground is the unfilled portion of the strip: dry asphalt with a curb line, a flat cool gray-black (#3a3b38) going paler and grittier where tires have polished it (#6e6f68), with real aggregate texture and a faint sun-bleached band along the top edge. The filled portion is NOT a color anybody picked — each of the fourteen hundred one-foot segments stores an actual leaf species mix, an actual moisture fraction, an actual days-on-pavement figure and an actual compaction state, and its rendered color falls out of those four: a fresh dry segment of mixed maple and oak reads a bright ochre-russet (#b5732a) with real per-leaf variation and hard edges; the same segment after two days of rain reads a saturated dark umber (#5a3a1c) with a glossy wet specular; a segment that has been down six days and started to heat reads a flat felted gray-brown (#4a4238) with no variation left in it at all, and a segment that is mostly silver maple reads measurably paler and yellower (#c9a441) than the same segment of pin oak. Nobody anywhere picks a leaf color. The unfillable gap at 1144 is bare polished pavement, exactly the ground color, and is distinguishable from unfilled curb only by the fact that the fill goes around it. Exactly one chip of amber beacon orange (#f08a12) is held strictly for three things: the strobe reflection that sweeps the full length of the bar every 1.4 seconds at true rotation rate, the cone markers at the two driveway aprons, and the hard edge of the nozzle boom wherever it currently sits. It never appears in the leaves, never in the pavement, never in the gap. Flat, hard, high contrast; no glow, no bloom, no soft focus, no vignette, no gradients other than honest wetness specular, honest compaction and honest strobe sweep.">
  <meta name="outbox-spec-wildcard" content="Somewhere in the windrow there is a garden hose. About eleven feet of half-inch vinyl hose, run over by a mower at some point and raked into the pile at the end of a yard, and the engine gives it exactly the properties eleven feet of vinyl hose has and no others: it is too flexible to jam the boom and too tough to shred, so it enters the intake, wraps the impeller shaft, and every single revolution after that it drags — a permanent, computed, irreversible parasitic torque that lowers the impeller's attainable rpm by a real amount and therefore lowers the airspeed ceiling for the rest of this visit and every visit after it. It cannot be cleared, cut, backed out, marked, avoided or seen coming; it is at the same segment position on every visit because the yard it came from is still the yard it came from, and a visitor who has already picked it up on a previous visit does not encounter it again and simply has a truck that never quite pulls what it used to.">

atcher / desk / log / 3am voice — it is 4:41 in the afternoon with the sun still up and traffic on the cross street. NO signal / transmission / frequency / broadcast framing, despite the crew having radios. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the bar, the fill, the gap and the one amber chip, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>
<!--
  1410 segments. one foot each. gutter line east side.
  hose: 10 in, 24 ft of flex plus 9 ft of boom. impeller 34 in, six blades.
  the segment at 1144 is under a silver sedan and stays under a silver sedan.
  around 1061 there is eleven feet of half inch vinyl. nobody put it there on purpose.
-->
<canvas id="strip" aria-label="east side curb"></canvas>
<div id="a"><a href="/archive">the rest of the route</a></div>
<script>
(function(){
"use strict";

/* ---------- constants, all real-ish ---------- */
var N = 1410;
var GAP_A = 1138, GAP_B = 1157;          // parked car at 1144
var GRATE_A = 622, GRATE_B = 630;
var APRON1_A = 388, APRON1_B = 400;
var APRON2_A = 905, APRON2_B = 917;
var WET_A = 700, WET_B = 900;
var HOSE_LEN = 33;                        // feet of conveyance
var HOSE_DIA = 10/12;                     // feet
var HOSE_AREA = Math.PI*HOSE_DIA*HOSE_DIA/4;
var SUSPEND = 5000;                       // ft/min
var HOPPER_YD3 = 25;
var AXLE_LB = 21400;
var HOSE_GARDEN = 1061;                   // eleven feet of vinyl, 1061..1071

/* ---------- persistence ---------- */
var KEY = "curb.eastside.v1";
var S;
function blankSegs(){
  var a = new Array(N), i;
  for(i=0;i<N;i++){
    // species mix: 0 = silver maple (pale, low density), 1 = pin oak (dark, tough)
    var band = Math.sin(i*0.0131)*0.5 + Math.sin(i*0.0037+2.1)*0.35;
    var oak = Math.min(1,Math.max(0, 0.45 + band*0.5 + (hash(i*7.7)-0.5)*0.22));
    var days = 1 + Math.floor(hash(i*3.1)*3);
    var moist = 0.14 + hash(i*11.3)*0.12;
    if(i>=WET_A&&i<=WET_B){ moist = 0.55 + hash(i*5.5)*0.18; days = 4 + Math.floor(hash(i*2.2)*3); }
    if(i>=GAP_A&&i<=GAP_B){ moist = 0.30 + hash(i*9.1)*0.1; days = 6; }
    var depth = 0.55 + hash(i*13.7)*0.75;                 // cubic yards of loose leaf per foot-ish
    if(i>=GRATE_A&&i<=GRATE_B) depth *= 1.6;              // they pile up on the grate
    if((i>=APRON1_A&&i<=APRON1_B)||(i>=APRON2_A&&i<=APRON2_B)) depth *= 0.35;
    var dens = 250 + moist*1100;                          // lb per cubic yard
    a[i] = {
      m: depth*dens*0.11,   // lb on this foot
      w: moist,
      d: days,
      ok: oak,
      c: (days>=5&&moist>0.45)?1:0,   // matted / composting
      v: hash(i*17.1)
    };
    if(i>=HOSE_GARDEN && i<HOSE_GARDEN+11) a[i].g = 1;
  }
  return a;
}
function hash(x){ var s = Math.sin(x*12.9898+78.233)*43758.5453; return s-Math.floor(s); }

function load(){
  var raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      var p = JSON.parse(raw);
      if(p && p.seg && p.seg.length===N){
        S = p;
        // un-collected mass only ever gets wetter and heavier
        var i;
        for(i=0;i<N;i++){
          var g=S.seg[i];
          if(g.m>0){
            g.d = (g.d||1)+1;
            g.w = Math.min(0.82,(g.w||0.2)+0.08);
            g.m = g.m*(1+0.055);
            if(g.d>=5&&g.w>0.45) g.c=1;
          }
        }
        S.route = (S.route||1)+1;
        if(S.hoseOn) { /* already wrapped, stays wrapped */ }
        return;
      }
    }catch(e){}
  }
  S = { seg: blankSegs(), feet:0, lb:0, blade:1.0, trips:0, clogMin:0, route:1, hoseOn:0, week:6 };
}
load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
var saveTick=0;

/* ---------- live machine state ---------- */
var M = {
  boom: 40,           // foot position of nozzle
  bury: 0.42,         // 0 = at shoulder, 1 = jammed into the pile
  rpm: 1050,          // impeller rpm
  rpmTgt: 1050,
  throttle: 0,        // press and hold
  airspeed: 0,
  deposit: 0,         // lb lying down inside the hose
  depPos: 20,         // feet from nozzle
  hopperYd: 0,
  hopperLb: 0,
  away: 0,            // seconds remaining of transfer trip
  wind: 11,
  windGust: 0,
  strobe: 0,
  t: 0,
  scrubVel: 0,
  lastDragX: null,
  lastDragT: 0,
  stickCool: 0,
  knock: 0,
  pulseFlash: 0,
  intake: 0
};
var MAXRPM_BASE = 1760;
function maxRpm(){ return MAXRPM_BASE - (S.hoseOn? 265:0) - (1-S.blade)*180; }

/* ---------- audio ---------- */
var AC=null, master=null, aud={};
function startAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = 0.0; master.connect(AC.destination);
  var now = AC.currentTime;
  master.gain.linearRampToValueAtTime(0.9, now+1.2);

  // noise buffer
  var len = AC.sampleRate*3, buf = AC.createBuffer(1,len,AC.sampleRate), ch = buf.getChannelData(0), i;
  for(i=0;i<len;i++) ch[i] = Math.random()*2-1;
  aud.noise = buf;

  // air rush bed
  var air = AC.createBufferSource(); air.buffer=buf; air.loop=true;
  var airF = AC.createBiquadFilter(); airF.type="bandpass"; airF.frequency.value=900; airF.Q.value=0.7;
  var airF2 = AC.createBiquadFilter(); airF2.type="lowpass"; airF2.frequency.value=3200;
  var airG = AC.createGain(); airG.gain.value=0.02;
  air.connect(airF); airF.connect(airF2); airF2.connect(airG); airG.connect(master); air.start();
  aud.airF=airF; aud.airG=airG; aud.airF2=airF2;

  // impeller blade-passing tone: 6 blades
  var bp = AC.createOscillator(); bp.type="sawtooth"; bp.frequency.value=105;
  var bpF = AC.createBiquadFilter(); bpF.type="lowpass"; bpF.frequency.value=1500;
  var bpG = AC.createGain(); bpG.gain.value=0.0;
  bp.connect(bpF); bpF.connect(bpG); bpG.connect(master); bp.start();
  var bp2 = AC.createOscillator(); bp2.type="square"; bp2.frequency.value=210;
  var bp2G = AC.createGain(); bp2G.gain.value=0.0;
  bp2.connect(bpF); bp2G.connect(master); bp2.connect(bp2G);
  aud.bp=bp; aud.bpG=bpG; aud.bp2=bp2; aud.bp2G=bp2G; aud.bpF=bpF;

  // diesel PTO at fast idle, with governor hunt
  var d1 = AC.createOscillator(); d1.type="sawtooth"; d1.frequency.value=31;
  var dF = AC.createBiquadFilter(); dF.type="lowpass"; dF.frequency.value=260;
  var dG = AC.createGain(); dG.gain.value=0.10;
  d1.connect(dF); dF.connect(dG); dG.connect(master); d1.start();
  var drum = AC.createBufferSource(); drum.buffer=buf; drum.loop=true;
  var drF = AC.createBiquadFilter(); drF.type="lowpass"; drF.frequency.value=180;
  var drG = AC.createGain(); drG.gain.value=0.055;
  drum.connect(drF); drF.connect(drG); drG.connect(master); drum.start();
  aud.d1=d1; aud.dG=dG;

  // leaf blower four houses down, never stops
  var lb = AC.createBufferSource(); lb.buffer=buf; lb.loop=true;
  var lbF = AC.createBiquadFilter(); lbF.type="bandpass"; lbF.frequency.value=1750; lbF.Q.value=2.6;
  var lbG = AC.createGain(); lbG.gain.value=0.012;
  lb.connect(lbF); lbF.connect(lbG); lbG.connect(master); lb.start();
  var lbo = AC.createOscillator(); lbo.type="sawtooth"; lbo.frequency.value=124;
  var lboG = AC.createGain(); lboG.gain.value=0.006;
  lbo.connect(lboG); lboG.connect(master); lbo.start();
  aud.lbo=lbo; aud.lbF=lbF;

  // street bed, no words
  var st = AC.createBufferSource(); st.buffer=buf; st.loop=true;
  var stF = AC.createBiquadFilter(); stF.type="lowpass"; stF.frequency.value=420;
  var stG = AC.createGain(); stG.gain.value=0.035;
  st.connect(stF); stF.connect(stG); stG.connect(master); st.start();

  aud.on=true;
}
function tick(fn){ if(aud.on) try{ fn(); }catch(e){} }

function blip(freq, dur, gain, type, filt){
  if(!aud.on) return;
  var o=AC.createOscillator(); o.type=type||"triangle"; o.frequency.value=freq;
  var g=AC.createGain(); g.gain.value=0;
  var n=AC.currentTime;
  g.gain.linearRampToValueAtTime(gain,n+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008,n+dur);
  if(filt){ var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filt; o.connect(f); f.connect(g);} else o.connect(g);
  g.connect(master); o.start(n); o.stop(n+dur+0.02);
}
function burst(cf, q, dur, gain){
  if(!aud.on) return;
  var s=AC.createBufferSource(); s.buffer=aud.noise; s.loop=true;
  var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=cf; f.Q.value=q;
  var g=AC.createGain(); g.gain.value=0;
  var n=AC.currentTime;
  g.gain.linearRampToValueAtTime(gain,n+0.005);
  g.gain.exponentialRampToValueAtTime(0.0006,n+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(n); s.stop(n+dur+0.05);
}
// rakes, two of them, out of time
var rakeA=0.0, rakeB=0.0;
// car passing
var carT = 40;

/* ---------- canvas ---------- */
var cv = document.getElementById("strip");
var cx = cv.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.max(1,Math.floor(W*DPR));
  cv.height = Math.max(1,Math.floor(H*DPR));
  cx.setTransform(DPR,0,0,DPR,0,0);
  buildGrit();
}
window.addEventListener("resize",resize);

/* aggregate texture, baked once */
var grit=null;
function buildGrit(){
  var c=document.createElement("canvas"); c.width=Math.max(1,Math.floor(W)); c.height=Math.max(1,Math.floor(H));
  var g=c.getContext("2d");
  var img=g.createImageData(c.width,c.height), dta=img.data, i;
  for(i=0;i<dta.length;i+=4){
    var px=(i/4)%c.width, py=Math.floor((i/4)/c.width);
    var r=Math.random();
    var v = r<0.055 ? 42 : (r<0.12? -30 : (r<0.20? 16 : 0));
    // polished tire band, lower third
    var pol = py/c.height;
    if(pol>0.52&&pol<0.86) v += 22*(1-Math.abs(pol-0.69)/0.17);
    // sun-bleached band along top
    if(pol<0.08) v += 14;
    dta[i]=128+v; dta[i+1]=128+v; dta[i+2]=128+v; dta[i+3]=255;
  }
  g.putImageData(img,0,0);
  grit=c;
}

/* ---------- colour computed from segment state ---------- */
function segColor(s){
  // base reflectance mixes: silver maple pale yellow vs pin oak russet
  var oak = s.ok;
  var r = 201 - oak*(201-181);
  var gg= 164 - oak*(164-115);
  var b =  65 - oak*(65-42);
  // per-leaf variation, hard edged
  var vv = (s.v-0.5)*46;
  r+=vv; gg+=vv*0.84; b+=vv*0.5;
  // moisture darkens and saturates toward umber
  var w = Math.min(1, s.w/0.75);
  r = r + (90-r)*w*0.86;
  gg= gg+ (58-gg)*w*0.86;
  b = b + (28-b)*w*0.86;
  // composted / felted: variation gone, flat gray-brown
  if(s.c){
    r = r*0.42 + 74*0.58;
    gg= gg*0.42 + 66*0.58;
    b = b*0.42 + 56*0.58;
  }
  return [r|0,gg|0,b|0];
}

/* ---------- physics ---------- */
function systemLoss(){
  // base hose friction + burial restriction + internal deposit restriction
  var base = 1.05;
  var bury = 1 + M.bury*M.bury*5.4;                    // buried nozzle strangles the air path
  var dep  = 1 + Math.pow(M.deposit/26, 1.7)*4.2;
  return base*bury*dep;
}
function computeAir(){
  var rpm = M.rpm;
  var sp = Math.pow(rpm/1000,2)*1.62;                  // static pressure, inches wg-ish
  var v = 8600*Math.sqrt(Math.max(0.0001, sp/systemLoss()))/2.32;
  M.airspeed = v;
  return v;
}

var lastT = performance.now();
function frame(now){
  var dt = Math.min(0.06,(now-lastT)/1000); lastT=now;
  M.t += dt;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}

function nearestLive(from, dir){
  var i;
  for(i=from;i>=0&&i<N;i+=dir){
    if(i>=GAP_A&&i<=GAP_B) continue;
    if(S.seg[i].m>0.02) return i;
  }
  return -1;
}

function step(dt){
  /* strobe at true rotation rate */
  M.strobe = (M.strobe + dt/1.4) % 1;

  /* wind runs on its own clock */
  M.windGust += dt;
  var gust = 11 + Math.sin(M.t*0.41)*3 + Math.sin(M.t*0.13)*2.5;
  if(hash(Math.floor(M.t*2.0)*1.7)>0.972) gust += 9;
  M.wind = gust;

  /* transfer trip */
  if(M.away>0){
    M.away -= dt;
    M.rpmTgt = 0;
    M.rpm += (M.rpmTgt-M.rpm)*Math.min(1,dt*0.6);
    if(M.away<=0){ M.hopperLb=0; M.hopperYd=0; M.away=0; }
  } else {
    var base = 980;
    var tgt = base + M.throttle*(maxRpm()-base);
    // load-down: material in the impeller pulls rpm
    tgt -= M.intake*310;
    if(M.knock>0){ tgt -= 260*M.knock; M.knock = Math.max(0,M.knock-dt*1.6); }
    // governor hunt
    tgt += Math.sin(M.t*3.1)*9 + Math.sin(M.t*7.7)*4;
    M.rpmTgt = Math.max(620, tgt);
    M.rpm += (M.rpmTgt-M.rpm)*Math.min(1, dt*2.4);
  }

  var v = computeAir();

  /* intake */
  M.intake *= Math.pow(0.02, dt);
  if(M.away<=0 && v>1200){
    var b = Math.max(0,Math.min(N-1, Math.round(M.boom)));
    // air path geometry: best at the shoulder of the windrow
    var geom = 1 - M.bury;               // 1 = at edge
    var pathFactor = 0.18 + 1.35*geom*geom;
    // find material within nozzle reach (nozzle covers about 2 ft)
    var i, taken=0, wetTaken=0, dryHits=0, wetHits=0, stick=false, vinyl=false;
    for(i=b-1;i<=b+1;i++){
      if(i<0||i>=N) continue;
      if(i>=GAP_A&&i<=GAP_B) continue;       // under the car. no suction at any speed.
      var s = S.seg[i];
      if(s.m<=0.001) continue;
      if(v<SUSPEND){
        // not suspending. material lies down in the hose.
        var drop = Math.min(s.m, 9*dt*(1-v/SUSPEND));
        s.m -= drop;
        M.deposit += drop*0.62;
        if(M.deposit>0.4 && M.depPos===20) M.depPos = 6 + Math.floor(hash(M.t)*20);
        continue;
      }
      // mat friction: soaked mat will not lift by suction alone
      var fric = s.c ? 0.06 : (s.w>0.45 ? 0.17 + (0.62-s.w) : 1.0);
      fric = Math.max(0.04, Math.min(1, fric));
      var rate = 92*dt * pathFactor * fric * Math.min(1.6,(v/SUSPEND));
      var take = Math.min(s.m, rate);
      s.m -= take;
      taken += take;
      if(s.w>0.45) { wetTaken+=take; wetHits++; } else dryHits++;
      if(s.g && !S.hoseOn && s.m<=0.001){
        S.hoseOn = 1; vinyl = true;
      }
      if(s.m<=0.001) s.m=0;
      // a stick, occasionally
      if(M.stickCool<=0 && hash(i*23.4+Math.floor(M.t))>0.9988){
        stick = true; M.stickCool = 6;
      }
    }
    M.stickCool = Math.max(0,M.stickCool-dt);

    if(taken>0){
      M.intake = Math.min(1, M.intake + taken*0.09);
      // shredding compaction from blade condition
      var comp = 2.0 + S.blade*2.0;
      var lbPerYd = 250 + (wetTaken/Math.max(0.0001,taken))*550;
      M.hopperLb += taken;
      M.hopperYd += (taken/lbPerYd)/comp;
      S.lb += taken;
      // blade wear, permanent, only down
      S.blade = Math.max(0.42, S.blade - taken*0.0000085 - (wetTaken)*0.0000040);
      // leaf impacts against the housing
      if(Math.random() < Math.min(0.85, taken*3.2)){
        if(wetHits>dryHits) burst(240+Math.random()*180, 1.1, 0.06, 0.055);
        else burst(1700+Math.random()*2200, 2.2, 0.035, 0.05);
      }
    }
    if(stick){
      M.knock = 1;
      burst(160,0.9,0.22,0.24);
      blip(78,0.34,0.20,"square",400);
      S.clogMin += 0.4;
    }
    if(vinyl){
      // eleven feet of half inch vinyl finds the shaft
      burst(520,3.4,0.9,0.14);
      blip(190,0.9,0.12,"sawtooth",700);
      M.knock = 0.8;
    }
  }

  /* hopper limits */
  if(M.away<=0 && (M.hopperYd>=HOPPER_YD3 || M.hopperLb>=AXLE_LB)){
    M.away = 46 + Math.random()*16;
    S.trips += 1;
    burst(120,0.7,1.6,0.10);
  }

  /* deposit inside the hose: self-feeding */
  if(M.deposit>0.02){
    if(v<SUSPEND*0.96){ M.deposit += dt*0.55*(1-v/SUSPEND); S.clogMin += dt/60; }
    else { M.deposit = Math.max(0, M.deposit - dt*0.22*(v/SUSPEND-0.96)*3); }
    if(M.deposit<0.02){ M.deposit=0; M.depPos=20; }
  }

  /* scrub: reverse pulsing. fast enough carries it, slow makes it denser. */
  if(Math.abs(M.scrubVel)>0.5){
    var speed = Math.abs(M.scrubVel);
    if(speed>430){
      M.deposit = Math.max(0, M.deposit - dt*speed*0.011);
      if(Math.random()<0.4) burst(600+Math.random()*900,1.4,0.07,0.05);
    } else if(speed>40){
      M.deposit += dt*0.30;
    }
  }
  M.scrubVel *= Math.pow(0.05, dt);

  /* wind moves DRY low-density leaves back onto cleared curb */
  var wr = Math.max(0,(M.wind-8)/9);
  if(wr>0){
    var tries = Math.floor(wr*46*dt) + (Math.random()<wr*46*dt%1?1:0);
    for(var k=0;k<tries;k++){
      var src = Math.floor(Math.random()*N);
      if(src>=GAP_A&&src<=GAP_B) continue;
      var ss = S.seg[src];
      if(ss.m<=0.05) continue;
      if(ss.w>0.34) continue;            // soaked windrow does not budge, ever
      if(ss.c) continue;
      var dst = src - 4 - Math.floor(Math.random()*30);   // NW wind, pushes back down the block
      if(dst<0) continue;
      if(dst>=GAP_A&&dst<=GAP_B) continue;
      var amt = Math.min(ss.m, 0.30+Math.random()*0.7);
      ss.m -= amt;
      var ds = S.seg[dst];
      ds.m += amt;
      ds.w = (ds.w*0.7 + ss.w*0.3);
      ds.ok = (ds.ok + ss.ok)/2;
      ds.c = 0;
      if(ds.m>0.001 && ds.v===undefined) ds.v=Math.random();
    }
  }

  /* feet cleared derived from segments, never a percentage */
  var cleared = 0;
  for(var q=0;q<N;q++){ if(q>=GAP_A&&q<=GAP_B) continue; if(S.seg[q].m<=0.02) cleared++; }
  S.feet = cleared;

  /* audio follow */
  tick(function(){
    var n=AC.currentTime;
    var bladePass = M.rpm/60*6;
    aud.bp.frequency.setTargetAtTime(Math.max(20,bladePass), n, 0.05);
    aud.bp2.frequency.setTargetAtTime(Math.max(30,bladePass*2), n, 0.05);
    var vol = M.away>0 ? 0.0 : 0.035 + M.throttle*0.05;
    aud.bpG.gain.setTargetAtTime(vol, n, 0.09);
    aud.bp2G.gain.setTargetAtTime(vol*0.35, n, 0.09);
    aud.bpF.frequency.setTargetAtTime(700+M.rpm*0.9, n, 0.1);
    // air rush thins as clog builds
    var an = Math.min(1, M.airspeed/6200);
    aud.airG.gain.setTargetAtTime(M.away>0?0.004:0.010+an*0.055, n, 0.12);
    aud.airF.frequency.setTargetAtTime(420 + an*1500, n, 0.12);
    aud.airF2.frequency.setTargetAtTime(900 + an*4200, n, 0.12);
    // diesel governor hunt
    aud.d1.frequency.setTargetAtTime(30.5 + Math.sin(M.t*1.7)*0.7 + M.throttle*1.6, n, 0.2);
    aud.dG.gain.setTargetAtTime(M.away>0?0.055:0.10, n, 0.3);
    // leaf blower never stops
    aud.lbo.frequency.setTargetAtTime(118+Math.sin(M.t*0.6)*10, n, 0.3);
    aud.lbF.frequency.setTargetAtTime(1600+Math.sin(M.t*0.37)*420, n, 0.3);
  });

  // rakes on asphalt, two of them out of time
  rakeA -= dt; rakeB -= dt;
  if(rakeA<=0){ rakeA = 0.52+Math.random()*0.34; burst(2600+Math.random()*1200, 1.1, 0.16, 0.030); }
  if(rakeB<=0){ rakeB = 0.71+Math.random()*0.41; burst(1900+Math.random()*900, 0.9, 0.20, 0.024); }
  // car in the opposite lane
  carT -= dt;
  if(carT<=0){
    carT = 78+Math.random()*30;
    (function(){
      if(!aud.on) return;
      var s=AC.createBufferSource(); s.buffer=aud.noise; s.loop=true;
      var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=300; f.Q.value=0.6;
      var g=AC.createGain(); g.gain.value=0;
      var n0=AC.currentTime;
      g.gain.linearRampToValueAtTime(0.055,n0+1.5);
      g.gain.linearRampToValueAtTime(0.0001,n0+3.4);
      f.frequency.setValueAtTime(240,n0);
      f.frequency.linearRampToValueAtTime(620,n0+1.5);
      f.frequency.linearRampToValueAtTime(190,n0+3.4);
      s.connect(f); f.connect(g); g.connect(master); s.start(n0); s.stop(n0+3.6);
    })();
  }

  saveTick += dt;
  if(saveTick>4){ saveTick=0; save(); }
}

/* ---------- draw ---------- */
function draw(){
  if(!W||!H) return;
  var px = W/N;

  // ground: asphalt
  cx.fillStyle="#3a3b38";
  cx.fillRect(0,0,W,H);
  // polished tire band + bleached top edge via grit overlay
  if(grit){
    cx.globalAlpha=0.30;
    cx.globalCompositeOperation="overlay";
    cx.drawImage(grit,0,0,W,H);
    cx.globalCompositeOperation="source-over";
    cx.globalAlpha=1;
  }
  // curb line along the top
  cx.fillStyle="#6e6f68"; cx.fillRect(0,0,W,Math.max(1,H*0.035));
  cx.fillStyle="#2b2c29"; cx.fillRect(0,H*0.035,W,Math.max(1,H*0.02));
  // gutter shadow at the bottom
  cx.fillStyle="rgba(20,20,18,0.5)"; cx.fillRect(0,H-Math.max(2,H*0.07),W,H*0.07);

  // leaves, per segment
  var i;
  var top = H*0.07, bot = H*0.93, span = bot-top;
  for(i=0;i<N;i++){
    var s = S.seg[i];
    if(i>=GAP_A&&i<=GAP_B) continue;      // bare pavement, exactly the ground
    if(s.m<=0.02) continue;
    var c = segColor(s);
    var hgt = Math.min(1, s.m/2.6);
    var hh = span*(0.30+hgt*0.70);
    var x = i*px, w2 = Math.max(1, px+0.6);
    var y = bot-hh;
    cx.fillStyle="rgb("+c[0]+","+c[1]+","+c[2]+")";
    cx.fillRect(x, y, w2, hh);
    // hard-edged per-leaf variation on top
    if(!s.c && px>0.4){
      var vv = (hash(i*31.4+Math.floor(s.v*97))-0.5);
      var c2 = [ Math.min(255,c[0]+vv*44|0), Math.min(255,c[1]+vv*36|0), Math.min(255,c[2]+vv*22|0) ];
      cx.fillStyle="rgb("+c2[0]+","+c2[1]+","+c2[2]+")";
      cx.fillRect(x, y, w2, Math.max(1, hh*0.34));
    }
    // honest wetness specular
    if(s.w>0.42 && !s.c){
      var sp = (s.w-0.42)/0.4;
      cx.fillStyle="rgba(236,228,206,"+(0.05+sp*0.13).toFixed(3)+")";
      cx.fillRect(x, y+hh*0.06, w2, Math.max(1, hh*0.10));
    }
    // compaction: felted, darker at the base, no variation
    if(s.c){
      cx.fillStyle="rgba(24,22,19,0.28)";
      cx.fillRect(x, bot-hh*0.30, w2, hh*0.30);
    }
  }

  // storm grate: cast iron slots, drawn on bare pavement
  for(i=GRATE_A;i<=GRATE_B;i++){
    if(S.seg[i].m>0.02) continue;
    var gx = i*px;
    cx.fillStyle = (i%2===0)? "#232420" : "#54554e";
    cx.fillRect(gx, H*0.58, Math.max(1,px+0.6), H*0.30);
  }

  // parked car gap: polished pavement, nothing else
  cx.fillStyle="rgba(110,111,104,0.16)";
  cx.fillRect(GAP_A*px, H*0.52, (GAP_B-GAP_A+1)*px, H*0.34);

  // strobe sweep, true rotation rate, the amber chip
  var sx = (M.strobe*1.52 - 0.26)*W;
  var swW = W*0.21;
  var grad = cx.createLinearGradient(sx-swW,0,sx+swW,0);
  grad.addColorStop(0,"rgba(240,138,18,0)");
  grad.addColorStop(0.5,"rgba(240,138,18,0.20)");
  grad.addColorStop(1,"rgba(240,138,18,0)");
  cx.fillStyle=grad;
  cx.fillRect(0,0,W,H);

  // cone markers at the two driveway aprons
  drawCone((APRON1_A+APRON1_B)/2*px);
  drawCone((APRON2_A+APRON2_B)/2*px);

  // nozzle boom: hard amber edge
  var bx = M.boom*px;
  var bw = Math.max(3, px*2);
  var dropY = top + span*(1-M.bury)*0.10;
  cx.fillStyle="#f08a12";
  cx.fillRect(bx-bw*0.5, dropY, bw, span*(0.20+M.bury*0.70));
  cx.fillRect(bx-bw*1.9, dropY, bw*3.8, Math.max(2,H*0.045));
  // boom mast to the top edge
  cx.fillRect(bx-1, 0, 2, dropY);

  // deposit inside the hose, read on the bar as a stalled dark band ahead of the nozzle
  if(M.deposit>0.5){
    var dpx = bx - M.depPos*px*1.0;
    var dw = Math.max(4, M.deposit*px*0.9);
    cx.fillStyle="rgba(30,27,23,"+Math.min(0.62,0.12+M.deposit/60).toFixed(3)+")";
    cx.fillRect(dpx-dw*0.5, top, dw, span);
  }

  // pulse flash from number keys
  if(M.pulseFlash>0){
    cx.fillStyle="rgba(200,200,190,"+(M.pulseFlash*0.10).toFixed(3)+")";
    cx.fillRect(0,0,W,H);
    M.pulseFlash = Math.max(0, M.pulseFlash-0.06);
  }

  // truck away at the transfer site: the boom parks off the left end, bar simply stops
  if(M.away>0){
    cx.fillStyle="rgba(23,24,22,0.55)";
    cx.fillRect(0,0,W,H);
  }
}
function drawCone(x){
  var h=H*0.40, base=H*0.90;
  cx.fillStyle="#f08a12";
  cx.beginPath();
  cx.moveTo(x, base-h);
  cx.lineTo(x-h*0.34, base);
  cx.lineTo(x+h*0.34, base);
  cx.closePath(); cx.fill();
  cx.fillStyle="#3a3b38";
  cx.fillRect(x-h*0.22, base-h*0.52, h*0.44, h*0.13);
}

/* ---------- input ---------- */
function xToFoot(clientX){
  var r = cv.getBoundingClientRect();
  return Math.max(0,Math.min(N-1, (clientX-r.left)/r.width*N));
}
function yToBury(clientY){
  var r = cv.getBoundingClientRect();
  var f = (clientY-r.top)/r.height;
  return Math.max(0,Math.min(1, (f-0.15)/0.75));
}
var dragging=false, holding=false, holdTimer=null;

function down(e){
  startAudio();
  dragging=true; holding=true;
  var p = pt(e);
  M.boom = xToFoot(p.x);
  M.bury = yToBury(p.y);
  M.lastDragX = p.x; M.lastDragT = performance.now();
  M.throttle = 1;
  e.preventDefault();
}
function move(e){
  if(!dragging) return;
  var p = pt(e);
  var nowT = performance.now();
  var dtm = Math.max(1, nowT-M.lastDragT);
  var vel = (p.x - M.lastDragX)/(dtm/1000);
  // scrub detection: direction reversals count
  if(Math.sign(vel)!==Math.sign(M.scrubVel) && Math.abs(vel)>60){
    M.scrubVel = vel;
  } else {
    M.scrubVel = M.scrubVel*0.6 + vel*0.4;
  }
  M.lastDragX = p.x; M.lastDragT = nowT;
  M.boom = xToFoot(p.x);
  M.bury = yToBury(p.y);
  e.preventDefault();
}
function up(){ dragging=false; holding=false; M.throttle=0; }
function pt(e){
  if(e.touches&&e.touches.length) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}
cv.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("touchend",up);
window.addEventListener("touchcancel",up);

window.addEventListener("keydown",function(e){
  startAudio();
  var k=e.key;
  if(k==="ArrowLeft"){ M.boom = Math.max(0, M.boom - (e.shiftKey?10:1)); e.preventDefault(); }
  else if(k==="ArrowRight"){ M.boom = Math.min(N-1, M.boom + (e.shiftKey?10:1)); e.preventDefault(); }
  else if(k==="ArrowUp"){ M.bury = Math.max(0, M.bury-0.06); e.preventDefault(); }
  else if(k==="ArrowDown"){ M.bury = Math.min(1, M.bury+0.06); e.preventDefault(); }
  else if(k===" "){ M.throttle = 1; e.preventDefault(); }
  else if(k>="1"&&k<="9"){
    // pulse the hose at nine fixed points along its length
    var idx = parseInt(k,10);
    var ftAlong = (idx-0.5)/9*HOSE_LEN;
    var near = Math.abs(ftAlong - M.depPos);
    if(M.deposit>0 && near<3.0){
      M.deposit = Math.max(0, M.deposit - 9.5);
      burst(420,1.0,0.3,0.16);
      blip(96,0.22,0.16,"square",500);
    } else {
      burst(900,2.0,0.10,0.05);
      M.deposit += 0.25;
    }
    M.pulseFlash = 1;
    e.preventDefault();
  }
});
window.addEventListener("keyup",function(e){
  if(e.key===" "){ M.throttle=0; }
});
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });

resize();
requestAnimationFrame(frame);

/* east side, week six of nine. 1410 feet of gutter line, 410 of it still standing.
   hopper two thirds. site shuts at half past five. northwest at eleven. */
})();
</script>
