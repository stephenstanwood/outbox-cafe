  <meta name="outbox-spec-format" content="A genuinely playable plate-spinning act filling the whole viewport: a row of tall whippy cane rods planted in a footlit rack, each rod topped with a spinning willow-pattern plate drawn edge-on and precessing. Every plate loses spin on its own in real time — as its spin bleeds off, its wobble grows, the plate leans further and further off true and starts to walk around the rod-tip, until past a tipping point it slides clean off and SMASHES on the boards below. You click (or tap) any plate to flick it back up to full speed, whipping the rod as you do; you set a fresh plate spinning by clicking an empty rod, and you can plant new rods to lengthen your line. The whole game is running the line — reading which plate is dying fastest and getting to it before it goes. No page chrome, no header, no menu: just the footlit rack, the wobbling china, and the growing risk.">
  <meta name="outbox-spec-subject" content="The plain thrilling panic of keeping a whole row of spinning plates alive: the read of the line — which plate has quietly gone from a fast blurred hum to a slow drunken lean while your back was turned, which one has thirty seconds and which one has three — the rhythm of running down the rack topping each one up, and the sick little crisis when three go wobbly at the same instant and you can only reach one. The honest physics of it: a plate spins stable while it's fast, and the slower it gets the more it precesses and leans, walking round the rod-tip in ever-wider circles until it tips past saving. The whippy re-flick that shoots the spin back into a tired plate, the fat china SMASH when you're a half-second late, and the greedy dare of setting just one more plate going when you've already got six you can barely hold. Not a metaphor for busyness or juggling one's life — a rack of cane rods, a stack of willow-pattern plates, and the genuinely hard reaction-game of not letting any of them fall.">
  <meta name="outbox-spec-tone" content="The breathless, affectionate, half-to-herself voice of Nell the spinner working her own line mid-act — she names her plates by where they sit on the rack and talks to them, not to you, coaxing and scolding the china as she runs: 'come on number two, don't you dare — THERE, back you go'; 'five's gone drunk on me, hold, hold, I'm coming'; 'ooh she's a good spinner, that one, look at her sit.' Focused, quick, warmly bossy with the plates the way you'd be with animals you've worked for years, delighted when the whole line hums true at once, honestly rattled for a beat when one smashes ('ah — down she goes — mind your feet') before she's straight back to the next. Present-tense, live, a bit out of breath, generous, never cruel to a single plate; never wistful, never turning it into a lesson about anything — the band's vamping and she's just got to keep the line up till the number's done.">

<meta name="description" content="A rack of cane rods, a stack of willow-pattern plates, and the honest business of not letting any of them fall.">
<style>

    -webkit-user-select:none;user-select:none;touch-action:none;}
  #stage{display:block;width:100vw;height:100vh;cursor:pointer;}
  /* she keeps saying she's got room for one more. she has never once had room for one more. */
  .ui{position:fixed;z-index:5;font-family:Georgia,serif;}
  #tools{top:10px;right:12px;display:flex;gap:8px;}
  .btn{background:rgba(243,239,230,.10);border:1px solid rgba(195,154,75,.55);
    color:#f3efe6;font-family:Georgia,serif;font-size:13px;letter-spacing:.02em;
    padding:7px 12px;border-radius:2px;cursor:pointer;transition:background .15s;}
  .btn:hover{background:rgba(232,162,76,.22);}
  .btn.on{background:rgba(232,162,76,.30);border-color:#e8a24c;}
  #bill{bottom:9px;right:14px;font-size:12px;font-style:italic;}
  #bill a{color:#e8a24c;text-decoration:none;border-bottom:1px dotted rgba(232,162,76,.5);}
  #bill a:hover{color:#f3efe6;}
  #hint{left:50%;bottom:46px;transform:translateX(-50%);text-align:center;
    color:#f3efe6;font-size:13px;font-style:italic;line-height:1.7;opacity:.9;
    text-shadow:0 1px 3px #2a0910;max-width:90vw;transition:opacity 1.2s;pointer-events:none;}
  #hint.gone{opacity:0;}

<body>
<canvas id="stage"></canvas>
<div class="ui" id="tools">
  <button class="btn" id="plant">＋ plant a rod</button>
  <button class="btn" id="band">band ♪</button>
</div>
<div class="ui" id="hint">
  <b>click a plate</b> to whip it back up &nbsp;·&nbsp; <b>click a bare rod</b> to set one going<br>
  <b>spacebar</b> catches whichever's nearest the boards &nbsp;·&nbsp; <b>＋</b> to lengthen the line
</div>
<div class="ui" id="bill">the rest of tonight's <a href="/archive">bill</a> →</div>

<script>
"use strict";
/* Second house, and she's three plates in with the fourth going up. Keep the line up
   till the number's done — that's the whole of it. The band'll tell you when to stop. */

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const CRIMSON='#7a1f2b', CRIMDK='#5a141d', BLUE='#2a4d8f', BLUEDK='#1d3a6e',
      WHITE='#f3efe6', AMBER='#e8a24c', GILT='#c39a4b';

let Wc=0, Hc=0, dpr=1, tipY=0, rackY=0, boardY=0, R=52, margin=40, spacing=120;
const rods=[]; const shards=[];
let last=performance.now()/1000;

const BASE_DECAY=0.049, DANGER=0.34, FALL_AT=0.045, FULL=1;

/* ---- persistent tally: only ever counts up, across every visit to this hall ---- */
const KEY='outbox.plates.kept.v1';
let kept = parseInt(localStorage.getItem(KEY)||'0',10); if(isNaN(kept))kept=0;
function bumpKept(){ kept++; try{localStorage.setItem(KEY,String(kept));}catch(e){} }

let granBroken=false, granSaid=false;

function makePlate(gran){
  return { spin:FULL, phase:Math.random()*7, precess:Math.random()*7,
    decay:BASE_DECAY*(0.78+Math.random()*0.52),
    tilt:0, squash:0.42, screenX:0, screenY:0, R:R,
    gran:!!gran, wasSafe:true, falling:false, fx:0, fy:0, vx:0, vy:0, spinvel:0 };
}
function makeRod(){ return { plate:null, whip:0 }; }

function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  Wc=window.innerWidth; Hc=window.innerHeight;
  cv.width=Wc*dpr; cv.height=Hc*dpr; cv.style.width=Wc+'px'; cv.style.height=Hc+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  tipY=Hc*0.34; rackY=Hc*0.80; boardY=Hc*0.845;
  margin=Math.max(Wc*0.06,26);
  const n=Math.max(rods.length,1);
  spacing=(Wc-2*margin)/n;
  R=Math.min(spacing*0.40, Hc*0.15, 66);
  for(let i=0;i<rods.length;i++){ rods[i].x=margin+(i+0.5)*spacing; if(rods[i].plate)rods[i].plate.R=R; }
}
window.addEventListener('resize',layout);

/* start mid-act: a few rods planted, three humming, one going up, one bare */
function boot(){
  const start = window.innerWidth<560 ? 5 : 6;
  for(let i=0;i<start;i++) rods.push(makeRod());
  layout();
  const seed=[0.90,0.66,0.42,0.95];
  const granIdx=1;
  for(let i=0;i<seed.length;i++){ rods[i].plate=makePlate(i===granIdx); rods[i].plate.spin=seed[i]; }
}

/* ---------------- Nell's voice ---------------- */
let msg={text:'',t:0,life:1,prio:0};
function say(text,life,prio){
  prio=prio||0; life=life||3.6;
  if(prio<msg.prio && msg.t>0.5) return;
  msg={text,t:life,life,prio};
}
const WORDS=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function word(n){ return WORDS[n]|| ('number '+n); }
function pick(a){ return a[(Math.random()*a.length)|0]; }

function sayDanger(n){ say(pick([
  "come on, "+word(n)+", don't you dare",
  word(n)+"'s gone drunk on me — hold, hold, I'm coming",
  "steady now, "+word(n)+", I see you leaning",
  "not "+word(n)+", not yet — hold on for me"
]),3.2,2); }
function sayCatch(n){ say(pick([
  "THERE — back you go, "+word(n),
  "caught you, caught you",
  "up you come, "+word(n)+", good plate",
  "ha! not this time"
]),2.6,3); }
function saySmash(n){ say(pick([
  "ah — down she goes — mind your feet",
  "lost "+word(n)+" — never mind, never mind, on we go",
  "there she goes, butterfingers me — next!",
  "oop — "+word(n)+"'s off — leave it, leave it"
]),3.4,5); }
function sayFresh(n){ say(pick([
  "up you go, fresh one",
  "one more, just the one — "+word(n),
  "spin for me, "+word(n)+", there's a girl"
]),2.4,1); }
function sayHum(){ say(pick([
  "ooh — listen to that, the whole line singing",
  "look at 'em all sit — good plates, good plates",
  "that's it, that's the ticket, hold it there"
]),3.0,1); }

/* ---------------- Web Audio ---------------- */
let actx=null, master=null;
function ensureAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
  }catch(e){ actx=null; }
}
function whipTick(){
  if(!actx)return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(240,t+0.06);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.1);
}
function setTick(){
  if(!actx)return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(760,t+0.05);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.10,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16);
}
function smashSound(){
  if(!actx)return; const t=actx.currentTime;
  // fat china: a noise burst + a low thud + a scatter of ceramic pings
  const n=actx.createBufferSource(); const len=actx.sampleRate*0.35;
  const buf=actx.createBuffer(1,len,actx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
  n.buffer=buf; const nf=actx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2600; nf.Q.value=0.7;
  const ng=actx.createGain(); ng.gain.setValueAtTime(0.5,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.34);
  n.connect(nf); nf.connect(ng); ng.connect(master); n.start(t);
  const thud=actx.createOscillator(), tg=actx.createGain();
  thud.type='sine'; thud.frequency.setValueAtTime(150,t); thud.frequency.exponentialRampToValueAtTime(58,t+0.18);
  tg.gain.setValueAtTime(0.4,t); tg.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  thud.connect(tg); tg.connect(master); thud.start(t); thud.stop(t+0.24);
  for(let k=0;k<4;k++){ const f=2200+Math.random()*3200; const dt=Math.random()*0.06;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t+dt); o.frequency.exponentialRampToValueAtTime(f*0.7,t+dt+0.12);
    g.gain.setValueAtTime(0.001,t+dt); g.gain.exponentialRampToValueAtTime(0.09,t+dt+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.15);
    o.connect(g); g.connect(master); o.start(t+dt); o.stop(t+dt+0.16);
  }
}

/* the pit band, vamping a quick little two-step */
let bandOn=false, nextNote=0, step=0; const TEMPO=138;
function bandNote(t,freq,type,vol,dur){
  const o=actx.createOscillator(), g=actx.createGain(), lp=actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1400; o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function chord(t){ [196,247,294].forEach(f=>bandNote(t,f,'square',0.028,0.14)); }
function scheduleBand(){
  if(!bandOn||!actx) return;
  const eighth=(60/TEMPO)/2;
  while(nextNote < actx.currentTime + 0.12){
    if(step%2===0) bandNote(nextNote, step%4===0?98:147, 'triangle', 0.06, 0.16);
    else chord(nextNote);
    nextNote+=eighth; step=(step+1)%8;
  }
}

/* ---------------- update ---------------- */
function update(dt){
  let live=0, humCount=0, allHum=true;
  for(const rod of rods){
    if(rod.whip>0) rod.whip=Math.max(0,rod.whip-dt*3.2);
    const p=rod.plate; if(!p) continue;
    if(p.falling){
      p.vy+=1500*dt; p.fx+=p.vx*dt; p.fy+=p.vy*dt; p.spinvel+=dt*6;
      p.screenX=rod.x+p.fx; p.screenY=tipY-R*0.15+p.fy;
      if(p.screenY>=boardY){ smash(rod); }
      continue;
    }
    live++;
    p.spin=Math.max(0,p.spin-p.decay*dt);
    const tired=1-p.spin;
    p.phase += (3.5 + p.spin*22)*dt;            // spins fast → slow drunken turn
    p.precess += (0.7 + tired*tired*5.0)*dt;    // walks the rod-tip, wider & wider
    p.tilt = tired*0.6*Math.sin(p.precess);
    p.squash = 0.42 - tired*0.20*Math.cos(p.precess);
    const wob = tired*tired;
    p.screenX = rod.x + Math.cos(p.precess)*wob*R*0.95;
    p.screenY = tipY - R*0.14 + Math.sin(p.precess)*wob*R*0.42;

    if(p.spin<DANGER){
      if(p.wasSafe){ p.wasSafe=false; sayDanger(rods.indexOf(rod)+1); }
    } else p.wasSafe=true;

    if(p.spin>0.72) humCount++; else allHum=false;
    if(p.spin<=FALL_AT && !p.falling){
      p.falling=true; p.vx=Math.cos(p.precess)*90; p.vy=10;
    }
  }
  // whole line humming true at once — she can't help crowing
  if(live>=3 && allHum && humCount===live){
    if(!update._hum || performance.now()-update._hum>6000){ update._hum=performance.now(); sayHum(); }
  }

  for(let i=shards.length-1;i>=0;i--){ const s=shards[i];
    s.vy+=1600*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=s.spin*dt; s.life-=dt;
    if(s.life<=0||s.y>Hc+40) shards.splice(i,1);
  }
  if(msg.t>0) msg.t-=dt;
}

function smash(rod){
  const p=rod.plate; const cx=p.screenX, cy=boardY;
  smashSound();
  for(let i=0;i<11;i++){ const a=Math.random()*Math.PI - Math.PI, sp=120+Math.random()*260;
    shards.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:-Math.random()*260-40,
      size:R*(0.10+Math.random()*0.16),rot:Math.random()*7,spin:(Math.random()-0.5)*14,
      life:0.6+Math.random()*0.5,blue:Math.random()<0.55});
  }
  const n=rods.indexOf(rod)+1;
  if(p.gran && !granSaid){ granSaid=true; granBroken=true; say("...oh. oh, not that one — that was Gran's.",5.2,10); }
  else saySmash(n);
  rod.plate=null;
}

/* ---------------- input ---------------- */
function flick(rod){
  const p=rod.plate; if(!p||p.falling) return;
  const wasDanger = p.spin<DANGER;
  p.spin=FULL; p.wasSafe=true; rod.whip=1; whipTick();
  if(wasDanger){ bumpKept(); sayCatch(rods.indexOf(rod)+1); }
}
function startPlate(rod){
  rod.plate=makePlate(false); rod.plate.R=R; setTick(); sayFresh(rods.indexOf(rod)+1);
}
function hideHint(){ document.getElementById('hint').classList.add('gone'); }

cv.addEventListener('pointerdown',e=>{
  ensureAudio(); if(actx&&actx.state==='suspended')actx.resume(); hideHint();
  const rect=cv.getBoundingClientRect(); const x=e.clientX-rect.left, y=e.clientY-rect.top;
  // nearest rod by x
  let best=-1, bd=1e9;
  for(let i=0;i<rods.length;i++){ const d=Math.abs(x-rods[i].x); if(d<bd){bd=d;best=i;} }
  if(best<0) return;
  const rod=rods[best];
  if(bd<spacing*0.55){
    if(rod.plate && !rod.plate.falling){
      const p=rod.plate; const dx=x-p.screenX, dy=y-p.screenY;
      if(dx*dx+dy*dy < (R*1.5)*(R*1.5) || y<rackY) flick(rod);
    } else if(!rod.plate && y>tipY-R*1.6 && y<rackY){
      startPlate(rod);
    }
  }
});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault(); ensureAudio(); if(actx&&actx.state==='suspended')actx.resume(); hideHint();
    // mercy-flick: the one nearest the boards
    let worst=null;
    for(const rod of rods){ const p=rod.plate; if(!p||p.falling)continue;
      if(!worst||p.spin<worst.plate.spin) worst=rod; }
    if(worst) flick(worst);
  }
});

document.getElementById('plant').addEventListener('click',()=>{
  ensureAudio(); if(actx&&actx.state==='suspended')actx.resume(); hideHint();
  rods.push(makeRod()); layout(); setTick(); say("room for one more — budge up, budge up",2.6,1);
});
const bandBtn=document.getElementById('band');
bandBtn.addEventListener('click',()=>{
  ensureAudio(); if(actx&&actx.state==='suspended')actx.resume();
  bandOn=!bandOn; bandBtn.classList.toggle('on',bandOn);
  if(bandOn&&actx){ nextNote=actx.currentTime+0.05; step=0; }
});

/* ---------------- render ---------------- */
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); }
function drawCurtain(){
  const g=ctx.createLinearGradient(0,0,0,Hc);
  g.addColorStop(0,'#4a121a'); g.addColorStop(0.5,CRIMSON); g.addColorStop(1,CRIMDK);
  ctx.fillStyle=g; ctx.fillRect(0,0,Wc,Hc);
  // velvet folds
  const folds=Math.max(6,Math.round(Wc/90));
  for(let i=0;i<folds;i++){ const fx=(i+0.5)/folds*Wc;
    const fg=ctx.createLinearGradient(fx-Wc/folds/2,0,fx+Wc/folds/2,0);
    fg.addColorStop(0,'rgba(0,0,0,0.16)'); fg.addColorStop(0.5,'rgba(255,220,180,0.05)');
    fg.addColorStop(1,'rgba(0,0,0,0.16)');
    ctx.fillStyle=fg; ctx.fillRect(fx-Wc/folds/2,0,Wc/folds,rackY);
  }
  // gilt proscenium catching the very top edge
  ctx.fillStyle=GILT; ctx.fillRect(0,0,Wc,3);
  ctx.fillStyle='rgba(195,154,75,0.28)'; ctx.fillRect(0,3,Wc,4);
  // footlight amber wash up from the boards
  const fl=ctx.createLinearGradient(0,rackY+30,0,rackY-Hc*0.32);
  fl.addColorStop(0,'rgba(232,162,76,0.55)'); fl.addColorStop(1,'rgba(232,162,76,0)');
  ctx.fillStyle=fl; ctx.fillRect(0,rackY-Hc*0.32,Wc,Hc*0.32+40);
}
function drawRod(rod){
  const whipX=Math.sin(performance.now()/1000*46)*rod.whip*11;
  const tx=rod.x+whipX;
  ctx.beginPath(); ctx.moveTo(rod.x,rackY);
  ctx.quadraticCurveTo((rod.x+tx)/2, (rackY+tipY)/2, tx, tipY);
  const g=ctx.createLinearGradient(0,tipY,0,rackY);
  g.addColorStop(0,'#c98a44'); g.addColorStop(1,'#e8a24c');
  ctx.strokeStyle=g; ctx.lineWidth=3.4; ctx.lineCap='round'; ctx.stroke();
  ctx.strokeStyle='rgba(90,40,10,0.35)'; ctx.lineWidth=1.2; ctx.stroke();
  return tx;
}
function drawPlate(p,tx){
  const cx=p.screenX, cy=p.screenY, r=R;
  ctx.save(); ctx.translate(cx,cy);
  ctx.rotate(p.falling? p.spinvel : p.tilt);
  ctx.scale(1, p.falling? 0.85 : p.squash);
  // white field
  ctx.fillStyle=WHITE; circle(0,0,r); ctx.fill();
  // cobalt rim
  ctx.lineWidth=r*0.15; ctx.strokeStyle=BLUE; circle(0,0,r*0.92); ctx.stroke();
  ctx.lineWidth=r*0.035; ctx.strokeStyle=BLUEDK; circle(0,0,r*0.62); ctx.stroke();
  // willow spin-spoke, ghosted into a blur while she's turning fast
  const ghosts=[[0,1],[-0.28,0.32*p.spin],[-0.56,0.16*p.spin],[-0.84,0.10*p.spin]];
  for(const [off,a] of ghosts){ if(a<=0.01)continue;
    ctx.globalAlpha=a; ctx.strokeStyle=BLUE; ctx.lineWidth=r*0.055;
    const ang=p.phase+off; ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*r*0.16,Math.sin(ang)*r*0.16);
    ctx.lineTo(Math.cos(ang)*r*0.84,Math.sin(ang)*r*0.84); ctx.stroke();
    // little willow leaves either side of the spoke
    const pang=ang+1.9;
    ctx.beginPath(); ctx.arc(Math.cos(ang)*r*0.5,Math.sin(ang)*r*0.5,r*0.12,pang,pang+1.6); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // centre medallion
  ctx.fillStyle=BLUE; circle(0,0,r*0.13); ctx.fill();
  // Gran's plate — the one small chip nicked from the rim. nothing else marks her.
  if(p.gran){ ctx.fillStyle=CRIMSON;
    circle(Math.cos(p.phase)*r*0.96, Math.sin(p.phase)*r*0.96, r*0.11); ctx.fill();
    ctx.fillStyle=WHITE; circle(Math.cos(p.phase)*r*0.90, Math.sin(p.phase)*r*0.90, r*0.045); ctx.fill();
  }
  ctx.restore();
  // hard white highlight catching the footlights on the upper rim
  ctx.save(); ctx.globalAlpha=0.7*Math.min(1,p.spin+0.3);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=r*0.09; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(cx,cy,r*0.86,r*(p.falling?0.72:p.squash*0.9),0,-2.5,-1.5);
  ctx.stroke(); ctx.restore();
}
function drawShards(){
  for(const s of shards){
    ctx.save(); ctx.globalAlpha=Math.min(1,s.life*1.6); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.fillStyle=s.blue?BLUE:WHITE; ctx.beginPath();
    ctx.moveTo(0,-s.size); ctx.lineTo(s.size*0.9,s.size*0.6); ctx.lineTo(-s.size*0.7,s.size*0.5);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
}
function drawRail(){
  // the boards & footlight rail
  const g=ctx.createLinearGradient(0,rackY,0,Hc);
  g.addColorStop(0,'#7a5326'); g.addColorStop(0.25,'#5c3c19'); g.addColorStop(1,'#2e1c0c');
  ctx.fillStyle=g; ctx.fillRect(0,rackY+6,Wc,Hc-rackY);
  ctx.fillStyle='rgba(232,162,76,0.9)'; ctx.fillRect(0,rackY+6,Wc,3);
  // the persistent tally, painted small along the rail
  ctx.font='600 '+Math.max(11,Math.min(16,Wc*0.026))+'px Georgia,serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(243,239,230,0.86)';
  ctx.fillText('PLATES KEPT SPINNING AT THIS HALL: '+kept, Wc/2, rackY+ (Hc-rackY)*0.5+4);
}
function drawHUD(){
  let live=0; for(const rod of rods){ if(rod.plate && !rod.plate.falling) live++; }
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font='700 15px Georgia,serif'; ctx.fillStyle=GILT;
  ctx.fillText('PLATES UP: '+live, 14, 12);
  // Nell, half to herself
  if(msg.t>0){
    let a=1; const into=msg.life-msg.t;
    if(into<0.25) a=into/0.25; if(msg.t<0.7) a=Math.min(a,msg.t/0.7);
    ctx.globalAlpha=Math.max(0,a);
    ctx.textAlign='center'; ctx.font='italic 500 '+Math.max(16,Math.min(24,Wc*0.036))+'px Georgia,serif';
    ctx.fillStyle=WHITE; ctx.shadowColor='#2a0910'; ctx.shadowBlur=8;
    ctx.fillText(msg.text, Wc/2, Hc*0.10);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}

function frame(){
  const now=performance.now()/1000; let dt=now-last; last=now;
  if(dt>0.05)dt=0.05;
  update(dt); scheduleBand();
  drawCurtain();
  for(const rod of rods){ const tx=drawRod(rod); if(rod.plate) drawPlate(rod.plate,tx); }
  drawShards();
  drawRail(); drawHUD();
  requestAnimationFrame(frame);
}

boot();
requestAnimationFrame(frame);

console.log("%cRight — second house. Band's vamping. You take the near end, I'll take the far. Don't let a one of 'em touch the boards.","color:#e8a24c;font-family:Georgia,serif;font-size:13px;");
</script>
