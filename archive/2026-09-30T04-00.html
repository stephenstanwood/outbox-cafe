  <meta name="outbox-spec-era" content="Right now, 2:07 in the afternoon, inside a commercial dishwashing machine in a hotel banquet kitchen mid-cycle — the eleven seconds of the wash arm's rotation, seen from inside the cabinet with the door shut and the racks loaded. The page refuses to say the year and nothing in the machine tells you: the pump is one decade, the rinse injector is another, the racks are whatever the hotel last bought. Not a memory, not an atmosphere, not anybody's first kitchen job: there are nine racks stacked on the infeed table, a plate-up at four, and the rinse arm on the left side has two jets blocked with lime.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the inside of the wash chamber seen from the back wall looking forward at a loaded rack of glassware, and the whole image is made of WATER: two counter-rotating wash arms throwing real flat fan jets, the jets breaking into real droplets at a real breakup length, the droplets hitting curved glass and sheeting, beading, and running down as real rivulets that merge when they touch. Steam fills the upper third at a real density computed from the sump temperature. It is not an animation of a dishwasher. It is a live spray-impingement and film-flow engine: every jet is a real momentum flux, every droplet has a real Weber number deciding whether it splashes or sticks, and every rivulet on the glass follows the real contact-angle geometry of whatever is under it. The visitor's whole vocabulary is what a hand does on a dish machine and nothing else: DRAG UP or DOWN on the chamber to change the sump temperature, which changes viscosity, steam density and sheeting behaviour all at once; PRESS AND HOLD anywhere to run the pump harder, which lengthens the jets and shortens their breakup; and SCRUB sideways across a wash arm to clear a limed jet, which works on some of them and not on others. Nothing scrolls. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat fluid mechanics of getting a film of soil off a curved glass surface in a fifty-four-second cycle, which is entirely a wetting-and-impingement problem and has nothing to do with cleanliness as an idea. That the wash arm does not spray water at dishes, it throws flat fan sheets that break into droplets at a computed distance from the nozzle, and the whole effectiveness of the machine depends on whether the rack sits inside that breakup length or past it — a glass an inch too far out is being hit by a mist that carries almost no momentum and does almost nothing, which is why rack height is not adjustable on purpose. That IMPINGEMENT ANGLE DOES THE WORK AND NOT PRESSURE: a jet striking glass square deposits its momentum into a stagnation point and spreads radially, lifting film at the edge of that spread and nowhere else, so a static jet leaves a clean ring and a dirty centre, and the entire reason the arms rotate is to walk the stagnation point across every square inch rather than to cover area. That the arm's rotation is driven by reaction from rearward-canted nozzles and its speed therefore rises and falls with pump output, which means turning the pump up changes the dwell time per square inch downward at exactly the moment it raises impact force, and the two effects genuinely fight and there is an optimum in the middle that nobody on the floor ever finds. That WATER TEMPERATURE IS A VISCOSITY QUESTION FIRST: fats above their melt point release from a surface as a film and below it as a solid, so the wash tank at 150 and the wash tank at 138 are two different machines, and the difference is visible as whether water sheets off the glass or beads on it. That SHEETING VERSUS BEADING IS THE ONLY HONEST READOUT IN THE BUILDING: a glass with clean, high-energy surface takes water as a continuous film that drains off and flashes dry from residual heat, and a glass carrying any film of fat or any residue of unrinsed detergent takes water as discrete beads that sit there and dry into spots, so a spotted glass is not a dirty glass, it is a glass whose surface energy is wrong. That RINSE AID IS A SURFACTANT THAT LOWERS SURFACE TENSION so that water cannot hold a bead shape, which means it does not clean anything at all and is purely a drying agent, and dosing it heavier does not dry harder, it foams — and foam in a sump is the single most effective way to destroy a pump's output, because a centrifugal pump moving aerated water loses head catastrophically and the jets go short and soft and nobody connects the two. That HARD WATER IS THE WHOLE LOCAL PROBLEM AND IT SHOWS UP AS BLOCKED JETS: calcium carbonate drops out of solution preferentially at the hottest, most turbulent points, which is precisely the inside of a rinse nozzle, so the machine scales itself worst exactly where it can least afford to, and a rinse arm with two jets limed is a rinse arm delivering a real fraction less sanitizing water at a real measurable drop in final rinse temperature. That THE FINAL RINSE IS A SANITATION REQUIREMENT AND IS ARITHMETIC: 180 degrees at the manifold, delivered for a stated number of seconds, which is what actually sanitizes — the wash cycle is soil removal and does not sanitize anything, and a machine whose booster heater cannot recover between racks is a machine running nine racks an hour that are washed and not sanitized, and it looks identical. That the plate on the door states the required manifold pressure at 20 psi and a higher pressure is not better, it atomizes the rinse into a fog that loses heat to the chamber air before it reaches the glass. That STEAM IN THE CHAMBER IS A HEAT SINK AND A DROPLET KILLER: saturated vapour at chamber temperature condenses onto any surface below it and a droplet crossing a hot vapour space loses mass and momentum on the way, so a machine with a bad vent runs measurably weaker at the far end of the rack. That CARRYOVER IS THE HIDDEN ARITHMETIC: every rack drags a real volume of wash water into the rinse zone and back out, so the tank dilutes and the detergent concentration falls through a shift and the conductivity probe that is supposed to correct for it is reading a tank full of dissolved soil as if it were detergent. That GLASSWARE IS THE HARDEST THING IN THE MACHINE and not because it is delicate: a curved surface presents almost no area at a square impingement angle and a stemmed glass shadows its own base, which is why glass racks have peg inserts that tilt each piece and why a glass loaded upright is a glass that holds an inch of dirty water for the whole cycle. That a rack loaded overlapping does not wash at all in the overlap and the overlap is always in the middle where nobody looks.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the water, the heat and the noise, and that register is VIOLENT, LOUD, HOT, WET AND FAST — jets that hit hard enough to make the glassware ring in its pegs; a wash arm going round at a rate that is genuinely too quick to follow; water coming off the chamber ceiling in fat unpredictable drops that fall through the frame and hit things; steam that is thick enough to grey out the far end of the rack and then thins when the vent catches up; and a pump that audibly loads and unloads as the arm passes the rack. The light is a single sealed work lamp behind toughened glass at the top of the back wall, hard and yellow-white and constantly crossed by water, so the whole image flickers because the light is being interrupted several times a second by actual jets. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cycle runs whether or not anybody touches anything. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cosy, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a power-washing video, NOT a process video, NOT a screensaver, NOT stately, NOT reverent, NOT beautiful-in-the-soft-sense — this is fifty-four seconds inside a machine with a plate-up at four and nine racks waiting.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the water's appearance is COMPUTED and never chosen. The chamber is 304 stainless, coved and seamless, and it renders as what stainless under a wet work lamp actually renders as: a hard cool grey-white where the lamp lands directly (#cdd3d4), dropping fast to a dim blue-grey in the coves (#4e585c), and going almost black in the corner behind the rack rail (#20272a), with a real mineral bloom along the waterline at the sump lip — a chalky opaque off-white scale that has built up in horizontal bands and does not reflect anything (#d9d2c2). Against that, EVERY DROPLET AND EVERY RIVULET IS THE OUTPUT OF OPTICAL ARITHMETIC AND NOBODY PICKS A WATER COLOUR: water is given a real refractive index and near-zero absorption, so a droplet on glass renders as a real lens — it inverts and compresses whatever is behind it, it carries a hard bright specular at the lamp's angle (#ffffff, tiny, hard-edged), and it throws a real caustic bright spot onto the surface under it. A sheeting film renders as almost nothing at all except a shifted reflection and a slightly warmer edge where it is thickest at the draining bead. A jet in flight renders as a column of forward-scattered light that is BRIGHT where it is still coherent near the nozzle (#eef4f5) and dims and goes granular as it breaks into droplets, so the breakup length is visible as a real change in brightness and nothing says so. Steam renders by real optical depth: thin steam is a slight desaturation, thick steam swallows the far end of the rack entirely into a flat warm grey (#8e9294). The glassware is soda-lime glass rendered by real transmission and real edge refraction, so it is essentially invisible except at its rims and its stems, which read as bright curved lines. Soil renders honestly: a film of fat on glass is a very slightly yellowed, very slightly hazy region (#cfc9a8 at four percent) that is invisible until water hits it and beads, at which point it is obvious. Exactly one chip of rack polypropylene grey-green (#4a7a63) is held strictly for three things: the rack itself and its pegs, the gasket seal visible at the door edge at the bottom of frame, and the wash arm's own bearing hub. It never appears in water, in steam, in stainless, in glass or in light. Flat, hard, high contrast where the lamp lands and honestly dim everywhere else; no glow, no bloom, no lens flare, no soft focus, no vignette, no gradients other than honest refraction, honest caustics, honest jet breakup, honest steam optical depth and honest specular on wet steel.">
  <meta name="outbox-spec-wildcard" content="One piece in the rack is not glassware. It is a stainless bain-marie insert lid that somebody dropped into a glass rack because there was nowhere else to put it, and the engine gives it exactly the properties a flat sheet of stainless has and no others: it is opaque, so it casts a real hard wet shadow across four glasses behind it for the entire cycle and those four never receive a single direct jet; it has a rolled rim that holds a real reservoir of water which never drains and which sloshes with every arm pass; and it has a far higher thermal mass than glass, so it stays below the flash-dry threshold and comes out of every cycle streaming while everything around it is dry. It cannot be moved, tipped, drained, lifted out or rotated by anything the visitor can do — sliding the rack moves it with everything else and the shadow moves with it. Same lid, same rim puddle, same four shadowed glasses, every visit.">
  <meta name="outbox-spec-forbidden" content="NO washing-as-metaphor for anything — not cleansing, not starting over, not washing away, not baptism, not purity, not 'getting the day off you', not the endless cycle, not Sisyphus, not what we scrub at; this is integrated shear stress against an adhesion value and it has nothing to teach anybody. ABSOLUTELY NO kitchen-as-crucible register: no brigade romance, no heat-of-the-line, no chef-as-tyrant, no Anthony Bourdain, no Kitchen Confidential, no The Bear, no service-as-battle, no adrenaline, no call-and-response ('yes chef' in any form), no dishpit-as-bottom-rung, no the-dishwasher-nobody-sees, no I-started-in-the-pit origin story, no kitchen-family sentiment. NO labour-dignity sermon, NO invisible-workers framing, NO 'nobody thinks about this until it isn't there', NO essential-workers register, NO immigrant-sacrifice arc, NO poverty pathos, NO class commentary, NO tipping-economy essay, NO union framing, NO exploitation exposé. NO food writing of any kind: nothing about what was on the plates, no menu, no banquet-as-spectacle, no sensuous description of anything edible, no smell writing whatsoever. NO craftsman-sage register, NO 'the old dish men could hear a bad rack', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc. NO hotel-as-world, NO backstage-versus-frontstage essay, NO 'the guests will never know', NO service-industry philosophy, NO hospitality sentiment. NO water lyricism: no describing water as alive, dancing, singing, silver, jewelled, or falling like anything; water here is a refractive index and a momentum flux. NO light-through-water reverie, NO caustics-as-beauty, NO prismatic anything, NO rainbow. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, power-washing-video, cleaning-video, satisfying-cleaning, process-video, maker-channel, ambient-visualiser, generative-art-gallery, music-visualiser, chillout, lo-fi or screensaver framing whatsoever, and no 'watch it get clean' — it is loud, it is 150 degrees, and four glasses in the middle are not going to come out. NO machine-as-creature framing: no it breathes, no it roars, no hungry, no tireless, no patient, no relentless-as-character, no the-machine-doesn't-care, no automation anxiety. NO physics-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. NO hygiene moralising, NO germ dread, NO contagion imagery, NO health-inspector drama, NO danger-porn, NO scalding, NO injury foreshadowing, NO safety sermon. NO nostalgia, NO wistfulness, NO decline narrative, NO retro-kitsch, NO camp, NO ironic affection for stainless steel, rack pegs or industrial signage, NO vaporwave, NO liminal-space register, NO cryptic-SCP, NO uncanny, NO backrooms, NO analog-horror, NO ominous dread about the shadowed glasses, the scale that never comes off, or a chamber the visitor cannot leave — nothing here is wrong and nobody is trapped. NO confined-space claustrophobia framing, NO being-inside-something-you-shouldn't-be, NO point-of-view-of-the-object conceit, NO the-dishes-are-watching. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of anything, despite the scale bands being a real accumulated record — the machine is running right now and there are nine racks on the table. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is seven minutes past two in the afternoon with a hood running and daylight in the corridor. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the steel, the water, the steam, the glass and the one rack-green chip, NO instructional UI text, captions, header, footer, credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!--

  drag = tank temperature. hold = pump. scrub sideways across the arm. 1-8. arrows.
-->
<style>

     display:block;cursor:none;transition:opacity .4s;}

<body>
<canvas id="c"></canvas>
<a id="a" href="/archive" aria-label="other racks">

    <line x1="6.5" y1="0.5" x2="6.5" y2="15.5" stroke="#4a7a63" stroke-width="1"/>
    <line x1="13" y1="0.5" x2="13" y2="15.5" stroke="#4a7a63" stroke-width="1"/>
    <line x1="19.5" y1="0.5" x2="19.5" y2="15.5" stroke="#4a7a63" stroke-width="1"/>
  </svg>
</a>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
var off=document.createElement('canvas');off.width=96;off.height=54;
var og=off.getContext('2d',{willReadFrequently:true});
var bgD=null;
var W=1,H=1,DPR=1,FOV=600,CX=0,CY=0,MOB=false;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  FOV=Math.max(W,H)*0.66;CX=W*0.5;CY=H*0.545;
  MOB=(W<680);
}
window.addEventListener('resize',resize);resize();

/* ---------- units / camera ---------- */
var IN=0.0254;
var cam={x:0,y:15.5,z:1.2};
var LAMP={x:0.5,y:27.6,z:1.6};
function px(x,z){return CX+(x-cam.x)*(FOV/(z-cam.z));}
function py(y,z){return CY-(y-cam.y)*(FOV/(z-cam.z));}
function sc(z){return FOV/(z-cam.z);}

/* ---------- persistence, forward only ---------- */
var KEY='hbk.dish.chamber.1';
var P={nz:null,rz:null,det:0.44,wear:0.0,racks:0,boost:0,soil:null,t:0,lime:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){for(var k in P){if(o[k]!==undefined&&o[k]!==null)P[k]=o[k];}}}}catch(e){}
function mknz(n,seed){var a=[];for(var i=0;i<n;i++){a.push({h:0.015+((i*seed)%7)*0.006,l:0.02+((i*3+seed)%5)*0.01});}return a;}
if(!Array.isArray(P.nz)||P.nz.length!==8)P.nz=mknz(8,5);
if(!Array.isArray(P.rz)||P.rz.length!==6){P.rz=mknz(6,3);P.rz[1].h=0.88;P.rz[4].h=0.91;}
P.rz[1].h=Math.max(P.rz[1].h,0.88);P.rz[4].h=Math.max(P.rz[4].h,0.91);
if(!Array.isArray(P.soil)||P.soil.length!==16)P.soil=null;

/* racks that ran while nobody was in the room */
(function(){
  var now=Date.now();
  if(P.t){
    var dt=Math.min((now-P.t)/1000,6*3600);
    var n=Math.floor(dt/54);
    if(n>0){
      P.racks+=n;
      P.det=Math.max(0.055,P.det*Math.pow(0.99865,n));
      P.wear=Math.min(0.46,P.wear+n*0.00009);
      for(var i=0;i<8;i++)P.nz[i].h=Math.min(0.82,P.nz[i].h+n*0.00022);
      for(var j=0;j<6;j++)P.rz[j].h=Math.min(0.95,P.rz[j].h+n*0.00031);
      P.boost=Math.min(1,P.boost+n*0.0006);
      P.lime+=n*0.0009;
    }
  }
  P.t=now;
})();
function save(){P.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
setInterval(save,7000);
window.addEventListener('pagehide',save);
window.addEventListener('blur',save);

/* ---------- water properties ---------- */
function water(TF){
  var Tc=(TF-32)/1.8;
  var sig=Math.max(0.048,0.0756-1.42e-4*Tc);
  var mu=2.414e-5*Math.pow(10,247.8/(Tc+273.15-140));
  var rho=1000-0.0178*Math.pow(Math.abs(Tc-4),1.7);
  var ps=Math.pow(10,8.07131-1730.63/(233.426+Tc))*133.322;
  var rv=ps*0.018/(8.314*(Tc+273.15));
  return {s:sig,mu:mu,rho:rho,ps:ps,rv:rv,Tc:Tc};
}

/* ---------- live state ---------- */
var sumpT=151.0, pumpCmd=0, vap=0.22, foam=0, rackOff=0, boostT=176;
var dP=90000,vJet=12,Qtot=0.004,Lb=7,d32=0.0007,rho_a=1.0;
var armA=0, armW=9, armA2=1.7, armW2=-7.5;
var cycT=Math.random()*54, phase='wash';
var flick=1, ceilWet=0;

/* ---------- nozzles ---------- */
var A0=6.6e-6;
var NZ=[],UZ=[],RZ=[];
(function(){
  var r=[3.6,6.6,9.6,12.2];
  for(var s=0;s<2;s++)for(var i=0;i<4;i++){
    NZ.push({r:r[i],side:s?1:-1,cant:0.42,A0:A0,st:P.nz[s*4+i]});
  }
  var r2=[4.4,8.0,11.4];
  for(var s2=0;s2<2;s2++)for(var j=0;j<3;j++){
    UZ.push({r:r2[j],side:s2?1:-1,cant:0.38,A0:A0*0.92,st:{h:0.02+j*0.01,l:0.01}});
  }
  var r3=[3.2,7.0,11.0];
  for(var s3=0;s3<2;s3++)for(var m=0;m<3;m++){
    RZ.push({r:r3[m],side:s3?1:-1,cant:0.22,A0:A0*0.54,st:P.rz[s3*3+m]});
  }
})();

/* ---------- rack geometry ---------- */
var NT=MOB?10:14, NY=MOB?6:7;
var colX=[-6.9,-2.3,2.3,6.9];
var rowZ=[13.4,17.9,22.4,26.0];
var glasses=[];
var LID={col:1,row:1};
var SHADOWED=[6,7,10,11];

function buildRack(keep){
  glasses=[];
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){
    var idx=r*4+c;
    var stem=((r*3+c)%3===0);
    var gl={
      id:idx,cx:colX[c],cz:rowZ[r],
      y0:6.35,hgt:stem?7.1:5.5,rad:stem?1.3:1.52,stem:stem,
      lid:(c===LID.col&&r===LID.row),
      shadow:SHADOWED.indexOf(idx)>=0,
      h:new Float32Array(NT*NY),
      so:new Float32Array(NT*NY),
      T:118+Math.random()*6,
      ringE:0,ringP:0,
      f:(stem?760:560)/(stem?1.3:1.52)*0.55+(idx%5)*11
    };
    var base=(keep&&P.soil)?Math.max(0.05,P.soil[idx]):0.48+Math.random()*0.5;
    for(var i=0;i<NT*NY;i++){
      gl.so[i]=Math.min(1,base*(0.7+0.6*Math.random()));
      gl.h[i]=0;
    }
    glasses.push(gl);
  }
  /* the lid slot: no glass there, a flat sheet of stainless leaning in the pegs */
}
buildRack(true);

/* the lid. rolled rim, permanent puddle, thermal mass of a brick. */
var lid={
  cx:colX[LID.col]+0.4, cz:rowZ[LID.row], y0:6.3, w:5.6, h:6.8,
  tilt:0.55, T:112, pud:0.9, slosh:0, sloshV:0, wet:0.6
};
function lidQuad(){
  var s=Math.sin(lid.tilt),co=Math.cos(lid.tilt);
  var z0=lid.cz+rackOff, hw=lid.w*0.5;
  var by=lid.y0, ty=lid.y0+lid.h*co, tz=z0-lid.h*s;
  return [
    {x:lid.cx-hw,y:by,z:z0},{x:lid.cx+hw,y:by,z:z0},
    {x:lid.cx+hw,y:ty,z:tz},{x:lid.cx-hw,y:ty,z:tz}
  ];
}
function lidHit(ax,ay,az,bx,by,bz){
  var q=lidQuad();
  var s=Math.sin(lid.tilt),co=Math.cos(lid.tilt);
  var n={x:0,y:s,z:co};
  var d=n.x*q[0].x+n.y*q[0].y+n.z*q[0].z;
  var da=n.x*ax+n.y*ay+n.z*az-d, db=n.x*bx+n.y*by+n.z*bz-d;
  if(da*db>0)return null;
  var t=da/(da-db+1e-9);
  var hx=ax+(bx-ax)*t,hy=ay+(by-ay)*t,hz=az+(bz-az)*t;
  if(Math.abs(hx-lid.cx)>lid.w*0.5)return null;
  var up=(hy-lid.y0)*co-(hz-(lid.cz+rackOff))*s;
  if(up<0||up>lid.h)return null;
  return {x:hx,y:hy,z:hz,u:up,n:n};
}

/* ---------- hydraulics: one solve, nothing stored ---------- */
function hydraulics(){
  var w=water(sumpT);
  rho_a=0.95+0.75*vap;
  var rho=w.rho*(1-foam*0.55);
  var A=0,i,n,s;
  var set=(phase==='rinse')?RZ:NZ.concat(UZ);
  for(i=0;i<set.length;i++){n=set[i];s=Math.min(0.96,n.st.h+n.st.l);A+=n.A0*(1-s);}
  var Cd=0.86;
  var Qmax=(phase==='rinse')?0.0022:0.0079;
  var H0=(phase==='rinse')
    ?(14.1*(1-P.wear*0.4))
    :(12.4*(1+pumpCmd*0.62)*(1-P.wear)*(1-foam*0.78));
  var lo=0,hi=5e5,mid=0,Q=0;
  for(var k=0;k<26;k++){
    mid=(lo+hi)*0.5;
    Q=Cd*A*Math.sqrt(2*mid/rho);
    var f=Math.min(1,Q/Qmax);
    var head=H0*(1-f*f);
    var dp=rho*9.81*head;
    if(dp>mid)lo=mid;else hi=mid;
  }
  dP=mid;Qtot=Cd*A*Math.sqrt(2*dP/rho);
  vJet=Cd*Math.sqrt(2*dP/rho);
  var t0=4.1e-4*(1-0.25*foam);
  Lb=9.0*Math.sqrt(w.s*rho*t0)/(rho_a*Math.max(1,vJet))/IN;
  Lb=Math.max(1.0,Math.min(26,Lb));
  d32=1.45*Math.sqrt(w.s*t0/(rho_a*vJet*vJet));
  return w;
}

/* ---------- arm dynamics: reaction driven ---------- */
function armStep(dt,w){
  var rho=w.rho*(1-foam*0.55);
  function torque(set,nn){
    var tq=0;
    for(var i=0;i<set.length;i++){
      var n=set[i],s=Math.min(0.96,n.st.h+n.st.l);
      var Ae=n.A0*(1-s);
      var q=0.86*Ae*Math.sqrt(2*dP/rho);
      var th=rho*q*vJet*n.cant;
      tq+=th*(n.r*IN);
    }
    return tq;
  }
  var Iw=0.021+0.004*(Qtot/0.006);
  if(phase!=='rinse'){
    var t1=torque(NZ);
    var dr=5.1e-3*armW*Math.abs(armW)+0.021*armW+(armW>0.2?0.02:0);
    armW+=(t1-dr)/Iw*dt;
    var t2=torque(UZ)*0.78;
    var dr2=4.4e-3*armW2*Math.abs(armW2)+0.019*armW2-(armW2<-0.2?0.018:0);
    armW2+=(-t2-dr2)/(Iw*0.8)*dt;
  }else{
    armW*=Math.max(0,1-dt*0.9);armW2*=Math.max(0,1-dt*0.9);
  }
  armA+=armW*dt;armA2+=armW2*dt;
  if(armA>6.2832)armA-=6.2832;if(armA<0)armA+=6.2832;
  if(armA2>6.2832)armA2-=6.2832;if(armA2<0)armA2+=6.2832;
}

/* ---------- droplets ---------- */
var MAXP=MOB?520:1250;
var pool=[],np=0;
for(var pi=0;pi<MAXP;pi++)pool.push({a:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,d:0.0008,px:0,py:0,pz:0,ct:0});
function spawn(x,y,z,vx,vy,vz,d,ct){
  for(var i=0;i<MAXP;i++){
    var q=pool[(np+i)%MAXP];
    if(!q.a){q.a=1;q.x=x;q.y=y;q.z=z;q.px=x;q.py=y;q.pz=z;q.vx=vx;q.vy=vy;q.vz=vz;q.d=d;q.ct=ct||0;np=(np+i+1)%MAXP;return q;}
  }
  return null;
}

/* ---------- glass film solve ---------- */
function cellPoint(gl,ti,yi){
  var th=(ti+0.5)/NT*6.2832;
  var r=gl.rad*(gl.stem?(0.55+0.45*Math.min(1,(yi+0.5)/NY*1.7)):1);
  return {x:gl.cx+rackOff*0+r*Math.sin(th),
          y:gl.y0+(yi+0.5)/NY*gl.hgt,
          z:gl.cz+rackOff+r*Math.cos(th),
          nx:Math.sin(th),nz:Math.cos(th),r:r,th:th};
}
function contactAngle(soil){return 0.26+soil*1.25;} /* rad, clean glass wets */

function filmStep(gl,dt,w){
  var mu=w.mu,rho=w.rho,sig=w.s;
  var h=gl.h,so=gl.so;
  var melt=Math.max(0,Math.min(1,(gl.T-137)/15));
  var i,j,k,kk;
  var tmp=filmStep.tmp||(filmStep.tmp=new Float32Array(NT*NY));
  if(tmp.length!==NT*NY)tmp=filmStep.tmp=new Float32Array(NT*NY);
  tmp.set(h);
  for(j=NY-1;j>=0;j--){
    for(i=0;i<NT;i++){
      k=j*NT+i;
      var hh=h[k];if(hh<=1e-7)continue;
      var hm=hh*0.001;
      var u=rho*9.81*hm*hm/(3*mu);           /* Nusselt drainage */
      var flux=Math.min(hh*0.85,u/IN*dt*hh*3.6);
      tmp[k]-=flux;
      if(j>0)tmp[(j-1)*NT+i]+=flux; else ceilWet+=flux*0.0001;
      /* soil removal = integrated shear against adhesion */
      var tau=mu*u/Math.max(hm,4e-6);
      var tauc=46*(1-melt*0.88)*(1+0.5*(1-P.det));
      if(tau>tauc)so[k]=Math.max(0,so[k]-(tau-tauc)*3.1e-5*dt);
      /* transverse instability: thin films break, thick ones merge */
      var ca=contactAngle(so[k]);
      var hcrit=0.019*Math.sqrt(sig/(rho*9.81))*1000*(1+ca*2.6);
      var ip=(i+1)%NT,im=(i+NT-1)%NT;
      var dpn=h[j*NT+ip]-hh, dmn=h[j*NT+im]-hh;
      var pull=(hh<hcrit)?-0.62:0.14;
      var m1=pull*dpn*dt*3.0, m2=pull*dmn*dt*3.0;
      tmp[k]+=m1+m2;tmp[j*NT+ip]-=m1;tmp[j*NT+im]-=m2;
    }
  }
  h.set(tmp);
  /* thermal + phase */
  var tgt=(phase==='rinse')?boostT-P.boost*22:sumpT;
  gl.T+=(tgt-gl.T)*Math.min(1,dt*(phase==='off'?0.16:1.05));
  var w2=water(gl.T);
  var vapT=water(sumpT);
  var cond=(vap*vapT.rv*0.9)*(gl.T<sumpT-2?1:0)*dt*0.0032;
  var evap=(gl.T>150&&phase==='off')?dt*0.34:dt*0.012;
  for(kk=0;kk<NT*NY;kk++){
    h[kk]+=cond;
    h[kk]=Math.max(0,h[kk]-evap*(0.4+h[kk]));
    if(h[kk]>2.1)h[kk]=2.1;
  }
  gl.ringE*=Math.pow(0.0008,dt);
}

/* ---------- impingement ---------- */
function rayGlassHit(ox,oy,oz,dx,dy,dz,maxT){
  var best=null,bt=maxT;
  for(var i=0;i<glasses.length;i++){
    var gl=glasses[i];if(gl.lid)continue;
    var cx=gl.cx,cz=gl.cz+rackOff,R=gl.rad;
    var ax=ox-cx,az=oz-cz;
    var a=dx*dx+dz*dz;if(a<1e-6)continue;
    var b=2*(ax*dx+az*dz),c=ax*ax+az*az-R*R;
    var disc=b*b-4*a*c;if(disc<0)continue;
    var sq=Math.sqrt(disc);
    var t=(-b-sq)/(2*a);if(t<0.02)t=(-b+sq)/(2*a);
    if(t<0.02||t>bt)continue;
    var hy=oy+dy*t;
    if(hy<gl.y0||hy>gl.y0+gl.hgt)continue;
    bt=t;best={gl:gl,t:t,x:ox+dx*t,y:hy,z:oz+dz*t};
  }
  return best;
}
function deposit(gl,hx,hy,hz,vn,d,w){
  var th=Math.atan2(hx-gl.cx,hz-(gl.cz+rackOff));
  if(th<0)th+=6.2832;
  var ti=Math.min(NT-1,Math.floor(th/6.2832*NT));
  var yi=Math.min(NY-1,Math.max(0,Math.floor((hy-gl.y0)/gl.hgt*NY)));
  var k=yi*NT+ti;
  var We=w.rho*vn*vn*d/w.s;
  var hl=gl.h[k];
  var vol=d*1000*0.9;
  if(We>420+260*hl){                       /* splash */
    gl.h[k]+=vol*0.42;
    var nsec=Math.min(3,1+(We/700)|0);
    for(var s=0;s<nsec;s++){
      var ang=Math.random()*6.2832,el=0.5+Math.random()*0.8;
      var sp=vn*(0.22+Math.random()*0.3)/IN;
      spawn(hx,hy,hz,Math.cos(ang)*sp*0.5,Math.sin(el)*sp,Math.sin(ang)*sp*0.5,d*0.55,1);
    }
  }else if(We>14){ gl.h[k]+=vol; }
  else { gl.h[k]+=vol*0.72; }
  var melt=Math.max(0,Math.min(1,(gl.T-137)/15));
  var work=We*1e-6*(0.25+melt*1.5)*(0.45+P.det);
  gl.so[k]=Math.max(0,gl.so[k]-work);
  gl.ringE=Math.min(1,gl.ringE+We*2.4e-5);
  gl.ringP=1;
}

/* ---------- pointer ---------- */
var ptr={x:-999,y:-999,in:false,down:false,lx:0,ly:0,vx:0,dragT:0};
function pmove(e){
  var r=cv.getBoundingClientRect();
  var nx=e.clientX-r.left, ny=e.clientY-r.top;
  ptr.vx=ptr.vx*0.6+(nx-ptr.x)*0.4;
  if(ptr.down){
    var dy=ny-ptr.y;
    if(Math.abs(dy)>0.4){sumpT=Math.max(116,Math.min(171,sumpT-dy*0.085));ptr.dragT=1;}
    scrubAt(nx,ny,ptr.vx);
  }
  ptr.x=nx;ptr.y=ny;ptr.in=true;
}
function scrubAt(x,y,vx){
  if(Math.abs(vx)<5)return;
  var pr=projNozzles();
  for(var i=0;i<pr.length;i++){
    var q=pr[i];if(!q)continue;
    var dx=q.x-x,dy=q.y-y;
    if(dx*dx+dy*dy<70*70){
      var st=NZ[i].st;
      st.l=Math.max(0,st.l-0.004*Math.min(3,Math.abs(vx)/8));
      P.nz[i].l=st.l;
      audio.scrub(Math.abs(vx));
    }
  }
}
function projNozzles(){
  var out=[];
  for(var i=0;i<NZ.length;i++){
    var n=NZ[i],ang=armA+(n.side>0?0:Math.PI);
    var x=Math.sin(ang)*n.r, z=18.4+Math.cos(ang)*n.r;
    if(z-cam.z<0.4){out.push(null);continue;}
    out.push({x:px(x,z),y:py(4.2,z),z:z});
  }
  return out;
}
cv.addEventListener('pointermove',pmove);
cv.addEventListener('pointerdown',function(e){ptr.down=true;ptr.dragT=0;audio.start();pmove(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
window.addEventListener('pointerup',function(){ptr.down=false;});
cv.addEventListener('pointerleave',function(){ptr.in=false;ptr.x=-999;});

var keys={};
window.addEventListener('keydown',function(e){
  keys[e.code]=true;audio.start();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});

function inputs(dt){
  if(keys['ArrowUp'])sumpT=Math.min(171,sumpT+dt*9);
  if(keys['ArrowDown'])sumpT=Math.max(116,sumpT-dt*9);
  if(keys['ArrowLeft'])rackOff=Math.max(-5.5,rackOff-dt*4.4);
  if(keys['ArrowRight'])rackOff=Math.min(5.5,rackOff+dt*4.4);
  var want=(keys['Space']||ptr.down)?1:0;
  pumpCmd+=(want-pumpCmd)*Math.min(1,dt*3.2);
  for(var i=1;i<=8;i++){
    if(keys['Digit'+i]||keys['Numpad'+i]){
      var st=NZ[i-1].st;st.l=Math.max(0,st.l-dt*0.16);P.nz[i-1].l=st.l;
      audio.scrub(22);
    }
  }
}

/* ---------- cycle ---------- */
function cycle(dt){
  cycT+=dt;
  var prev=phase;
  if(cycT<38)phase='wash';
  else if(cycT<41.5)phase='drain';
  else if(cycT<49)phase='rinse';
  else if(cycT<54)phase='off';
  else{
    cycT=0;phase='wash';
    /* rack out, rack in. the lid comes back with it. */
    P.racks++;
    P.det=Math.max(0.055,P.det*0.9948);
    P.wear=Math.min(0.46,P.wear+0.00012);
    P.boost=Math.min(1,P.boost+0.02-(0.017));
    P.soil=glasses.map(function(gl){var s=0;for(var i=0;i<gl.so.length;i++)s+=gl.so[i];return s/gl.so.length;});
    buildRack(false);
    lid.wet=0.85;lid.pud=0.9;lid.T=112;
    audio.gasket();save();
  }
  if(phase!==prev){
    if(phase==='rinse'){audio.solenoid();boostT=182-P.boost*26;}
    if(phase==='drain')audio.solenoid();
  }
  if(phase==='wash'){
    for(var i=0;i<8;i++){
      var st=NZ[i].st;
      if(sumpT>138){
        var gr=(sumpT-138)*3.2e-7*dt*(1+pumpCmd);
        st.h=Math.min(0.85,st.h+gr);P.nz[i].h=st.h;P.lime+=gr*0.2;
      }
    }
  }
  if(phase==='rinse'){
    for(var j=0;j<6;j++){
      var s2=RZ[j].st;var gr2=(boostT-138)*7.4e-7*dt;
      s2.h=Math.min(0.96,s2.h+gr2);P.rz[j].h=s2.h;P.lime+=gr2*0.3;
    }
  }
  /* foam: aerated sump kills head */
  var foamGen=pumpCmd*Math.max(0,(0.5-((sumpT-116)/58)))*P.det*1.4;
  foam+=(foamGen-foam*0.55)*dt*0.5;
  foam=Math.max(0,Math.min(0.82,foam));
  /* vapour field */
  var w=water(sumpT);
  var gen=(w.ps/2.4e4)*(phase==='rinse'?1.5:(0.5+pumpCmd*0.6));
  var vent=0.55;
  vap+=(gen-vent*vap)*dt*0.55;
  vap=Math.max(0,Math.min(1.35,vap));
  ceilWet+=vap*vap*dt*0.55;
  while(ceilWet>1){
    ceilWet-=1;
    spawn((Math.random()-0.5)*26,29.2,3+Math.random()*22,0,-2,0,0.0032+Math.random()*0.0018,2);
  }
}

/* ---------- jets ---------- */
var jetList=[];
function buildJets(){
  jetList.length=0;
  var w=water(sumpT);
  var set,baseY,dirY,ang0,ww;
  function push(set,baseY,dirY,ang0,hubZ,spin){
    for(var i=0;i<set.length;i++){
      var n=set[i];
      var a=ang0+(n.side>0?0:Math.PI);
      var ox=Math.sin(a)*n.r, oz=hubZ+Math.cos(a)*n.r;
      var s=Math.min(0.96,n.st.h+n.st.l);
      var open=1-s;
      if(open<0.06)continue;
      var tiltOut=0.55;
      var dx=Math.sin(a)*tiltOut*0.55+Math.cos(a)*spin*0.22;
      var dz=Math.cos(a)*tiltOut*0.55-Math.sin(a)*spin*0.22;
      var dy=dirY;
      var L=Math.sqrt(dx*dx+dy*dy+dz*dz);
      jetList.push({x:ox,y:baseY,z:oz,dx:dx/L,dy:dy/L,dz:dz/L,
                    open:open,r:n.r,nz:n,lb:Lb*Math.pow(open,0.55),a:a});
    }
  }
  if(phase==='wash'){
    push(NZ,4.25,1,armA,18.4,armW>0?1:-1);
    push(UZ,25.4,-1,armA2,18.4,armW2>0?1:-1);
  }else if(phase==='rinse'){
    push(RZ,4.6,1,armA+0.4,18.4,0);
  }
  return w;
}

function jetWork(dt,w){
  var rho=w.rho;
  for(var i=0;i<jetList.length;i++){
    var J=jetList[i];
    /* pointer deflects what would pass through it */
    var defl=0;
    if(ptr.in){
      var mx=J.x+J.dx*J.lb*0.6,my=J.y+J.dy*J.lb*0.6,mz=J.z+J.dz*J.lb*0.6;
      if(mz-cam.z>0.5){
        var sx=px(mx,mz),sy=py(my,mz);
        var dd=(sx-ptr.x)*(sx-ptr.x)+(sy-ptr.y)*(sy-ptr.y);
        if(dd<5200){defl=1-dd/5200;}
      }
    }
    J.defl=defl;
    /* coherent core: stagnation point and radial spread */
    var hit=rayGlassHit(J.x,J.y,J.z,J.dx,J.dy,J.dz,J.lb*(1-defl*0.8));
    J.hit=hit;
    if(hit){
      var gl=hit.gl;
      var occ=lidHit(J.x,J.y,J.z,hit.x,hit.y,hit.z);
      if(occ){J.hit=null;J.occ=occ;lid.sloshV+=0.9*dt*J.open;lid.wet=1;continue;}
      J.occ=null;
      var vn=vJet*(1-hit.t/(J.lb*2.2));
      if(vn<1)vn=1;
      var th=Math.atan2(hit.x-gl.cx,hit.z-(gl.cz+rackOff));if(th<0)th+=6.2832;
      var ti=Math.min(NT-1,Math.floor(th/6.2832*NT));
      var yi=Math.min(NY-1,Math.max(0,Math.floor((hit.y-gl.y0)/gl.hgt*NY)));
      var melt=Math.max(0,Math.min(1,(gl.T-137)/15));
      var q=0.86*J.nz.A0*J.open*Math.sqrt(2*dP/rho);
      var mom=rho*q*vn;
      /* clean ring, dirty centre */
      for(var dti=-2;dti<=2;dti++)for(var dyi=-1;dyi<=1;dyi++){
        var t2=(ti+dti+NT)%NT, y2=yi+dyi;
        if(y2<0||y2>=NY)continue;
        var rr=Math.sqrt(dti*dti*1.0+dyi*dyi*2.2);
        var ring=Math.exp(-Math.pow(rr-1.25,2)*1.5);
        var k=y2*NT+t2;
        gl.h[k]+=mom*dt*820*ring;
        gl.so[k]=Math.max(0,gl.so[k]-mom*dt*(0.9+melt*5.6)*ring*(0.5+P.det));
      }
      gl.ringE=Math.min(1,gl.ringE+mom*dt*24);
      gl.ringP=1;
      if(gl.h[yi*NT+ti]>2.1)gl.h[yi*NT+ti]=2.1;
    }else J.occ=null;
    /* breakup -> real droplets */
    if(np%1===0){
      var nspawn=(MOB?1:2);
      for(var s=0;s<nspawn;s++){
        if(Math.random()>J.open*0.86+0.1)continue;
        var fa=(Math.random()-0.5)*0.46;
        var ca=Math.cos(fa),sa=Math.sin(fa);
        var ddx=J.dx*ca-J.dz*sa, ddz=J.dz*ca+J.dx*sa;
        var d=d32*Math.pow(-Math.log(Math.max(1e-4,Math.random())),1/2.4);
        d=Math.max(0.00018,Math.min(0.0034,d));
        var spd=vJet/IN*(0.72+Math.random()*0.3)*(1-J.defl*0.7);
        var L=J.lb*(0.94+Math.random()*0.14)*(1-J.defl*0.55);
        var ox=J.x+ddx*L, oy=J.y+J.dy*L, oz=J.z+ddz*L;
        var dvx=0,dvy=0,dvz=0;
        if(J.defl>0.15){var ra=Math.random()*6.2832;dvx=Math.cos(ra)*spd*0.35*J.defl;dvz=Math.sin(ra)*spd*0.35*J.defl;}
        spawn(ox,oy,oz,ddx*spd+dvx,J.dy*spd+dvy,ddz*spd+dvz,d,0);
      }
    }
  }
}

/* ---------- particle step ---------- */
function partStep(dt,w){
  var G=-386.1;
  var sub=2,h=dt/sub;
  var vapMass=vap*0.62;
  for(var i=0;i<MAXP;i++){
    var p=pool[i];if(!p.a)continue;
    for(var s=0;s<sub;s++){
      p.px=p.x;p.py=p.y;p.pz=p.z;
      p.vy+=G*h;
      var drag=1-Math.min(0.5,(rho_a*0.0022+vapMass*0.004)*h*60/Math.max(0.0004,p.d)*1e-4);
      p.vx*=drag;p.vy*=drag;p.vz*=drag;
      p.x+=p.vx*h;p.y+=p.vy*h;p.z+=p.vz*h;
      /* mass loss crossing hot vapour */
      p.d-=vapMass*h*0.00022;
      if(p.d<0.00012){p.a=0;break;}
      var occ=lidHit(p.px,p.py,p.pz,p.x,p.y,p.z);
      if(occ){
        lid.sloshV+=0.22*p.d*400;lid.wet=1;
        if(occ.u<1.0)lid.pud=Math.min(1.3,lid.pud+p.d*3);
        audio.tap(p.d*0.45,0.9);
        p.a=0;break;
      }
      var hitg=null;
      for(var gi=0;gi<glasses.length;gi++){
        var gl=glasses[gi];if(gl.lid)continue;
        var cx=gl.cx,cz=gl.cz+rackOff;
        var dx=p.x-cx,dz=p.z-cz;
        var rr=dx*dx+dz*dz;
        if(rr<gl.rad*gl.rad&&p.y>gl.y0&&p.y<gl.y0+gl.hgt){
          var pdx=p.px-cx,pdz=p.pz-cz;
          if(pdx*pdx+pdz*pdz>=gl.rad*gl.rad){hitg=gl;break;}
        }
      }
      if(hitg){
        var nx=(p.x-hitg.cx),nz=(p.z-(hitg.cz+rackOff));
        var nl=Math.sqrt(nx*nx+nz*nz)||1;nx/=nl;nz/=nl;
        var vn=Math.abs(p.vx*nx+p.vz*nz)*IN;
        deposit(hitg,p.x,p.y,p.z,vn,p.d,w);
        p.a=0;break;
      }
      if(p.y<2.1){
        if(p.d>0.0016&&Math.random()<0.35)audio.tap(p.d*0.3,0.35);
        p.a=0;break;
      }
      if(p.y>29.4){
        ceilWet+=p.d*0.9;audio.tap(p.d*0.6,1.5);p.a=0;break;
      }
      if(p.x<-15||p.x>15||p.z<0.6||p.z>29||p.y>31){p.a=0;break;}
    }
  }
}

/* ---------- lid ---------- */
function lidStep(dt){
  lid.sloshV+=(-lid.slosh*16-lid.sloshV*2.4)*dt;
  lid.slosh+=lid.sloshV*dt;
  lid.slosh=Math.max(-1,Math.min(1,lid.slosh));
  var tgt=(phase==='rinse')?boostT*0.8:sumpT*0.86;
  lid.T+=(tgt-lid.T)*dt*0.085;          /* thermal mass of a flat sheet with a rim */
  if(phase==='off')lid.wet=Math.max(0.55,lid.wet-dt*0.07);
  else lid.wet=Math.min(1,lid.wet+dt*0.5);
}

/* ---------- render ---------- */
function mix(a,b,t){t=t<0?0:t>1?1:t;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
var C_DARK=[0x20,0x27,0x2a],C_MID=[0x4e,0x58,0x5c],C_LIT=[0xcd,0xd3,0xd4],C_FOG=[0x8e,0x92,0x94],C_SCALE=[0xd9,0xd2,0xc2],C_JET=[0xee,0xf4,0xf5];
function fogAt(z){var d=Math.max(0,z-cam.z);return 1-Math.exp(-0.055*vap*d);}
function steel(l,z){
  var c=(l<0.5)?mix(C_DARK,C_MID,l*2):mix(C_MID,C_LIT,(l-0.5)*2);
  c=mix(c,C_FOG,fogAt(z));
  return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
}
function lumAt(x,y,z,nx,ny,nz){
  var lx=LAMP.x-x,ly=LAMP.y-y,lz=LAMP.z-z;
  var d2=lx*lx+ly*ly+lz*lz,d=Math.sqrt(d2)||1;
  lx/=d;ly/=d;lz/=d;
  var nd=lx*nx+ly*ny+lz*nz;if(nd<0)nd=0;
  var att=1/(1+d2/340);
  var vx=cam.x-x,vy=cam.y-y,vz=cam.z-z;var vl=Math.sqrt(vx*vx+vy*vy+vz*vz)||1;vx/=vl;vy/=vl;vz/=vl;
  var hx=lx+vx,hy=ly+vy,hz=lz+vz;var hl=Math.sqrt(hx*hx+hy*hy+hz*hz)||1;
  var spec=Math.pow(Math.max(0,(hx*nx+hy*ny+hz*nz)/hl),26)*0.55;
  return Math.min(1,(0.055+nd*1.35*att*flick)+spec*flick);
}
function quad(a,b,c,d,fill){
  if(a.z-cam.z<0.35||b.z-cam.z<0.35||c.z-cam.z<0.35||d.z-cam.z<0.35)return;
  g.beginPath();
  g.moveTo(px(a.x,a.z),py(a.y,a.z));
  g.lineTo(px(b.x,b.z),py(b.y,b.z));
  g.lineTo(px(c.x,c.z),py(c.y,c.z));
  g.lineTo(px(d.x,d.z),py(d.y,d.z));
  g.closePath();g.fillStyle=fill;g.fill();
}
function bgAt(x,y){
  if(!bgD)return [40,46,50];
  var ix=Math.max(0,Math.min(95,(x/W*96)|0)),iy=Math.max(0,Math.min(53,(y/H*54)|0));
  var i=(iy*96+ix)*4;
  return [bgD[i],bgD[i+1],bgD[i+2]];
}

function drawChamber(){
  g.fillStyle='#181e21';g.fillRect(0,0,W,H);
  var NS=14,z0=1.5,z1=28.4;
  var i;
  /* ceiling */
  for(i=0;i<NS;i++){
    var za=z0+(z1-z0)*i/NS, zb=z0+(z1-z0)*(i+1)/NS,zm=(za+zb)/2;
    var l=lumAt(0,29.6,zm,0,-1,0);
    quad({x:-15,y:29.6,z:za},{x:15,y:29.6,z:za},{x:15,y:29.6,z:zb},{x:-15,y:29.6,z:zb},steel(l*0.9,zm));
  }
  /* side walls with cove */
  for(var s=-1;s<=1;s+=2){
    for(i=0;i<NS;i++){
      var za2=z0+(z1-z0)*i/NS, zb2=z0+(z1-z0)*(i+1)/NS,zm2=(za2+zb2)/2;
      var l2=lumAt(s*14.8,16,zm2,-s,0,0);
      quad({x:s*14.8,y:2.0,z:za2},{x:s*14.8,y:29.6,z:za2},{x:s*14.8,y:29.6,z:zb2},{x:s*14.8,y:2.0,z:zb2},steel(l2,zm2));
      /* cove, dim */
      var lc=lumAt(s*13.2,3.4,zm2,-s*0.6,0.8,0)*0.55;
      quad({x:s*14.8,y:2.0,z:za2},{x:s*12.6,y:3.0,z:za2},{x:s*12.6,y:3.0,z:zb2},{x:s*14.8,y:2.0,z:zb2},steel(lc,zm2));
      /* mineral bloom, horizontal bands at the waterline. it only ever grows. */
      var bands=5;
      for(var b=0;b<bands;b++){
        var hb=0.10+0.30*Math.min(1,P.lime*0.6+b*0.05)*(0.5+0.5*Math.sin(i*1.7+b*2.3));
        var yb=2.05+b*0.34;
        var cc=mix(C_SCALE,C_FOG,fogAt(zm2));
        g.globalAlpha=0.55+0.38*Math.min(1,P.lime);
        quad({x:s*14.78,y:yb,z:za2},{x:s*14.78,y:yb+hb,z:za2},{x:s*14.78,y:yb+hb,z:zb2},{x:s*14.78,y:yb,z:zb2},
             'rgb('+(cc[0]|0)+','+(cc[1]|0)+','+(cc[2]|0)+')');
        g.globalAlpha=1;
      }
    }
  }
  /* sump surface */
  for(i=0;i<NS;i++){
    var za3=z0+(z1-z0)*i/NS, zb3=z0+(z1-z0)*(i+1)/NS,zm3=(za3+zb3)/2;
    var turb=0.14+0.20*Math.abs(Math.sin(zm3*0.7+perfNow*0.006))*(0.3+pumpCmd);
    var l3=lumAt(0,2.0,zm3,0,1,0)*(0.30+turb)+foam*0.32;
    quad({x:-13,y:2.0,z:za3},{x:13,y:2.0,z:za3},{x:13,y:2.0,z:zb3},{x:-13,y:2.0,z:zb3},steel(l3,zm3));
  }
  /* door at the front, gasket in rack green */
  var ld=lumAt(0,16,28.4,0,0,-1);
  quad({x:-14.8,y:2.0,z:28.4},{x:14.8,y:2.0,z:28.4},{x:14.8,y:29.6,z:28.4},{x:-14.8,y:29.6,z:28.4},steel(ld*0.7,28.4));
  var gk=mix([0x4a,0x7a,0x63],C_FOG,fogAt(28.2));
  quad({x:-14.6,y:2.1,z:28.2},{x:14.6,y:2.1,z:28.2},{x:14.6,y:3.15,z:28.2},{x:-14.6,y:3.15,z:28.2},
       'rgb('+(gk[0]|0)+','+(gk[1]|0)+','+(gk[2]|0)+')');
  /* corner behind the rack rail: almost black */
  quad({x:-14.8,y:5.4,z:11},{x:-11.6,y:5.4,z:11},{x:-11.6,y:6.4,z:27},{x:-14.8,y:6.4,z:27},'rgba(20,26,30,0.85)');
  quad({x:11.6,y:5.4,z:11},{x:14.8,y:5.4,z:11},{x:14.8,y:6.4,z:27},{x:11.6,y:6.4,z:27},'rgba(20,26,30,0.85)');
}

function drawRack(){
  var gc=[0x4a,0x7a,0x63];
  for(var r=0;r<4;r++){
    var zf=rowZ[r]-2.1+rackOff, zb=rowZ[r]+2.1+rackOff;
    if(zf-cam.z<0.6)continue;
    var c=mix(gc,C_FOG,fogAt(rowZ[r]+rackOff));
    var l=0.35+0.5*lumAt(0,6.1,rowZ[r]+rackOff,0,1,0);
    var cc='rgb('+((c[0]*l)|0)+','+((c[1]*l)|0)+','+((c[2]*l)|0)+')';
    quad({x:-9.6,y:6.05,z:zf},{x:9.6,y:6.05,z:zf},{x:9.6,y:6.05,z:zb},{x:-9.6,y:6.05,z:zb},cc);
    /* pegs */
    for(var c2=0;c2<4;c2++){
      for(var d=-1;d<=1;d+=2){
        var pxx=colX[c2]+d*1.9, pz=rowZ[r]+rackOff+d*1.0;
        if(pz-cam.z<0.6)continue;
        quad({x:pxx-0.13,y:6.05,z:pz},{x:pxx+0.13,y:6.05,z:pz},{x:pxx+0.13,y:7.5,z:pz},{x:pxx-0.13,y:7.5,z:pz},cc);
      }
    }
  }
}

function drawArms(){
  if(phase==='off')return;
  var sets=[{a:armA,y:4.25,set:NZ},{a:armA2,y:25.4,set:UZ}];
  if(phase==='rinse')sets=[{a:armA+0.4,y:4.6,set:RZ}];
  for(var k=0;k<sets.length;k++){
    var S=sets[k];
    var ex=Math.sin(S.a)*12.6, ez=18.4+Math.cos(S.a)*12.6;
    var ex2=-ex, ez2=18.4-Math.cos(S.a)*12.6;
    if(ez-cam.z<0.6||ez2-cam.z<0.6)continue;
    var l=lumAt(0,S.y,18.4,0,1,0);
    g.strokeStyle=steel(l*0.68,18.4);
    g.lineWidth=Math.max(1.5,sc(18.4)*0.55);
    g.beginPath();g.moveTo(px(ex,ez),py(S.y,ez));g.lineTo(px(ex2,ez2),py(S.y,ez2));g.stroke();
    /* bearing hub: the only other green */
    var hc=mix([0x4a,0x7a,0x63],C_FOG,fogAt(18.4));
    g.fillStyle='rgb('+(hc[0]|0)+','+(hc[1]|0)+','+(hc[2]|0)+')';
    g.beginPath();g.arc(px(0,18.4),py(S.y,18.4),Math.max(2,sc(18.4)*0.7),0,6.2832);g.fill();
  }
}

function drawJets(){
  var i,J;
  for(i=0;i<jetList.length;i++){
    J=jetList[i];
    if(J.z-cam.z<0.7)continue;
    var segs=4;
    var maxL=J.lb*(1-J.defl*0.55);
    if(J.hit)maxL=Math.min(maxL,J.hit.t);
    if(J.occ){var od=Math.sqrt(Math.pow(J.occ.x-J.x,2)+Math.pow(J.occ.y-J.y,2)+Math.pow(J.occ.z-J.z,2));maxL=Math.min(maxL,od);}
    for(var s=0;s<segs;s++){
      var t0=maxL*s/segs, t1=maxL*(s+1)/segs;
      var ax=J.x+J.dx*t0, ay=J.y+J.dy*t0, az=J.z+J.dz*t0;
      var bx=J.x+J.dx*t1, by=J.y+J.dy*t1, bz=J.z+J.dz*t1;
      if(az-cam.z<0.6||bz-cam.z<0.6)continue;
      var fr=1-(s+0.5)/segs;
      var al=(0.34+0.5*fr*fr)*J.open*(0.5+0.5*pumpCmd)*(1-fogAt(az)*0.8);
      var c=mix(C_JET,C_FOG,fogAt(az)*0.85);
      g.strokeStyle='rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+al.toFixed(3)+')';
      var wA=sc(az)*(0.045+0.10*(t0/Math.max(0.6,maxL)))*J.open;
      g.lineWidth=Math.max(0.6,wA*8);
      g.beginPath();g.moveTo(px(ax,az),py(ay,az));g.lineTo(px(bx,bz),py(by,bz));g.stroke();
    }
    /* stagnation smear */
    if(J.hit){
      var hs=sc(J.hit.z);
      g.fillStyle='rgba(238,244,245,'+(0.10*J.open).toFixed(3)+')';
      g.beginPath();g.arc(px(J.hit.x,J.hit.z),py(J.hit.y,J.hit.z),Math.max(1,hs*0.10),0,6.2832);g.fill();
    }
  }
}

function drawParticles(){
  for(var i=0;i<MAXP;i++){
    var p=pool[i];if(!p.a)continue;
    if(p.z-cam.z<0.7)continue;
    var s=sc(p.z);
    var x1=px(p.x,p.z),y1=py(p.y,p.z);
    var x0=px(p.px,p.pz),y0=py(p.py,p.pz);
    var fg=fogAt(p.z);
    var c=mix([238,244,245],C_FOG,fg*0.9);
    var big=p.d>0.0019;
    var a=(big?0.62:0.30)*(1-fg*0.75)*flick;
    g.strokeStyle='rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')';
    g.lineWidth=Math.max(0.5,p.d/IN*s*0.9);
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    if(big&&p.ct===2){
      g.fillStyle='rgba(255,255,255,'+(0.5*(1-fg)).toFixed(2)+')';
      g.fillRect(x1-0.6,y1-0.6,1.3,1.3);
    }
  }
}

function drawGlass(gl){
  var z=gl.cz+rackOff;
  if(z-cam.z<0.9)return;
  var s=sc(z),fg=fogAt(z);
  var i,j;
  /* film + beads, per cell */
  for(j=NY-1;j>=0;j--){
    for(i=0;i<NT;i++){
      var k=j*NT+i;
      var h=gl.h[k],so=gl.so[k];
      var cp=cellPoint(gl,i,j);
      var cz=cp.z+0;
      var vdx=cam.x-cp.x,vdz=cam.z-cz;
      var vl=Math.sqrt(vdx*vdx+vdz*vdz)||1;
      if((cp.nx*vdx+cp.nz*vdz)/vl<0.18)continue;
      var sx=px(cp.x,cz),sy=py(cp.y,cz);
      if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
      var cw=6.2832/NT*cp.r*s*1.05, ch=gl.hgt/NY*s*1.05;
      /* fat film: only obvious once water beads on it */
      if(so>0.12){
        g.fillStyle='rgba(207,201,168,'+(0.045*so*(1-fg)).toFixed(3)+')';
        g.fillRect(sx-cw/2,sy-ch/2,cw,ch);
      }
      if(h<0.008)continue;
      var ca=contactAngle(so);
      var beadCrit=0.10+ca*0.30;
      if(h>beadCrit*1.35){
        /* sheeting: almost nothing but a shifted reflection and a warmer draining edge */
        var l=lumAt(cp.x,cp.y,cz,cp.nx,0.14,cp.nz);
        g.fillStyle='rgba(238,244,245,'+(Math.min(0.30,0.055+h*0.10)*l*(1-fg*0.8)).toFixed(3)+')';
        g.fillRect(sx-cw/2,sy-ch/2,cw,ch);
        if(j===0||gl.h[(j-1)*NT+i]<h*0.5){
          g.fillStyle='rgba(255,252,240,'+(0.22*(1-fg)).toFixed(3)+')';
          g.fillRect(sx-cw/2,sy+ch*0.30,cw,Math.max(0.7,ch*0.2));
        }
        /* specular streak on a rivulet */
        if(h>beadCrit*2.4){
          g.fillStyle='rgba(255,255,255,'+(0.42*(1-fg)).toFixed(2)+')';
          g.fillRect(sx-cw*0.10,sy-ch/2,Math.max(0.6,cw*0.14),ch);
        }
      }else{
        /* a bead. it is a lens: inverts what is behind it, one hard specular, one caustic. */
        var rad=Math.max(0.9,Math.sqrt(h)*s*0.16*(0.7+ca));
        var lampSX=px(LAMP.x,LAMP.z+0.01), lampSY=py(LAMP.y,LAMP.z+0.01);
        var ldx=sx-lampSX, ldy=sy-lampSY, ll=Math.sqrt(ldx*ldx+ldy*ldy)||1;
        var sampX=sx+ldx/ll*rad*1.9, sampY=sy+ldy/ll*rad*1.9;
        var bc=bgAt(sampX,sampY);
        /* caustic first, on the surface under it */
        g.fillStyle='rgba(255,253,244,'+(0.30*(1-fg)).toFixed(2)+')';
        g.beginPath();g.arc(sx+ldx/ll*rad*1.5,sy+ldy/ll*rad*1.5,rad*0.52,0,6.2832);g.fill();
        g.fillStyle='rgba('+((bc[0]*0.82+18)|0)+','+((bc[1]*0.82+20)|0)+','+((bc[2]*0.82+22)|0)+','+(0.86*(1-fg*0.6)).toFixed(2)+')';
        g.beginPath();g.arc(sx,sy,rad,0,6.2832);g.fill();
        g.fillStyle='rgba(255,255,255,'+(0.95*flick*(1-fg*0.7)).toFixed(2)+')';
        var spr=Math.max(0.55,rad*0.26);
        g.beginPath();g.arc(sx-ldx/ll*rad*0.45,sy-ldy/ll*rad*0.45,spr,0,6.2832);g.fill();
      }
    }
  }
  /* rim and stem: the only parts of glass that render at all */
  var rimY=gl.y0+gl.hgt;
  var lRim=lumAt(gl.cx,rimY,z,0,1,0);
  var c2=mix([238,244,245],C_FOG,fg);
  g.strokeStyle='rgba('+(c2[0]|0)+','+(c2[1]|0)+','+(c2[2]|0)+','+(0.42+0.5*lRim).toFixed(2)+')';
  g.lineWidth=Math.max(0.8,s*0.035);
  g.beginPath();
  for(var t=0;t<=22;t++){
    var an=t/22*6.2832;
    var rx=gl.cx+Math.sin(an)*gl.rad, rz=z+Math.cos(an)*gl.rad;
    var X=px(rx,rz),Y=py(rimY,rz);
    if(t===0)g.moveTo(X,Y);else g.lineTo(X,Y);
  }
  g.stroke();
  g.beginPath();
  for(var t2=0;t2<=22;t2++){
    var an2=t2/22*6.2832;
    var r2=gl.rad*(gl.stem?0.55:0.9);
    var rx2=gl.cx+Math.sin(an2)*r2, rz2=z+Math.cos(an2)*r2;
    var X2=px(rx2,rz2),Y2=py(gl.y0+0.08,rz2);
    if(t2===0)g.moveTo(X2,Y2);else g.lineTo(X2,Y2);
  }
  g.globalAlpha=0.55;g.stroke();g.globalAlpha=1;
  if(gl.stem){
    g.lineWidth=Math.max(0.9,s*0.045);
    g.beginPath();
    g.moveTo(px(gl.cx,z),py(gl.y0+0.1,z));
    g.lineTo(px(gl.cx,z),py(gl.y0+gl.hgt*0.42,z));
    g.stroke();
  }
  /* a glass loaded upright holds an inch of water for the whole cycle */
  if(!gl.stem&&gl.id%7===3){
    var wy=gl.y0+0.85;
    g.fillStyle='rgba(206,212,214,'+(0.30*(1-fg)).toFixed(2)+')';
    g.beginPath();g.ellipse(px(gl.cx,z),py(wy,z),gl.rad*s*0.88,gl.rad*s*0.30,0,0,6.2832);g.fill();
  }
}

function drawLid(){
  var q=lidQuad();
  if(q[0].z-cam.z<0.9)return;
  var s=Math.sin(lid.tilt),co=Math.cos(lid.tilt);
  var zc=lid.cz+rackOff;
  var l=lumAt(lid.cx,lid.y0+lid.h*0.5,zc,0,s,-co);
  quad(q[0],q[1],q[2],q[3],steel(Math.min(1,l*1.05),zc));
  /* rolled rim */
  var lr=lumAt(lid.cx,lid.y0,zc,0,0.3,-0.9);
  g.strokeStyle=steel(Math.min(1,lr*1.25),zc);
  g.lineWidth=Math.max(1.2,sc(zc)*0.09);
  g.beginPath();
  g.moveTo(px(q[0].x,q[0].z),py(q[0].y,q[0].z));
  g.lineTo(px(q[1].x,q[1].z),py(q[1].y,q[1].z));
  g.stroke();
  /* the puddle in the rim. it does not drain. */
  var sl=lid.slosh*0.35;
  var pz=zc-0.12;
  var ph=0.10+lid.pud*0.22;
  var fgl=fogAt(pz);
  g.fillStyle='rgba(224,232,234,'+(0.44*(1-fgl)).toFixed(2)+')';
  g.beginPath();
  g.moveTo(px(lid.cx-lid.w*0.5+0.1,pz),py(lid.y0+0.06+sl*0.2,pz));
  g.lineTo(px(lid.cx+lid.w*0.5-0.1,pz),py(lid.y0+0.06-sl*0.2,pz));
  g.lineTo(px(lid.cx+lid.w*0.5-0.1,pz),py(lid.y0+0.06+ph-sl*0.2,pz));
  g.lineTo(px(lid.cx-lid.w*0.5+0.1,pz),py(lid.y0+0.06+ph+sl*0.2,pz));
  g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,'+(0.55*flick*(1-fgl)).toFixed(2)+')';
  g.fillRect(px(lid.cx-1.2+sl*1.1,pz),py(lid.y0+0.06+ph*0.7,pz),Math.max(1.2,sc(pz)*0.35),Math.max(0.8,sc(pz)*0.045));
  /* it comes out streaming: running film down the face */
  var nr=6;
  for(var i=0;i<nr;i++){
    var fx=lid.cx-lid.w*0.5+ (i+0.5)/nr*lid.w + Math.sin(i*2.1+perfNow*0.0004)*0.12;
    var top=lid.y0+lid.h*co, tz=zc-lid.h*s;
    var a=0.20+0.22*lid.wet;
    g.strokeStyle='rgba(236,242,244,'+a.toFixed(2)+')';
    g.lineWidth=Math.max(0.8,sc(zc)*(0.03+0.02*Math.sin(i*3.3)));
    g.beginPath();
    g.moveTo(px(fx,tz),py(top,tz));
    g.lineTo(px(fx+Math.sin(i)*0.18,zc),py(lid.y0+0.2,zc));
    g.stroke();
  }
}

/* wet shadow on the glass behind the visitor's hand */
function drawPointerDisturbance(){
  if(!ptr.in)return;
  var n=5;
  for(var i=0;i<n;i++){
    var a=(perfNow*0.02+i*1.9)%6.2832;
    var rr=6+i*3.5+Math.sin(perfNow*0.01+i)*3;
    g.fillStyle='rgba(238,244,245,'+(0.05+0.05*Math.random()).toFixed(3)+')';
    g.beginPath();g.arc(ptr.x+Math.cos(a)*rr,ptr.y+Math.sin(a)*rr*0.6,1.2+Math.random()*1.6,0,6.2832);g.fill();
  }
  g.fillStyle='rgba(22,28,31,0.22)';
  g.beginPath();g.ellipse(ptr.x,ptr.y+16,26,15,0,0,6.2832);g.fill();
}

function drawSteam(){
  if(vap<0.03)return;
  var n=MOB?5:9;
  for(var i=0;i<n;i++){
    var ph=(perfNow*0.00006*(1+i*0.11)+i*0.37)%1;
    var zz=3+ph*24;
    var xx=Math.sin(i*2.7+perfNow*0.00013)*11;
    var yy=20+Math.sin(i*1.3+perfNow*0.00021)*5;
    if(zz-cam.z<0.8)continue;
    var s=sc(zz);
    var X=px(xx,zz),Y=py(yy,zz);
    var R=s*(3.2+i%4);
    var a=Math.min(0.30,vap*0.19*(0.4+0.6*Math.sin(ph*3.14)));
    var grd=g.createRadialGradient(X,Y,0,X,Y,R);
    grd.addColorStop(0,'rgba(142,146,148,'+a.toFixed(3)+')');
    grd.addColorStop(1,'rgba(142,146,148,0)');
    g.fillStyle=grd;g.beginPath();g.arc(X,Y,R,0,6.2832);g.fill();
  }
  /* far end greys out honestly */
  var fa=Math.min(0.42,fogAt(26)*0.55);
  if(fa>0.01){
    var gg=g.createRadialGradient(CX,CY-H*0.05,H*0.08,CX,CY,H*0.75);
    gg.addColorStop(0,'rgba(142,146,148,'+fa.toFixed(3)+')');
    gg.addColorStop(1,'rgba(142,146,148,0)');
    g.fillStyle=gg;g.fillRect(0,0,W,H);
  }
}

/* ---------- audio ---------- */
var audio=(function(){
  var ac=null,master=null,rev=null,dry=null,pumpO=null,pumpS=null,pumpG=null,noise=null,nG=null,nF=null,kitchen=null,started=false;
  var lastTap=0,lastScrub=0,lastRing=0;
  function ir(){
    var len=Math.floor(ac.sampleRate*0.085);
    var b=ac.createBuffer(2,len,ac.sampleRate);
    for(var c=0;c<2;c++){
      var d=b.getChannelData(c);
      for(var i=0;i<len;i++){
        var t=i/len;
        var e=Math.pow(1-t,5.2);
        d[i]=(Math.random()*2-1)*e*0.6;
        if(i%Math.floor(ac.sampleRate*0.0036)===0)d[i]+=(Math.random()*2-1)*e*0.9;
      }
    }
    return b;
  }
  function nbuf(sec){
    var len=Math.floor(ac.sampleRate*sec);
    var b=ac.createBuffer(1,len,ac.sampleRate);
    var d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    return b;
  }
  function start(){
    if(started)return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{ac=new AC();}catch(e){return;}
    started=true;
    master=ac.createGain();master.gain.value=0.0;master.connect(ac.destination);
    master.gain.linearRampToValueAtTime(0.85,ac.currentTime+1.6);
    rev=ac.createConvolver();rev.buffer=ir();
    var rg=ac.createGain();rg.gain.value=0.5;rev.connect(rg);rg.connect(master);
    dry=ac.createGain();dry.gain.value=0.9;dry.connect(master);
    /* pump */
    pumpO=ac.createOscillator();pumpO.type='sawtooth';pumpO.frequency.value=172;
    pumpS=ac.createOscillator();pumpS.type='sine';pumpS.frequency.value=28.7;
    pumpG=ac.createGain();pumpG.gain.value=0.10;
    var pf=ac.createBiquadFilter();pf.type='lowpass';pf.frequency.value=900;pf.Q.value=3;
    pumpO.connect(pf);pumpS.connect(pumpG);pf.connect(pumpG);
    pumpG.connect(dry);pumpG.connect(rev);
    pumpO.start();pumpS.start();
    /* impingement */
    noise=ac.createBufferSource();noise.buffer=nbuf(3);noise.loop=true;
    nF=ac.createBiquadFilter();nF.type='bandpass';nF.frequency.value=3200;nF.Q.value=0.7;
    nG=ac.createGain();nG.gain.value=0.0;
    noise.connect(nF);nF.connect(nG);nG.connect(dry);nG.connect(rev);
    noise.start();
    /* beyond the door: hood, racks, two people */
    kitchen=ac.createGain();kitchen.gain.value=0.085;kitchen.connect(master);
    var kn=ac.createBufferSource();kn.buffer=nbuf(4);kn.loop=true;
    var kf=ac.createBiquadFilter();kf.type='lowpass';kf.frequency.value=520;
    kn.connect(kf);kf.connect(kitchen);kn.start();
    for(var v=0;v<2;v++)voice(v);
    kitchenTick();
  }
  function voice(i){
    if(!ac)return;
    var n=ac.createBufferSource();n.buffer=nbuf(2);n.loop=true;
    var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=380+i*220;f.Q.value=4.2;
    var gn=ac.createGain();gn.gain.value=0;
    n.connect(f);f.connect(gn);gn.connect(kitchen);n.start();
    (function mumble(){
      if(!ac)return;
      var t=ac.currentTime;
      var on=Math.random()<0.55;
      var dur=0.12+Math.random()*0.42;
      gn.gain.cancelScheduledValues(t);
      gn.gain.setValueAtTime(gn.gain.value,t);
      gn.gain.linearRampToValueAtTime(on?(0.05+Math.random()*0.06):0.0,t+0.05);
      f.frequency.setValueAtTime(300+Math.random()*420+i*180,t);
      gn.gain.linearRampToValueAtTime(0,t+dur);
      setTimeout(mumble,(dur+Math.random()*0.9)*1000);
    })();
  }
  function kitchenTick(){
    if(!ac)return;
    /* a stack of racks going down on a steel table */
    if(Math.random()<0.4){
      var t=ac.currentTime;
      for(var i=0;i<3+((Math.random()*3)|0);i++){
        clack(t+i*0.045+Math.random()*0.02,0.05+Math.random()*0.05,1400+Math.random()*1800,kitchen);
      }
    }
    setTimeout(kitchenTick,3000+Math.random()*7000);
  }
  function clack(t,gain,freq,dest){
    if(!ac)return;
    var o=ac.createOscillator();o.type='square';o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*0.35),t+0.035);
    var gn=ac.createGain();gn.gain.setValueAtTime(gain,t);
    gn.gain.exponentialRampToValueAtTime(0.0008,t+0.06);
    var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=2.6;
    o.connect(f);f.connect(gn);gn.connect(dest||dry);
    if(dest!==kitchen&&rev)gn.connect(rev);
    o.start(t);o.stop(t+0.08);
  }
  return {
    start:start,
    update:function(dt){
      if(!ac)return;
      var t=ac.currentTime;
      var rpm=1725*(1-0.07*Math.min(1,Qtot/0.006))*(1-P.wear*0.22)*(1+pumpCmd*0.06);
      var bpf=rpm/60*6;
      var gar=foam*(0.6+0.4*Math.random());
      pumpO.frequency.setTargetAtTime(bpf*(1-gar*0.28)+ (gar*Math.random()*22),t,0.05);
      pumpS.frequency.setTargetAtTime(rpm/60*(1-gar*0.3),t,0.06);
      var load=0.06+0.075*(Qtot/0.006)*(1-foam*0.55);
      /* the arm passing the rack loads the pump */
      load*=1+0.13*Math.sin(armA*2.0);
      pumpG.gain.setTargetAtTime(load*(phase==='off'?0.15:1),t,0.04);
      var dmean=d32*1000;
      nF.frequency.setTargetAtTime(Math.max(600,5200/Math.max(0.28,dmean)),t,0.08);
      nF.Q.setTargetAtTime(0.5+dmean*0.9,t,0.1);
      var coh=Math.max(0,Math.min(1,(Lb-4)/8));
      nG.gain.setTargetAtTime((phase==='off'?0.006:0.02+0.075*(Qtot/0.006)*(0.4+coh*0.8)),t,0.06);
    },
    tap:function(m,q){
      if(!ac)return;var now=performance.now();
      if(now-lastTap<26)return;lastTap=now;
      clack(ac.currentTime,Math.min(0.10,m*0.5*(q||1)),700+Math.random()*900);
    },
    ring:function(f,e){
      if(!ac)return;var now=performance.now();
      if(now-lastRing<40)return;lastRing=now;
      var t=ac.currentTime;
      var o=ac.createOscillator();o.type='sine';o.frequency.value=f;
      var o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2.72;
      var gn=ac.createGain();gn.gain.setValueAtTime(Math.min(0.06,e*0.06),t);
      gn.gain.exponentialRampToValueAtTime(0.0004,t+0.55);
      o.connect(gn);o2.connect(gn);gn.connect(dry);gn.connect(rev);
      o.start(t);o2.start(t);o.stop(t+0.6);o2.stop(t+0.6);
    },
    scrub:function(v){
      if(!ac)return;var now=performance.now();
      if(now-lastScrub<55)return;lastScrub=now;
      var t=ac.currentTime;
      var n=ac.createBufferSource();n.buffer=nbuf(0.12);
      var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2200+Math.random()*1600;f.Q.value=1.4;
      var gn=ac.createGain();gn.gain.setValueAtTime(Math.min(0.05,v*0.0016),t);
      gn.gain.exponentialRampToValueAtTime(0.0005,t+0.1);
      n.connect(f);f.connect(gn);gn.connect(dry);gn.connect(rev);n.start(t);
    },
    solenoid:function(){if(!ac)return;var t=ac.currentTime;clack(t,0.09,520);clack(t+0.055,0.06,380);},
    gasket:function(){
      if(!ac)return;var t=ac.currentTime;
      var n=ac.createBufferSource();n.buffer=nbuf(0.35);
      var f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);
      f.frequency.exponentialRampToValueAtTime(180,t+0.3);
      var gn=ac.createGain();gn.gain.setValueAtTime(0.07,t);
      gn.gain.exponentialRampToValueAtTime(0.0006,t+0.33);
      n.connect(f);f.connect(gn);gn.connect(dry);gn.connect(rev);n.start(t);
      clack(t+0.32,0.05,240);
    },
    contactor:function(){if(!ac)return;clack(ac.currentTime,0.055,190);}
  };
})();
setInterval(function(){if(Math.random()<0.5)audio.contactor();},11000);

/* ---------- main ---------- */
var last=performance.now(),perfNow=0,acc=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;perfNow=now;
  inputs(dt);
  var w=hydraulics();
  cycle(dt);
  armStep(dt,w);
  buildJets();
  jetWork(dt,w);
  partStep(dt,w);
  lidStep(dt);
  for(var i=0;i<glasses.length;i++){
    var gl=glasses[i];
    if(gl.lid)continue;
    filmStep(gl,dt,w);
    if(gl.ringP&&gl.ringE>0.06){audio.ring(gl.f,gl.ringE);gl.ringP=0;}
  }
  /* the lamp is being interrupted several times a second by actual water */
  var cross=0;
  for(var j=0;j<jetList.length;j++){
    var J=jetList[j];
    if(J.z-cam.z<6&&J.y>14)cross+=J.open;
  }
  for(var k2=0;k2<MAXP;k2+=7){
    var p=pool[k2];
    if(p.a&&p.z<5.5&&p.y>18)cross+=0.35;
  }
  flick=Math.max(0.62,1-Math.min(0.38,cross*0.06));

  /* draw */
  drawChamber();
  drawRack();
  /* far to near */
  var order=glasses.slice().sort(function(a,b){return (b.cz)-(a.cz);});
  var lidZ=lid.cz;
  var drewLid=false;
  for(var d=0;d<order.length;d++){
    var gg2=order[d];
    if(!drewLid&&gg2.cz<lidZ){drawLid();drewLid=true;}
    if(!gg2.lid)drawGlass(gg2);
  }
  if(!drewLid)drawLid();
  drawArms();
  /* sample the field behind the water for the next frame's lenses */
  try{og.drawImage(cv,0,0,cv.width,cv.height,0,0,96,54);bgD=og.getImageData(0,0,96,54).data;}catch(e){bgD=null;}
  drawJets();
  drawParticles();
  drawPointerDisturbance();
  drawSteam();
  audio.update(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
