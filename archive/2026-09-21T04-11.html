  <meta name="outbox-spec-era" content="Right now, 6:12 in the morning, in the last six minutes before a municipal swimming pool's water-chemistry log has to be initialled and hung on the nail by the pump room door — the building is 1964, the chlorine controller is 1998, the pH probe was replaced in March, and the page refuses to say the year because nothing in the room tells you. Not a look-back, not a lament, not anybody's lost childhood summer: the first lane swimmers are already on the deck bench, the free chlorine came back at 0.4 and needs to be 1.0 before anybody is allowed in the water, and the acid feed has been running for eleven minutes against a set point somebody changed and did not write down.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SENTENCE WRITTEN THIRTY-ONE TIMES, stacked as thirty-one lines with nothing else on the page — no header, no menu, no title, no footer, no scrollbar, no links, no buttons, no cursor label, no instructions, and no vertical scroll at any window size. Every line is the same sentence and every line is slightly different from the one above it, because each line is that sentence RE-DERIVED from the pool's live chemistry at a timestamp six seconds later than the line above it, so the thirty-one lines are three minutes and six seconds of one room, written out in full each time. The strangeness: THE READER IS READING DOWNWARD AND THE PAGE IS BEING RE-DERIVED UPWARD. Every six real seconds the engine computes a new bottom line from the current chemistry and every existing line shifts up one position, and the top line is pushed off the page and does not exist anywhere afterward — so a sentence the visitor is in the middle of reading is not where they left it, and the line they liked is gone in three minutes. The visitor's only vocabulary is what a hand does at a chemical feeder: DRAG DOWN or UP anywhere on the page to open and close the acid feed valve, PRESS AND HOLD to run the recirculation pump faster, and PRESS a single line to hold that one line still while the other thirty keep marching past it, which is the only way to read any sentence to the end. A held line stays held until it is pressed again, and it goes stale where it sits while the pool moves on around it, and nothing on the page says so.">
  <meta name="outbox-spec-subject" content="The flat arithmetic of pool water chemistry at six in the morning, which is almost entirely a pH-versus-chlorine-effectiveness problem and has nothing whatsoever to do with cleanliness or with how the water looks. That the single most important fact in the building is that FREE CHLORINE IS TWO DIFFERENT CHEMICALS IN EQUILIBRIUM and pH decides which one you have: hypochlorous acid, which is the disinfectant and kills things in seconds, and hypochlorite ion, which is nearly a hundred times weaker, and the split between them is set by pH alone — at 7.2 about two-thirds of your chlorine is the strong one, at 7.8 it is about a quarter, and at 8.2 it is under a tenth. So the same 1.0 ppm reading is worth four times as much at 7.3 as it is at 7.9, and every operator who chases the chlorine number without looking at the pH is adding gas to a problem that is not a chlorine problem. That this is why the acceptable pH band is narrow at both ends and not arbitrary: below 7.2 the water starts dissolving the grout and etching the plaster and stinging eyes, above 7.8 the chlorine is doing almost nothing and scale begins to drop out on the heat exchanger. That EYE STING IS NOT CHLORINE and never was — it is pH out of the tear-film range and it is chloramines, and the smell everybody calls 'chlorine smell' is specifically the smell of chlorine that has ALREADY BEEN USED UP, combined with ammonia from sweat and urine into monochloramine, dichloramine and nitrogen trichloride, which means a pool that smells strongly of chlorine is a pool with too little free chlorine and not too much. That the two numbers on the test kit are FREE and TOTAL, that the difference between them is combined chlorine, that anything over 0.2 ppm of combined is a pool that needs breakpoint chlorination, and that breakpoint is a real ratio and not a guess: it takes roughly ten parts of free chlorine for every one part of ammonia nitrogen to oxidise the chloramines all the way through, and dosing to eight parts makes it worse rather than better, because the intermediate stages are the ones that smell and burn. That ALKALINITY IS THE SHOCK ABSORBER AND PH IS THE READING: total alkalinity at 80 to 120 ppm is what keeps pH from moving when anything is added, and a pool with alkalinity at 40 will swing a full point on a gallon of acid while a pool at 100 barely moves — so an operator fighting pH all week is almost always looking at an alkalinity number they have not measured. That CALCIUM HARDNESS is the third leg and is not optional: soft water is aggressive and pulls calcium out of the plaster and the grout to satisfy itself, which is why a new pool filled from a soft municipal supply eats its own surfaces, and the Langelier index is the real arithmetic that ties pH, alkalinity, hardness and temperature into one number that says whether this water is dissolving the building or coating it. That TEMPERATURE IS IN THAT EQUATION, which means a pool held at 84 degrees for a warm-water program is chemically a different pool from the same water at 78, and the saturation index moves about two-tenths across that range. That CYANURIC ACID IS THE MOST MISUNDERSTOOD THING IN THE BUILDING: it protects chlorine from ultraviolet by binding most of it in reserve, which is essential outdoors and a genuine liability indoors, because bound chlorine is not working chlorine, and the practical rule is that the free chlorine has to be about 7.5 percent of the cyanuric acid level to have the same killing power — so a pool at 100 ppm cyanuric needs 7.5 ppm of chlorine to do what a pool at 30 ppm does with 2.25, and cyanuric acid does not evaporate, does not break down and can only be removed by draining water. That an indoor pool that has been dosed with stabilised chlorine tablets for years is a pool with a slowly rising floor under it that nobody measured. That CT VALUE IS THE ONLY THING THAT MATTERS FOR SAFETY and it is concentration multiplied by time: most bacteria are gone in under a minute at 1 ppm, giardia takes forty-five minutes, and cryptosporidium requires a CT of about 15,300 mg-min per litre, which at normal chlorine is more than ten days, which is why a crypto incident is not a chlorine problem at all but a hyperchlorination-and-close-the-pool problem, and why the UV unit in the plant room is the only real answer. That TURNOVER IS SEPARATE ARITHMETIC: the pool holds 246,000 gallons, the design turnover is six hours, so the pumps have to move about 680 gallons a minute, and turnover is exponential mixing and not a queue — one turnover removes about 63 percent of anything suspended, not all of it, and four turnovers gets you to 98. That FILTER PRESSURE IS A FLOW READING IN DISGUISE: as the sand loads, differential pressure climbs and flow falls, so a filter ten psi over clean is a pool whose turnover time has quietly gone from six hours to nine, and the chemistry that was correct at the old flow rate is not correct at the new one. That the ORP probe reads oxidation potential and not concentration, that it is what the controller actually acts on, that it drifts with pH and with cyanuric and with probe fouling, and that a controller trusting a dirty probe will feed acid or gas all night against a number that is not true. That the DPD test is the reference and the OT tablets are not, that a DPD reading that flashes pink and then goes clear means the chlorine is high enough to bleach the reagent and the true number is much higher than zero, and that this is the single most dangerous misread in the trade. And the flat arithmetic at the nail by the door: 0.4 free against a 1.0 minimum, pH 7.9 and coming down, alkalinity last measured Thursday, eleven minutes of acid feed against a set point somebody changed, one bather-load of lane swimmers on the bench, and a log that gets initialled at 6:18.">
  <meta name="outbox-spec-tone" content="The rapid, self-interrupting, figure-first voice of Marisol Achterberg-Nyondo, 47, certified pool operator for this building for nine years, who is standing at the test bench with a comparator block in one hand and is talking to nobody in particular because she does this out loud and always has, in short bursts between counting drops. She is not narrating and not reflecting and never addresses the visitor: she is reading a number, saying what it means for the number she has to hit, and going back to the drops. 'Point four. Point four free at seven-nine is not point four, it's about a tenth of a point four, say it properly, it's a tenth.' She counts every titration aloud and starts over twice because she loses the count. She revises her own dosing figure three separate times and says flatly what she had wrong each time: once because she ran the acid demand against Thursday's alkalinity instead of measuring it, once because she forgot the heater came up to 84 for the arthritis class and the saturation index moved, once because she read a DPD that flashed and cleared and believed the low number for about forty seconds before catching it. She is specifically and repeatedly aggrieved about exactly one thing — that somebody on second shift changed the controller's ORP set point without writing it in the book, and she has asked for a lock on the panel twice — and she says it three times, once with the date she asked. She is proud of exactly one thing and says it twice: that this pool has not been closed on her shift since she took the certification, and she gives the month and the number of days. She never explains anything to anybody, never teaches, never summarises, and answers no questions because nobody is asking any. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT meditative, NOT a craftsman-sage, NOT a woman-in-a-man's-plant-room arc, NOT charmed by herself, NOT lonely, NOT the dawn-quiet-before-the-world-wakes voice, and NOT aware of being read.">

  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the most important colour on the page is COMPUTED and never chosen. The ground is the pump room's wall paint, a 1964 institutional aqua-grey gone chalky and slightly powdery at hand height (#8fa7a4), dirtier and greener along the bottom where the floor gets hosed (#6b8180), with a permanent hard-edged white rectangle where a framed certificate was moved. The thirty-one lines are set in the log book's own ballpoint blue-black (#1f2734), and EVERY LINE'S INK DENSITY IS THE OUTPUT OF ITS AGE ON THE PAGE: each line stores the timestamp it was derived at, and density falls honestly across the thirty-one positions, so the newest line at the foot is dense and glossy and the topmost line about to be pushed off is a thin rubbed grey-blue (#6e7788) with individual characters already gone — the page is genuinely harder to read at the top and nothing anywhere says so. A held line stops ageing in density but accumulates a real staleness that renders as a faint chlorine-bleached halo around it (#a9bcb6), which grows, and which also is never explained. Exactly one chip of comparator-block DPD pink (#d8437f) is held strictly for three things: the free chlorine figure wherever it currently appears in any line, the word CLOSED, and the pH reading whenever it is outside 7.2 to 7.8. It never appears in the wall, never in ordinary text, never in the total chlorine figure, never in a held line's halo. Flat, hard, high contrast at the foot and honestly worn at the head; no glow, no bloom, no soft focus, no fade-to-transparent, no vignette, no water caustics, no gradients other than honest per-line ink age and honest bleach halo.">
  <meta name="outbox-spec-wildcard" content="Line 17 of the thirty-one is always, on every visit, the sentence derived for a pool that does not exist in this building. It is the outdoor 20-metre teaching pool that was filled in with sand and paved over in the eighties, and it is still on the controller's channel B because the controller was installed with two channels and nobody deleted the second one. The engine models it fully and honestly as a real body of water: it has its own gallons, its own cyanuric level (very high, because it was outdoor and stabilised), its own temperature tracking a live outdoor figure, its own bather load of zero forever, and its own chemistry that drifts on real arithmetic under a real sky. Its sentence therefore reads completely normally, in the same template with the same slots and the same units, and its figures are internally consistent and internally correct and have nothing to do with the building. It marches, shifts and ages exactly like the other thirty lines, it can be held like any other line, its pink chip lights on the same rules, and it cannot be identified, marked, skipped, released, deleted or distinguished by anything the visitor can do. Marisol mentions channel B exactly once, mid-page, says what year it was paved and that the log has a column for it that she still initials, and never mentions it again.">
  <meta name="outbox-spec-forbidden" content="NO water-as-metaphor for anything — not depth, not immersion, not being held, not surfacing, not balance, not 'what's beneath', not baptism, not cleansing, not letting go; this is a hypochlorous fraction at pH 7.9 and a 15,300 CT requirement and it has nothing to teach anybody. ABSOLUTELY NO swimming-pool nostalgia or sensory reverie: no smell-of-chlorine-and-summer, no wet-tile-and-echo, no the-light-on-the-ceiling, no underwater-silence, no goggles-and-lane-ropes, no first-swimming-lesson, no childhood, no a-boy-who-would-grow-up-to-be, no coming-of-age, no bittersweet hindsight. NO empty-pool-at-dawn mood piece, NO liminal, NO backrooms, NO uncanny, NO SCP, NO analog-horror, NO dread, NO something-in-the-deep-end, NO drowning imagery, NO danger-porn, NO foreshadowed accident, NO 'the water is waiting' — nothing here is wrong and nobody is at risk. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser, lo-fi, chillout or screensaver framing of the water, the pump noise or the marching lines; the pump is loud and the room smells of what it smells of. NO blue lyricism and NO light-on-water writing of any kind: no caustics, no shimmer, no aquamarine reverie, no describing anything as glassy, liquid, breathing or alive. NO athlete or training register: no laps, no discipline, no the-body-as-instrument, no Michael Phelps, no swim-team drama, no early-morning-dedication sermon. NO public-amenity politics: no municipal-budget satire, no bureaucratic-absurd, no committee minutes, no department-of-X, no Kafka, no form-as-joke, no parody of officialese, no 'they're closing the pool', no austerity essay, no third-place sociology, no who-gets-to-swim commentary. NO chemistry-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part', NO myth-busting register about chlorine smell or eye sting — the fact is stated as a working figure and nothing is being corrected for anybody's benefit. NO health-and-safety sermon, NO hygiene moralising, NO shower-before-you-swim joke, NO urine-in-the-pool comedy of any kind, at any level, ever. NO craftsman-sage register, NO 'the old pool men could taste the pH', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc, NO wise-absent-predecessor, NO essential-workers framing, NO invisible-infrastructure essay, NO 'nobody thinks about this until it isn't there', NO awe at systems. NO nostalgia, NO wistfulness, NO decline narrative, NO 'the building is coming down in the spring', NO retro-kitsch, NO camp, NO ironic affection for aqua-grey paint, comparator blocks, ballpoint log books or 1960s tilework. NO woman-in-a-man's-plant-room arc, NO proving-herself, NO sexist-second-shift sketch, NO charmed-by-herself. NO dawn framing: no world-not-awake-yet, no first-light, no the-quiet-before, no solitude, no pre-coffee register, no 3am voice, no night-shift / dispatcher / desk / log voice despite there being an actual log — it is twelve minutes past six with nine people on a bench and a deadline at 6:18. NO experimental-literature framing of the repetition: no Oulipo, no Stein, no 'a sentence is a sentence is a sentence', no erasure poetry, no found-poem preciousness, no incantation, no litany, no mantra, no repetition-as-ritual, no repetition-as-obsession, no writing-about-writing, no meta commentary on the page's own shape, no winking at the reader, no the-page-is-aware-of-itself. NO time-as-theme essay, NO entropy sermon, NO the-lines-fade-like-memory, NO ephemerality preciousness about the line that gets pushed off, NO impermanence. NO archival / museum / cabinet / drawer / ledger / registry / log / record / found-document / relic framing of the sentence or the log whatsoever, despite the whole page being a written record that is about to be initialled. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
(function(){
"use strict";
var LN=31, TICKMS=6000, SUB=250;

/* ---------- persistence, forward only ---------- */
var KEY="pr.chanB.v1";
var P={cya:61.0,dpOver:8.4,foul:.28,acidMin:11.0,lines:0,breaches:0,bcya:148.0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in P){if(typeof o[k]==="number"&&isFinite(o[k]))P[k]=Math.max(P[k],o[k]);}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}

/* ---------- main body of water ---------- */
var W={
  gal:246000, fc:0.41, cc:0.21, pH:7.90, pHt:7.90, ta:96.0, ch:214, cya:P.cya,
  temp:84.0, foul:P.foul, dpOver:P.dpOver, acid:3.0, acidMin:P.acidMin,
  bench:9, inWater:0, amm:0.0, fcRead:0.41, tcRead:0.62, openStreak:0, phWasOut:true
};
/* ---------- channel B: 20 m teaching pool, filled in, still on the panel ---------- */
var B={
  gal:41000, fc:0.08, cc:0.07, pH:8.24, pHt:8.24, ta:142.0, ch:318, cya:P.bcya,
  temp:55.4, foul:0.62, dpOver:2.1, acid:0.0, acidMin:0.0,
  bench:0, inWater:0, amm:0.0, fcRead:0.08, tcRead:0.15, openStreak:0, phWasOut:true
};

var pumpBoost=false, ctrlOn=false, SETPOINT=785;
var testT=0, bTestT=0, clockSec=6*3600+9*60+18;
var derivCount=0, held=null, heldSince=0, tier=0;

/* ---------- arithmetic ---------- */
function hoclFrac(pH,t){var pKa=7.54-0.0125*((t-77)/9);return 1/(1+Math.pow(10,pH-pKa));}
function cyaAvail(c){return 1/(1+0.05*c);}
function lsi(pH,ta,ch,cya,t){
  var TF=0.0135*t-0.44;
  var CF=Math.log(Math.max(ch,10))/Math.LN10-0.4;
  var carb=Math.max(10,ta-cya/3);
  var AF=Math.log(carb)/Math.LN10;
  return pH+TF+CF+AF-12.1;
}
function flowOf(w,boost){
  var base=(w===W)?680:62;
  var f=base*(1-0.018*w.dpOver)*(boost?1.20:1.0);
  return Math.max(base*0.35,f);
}
function orpOf(w){
  var eff=w.fc*hoclFrac(w.pH,w.temp)*cyaAvail(w.cya);
  var t=520+300*(eff/(eff+0.35))-45*(w.pH-7.5);
  return {t:t,eff:eff};
}
function step(w,dt,boost,isB){
  var flow=flowOf(w,boost), base=(w===W)?680:62, mix=flow/base;
  /* acid feed */
  if(w.acid>0.02){
    var dTA=w.acid*dt*0.0024;
    w.ta=Math.max(22,w.ta-dTA);
    w.pHt-=dTA*(0.55/Math.max(w.ta,25))*8;
    w.acidMin+=dt/60;
  }
  /* carbon dioxide loss / plaster, honest upward creep */
  w.pHt+=0.00012*dt*(w.ta/100)*(8.4-w.pH>0?1:0);
  if(w.pHt>8.6)w.pHt=8.6; if(w.pHt<6.6)w.pHt=6.6;
  /* mixing lag */
  w.pH+=(w.pHt-w.pH)*(1-Math.exp(-dt*mix/110));
  /* controller, acting on a fouled probe against a set point somebody changed */
  var o=orpOf(w), read=o.t*(1-0.28*w.foul);
  var want=read<SETPOINT-4;
  if(!isB&&want!==ctrlOn){ctrlOn=want;clack();}
  if(want){
    var dFC=dt*(isB?0.0012:0.00833)*mix;
    w.fc+=dFC;
    var dta=1.4*dFC;
    w.ta=Math.max(22,w.ta-dta);
    w.pHt-=dta*(0.55/Math.max(w.ta,25))*8;
  }
  /* bathers → ammonia nitrogen → combined */
  if(w.inWater>0){
    var dN=w.inWater*dt*2.2e-5;
    w.amm+=dN;
    var used=Math.min(w.fc*0.5,5*dN);
    w.fc-=used; w.cc+=used;
  }
  /* breakpoint: combined only comes down when free is well ahead of ammonia */
  var eff=o.eff;
  w.cc=Math.max(0,w.cc-w.cc*dt*(eff/(eff+0.30))*0.0025);
  /* background demand */
  w.fc=Math.max(0.005,w.fc-dt*0.000035*(1+w.inWater*0.05));
  /* sand loads, probe fouls, cyanuric only climbs */
  w.dpOver+=dt*Math.pow(mix,2)*(isB?4e-7:2.2e-5);
  w.foul=Math.min(0.85,w.foul+dt*1.1e-6);
  w.cya+=dt*(isB?2e-6:8e-6);
  /* temperature */
  if(isB){
    var hr=(new Date()).getHours()+(new Date()).getMinutes()/60;
    w.temp+= ((52+9*Math.sin((hr-9)/24*2*Math.PI))-w.temp)*dt*0.0006;
  }
  /* bathers on the bench move when the numbers let them */
  var okOpen=(w.fcRead>=1.0 && w.pH>=7.2 && w.pH<=7.8);
  if(!isB){
    if(okOpen){ if(w.bench>0 && Math.random()<dt*0.28){w.bench--;w.inWater++;} }
    else { if(w.inWater>0 && Math.random()<dt*0.30){w.inWater--;w.bench++;} }
  }
  /* band breaches, forward only */
  var out=(w.pH<7.2||w.pH>7.8);
  if(!isB){ if(out&&!w.phWasOut){P.breaches++;} w.phWasOut=out; }
}
function runTest(w){
  if(w.fc>10){
    w.fcRead=Math.max(0.15,Math.min(1.2,1.25-(w.fc-10)*0.035));
    w.tcRead=w.fcRead+0.10;
  }else{
    w.fcRead=Math.round(w.fc*100)/100;
    w.tcRead=Math.round((w.fc+w.cc)*100)/100;
  }
}

/* ---------- the sentence ---------- */
var A=[
["point four free at seven-nine is not point four, it's a tenth","a tenth, say it"],
["one, two, three, four — not pink enough, start over","start over"],
["one, two, three, four, five, six, seven — seven","seven"],
["I ran the demand off Thursday's alkalinity, that's wrong","off Thursday, wrong"],
["second shift moved the ORP set point and wrote nothing","set point, again"],
["heater's at eighty-four for the arthritis class, redo the index","eighty-four, redo it"],
["one, two, three — lost it, again","lost it"],
["not closed on my shift since the March I got the ticket","not once since March"],
["ten to one on the ammonia or it gets worse, not better","ten to one"],
["the DPD flashed and cleared and I believed it for forty seconds","flashed and cleared"],
["eyes go at seven-nine, every single time","eyes at seven-nine"],
["I asked for a lock on that panel on the eleventh of June","a lock, June eleventh"],
["one, two, three, four, five — five, hold five","five, hold five"],
["gas all night against a filthy probe, that's what that is","against a filthy probe"],
["eleven minutes of acid and it hasn't moved a tenth","hasn't moved a tenth"],
["channel B's the teaching pool, paved in eighty-six, still a column, still initialled","channel B, eighty-six"],
["that smell is combined, it isn't free","that's combined"],
["hardness two-fourteen, leave it, it isn't the problem","hardness, leave it"],
["one, two — no. one, two, three, four","no. one, two"],
["six-eighteen on the nail and I want a one on the board","six-eighteen, a one"],
["three thousand and forty-one days and not one closure","three thousand forty-one"],

var NEUT=[1,2,6,12,16,18,26,28,29];
function deck(){ return (clockSec>=6*3600+18*60)?Bd:A; }
function asideFor(n,isB){
  var d=deck();
  if(isB){ return d[NEUT[n%NEUT.length]%d.length]; }
  return d[n%d.length];
}

function f(v,d,w){var s=(isFinite(v)?v:0).toFixed(d);return w?(s.length<w?new Array(w-s.length+1).join(" ")+s:s):s;}
function sgn(v){return (v>=0?"+":"")+f(Math.abs(v),2,4).replace(/^ /,"");}
function hhmmss(s){s=((s%86400)+86400)%86400;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=Math.floor(s%60);
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(c<10?"0":"")+c;}

function snap(w,boost,as){
  var hf=hoclFrac(w.pH,w.temp), ca=cyaAvail(w.cya);
  var eff=w.fcRead*hf*ca;
  var o=orpOf(w), read=o.t*(1-0.28*w.foul);
  var flow=flowOf(w,boost), turn=w.gal/flow/60;
  var cc=Math.max(0,w.tcRead-w.fcRead);
  var st=(w.fcRead>=1.0 && w.pH>=7.2 && w.pH<=7.8)?"OPEN":"CLOSED";
  return {clock:hhmmss(clockSec),fc:w.fcRead,tc:w.tcRead,cc:cc,pH:w.pH,
    pct:hf*100,eff:eff,ta:w.ta,ch:w.ch,cya:w.cya,temp:w.temp,
    lsi:lsi(w.pH,w.ta,w.ch,w.cya,w.temp),orp:read,foul:w.foul,dp:w.dpOver,
    flow:flow,turn:turn,acid:w.acid,amin:w.acidMin,bench:w.bench,inw:w.inWater,
    st:st,phOut:(w.pH<7.2||w.pH>7.8),aside:as};
}
function build(s,t){
  var g=[],pk=function(x){g.push({t:x,c:"pk"});},p=function(x){g.push({t:x,c:""});};
  if(t===0){
    p(s.clock+" — free ");pk(f(s.fc,2,4));p(" ppm, total ");p(f(s.tc,2,4));
    p(", combined ");p(f(s.cc,2,4));p(" ppm, pH ");s.phOut?pk(f(s.pH,2,4)):p(f(s.pH,2,4));
    p(", ");p(f(s.pct,0,2));p("% hypo, working ");p(f(s.eff,3,5));
    p(" ppm, TA ");p(f(s.ta,0,3));p(", CH ");p(f(s.ch,0,3));p(", CYA ");p(f(s.cya,0,3));
    p(", ");p(f(s.temp,1,4));p("\u00B0F, LSI ");p(sgn(s.lsi));
    p(", ORP ");p(f(s.orp,0,3));p(" mV, probe ");p(f(s.foul*100,0,2));
    p("%, filter ");p(f(s.dp,1,4));p(" psi, ");p(f(s.flow,0,3));p(" gpm, ");p(f(s.turn,1,4));
    p(" h, acid ");p(f(s.acid,1,4));p(" gph/");p(f(s.amin,0,3));p(" min, bench ");p(f(s.bench,0,1));
    p("/");p(f(s.inw,0,1));p(" in, ");s.st==="CLOSED"?pk("CLOSED"):p("OPEN");p(" \u2014 ");p(s.aside[0]);
  }else if(t===1){
    p(s.clock+" — free ");pk(f(s.fc,2,4));p(" ppm, total ");p(f(s.tc,2,4));
    p(", comb ");p(f(s.cc,2,4));p(", pH ");s.phOut?pk(f(s.pH,2,4)):p(f(s.pH,2,4));
    p(", ");p(f(s.pct,0,2));p("% hypo, wk ");p(f(s.eff,3,5));
    p(", TA ");p(f(s.ta,0,3));p(", CYA ");p(f(s.cya,0,3));p(", ");p(f(s.temp,1,4));
    p("\u00B0F, ORP ");p(f(s.orp,0,3));p(", dP ");p(f(s.dp,1,4));
    p(", acid ");p(f(s.acid,1,4));p(" gph, b");p(f(s.bench,0,1));p("/");p(f(s.inw,0,1));
    p(", ");s.st==="CLOSED"?pk("CLOSED"):p("OPEN");p(" \u2014 ");p(s.aside[1]);
  }else{
    p(s.clock+" fc");pk(f(s.fc,2,4));p(" pH");s.phOut?pk(f(s.pH,2,4)):p(f(s.pH,2,4));
    p(" e");p(f(s.eff,3,5));p(" ");p(f(s.orp,0,3));p("mV ");p(f(s.acid,1,4));p("gph b");
    p(f(s.bench,0,1));p(" ");s.st==="CLOSED"?pk("CLOSED"):p("OPEN");p(" \u2014 ");p(s.aside[1]);
  }
  return g;
}

/* ---------- the stack ---------- */
var lines=[], idc=0;
function mkLine(w,isB,ageOverride){
  var as=asideFor(derivCount,isB);
  var s=snap(w,pumpBoost,as);
  return {id:++idc,age:(typeof ageOverride==="number")?ageOverride:0,snap:s,
          frozenAge:null,heldAt:0};
}

/* ---------- prefill: three minutes six seconds of it, already gone ---------- */
(function prefill(){
  runTest(W); runTest(B);
  for(var i=0;i<LN;i++){
    for(var k=0;k<24;k++){ step(W,0.25,false,false); step(B,0.25,false,true); }
    testT+=6; if(testT>=30){testT=0;runTest(W);}
    bTestT+=6; if(bTestT>=30){bTestT=0;runTest(B);}
    var ln=mkLine(W,false,LN-1-i);
    lines.push(ln);
    derivCount++;
    if(i<LN-1) clockSec+=6;
  }
  lines[16]=mkLine(B,true,16);
  P.lines+=LN;
})();

/* ---------- rendering ---------- */
var wrap=document.getElementById("wrap");
var rows=[];
for(var i=0;i<LN;i++){var d=document.createElement("div");d.className="ln";wrap.appendChild(d);rows.push(d);}

function hx(c){return c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lerp(a,b,t){return a+(b-a)*t;}
function hex2(s){return [parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)];}
var INK0=hex2("#1f2734"), INK1=hex2("#6e7788"), PK0=hex2("#d8437f"), PK1=hex2("#93707f");
function mix(a,b,t){return "rgb("+Math.round(lerp(a[0],b[0],t))+","+Math.round(lerp(a[1],b[1],t))+","+Math.round(lerp(a[2],b[2],t))+")";}
function rnd(a,b){var x=(a*73856093)^(b*19349663);x=Math.imul(x^(x>>>15),2246822507);x=Math.imul(x^(x>>>13),3266489909);return ((x^(x>>>16))>>>0)/4294967296;}

var NOM=[236,178,80], MINF=[9.6,8.7,7.0];
function fit(){
  var Wd=wrap.clientWidth-14, H=wrap.clientHeight, rowH=H/LN, cw=0.575, t, fs=7;
  for(t=0;t<3;t++){ fs=Math.min(Wd/(NOM[t]*cw), rowH*0.88); if(fs>=MINF[t]) break; }
  if(t>2){t=2;fs=Math.max(7,Math.min(Wd/(NOM[2]*cw), rowH*0.88));}
  tier=t; wrap.style.fontSize=fs.toFixed(2)+"px";
}
function draw(){
  for(var i=0;i<LN;i++){
    var L=lines[i], el=rows[i];
    var age=(L.frozenAge!==null)?L.frozenAge:L.age;
    var tt=Math.min(1,age/30), tc=Math.pow(tt,0.85);
    var ink=mix(INK0,INK1,tc), pink=mix(PK0,PK1,tc);
    var drop=Math.max(0,(age-19)/11)*0.30;
    var segs=build(L.snap,tier), html="";
    var ci=0;
    for(var s=0;s<segs.length;s++){
      var txt=segs[s].t, out="";
      for(var c=0;c<txt.length;c++,ci++){
        var ch=txt.charAt(c);
        if(drop>0 && ch!==" " && rnd(L.id,ci)<drop) ch=" ";
        out+=ch;
      }
      html+='<span class="sp" style="color:'+(segs[s].c==="pk"?pink:ink)+'">'+hx(out)+'</span>';
    }
    el.innerHTML=html;
    if(L===held){
      el.className="ln sx";
      var secs=(Date.now()-L.heldAt)/1000;
      el.style.setProperty("--ha",Math.min(0.30,secs*0.0065).toFixed(3));
      el.style.setProperty("--hw",Math.min(26,4+secs*0.55).toFixed(1));
      el.style.setProperty("--hv",Math.min(9,1+secs*0.19).toFixed(1));
    }else{
      el.className="ln"; el.style.setProperty("--ha","0");
    }
  }
}

/* ---------- march ---------- */
function march(){
  clockSec+=6;
  derivCount++;
  P.lines++;
  var nu=mkLine(W,false,0);
  var arr=lines.slice(), hi=-1;
  if(held){ hi=arr.indexOf(held); if(hi<0){held=null;} }
  if(held){
    arr.splice(hi,1);
    arr=arr.slice(1); arr.push(nu); arr.splice(hi,0,held);
  }else{
    arr=arr.slice(1); arr.push(nu);
  }
  for(var i=0;i<arr.length;i++){ if(arr[i]!==held) arr[i].age++; }
  lines=arr;
  if(lines[16]!==held){ lines[16]=mkLine(B,true,16); }
  P.cya=Math.max(P.cya,W.cya); P.bcya=Math.max(P.bcya,B.cya);
  P.dpOver=Math.max(P.dpOver,W.dpOver); P.foul=Math.max(P.foul,W.foul);
  P.acidMin=Math.max(P.acidMin,W.acidMin);
  save();
  drip();
  draw();
}

/* ---------- clocks ---------- */
var acc=0, last=Date.now();
setInterval(function(){
  var now=Date.now(), dt=Math.min(1.0,(now-last)/1000); last=now;
  for(var n=0;n<Math.max(1,Math.round(dt/0.25));n++){
    step(W,0.25,pumpBoost,false); step(B,0.25,pumpBoost,true);
  }
  testT+=dt; if(testT>=30){testT=0;runTest(W);}
  bTestT+=dt; if(bTestT>=30){bTestT=0;runTest(B);}
  acc+=dt*1000;
  if(acc>=TICKMS){acc-=TICKMS;march();}
  if(held) draw();
  tuneAudio();
},SUB);

/* ================= AUDIO ================= */
var AC=null,G,rev,pumpOsc=[],pumpG,rumbleG,gutG,gutBP,crowdG,started=false;
var acidPhase=0;
function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1; return b;
}
function makeIR(){
  var sr=AC.sampleRate,len=Math.floor(sr*2.4),b=AC.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){var d=b.getChannelData(c);
    for(var i=0;i<len;i++){
      var t=i/sr, env=Math.pow(1-t/2.4,2.6);
      var e=0;
      if(Math.abs(t-0.021)<0.001)e=0.7; if(Math.abs(t-0.037)<0.001)e=0.5;
      if(Math.abs(t-0.063)<0.001)e=0.4; if(Math.abs(t-0.094)<0.001)e=0.3;
      d[i]=((Math.random()*2-1)*env*0.6+e*(Math.random()*2-1))*(1-c*0.12);
    }}
  return b;
}
function startAudio(){
  if(started)return; started=true;
  try{
    var AK=window.AudioContext||window.webkitAudioContext; if(!AK)return;
    AC=new AK();
    G=AC.createGain(); G.gain.value=0.0; G.connect(AC.destination);
    rev=AC.createConvolver(); rev.buffer=makeIR();
    var rg=AC.createGain(); rg.gain.value=0.75; rev.connect(rg); rg.connect(G);
    var dry=AC.createGain(); dry.gain.value=0.55; dry.connect(G);
    window.__bus=function(node){node.connect(rev);node.connect(dry);};
    /* 40 hp recirculation pump: blade passing + bearing rumble */
    pumpG=AC.createGain(); pumpG.gain.value=0.055; window.__bus(pumpG);
    [1,2,3].forEach(function(h,i){
      var o=AC.createOscillator(); o.type=i?"sine":"sawtooth"; o.frequency.value=96*h;
      var g=AC.createGain(); g.gain.value=[0.6,0.22,0.1][i];
      o.connect(g); g.connect(pumpG); o.start(); pumpOsc.push(o);
    });
    var rs=AC.createBufferSource(); rs.buffer=noiseBuf(3); rs.loop=true;
    var rlp=AC.createBiquadFilter(); rlp.type="lowpass"; rlp.frequency.value=90; rlp.Q.value=1.1;
    rumbleG=AC.createGain(); rumbleG.gain.value=0.11;
    var lfo=AC.createOscillator(); lfo.frequency.value=3.3;
    var lg=AC.createGain(); lg.gain.value=0.035; lfo.connect(lg); lg.connect(rumbleG.gain); lfo.start();
    rs.connect(rlp); rlp.connect(rumbleG); window.__bus(rumbleG); rs.start();
    /* gutter lip */
    var gs=AC.createBufferSource(); gs.buffer=noiseBuf(4); gs.loop=true;
    gutBP=AC.createBiquadFilter(); gutBP.type="bandpass"; gutBP.frequency.value=1000; gutBP.Q.value=0.6;
    gutG=AC.createGain(); gutG.gain.value=0.05;
    gs.connect(gutBP); gutBP.connect(gutG); window.__bus(gutG); gs.start();
    /* nine people on a bench, no words */
    var cs=AC.createBufferSource(); cs.buffer=noiseBuf(5); cs.loop=true;
    var cbp=AC.createBiquadFilter(); cbp.type="bandpass"; cbp.frequency.value=330; cbp.Q.value=1.3;
    crowdG=AC.createGain(); crowdG.gain.value=0.016;
    var clfo=AC.createOscillator(); clfo.frequency.value=0.17;
    var clg=AC.createGain(); clg.gain.value=0.009; clfo.connect(clg); clg.connect(crowdG.gain); clfo.start();
    cs.connect(cbp); cbp.connect(crowdG); window.__bus(crowdG); cs.start();
    G.gain.setTargetAtTime(0.85,AC.currentTime,1.6);
    setTimeout(block,22000); setTimeout(block,97000);
    setTimeout(squeegee,58000); setTimeout(squeegee,141000);
    setInterval(acidTick,120);
  }catch(e){}
}
function burst(freq,Q,dur,gain,type){
  if(!AC)return;
  try{
    var s=AC.createBufferSource(); s.buffer=noiseBuf(dur+0.02);
    var b=AC.createBiquadFilter(); b.type=type||"bandpass"; b.frequency.value=freq; b.Q.value=Q;
    var g=AC.createGain(); g.gain.setValueAtTime(gain,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    s.connect(b); b.connect(g); window.__bus(g); s.start(); s.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
function clack(){ if(!AC)return; burst(1400,7,0.05,0.16); setTimeout(function(){burst(950,5,0.035,0.10);},38); }
function acidTick(){
  if(!AC||W.acid<0.05)return;
  acidPhase+=0.12*W.acid*0.25;
  if(acidPhase>=1){acidPhase-=1; burst(2200,9,0.028,0.085);}
}
function drip(){ burst(1850,14,0.035,0.06); setTimeout(function(){burst(3200,18,0.02,0.03);},18); }
function block(){
  if(!AC)return;
  try{
    var s=AC.createBufferSource(); s.buffer=noiseBuf(0.45);
    var b=AC.createBiquadFilter(); b.type="bandpass"; b.Q.value=4;
    b.frequency.setValueAtTime(520,AC.currentTime);
    b.frequency.exponentialRampToValueAtTime(2400,AC.currentTime+0.33);
    var g=AC.createGain(); g.gain.setValueAtTime(0.10,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.42);
    s.connect(b); b.connect(g); window.__bus(g); s.start(); s.stop(AC.currentTime+0.45);
    setTimeout(function(){burst(760,11,0.20,0.09);},360);
  }catch(e){}
}
function squeegee(){
  if(!AC)return;
  try{
    var s=AC.createBufferSource(); s.buffer=noiseBuf(1.6);
    var b=AC.createBiquadFilter(); b.type="bandpass"; b.frequency.value=1250; b.Q.value=1.6;
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.linearRampToValueAtTime(0.06,AC.currentTime+0.45);
    g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+1.4);
    s.connect(b); b.connect(g); window.__bus(g); s.start(); s.stop(AC.currentTime+1.6);
  }catch(e){}
}
function tuneAudio(){
  if(!AC)return;
  var fl=flowOf(W,pumpBoost)/680;
  for(var i=0;i<pumpOsc.length;i++){
    pumpOsc[i].frequency.setTargetAtTime(96*(i+1)*(0.62+0.48*fl),AC.currentTime,0.25);
  }
  if(gutBP) gutBP.frequency.setTargetAtTime(760+620*fl,AC.currentTime,0.4);
  if(gutG) gutG.gain.setTargetAtTime(0.030+0.035*fl,AC.currentTime,0.5);
  if(crowdG) crowdG.gain.setTargetAtTime(0.004+0.0016*W.bench,AC.currentTime,0.8);
}

/* ---------- the hand at the feeder ---------- */
var down=false,y0=0,acid0=0,dragged=false,tmr=null,tRow=-1;
function rowAt(y){
  var r=wrap.getBoundingClientRect(), h=r.height/LN;
  var i=Math.floor((y-r.top)/h); return (i<0||i>=LN)?-1:i;
}
function toggleHold(i){
  if(i<0)return;
  var L=lines[i];
  if(held===L){ held.frozenAge=null; held=null; }
  else{
    if(held) held.frozenAge=null;
    held=L; held.frozenAge=L.age; held.heldAt=Date.now();
  }
  draw();
}
function pd(e){
  startAudio();
  down=true; dragged=false;
  y0=(e.touches?e.touches[0].clientY:e.clientY);
  acid0=W.acid; tRow=rowAt(y0);
  tmr=setTimeout(function(){ if(down&&!dragged){pumpBoost=true;} },350);
  if(e.cancelable)e.preventDefault();
}
function pm(e){
  if(!down)return;
  var y=(e.touches?e.touches[0].clientY:e.clientY), dy=y-y0;
  if(Math.abs(dy)>10){ dragged=true; pumpBoost=false; clearTimeout(tmr); }
  if(dragged){ W.acid=Math.max(0,Math.min(14,acid0+dy/48)); }
  if(e.cancelable)e.preventDefault();
}
function pu(e){
  if(!down)return;
  clearTimeout(tmr);
  var wasPump=pumpBoost;
  down=false; pumpBoost=false;
  if(!dragged&&!wasPump) toggleHold(tRow);
  if(e&&e.cancelable)e.preventDefault();
}
window.addEventListener("mousedown",pd);
window.addEventListener("mousemove",pm);
window.addEventListener("mouseup",pu);
window.addEventListener("touchstart",pd,{passive:false});
window.addEventListener("touchmove",pm,{passive:false});
window.addEventListener("touchend",pu,{passive:false});
window.addEventListener("touchcancel",pu,{passive:false});
document.getElementById("ar").addEventListener("mousedown",function(e){e.stopPropagation();});
document.getElementById("ar").addEventListener("touchstart",function(e){e.stopPropagation();},{passive:true});

window.addEventListener("keydown",function(e){
  startAudio();
  if(e.key==="ArrowDown"){ W.acid=Math.min(14,W.acid+0.5); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ W.acid=Math.max(0,W.acid-0.5); e.preventDefault(); }
  else if(e.code==="Space"||e.key===" "){ pumpBoost=true; e.preventDefault(); }
  else if(/^[1-9]$/.test(e.key)){ toggleHold(parseInt(e.key,10)-1); }
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.key===" "){ pumpBoost=false; e.preventDefault(); }
});

/* ---------- wall furniture ---------- */
function furniture(){
  var w=window.innerWidth,h=window.innerHeight;
  var c=document.getElementById("cert");
  var cw=Math.max(96,Math.min(206,w*0.155)), chh=cw*0.72;
  c.style.width=cw+"px"; c.style.height=chh+"px";
  c.style.left=Math.round(w*0.685)+"px"; c.style.top=Math.round(h*0.135)+"px";
  var n=document.getElementById("nail");
  n.style.left=Math.round(w*0.685+cw/2)+"px"; n.style.top=Math.round(h*0.135-9)+"px";
  var pts=[],N=26;
  for(var i=0;i<=N;i++){
    var x=(i/N)*100, y=(rnd(i*31,7)*5.2)+1.5;
    pts.push(x.toFixed(2)+"% "+y.toFixed(2)+"%");
  }
  pts.push("100% 100%","0% 100%");
  document.getElementById("hose").style.clipPath="polygon("+pts.join(",")+")";
}
function resize(){ furniture(); fit(); draw(); }
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,180);});
resize();
