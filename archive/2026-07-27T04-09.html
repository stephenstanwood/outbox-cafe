  <meta name="outbox-spec-era" content="February 1963 — the sixth week of the Big Freeze, mid-morning, bright and hard: the inside face of a single-glazed sash-window pane in an unheated back bedroom, the low sun just come round onto it. The pane is already three-quarters taken and still going. Not a look-back at 'the winter everyone remembers' and not a 'we don't get proper winters now' lament — a live pane actually ferning over this minute, the glass too cold to lean a hand on for more than a second.">
  <meta name="outbox-spec-format" content="The entire viewport IS one cold window pane seen dead-on, edge to edge, with the dark garden barely visible behind it — and across it a GENUINELY functional crystal-growth engine, not a canned animation: frost genuinely propagates as a live diffusion-limited branching field, seeded from the cold corners, from the putty line, and from two fixed hairline scratches in the glass, each branch splitting at honest ~60° elbows, thickening where humidity is high and thinning to spidery hair where the field is starved, so the pane ferns over differently every single load and never twice the same. Your cursor is a warm fingertip: press and drag and the frost genuinely melts away into a clear wet-edged track that beads and slumps, and then, seconds later, the surrounding ice re-takes the cleared glass from the melt-edge inward, growing in denser and finer than it was before. No header, no menu, no controls, no instructions — just the glass and the ice taking it.">
  <meta name="outbox-spec-subject" content="The plain physical business of window ice — how it needs a nucleation point to start at all, which is why it always begins in a corner, along the putty, and at a scratch; why every branch throws its side-shoots at the same stubborn sixty degrees and no other angle; why a fern racing into humid air fattens into a broad feathered blade while one starved of vapour goes thin and hairlike and stops; how a fingertip's warmth doesn't destroy anything, it just resets that patch of glass so the edge can re-take it finer than before; and why a lungful of warm breath dumped on cold glass lays down a whole fresh generation of ice denser than the first. It is water, glass, cold, and where the vapour happens to land — it isn't a message written on the window, it isn't the cold's handwriting, and it has nothing to say about winter, or about you.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice of any kind on the page. The register lives entirely in the behaviour of the ice, and that register is GREEDY and SHOWY and QUICK — frost as a fast, competitive, room-taking thing racing itself across the glass, branches shouldering each other out of vapour, one edge sprinting ahead and going gaudy and feathered while the starved side goes bald. Bright, hard-lit, busy, a bit gluttonous. Explicitly NOT hushed, NOT still, NOT delicate-and-fleeting, NOT reverent, NOT a slow-and-quiet piece — the pane is a scramble, and the sun on it is unkind and brilliant.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Frost worked in two whites over one cold ground: a hard opaque rime-white (#f2f7fa) for the thick feathered blades and a translucent pale ice-blue (#a9cadd) for the thin starved hair-branches, both standing on deep unlit-garden glass slate-teal (#16323f) that goes near-black at the pane's corners; where the low February sun rakes across the ridges the crystal edges catch a hard specular winter-gold (#f0c46a) that moves as the frost thickens, and a wet fingertip-melt track shows as a clear dark bead of the ground colour with a bright gold rim. Hard-lit, high-contrast, no soft edges anywhere — the look of sunlit window ice photographed close with the aperture stopped right down.">
  <meta name="outbox-spec-wildcard" content="The page must contain exactly one word, anywhere, ever: once the pane has genuinely ferned over past roughly nine-tenths coverage, a word appears scratched through the ice by an unseen fingertip in a wobbly, unhurried hand — and it must be a completely ordinary domestic word (a grocery item, a household object, a plain first name), never a message, never a warning, never addressed to the viewer. It is never explained, never repeated, never referred to, and it slowly ferns closed again from its edges like any other cleared patch.">

<script>
(function(){
"use strict";
var cvs=document.getElementById('pane');
var ctx=cvs.getContext('2d',{alpha:false});
var ANG60=Math.PI/3, P=14, MAXT=340;
var W,H,dpr,bg,bgc,pane,pc,mask,mc;
var FC=10,fcols,frows,hum,base;
var OC=5,ocols,orows,occ;
var CC=12,ccols,crows,cov,covTotal;
var tips=[],frame=0,coverage=0,tStart=0,sunAng=0;
var clearQ=[],queued,drops=[];
var fog={on:false,t0:0,outer:0,inner:0,max:0};
var word={state:0,str:'',letters:[],idx:0,next:0};
var WORDS=['milk','bread','suet','kettle','beans','sugar','coal','pegs','soap','lard','doris','eric','marjorie','tea','jam','yeast','rhubarb','string','paraffin','nellie'];
var ac=null,pressed=false,px=0,py=0,lastTap=0,haveP=false;

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function mkNoise(gw,gh){
  var g=new Float32Array(gw*gh),i;
  for(i=0;i<g.length;i++)g[i]=Math.random();
  return function(u,v){
    var x=clamp(u,0,0.9999)*(gw-1),y=clamp(v,0,0.9999)*(gh-1);
    var x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
    fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
    var a=g[y0*gw+x0],b=g[y0*gw+x0+1],c=g[(y0+1)*gw+x0],d=g[(y0+1)*gw+x0+1];
    return (a+(b-a)*fx)+((c+(d-c)*fx)-(a+(b-a)*fx))*fy;
  };
}

/* ---------- the garden, the putty, the two scratches ---------- */
function buildBG(){
  bg=document.createElement('canvas');
  bg.width=Math.round(W*dpr); bg.height=Math.round(H*dpr);
  bgc=bg.getContext('2d');
  bgc.setTransform(dpr,0,0,dpr,0,0);
  var sky=bgc.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#25546a'); sky.addColorStop(0.42,'#1a3c4c');
  sky.addColorStop(0.68,'#16323f'); sky.addColorStop(1,'#122a35');
  bgc.fillStyle=sky; bgc.fillRect(0,0,W,H);

  bgc.save(); bgc.filter='blur(3px)';
  /* frozen ground, low sun on it */
  var gr=bgc.createLinearGradient(0,H*0.70,0,H);
  gr.addColorStop(0,'#3d6c7c'); gr.addColorStop(1,'#20444f');
  bgc.fillStyle=gr; bgc.beginPath();
  bgc.moveTo(0,H*0.74);
  for(var gx=0;gx<=W;gx+=40)bgc.lineTo(gx,H*0.74+Math.sin(gx*0.011)*5);
  bgc.lineTo(W,H); bgc.lineTo(0,H); bgc.closePath(); bgc.fill();
  /* fence */
  bgc.fillStyle='#0d2029';
  for(var fx=-10;fx<W+20;fx+=17){bgc.fillRect(fx,H*0.60,9,H*0.16);}
  bgc.fillRect(0,H*0.635,W,4); bgc.fillRect(0,H*0.712,W,4);
  /* shed */
  bgc.fillStyle='#0b1b23';
  bgc.beginPath();bgc.moveTo(W*0.70,H*0.60);bgc.lineTo(W*0.84,H*0.51);
  bgc.lineTo(W*0.99,H*0.60);bgc.lineTo(W*0.99,H*0.75);bgc.lineTo(W*0.70,H*0.75);
  bgc.closePath();bgc.fill();
  /* bare tree */
  (function(){
    bgc.strokeStyle='#0a1a22'; bgc.lineCap='round';
    function limb(x,y,a,len,w,d){
      if(d>6||len<3)return;
      var nx=x+Math.cos(a)*len, ny=y+Math.sin(a)*len;
      bgc.lineWidth=w; bgc.beginPath();bgc.moveTo(x,y);bgc.lineTo(nx,ny);bgc.stroke();
      limb(nx,ny,a-0.34-Math.random()*0.22,len*0.74,w*0.66,d+1);
      limb(nx,ny,a+0.31+Math.random()*0.22,len*0.71,w*0.66,d+1);
    }
    var bx=W*0.20,by=H*0.76;
    limb(bx,by,-Math.PI/2,Math.min(H*0.13,72),Math.min(11,W*0.012),0);
  })();
  bgc.restore();

  /* corners going near-black */
  var vg=bgc.createRadialGradient(W*0.5,H*0.44,Math.min(W,H)*0.10,W*0.5,H*0.5,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(6,16,21,0)'); vg.addColorStop(0.55,'rgba(6,16,21,0.45)');
  vg.addColorStop(1,'rgba(4,11,15,0.97)');
  bgc.fillStyle=vg; bgc.fillRect(0,0,W,H);

  /* two fixed hairline scratches in the glass */
  bgc.strokeStyle='rgba(196,224,236,0.20)'; bgc.lineWidth=0.9;
  bgc.beginPath(); bgc.moveTo(W*0.215,H*0.10);
  bgc.quadraticCurveTo(W*0.30,H*0.30,W*0.40,H*0.58); bgc.stroke();
  bgc.beginPath(); bgc.moveTo(W*0.72,H*0.86);
  bgc.quadraticCurveTo(W*0.79,H*0.60,W*0.815,H*0.34); bgc.stroke();

  /* putty + frame */
  bgc.fillStyle='#1a262c';
  bgc.fillRect(0,0,W,P); bgc.fillRect(0,H-P,W,P);
  bgc.fillRect(0,0,P,H); bgc.fillRect(W-P,0,P,H);
  bgc.fillStyle='rgba(240,196,106,0.16)';
  bgc.fillRect(0,P-1.5,W,1.5); bgc.fillRect(P-1.5,0,1.5,H);
  bgc.fillStyle='rgba(0,0,0,0.45)';
  bgc.fillRect(0,H-P,W,1.5); bgc.fillRect(W-P,0,1.5,H);
}

/* ---------- fields ---------- */
function buildFields(){
  fcols=Math.ceil(W/FC)+1; frows=Math.ceil(H/FC)+1;
  hum=new Float32Array(fcols*frows); base=new Float32Array(fcols*frows);
  ocols=Math.ceil(W/OC)+1; orows=Math.ceil(H/OC)+1;
  occ=new Uint8Array(ocols*orows);
  ccols=Math.ceil(W/CC)+1; crows=Math.ceil(H/CC)+1;
  cov=new Uint8Array(ccols*crows);
  queued=new Uint8Array(fcols*frows);
  covTotal=0;
  var cx,cy;
  for(cy=0;cy<crows;cy++)for(cx=0;cx<ccols;cx++){
    var X=cx*CC,Y=cy*CC;
    if(X>P&&X<W-P&&Y>P&&Y<H-P)covTotal++;
  }
  var n1=mkNoise(6,5),n2=mkNoise(13,10),n3=mkNoise(3,3);
  var ga=Math.random()*Math.PI*2,gx=Math.cos(ga),gy=Math.sin(ga);
  for(var y=0;y<frows;y++)for(var x=0;x<fcols;x++){
    var u=x/(fcols-1),v=y/(frows-1);
    var grad=0.5+0.5*((u-0.5)*gx+(v-0.5)*gy)*1.9;
    var val=0.22+0.62*clamp(grad,0,1)+0.40*(n1(u,v)-0.5)+0.20*(n2(u,v)-0.5)+0.14*(n3(u,v)-0.5);
    base[y*fcols+x]=clamp(val,0.06,1.18);
    hum[y*fcols+x]=base[y*fcols+x];
  }
}
function getH(x,y){
  var i=(y*(1/FC))|0, j=(x*(1/FC))|0;
  if(j<0||i<0||j>=fcols||i>=frows)return 0;
  return hum[i*fcols+j];
}
function eat(x,y,w){
  var i=(y/FC)|0,j=(x/FC)|0,amt=0.055+0.035*w,di,dj;
  for(di=-1;di<=1;di++)for(dj=-1;dj<=1;dj++){
    var ii=i+di,jj=j+dj;
    if(ii<0||jj<0||ii>=frows||jj>=fcols)continue;
    var k=ii*fcols+jj, f=(di||dj)?0.42:1;
    hum[k]=Math.max(0,hum[k]-amt*f);
  }
}
var tmpH=null;
function diffuse(){
  if(!tmpH||tmpH.length!==hum.length)tmpH=new Float32Array(hum.length);
  var k=0.15,r=0.0034,i,j,idx;
  for(i=1;i<frows-1;i++)for(j=1;j<fcols-1;j++){
    idx=i*fcols+j;
    var s=(hum[idx-1]+hum[idx+1]+hum[idx-fcols]+hum[idx+fcols])*0.25;
    tmpH[idx]=hum[idx]+(s-hum[idx])*k+(base[idx]-hum[idx])*r;
  }
  for(i=1;i<frows-1;i++)for(j=1;j<fcols-1;j++){idx=i*fcols+j;hum[idx]=tmpH[idx];}
}
function markOcc(x,y,r){
  var i0=Math.max(0,((y-r)/OC)|0), i1=Math.min(orows-1,((y+r)/OC)|0);
  var j0=Math.max(0,((x-r)/OC)|0), j1=Math.min(ocols-1,((x+r)/OC)|0);
  for(var i=i0;i<=i1;i++)for(var j=j0;j<=j1;j++)occ[i*ocols+j]=1;
  var ci=(y/CC)|0,cj=(x/CC)|0;
  if(ci>=0&&cj>=0&&ci<crows&&cj<ccols)cov[ci*ccols+cj]=1;
}
function isOcc(x,y){
  var i=(y/OC)|0,j=(x/OC)|0;
  if(i<0||j<0||i>=orows||j>=ocols)return true;
  return occ[i*ocols+j]===1;
}
function measureCoverage(){
  var c=0;
  for(var i=0;i<cov.length;i++)if(cov[i])c++;
  coverage=covTotal?c/covTotal:0;
}

/* ---------- tips ---------- */
function spawn(x,y,rot,d,o){
  if(tips.length>=MAXT)return;
  o=o||{};
  tips.push({x:x,y:y,rot:rot,d:d,w:o.w||0.7,ws:o.ws||1,sr:o.sr||1,
    fine:!!o.fine,life:0,maxLife:o.maxLife||(70+Math.random()*150),
    st:2+((Math.random()*7)|0),side:Math.random()<0.5?1:-1,dead:false});
}
function drawSeg(x0,y0,x1,y1,w,h,ang){
  var t=clamp((w-1.1)/3.2,0,1);
  pc.lineCap='round'; pc.lineWidth=Math.max(0.5,w);
  if(t<0.02){pc.strokeStyle='rgba(169,202,221,'+(0.34+0.42*h).toFixed(3)+')';}
  else{
    var R=(169+(242-169)*t)|0,G=(202+(247-202)*t)|0,B=(221+(250-221)*t)|0;
    pc.strokeStyle='rgba('+R+','+G+','+B+','+(0.62+0.34*t).toFixed(3)+')';
  }
  pc.beginPath();pc.moveTo(x0,y0);pc.lineTo(x1,y1);pc.stroke();
  if(w>2.5&&Math.random()<0.55){ /* feathering on the fat blades */
    var bl=w*1.25;
    pc.lineWidth=Math.max(0.5,w*0.32);
    for(var s=-1;s<=1;s+=2){
      var a=ang+s*ANG60;
      pc.beginPath();pc.moveTo(x1,y1);
      pc.lineTo(x1+Math.cos(a)*bl,y1+Math.sin(a)*bl);pc.stroke();
    }
  }
  if(w>1.55){ /* hard winter-gold on ridges facing the sun */
    var align=Math.abs(Math.cos(ang-sunAng));
    if(align<0.42){
      var pa=ang-Math.PI/2, off=w*0.36;
      if(Math.cos(pa-sunAng)<0){pa+=Math.PI;}
      var ox=Math.cos(pa)*off,oy=Math.sin(pa)*off;
      pc.lineWidth=Math.min(1.15,w*0.30);
      pc.strokeStyle='rgba(240,196,106,'+(0.30+0.42*(1-align/0.42)).toFixed(3)+')';
      pc.beginPath();pc.moveTo(x0+ox,y0+oy);pc.lineTo(x1+ox,y1+oy);pc.stroke();
    }
  }
}
function stepTip(t){
  var ang=t.rot+t.d*ANG60, ca=Math.cos(ang), sa=Math.sin(ang);
  var h=getH(t.x,t.y);
  if(h<(t.fine?0.055:0.10)){t.dead=true;return;}
  var sp=(0.85+h*2.0)*(t.fine?0.72:1);
  var lx=t.x+ca*sp*2.6, ly=t.y+sa*sp*2.6;
  if(lx<P+1||lx>W-P-1||ly<P+1||ly>H-P-1){t.dead=true;return;}
  if(isOcc(lx,ly)){
    if(Math.random()<0.55){t.d=(t.d+(Math.random()<0.5?1:5))%6;return;}
    t.dead=true;return;
  }
  var tw=((t.fine?0.34:0.66)+h*(t.fine?2.1:4.1))*t.ws;
  t.w+=(tw-t.w)*0.20;
  var nx=t.x+ca*sp, ny=t.y+sa*sp;
  drawSeg(t.x,t.y,nx,ny,t.w,h,ang);
  markOcc(t.x,t.y,Math.min(2.3,Math.max(1.1,t.w*0.6)));
  eat(nx,ny,t.w);
  t.x=nx;t.y=ny;t.life++;
  if(t.life>t.maxLife){t.dead=true;}
  if(--t.st<=0){
    t.side=-t.side;
    spawn(t.x,t.y,t.rot,(t.d+(t.side>0?1:5))%6,
      {w:t.w*0.5,ws:t.ws*0.76,sr:t.sr,fine:t.fine,maxLife:t.maxLife*0.45});
    t.st=Math.max(2,Math.round((3+(1-clamp(h,0,1))*15)*t.sr));
  }
  if(Math.random()<0.005*h){
    spawn(t.x,t.y,t.rot,(t.d+1)%6,{w:t.w*0.8,ws:t.ws*0.9,sr:t.sr,fine:t.fine,maxLife:t.maxLife*0.65});
    t.d=(t.d+5)%6;
  }
}

/* ---------- nucleation: corners, putty line, scratches ---------- */
function seed(){
  var i,a;
  var corners=[[P+7,P+7,0.78],[W-P-7,P+7,2.36],[P+7,H-P-7,-0.78],[W-P-7,H-P-7,-2.36]];
  for(i=0;i<corners.length;i++)for(var k=0;k<6;k++){
    a=corners[i][2]+(Math.random()-0.5)*1.5;
    spawn(corners[i][0],corners[i][1],a,0,{maxLife:180+Math.random()*180});
  }
  for(var x=P+18;x<W-P;x+=46+Math.random()*26){
    spawn(x,P+2,Math.PI/2+(Math.random()-0.5)*1.1,0,{maxLife:110+Math.random()*160});
    spawn(x,H-P-2,-Math.PI/2+(Math.random()-0.5)*1.1,0,{maxLife:110+Math.random()*160});
  }
  for(var y=P+18;y<H-P;y+=46+Math.random()*26){
    spawn(P+2,y,(Math.random()-0.5)*1.1,0,{maxLife:110+Math.random()*160});
    spawn(W-P-2,y,Math.PI+(Math.random()-0.5)*1.1,0,{maxLife:110+Math.random()*160});
  }
  var sc=[[0.215,0.10,0.40,0.58],[0.72,0.86,0.815,0.34]];
  for(i=0;i<sc.length;i++){
    var x0=sc[i][0]*W,y0=sc[i][1]*H,x1=sc[i][2]*W,y1=sc[i][3]*H;
    var la=Math.atan2(y1-y0,x1-x0);
    for(var s=0;s<9;s++){
      var u=s/8, sx=x0+(x1-x0)*u, sy=y0+(y1-y0)*u;
      spawn(sx,sy,la+Math.PI/2+(Math.random()-0.5)*0.5,0,{maxLife:150+Math.random()*200});
      spawn(sx,sy,la-Math.PI/2+(Math.random()-0.5)*0.5,0,{maxLife:150+Math.random()*200});
    }
  }
}
function reseedFromEdges(n){
  var made=0,guard=0;
  while(made<n&&guard<420){
    guard++;
    var x=P+4+Math.random()*(W-2*P-8), y=P+4+Math.random()*(H-2*P-8);
    if(!isOcc(x,y))continue;
    var a=Math.random()*Math.PI*2, tx=x+Math.cos(a)*13, ty=y+Math.sin(a)*13;
    if(tx<P+2||tx>W-P-2||ty<P+2||ty>H-P-2)continue;
    if(isOcc(tx,ty))continue;
    spawn(x,y,a,0,{maxLife:70+Math.random()*140});
    made++;
  }
}

/* ---------- fingertip ---------- */
function blitBG(x,y,r){
  pc.save();
  pc.beginPath();pc.arc(x,y,r,0,6.2832);pc.clip();
  pc.setTransform(1,0,0,1,0,0);
  pc.drawImage(bg,0,0);
  pc.restore();
  pc.setTransform(dpr,0,0,dpr,0,0);
}
function clearCells(x,y,r,delay){
  var i0=Math.max(0,((y-r)/OC)|0),i1=Math.min(orows-1,((y+r)/OC)|0);
  var j0=Math.max(0,((x-r)/OC)|0),j1=Math.min(ocols-1,((x+r)/OC)|0);
  var i,j;
  for(i=i0;i<=i1;i++)for(j=j0;j<=j1;j++)occ[i*ocols+j]=0;
  var ci0=Math.max(0,((y-r)/CC)|0),ci1=Math.min(crows-1,((y+r)/CC)|0);
  var cj0=Math.max(0,((x-r)/CC)|0),cj1=Math.min(ccols-1,((x+r)/CC)|0);
  for(i=ci0;i<=ci1;i++)for(j=cj0;j<=cj1;j++)cov[i*ccols+j]=0;
  var fi0=Math.max(0,((y-r)/FC)|0),fi1=Math.min(frows-1,((y+r)/FC)|0);
  var fj0=Math.max(0,((x-r)/FC)|0),fj1=Math.min(fcols-1,((x+r)/FC)|0);
  var now=performance.now();
  for(i=fi0;i<=fi1;i++)for(j=fj0;j<=fj1;j++){
    var k=i*fcols+j;
    hum[k]=Math.min(1.45,hum[k]+0.55);
    if(!queued[k]&&clearQ.length<5000){queued[k]=1;clearQ.push({k:k,t:now+delay,n:0});}
  }
}
function melt(x,y){
  var r=25;
  blitBG(x,y,r);
  pc.lineWidth=1.25;
  pc.strokeStyle='rgba(240,196,106,0.55)';
  pc.beginPath();pc.arc(x,y,r-0.9,0,6.2832);pc.stroke();
  pc.strokeStyle='rgba(240,196,106,0.22)';
  pc.beginPath();pc.arc(x,y+2,r-4,0.5,2.3);pc.stroke();
  for(var i=tips.length-1;i>=0;i--){
    var t=tips[i];
    if((t.x-x)*(t.x-x)+(t.y-y)*(t.y-y)<r*r)t.dead=true;
  }
  clearCells(x,y,r,950);
  if(drops.length<48&&Math.random()<0.5){
    drops.push({x:x+(Math.random()-0.5)*r*0.8,y:y+r*0.3,r:1.4+Math.random()*2.4,
      vy:0.10+Math.random()*0.22,life:0});
  }
}
function stepDrops(){
  for(var i=drops.length-1;i>=0;i--){
    var d=drops[i]; d.life++;
    d.y+=d.vy; d.vy*=1.006;
    if(d.life>150||d.y>H-P-2){drops.splice(i,1);continue;}
    if(d.life%2)continue;
    blitBG(d.x,d.y,d.r);
    pc.lineWidth=0.8;
    pc.strokeStyle='rgba(240,196,106,0.40)';
    pc.beginPath();pc.arc(d.x,d.y,d.r,3.5,5.6);pc.stroke();
    clearCells(d.x,d.y,d.r+1,1500);
  }
}
function recolonise(){
  var now=performance.now(),done=0,tries=0;
  while(clearQ.length&&done<4&&tries<40){
    tries++;
    var e=clearQ[0];
    if(e.t>now)break;
    clearQ.shift();
    var i=(e.k/fcols)|0, j=e.k-i*fcols;
    var x=j*FC+FC*0.5, y=i*FC+FC*0.5;
    if(x<P+2||x>W-P-2||y<P+2||y>H-P-2){queued[e.k]=0;continue;}
    if(isOcc(x,y)){queued[e.k]=0;continue;}
    var found=-1;
    for(var a=0;a<8;a++){
      var ang=a*Math.PI/4, sx=x+Math.cos(ang)*FC*1.3, sy=y+Math.sin(ang)*FC*1.3;
      if(sx<P||sx>W-P||sy<P||sy>H-P)continue;
      if(isOcc(sx,sy)){found=ang;break;}
    }
    if(found<0){
      e.n++;
      if(e.n<14){e.t=now+420;clearQ.push(e);}else{queued[e.k]=0;}
      continue;
    }
    queued[e.k]=0;
    var out=found+Math.PI+(Math.random()-0.5)*0.55;
    spawn(x+Math.cos(found)*FC*0.9,y+Math.sin(found)*FC*0.9,out,0,
      {fine:true,ws:0.58,sr:0.45,w:0.4,maxLife:40+Math.random()*80});
    done++;
  }
}

/* ---------- breath ---------- */
function shimmer(){
  try{
    if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();}
    if(ac.state==='suspended')ac.resume();
    var t=ac.currentTime, g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.030,t+0.014);
    g.gain.exponentialRampToValueAtTime(0.00008,t+1.7);
    g.connect(ac.destination);
    var fs=[3137,4699,6271],gs=[1,0.45,0.18];
    for(var i=0;i<3;i++){
      var o=ac.createOscillator(),gg=ac.createGain();
      o.type='sine'; o.frequency.value=fs[i]*(1+(Math.random()-0.5)*0.004);
      gg.gain.value=gs[i]; o.connect(gg); gg.connect(g);
      o.start(t); o.stop(t+1.8);
    }
  }catch(err){}
}
function breathe(){
  if(fog.on)return;
  fog.on=true; fog.t0=performance.now();
  fog.max=Math.sqrt(W*W+H*H)*0.60; fog.outer=0; fog.inner=0;
  var cx=W*0.5,cy=H*0.5;
  for(var i=0;i<frows;i++)for(var j=0;j<fcols;j++){
    var dx=j*FC-cx,dy=i*FC-cy,d=Math.sqrt(dx*dx+dy*dy)/fog.max;
    if(d<1.05){
      var k=i*fcols+j;
      hum[k]=Math.min(1.5,hum[k]+0.72*(1-d*0.72));
      base[k]=Math.min(1.25,base[k]+0.16*(1-d*0.7));
    }
  }
  shimmer();
}
function fogStep(){
  if(!fog.on)return;
  var e=performance.now()-fog.t0;
  var grow=900, hold=700, clear=5200;
  if(e<grow){fog.outer=fog.max*(e/grow);fog.inner=0;}
  else if(e<grow+hold){fog.outer=fog.max;fog.inner=0;}
  else{
    fog.outer=fog.max;
    var u=(e-grow-hold)/clear;
    fog.inner=fog.max*Math.min(1,u*u*0.35+u*0.72);
    if(u>=1){fog.on=false;fog.inner=0;fog.outer=0;return;}
    /* the retreating edge lays a new, finer generation */
    var cx=W*0.5,cy=H*0.5;
    for(var s=0;s<2;s++){
      var a=Math.random()*Math.PI*2, r=fog.inner*(0.96+Math.random()*0.06);
      var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      if(x<P+3||x>W-P-3||y<P+3||y>H-P-3)continue;
      if(isOcc(x,y))continue;
      spawn(x,y,a+(Math.random()-0.5)*1.0,0,{fine:true,ws:0.62,sr:0.42,w:0.4,maxLife:60+Math.random()*120});
    }
  }
}
function fogDraw(){
  if(!fog.on||fog.outer<1)return;
  var cx=W*0.5,cy=H*0.5,a=0.50;
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,fog.outer);
  var stops=[];
  if(fog.inner>1){
    var i0=clamp(fog.inner/fog.outer,0,0.97);
    stops.push([0,0]);
    stops.push([Math.max(0.001,i0-0.03),0]);
    stops.push([Math.min(0.985,i0+0.035),a]);
  }else{stops.push([0,a]);}
  var last=stops[stops.length-1][0];
  stops.push([Math.max(last+0.001,0.90),a]);
  stops.push([1,0]);
  var prev=-1;
  for(var i=0;i<stops.length;i++){
    var o=clamp(stops[i][0],0,1);
    if(o<=prev)o=Math.min(1,prev+0.0005);
    prev=o;
    g.addColorStop(o,'rgba(228,241,247,'+stops[i][1]+')');
  }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ---------- somebody's finger, one word ---------- */
function layoutWord(){
  word.str=WORDS[(Math.random()*WORDS.length)|0];
  var size=clamp(Math.min(W,H)*0.155,44,112);
  var font;
  for(var pass=0;pass<8;pass++){
    font='italic 600 '+size+'px Georgia,"Times New Roman",serif';
    pc.font=font;
    var wsum=0,ci;
    for(ci=0;ci<word.str.length;ci++)wsum+=pc.measureText(word.str[ci]).width*1.03;
    if(wsum<(W-2*P)*0.80)break;
    size*=0.86;
  }
  pc.font=font;
  var total=0,i;
  for(i=0;i<word.str.length;i++)total+=pc.measureText(word.str[i]).width*1.03;
  var rot=(Math.random()*0.11-0.055);
  var x=(W-total)*0.5+(Math.random()-0.5)*W*0.06;
  var y=H*(0.36+Math.random()*0.28);
  word.letters=[];
  for(i=0;i<word.str.length;i++){
    var ch=word.str[i], w=pc.measureText(ch).width*1.03;
    word.letters.push({ch:ch,x:x,y:y+Math.sin(i*1.7)*size*0.045+(Math.random()-0.5)*size*0.06,
      rot:rot+(Math.random()-0.5)*0.10,font:font,size:size,w:w});
    x+=w+(Math.random()-0.5)*size*0.03;
    y+=(Math.random()-0.5)*size*0.035;
  }
}
function drawLetter(L){
  mc.setTransform(dpr,0,0,dpr,0,0);
  mc.clearRect(0,0,W,H);
  mc.save();
  mc.translate(L.x,L.y); mc.rotate(L.rot);
  mc.font=L.font; mc.textAlign='left'; mc.textBaseline='alphabetic';
  mc.lineJoin='round'; mc.lineCap='round';
  mc.lineWidth=L.size*0.115; mc.strokeStyle='#fff'; mc.fillStyle='#fff';
  var j;
  for(j=0;j<3;j++){
    var ox=(Math.random()-0.5)*1.6, oy=(Math.random()-0.5)*1.6;
    mc.strokeText(L.ch,ox,oy); mc.fillText(L.ch,ox,oy);
  }
  mc.restore();
  mc.globalCompositeOperation='source-in';
  mc.setTransform(1,0,0,1,0,0);
  mc.drawImage(bg,0,0);
  mc.globalCompositeOperation='source-over';

  pc.setTransform(1,0,0,1,0,0);
  pc.drawImage(mask,0,0);
  pc.setTransform(dpr,0,0,dpr,0,0);

  pc.save();
  pc.translate(L.x,L.y); pc.rotate(L.rot);
  pc.font=L.font; pc.textAlign='left'; pc.textBaseline='alphabetic';
  pc.lineJoin='round'; pc.lineWidth=L.size*0.125;
  pc.strokeStyle='rgba(240,196,106,0.42)';
  pc.strokeText(L.ch,0.6,0.4);
  pc.lineWidth=L.size*0.10;
  pc.strokeStyle='rgba(240,196,106,0.20)';
  pc.strokeText(L.ch,-0.8,-0.6);
  pc.restore();

  /* the cleared shape itself, so it can be re-taken from its edges */
  try{
    var pad=L.size*0.35;
    var bx=Math.max(0,L.x-pad), by=Math.max(0,L.y-L.size-pad);
    var bw=Math.min(W-bx,L.w+pad*2), bh=Math.min(H-by,L.size*1.5+pad*2);
    var img=mc.getImageData(Math.round(bx*dpr),Math.round(by*dpr),
      Math.max(1,Math.round(bw*dpr)),Math.max(1,Math.round(bh*dpr)));
    var d=img.data, iw=img.width, ih=img.height;
    var now=performance.now();
    for(var yy=by;yy<by+bh;yy+=OC)for(var xx=bx;xx<bx+bw;xx+=OC){
      var sx=Math.round((xx-bx)*dpr), sy=Math.round((yy-by)*dpr);
      if(sx<0||sy<0||sx>=iw||sy>=ih)continue;
      if(d[(sy*iw+sx)*4+3]<110)continue;
      var oi=(yy/OC)|0,oj=(xx/OC)|0;
      if(oi>=0&&oj>=0&&oi<orows&&oj<ocols)occ[oi*ocols+oj]=0;
      var ci=(yy/CC)|0,cj=(xx/CC)|0;
      if(ci>=0&&cj>=0&&ci<crows&&cj<ccols)cov[ci*ccols+cj]=0;
      var fi=(yy/FC)|0,fj=(xx/FC)|0;
      if(fi>=0&&fj>=0&&fi<frows&&fj<fcols){
        var k=fi*fcols+fj;
        hum[k]=Math.min(1.4,hum[k]+0.5);
        if(!queued[k]&&clearQ.length<5000){queued[k]=1;clearQ.push({k:k,t:now+7000+Math.random()*3000,n:0});}
      }
    }
  }catch(err){}
  for(var i=tips.length-1;i>=0;i--){
    var t=tips[i];
    if(t.x>L.x-L.size*0.3&&t.x<L.x+L.w+L.size*0.3&&t.y>L.y-L.size*1.2&&t.y<L.y+L.size*0.4)t.dead=true;
  }
}
function wordStep(){
  var now=performance.now();
  if(word.state===0){
    if(coverage>=0.88||(now-tStart>170000&&coverage>0.70)){
      layoutWord(); word.state=1; word.idx=0; word.next=now+1400;
    }
    return;
  }
  if(word.state===1&&now>=word.next){
    drawLetter(word.letters[word.idx]);
    word.idx++;
    word.next=now+190+Math.random()*260;
    if(word.idx>=word.letters.length)word.state=2;
  }
}

/* ---------- loop ---------- */
function growStep(){
  var i;
  for(i=0;i<tips.length;i++)if(!tips[i].dead)stepTip(tips[i]);
  if(tips.length>MAXT*0.9||frame%3===0){
    var alive=[];
    for(i=0;i<tips.length;i++)if(!tips[i].dead)alive.push(tips[i]);
    tips=alive;
  }
}
function frameLoop(){
  frame++;
  sunAng+=0.000055;
  var iters=tips.length<70?2:1;
  for(var q=0;q<iters;q++)growStep();
  if(frame%2===0)diffuse();
  stepDrops();
  recolonise();
  fogStep();
  if(frame%20===0){
    measureCoverage();
    if(tips.length<26&&coverage<0.985)reseedFromEdges(coverage<0.9?18:8);
  }
  wordStep();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(pane,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fogDraw();
  if(haveP&&!('ontouchstart' in window)){
    ctx.lineWidth=1;
    ctx.strokeStyle=pressed?'rgba(240,196,106,0.55)':'rgba(240,196,106,0.22)';
    ctx.beginPath();ctx.arc(px,py,pressed?25:13,0,6.2832);ctx.stroke();
    if(pressed){
      ctx.strokeStyle='rgba(240,196,106,0.16)';
      ctx.beginPath();ctx.arc(px,py,31,0,6.2832);ctx.stroke();
    }
  }
  requestAnimationFrame(frameLoop);
}

/* ---------- init ---------- */
function init(){
  W=Math.max(240,window.innerWidth); H=Math.max(240,window.innerHeight);
  dpr=Math.min(window.devicePixelRatio||1,1.75);
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildBG();
  pane=document.createElement('canvas');
  pane.width=bg.width; pane.height=bg.height;
  pc=pane.getContext('2d'); pc.setTransform(dpr,0,0,dpr,0,0);
  pc.setTransform(1,0,0,1,0,0); pc.drawImage(bg,0,0); pc.setTransform(dpr,0,0,dpr,0,0);
  mask=document.createElement('canvas');
  mask.width=bg.width; mask.height=bg.height;
  mc=mask.getContext('2d',{willReadFrequently:true});
  mc.setTransform(dpr,0,0,dpr,0,0);
  buildFields();
  tips=[]; drops=[]; clearQ=[]; frame=0; coverage=0;
  word={state:0,str:'',letters:[],idx:0,next:0};
  fog.on=false;
  sunAng=-0.62+Math.random()*0.35;
  seed();
  /* the pane is already well on its way by the time you get here */
  var t0=performance.now(),guard=0;
  while(guard<4200&&performance.now()-t0<620){
    growStep();
    if(guard%3===0)diffuse();
    if(guard%25===0){
      measureCoverage();
      if(coverage>0.70)break;
      if(tips.length<26)reseedFromEdges(16);
    }
    guard++;
  }
  measureCoverage();
  tStart=performance.now();
}
init();
requestAnimationFrame(frameLoop);

/* ---------- hands and breath ---------- */
function pos(e){
  var r=cvs.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
cvs.addEventListener('pointerdown',function(e){
  haveP=true;pressed=true;var p=pos(e);px=p.x;py=p.y;melt(px,py);
  if(cvs.setPointerCapture){try{cvs.setPointerCapture(e.pointerId);}catch(err){}}
  var now=performance.now();
  if(e.pointerType==='touch'){
    if(now-lastTap<330)breathe();
    lastTap=now;
  }
  e.preventDefault();
},{passive:false});
cvs.addEventListener('pointermove',function(e){
  haveP=true;var p=pos(e);
  if(pressed){
    var dx=p.x-px,dy=p.y-py,d=Math.sqrt(dx*dx+dy*dy),st=Math.max(1,Math.ceil(d/9));
    for(var i=1;i<=st;i++)melt(px+dx*i/st,py+dy*i/st);
  }
  px=p.x;py=p.y;
},{passive:true});
window.addEventListener('pointerup',function(){pressed=false;});
window.addEventListener('pointercancel',function(){pressed=false;});
cvs.addEventListener('pointerleave',function(){haveP=false;pressed=false;});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){e.preventDefault();breathe();}
});
var rz;
window.addEventListener('resize',function(){
  clearTimeout(rz);
  rz=setTimeout(function(){init();},320);
});
try{
  console.log('%cvapour field '+fcols+'\u00d7'+frows+' \u00b7 six directions, obligatorily \u00b7 the fat side is winning',
    'color:#a9cadd;font:12px Georgia,serif');
}catch(err){}
})();
</script>
