  <meta name="outbox-spec-subject" content="The plain, honest little physics of scooping goldfish on a wet paper hoop — why you slide the poi in edge-first and low so you don't push a bow-wave that spooks the whole tank, why you lift dead-smooth and steady instead of snatching (a jerk shears the softened paper clean through), why you take ONE fish and tip it off quick rather than greedily chasing a second and drowning your paper, how the washi goes from crisp to translucent-soggy over a handful of dips until it's paper-thin and one good tail-flick finishes it, and the plain knack of reading which fish has drifted lazy and slow enough to actually get under. Not a metaphor for patience or a fleeting summer or catching what you love before it slips away — literally rice paper, water, a darting fish, and how gently you have to lift.">

<title>One Fish, I Said One! — The Poi and the Tub</title>
<style>
  html,body{margin:0;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;touch-action:none;cursor:none;}
  #patter{position:fixed;top:14px;left:0;right:0;text-align:center;
    pointer-events:none;padding:0 18px;z-index:5;}
  #patter span{display:inline-block;color:#ffe9c2;font-weight:800;
    font-size:clamp(17px,4.3vw,30px);letter-spacing:.2px;line-height:1.15;
    text-shadow:0 2px 10px rgba(0,0,0,.75),0 0 22px rgba(242,181,68,.35);
    opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;
    max-width:820px;}
  #patter span.show{opacity:1;transform:translateY(0);}
  #hint{position:fixed;left:0;right:0;bottom:64px;text-align:center;pointer-events:none;
    color:#e8d7ad;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
    opacity:.85;transition:opacity 1s;z-index:5;text-shadow:0 1px 6px #000;}
  #hint.gone{opacity:0;}
  #lane{position:fixed;bottom:12px;left:14px;z-index:6;
    font-size:12px;font-style:italic;letter-spacing:.4px;}
  #lane a{color:#d9b877;text-decoration:none;opacity:.72;
    text-shadow:0 1px 4px #000;}
  #lane a:hover{opacity:1;text-decoration:underline;}

<body>
<canvas id="tub"></canvas>
<div id="patter"><span id="pline"></span></div>
<div id="hint">move to hover &nbsp;·&nbsp; press &amp; hold to dip &nbsp;·&nbsp; release to lift, smooth</div>
<div id="lane"><a href="/archive">more stalls down the lane &rarr;</a></div>

<!-- the fat black one is never once caught. do everything right; he goes anyway. -->
<script>
(function(){
"use strict";
const cv=document.getElementById('tub'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  poiR=Math.max(40,Math.min(72,Math.min(W,H)*0.095));
}
window.addEventListener('resize',resize);

// ---------- persistence ----------
function load(k,d){ try{const v=localStorage.getItem(k);return v===null?d:parseInt(v,10);}catch(e){return d;} }
function save(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
let total=load('gf_total',0);
let best=load('gf_best',0);
let run=0; // catches on current paper

// ---------- audio ----------
let AC=null;
function actx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function plip(){
  const a=actx(); if(!a)return;
  const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(880,t);
  o.frequency.exponentialRampToValueAtTime(1500,t+0.05);
  o.frequency.exponentialRampToValueAtTime(500,t+0.14);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.28,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.24);
}
function plop(){
  const a=actx(); if(!a)return; const t=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(300,t);
  o.frequency.exponentialRampToValueAtTime(90,t+0.13);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.32,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.22);
}
function tearSound(){
  const a=actx(); if(!a)return; const t=a.currentTime;
  const len=Math.floor(a.sampleRate*0.4);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const e=1-i/len; d[i]=(Math.random()*2-1)*e*e; }
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(2600,t);
  bp.frequency.exponentialRampToValueAtTime(500,t+0.35);
  bp.Q.value=0.8;
  const g=a.createGain(); g.gain.setValueAtTime(0.55,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t); src.stop(t+0.4);
}

// ---------- patter ----------
const pline=document.getElementById('pline');
let patterTimer=null;
function say(t,hold){
  pline.textContent=t; pline.classList.add('show');
  if(patterTimer)clearTimeout(patterTimer);
  patterTimer=setTimeout(()=>pline.classList.remove('show'), hold||2600);
}
const P={
  idle:["Come on, have a go! In from the SIDE now, low—",
        "Ehh, don't stand there — dip it! Wet paper waits for nobody!",
        "Pick your fish, pick a slow one, and slide under him easy—"],
  dip:["Easy... low and flat, that's it...","Under him now — slow, don't wave the tank—","Steady, steady, let him settle on it—"],
  catch:["THERE — see? That's a keeper, that's YOURS!",
         "Ha! Straight in the bowl — you've got the knack!",
         "Beautiful — one clean fish, smooth as you like!",
         "Chuh! Look at that — tipped him right in!"],
  tearGreedy:["Ahh, greedy! One fish, I said ONE!",
              "Two at once?! You'll drown the paper every time!",
              "No no no — one! You chase the second and lose the lot!"],
  tearSnatch:["Too quick! SMOOTH, smooth — you sheared it clean through!",
              "Ai! Don't snatch it — wet washi tears like nothing!",
              "Whoa, gentle! A jerk like that rips it every time!"],
  tearSoggy:["That paper's soaked through — see, thin as breath now!",
             "Ha, wet to nothing! One good flick and it's finished!",
             "Sodden, that one — was never lifting another fish!"],
  demekin:["Ohh — SO close! Slippery fat fellow, that black one—",
           "Ha! Off the edge again — heavy old thing, isn't he!",
           "Aaah, he slid right off! Every time, that one, every time!",
           "You had him! You HAD him — and — plop! Off he goes!"],
  empty:["Nothing on it — wait for a lazy one to drift over.",
         "Empty paper! Read the tank — take the slow drifter.",
         "Ha, all darted off — patience, let them come back round."],
  chase:["Ha! Clean across the tub — let him settle, he'll come round!",
         "You'll never chase a darter! Wait him out!"]
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}

// ---------- fish ----------
let fish=[], carried=[];
const HUES=['#e8532b','#f2652f','#e0471f','#f07a34','#d94a24'];
function rnd(a,b){return a+Math.random()*(b-a);}
function makeFish(dem){
  const m=60;
  return {
    x:rnd(m,W-m), y:rnd(m,H-m),
    vx:rnd(-1,1), vy:rnd(-1,1),
    demekin:!!dem,
    size:dem?rnd(17,19):rnd(11,15),
    hue:dem?'#161616':HUES[Math.floor(Math.random()*HUES.length)],
    phase:Math.random()*7,
    scare:0
  };
}
function initFish(){
  fish=[]; carried=[];
  const n=12;
  for(let i=0;i<n-1;i++) fish.push(makeFish(false));
  fish.push(makeFish(true)); // the one black demekin
}

// ---------- ripples ----------
let rings=[];
function addRing(x,y,r0,rmax,a){ rings.push({x,y,r:r0,rmax,a}); }

// ---------- poi ----------
let poiR=60;
let poi={x:0,y:0, tx:0,ty:0, has:false};
let state='up';        // up | dipping | down | lifting
let poiZ=0;            // 0 up, 1 submerged
let integrity=1;       // 1 crisp -> 0 gone
let dipCharged=false;
let torn=0;            // ms remaining of torn visual
let liftP=0;           // lift animation progress
let liftOutcome=null;  // 'catch'|'tear'|'demekin'|'empty'
let liftCaught=[];     // fish being resolved
let demekinSlipDone=false;
let recentSpeed=0;
let started=false;

resize();
poi.x=poi.tx=W/2; poi.y=poi.ty=H/2;
initFish();
addRing(W/2,H/2,20,Math.max(W,H)*0.4,0.5); // freshly tipped in, water rocking

// ---------- input ----------
function getPos(e){
  const r=cv.getBoundingClientRect();
  const p=(e.touches&&e.touches[0])||e;
  return {x:p.clientX-r.left, y:p.clientY-r.top};
}
cv.addEventListener('pointerdown',e=>{
  actx(); poi.has=true;
  const p=getPos(e); poi.tx=p.x; poi.ty=p.y;
  if(state==='up'){ beginDip(); }
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const p=getPos(e);
  const dx=p.x-poi.tx, dy=p.y-poi.ty;
  const sp=Math.hypot(dx,dy);
  recentSpeed=recentSpeed*0.6+sp*0.4;
  poi.tx=p.x; poi.ty=p.y; poi.has=true;
},{passive:false});
function endPress(e){
  if(state==='dipping'||state==='down'){ beginLift(); }
}
cv.addEventListener('pointerup',endPress);
cv.addEventListener('pointercancel',endPress);
cv.addEventListener('pointerleave',()=>{ poi.has=false; });

function beginDip(){
  state='dipping'; dipCharged=false;
  say(pick(P.dip));
  document.getElementById('hint').classList.add('gone');
  // bow-wave: spook nearby fish (the whole point of dipping low & slow)
  addRing(poi.tx,poi.ty,poiR*0.5,poiR*3.2,0.55);
  for(const f of fish){
    const d=Math.hypot(f.x-poi.tx,f.y-poi.ty);
    const R=f.demekin?poiR*1.6:poiR*3.0;
    if(d<R){
      const k=(1-d/R);
      const nx=(f.x-poi.tx)/(d||1), ny=(f.y-poi.ty)/(d||1);
      const push=f.demekin?1.1:5.2;
      f.vx+=nx*push*k; f.vy+=ny*push*k;
      f.scare=Math.max(f.scare, f.demekin?0.25:1);
    }
  }
}
function beginLift(){
  state='lifting'; liftP=0; demekinSlipDone=false;
  // who is actually resting on the paper right now?
  const on=[];
  if(poiZ>0.65){
    for(const f of fish){
      const d=Math.hypot(f.x-poi.x,f.y-poi.y);
      if(d<poiR*0.82) on.push(f);
    }
  }
  const load=on.length;
  const snatch=recentSpeed;
  if(load===0){ liftOutcome='empty'; liftCaught=[]; say(pick(P.empty)); return; }

  // stress of the lift vs remaining paper strength
  const stress = load*0.20 + snatch*0.045 + (1-integrity)*0.25;
  const greedy = load>=2 && !(integrity>0.9 && snatch<3);
  const snatched = snatch>9 && integrity<0.92;
  const soggy = integrity<0.16;

  if(greedy || snatched || soggy || stress>integrity){
    liftOutcome='tear'; liftCaught=on.slice();
    tearSound(); torn=520; integrity=1;
    if(run>best){ best=run; save('gf_best',best); }
    run=0;
    if(greedy) say(pick(P.tearGreedy));
    else if(snatched) say(pick(P.tearSnatch));
    else say(pick(P.tearSoggy));
    // fish flip free
    for(const f of on){
      const ang=Math.random()*6.28;
      f.vx=Math.cos(ang)*4; f.vy=Math.sin(ang)*4; f.scare=1;
    }
    return;
  }

  // clean lift, one fish
  const f=on[0];
  if(f.demekin){
    liftOutcome='demekin'; liftCaught=[f];
    // he rides up perfect... and slips off at the very last instant.
    return;
  }
  // a keeper
  liftOutcome='catch'; liftCaught=[f];
  // carry it out of the tank
  const idx=fish.indexOf(f);
  if(idx>=0) fish.splice(idx,1);
  carried.push({f, x:poi.x, y:poi.y});
  total++; run++;
  save('gf_total',total);
  if(run>best){ best=run; save('gf_best',best); }
  plip();
  say(pick(P.catch));
  addRing(bowl.x, bowl.y, 6, 44, 0.6);
  // keep the tub stocked
  setTimeout(()=>{ if(fish.filter(x=>!x.demekin).length<11) fish.push(makeFish(false)); }, 1400);
}

// ---------- bowl ----------
let bowl={x:0,y:0,w:0,h:0};
function layoutBowl(){
  bowl.w=Math.min(232, W*0.5);
  bowl.h=54;
  bowl.x=W-bowl.w/2-14;
  bowl.y=H-bowl.h/2-16;
}

// ---------- update ----------
let last=performance.now();
function update(dt){
  // poi follow (a little weight)
  poi.x+=(poi.tx-poi.x)*Math.min(1,dt*14);
  poi.y+=(poi.ty-poi.y)*Math.min(1,dt*14);
  recentSpeed*=0.90;

  // poi state machine
  if(state==='dipping'){
    poiZ+=dt*4.2; if(poiZ>=1){ poiZ=1; state='down';
      if(!dipCharged){ integrity=Math.max(0,integrity-0.10); dipCharged=true; } }
  } else if(state==='down'){
    // wet paper weakens: just being wet, and worse with a wriggling fish on it
    integrity=Math.max(0, integrity-0.028*dt);
    let onCount=0;
    for(const f of fish){ if(Math.hypot(f.x-poi.x,f.y-poi.y)<poiR*0.82) onCount++; }
    integrity=Math.max(0, integrity-0.19*onCount*dt);
  } else if(state==='lifting'){
    poiZ=Math.max(0,poiZ-dt*3.0);
    liftP+=dt*2.1;
    if(liftOutcome==='demekin' && !demekinSlipDone && liftP>0.72){
      demekinSlipDone=true;
      const f=liftCaught[0];
      // slithers heavily off the edge and flops back
      f.x=poi.x+ (Math.random()<0.5?-1:1)*poiR*0.7;
      f.y=poi.y+poiR*0.5;
      f.vx=rnd(-1,1); f.vy=rnd(1.5,2.6);
      f.scare=0.3;
      plop(); addRing(f.x,f.y,6,poiR*1.4,0.5);
      say(pick(P.demekin));
    }
    if(liftP>=1){ state='up'; poiZ=0; liftOutcome=null; liftCaught=[]; }
  }
  if(torn>0) torn-=dt*1000;

  // fish AI
  const dipping = state==='dipping'||state==='down';
  for(const f of fish){
    let ax=0,ay=0;
    let cx=0,cy=0,ct=0, avx=0,avy=0, sx=0,sy=0;
    for(const g of fish){
      if(g===f) continue;
      const dx=g.x-f.x, dy=g.y-f.y; const d=Math.hypot(dx,dy);
      if(d<95){ cx+=g.x; cy+=g.y; avx+=g.vx; avy+=g.vy; ct++;
        if(d<34 && d>0){ sx-=dx/d; sy-=dy/d; } }
    }
    if(ct>0){
      cx/=ct; cy/=ct; ax+=(cx-f.x)*0.0009; ay+=(cy-f.y)*0.0009;
      avx/=ct; avy/=ct; ax+=(avx-f.vx)*0.03; ay+=(avy-f.vy)*0.03;
    }
    ax+=sx*0.06; ay+=sy*0.06;
    // wander
    f.phase+=dt*(f.demekin?1.2:3.4);
    ax+=Math.cos(f.phase*0.7+f.x*0.01)*(f.demekin?0.006:0.02);
    ay+=Math.sin(f.phase*0.6+f.y*0.01)*(f.demekin?0.006:0.02);
    // flee the poi when it's in the water
    if(dipping){
      const dx=f.x-poi.x, dy=f.y-poi.y; const d=Math.hypot(dx,dy)||1;
      const R=f.demekin?poiR*1.8:poiR*3.4;
      if(d<R){ const k=(1-d/R); const g=f.demekin?0.05:0.42;
        ax+=(dx/d)*g*k; ay+=(dy/d)*g*k; f.scare=Math.max(f.scare,(f.demekin?0.2:0.7)*k); }
    }
    // edges
    const m=44;
    if(f.x<m)ax+=0.05; if(f.x>W-m)ax-=0.05;
    if(f.y<m)ay+=0.05; if(f.y>H-m)ay-=0.05;

    f.vx+=ax; f.vy+=ay;
    // if resting on the paper (poi down), it settles
    if(state==='down' && Math.hypot(f.x-poi.x,f.y-poi.y)<poiR*0.82 && f.scare<0.2){
      f.vx*=0.72; f.vy*=0.72;
      f.vx+=(poi.x-f.x)*0.004; f.vy+=(poi.y-f.y)*0.004;
    }
    f.scare=Math.max(0,f.scare-dt*1.4);
    let base=f.demekin?0.55:1.35;
    let max=base*(1+f.scare*(f.demekin?1.2:2.4));
    const sp=Math.hypot(f.vx,f.vy);
    if(sp>max){ f.vx=f.vx/sp*max; f.vy=f.vy/sp*max; }
    const fr=f.demekin?0.985:0.99;
    f.vx*=fr; f.vy*=fr;
    f.x+=f.vx*dt*60; f.y+=f.vy*dt*60;
    if(f.x<8){f.x=8;f.vx*=-0.5;} if(f.x>W-8){f.x=W-8;f.vx*=-0.5;}
    if(f.y<8){f.y=8;f.vy*=-0.5;} if(f.y>H-8){f.y=H-8;f.vy*=-0.5;}
  }

  // rings
  for(const r of rings){ r.r+=dt*130; r.a*=Math.pow(0.25,dt); }
  rings=rings.filter(r=>r.a>0.02 && r.r<r.rmax);

  // carried out to the bowl
  for(const c of carried){
    c.x+=(bowl.x-c.x)*Math.min(1,dt*3.5);
    c.y+=(bowl.y-c.y)*Math.min(1,dt*3.5);
  }
  if(carried.length){
    carried=carried.filter(c=>Math.hypot(c.x-bowl.x,c.y-bowl.y)>10 || liftP<0.9);
  }
}

// ---------- draw ----------
let t0=performance.now();
function drawFish(f, alpha, riseY){
  const ang=Math.atan2(f.vy,f.vx);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(f.x, f.y-(riseY||0));
  ctx.rotate(ang);
  const s=f.size;
  // shadow-ish glow on water
  // tail
  const wig=Math.sin(f.phase*2.2)*0.5;
  ctx.fillStyle=f.hue;
  ctx.beginPath();
  ctx.moveTo(-s*0.8,0);
  ctx.lineTo(-s*1.7, s*(0.9+wig));
  ctx.lineTo(-s*1.5,0);
  ctx.lineTo(-s*1.7, -s*(0.9-wig));
  ctx.closePath(); ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(0,0, s*1.05, s*0.62, 0,0,6.2832);
  ctx.fill();
  // belly highlight
  ctx.globalAlpha=alpha*0.5;
  ctx.fillStyle=f.demekin?'#3a3a3a':'#ffd9a0';
  ctx.beginPath();
  ctx.ellipse(s*0.25,-s*0.16, s*0.5, s*0.25, 0,0,6.2832);
  ctx.fill();
  ctx.globalAlpha=alpha;
  if(f.demekin){
    // bulging telescope eyes
    ctx.fillStyle='#0b0b0b';
    ctx.beginPath(); ctx.ellipse(s*0.55,-s*0.5,s*0.34,s*0.34,0,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.55, s*0.5,s*0.34,s*0.34,0,0,6.2832); ctx.fill();
    ctx.fillStyle='#f2b544';
    ctx.beginPath(); ctx.arc(s*0.62,-s*0.5,s*0.11,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.62, s*0.5,s*0.11,0,6.2832); ctx.fill();
  } else {
    ctx.fillStyle='#2a0d05';
    ctx.beginPath(); ctx.arc(s*0.62,-s*0.22,s*0.12,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  const t=(performance.now()-t0)/1000;
  // rocking lantern light — water still moving from the last scooper
  const cxo=Math.sin(t*0.4)*W*0.03, cyo=Math.cos(t*0.33)*H*0.03;
  const g=ctx.createRadialGradient(W/2+cxo,H*0.44+cyo,10, W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'#25516f');
  g.addColorStop(0.35,'#1c405a');
  g.addColorStop(0.7,'#16324a');
  g.addColorStop(1,'#08131f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // amber pool glow (additive)
  ctx.globalCompositeOperation='lighter';
  const ag=ctx.createRadialGradient(W/2+cxo,H*0.42+cyo,10, W/2+cxo,H*0.42+cyo,Math.min(W,H)*0.55);
  ag.addColorStop(0,'rgba(242,181,68,0.30)');
  ag.addColorStop(0.5,'rgba(242,181,68,0.10)');
  ag.addColorStop(1,'rgba(242,181,68,0)');
  ctx.fillStyle=ag; ctx.fillRect(0,0,W,H);
  // wet ripple highlights
  ctx.strokeStyle='rgba(242,197,120,0.05)';
  ctx.lineWidth=2;
  for(let i=0;i<5;i++){
    const yy=(H*0.15)+i*(H*0.16)+Math.sin(t*0.8+i)*10;
    ctx.beginPath();
    for(let x=0;x<=W;x+=24){
      const y=yy+Math.sin(x*0.012+t*1.2+i*1.7)*7;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  // ripple rings
  for(const r of rings){
    ctx.strokeStyle='rgba(240,205,140,'+r.a+')';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.2832); ctx.stroke();
  }

  // fish (draw carried-off & demekin-riding separately)
  const rideY = (state==='lifting') ? Math.max(0,poiRiseGuess()) : 0;
  for(const f of fish){
    let a=1;
    if(f.scare>0.5) a=0.9;
    // demekin riding the hoop during a lift
    if(state==='lifting' && liftOutcome==='demekin' && !demekinSlipDone && liftCaught[0]===f){
      drawFish(f,1,rideY);
    } else {
      drawFish(f,a,0);
    }
  }
  for(const c of carried){ drawFish(c.f,0.95,0); }

  // the poi (paper scoop)
  drawPoi(t);

  // the cedar bowl + lettering
  drawBowl();
}
function poiRiseGuess(){
  // small visual "lift" of a riding fish
  return Math.sin(Math.min(liftP,1)*Math.PI)*poiR*0.55;
}

function drawPoi(t){
  if(!poi.has && state==='up' && poiZ<0.01){ return; }
  const submerged = poiZ;
  const x=poi.x, y=poi.y;
  const R=poiR*(1+ (state==='lifting'?Math.sin(Math.min(liftP,1)*3.14)*0.05:0));
  ctx.save();
  ctx.translate(x,y);
  // handle stick
  ctx.strokeStyle='#6b4a26';
  ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(R*0.7,-R*0.7); ctx.lineTo(R*1.5,-R*1.5); ctx.stroke();
  ctx.strokeStyle='#8a6236'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(R*0.7,-R*0.7); ctx.lineTo(R*1.5,-R*1.5); ctx.stroke();

  // paper color/translucency driven by integrity
  const inti=Math.max(0,Math.min(1,integrity));
  // lerp cream -> grey-wet
  const cr=[244,236,214], gw=[201,196,168];
  const col=cr.map((c,i)=>Math.round(c+(gw[i]-c)*(1-inti)));
  let fillA = 0.12 + inti*0.68;            // soggy -> see-through
  fillA *= (1 - submerged*0.28);           // dips darker under water
  const wob = (1-inti)*Math.sin(t*7)*R*0.05; // sag/wobble when weak

  // torn: rip it through
  if(torn>0){
    ctx.strokeStyle='rgba(232,220,190,0.85)';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,R,0,6.2832); ctx.stroke();
    // ragged hole
    ctx.fillStyle='rgba(20,50,74,0.5)';
    ctx.beginPath();
    const rip=torn/520;
    for(let i=0;i<=16;i++){
      const a=i/16*6.2832;
      const rr=R*(0.15+rip*0.75)*(0.7+Math.sin(i*3.1)*0.35);
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    return;
  }

  // hoop rim (bamboo)
  ctx.strokeStyle='#7d5a2f';
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(0,wob,R,0,6.2832); ctx.stroke();
  // wet paper membrane
  ctx.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+fillA+')';
  ctx.beginPath(); ctx.ellipse(0,wob,R*0.94,R*0.94*(1-submerged*0.06),0,0,6.2832); ctx.fill();
  // wet sheen
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,238,200,'+(0.10*inti)+')';
  ctx.beginPath(); ctx.ellipse(-R*0.25,wob-R*0.25,R*0.4,R*0.28,-0.6,0,6.2832); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // soggy blotches when weak
  if(inti<0.6){
    ctx.fillStyle='rgba(150,150,120,'+(0.25*(1-inti))+')';
    for(let i=0;i<4;i++){
      const a=i*1.9+t*0.3, rr=R*0.5;
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr,wob+Math.sin(a)*rr,R*0.22,0,6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawBowl(){
  const {x,y,w,h}=bowl;
  ctx.save();
  ctx.translate(x,y);
  // cedar body
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,'#b1834a'); g.addColorStop(0.5,'#9a6f3c'); g.addColorStop(1,'#7c5730');
  ctx.fillStyle=g;
  roundRect(-w/2,-h/2,w,h,9); ctx.fill();
  // rim
  ctx.strokeStyle='#c79657'; ctx.lineWidth=2;
  roundRect(-w/2,-h/2,w,h,9); ctx.stroke();
  // a little water + caught fish suggestion
  ctx.fillStyle='rgba(37,90,120,0.55)';
  roundRect(-w/2+5,-h/2+5,w-10,h*0.34,6); ctx.fill();
  // lettering
  ctx.fillStyle='#3a2712';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 12px Georgia, serif';
  ctx.fillText('GOLDFISH IN YOUR BOWL TONIGHT: '+total, 0, 3);
  ctx.font='700 10px Georgia, serif';
  ctx.fillStyle='#54371a';
  ctx.fillText('BEST RUN ON ONE PAPER: '+best, 0, 18);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- loop ----------
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  layoutBowl();
  update(dt);
  draw();
  // opening patter once
  if(!started && now>900){ started=true; say(pick(P.idle),3400); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// idle nudge if the player just hovers
setInterval(()=>{ if(state==='up' && !pline.classList.contains('show') && Math.random()<0.5) say(pick(P.idle),2600); }, 9000);

console.log('%cSlide in from the side, low. Take one. Tip him off quick. The fat black one? Have a go — he always goes anyway.','color:#e8532b;font-weight:bold');
})();
</script>
