  <meta name="outbox-spec-era" content="Right now, 2:07 in the afternoon, inside a commercial dishwashing machine in a hotel banquet kitchen mid-cycle — the eleven seconds of the wash arm's rotation, seen from inside the cabinet with the door shut and the racks loaded. The page refuses to say the year and nothing in the machine tells you: the pump is one decade, the rinse injector is another, the racks are whatever the hotel last bought. Not a memory, not an atmosphere, not anybody's first kitchen job: there are nine racks stacked on the infeed table, a plate-up at four, and the rinse arm on the left side has two jets blocked with lime.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the inside of the wash chamber seen from the back wall looking forward at a loaded rack of glassware, and the whole image is made of WATER: two counter-rotating wash arms throwing real flat fan jets, the jets breaking into real droplets at a real breakup length, the droplets hitting curved glass and sheeting, beading, and running down as real rivulets that merge when they touch. Steam fills the upper third at a real density computed from the sump temperature. It is not an animation of a dishwasher. It is a live spray-impingement and film-flow engine: every jet is a real momentum flux, every droplet has a real Weber number deciding whether it splashes or sticks, and every rivulet on the glass follows the real contact-angle geometry of whatever is under it. The visitor's whole vocabulary is what a hand does on a dish machine and nothing else: DRAG UP or DOWN on the chamber to change the sump temperature, which changes viscosity, steam density and sheeting behaviour all at once; PRESS AND HOLD anywhere to run the pump harder, which lengthens the jets and shortens their breakup; and SCRUB sideways across a wash arm to clear a limed jet, which works on some of them and not on others. Nothing scrolls. Nothing resets. No caption, no counter, no readable character at any time.">
  <meta name="outbox-spec-subject" content="The flat fluid mechanics of getting a film of soil off a curved glass surface in a fifty-four-second cycle, which is entirely a wetting-and-impingement problem and has nothing to do with cleanliness as an idea. That the wash arm does not spray water at dishes, it throws flat fan sheets that break into droplets at a computed distance from the nozzle, and the whole effectiveness of the machine depends on whether the rack sits inside that breakup length or past it — a glass an inch too far out is being hit by a mist that carries almost no momentum and does almost nothing, which is why rack height is not adjustable on purpose. That IMPINGEMENT ANGLE DOES THE WORK AND NOT PRESSURE: a jet striking glass square deposits its momentum into a stagnation point and spreads radially, lifting film at the edge of that spread and nowhere else, so a static jet leaves a clean ring and a dirty centre, and the entire reason the arms rotate is to walk the stagnation point across every square inch rather than to cover area. That the arm's rotation is driven by reaction from rearward-canted nozzles and its speed therefore rises and falls with pump output, which means turning the pump up changes the dwell time per square inch downward at exactly the moment it raises impact force, and the two effects genuinely fight and there is an optimum in the middle that nobody on the floor ever finds. That WATER TEMPERATURE IS A VISCOSITY QUESTION FIRST: fats above their melt point release from a surface as a film and below it as a solid, so the wash tank at 150 and the wash tank at 138 are two different machines, and the difference is visible as whether water sheets off the glass or beads on it. That SHEETING VERSUS BEADING IS THE ONLY HONEST READOUT IN THE BUILDING: a glass with clean, high-energy surface takes water as a continuous film that drains off and flashes dry from residual heat, and a glass carrying any film of fat or any residue of unrinsed detergent takes water as discrete beads that sit there and dry into spots, so a spotted glass is not a dirty glass, it is a glass whose surface energy is wrong. That RINSE AID IS A SURFACTANT THAT LOWERS SURFACE TENSION so that water cannot hold a bead shape, which means it does not clean anything at all and is purely a drying agent, and dosing it heavier does not dry harder, it foams — and foam in a sump is the single most effective way to destroy a pump's output, because a centrifugal pump moving aerated water loses head catastrophically and the jets go short and soft and nobody connects the two. That HARD WATER IS THE WHOLE LOCAL PROBLEM AND IT SHOWS UP AS BLOCKED JETS: calcium carbonate drops out of solution preferentially at the hottest, most turbulent points, which is precisely the inside of a rinse nozzle, so the machine scales itself worst exactly where it can least afford to, and a rinse arm with two jets limed is a rinse arm delivering a real fraction less sanitizing water at a real measurable drop in final rinse temperature. That THE FINAL RINSE IS A SANITATION REQUIREMENT AND IS ARITHMETIC: 180 degrees at the manifold, delivered for a stated number of seconds, which is what actually sanitizes — the wash cycle is soil removal and does not sanitize anything, and a machine whose booster heater cannot recover between racks is a machine running nine racks an hour that are washed and not sanitized, and it looks identical. That the plate on the door states the required manifold pressure at 20 psi and a higher pressure is not better, it atomizes the rinse into a fog that loses heat to the chamber air before it reaches the glass. That STEAM IN THE CHAMBER IS A HEAT SINK AND A DROPLET KILLER: saturated vapour at chamber temperature condenses onto any surface below it and a droplet crossing a hot vapour space loses mass and momentum on the way, so a machine with a bad vent runs measurably weaker at the far end of the rack. That CARRYOVER IS THE HIDDEN ARITHMETIC: every rack drags a real volume of wash water into the rinse zone and back out, so the tank dilutes and the detergent concentration falls through a shift and the conductivity probe that is supposed to correct for it is reading a tank full of dissolved soil as if it were detergent. That GLASSWARE IS THE HARDEST THING IN THE MACHINE and not because it is delicate: a curved surface presents almost no area at a square impingement angle and a stemmed glass shadows its own base, which is why glass racks have peg inserts that tilt each piece and why a glass loaded upright is a glass that holds an inch of dirty water for the whole cycle. That a rack loaded overlapping does not wash at all in the overlap and the overlap is always in the middle where nobody looks.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the water, the heat and the noise, and that register is VIOLENT, LOUD, HOT, WET AND FAST — jets that hit hard enough to make the glassware ring in its pegs; a wash arm going round at a rate that is genuinely too quick to follow; water coming off the chamber ceiling in fat unpredictable drops that fall through the frame and hit things; steam that is thick enough to grey out the far end of the rack and then thins when the vent catches up; and a pump that audibly loads and unloads as the arm passes the rack. The light is a single sealed work lamp behind toughened glass at the top of the back wall, hard and yellow-white and constantly crossed by water, so the whole image flickers because the light is being interrupted several times a second by actual jets. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the cycle runs whether or not anybody touches anything. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cosy, NOT dreamy, NOT ASMR, NOT oddly-satisfying, NOT a power-washing video, NOT a process video, NOT a screensaver, NOT stately, NOT reverent, NOT beautiful-in-the-soft-sense — this is fifty-four seconds inside a machine with a plate-up at four and nine racks waiting.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the water's appearance is COMPUTED and never chosen. The chamber is 304 stainless, coved and seamless, and it renders as what stainless under a wet work lamp actually renders as: a hard cool grey-white where the lamp lands directly (#cdd3d4), dropping fast to a dim blue-grey in the coves (#4e585c), and going almost black in the corner behind the rack rail (#20272a), with a real mineral bloom along the waterline at the sump lip — a chalky opaque off-white scale that has built up in horizontal bands and does not reflect anything (#d9d2c2). Against that, EVERY DROPLET AND EVERY RIVULET IS THE OUTPUT OF OPTICAL ARITHMETIC AND NOBODY PICKS A WATER COLOUR: water is given a real refractive index and near-zero absorption, so a droplet on glass renders as a real lens — it inverts and compresses whatever is behind it, it carries a hard bright specular at the lamp's angle (#ffffff, tiny, hard-edged), and it throws a real caustic bright spot onto the surface under it. A sheeting film renders as almost nothing at all except a shifted reflection and a slightly warmer edge where it is thickest at the draining bead. A jet in flight renders as a column of forward-scattered light that is BRIGHT where it is still coherent near the nozzle (#eef4f5) and dims and goes granular as it breaks into droplets, so the breakup length is visible as a real change in brightness and nothing says so. Steam renders by real optical depth: thin steam is a slight desaturation, thick steam swallows the far end of the rack entirely into a flat warm grey (#8e9294). The glassware is soda-lime glass rendered by real transmission and real edge refraction, so it is essentially invisible except at its rims and its stems, which read as bright curved lines. Soil renders honestly: a film of fat on glass is a very slightly yellowed, very slightly hazy region (#cfc9a8 at four percent) that is invisible until water hits it and beads, at which point it is obvious. Exactly one chip of rack polypropylene grey-green (#4a7a63) is held strictly for three things: the rack itself and its pegs, the gasket seal visible at the door edge at the bottom of frame, and the wash arm's own bearing hub. It never appears in water, in steam, in stainless, in glass or in light. Flat, hard, high contrast where the lamp lands and honestly dim everywhere else; no glow, no bloom, no lens flare, no soft focus, no vignette, no gradients other than honest refraction, honest caustics, honest jet breakup, honest steam optical depth and honest specular on wet steel.">
  <meta name="outbox-spec-wildcard" content="One piece in the rack is not glassware. It is a stainless bain-marie insert lid that somebody dropped into a glass rack because there was nowhere else to put it, and the engine gives it exactly the properties a flat sheet of stainless has and no others: it is opaque, so it casts a real hard wet shadow across four glasses behind it for the entire cycle and those four never receive a single direct jet; it has a rolled rim that holds a real reservoir of water which never drains and which sloshes with every arm pass; and it has a far higher thermal mass than glass, so it stays below the flash-dry threshold and comes out of every cycle streaming while everything around it is dry. It cannot be moved, tipped, drained, lifted out or rotated by anything the visitor can do — sliding the rack moves it with everything else and the shadow moves with it. Same lid, same rim puddle, same four shadowed glasses, every visit.">
  <meta name="outbox-spec-forbidden" content="NO washing-as-metaphor for anything — not cleansing, not starting over, not washing away, not baptism, not purity, not 'getting the day off you', not the endless cycle, not Sisyphus, not what we scrub at; this is integrated shear stress against an adhesion value and it has nothing to teach anybody. ABSOLUTELY NO kitchen-as-crucible register: no brigade romance, no heat-of-the-line, no chef-as-tyrant, no Anthony Bourdain, no Kitchen Confidential, no The Bear, no service-as-battle, no adrenaline, no call-and-response ('yes chef' in any form), no dishpit-as-bottom-rung, no the-dishwasher-nobody-sees, no I-started-in-the-pit origin story, no kitchen-family sentiment. NO labour-dignity sermon, NO invisible-workers framing, NO 'nobody thinks about this until it isn't there', NO essential-workers register, NO immigrant-sacrifice arc, NO poverty pathos, NO class commentary, NO tipping-economy essay, NO union framing, NO exploitation exposé. NO food writing of any kind: nothing about what was on the plates, no menu, no banquet-as-spectacle, no sensuous description of anything edible, no smell writing whatsoever. NO craftsman-sage register, NO 'the old dish men could hear a bad rack', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc. NO hotel-as-world, NO backstage-versus-frontstage essay, NO 'the guests will never know', NO service-industry philosophy, NO hospitality sentiment. NO water lyricism: no describing water as alive, dancing, singing, silver, jewelled, or falling like anything; water here is a refractive index and a momentum flux. NO light-through-water reverie, NO caustics-as-beauty, NO prismatic anything, NO rainbow. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, power-washing-video, cleaning-video, satisfying-cleaning, process-video, maker-channel, ambient-visualiser, generative-art-gallery, music-visualiser, chillout, lo-fi or screensaver framing whatsoever, and no 'watch it get clean' — it is loud, it is 150 degrees, and four glasses in the middle are not going to come out. NO machine-as-creature framing: no it breathes, no it roars, no hungry, no tireless, no patient, no relentless-as-character, no the-machine-doesn't-care, no automation anxiety. NO physics-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page contains no words and explains nothing to anybody. NO hygiene moralising, NO germ dread, NO contagion imagery, NO health-inspector drama, NO danger-porn, NO scalding, NO injury foreshadowing, NO safety sermon. NO nostalgia, NO wistfulness, NO decline narrative, NO retro-kitsch, NO camp, NO ironic affection for stainless steel, rack pegs or industrial signage, NO vaporwave, NO liminal-space register, NO cryptic-SCP, NO uncanny, NO backrooms, NO analog-horror, NO ominous dread about the shadowed glasses, the scale that never comes off, or a chamber the visitor cannot leave — nothing here is wrong and nobody is trapped. NO confined-space claustrophobia framing, NO being-inside-something-you-shouldn't-be, NO point-of-view-of-the-object conceit, NO the-dishes-are-watching. NO archival / museum / cabinet / drawer / collection / specimen / relic framing of anything, despite the scale bands being a real accumulated record — the machine is running right now and there are nine racks on the table. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is seven minutes past two in the afternoon with a hood running and daylight in the corridor. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the steel, the water, the steam, the glass and the one rack-green chip, NO instructional UI text, captions, header, footer <script>
(function(){
"use strict";

// ---------------------------------------------------------------
// state store. forward only. nothing here ever goes back down.
// ---------------------------------------------------------------
var KEY = "dishmachine.chamber.state.v1";
var S = null;
try { S = JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e){ S=null; }
if(!S || typeof S!=="object"){
  S = {
    scale: [],          // per-nozzle hardened + loose deposit
    racks: 0,
    det: 3.20,          // g/L detergent in sump
    wear: 0,            // impeller wear fraction
    boostDeficit: 0,    // booster heater recovery deficit, degF
    lastSeen: Date.now(),
    soil: null
  };
}
function save(){
  S.lastSeen = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

// ---------------------------------------------------------------
// canvas
// ---------------------------------------------------------------
var cv = document.getElementById("chamber");
var ctx = cv.getContext("2d", {alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(320, cv.clientWidth|0);
  H = Math.max(320, cv.clientHeight|0);
  cv.width = (W*DPR)|0; cv.height = (H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener("resize", resize);

// ---------------------------------------------------------------
// water properties. real-ish correlations, degF in, SI out.
// ---------------------------------------------------------------
function F2C(f){ return (f-32)*5/9; }
function mu(f){                       // dynamic viscosity Pa*s
  var T = F2C(f);
  return 2.414e-5 * Math.pow(10, 247.8/(T+273.15-140));
}
function sigma(f){                    // surface tension N/m
  var T = F2C(f);
  var Tc = 647.096, tau = 1 - (T+273.15)/Tc;
  var s = 0.2358*Math.pow(tau,1.256)*(1-0.625*tau);
  // rinse-aid surfactant knocks it down; detergent a little too
  var surf = 0.42 + 0.58/(1+S.det*0.55);
  return s*surf;
}
function rho(f){                      // kg/m3
  var T=F2C(f);
  return 1000*(1 - Math.abs(T-4)*0.000226 - Math.pow(Math.max(0,T-40),1.45)*3.1e-5);
}
function psat(f){                     // saturation pressure kPa, Antoine-ish
  var T=F2C(f);
  return Math.pow(10, 8.07131 - 1730.63/(233.426+T))*0.133322;
}

// ---------------------------------------------------------------
// the sump, the pump, the booster
// ---------------------------------------------------------------
var sumpT = 150.0;         // degF
var pumpCmd = 0;           // 0..1 extra, held
var foam = 0.0;            // aeration fraction in sump
var chamberVapor = 0.24;   // kg/m3-ish normalised optical mass
var chamberT = 128.0;

// pump head curve: H = H0 - k*Q^2, with wear
function pumpHead(Q){
  var H0 = 22.5*(1-S.wear*0.22)*(1 + pumpCmd*0.46);
  var k  = 640.0;
  var aer = 1 - Math.min(0.85, foam*2.35);   // aerated water loses head hard
  return Math.max(0.1,(H0 - k*Q*Q)*aer);
}

// ---------------------------------------------------------------
// geometry. chamber is a 30in box; we look forward from the back wall.
// world units are inches. perspective is a simple pinhole.
// ---------------------------------------------------------------
var LAY = {};
function layout(){
  var scale = Math.min(W,H);
  LAY.cx = W*0.5;
  LAY.cy = H*0.47;
  LAY.f  = scale*1.02;         // focal length, px per inch at z=1
  LAY.eyeZ = 0;
  LAY.sc = scale;
}
function proj(x,y,z){
  // z is inches forward from the eye (back wall). y up is negative screen.
  var zz = Math.max(2.2, z);
  var s = LAY.f/zz;
  return { x: LAY.cx + x*s, y: LAY.cy - y*s, s:s };
}

// ---------------------------------------------------------------
// NOZZLES. two counter-rotating arms. eight on near (lower) arm,
// six on the far (upper) arm. two of the upper rinse jets start limed.
// ---------------------------------------------------------------
var NOZ = [];
function buildNozzles(){
  NOZ.length=0;
  var i;
  // near/lower wash arm: hub at z=17in, y=-9in
  for(i=0;i<8;i++){
    var r = 2.6 + (i%4)*2.35;
    var side = (i<4)? 1 : -1;
    NOZ.push({
      arm:0, idx:i,
      r: r, side: side,
      y: -9.0, z: 17.0,
      A0: 3.10e-6,            // orifice m^2
      fan: 0.44,              // radians full fan angle
      cant: 0.22,             // rearward cant, radians -> reaction thrust
      rinse:false,
      hard: 0, loose: 0
    });
  }
  // far/upper rinse arm: hub at z=24in, y=+7.5in, counter-rotating
  for(i=0;i<6;i++){
    var r2 = 2.2 + (i%3)*3.0;
    var side2 = (i<3)? 1 : -1;
    NOZ.push({
      arm:1, idx:i,
      r:r2, side:side2,
      y: 7.5, z: 24.0,
      A0: 2.30e-6,
      fan: 0.30,
      cant: 0.18,
      rinse:true,
      hard:0, loose:0
    });
  }
  // restore scale; index 8 and 11 start already limed (left side rinse)
  for(i=0;i<NOZ.length;i++){
    var st = S.scale[i];
    if(st){ NOZ[i].hard = st[0]||0; NOZ[i].loose = st[1]||0; }
  }
  if(!S.scale.length){
    NOZ[8].hard  = 0.52; NOZ[8].loose  = 0.11;
    NOZ[11].hard = 0.47; NOZ[11].loose = 0.14;
  }
}
function areaOf(n){
  var blk = Math.min(0.94, n.hard + n.loose);
  return n.A0 * (1-blk);
}
function pushScale(){
  S.scale = NOZ.map(function(n){ return [n.hard, n.loose]; });
}

// arms
var ARM = [
  { th: 0.0, w: 0.0, I: 0.0085, drag: 0.0011, dir: 1,  y:-9.0, z:17.0 },
  { th: 1.7, w: 0.0, I: 0.0062, drag: 0.0009, dir: -1, y: 7.5, z:24.0 }
];

// ---------------------------------------------------------------
// SYSTEM SOLVE: pump head against total orifice restriction.
// one calculation; velocity, flow, thrust all fall out of it.
// ---------------------------------------------------------------
var sys = { Q:0, P:0, v:[], q:[] };
function solveSystem(){
  var r = rho(sumpT);
  var Cd = 0.82;
  var Atot = 0;
  for(var i=0;i<NOZ.length;i++) Atot += areaOf(NOZ[i]);
  // iterate Q so that head loss through orifices == pump head
  var Q = sys.Q||0.0016;
  for(var it=0; it<26; it++){
    var v = Q/(Cd*Atot);
    var hreq = (v*v)/(2*9.81);             // m of head
    var have = pumpHead(Q);
    var err = have - hreq;
    Q += err*1.4e-5;
    if(Q<1e-6) Q=1e-6;
    if(Q>0.02) Q=0.02;
  }
  sys.Q = Q;
  var vv = Q/(Cd*Atot);
  sys.P = 0.5*r*vv*vv/6894.76;             // psi at nozzle
  sys.v.length=0; sys.q.length=0;
  for(var j=0;j<NOZ.length;j++){
    var a = areaOf(NOZ[j]);
    sys.v[j] = vv;
    sys.q[j] = Cd*a*vv;
  }
}

// ---------------------------------------------------------------
// BREAKUP: coherent sheet length from We / Oh.
// ---------------------------------------------------------------
function breakupLength(n, idx){
  var r = rho(sumpT), sg = sigma(sumpT), m = mu(sumpT);
  var v = sys.v[idx];
  var t0 = Math.sqrt(areaOf(n)/n.fan)*0.9 + 1e-5;   // sheet thickness scale (m)
  var We = r*v*v*t0/sg;
  var Oh = m/Math.sqrt(r*sg*t0);
  var Lb = t0 * 12.0 * Math.sqrt(Math.max(1,We)) * (1 + 2.6*Oh);
  var Lin = Lb*39.3701;                              // m -> inches
  // vapour in the chamber eats coherence
  Lin *= (1 - Math.min(0.42, chamberVapor*0.85));
  return Math.max(0.6, Math.min(26, Lin));
}
function dropDiameter(n, idx){
  var r=rho(sumpT), sg=sigma(sumpT), v=sys.v[idx];
  var t0 = Math.sqrt(areaOf(n)/n.fan)+1e-5;
  var d = 1.9*Math.sqrt(sg*t0/(r*v*v))*1000;   // mm, sauter-ish
  // log-normal-ish jitter
  var u = Math.random(), g = Math.random();
  var z = Math.sqrt(-2*Math.log(u+1e-9))*Math.cos(6.2831853*g);
  return Math.max(0.05, d*Math.exp(z*0.44));
}

// ---------------------------------------------------------------
// THE RACK. 20 pegs. one of them is not a glass.
// ---------------------------------------------------------------
var rack = { z: 19.5, targetZ: 19.5 };
var PIECES = [];
function buildRack(){
  PIECES.length=0;
  var cols=5, rows=4, id=0;
  for(var ry=0; ry<rows; ry++){
    for(var rx=0; rx<cols; rx++){
      var px = (rx-2)*3.15;
      var pz = (ry-1.5)*2.9;
      var isLid = (rx===2 && ry===1);   // the bain-marie lid, dead centre-ish
      var hgt = 5.2 + ((rx*7+ry*13)%5)*0.55;
      var rad = 1.12 + ((rx*3+ry*5)%4)*0.09;
      var stem = ((rx+ry)%3===0);
      PIECES.push({
        id:id++, rx:rx, ry:ry,
        x: px, zoff: pz,
        lid: isLid,
        h: isLid? 0.35 : hgt,
        r: isLid? 2.35 : rad,
        stem: isLid? false : stem,
        tilt: isLid? 0 : (0.19 + ((rx*5+ry)%3)*0.06)*(rx<2?1:-1),
        ring: 620 + ((rx*97+ry*211)%9)*57,   // ring pitch from geometry
        // film + soil fields, coarse: 10 columns x 7 bands
        film: new Float32Array(70),
        soil: new Float32Array(70),
        beads: [],
        rivs: [],
        rimPool: isLid? 0.72 : 0,
        rimPhase: 0,
        temp: 108 + (isLid? -14 : 0)
      });
    }
  }
  // seed soil
  var seeded = S.soil;
  for(var i=0;i<PIECES.length;i++){
    var p = PIECES[i];
    for(var c=0;c<70;c++){
      var base = 0.42 + 0.5*Math.sin(i*2.1+c*0.7)*0.5;
      p.soil[c] = Math.max(0, Math.min(1, base*(0.6+Math.random()*0.7)));
    }
    if(seeded && seeded[i]){
      var arr = seeded[i];
      for(var c2=0;c2<70 && c2<arr.length;c2++) p.soil[c2] = arr[c2];
    }
    if(p.lid) for(var c3=0;c3<70;c3++) p.soil[c3]*=0.5;
  }
}
// which four glasses live in the lid's shadow (directly behind it)
function shadowed(p){
  return (!p.lid) && (p.rx>=1 && p.rx<=3) && (p.ry>=2) && !((p.rx===1)&&(p.ry===3));
}

// ---------------------------------------------------------------
// DROPLETS
// ---------------------------------------------------------------
var drops = [];       // in-flight
var MAXDROPS = 1400;
var splats = [];      // on-glass short-lived bright impacts
var ceilingDrops = [];

function emitFrom(n, idx, dt){
  var v = sys.v[idx];
  if(v<1.5) return;
  var q = sys.q[idx];
  var arm = ARM[n.arm];
  var th = arm.th;
  var ca = Math.cos(th)*n.side, sa = Math.sin(th)*n.side;
  var ox = n.r*ca, oy = n.y + n.r*sa*0.24, oz = n.z + n.r*sa*0.86;
  var Lb = breakupLength(n, idx);
  // direction: outward-ish, fanned in the plane, canted rearward
  var nx = -sa*0.0 + ca*0.10;
  var base = (n.arm===0)? 1.0 : -1.0;   // lower sprays up, upper sprays down
  var rate = Math.min(26, 7 + q*9000*(1+pumpCmd));
  var count = rate*dt*62;
  var ncount = Math.floor(count) + ((Math.random()<(count%1))?1:0);
  for(var k=0;k<ncount;k++){
    if(drops.length>=MAXDROPS) return;
    var fa = (Math.random()-0.5)*n.fan;
    var dirx = ca*Math.cos(fa)*0.55 + Math.sin(fa)*0.42;
    var diry = base*Math.cos(fa*0.5);
    var dirz = sa*0.30 - n.cant*base*0.2 + (Math.random()-0.5)*0.12;
    var L = Math.sqrt(dirx*dirx+diry*diry+dirz*dirz)||1;
    var sp = v*(0.86+Math.random()*0.2);
    var d = dropDiameter(n, idx);
    drops.push({
      x:ox, y:oy, z:oz,
      vx: dirx/L*sp, vy: diry/L*sp, vz: dirz/L*sp,
      d: d, life:0, Lb:Lb, trav:0,
      noz: idx, coh: true, hot: sumpT
    });
  }
}

function stepDrops(dt){
  var g = 9.81*39.3701;   // in/s^2
  var vap = chamberVapor;
  for(var i=drops.length-1;i>=0;i--){
    var p = drops[i];
    var vmag = Math.sqrt(p.vx*p.vx+p.vy*p.vy+p.vz*p.vz);
    // drag ~ scaled by 1/d, plus vapour mass loss
    var k = (0.9 + vap*3.2)/Math.max(0.09,p.d) * 0.0022;
    p.vx -= p.vx*k*vmag*dt*39.37;
    p.vy -= p.vy*k*vmag*dt*39.37;
    p.vz -= p.vz*k*vmag*dt*39.37;
    p.vy -= g*dt*0.012;
    // vapour eats mass
    p.d *= (1 - vap*0.16*dt);
    var ox=p.x, oy=p.y, oz=p.z;
    p.x += p.vx*dt*39.37*0.09;
    p.y += p.vy*dt*39.37*0.09;
    p.z += p.vz*dt*39.37*0.09;
    p.trav += Math.abs(p.x-ox)+Math.abs(p.y-oy)+Math.abs(p.z-oz);
    p.coh = p.trav < p.Lb;
    p.life += dt;

    // pointer deflection: a real disturbance in the water
    if(ptr.on){
      var pr = proj(p.x,p.y,p.z);
      var dx = pr.x-ptr.x, dy = pr.y-ptr.y;
      var dd = dx*dx+dy*dy;
      var R = LAY.sc*0.085;
      if(dd < R*R){
        var f = (1-Math.sqrt(dd)/R);
        var inv = 1/Math.max(6,Math.sqrt(dd));
        p.vx += dx*inv*f*42;
        p.vy -= dy*inv*f*42;
        p.d *= (1-f*0.06*dt*60*0.016);
        ptr.wet = Math.min(1, ptr.wet + f*0.05);
      }
    }

    // ceiling strike
    if(p.y > 13.6){
      if(Math.random()<0.22 && ceilingDrops.length<70){
        ceilingDrops.push({x:p.x+(Math.random()-0.5)*1.4, y:13.4, z:p.z,
                           vy:0, d: 1.4+Math.random()*2.2, hung: 0.25+Math.random()*1.4});
      }
      drops.splice(i,1); continue;
    }
    // impingement on rack pieces
    if(hitPiece(p)) { drops.splice(i,1); continue; }
    if(p.y < -13.4 || p.life>1.6 || p.d<0.05 || Math.abs(p.x)>18 || p.z<3 || p.z>30){
      drops.splice(i,1); continue;
    }
  }
  // ceiling condensate falls
  for(var c=ceilingDrops.length-1;c>=0;c--){
    var cd = ceilingDrops[c];
    cd.d += chamberVapor*3.4*dt;          // growing by condensation
    cd.hung -= dt*(0.4 + cd.d*0.12);
    if(cd.hung<=0){
      cd.vy -= g*dt*0.016;
      cd.y += cd.vy*dt*0.09;
      if(cd.y < -13){ ceilingDrops.splice(c,1); continue; }
      var fake = {x:cd.x,y:cd.y,z:cd.z,vx:0,vy:cd.vy,vz:0,d:cd.d,coh:false,trav:99,Lb:1};
      if(hitPiece(fake)){ ceilingDrops.splice(c,1); audio.tap(cd.d, cd.z); continue; }
    }
  }
}

// ---------------------------------------------------------------
// IMPACT DECISION: Weber number per droplet against local film.
// ---------------------------------------------------------------
function hitPiece(p){
  for(var i=0;i<PIECES.length;i++){
    var pc = PIECES[i];
    var pz = rack.z + pc.zoff;
    if(Math.abs(p.z - pz) > 1.15) continue;
    var dx = p.x - pc.x;
    var baseY = -8.2;
    var dy = p.y - (baseY + pc.h*0.5);
    if(Math.abs(dx) > pc.r+0.35) continue;
    if(pc.lid){
      if(Math.abs(p.y - (baseY+0.4)) > 0.9) continue;
    } else {
      if(dy < -pc.h*0.62 || dy > pc.h*0.55) continue;
    }
    // lid shadow: nothing direct reaches the four behind it
    if(shadowed(pc) && p.coh) {
      var lidZ = rack.z + PIECES[7].zoff;
      if(pz > lidZ && Math.abs(p.x - PIECES[7].x) < 2.3 && p.y < baseY+2.4) return false;
    }
    // local cell
    var u = Math.max(0, Math.min(0.999, (dx/pc.r*0.5+0.5)));
    var vcell = pc.lid ? 0.5 : Math.max(0, Math.min(0.999, (dy/pc.h+0.55)));
    var ci = (Math.floor(u*10)) + (Math.floor(vcell*7))*10;
    if(ci<0||ci>=70) ci=0;

    // surface normal on a cylinder; impingement angle does the work
    var nrm = dx/pc.r;
    var cosang = Math.max(0.02, Math.abs(-nrm*(p.vx>0?1:-1)*0.5 + 0.86));
    var speed = Math.sqrt(p.vx*p.vx+p.vy*p.vy+p.vz*p.vz);
    var vn = speed*cosang;
    var dm = p.d/1000;
    var We = rho(sumpT)*vn*vn*dm/sigma(sumpT);
    var hstar = pc.film[ci]/Math.max(0.02,p.d);
    var Kcrit = 2100 + 5880*Math.pow(Math.max(0.01,hstar),0.44);
    var Oh = mu(sumpT)/Math.sqrt(rho(sumpT)*sigma(sumpT)*dm);
    var K = We/Math.max(1e-4, Math.pow(Oh,0.4));

    if(K > Kcrit && drops.length < MAXDROPS-8){
      // splash: real secondaries at real angles
      var nsec = 2 + (Math.random()*3)|0;
      for(var s=0;s<nsec;s++){
        var a = Math.random()*6.2831853;
        var el = 0.35 + Math.random()*0.7;
        var sv = vn*(0.22+Math.random()*0.3);
        drops.push({
          x:p.x - nrm*0.1, y:p.y, z:p.z - 0.2,
          vx: Math.cos(a)*sv*Math.cos(el)*(nrm>0?1:-1) + p.vx*0.12,
          vy: Math.sin(el)*sv + p.vy*0.1,
          vz: -Math.abs(Math.sin(a)*sv*0.6),
          d: p.d*(0.32+Math.random()*0.3),
          life:0, Lb:0.2, trav:99, coh:false, noz:p.noz, hot:p.hot
        });
      }
      pc.film[ci] += p.d*0.22;
    } else {
      pc.film[ci] += p.d*0.62;
    }

    // WORK: integrated shear. adhesion falls sharply above fat melt point.
    var melt = 118;
    var adh = 1.0/(1+Math.exp((sumpT-melt)*0.24));  // ~1 cold, ~0 hot
    adh = 0.08 + adh*0.92;
    var tau = mu(sumpT)*vn/Math.max(2e-5, pc.film[ci]/1000*0.5+2e-5);
    var det = 0.35 + S.det*0.20;
    var removal = tau*1.1e-7*cosang*det/adh;
    // the shadowed four: whatever arrives is mist, not momentum
    if(shadowed(pc)) removal *= 0.06;
    if(!p.coh) removal *= 0.22;         // past breakup length: mist does nothing
    pc.soil[ci] = Math.max(0, pc.soil[ci] - removal);
    // radial spread lifts film at the edge of the spread, not the centre
    var l = ci-1, rr = ci+1;
    if(l>=0 && (ci%10)!==0) pc.soil[l] = Math.max(0, pc.soil[l]-removal*1.35);
    if(rr<70 && (rr%10)!==0) pc.soil[rr] = Math.max(0, pc.soil[rr]-removal*1.35);

    // lid rim reservoir: sloshes, never drains
    if(pc.lid) pc.rimPool = Math.min(1.0, pc.rimPool + p.d*0.02);

    if(vn>5 && Math.random()<0.28){
      splats.push({pc:i, u:u, v:vcell, r: p.d*(0.9+We*0.0008), a:1, K:K/Kcrit});
      if(splats.length>240) splats.shift();
    }
    // glassware rings in its pegs
    if(!pc.lid && vn>9 && Math.random()<0.045) audio.ring(pc.ring, Math.min(1,vn/40));
    audio.impinge(p.coh, p.d, vn);
    return true;
  }
  return false;
}

// ---------------------------------------------------------------
// THIN-FILM SOLVE on the curved glass: drain, rivulets, merge, bead.
// ---------------------------------------------------------------
function stepFilm(dt){
  var m = mu(sumpT), sg = sigma(sumpT), r = rho(sumpT);
  for(var i=0;i<PIECES.length;i++){
    var pc = PIECES[i];
    // contact angle from local soil: fat raises it, clean glass ~ 12deg
    for(var c=0;c<70;c++){
      var h = pc.film[c];
      if(h<=0){ continue; }
      var soil = pc.soil[c];
      var theta = 12 + soil*78;          // degrees
      var beadsUp = theta > 48;
      // drainage, Nusselt falling film: q ~ rho g h^3 / (3 mu)
      var hm = h/1000;
      var drain = (r*9.81*hm*hm*hm/(3*m)) * 3400 * dt;
      var below = c+10;
      var out = Math.min(h*0.85, drain*1000);
      if(beadsUp){
        // film breaks into beads: it doesn't run, it sits
        out *= 0.10;
        if(h>0.32 && pc.beads.length<50 && Math.random()<0.09*dt*60){
          pc.beads.push({u:(c%10)/10+0.05, v:Math.floor(c/10)/7+0.07,
                         r: 0.18+Math.random()*0.28, life:0, th:theta});
          pc.film[c]*=0.5;
        }
      } else {
        // Rayleigh-Plateau: a draining sheet destabilises into rivulets
        var lam = 2*Math.PI*Math.sqrt(sg/(r*9.81))*39.37;   // capillary length scale in
        if(h>0.22 && pc.rivs.length<14 && Math.random()<0.16*dt*60){
          pc.rivs.push({u:(c%10)/10 + Math.random()*0.1, v: Math.floor(c/10)/7,
                        w: 0.012 + h*0.02, spd: 0.24+h*0.9, len:0.05, lam:lam});
          pc.film[c]*=0.7;
        }
      }
      pc.film[c] = h - out;
      if(below<70) pc.film[below] += out*0.9;
      else {
        // draining bead at the bottom edge
      }
      // flash-dry from residual heat, only if the piece is above threshold
      var flash = (pc.temp > 140 && !pc.lid) ? 0.9 : 0.16;
      pc.film[c] *= (1 - flash*dt*0.55);
      if(pc.film[c]<0.001) pc.film[c]=0;
    }
    // rivulets run and MERGE when they touch
    for(var j=pc.rivs.length-1;j>=0;j--){
      var rv = pc.rivs[j];
      rv.v += rv.spd*dt*(sumpT>140?1.35:1.0)*(1/(m*1400));
      rv.len = Math.min(1, rv.len + rv.spd*dt*1.5);
      rv.w *= (1 - dt*0.05);
      if(rv.v>1.06){ pc.rivs.splice(j,1); continue; }
      for(var k=j-1;k>=0;k--){
        var rv2 = pc.rivs[k];
        if(Math.abs(rv2.u-rv.u) < 0.035 && Math.abs(rv2.v-rv.v) < 0.16){
          rv2.w = Math.sqrt(rv2.w*rv2.w + rv.w*rv.w);
          rv2.u = (rv2.u+rv.u)*0.5;
          rv2.spd = Math.max(rv2.spd, rv.spd)*1.1;
          pc.rivs.splice(j,1); break;
        }
      }
    }
    for(var b=pc.beads.length-1;b>=0;b--){
      var bd = pc.beads[b];
      bd.life += dt;
      // a bead on a high-contact-angle surface sits and dries into a spot
      if(bd.th < 44 || bd.life > 5.5){ pc.beads.splice(b,1); continue; }
      if(sumpT>146 && Math.random()<0.006) { bd.r*=0.94; }
      if(bd.r<0.06) pc.beads.splice(b,1);
    }
    // thermal: pieces heat up toward sump; lid has real thermal mass
    var C = pc.lid? 0.10 : 0.62;
    pc.temp += (sumpT-6 - pc.temp)*C*dt;
    if(pc.lid){
      pc.rimPhase += dt*2.2;
      pc.rimPool = Math.max(0.55, pc.rimPool*(1-dt*0.02));
    }
  }
}

// ---------------------------------------------------------------
// ARM DYNAMICS: reaction thrust vs bearing drag vs water inertia
// ---------------------------------------------------------------
function stepArms(dt){
  for(var a=0;a<2;a++){
    var arm = ARM[a];
    var torque = 0;
    for(var i=0;i<NOZ.length;i++){
      var n = NOZ[i];
      if(n.arm!==a) continue;
      var thrust = rho(sumpT)*sys.q[i]*sys.v[i];    // N
      torque += thrust*Math.sin(n.cant)*(n.r*0.0254)*n.side*arm.dir;
    }
    var waterI = arm.I + sys.Q*140;
    var dragT = arm.drag*arm.w*Math.abs(arm.w)*3.6 + arm.drag*arm.w*1.4;
    arm.w += (torque - dragT)/waterI*dt;
    arm.w = Math.max(-42, Math.min(42, arm.w));
    arm.th += arm.w*dt;
    if(arm.th>1e6) arm.th-=1e6;
  }
}

// ---------------------------------------------------------------
// VAPOUR FIELD
// ---------------------------------------------------------------
function stepVapor(dt){
  var ps = psat(sumpT);
  var gen = ps*0.0028*(1+pumpCmd*0.5);
  var vent = 0.42;
  var cond = chamberVapor*0.34;      // onto anything cooler
  chamberVapor += (gen - chamberVapor*vent - cond*0.2)*dt;
  chamberVapor = Math.max(0.02, Math.min(1.6, chamberVapor));
  chamberT += ((sumpT-18) - chamberT)*0.4*dt;
}

// ---------------------------------------------------------------
// LIME: grows where hot and turbulent. permanent, forward only.
// ---------------------------------------------------------------
var limeAcc = 0;
function stepLime(dt){
  if(sumpT < 128) return;
  var hardness = 1.0;        // the local problem
  for(var i=0;i<NOZ.length;i++){
    var n = NOZ[i];
    var rate = (sumpT-128)*1.1e-7*hardness*(sys.v[i]/22)*(n.rinse?1.9:1.0);
    n.hard += rate*dt*(1 - n.hard*0.6);
    n.loose += rate*dt*0.55*(1-n.loose);
    if(n.hard>0.93) n.hard=0.93;
    if(n.loose>0.4) n.loose=0.4;
  }
  limeAcc += dt;
}

// ---------------------------------------------------------------
// SCRUBBING: removes loose deposit only. hardened stays forever.
// ---------------------------------------------------------------
var scrubHeld = {};
function scrubNozzle(i, dt, strength){
  var n = NOZ[i]; if(!n) return;
  var got = Math.min(n.loose, dt*0.55*strength);
  n.loose -= got;
  if(got>0.0004) audio.scrub(got);
}

// ---------------------------------------------------------------
// RACK CLOCK: racks arrive on the machine's clock. no reset.
// ---------------------------------------------------------------
var cycleT = 0, CYCLE = 54;
var elapsedSinceSeen = Math.min(3600, (Date.now() - (S.lastSeen||Date.now()))/1000);
(function catchUp(){
  var n = Math.floor(elapsedSinceSeen/CYCLE);
  if(n>0){
    S.racks += n;
    S.det = Math.max(0.35, S.det*Math.pow(0.9915, n));   // carryover dilution
    S.wear = Math.min(1, S.wear + n*0.00042);
    S.boostDeficit = Math.min(24, S.boostDeficit + n*0.06);
  }
})();

function newRack(){
  S.racks++;
  S.det = Math.max(0.35, S.det*0.9915);
  S.wear = Math.min(1, S.wear + 0.00042);
  // booster can't fully recover between racks
  S.boostDeficit = Math.min(24, S.boostDeficit*0.985 + 0.08);
  // reload with fresh soiled glassware; the lid stays, always
  for(var i=0;i<PIECES.length;i++){
    var p = PIECES[i];
    if(p.lid){
      p.rimPool = 0.72;
      for(var c=0;c<70;c++){ p.film[c]*=0.7; }
      continue;
    }
    for(var c2=0;c2<70;c2++){
      p.soil[c2] = 0.34 + Math.random()*0.5;
      p.film[c2] = 0;
    }
    p.beads.length=0; p.rivs.length=0; p.temp = 104;
  }
  audio.doorGasket();
  audio.rackDown();
  persistSoil(); pushScale(); save();
}
function persistSoil(){
  S.soil = PIECES.map(function(p){ return Array.prototype.slice.call(p.soil).map(function(v){return Math.round(v*100)/100;}); });
}

// ---------------------------------------------------------------
// AUDIO — all synthesised.
// ---------------------------------------------------------------
var audio = (function(){
  var A=null, master, verb, pumpOsc, pumpGain, bladeOsc, bladeGain,
      hissSrc, hissFilt, hissGain, roomGain, started=false;
  var lastTap=0, lastRing=0, lastImp=0;
  function noiseBuf(ac, secs){
    var b = ac.createBuffer(1, ac.sampleRate*secs, ac.sampleRate);
    var d = b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function makeVerb(ac){
    // short hard reverb for a 30-inch stainless box
    var len = ac.sampleRate*0.28;
    var b = ac.createBuffer(2, len, ac.sampleRate);
    for(var ch=0;ch<2;ch++){
      var d = b.getChannelData(ch);
      for(var i=0;i<len;i++){
        var t = i/len;
        var env = Math.pow(1-t, 3.4);
        var flut = (i%((ac.sampleRate*0.0031)|0) < 3)? 2.6 : 0.6;
        d[i] = (Math.random()*2-1)*env*flut;
      }
    }
    var c = ac.createConvolver(); c.buffer=b; return c;
  }
  function init(){
    if(started) return;
    try{
      A = new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){ return; }
    started = true;
    master = A.createGain(); master.gain.value = 0.0;
    verb = makeVerb(A);
    var verbG = A.createGain(); verbG.gain.value=0.46;
    master.connect(A.destination);
    master.connect(verbG); verbG.connect(verb); verb.connect(A.destination);

    // pump body tone
    pumpOsc = A.createOscillator(); pumpOsc.type="sawtooth"; pumpOsc.frequency.value=58;
    var pf = A.createBiquadFilter(); pf.type="lowpass"; pf.frequency.value=220; pf.Q.value=3;
    pumpGain = A.createGain(); pumpGain.gain.value=0.09;
    pumpOsc.connect(pf); pf.connect(pumpGain); pumpGain.connect(master); pumpOsc.start();

    // blade-passing tone
    bladeOsc = A.createOscillator(); bladeOsc.type="square"; bladeOsc.frequency.value=410;
    var bf = A.createBiquadFilter(); bf.type="bandpass"; bf.frequency.value=430; bf.Q.value=8;
    bladeGain = A.createGain(); bladeGain.gain.value=0.028;
    bladeOsc.connect(bf); bf.connect(bladeGain); bladeGain.connect(master); bladeOsc.start();

    // impingement broadband
    hissSrc = A.createBufferSource(); hissSrc.buffer = noiseBuf(A,2.2); hissSrc.loop=true;
    hissFilt = A.createBiquadFilter(); hissFilt.type="bandpass"; hissFilt.frequency.value=3400; hissFilt.Q.value=0.7;
    hissGain = A.createGain(); hissGain.gain.value=0.05;
    hissSrc.connect(hissFilt); hissFilt.connect(hissGain); hissGain.connect(master); hissSrc.start();

    // beyond the door: hood, and two people with no words
    roomGain = A.createGain(); roomGain.gain.value=0.028;
    var rs = A.createBufferSource(); rs.buffer=noiseBuf(A,3.1); rs.loop=true;
    var rf = A.createBiquadFilter(); rf.type="lowpass"; rf.frequency.value=520;
    rs.connect(rf); rf.connect(roomGain); roomGain.connect(A.destination); rs.start();
    voices();

    master.gain.setTargetAtTime(0.85, A.currentTime, 0.9);
  }
  function voices(){
    if(!A) return;
    var t = A.currentTime + 2 + Math.random()*9;
    var n = 2 + (Math.random()*4|0);
    for(var i=0;i<n;i++){
      var o = A.createOscillator(); o.type="sawtooth";
      var base = 95 + Math.random()*90;
      o.frequency.setValueAtTime(base, t);
      o.frequency.linearRampToValueAtTime(base*(0.8+Math.random()*0.45), t+0.16);
      var f = A.createBiquadFilter(); f.type="bandpass";
      f.frequency.value = 400+Math.random()*700; f.Q.value=2.2;
      var g = A.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.012+Math.random()*0.012, t+0.05);
      g.gain.linearRampToValueAtTime(0, t+0.19);
      o.connect(f); f.connect(g); g.connect(A.destination);
      o.start(t); o.stop(t+0.24);
      t += 0.2+Math.random()*0.25;
    }
    setTimeout(voices, 7000+Math.random()*12000);
  }
  return {
    init: init,
    resume: function(){ if(A && A.state==="suspended") A.resume(); },
    running: function(){ return started; },
    frame: function(rpm, aer, P, vapor){
      if(!started) return;
      var t = A.currentTime;
      var imp = Math.abs(ARM[0].w)*60/6.2831853;
      var bpf = Math.max(40, 29.2*(1+pumpCmd*0.46)*(1-S.wear*0.1)*6);
      pumpOsc.frequency.setTargetAtTime(52+bpf*0.16, t, 0.08);
      bladeOsc.frequency.setTargetAtTime(bpf*1.0 + 260, t, 0.06);
      // aerated water: thin and gargly, and it loses head audibly
      var thin = 1 - Math.min(0.8, aer*2.2);
      pumpGain.gain.setTargetAtTime(0.085*thin + aer*0.05, t, 0.1);
      bladeGain.gain.setTargetAtTime(0.03*thin, t, 0.1);
      if(aer>0.02){
        pumpOsc.frequency.setTargetAtTime(52+bpf*0.16 + Math.sin(t*23)*9*aer*14, t, 0.02);
      }
      // impingement colour follows droplet size distribution
      var coh = Math.max(0.05, Math.min(1, P/22));
      hissFilt.frequency.setTargetAtTime(900 + coh*5200 - vapor*700, t, 0.12);
      hissFilt.Q.setTargetAtTime(0.5 + coh*1.4, t, 0.2);
      hissGain.gain.setTargetAtTime(0.028 + coh*0.075*thin, t, 0.15);
    },
    tap: function(d, z){
      if(!started) return;
      var t = A.currentTime;
      if(t-lastTap < 0.02) return; lastTap=t;
      var o = A.createOscillator(); o.type="triangle";
      o.frequency.setValueAtTime(2200/Math.max(0.8,d), t);
      o.frequency.exponentialRampToValueAtTime(600/Math.max(0.8,d), t+0.03);
      var g = A.createGain();
      g.gain.setValueAtTime(Math.min(0.16, 0.02*d), t);
      g.gain.exponentialRampToValueAtTime(0.0005, t+0.05);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
    },
    ring: function(f, amp){
      if(!started) return;
      var t = A.currentTime;
      if(t-lastRing < 0.05) return; lastRing=t;
      var o = A.createOscillator(); o.type="sine"; o.frequency.value=f;
      var o2 = A.createOscillator(); o2.type="sine"; o2.frequency.value=f*2.76;
      var g = A.createGain();
      g.gain.setValueAtTime(0.0, t);
      g.gain.linearRampToValueAtTime(0.045*amp, t+0.003);
      g.gain.exponentialRampToValueAtTime(0.0004, t+0.42);
      var g2 = A.createGain(); g2.gain.value=0.3;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
      o.start(t); o2.start(t); o.stop(t+0.45); o2.stop(t+0.45);
    },
    impinge: function(){ /* colour handled in frame() */ },
    scrub: function(amt){
      if(!started) return;
      var t=A.currentTime;
      var s = A.createBufferSource(); s.buffer = noiseBuf(A,0.06);
      var f = A.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600;
      var g = A.createGain(); g.gain.setValueAtTime(Math.min(0.09, amt*45), t);
      g.gain.exponentialRampToValueAtTime(0.0004, t+0.05);
      s.connect(f); f.connect(g); g.connect(master); s.start(t);
    },
    solenoid: function(){
      if(!started) return;
      var t=A.currentTime;
      var s=A.createBufferSource(); s.buffer=noiseBuf(A,0.02);
      var f=A.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1750; f.Q.value=5;
      var g=A.createGain(); g.gain.setValueAtTime(0.16,t);
      g.gain.exponentialRampToValueAtTime(0.0004,t+0.025);
      s.connect(f); f.connect(g); g.connect(master); s.start(t);
    },
    contactor: function(){
      if(!started) return;
      var t=A.currentTime;
      var s=A.createBufferSource(); s.buffer=noiseBuf(A,0.03);
      var f=A.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
      var g=A.createGain(); g.gain.setValueAtTime(0.11,t);
      g.gain.exponentialRampToValueAtTime(0.0004,t+0.05);
      s.connect(f); f.connect(g); g.connect(master); s.start(t);
    },
    doorGasket: function(){
      if(!started) return;
      var t=A.currentTime;
      var o=A.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(180,t);
      o.frequency.exponentialRampToValueAtTime(52,t+0.18);
      var g=A.createGain(); g.gain.setValueAtTime(0.07,t);
      g.gain.exponentialRampToValueAtTime(0.0004,t+0.2);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.22);
    },
    rackDown: function(){
      if(!started) return;
      var t=A.currentTime+0.25;
      for(var i=0;i<3;i++){
        var s=A.createBufferSource(); s.buffer=noiseBuf(A,0.09);
        var f=A.createBiquadFilter(); f.type="bandpass";
        f.frequency.value=700+i*520; f.Q.value=1.4;
        var g=A.createGain(); g.gain.setValueAtTime(0.07-i*0.018,t+i*0.07);
        g.gain.exponentialRampToValueAtTime(0.0004,t+i*0.07+0.1);
        s.connect(f); f.connect(g); g.connect(A.destination); s.start(t+i*0.07);
      }
    }
  };
})();

// ---------------------------------------------------------------
// POINTER — no cursor, only a disturbance and a wet shadow.
// ---------------------------------------------------------------
var ptr = { on:false, x:0, y:0, px:0, py:0, wet:0, vx:0, hold:false, holdT:0 };
function pxy(e){
  var r = cv.getBoundingClientRect();
  var t = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
var dragStartY = 0, dragStartT = 150, dragging=false;
cv.addEventListener("pointerdown", function(e){
  audio.init(); audio.resume();
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  var p = pxy(e);
  ptr.on=true; ptr.x=p.x; ptr.y=p.y; ptr.px=p.x; ptr.py=p.y;
  ptr.hold=true; ptr.holdT=0;
  dragStartY = p.y; dragStartT = sumpT; dragging=true;
  e.preventDefault();
}, {passive:false});
window.addEventListener("pointermove", function(e){
  var p = pxy(e);
  var r = cv.getBoundingClientRect();
  ptr.on = (p.x>=0 && p.y>=0 && p.x<=r.width && p.y<=r.height);
  ptr.vx = p.x - ptr.x;
  ptr.x=p.x; ptr.y=p.y;
  if(dragging){
    var dy = p.y - dragStartY;
    sumpT = Math.max(112, Math.min(168, dragStartT - dy*0.16));
  }
  // scrub sideways across a wash arm
  if(Math.abs(ptr.vx) > 5) scrubAtPointer(Math.abs(ptr.vx)*0.012);
}, {passive:true});
window.addEventListener("pointerup", function(){ ptr.hold=false; dragging=false; });
window.addEventListener("pointercancel", function(){ ptr.hold=false; dragging=false; });
window.addEventListener("pointerleave", function(){ ptr.on=false; });

function scrubAtPointer(strength){
  // find nozzles whose projected position is near the pointer
  for(var i=0;i<NOZ.length;i++){
    var n = NOZ[i];
    var arm = ARM[n.arm];
    var ca=Math.cos(arm.th)*n.side, sa=Math.sin(arm.th)*n.side;
    var pr = proj(n.r*ca, n.y+n.r*sa*0.24, n.z+n.r*sa*0.86);
    var dx=pr.x-ptr.x, dy=pr.y-ptr.y;
    if(dx*dx+dy*dy < (LAY.sc*0.06)*(LAY.sc*0.06)){
      scrubNozzle(i, 0.016, strength);
    }
  }
}

// keyboard, first class
var keys = {};
window.addEventListener("keydown", function(e){
  audio.init(); audio.resume();
  keys[e.key]=true;
  if(e.key===" "){ e.preventDefault(); }
  if(e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="ArrowLeft"||e.key==="ArrowRight") e.preventDefault();
});
window.addEventListener("keyup", function(e){ keys[e.key]=false; });

function stepInput(dt){
  if(keys["ArrowUp"]) sumpT = Math.min(168, sumpT + 9*dt);
  if(keys["ArrowDown"]) sumpT = Math.max(112, sumpT - 9*dt);
  if(keys["ArrowLeft"]) rack.targetZ = Math.max(14.5, rack.targetZ - 3.2*dt);
  if(keys["ArrowRight"]) rack.targetZ = Math.min(26.5, rack.targetZ + 3.2*dt);
  rack.z += (rack.targetZ - rack.z)*Math.min(1, dt*6);
  var held = (keys[" "]===true) || ptr.hold;
  pumpCmd += ((held?1:0) - pumpCmd)*Math.min(1, dt*3.4);
  if(held){
    ptr.holdT += dt;
    // running hard whips the sump; aeration climbs with rinse-aid surfactant
    var surfy = 1.0/(1+S.det*0.3);
    foam = Math.min(0.5, foam + dt*0.055*surfy*pumpCmd);
  } else {
    foam = Math.max(0, foam - dt*0.10);
  }
  for(var i=1;i<=8;i++){
    if(keys[String(i)]) scrubNozzle(i-1, dt, 1.0);
  }
}

// ---------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------
var flick = 0;
function render(dt){
  var vap = Math.min(1, chamberVapor*0.72);
  // lamp is being crossed by jets several times a second
  var lampBlock = 0;
  for(var a=0;a<2;a++){
    var ph = (ARM[a].th*2)%6.2831853;
    lampBlock += Math.max(0, Math.sin(ph))*0.34;
  }
  flick += ((1 - lampBlock*0.5) - flick)*Math.min(1, dt*22);
  var lamp = 0.62 + 0.38*flick;

  // ---- chamber: 304 stainless, coved, seamless
  var g = ctx.createRadialGradient(LAY.cx, LAY.cy-H*0.22, 6, LAY.cx, LAY.cy, Math.max(W,H)*0.8);
  var k = lamp;
  g.addColorStop(0,   mix("#cdd3d4","#20272a", 1-k));
  g.addColorStop(0.34,mix("#8b9497","#20272a", 1-k*0.9));
  g.addColorStop(0.70,mix("#4e585c","#20272a", 1-k*0.75));
  g.addColorStop(1,   "#20272a");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // brushed grain on the wet steel — honest specular streaks
  ctx.save();
  ctx.globalAlpha = 0.055*lamp;
  ctx.strokeStyle = "#cdd3d4";
  ctx.lineWidth = 1;
  for(var i=0;i<46;i++){
    var yy = (i/46)*H + Math.sin(i*4.7)*3;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W, yy + Math.sin(i)*2); ctx.stroke();
  }
  ctx.restore();

  // corner behind the rack rail, near black
  ctx.save();
  var cg = ctx.createLinearGradient(0,0,W*0.22,H*0.3);
  cg.addColorStop(0,"rgba(32,39,42,0.95)"); cg.addColorStop(1,"rgba(32,39,42,0)");
  ctx.fillStyle=cg; ctx.fillRect(0,0,W*0.3,H*0.4);
  var cg2 = ctx.createLinearGradient(W,0,W*0.76,H*0.3);
  cg2.addColorStop(0,"rgba(32,39,42,0.95)"); cg2.addColorStop(1,"rgba(32,39,42,0)");
  ctx.fillStyle=cg2; ctx.fillRect(W*0.7,0,W*0.3,H*0.4);
  ctx.restore();

  // the lamp itself, sealed behind toughened glass at the top of the back wall
  var lp = proj(0, 12.2, 3.6);
  ctx.save();
  ctx.globalAlpha = 0.9*lamp;
  ctx.fillStyle = "#cdd3d4";
  ctx.beginPath();
  ctx.ellipse(lp.x, lp.y, LAY.sc*0.055, LAY.sc*0.020, 0, 0, 6.283);
  ctx.fill();
  ctx.globalAlpha = 0.28*lamp;
  ctx.strokeStyle="#eef4f5"; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.ellipse(lp.x, lp.y, LAY.sc*0.062, LAY.sc*0.026, 0, 0, 6.283);
  ctx.stroke();
  ctx.restore();

  drawSumpScale(lamp);
  drawArm(1, lamp);
  drawJets(1, lamp);
  drawSteam(vap, 0.55);
  drawRack(lamp, vap);
  drawJets(0, lamp);
  drawArm(0, lamp);
  drawDroplets(lamp, vap);
  drawCeiling(lamp);
  drawSteam(vap, 0.45);
  drawGasket(lamp);
  drawPointerDisturbance(lamp);
}

function mix(a,b,t){
  t = Math.max(0,Math.min(1,t));
  var ar=parseInt(a.substr(1,2),16), ag=parseInt(a.substr(3,2),16), ab=parseInt(a.substr(5,2),16);
  var br=parseInt(b.substr(1,2),16), bg=parseInt(b.substr(3,2),16), bb=parseInt(b.substr(5,2),16);
  return "rgb("+((ar+(br-ar)*t)|0)+","+((ag+(bg-ag)*t)|0)+","+((ab+(bb-ab)*t)|0)+")";
}

// mineral bloom along the waterline at the sump lip: horizontal bands,
// chalky, opaque, reflects nothing. it only ever gets thicker.
function drawSumpScale(lamp){
  var total = 0;
  for(var i=0;i<NOZ.length;i++) total += NOZ[i].hard;
  var bands = 3 + Math.min(11, Math.floor(total*3.4));
  var lipY = proj(0,-11.6, 12).y;
  ctx.save();
  for(var b=0;b<bands;b++){
    var t = b/bands;
    var yy = lipY + b*2.4;
    ctx.globalAlpha = 0.30 + 0.5*(1-t);
    ctx.fillStyle = "#d9d2c2";
    var h = 1.2 + (1-t)*2.6;
    ctx.beginPath();
    for(var x=0;x<=W;x+=9){
      var w = Math.sin(x*0.031 + b*1.7)*1.5 + Math.sin(x*0.011+b)*2.2;
      if(x===0) ctx.moveTo(x, yy+w); else ctx.lineTo(x, yy+w);
    }
    ctx.lineTo(W, yy+h+5); ctx.lineTo(0, yy+h+5); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawArm(a, lamp){
  var arm = ARM[a];
  var pts = [];
  for(var s=-1;s<=1;s+=2){
    for(var t=0;t<=1.0001;t+=0.25){
      var r = t*11.2*s;
      var ca=Math.cos(arm.th), sa=Math.sin(arm.th);
      pts.push(proj(r*ca, arm.y + r*sa*0.24, arm.z + r*sa*0.86));
    }
  }
  ctx.save();
  ctx.lineCap="round";
  ctx.strokeStyle = mix("#8b9497","#20272a", 1-lamp*0.8);
  ctx.lineWidth = Math.max(2, LAY.sc*0.012);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.globalAlpha=0.45*lamp;
  ctx.strokeStyle="#cdd3d4"; ctx.lineWidth=Math.max(1,LAY.sc*0.004);
  ctx.stroke();
  ctx.restore();

  // bearing hub — the rack-green chip
  var hub = proj(0, arm.y, arm.z);
  ctx.save();
  ctx.fillStyle="#4a7a63";
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(hub.x, hub.y, Math.max(3, LAY.sc*0.016), 0, 6.283);
  ctx.fill();
  ctx.restore();
}

// a jet renders as forward-scattered light: bright and coherent near
// the nozzle, dimming and going granular past the breakup length.
function drawJets(armIdx, lamp){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for(var i=0;i<NOZ.length;i++){
    var n = NOZ[i];
    if(n.arm!==armIdx) continue;
    var blk = Math.min(0.94, n.hard+n.loose);
    if(blk>0.90) continue;
    var arm = ARM[n.arm];
    var ca=Math.cos(arm.th)*n.side, sa=Math.sin(arm.th)*n.side;
    var ox=n.r*ca, oy=n.y+n.r*sa*0.24, oz=n.z+n.r*sa*0.86;
    var Lb = breakupLength(n, i);
    var base = (n.arm===0)?1:-1;
    var v = sys.v[i];
    var bright = Math.min(1, v/26)*(1-blk);
    var steps = 12;
    for(var e=-1;e<=1;e+=1){
      var fa = e*n.fan*0.5;
      var dirx = ca*Math.cos(fa)*0.55 + Math.sin(fa)*0.42;
      var diry = base*Math.cos(fa*0.5);
      var dirz = sa*0.30 - n.cant*base*0.2;
      var L = Math.sqrt(dirx*dirx+diry*diry+dirz*dirz)||1;
      dirx/=L; diry/=L; dirz/=L;
      ctx.beginPath();
      var started=false;
      for(var st=0; st<=steps; st++){
        var tt = st/steps;
        var dist = tt*Math.min(16, Lb*1.7);
        var px = ox+dirx*dist, py=oy+diry*dist - dist*dist*0.012, pz=oz+dirz*dist;
        var pr = proj(px,py,pz);
        if(!started){ ctx.moveTo(pr.x,pr.y); started=true; }
        else ctx.lineTo(pr.x,pr.y);
      }
      var coherentFrac = Math.min(1, Lb/16);
      var gr = ctx.createLinearGradient(proj(ox,oy,oz).x, proj(ox,oy,oz).y,
        proj(ox+dirx*16, oy+diry*16, oz+dirz*16).x, proj(ox+dirx*16, oy+diry*16, oz+dirz*16).y);
      gr.addColorStop(0, "rgba(238,244,245,"+(0.50*bright*lamp).toFixed(3)+")");
      gr.addColorStop(Math.min(0.95,coherentFrac), "rgba(238,244,245,"+(0.18*bright*lamp).toFixed(3)+")");
      gr.addColorStop(1, "rgba(200,212,214,0)");
      ctx.strokeStyle = gr;
      ctx.lineWidth = Math.max(1, LAY.sc*0.006*(1+bright)*(e===0?1.6:0.8));
      ctx.stroke();
    }
    // the sheet body between the fan edges
    ctx.globalAlpha = 0.10*bright*lamp;
    ctx.fillStyle="#eef4f5";
    ctx.beginPath();
    var pr0 = proj(ox,oy,oz);
    ctx.moveTo(pr0.x,pr0.y);
    for(var e2=-1;e2<=1;e2+=0.34){
      var fa2=e2*n.fan*0.5;
      var d2x = ca*Math.cos(fa2)*0.55 + Math.sin(fa2)*0.42;
      var d2y = base*Math.cos(fa2*0.5);
      var d2z = sa*0.30 - n.cant*base*0.2;
      var L2=Math.sqrt(d2x*d2x+d2y*d2y+d2z*d2z)||1;
      var dd = Math.min(13, Lb);
      var pp = proj(ox+d2x/L2*dd, oy+d2y/L2*dd - dd*dd*0.012, oz+d2z/L2*dd);
      ctx.lineTo(pp.x,pp.y);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawDroplets(lamp, vap){
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<drops.length;i++){
    var p = drops[i];
    var pr = proj(p.x,p.y,p.z);
    if(pr.x<-30||pr.x>W+30||pr.y<-30||pr.y>H+30) continue;
    var rad = Math.max(0.5, p.d*pr.s*0.012);
    var att = Math.exp(-Math.max(0,(p.z-12))*vap*0.08);
    var al = (p.coh? 0.42 : 0.20)*lamp*att;
    ctx.globalAlpha = Math.min(0.9, al);
    ctx.fillStyle = p.coh ? "#eef4f5" : "#b9c3c5";
    ctx.beginPath(); ctx.arc(pr.x,pr.y,rad,0,6.283); ctx.fill();
    // hard tiny specular at the lamp's angle
    if(rad>1.5 && p.coh){
      ctx.globalAlpha = Math.min(1, 0.7*lamp);
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(pr.x-rad*0.3, pr.y-rad*0.35, Math.max(0.4,rad*0.28),0,6.283); ctx.fill();
    }
  }
  ctx.restore();
}

function drawCeiling(lamp){
  ctx.save();
  for(var i=0;i<ceilingDrops.length;i++){
    var cd = ceilingDrops[i];
    var pr = proj(cd.x, cd.y, cd.z);
    var rad = Math.max(1, cd.d*pr.s*0.013);
    ctx.globalAlpha = 0.5*lamp;
    ctx.fillStyle="#c6d0d2";
    ctx.beginPath(); ctx.arc(pr.x,pr.y,rad,0,6.283); ctx.fill();
    ctx.globalAlpha=0.85*lamp; ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(pr.x-rad*0.32,pr.y-rad*0.34, Math.max(0.4,rad*0.25),0,6.283); ctx.fill();
  }
  ctx.restore();
}

// steam: a real optical depth, not a haze layer chosen by eye
var steamPuffs = [];
for(var sp=0;sp<52;sp++){
  steamPuffs.push({x:(Math.random()-0.5)*26, y:2+Math.random()*11, z:6+Math.random()*22,
                   r:2+Math.random()*5, ph:Math.random()*6.28, sp:0.3+Math.random()*0.7});
}
function drawSteam(vap, share){
  if(vap<0.03) return;
  ctx.save();
  for(var i=0;i<steamPuffs.length;i++){
    var s = steamPuffs[i];
    if((i%2===0) !== (share>0.5)) continue;
    var pr = proj(s.x, s.y + Math.sin(s.ph)*1.4, s.z);
    var od = vap * (1 - Math.max(0,(13-s.y))*0.045) * (0.6 + s.z*0.03);
    var al = 1 - Math.exp(-od*0.85);
    if(al<0.01) continue;
    ctx.globalAlpha = Math.min(0.55, al*0.45);
    ctx.fillStyle = "#8e9294";
    var rr = s.r*pr.s*0.9;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, rr, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
function stepSteam(dt){
  for(var i=0;i<steamPuffs.length;i++){
    var s = steamPuffs[i];
    s.ph += dt*s.sp;
    s.y += dt*(0.4+chamberVapor*1.1)*s.sp;
    s.x += Math.sin(s.ph*0.7)*dt*0.5;
    if(s.y>13.4){ s.y = 1.5+Math.random()*2; s.x=(Math.random()-0.5)*26; s.z=6+Math.random()*22; }
  }
}

// the door gasket at the bottom of frame — rack-green chip
function drawGasket(lamp){
  ctx.save();
  ctx.fillStyle="#4a7a63";
  ctx.globalAlpha=0.85;
  var gy = H - Math.max(9, H*0.028);
  ctx.beginPath();
  ctx.moveTo(0, gy+6);
  for(var x=0;x<=W;x+=14){
    ctx.lineTo(x, gy + Math.sin(x*0.02)*2.0);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=0.22*lamp; ctx.fillStyle="#cdd3d4";
  ctx.fillRect(0, gy-1.5, W, 1.6);
  ctx.restore();
}

// ---------------------------------------------------------------
// the rack + the glassware + the lid
// ---------------------------------------------------------------
function drawRack(lamp, vap){
  var order = PIECES.slice().sort(function(a,b){
    return (rack.z+b.zoff)-(rack.z+a.zoff);
  });
  // rack frame + pegs, polypropylene grey-green
  drawRackFrame(lamp, vap);
  for(var i=0;i<order.length;i++){
    var pc = order[i];
    if(pc.lid) drawLid(pc, lamp, vap);
    else drawGlass(pc, lamp, vap);
  }
  // splats decay
  for(var s=splats.length-1;s>=0;s--){
    splats[s].a -= 0.055;
    if(splats[s].a<=0) splats.splice(s,1);
  }
}

function drawRackFrame(lamp, vap){
  ctx.save();
  ctx.strokeStyle="#4a7a63";
  ctx.lineWidth=Math.max(1.5, LAY.sc*0.006);
  for(var ry=0; ry<4; ry++){
    var z = rack.z + (ry-1.5)*2.9;
    var att = Math.exp(-Math.max(0,(z-12))*vap*0.10);
    ctx.globalAlpha = (0.55*lamp)*att;
    var a = proj(-8.6,-8.4,z), b = proj(8.6,-8.4,z);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  // pegs
  ctx.fillStyle="#4a7a63";
  for(var i=0;i<PIECES.length;i++){
    var pc = PIECES[i];
    var z = rack.z+pc.zoff;
    var pr = proj(pc.x, -8.55, z);
    var att2 = Math.exp(-Math.max(0,(z-12))*vap*0.10);
    ctx.globalAlpha=(0.72*lamp)*att2;
    ctx.beginPath();
    ctx.ellipse(pr.x, pr.y, Math.max(1.5,pr.s*0.55), Math.max(0.8,pr.s*0.22),0,0,6.283);
    ctx.fill();
  }
  ctx.restore();
}

// soda-lime glass: essentially invisible except rims and stems.
function drawGlass(pc, lamp, vap){
  var z = rack.z + pc.zoff;
  var att = Math.exp(-Math.max(0,(z-12))*vap*0.11);
  if(att<0.03) return;
  var baseY = -8.2;
  var bot = proj(pc.x, baseY, z);
  var top = proj(pc.x + pc.h*pc.tilt*0.34, baseY+pc.h, z);
  var rw = pc.r*bot.s;
  var tilt = (top.x-bot.x);

  ctx.save();
  // the body: refraction only. a shifted reflection and nothing else.
  ctx.globalAlpha = 0.10*lamp*att;
  ctx.fillStyle = "#8b9497";
  ctx.beginPath();
  ctx.moveTo(bot.x-rw*0.55, bot.y);
  ctx.lineTo(top.x-rw, top.y);
  ctx.lineTo(top.x+rw, top.y);
  ctx.lineTo(bot.x+rw*0.55, bot.y);
  ctx.closePath(); ctx.fill();

  // edge refraction: bright curved lines at rim and stem
  ctx.globalAlpha = 0.72*lamp*att;
  ctx.strokeStyle="#dfe6e7";
  ctx.lineWidth = Math.max(1, bot.s*0.055);
  ctx.beginPath();
  ctx.ellipse(top.x, top.y, rw, rw*0.30, 0, 0, 6.283);
  ctx.stroke();
  ctx.globalAlpha = 0.35*lamp*att;
  ctx.beginPath();
  ctx.moveTo(bot.x-rw*0.55, bot.y); ctx.lineTo(top.x-rw, top.y);
  ctx.moveTo(bot.x+rw*0.55, bot.y); ctx.lineTo(top.x+rw, top.y);
  ctx.lineWidth = Math.max(0.8, bot.s*0.032);
  ctx.stroke();
  if(pc.stem){
    ctx.globalAlpha=0.55*lamp*att;
    ctx.lineWidth=Math.max(1, bot.s*0.04);
    ctx.beginPath();
    ctx.moveTo(bot.x, bot.y);
    ctx.lineTo(bot.x + tilt*0.3, bot.y - pc.h*bot.s*0.30);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(bot.x, bot.y, rw*0.7, rw*0.22, 0, 0, 6.283);
    ctx.stroke();
  }

  // SOIL: a film of fat is a very slightly yellowed, slightly hazy region.
  // invisible until water hits it and beads.
  var avgSoil=0; for(var c=0;c<70;c++) avgSoil+=pc.soil[c];
  avgSoil/=70;
  if(avgSoil>0.02){
    ctx.globalAlpha = Math.min(0.14, avgSoil*0.11)*lamp*att;
    ctx.fillStyle="#cfc9a8";
    ctx.beginPath();
    ctx.moveTo(bot.x-rw*0.55, bot.y);
    ctx.lineTo(top.x-rw, top.y);
    ctx.lineTo(top.x+rw, top.y);
    ctx.lineTo(bot.x+rw*0.55, bot.y);
    ctx.closePath(); ctx.fill();
  }

  // FILM: sheeting renders as almost nothing but a shifted reflection
  // with a slightly warmer edge at the draining bead.
  var avgFilm=0; for(var c2=0;c2<70;c2++) avgFilm+=pc.film[c2];
  avgFilm/=70;
  if(avgFilm>0.005){
    ctx.globalAlpha = Math.min(0.30, avgFilm*0.9)*lamp*att;
    ctx.strokeStyle="#cdd3d4";
    ctx.lineWidth=Math.max(0.8, bot.s*0.024);
    ctx.beginPath();
    ctx.moveTo(top.x-rw*0.72, top.y+rw*0.2);
    ctx.lineTo(bot.x-rw*0.42, bot.y);
    ctx.stroke();
    // the draining bead at the bottom
    ctx.globalAlpha = Math.min(0.5, avgFilm*1.6)*lamp*att;
    ctx.strokeStyle="#e6e2d2";
    ctx.lineWidth=Math.max(1, bot.s*0.045);
    ctx.beginPath();
    ctx.ellipse(bot.x, bot.y, rw*0.56, rw*0.18, 0, 0.15, Math.PI-0.15);
    ctx.stroke();
  }

  // RIVULETS: genuine running lines that merged where they touched
  ctx.globalAlpha = 0.5*lamp*att;
  for(var j=0;j<pc.rivs.length;j++){
    var rv = pc.rivs[j];
    var ux = bot.x + (rv.u-0.5)*rw*1.9;
    var y0 = top.y + rv.v*(bot.y-top.y);
    var y1 = top.y + Math.min(1,rv.v+rv.len*0.5)*(bot.y-top.y);
    ctx.strokeStyle="#dde4e5";
    ctx.lineWidth = Math.max(0.7, rv.w*bot.s*22);
    ctx.beginPath();
    ctx.moveTo(ux, y0);
    ctx.bezierCurveTo(ux+rv.w*80, (y0+y1)/2, ux-rv.w*70, (y0+y1)/2, ux+ (rv.u-0.5)*2, y1);
    ctx.stroke();
    // specular on the thickest part
    ctx.globalAlpha=0.85*lamp*att;
    ctx.fillStyle="#ffffff";
    ctx.fillRect(ux-0.5, y1-1.2, 1.2, 2.2);
    ctx.globalAlpha=0.5*lamp*att;
  }

  // BEADS: a droplet on glass renders as a real lens. it inverts and
  // compresses what's behind it, carries a hard specular, and throws
  // a caustic onto the surface under it.
  for(var b=0;b<pc.beads.length;b++){
    var bd = pc.beads[b];
    var bx = bot.x + (bd.u-0.5)*rw*1.9;
    var by = top.y + bd.v*(bot.y-top.y);
    var br = bd.r*bot.s*0.6;
    if(br<0.5) continue;
    // lens: sample the background by drawing an inverted compressed slice
    ctx.save();
    ctx.beginPath(); ctx.arc(bx,by,br,0,6.283); ctx.clip();
    ctx.globalAlpha = 0.55*lamp*att;
    ctx.translate(bx,by); ctx.scale(-0.42,-0.42); ctx.translate(-bx,-by);
    ctx.fillStyle = mix("#cdd3d4","#4e585c", 0.45);
    ctx.fillRect(bx-br*3, by-br*3, br*6, br*2.6);
    ctx.fillStyle = mix("#4e585c","#20272a", 0.4);
    ctx.fillRect(bx-br*3, by-br*0.4, br*6, br*3.4);
    ctx.restore();
    // rim
    ctx.globalAlpha=0.4*lamp*att;
    ctx.strokeStyle="#c7d0d2"; ctx.lineWidth=Math.max(0.6,br*0.16);
    ctx.beginPath(); ctx.arc(bx,by,br,0,6.283); ctx.stroke();
    // hard specular
    ctx.globalAlpha=Math.min(1,0.92*lamp);
    ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(bx-br*0.32, by-br*0.36, Math.max(0.45, br*0.22),0,6.283); ctx.fill();
    // caustic under it
    ctx.globalAlpha=0.30*lamp*att;
    ctx.fillStyle="#eef4f5";
    ctx.beginPath(); ctx.ellipse(bx+br*0.2, by+br*1.05, br*0.44, br*0.20,0,0,6.283); ctx.fill();
  }

  // splash marks
  ctx.globalAlpha=1;
  for(var s=0;s<splats.length;s++){
    var sp = splats[s];
    if(PIECES[sp.pc]!==pc) continue;
    var sx = bot.x + (sp.u-0.5)*rw*1.9;
    var sy = top.y + sp.v*(bot.y-top.y);
    ctx.globalAlpha = sp.a*0.6*lamp*att;
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(sx,sy, sp.r*bot.s*0.5*(2-sp.a), 0, 6.283); ctx.stroke();
  }
  ctx.restore();
}

// THE LID. opaque stainless. a hard wet shadow across four glasses.
// a rolled rim holding a reservoir that never drains and sloshes.
// high thermal mass: it comes out streaming.
function drawLid(pc, lamp, vap){
  var z = rack.z + pc.zoff;
  var att = Math.exp(-Math.max(0,(z-12))*vap*0.11);
  var baseY = -8.2;
  var pr = proj(pc.x, baseY+0.55, z);
  var rw = pc.r*pr.s;
  ctx.save();
  // hard wet shadow thrown back across the four behind it
  ctx.globalAlpha = 0.46*lamp;
  ctx.fillStyle="#20272a";
  var farZ = z + 6.2;
  var f0 = proj(pc.x-pc.r*1.05, baseY, farZ);
  var f1 = proj(pc.x+pc.r*1.05, baseY+5.4, farZ);
  ctx.beginPath();
  ctx.moveTo(pr.x-rw*0.98, pr.y);
  ctx.lineTo(f0.x, f1.y);
  ctx.lineTo(f1.x, f1.y);
  ctx.lineTo(pr.x+rw*0.98, pr.y);
  ctx.closePath(); ctx.fill();

  // the sheet itself: opaque stainless, hard specular
  ctx.globalAlpha = 0.96*att;
  var lg = ctx.createLinearGradient(pr.x-rw, pr.y-8, pr.x+rw, pr.y+8);
  lg.addColorStop(0, mix("#4e585c","#20272a", 0.30));
  lg.addColorStop(0.42, mix("#cdd3d4","#8b9497", 1-lamp));
  lg.addColorStop(0.62, mix("#8b9497","#4e585c", 0.3));
  lg.addColorStop(1, "#3a4448");
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.ellipse(pr.x, pr.y, rw, rw*0.30, 0, 0, 6.283);
  ctx.fill();
  // rolled rim
  ctx.globalAlpha=0.85*att*lamp;
  ctx.strokeStyle="#cdd3d4"; ctx.lineWidth=Math.max(1.4, pr.s*0.07);
  ctx.beginPath(); ctx.ellipse(pr.x,pr.y,rw,rw*0.30,0,0,6.283); ctx.stroke();

  // the reservoir in the rim. it sloshes with every arm pass and never drains.
  var slosh = Math.sin(pc.rimPhase + ARM[0].th*1.0)*0.5 + Math.sin(ARM[1].th*1.3)*0.25;
  ctx.globalAlpha = Math.min(0.62, pc.rimPool*0.7)*att;
  ctx.fillStyle = mix("#8b9497","#cdd3d4", 0.42);
  ctx.beginPath();
  ctx.ellipse(pr.x + slosh*rw*0.13, pr.y + rw*0.055 + slosh*rw*0.03,
              rw*0.90, rw*0.235, 0, 0, 6.283);
  ctx.fill();
  // specular chip skating on the puddle
  ctx.globalAlpha = Math.min(1, 0.9*lamp)*att;
  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.ellipse(pr.x + slosh*rw*0.42, pr.y - rw*0.03,
              Math.max(1, rw*0.10), Math.max(0.6, rw*0.026), 0, 0, 6.283);
  ctx.fill();

  // it stays below flash-dry, so it is always streaming
  ctx.globalAlpha=0.42*att*lamp;
  ctx.strokeStyle="#dde4e5";
  for(var k=0;k<6;k++){
    var xx = pr.x + (k-2.5)*rw*0.33 + Math.sin(pc.rimPhase+k)*1.4;
    ctx.lineWidth = Math.max(0.7, pr.s*0.025);
    ctx.beginPath();
    ctx.moveTo(xx, pr.y+rw*0.24);
    ctx.lineTo(xx + Math.sin(k*2.1)*2.4, pr.y + rw*0.24 + rw*(0.24+((k*37)%9)*0.045));
    ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------
// pointer disturbance: a wet shadow and a splash pattern, no glyph.
// ---------------------------------------------------------------
function drawPointerDisturbance(lamp){
  if(!ptr.on) return;
  ptr.wet = Math.max(0, ptr.wet - 0.02);
  var R = LAY.sc*0.085;
  ctx.save();
  // the deflection leaves a dry cone behind: a real wet shadow on the glass
  ctx.globalAlpha = Math.min(0.30, 0.10 + ptr.wet*0.28);
  var g = ctx.createRadialGradient(ptr.x, ptr.y, R*0.12, ptr.x, ptr.y, R*1.35);
  g.addColorStop(0,"rgba(32,39,42,0.42)");
  g.addColorStop(0.7,"rgba(32,39,42,0.12)");
  g.addColorStop(1,"rgba(32,39,42,0)");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(ptr.x,ptr.y,R*1.35,0,6.283); ctx.fill();
  // the splash ring where water piles against the obstruction
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha = Math.min(0.55, 0.14 + ptr.wet*0.5)*lamp;
  ctx.strokeStyle="#eef4f5";
  ctx.lineWidth = 1 + ptr.wet*2.2;
  ctx.beginPath();
  for(var a=0;a<6.283;a+=0.22){
    var rr = R*(0.72 + Math.sin(a*5 + perf*7)*0.10 + ptr.wet*0.16);
    var px = ptr.x + Math.cos(a)*rr, py = ptr.y + Math.sin(a)*rr*0.86;
    if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------
var last = performance.now(), perf = 0, acc=0, saveT=0, solT=0, contT=0;
function loop(now){
  var dt = Math.min(0.045, (now-last)/1000);
  last = now; perf += dt;

  stepInput(dt);
  solveSystem();
  stepArms(dt);
  stepVapor(dt);
  stepSteam(dt);
  stepLime(dt);

  // emit from every unblocked nozzle
  for(var i=0;i<NOZ.length;i++){
    var n = NOZ[i];
    if(Math.min(0.94, n.hard+n.loose) > 0.90) continue;
    // the rinse arm only runs in the last stretch of the cycle
    if(n.rinse && cycleT < CYCLE*0.80) continue;
    emitFrom(n, i, dt);
  }
  stepDrops(dt);
  stepFilm(dt);

  cycleT += dt;
  if(cycleT >= CYCLE){ cycleT -= CYCLE; newRack(); }
  // rinse solenoid clacks in
  if(cycleT >= CYCLE*0.80 && cycleT-dt < CYCLE*0.80) audio.solenoid();
  // booster contactor
  contT += dt;
  if(contT > 6.5 + Math.random()*4){ contT=0; audio.contactor(); }

  audio.frame(Math.abs(ARM[0].w)*9.55, foam, sys.P, chamberVapor);
  render(dt);

  saveT += dt;
  if(saveT > 6){ saveT=0; persistSoil(); pushScale(); save(); }

  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------
// go
// ---------------------------------------------------------------
buildNozzles();
buildRack();
resize();
solveSystem();
// the machine has been running; the arms are already up to speed
ARM[0].w = 16*ARM[0].dir; ARM[1].w = -13;
cycleT = (elapsedSinceSeen % CYCLE);
requestAnimationFrame(loop);
window.addEventListener("beforeunload", function(){ persistSoil(); pushScale(); save(); });
document.addEventListener("visibilitychange", function(){ if(document.hidden){ persistSoil(); pushScale(); save(); } });

// a glass loaded upright holds an inch of dirty water for the whole cycle.
// the two on the left of the rinse arm have been limed since March and
// nothing anybody does with a paperclip is going to get them back.
})();
</script>
