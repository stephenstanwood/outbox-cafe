  <meta name="outbox-spec-era" content="1958, right now — a hanging kinetic mobile turning slowly in the double-height arrivals hall of a brand-new modernist regional airport, the terminal's air-conditioning just catching it and setting the arms drifting THIS afternoon, travellers passing underneath with their cases; not a look-back at 'the great age of the mobile' and not a 'nobody hangs these anymore' lament — a real sculpture actually swaying and counter-turning this minute, its shadow wheeling slow across the pale plaster wall behind it as the sun moves.">
  <meta name="outbox-spec-format" content="The entire viewport IS a hanging balanced mobile seen head-on against a plaster wall, edge to edge, SVG shapes strung on thin black wire arms from a single ceiling pivot — and it is a GENUINELY functional torque-and-pendulum sim, not a canned loop: every arm hangs from its fulcrum at the honest balance point of the masses either side, each arm and each dangling shape swings as a real damped pendulum with its own period, and the whole assembly counter-rotates and settles under computed gravity and light air-drift so it never drifts the same way twice. Your cursor is a puff of moving air: sweep across the hall and the nearest shapes genuinely catch it and swing, the motion propagating up the arms to set the whole mobile wheeling. No header, no menu, no chrome, no instructions — just the wire, the shapes, and their slow turning shadow on the wall.">
  <meta name="outbox-spec-subject" content="The plain, entirely practical statics of one hanging mobile — how each wire arm balances a small heavy shape hung close to its fulcrum against a big light shape swung far out, so the fulcrum sits not in the middle but exactly where the two moments cancel; how a whole tree of these balances hangs off one another, each sub-arm a single swinging mass to the arm above it, so a nudge to the lowest leaf ripples all the way up; how the shapes counter-rotate because there's nothing holding their spin, only the twist of the wire slowly unwinding; how a passing draught catches the broadest blade first and the little discs barely at all. Not a metaphor for balance in a life or harmony or holding it all together — literally wire, sheet-metal shapes, a pivot, and the honest torques that decide where everything hangs and how it swings.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the one tiny corner stamp and the one tiny tally — the register is purely the wordless, chin-tipped-up delight of standing under a mobile and watching it decide where to hang: quick-eyed for which arm swings widest, tickled when two shapes drift toward each other and just miss, pleased when your puff of air catches the big blade and the whole tree wheels round after it, watching the slow shadow of the lot slide across the plaster. The balancing is treated as a plain physical fact and a genuine visual pleasure — light, turning, unhurried, alive — NOT reverent, NOT hushed, NOT a slow-down-and-breathe register, NOT mystical, NOT poignant. The closest thing to a voice is the mobile's own steady refusal to hang the same way twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Mid-century sheet-metal shapes in three flat enamel colours — a bold vermilion (#c8352c), a deep petrol-teal (#1f5c6e), and a warm chrome-yellow (#e0a531), plus a couple of matte-black leaf blades (#211d1a) — all strung on hair-thin black wire and hung against a sunlit plaster-cream terminal wall (#efe6d2), each shape casting a soft warm-grey drift-shadow (#c4bba4) that wheels slowly across the plaster as the mobile turns: the bright, hard-lit, flat-enamel-and-daylight look of a painted metal mobile swinging in a big airy modernist lobby.">
  <meta name="outbox-spec-wildcard" content="Exactly one shape in the mobile is a small mirror-polished silver disc (not one of the enamel shapes), and by a quirk of its heavier rim and the wire it hangs on it always slowly rights itself edge-on and settles facing the same fixed direction — catching a hard bright glint off the hall light every time it comes round to that heading, no matter how the rest of the mobile is turning. It is never labelled, never explained, never counted or treated any differently by the sim; it is simply the one shape that always comes home to the same angle, the same silver disc every single visit, for whoever watches long enough to notice.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'the great age of the mobile is over / nobody hangs kinetic sculpture anymore / the lobbies fell still' decline narrative — this is a real mobile swaying in a working terminal RIGHT NOW. NO mobile-as-metaphor-for-balance-in-a-life / harmony / 'holding everything in delicate equilibrium' / interdependence life-lesson framing — it is wire, sheet metal, a pivot, and honest torques, nothing more, and it has nothing to teach you. NO meditative-zen / mindfulness / 'let the slow turning still you / breathe with it' register, and NO mystical / sacred-geometry / cosmic-dance framing of the motion. NO archival / museum / cabinet / drawer / vault / relic framing of the mobile — it is hung and turning, not preserved. NO cryptic-SCP / ominous / 'the disc that always faces the same way is a warning' dread about the mirror shape. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO dry deadpan understatement. NO signal / transmission / frequency / relay framing of anything. NO society / club / cabinet-of-hobbyists scaffolding. And NO instructional UI text, captions, header, footer credits, title overlay, or any narrating voice anywhere on the page beyond the tiny corner stamp and the tiny tally — the piece is otherwise entirely silent and entirely visual.">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Turn Over the Arrivals Hall</title>
<!-- the silver one always comes home to the same heading. stand still a moment and watch. -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe6d2;}
  body{
    background:
      radial-gradient(140% 100% at 74% -8%, #f8f2e2 0%, #f1e8d5 42%, #eadfc7 72%, #e2d6bb 100%);
    font-family:"Courier New",ui-monospace,monospace;
    -webkit-user-select:none;user-select:none;
    cursor:crosshair;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 55%, transparent 55%, rgba(120,108,84,0.10) 100%);
    z-index:1;
  }
  svg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;}
  .stamp,.tally{
    position:fixed;z-index:6;color:#8c836d;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    text-decoration:none;line-height:1.4;
  }
  .stamp{left:12px;bottom:11px;}
  .stamp a{color:#8c836d;text-decoration:none;border-bottom:1px dotted #b3a988;}
  .stamp a:hover{color:#c8352c;border-color:#c8352c;}
  .tally{right:12px;bottom:11px;text-align:right;color:#9a927d;font-size:9px;}
</style>

<body>
<svg id="sky" preserveAspectRatio="xMidYMid meet" viewBox="0 0 820 470" aria-label="a painted sheet-metal mobile turning against a plaster wall">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4ef"/>
      <stop offset="0.45" stop-color="#cfcfc8"/>
      <stop offset="0.7" stop-color="#9c9c95"/>
      <stop offset="1" stop-color="#dcdcd5"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>
  <g id="shadows" filter="url(#blur)"></g>
  <g id="wires"></g>
  <g id="shapes"></g>
  <g id="mount"></g>
</svg>

<div class="stamp"><span>Meridian Field · arr. hall</span> — <a href="/archive">the rest of the wall</a></div>
<div class="tally" id="tally">TIMES THIS MOBILE HAS BEEN SET SWINGING: …</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var INK="#211d1a", SH="#c4bba4";
var G=290, DAMP=0.9963;
var ROOTX=410, ROOTY=52;

var svg=document.getElementById("sky");
var shadowG=document.getElementById("shadows");
var wireG=document.getElementById("wires");
var shapeG=document.getElementById("shapes");
var mountG=document.getElementById("mount");

function mk(tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);return e;}
var RIM={"#c8352c":"#8f231c","#e0a531":"#a9781f"};
function shade(c){return RIM[c]||"#211d1a";}
function bladePath(sz){
  return "M0 "+(-sz*0.6)+" C "+(sz*0.6)+" "+(-sz*0.15)+", "+(sz*0.45)+" "+(sz*0.78)+", 0 "+(sz*1.18)+
         " C "+(-sz*0.45)+" "+(sz*0.78)+", "+(-sz*0.6)+" "+(-sz*0.15)+", 0 "+(-sz*0.6)+" Z";
}

// ---- build the tree: small heavy shape close to the fulcrum, big light one far out ----
function leaf(c){return{kind:"leaf",theta:0,omega:0,spin:(Math.random()-0.5)*0.6,spinVel:0,
  mass:c.mass,wireLen:c.wireLen||58,shape:c.shape,R:c.R,sz:c.sz,color:c.color,airCoef:c.airCoef,silver:!!c.silver};}
function arm(l,r,W){return{kind:"arm",theta:0,omega:0,left:l,right:r,W:W,barDrop:48,barMass:0.25};}

var smallArm  = arm(leaf({shape:"disc",R:18,mass:1.5,color:"#e0a531",airCoef:0.5}),
                    leaf({shape:"disc",R:11,mass:0.7,color:"#c8352c",airCoef:0.4,wireLen:48}), 92);
var branchLow = arm(smallArm,
                    leaf({shape:"disc",R:15,mass:1.1,silver:true,airCoef:0.4,wireLen:50}), 140);
var branchMid = arm(leaf({shape:"blade",sz:30,mass:1.4,color:"#1f5c6e",airCoef:1.3}),
                    branchLow, 200);
var branchTop = arm(leaf({shape:"blade",sz:44,mass:1.8,color:"#211d1a",airCoef:2.3}),
                    branchMid, 260);
var root      = arm(leaf({shape:"disc",R:24,mass:9,color:"#c8352c",airCoef:0.5,wireLen:62}),
                    branchTop, 310);

function mass(n){return n.kind==="leaf"?n.mass:n.barMass+mass(n.left)+mass(n.right);}
function solve(n){ // fulcrum where the two moments cancel
  if(n.kind!=="arm")return;
  var ml=mass(n.left),mr=mass(n.right);
  n.Ll=n.W*mr/(ml+mr);
  n.Lr=n.W*ml/(ml+mr);
  solve(n.left);solve(n.right);
}
solve(root);

var nodes=[],leaves=[];
(function collect(n){nodes.push(n);if(n.kind==="leaf")leaves.push(n);else{collect(n.left);collect(n.right);}})(root);

// ---- DOM ----
function shapeEl(n,isSh){
  if(n.shape==="disc"){
    var f=isSh?SH:(n.silver?"url(#silver)":n.color);
    var a={cx:0,cy:0,rx:n.R,ry:n.R,fill:f};
    var e=mk("ellipse",a);
    if(!isSh&&!n.silver){e.setAttribute("stroke",shade(n.color));e.setAttribute("stroke-width",1.2);}
    return e;
  }
  return mk("path",{d:bladePath(n.sz),fill:isSh?SH:n.color});
}
function build(n){
  if(n.kind==="arm"){
    n.elWireVSh=mk("line",{stroke:SH,"stroke-width":1.6,opacity:0.42});shadowG.appendChild(n.elWireVSh);
    n.elBarSh=mk("line",{stroke:SH,"stroke-width":2.0,opacity:0.42});shadowG.appendChild(n.elBarSh);
    n.elWireV=mk("line",{stroke:INK,"stroke-width":1.3,"stroke-linecap":"round"});wireG.appendChild(n.elWireV);
    n.elBar=mk("line",{stroke:INK,"stroke-width":1.5,"stroke-linecap":"round"});wireG.appendChild(n.elBar);
    build(n.left);build(n.right);
  }else{
    n.elWireSh=mk("line",{stroke:SH,"stroke-width":1.4,opacity:0.36});shadowG.appendChild(n.elWireSh);
    n.elWire=mk("line",{stroke:INK,"stroke-width":1.15,"stroke-linecap":"round"});wireG.appendChild(n.elWire);
    n.elGsh=mk("g",{});shadowG.appendChild(n.elGsh);n.elGsh.appendChild(shapeEl(n,true));
    n.elG=mk("g",{});shapeG.appendChild(n.elG);n.elG.appendChild(shapeEl(n,false));
    if(n.silver){n.elGlint=mk("ellipse",{cx:-n.R*0.3,cy:-n.R*0.32,rx:n.R*0.42,ry:n.R*0.3,fill:"#ffffff"});n.elG.appendChild(n.elGlint);}
  }
}
build(root);
mountG.appendChild(mk("line",{x1:ROOTX,y1:0,x2:ROOTX,y2:ROOTY,stroke:INK,"stroke-width":1.4}));
mountG.appendChild(mk("rect",{x:ROOTX-16,y:0,width:32,height:7,fill:INK,rx:2}));
mountG.appendChild(mk("circle",{cx:ROOTX,cy:ROOTY,r:2.4,fill:INK}));

// ---- air (your cursor is a puff of moving air) ----
var air={x:0,y:0,lx:0,vx:0,active:false,sigma:120};
var pt=svg.createSVGPoint();
function toSvg(cx,cy){var m=svg.getScreenCTM();if(!m)return null;pt.x=cx;pt.y=cy;return pt.matrixTransform(m.inverse());}
function puff(cx,cy){
  var p=toSvg(cx,cy);if(!p)return;
  var d=p.x-air.lx;
  air.vx=Math.max(-70,Math.min(70,air.vx*0.35+d));
  air.x=p.x;air.y=p.y;air.lx=p.x;air.active=true;
}
window.addEventListener("pointermove",function(e){puff(e.clientX,e.clientY);},{passive:true});
window.addEventListener("touchmove",function(e){if(e.touches[0])puff(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});

// ---- physics: honest gravity torque about each fulcrum + a real air force ----
function fk(n){
  var c=Math.cos(n.theta),s=Math.sin(n.theta),px=n.pivotX,py=n.pivotY;
  if(n.kind==="leaf"){
    n.x=px-n.wireLen*s; n.y=py+n.wireLen*c;
  }else{
    var d=n.barDrop;
    n.barX=px-d*s; n.barY=py+d*c;
    n.lex=px-n.Ll*c-d*s; n.ley=py-n.Ll*s+d*c;
    n.rex=px+n.Lr*c-d*s; n.rey=py+n.Lr*s+d*c;
    n.left.pivotX=n.lex; n.left.pivotY=n.ley;
    n.right.pivotX=n.rex; n.right.pivotY=n.rey;
    fk(n.left); fk(n.right);
  }
}
function airForces(t){
  var ga=2.4*Math.sin(t*0.13)+1.4*Math.sin(t*0.31+1.1); // the A/C just catching it
  air.vx*=0.82;
  for(var i=0;i<leaves.length;i++){
    var L=leaves[i], f=L.airCoef*ga*0.5;
    if(air.active){
      var dx=L.x-air.x, dy=L.y-air.y;
      f+=L.airCoef*air.vx*0.85*Math.exp(-(dx*dx+dy*dy)/(air.sigma*air.sigma));
    }
    L.f=f;
  }
}
function torques(n){ // returns subtree point-masses, sets n._alpha about its own fulcrum
  var list;
  if(n.kind==="leaf"){list=[{x:n.x,y:n.y,m:n.mass,f:n.f}];}
  else{list=torques(n.left).concat(torques(n.right));list.push({x:n.barX,y:n.barY,m:n.barMass,f:0});}
  var px=n.pivotX,py=n.pivotY,Q=0,I=0;
  for(var i=0;i<list.length;i++){
    var p=list[i],ex=p.x-px,ey=p.y-py;
    Q+=-G*p.m*ex;      // moment that decides where it hangs
    Q+=-p.f*ey;        // the draught, propagated up the arm
    I+=p.m*(ex*ex+ey*ey);
  }
  if(I<1e-3)I=1e-3;
  n._alpha=Q/I;
  return list;
}
function step(dt,t){
  fk(root); airForces(t); torques(root);
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    n.omega=(n.omega+n._alpha*dt)*DAMP;
    if(n.omega>3)n.omega=3; else if(n.omega<-3)n.omega=-3;
    n.theta+=n.omega*dt;
    if(n.theta>0.5){n.theta=0.5;if(n.omega>0)n.omega*=-0.3;}
    else if(n.theta<-0.5){n.theta=-0.5;if(n.omega<0)n.omega*=-0.3;}
  }
  for(var j=0;j<leaves.length;j++){
    var L=leaves[j];
    // nothing holds the spin but the slow unwinding of the wire — except the silver rim, which comes home
    var kSpin=L.silver?2.7:0.11;
    var st=L.f*0.02-kSpin*L.spin;
    L.spinVel=(L.spinVel+st*dt)*(L.silver?0.965:0.988);
    L.spin+=L.spinVel*dt;
  }
}

// ---- render: project each enamel shadow onto the plaster from its true position ----
function setLine(e,x1,y1,x2,y2){e.setAttribute("x1",x1);e.setAttribute("y1",y1);e.setAttribute("x2",x2);e.setAttribute("y2",y2);}
function renderNode(n,shx,shy){
  if(n.kind==="arm"){
    setLine(n.elWireV,n.pivotX,n.pivotY,n.barX,n.barY);
    setLine(n.elBar,n.lex,n.ley,n.rex,n.rey);
    setLine(n.elWireVSh,n.pivotX+shx,n.pivotY+shy,n.barX+shx,n.barY+shy);
    setLine(n.elBarSh,n.lex+shx,n.ley+shy,n.rex+shx,n.rey+shy);
    renderNode(n.left,shx,shy);renderNode(n.right,shx,shy);
  }else{
    setLine(n.elWire,n.pivotX,n.pivotY,n.x,n.y);
    setLine(n.elWireSh,n.pivotX+shx,n.pivotY+shy,n.x+shx,n.y+shy);
    var deg=n.theta*180/Math.PI;
    var sx=Math.max(0.1,Math.abs(Math.cos(n.spin)));
    n.elG.setAttribute("transform","translate("+n.x.toFixed(2)+" "+n.y.toFixed(2)+") rotate("+deg.toFixed(2)+") scale("+sx.toFixed(3)+" 1)");
    n.elGsh.setAttribute("transform","translate("+(n.x+shx).toFixed(2)+" "+(n.y+shy).toFixed(2)+") rotate("+deg.toFixed(2)+") scale("+sx.toFixed(3)+" 1)");
    if(n.silver){var g=Math.pow(Math.max(0,Math.cos(n.spin)),8);n.elGlint.setAttribute("opacity",(0.12+0.88*g).toFixed(3));}
  }
}

// ---- give it a nudge, count the nudge, keep it turning ----
root.pivotX=ROOTX;root.pivotY=ROOTY;
for(var k=0;k<nodes.length;k++){nodes[k].omega=(Math.random()-0.5)*(nodes[k].kind==="leaf"?0.5:0.3);}

var t=0,last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var sub=2,h=dt/sub;
  for(var i=0;i<sub;i++){t+=h;step(h,t);}
  root.pivotX=ROOTX;root.pivotY=ROOTY;fk(root);
  var shx=24+20*Math.sin(t*0.045), shy=34+9*Math.cos(t*0.033); // shadow wheels as the sun moves
  renderNode(root,shx,shy);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- persistent tally ----
try{
  var n=parseInt(localStorage.getItem("meridian.mobile.swings")||"0",10);
  if(!isFinite(n)||n<0)n=0;
  n+=1;
  localStorage.setItem("meridian.mobile.swings",String(n));
  document.getElementById("tally").textContent="TIMES THIS MOBILE HAS BEEN SET SWINGING: "+n;
}catch(e){
  document.getElementById("tally").textContent="TIMES THIS MOBILE HAS BEEN SET SWINGING: 1";
}

console.log("%cthe fulcrum sits where the two moments cancel — never in the middle.","color:#c8352c");
})();
</script>

<script src="/nav.js" defer></script>
