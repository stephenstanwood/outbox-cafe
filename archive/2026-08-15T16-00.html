  <meta name="outbox-spec-era" content="1968, right now — twenty past eleven on a Saturday night, second set, on the light platform at the back of a ballroom on Grand River Avenue in Detroit: two 750-watt overhead projectors running hot on a card table, a shoebox of made-up wet slides, a bottle of mineral oil, a bottle of denatured alcohol, and a coffee can of dirty rags. Not a look-back at 'the psychedelic era' and not a 'the ballrooms all closed' lament — the second set started nine minutes ago, the first slide is already cooking itself to mud, and the wall is forty feet wide.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the ballroom's back wall as the projector throws it: one enormous circle of light with a real optical soft edge, a rim of hot lamp-white bleeding to amber, and dark plaster in the corners outside the beam — no header, no caption, no counter, no title, no instructions, nothing to read anywhere. Inside that circle lives a genuine two-phase liquid: dozens of dye-loaded cells riding in oil between two curved clock glasses, and the visitor's cursor IS the pressure of a thumb on the top glass. Press and hold anywhere and the glasses squeeze at that point, splaying the cells outward in real time; drag to slide the top glass across the bottom one, shearing cells until they physically tear in two; roll the wheel to rotate the top glass and set the whole field turning against itself. Cells that touch coalesce for good. The lamp underneath is never off, and its heat is a live field that keeps the whole slide moving whether the visitor touches it or not.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of running a liquid wet slide on an overhead projector — that the whole effect is two liquids that refuse to mix, so the colour is not painted but held in discrete cells with real surface tension, and every shape on that wall is a boundary and not a brushstroke; that the dyes have to be chosen on opposite solubilities, one alcohol-soluble and one water-soluble, or the two colours simply merge into one brown and the slide is dead; that the glasses are curved on purpose, because a flat pair squeezes the liquid out to the edges and a shallow lens keeps it centred where the lamp is brightest; that the actual engine of the piece is the 750-watt lamp, whose heat boils the water phase from below and drives the convection you're watching, which is why a slide comes alive about a minute after you set it down and turns to sludge about eight minutes later; that pressure splays and shear tears, so squeezing gives you rounds and dragging gives you strings, and a torn cell never comes back the same size; that cells which touch merge permanently and a slide therefore gets simpler and coarser the whole night, never more complex; that you cannot get it all in focus, ever, because the liquid sits in a curved lens and the rim is always a different distance from the platen than the centre, so focusing the middle throws the edges soft and that softness is not a fault; and that colour here is subtractive, so red over green is not a third bright colour but a dark one, and three dyes on one slide is how beginners make mud. Literally glass, mineral oil, water, two dyes, and a hot bulb.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, SATURATED and RESTLESS — cells boiling up off the bottom of the frame, rounds bursting into strings under a drag, colours going hard and dark where they overlap, the whole field never once holding still. Explicitly NOT a lava lamp, NOT slow, NOT hypnotic, NOT meditative, NOT dreamy, NOT drifting, NOT soft-focus prettiness, NOT melancholy — this is a working light show at full lamp temperature, twenty past eleven, with somebody's thumb on the glass and the band already three songs into the set.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Alcohol-dye scarlet (#e0271b) and water-dye viridian (#0f9b7a) as the two working anchors — the only two dyes on the slide — with their overlaps computed subtractively into a hard bottle-brown (#3d2216), all riding on a blown-out lamp field of hot projector white going warm at the rim (#fff4dc into #f2a63a), and the plaster outside the beam a dead unlit brown-black (#160f0c). Saturated, transmissive, genuinely luminous — this is projected light, not pigment, so the whites blow out and the dye edges carry real chromatic fringing where the lens can't hold two colours in the same plane.">
  <meta name="outbox-spec-wildcard" content="There is a single human hair lying on the projector's stage, in the light path, permanently — thrown up onto the wall enormously magnified as a soft dark curve across the lower left of the disc, with its own honest focus offset (it sits on the platen, not in the liquid, so it is sharpest at exactly the focus setting where every dye cell is soft). It drifts a fraction only when the glasses are physically slid across it. It is never removed, never labelled, never explained, and it is there identically every visit.">

<style>
  html,body{margin:0;padding:0;height:100%;background:#160f0c;overflow:hidden;}
  body{touch-action:none;}
  #wall{position:fixed;inset:0;display:block;width:100vw;height:100vh;}
  /* plaster grain outside the beam — the corners of the wall never get lit */
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:multiply;
    background-image:url("https://images.unsplash.com/photo-1585314062340-f1a5a7c9328d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MTk0MTN8MHwxfHNlYXJjaHwxfHxwbGFpbnxlbnwxfHx8fDE3ODYwMTQwNTJ8MA&ixlib=rb-4.1.0&q=80&w=1080");
    background-size:cover;background-position:center;}

  #f{position:fixed;left:0;bottom:0;padding:7px 10px;font:11px/1 Georgia,serif;color:rgba(255,244,220,.13);
     text-decoration:none;letter-spacing:.06em;z-index:5;}
  #f:hover{color:rgba(255,244,220,.4);}
  @media (max-width:560px){#f{font-size:10px;}}

<body>
<canvas id="wall" aria-label="A forty-foot disc of projected light on a ballroom wall, carrying a live wet slide of scarlet and viridian dye cells in mineral oil."></canvas>
<div id="grain" aria-hidden="true"></div>
<a id="f" href="/archive">the rest of the box</a>
<script>
/* ---------------------------------------------------------------
   two liquids that refuse to mix.
   phase 0 = alcohol-soluble scarlet.  phase 1 = water-soluble viridian.
   they only ever merge with their own kind. the lamp does the rest.
   pressure splays, shear tears, touching coalesces, and it never
   gets more complicated than it was when you set it down.
   --------------------------------------------------------------- */
(function(){
"use strict";
var cv=document.getElementById('wall'), g=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,CX=0,CY=0,R=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  CX=W/2; CY=H*0.47; R=Math.min(W,H)*0.485;
}
resize(); addEventListener('resize',resize);

/* ---- the two dyes, and their subtractive stack -------------------- */
// transmittance per unit dye load. red dye passes red, eats green+blue. etc.
var DYE=[
  {t:[0.94,0.11,0.09]},   // scarlet  #e0271b
  {t:[0.09,0.72,0.55]}    // viridian #0f9b7a
];

/* ---- cells -------------------------------------------------------- */
var cells=[], NMAX=140;
function mk(x,y,a,ph,load){
  var n=11+((Math.random()*5)|0);
  var c={x:x,y:y,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
    area:a, ph:ph, load:load||(0.75+Math.random()*0.5),
    n:n, rr:new Float32Array(n), rv:new Float32Array(n),
    rot:Math.random()*6.283, spin:(Math.random()-.5)*0.008,
    hot:0, born:performance.now()};
  var base=Math.sqrt(a/Math.PI);
  for(var i=0;i<n;i++){ c.rr[i]=base*(0.9+Math.random()*0.2); c.rv[i]=0; }
  return c;
}
function seed(){
  cells.length=0;
  var N=34;
  for(var i=0;i<N;i++){
    var ang=Math.random()*6.283, rad=Math.sqrt(Math.random())*R*0.72;
    var ph=i%2;
    var a=(R*R)*(0.0012+Math.random()*0.004);
    cells.push(mk(CX+Math.cos(ang)*rad, CY+Math.sin(ang)*rad, a, ph));
  }
}
seed();
addEventListener('resize',function(){ setTimeout(seed,60); });

/* ---- input: a thumb on the top glass ------------------------------ */
var px=-1e4,py=-1e4,down=false,lastx=0,lasty=0,shx=0,shy=0;
var glassRot=0, glassRotV=0;
var focus=0.0;   // 0 = centre sharp / rim soft ... 1 = rim sharp / centre soft
var focusTarget=0.0, focusDrift=0;

function pos(e){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  px=(t.clientX-r.left)*DPR; py=(t.clientY-r.top)*DPR;
}
cv.addEventListener('mousemove',function(e){ var ox=px,oy=py; pos(e);
  if(down){ shx=shx*.7+(px-ox)*.3; shy=shy*.7+(py-oy)*.3; } });
cv.addEventListener('mousedown',function(e){ pos(e); down=true; e.preventDefault(); });
addEventListener('mouseup',function(){ down=false; });
cv.addEventListener('mouseleave',function(){ down=false; px=-1e4; py=-1e4; });
cv.addEventListener('touchstart',function(e){ pos(e); down=true; e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',function(e){ var ox=px,oy=py; pos(e);
  shx=shx*.7+(px-ox)*.3; shy=shy*.7+(py-oy)*.3; e.preventDefault(); },{passive:false});
addEventListener('touchend',function(){ down=false; });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  if(e.shiftKey||e.altKey){ focusTarget=Math.max(0,Math.min(1,focusTarget+e.deltaY*0.0012)); }
  else { glassRotV+=Math.max(-1,Math.min(1,e.deltaY*0.01))*0.0016; }
},{passive:false});
addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){ focusTarget+= 0.115; if(focusTarget>1.02) focusTarget=0; }
});

/* ---- the heat field: 750 watts, straight up through the platen ----- */
function heatAt(x,y){
  var dx=(x-CX)/R, dy=(y-CY)/R, d=Math.sqrt(dx*dx+dy*dy);
  var h=Math.exp(-d*d*2.35);            // lamp is hottest dead centre
  return h;
}

/* ---- simulation ---------------------------------------------------- */
var last=performance.now();
function step(dt){
  glassRot+=glassRotV*dt;
  glassRotV*=Math.pow(0.985,dt);
  shx*=Math.pow(0.90,dt); shy*=Math.pow(0.90,dt);
  focus+=(focusTarget-focus)*Math.min(1,0.09*dt);
  focusDrift+=dt*0.0009;

  var i,j,c;
  for(i=0;i<cells.length;i++){
    c=cells[i];
    var h=heatAt(c.x,c.y);
    var base=Math.sqrt(c.area/Math.PI);

    // buoyant convection: the water phase boils off the bottom, the oil
    // falls back down the cool rim. viridian rides harder than scarlet.
    var lift=(c.ph===1? 0.052 : 0.030)*h*(1+0.5*Math.sin(c.born*0.0007+c.x*0.004));
    c.vy-=lift*dt*(60/ (1+base*0.02));
    // rim return current
    var dx=(c.x-CX), dy=(c.y-CY), d=Math.sqrt(dx*dx+dy*dy)+1e-3;
    var rimf=Math.max(0,(d/R)-0.42)*0.09;
    c.vx+=(dx/d)*rimf*dt*0.6*(1-h);
    c.vy+=(0.030*(1-h)+rimf*0.7*(dy/d))*dt;

    // rotation of the top glass drags everything with it
    if(Math.abs(glassRotV)>1e-5){
      var tvx=-dy*glassRotV*3.2, tvy=dx*glassRotV*3.2;
      c.vx+=(tvx-c.vx)*0.10*dt; c.vy+=(tvy-c.vy)*0.10*dt;
    }
    // shear from dragging the top glass across the bottom
    var sh=0;
    if(Math.abs(shx)+Math.abs(shy)>0.4){
      var ddx=c.x-px, ddy=c.y-py, dd=Math.sqrt(ddx*ddx+ddy*ddy);
      var infl=Math.exp(-dd*dd/(R*R*0.09));
      c.vx+=shx*0.055*infl*dt; c.vy+=shy*0.055*infl*dt;
      sh=infl*Math.sqrt(shx*shx+shy*shy);
    }

    // thumb pressure: the glasses squeeze, liquid splays outward
    var press=0;
    if(down){
      var ax=c.x-px, ay=c.y-py, ad=Math.sqrt(ax*ax+ay*ay)+1e-3;
      var pf=Math.exp(-ad*ad/(R*R*0.055));
      press=pf;
      c.vx+=(ax/ad)*pf*1.35*dt; c.vy+=(ay/ad)*pf*1.35*dt;
    }

    c.x+=c.vx*dt; c.y+=c.vy*dt;
    c.vx*=Math.pow(0.955,dt); c.vy*=Math.pow(0.955,dt);
    c.rot+=c.spin*dt;

    // the glasses are curved: a shallow lens keeps liquid centred
    var d2=Math.sqrt((c.x-CX)*(c.x-CX)+(c.y-CY)*(c.y-CY));
    var lim=R*0.90-base*0.4;
    if(d2>lim){ var k=(d2-lim); c.vx-=((c.x-CX)/d2)*k*0.012*dt; c.vy-=((c.y-CY)/d2)*k*0.012*dt; }

    // ---- deformable boundary: surface tension pulls it back round ----
    var n=c.n, target=base;
    for(j=0;j<n;j++){
      var th=c.rot+j*6.283/n;
      var cx=Math.cos(th), cy=Math.sin(th);
      // local pressure squashes toward the thumb axis, shear elongates along drag
      var pterm=0, sterm=0;
      if(press>0.01){
        var rx=(c.x-px), ry=(c.y-py), rl=Math.sqrt(rx*rx+ry*ry)+1e-3;
        var dot=(cx*rx+cy*ry)/rl;
        pterm=press*base*0.85*(dot*dot-0.34);
      }
      if(sh>0.01){
        var sl=Math.sqrt(shx*shx+shy*shy)+1e-3;
        var sdot=(cx*shx+cy*shy)/sl;
        sterm=sh*base*0.26*(sdot*sdot*2-0.7);
      }
      // the boil: heat wobbles the boundary from underneath
      var boil=Math.sin(th*3+ c.born*0.001 + focusDrift*9)*base*0.10*h;
      var want=target+pterm+sterm+boil;
      if(want<base*0.22) want=base*0.22;
      c.rv[j]+=(want-c.rr[j])*0.055*dt;          // surface tension restoring
      c.rv[j]*=Math.pow(0.86,dt);
      c.rr[j]+=c.rv[j]*dt;
      if(c.rr[j]<1) c.rr[j]=1;
    }
    // neighbour smoothing — a real boundary can't be spiky
    for(j=0;j<n;j++){
      var a1=c.rr[(j+n-1)%n], b1=c.rr[(j+1)%n];
      c.rr[j]=c.rr[j]*0.80+(a1+b1)*0.10;
    }

    // ---- tearing: strain across the long axis ----
    var mx=0,mn=1e9,mi=0;
    for(j=0;j<n;j++){ if(c.rr[j]>mx){mx=c.rr[j];mi=j;} if(c.rr[j]<mn)mn=c.rr[j]; }
    var strain=mx/(mn+0.001);
    if(strain>3.15 && c.area>(R*R)*0.0007 && cells.length<NMAX){
      tear(c,mi); continue;
    }

    // ---- boiled out: parked in the hot centre too long ----
    if(h>0.80){ c.hot+=dt; } else { c.hot*=Math.pow(0.994,dt); }
    if(c.hot>430 && c.area>(R*R)*0.0016 && cells.length<NMAX-5){
      burst(c,i); i--; continue;
    }
  }

  // ---- coalescence: boundaries that touch merge, permanently ----
  for(i=0;i<cells.length;i++){
    for(j=i+1;j<cells.length;j++){
      var A=cells[i],B=cells[j];
      if(A.ph!==B.ph) continue;              // opposite solubilities never mix
      var dx2=B.x-A.x, dy2=B.y-A.y, dd2=Math.sqrt(dx2*dx2+dy2*dy2);
      var ra=Math.sqrt(A.area/Math.PI), rb=Math.sqrt(B.area/Math.PI);
      if(dd2 < (ra+rb)*0.80){
        var tot=A.area+B.area;
        A.x=(A.x*A.area+B.x*B.area)/tot; A.y=(A.y*A.area+B.y*B.area)/tot;
        A.vx=(A.vx*A.area+B.vx*B.area)/tot; A.vy=(A.vy*A.area+B.vy*B.area)/tot;
        A.load=(A.load*A.area+B.load*B.area)/tot;
        A.area=tot; A.hot=0;
        var nb=Math.sqrt(tot/Math.PI);
        for(var k=0;k<A.n;k++){ A.rr[k]=nb*(0.94+Math.random()*0.12); A.rv[k]=0; }
        cells.splice(j,1); j--;
      }
    }
  }
}

function tear(c,mi){
  // split along the short axis; the two halves conserve total area,
  // and they never come back the same size.
  var frac=0.33+Math.random()*0.34;
  var a1=c.area*frac, a2=c.area*(1-frac);
  var th=c.rot+mi*6.283/c.n;
  var off=Math.sqrt(c.area/Math.PI)*0.62;
  var A=mk(c.x+Math.cos(th)*off, c.y+Math.sin(th)*off, a1, c.ph, c.load);
  var B=mk(c.x-Math.cos(th)*off, c.y-Math.sin(th)*off, a2, c.ph, c.load);
  A.vx=c.vx+Math.cos(th)*0.5; A.vy=c.vy+Math.sin(th)*0.5;
  B.vx=c.vx-Math.cos(th)*0.5; B.vy=c.vy-Math.sin(th)*0.5;
  var ix=cells.indexOf(c); if(ix>=0) cells.splice(ix,1,A,B);
}
function burst(c,i){
  // boiled: one ring of small daughters, total area conserved
  var m=4+((Math.random()*3)|0), each=c.area/m;
  cells.splice(i,1);
  var rr=Math.sqrt(c.area/Math.PI)*0.9;
  for(var k=0;k<m;k++){
    var th=k*6.283/m+Math.random()*0.4;
    var d=mk(c.x+Math.cos(th)*rr, c.y+Math.sin(th)*rr, each, c.ph, c.load*0.95);
    d.vx=Math.cos(th)*0.8; d.vy=Math.sin(th)*0.8-0.3;
    cells.push(d);
  }
}

/* ---- the optic ----------------------------------------------------- */
// blur radius = how far a thing sits from the current focal plane.
// the liquid rides in a curved lens, so its plane depth varies with radius.
// nothing in the range puts the whole disc sharp at once.
function blurFor(x,y){
  var dx=(x-CX)/R, dy=(y-CY)/R, d=Math.sqrt(dx*dx+dy*dy);
  var plane = focus;                 // 0 -> centre, 1 -> rim
  var depth = d;                     // the curved glass: depth rises with radius
  return Math.abs(depth-plane)*13 + 0.9;
}
// the hair is on the platen, flat — its plane is fixed at mid-depth,
// so it is sharpest exactly where every dye cell is soft.
function hairBlur(){ return Math.abs(0.5-focus)*2.2+0.35; }

/* the hair: one curve, same every night, drifts only when the glasses slide */
var hairDrift=0;
function drawHair(ctx){
  hairDrift+=(shx*0.0016+shy*0.0011);
  hairDrift*=0.998;
  var d=hairDrift;
  ctx.save();
  ctx.filter='blur('+(hairBlur()*DPR*2.4).toFixed(2)+'px)';
  ctx.lineCap='round';
  for(var pass=0;pass<2;pass++){
    ctx.strokeStyle= pass? 'rgba(22,15,12,0.30)':'rgba(38,24,16,0.46)';
    ctx.lineWidth=(pass? 7.5:3.4)*DPR;
    ctx.beginPath();
    var pts=[[-0.72,0.10],[-0.58,0.31],[-0.40,0.47],[-0.19,0.52],[0.01,0.42],[0.11,0.24]];
    for(var i=0;i<pts.length;i++){
      var X=CX+(pts[i][0]+d*0.01)*R, Y=CY+(pts[i][1]+d*0.006)*R;
      if(i===0) ctx.moveTo(X,Y);
      else{
        var pX=CX+(pts[i-1][0]+d*0.01)*R, pY=CY+(pts[i-1][1]+d*0.006)*R;
        ctx.quadraticCurveTo((pX+X)/2+Math.sin(i*2.1+d)*R*0.02,(pY+Y)/2+Math.cos(i*1.7)*R*0.025,X,Y);
      }
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- render -------------------------------------------------------- */
// Two offscreen buffers, one per dye phase. Each holds accumulated dye load.
// Then the beam is composited subtractively: white light through the stack.
var bufA=document.createElement('canvas'), bufB=document.createElement('canvas');
var ga=bufA.getContext('2d'), gb=bufB.getContext('2d');
var SW=0,SH=0,SS=0.5;   // sim-scale render for the dye layers
var out=null, outData=null;

function ensure(){
  var w=Math.max(80,Math.floor(W*SS)), h=Math.max(80,Math.floor(H*SS));
  if(w!==SW||h!==SH){ SW=w;SH=h; bufA.width=SW;bufA.height=SH; bufB.width=SW;bufB.height=SH;
    out=g.createImageData(W,H); outData=out.data; }
}

function paintPhase(ctx,ph){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,SW,SH);
  ctx.globalCompositeOperation='lighter';
  var s=SS;
  for(var i=0;i<cells.length;i++){
    var c=cells[i]; if(c.ph!==ph) continue;
    var b=blurFor(c.x,c.y);
    ctx.save();
    ctx.filter='blur('+(b*s*DPR*1.15).toFixed(2)+'px)';
    var alpha=Math.min(1,c.load*0.62);
    ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')';
    ctx.beginPath();
    var n=c.n;
    for(var j=0;j<=n;j++){
      var k=j%n, th=c.rot+k*6.283/n;
      var X=(c.x+Math.cos(th)*c.rr[k])*s, Y=(c.y+Math.sin(th)*c.rr[k])*s;
      var pk=(k+n-1)%n, pth=c.rot+pk*6.283/n;
      var pX=(c.x+Math.cos(pth)*c.rr[pk])*s, pY=(c.y+Math.sin(pth)*c.rr[pk])*s;
      if(j===0) ctx.moveTo(X,Y);
      else ctx.quadraticCurveTo((pX+X)/2,(pY+Y)/2,X,Y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

var da=null,db=null;
function composite(){
  da=ga.getImageData(0,0,SW,SH).data;
  db=gb.getImageData(0,0,SW,SH).data;
  var i,x,y;
  var invR=1/R;
  var wr=0.996,wg=0.956,wb=0.862;   // 750w tungsten, warm
  var t0=DYE[0].t, t1=DYE[1].t;
  var p=0;
  for(y=0;y<H;y++){
    var sy=(y*SS)|0; if(sy>=SH) sy=SH-1;
    var rowS=sy*SW;
    for(x=0;x<W;x++){
      var sx=(x*SS)|0; if(sx>=SW) sx=SW-1;
      var si=(rowS+sx)<<2;
      // ---- the beam ----
      var dx=(x-CX)*invR, dy=(y-CY)*invR;
      var d=Math.sqrt(dx*dx+dy*dy);
      // real optical soft edge: the lamp's own penumbra
      var beam;
      if(d<0.86) beam=1;
      else if(d>1.03) beam=0;
      else { var u=(d-0.86)/0.17; beam=1-(u*u*(3-2*u)); }
      // hot white centre going amber at the rim
      var warm=Math.min(1,Math.max(0,(d-0.20)/0.85));
      var lr=1.00, lg=1.0-warm*0.28, lb=1.0-warm*0.66;
      var lum=(1.06-d*d*0.30)*beam;
      if(lum<0)lum=0;
      var Rr=lr*lum*wr, Gg=lg*lum*wg, Bb=lb*lum*wb;

      // ---- dye stack, subtractive ----
      var a=da[si]/255, b=db[si]/255;
      if(a>0.002){
        var e=a*2.3;
        Rr*=Math.pow(t0[0],e); Gg*=Math.pow(t0[1],e); Bb*=Math.pow(t0[2],e);
      }
      if(b>0.002){
        var e2=b*2.3;
        Rr*=Math.pow(t1[0],e2); Gg*=Math.pow(t1[1],e2); Bb*=Math.pow(t1[2],e2);
      }
      // chromatic fringing: the lens can't hold two colours in one plane
      if(a>0.02&&b>0.02){ Rr*=1.06; Bb*=0.94; }

      // plaster outside the beam
      if(beam<1){
        var pl=1-beam;
        Rr=Rr+0.086*pl; Gg=Gg+0.058*pl; Bb=Bb+0.046*pl;
      }
      // lamp is never off — a faint spill everywhere
      Rr+=0.012; Gg+=0.008; Bb+=0.006;

      var ir=Rr*255, ig=Gg*255, ib=Bb*255;
      outData[p]  = ir>255?255:(ir<0?0:ir);
      outData[p+1]= ig>255?255:(ig<0?0:ig);
      outData[p+2]= ib>255?255:(ib<0?0:ib);
      outData[p+3]= 255;
      p+=4;
    }
  }
  g.putImageData(out,0,0);
}

function frame(now){
  var dt=Math.min(2.6,(now-last)/16.666); last=now;
  ensure();
  step(dt);
  paintPhase(ga,0);
  paintPhase(gb,1);
  composite();
  // the hair sits on the platen, above the liquid in the light path
  drawHair(g);
  // a little lamp flutter — 60hz ballast, a hot bulb, a loud room
  var fl=0.985+Math.sin(now*0.021)*0.006+Math.sin(now*0.0071)*0.008;
  g.globalCompositeOperation='source-over';
  if(fl<1){ g.fillStyle='rgba(22,15,12,'+((1-fl)*1.4).toFixed(3)+')'; g.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* keep it from going totally quiet: the lamp keeps boiling new cells
   up off the bottom of the frame all night, but fewer and coarser,
   because everything that touches stays touched. */
setInterval(function(){
  if(cells.length<11 && cells.length<NMAX){
    var ph=(Math.random()<0.5)?0:1;
    var c=mk(CX+(Math.random()-.5)*R*1.1, CY+R*0.82, (R*R)*(0.0016+Math.random()*0.003), ph);
    c.vy=-0.6; cells.push(c);
  }
},2600);

/* the shoebox: mineral oil, denatured alcohol, one clock glass pair,
   two dyes and no third. three dyes on one slide is how you make mud. */
})();
</script>
