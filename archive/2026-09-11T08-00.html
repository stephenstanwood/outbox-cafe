  <meta name="outbox-spec-era" content="September 1993, the Saturday before the eighteenth, on the flat roof of a three-storey block in Estación Central, Santiago — warm spring afternoon, about forty volantines up over six blocks of low roofs, the wind coming down off the cordillera at nine or ten knots and steadying rather than dying, and a hot dusty smell of the empty lot next door. Not a memory, not a look-back, not a childhood: there are two spools of line left on the table downstairs, a man three roofs over on Calle Chorrillos who has taken four kites off this building since Thursday, and about three hours of usable wind.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY that is one fighting kite and one reel, played with a single hand, filling the whole viewport: the sky seen up-and-out from the roof parapet, your own hexagonal paper volantín riding out at the end of a real line, and four or five other people's kites working the same air over the neighbourhood. You FLY it with one continuous gesture — drag toward yourself to haul in, which tensions the line and makes the kite drive hard in whatever direction its nose is pointing; release toward the sky to give line, which goes slack and lets the kite spin loose and reset; small lateral flicks steer, and the kite has no tail so it will not sit still and never does. You FIGHT by putting your line across somebody else's and then working it: contact is real, and cutting is abrasion — the two lines saw against each other at whatever relative speed you actually generate, and the winner is whoever's coating is still on the line at the point of contact. No menu, no levels, no score screen, no scroll: one reel, two spools left, an opponent on Chorrillos, and the wind holding.">
  <meta name="outbox-spec-subject" content="The flat mechanics of cutting somebody's line off a roof, and specifically that a fighting kite is not steered, it is aimed and then released — that a volantín has no tail on purpose, so it is unstable by design and will always rotate to some heading and then FLY that heading the instant the line comes taut, which means the whole control scheme is two states, tirar (pull, line taut, kite drives) and dar hilo (give, line slack, kite spins), and everything anybody does up there is choosing when to switch between them; that the bow in the spine spar sets how hard it drives and how fast it spins, and a spar bowed too much makes a kite that turns beautifully and will not hold a line across the wind; that CUTTING IS SANDING AND NOTHING ELSE — hilo curado is cotton line run through a paste of ground glass and glue, so a line is a file with a finite number of grains on it, and the cut goes to whoever gets more relative motion across the crossing point with more grit still on their line at that exact place; that this is why the classic answer is to give line fast while the other man pulls, because slack line moving through a taut one saws it, and the man who yanks in a panic is doing the sawing for you; that the first fifteen or twenty metres nearest the kite is the only part of a spool that ever sees a fight, so that is the part that goes bald, and a spool that cut six kites on Thursday is smooth where it matters and the rest of it is as sharp as the day it was made and completely useless; that a line under high tension cuts faster and also breaks faster, so there is a real optimum and it is not maximum tension; that WIND GRADIENT is real — the air over a roofline is dirty and gusty for the first several metres and clean above it, which is why a kite launched low fights badly and why the man with the taller building genuinely has an advantage that is not skill; that line SAG is not slack: a hundred metres of cotton has real weight and real drag, so the kite is never where the line points and a beginner aims at the kite instead of at the line; that a cut kite does not dive, it flutters off downwind flat and slow because nothing is holding its nose anywhere, and that is why children run for four blocks and are often right about where it will land; that the cut line falls too, all of it, across roofs and wires and other people's lines, and picking it out of a television aerial is the actual cost of losing; that WIRE IS NOT LINE — anybody flying steel or nylon-cored line cuts everything instantly, cuts hands, and takes the whole afternoon down with it, which is a real argument up here and not a rule anybody enforces; and the flat arithmetic on the parapet, which is two spools left at eight hundred pesos apiece, four kites lost off this roof since Thursday, a volantín that costs less than the line it flies on, and about three hours of wind.">
  <meta name="outbox-spec-tone" content="The loud, fast, running match commentary of Rosita Yáñez, fifty-four, who sells kites and line off a folding table on the corner downstairs and has come up to the roof with her own spool because a man on Chorrillos has taken four kites off this building since Thursday. Present tense, second person, addressed to whoever came up the stairs behind her and is now holding the spare reel and the paper bag. She narrates the fight the way a person narrates a fight nobody else is watching: short bursts with gaps in them, calling shots before she makes them ('now — now I give it — no, not yet'), talking directly AT the kite about half the time and at the man on Chorrillos the rest, knowing perfectly well he cannot hear a word. She is boastful, cheerfully and openly, and the boasts are always priced: she does not say she is good, she says what a spool costs and how many she has sold to people who lost to her. She keeps a running count of cuts today and gets it wrong twice in the other direction, undercounting because she does not count anything she cut by accident. She breaks off mid-sentence three separate times because the wind does something and she has to deal with it, and picks the sentence up afterwards from a different place. She has a long side-argument going about the sausage cart moving to the other corner, which she returns to at random and which has nothing to do with anything. She calls the man on Chorrillos by a nickname and never his name. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT nostalgic, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, and NOT the competent-tradesperson-saying-every-figure-twice voice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is spring Santiago sky, which is not blue at this hour — a hazy, dusty, sun-whitened grey-blue (#a9bfcb) that goes measurably paler and browner toward the horizon at the bottom of frame (#cfc6b3) and cooler and cleaner straight up (#7ea3bd), with the cordillera showing along the lower edge as flat unmodelled haze and nothing else. Against that, the kites: papel volantín is tissue, so its rendered value is COMPUTED from whether the sun is behind it or in front of it — a kite edge-on and lit from behind glows hot and translucent with its spars showing through as hard dark lines, and the same kite banked away goes flat, dull and opaque, and this flips several times a second while it spins. The two paper colours in play are a hot fuchsia (#e2357b) and a hard chrome yellow (#f2c400), both bleached toward white where the sun is straight through them (#fbe9ef) and both dropping to a dirty maroon-olive in silhouette (#5a3a45). Line is rendered honestly: a real hairline in dry cotton grey (#b9ae97) that is genuinely invisible against the pale horizon for most of its length and only picks up a specular glint where the glass coating remains, so the BALD SECTION OF YOUR OWN SPOOL IS VISIBLE AS A LENGTH THAT HAS STOPPED SPARKLING, and nothing on the page ever says so. The roof under the bottom edge is unpainted concrete and tar patch (#8f8b80) with a red-oxide parapet cap (#9c4a2c). Exactly one chip of table-oilcloth cobalt (#1f4fa8) is held strictly for the spool cheeks, the plastic bag the spare line came in, and the price written on masking tape on the reel — it never appears on a kite, in the sky, or on the roof. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest atmospheric haze, honest paper translucency and honest glint on remaining grit.">
  <meta name="outbox-spec-wildcard" content="There is a black plastic bag up there. It came off the empty lot on the first big gust and it is in the wind field like everything else — the engine gives it real drag, real mass and real lift, so it soars, sinks, gets caught in the wake off Chorrillos and climbs again, and about once a session it goes higher than any kite in frame. It cannot be cut, it cannot be hooked, and a line laid across it slides off with no abrasion at all. It never leaves during a visit. Rosita mistakes it for a kite exactly once, early, calls a shot on it, and then says what it is and goes back to the fight and never mentions it again. Same bag, same lot, every visit.">
  <meta name="outbox-spec-forbidden" content="NO kites as metaphor for anything — not freedom, not childhood, not aspiration, not the string that keeps you tethered, not letting go, not what rises and what falls; this is a bowed spar, a slack-line autorotation and a per-centimetre grit value, and it has nothing to teach anybody. ABSOLUTELY NO The Kite Runner, NO 'for you, a thousand times over', NO friendship-across-a-divide arc, NO boy-and-his-kite, NO coming-of-age, NO running-for-the-cut-kite as an image of anything. NO sky lyricism whatsoever: no soaring, no dancing, no the-wind-took-it, no clouds, no light-through-paper reverie, no sensuous writing about tissue paper beyond translucency, weight, tear strength and cost. NO Chile travelogue and NO explaining Chile or Santiago to anybody: no Andes majesty, no Neruda, no magical realism, no empanadas-and-cueca colour writing, no Spanish sprinkled in for flavour beyond the handful of words a person on that roof would actually use in the middle of a fight, no dialect spelling, no charming-neighbours sketch. ABSOLUTELY NO Chilean political history imported as atmosphere or subtext: no 1973, no Pinochet, no plebiscite, no disappeared, no dictatorship allegory, no democracy-restored framing, no poverty pathos, no shantytown sociology, no aren't-they-resilient condescension — it is a Saturday, the wind is good, and she sells line. NO nostalgia, NO wistfulness, NO 'nobody flies kites anymore / the wires took it / the last September like this' decline narrative — there are three hours of wind and two spools left. NO danger-porn about glass line: the wire argument is a flat complaint made in the moment and never a cautionary tale, never foreshadowing, never a lesson. NO craftsman-sage register, NO 'the old flyers could feel the cut coming', NO trade mystique, NO reverence for hand-made line, NO artisan-versus-factory sermon, NO master-and-apprentice arc. NO underdog or revenge arc about the man on Chorrillos, NO rivalry pathos, NO he-taught-me-everything twist; he is a man with a better roof. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the flying. NO cryptic-SCP, liminal, uncanny, backrooms or ominous dread about the plastic bag, the bald line or the kite that never lands — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object on this roof. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a bright warm afternoon. NO signal / transmission / frequency / broadcast framing of any sound on the page. NO society / club / guild / association / cabinet-of-hobbyists scaffolding.">

<body>
<!-- the bald part is the first eighteen metres. it does not sparkle. nobody says so. -->
<div id="wrap">

  </div>

<script>
(function(){
"use strict";
var C=document.getElementById('sky'),X=C.getContext('2d');
var W=1,H=1,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=C.clientWidth;H=C.clientHeight;
  C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);X.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------- persistence, forward only ---------- */
var K='ec93.roof.v1';
var S={len:190, grit:null, spools:3, lost:0, cut:0, pesos:800};
try{var raw=localStorage.getItem(K); if(raw){var o=JSON.parse(raw); if(o&&o.grit&&o.grit.length){S=o;}}}catch(e){}
if(!S.grit){ S.grit=[]; for(var i=0;i<200;i++)S.grit.push(1); }
function save(){ try{localStorage.setItem(K,JSON.stringify(S));}catch(e){} }
document.getElementById('price').textContent='$'+S.pesos;
function drawSpools(){var d=document.getElementById('spools');d.innerHTML='';
  for(var i=0;i<3;i++){var e=document.createElement('div');e.className='sp'+(i<S.spools?'':' gone');d.appendChild(e);} }
drawSpools();

/* ---------- world scale ---------- */
/* world units = metres. x downwind-ish across frame, y up. camera looks up-and-out from parapet. */
var M=1; // px per metre, computed in resize-dependent projection
function proj(x,y){ // world metres -> screen px. origin: reel at bottom-left-ish of parapet
  return [ORIGX + x*M, ORIGY - y*M];
}
var ORIGX=0,ORIGY=0;
function layout(){ M=Math.min(W,H)/95; if(M<3.4)M=3.4; ORIGX=W*0.22; ORIGY=H*0.965; }
layout();
var _r=resize; resize=function(){_r();layout();};
window.addEventListener('resize',function(){layout();});

/* ---------- wind field ---------- */
var wind={base:5.0,gust:0,gclock:0,dir:0};
function noise1(t){return Math.sin(t*1.13)*.5+Math.sin(t*2.37+1.1)*.3+Math.sin(t*4.9+2.2)*.2;}
var buildings=[{x:-34,h:16,w:16},{x:44,h:22,w:18}]; // Chorrillos taller, three roofs over
function windAt(x,y,t){
  var h=y; // metres above this roof
  var g=1;
  if(h<7){ g=0.34+0.66*(h/7); } // boundary layer dirty & slow
  var turb=0;
  if(h<11){ var k=(1-h/11); turb=k*(noise1(t*2.1+x*0.09)*1.9+noise1(t*3.7+y*0.13+9)*1.2); }
  // wakes from the two blocks
  for(var i=0;i<buildings.length;i++){var b=buildings[i];
    if(x>b.x-b.w*0.5 && x<b.x+b.w*0.5+26 && y<b.h+5){
      var f=1-Math.min(1,(x-(b.x-b.w*0.5))/30);
      g*= (1- 0.55*f*Math.max(0,1-Math.abs(y-b.h*0.6)/(b.h*0.9)) );
      turb += f*noise1(t*4.3+x*0.2+i*5)*2.4;
    }}
  var sp=(wind.base+wind.gust)*g;
  return {x: sp + turb*0.6, y: turb*0.55 + (h<4? -0.4:0.15)};
}

/* ---------- line body ---------- */
function Line(N,seglen,anchor){
  this.n=N;this.L=seglen;this.px=new Float32Array(N);this.py=new Float32Array(N);
  this.ox=new Float32Array(N);this.oy=new Float32Array(N);this.cut=-1;
  for(var i=0;i<N;i++){this.px[i]=anchor[0]+i*seglen*0.85;this.py[i]=anchor[1]+i*seglen*0.5;this.ox[i]=this.px[i];this.oy[i]=this.py[i];}
  this.tension=new Float32Array(N);
}
Line.prototype.step=function(dt,t,anchor,tipForce,mass){
  var n=this.n,px=this.px,py=this.py,ox=this.ox,oy=this.oy;
  for(var i=0;i<n;i++){
    var vx=(px[i]-ox[i]),vy=(py[i]-oy[i]);
    ox[i]=px[i];oy[i]=py[i];
    var w=windAt(px[i],py[i],t);
    var rx=w.x-vx/dt, ry=w.y-vy/dt;
    var sp=Math.hypot(rx,ry);
    var d=0.0009*sp; // per-segment drag coefficient
    var ax=rx*d, ay=ry*d-4.6; // gravity on cotton
    px[i]+=vx*0.995+ax*dt*dt;
    py[i]+=vy*0.995+ay*dt*dt;
  }
  // constraints
  for(var it=0;it<9;it++){
    px[0]=anchor[0];py[0]=anchor[1];
    for(var i=0;i<n-1;i++){
      if(this.cut>=0&&i===this.cut)continue;
      var dx=px[i+1]-px[i],dy=py[i+1]-py[i];var dl=Math.hypot(dx,dy)||1e-6;
      var diff=(dl-this.L)/dl;
      var wA=(i===0)?0:0.5, wB=(i+1===n-1&&mass)?0.35:0.5;
      var s=wA+wB; if(s<=0)s=1;
      px[i]+=dx*diff*(wA/s);py[i]+=dy*diff*(wA/s);
      px[i+1]-=dx*diff*(wB/s);py[i+1]-=dy*diff*(wB/s);
      this.tension[i]=Math.abs(dl-this.L)/this.L;
    }
  }
};

/* ---------- kite ---------- */
function Kite(colour,anchor,segs,mine){
  this.col=colour;this.mine=!!mine;
  this.line=new Line(segs,1.0,anchor);
  this.heading=-Math.PI*0.35; // nose direction
  this.spin=0; this.bow=0.5;
  this.alive=true;this.free=false;
  this.grit=null;
  this.x=0;this.y=0;this.vx=0;this.vy=0;
  var n=this.line.n;this.x=this.line.px[n-1];this.y=this.line.py[n-1];
  this.paper=Math.random()<0.5?0:1;
}
Kite.prototype.step=function(dt,t,pulling){
  var ln=this.line,n=ln.n;
  var i=n-1;
  var vx=(ln.px[i]-ln.ox[i])/dt, vy=(ln.py[i]-ln.oy[i])/dt;
  var w=windAt(ln.px[i],ln.py[i],t);
  var rx=w.x-vx, ry=w.y-vy;
  var arsp=Math.hypot(rx,ry);
  this.airspeed=arsp;
  // line tension at tip
  var dx=ln.px[i]-ln.px[i-1],dy=ln.py[i]-ln.py[i-1];
  var dl=Math.hypot(dx,dy)||1e-6;
  var taut = Math.max(0,(dl-ln.L))/ln.L;
  // slack detection: overall line straightness
  var span=Math.hypot(ln.px[i]-ln.px[0],ln.py[i]-ln.py[0]);
  var slackRatio = span/((n-1)*ln.L);
  this.taut=slackRatio;
  var tension = Math.max(0, (slackRatio-0.90))*11;
  if(this.free)tension=0;
  this.tension=tension;
  // heading dynamics: divergent in yaw, no tail
  var relAng=Math.atan2(ry,rx);
  var aoa=((this.heading-relAng+Math.PI*3)%(Math.PI*2))-Math.PI;
  var bowTurn = 0.55+this.bow*2.2;      // bowed spar -> fast turn
  var bowTrack= 1.9-this.bow*1.55;      // ...and poor tracking
  if(tension>0.06){
    // taut: drives on its heading. centre of pressure ahead of bridle = divergent, mildly damped by tension
    this.spin += (aoa*0.9*bowTurn - Math.sign(aoa)*bowTrack*tension*0.9)*dt*3.0;
    this.spin *= Math.pow(0.06,dt);
    this.drive = tension*arsp*0.55;
    var fx=Math.cos(this.heading)*this.drive, fy=Math.sin(this.heading)*this.drive;
    ln.px[i]+=fx*dt*dt*22;ln.py[i]+=fy*dt*dt*22;
  }else{
    // slack: autorotation
    this.spin += (arsp*0.32*bowTurn*(1+this.bow) - this.spin*1.4)*dt*2.2;
    this.drive=0;
  }
  this.spin=Math.max(-9,Math.min(9,this.spin));
  this.heading+=this.spin*dt;
  this.x=ln.px[i];this.y=ln.py[i];
  this.aoa=aoa;
};

/* ---------- grit / abrasion ---------- */
function freshGrit(n){var a=new Float32Array(n);for(var i=0;i<n;i++)a[i]=1;return a;}
function segIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  var r1=bx-ax,r2=by-ay,s1=dx-cx,s2=dy-cy;
  var den=r1*s2-r2*s1; if(Math.abs(den)<1e-9)return null;
  var t=((cx-ax)*s2-(cy-ay)*s1)/den;
  var u=((cx-ax)*r2-(cy-ay)*r1)/den;
  if(t>=0&&t<=1&&u>=0&&u<=1)return [t,u,ax+r1*t,ay+r2*t];
  return null;
}

/* ---------- entities ---------- */
var anchorMe=[0,0.6];
var segs=Math.max(24,Math.min(72,Math.round(S.len/3)));
var me=new Kite(0,anchorMe,segs,true);
me.line.L=S.len/segs;
me.grit=S.grit;
me.bow=0.5;

var oppAnchor=[44,22.4];
function makeOpp(){
  var k=new Kite(1,oppAnchor,34,false);
  k.line.L=2.4; k.grit=freshGrit(120); k.bow=0.62; k.paper=1;
  // his spool: bald where he actually fights
  for(var i=0;i<16;i++)k.grit[k.grit.length-1-i]=0.42+i*0.03;
  return k;
}
var opp=makeOpp();
var oppRespawn=0;

function makeNeighbour(ax,paper,len){
  var k=new Kite(2,ax,26,false);k.line.L=len/26;k.grit=freshGrit(60);k.bow=0.4;k.paper=paper;k.neighbour=true;return k;
}
var nb=[makeNeighbour([-34,16.4],0,58), makeNeighbour([-12,9.5],1,44)];

var kites=[me,opp].concat(nb);

/* ---------- the bag ---------- */
var bag={x:8,y:14,vx:2,vy:0,spin:0,ph:0};
function bagStep(dt,t){
  var w=windAt(bag.x,bag.y,t);
  var rx=w.x-bag.vx, ry=w.y-bag.vy;
  var sp=Math.hypot(rx,ry);
  var lift = Math.sin(t*0.7+bag.ph)*0.5+0.55;
  bag.vx += (rx*0.55)*dt;
  bag.vy += (ry*0.55 + sp*lift*0.34 - 2.2)*dt;
  bag.vx*=Math.pow(0.45,dt);bag.vy*=Math.pow(0.45,dt);
  bag.x+=bag.vx*dt;bag.y+=bag.vy*dt;
  if(bag.y<1.2){bag.y=1.2;bag.vy=Math.abs(bag.vy)*0.5+1.4;}
  if(bag.x>76){bag.x=76;bag.vx=-Math.abs(bag.vx)*0.6;}
  if(bag.x<-42){bag.x=-42;bag.vx=Math.abs(bag.vx)*0.6;}
  if(bag.y>70){bag.y=70;bag.vy=-0.4;}
  bag.spin+=dt*(1.5+sp*0.2);
  bag.ph+=dt*0.13;
}

/* ---------- opponent agent ---------- */
var oppState={mode:'give',timer:0,plan:0,err:0,pull:0};
function oppThink(dt,t){
  if(!opp.alive)return;
  oppState.timer-=dt;
  var dx=me.x-opp.x, dy=me.y-opp.y;
  var near=Math.hypot(dx,dy);
  if(oppState.timer<=0){
    oppState.err=(Math.random()-0.5)*0.9;
    // he wants to be above and upwind of you; he hauls when he thinks he's crossed
    if(near<16 && me.tension>0.35 && Math.random()<0.62){ oppState.mode='give'; oppState.timer=0.5+Math.random()*0.9; }
    else if(near<20 && Math.random()<0.55){ oppState.mode='pull'; oppState.timer=0.5+Math.random()*1.2; }
    else { oppState.mode=Math.random()<0.55?'pull':'give'; oppState.timer=0.6+Math.random()*1.6; }
  }
  var ln=opp.line,n=ln.n;
  if(oppState.mode==='pull'){ oppState.pull+= (1-oppState.pull)*dt*3.4; }
  else { oppState.pull+= (0-oppState.pull)*dt*3.0; }
  // reel: shorten / lengthen effective segment length
  var target = oppState.mode==='pull'? 2.05 : 2.62;
  ln.L += (target-ln.L)*dt*1.5;
  opp.heading += oppState.err*dt*0.5;
}

/* ---------- abrasion ---------- */
var contacts=[];
function abrade(dt){
  contacts.length=0;
  if(!me.alive)return;
  var A=me.line;
  for(var q=1;q<kites.length;q++){
    var k=kites[q]; if(!k.alive)continue;
    var B=k.line;
    for(var i=Math.max(1,A.n-46);i<A.n-1;i++){
      var a1x=A.px[i],a1y=A.py[i],a2x=A.px[i+1],a2y=A.py[i+1];
      for(var j=1;j<B.n-1;j++){
        var r=segIntersect(a1x,a1y,a2x,a2y,B.px[j],B.py[j],B.px[j+1],B.py[j+1]);
        if(!r)continue;
        // relative sliding speed at crossing
        var av=[(A.px[i]-A.ox[i])/dt,(A.py[i]-A.oy[i])/dt];
        var bv=[(B.px[j]-B.ox[j])/dt,(B.py[j]-B.oy[j])/dt];
        var slide=Math.hypot(av[0]-bv[0],av[1]-bv[1]);
        // add reeling speed: line running through the crossing
        slide += Math.abs(reelOut)*7 + (k===opp? Math.abs(oppState.pull-0.5)*3:0);
        var nfA=Math.min(2.2,me.tension*1.4+0.12);
        var nfB=Math.min(2.2,k.tension*1.4+0.12);
        var nf=Math.min(nfA,nfB)+0.05;
        var gi=Math.min(me.grit.length-1, Math.floor((i/(A.n-1))*me.grit.length));
        var gj=Math.min(k.grit.length-1, Math.floor((j/(B.n-1))*k.grit.length));
        var ga=me.grit[gi], gb=k.grit[gj];
        var work=slide*nf*dt;
        // both lose grit
        var wearA=work*0.055*(0.4+gb);
        var wearB=work*0.055*(0.4+ga);
        me.grit[gi]=Math.max(0,ga-wearA);
        k.grit[gj]=Math.max(0,gb-wearB);
        // damage: the one with less grit at the point takes it
        if(!k.dmg)k.dmg=new Float32Array(k.grit.length);
        if(!me.dmg)me.dmg=new Float32Array(me.grit.length);
        var tenA=me.tension, tenB=k.tension;
        me.dmg[gi]+= work*(gb*1.25+0.06)*(0.5+tenA*0.9)*0.16;
        k.dmg[gj] += work*(ga*1.25+0.06)*(0.5+tenB*0.9)*0.16;
        contacts.push({x:r[2],y:r[3],slide:slide,grit:Math.max(ga,gb),k:k});
        if(me.dmg[gi]>1.0){ severe(me,i); }
        else if(k.dmg[gj]>1.0){ severe(k,j); }
      }
    }
  }
}
function severe(k,idx){
  if(!k.alive)return;
  k.alive=false;k.free=true;k.cutIndex=idx;
  var L=k.line;
  var segsD=[];
  for(var i=idx;i<L.n;i++)segsD.push([L.px[i],L.py[i]]);
  drapes.push({pts:segsD,fall:0,vx:0.6+Math.random()});
  L.cut=idx;
  if(k===me){
    S.lost++; S.len=Math.max(0,S.len-(me.line.n-idx)*me.line.L);
    say(pick(SAY.lost));
    audioSnap(0.55);
    setTimeout(relaunchMe,3200);
  }else{
    if(k===opp){ S.cut++; oppRespawn=90; say(pick(SAY.cut)); audioSnap(0.8); }
    else { say(pick(SAY.accident)); audioSnap(0.4); } /* she does not count these */
  }
  save();
}
function relaunchMe(){
  if(S.len<12){ if(S.spools>0){ openSpool(); } else { say(SAY.over[0]); return; } }
  var n=Math.max(20,Math.min(72,Math.round(S.len/3)));
  me=new Kite(0,anchorMe,n,true);
  me.line.L=S.len/n; me.grit=S.grit.slice? S.grit.slice(0,n*3):S.grit; me.grit=S.grit;
  me.bow=parseFloat(me.bow)||0.5;
  me.dmg=null;
  kites[0]=me;
  drawBow();
  say(pick(SAY.launch));
}
function openSpool(){
  if(S.spools<=0)return;
  S.spools--;S.len=190;
  S.grit=[];for(var i=0;i<200;i++)S.grit.push(1);
  S.pesos+=800;
  document.getElementById('price').textContent='$'+S.pesos;
  drawSpools();drawSpools();save();
  say(pick(SAY.spool));
}

function skyCol(y01){
  // y01: 0 top, 1 bottom
  var t=y01;
  function mix(a,b,f){return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
  var top=[126,163,189],mid=[169,191,203],bot=[207,198,179];
  var c = t<0.55? mix(top,mid,t/0.55) : mix(mid,bot,(t-0.55)/0.45);
  return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
}
function drawSky(){
  var g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7ea3bd');g.addColorStop(0.55,'#a9bfcb');g.addColorStop(1,'#cfc6b3');
  X.fillStyle=g;X.fillRect(0,0,W,H);
}
function drawCordillera(){
  var base=ORIGY-13*M;
  X.fillStyle='rgba(150,146,140,0.34)';
  X.beginPath();X.moveTo(0,base+18);
  var n=14;
  for(var i=0;i<=n;i++){var x=i/n*W;
    var y=base - (Math.sin(i*1.7)*0.5+Math.sin(i*0.63+2)*0.5+1)*10 - 6;
    X.lineTo(x,y);}
  X.lineTo(W,base+40);X.closePath();X.fill();
}
function drawBuildings(){

  X.fillStyle='#8f8b80';
  for(var i=0;i<buildings.length;i++){var b=buildings[i];
    var p1=proj(b.x-b.w/2,b.h),p2=proj(b.x+b.w/2,0);
    X.fillRect(p1[0],p1[1],p2[0]-p1[0],ORIGY-p1[1]+40);
    X.fillStyle='#9c4a2c';X.fillRect(p1[0],p1[1]-3,p2[0]-p1[0],3);X.fillStyle='#8f8b80';
  }
}
function drawRoof(){

  X.fillStyle='#8f8b80';X.fillRect(0,top,W,H-top);
  // tar patches
  X.fillStyle='rgba(60,58,54,0.20)';

function paperFill(kite,through,paper){
  // through: 0..1 how much sun is straight through it
  var A=[226,53,123], B=[242,196,0], WH=[251,233,239], SIL=[90,58,69];
  var base = paper? B:A;
  var c;
  if(through>0.5){var f=(through-0.5)/0.5;c=[base[0]+(WH[0]-base[0])*f,base[1]+(WH[1]-base[1])*f,base[2]+(WH[2]-base[2])*f];}
  else{var f2=1-through/0.5;c=[base[0]+(SIL[0]-base[0])*f2*0.85,base[1]+(SIL[1]-base[1])*f2*0.85,base[2]+(SIL[2]-base[2])*f2*0.85];}
  return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
}
function drawKite(k){
  if(!k.alive&&!k.free)return;
  var p=proj(k.x,k.y);
  var hd=k.heading;
  // "edge-on to the sun" -> translucency. sun is behind/left.
  var edge=Math.abs(Math.cos(hd+0.6));
  var through=Math.pow(1-edge,1.3);
  var s=M*1.55*(k.mine?1.15:1.0);
  var squash=0.28+0.72*Math.abs(Math.sin(hd+0.6)); // banked away -> flat
  X.save();X.translate(p[0],p[1]);X.rotate(hd+Math.PI/2);
  X.scale(1,squash);
  X.fillStyle=paperFill(k,through,k.paper);
  X.beginPath();
  X.moveTo(0,-s*1.15);X.lineTo(s*0.9,-s*0.15);X.lineTo(s*0.62,s*1.0);
  X.lineTo(-s*0.62,s*1.0);X.lineTo(-s*0.9,-s*0.15);X.closePath();X.fill();
  if(through>0.45){
    X.strokeStyle='rgba(60,38,44,'+(0.35+through*0.5)+')';X.lineWidth=Math.max(0.7,M*0.11);
    X.beginPath();X.moveTo(0,-s*1.15);
    var bd=k.bow*s*0.55;
    X.quadraticCurveTo(bd,0,0,s*1.0);X.stroke();
    X.beginPath();X.moveTo(-s*0.9,-s*0.15);X.lineTo(s*0.9,-s*0.15);X.stroke();
  }
  X.restore();
}
function drawLine(k){
  var L=k.line;
  var start = (L.cut>=0)? 0 : 0;
  var end = (L.cut>=0)? L.cut : L.n-1;
  for(var i=start;i<end;i++){
    var a=proj(L.px[i],L.py[i]),b=proj(L.px[i+1],L.py[i+1]);
    var gi=Math.min(k.grit.length-1, Math.floor((i/(L.n-1))*k.grit.length));
    var g=k.grit[gi];
    var yf=Math.min(1,Math.max(0,b[1]/H));
    var alpha = 0.16+0.30*(1-yf); // vanishes near the pale horizon
    X.strokeStyle='rgba(185,174,151,'+alpha.toFixed(3)+')';
    X.lineWidth=1;
    X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();
    // specular glint where grit remains
    if(g>0.22){
      var ph=Math.sin(i*1.9+T*3.1+ (k.mine?0:2));
      if(ph>0.55){
        X.strokeStyle='rgba(255,252,240,'+(0.10+g*0.5*(ph-0.55)/0.45).toFixed(3)+')';
        X.lineWidth=1.2;X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();
      }
    }
  }
}
function drawBag(){
  var p=proj(bag.x,bag.y);
  var s=M*1.1;
  X.save();X.translate(p[0],p[1]);X.rotate(bag.spin*0.7);
  X.fillStyle='rgba(28,26,28,0.92)';
  X.beginPath();
  for(var i=0;i<7;i++){
    var a=i/7*Math.PI*2;
    var r=s*(0.55+0.5*Math.abs(Math.sin(a*2.3+bag.spin)));
    var x=Math.cos(a)*r, y=Math.sin(a)*r*0.72;
    i?X.lineTo(x,y):X.moveTo(x,y);
  }
  X.closePath();X.fill();X.restore();
}
function drawDrapes(){
  for(var d=0;d<drapes.length;d++){
    var D=drapes[d];
    X.strokeStyle='rgba(185,174,151,0.22)';X.lineWidth=1;X.beginPath();
    for(var i=0;i<D.pts.length;i++){

      i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]);
    }

  }
}
function drawReel(){
  var p=proj(0,0.4);

  var r=M*1.5;
  X.rotate(reelAngle);

var AC=null,master=null,on=false;

function audioStart(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  // paper drumming: filtered noise
  var buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  function noiseSrc(){var s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;}
  nodes.paperN=noiseSrc();nodes.paperF=AC.createBiquadFilter();nodes.paperF.type='bandpass';nodes.paperF.Q.value=1.1;
  nodes.paperG=AC.createGain();nodes.paperG.gain.value=0;
  nodes.paperN.connect(nodes.paperF).connect(nodes.paperG).connect(master);
  // amplitude flutter
  nodes.flutLFO=AC.createOscillator();nodes.flutGain=AC.createGain();nodes.flutGain.gain.value=0.5;
  nodes.flutLFO.frequency.value=9;nodes.flutLFO.connect(nodes.flutGain).connect(nodes.paperG.gain);nodes.flutLFO.start();
  // line singing
  nodes.sing=AC.createOscillator();nodes.sing.type='sawtooth';nodes.singF=AC.createBiquadFilter();
  nodes.singF.type='lowpass';nodes.singF.frequency.value=900;
  nodes.singG=AC.createGain();nodes.singG.gain.value=0;
  nodes.sing.connect(nodes.singF).connect(nodes.singG).connect(master);nodes.sing.frequency.value=120;nodes.sing.start();
  // rasp at crossing
  nodes.raspN=noiseSrc();nodes.raspF=AC.createBiquadFilter();nodes.raspF.type='highpass';nodes.raspF.frequency.value=2400;
  nodes.raspG=AC.createGain();nodes.raspG.gain.value=0;
  nodes.raspN.connect(nodes.raspF).connect(nodes.raspG).connect(master);
  // spool rattle
  nodes.ratN=noiseSrc();nodes.ratF=AC.createBiquadFilter();nodes.ratF.type='bandpass';nodes.ratF.frequency.value=420;nodes.ratF.Q.value=6;
  nodes.ratG=AC.createGain();nodes.ratG.gain.value=0;
  nodes.ratN.connect(nodes.ratF).connect(nodes.ratG).connect(master);
  // television through the stairwell
  nodes.tvN=noiseSrc();nodes.tvF=AC.createBiquadFilter();nodes.tvF.type='bandpass';nodes.tvF.frequency.value=760;nodes.tvF.Q.value=1.6;
  nodes.tvG=AC.createGain();nodes.tvG.gain.value=0.006;
  nodes.tvN.connect(nodes.tvF).connect(nodes.tvG).connect(master);
  nodes.tvLFO=AC.createOscillator();nodes.tvLFO.frequency.value=2.7;var tg=AC.createGain();tg.gain.value=340;
  nodes.tvLFO.connect(tg).connect(nodes.tvF.frequency);nodes.tvLFO.start();
  master.gain.linearRampToValueAtTime(on?0.9:0,AC.currentTime+0.4);
}
var busT=6+Math.random()*10, dogT=14+Math.random()*22;
function bus(){
  if(!AC)return;
  var t=AC.currentTime, g=AC.createGain(),o=AC.createOscillator(),f=AC.createBiquadFilter();
  o.type='sawtooth';f.type='lowpass';f.frequency.value=300;
  o.connect(f).connect(g).connect(master);g.gain.value=0;
  o.frequency.setValueAtTime(52,t);
  var tt=t;
  for(var gear=0;gear<3;gear++){
    o.frequency.linearRampToValueAtTime(52+gear*10, tt+0.05);
    o.frequency.linearRampToValueAtTime(110+gear*14, tt+1.5);
    o.frequency.linearRampToValueAtTime(60+gear*12, tt+1.7);
    tt+=1.7;
  }
  g.gain.linearRampToValueAtTime(0.05,t+0.7);g.gain.setValueAtTime(0.05,tt-1.2);
  g.gain.linearRampToValueAtTime(0,tt+0.6);
  o.start(t);o.stop(tt+0.8);
}
function dog(){
  if(!AC)return;
  var t=AC.currentTime;
  for(var i=0;i<(2+((Math.random()*3)|0));i++){
    var o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='square';f.type='bandpass';f.frequency.value=520;f.Q.value=3;
    o.connect(f).connect(g).connect(master);
    var s=t+i*(0.28+Math.random()*0.18);
    o.frequency.setValueAtTime(300,s);o.frequency.exponentialRampToValueAtTime(160,s+0.13);
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.03,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0006,s+0.16);
    o.start(s);o.stop(s+0.2);
  }
}
function audioSnap(v){
  if(!AC)return;var t=AC.currentTime;
  var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(90,t+0.18);
  g.gain.setValueAtTime(0.09*v,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.3);
  o.connect(g).connect(master);o.start(t);o.stop(t+0.32);
}
function paperBag(){
  if(!AC)return;var t=AC.currentTime;
  var b=AC.createBufferSource();
  var buf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);var d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)*(Math.random()<0.3?1:0.2);}
  b.buffer=buf;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800;
  var g=AC.createGain();g.gain.value=0.06;
  b.connect(f).connect(g).connect(master);b.start(t);
}
var sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',function(){
  on=!on; sndBtn.className=on?'':'off';
  audioStart(); if(AC&&master){master.gain.linearRampToValueAtTime(on?0.9:0,AC.currentTime+0.25);}
  if(on)paperBag();
});
function audioUpdate(dt){
  if(!AC||!on)return;
  var t=AC.currentTime;
  var as=me.alive?(me.airspeed||0):0;
  var aoa=Math.abs(me.aoa||0);
  var stall = aoa>1.0;
  nodes.paperF.frequency.setTargetAtTime(240+as*70+(stall?0:340),t,0.08);
  nodes.paperG.gain.setTargetAtTime(me.alive?Math.min(0.05,0.006+as*0.0045):0.0,t,0.1);
  nodes.flutLFO.frequency.setTargetAtTime(stall?6+as*0.7:22+as*4.2,t,0.1);
  var ten=me.tension||0;
  var pitch = 60 + ten*260 + (S.len>0? 2000/(S.len+18):0);
  nodes.sing.frequency.setTargetAtTime(pitch,t,0.07);
  nodes.singG.gain.setTargetAtTime(Math.min(0.035,ten*0.05),t,0.09);
  nodes.singF.frequency.setTargetAtTime(500+ten*2400,t,0.1);
  var maxC=0,gr=0;
  for(var i=0;i<contacts.length;i++){if(contacts[i].slide>maxC){maxC=contacts[i].slide;gr=contacts[i].grit;}}
  nodes.raspG.gain.setTargetAtTime(Math.min(0.09,maxC*0.006),t,0.03);
  nodes.raspF.frequency.setTargetAtTime(700+gr*7000,t,0.05);
  nodes.ratG.gain.setTargetAtTime(Math.min(0.05,Math.abs(reelOut)*0.35),t,0.05);
  nodes.ratF.frequency.setTargetAtTime(300+Math.abs(reelOut)*900,t,0.06);
}

/* ---------- main loop ---------- */
var T=0, last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now; T+=dt;
  // wind gusts on their own clock
  wind.gclock-=dt;
  if(wind.gclock<=0){ wind.gclock=2.5+Math.random()*7; wind.gtarget=(Math.random()*Math.random())*4.2-0.5; }
  wind.gust += ((wind.gtarget||0)-wind.gust)*dt*1.4;
  wind.base = 5.0 + noise1(T*0.11)*0.8;

  // control -> reel
  haul*=Math.pow(0.02,dt);
  lateral*=Math.pow(0.05,dt);
  var pull=Math.max(-1.2,Math.min(1.6,haul));
  reelOut = -pull;
  reelAngle += reelOut*dt*5.5;

  if(me.alive){
    var L=me.line;
    var targ = L.L*(1 - pull*0.10);
    // reeling changes effective length; taking in shortens available line permanently only when it goes out
    L.L += (targ-L.L)*dt*3.5;
    L.L=Math.max(S.len/L.n*0.72, Math.min(S.len/L.n*1.06, L.L));
    me.heading += lateral*4.0*dt*(0.6+me.bow*1.6);
  }

  bagStep(dt,T);

  for(var i=0;i<kites.length;i++){
    var k=kites[i];
    if(!k.alive&&!k.free)continue;
    if(k.free){
      // cut kite: flutters off downwind, flat and slow
      var w=windAt(k.x,k.y,T);
      k.vx=(k.vx||0)+ (w.x-k.vx)*dt*1.1;
      k.vy=(k.vy||0)+ (w.y-k.vy-1.6)*dt*1.1;
      k.x+=k.vx*dt;k.y+=k.vy*dt;
      k.heading+=Math.sin(T*3+k.paper)*dt*1.4;
      if(k.y<0.4){k.y=0.4;}
      if(k.x>110||k.x<-70)k.free=false;
      continue;
    }
    var anch = k.mine? proj0(anchorMe): (k===opp? oppAnchor : k.line.anchor||[k.line.px[0],k.line.py[0]]);
    if(!k.mine&&!k.anch)k.anch=[k.line.px[0],k.line.py[0]];
    k.line.step(dt,T, k.mine? anchorMe : (k===opp?oppAnchor:k.anch), 0, true);
    k.step(dt,T);
  }
  function proj0(a){return a;}

  oppThink(dt,T);
  // neighbours drift lazily
  for(var q=0;q<nb.length;q++){ nb[q].line.L += (nb[q].line.L0||(nb[q].line.L0=nb[q].line.L)) ? 0:0;
    nb[q].heading += Math.sin(T*0.6+q*2)*dt*0.6; }

  abrade(dt);

  if(oppRespawn>0){ oppRespawn-=dt; if(oppRespawn<=0){ opp=makeOpp(); kites[1]=opp; oppState={mode:'give',timer:0,plan:0,err:0,pull:0}; say("There he is again. Ninety seconds to get another one up, I counted. He ties a bad bridle when he's in a hurry."); } }

  // drapes settle
  for(var d2=0;d2<drapes.length;d2++){
    var D=drapes[d2];D.fall+=dt;
    for(var i2=0;i2<D.pts.length;i2++){
      if(D.pts[i2][1]>1.6){ D.pts[i2][1]-= dt*(1.2+i2*0.02); D.pts[i2][0]+= dt*D.vx; }
    }
  }
  if(drapes.length>6)drapes.shift();

  // line runs shorter when it goes out (forward only)
  if(me.alive && reelOut>0.25){ S.len=Math.max(0,S.len); }
  // grit persistence
  if(me.grit){ for(var gi2=0;gi2<S.grit.length&&gi2<me.grit.length;gi2++) S.grit[gi2]=me.grit[gi2]; }
  if(((T*10)|0)%50===0) save();

  // out of spool?
  if(S.spools===0 && S.len<12 && !me.alive){ /* over */ }
  var totalGrit=0;for(var g3=0;g3<S.grit.length;g3++)totalGrit+=S.grit[g3];
  if(totalGrit/S.grit.length<0.06 && S.spools>0 && !me.overSaid){ me.overSaid=true; say("This spool's finished. Bald where it matters and sharp where it never goes. Open the next one — eight hundred, it's on the tape."); }

  talk(dt);
  audioUpdate(dt);
  busT-=dt;if(busT<=0){busT=13+Math.random()*26;bus();}
  dogT-=dt;if(dogT<=0){dogT=18+Math.random()*30;dog();}

  // ---- render ----
  drawSky();
  drawCordillera();
  drawBuildings();
  drawDrapes();
  for(var i3=0;i3<kites.length;i3++){var k3=kites[i3];if(k3.alive)drawLine(k3);}
  drawBag();
  for(var i4=0;i4<kites.length;i4++)drawKite(kites[i4]);
  // crossing rasp marks
  for(var c3=0;c3<contacts.length;c3++){
    var p=proj(contacts[c3].x,contacts[c3].y);
    X.fillStyle='rgba(251,233,239,'+Math.min(0.8,contacts[c3].slide*0.05)+')';
    X.fillRect(p[0]-1.5,p[1]-1.5,3,3);
  }
  drawRoof();
  drawReel();
  requestAnimationFrame(frame);
}

/* open a spool when tapped on the count */
document.getElementById('spools').style.pointerEvents='auto';
document.getElementById('hud').style.pointerEvents='auto';
document.getElementById('spools').addEventListener('click',function(){ if(S.len<40||!me.alive){openSpool();relaunchMe();} else {say("Not yet. There's line on this one still and I paid for it.");}});

requestAnimationFrame(frame);

console.log("hilo curado — first 18 m is the only part that ever fights. the rest of the spool is beautiful and completely useless.");
})();
</script>
