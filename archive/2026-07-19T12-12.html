  <meta name="outbox-spec-era" content="Morning break, 1983 — a British primary-school playground at the height of conker season, blazers off, coat pockets bulging with horse-chestnuts, a scuffed ring of kids round two duellists and everyone swearing blind their nut's a proven sixer. Not a fond look-back at a playground ritual the health-and-safety people supposedly killed and not a 'nobody plays conkers anymore' lament — a live match happening RIGHT NOW on the wet tarmac, breath steaming, the bell about to go and one more go begged before it does.">
  <meta name="outbox-spec-format" content="The whole viewport IS a stretch of morning playground tarmac seen head-on: your horse-chestnut hangs on its knotted bootlace at the top of the screen, and the opponent's conker dangles dead-still in the middle. You genuinely play a match — press and HOLD the mouse (or SPACEBAR) to draw your conker back and up along a taut power-arc, then RELEASE to swing it down on its string in a real pendulum, its speed and reach set by how far you wound it. A well-charged swing timed onto the hanging target lands a solid crack that chips it; a mistimed one whiffs past and swings harmlessly; three good cracks smash the target clean off its lace. Beat it and a fresh opponent's nut is threaded up to dangle in its place. No browser chrome, no header, no menu — just the tarmac, the two conkers, and the lace in your hand.">
  <meta name="outbox-spec-subject" content="The plain physics and playground lore of one game of conkers — a horse-chestnut threaded on a bootlace, the wind-up and the honest pendulum swing, why a fast flat strike bites deeper than a lazy one, how a shell already spider-cracked from an earlier duel goes on the very next good hit, and the whole daft honours system where the winner's conker swallows the loser's tally (a fresh 'none-er' beats a sixer and struts off a seven-er). The rituals every kid swears by and every kid denies doing — the week in vinegar, the low oven, the season spent hardening in the airing cupboard, the horse-chestnut off the good tree by the church that everyone says is best. Not a metaphor for fragility or childhood or the passing of anything — literally a chestnut, a string, an arc, and whether it holds together long enough to crack the other one first.">
  <meta name="outbox-spec-tone" content="The nervy, superstitious, hopelessly-over-explaining voice of a kid who is TERRIFIED of losing their prize conker — narrating every swing under their breath, reciting the whole secret hardening ritual to nobody in particular ('I did it in vinegar a WHOLE week and dried it slow, it's been in the airing cupboard since Easter, it should hold, it should, come on—'), talking themselves through the wind-up, flinching at every knock, going giddy-limp with relief when the other one cracks first. Earnest, breathless, jinx-scared, entirely sincere, warm underneath the panic. Never boastful-cool, never dry, never arch, never wistful, never a life-lesson about breakable things — just a kid who loves this one particular conker far too much and cannot bear to watch it smash.">

  <meta name="outbox-spec-wildcard" content="Exactly one opponent conker — a shrivelled iron-grey one the ring of kids call 'the Pickle,' plainly baked hard and soaked in vinegar till it rings like a marble — simply will not crack: land as many perfect direct hits on it as you like and it never chips, never spider-cracks, never comes off its lace; it's always your own conker that flinches away instead. It is never labelled on the page, never explained, never scored any differently. It just turns up again as the same undefeatable grey nut every visit, for whoever keeps swinging at the one that won't break.">

<title>One More Before the Bell — a proper conker on a proper string</title>
<!-- it's off the good tree by the church. everyone knows that tree's the best. don't say I baked it. I never baked it. -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#c7d2d6;overflow:hidden;
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #tarmac{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer;}
  .overlay{position:fixed;left:0;right:0;pointer-events:none;text-align:center;}
  #narr{bottom:11%;font-size:clamp(15px,4.4vw,22px);color:#3a2612;font-style:italic;
    padding:0 6vw;line-height:1.35;opacity:0;transform:translateY(6px);
    transition:opacity .25s ease,transform .25s ease;text-shadow:0 1px 0 rgba(255,255,255,.35);}
  #narr.show{opacity:1;transform:translateY(0);}
  #lore{bottom:5.5%;font-size:clamp(11px,3vw,14px);color:#6b3410;opacity:.62;font-style:italic;
    padding:0 8vw;letter-spacing:.2px;transition:opacity .8s ease;}
  #hint{top:auto;bottom:18.5%;font-size:clamp(12px,3.2vw,15px);color:#4a5458;opacity:.85;
    letter-spacing:.4px;transition:opacity .6s ease;}
  #hint.gone{opacity:0;}
  footer{position:fixed;left:10px;bottom:8px;z-index:5;font-size:11px;font-style:italic;}
  footer a{color:#5a6468;text-decoration:none;border-bottom:1px dotted #9aa4a8;}
  footer a:hover{color:#c1272d;border-bottom-color:#c1272d;}
</style>
</head>
<body>
<canvas id="tarmac"></canvas>
<div id="hint" class="overlay">hold the mouse (or the spacebar) to wind it up — let go to swing</div>
<div id="narr" class="overlay"></div>
<div id="lore" class="overlay">it's been up in the airing cupboard since Easter, it should be like iron by now—</div>
<footer><a href="/archive">round the back of the railings — the rest of them &rarr;</a></footer>
<script>
(function(){
"use strict";
var cv=document.getElementById("tarmac"), ctx=cv.getContext("2d");
var narrEl=document.getElementById("narr"), loreEl=document.getElementById("lore"), hintEl=document.getElementById("hint");
var W,H,S,px,py,L,R,tx,ty,DPR;
var THETAT=0.92, K=20;

/* ---------- persistent honours tally ---------- */
var tally=0;
try{ var s=localStorage.getItem("conker.tally"); if(s!==null) tally=parseInt(s,10)||0; }catch(e){}
function saveTally(){ try{ localStorage.setItem("conker.tally",String(tally)); }catch(e){} }
var WORDS=["none","one","two","three","four","five","six","seven","eight","nine","ten",
"eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
function word(n){ return WORDS[n]!==undefined?WORDS[n]:String(n); }

/* ---------- state ---------- */
var phase="ready";            // ready | charging | swinging
var theta=0, omega=0, prevTheta=0, windAngle=0, windSpeed=3.2, maxWind=3.0;
var overwound=false, hitOccurred=false, whiffPlayed=false, swingStart=0;
var playerGone=false, playerDmg=0;
var player={cracks:[]};
var opp=null, shards=[], speckle=[];

function newOpponent(forceNormal){
  var pk = forceNormal?false:(Math.random()<0.15);
  var t = pk?0:(Math.floor(Math.random()*7) + (Math.random()<0.15?7:0));
  opp={present:true,pickle:pk,tally:t,dmg:0,cracks:[]};
}
newOpponent(true);

/* ---------- geometry ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight; S=Math.min(W,H);
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  px=W*0.5; py=H*0.14;
  R=Math.max(16,Math.min(40,S*0.055));
  L=Math.min(S*0.44,(W*0.5-R-12)/0.86,H*0.52); if(L<100)L=100;
  tx=px+L*Math.sin(THETAT); ty=py+L*Math.cos(THETAT);
  speckle=[];
  for(var i=0;i<70;i++) speckle.push([Math.random()*W,Math.random()*H,Math.random()*1.4+0.3,Math.random()*0.05+0.02]);
}
window.addEventListener("resize",resize); resize();

/* ---------- audio ---------- */
var AC=null, noiseBuf=null;
function audio(){
  if(AC) { if(AC.state==="suspended")AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  var n=AC.sampleRate*0.5, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  noiseBuf=b;
}
function env(g,t,a,r,pk){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(pk,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+r); }
function sndCrack(vol){ if(!AC)return; var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
  var g=AC.createGain(); s.connect(f); f.connect(g); g.connect(AC.destination); env(g,t,0.002,0.09,0.5*vol); s.start(t); s.stop(t+0.14);
  var o=AC.createOscillator(),og=AC.createGain(); o.type="triangle"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(70,t+0.1);
  o.connect(og); og.connect(AC.destination); env(og,t,0.002,0.11,0.35*vol); o.start(t); o.stop(t+0.16);
}
function sndChip(vol){ if(!AC)return; var t=AC.currentTime; var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=1600; var g=AC.createGain();
  s.connect(f); f.connect(g); g.connect(AC.destination); env(g,t,0.001,0.045,0.28*vol); s.start(t); s.stop(t+0.08); }
function sndWhiff(){ if(!AC)return; var t=AC.currentTime; var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(500,t); f.frequency.linearRampToValueAtTime(1400,t+0.22); f.Q.value=1.2;
  var g=AC.createGain(); s.connect(f); f.connect(g); g.connect(AC.destination); env(g,t,0.01,0.22,0.16); s.start(t); s.stop(t+0.28); }
function sndRing(vol){ if(!AC)return; var t=AC.currentTime, parts=[1180,1770,2380];
  for(var i=0;i<parts.length;i++){ var o=AC.createOscillator(),g=AC.createGain(); o.type="sine"; o.frequency.value=parts[i];
    o.connect(g); g.connect(AC.destination); env(g,t,0.001,0.35-i*0.07,(0.22-i*0.06)*vol); o.start(t); o.stop(t+0.4); } }
function sndSmash(){ if(!AC)return; var t=AC.currentTime; var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(300,t+0.3);
  var g=AC.createGain(); s.connect(f); f.connect(g); g.connect(AC.destination); env(g,t,0.002,0.32,0.5); s.start(t); s.stop(t+0.38);
  var o=AC.createOscillator(),og=AC.createGain(); o.type="square"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(50,t+0.28);
  o.connect(og); og.connect(AC.destination); env(og,t,0.002,0.3,0.22); o.start(t); o.stop(t+0.34); }

/* ---------- narration ---------- */
function pick(a){ return Array.isArray(a)?a[Math.floor(Math.random()*a.length)]:a; }
function narr(a){ narrEl.textContent=pick(a); narrEl.classList.remove("show"); void narrEl.offsetWidth; narrEl.classList.add("show"); }
var CRACK=["YES— that's one— that bit deep, that's one—","got it— right on— that's a proper crack—","ha— did you see that go IN— that's one on it—"];
var CHIP=["ohh only clipped it— barely— come on—","that just chipped it, half a crack, come on now—"];
var GRAZE=["barely grazed it— that's nothing— again—","weak, that was weak, my go, my go—"];
var WHIFF=["no— whiffed it— nowhere near—","argh— went right over the top— whiff—","missed clean— that's fine, that's fine, one more—","nowhere near, my go, my go, again—"];
var PK_SOLID=["it didn't even— nothing— not a mark on it—","I hit that DEAD on and it just rang— nothing—","that was perfect and it didn't chip— how's it not chipping—","straight on and mine jumped right off it— it just won't—"];
var PK_WEAK=["glanced right off it—","barely touched— like hitting a wall—"];
var SELF=["—no— that cracked MINE— it's fine it's a hairline it'll hold—","ow— that's my shell that went— no no it's alright, one line—","that's my one, stop— don't swing at that one again—"];
var PSMASH=["...no. no no no. it's gone. it's in bits. all that vinegar— all that— it's gone—","...it's in pieces. after Easter and everything. get a new one, quick, quick—"];

/* ---------- input ---------- */
function startCharge(){ audio(); if(phase!=="ready"||!opp.present||playerGone) return; phase="charging"; windAngle=0;
  hintEl.classList.add("gone"); }
function release(){ if(phase!=="charging") return;
  if(windAngle<0.35){ phase="ready"; windAngle=0; return; }
  phase="swinging"; theta=-windAngle; prevTheta=theta; omega=0; hitOccurred=false; whiffPlayed=false;
  overwound=windAngle>2.6; swingStart=performance.now();
}
cv.addEventListener("pointerdown",function(e){ e.preventDefault(); startCharge(); });
window.addEventListener("pointerup",function(){ release(); });
window.addEventListener("pointercancel",function(){ release(); });
window.addEventListener("keydown",function(e){ if(e.code==="Space"){ e.preventDefault(); if(!e.repeat) startCharge(); } });
window.addEventListener("keyup",function(e){ if(e.code==="Space"){ e.preventDefault(); release(); } });
cv.addEventListener("contextmenu",function(e){e.preventDefault();});

/* ---------- cracks & shards ---------- */
function addCrack(o,hair){
  var n=4+Math.floor(Math.random()*3), a=Math.random()*Math.PI*2, x=0,y=0, step=R*0.28, pts=[[0,0]];
  for(var i=0;i<n;i++){ a+=(Math.random()-0.5)*1.3; x+=Math.cos(a)*step; y+=Math.sin(a)*step; pts.push([x,y]); }
  o.cracks.push({pts:pts,hair:hair});
}
function spawnShards(cx,cy,grey){
  for(var i=0;i<9;i++){ var ang=Math.random()*Math.PI*2, sp=120+Math.random()*260;
    shards.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-80,rot:Math.random()*6,
      vr:(Math.random()-0.5)*10,sz:R*(0.25+Math.random()*0.4),a:1,grey:grey}); }
}
function updateShards(dt){
  for(var i=shards.length-1;i>=0;i--){ var s=shards[i]; s.vy+=620*dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    s.rot+=s.vr*dt; s.a-=0.55*dt; if(s.a<=0||s.y>H+60) shards.splice(i,1); }
}

/* ---------- hit resolution ---------- */
function resolveHit(w){
  hitOccurred=true;
  var solid=w>=4.0, chip=w>=2.2&&w<4.0;
  if(opp.pickle){
    sndRing(solid?1:0.7); omega=-Math.max(4.2,w*1.15);
    if(solid){ narr(PK_SOLID); if(Math.random()<0.42) playerCrack(); }
    else narr(PK_WEAK);
    return;
  }
  omega=-w*0.42;
  if(solid){ sndCrack(1); opp.dmg++; addCrack(opp,false); narr(CRACK); if(opp.dmg>=3) smashTarget(); }
  else if(chip){ sndChip(1); addCrack(opp,true); narr(CHIP); }
  else { sndChip(0.6); addCrack(opp,true); narr(GRAZE); }
}
function playerCrack(){
  playerDmg++; addCrack(player,false); sndCrack(0.85); narr(SELF);
  if(playerDmg>=3) smashPlayer();
}
function smashTarget(){
  sndSmash(); var beaten=opp.tally; opp.present=false; spawnShards(tx,ty,opp.pickle);
  tally=beaten+1; saveTally();
  narrEl.textContent="IT'S OFF— it came clean off— it HELD— it swallowed a "+word(beaten)+"-er, I'm a "+word(tally)+"-er now—";
  narrEl.classList.remove("show"); void narrEl.offsetWidth; narrEl.classList.add("show");
  setTimeout(function(){ newOpponent(false); },1300);
}
function smashPlayer(){
  sndSmash(); playerGone=true; var bx=px+L*Math.sin(theta), by=py+L*Math.cos(theta);
  spawnShards(bx,by,false); tally=0; saveTally(); narr(PSMASH);
  setTimeout(function(){ player.cracks=[]; playerDmg=0; playerGone=false; phase="ready"; theta=0; omega=0; windAngle=0; newOpponent(true); },1650);
}
function endSwing(){
  if(!hitOccurred&&!whiffPlayed){ whiffPlayed=true; sndWhiff(); narr(WHIFF); }
  phase="ready"; theta=0; omega=0; windAngle=0;
}

/* ---------- physics ---------- */
function step(dt){
  if(phase==="charging"){ windAngle=Math.min(maxWind,windAngle+windSpeed*dt); theta=-windAngle; }
  else if(phase==="swinging"){
    prevTheta=theta;
    omega += (-K*Math.sin(theta) - 0.85*omega)*dt;
    theta += omega*dt;
    if(!hitOccurred && !overwound && opp.present && prevTheta<THETAT && theta>=THETAT){
      resolveHit(Math.abs(omega));
    }
    var settled=(Math.abs(omega)<0.5 && Math.abs(theta)<0.2);
    if(settled || performance.now()-swingStart>2800) endSwing();
  }
  updateShards(dt);
}

/* ---------- drawing ---------- */
function drawConker(x,y,r,grey,cracks){
  ctx.save();
  ctx.beginPath();
  var N=26;
  for(var i=0;i<=N;i++){ var a=i/N*Math.PI*2, wob=grey?(0.10*Math.sin(a*3+1.3)+0.06*Math.sin(a*5)):(0.03*Math.sin(a*4));
    var rr=r*(1+wob); var xx=x+Math.cos(a)*rr, yy=y+Math.sin(a)*rr*0.97; if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
  ctx.closePath();
  var g;
  if(grey){ g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r*1.1);
    g.addColorStop(0,"#9aa0a4"); g.addColorStop(0.55,"#6a7074"); g.addColorStop(1,"#3d4247"); }
  else { g=ctx.createRadialGradient(x-r*0.36,y-r*0.42,r*0.08,x,y,r*1.08);
    g.addColorStop(0,"#b06a2e"); g.addColorStop(0.38,"#8a4417"); g.addColorStop(0.76,"#6b3410"); g.addColorStop(1,"#2a1206"); }
  ctx.fillStyle=g; ctx.fill();
  ctx.clip();
  if(grey){ ctx.strokeStyle="rgba(40,44,48,0.5)"; ctx.lineWidth=1;
    for(var k=0;k<5;k++){ ctx.beginPath(); var sa=k*1.1; ctx.moveTo(x-r*0.5+Math.cos(sa)*r*0.2,y-r*0.3+k*r*0.28-r*0.2);
      ctx.bezierCurveTo(x-r*0.1,y-r*0.2+k*r*0.28-r*0.2,x+r*0.2,y+r*0.1+k*r*0.2-r*0.2,x+r*0.55,y-r*0.1+k*r*0.24-r*0.2); ctx.stroke(); } }
  else {
    var eg=ctx.createRadialGradient(x+r*0.12,y+r*0.22,r*0.02,x+r*0.12,y+r*0.22,r*0.62);
    eg.addColorStop(0,"#160800"); eg.addColorStop(0.6,"rgba(20,8,0,0.5)"); eg.addColorStop(1,"rgba(20,8,0,0)");
    ctx.fillStyle=eg; ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.fillStyle="rgba(255,240,220,0.55)"; ctx.beginPath(); ctx.ellipse(x-r*0.34,y-r*0.4,r*0.22,r*0.15,-0.5,0,Math.PI*2); ctx.fill();
  }
  // cracks
  for(var c=0;c<cracks.length;c++){ var cr=cracks[c]; ctx.strokeStyle=cr.hair?"rgba(193,39,45,0.55)":"#c1272d";
    ctx.lineWidth=cr.hair?1:2; ctx.lineJoin="round"; ctx.beginPath();
    for(var p=0;p<cr.pts.length;p++){ var pxp=x+cr.pts[p][0], pyp=y+cr.pts[p][1]; if(p===0)ctx.moveTo(pxp,pyp); else ctx.lineTo(pxp,pyp);} ctx.stroke(); }
  ctx.restore();
}
function drawLace(ax,ay,bx,by){
  ctx.strokeStyle="#d8c9a0"; ctx.lineWidth=2.4; ctx.lineCap="round";
  var mx=(ax+bx)/2+(Math.random()<2?0:0), my=(ay+by)/2+6;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,bx,by); ctx.stroke();
  ctx.strokeStyle="rgba(150,132,88,0.5)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,bx,by); ctx.stroke();
}
function drawPowerArc(){
  if(phase!=="charging") return;
  ctx.save(); ctx.setLineDash([5,7]); ctx.strokeStyle="rgba(90,70,40,0.4)"; ctx.lineWidth=1.4;
  ctx.beginPath();
  for(var a=0;a<=windAngle;a+=0.06){ var xx=px+L*Math.sin(-a), yy=py+L*Math.cos(-a); if(a===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); } ctx.stroke();
  // sweet zone
  ctx.setLineDash([]); ctx.strokeStyle="rgba(193,39,45,0.32)"; ctx.lineWidth=3.5;
  var lo=1.45, hi=Math.min(windAngle,2.6);
  if(hi>lo){ ctx.beginPath(); for(var b=lo;b<=hi;b+=0.05){ var x2=px+L*Math.sin(-b),y2=py+L*Math.cos(-b); if(b===lo)ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);} ctx.stroke(); }
  ctx.restore();
}
function draw(){
  ctx.fillStyle="#c7d2d6"; ctx.fillRect(0,0,W,H);
  // tarmac speckle
  for(var i=0;i<speckle.length;i++){ var sp=speckle[i]; ctx.fillStyle="rgba(70,84,88,"+sp[3]+")"; ctx.fillRect(sp[0],sp[1],sp[2],sp[2]); }
  // scuffed chalk ring
  ctx.save(); ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=6; ctx.setLineDash([26,16]); ctx.lineCap="round";
  ctx.beginPath(); ctx.ellipse(W*0.5,H*0.6,Math.min(W*0.42,S*0.46),S*0.24,0,0,Math.PI*2); ctx.stroke(); ctx.restore();

  drawPowerArc();

  // target
  if(opp&&opp.present){ var tr=R*(opp.pickle?0.82:1); drawLace(tx,-4,tx,ty); drawConker(tx,ty,tr,opp.pickle,opp.cracks); }

  // player conker
  if(!playerGone){ var bx=px+L*Math.sin(theta), by=py+L*Math.cos(theta); drawLace(px,py,bx,by); drawConker(bx,by,R,false,player.cracks); }

  // knot + tally
  ctx.fillStyle="#c9b988"; ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#a8985f"; ctx.beginPath(); ctx.arc(px-2,py-1,2.4,0,Math.PI*2); ctx.fill();
  ctx.font="700 "+Math.max(11,S*0.026)+"px 'Segoe UI',Helvetica,Arial,sans-serif";
  ctx.fillStyle="#c1272d"; ctx.textBaseline="middle"; ctx.textAlign="left";
  ctx.fillText("THIS CONKER: A "+word(tally).toUpperCase()+"-ER", px+13, py-2);

  // shards
  for(var j=0;j<shards.length;j++){ var s=shards[j]; ctx.save(); ctx.globalAlpha=Math.max(0,s.a); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.fillStyle=s.grey?"#5a6064":"#5a2c0d"; ctx.beginPath(); ctx.moveTo(-s.sz,-s.sz*0.5); ctx.lineTo(s.sz,0); ctx.lineTo(-s.sz*0.4,s.sz); ctx.closePath(); ctx.fill();
    ctx.fillStyle=s.grey?"#3d4247":"#2a1206"; ctx.beginPath(); ctx.arc(0,0,s.sz*0.35,0,Math.PI*2); ctx.fill(); ctx.restore(); }
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){ var dt=Math.min(0.032,(now-last)/1000); last=now; step(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

/* ---------- muttered hardening lore ---------- */
var LORE=[
"I did it in vinegar a whole week, I did, a proper whole week—",
"dried it slow in the low oven, not too hot, just warm, all evening—",
"it's been up in the airing cupboard since Easter, it should be like iron by now—",
"this one's off the good tree by the church, everyone knows that tree's the best—",
"I never baked it. don't say I baked it. it's a proper natural one—",
"hold together, hold together, you've held this long, you can hold—",
"the bell's about to go — one more, just one more before it does—",
"it should hold, it should, it's had all summer, come on—"];
var li=0;
setInterval(function(){ li=(li+1)%LORE.length; loreEl.style.opacity=0;
  setTimeout(function(){ loreEl.textContent=LORE[li]; loreEl.style.opacity=0.62; },800); },5200);

try{ console.log("%cit's off the good tree by the church. everyone knows that tree's the best.","color:#6b3410;font-style:italic"); }catch(e){}
})();
</script>
