<title>Let Out a Little More String — The Hill Behind the School, a Windy Saturday</title>
<style>
/* the kite is magenta, yellow, teal and orange because those were the four markers that still worked */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#7fc8f8;font-family:"Trebuchet MS","Gill Sans",Verdana,sans-serif;color:#1d3557}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;padding:0 14px}
h1{font-size:clamp(20px,5.2vw,38px);letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 #e63986,0 4px 0 #1d3557}
.sub{margin-top:4px;font-size:clamp(12px,3.2vw,15px);color:#1d3557;background:#fff8;display:inline-block;padding:3px 10px;border-radius:20px}
#hud{position:fixed;top:clamp(84px,18vw,112px);left:12px;font-size:13px;background:#fffc;border-radius:12px;padding:8px 12px;line-height:1.5;border:2px solid #1d3557;box-shadow:3px 3px 0 #1d3557}
#hud b{color:#e63986;font-size:18px}
#say{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);max-width:88vw;text-align:center;font-size:clamp(17px,4.6vw,26px);font-weight:bold;color:#fff;text-shadow:0 2px 0 #1d3557,0 0 18px #1d355788;opacity:0;transition:opacity .6s,transform .6s;pointer-events:none}
#say.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#reel{position:fixed;right:12px;bottom:46px;display:flex;flex-direction:column;gap:8px}
#reel button{font:bold 15px inherit;font-family:inherit;padding:12px 14px;border-radius:14px;border:3px solid #1d3557;background:#ffd23f;color:#1d3557;box-shadow:3px 3px 0 #1d3557;touch-action:none;user-select:none;-webkit-user-select:none}
#reel button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1d3557}
#reel button.in{background:#fff}
footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 2px #0006;padding:0 10px}
footer a{color:#ffd23f;font-weight:bold}
footer small{display:block;opacity:.75;font-size:10px}

<body>
<canvas id="sky" role="img" aria-label="A hill with a small kid in a yellow raincoat holding a diamond kite on a long string. The kite has a tail of six ribbon bows, one for each birthday it has survived."></canvas>
<header><h1>Let Out a Little More String</h1><div class="sub">drag to run · hold the yellow button to give it line</div></header>
<div id="hud">up <b id="ft">0</b> ft<br>aloft <span id="al">0:00</span><br>best <span id="bs">0</span> ft<br>wind: <span id="wd">—</span></div>
<div id="say"></div>
<div id="reel"><button id="out" aria-label="let out string">let out ▲</button><button id="in" class="in" aria-label="reel in string">reel in ▼</button></div>
<footer>the other afternoons on this hill are kept in <a href="/archive">the kite bag</a>
<small>spars: two garden canes · sail: a shower curtain · tail: Mum's old scarf, cut into bows with permission (mostly)</small></footer>
<script>
console.log("%cIf the string goes slack, don't pull harder. Walk backwards. It knows what to do.","color:#e63986;font-size:14px;font-weight:bold");
const c=document.getElementById('sky'),x=c.getContext('2d');
let W,H,D;
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);}
size();addEventListener('resize',size);
const G=()=>H-64;
let tx=W*0.25,a={x:W*0.25,y:0},k={x:W*0.25+30,y:H-100},kv={x:0,y:0},L=60,reel=0,t=0,aloft=0,best=0,down=false,maxed=false;
const Lmax=()=>Math.max(140,Math.min(H-150,W*1.15));
const tail=[];for(let i=0;i<14;i++)tail.push({x:k.x,y:k.y+i*10,px:k.x,py:k.y+i*10});
const clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random()*1400,y:60+Math.random()*260,s:.6+Math.random()*.9});
const said=new Set(),sayEl=document.getElementById('say');let sayT=0;
const lines=[[12,"It's up! Keep your arm loose."],[45,"Over the swings!"],[95,"Higher than the bell on the school roof."],[160,"A gull flew right past it and looked impressed."],[230,"From up there it can see the whole reservoir, sparkling."],[300,"Dad has stopped talking and is just watching."]];
function say(s){sayEl.textContent=s;sayEl.classList.add('on');sayT=3.2;}
c.addEventListener('pointerdown',e=>{down=true;tx=e.clientX;c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(down||e.pointerType==='mouse')tx=e.clientX;});
c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
function hold(id,v){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();reel=v;});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{if(reel===v)reel=0;}));}
hold('out',1);hold('in',-1);
addEventListener('keydown',e=>{if(e.key==='ArrowUp')reel=1;if(e.key==='ArrowDown')reel=-1;if(e.key==='ArrowLeft')tx-=40;if(e.key==='ArrowRight')tx+=40;});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown')reel=0;});
function windAt(t){return Math.max(.12,.72+.38*Math.sin(t*.27)+.22*Math.sin(t*1.3+1)+.1*Math.sin(t*3.1));}
function cloud(cx,cy,s){x.fillStyle='#fff';x.beginPath();[[0,0,34],[30,-12,28],[58,2,30],[28,10,30]].forEach(p=>{x.moveTo(cx+p[0]*s+p[2]*s,cy+p[1]*s);x.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,7);});x.fill();}
function step(dt){
  t+=dt;const w=windAt(t),g=G();
  tx=Math.min(W-60,Math.max(20,tx));a.x+=(tx-a.x)*.12;a.y=g-40;
  L=Math.min(Lmax(),Math.max(40,L+reel*2.4));
  kv.x+=w*.15;kv.y+=.12-w*.22;kv.x*=.97;kv.y*=.97;k.x+=kv.x;k.y+=kv.y;
  const dx=k.x-a.x,dy=k.y-a.y,d=Math.hypot(dx,dy)||1;
  if(d>L){const nx=dx/d,ny=dy/d;k.x=a.x+nx*L;k.y=a.y+ny*L;const vd=kv.x*nx+kv.y*ny;if(vd>0){kv.x-=nx*vd;kv.y-=ny*vd;}}
  if(k.x>W-24){k.x=W-24;kv.x=Math.min(0,kv.x);}if(k.x<24){k.x=24;kv.x=Math.max(0,kv.x);}
  if(k.y<20){k.y=20;kv.y=Math.max(0,kv.y);}
  if(k.y>g-30){k.y=g-30;kv.y*=-.2;kv.x*=.8;}
  const ang=Math.atan2(k.x-a.x,a.y-k.y)*.35+Math.sin(t*2.3)*.05*w;
  tail[0].x=k.x-Math.sin(ang)*32;tail[0].y=k.y+Math.cos(ang)*32;
  for(let i=1;i<tail.length;i++){const p=tail[i],vx=(p.x-p.px)*.95,vy=(p.y-p.py)*.95;p.px=p.x;p.py=p.y;p.x+=vx+w*.35;p.y+=vy+.3;}
  for(let r=0;r<3;r++)for(let i=1;i<tail.length;i++){const p=tail[i],q=tail[i-1],ex=p.x-q.x,ey=p.y-q.y,dd=Math.hypot(ex,ey)||1,f=(dd-10)/dd;p.x-=ex*f;p.y-=ey*f;}
  clouds.forEach(cl=>{cl.x+=w*.35*cl.s;if(cl.x>W+120)cl.x=-160;});
  const ft=Math.round(Math.max(0,g-30-k.y)*.6);
  if(ft>20)aloft+=dt;best=Math.max(best,ft);
  lines.forEach(l=>{if(ft>=l[0]&&!said.has(l[0])){said.add(l[0]);say(l[1]);}});
  if(!maxed&&L>=Lmax()-1&&d>=L-2&&ft>40){maxed=true;say("That's all the string there is. Just hold on and look up.");}
  if(sayT>0){sayT-=dt;if(sayT<=0)sayEl.classList.remove('on');}
  document.getElementById('ft').textContent=ft;document.getElementById('bs').textContent=best;
  const s=Math.floor(aloft);document.getElementById('al').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  document.getElementById('wd').textContent=w<.45?'a lull… hold steady':w<.8?'breezy':w<1.1?'lovely and gusty':'WHOOSH';
  return {w,ang,d,g};
}
function draw(s){
  const {ang,d,g}=s;
  const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3a8fd8');sky.addColorStop(.6,'#8fd3ff');sky.addColorStop(1,'#e8f7ff');x.fillStyle=sky;x.fillRect(0,0,W,H);
  const sx=W-70,sy=110;x.fillStyle='#ffe066';x.beginPath();x.arc(sx,sy,34,0,7);x.fill();
  x.strokeStyle='#ffe06699';x.lineWidth=4;for(let i=0;i<12;i++){const r=t*.2+i*Math.PI/6;x.beginPath();x.moveTo(sx+Math.cos(r)*44,sy+Math.sin(r)*44);x.lineTo(sx+Math.cos(r)*60,sy+Math.sin(r)*60);x.stroke();}
  clouds.forEach(cl=>cloud(cl.x,cl.y%(H*.55),cl.s));
  x.fillStyle='#8bd17c';x.beginPath();x.moveTo(0,g-30);x.quadraticCurveTo(W*.7,g-110,W,g-40);x.lineTo(W,H);x.lineTo(0,H);x.fill();
  x.fillStyle='#4caf50';x.beginPath();x.moveTo(0,g);x.quadraticCurveTo(W*.3,g-36,W,g+6);x.lineTo(W,H);x.lineTo(0,H);x.fill();
  for(let i=0;i<W;i+=37){x.fillStyle=['#fff','#ffd23f','#ff8fab'][i%3];x.beginPath();x.arc(i+(i*7)%23,g+14+(i*13)%30,2.5,0,7);x.fill();}
  const bx=a.x-10,by=g+2;x.strokeStyle='#1d3557';x.lineWidth=4;x.lineCap='round';
  x.beginPath();x.moveTo(bx-6,by);x.lineTo(bx,by-18);x.lineTo(bx+6,by);x.stroke();
  x.fillStyle='#ffd23f';x.beginPath();x.moveTo(bx-11,by-14);x.lineTo(bx+11,by-14);x.lineTo(bx+7,by-40);x.lineTo(bx-7,by-40);x.fill();
  x.beginPath();x.moveTo(bx+5,by-36);x.lineTo(a.x,a.y);x.stroke();
  x.fillStyle='#f4c29a';x.beginPath();x.arc(bx,by-50,10,0,7);x.fill();x.fillStyle='#e63986';x.beginPath();x.arc(bx,by-53,10,Math.PI,0);x.fill();
  const slack=Math.max(0,1-d/L)*60+8,mx=(a.x+k.x)/2,my=(a.y+k.y)/2+slack;
  x.strokeStyle='#ffffffdd';x.lineWidth=1.3;x.beginPath();x.moveTo(a.x,a.y);x.quadraticCurveTo(mx,my,k.x,k.y);x.stroke();
  x.strokeStyle='#1d3557';x.lineWidth=1.5;x.beginPath();tail.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();
  const bows=['#e63986','#ffd23f','#2ec4b6','#ff9f1c','#9b5de5','#fff'];
  for(let i=2;i<tail.length;i+=2){const p=tail[i];x.fillStyle=bows[(i/2-1)%6];x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-8,p.y-5);x.lineTo(p.x-8,p.y+5);x.lineTo(p.x+8,p.y-5);x.lineTo(p.x+8,p.y+5);x.closePath();x.fill();}
  x.save();x.translate(k.x,k.y);x.rotate(ang);
  const P=[[0,-40],[24,-8],[0,32],[-24,-8]],cols=['#e63986','#ffd23f','#2ec4b6','#ff9f1c'];
  for(let i=0;i<4;i++){x.fillStyle=cols[i];x.beginPath();x.moveTo(0,-8);x.lineTo(P[i][0],P[i][1]);x.lineTo(P[(i+1)%4][0],P[(i+1)%4][1]);x.fill();}
  x.strokeStyle='#1d3557';x.lineWidth=2.5;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
  x.lineWidth=1.5;x.beginPath();x.moveTo(0,-40);x.lineTo(0,32);x.moveTo(-24,-8);x.lineTo(24,-8);x.stroke();
  x.fillStyle='#fff';x.beginPath();x.arc(-7,-14,3,0,7);x.arc(7,-14,3,0,7);x.fill();
  x.strokeStyle='#1d3557';x.lineWidth=2;x.beginPath();x.arc(0,-6,7,.2,Math.PI-.2);x.stroke();
  x.restore();
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;draw(step(dt));requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
