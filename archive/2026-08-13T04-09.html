  <meta name="outbox-spec-era" content="1937, right now — twenty past eleven on a hot, hard-lit Tuesday morning in the drying yard behind a hand-block textile printing works at Sanganer, outside Jaipur, where two hundred metres of freshly printed cotton have been pegged out flat on gravel in full sun and are being watered off, and the sun is doing the actual chemistry. Not a look-back at 'the old block printers' and not a lament for anything — the cloth is on the ground this minute, the sun is at its worst, and the wash tank is running.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one length of printed cotton pegged flat on bright gravel, seen from directly overhead and life-size: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The cloth carries a live hand-block repeat, printed block by block in real time by an unseen hand — a wooden block descends, presses, lifts, walks one repeat sideways, presses again, with genuine registration error accumulating along the run so the pattern drifts and doubles at the joins exactly like a hand-printed piece does. The visitor's only vocabulary is water and sun: drag anywhere to drag a wet sheet of water across the cloth (a real advancing wetting front that darkens the weave, spreads by capillary action along the warp faster than the weft, and carries loose pigment forward into bleeds), and hold still anywhere to let the sun work on that patch — a live per-pixel exposure field where dyes that need light genuinely deepen and dyes that don't genuinely bleach, at different rates. The piece IS the cloth changing colour under a sun the visitor can't turn off.">
  <meta name="outbox-spec-subject" content="The plain physical business of sun-drying and washing-off a block-printed cotton — that the colour that comes off the block is not the colour the cloth ends up, because the printed paste is mostly thickener and mordant and the dye reaction happens afterward in water and light; that madder-mordanted areas come off the block a dull ochre-grey and only go red once the loose paste is washed away and the sun has had a few hours at them, while indigo-resist areas come off the block as pale wax-white and stay that way; that the fugitive yellows bleach measurably in the same sun that's fixing the reds, so every minute on the gravel is simultaneously improving one colour and destroying another and the whole job is knowing when to lift; that the cloth is laid on gravel rather than grass because gravel dries the underside and grass wicks and stains; that water travels along the warp threads roughly twice as fast as across the weft, so every wet patch spreads as an ellipse and not a circle, and a printer can tell warp from weft at ten paces by watching a splash; that pigment carried in a moving wetting front piles up at the edge where evaporation is fastest — the same reason a spilled cup leaves a ring — and a patch dried too slowly leaves hard tidal edges through the middle of a motif; that the block walks by eye against a pricked registration dot and the error is cumulative, so a hundred-repeat run drifts and the drift shows worst on the fine outline block laid down last; and the flat arithmetic that a black outline block laid over a red field must sit within about a sixteenth of an inch or the whole piece reads as blurred. Literally paste, mordant, gravel, capillary action, and how long you leave it out.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the cloth, the water and the light, and that register is GLARING, WET, BUSY and CHEMICAL — a flat overhead sun with no modelling in it, gravel blowing out white at the edges, water arriving in hard sheets and darkening the weave instantly, colour changing at a speed you can genuinely watch. Everything happens at working speed with a yard full of cloth still to do. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow, NOT reverent, NOT wistful — this is a hot yard at twenty past eleven with the sun working against you as much as for you.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Bleached gravel white-grey (#dcd6c6) with hard-edged pebble shadow (#8b8375) as the ground of the whole piece, and the cloth an unbleached cotton cream (#f0e7d2) whose wet state renders honestly darker and more transparent (#c9bda1). The two working dye anchors are Sanganeri madder red (#a8322a) — which genuinely arrives over time rather than being present at load — and indigo-resist blue (#25436f), with a fugitive turmeric yellow (#d9a72b) that measurably bleaches toward a pale straw (#e5d9a8) under sustained exposure. Exactly one chip of iron-black outline (#241f1d) is held strictly for the fine outline block. Flat, hard, high-contrast, no glow, no bloom, no gradients except the honest wetting fronts and tidal edges — cloth on gravel photographed straight down in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="One repeat near the middle of the run is printed with the wrong colour block — a motif that should be madder is laid in indigo, quietly and correctly, with perfect registration. It develops, wets, bleeds and behaves exactly like every other motif and is never marked, never flagged, never corrected, and appears in the same position on the cloth every visit.">
  <meta name="outbox-spec-forbidden" content="NO textile-as-metaphor for tradition / heritage / patient handwork / 'the slow arts' / what-the-hands-remember — it is paste, mordant, gravel and capillary action, and it has nothing to teach anybody. NO orientalising or travelogue register of any kind: no spice-and-marigold colour writing, no 'ancient craft', no explaining India to an outsider, no sacred-artisan reverence, no saffron-light lyricism. NO nostalgia, NO wistfulness, NO 'the mills killed hand printing / the last block carvers / a vanishing craft' decline narrative — there is a yard full of cloth on the ground this minute. NO sensuous material-porn about fabric or colour beyond hue, value, saturation and wetness. NO meditative / hypnotic / 'let the slow spread still you' register. NO cryptic-SCP or ominous dread about the wrong-colour repeat. NO archival / museum / cabinet / drawer / textile-collection framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is a glaring late-morning sun. NO signal / transmission / frequency framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the cloth, the gravel and the water, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<style>
  html,body{margin:0;padding:0;height:100%;background:#dcd6c6;overflow:hidden;
            touch-action:none;overscroll-behavior:none;}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;}
  #bg{z-index:1}
  #cl{z-index:2}
  #weave{position:fixed;z-index:3;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
    background-image:
      repeating-linear-gradient(0deg, rgba(122,110,90,.13) 0 1px, rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,252,242,.10) 0 1px, rgba(0,0,0,0) 1px 3px);}
  #peg{position:fixed;right:14px;bottom:14px;z-index:6;width:19px;height:14px;

<body>
<canvas id="bg"></canvas>
<canvas id="cl"></canvas>
<div id="weave"></div>
<a id="peg" href="/archive" aria-label="the rest of the run"></a>
<script>
(function(){
'use strict';
var bg=document.getElementById('bg'), bc=bg.getContext('2d',{willReadFrequently:true});
var cv=document.getElementById('cl'), cc=cv.getContext('2d');
var off=document.createElement('canvas'), oc=off.getContext('2d');
var weave=document.getElementById('weave');

var W=0,H=0,CS=4,gw=0,gh=0,N=0,DPR=1,img=null,dat=null;
var mord,turm,ind,blk,waxf,pasteM,pasteY,carM,carY,addM,addY,stainM,stainY,dev,tbl,expo,lens,wv,gn,mask,gu;
var pitch=100,clothX=0,clothY=0,clothW=0,clothH=0;
var imps=[],impI=0,impAcc=0,impRate=12,lastImp=null,stones=[];
var meanExpo=0;

function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function init(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  CS=(W<620)?3:4;
  gw=Math.ceil(W/CS); gh=Math.ceil(H/CS); N=gw*gh;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  bg.width=cv.width; bg.height=cv.height;
  off.width=gw; off.height=gh;
  img=oc.createImageData(gw,gh); dat=img.data;

  var F=function(){return new Float32Array(N);};
  mord=F();turm=F();ind=F();blk=F();waxf=F();pasteM=F();pasteY=F();carM=F();carY=F();
  addM=F();addY=F();stainM=F();stainY=F();dev=F();tbl=F();expo=F();lens=F();wv=F();gn=F();
  mask=new Uint8Array(N); gu=new Uint8Array(N*3);

  var rnd=mul32(1937);
  for(var i=0;i<N;i++){gn[i]=rnd();wv[i]=0;}
  for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){
    var k=y*gw+x;
    wv[k]=((y%3===0)?-0.9:0.35)+((x%3===0)?0.55:-0.25)+(gn[k]-0.5)*0.9;
    wv[k]*=0.5;
  }

  drawGravel(rnd);
  buildCloth(rnd);
  sampleGravel();
  buildRun(rnd);
  impI=0; impAcc=0; lastImp=null;

  weave.style.left=clothX+'px'; weave.style.top=clothY+'px';
  weave.style.width=clothW+'px'; weave.style.height=clothH+'px';
}

function drawGravel(rnd){
  var sc=DPR; bc.setTransform(sc,0,0,sc,0,0);
  bc.fillStyle='#cfc8b6'; bc.fillRect(0,0,W,H);
  var count=Math.floor(W*H/190), edge=Math.min(W,H)*0.30;
  for(var i=0;i<count;i++){
    var x=rnd()*W, y=rnd()*H, r=1.6+rnd()*rnd()*8.5;
    var d=Math.min(Math.min(x,W-x),Math.min(y,H-y));
    var blow=1-Math.min(1,d/edge);
    var t=rnd(); var base=176+t*54+blow*40;
    var rr=Math.min(255,base+8), gg2=Math.min(255,base+3), bb=Math.min(255,base-16+blow*10);
    bc.fillStyle='rgba(139,131,117,'+(0.42-blow*0.24).toFixed(3)+')';
    bc.beginPath(); bc.ellipse(x+r*0.30,y+r*0.34,r,r*0.86,rnd()*3.14,0,6.2832); bc.fill();
    bc.fillStyle='rgb('+(rr|0)+','+(gg2|0)+','+(bb|0)+')';
    bc.beginPath(); bc.ellipse(x,y,r,r*0.84,rnd()*3.14,0,6.2832); bc.fill();
  }
}

function buildCloth(rnd){
  var m=Math.round(Math.min(W,H)*0.055);
  clothX=m; clothY=m; clothW=W-2*m; clothH=H-2*m;
  var eT=new Float32Array(gw), eB=new Float32Array(gw), eL=new Float32Array(gh), eR=new Float32Array(gh);
  var a=0,b=0,c=0,d=0;
  for(var x=0;x<gw;x++){a+=(rnd()-0.5)*0.9;a*=0.94;b+=(rnd()-0.5)*0.9;b*=0.94;eT[x]=a;eB[x]=b;}
  for(var y=0;y<gh;y++){c+=(rnd()-0.5)*0.9;c*=0.94;d+=(rnd()-0.5)*0.9;d*=0.94;eL[y]=c;eR[y]=d;}
  for(var yy=0;yy<gh;yy++)for(var xx=0;xx<gw;xx++){
    var i=yy*gw+xx, px=xx*CS+CS*0.5, py=yy*CS+CS*0.5;
    var inx=px>clothX+eL[yy]*CS && px<clothX+clothW+eR[yy]*CS;
    var iny=py>clothY+eT[xx]*CS && py<clothY+clothH+eB[xx]*CS;
    mask[i]=(inx&&iny)?1:0;
    dat[i*4+3]=mask[i]?255:0;
  }
  bc.setTransform(DPR,0,0,DPR,0,0);
  bc.fillStyle='rgba(139,131,117,0.38)';
  bc.fillRect(clothX+3,clothY+4,clothW,clothH);
  stones=[];
  var pts=[[clothX+6,clothY+6],[clothX+clothW-6,clothY+7],[clothX+7,clothY+clothH-6],
           [clothX+clothW-8,clothY+clothH-7],[clothX+clothW*0.5,clothY+3],[clothX+3,clothY+clothH*0.5]];
  for(var s=0;s<pts.length;s++) stones.push({x:pts[s][0],y:pts[s][1],r:6+rnd()*5,a:rnd()*3.1});
}

function sampleGravel(){
  var d=bc.getImageData(0,0,bg.width,bg.height).data, bw=bg.width;
  for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){
    var i=y*gw+x;
    var sx=Math.min(bg.width-1,Math.round((x*CS+CS*0.5)*DPR));
    var sy=Math.min(bg.height-1,Math.round((y*CS+CS*0.5)*DPR));
    var o=(sy*bw+sx)*4;
    gu[i*3]=d[o]; gu[i*3+1]=d[o+1]; gu[i*3+2]=d[o+2];
  }
}

function buildRun(rnd){
  pitch=Math.max(66,Math.min(132,Math.round(Math.min(W,H)/6.4)));
  var P=pitch;
  var cols=Math.ceil(clothW/P)+1, rows=Math.ceil(clothH/P)+1;
  var ox=clothX-P*0.36, oy=clothY-P*0.42;
  var wildIdx=Math.floor(rows/2)*cols+Math.floor(cols*0.45);
  imps=[];
  var loadSeq=[1,0.97,0.93,0.88,0.82,0.75,0.66,0.55,0.44];
  for(var p=0;p<3;p++){
    var ex=0,ey=0,j=0;
    var step=(p===2)?1.15:(p===1?0.55:0.34);
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var idx=r*cols+c;
        ex+=(rnd()*2-1)*step-ex*0.045;
        ey+=(rnd()*2-1)*step*0.62-ey*0.06;
        var dx=ex, dy=ey;
        if(idx===wildIdx){dx=0;dy=0;}
        imps.push({pass:p,px:ox+c*P+dx,py:oy+r*P+dy,load:loadSeq[j%9],
                   wrong:(p===0&&idx===wildIdx),seed:rnd()*6.28});
        j++;
      }
    }
  }
  impRate=Math.max(9,Math.min(20,imps.length/22));
}

function cov(d,soft){ if(d>soft)return 1; if(d<-soft)return 0; return (d+soft)/(2*soft); }

function stamp(im){
  var P=pitch,ax=im.px,ay=im.py,soft=0.55*CS/P;
  var cxa=Math.max(0,Math.floor((ax-1)/CS)), cxb=Math.min(gw-1,Math.ceil((ax+P+1)/CS));
  var cya=Math.max(0,Math.floor((ay-1)/CS)), cyb=Math.min(gh-1,Math.ceil((ay+P+1)/CS));
  for(var cy=cya;cy<=cyb;cy++){
    var v=(cy*CS+CS*0.5-ay)/P;
    if(v<-0.03||v>1.03) continue;
    for(var cx=cxa;cx<=cxb;cx++){
      var i=cy*gw+cx; if(!mask[i]) continue;
      var u=(cx*CS+CS*0.5-ax)/P;
      if(u<-0.03||u>1.03) continue;
      var du=u-0.5, dv=v-0.5, rr=Math.sqrt(du*du+dv*dv), th=Math.atan2(dv,du);
      var face=0.86+0.22*Math.cos(6.2832*(u*0.8+v*0.55)+im.seed);
      var g=(0.68+0.48*((gn[i]*13.77+im.seed)%1))*im.load*face;
      if(g<0) g=0; if(g>1.25) g=1.25;
      var R=0.252+0.058*Math.cos(8*th);
      if(im.pass===0){
        var f=cov(R-rr,soft);
        if(f>0.01){
          if(im.wrong){ ind[i]=Math.min(1,ind[i]+f*g*0.95); }
          else { mord[i]=Math.min(1,mord[i]+f*g); }
          pasteM[i]=Math.min(1.2,pasteM[i]+f*g*0.92);
        }
      } else if(im.pass===1){
        var ft=cov(0.088-rr,soft);
        var cd=Math.sqrt(u*u+v*v);
        if(u<0.2&&v<0.2){ var fc=cov(0.072-cd,soft); if(fc>ft) ft=fc; }
        if(ft>0.01){ turm[i]=Math.min(1,turm[i]+ft*g*0.95); pasteY[i]=Math.min(1.1,pasteY[i]+ft*g*0.8); }
        var fl=0;
        for(var k=0;k<4;k++){
          var an=0.7854+k*1.5708, lx=0.5+0.395*Math.cos(an), ly=0.5+0.395*Math.sin(an);
          var ldx=u-lx, ldy=v-ly;
          var rx=ldx*Math.cos(-an)-ldy*Math.sin(-an), ry=ldx*Math.sin(-an)+ldy*Math.cos(-an);
          var ld=Math.sqrt(rx*rx/(0.078*0.078)+ry*ry/(0.044*0.044));
          var q=cov((1-ld)*0.06,soft); if(q>fl) fl=q;
        }
        if(fl>0.01){ ind[i]=Math.min(1,ind[i]+fl*g*0.95); pasteM[i]=Math.min(1.2,pasteM[i]+fl*g*0.35); }
        var band=cov(0.022-Math.abs(rr-0.472),soft);
        if(band>0.01) waxf[i]=Math.min(1,waxf[i]+band*g*0.9);
      } else {
        var o1=cov(0.0135-Math.abs(rr-R),soft);
        var o2=cov(0.011-Math.abs(rr-0.112),soft);
        var o3=0;
        for(var k2=0;k2<4;k2++){
          var an2=0.7854+k2*1.5708, lx2=0.5+0.395*Math.cos(an2), ly2=0.5+0.395*Math.sin(an2);
          var d2=Math.sqrt((u-lx2)*(u-lx2)+(v-ly2)*(v-ly2));
          var q2=cov(0.009-Math.abs(d2-0.062),soft); if(q2>o3) o3=q2;
        }
        var fo=Math.max(o1,Math.max(o2,o3));
        if(fo>0.01){ blk[i]=Math.min(1,blk[i]+fo*g*0.98); pasteM[i]=Math.min(1.2,pasteM[i]+fo*g*0.3); }
      }
    }
  }
}

/* ---- water ---- */
var sat,satB;
function allocWater(){ sat=new Float32Array(N); satB=new Float32Array(N); }

var ptr={x:-999,y:-999,down:false,active:false,lx:0,ly:0,speed:0,dwell:0,wet:0};

function deposit(x0,y0,x1,y1){
  var dx=x1-x0, dy=y1-y0, dist=Math.sqrt(dx*dx+dy*dy);
  var steps=Math.max(1,Math.ceil(dist/(CS*1.4)));
  var Rw=Math.max(5,Math.round(26/CS));
  for(var s=0;s<=steps;s++){
    var px=x0+dx*s/steps, py=y0+dy*s/steps;
    var gx=Math.round(px/CS), gy=Math.round(py/CS);
    for(var yy=gy-Rw;yy<=gy+Rw;yy++){
      if(yy<0||yy>=gh)continue;
      for(var xx=gx-Rw;xx<=gx+Rw;xx++){
        if(xx<0||xx>=gw)continue;
        var i=yy*gw+xx; if(!mask[i])continue;
        var ddx=(xx-gx)/Rw, ddy=(yy-gy)/Rw, d=Math.sqrt(ddx*ddx+ddy*ddy);
        if(d>1)continue;
        var amt=0.11*(1-d)*(1-0.88*waxf[i]);
        sat[i]=Math.min(1.25,sat[i]+amt);
      }
    }
  }
  ptr.wet=Math.min(1,ptr.wet+dist*0.004);
}

/* ---- audio ---- */
var AU={on:false};
function audioInit(){
  if(AU.on) return;
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    var ctx=new C();
    var buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), ch=buf.getChannelData(0);
    for(var i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
    var master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
    var bed=ctx.createBufferSource(); bed.buffer=buf; bed.loop=true;
    var bf=ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=5100; bf.Q.value=0.7;
    var bgn=ctx.createGain(); bgn.gain.value=0.016;
    bed.connect(bf).connect(bgn).connect(master); bed.start();
    var rush=ctx.createBufferSource(); rush.buffer=buf; rush.loop=true;
    var rf=ctx.createBiquadFilter(); rf.type='bandpass'; rf.frequency.value=800; rf.Q.value=0.85;
    var rg=ctx.createGain(); rg.gain.value=0;
    rush.connect(rf).connect(rg).connect(master); rush.start();
    var cic=ctx.createBufferSource(); cic.buffer=buf; cic.loop=true;
    var cf=ctx.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=4350; cf.Q.value=7.5;
    var cg=ctx.createGain(); cg.gain.value=0;
    cic.connect(cf).connect(cg).connect(master); cic.start();
    var lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=58;
    var lg=ctx.createGain(); lg.gain.value=0.0; lfo.connect(lg).connect(cg.gain); lfo.start();
    AU={on:true,ctx:ctx,buf:buf,master:master,rf:rf,rg:rg,cg:cg,lg:lg,nextTick:0};
  }catch(e){}
}
function thump(pass,load){
  if(!AU.on)return; var ctx=AU.ctx, t=ctx.currentTime;
  var f=pass===0?78:(pass===1?106:142), amp=(pass===2?0.10:0.19)*(0.45+0.65*load);
  var o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.56,t+0.09);
  var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(amp,t+0.005); g.gain.exponentialRampToValueAtTime(0.0008,t+0.14);
  o.connect(g).connect(AU.master); o.start(t); o.stop(t+0.17);
  var n=ctx.createBufferSource(); n.buffer=AU.buf; n.loop=true;
  var nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=700+f*4;
  var ng=ctx.createGain(); ng.gain.setValueAtTime(amp*0.55,t); ng.gain.exponentialRampToValueAtTime(0.0005,t+0.07);
  n.connect(nf).connect(ng).connect(AU.master); n.start(t); n.stop(t+0.1);
}
function tick(){
  if(!AU.on)return; var ctx=AU.ctx, t=ctx.currentTime;
  var n=ctx.createBufferSource(); n.buffer=AU.buf; n.loop=true;
  var nf=ctx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=2600+Math.random()*3000;
  var g=ctx.createGain(); g.gain.setValueAtTime(0.02+Math.random()*0.02,t);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.03);
  n.connect(nf).connect(g).connect(AU.master); n.start(t); n.stop(t+0.05);
}

/* ---- loop ---- */
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(dt<=0){ requestAnimationFrame(frame); return; }

  /* printing */
  if(impI<imps.length){
    impAcc+=dt*impRate;
    var guard=0;
    while(impAcc>=1&&impI<imps.length&&guard<40){
      var im=imps[impI++]; stamp(im); thump(im.pass,im.load);
      lastImp={px:im.px,py:im.py,t:0}; impAcc-=1; guard++;
    }
  }
  if(lastImp) lastImp.t+=dt;

  /* sun lens from dwell */
  lens.fill(0);
  if(ptr.active){
    if(ptr.speed<45) ptr.dwell=Math.min(1,ptr.dwell+dt*0.85);
    else ptr.dwell=Math.max(0,ptr.dwell-dt*2.6);
  } else ptr.dwell=Math.max(0,ptr.dwell-dt*1.2);
  if(ptr.dwell>0.02){
    var Rl=Math.round((34+72*ptr.dwell)/CS), gx=Math.round(ptr.x/CS), gy=Math.round(ptr.y/CS);
    for(var yy=gy-Rl;yy<=gy+Rl;yy++){ if(yy<0||yy>=gh)continue;
      for(var xx=gx-Rl;xx<=gx+Rl;xx++){ if(xx<0||xx>=gw)continue;
        var i=yy*gw+xx; var ddx=(xx-gx)/Rl, ddy=(yy-gy)/Rl, d2=ddx*ddx+ddy*ddy;
        if(d2>1)continue; lens[i]+=3.4*ptr.dwell*(1-Math.sqrt(d2));
      }
    }
  }
  ptr.speed*=Math.max(0,1-dt*5);
  ptr.wet*=Math.max(0,1-dt*1.7);

  /* water: anisotropic diffusion, warp (x) ~2x weft (y) */
  var Dx=0.22, Dy=0.11;
  for(var y=1;y<gh-1;y++){
    var row=y*gw;
    for(var x=1;x<gw-1;x++){
      var i=row+x;
      if(!mask[i]){ satB[i]=0; continue; }
      var s=sat[i];
      var lx=sat[i-1]+sat[i+1]-2*s, ly=sat[i-gw]+sat[i+gw]-2*s;
      var ns=s+Dx*lx+Dy*ly;
      ns-=dt*(0.055*ns+0.010+0.012*lens[i]);
      if(waxf[i]>0.02) ns-=dt*ns*0.9*waxf[i];
      satB[i]=ns>0?(ns<1.3?ns:1.3):0;
    }
  }
  var tmp=sat; sat=satB; satB=tmp;

  /* pigment: mobilise, advect down the saturation gradient */
  addM.fill(0); addY.fill(0);
  for(var y2=1;y2<gh-1;y2++){
    var row2=y2*gw;
    for(var x2=1;x2<gw-1;x2++){
      var i2=row2+x2; if(!mask[i2])continue;
      var s2=sat[i2]; if(s2<0.025)continue;
      var mb=Math.min(1,s2*1.7)*dt*1.15;
      if(pasteM[i2]>0.0004){ var m1=pasteM[i2]*mb; pasteM[i2]-=m1; carM[i2]+=m1; }
      if(pasteY[i2]>0.0004){ var m2=pasteY[i2]*mb; pasteY[i2]-=m2; carY[i2]+=m2; }
      var cm=carM[i2], cyv=carY[i2];
      if(cm<0.0004&&cyv<0.0004)continue;
      var wR=Math.max(0,s2-sat[i2+1])*2.0, wL=Math.max(0,s2-sat[i2-1])*2.0;
      var wD=Math.max(0,s2-sat[i2+gw]), wU=Math.max(0,s2-sat[i2-gw]);
      var tot=wR+wL+wD+wU;
      if(tot>1e-4){
        var f2=Math.min(0.45,tot*dt*11);
        var mvM=cm*f2, mvY=cyv*f2;
        carM[i2]-=mvM; carY[i2]-=mvY;
        var iR=i2+1,iL=i2-1,iD=i2+gw,iU=i2-gw;
        addM[iR]+=mvM*wR/tot; addM[iL]+=mvM*wL/tot; addM[iD]+=mvM*wD/tot; addM[iU]+=mvM*wU/tot;
        addY[iR]+=mvY*wR/tot; addY[iL]+=mvY*wL/tot; addY[iD]+=mvY*wD/tot; addY[iU]+=mvY*wU/tot;
      }
    }
  }

  /* chemistry + render */
  var sumE=0, cnt=0;
  for(var i3=0;i3<N;i3++){
    if(!mask[i3]) continue;
    if(addM[i3]>0) carM[i3]+=addM[i3];
    if(addY[i3]>0) carY[i3]+=addY[i3];
    var s3=sat[i3];
    var rate=1+lens[i3];
    expo[i3]+=rate*dt; sumE+=expo[i3]; cnt++;
    var wet=s3>0.9?1:s3*1.11;
    /* deposition at the drying edge — the ring */
    if(s3<0.075){
      if(carM[i3]>0.0002){ var dp=carM[i3]*Math.min(0.9,dt*3.2); carM[i3]-=dp; stainM[i3]=Math.min(1.4,stainM[i3]+dp); }
      if(carY[i3]>0.0002){ var dq=carY[i3]*Math.min(0.9,dt*3.2); carY[i3]-=dq; stainY[i3]=Math.min(1.2,stainY[i3]+dq); }
    }
    /* madder wants light AND water AND the paste gone */
    if(mord[i3]>0.01&&dev[i3]<0.999){
      var clean=1-0.72*Math.min(1,pasteM[i3]);
      dev[i3]+=dt*rate*(0.012+0.052*wet)*clean*(1-dev[i3]);
    }
    /* turmeric burns off on its own faster clock */
    if(turm[i3]>0.01&&tbl[i3]<0.999) tbl[i3]+=dt*rate*(0.030+0.014*wet)*(1-tbl[i3]);

    /* colour */
    var R=240,G=231,B=210;
    var sb=expo[i3]*0.0035; if(sb>0.20)sb=0.20;
    R+=(251-R)*sb; G+=(246-G)*sb; B+=(228-B)*sb;
    if(wet>0.002){
      var a1=wet*0.86;
      R+=(201-R)*a1; G+=(189-G)*a1; B+=(161-B)*a1;
      var tr=wet*0.27, o3i=i3*3;
      R+=(gu[o3i]-R)*tr; G+=(gu[o3i+1]-G)*tr; B+=(gu[o3i+2]-B)*tr;
    }
    if(waxf[i3]>0.01){ var aw=waxf[i3]*0.55; R+=(248-R)*aw; G+=(243-G)*aw; B+=(228-B)*aw; }
    if(mord[i3]>0.01){
      var d3=dev[i3], am=mord[i3]*(0.42+0.46*d3);
      var cr=142+(168-142)*d3, cg=129+(50-129)*d3, cb=104+(42-104)*d3;
      R+=(cr-R)*am; G+=(cg-G)*am; B+=(cb-B)*am;
    }
    if(turm[i3]>0.01){
      var tb=tbl[i3], at=turm[i3]*(0.82-0.30*tb);
      var yr=217+(229-217)*tb, yg=167+(217-167)*tb, yb=43+(168-43)*tb;
      R+=(yr-R)*at; G+=(yg-G)*at; B+=(yb-B)*at;
    }
    if(ind[i3]>0.01){ var ai=ind[i3]*0.88; R+=(37-R)*ai; G+=(67-G)*ai; B+=(111-B)*ai; }
    if(stainM[i3]>0.004){
      var as=Math.min(0.72,stainM[i3]*0.95), ds=dev[i3];
      var sr=161+(150-161)*ds, sg=127+(66-127)*ds, sbb=95+(54-95)*ds;
      R+=(sr-R)*as; G+=(sg-G)*as; B+=(sbb-B)*as;
    }
    if(stainY[i3]>0.004){ var ay=Math.min(0.45,stainY[i3]*0.8); R+=(208-R)*ay; G+=(188-G)*ay; B+=(132-B)*ay; }
    if(blk[i3]>0.01){ var ab=blk[i3]*0.94; R+=(36-R)*ab; G+=(31-G)*ab; B+=(29-B)*ab; }
    var pf=pasteM[i3]*0.72+carM[i3]*0.55; if(pf>0.85)pf=0.85;
    if(pf>0.004){ R+=(154-R)*pf; G+=(142-G)*pf; B+=(116-B)*pf; }
    var pyf=pasteY[i3]*0.62+carY[i3]*0.45; if(pyf>0.7)pyf=0.7;
    if(pyf>0.004){ R+=(206-R)*pyf; G+=(178-G)*pyf; B+=(98-B)*pyf; }
    var dk=1-0.12*wet, wvv=1+wv[i3]*(0.030+0.055*wet);
    R=R*dk*wvv; G=G*dk*wvv; B=B*dk*wvv;
    var o4=i3*4;
    dat[o4]=R<0?0:(R>255?255:R);
    dat[o4+1]=G<0?0:(G>255?255:G);
    dat[o4+2]=B<0?0:(B>255?255:B);
  }
  meanExpo=cnt?sumE/cnt:0;

  oc.putImageData(img,0,0);
  cc.setTransform(1,0,0,1,0,0);
  cc.clearRect(0,0,cv.width,cv.height);
  cc.imageSmoothingEnabled=true;
  cc.drawImage(off,0,0,gw,gh,0,0,cv.width,cv.height);
  cc.setTransform(DPR,0,0,DPR,0,0);
  if(lastImp&&lastImp.t<0.14){
    cc.fillStyle='rgba(48,40,34,'+(0.20*(1-lastImp.t/0.14)).toFixed(3)+')';
    cc.fillRect(lastImp.px,lastImp.py,pitch,pitch);
  }
  for(var st=0;st<stones.length;st++){
    var S=stones[st];
    cc.fillStyle='rgba(60,54,47,0.5)';
    cc.beginPath(); cc.ellipse(S.x+2,S.y+2.4,S.r,S.r*0.82,S.a,0,6.2832); cc.fill();
    cc.fillStyle='#8b8375';
    cc.beginPath(); cc.ellipse(S.x,S.y,S.r,S.r*0.82,S.a,0,6.2832); cc.fill();
    cc.fillStyle='rgba(232,226,210,0.55)';
    cc.beginPath(); cc.ellipse(S.x-S.r*0.25,S.y-S.r*0.28,S.r*0.42,S.r*0.3,S.a,0,6.2832); cc.fill();
  }

  if(AU.on){
    var t=AU.ctx.currentTime;
    AU.rg.gain.setTargetAtTime(Math.min(0.14,ptr.wet*0.16+ (ptr.down?0.012:0)),t,0.06);
    AU.rf.frequency.setTargetAtTime(420+Math.min(2200,ptr.speed*3.4),t,0.08);
    AU.cg.gain.setTargetAtTime(Math.min(0.05,meanExpo*0.0016),t,1.2);
    AU.lg.gain.setTargetAtTime(Math.min(0.05,meanExpo*0.0016)*0.85,t,1.2);
    if(t>AU.nextTick){ tick(); AU.nextTick=t+0.05+Math.random()*0.22; }
  }
  requestAnimationFrame(frame);
}

/* ---- input ---- */
function pos(e){ return {x:e.clientX,y:e.clientY}; }
cv.addEventListener('pointerdown',function(e){
  audioInit(); if(AU.on&&AU.ctx.state==='suspended') AU.ctx.resume();
  var p=pos(e); ptr.down=true; ptr.active=true; ptr.x=p.x; ptr.y=p.y; ptr.lx=p.x; ptr.ly=p.y;
  deposit(p.x,p.y,p.x,p.y);
  if(cv.setPointerCapture){ try{cv.setPointerCapture(e.pointerId);}catch(err){} }
  e.preventDefault();
});
window.addEventListener('pointermove',function(e){
  var p=pos(e); ptr.active=true;
  var dx=p.x-ptr.x, dy=p.y-ptr.y, d=Math.sqrt(dx*dx+dy*dy);
  ptr.speed=Math.max(ptr.speed,d*60);
  if(ptr.down&&d>0.5) deposit(ptr.x,ptr.y,p.x,p.y);
  if(d>1.2) ptr.dwell=Math.max(0,ptr.dwell-0.05);
  ptr.x=p.x; ptr.y=p.y;
},{passive:true});
window.addEventListener('pointerup',function(){ ptr.down=false; });
window.addEventListener('pointercancel',function(){ ptr.down=false; });
window.addEventListener('pointerleave',function(){ ptr.active=false; });
cv.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

var rz=null;
window.addEventListener('resize',function(){
  if(rz) clearTimeout(rz);
  rz=setTimeout(function(){
    if(Math.abs(window.innerWidth-W)<50&&Math.abs(window.innerHeight-H)<70) return;
    init(); allocWater();
  },320);
});

init(); allocWater();
requestAnimationFrame(frame);

try{
  console.log('%cgadh, datta, rekh. warp runs east and west — water goes about twice as far that way.\nrekh block is out by three sixteenths at the far end. lift the whole piece at half twelve, not later.','color:#a8322a;font:12px/1.5 monospace');
}catch(e){}
})();
</script>
