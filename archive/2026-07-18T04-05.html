  <meta name="outbox-spec-format" content="The whole viewport IS the stage seen head-on, edge to edge: a row of tall flexible poles rising from a plain black boards-and-footlights foreground, each pole capped with a spinning white china plate that visibly tilts and wobbles wider as its spin bleeds off. You genuinely keep them up — click or tap any plate to give its pole a fresh whip of spin (a cane-whup via Web Audio) that snaps the plate flat and fast again; every plate's spin decays in real time under honest angular friction, so its wobble grows and its tilt steepens on its own until, below a threshold, it slides off and shatters on the boards (a real china-crash). You dash pole to pole racing the decay, and click a bare pole-tip to load a fresh plate onto it. Number keys 1–8 whip the matching pole for no-mouse play. No browser chrome, no header, no menu — just the poles, the china, and the footlights.">
  <meta name="outbox-spec-subject" content="Plate-spinning and the plain honest physics of keeping a whole rank of them alive at once — how a plate flung flat and fast rides steady on the pole-tip, how its spin bleeds away to friction so the disc slowly tips off true and the wobble opens wider and wider, how a well-timed whip of the pole pumps the spin back before the lean gets past saving, and how the whole trick is nothing but reading which plate is dying fastest and getting there first. Not a metaphor for juggling a life or spinning too many plates or anything at all — literally china discs, angular momentum, and the running arithmetic of who to whip next before one hits the boards.">

<title>Whip 'Em Round! — Eight Plates and a Rank of Poles</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#2a1528;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;color:#f2ecdd;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;display:block;touch-action:manipulation;cursor:pointer;}
  #patter{position:fixed;top:2.4vh;left:50%;transform:translateX(-50%);
    width:92%;max-width:760px;text-align:center;font-style:italic;
    font-size:clamp(15px,2.5vw,23px);line-height:1.3;color:#f4c766;
    text-shadow:0 1px 6px #1a0d18,0 0 20px rgba(226,168,63,.35);
    pointer-events:none;z-index:5;letter-spacing:.2px;transition:opacity .25s;}
  #foot{position:fixed;bottom:3px;right:8px;font-size:10px;font-style:italic;
    color:rgba(226,168,63,.5);z-index:6;letter-spacing:.3px;}
  #foot a{color:rgba(244,199,102,.75);text-decoration:none;border-bottom:1px dotted rgba(244,199,102,.4);}
  #foot a:hover{color:#f4c766;}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:11px;font-style:italic;color:rgba(242,236,221,.4);z-index:5;
    pointer-events:none;text-align:center;width:90%;transition:opacity 1.2s;}
</style>

<body>
<!-- one performer, eight poles, and you working the far end. keep 'em up. -->
<canvas id="stage"></canvas>
<div id="patter">Right — they're all up and spinning! Click any plate to whip it, keys 1&ndash;8 do the same. Off we go!</div>
<div id="hint">click a leaning plate to whip it round &middot; click a bare tip to load a fresh one &middot; keys 1&ndash;8</div>
<div id="foot">back to the <a href="/archive">rest of the bill</a></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('stage'), ctx=cv.getContext('2d');
var patterEl=document.getElementById('patter'), hintEl=document.getElementById('hint');
var W=0,H=0,DPR=1;
var N=8;
var poles=[];      // {x, tipY, baseY}
var plates=[];     // per pole: null or {omega,phase,spin,state,y,vy,vx,rot,driftSign,wasCrit}
var shards=[];

// ---- tuning (honest angular friction) ----
var OMEGA_START=20, OMEGA_CAP=26, WHIP_ADD=13.5;
var WOBBLE_AT=10.5;   // spin below this and the wobble opens up
var CRIT_AT=5.2;      // scarlet flickers in
var DEAD_AT=2.1;      // slides off, hits the boards
// the third pole from the left (index 2) is warped soft — drains faster, drifts lopsided
function friction(i, om){ var base=0.85 + 0.020*om; if(i===2) base*=1.5; return base; }

// ---- persistent tally, only ever counts up ----
var MOST=0, BROKEN=0;
try{ MOST=parseInt(localStorage.getItem('plates_most_at_once')||'0',10)||0;
     BROKEN=parseInt(localStorage.getItem('plates_broken_total')||'0',10)||0; }catch(e){}
function saveMost(){ try{localStorage.setItem('plates_most_at_once',String(MOST));}catch(e){} }
function saveBroken(){ try{localStorage.setItem('plates_broken_total',String(BROKEN));}catch(e){} }

// ---- audio ----
var AC=null, noiseBuf=null;
function audio(){
  if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  var len=AC.sampleRate*0.6, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  noiseBuf=b; return AC;
}
function whup(){
  var a=audio(); if(!a) return; var t=a.currentTime;
  var s=a.createBufferSource(); s.buffer=noiseBuf;
  var bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(380,t);
  bp.frequency.exponentialRampToValueAtTime(1900,t+0.05);
  bp.frequency.exponentialRampToValueAtTime(340,t+0.16);
  var g=a.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.32,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0002,t+0.17);
  s.connect(bp); bp.connect(g); g.connect(a.destination); s.start(t); s.stop(t+0.2);
}
function crash(){
  var a=audio(); if(!a) return; var t=a.currentTime;
  var s=a.createBufferSource(); s.buffer=noiseBuf;
  var hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
  var g=a.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.4,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0003,t+0.5);
  s.connect(hp); hp.connect(g); g.connect(a.destination); s.start(t); s.stop(t+0.55);
  for(var k=0;k<5;k++){
    var o=a.createOscillator(); o.type='triangle';
    var f=1400+Math.random()*3000; var tk=t+Math.random()*0.14;
    o.frequency.setValueAtTime(f,tk);
    o.frequency.exponentialRampToValueAtTime(f*0.6,tk+0.16);
    var og=a.createGain(); og.gain.setValueAtTime(0.0001,tk);
    og.gain.exponentialRampToValueAtTime(0.13,tk+0.004);
    og.gain.exponentialRampToValueAtTime(0.0002,tk+0.2);
    o.connect(og); og.connect(a.destination); o.start(tk); o.stop(tk+0.24);
  }
}

// ---- layout ----
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var boardsY=H*0.80;
  var pad=Math.max(W*0.07,36);
  var span=W-pad*2;
  poles=[];
  for(var i=0;i<N;i++){
    var x=pad + span*(i/(N-1));
    var tipY=H*0.185 + Math.sin(i*1.7)*H*0.012; // faint stagger for texture
    poles.push({x:x, tipY:tipY, baseY:boardsY});
  }
}
window.addEventListener('resize',resize);

function plateR(){ return Math.max(Math.min(W/18,50),22); }

function newPlate(om){
  return {omega:om, phase:Math.random()*6.28, spin:Math.random()*6.28,
    state:'up', y:0, vy:0, vx:0, rot:0, driftSign:(Math.random()<0.5?-1:1), wasCrit:false};
}

// start mid-turn: the whole rank already spinning, a couple already leaning
resize();
for(var i=0;i<N;i++){
  var om = OMEGA_START*(0.55 + Math.random()*0.45);
  if(i===2) om=WOBBLE_AT*0.9;      // the warped third is already the one about to go
  if(i===N-1) om=WOBBLE_AT*1.05;   // and the one on the end's a touch low too
  plates[i]=newPlate(om);
}

// ---- patter ----
var posName=['far one on the left','second one along','third one from the left','one just left of centre',
             'one just right of centre','sixth one along','next-to-last','one on the end'];
var critMsgs=[
  "%'s going &mdash; %'s GOING, get on it!",
  "ooh, the % is leaning &mdash; whip it, whip it!",
  "watch the % now, she's tipping over&mdash;",
  "% wants a crack, give her one quick!",
  "there's the % dropping her nerve &mdash; save it!"];
var saveMsgs=[
  "there! caught her, ha!","snapped flat, back up to speed &mdash; lovely!",
  "ha! told you I had it in me.","up she pops, humming again!",
  "that's the one &mdash; clean whip, clean save!"];
var loadMsgs=[
  "fresh plate up and spinning &mdash; nice!","new one on the tip, off she goes!",
  "loaded her clean, look at that spin!","up she goes, another for the row!"];
var smashMsgs=[
  "ahh &mdash; never mind! whole crate out the back, pop another up, go on!",
  "there she goes, smash! No matter &mdash; that tip's bare, load her again!",
  "lost one to the boards! Click the empty pole, get a fresh plate flying!",
  "one down &mdash; grand crash though, wasn't it? Fresh plate, quick!"];
var idleMsgs=[
  "keep 'em flying &mdash; you read which one's slowest and get there first!",
  "all up and dancing, look at us go!",
  "eight plates humming at once &mdash; beautiful, that!",
  "watch the whole row, catch the leaner before the lean gets past saving!",
  "nice and steady &mdash; a fast plate rides flat, it's the slow ones you chase!"];
function pick(a){ return a[(Math.random()*a.length)|0]; }
var lastMsgAt=0;
function say(msg,force){
  var now=performance.now();
  if(!force && now-lastMsgAt<1400) return;
  lastMsgAt=now;
  patterEl.style.opacity='0';
  setTimeout(function(){ patterEl.innerHTML=msg; patterEl.style.opacity='1'; },120);
}
function critSay(i){ say(pick(critMsgs).replace(/%/g, posName[i]), false); }

// ---- interaction ----
function hitPole(px,py){
  var r=plateR(), best=-1, bd=1e9;
  for(var i=0;i<N;i++){
    var dx=px-poles[i].x, dy=py-poles[i].tipY, d=Math.hypot(dx,dy);
    if(d<r*1.7 && d<bd){ bd=d; best=i; }
  }
  return best;
}
function act(i){
  if(i<0) return;
  var p=plates[i];
  if(p && p.state==='up'){
    var wasCrit = p.omega<CRIT_AT;
    p.omega=Math.min(p.omega+WHIP_ADD, OMEGA_CAP);
    whup();
    if(wasCrit) say(pick(saveMsgs),false);
    hideHint();
  } else if(!p || p.state==='gone'){
    plates[i]=newPlate(OMEGA_START*0.92);
    whup(); say(pick(loadMsgs),false); hideHint();
  }
}
cv.addEventListener('pointerdown',function(e){
  audio(); if(AC&&AC.state==='suspended') AC.resume();
  var rect=cv.getBoundingClientRect();
  act(hitPole(e.clientX-rect.left, e.clientY-rect.top));
});
window.addEventListener('keydown',function(e){
  var k=e.key; if(k>='1'&&k<='8'){ audio(); if(AC&&AC.state==='suspended')AC.resume(); act(parseInt(k,10)-1); }
});
var hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true; hintEl.style.opacity='0'; }

// ---- physics + break ----
function shatter(i,x){
  var p=plates[i], r=plateR();
  crash();
  BROKEN++; saveBroken();
  for(var k=0;k<16;k++){
    var ang=Math.random()*6.28, sp=1.5+Math.random()*4;
    shards.push({x:x+(Math.random()-0.5)*r, y:poles[i].baseY,
      vx:Math.cos(ang)*sp*(0.6+Math.random()), vy:-Math.random()*3-0.5,
      life:1, sz:2+Math.random()*4});
  }
  p.state='gone';
  say(pick(smashMsgs),true);
}

function step(dt){
  var r=plateR(), aliveNow=0;
  for(var i=0;i<N;i++){
    var p=plates[i]; if(!p) continue;
    if(p.state==='up'){
      aliveNow++;
      p.omega -= friction(i,p.omega)*dt;
      p.spin  += p.omega*dt;
      // wobble frequency climbs as she slows — that shudder-faster look
      var slow = Math.max(0, WOBBLE_AT - p.omega);
      var freq = 3 + slow*0.9;
      p.phase += freq*dt;
      if(p.omega<CRIT_AT && !p.wasCrit){ p.wasCrit=true; critSay(i); }
      if(p.omega>=CRIT_AT) p.wasCrit=false;
      if(p.omega<=DEAD_AT){
        p.state='falling'; p.y=poles[i].tipY;
        p.vy=8; p.vx=(i===2? p.driftSign*0.8 : p.driftSign*0.3)*40; p.rot=0;
      }
    } else if(p.state==='falling'){
      p.vy += 900*dt;
      p.y += p.vy*dt;
      p.rot += 6*dt;
      var fx = poles[i].x + (p.vx*dt);
      poles[i].x += p.vx*dt*0.0; // keep pole put; plate drifts via its own draw
      p.driftX = (p.driftX||0) + p.vx*dt;
      if(p.y>=poles[i].baseY){ shatter(i, poles[i].x+(p.driftX||0)); }
    }
  }
  if(aliveNow>MOST){ MOST=aliveNow; saveMost(); }
  // shards
  for(var s=shards.length-1;s>=0;s--){
    var sh=shards[s];
    sh.vy+=42*dt; sh.x+=sh.vx; sh.y+=sh.vy; sh.life-=dt*1.3;
    if(sh.life<=0) shards.splice(s,1);
  }
}

// ---- draw ----
function wobbleAmp(om){
  if(om>=WOBBLE_AT) return 0.045 + Math.max(0,(OMEGA_CAP-om))*0.001;
  var t=(WOBBLE_AT-om)/(WOBBLE_AT-DEAD_AT); // 0..1
  return 0.05 + t*t*0.92;
}
function drawStage(){
  // ground: deep curtain aubergine, limelight wash up the middle
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1528'); g.addColorStop(0.55,'#3a1f38'); g.addColorStop(1,'#331a30');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // hot limelight cone from top
  var lg=ctx.createRadialGradient(W*0.5,H*0.02,10,W*0.5,H*0.35,H*0.9);
  lg.addColorStop(0,'rgba(226,168,63,0.32)'); lg.addColorStop(0.5,'rgba(226,168,63,0.08)');
  lg.addColorStop(1,'rgba(226,168,63,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
  // wings, darker at the sides
  var wgL=ctx.createLinearGradient(0,0,W*0.16,0);
  wgL.addColorStop(0,'rgba(20,10,20,0.55)'); wgL.addColorStop(1,'rgba(20,10,20,0)');
  ctx.fillStyle=wgL; ctx.fillRect(0,0,W*0.16,H);
  var wgR=ctx.createLinearGradient(W,0,W*0.84,0);
  wgR.addColorStop(0,'rgba(20,10,20,0.55)'); wgR.addColorStop(1,'rgba(20,10,20,0)');
  ctx.fillStyle=wgR; ctx.fillRect(W*0.84,0,W*0.16,H);
  // boards
  var boardsY=H*0.80;
  var bg=ctx.createLinearGradient(0,boardsY,0,H);
  bg.addColorStop(0,'#20101f'); bg.addColorStop(1,'#160a15');
  ctx.fillStyle=bg; ctx.fillRect(0,boardsY,W,H-boardsY);
  ctx.strokeStyle='rgba(226,168,63,0.06)'; ctx.lineWidth=1;
  for(var px=0;px<W;px+=Math.max(60,W/14)){
    ctx.beginPath(); ctx.moveTo(px,boardsY); ctx.lineTo(px+ (H-boardsY)*0.15,H); ctx.stroke();
  }
  ctx.strokeStyle='rgba(226,168,63,0.14)'; ctx.beginPath();
  ctx.moveTo(0,boardsY+1); ctx.lineTo(W,boardsY+1); ctx.stroke();
}
function drawFootlights(){
  var fy=H-2;
  var fg=ctx.createLinearGradient(0,H-H*0.09,0,H);
  fg.addColorStop(0,'rgba(244,199,102,0)'); fg.addColorStop(1,'rgba(244,199,102,0.42)');
  ctx.fillStyle=fg; ctx.fillRect(0,H-H*0.09,W,H*0.09);
  var n=Math.max(8,Math.floor(W/48));
  for(var i=0;i<n;i++){
    var x=(i+0.5)*(W/n);
    var rad=ctx.createRadialGradient(x,fy-4,1,x,fy-4,16);
    rad.addColorStop(0,'rgba(255,235,170,0.9)'); rad.addColorStop(1,'rgba(244,199,102,0)');
    ctx.fillStyle=rad; ctx.beginPath(); ctx.arc(x,fy-4,16,0,6.29); ctx.fill();
    ctx.fillStyle='#f4c766'; ctx.beginPath(); ctx.arc(x,fy-4,2.6,0,6.29); ctx.fill();
  }
}
function drawPole(i, leanX){
  var P=poles[i];
  var ctrlX=P.x + leanX*0.5, ctrlY=(P.tipY+P.baseY)*0.5;
  var lg=ctx.createLinearGradient(P.x-4,P.baseY,P.tipY,P.tipY);
  ctx.strokeStyle='#7a5220';
  ctx.lineWidth=Math.max(3,plateR()*0.09);
  ctx.beginPath(); ctx.moveTo(P.x,P.baseY);
  ctx.quadraticCurveTo(ctrlX,ctrlY,P.x+leanX,P.tipY); ctx.stroke();
  // gold-lit edge
  ctx.strokeStyle='rgba(226,168,63,0.55)'; ctx.lineWidth=Math.max(1.4,plateR()*0.04);
  ctx.beginPath(); ctx.moveTo(P.x-1,P.baseY);
  ctx.quadraticCurveTo(ctrlX-1,ctrlY,P.x+leanX-1,P.tipY); ctx.stroke();
}
function drawPlate(cx,cy,r,amp,phase,spin,drift,om){
  var tilt=amp*Math.sin(phase)+drift;
  var ry=r*(0.15+amp*0.55);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(tilt);
  // underside shadow when tipped
  ctx.fillStyle='rgba(20,10,18,0.4)';
  ctx.beginPath(); ctx.ellipse(0,ry*0.35,r*0.96,ry*0.9,0,0,6.29); ctx.fill();
  // china body
  var pg=ctx.createLinearGradient(0,-ry,0,ry);
  pg.addColorStop(0,'#fbf6ea'); pg.addColorStop(0.5,'#f2ecdd'); pg.addColorStop(1,'#d9cfb6');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.ellipse(0,0,r,ry,0,0,6.29); ctx.fill();
  // inner ring
  ctx.strokeStyle='rgba(180,160,120,0.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,0,r*0.6,ry*0.6,0,0,6.29); ctx.stroke();
  // hard bright rim-glint travelling round with the spin
  var ga=spin%6.29;
  var gx=Math.cos(ga)*r, gy=Math.sin(ga)*ry;
  ctx.strokeStyle='rgba(255,250,235,0.95)'; ctx.lineWidth=Math.max(1.6,r*0.05);
  ctx.beginPath(); ctx.ellipse(0,0,r,ry,0,ga-0.5,ga+0.5); ctx.stroke();
  ctx.fillStyle='rgba(255,255,245,0.9)';
  ctx.beginPath(); ctx.arc(gx,gy,Math.max(1.5,r*0.05),0,6.29); ctx.fill();
  // danger-scarlet chip when critical
  if(om<CRIT_AT){
    var flick=0.35+0.35*Math.sin(performance.now()*0.02);
    ctx.strokeStyle='rgba(200,53,44,'+flick.toFixed(2)+')';
    ctx.lineWidth=Math.max(2,r*0.07);
    ctx.beginPath(); ctx.ellipse(0,0,r*1.04,ry*1.04+2,0,0,6.29); ctx.stroke();
  }
  ctx.restore();
}
function drawTally(){
  ctx.save();
  ctx.font='italic '+Math.max(9,Math.min(13,W/70)).toFixed(0)+'px Georgia, serif';
  ctx.textAlign='center'; ctx.fillStyle='rgba(226,168,63,0.55)';
  var y=H*0.80-8;
  ctx.fillText('MOST PLATES KEPT UP AT ONCE: '+MOST+'      \u2022      PLATES BROKEN SO FAR: '+BROKEN, W*0.5, y);
  ctx.restore();
}

function render(){
  drawStage();
  // poles first (behind plates)
  for(var i=0;i<N;i++){
    var p=plates[i], lean=0;
    if(p && p.state==='up'){ lean=wobbleAmp(p.omega)*Math.sin(p.phase)*plateR()*0.5 + (i===2? p.driftSign*wobbleAmp(p.omega)*plateR()*0.35:0); }
    drawPole(i, lean);
    // bare tip marker
    if(!p || p.state==='gone'){
      ctx.fillStyle='rgba(226,168,63,0.5)';
      ctx.beginPath(); ctx.arc(poles[i].x,poles[i].tipY,Math.max(3,plateR()*0.11),0,6.29); ctx.fill();
      ctx.strokeStyle='rgba(255,235,170,0.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(poles[i].x,poles[i].tipY,plateR()*0.55,0,6.29); ctx.stroke();
    }
  }
  drawTally();
  // plates
  for(i=0;i<N;i++){
    var p=plates[i]; if(!p) continue;
    var r=plateR();
    if(p.state==='up'){
      var amp=wobbleAmp(p.omega);
      var drift = (i===2)? p.driftSign*amp*0.6 : 0; // warped pole slumps lopsided
      var tipLean = amp*Math.sin(p.phase)*r*0.5 + drift*r*0.7;
      drawPlate(poles[i].x+tipLean, poles[i].tipY, r, amp, p.phase, p.spin, drift, p.omega);
    } else if(p.state==='falling'){
      drawPlate(poles[i].x+(p.driftX||0), p.y, r, 0.9, p.rot, p.spin, p.rot, DEAD_AT);
    }
  }
  // shards
  for(var s=0;s<shards.length;s++){
    var sh=shards[s];
    ctx.fillStyle='rgba(242,236,221,'+Math.max(0,sh.life).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(sh.x,sh.y,sh.sz*sh.life+0.5,0,6.29); ctx.fill();
  }
  drawFootlights();
}

// ---- idle patter ----
setInterval(function(){
  if(performance.now()-lastMsgAt>6500) say(pick(idleMsgs),false);
},3000);

// ---- loop ----
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05); last=now;
  step(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

console.log("%cWhip 'em round! Third one from the left's forever the one about to go \u2014 warped soft, that pole. Catch her early.",'color:#f4c766;font-style:italic');
})();
</script>
