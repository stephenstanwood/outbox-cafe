  <meta name="outbox-spec-era" content="Right now, 6:12 in the morning, in the last six minutes before a municipal swimming pool's water-chemistry log has to be initialled and hung on the nail by the pump room door — the building is 1964, the chlorine controller is 1998, the pH probe was replaced in March, and the page refuses to say the year because nothing in the room tells you. Not a look-back, not a lament, not anybody's lost childhood summer: the first lane swimmers are already on the deck bench, the free chlorine came back at 0.4 and needs to be 1.0 before anybody is allowed in the water, and the acid feed has been running for eleven minutes against a set point somebody changed and did not write down.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SENTENCE WRITTEN THIRTY-ONE TIMES, stacked as thirty-one lines with nothing else on the page — no header, no menu, no title, no footer, no scrollbar, no links, no buttons, no cursor label, no instructions, and no vertical scroll at any window size. Every line is the same sentence and every line is slightly different from the one above it, because each line is that sentence RE-DERIVED from the pool's live chemistry at a timestamp six seconds later than the line above it, so the thirty-one lines are three minutes and six seconds of one room, written out in full each time. The strangeness: THE READER IS READING DOWNWARD AND THE PAGE IS BEING RE-DERIVED UPWARD. Every six real seconds the engine computes a new bottom line from the current chemistry and every existing line shifts up one position, and the top line is pushed off the page and does not exist anywhere afterward — so a sentence the visitor is in the middle of reading is not where they left it, and the line they liked is gone in three minutes. The visitor's only vocabulary is what a hand does at a chemical feeder: DRAG DOWN or UP anywhere on the page to open and close the acid feed valve, PRESS AND HOLD to run the recirculation pump faster, and PRESS a single line to hold that one line still while the other thirty keep marching past it, which is the only way to read any sentence to the end. A held line stays held until it is pressed again, and it goes stale where it sits while the pool moves on around it, and nothing on the page says so.">
  <meta name="outbox-spec-subject" content="The flat arithmetic of pool water chemistry at six in the morning, which is almost entirely a pH-versus-chlorine-effectiveness problem and has nothing whatsoever to do with cleanliness or with how the water looks. That the single most important fact in the building is that FREE CHLORINE IS TWO DIFFERENT CHEMICALS IN EQUILIBRIUM and pH decides which one you have: hypochlorous acid, which is the disinfectant and kills things in seconds, and hypochlorite ion, which is nearly a hundred times weaker, and the split between them is set by pH alone — at 7.2 about two-thirds of your chlorine is the strong one, at 7.8 it is about a quarter, and at 8.2 it is under a tenth. So the same 1.0 ppm reading is worth four times as much at 7.3 as it is at 7.9, and every operator who chases the chlorine number without looking at the pH is adding gas to a problem that is not a chlorine problem. That this is why the acceptable pH band is narrow at both ends and not arbitrary: below 7.2 the water starts dissolving the grout and etching the plaster and stinging eyes, above 7.8 the chlorine is doing almost nothing and scale begins to drop out on the heat exchanger. That EYE STING IS NOT CHLORINE and never was — it is pH out of the tear-film range and it is chloramines, and the smell everybody calls 'chlorine smell' is specifically the smell of chlorine that has ALREADY BEEN USED UP, combined with ammonia from sweat and urine into monochloramine, dichloramine and nitrogen trichloride, which means a pool that smells strongly of chlorine is a pool with too little free chlorine and not too much. That the two numbers on the test kit are FREE and TOTAL, that the difference between them is combined chlorine, that anything over 0.2 ppm of combined is a pool that needs breakpoint chlorination, and that breakpoint is a real ratio and not a guess: it takes roughly ten parts of free chlorine for every one part of ammonia nitrogen to oxidise the chloramines all the way through, and dosing to eight parts makes it worse rather than better, because the intermediate stages are the ones that smell and burn. That ALKALINITY IS THE SHOCK ABSORBER AND PH IS THE READING: total alkalinity at 80 to 120 ppm is what keeps pH from moving when anything is added, and a pool with alkalinity at 40 will swing a full point on a gallon of acid while a pool at 100 barely moves — so an operator fighting pH all week is almost always looking at an alkalinity number they have not measured. That CALCIUM HARDNESS is the third leg and is not optional: soft water is aggressive and pulls calcium out of the plaster and the grout to satisfy itself, which is why a new pool filled from a soft municipal supply eats its own surfaces, and the Langelier index is the real arithmetic that ties pH, alkalinity, hardness and temperature into one number that says whether this water is dissolving the building or coating it. That TEMPERATURE IS IN THAT EQUATION, which means a pool held at 84 degrees for a warm-water program is chemically a different pool from the same water at 78, and the saturation index moves about two-tenths across that range. That CYANURIC ACID IS THE MOST MISUNDERSTOOD THING IN THE BUILDING: it protects chlorine from ultraviolet by binding most of it in reserve, which is essential outdoors and a genuine liability indoors, because bound chlorine is not working chlorine, and the practical rule is that the free chlorine has to be about 7.5 percent of the cyanuric acid level to have the same killing power — so a pool at 100 ppm cyanuric needs 7.5 ppm of chlorine to do what a pool at 30 ppm does with 2.25, and cyanuric acid does not evaporate, does not break down and can only be removed by draining water. That an indoor pool that has been dosed with stabilised chlorine tablets for years is a pool with a slowly rising floor under it that nobody measured. That CT VALUE IS THE ONLY THING THAT MATTERS FOR SAFETY and it is concentration multiplied by time: most bacteria are gone in under a minute at 1 ppm, giardia takes forty-five minutes, and cryptosporidium requires a CT of about 15,300 mg-min per litre, which at normal chlorine is more than ten days, which is why a crypto incident is not a chlorine problem at all but a hyperchlorination-and-close-the-pool problem, and why the UV unit in the plant room is the only real answer. That TURNOVER IS SEPARATE ARITHMETIC: the pool holds 246,000 gallons, the design turnover is six hours, so the pumps have to move about 680 gallons a minute, and turnover is exponential mixing and not a queue — one turnover removes about 63 percent of anything suspended, not all of it, and four turnovers gets you to 98. That FILTER PRESSURE IS A FLOW READING IN DISGUISE: as the sand loads, differential pressure climbs and flow falls, so a filter ten psi over clean is a pool whose turnover time has quietly gone from six hours to nine, and the chemistry that was correct at the old flow rate is not correct at the new one. That the ORP probe reads oxidation potential and not concentration, that it is what the controller actually acts on, that it drifts with pH and with cyanuric and with probe fouling, and that a controller trusting a dirty probe will feed acid or gas all night against a number that is not true. That the DPD test is the reference and the OT tablets are not, that a DPD reading that flashes pink and then goes clear means the chlorine is high enough to bleach the reagent and the true number is much higher than zero, and that this is the single most dangerous misread in the trade. And the flat arithmetic at the nail by the door: 0.4 free against a 1.0 minimum, pH 7.9 and coming down, alkalinity last measured Thursday, eleven minutes of acid feed against a set point somebody changed, one bather-load of lane swimmers on the bench, and a log that gets initialled at 6:18.">
  <meta name="outbox-spec-tone" content="The rapid, self-interrupting, figure-first voice of Marisol Achterberg-Nyondo, 47, certified pool operator for this building for nine years, who is standing at the test bench with a comparator block in one hand and is talking to nobody in particular because she does this out loud and always has, in short bursts between counting drops. She is not narrating and not reflecting and never addresses the visitor: she is reading a number, saying what it means for the number she has to hit, and going back to the drops. 'Point four. Point four free at seven-nine is not point four, it's about a tenth of a point four, say it properly, it's a tenth.' She counts every titration aloud and starts over twice because she loses the count. She revises her own dosing figure three separate times and says flatly what she had wrong each time: once because she ran the acid demand against Thursday's alkalinity instead of measuring it, once because she forgot the heater came up to 84 for the arthritis class and the saturation index moved, once because she read a DPD that flashed and cleared and believed the low number for about forty seconds before catching it. She is specifically and repeatedly aggrieved about exactly one thing — that somebody on second shift changed the controller's ORP set point without writing it in the book, and she has asked for a lock on the panel twice — and she says it three times, once with the date she asked. She is proud of exactly one thing and says it twice: that this pool has not been closed on her shift since she took the certification, and she gives the month and the number of days. She never explains anything to anybody, never teaches, never summarises, and answers no questions because nobody is asking any. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT meditative, NOT a craftsman-sage, NOT a woman-in-a-man's-plant-room arc, NOT charmed by herself, NOT lonely, NOT the dawn-quiet-before-the-world-wakes voice, and NOT aware of being read.">

<!--
  MARISOL ACHTERBERG-NYONDO, CPO, nine years on this building.
  Said at the bench between drops, 6:12 to 6:18, while the comparator was in her hand.
  Transcribed because she talks out loud and always has.

  Point four. Point four free at seven-nine is not point four. At seven-nine you've got what, a
  quarter of it hypochlorous, so call it a tenth of a point four, say it properly, it's a tenth.

  One. Two. Three — no. Start again. One. Two. Three. Four. Five. Five drops and it's still
  pink at the edge, so that's not five, that's five and a bit and I'm calling it six.

  I want one-oh free by eighteen past and I'm not getting it out of the gas feeder while the pH
  sits where it's sitting. Gas into seven-nine water is gas into a bucket with a hole in it.

  Acid's been running eleven minutes. Eleven. Against a set point somebody on second shift
  changed and did not write in the book. I asked for a lock on that panel. I asked on the
  fourteenth of May and I asked again after. Nobody has to tell me what they changed it to,
  they just have to write it down. That's the whole ask. A pencil and the book on the nail.

  Right — I ran that acid demand off Thursday's alkalinity and Thursday's alkalinity is a
  Thursday number. If that's come down to sixty I'm going to take a full tenth off the pH I
  didn't plan on taking. Scratch the figure. Call it two-thirds of what I said.

  One. Two. Three. Four. Lost it. One. Two. Three. Four. Five. Six.

  Channel B. Channel B is the old outdoor teaching pool, twenty metres, filled in with sand
  and paved in eighty-six, and it is still on the controller because the thing shipped with two
  channels and nobody ever took the second one off. There's a column for it in the log. I
  initial the column. That's what the column is for.

  And the heater's up. Heater came up to eighty-four Tuesday for the arthritis class and I did
  the saturation index at seventy-eight like a fool. Two-tenths the wrong way across that
  range. So it's less aggressive than I wrote, which means less acid, which means I've been
  feeding eleven minutes against a number that was already soft. Back it off.

  Hardness two-forty, that's fine, that's not the problem, hardness has never been the problem
  in this building. Cyanuric is the problem in this building and cyanuric only goes up, because
  the tablets are what gets bought, and cyanuric does not leave except in a hose.

  DPD flashed. Flashed pink and went clear and I read the clear and believed it for — forty
  seconds, near enough. Bleached the reagent. That's not a low number, that's a high number
  wearing a low number. Dilute it and run it again.

  Total minus free is point six combined. Point six. Anything over point two and you're
  breakpointing, and breakpoint is ten to one on ammonia nitrogen, not eight, eight is worse
  than nothing because eight leaves you standing in the middle of it.

  This pool has not closed on my shift. Not since March of seventeen when I took the
  certification. Three thousand four hundred and eleven days. Not one.

  One. Two. Three. Four. Five. Six. Seven. Seven and the block's matched.

  Log goes on the nail at eighteen past. Point four is not going on that line.
-->

<script>
(function(){
"use strict";

/* ============ storage: forward only ============ */
var KEY="pool.channelA.v1";
var P;
try{ P=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ P=null; }
if(!P||typeof P!=="object") P={};
function num(v,d){ v=Number(v); return isFinite(v)?v:d; }
P.cya      = num(P.cya, 41.0);        // only climbs
P.sandPsi  = num(P.sandPsi, 3.2);     // only climbs
P.fouling  = num(P.fouling, 0.18);    // only climbs
P.acidMin  = num(P.acidMin, 11.0);    // total minutes of acid feed, only climbs
P.lines    = num(P.lines, 0);         // total lines derived, only climbs
P.outBand  = num(P.outBand, 0);       // times out of allowable band
P.cyaB     = num(P.cyaB, 96.0);       // channel B, the paved one
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){}
}

/* ============ water model, channel A ============ */
var A = {
  gal: 246000,
  fc: 0.40,          // ppm free
  tc: 1.02,          // ppm total
  ph: 7.90,
  ta: 78,            // total alkalinity ppm
  ch: 238,           // calcium hardness ppm
  cya: P.cya,
  temp: 84.0,        // F, arthritis class
  nh3: 0.14,         // ammonia nitrogen ppm, from bathers
  orp: 648,
  psi: 9.1 + P.sandPsi,
  cleanPsi: 9.1,
  bathers: 9,
  flow: 680,         // gpm design
  flowSet: 680,
  acidGph: 1.1,      // live feed rate
  acidCmd: 1.1,
  phTarget: 7.90,    // lagged actual behind commanded chemistry
  phLag: 7.90,
  gasOn: false,
  dpdBleach: false,
  dpdReported: 0.40,
  lastTest: 0
};

var B = {  /* channel B — twenty metres, outdoor, paved 1986, still on the panel */
  gal: 71000,
  fc: 1.36,
  tc: 1.41,
  ph: 7.64,
  ta: 104,
  ch: 191,
  cya: P.cyaB,
  temp: 61.0,
  nh3: 0.005,
  orp: 731,
  psi: 6.4,
  cleanPsi: 6.4,
  bathers: 0,
  flow: 190,
  flowSet: 190,
  acidGph: 0,
  dpdReported: 1.36
};

/* hypochlorous fraction by pH — real equilibrium, pKa ~7.54 at 25C */
function hoclFrac(ph, temp){
  var pKa = 7.54 + (77 - temp) * 0.0035;
  return 1 / (1 + Math.pow(10, ph - pKa));
}
/* Langelier */
function lsi(w){
  var tf = (w.temp<=63)?0.5:(w.temp<=72)?0.6:(w.temp<=82)?0.7:(w.temp<=92)?0.8:0.9;
  var cf = Math.log(Math.max(w.ch,1))/Math.LN10 - 0.4;
  var caf = Math.max(w.ta - w.cya/3, 5);
  var af = Math.log(caf)/Math.LN10;
  return w.ph + tf + cf + af - 12.1;
}
/* buffer stiffness: stiffer at 110 than at 45 */
function buffer(ta){ return 0.55 + (ta/100)*1.35; }

function stepWater(w, dt, isB){
  var mix = w.flow / w.flowSet;               // mixing multiplier
  var k = dt * mix;

  /* acid feed: consumes alkalinity, drops pH on a stiff curve */
  if(w.acidGph > 0){
    var lbPerSec = w.acidGph * 9.8 / 3600;    // muriatic, lb-equivalent
    var taDrop = lbPerSec * dt * 4100 / w.gal;
    w.ta = Math.max(20, w.ta - taDrop);
    var phDrop = taDrop * 0.031 / buffer(w.ta);
    w.phTarget = Math.max(6.4, w.phTarget - phDrop);
    if(!isB) { P.acidMin += dt/60; }
  }
  /* natural upward drift from aeration over the gutter */
  w.phTarget += 0.0000085 * dt * (w.flow/680);

  /* real lag before pH responds — overshoot is easy and nothing warns */
  var lagRate = 0.055 * k;
  w.ph += (w.phTarget - w.ph) * Math.min(lagRate, 0.6);

  /* bathers put ammonia in; ammonia eats free chlorine into combined */
  var load = w.bathers * 0.0000072 * dt;
  w.nh3 += load;
  var frac = hoclFrac(w.ph, w.temp);
  var conv = Math.min(w.nh3, w.fc * frac * 0.0042 * k);
  if(conv > 0){
    w.nh3 -= conv;
    w.fc = Math.max(0, w.fc - conv * 3.2);
    w.tc = w.tc; /* combined rises as free falls */
  }
  /* combined decays slowly by oxidation when free is high */
  var comb = Math.max(0, w.tc - w.fc);
  var burn = Math.min(comb, w.fc * frac * 0.0011 * k);
  comb -= burn;
  w.fc = Math.max(0, w.fc - burn * 0.8);

  /* UV demand — channel B is outdoors under a real sky, and cyanuric is why it survives */
  if(isB){
    var sky = daylight();
    var prot = 1 / (1 + w.cya/28);
    w.fc = Math.max(0.05, w.fc - w.fc * sky * prot * 0.00042 * dt);
    /* outdoor temp tracks the hour */
    w.temp += ((52 + sky*19) - w.temp) * 0.00008 * dt;
    /* the stabilised tablets never stopped, in the sense that the number never came down */
    w.cya += 0.0000006 * dt;
    P.cyaB = w.cya;
  } else {
    /* indoor: no UV, but the tablets keep arriving */
    w.cya += 0.0000011 * dt;
    P.cya = w.cya;
    /* sand loads with flow; differential climbs permanently */
    P.sandPsi += 0.0000041 * dt * Math.pow(w.flow/680, 2.4);
    w.psi = w.cleanPsi * Math.pow(w.flow/680,1.85) + P.sandPsi;
    /* filter differential is a flow reading in disguise */
    var restrict = 1 - Math.min(0.42, P.sandPsi*0.022);
    w.flow = w.flowSet * restrict;
    /* probe fouls */
    P.fouling = Math.min(0.85, P.fouling + 0.0000008*dt);
  }

  w.tc = w.fc + comb;

  /* ORP from effective hypochlorous against pH and a live fouling term */
  var hocl = w.fc * frac;
  var free = hocl / (1 + w.cya * 0.061);     // cyanuric binds most of it in reserve
  var raw = 560 + 175 * Math.log(1 + free*11) / Math.LN10 * 2.1 - (w.ph - 7.4) * 44;
  var foul = isB ? 0.09 : P.fouling;
  w.orp = raw * (1 - foul*0.30) + foul*46;
}

function daylight(){
  var h = new Date().getHours() + new Date().getMinutes()/60;
  var d = Math.sin((h - 6.2)/12.6 * Math.PI);
  return Math.max(0, d);
}

/* ============ the controller, acting on a set point somebody changed ============ */
var SETPOINT = 742;   // was 700 on Friday. not in the book.
var gasCallback = null;
function controller(w, dt){
  if(w.orp < SETPOINT - 4){
    if(!w.gasOn){ w.gasOn = true; if(gasCallback) gasCallback(); }
  } else if(w.orp > SETPOINT + 10){
    if(w.gasOn){ w.gasOn = false; if(gasCallback) gasCallback(); }
  }
  if(w.gasOn){
    /* gas feeder does not care what the pH is doing */
    w.fc += 0.0068 * dt * (w.flow/680);
    w.tc += 0.0068 * dt * (w.flow/680);
  }
}

/* ============ DPD test cycle — the reagent bleaches above ~10 ppm ============ */
function testCycle(w){
  if(w.fc > 10.0){
    w.dpdBleach = true;
    /* flashed pink and went clear */
    w.dpdReported = Math.max(0.05, (w.fc - 10.0) * 0.031);
  } else {
    w.dpdBleach = false;
    w.dpdReported = w.fc;
  }
}

/* ============ the sentence: one template, about twenty slots ============ */
function f(n,d){ var s = n.toFixed(d); return s; }

function sentence(s){
  /* clause order never changes */
  var band = (s.ph < 7.2 || s.ph > 7.8);
  var phTxt = '<span class="'+(band?'ph':'')+'">'+f(s.ph,2)+'</span>';
  var fcTxt = '<span class="fc">'+f(s.fcShown,2)+'</span>';
  var closed = s.closed ? '<span class="cl">CLOSED</span>' : 'open';
  return (
    'At '+s.clock+' the free reads '+fcTxt+' ppm against total '+f(s.tc,2)+
    ' for combined '+f(s.comb,2)+', pH '+phTxt+' putting '+f(s.hoclPct,0)+
    ' percent of it hypochlorous so the working figure is '+f(s.effective,3)+
    ' ppm, alkalinity '+f(s.ta,0)+', hardness '+f(s.ch,0)+', cyanuric '+f(s.cya,0)+
    ' wanting '+f(s.cyaWant,2)+', '+f(s.temp,1)+' degrees, index '+(s.lsi>=0?'+':'')+f(s.lsi,2)+
    ', ORP '+f(s.orp,0)+' mV against set point '+f(s.sp,0)+', feeder '+s.feeder+
    ', acid '+f(s.acid,2)+' gph '+f(s.acidMin,0)+' minutes in, '+f(s.flow,0)+
    ' gpm at '+f(s.psi,1)+' psi for turnover '+f(s.turn,2)+
    ' hours, '+s.bathers+' on the load, CT to crypto '+f(s.ct,0)+' hours, pool '+closed+'.'
  );
}

function snapshot(w, isB, tstamp){
  var frac = hoclFrac(w.ph, w.temp);
  var comb = Math.max(0, w.tc - w.fc);
  var hocl = w.fc * frac;
  var effective = hocl / (1 + w.cya * 0.061);
  var turn = (w.gal / Math.max(w.flow,1)) / 60;
  var ctNeed = 15300;
  var ctHours = ctNeed / Math.max(effective*1000*0.06, 0.4) / 60;
  var d = new Date(tstamp);
  var clock = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  var fcShown = w.dpdReported;
  return {
    clock: clock,
    fcShown: fcShown,
    tc: w.tc,
    comb: comb,
    ph: w.ph,
    hoclPct: frac*100,
    effective: effective,
    ta: w.ta, ch: w.ch, cya: w.cya,
    cyaWant: w.cya * 0.075,
    temp: w.temp,
    lsi: lsi(w),
    orp: w.orp,
    sp: isB ? 742 : SETPOINT,
    feeder: w.gasOn ? 'calling' : 'off',
    acid: w.acidGph,
    acidMin: isB ? 0 : P.acidMin,
    flow: w.flow,
    psi: w.psi,
    turn: turn,
    bathers: isB ? '0' : String(w.bathers),
    ct: ctHours,
    closed: (!isB) && (fcShown < 1.0 || w.ph > 8.2 || w.ph < 7.0)
  };
}
function pad(n){ return (n<10?'0':'')+n; }

/* ============ line list ============ */
var ROWS = 31;
var lines = [];          // {html, born, held, holdAt, stale}
var container = document.getElementById("lines");
var nodes = [];
var held = -1;           // index into lines[] of the held line, or -1
var heldRow = -1;

function buildNodes(){
  container.innerHTML = "";
  nodes = [];
  for(var i=0;i<ROWS;i++){
    var el = document.createElement("div");
    el.className = "ln";
    el.setAttribute("data-row", String(i));
    var h = document.createElement("span");
    h.className = "halo";
    h.style.opacity = "0";
    el.appendChild(h);
    var t = document.createElement("span");
    t.className = "txt";
    el.appendChild(t);
    container.appendChild(el);
    nodes.push({el:el, halo:h, txt:t});
  }
  fit();
}

function fit(){
  var h = window.innerHeight;
  var w = window.innerWidth;
  var rowH = h / ROWS;
  /* the sentence is long; size so it fits the width without horizontal scroll */
  var approxChars = 260;
  var byW = (w - 12) / (approxChars * 0.601);
  var byH = rowH * 0.93;
  var fs = Math.min(byW, byH);
  fs = Math.max(3.0, fs);
  for(var i=0;i<nodes.length;i++){
    nodes[i].el.style.height = rowH+"px";
    nodes[i].el.style.fontSize = fs.toFixed(2)+"px";
    nodes[i].el.style.lineHeight = rowH+"px";
  }
  var c = document.getElementById("cert");
  c.style.width = Math.min(w*0.22, 150)+"px";
  c.style.height = Math.min(h*0.17, 112)+"px";
  c.style.left = (w*0.63)+"px";
  c.style.top = (h*0.14)+"px";
}
window.addEventListener("resize", fit);

/* ink density falls honestly across the thirty-one positions */
var INK_NEW = [0x1f,0x27,0x34];
var INK_OLD = [0x6e,0x77,0x88];
function inkFor(age01){
  var t = Math.pow(age01, 0.82);
  var r = Math.round(INK_NEW[0] + (INK_OLD[0]-INK_NEW[0])*t);
  var g = Math.round(INK_NEW[1] + (INK_OLD[1]-INK_NEW[1])*t);
  var b = Math.round(INK_NEW[2] + (INK_OLD[2]-INK_NEW[2])*t);
  return "rgb("+r+","+g+","+b+")";
}

/* characters already gone at the head of the page */
function rub(html, amount){
  if(amount <= 0.001) return html;
  var out = "", inTag = false, seed = 0;
  for(var i=0;i<html.length;i++){
    var c = html[i];
    if(c === "<") inTag = true;
    if(inTag){ out += c; if(c===">") inTag=false; continue; }
    if(c === " " || c === "&"){ out += c; continue; }
    seed = (seed*1103515245 + i*12345 + 7) & 0x7fffffff;
    var r = (seed % 1000)/1000;
    out += (r < amount) ? " " : c;
  }
  return out;
}

function render(){
  for(var i=0;i<ROWS;i++){
    var L = lines[i];
    var n = nodes[i];
    if(!L){ n.txt.innerHTML=""; n.halo.style.opacity="0"; continue; }
    var age01 = 1 - (i/(ROWS-1));   // row 0 is oldest
    if(L.held){
      /* held lines stop ageing in density where they were caught */
      age01 = L.frozenAge;
    }
    n.el.style.color = inkFor(age01);
    var amt = age01 > 0.72 ? (age01-0.72)*0.72 : 0;
    n.txt.innerHTML = rub(L.html, amt);
    if(L.held){
      var s = Math.min(1, L.stale/95);
      n.halo.style.opacity = (0.10 + s*0.62).toFixed(3);
      n.halo.style.transform = "scaleY("+(0.62 + s*0.42).toFixed(3)+")";
    } else {
      n.halo.style.opacity = "0";
    }
  }
}

/* ============ derivation loop: a new line at the foot every six real seconds ============ */
var lastDerive = 0;
var DERIVE_MS = 6000;

function deriveLine(offsetIdx){
  /* wildcard: row 17 of the thirty-one is channel B. always. */
  var isB = (offsetIdx === 16);
  var w = isB ? B : A;
  if(!isB) testCycle(w); else w.dpdReported = w.fc;
  var s = snapshot(w, isB, Date.now());
  if(!isB){
    if(s.ph < 7.2 || s.ph > 7.8){
      if(!A._wasOut){ P.outBand++; A._wasOut = true; }
    } else { A._wasOut = false; }
  }
  P.lines++;
  return { html: sentence(s), born: Date.now(), held:false, stale:0, frozenAge:0 };
}

function march(){
  /* every line shifts up one; the top line is deleted and is not stored anywhere */
  if(held >= 0){
    /* the held line stays at its row while everything else moves past it */
    var hl = lines[heldRow];
    lines.splice(0,1);
    /* re-insert the held line back at its row position */
    var idx = lines.indexOf(hl);
    if(idx >= 0) lines.splice(idx,1);
    while(lines.length < ROWS-1) lines.push(deriveLine(lines.length));
    lines.splice(heldRow, 0, hl);
    while(lines.length > ROWS) lines.pop();
    var nl = deriveLine(ROWS-1);
    lines.push(nl);
    while(lines.length > ROWS) lines.shift();
    /* re-anchor: held line must sit exactly at heldRow */
    var j = lines.indexOf(hl);
    if(j !== heldRow && j >= 0){
      lines.splice(j,1);
      lines.splice(heldRow,0,hl);
      while(lines.length > ROWS) lines.pop();
    }
  } else {
    lines.shift();
    lines.push(deriveLine(ROWS-1));
  }
  save();
}

/* ============ controls: the valve, the pump, the hold ============ */
var pressing = false, pressStart = 0, dragStart = 0, dragging = false, holdTimer = null;
var pumpBoost = false;

function setAcid(v){
  A.acidCmd = Math.max(0, Math.min(6.5, v));
  A.acidGph = A.acidCmd;
  if(audio) audio.acid(A.acidGph);
}

function toggleHoldAtRow(row){
  if(row < 0 || row >= ROWS) return;
  var L = lines[row];
  if(!L) return;
  if(held >= 0){
    var prev = lines[heldRow];
    if(prev){ prev.held = false; prev.stale = 0; }
    if(heldRow === row){ held = -1; heldRow = -1; render(); return; }
    held = -1; heldRow = -1;
  }
  L.held = true;
  L.frozenAge = 1 - (row/(ROWS-1));
  L.stale = 0;
  held = 1; heldRow = row;
  render();
}

function rowFromY(y){
  var rowH = window.innerHeight / ROWS;
  return Math.max(0, Math.min(ROWS-1, Math.floor(y / rowH)));
}

function down(x,y){
  pressing = true; dragging = false;
  pressStart = Date.now();
  dragStart = y;
  if(audio) audio.resume();
  holdTimer = setTimeout(function(){
    if(pressing && !dragging){ pumpBoost = true; A.flowSet = 940; }
  }, 340);
}
function move(x,y){
  if(!pressing) return;
  var dy = y - dragStart;
  if(Math.abs(dy) > 9){
    dragging = true;
    clearTimeout(holdTimer);
    if(pumpBoost){ pumpBoost = false; A.flowSet = 680; }
    setAcid(A.acidCmd + dy * 0.0055);
    dragStart = y;
  }
}
function up(x,y){
  clearTimeout(holdTimer);
  var dur = Date.now() - pressStart;
  if(pumpBoost){ pumpBoost = false; A.flowSet = 680; }
  else if(!dragging && dur < 340){ toggleHoldAtRow(rowFromY(y)); }
  pressing = false; dragging = false;
}

document.addEventListener("mousedown", function(e){ down(e.clientX, e.clientY); });
document.addEventListener("mousemove", function(e){ move(e.clientX, e.clientY); });
document.addEventListener("mouseup", function(e){ up(e.clientX, e.clientY); });
document.addEventListener("touchstart", function(e){ var t=e.touches[0]; down(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
document.addEventListener("touchmove", function(e){ var t=e.touches[0]; move(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
document.addEventListener("touchend", function(e){ var t=e.changedTouches[0]; up(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

var spaceDown = false;
document.addEventListener("keydown", function(e){
  if(audio) audio.resume();
  if(e.key === "ArrowDown"){ setAcid(A.acidCmd + 0.18); e.preventDefault(); }
  else if(e.key === "ArrowUp"){ setAcid(A.acidCmd - 0.18); e.preventDefault(); }
  else if(e.code === "Space"){ if(!spaceDown){ spaceDown = true; A.flowSet = 940; } e.preventDefault(); }
  else if(e.key >= "1" && e.key <= "9"){ toggleHoldAtRow(parseInt(e.key,10)-1); e.preventDefault(); }
});
document.addEventListener("keyup", function(e){
  if(e.code === "Space"){ spaceDown = false; A.flowSet = 680; e.preventDefault(); }
});

/* ============ sound ============ */
var audio = (function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  var ctx = null, started = false;
  var nodes = {};

  function tiledHall(){
    /* reverb computed for a 25-metre indoor pool, hard tile, long */
    var len = Math.floor(ctx.sampleRate * 3.4);
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for(var c=0;c<2;c++){
      var d = buf.getChannelData(c);
      for(var i=0;i<len;i++){
        var t = i/ctx.sampleRate;
        var env = Math.exp(-t*1.05);
        var early = 0;
        var taps = [0.011,0.019,0.031,0.047,0.063,0.089,0.121,0.167];
        for(var k=0;k<taps.length;k++){
          var s = Math.floor(taps[k]*ctx.sampleRate*(1+c*0.03));
          if(i===s) early += 0.42/(k+1);
        }
        d[i] = ((Math.random()*2-1)*env*0.55 + early) * (1 - i/len*0.2);
      }
    }
    var cv = ctx.createConvolver(); cv.buffer = buf;
    return cv;
  }

  function noiseBuf(sec){
    var len = Math.floor(ctx.sampleRate*sec);
    var b = ctx.createBuffer(1,len,ctx.sampleRate);
    var d = b.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
    return b;
  }

  function build(){
    var out = ctx.createGain(); out.gain.value = 0.62; out.connect(ctx.destination);
    var verb = tiledHall();
    var wet = ctx.createGain(); wet.gain.value = 0.44;
    verb.connect(wet); wet.connect(out);
    var dry = ctx.createGain(); dry.gain.value = 0.80; dry.connect(out);
    function send(n){ n.connect(dry); n.connect(verb); }
    nodes.send = send; nodes.out = out;

    /* 40 hp recirculation pump: blade-passing tone + bearing rumble */
    var bp = ctx.createOscillator(); bp.type="sawtooth"; bp.frequency.value = 174;
    var bpf = ctx.createBiquadFilter(); bpf.type="lowpass"; bpf.frequency.value=620; bpf.Q.value=3.4;
    var bpg = ctx.createGain(); bpg.gain.value = 0.050;
    bp.connect(bpf); bpf.connect(bpg); send(bpg); bp.start();
    nodes.blade = bp; nodes.bladeGain = bpg;

    var h2 = ctx.createOscillator(); h2.type="sine"; h2.frequency.value = 348;
    var h2g = ctx.createGain(); h2g.gain.value = 0.016;
    h2.connect(h2g); send(h2g); h2.start();
    nodes.blade2 = h2;

    var rum = ctx.createBufferSource(); rum.buffer = noiseBuf(4); rum.loop = true;
    var rumf = ctx.createBiquadFilter(); rumf.type="lowpass"; rumf.frequency.value = 118;
    var rumg = ctx.createGain(); rumg.gain.value = 0.10;
    rum.connect(rumf); rumf.connect(rumg); send(rumg); rum.start();
    /* the bearing. it has had a slight rumble since February and it is on the list. */
    var wob = ctx.createOscillator(); wob.type="sine"; wob.frequency.value = 2.9;
    var wobg = ctx.createGain(); wobg.gain.value = 0.035;
    wob.connect(wobg); wobg.connect(rumg.gain); wob.start();

    /* gutter lip: broad bed band-filtered by true flow */
    var gut = ctx.createBufferSource(); gut.buffer = noiseBuf(5); gut.loop = true;
    var gf = ctx.createBiquadFilter(); gf.type="bandpass"; gf.frequency.value = 1450; gf.Q.value = 0.55;
    var gf2 = ctx.createBiquadFilter(); gf2.type="highpass"; gf2.frequency.value = 480;
    var gg = ctx.createGain(); gg.gain.value = 0.052;
    gut.connect(gf); gf.connect(gf2); gf2.connect(gg); send(gg); gut.start();
    nodes.gutter = gf; nodes.gutterGain = gg;

    /* bench bed: about nine people, no words */
    var bed = ctx.createBufferSource(); bed.buffer = noiseBuf(7); bed.loop = true;
    var bf = ctx.createBiquadFilter(); bf.type="bandpass"; bf.frequency.value = 420; bf.Q.value = 1.1;
    var bg = ctx.createGain(); bg.gain.value = 0.0;
    bed.connect(bf); bf.connect(bg); send(bg); bed.start();
    var lfo = ctx.createOscillator(); lfo.type="sine"; lfo.frequency.value = 0.21;
    var lg = ctx.createGain(); lg.gain.value = 0.014;
    lfo.connect(lg); lg.connect(bg.gain); lfo.start();
    bg.gain.value = 0.017;
  }

  function click(freq, dur, gain, type, filt){
    var o = ctx.createOscillator(); o.type = type||"square"; o.frequency.value = freq;
    var g = ctx.createGain();
    var t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t+0.0015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    var f = ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value = filt||freq*1.7; f.Q.value=2.2;
    o.connect(f); f.connect(g); nodes.send(g);
    o.start(t); o.stop(t+dur+0.02);
  }

  var acidTimer = null, acidRate = 1.1;
  function scheduleAcid(){
    if(acidTimer) clearTimeout(acidTimer);
    if(acidRate <= 0.02) return;
    /* diaphragm stroke rate is the feed setting, audible with eyes shut */
    var spm = 11 + acidRate * 27;
    var ms = 60000/spm;
    acidTimer = setTimeout(function(){
      click(1180, 0.032, 0.085, "square", 2100);
      scheduleAcid();
    }, ms);
  }

  return {
    resume: function(){
      if(!started){
        try{ ctx = new AC(); }catch(e){ return; }
        build(); started = true; scheduleAcid();
        setTimeout(function(){ squeegee(); }, 24000);
        setTimeout(function(){ block(); }, 41000);
        setTimeout(function(){ block(); }, 118000);
      }
      if(ctx && ctx.state === "suspended") ctx.resume();
    },
    flow: function(gpm){
      if(!started) return;
      var r = gpm/680;
      var t = ctx.currentTime;
      nodes.blade.frequency.setTargetAtTime(174*r, t, 0.35);
      nodes.blade2.frequency.setTargetAtTime(348*r, t, 0.35);
      nodes.bladeGain.gain.setTargetAtTime(0.050*(0.7+r*0.42), t, 0.4);
      nodes.gutter.frequency.setTargetAtTime(1450*(0.8+r*0.3), t, 0.5);
      nodes.gutterGain.gain.setTargetAtTime(0.052*(0.6+r*0.6), t, 0.5);
    },
    acid: function(gph){ acidRate = gph; if(started) scheduleAcid(); },
    solenoid: function(){
      if(!started) return;
      /* gas feeder solenoid, out of time with everything */
      click(310, 0.055, 0.14, "square", 900);
      setTimeout(function(){ if(started) click(238, 0.040, 0.09, "square", 720); }, 38);
    },
    drop: function(){
      if(!started) return;
      /* a drop of reagent onto the comparator block */
      click(2450, 0.020, 0.055, "sine", 3200);
    }
  };

  function squeegee(){
    if(!started) return;
    var src = ctx.createBufferSource(); src.buffer = noiseBuf(1.6);
    var f = ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2300; f.Q.value=0.8;
    var g = ctx.createGain(); var t = ctx.currentTime;
    g.gain.setValueAtTime(0,t);
    for(var i=0;i<5;i++){
      g.gain.linearRampToValueAtTime(0.05, t+i*0.30+0.06);
      g.gain.linearRampToValueAtTime(0.004, t+i*0.30+0.26);
    }
    g.gain.linearRampToValueAtTime(0, t+1.55);
    src.connect(f); f.connect(g); nodes.send(g); src.start(t); src.stop(t+1.6);
    setTimeout(squeegee, 96000 + Math.random()*60000);
  }
  function block(){
    if(!started) return;
    /* a starting block being adjusted on the deck */
    click(168, 0.09, 0.11, "square", 420);
    setTimeout(function(){ if(started) click(142, 0.14, 0.09, "sawtooth", 360); }, 210);
  }
})();

gasCallback = function(){ if(audio) audio.solenoid(); };

/* ============ boot ============ */
function boot(){
  buildNodes();
  /* derive thirty-one lines back to front so the page is already three minutes deep */
  var now = Date.now();
  for(var i=0;i<ROWS;i++){
    stepWater(A, 6, false);
    stepWater(B, 6, true);
    controller(A, 6);
    controller(B, 6);
    var isB = (i === 16);
    var w = isB ? B : A;
    if(!isB) testCycle(w); else w.dpdReported = w.fc;
    var s = snapshot(w, isB, now - (ROWS-1-i)*6000);
    P.lines++;
    lines.push({ html: sentence(s), born: now-(ROWS-1-i)*6000, held:false, stale:0, frozenAge:0 });
  }
  save();
  render();
  lastDerive = performance.now();
  requestAnimationFrame(tick);
}

var lastT = 0, dropAccum = 0;
function tick(t){
  if(!lastT) lastT = t;
  var dt = Math.min(0.5, (t - lastT)/1000);
  lastT = t;

  stepWater(A, dt, false);
  stepWater(B, dt, true);
  controller(A, dt);
  controller(B, dt);
  if(audio) audio.flow(A.flow);

  if(held >= 0 && lines[heldRow]) lines[heldRow].stale += dt;

  dropAccum += dt;
  if(dropAccum > 3.4){ dropAccum = 0; if(audio && Math.random()<0.55) audio.drop(); }

  if(t - lastDerive >= DERIVE_MS){
    lastDerive += DERIVE_MS;
    if(t - lastDerive > DERIVE_MS*3) lastDerive = t;
    march();
    render();
  }
  requestAnimationFrame(tick);
}
