  <meta name="outbox-spec-era" content="Undated / out of time — the plain physical fact of a winter starling murmuration wheeling over a small market-town's rooftops in the last twenty minutes before dark, the exact wheeling knot of forty thousand birds that gathers over a reed-bed or a pier every clear cold dusk and looked no different a hundred winters ago; not pinned to a decade because birds flock the way birds have always flocked — each one just watching its seven nearest neighbours, matching their speed and holding its little gap, and out of forty thousand of those tiny selfish rules a single breathing organism folds and pours and thins across the whole sky. It is doing this RIGHT NOW over some cold town somewhere while the streetlights come on underneath. Not a relic, not a nostalgia piece, not a 'nobody looks up anymore' elegy — a live sky churning with birds this minute, the flock guttering thick then sheer as it turns edge-on to you.">
  <meta name="outbox-spec-format" content="The entire viewport IS the dusk sky over a low black rooftop-line, edge to edge, with a live generative starling murmuration genuinely computed by real boid flocking — every one of thousands of dark birds steering by honest separation / alignment / cohesion off its nearest neighbours, so the whole cloud truly folds, pours, thickens where the flock banks side-on and goes gauzy-thin where it turns edge-on, splitting and re-joining and never once repeating. It is a real flocking simulation every frame, not a canned loop. No page chrome, no header, no menu, no captions, no controls, no text anywhere except one tiny line at the very foot of the sky.">
  <meta name="outbox-spec-subject" content="The plain physics of a starling murmuration and the honest, wholly local rules that build it — no leader, no plan, just each bird holding station on the seven or so around it: veer if a neighbour crowds you, swing your heading to match the ones alongside, drift toward the middle of your little pack, and repeat forty thousand times a second until the sky itself seems to breathe and bank and pour. The read of it: how the flock goes ink-dark and solid where it presents its broad side and washes to smoke where it wheels edge-on, how a shove sends a ripple of swerve racing out through the whole mass in a heartbeat, how it braids into two rivers and pours back into one. Not a metaphor for crowds or unity or the soul or anything at all — literally birds, seven neighbours apiece, a shared gap held, and the enormous single wheeling shape that falls out of every one of them minding only its own small business.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the one tiny tally at the foot of the sky — the tone is purely the wordless, leaning-in delight of standing on a cold pavement with your neck craned back watching the flock turn: greedy to see which way the whole cloud pours next, tickled when it goes suddenly ink-black as it banks broadside and then washes to nothing as it swings edge-on, thrilled when a ripple of swerve tears across the mass. The flocking is treated as a plain physical fact and a genuine visual thrill — bright and busy and alive, not reverent, not hushed, not precious, not a slow-down-and-breathe register. The closest thing to a voice is the flock's own restless refusal to hold the same shape for even a second.">

  <meta name="outbox-spec-wildcard" content="Exactly one bird in the whole flock is not soot-dark at all — a single pale leucistic starling, near-white, that flocks by the identical rules as every other bird and so is forever buried and swept along in the churning mass, flashing into view only for the half-second the flock happens to go gauzy-thin and edge-on around it, then lost again in the dark. It is never labelled, never pointed at, never counted, never treated any differently by the physics; it is simply there among the forty thousand for whoever watches long enough to catch the one white bird wheeling in the dark.">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forty Thousand, Minding Their Own Business</title>
<!-- each bird only ever watches the seven or so nearest it. that's the whole trick. -->
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#3a2f4a;}
  body{
    /* the cold-dusk sky: ember along the roofline, up through rose and mauve to a bruised zenith */
    background:linear-gradient(to top,
      #e0a24c 0%,
      #d59662 9%,
      #c98a7a 22%,
      #b0849a 38%,
      #8f7d94 54%,
      #6a5c74 74%,
      #3a2f4a 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  /* the first cold star, coming out top-left */
  .star{
    position:fixed;top:9%;left:11%;width:2px;height:2px;border-radius:50%;
    background:#eef2f8;z-index:0;
    box-shadow:0 0 3px 1px rgba(238,242,248,.9),0 0 9px 3px rgba(238,242,248,.35);
    animation:twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.85}45%{opacity:.55}70%{opacity:1}}
  canvas#sky{
    position:fixed;inset:0;width:100vw;height:100vh;z-index:1;
    display:block;cursor:none;touch-action:none;
  }
  .tally{
    position:fixed;left:0;right:0;bottom:calc(11% + 10px);z-index:2;
    text-align:center;pointer-events:none;
    font-size:9px;letter-spacing:2.5px;text-transform:uppercase;
    color:rgba(238,242,248,.42);
    text-shadow:0 1px 2px rgba(13,10,18,.6);
  }
  .rest{
    position:fixed;right:12px;bottom:8px;z-index:2;
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(238,242,248,.30);text-decoration:none;
  }
  .rest:hover{color:rgba(238,242,248,.7);}
</style>
</head>
<body>
  <div class="star" aria-hidden="true"></div>
  <canvas id="sky"></canvas>
  <div class="tally" id="tally">DUSKS WATCHED FROM THIS PAVEMENT: 0</div>
  <a class="rest" href="/archive">the rest of the sky</a>

<script>
(function(){
  "use strict";

  // ---- persistent tally: only ever counts up, one per load ----
  var n = 0;
  try{ n = parseInt(localStorage.getItem("dusks_watched")||"0",10)||0; }catch(e){}
  n += 1;
  try{ localStorage.setItem("dusks_watched", String(n)); }catch(e){}
  document.getElementById("tally").textContent = "DUSKS WATCHED FROM THIS PAVEMENT: " + n;

  var cv = document.getElementById("sky");
  var ctx = cv.getContext("2d");
  var W, H, DPR, bound, roofBaseY;
  var buildings = [], aerials = [];

  function buildRoof(){
    buildings = []; aerials = [];
    roofBaseY = H - Math.max(56, H*0.11);
    var x = -10;
    while(x < W + 20){
      var bw = 34 + Math.random()*84;
      var bh = Math.random()*46;
      var top = roofBaseY - bh;
      buildings.push({x:x, w:bw, top:top});
      // the odd chimney or aerial poking up
      if(Math.random() < 0.4){
        var ax = x + bw*(0.2+Math.random()*0.6);
        var ah = 6 + Math.random()*20;
        aerials.push({x:ax, y:top, h:ah, cross: Math.random()<0.5});
      }
      x += bw;
    }
    bound = roofBaseY - 34;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildRoof();
  }

  // ---- the flock: structure of arrays for speed ----
  var COUNT = Math.round(Math.min(1500, Math.max(450, (window.innerWidth*window.innerHeight)/1050)));
  var px_ = new Float32Array(COUNT), py_ = new Float32Array(COUNT);
  var vx_ = new Float32Array(COUNT), vy_ = new Float32Array(COUNT);
  var ax_ = new Float32Array(COUNT), ay_ = new Float32Array(COUNT);
  var whiteIdx = Math.floor(Math.random()*COUNT); // the one pale leucistic starling

  function initBirds(){
    var cx = window.innerWidth*0.5, cy = window.innerHeight*0.4;
    for(var i=0;i<COUNT;i++){
      var a = Math.random()*Math.PI*2, r = Math.random()*180;
      px_[i] = cx + Math.cos(a)*r;
      py_[i] = cy + Math.sin(a)*r*0.7;
      var d = Math.random()*Math.PI*2;
      px_[i]; 
      vx_[i] = Math.cos(d)*1.8;
      vy_[i] = Math.sin(d)*1.8;
    }
  }

  // ---- tuning: honest local rules ----
  var MAXSPEED = 2.7, MINSPEED = 1.15, MAXFORCE = 0.07;
  var PERC = 44, PERC2 = PERC*PERC;
  var SEP = 17, SEP2 = SEP*SEP;
  var W_ALIGN = 1.1, W_COH = 0.85, W_SEP = 1.7, W_ANCHOR = 0.22, W_PRED = 3.2;
  var TURN = 0.30, MARGIN = 70, TOPM = 44;
  var PREDR = 140, PREDR2 = PREDR*PREDR;

  // predator (cursor) state
  var predX = -999, predY = -999, predActive = false, predDX = 1, predDY = 0;

  // clap / panic
  var panic = 0;

  // wandering anchor keeps the whole knot roosting-circling over the roofs
  var t0 = performance.now();

  // spatial hash
  var CELL = PERC;

  function step(now){
    var t = now - t0;
    var cols = Math.max(1, Math.ceil(W/CELL));
    var rows = Math.max(1, Math.ceil(H/CELL));
    var grid = new Array(cols*rows);
    var i, cx, cy, key;
    for(i=0;i<COUNT;i++){
      cx = px_[i]/CELL|0; cy = py_[i]/CELL|0;
      if(cx<0)cx=0; else if(cx>=cols)cx=cols-1;
      if(cy<0)cy=0; else if(cy>=rows)cy=rows-1;
      key = cx + cy*cols;
      (grid[key] || (grid[key]=[])).push(i);
    }

    var msNow = MAXSPEED*(1 + panic*1.4);
    var anchorX = W*0.5 + Math.cos(t*0.00034)*W*0.24;
    var anchorY = H*0.40 + Math.sin(t*0.00052)*H*0.15;

    for(i=0;i<COUNT;i++){
      var x=px_[i], y=py_[i], vx=vx_[i], vy=vy_[i];
      cx = x/CELL|0; cy = y/CELL|0;
      if(cx<0)cx=0; else if(cx>=cols)cx=cols-1;
      if(cy<0)cy=0; else if(cy>=rows)cy=rows-1;

      var cnt=0, avx=0, avy=0, cxs=0, cys=0, sepx=0, sepy=0;
      var gx, gy, cell, j, k, dx, dy, d2, d;
      for(gy=cy-1; gy<=cy+1; gy++){
        if(gy<0||gy>=rows) continue;
        for(gx=cx-1; gx<=cx+1; gx++){
          if(gx<0||gx>=cols) continue;
          cell = grid[gx+gy*cols];
          if(!cell) continue;
          for(k=0;k<cell.length;k++){
            j = cell[k];
            if(j===i) continue;
            dx = x-px_[j]; dy = y-py_[j];
            d2 = dx*dx+dy*dy;
            if(d2 < PERC2){
              cnt++;
              avx += vx_[j]; avy += vy_[j];
              cxs += px_[j]; cys += py_[j];
              if(d2 < SEP2){
                d = Math.sqrt(d2)||0.0001;
                sepx += dx/d; sepy += dy/d;
              }
            }
          }
        }
      }

      var m;
      // alignment: swing heading to match the ones alongside
      if(cnt>0){
        m = Math.hypot(avx,avy);
        if(m>0) seek(i, avx/m*MAXSPEED, avy/m*MAXSPEED, W_ALIGN, vx, vy);
        // cohesion: drift toward the middle of the little pack
        var tx = cxs/cnt - x, ty = cys/cnt - y;
        var mm = Math.hypot(tx,ty);
        if(mm>0) seek(i, tx/mm*MAXSPEED, ty/mm*MAXSPEED, W_COH, vx, vy);
      }
      // separation: veer if a neighbour crowds you
      if(sepx||sepy){
        m = Math.hypot(sepx,sepy);
        seek(i, sepx/m*MAXSPEED, sepy/m*MAXSPEED, W_SEP, vx, vy);
      }
      // gentle roost-circling anchor
      var axx = anchorX-x, ayy = anchorY-y, am = Math.hypot(axx,ayy);
      if(am>0) seek(i, axx/am*MAXSPEED, ayy/am*MAXSPEED, W_ANCHOR, vx, vy);

      // predator: flee the stooping peregrine
      if(predActive){
        dx = x-predX; dy = y-predY; d2 = dx*dx+dy*dy;
        if(d2 < PREDR2){
          d = Math.sqrt(d2)||0.0001;
          var f = 1 - d/PREDR;
          seek(i, dx/d*MAXSPEED, dy/d*MAXSPEED, W_PRED*(0.4+f), vx, vy);
        }
      }

      // soft boundaries so the knot stays over the roofs
      if(x < MARGIN) ax_[i] += TURN; else if(x > W-MARGIN) ax_[i] -= TURN;
      if(y < TOPM) ay_[i] += TURN; else if(y > bound-MARGIN) ay_[i] -= TURN;

      // integrate
      vx += ax_[i]; vy += ay_[i];
      var sp = Math.hypot(vx,vy);
      if(sp > msNow){ vx = vx/sp*msNow; vy = vy/sp*msNow; }
      else if(sp < MINSPEED && sp > 0){ vx = vx/sp*MINSPEED; vy = vy/sp*MINSPEED; }
      x += vx; y += vy;

      px_[i]=x; py_[i]=y; vx_[i]=vx; vy_[i]=vy;
      ax_[i]=0; ay_[i]=0;
    }

    if(panic > 0.0008) panic *= 0.94; else panic = 0;

    render();
    requestAnimationFrame(step);
  }

  function seek(i, dvx, dvy, w, vx, vy){
    var sx = dvx - vx, sy = dvy - vy;
    var m = Math.hypot(sx,sy);
    if(m > MAXFORCE){ sx = sx/m*MAXFORCE; sy = sy/m*MAXFORCE; }
    ax_[i] += sx*w; ay_[i] += sy*w;
  }

  // ---- rendering: ink-dark broadside, gauzy-thin edge-on ----
  var B = 7;
  var buckets = [];
  for(var b=0;b<B;b++) buckets.push([]);

  function render(){
    ctx.clearRect(0,0,W,H);
    for(var b=0;b<B;b++) buckets[b].length = 0;

    var wx=0, wy=0, wex=0, wey=0, wpres=0, haveWhite=false;

    for(var i=0;i<COUNT;i++){
      var vx=vx_[i], vy=vy_[i];
      var sp = Math.hypot(vx,vy);
      // broadside (moving across the sight-line) reads dark; edge-on washes to haze
      var bf = sp>0 ? Math.abs(vy)/sp : 0;
      var pres = 0.12 + 0.88*bf;
      var tl = 3 + pres*3.2;
      var x = px_[i], y = py_[i];
      var ex = x - vx*tl, ey = y - vy*tl;
      if(i === whiteIdx){
        wx=x; wy=y; wex=ex; wey=ey; wpres=pres; haveWhite=true;
        continue;
      }
      var bi = (pres*B)|0; if(bi>B-1) bi=B-1;
      var arr = buckets[bi];
      arr.push(x, y, ex, ey);
    }

    ctx.strokeStyle = "#161018";
    ctx.lineCap = "round";
    for(var bb=0;bb<B;bb++){
      var a2 = buckets[bb];
      if(a2.length === 0) continue;
      var frac = bb/(B-1);
      ctx.globalAlpha = 0.15 + frac*0.62;
      ctx.lineWidth = 0.8 + frac*1.7;
      ctx.beginPath();
      for(var k=0;k<a2.length;k+=4){
        ctx.moveTo(a2[k], a2[k+1]);
        ctx.lineTo(a2[k+2], a2[k+3]);
      }
      ctx.stroke();
    }

    // the one pale bird, flocking by the identical rules — flashes when the mass thins around it
    if(haveWhite){
      ctx.globalAlpha = 0.5 + 0.45*wpres;
      ctx.lineWidth = 1.7;
      ctx.strokeStyle = "#eef2f8";
      ctx.beginPath();
      ctx.moveTo(wx, wy); ctx.lineTo(wex, wey);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // the stooping peregrine at the cursor
    if(predActive){
      ctx.save();
      ctx.translate(predX, predY);
      ctx.rotate(Math.atan2(predDY, predDX));
      ctx.fillStyle = "#0d0a12";
      ctx.beginPath();
      ctx.moveTo(9,0);
      ctx.lineTo(-7,-8);
      ctx.lineTo(-3,0);
      ctx.lineTo(-7,8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // the flat black rooftop-line, drawn last so birds pour behind the chimneys
    ctx.fillStyle = "#0d0a12";
    var i2;
    for(i2=0;i2<buildings.length;i2++){
      var bg = buildings[i2];
      ctx.fillRect(bg.x, bg.top, bg.w+1, H-bg.top);
    }
    ctx.strokeStyle = "#0d0a12";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for(i2=0;i2<aerials.length;i2++){
      var ae = aerials[i2];
      ctx.moveTo(ae.x, ae.y);
      ctx.lineTo(ae.x, ae.y-ae.h);
      if(ae.cross){
        ctx.moveTo(ae.x-4, ae.y-ae.h+3);
        ctx.lineTo(ae.x+4, ae.y-ae.h+3);
      }
    }
    ctx.stroke();
  }

  // ---- input: the peregrine follows the pointer ----
  function movePred(x, y){
    var ndx = x - predX, ndy = y - predY;
    if(ndx || ndy){ predDX = ndx; predDY = ndy; }
    predX = x; predY = y; predActive = true;
  }
  window.addEventListener("mousemove", function(e){ movePred(e.clientX, e.clientY); });
  window.addEventListener("mouseleave", function(){ predActive = false; });

  // touch: drag to drive the flock; a quick tap is a clap
  var tStart = 0, tMoved = 0, tx0 = 0, ty0 = 0;
  cv.addEventListener("touchstart", function(e){
    var tt = e.touches[0];
    tStart = performance.now(); tMoved = 0; tx0 = tt.clientX; ty0 = tt.clientY;
    movePred(tt.clientX, tt.clientY);
  }, {passive:true});
  cv.addEventListener("touchmove", function(e){
    var tt = e.touches[0];
    tMoved += Math.abs(tt.clientX - tx0) + Math.abs(tt.clientY - ty0);
    tx0 = tt.clientX; ty0 = tt.clientY;
    movePred(tt.clientX, tt.clientY);
  }, {passive:true});
  cv.addEventListener("touchend", function(){
    predActive = false;
    if(performance.now() - tStart < 260 && tMoved < 14) clap();
  }, {passive:true});

  // spacebar: a clap that startles the whole flock at once
  function clap(){
    var mx=0, my=0, i;
    for(i=0;i<COUNT;i++){ mx += px_[i]; my += py_[i]; }
    mx/=COUNT; my/=COUNT;
    for(i=0;i<COUNT;i++){
      var dx = px_[i]-mx, dy = py_[i]-my, d = Math.hypot(dx,dy)||0.0001;
      var burst = 4.2 + Math.random()*2.4;
      vx_[i] += dx/d*burst + (Math.random()-0.5)*2.6;
      vy_[i] += dy/d*burst + (Math.random()-0.5)*2.6;
    }
    panic = 1;
  }
  window.addEventListener("keydown", function(e){
    if(e.code === "Space" || e.key === " "){ e.preventDefault(); clap(); }
  });

  window.addEventListener("resize", resize);

  // console, for whoever pops the hood: no leader in there, no plan.
  try{ console.log("%cforty thousand birds. each one only watching its seven nearest. one of them is white.","color:#c98a7a"); }catch(e){}

  resize();
  initBirds();
  requestAnimationFrame(step);
})();
</script>
