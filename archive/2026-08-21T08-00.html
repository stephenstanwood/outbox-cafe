  <meta name="outbox-spec-era" content="1996, right now — twenty past eight on a hot, dead-still Tuesday evening at the edge of a flooded rice paddy outside Suphanburi, central Thailand, second week of the rains, working a bamboo-and-nylon dip net off a kerosene lantern hung on a pole. Not a look-back at 'village life' and not a lament for anything — the lantern has been lit forty minutes, the water is coming alive, and the tin has to be reasonably full before the moon gets up and ruins the whole thing.">
  <meta name="outbox-spec-format" content="A REAL, PLAYABLE CATCHING GAME PLAYED WITH ONE LANTERN AND ONE NET, filling the viewport as a single sheet of black water seen from a standing crouch. The visitor drags the lantern (a warm circle of light on the water surface) to wherever they want it, and the insects genuinely fly toward light on their own honest phototaxis — they are not spawned into the net's path, they are attracted to wherever the lamp actually is, arriving over real seconds, circling, dropping to the surface, skating on the film, and taking off again. The net is swung with the cursor: a real arc with real timing, and a swing that hits the water surface makes a wave that scatters everything within a radius. Fill the tin. Nothing scrolls; the whole game is the relationship between where the light is, where the net is, and how long you're willing to wait for the water to build up.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of catching mole crickets and rice-field water bugs by lamplight — that phototaxis is not instant obedience but a slow spiralling approach, so a lamp just moved is a lamp with nothing under it yet and the whole skill is patience with a light you already placed; that the insects come to the reflection on the water rather than to the flame itself, so a lamp hung high over open water pulls far better than the same lamp held low against the bank where the reflection is broken by weed; that mole crickets fly heavily and low and arrive in bursts after a rain, while giant water bugs come in singly, hit the surface hard, and then SWIM, so they must be netted underwater and not scooped off the top; that a water bug on the film will fly again within about eight seconds of landing if nothing takes it, and that this eight seconds is the entire game; that the net must enter the water edge-first and be swept, because a net dropped flat pushes a pressure wave ahead of it and everything within a foot is gone before the rim arrives; that the swing therefore has to lead the target and that the water itself telegraphs your swing before the net does; that every insect already IN the tin makes noise and that noise attracts nothing, which is the flat disappointment of the thing; that a bright moon washes out the lamp's relative advantage and ends the evening regardless of how good you are, because the water is then lit everywhere and the lamp is no longer the only light; and the ordinary economics of it — mole crickets sell by the tin, water bugs by the piece and for more, and the tin is not full yet. Literally kerosene, a reflection on water, eight seconds, and a net swung edge-first.">
  <meta name="outbox-spec-tone" content="The fast, loud, competitive voice of Prakai, seventeen, who has been doing this since she could hold the pole and is catching alongside you with her own net, keeping her own count out loud and rubbing it in — talking straight at you in short shouted corrections ('You moved it AGAIN. You keep moving it. Nothing has had time to find it — leave the lamp where it is and count to twenty, I'll count for you'), openly scornful of people who swing flat and slap the water, briefly and genuinely delighted when you take a water bug underwater instead of skimming for it, mentioning twice that the moon comes up around ten and that's the end of it, and completely uninterested in whether any of this is atmospheric. Present tense, second person, hot still evening, mosquitoes, frogs going, water up over the ankles.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Kerosene lamp-flame amber (#f0a830) with its hot core going near-white (#fff2cf) as the single source of light in the piece, thrown as a real reflected pool on flat black paddy water (#0d1512) that shades to a cold dead green-black away from the lamp (#141f1a), with wet insect carapace rendered as a hard chitin brown catching a specular amber edge (#7a4a1c), and exactly one chip of tin-pail zinc grey (#a8b0ac) held strictly for the pail rim, the net hoop and the tally marks. Hard, high-contrast, everything outside the lamp's pool genuinely unreadable — no ambient fill, no glow-bloom haze, no moonlight until the moon actually comes up.">
  <meta name="outbox-spec-wildcard" content="The lamp's kerosene is finite and never mentioned: the flame's radius and the reflection pool shrink by a real, tiny, continuous amount over the whole session, so late catching is measurably harder for a second reason nobody names. Prakai never refers to it, there is no fuel gauge, no warning, no refill, and it is discoverable only by noticing that the pool of light on the water is not the size it was when you started.">

<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,bankH=0,bankY=0;
var weeds=[];
function genWeeds(){weeds=[];for(var i=0;i<8;i++){weeds.push({nx:Math.random(),ny:0.08+Math.random()*0.82,nr:0.035+Math.random()*0.075,s:Math.random()*99});}}
genWeeds();
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
 cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
 bankH=Math.min(96,H*0.15);bankY=H-bankH;
 lamp.x=Math.min(Math.max(lamp.x,34),W-34);lamp.y=Math.min(Math.max(lamp.y,60),bankY-24);}
var lamp={x:0,y:0,still:0,moves:0,lastMove:-99};
var baseR=0;
var T=0,TS=22; // 1 real second = 22 game seconds
var amb=0,fuel=1;
var agents=[],waves=[],ripples=[];
var tin={cr:0,bug:0,moth:0},her=0,herAcc=0;
var net={x:-999,y:-999,px:-999,py:-999,inWater:false,depth:0,speed:0,entryT:-9,entryPending:false,entryMax:0,flat:0};
var dragging=false,over=false;
var openF=0.5,openTimer=0;
var burstT=25+Math.random()*25;
var rnd=Math.random;
function d2(a,b,c,d){var x=a-c,y=b-d;return x*x+y*y;}

/* ---------- audio ---------- */
var A=null,bed=null,hissG=null,sweepG=null,sweepF=null,started=false;
function noiseBuf(sec){var n=Math.floor(A.sampleRate*sec),b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
var NB=null;
function initAudio(){
 if(started)return;started=true;
 try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){A=null;return;}
 NB=noiseBuf(2.2);
 var master=A.createGain();master.gain.value=0.9;master.connect(A.destination);
 // frog & insect bed
 var s=A.createBufferSource();s.buffer=NB;s.loop=true;
 var bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=0.7;
 bed=A.createGain();bed.gain.value=0.05;s.connect(bp);bp.connect(bed);bed.connect(master);s.start();
 var lfo=A.createOscillator();lfo.frequency.value=0.13;var lg=A.createGain();lg.gain.value=420;
 lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
 // lantern hiss
 var s2=A.createBufferSource();s2.buffer=NB;s2.loop=true;
 var hp=A.createBiquadFilter();hp.type='highpass';hp.frequency.value=3400;
 hissG=A.createGain();hissG.gain.value=0.014;s2.connect(hp);hp.connect(hissG);hissG.connect(master);s2.start();
 // sweep rush
 var s3=A.createBufferSource();s3.buffer=NB;s3.loop=true;
 sweepF=A.createBiquadFilter();sweepF.type='bandpass';sweepF.frequency.value=600;sweepF.Q.value=1.5;
 sweepG=A.createGain();sweepG.gain.value=0;s3.connect(sweepF);sweepF.connect(sweepG);sweepG.connect(master);s3.start();
 mstr=master;
 setInterval(frogs,700);setInterval(rattle,230);
}
var mstr=null;
function frogs(){ if(!A)return; var n=Math.random();
 if(n<0.62){ // frog
   var o=A.createOscillator();o.type='sawtooth';var f=140+Math.random()*180;o.frequency.value=f;
   var g=A.createGain();g.gain.value=0;var lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
   o.connect(lp);lp.connect(g);g.connect(mstr);
   var t=A.currentTime,dur=0.12+Math.random()*0.28;
   g.gain.setValueAtTime(0,t);
   var reps=2+Math.floor(Math.random()*4);
   for(var i=0;i<reps;i++){var tt=t+i*(dur/reps);g.gain.linearRampToValueAtTime(0.035+Math.random()*0.03,tt+0.01);g.gain.linearRampToValueAtTime(0.002,tt+dur/reps*0.85);}
   g.gain.linearRampToValueAtTime(0,t+dur+0.05);o.start(t);o.stop(t+dur+0.1);
 } else if(n<0.9){ // field cricket tick
   var s=A.createBufferSource();s.buffer=NB;var bp=A.createBiquadFilter();bp.type='bandpass';
   bp.frequency.value=3800+Math.random()*2600;bp.Q.value=14;
   var g2=A.createGain();g2.gain.value=0;s.connect(bp);bp.connect(g2);g2.connect(mstr);
   var t2=A.currentTime;g2.gain.setValueAtTime(0.05,t2);g2.gain.exponentialRampToValueAtTime(0.001,t2+0.09);
   s.start(t2);s.stop(t2+0.12);
 }
}
function rattle(){ if(!A)return; var c=tin.cr+tin.bug; if(c<1)return;
 if(Math.random()>Math.min(0.85,0.12+c/26))return;
 var s=A.createBufferSource();s.buffer=NB;var bp=A.createBiquadFilter();bp.type='bandpass';
 bp.frequency.value=1500+Math.random()*2500;bp.Q.value=6;
 var g=A.createGain();g.gain.value=0;s.connect(bp);bp.connect(g);g.connect(mstr);
 var t=A.currentTime;g.gain.setValueAtTime(0.03+Math.min(0.05,c/400),t);g.gain.exponentialRampToValueAtTime(0.0008,t+0.055);
 s.start(t);s.stop(t+0.08);
}
function slapSnd(force){ if(!A)return;
 var s=A.createBufferSource();s.buffer=NB;var lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
 var g=A.createGain();g.gain.value=0;s.connect(lp);lp.connect(g);g.connect(mstr);
 var t=A.currentTime;g.gain.setValueAtTime(0.34*force,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
 s.start(t);s.stop(t+0.3);
 var o=A.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(58,t+0.18);
 var g2=A.createGain();g2.gain.setValueAtTime(0.24*force,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.22);
 o.connect(g2);g2.connect(mstr);o.start(t);o.stop(t+0.26);
}
function catchSnd(big){ if(!A)return;
 var s=A.createBufferSource();s.buffer=NB;var bp=A.createBiquadFilter();bp.type='bandpass';
 bp.frequency.value=big?900:1900;bp.Q.value=4;
 var g=A.createGain();var t=A.currentTime;g.gain.setValueAtTime(big?0.16:0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+(big?0.16:0.07));
 s.connect(bp);bp.connect(g);g.connect(mstr);s.start(t);s.stop(t+0.2);
}
function plop(){ if(!A)return;var o=A.createOscillator();o.type='sine';var t=A.currentTime;
 o.frequency.setValueAtTime(680,t);o.frequency.exponentialRampToValueAtTime(180,t+0.09);
 var g=A.createGain();g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
 o.connect(g);g.connect(mstr);o.start(t);o.stop(t+0.14);}

/* ---------- prakai ---------- */
var lineEl=document.getElementById('line'),tickEl=document.getElementById('tick');
var lastSay=-99,saidCount={},queueEnd=0,counting=-1,countBrokenT=-99;
function say(id,txt,pri){
 var now=T;
 if(!pri && now-lastSay<3.6)return false;
 if(saidCount[id]===undefined)saidCount[id]=-999;
 var cd=(pri?9:16);
 if(now-saidCount[id]<cd)return false;
 saidCount[id]=now;lastSay=now;queueEnd=now+6.5;
 lineEl.textContent=txt;lineEl.classList.add('on');
 return true;
}
function tickShout(){ if(T>queueEnd)lineEl.classList.remove('on');
 tickEl.textContent = counting>=0 ? ('… '+Math.min(20,Math.floor(counting))) : '';
}

/* ---------- helpers ---------- */
function poolR(){return baseR*fuel;}
function lightAt(x,y){var R=poolR();var d=Math.sqrt(d2(x,y,lamp.x,lamp.y));if(d>=R)return 0;var v=1-d/R;return Math.pow(v,1.5);}
function inWeed(x,y){for(var i=0;i<weeds.length;i++){var w=weeds[i];var wx=w.nx*W,wy=w.ny*H,wr=w.nr*Math.min(W,H);if(d2(x,y,wx,wy)<wr*wr)return true;}return false;}
function measureOpen(){var R=poolR(),ok=0,n=26;
 for(var i=0;i<n;i++){var a=i*2.399963,rr=R*Math.sqrt((i+0.5)/n)*0.92;
  var x=lamp.x+Math.cos(a)*rr,y=lamp.y+Math.sin(a)*rr;
  if(y<bankY-3 && !inWeed(x,y))ok++;}
 return ok/n;}

/* ---------- agents ---------- */
function spawn(sp){
 if(agents.length>130)return;
 var a=Math.random()*Math.PI*2,dist=Math.max(W,H)*(0.62+Math.random()*0.35);
 var x=lamp.x+Math.cos(a)*dist,y=lamp.y+Math.sin(a)*dist;
 if(y>bankY+120)y=bankY-Math.random()*80-40;
 var g={sp:sp,x:x,y:y,st:'fly',hd:Math.atan2(lamp.y-y,lamp.x-x)+(Math.random()-0.5)*1.2,
   tx:lamp.x,ty:lamp.y,ret:1+Math.random()*3,dep:0,tmr:0,wing:0,skate:Math.random()*6,ph:Math.random()*6.28,
   vx:0,vy:0,gone:false};
 if(sp==='cricket'){g.spd=72+Math.random()*26;g.turn=1.35;g.off=(Math.random()<0.5?-1:1)*0.22;g.size=1;}
 else if(sp==='bug'){g.spd=112+Math.random()*34;g.turn=2.1;g.off=(Math.random()<0.5?-1:1)*0.13;g.size=1.35;}
 else {g.spd=126+Math.random()*50;g.turn=3.4;g.off=(Math.random()<0.5?-1:1)*0.5;g.size=0.72;}
 agents.push(g);
}
function updAgents(dt){
 var R=poolR();
 for(var i=agents.length-1;i>=0;i--){
  var g=agents[i];
  g.ret-=dt;
  if(g.ret<=0){g.tx=lamp.x;g.ty=lamp.y;g.ret=2.2+Math.random()*4.2;}
  if(g.st==='fly'||g.st==='flee'){
   var want=Math.atan2(g.ty-g.y,g.tx-g.x);
   if(g.st==='flee'){ want=g.hd; g.tmr-=dt; if(g.tmr<=0){g.st='fly';} }
   else{
    want+=g.off*(1-Math.min(1,Math.sqrt(d2(g.x,g.y,g.tx,g.ty))/(R*3+1))*0.4);
    want+=(Math.random()-0.5)*(g.sp==='moth'?0.9:0.25);
    // moon washes the pull out
    if(amb>0.15 && Math.random()<amb*dt*2.4) want+=(Math.random()-0.5)*2.4;
   }
   var dif=((want-g.hd+Math.PI*3)%(Math.PI*2))-Math.PI;
   var mx=g.turn*dt;g.hd+=Math.max(-mx,Math.min(mx,dif));
   var sp=g.spd*(g.st==='flee'?1.8:1);
   g.x+=Math.cos(g.hd)*sp*dt;g.y+=Math.sin(g.hd)*sp*dt;
   g.ph+=dt*24;
   if(g.y>bankY-6 && Math.sin(g.hd)>0){g.hd=-g.hd;}
   // landing
   var L=lightAt(g.x,g.y);
   if(g.st==='fly' && L>0.34 && Math.sqrt(d2(g.x,g.y,lamp.x,lamp.y))<R*0.7 && g.y<bankY-8){
     var pr=(g.sp==='bug'?2.0:g.sp==='cricket'?1.5:0.75)*L*dt;
     if(Math.random()<pr)land(g);
   }
   // off field: prakai's lamp is over the left bund
   if(g.x<-90||g.x>W+140||g.y<-140||g.y>H+160){
     if(g.x<-90 && g.sp!=='moth' && Math.random()<0.5){her++;}
     agents.splice(i,1);continue;
   }
  } else if(g.st==='sit'){
   g.tmr-=dt;g.skate+=dt;
   g.x+=Math.cos(g.skate*1.7+g.ph)*10*dt;g.y+=Math.sin(g.skate*1.1)*7*dt;
   if(g.tmr<1.0){g.wing=1;}
   if(g.tmr<=0){takeoff(g);}
  } else if(g.st==='dive'){
   g.dep=Math.min(1,g.dep+dt*2.3);g.tmr-=dt;
   g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=0.9;g.vy*=0.9;
   if(g.dep>=1)g.st='swim';
  } else if(g.st==='swim'){
   g.tmr-=dt;g.ph+=dt*7;
   var wx=Math.cos(g.hd),wy=Math.sin(g.hd);
   g.hd+=(Math.random()-0.5)*2.2*dt;
   var tw=Math.atan2(lamp.y-g.y,lamp.x-g.x);
   var df=((tw-g.hd+Math.PI*3)%(Math.PI*2))-Math.PI;g.hd+=df*0.5*dt;
   var s=30+Math.sin(g.ph)*16;
   g.x+=wx*s*dt;g.y+=wy*s*dt;
   if(g.y>bankY-8)g.y=bankY-8;
   if(g.tmr<=0){g.st='rise';g.tmr=0.9;}
  } else if(g.st==='rise'){
   g.tmr-=dt;g.dep=Math.max(0,g.dep-dt*1.4);g.wing=1;
   if(g.tmr<=0)takeoff(g);
  }
 }
}
function land(g){
 ripples.push({x:g.x,y:g.y,r:2,max:g.sp==='bug'?46:26,a:1});
 if(g.sp==='bug'){g.st='dive';g.tmr=8.0;g.dep=0;g.vx=Math.cos(g.hd)*40;g.vy=Math.sin(g.hd)*40;plop();
   say('bugin',"Bug! That went in HARD — it's under the film now, it's swimming. You can't skim it.",false);}
 else if(g.sp==='cricket'){g.st='sit';g.tmr=9+Math.random()*2.4;g.wing=0;}
 else {g.st='sit';g.tmr=4+Math.random()*3;g.wing=0;}
}
function takeoff(g){g.st='fly';g.dep=0;g.wing=0;g.hd=Math.random()*6.28;g.ret=0.3;g.tmr=0;
 if(g.sp==='bug')say('lost8',"Eight seconds. That's all it gives you and you spent it looking at it.",false);}
function scatter(g,fx,fy,pw){
 if(g.st==='sit'||g.st==='swim'||g.st==='dive'||g.st==='rise'){g.st='flee';g.dep=0;g.wing=0;g.tmr=0.6+pw*0.5;}
 else g.st='flee',g.tmr=0.5+pw*0.4;
 g.hd=Math.atan2(fy,fx)+(Math.random()-0.5)*0.5;
}

/* ---------- net ---------- */
function enterWater(x,y,preSpeed){
 net.inWater=true;net.entryPending=true;net.entryT=T;net.entryMax=preSpeed;net.depth=0;
}
function resolveEntry(){
 net.entryPending=false;
 var sp=net.entryMax;
 var flat=1-Math.min(1,sp/620);
 net.flat=flat;
 var force=flat*flat;
 var maxR=52+force*185;
 waves.push({x:net.x,y:net.y,r:6,max:maxR,f:force,hit:{},id:Math.random()});
 if(flat>0.55){slapSnd(0.45+force*0.75);
   say('slap',"FLAT. You slapped it. That's a wave going out ahead of the rim — everything inside a foot of that is already gone.",true);}
 else {catchSnd(false);
   if(flat<0.22)say('clean',"Yes — edge first, that's it. It goes in like a knife and the rim gets there before the water does.",false);}
}
function sweepStep(dt){
 var dx=net.x-net.px,dy=net.y-net.py;
 var sp=Math.sqrt(dx*dx+dy*dy)/Math.max(dt,0.001);
 net.speed=net.speed*0.6+sp*0.4;
 if(net.entryPending){net.entryMax=Math.max(net.entryMax,net.speed);
   if(T-net.entryT>0.12)resolveEntry();}
 if(!net.inWater){net.depth=Math.max(0,net.depth-dt*3);return;}
 var target=Math.min(1,net.speed/430)*(1-net.flat*0.85);
 net.depth+=(target-net.depth)*Math.min(1,dt*6);
 if(sweepG){var g=Math.min(0.19,net.speed/2600);sweepG.gain.setTargetAtTime(g,A.currentTime,0.05);
   sweepF.frequency.setTargetAtTime(320+Math.min(1600,net.speed*1.6),A.currentTime,0.05);}
 // bow wave: slow shoving, fast catching
 var push=(1-Math.min(1,net.speed/620))*0.9;
 var hr=30;
 for(var i=agents.length-1;i>=0;i--){
  var g2=agents[i];
  var dd=segDist(g2.x,g2.y,net.px,net.py,net.x,net.y);
  var onSurface=(g2.st==='sit'||g2.st==='rise');
  var under=(g2.st==='swim'||g2.st==='dive');
  if(dd<hr+8 && (onSurface||under)){
    var ok = onSurface ? true : (net.depth>0.55);
    if(ok && net.speed>90){
      agents.splice(i,1);
      if(g2.sp==='bug'){tin.bug++;catchSnd(true);
        say('bugcatch',"HA! You went UNDER it! That's how you take a bug — under the film, not off it. Six baht, that one.",true);}
      else if(g2.sp==='cricket'){tin.cr++;catchSnd(false);
        say('cr',"One. That's one. I'm on "+her+".",false);}
      else {tin.moth++;catchSnd(false);
        say('moth',"That's a rice moth. Moths don't count, they don't sell, put it out of the net.",false);}
      continue;
    }
    if(!ok && under && net.speed>90){
      say('skim',"You're skimming! It's a foot down and swimming. Get the rim UNDER it — sweep harder, sweep deeper.",true);
    }
  }
  if(dd<hr+52 && push>0.25 && (onSurface||under)){
    var a=Math.atan2(g2.y-net.y,g2.x-net.x);
    g2.x+=Math.cos(a)*push*70*dt*3;g2.y+=Math.sin(a)*push*70*dt*3;
  }
 }
 if(Math.random()<dt*22 && net.speed>60)ripples.push({x:net.x,y:net.y,r:4,max:20+net.speed*0.05,a:0.5});
}
function segDist(px,py,x1,y1,x2,y2){
 var dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;
 if(l<0.0001)return Math.sqrt(d2(px,py,x1,y1));
 var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l));
 return Math.sqrt(d2(px,py,x1+dx*t,y1+dy*t));
}
function updWaves(dt){
 for(var i=waves.length-1;i>=0;i--){
  var w=waves[i];w.r+=330*dt;
  for(var j=0;j<agents.length;j++){
   var g=agents[j];var d=Math.sqrt(d2(g.x,g.y,w.x,w.y));
   if(d<w.r && !w.hit[j+'_'+Math.floor(g.ph*7)] && d>w.r-70){
     if(w.f>0.18){ w.hit[j+'_'+Math.floor(g.ph*7)]=1; scatter(g,g.x-w.x,g.y-w.y,w.f); }
   }
  }
  if(w.r>w.max)waves.splice(i,1);
 }
 for(var k=ripples.length-1;k>=0;k--){var r=ripples[k];r.r+=42*dt;r.a-=dt*1.1;if(r.a<=0||r.r>r.max)ripples.splice(k,1);}
}

/* ---------- draw ---------- */
function draw(){
 var R=poolR();
 // water base

 // moon wash
 if(amb>0.01){ctx.fillStyle='rgba(150,178,170,'+(amb*0.085).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
 // weed
 for(var i=0;i<weeds.length;i++){
  var w=weeds[i],wx=w.nx*W,wy=w.ny*H,wr=w.nr*Math.min(W,H);
  var L=lightAt(wx,wy)*0.9+amb*0.28;
  if(L<0.02)continue;

  ctx.strokeStyle='#0a0f0c';ctx.lineWidth=2.2;
  for(var k=0;k<16;k++){var a=k*0.7+w.s,rr=wr*(0.25+((k*37)%10)/13);
   var bx=wx+Math.cos(a)*rr,by=wy+Math.sin(a)*rr*0.7;
   ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a*2.1)*11,by-9-((k*13)%9));ctx.stroke();}
  ctx.globalAlpha=Math.min(0.55,L*0.55);ctx.strokeStyle='#7a4a1c';ctx.lineWidth=1;
  for(var k2=0;k2<9;k2++){var a2=k2*1.1+w.s,rr2=wr*0.5;
   var bx2=wx+Math.cos(a2)*rr2,by2=wy+Math.sin(a2)*rr2*0.7;
   ctx.beginPath();ctx.moveTo(bx2,by2);ctx.lineTo(bx2+Math.cos(a2*1.7)*9,by2-8);ctx.stroke();}
  ctx.restore();
 }
 // pool of reflected light
 ctx.save();ctx.globalCompositeOperation='lighter';
 var gp=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,R);
 gp.addColorStop(0,'rgba(255,242,207,0.62)');
 gp.addColorStop(0.13,'rgba(240,168,48,0.42)');
 gp.addColorStop(0.45,'rgba(240,168,48,0.17)');
 gp.addColorStop(0.8,'rgba(240,168,48,0.05)');
 gp.addColorStop(1,'rgba(240,168,48,0)');
 ctx.fillStyle=gp;ctx.beginPath();ctx.arc(lamp.x,lamp.y,R,0,6.2832);ctx.fill();
 // shimmer bands on the film
 ctx.globalAlpha=0.22*(1-amb*0.6);ctx.strokeStyle='#f0a830';ctx.lineWidth=1.4;
 for(var s=0;s<5;s++){
   var yy=lamp.y+Math.sin(T*0.7+s*1.3)*R*0.42;
   var wdt=R*Math.sqrt(Math.max(0,1-Math.pow((yy-lamp.y)/R,2)))*0.92;
   ctx.beginPath();
   for(var xx=-wdt;xx<wdt;xx+=8){ctx.lineTo(lamp.x+xx,yy+Math.sin(xx*0.06+T*2.1+s)*2.4);}
   ctx.stroke();
 }
 ctx.restore();
 // bank
 ctx.fillStyle='#08100d';ctx.fillRect(0,bankY,W,bankH);
 var gb=ctx.createLinearGradient(0,bankY-6,0,bankY+20);
 gb.addColorStop(0,'rgba(122,74,28,'+(0.10+lightAt(lamp.x,bankY)*0.5).toFixed(2)+')');
 gb.addColorStop(1,'rgba(122,74,28,0)');
 ctx.fillStyle=gb;ctx.fillRect(0,bankY-6,W,26);
 ctx.strokeStyle='rgba(10,16,13,1)';ctx.lineWidth=2;ctx.beginPath();
 for(var bx3=0;bx3<W;bx3+=7){ctx.lineTo(bx3,bankY+Math.sin(bx3*0.05)*2);}ctx.stroke();
 // ripples & waves
 ctx.save();
 for(var r1=0;r1<ripples.length;r1++){var rp=ripples[r1];
  var L2=lightAt(rp.x,rp.y)+amb*0.25;if(L2<0.03)continue;
  ctx.globalAlpha=Math.max(0,rp.a*0.7*L2);ctx.strokeStyle='#fff2cf';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.ellipse(rp.x,rp.y,rp.r,rp.r*0.55,0,0,6.2832);ctx.stroke();}
 for(var w1=0;w1<waves.length;w1++){var wv=waves[w1];
  var a3=Math.max(0,1-wv.r/wv.max);
  ctx.globalAlpha=a3*0.5*(0.25+wv.f);ctx.strokeStyle='#a8b0ac';ctx.lineWidth=1.6+wv.f*2.4;
  ctx.beginPath();ctx.ellipse(wv.x,wv.y,wv.r,wv.r*0.6,0,0,6.2832);ctx.stroke();
  ctx.globalAlpha=a3*0.28*wv.f;ctx.strokeStyle='#fff2cf';
  ctx.beginPath();ctx.ellipse(wv.x,wv.y,wv.r*0.72,wv.r*0.43,0,0,6.2832);ctx.stroke();}
 ctx.restore();
 // agents
 for(var i2=0;i2<agents.length;i2++)drawAgent(agents[i2]);
 // net
 drawNet();
 // lamp + pole
 drawLamp();
}
function drawAgent(g){
 var L=lightAt(g.x,g.y);
 var vis=Math.min(1,L*1.9+amb*0.5);
 if(g.st==='swim'||g.st==='dive')vis*=0.62;
 if(vis<0.025)return;
 ctx.save();ctx.globalAlpha=vis;ctx.translate(g.x,g.y);
 var flying=(g.st==='fly'||g.st==='flee');
 var hd=flying?g.hd:(g.ph*0.2);
 ctx.rotate(hd);
 var sz=g.size;
 // surface dimple / shadow
 if(!flying){
   ctx.save();ctx.globalAlpha=vis*0.5;ctx.strokeStyle='#fff2cf';ctx.lineWidth=1;
   ctx.beginPath();ctx.ellipse(0,0,10*sz,6*sz,0,0,6.2832);ctx.stroke();ctx.restore();
 } else {
   ctx.save();ctx.globalAlpha=vis*0.18;ctx.fillStyle='#000';
   ctx.beginPath();ctx.ellipse(2,4,9*sz,4*sz,0,0,6.2832);ctx.fill();ctx.restore();
 }
 if(g.sp==='moth'){
  var fl=0.6+0.4*Math.sin(g.ph*3);
  ctx.globalAlpha=vis*fl;
  ctx.fillStyle='#7a4a1c';
  ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,242,207,0.5)';
  ctx.beginPath();ctx.ellipse(-1,0,5,3.2,0,0,6.2832);ctx.fill();
 } else {
  var bl=(g.sp==='bug')?15*sz:11*sz, bw=(g.sp==='bug')?9*sz:5.4*sz;
  if(flying){ // wing blur
   ctx.globalAlpha=vis*0.3;ctx.fillStyle='#fff2cf';
   var flap=Math.sin(g.ph)*bw*1.5;
   ctx.beginPath();ctx.ellipse(-1,flap*0.4,bl*0.75,bw*1.5,0,0,6.2832);ctx.fill();
   ctx.globalAlpha=vis;
  }
  if(g.wing&&!flying){
   ctx.globalAlpha=vis*(0.25+0.35*Math.abs(Math.sin(T*26)));ctx.fillStyle='#fff2cf';
   ctx.beginPath();ctx.ellipse(-1,0,bl*0.8,bw*1.6,0,0,6.2832);ctx.fill();ctx.globalAlpha=vis;
  }
  ctx.fillStyle=(g.st==='swim'||g.st==='dive')?'#4b2f13':'#7a4a1c';
  ctx.beginPath();ctx.ellipse(0,0,bl*0.5,bw*0.5,0,0,6.2832);ctx.fill();
  ctx.strokeStyle='rgba(255,242,207,'+(0.75*vis).toFixed(2)+')';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.ellipse(-0.6,-0.8,bl*0.46,bw*0.42,0,3.5,5.9);ctx.stroke();
  if(g.sp==='cricket'){
   ctx.strokeStyle='#7a4a1c';ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(bl*0.4,0);ctx.lineTo(bl*0.72,-3.2);ctx.moveTo(bl*0.4,0);ctx.lineTo(bl*0.72,3.2);ctx.stroke();
  } else {
   ctx.strokeStyle='#7a4a1c';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.moveTo(-bl*0.2,bw*0.4);ctx.lineTo(-bl*0.55,bw*0.95);
   ctx.moveTo(-bl*0.2,-bw*0.4);ctx.lineTo(-bl*0.55,-bw*0.95);ctx.stroke();
  }
 }
 ctx.restore();
}
function drawNet(){
 if(net.x<-500)return;
 var L=lightAt(net.x,net.y)+amb*0.35;
 ctx.save();
 var vis=Math.min(1,0.22+L*1.6);
 ctx.globalAlpha=vis;
 // bow wave ahead of rim
 if(net.inWater&&net.speed>50){
  var a=Math.atan2(net.y-net.py,net.x-net.px);

  ctx.strokeStyle='#fff2cf';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(net.x+Math.cos(a)*16,net.y+Math.sin(a)*16,26,a-1.1,a+1.1);ctx.stroke();
  ctx.restore();
 }
 ctx.translate(net.x,net.y);
 var sq=net.inWater?(1-net.depth*0.45):1;
 ctx.strokeStyle='#a8b0ac';ctx.lineWidth=net.inWater?2.6:2;
 ctx.beginPath();ctx.ellipse(0,0,30,30*sq*(net.inWater?0.55:0.82),0,0,6.2832);ctx.stroke();
 ctx.globalAlpha=vis*0.35;ctx.strokeStyle='#a8b0ac';ctx.lineWidth=0.8;
 for(var i=0;i<5;i++){var t=(i-2)*11;
  ctx.beginPath();ctx.moveTo(t,-30*sq*0.5);ctx.lineTo(t*0.5,26);ctx.stroke();}
 ctx.globalAlpha=vis*0.75;ctx.strokeStyle='#7a4a1c';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(18,-14);ctx.lineTo(58,-48);ctx.stroke();

}

 if(over||dragging){ctx.strokeStyle='rgba(168,176,172,'+(dragging?0.5:0.28)+')';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(lamp.x-14,fy-10);ctx.lineTo(lamp.x-20,10);ctx.moveTo(lamp.x+14,fy-10);ctx.lineTo(lamp.x+8,10);ctx.stroke();}

/* ---------- input ---------- */
function pos(e){var t=(e.touches&&e.touches[0])||e;return{x:t.clientX,y:t.clientY};}
var moveSpeed=0,lastPt=null,lastPtT=0;
function onDown(e){
 initAudio();if(A&&A.state==='suspended')A.resume();
 var p=pos(e);
 if(Math.abs(p.x-lamp.x)<34 && p.y<lamp.y+12){dragging=true;e.preventDefault();return;}
 net.x=p.x;net.y=p.y;
 enterWater(p.x,p.y,moveSpeed);
 e.preventDefault();
}
function onMove(e){
 var p=pos(e),now=performance.now();
 if(lastPt){var dt=Math.max(8,now-lastPtT)/1000;
  moveSpeed=Math.sqrt(d2(p.x,p.y,lastPt.x,lastPt.y))/dt;}
 lastPt=p;lastPtT=now;
 if(dragging){
  var nx=Math.min(Math.max(p.x,34),W-34),ny=Math.min(Math.max(p.y+18,64),bankY-24);
  if(Math.abs(nx-lamp.x)+Math.abs(ny-lamp.y)>1.2){
   lamp.x=nx;lamp.y=ny;lamp.still=0;
   if(T-lamp.lastMove>1.4){lamp.moves++;lamp.lastMove=T;onLampMoved();}
   else lamp.lastMove=T;
  }
  e.preventDefault();return;
 }
 over=(Math.abs(p.x-lamp.x)<34 && p.y<lamp.y+12);
 net.x=p.x;net.y=p.y;
 if(net.x<-400){net.px=net.x;net.py=net.y;}
}
function onUp(){dragging=false;net.inWater=false;net.entryPending=false;
 if(sweepG&&A)sweepG.gain.setTargetAtTime(0,A.currentTime,0.06);}

cv.addEventListener('touchstart',onDown,{passive:false});

window.addEventListener('touchend',onUp);window.addEventListener('touchcancel',onUp);

function onLampMoved(){
 if(counting>=0){counting=-1;countBrokenT=T;
  say('broke',"You MOVED it. In the middle of my counting. Start again — and this time keep your hand off the pole.",true);return;}
 if(lamp.moves>=3 && T-countBrokenT>6){
  counting=0;
  say('count20',"You moved it AGAIN. You keep moving it. Nothing has had time to find it — leave the lamp where it is and count to twenty. I'll count for you.",true);
 } else {
  say('moved',"Every time you shift it, everything coming in is aiming at where it WAS. Put it out on open water, up away from the bank, and leave it.",false);
 }
}

/* ---------- loop ---------- */
var last=performance.now(),introStep=0,introT=0,moonSaid=0,ended=false;
lamp.x=window.innerWidth*0.5;lamp.y=window.innerHeight*0.42;
resize();baseR=Math.min(W,H)*0.30;
function loop(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 baseR=Math.min(W,H)*0.30;
 // fuel: the pool is not the size it was
 fuel=1-0.34*Math.min(1,T/430);
 // moon, on its own clock
 var gmin=20.3333*60+T*TS/60; // minutes since midnight-ish
 amb=Math.max(0,Math.min(1,(gmin-22*60)/45));
 lamp.still+=dt;
 openTimer-=dt;if(openTimer<=0){openF=measureOpen();openTimer=0.2;}
 if(hissG&&A)hissG.gain.setTargetAtTime(0.014*fuel,A.currentTime,0.5);
 if(bed&&A)bed.gain.setTargetAtTime(0.05+amb*0.012,A.currentTime,1);
 // counting
 if(counting>=0){counting+=dt;
  if(counting>=20){counting=-1;
   say('twenty',"Twenty. Now LOOK at the water — they're coming in, that's what twenty seconds of not touching it buys you.",true);}}
 // arrivals
 var stillF=0.10+0.90*Math.min(1,lamp.still/20);
 var rate=1.05*stillF*Math.pow(openF,1.9)*Math.pow(fuel,1.5)*Math.max(0,1-amb*1.75);
