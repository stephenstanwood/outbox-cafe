  <meta name="outbox-spec-era" content="A Sunday afternoon in late May 1974, on the oilcloth-covered folding table of a third birthday party in a patio in Colonia Portales, Mexico City. The streamers are crepe paper and have started to run in the heat. The piñata is already broken. The one thing on the table everyone is waiting for is a gelatina de mosaico turned out of a fluted aluminium ring mould that morning: cubes of strawberry, lime, pineapple and grape gelatin set inside a milky, cinnamon-sweet condensed-milk gelatin. It has been in the refrigerator since seven and is now out on a glass cake stand in full sun, with a knife beside it.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: an endless slicing of one mosaic gelatin, seen from the side at table height, filling the viewport. Each click, tap or press of SPACE draws a knife down through the ring and lifts away a slice, so the cut face turns toward you. That face is a freshly generated cross-section, a new scatter of translucent coloured cubes caught at whatever angle and depth the cut happened to pass through them, suspended in opaque milk-white. So no two faces are ever the same, and the ring never gets smaller. Between cuts, the whole mould wobbles on real spring physics wherever the cursor nudges it. Light from the upper left passes through the coloured cubes and throws soft stained-glass patches of colour onto the white oilcloth below.">
  <meta name="outbox-spec-subject" content="The pure visual joy of a mosaic gelatin being cut at a party: the way a cube sliced corner-first shows a diamond, a cube sliced along its face shows a square, and a cube just grazed shows a sliver. The way cubes that sank while setting crowd the bottom of the ring, and ones that floated sit high and lonely. The way the milk layer goes faintly blue-white where it is thin against a cube. The way every slice leans over, shivers and settles on the stand. Nothing is explained. It is a cross-section generator that happens to be dessert.">
  <meta name="outbox-spec-tone" content="Wordless and GIDDY. The register lives entirely in the wobble and the colour. The mould jiggles a little too much and a little too long, and it overshoots and giggles back. The slices flop over with a soft, cheerful slap. The light is bright, hot early-afternoon sun, and a confetti of coloured light patches dances across the tablecloth every time the gelatin shivers. It should feel like a toddler's party at the exact moment the grown-up picks up the knife: bouncy, bright, faintly ridiculous and entirely delighted. It is not reverent, not slow, not meditative.">
  <meta name="outbox-spec-length" content="medium">

  l.frequency.value=hz*6;lg.gain.value=pp*.08;l.connect(lg);lg.connect(o.frequency);env(g,tt,Math.min(.35,amp)*(n?.55:1),.015,.28);

// interaction
function nudge(mx,my,pvx,pvy){const R=gw*.32;let imp=0;
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const k=j*COLS+i,p=mapBody(i/(COLS-1),j/(ROWS-1)),d=Math.hypot(p[0]-mx,p[1]-my);

   if(d>1){dx[k]+=(p[0]-mx)/d*f*1.2;dy[k]+=(p[1]-my)/d*f*1.2;}imp+=Math.hypot(pvx,pvy)*f;}}

let pdown=null,lp=null;
cv.addEventListener('pointerdown',e=>{ac();const n=performance.now();pdown={x:e.clientX,y:e.clientY,t:n};lp={x:e.clientX,y:e.clientY,t:n};});

// knife & slices
const knife={t:-1,th:.1,smear:0,spawned:false,touched:false};let slices=[];
function cut(){if(knife.t>=0&&knife.t<1.3)return;knife.t=0;knife.th=.05+Math.random()*.11;knife.spawned=false;knife.touched=false;}
function spawnSlice(){slices.push({face:face,th:knife.th,t:0,x:cx,y:plateY,rot:0,sc:1,sq:0,sqv:0,landed:false,lean:(Math.random()-.5)*.16,leaving:false,lv:0});
 zc+=knife.th;ensureField();face=section(zc);squelch(knife.th);knife.smear=1;served++;try{localStorage.setItem('palomaSlices',served);}catch(e){}
 for(let j=0;j<ROWS-1;j++)for(let i=0;i<COLS;i++){const k=j*COLS+i,f=1-j/(ROWS-1);vy[k]+=gw*(.8+Math.random()*.6)*f;vx[k]+=(Math.random()-.5)*gw*.9*f;}
 setTimeout(()=>boing(.3),60);const live=slices.filter(s=>!s.leaving);if(live.length>12)live[0].leaving=true;}
function pileTarget(i){const pw=gw*PS,st=Math.min(pw*.5,Math.max(6,(W*.78-pw)/11));return[W-10-pw/2-i*st,tableY+(H-tableY)*.7-(i%3)*3];}
function updateSlices(dt){const live=slices.filter(s=>!s.leaving);
 for(const s of slices){if(s.leaving){s.lv+=dt*500;s.x+=s.lv*dt;s.rot*=.97;}
  else{const tg=pileTarget(live.indexOf(s));
   if(!s.landed){s.t+=dt/.62;const e=Math.min(1,s.t),ee=e*e*(3-2*e);s.x=cx+(tg[0]-cx)*ee;s.y=plateY+(tg[1]-plateY)*ee-Math.sin(Math.PI*ee)*gh*.8;
    s.rot=s.lean*ee+Math.sin(Math.PI*ee)*1.0;s.sc=1+(PS-1)*ee;
    if(s.t>=1){s.landed=true;s.sqv+=9;slap();boing(.12);for(let k=0;k<NN-COLS;k++)vy[k]-=gw*.25;}}
   else{s.x+=(tg[0]-s.x)*Math.min(1,dt*6);s.y+=(tg[1]-s.y)*Math.min(1,dt*6);s.sc=PS;}}
  s.sqv+=(-240*s.sq-5*s.sqv)*dt;s.sq+=s.sqv*dt;}
 slices=slices.filter(s=>!(s.leaving&&s.x>W+gw));}
function drawSlice(s){ctx.save();ctx.translate(s.x,s.y);
 if(s.landed){ctx.fillStyle='rgba(120,80,40,.13)';ctx.beginPath();ctx.ellipse(gw*s.sc*.05,2,gw*s.sc*.5,gw*s.sc*.05,0,0,6.283);ctx.fill();}
 ctx.rotate(s.rot);ctx.scale(s.sc*(1+s.sq*.6),s.sc*(1-s.sq));ctx.transform(1,0,-s.sq*.4,1,0,0);
 ctx.save();ctx.translate(s.th*gw*.9,-s.th*gw*.5);facePath(restLocal);ctx.fillStyle='#e6d6b8';ctx.fill();ctx.restore();

function drawKnife(t){const top=plateY-gh,L=gh*1.05,bw=gw*.07;let kx=cx+gw*.3,ky=top-gh*.1+Math.sin(t*3)*5,ang=.35+Math.sin(t*2.2)*.05;
 if(knife.t>=0){const k=knife.t;if(k<1){const e=k*k*(3-2*k);kx=cx+gw*(.3-.18*e);ky=top-gh*.1+(plateY-2-top+gh*.1)*e;ang=.35*(1-e)+.04*e;}
  else{const e=Math.min(1,(k-1)/.6);kx=cx+gw*(.12+.18*e);ky=plateY-2-(plateY-2-top+gh*.1)*e;ang=.04+.31*e;}}
 ctx.save();ctx.translate(kx,ky);ctx.rotate(ang);
 const g=ctx.createLinearGradient(0,0,bw,0);g.addColorStop(0,'#fdfdf8');g.addColorStop(.5,'#cdd2d4');g.addColorStop(1,'#f1f1ea');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(bw,-L*.35,bw,-L);ctx.lineTo(0,-L);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-L);ctx.stroke();
 if(knife.smear>0){ctx.globalAlpha=knife.smear*.7;[[0,.12,.06],[1,.3,.04],[3,.2,.035],[2,.45,.03]].forEach(m=>{ctx.fillStyle=FL[m[0]].f;ctx.beginPath();ctx.ellipse(bw*.35,-L*m[1],bw*.25,L*m[2],0,0,6.283);ctx.fill();});ctx.globalAlpha=1;}
 ctx.fillStyle='#e2344a';ctx.fillRect(-bw*.1,-L-L*.42,bw*1.2,L*.42);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,-L-L*.4,bw*.25,L*.38);
 ctx.fillStyle='#f6efe0';[.12,.3].forEach(y=>{ctx.beginPath();ctx.arc(bw*.5,-L-L*y,bw*.09,0,6.283);ctx.fill();});ctx.restore();}
function drawCandle(t){const k=4,p=mapBody(.5,0),ch=gh*.44,tilt=Math.max(-.3,Math.min(.3,(dx[k]-dx[k+COLS])*.02));
 const d=new Date(),frac=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400,vis=Math.max(ch*.1,ch*(1-.88*frac));

 ctx.fillStyle=g;ctx.fillText('3',0,0);ctx.lineWidth=1;ctx.strokeStyle='rgba(200,60,80,.45)';ctx.strokeText('3',0,0);ctx.restore();
 const lean=Math.max(-.9,Math.min(.9,-tilt-vx[k]*.0012-dx[k]*.01+Math.sin(t*23)*.04+Math.sin(t*7.3)*.05)),wy=-vis;
 ctx.strokeStyle='#5a3a2a';ctx.lineWidth=Math.max(1.2,ch*.025);ctx.beginPath();ctx.moveTo(0,wy+2);ctx.quadraticCurveTo(0,wy-ch*.05,lean*ch*.05,wy-ch*.09);ctx.stroke();
 ctx.translate(lean*ch*.05,wy-ch*.08);ctx.rotate(lean);
 const fh=ch*.34*(1+Math.sin(t*17)*.06),fw=ch*.09,gl=ctx.createRadialGradient(0,-fh*.4,0,0,-fh*.4,ch*.7);gl.addColorStop(0,'rgba(255,225,150,.5)');gl.addColorStop(1,'rgba(255,225,150,0)');
 ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,-fh*.4,ch*.7,0,6.283);ctx.fill();
 const fg=ctx.createLinearGradient(0,0,0,-fh);fg.addColorStop(0,'#7aa6ff');fg.addColorStop(.18,'#fff8d0');fg.addColorStop(.6,'#ffc040');fg.addColorStop(1,'rgba(255,110,40,.7)');
 ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(fw,0,fw*.9,-fh*.45,0,-fh);ctx.bezierCurveTo(-fw*.9,-fh*.45,-fw,0,0,0);ctx.fill();ctx.restore();}

for(let k=0;k<NN-COLS;k++){vy[k]=-gw*.9*(1-Math.floor(k/COLS)/ROWS);vx[k]=gw*.3;}
