  <meta name="outbox-spec-era" content="Mid-March 1966, right now — a quarter past nine on a cold clear morning in the weighing room of a public grain elevator on a branch line in Kiowa County, Colorado, where the first truck of the morning has just come off the scale and the moisture tester is reading high. The page is not a look-back, not a lament, not a vanished-prairie memory: there are eleven trucks expected before noon, the railroad has promised four hopper cars for Friday and delivered two, and the grader who does the official work is in Lamar until Tuesday.">

  <meta name="outbox-spec-subject" content="The flat arithmetic of grading and docking a truckload of wheat at the scale, which is almost entirely a moisture-and-test-weight problem and has nothing whatsoever to do with how the grain looks. That the whole transaction is three numbers taken in about ninety seconds — gross weight, test weight, moisture — and every dollar in the settlement comes out of those three and nothing else. That TEST WEIGHT IS NOT A QUALITY, IT IS A PACKING DENSITY: pounds per Winchester bushel, measured by filling a quart kettle from a fixed drop height and striking it off with three zigzag strokes of a stick, and the drop height and the striking are not fussiness — a kettle filled from six inches higher packs measurably tighter and reads nearly half a pound heavier, which is a grade. That 60 pounds is the standard for hard red winter and 58 is the line between No. 1 and No. 2, so half a pound of packing error moves a whole load across a grade line and costs real money in either direction, and this is why the striking stick is chained to the bench. That the bushel is legally a WEIGHT and not a volume anywhere money changes hands — 60 pounds is a bushel whether it fills the kettle or not — so the test weight figure never divides into the settlement and every farmer who assumes it does is wrong, and the reason nobody corrects them is that it takes four minutes. That MOISTURE IS THE ENTIRE FIGHT: wheat is bought and stored at 13.5 percent and above that it will not keep, because grain respires and mold grows on a curve that is not linear at all — 13.5 is indefinite in a cool bin, 15 is a matter of weeks, 17 will heat and go out of condition in a hot bin in days, and the smell of a bin going out is the one thing in the business nobody has to be taught twice. That the shrink arithmetic is honest and is not a penalty: drying 1000 bushels from 15.0 to 13.5 removes real water and leaves fewer real pounds, so the dock is computed as the actual weight of water removed plus a handling factor, and a house that docks by a flat table instead of by the arithmetic is either giving grain away or stealing it, always in the same direction. That the moisture tester is a capacitance meter reading dielectric constant and it is reading the WATER, not the wheat, which is why it must be temperature-corrected — a sample straight off a truck that sat in the sun reads high by real tenths and a frozen sample reads low, and the correction chart is on the wall and gets used about half the time. That the sample is the whole risk: a load is graded off about a quart taken with a probe from five places in a truck holding 400 bushels, and grain STRATIFIES — the fines, the shrunken kernels and the dockage migrate to the center of the spout stream and pack down the middle of the load, so a probe taken only at the corners reads a different grade than the load actually is, and the difference is worth more than anybody's honesty. That DOCKAGE is anything the sieves take out that isn't wheat — chaff, weed seed, dirt, cheat — and it is deducted by weight before anything else is computed, so it comes off the top of the gross and every subsequent percentage is figured on the remainder. That the No. 1 sieve for hard red winter has 0.064 by 3/8 inch slots and a kernel that goes through it is shrunken wheat, which is a different deduction from dockage entirely. That protein is not tested at this house because the equipment is $1,900 and the branch line does not pay a protein premium, so a load of 14-percent milling wheat leaves here at the same price as a load of 11, which everybody knows and nobody can do anything about. That SMUT AND GARLIC ARE INSTANT: a load carrying garlicky bulblets is graded Garlicky regardless of everything else and goes into a separate bin or it contaminates 30,000 bushels, and the test is putting your nose in the pan. That the official grade certificate can only be issued by a licensed inspector and the man here is not one, so every number written on the scale ticket is 'unofficial' in the exact legal sense and binds nobody, and it is what the settlement is paid on. And the flat arithmetic on the bench: two hopper cars promised against four needed, bin 3 at 14.8 and rising, a house that holds 180,000 bushels and is at 141,000 this morning, and eleven trucks before noon.">
  <meta name="outbox-spec-tone" content="The rapid, correcting, figure-first voice of Lurleen Abshagen-Pratt, 43, who has weighed, probed and ticketed at this house for nine years and who is talking across the scale bench to the driver while she works, and who cannot say a number without saying what it is a number OF. She does not narrate, does not reflect, does not address the visitor at all — she is telling a man in a hat what his load did. She revises her own figure three separate times inside the page and says flatly each time what she had wrong: once because the sample came off a truck bed that had been in the sun since seven and she had not corrected for temperature, once because she probed four places instead of five and the fifth came back a full point different, once because she read the dockage percentage against the gross instead of against the net. She is specifically and repeatedly aggrieved about exactly one thing — that bin 3 is sitting at 14.8 and has been climbing for six days, and the two hopper cars that came Friday will not empty it, and she has told the manager twice — and she says it three times, once with a date. She is proud of exactly one thing and says it twice: that nothing has gone out of condition in this house since she took the bench, and she gives the month and the year. She calls the driver 'you' throughout and by name exactly once. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT a craftsman-sage, NOT a woman-in-a-man's-trade arc, NOT charmed by herself, NOT the competent-tradesperson-saying-every-figure-twice voice, and NOT aware of being read.">

  <meta name="outbox-spec-wildcard" content="There is a clause in the paragraph that describes a load of milo. There has been no milo through this house since 1961 — the clause is in the tree because the description was built off the previous weigher's ticket wording and nobody edited it out. The engine treats it exactly like every other clause: it has a priority rank, it takes damage, it degrades through its stages, it drops out at the same widths as its neighbours, and it comes back when the frame widens. Lurleen never mentions it, never corrects it, and it is never flagged, marked, greyed or distinguished in any way. It is in the same position in the tree on every visit.">

var IDX = {}, i, k;
for(i=0;i<CL.length;i++) IDX[CL[i][0]] = i;
var KIDS = {};
for(i=0;i<CL.length;i++){
  var par = CL[i][1];
  if(par){ (KIDS[par] = KIDS[par] || []).push(CL[i][0]); }
}

/* ---------- persistence, forward only ---------- */
var KEY = 'kiowa.scale.bench.v1';
var ST = {d:{}, mn:9999, sq:0, ch:0, wd:0};
try{
  var raw = localStorage.getItem(KEY);
  if(raw){
    var o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      ST.d = o.d || {}; ST.mn = o.mn || 9999; ST.sq = o.sq || 0;
      ST.ch = o.ch || 0; ST.wd = o.wd || 0;
    }
  }
}catch(e){}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
}
function dmgOf(id){ return ST.d[id] || 0; }

/* ---------- text assembly ---------- */
function autoShort(t){
  var s = t.replace(/\{[^}]*\}/g,'').replace(/\s+/g,' ').trim();
  if(s.length <= 26) return t;
  var cut = s.slice(0, Math.max(18, Math.floor(s.length*0.55)));
  var sp = cut.lastIndexOf(' ');
  if(sp > 10) cut = cut.slice(0, sp);
  cut = cut.replace(/[,;:]$/,'');
  return cut + '.';
}
function rawText(rec){
  var d = dmgOf(rec[0]);
  if(d > 7){ return rec[4] ? rec[4] : autoShort(rec[3]); }
  return rec[3];
}
var TOK = /\{(\w+)(?:\|([^}]*))?\}/g;
function expand(rec, stage){
  var t = rawText(rec);
  t = t.replace(TOK, function(all, id, pre){
    var s = fmtNum(id, stage);
    if(s === null) return '';
    var out = (pre || '') + s;
    if(RED[id]) out = '\u0011' + out + '\u0012';
    return out;
  });
  t = t.replace(/ {2,}/g,' ')
       .replace(/ +([.,;:!?])/g,'$1')
       .replace(/,\s*([.;:])/g,'$1')
       .replace(/\.{2,}/g,'.')
       .replace(/^[\s.,;:]+/,'')
       .replace(/\s+$/,'');
  t = t.replace(/\b(DOCKAGE|UNOFFICIAL)\b/g, '\u0011$1\u0012');
  if(!/[A-Za-z]/.test(t)) return '';
  return t;
}
function plainLen(s){
  var n = 0;
  for(var j=0;j<s.length;j++){ var c = s.charCodeAt(j); if(c!==0x11 && c!==0x12) n++; }
  return n;
}
function wordsIn(s){
  var t = s.replace(/[\u0011\u0012]/g,'').trim();
  if(!t) return 0;
  return t.split(/\s+/).length;
}

/* ---------- inclusion / knapsack against the tree ---------- */
function buildInclusion(stage, budget, record){
  var alive = [], texts = {}, inc = {};
  for(var j=0;j<CL.length;j++){
    var id = CL[j][0];
    if(dmgOf(id) >= 12) continue;
    alive.push(id);
  }
  var aset = {};
  for(j=0;j<alive.length;j++) aset[alive[j]] = 1;

  function eligible(id){
    if(!aset[id]) return false;
    var p = CL[IDX[id]][1];
    if(!p) return true;
    if(!eligible(p)) return false;
    if(dmgOf(p) > 3) return false;  /* damaged parents come back stripped */
    return true;
  }
  for(j=0;j<alive.length;j++){
    if(eligible(alive[j])) inc[alive[j]] = 1;
  }
  for(j=0;j<CL.length;j++){
    var cid = CL[j][0];
    if(inc[cid]){
      texts[cid] = expand(CL[j], stage);
      if(!texts[cid]) delete inc[cid];
    }
  }
  function total(){
    var t = 0, n = 0;
    for(var q=0;q<CL.length;q++){ var id2 = CL[q][0]; if(inc[id2]){ t += plainLen(texts[id2]); n++; } }
    return t + Math.max(0, n-1);
  }
  function dropTree(id, out){
    if(!inc[id]) return;
    delete inc[id];
    out.push(id);
    var kk = KIDS[id];
    if(kk) for(var q=0;q<kk.length;q++) dropTree(kk[q], out);
  }
  var order = [];
  for(j=0;j<CL.length;j++){ if(inc[CL[j][0]]) order.push(CL[j]); }
  order.sort(function(a,b){ return (b[2]-a[2]) || (IDX[b[0]]-IDX[a[0]]); });

  var crushed = [];
  var t2 = total();
  for(j=0;j<order.length && t2 > budget;j++){
    var cand = order[j][0];
    if(!inc[cand]) continue;
    dropTree(cand, crushed);
    t2 = total();
  }
  return {inc:inc, texts:texts, crushed:crushed, total:t2, eligible:eligible};
}

/* ---------- rendering ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hsh(seed, n){
  var x = (seed*73856093) ^ (n*19349663);
  x = x ^ (x >>> 13);
  x = (x * 1274126177) >>> 0;
  return x;
}
function lvlFor(d){
  if(d === 0) return 0;
  if(d <= 2) return 1;
  if(d <= 4) return 2;
  if(d <= 7) return 3;
  return 4;
}
function clauseHTML(id, s){
  var d = dmgOf(id), lv = lvlFor(d);
  var drop = 0;
  if(d >= 5 && d <= 7) drop = 15;
  else if(d >= 8) drop = 6;
  var seed = IDX[id] + 7;
  var out = '', red = false, buf = '', n = 0;
  for(var j=0;j<s.length;j++){
    var ch = s[j];
    if(ch === '\u0011'){ if(buf){ out += red ? '<b>'+esc(buf)+'</b>' : esc(buf); buf=''; } red = true; continue; }
    if(ch === '\u0012'){ if(buf){ out += red ? '<b>'+esc(buf)+'</b>' : esc(buf); buf=''; } red = false; continue; }
    if(drop && /[A-Za-z]/.test(ch) && (hsh(seed, n) % drop) === 0) ch = ' ';
    buf += ch; n++;
  }
  if(buf) out += red ? '<b>'+esc(buf)+'</b>' : esc(buf);
  return '<span class="c d'+lv+'">'+out+'</span>';
}

/* ---------- frame geometry ---------- */
var frame = document.getElementById('frame');
var para  = document.getElementById('para');
var tick  = document.getElementById('ticket');
var outL  = document.getElementById('outL');
var outR  = document.getElementById('outR');
var eL    = document.getElementById('edgeL');
var eR    = document.getElementById('edgeR');
var meas  = document.getElementById('meas');

var L = 0, R = 0, cw = 8, lh = 20, maxCols = 80, minCols = 14;
var prevInc = null, initialised = false, lastStage = -1;

function setFont(){
  var vw = window.innerWidth;
  var fs = Math.max(11, Math.min(17, vw/58));
  document.body.style.fontSize = fs + 'px';
  para.style.fontSize = fs + 'px';
  tick.style.fontSize = Math.max(9, fs*0.82) + 'px';
  meas.style.font = getComputedStyle(para).font;
  cw = meas.getBoundingClientRect().width / 40;
  if(!cw || cw < 3) cw = fs*0.6;
  lh = fs * 1.52;
}
function vw(){ return window.innerWidth; }
function frameW(){ return Math.max(cw*minCols, vw() - L - R); }
function cols(){ return Math.max(minCols, Math.round((frameW() - 20) / cw)); }
function rows(){
  var h = window.innerHeight - (window.innerHeight*0.052) - (window.innerHeight*0.034) - (parseFloat(tick.style.fontSize)||12)*2.4;
  return Math.max(3, Math.floor(h / lh));
}
function fullCap(){ return maxCols * rows() * 0.84; }
function budgetFor(c){
  var span = Math.max(1, maxCols - minCols);
  var rr = Math.max(0, Math.min(1, (c - minCols) / span));
  var cap = fullCap();
  var b = Math.round(22 + Math.pow(rr, 1.75) * (cap - 22));
  return Math.max(20, Math.min(b, Math.round(c * rows() * 0.86)));
}
function ratio(){
  var span = Math.max(1, maxCols - minCols);
  return Math.max(0, Math.min(1, (cols() - minCols) / span));
}
function stageFor(r){
  if(r >= 0.80) return 0;
  if(r >= 0.62) return 1;
  if(r >= 0.46) return 2;
  if(r >= 0.26) return 3;
  return 4;
}

function ticketText(c){
  var tno = 1183 + ST.sq;
  if(c >= 64) return 'TICKET NO. 41-' + tno + ' \u2014 WORDS LOST: ' + ST.wd;
  if(c >= 44) return 'TICKET 41-' + tno + ' \u2014 LOST ' + ST.wd;
  if(c >= 30) return '41-' + tno + ' \u00b7 ' + ST.wd;
  return '';
}

function render(isSqueeze){
  var c = cols();
  var st = stageFor(ratio());
  var res = buildInclusion(st, budgetFor(c), true);

  /* honest vertical fit: the frame does not scroll */
  var order = [];
  for(var j=0;j<CL.length;j++){ if(res.inc[CL[j][0]]) order.push(CL[j]); }

  function paint(){
    var parts = [];
    for(var q=0;q<CL.length;q++){
      var id = CL[q][0];
      if(res.inc[id]) parts.push(clauseHTML(id, res.texts[id]));
    }
    para.innerHTML = parts.join(' ');
  }
  paint();
  var guard = 0;
  var byRank = order.slice().sort(function(a,b){ return (b[2]-a[2]) || (IDX[b[0]]-IDX[a[0]]); });
  var gi = 0;
  while(para.scrollHeight > para.clientHeight + 1 && gi < byRank.length && guard < 90){
    var vid = byRank[gi][0]; gi++; guard++;
    if(!res.inc[vid]) continue;
    (function drop(id){
      if(!res.inc[id]) return;
      delete res.inc[id];
      res.crushed.push(id);
      var kk = KIDS[id];
      if(kk) for(var z=0;z<kk.length;z++) drop(kk[z]);
    })(vid);
    paint();
  }

  /* damage: forward only, one per crush event */
  if(initialised && isSqueeze && prevInc){
    var newly = [];
    for(var q2=0;q2<CL.length;q2++){
      var id2 = CL[q2][0];
      if(prevInc[id2] && !res.inc[id2]) newly.push(id2);
    }
    if(newly.length){
      for(var q3=0;q3<newly.length;q3++){
        var nid = newly[q3];
        ST.d[nid] = (ST.d[nid]||0) + 1;
        var txt = res.texts[nid] || '';
        ST.wd += wordsIn(txt);
        ST.ch += plainLen(txt);
      }
      save();
    }
  }
  prevInc = {};
  for(var q4=0;q4<CL.length;q4++){ if(res.inc[CL[q4][0]]) prevInc[CL[q4][0]] = 1; }

  tick.textContent = ticketText(c);

  if(st !== lastStage){ lastStage = st; if(AU.on) AU.relay(); }

  frame.style.left = L + 'px';
  frame.style.right = R + 'px';
  outL.style.left = '0px'; outL.style.width = Math.max(0,L) + 'px';
  outR.style.right = '0px'; outR.style.width = Math.max(0,R) + 'px';
  eL.style.left = Math.max(0, L-5) + 'px';
  eR.style.left = Math.max(0, vw()-R-6) + 'px';
}

/* what the current damage state still permits */
function allowedMaxCols(){
  var res = buildInclusion(0, 1e9, false);
  var need = res.total;
  for(var c = minCols; c <= maxCols; c++){
    if(budgetFor(c) >= need) return c;
  }
  return maxCols;
}

function clampEdges(){
  var W = vw();
  var minW = cw * minCols + 20;
  if(L < 0) L = 0;
  if(R < 0) R = 0;
  if(W - L - R < minW){
    var over = minW - (W - L - R);
    L = Math.max(0, L - over/2);
    R = Math.max(0, R - over/2);
    if(W - L - R < minW){ L = 0; R = Math.max(0, W - minW); }
  }
}

function setColsSymmetric(target){
  var W = vw();
  target = Math.max(minCols, Math.min(maxCols, target));
  var want = target * cw + 20;
  var side = Math.max(0, (W - want) / 2);
  L = side; R = side;
  clampEdges();
}

function measureMax(){
  maxCols = Math.max(minCols + 6, Math.floor((vw() - 20) / cw));
  minCols = Math.max(10, Math.min(18, Math.floor(maxCols * 0.22)));
}

/* ---------- interaction: the frame is the only control ---------- */
var dragging = null, dragStart = 0, dragBase = 0, movedCols = 0;

function beginDrag(which, x){
  AU.start();
  dragging = which; dragStart = x;
  dragBase = (which === 'L') ? L : R;
  movedCols = 0;
}
function moveDrag(x){
  if(!dragging) return;
  var before = cols();
  var d = x - dragStart;
  if(dragging === 'L') L = dragBase + d;
  else R = dragBase - d;
  clampEdges();
  var after = cols();
  if(after !== before){
    var squeezing = after < before;
    if(squeezing){ ST.sq += 1; if(after < ST.mn) ST.mn = after; save(); }
    render(true);
    AU.beam(squeezing);
    AU.stream(ratio());
  }
}
function endDrag(){
  if(!dragging) return;
  dragging = null;
  AU.settle();
  AU.kettle();
  save();
}

eL.addEventListener('pointerdown', function(ev){ ev.preventDefault(); try{eL.setPointerCapture(ev.pointerId);}catch(e){} beginDrag('L', ev.clientX); });
eR.addEventListener('pointerdown', function(ev){ ev.preventDefault(); try{eR.setPointerCapture(ev.pointerId);}catch(e){} beginDrag('R', ev.clientX); });
window.addEventListener('pointermove', function(ev){ if(dragging){ ev.preventDefault(); moveDrag(ev.clientX); } }, {passive:false});
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', function(ev){
  var step = ev.shiftKey ? 10 : 1;
  if(ev.key === 'ArrowLeft'){
    ev.preventDefault(); AU.start();
    var b = cols();
    setColsSymmetric(b - step);
    var a = cols();
    if(a < b){ ST.sq += (b - a); if(a < ST.mn) ST.mn = a; }
    render(true); AU.beam(true); AU.stream(ratio()); save();
  } else if(ev.key === 'ArrowRight'){
    ev.preventDefault(); AU.start();
    setColsSymmetric(cols() + step);
    render(false); AU.beam(false); AU.stream(ratio());
  } else if(ev.key === 'Home'){
    ev.preventDefault(); AU.start();
    setColsSymmetric(allowedMaxCols());
    render(false); AU.settle(); AU.stream(ratio());
  }
});

window.addEventListener('resize', function(){
  setFont(); measureMax(); clampEdges(); render(true);
});

/* ---------- web audio: the room ---------- */
var AU = (function(){
  var ctx = null, master = null, noiseBuf = null, on = false;
  var streamGain = null, streamFilt = null, grainTimer = null, curRatio = 0.9;
  var elevTimer = null, stoveTimer = null, truckOsc = null, truckGain = null;

  function mkNoise(){
    var n = ctx.sampleRate * 2, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function src(){ var s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  function burst(t, dur, gain, f, q, type){
    var s = src(); s.playbackRate.value = 0.8 + Math.random()*0.5;
    var bp = ctx.createBiquadFilter(); bp.type = type||'bandpass'; bp.frequency.value = f; bp.Q.value = q||1;
    var g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t+dur+0.02);
  }
  function tone(t, f, dur, gain, type, f2){
    var o = ctx.createOscillator(); o.type = type||'sine'; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    var g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
  }

  function startRoom(){
    /* grain running through the spout */
    var s = src();
    streamFilt = ctx.createBiquadFilter(); streamFilt.type='bandpass';
    streamFilt.frequency.value = 900; streamFilt.Q.value = 0.65;
    streamGain = ctx.createGain(); streamGain.gain.value = 0.03;
    s.connect(streamFilt); streamFilt.connect(streamGain); streamGain.connect(master); s.start();

    grainTimer = setInterval(function(){
      var rate = 4 + 34*curRatio;
      var n = rate * 0.12;
      var t0 = ctx.currentTime;
      for(var i=0;i<n;i++){
        if(Math.random() > 0.85) continue;
        burst(t0 + Math.random()*0.12, 0.014, 0.012 + 0.014*curRatio, 1400 + Math.random()*2200, 3);
      }
    }, 120);

    /* leg elevator, two floors up, belt and cups, slightly out of time */
    var ph = 0;
    elevTimer = setInterval(function(){
      var t = ctx.currentTime + 0.01;
      tone(t, 66, 0.11, 0.024, 'sine', 54);
      burst(t+0.012, 0.05, 0.008, 520, 1.4);
      ph++;
      if(ph % 7 === 0) burst(t+0.16, 0.04, 0.006, 900, 2);
    }, 407);

    /* coal stove on its own clock */
    (function stove(){
      stoveTimer = setTimeout(function(){
        var t = ctx.currentTime + 0.01;
        burst(t, 0.035, 0.03, 1600 + Math.random()*900, 6);
        tone(t, 300 + Math.random()*180, 0.05, 0.012, 'triangle');
        stove();
      }, 2300 + Math.random()*6800);
    })();

    /* truck idling outside, then shut off */
    truckOsc = ctx.createOscillator(); truckOsc.type='sawtooth'; truckOsc.frequency.value = 47;
    var lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 165;
    truckGain = ctx.createGain(); truckGain.gain.value = 0.045;
    var lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value = 5.7;
    var lg = ctx.createGain(); lg.gain.value = 0.018;
    lfo.connect(lg); lg.connect(truckGain.gain);
    truckOsc.connect(lp); lp.connect(truckGain); truckGain.connect(master);
    truckOsc.start(); lfo.start();
    setTimeout(function(){
      if(!ctx) return;
      var t = ctx.currentTime;
      truckOsc.frequency.setValueAtTime(47, t);
      truckOsc.frequency.exponentialRampToValueAtTime(11, t+1.5);
      truckGain.gain.setValueAtTime(truckGain.gain.value, t);
      truckGain.gain.exponentialRampToValueAtTime(0.0005, t+1.7);
    }, 33000);

    /* wall telephone in the office: two rings, then answered */
    setTimeout(function(){ ringTwice(); }, 61000);
  }
  function ringTwice(){
    if(!ctx) return;
    var t0 = ctx.currentTime;
    for(var r=0;r<2;r++){
      var base = t0 + r*2.4;
      for(var i=0;i<34;i++){
        var t = base + i*0.05;
        tone(t, 1040, 0.035, 0.010, 'sine');
        tone(t, 1330, 0.035, 0.008, 'sine');
      }
    }
    setTimeout(function(){ if(ctx) burst(ctx.currentTime+0.01, 0.04, 0.02, 700, 4); }, 5100);
  }

  return {
    get on(){ return on; },
    start:function(){
      if(on) return;
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.62; master.connect(ctx.destination);
        noiseBuf = mkNoise();
        on = true;
        startRoom();
      }catch(e){ on = false; }
    },
    stream:function(r){ curRatio = Math.max(0.03, r); if(on && streamGain){
      var t = ctx.currentTime;
      streamGain.gain.setTargetAtTime(0.006 + 0.052*curRatio, t, 0.08);
      streamFilt.frequency.setTargetAtTime(560 + 900*curRatio, t, 0.1);
    }},
    beam:function(down){
      if(!on) return;
      var t = ctx.currentTime + 0.005;
      burst(t, 0.022, 0.05, down ? 2600 : 2200, 9);
      tone(t, down ? 980 : 860, 0.03, 0.02, 'square');
    },
    settle:function(){
      if(!on) return;
      var t = ctx.currentTime + 0.02, gap = 0.075;
      for(var i=0;i<5;i++){
        var tt = t + gap*i + i*i*0.028;
        burst(tt, 0.02, 0.038 - i*0.006, 2500, 9);
      }
      tone(t+0.42, 232, 0.55, 0.016, 'sine');
      tone(t+0.42, 349, 0.42, 0.010, 'sine');
    },
    kettle:function(){
      if(!on) return;
      var t = ctx.currentTime + 0.05;
      for(var i=0;i<3;i++){
        var tt = t + i*0.105;
        burst(tt, 0.055, 0.045, 620 + i*140, 1.1, 'bandpass');
        burst(tt+0.012, 0.045, 0.02, 2400, 2.5);
        tone(tt, 168 + i*22, 0.06, 0.012, 'triangle', 120);
      }
    },
    relay:function(){
      if(!on) return;
      var t = ctx.currentTime + 0.01;
      burst(t, 0.02, 0.05, 1800, 8);
      burst(t+0.038, 0.025, 0.04, 1400, 7);
      tone(t+0.07, 1180, 0.22, 0.012, 'sine', 1090);
      tone(t+0.09, 1240, 0.16, 0.007, 'sine', 1160);
    }
  };
})();

/* ---------- boot ---------- */
setFont();
measureMax();
L = Math.round(vw()*0.055); R = L;
clampEdges();
render(false);
initialised = true;
lastStage = stageFor(ratio());
render(false);

try{
  console.log('%cfirst truck off the scale 9:14. bed sat in the sun since seven. correct for temperature.',
              'color:#b5301f;font-family:monospace');
  console.log('narrowest reached: ' + (ST.mn === 9999 ? 'full' : ST.mn) +
              '  \u00b7 squeezes: ' + ST.sq + '  \u00b7 characters gone: ' + ST.ch);
}catch(e){}

})();
</script>
