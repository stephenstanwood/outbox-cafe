  <meta name="outbox-spec-era" content="February 1971, right now — twenty past six on a hard clear morning in a four-booth café on the east shore of Lake Winnebago at Stockbridge, Wisconsin, ninth day of a sixteen-day sturgeon spearing season, with something like nine hundred shanties out on the ice and eleven inches under most of them. The placemats for the breakfast rush are already down on the tables and the first three are already sat on. Not a look-back at anything and not a lament for anything: the registration station opens at eight, the shanty-removal deadline is printed on the mat in bigger type than anything else, and the coffee is going through.">
  <meta name="outbox-spec-format" content="THE PAGE IS ONE PAPER PLACEMAT, LIFE-SIZE, SEEN STRAIGHT DOWN ON A FORMICA TABLE, AND IT GETS DIRTIER THE LONGER YOU SIT AT IT. The whole viewport, edge to edge, is a single 10×14 inch pulp placemat printed in one flat ink by the job shop in Chilton: a scalloped border, the café's name across the top, a ring of twenty-two boxed advertisements around three edges (feed mill, upholsterer, welding, bulk propane, a bank, a mutual insurance agency), and in the middle four panels — MINIMUM ICE, a hand-drawn map of the lake's east shore with the registration stations numbered on it, a kids' maze titled GET THE SHANTY OFF THE ICE, and the café's own printed notice about the removal deadline and about what the kitchen will and will not do with your fish. There is no header, no menu bar, no scroll, no title overlay, no page chrome of any kind — it is a placemat on a table and nothing else. The visitor's whole vocabulary is what a person at a table has: a heavy diner mug that can be picked up and set down anywhere and leaves a real ring, an already-greasy paper napkin, a stub of red crayon, and the MINIMUM ICE panel, which is not printed art but a working chart you can actually operate with your finger.">
  <meta name="outbox-spec-subject" content="The plain load-bearing arithmetic of lake ice and the plain mechanics of putting a spear through a sturgeon in twelve feet of water — that ice strength goes as the SQUARE of thickness and not as thickness, so the safe load on 8 inches is four times the safe load on 4 and not twice it, which is the single fact that makes the whole chart look wrong to people; that the working rule is P = A·h² with P in tons, h in inches, and A a coefficient that is not a constant but a statement about what kind of ice you are standing on; that BLACK ICE (clear, frozen from the lake up, no entrained air) carries roughly twice what WHITE ICE carries at the same thickness, white ice being snow that got wet and re-froze full of bubbles, so a man reading eleven inches on his auger has not learned anything until he looks at the plug he pulled out and sees how much of it is white — count the white half as half, add it up, and use that number; that ice weakens with temperature and not just with thaw, so the same eleven inches is measurably softer at 30°F than at 5°F and the afternoon of a bright day is the worst hour of any day regardless of air temperature; that load must be SPREAD and not stacked, that vehicles are parked far apart and never in a row, that a parked truck is worse than a moving one because a standing load lets the sheet deflect into a bowl and go on deflecting, and that this is why you crack a window and unlatch a door; that a moving vehicle makes a real flexural wave under the sheet and there is a genuine critical speed near which the wave and the truck reinforce each other and break ice that would have held a parked truck all week, so you drive slowly and you never stop on somebody's fresh crack; that thickness is not uniform anywhere and current is invisible from above — river mouths, spring holes, the shipping channel and any place with a slick of open black water a hundred feet off are thinned FROM UNDERNEATH, so the honest measurement is the one you drill every couple of hundred feet on the way out and not the one you took at the landing; that pressure ridges are where the sheet has thrust against itself, are jumbled and thick at the ridge and thin and rotten in the trough behind it, and are crossed at a right angle at a walk or not at all. Then the spearing, which is a completely different set of numbers: that the hole is cut about four feet by six with a saw and the shanty set over it and the door shut, and the entire point of the shut door is that a dark box over a hole turns the lake into a lit aquarium — your eye adapts, the sun comes down through eleven inches of ice, and you can see bottom in twelve to fourteen feet of Winnebago water on a bright day and see nothing at all on a grey one, which is why nine hundred shanties sit still on a bright morning and half of them go home at noon; that water clarity, not fish numbers, decides the season, and a green algal lake in a warm February is a blank season for everybody; that the decoy is not bait — a sturgeon does not eat it and has never eaten it — it is a moving object on a string that occupies the fish's attention for the two or three seconds it takes to get a spear over the right part of it; that the spear is DROPPED, not thrown, because a five-to-seven pound head with five or six barbed tines and a hundred feet of rope on it accelerates fine under gravity and a thrown spear yaws; that water refraction puts the fish where it is not, so you aim at what you see only when it is directly under you and you learn to hold off when it is not; that the target is behind the head and forward of the middle, because the tail end is muscle and a fish speared in the tail leaves with your spear; that the rope is tied off inside the shanty before anything else happens and that a hundred-pound fish takes the slack out of it faster than a person can decide anything; that the legal minimum is 45 inches and that measuring a fish through a hole in the ice before you commit is exactly as hard as it sounds; that you tag it and get it to the registration station the same day. And the flat arithmetic printed at the foot of the ice panel: eleven inches, call two of it white, that is ten working inches, that is a bit under six tons on Gold's numbers with a safety factor already inside it, a loaded three-quarter-ton with a shanty on the trailer is around four, and the deadline for every shanty off this lake is noon on the last day of the season, tagged with your name and your county, no extensions, ask the warden and not me.">
  <meta name="outbox-spec-tone" content="A WRITTEN voice, not a spoken one — placemat copy composed by Delphina Bostwick-Reuter, forty-six, who has run this café for nine years, wrote every word of the four center panels herself on a legal pad in January, took it to the job shop in Chilton and paid for four thousand of them. Warm, brisk, proud of the mat, faintly bossy, complete sentences with real punctuation and a lot of semicolons because she likes them. She writes in the first person plural about the café and in the first person singular whenever she has an opinion, and she has several. She is specific about numbers and honest about which ones she got from the county agent and which ones she worked out herself with a pencil; she prints the ice arithmetic twice, once as a chart and once written out in a sentence, because she says people do not read charts. She is openly and practically annoyed about three things and returns to each of them exactly once: shanties left out past noon on the last day (she names no one but says she can see four of them from the window every March), people who ask the kitchen to cook a sturgeon (the answer is no, with a reason, and the reason is the fryer), and a mimeographed 'ice safety' sheet going around the bait shops that gives one thickness figure with no mention of white ice at all. She is pleased once, briefly and without ceremony, that the maze was drawn by her nephew Roland who is eleven and did it in one go. She apologises in a parenthesis for the small type in the ice panel and says the job shop charged by the column inch. Never wry, never deadpan, never folksy-sage, never wistful, never scolding for the pleasure of it — a competent woman who paid for four thousand placemats and used the space.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. Placemat stock is cheap groundwood pulp in a warm off-cream (#efe5cf) with real fiber flecks and a slightly browner, softer band along the scalloped edges where the sheet was guillotined (#ded1b4); it is a ONE-INK job and that ink is a cold flat job-shop blue (#1d4b7a), printed unevenly — dense and solid in the heavy rules and the deadline notice, visibly starved and grey-blue in the halftone map and in the fine type of the ice panel (#6b8bab), with genuine ink squash at the edge of every large character and one advertiser box printed a hair out of register. Exactly one chip of grease-and-coffee brown (#8a6a3c) is held strictly for what has happened to the mat at the table: mug rings, the translucent grease blot spreading from under the napkin, a thumb smudge at the lower left, and nothing else. Red crayon (#c4342a) exists only as marks the visitor makes and never appears in the printing. Flat, hard, high-contrast, no glow, no bloom, no soft focus, no gradients other than the honest ink starvation and the honest translucency where grease has soaked the pulp — one sheet of cheap paper on formica under a ceiling fixture at twenty past six in the morning.">
  <meta name="outbox-spec-wildcard" content="One box in the advertiser ring — third from the left along the bottom edge — is for a business that has been shut since 1968: a hatchery and bait dealer, with a four-digit telephone number and no exchange name, set in a different face from every other box and printed noticeably out of register with the rest of the sheet, about a sixteenth of an inch low and left. It reads perfectly, it accepts mug rings and crayon like anything else, and it is in the same place on every visit. Delphina mentions it once in the kitchen notice panel, in a subordinate clause — that they paid a year in advance and she is not taking it out until the year is up — and nothing anywhere on the mat ever refers to it again.">
  <meta name="outbox-spec-forbidden" content="NO ice-as-metaphor for anything — not surface-and-depth, not what-holds-you-up, not thin-ice-as-risk-in-life, not the-cold-months-of-a-marriage; it is P = A·h² and half credit for white ice, and it has nothing to teach anybody. NO sturgeon awe: absolutely no 'dinosaur fish', no prehistoric-survivor lyricism, no hundred-year-old-fish reverence, no describing the animal as ancient, patient, primeval, or a leviathan, and no wonder of any kind at the sight of one under the ice. NO conservation sermon and no cruelty-of-the-hunt framing in either direction — the minimum length and the tag are printed as rules, flatly, once. NO food writing whatsoever: nothing about how anything tastes, smells, smokes, fries or looks on a plate; the fryer appears only as the reason the kitchen says no. NO danger-porn: no dread about going through, no foreshadowed drowning, no cautionary anecdote, no 'every year somebody' — the chart is arithmetic and is presented as arithmetic. NO hushed, meditative, solitary-man-in-a-dark-shanty register, NO ice-fishing-as-contemplation, NO silence-of-the-lake lyricism, NO ambient or ASMR framing. NO Upper-Midwest accent comedy, no dialect spelling, no 'ya', no 'dontcha know', no Fargo winking, no charming-small-town-characters sketch, no aren't-they-hardy condescension. NO camp or ironic affection for placemat kitsch, diner ephemera, or one-color job printing — Delphina paid for these and means every word on them. NO nostalgia, NO wistfulness, NO 'the lake isn't what it was / nobody spears anymore / the café closed in 1989' decline narrative — the registration station opens at eight. NO winter-melancholy, NO grey-February loneliness, NO frozen-lake-as-emptiness, NO Scandinavian hush. NO sensuous material writing about ice, water or light beyond thickness, clarity, temperature, deflection and how far down you can see. NO cryptic-SCP, liminal, uncanny or ominous dread about the out-of-register advertiser box, the shut hatchery, or anything under the ice — nothing is wrong. NO fast, blunt, shouted, competitive expert-correcting-you-one-instruction-at-a-time voice; this is printed copy and must read as written, in full sentences. NO archival / museum / cabinet / drawer / found-object / relic framing of the placemat — four thousand of them were delivered in January and this one is on a table under somebody's elbow this minute. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is twenty past six in the morning with the lights on and the urn going. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#2a2622;overflow:hidden;overscroll-behavior:none}

<!--
  Delphina Bostwick-Reuter, proprietor. Copy set by hand on a legal pad, 11 Jan.
  Job shop in Chilton: one ink, 4,000 sheets, 10 x 14. They charged by the column inch,
  which is why the ice panel is small, and I said so on the mat.
  Roland drew the maze. Eleven years old. One go, no eraser.
-->

<script>
(function(){
"use strict";

/* ============================================================
   MAT ARTWORK — one flat blue ink, printed unevenly
   ============================================================ */
const SVG = document.getElementById('matsvg');
const NS = 'http://www.w3.org/2000/svg';
const W = 1000, H = 1400;

function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function add(p,t,a,txt){const e=el(t,a,txt);p.appendChild(e);return e;}

const defs = add(SVG,'defs',{});
// fiber flecks
let fl='';
let seed=20261;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
for(let i=0;i<900;i++){
  const x=rnd()*W,y=rnd()*H,l=0.6+rnd()*3.4,a=rnd()*Math.PI;
  const o=(0.05+rnd()*0.13).toFixed(3);
  const c = rnd()<0.25 ? '#c9b899' : (rnd()<0.4?'#a9927a':'#d8cbb0');
  fl+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+Math.cos(a)*l).toFixed(1)}" y2="${(y+Math.sin(a)*l).toFixed(1)}" stroke="${c}" stroke-width="${(0.5+rnd()).toFixed(2)}" opacity="${o}"/>`;
}
const bg = add(SVG,'g',{});
bg.innerHTML =
  `<rect x="0" y="0" width="${W}" height="${H}" fill="#efe5cf"/>`+
  `<rect x="0" y="0" width="${W}" height="26" fill="#ded1b4" opacity=".85"/>`+
  `<rect x="0" y="${H-26}" width="${W}" height="26" fill="#ded1b4" opacity=".85"/>`+
  `<rect x="0" y="0" width="22" height="${H}" fill="#ded1b4" opacity=".8"/>`+
  `<rect x="${W-22}" y="0" width="22" height="${H}" fill="#ded1b4" opacity=".8"/>`+
  fl;

// scalloped border
function scallops(){
  const g=add(SVG,'g',{});
  const r=9, step=r*2;
  let d='';
  // top
  for(let x=14;x<W-14;x+=step){ d+=`M${x} 16 A${r} ${r} 0 0 0 ${x+step} 16 `; }
  for(let x=14;x<W-14;x+=step){ d+=`M${x} ${H-16} A${r} ${r} 0 0 1 ${x+step} ${H-16} `; }
  for(let y=14;y<H-14;y+=step){ d+=`M16 ${y} A${r} ${r} 0 0 1 16 ${y+step} `; }
  for(let y=14;y<H-14;y+=step){ d+=`M${W-16} ${y} A${r} ${r} 0 0 0 ${W-16} ${y+step} `; }
  add(g,'path',{d:d,stroke:'#1d4b7a','stroke-width':2.2,fill:'none',opacity:'.92'});
  add(g,'rect',{x:26,y:26,width:W-52,height:H-52,stroke:'#1d4b7a','stroke-width':1.1,fill:'none',opacity:'.8'});
  add(g,'rect',{x:31,y:31,width:W-62,height:H-62,stroke:'#6b8bab','stroke-width':0.7,fill:'none'});
}
scallops();

const main = add(SVG,'g',{});

/* ---- head ---- */
add(main,'text',{x:500,y:88,'text-anchor':'middle','font-family':'Georgia, "Times New Roman", serif','font-size':52,'letter-spacing':'2','font-weight':'bold',fill:'#1d4b7a'},'BOSTWICK\u2019S CAF\u00C9');
add(main,'text',{x:500,y:112,'text-anchor':'middle','font-family':'Georgia, serif','font-size':16,'letter-spacing':'5.5',fill:'#1d4b7a'},'STOCKBRIDGE, WISCONSIN \u2014 EAST SHORE');
add(main,'text',{x:500,y:132,'text-anchor':'middle','font-family':'Georgia, serif','font-size':13,'letter-spacing':'1.5',fill:'#6b8bab'},'Open 5:00 a.m. through the spearing season \u00b7 Breakfast all day \u00b7 Telephone 4-2231');
add(main,'line',{x1:80,y1:146,x2:920,y2:146,stroke:'#1d4b7a','stroke-width':3});
add(main,'line',{x1:80,y1:151,x2:920,y2:151,stroke:'#1d4b7a','stroke-width':1});

/* ============================================================
   ADVERTISER RING — 22 boxes, three edges
   ============================================================ */
const ADS_L = [
 ['CHILTON FEED &amp; MILL','Ground &amp; mixed rations','Custom grinding daily','Phone 6-4180'],
 ['REUTER UPHOLSTERY','Davenports \u00b7 Chairs','Truck seats recovered','Hilbert \u00b7 Phone 2-9044'],
 ['STOCKBRIDGE WELDING','Portable rig \u00b7 We come out','Trailer hitches made up','Phone 4-2117'],
 ['H. J. BRAATZ, BULK PROPANE','Shanty bottles filled','200 gal. and up','Phone 4-2860'],
 ['LAKESHORE STATE BANK','Chilton \u00b7 Brillion \u00b7 New Holstein','Savings 4-1/2%','Member F.D.I.C.'],
 ['CALUMET MUTUAL INSURANCE','Farm \u00b7 Auto \u00b7 Shanty floater','E. Vandehey, agent','Phone 6-3312'],
 ['SCHOMISCH IMPLEMENT','Augers \u00b7 Chain \u00b7 Saw blades','Sharpening while you wait','Highway 55']
];
const ADS_R = [
 ['QUINNEY SINCLAIR','Gas \u00b7 Oil \u00b7 Tire chains','Open 5 a.m. in season','Phone 4-2005'],
 ['BOEHM &amp; SON HARDWARE','Ice chisels \u00b7 Spud bars','Rope, 3/8 manila, by the foot','Chilton'],
 ['ARNOLD DIETZEN, D.V.M.','Large animal practice','Day or night calls','Phone 6-2244'],
 ['LAKE VIEW LOCKER PLANT','Custom cutting &amp; wrapping','Sharp freezing \u00b7 Rental boxes','New Holstein'],
 ['WM. TENPAS PLUMBING','Water systems \u00b7 Pumps','Frozen lines thawed','Phone 4-2790'],
 ['MENASHA SPORT SHOP','Spear heads 5 to 7 lb.','Decoys, made up or blank','Phone 3-6621'],
 ['CALUMET CO. AGRIC. AGENT','Bulletins free on request','Courthouse, Chilton','Phone 6-1201']
];
const ADS_B = [
 ['THIEL BROS. TRUCKING','Gravel \u00b7 Stone \u00b7 Snow work','Phone 4-2440'],
 ['STOCKBRIDGE LOCKER','Ice by the block or crushed','Phone 4-2313'],
 ['__HATCHERY__'],
 ['C. WOLLERSHEIM &amp; CO.','Lumber \u00b7 Shanty runners','Phone 6-2919'],
 ['PIGEON RIVER DAIRY','Bottled milk \u00b7 Route service','Phone 6-4477'],
 ['KOEPSELL RADIO &amp; TV','Antenna work \u00b7 Repairs','Chilton \u00b7 Phone 6-3901'],
 ['CALUMET SHOE REBUILD','Felt pacs relined','Chilton'],
 ['BROOKS BARBER SHOP','Two chairs \u00b7 No waiting','Stockbridge']
];

function adBox(x,y,w,h,lines,opts){
  opts=opts||{};
  const g=add(main,'g',{});
  const ink = opts.starve ? '#3f6b95' : '#1d4b7a';
  add(g,'rect',{x:x,y:y,width:w,height:h,stroke:ink,'stroke-width':opts.thick?2:1.3,fill:'none'});
  if(!opts.plain) add(g,'rect',{x:x+3,y:y+3,width:w-6,height:h-6,stroke:'#6b8bab','stroke-width':0.6,fill:'none'});
  const n=lines.length;
  const top = y + h/2 - (n*11)/2 + 10;
  lines.forEach(function(t,i){
    const isTitle = i===0;
    add(g,'text',{
      x:x+w/2, y:top+i*11.6,'text-anchor':'middle',
      'font-family':'Georgia, serif',
      'font-size': isTitle?10.5:8.4,
      'font-weight': isTitle?'bold':'normal',
      'letter-spacing': isTitle?'0.6':'0.2',
      fill: isTitle?ink:'#6b8bab'
    }, t.replace(/&amp;/g,'&'));
  });
  return g;
}

// left column
for(let i=0;i<7;i++) adBox(38, 168+i*128, 128, 112, ADS_L[i]);
// right column
for(let i=0;i<7;i++) adBox(834, 168+i*128, 128, 112, ADS_R[i]);
// bottom row (8 boxes)
const bw=112, bgap=4, bx0=38;
for(let i=0;i<8;i++){
  const bx = bx0 + i*(bw+bgap);
  if(ADS_B[i][0]==='__HATCHERY__'){
    /* WILDCARD: out of register, sixteenth low and left, different face */
    const g=add(main,'g',{transform:'translate(-6.2, 6.2)'});
    add(g,'rect',{x:bx,y:1174,width:bw,height:112,stroke:'#2a5c8c','stroke-width':1.6,fill:'none'});
    add(g,'rect',{x:bx+4,y:1178,width:bw-8,height:104,stroke:'#6b8bab','stroke-width':0.5,fill:'none'});

/* ============================================================
   MAZE — generated with a single unique solution, drawn childlike
   ============================================================ */
(function(){
  const cols=27, rows=11;
  const cell=20.6, ox=CX0+22, oy=896;
  // recursive backtracker => perfect maze => exactly one route
  const V=new Array(cols*rows).fill(false);
  const wallsH=[], wallsV=[];
  for(let i=0;i<cols*rows;i++){wallsH.push(true);wallsV.push(true);} // H: wall above cell, V: wall left of cell
  const idx=(c,r)=>r*cols+c;
  const stack=[[0,Math.floor(rows/2)]];
  V[idx(0,Math.floor(rows/2))]=true;
  let mseed=88117;
  function mr(){mseed=(mseed*1664525+1013904223)&0xffffffff;return (mseed>>>8)/16777216;}
  while(stack.length){
    const [c,r]=stack[stack.length-1];
    const nb=[];
    if(r>0&&!V[idx(c,r-1)])nb.push([c,r-1,'N']);
    if(r<rows-1&&!V[idx(c,r+1)])nb.push([c,r+1,'S']);
    if(c>0&&!V[idx(c-1,r)])nb.push([c-1,r,'W']);
    if(c<cols-1&&!V[idx(c+1,r)])nb.push([c+1,r,'E']);
    if(!nb.length){stack.pop();continue;}
    const n=nb[Math.floor(mr()*nb.length)];
    if(n[2]==='N')wallsH[idx(c,r)]=false;
    if(n[2]==='S')wallsH[idx(n[0],n[1])]=false;
    if(n[2]==='W')wallsV[idx(c,r)]=false;
    if(n[2]==='E')wallsV[idx(n[0],n[1])]=false;
    V[idx(n[0],n[1])]=true;
    stack.push([n[0],n[1]]);
  }
  const jitter=()=>(mr()-0.5)*1.7;
  let d='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=ox+c*cell, y=oy+r*cell;
    if(wallsH[idx(c,r)]) d+=`M${(x+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} L${(x+cell+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} `;
    if(wallsV[idx(c,r)]) d+=`M${(x+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} L${(x+jitter()).toFixed(1)} ${(y+cell+jitter()).toFixed(1)} `;
  }
  // bottom + right border
  for(let c=0;c<cols;c++){const x=ox+c*cell,y=oy+rows*cell;d+=`M${(x+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} L${(x+cell+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} `;}
  for(let r=0;r<rows;r++){const x=ox+cols*cell,y=oy+r*cell; if(r!==Math.floor(rows/2)-2) d+=`M${(x+jitter()).toFixed(1)} ${(y+jitter()).toFixed(1)} L${(x+jitter()).toFixed(1)} ${(y+cell+jitter()).toFixed(1)} `;}
  add(MAZEG,'path',{d:d,stroke:'#1d4b7a','stroke-width':1.7,fill:'none','stroke-linecap':'round'});
  const sy=oy+Math.floor(rows/2)*cell+cell/2;
  const ey=oy+(Math.floor(rows/2)-2)*cell+cell/2;
  add(MAZEG,'text',{x:ox-8,y:sy+3,'text-anchor':'end','font-family':'Georgia, serif','font-size':10,fill:'#1d4b7a'},'START');
  add(MAZEG,'text',{x:ox+cols*cell+8,y:ey+3,'font-family':'Georgia, serif','font-size':10,fill:'#1d4b7a'},'SHORE');
  // little shanty at start, truck at end
  add(MAZEG,'path',{d:`M${ox-46} ${sy+8} l0 -11 l7 -7 l7 7 l0 11 z`,stroke:'#1d4b7a','stroke-width':1.4,fill:'none'});
  add(MAZEG,'path',{d:`M${ox+cols*cell+46} ${ey+7} l0 -8 l6 0 l3 -6 l9 0 l0 14 z`,stroke:'#1d4b7a','stroke-width':1.4,fill:'none'});
  add(MAZEG,'circle',{cx:ox+cols*cell+50,cy:ey+9,r:2.6,stroke:'#1d4b7a','stroke-width':1.2,fill:'none'});
  add(MAZEG,'circle',{cx:ox+cols*cell+60,cy:ey+9,r:2.6,stroke:'#1d4b7a','stroke-width':1.2,fill:'none'});
  add(MAZEG,'text',{x:500,y:oy+rows*cell+22,'text-anchor':'middle','font-family':'Georgia, serif','font-size':9,fill:'#6b8bab'},'Every shanty is tagged with the owner\u2019s name and county. Yours goes off the ice at noon on the last day \u2014 see the notice below.');
})();

const A_at = f => {
  // A falls as ice warms. Cold hard ice ~4.0, near melting ~2.2
  const t=Math.max(0,Math.min(34,f));
  return 4.0 - (t/34)*1.8;
};
function effInches(){ const w=thickness*whiteFrac; const b=thickness-w; return b + 0.5*w; }
function tons(){ const h=effInches(); return A_at(tempF)*h*h/1000*1000/1000*1000; }
function safeTons(){ const h=effInches(); return A_at(tempF)*h*h/100*100/100*100/100; }
// keep it honest & simple: P = A h^2 with P in tons when A ~ 3.5 and h in inches => /100
function P(){ return A_at(tempF)*Math.pow(effInches(),2)/100; }

// physics-ish: deflection bowl
function bowlAt(x){
  // returns downward deflection in px at chart x
  let d=0;
  const cap = P();
  placed.forEach(function(pl){
    if(pl.through) return;
    const halfw = 34 + pl.tons*10;
    const dx = Math.abs(x-pl.x);
    if(dx>halfw*2.6) return;
    const g = Math.exp(-(dx*dx)/(2*Math.pow(halfw,2)));
    d += g * pl.depth;
  });
  return d;
}

function totalLocalLoad(x){
  let s=0;
  placed.forEach(function(pl){
    if(pl.through) return;
    const halfw = 40 + pl.tons*12;
    const dx=Math.abs(x-pl.x);
    s += pl.tons*Math.exp(-(dx*dx)/(2*Math.pow(halfw,2)));
  });
  return s;
}

function stepPhysics(dt){
  const cap = P();
  let changed=false;
  placed.forEach(function(pl){
    if(pl.through) return;
    const local = totalLocalLoad(pl.x);          // shared bowls compound
    const ratio = local/Math.max(0.05,cap);
    let target;
    if(ratio<0.35) target = ratio*4;
    else if(ratio<1) target = 1.4 + (ratio-0.35)*16;
    else target = 100;
    pl.depth += (target-pl.depth)*Math.min(1,dt*1.6);
    if(ratio>=1){
      pl.sinkTime = (pl.sinkTime||0)+dt;
      if(pl.sinkTime>1.1 && !pl.through){
        pl.through=true; pl.depth=0;
        wentThrough++; saveCounts(); updateBug();
        sfx.plunge();
        changed=true;
      }
    } else { pl.sinkTime=0; }
  });
  placed = placed.filter(p=>!p.through);
  return changed;
}

/* ---- pointer interaction on SVG ---- */
function svgPt(evt){
  const r=SVG.getBoundingClientRect();
  const cx = (evt.touches?evt.touches[0].clientX:evt.clientX);
  const cy = (evt.touches?evt.touches[0].clientY:evt.clientY);
  return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H, cx:cx, cy:cy };
}

let drag=null;
let idc=0;

SVG.addEventListener('pointerdown', function(e){
  const p=svgPt(e);
  // tools take priority elsewhere; check ice widgets
  if(p.x>=SCX-18&&p.x<=SCX+SCW+18&&p.y>=SCY-28&&p.y<=SCY+22){ drag={t:'thick'}; }
  else if(p.x>=PLX-14&&p.x<=PLX+PLW+14&&p.y>=PLY-4&&p.y<=PLY+PLH+4){ drag={t:'white'}; }
  else if(Math.hypot(p.x-TKX,p.y-TKY)<TKR+14){ drag={t:'temp'}; }
  else {
    // placed load?
    let hit=null;
    for(let i=placed.length-1;i>=0;i--){
      const pl=placed[i];
      if(Math.abs(p.x-pl.x)<30 && Math.abs(p.y-(ICEY+bowlAt(pl.x)))<30){ hit=pl; break; }
    }
    if(hit){ drag={t:'move',pl:hit}; }
    else {
      // tray?
      const ty=PY+236;
      for(let i=0;i<LOADS.length;i++){
        const cx = ICEX0+52+i*((ICEX1-ICEX0-90)/4);
        if(Math.abs(p.x-cx)<40 && p.y>ty-32 && p.y<ty+22){
          const pl={i:i,x:p.x,depth:0,tons:LOADS[i].tons,through:false,id:++idc};
          placed.push(pl); drag={t:'move',pl:pl}; sfx.tick(); break;
        }
      }
    }
  }
  if(drag){ e.preventDefault(); SVG.setPointerCapture(e.pointerId); onDrag(e); }
},{passive:false});

function onDrag(e){
  if(!drag) return;
  const p=svgPt(e);
  if(drag.t==='thick'){
    let t = 2 + Math.max(0,Math.min(1,(p.x-SCX)/SCW))*22;
    thickness = Math.round(t*2)/2;
  } else if(drag.t==='white'){
    whiteFrac = Math.max(0,Math.min(1,(p.y-PLY)/PLH));
  } else if(drag.t==='temp'){
    let a = Math.atan2(p.y-TKY,p.x-TKX)*180/Math.PI+90;
    if(a<-180)a+=360; if(a>180)a-=360;
    let v = (a+140)/260*34;
    tempF = Math.max(0,Math.min(34,v));
  } else if(drag.t==='move'){
    drag.pl.x = Math.max(ICEX0+24,Math.min(ICEX1-24,p.x));
    if(p.y>ICEY+70){ placed=placed.filter(q=>q!==drag.pl); drag=null; }
  }
  redrawAll();
}
SVG.addEventListener('pointermove', function(e){ if(drag){e.preventDefault();onDrag(e);} },{passive:false});
window.addEventListener('pointerup', function(){ drag=null; });
window.addEventListener('pointercancel', function(){ drag=null; });

function sizeCanvases(){
  const r=mat.getBoundingClientRect();
  MW=r.width; MH=r.height;
  DPR=Math.min(2,window.devicePixelRatio||1);
  [cGrease,cStain,cCray].forEach(function(c){

    prev.width=c.width;prev.height=c.height;
    if(c.width) prev.getContext('2d').drawImage(c,0,0);
    c.width=Math.round(MW*DPR); c.height=Math.round(MH*DPR);
    const ctx=c.getContext('2d');
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(prev.width) ctx.drawImage(prev,0,0,prev.width,prev.height,0,0,MW,MH);

}

/* ---- STAINS: mug rings, permanent, compounding ---- */
let rings = [];        // {x,y,r,age,vel}
function addRing(x,y,speed){
  const r = 26 + Math.min(10,speed*0.02);
  rings.push({x:x,y:y,r:r,t:0,spread:0,max:2.6+Math.random()*2.2});
  ringCount++; saveCounts(); updateBug();
}
function paintRing(ring, alpha){
  const ctx=sx;
  ctx.save();
  const R=ring.r+ring.spread;
  // outer tide mark
  ctx.strokeStyle='rgba(138,106,60,'+(0.30*alpha)+')';
  ctx.lineWidth=3.2;
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2+0.01;a+=0.09){
    const wob = 1 + 0.028*Math.sin(a*7+ring.x*0.11) + 0.02*Math.sin(a*3+ring.y*0.07);
    const px=ring.x+Math.cos(a)*R*wob, py=ring.y+Math.sin(a)*R*wob*0.98;
    a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.stroke();
  // soaked band
  ctx.strokeStyle='rgba(138,106,60,'+(0.13*alpha)+')';
  ctx.lineWidth=8;
  ctx.stroke();
  // faint interior
  ctx.fillStyle='rgba(138,106,60,'+(0.045*alpha)+')';
  ctx.beginPath(); ctx.arc(ring.x,ring.y,R*0.94,0,Math.PI*2); ctx.fill();
  // speckle
  for(let i=0;i<26;i++){
    const a=Math.random()*Math.PI*2, rr=R*(0.9+Math.random()*0.14);
    ctx.fillStyle='rgba(138,106,60,'+(0.10*alpha*Math.random())+')';
    ctx.fillRect(ring.x+Math.cos(a)*rr, ring.y+Math.sin(a)*rr, 1.4,1.4);
  }
  ctx.restore();
}

/* ---- GREASE ---- */
function paintGrease(x,y,amount){
  const ctx=gx;
  const g=ctx.createRadialGradient(x,y,2,x,y,34);
  g.addColorStop(0,'rgba(138,106,60,'+(0.055*amount)+')');
  g.addColorStop(0.6,'rgba(138,106,60,'+(0.030*amount)+')');
  g.addColorStop(1,'rgba(138,106,60,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,34,0,Math.PI*2); ctx.fill();
}
let greaseMap = null; // coarse grid for crayon skip
const GG=28;
let greaseGrid = new Float32Array(GG*GG);
function markGrease(x,y){
  const gxi=Math.floor(x/MW*GG), gyi=Math.floor(y/MH*GG);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const i=(gyi+dy)*GG+(gxi+dx);
    if(i>=0&&i<greaseGrid.length) greaseGrid[i]=Math.min(1,greaseGrid[i]+(dx||dy?0.02:0.05));
  }
}
function greaseAt(x,y){
  const i=Math.floor(y/MH*GG)*GG+Math.floor(x/MW*GG);
  return (i>=0&&i<greaseGrid.length)?greaseGrid[i]:0;
}

/* ---- CRAYON ---- */
let strokes = [];  // arrays of [nx,ny]
let curStroke = null;
function crayonSeg(x1,y1,x2,y2,speed){
  const ctx=kx;
  const d=Math.hypot(x2-x1,y2-y1);
  const steps=Math.max(1,Math.ceil(d/1.6));
  const gr=greaseAt(x2,y2);
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const px=x1+(x2-x1)*t, py=y1+(y2-y1)*t;
    const n=Math.sin(px*0.9)*Math.cos(py*1.3);
    const skip = 0.30 + 0.30*n + gr*0.55;
    for(let k=0;k<4;k++){
      if(Math.random()<skip) continue;
      const ox=(Math.random()-0.5)*5.2, oy=(Math.random()-0.5)*5.2;
      ctx.fillStyle='rgba(196,52,42,'+(0.30+Math.random()*0.42)*(1-gr*0.5)+')';
      ctx.fillRect(px+ox,py+oy,1.5+Math.random()*1.3,1.5+Math.random()*1.3);
    }
  }
}
function redrawCrayonFromStore(){
  kx.clearRect(0,0,MW,MH);
  strokes.forEach(function(st){
    for(let i=1;i<st.length;i++){
      crayonSeg(st[i-1][0]*MW,st[i-1][1]*MH,st[i][0]*MW,st[i][1]*MH,0);
    }
  });
}

function saveCounts(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    d.rings=ringCount; d.through=wentThrough; d.strokes=strokes;
    d.rgeom=rings.map(r=>[Math.round(r.x/MW*1000)/1000,Math.round(r.y/MH*1000)/1000,Math.round(r.r)]);
    d.grease=Array.from(greaseGrid).map(v=>Math.round(v*100)/100);
    localStorage.setItem(KEY,JSON.stringify(d));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    ringCount=d.rings||0; wentThrough=d.through||0;
    strokes=Array.isArray(d.strokes)?d.strokes:[];
    if(Array.isArray(d.grease)&&d.grease.length===GG*GG) greaseGrid=Float32Array.from(d.grease);
    if(Array.isArray(d.rgeom)) d.rgeom.forEach(function(r){
      rings.push({x:r[0]*MW,y:r[1]*MH,r:r[2],t:99,spread:3,max:3,done:true});
    });
  }catch(e){}
}

let toolPos = { mug:{x:0.80,y:0.60}, nap:{x:0.055,y:0.50}, cr:{x:0.93,y:0.30} };
function placeTools(){
  mugEl.style.transform=`translate(${toolPos.mug.x*MW-44}px, ${toolPos.mug.y*MH-60}px)`;
  napEl.style.transform=`translate(${toolPos.nap.x*MW-56}px, ${toolPos.nap.y*MH-48}px)`;
  crEl.style.transform=`translate(${toolPos.cr.x*MW-17}px, ${toolPos.cr.y*MH-53}px)`;
}

let held=null, lastPt=null, lastT=0, velo=0;
function localPt(e){
  const r=mat.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function nearTool(p){
  const m=toolPos.mug, n=toolPos.nap, c=toolPos.cr;
  if(Math.hypot(p.x-m.x*MW,p.y-m.y*MH)<44) return 'mug';
  if(Math.abs(p.x-n.x*MW)<52 && Math.abs(p.y-n.y*MH)<44) return 'nap';
  if(Math.abs(p.x-c.x*MW)<20 && Math.abs(p.y-c.y*MH)<56) return 'cr';
  return null;
}

mat.addEventListener('pointerdown', function(e){
  const p=localPt(e);
  const t=nearTool(p);
  if(t){
    e.preventDefault(); e.stopPropagation();
    held=t; lastPt=p; lastT=performance.now(); velo=0;
    mat.setPointerCapture(e.pointerId);
    if(t==='mug'){ mugEl.style.filter='drop-shadow(0 12px 10px rgba(0,0,0,.45))'; sfx.lift(); }
    if(t==='cr'){ curStroke=[[p.x/MW,p.y/MH]]; }
    if(t==='nap'){ sfx.slither(); }
  }
},true);

mat.addEventListener('pointermove', function(e){
  if(!held) return;
  e.preventDefault();
  const p=localPt(e);
  const now=performance.now();
  const dt=Math.max(1,now-lastT);
  const d=Math.hypot(p.x-lastPt.x,p.y-lastPt.y);
  velo = velo*0.7 + (d/dt)*1000*0.3;
  if(held==='mug'){ toolPos.mug={x:p.x/MW,y:p.y/MH}; }
  if(held==='nap'){
    toolPos.nap={x:p.x/MW,y:p.y/MH};
    paintGrease(p.x,p.y,0.5); markGrease(p.x,p.y);
    if(Math.random()<0.25) sfx.slither();
  }
  if(held==='cr'){
    toolPos.cr={x:p.x/MW,y:p.y/MH};
    crayonSeg(lastPt.x,lastPt.y,p.x,p.y,velo);
    curStroke.push([p.x/MW,p.y/MH]);
    sfx.rasp(velo, greaseAt(p.x,p.y));
  }
  lastPt=p; lastT=now;
  placeTools();
},{passive:false});

window.addEventListener('pointerup', function(e){
  if(!held) return;
  if(held==='mug'){
    mugEl.style.filter='';
    const p=toolPos.mug;
    addRing(p.x*MW, p.y*MH+18, velo);
    sfx.clunk(velo);
  }
  if(held==='cr' && curStroke && curStroke.length>1){
    strokes.push(curStroke); saveCounts();
  }
  curStroke=null;
  held=null;
});

/* napkin passively greases where it sits */
setInterval(function(){
  if(held!=='nap'){
    const p=toolPos.nap;
    paintGrease(p.x*MW,p.y*MH,0.16); markGrease(p.x*MW,p.y*MH);
  }
},900);
setInterval(saveCounts, 4000);

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  // rings spread then set
  let needRepaint=false;
  rings.forEach(function(r){
    if(r.done) return;
    r.t+=dt;
    if(r.spread<r.max){ r.spread+=dt*1.5; needRepaint=true; }
    else if(!r.done){ r.done=true; needRepaint=true; }
  });
  if(needRepaint){
    sx.clearRect(0,0,MW,MH);
    rings.forEach(function(r){ paintRing(r, r.done?1:0.75); });
  } else if(rings.length && rings[rings.length-1].t<0.02){
    rings.forEach(function(r){ paintRing(r,1); });
  }
  if(stepPhysics(dt)) {}
  drawSheet();
  requestAnimationFrame(frame);
}

/* ============================================================
   SOUND — everything synthesised
   ============================================================ */
const sfx = (function(){
  let AC=null, master=null, on=false, bedNodes=[];
  function ctx(){
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      AC=new C(); master=AC.createGain(); master.gain.value=0.0; master.connect(AC.destination);
    }
    return AC;
  }
  function noiseBuf(sec){
    const c=ctx(); const b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function startBed(){
    const c=ctx(); if(!c) return;
    // urn percolating: filtered noise with random bloops
    const n=c.createBufferSource(); n.buffer=noiseBuf(4); n.loop=true;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340;
    const g=c.createGain(); g.gain.value=0.07;
    n.connect(f); f.connect(g); g.connect(master); n.start();
    bedNodes.push(n);
    // floor fan
    const n2=c.createBufferSource(); n2.buffer=noiseBuf(4); n2.loop=true;
    const f2=c.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=210; f2.Q.value=1.1;
    const g2=c.createGain(); g2.gain.value=0.045;
    const lfo=c.createOscillator(); lfo.frequency.value=7.6;
    const lg=c.createGain(); lg.gain.value=0.012;
    lfo.connect(lg); lg.connect(g2.gain);
    n2.connect(f2); f2.connect(g2); g2.connect(master); n2.start(); lfo.start();
    bedNodes.push(n2,lfo);
    // truck idling outside — starts, and at some point leaves
    const t=c.createOscillator(); t.type='sawtooth'; t.frequency.value=42;
    const tf=c.createBiquadFilter(); tf.type='lowpass'; tf.frequency.value=140;
    const tg=c.createGain(); tg.gain.value=0.055;
    const tl=c.createOscillator(); tl.type='sine'; tl.frequency.value=3.1;
    const tlg=c.createGain(); tlg.gain.value=4;
    tl.connect(tlg); tlg.connect(t.frequency);
    t.connect(tf); tf.connect(tg); tg.connect(master); t.start(); tl.start();
    bedNodes.push(t,tl);
    const leaveAt = 70+Math.random()*110;
    setTimeout(function(){
      try{
        const now=c.currentTime;
        t.frequency.setValueAtTime(42,now);
        t.frequency.linearRampToValueAtTime(78,now+2.0);
        t.frequency.linearRampToValueAtTime(58,now+3.4);
        t.frequency.linearRampToValueAtTime(96,now+6.5);
        tg.gain.setValueAtTime(0.055,now+2);
        tg.gain.linearRampToValueAtTime(0.0,now+9);
      }catch(e){}
    }, leaveAt*1000);
    // percolator bloops
    (function bloop(){
      if(!on) return;
      const c2=ctx();
      const o=c2.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(240+Math.random()*180,c2.currentTime);
      o.frequency.exponentialRampToValueAtTime(90,c2.currentTime+0.09);
      const g3=c2.createGain(); g3.gain.setValueAtTime(0.09,c2.currentTime);
      g3.gain.exponentialRampToValueAtTime(0.0005,c2.currentTime+0.13);
      o.connect(g3); g3.connect(master); o.start(); o.stop(c2.currentTime+0.16);
      setTimeout(bloop, 900+Math.random()*2600);
    })();
    // screen door with a bell
    (function door(){
      if(!on) return;
      setTimeout(function(){
        if(!on) return;
        const c2=ctx(); const t0=c2.currentTime;
        for(let k=0;k<3;k++){
          const o=c2.createOscillator(); o.type='triangle';
          o.frequency.value=1180+k*430+Math.random()*80;
          const g4=c2.createGain();
          g4.gain.setValueAtTime(0.0,t0+k*0.012);
          g4.gain.linearRampToValueAtTime(0.055/(k+1),t0+0.008+k*0.012);
          g4.gain.exponentialRampToValueAtTime(0.0004,t0+0.9);
          o.connect(g4); g4.connect(master); o.start(t0+k*0.012); o.stop(t0+1.0);
        }
        // door slap
        const n3=c2.createBufferSource(); n3.buffer=noiseBuf(0.25);
        const f3=c2.createBiquadFilter(); f3.type='bandpass'; f3.frequency.value=480;
        const g5=c2.createGain(); g5.gain.setValueAtTime(0.14,t0+0.42);
        g5.gain.exponentialRampToValueAtTime(0.0004,t0+0.62);
        n3.connect(f3); f3.connect(g5); g5.connect(master); n3.start(t0+0.42);
        door();
      }, 9000+Math.random()*26000);
    })();
    // forks on plates
    (function forks(){
      if(!on) return;
      setTimeout(function(){
        if(!on) return;
        const c2=ctx(); const t0=c2.currentTime;
        const n4=c2.createBufferSource(); n4.buffer=noiseBuf(0.12);
        const f4=c2.createBiquadFilter(); f4.type='highpass'; f4.frequency.value=3200;
        const g6=c2.createGain(); g6.gain.setValueAtTime(0.05,t0);
        g6.gain.exponentialRampToValueAtTime(0.0004,t0+0.09);
        n4.connect(f4); f4.connect(g6); g6.connect(master); n4.start(t0);
        const o=c2.createOscillator(); o.type='sine'; o.frequency.value=2400+Math.random()*900;
        const g7=c2.createGain(); g7.gain.setValueAtTime(0.03,t0);
        g7.gain.exponentialRampToValueAtTime(0.0003,t0+0.22);
        o.connect(g7); g7.connect(master); o.start(t0); o.stop(t0+0.25);
        forks();
      }, 3000+Math.random()*9000);
    })();
  }
  let rasped=0;
  return {
    toggle:function(){
      const c=ctx(); if(!c) return false;
      if(c.state==='suspended') c.resume();
      on=!on;
      master.gain.setTargetAtTime(on?0.9:0.0, c.currentTime, 0.2);
      if(on && bedNodes.length===0) startBed();
      return on;
    },
    clunk:function(v){
      if(!on) return; const c=ctx(); const t0=c.currentTime;
      const base = 120 + Math.min(160, v*0.12);
      [1,1.6,2.4].forEach(function(m,i){
        const o=c.createOscillator(); o.type=i?'sine':'triangle'; o.frequency.value=base*m;
        const g=c.createGain(); g.gain.setValueAtTime(0.16/(i+1),t0);
        g.gain.exponentialRampToValueAtTime(0.0004,t0+0.20+i*0.05);
        o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.4);
      });
      const n=c.createBufferSource(); n.buffer=noiseBuf(0.08);
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
      const g=c.createGain(); g.gain.setValueAtTime(0.10,t0); g.gain.exponentialRampToValueAtTime(0.0004,t0+0.06);
      n.connect(f); f.connect(g); g.connect(master); n.start(t0);
    },
    lift:function(){
      if(!on) return; const c=ctx(); const t0=c.currentTime;
      const n=c.createBufferSource(); n.buffer=noiseBuf(0.12);
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600;
      const g=c.createGain(); g.gain.setValueAtTime(0.05,t0); g.gain.exponentialRampToValueAtTime(0.0004,t0+0.10);
      n.connect(f); f.connect(g); g.connect(master); n.start(t0);
    },
    slither:function(){
      if(!on) return; const c=ctx(); const t0=c.currentTime;
      const n=c.createBufferSource(); n.buffer=noiseBuf(0.3);
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=0.7;
      const g=c.createGain(); g.gain.setValueAtTime(0.0,t0);
      g.gain.linearRampToValueAtTime(0.035,t0+0.05);
      g.gain.exponentialRampToValueAtTime(0.0004,t0+0.26);
      n.connect(f); f.connect(g); g.connect(master); n.start(t0);
    },
    rasp:function(v,grease){
      if(!on) return;
      const now=performance.now();
      if(now-rasped<45) return; rasped=now;
      const c=ctx(); const t0=c.currentTime;
      const n=c.createBufferSource(); n.buffer=noiseBuf(0.09);
      const f=c.createBiquadFilter(); f.type='bandpass';
      f.frequency.value=(700+Math.min(2600,v*2.2))*(1-grease*0.55);
      f.Q.value=1.4;
      const g=c.createGain();
      g.gain.setValueAtTime(0.055*(1-grease*0.6),t0);
      g.gain.exponentialRampToValueAtTime(0.0004,t0+0.07);
      n.connect(f); f.connect(g); g.connect(master); n.start(t0);
    },
    tick:function(){
      if(!on) return; const c=ctx(); const t0=c.currentTime;
      const o=c.createOscillator(); o.type='square'; o.frequency.value=1400;
      const g=c.createGain(); g.gain.setValueAtTime(0.02,t0); g.gain.exponentialRampToValueAtTime(0.0003,t0+0.04);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.05);
    },
    plunge:function(){
      if(!on) return; const c=ctx(); const t0=c.currentTime;
      const o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(320,t0); o.frequency.exponentialRampToValueAtTime(55,t0+0.35);
      const g=c.createGain(); g.gain.setValueAtTime(0.18,t0); g.gain.exponentialRampToValueAtTime(0.0004,t0+0.55);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.6);
      const n=c.createBufferSource(); n.buffer=noiseBuf(0.5);
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
      const g2=c.createGain(); g2.gain.setValueAtTime(0.12,t0); g2.gain.exponentialRampToValueAtTime(0.0004,t0+0.45);
      n.connect(f); f.connect(g2); g2.connect(master); n.start(t0);
    }
  };
})();

document.getElementById('soundBtn').addEventListener('click',function(){
  const s=sfx.toggle();
  this.dataset.on=s?'1':'0';
  this.textContent = s?'Room sound on':'Room sound';
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  sizeCanvases();
  load();
  // repaint stored stains + grease
  sx.clearRect(0,0,MW,MH);
  rings.forEach(function(r){ paintRing(r,1); });
  for(let gy=0;gy<GG;gy++)for(let gxi=0;gxi<GG;gxi++){
    const v=greaseGrid[gy*GG+gxi];
    if(v>0.01) paintGrease((gxi+0.5)/GG*MW,(gy+0.5)/GG*MH, v*3);
  }
  redrawCrayonFromStore();
  placeTools();
  updateBug();
  redrawAll();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', function(){
  const oldRings=rings.map(r=>[r.x/MW,r.y/MH,r.r]);
  const oldGrease=Float32Array.from(greaseGrid);
  sizeCanvases();
  greaseGrid=oldGrease;
  rings=oldRings.map(r=>({x:r[0]*MW,y:r[1]*MH,r:r[2],t:99,spread:3,max:3,done:true}));
  sx.clearRect(0,0,MW,MH);
  rings.forEach(function(r){ paintRing(r,1); });
  gx.clearRect(0,0,MW,MH);
  for(let gy=0;gy<GG;gy++)for(let gxi=0;gxi<GG;gxi++){
    const v=greaseGrid[gy*GG+gxi];
    if(v>0.01) paintGrease((gxi+0.5)/GG*MW,(gy+0.5)/GG*MH, v*3);
  }
  redrawCrayonFromStore();
  placeTools();
});
boot();
