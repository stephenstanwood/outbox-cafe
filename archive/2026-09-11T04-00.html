  <meta name="outbox-spec-era" content="11 June 1972, right now — twenty to seven on a warm, gusty evening on a sloping hayfield two miles east of Rensselaer, Indiana, where a four-man crew out of a tent-and-awning yard is two hours into putting up a 40 × 80 pole tent for a farm dispersal auction that starts at nine tomorrow morning. The centre poles are up and guyed slack, the sidewall is still on the truck, the wind has been backing all evening and there is weather forecast out of the west before midnight. The only copy of the manufacturer's erection sheet — one big sheet, printed both sides, folded down to pocket size — has been in the glovebox since 1968, and it has been folded wrong so many times that it is now stiff along the wrong lines and will not go back the way it came. Not a look-back at anything, not a lament, not a memory of anything vanished: forty-seven numbered steps exist, eleven of them are on panels nobody can currently see at the same time as the panels they refer to, and the guys have to be dressed and the sidewall laced before dark.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport, edge to edge, is one large printed sheet that has been FOLDED WRONG, and the misfold is the only navigation and the only content. No header, no menu, no title, no scrollbar, no index, no site chrome of any kind. The sheet is 42 × 60 cm printed both sides and creased into sixteen panels; folded, exactly two of those sixteen panel faces are presented to the visitor at once, at true pocket size, filling the frame — and because the sheet is folded incorrectly, the two panels showing are never adjacent panels and never belong together. Step 31 sits butted up against a guy-line tension table from the other side of the sheet; half a diagram of a pole cap is butted against the tail of a paragraph that begins somewhere the visitor cannot reach. The visitor's entire vocabulary is two hands on paper: DRAG along any crease to open or close that fold, which really refolds the sheet through a real fold-state machine and brings a different mismatched pair to the front; and PRESS AND HOLD on any crease to work it flat, which softens that crease, makes it fold easier forever, and makes its neighbours stiffer. There is no correct state. The engine knows what the correct fold is, and one crease — the long cross fold, which is split about four centimetres in from the edge — physically cannot carry the fold that would produce it, so the sheet can be worked into every one of its other states and never that one, on this visit or any other. Nothing scrolls. Nothing resets. Nothing is explained.">
  <meta name="outbox-spec-subject" content="The flat rigging arithmetic of a 40 × 80 canvas pole tent going up on a slope before weather, and specifically that a tent is not held up by its poles, it is held down by its guys, and everything else follows from that — that the two centre poles carry the load in pure compression and will happily walk right out from under the peak the moment the guy tensions go uneven, so the rule is that every guy on a bail ring is dressed to the same tension before ANY of them is dressed tight, and a crew that tightens one side to look neat has already lost the tent; that a side pole is not a support but a spacer, standing on its pin in the eave line, doing nothing at all until the corresponding guy is taut, which is exactly why a side pole falls over in the middle of the job and is not a fault; that guy angle is the whole calculation and the number is 45 degrees — a stake driven in close to the eave puts most of the guy's pull straight down into the ground and almost none of it outward where the tension is needed, and a stake driven too far out reduces the downward component and lets the pole lift, and neither of those is an opinion, it is the resolution of one force into two; that STAKE HOLDING POWER is a soil question and not a hardware question, since a 42-inch stake in hayfield loam pulls out at a fraction of what the same stake holds in hardpan, and the honest test is a bar and two men leaning on it and not a chart; that stakes are driven leaning AWAY from the tent at about the same angle as the guy so the load is taken along the stake's length and not across it, and a stake driven plumb bends and then walks; that on a slope every stake on the downhill side is carrying more than its share and the whole tent wants to slide, so the uphill guys are set first and the downhill guys are doubled or double-staked, and a tent set square on a slope is set wrong; that ROPE IS NOT WIRE — manila and cotton guys shrink measurably when they get wet, by real percentages, so a tent dressed bar-tight in dry evening air will rip its own grommet line out at two in the morning in rain, and the correct answer is to leave the guys slack enough that a man can get his fist under a dressed guy, which is exactly what every inexperienced crew tightens out; that this is why the guys must be slacked BEFORE the rain and not during it; that canvas itself shrinks, so the same slack rule applies twice; that the sidewall is laced last and is a sail — a fully walled tent in a 40 mph gust carries an enormous lateral load into the same stakes, and the standard answer to a wind warning is to unlace and roll the windward wall, which sounds like giving up and is the entire safety procedure; that the peak load is what tears a top, since water ponding in a slack section between poles gains weight faster than anybody expects and a hundred gallons standing in a bay will pull the pole out of the peak; that grommet and jump-rope spacing exists so that a torn panel tears to the seam and stops; that the pole tent goes up in a fixed order — lay the top out flat and square on the ground first, lace the sections, rig every side pole and stake before ANY centre pole is raised, and raise the centre poles last, because a top raised out of order cannot be squared afterward and has to come all the way down; and the flat arithmetic on the sheet, which is two centre poles, eighteen side poles, thirty-six stakes plus eight doubles on the low corner, forty-seven printed steps, a sale at nine tomorrow, and dark in about ninety minutes.">
  <meta name="outbox-spec-tone" content="The loud, fast, cheerfully exasperated voice of Vonda Kruzelka-Bandy, forty-seven, who runs the counter and the rental book at the yard and drove out with the second truck because the crew chief quit on Thursday and nobody else knows where the stake bar is. Present tense, second person, addressed to whoever is holding the other corner of the sheet while she reads it. She reads printed steps ALOUD OFF THE SHEET, in whatever order the fold happens to present them, and says out loud each time that it is not the one she wants: she is looking for step 23 and she gets 31, then 8, then a tension table, then 31 again. She does not summarise, does not paraphrase and does not explain the tent to anybody — she reads what is printed, flatly, and then talks over it. She revises her own stake count out loud three separate times and says plainly each time what she had wrong: once because she counted the low corner doubles twice, once because two of the side poles on the truck are the wrong length and don't belong to this top, once because she read the count off the 20-foot canopy panel by mistake. She is specifically and repeatedly annoyed about exactly one thing — that the sheet lives in the glovebox and has been folded by every man who ever drove that truck, and that she has asked twice for the yard to get a second copy from the manufacturer — and she says it three times. She is briefly and genuinely pleased once, about the fact that the guys are all still slack and therefore nothing has to be undone, and she says so purely as a matter of not having to redo anything. She mentions the wind backing twice and the fact that her shoes are wrong for a hayfield once. She never once addresses the visitor as a student, never gives a lesson, and never draws a conclusion. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, NOT a competent-tradesperson-saying-every-figure-twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The sheet is cheap 1968 offset bond in a warm dry cream (#e9e2cd), going measurably greyer and softer along every crease where it has been opened and closed for four years (#cdc4a8), and going darker, oilier and semi-translucent in a broad band across two panels where it has sat in a glovebox against a rubber mat (#b8a97f) — and the printing UNDER that band is honestly harder to read for the whole visit. The job is one-colour offset in a flat brick orange-red (#c2452b): solid and slightly bloomed in the heavy step numbers and rule boxes, starved, broken and pinkish in the small tension tables and in every line of the diagrams (#d9836e), with real make-ready unevenness so one panel is measurably lighter than its neighbours. Crease damage is COMPUTED and never drawn: every crease carries a live fatigue value from the number of times it has been folded across all visits, and its render runs honestly from a clean sharp line, through fibre whitening, to a genuine split with the dark of the field showing through it (#3b3a33) — and printing that lies across a split crease loses a real strip of ink and cannot be read across the gap. The long cross fold is already split four centimetres in at load and has been since before the visitor arrived. The field shows only at the sheet's outer margins as trodden hay in a hard evening green-gold (#9c9a5c) with short raking shadows. Exactly one chip of guy-rope stripe blue (#2f5a86) is held strictly for the manufacturer's part-number block, the small printed square that says which top this sheet belongs to, and the pencilled yard number somebody wrote on the back — it never appears in a step, a diagram, a table or a caption. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest ink starvation, honest crease fatigue and honest glovebox staining.">
  <meta name="outbox-spec-wildcard" content="Panel 9 belongs to a different product. It is printed in the same colour by the same printer on the same sheet — a make-ready economy — and it carries erection steps for a 20 × 20 frame canopy, numbered in the same series, so there are two step 14s, two step 15s and two step 16s on this sheet and nothing distinguishes them except a part-number block in the corner that is under the glovebox stain and cannot be read. The frame-canopy steps are internally correct and completely useless here. The engine treats panel 9 exactly like every other panel: it folds, wears, splits and comes up in the rotation on its honest turn, and it is never flagged, greyed, marked or commented on by the engine in any way. Vonda reads four lines of it aloud, gets most of the way through before she notices, says once that the yard has three of these tops and two of those canopies and somebody in Ohio saved a plate, and goes straight back to counting stakes and never mentions it again. It is panel 9, same steps, same stain over the part number, on every visit.">
  <meta name="outbox-spec-forbidden" content="NO folding-as-metaphor for anything — not memory, not what gets creased in a person, not 'you can never unfold it', not layers, not the shape a life gets pressed into; this is five creases, a split cross fold and a step that continues on a panel you cannot see, and it has nothing to teach anybody. ABSOLUTELY NO origami preciousness, NO paper-as-fragile lyricism, NO map-of-the-territory philosophy, NO Borges, NO 'the instructions are always incomplete' as a statement about anything. NO circus or big-top romance whatsoever: no sawdust, no calliope, no roustabouts as myth, no tent-as-magic, no travelling-show glamour, no Ray Bradbury, no 'and by morning the field was empty' — this is a rental crew and a farm auction. NO bureaucratic-absurd, NO Kafka, NO department-of-X, NO committee-minutes register, NO joke about instruction manuals being unreadable presented as a joke; the sheet is correct and the fold is wrong and nobody on the page finds it funny. NO Americana and NO heartland sentiment: no amber waves, no fireflies-and-porches, no small-town warmth, no farm-crisis pathos, no dispersal-auction melancholy about a family selling up, no 1972-as-period-signifier, no Vietnam or Watergate drift, no Norman Rockwell, no explaining Indiana to anybody. NO nostalgia, NO wistfulness, NO 'nobody puts up canvas anymore / it's all frame and vinyl now / the last of the tent companies' decline narrative — the sale is at nine and the wall is still on the truck. NO craftsman-sage register, NO 'the old tent men could feel a guy go slack', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc. NO storm dread, NO disaster foreshadowing, NO danger-porn about a tent coming down on people, NO safety sermon; the weather is a forecast and a reason to leave the guys slack. NO woman-in-a-man's-trade arc, NO proving-herself, NO crew-of-lovable-characters sketch, NO quitting-boss drama beyond the one flat fact of it. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the paper or the folding. NO sensuous material writing about canvas, manila or paper beyond weight, tension, shrinkage, stiffness and legibility. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the unreachable fold, the two step 14s, or the split that keeps growing — nothing here is wrong. NO archival / museum / cabinet / drawer / found-document / relic framing of the sheet whatsoever, despite it being an old printed document — it lives in a glovebox, it is being used this minute, and it is getting worse while it is used. NO map, atlas, gazetteer or directory framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty to seven in the evening with the sun still well up and the wind backing. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<!--
  Yard 6. 40x80 top, three-piece lace, eighteen side, two centre.
  If you are reading this: the second copy was ordered twice. Neither came.
  Crease E is split four centimetres in from the edge and has been since Kokomo.
-->

<script>
"use strict";
/* ============================================================
   THE SHEET
   42 x 60 cm, printed both sides, sixteen panel faces.
   Creases: A B C D vertical-ish quarter folds on the short axis,
   E = the long cross fold.
   Fold state machine: each crease is 0 (open) / 1 (valley) / 2 (mountain).
   The engine resolves which two faces end up outermost.
   ============================================================ */

var LS="rens.6x80.sheet.v1";

/* ---- printed content, real page coordinates, in manufacturer's order ---- */
/* steps 1..47 distributed across 16 panel faces; panel 9 belongs to the
   20x20 frame canopy (make-ready economy), same series, two 14s 15s 16s. */

var STEPS = [
 [1,"LAY TOP OUT FLAT ON GROUND, RIDGE LINE EAST AND WEST, RIGHT SIDE UP."],
 [2,"SQUARE THE TOP BEFORE ANY LACING. MEASURE BOTH DIAGONALS. EQUAL WITHIN 3 IN."],
 [3,"LACE MIDDLE SECTION TO EACH END SECTION, ROPE PASSING OUTSIDE TO IN, EVERY GROMMET."],
 [4,"DO NOT SKIP GROMMETS IN LACING. JUMP-ROPE SPACING IS FIGURED SO A TORN PANEL"],
 [5,"CARRIES TO THE SEAM AND STOPS THERE."],
 [6,"MARK EAVE LINE ON GROUND AT EACH SIDE POLE POSITION, 6 FT 8 IN ON CENTRE."],
 [7,"DRIVE ALL STAKES BEFORE ANY POLE IS RAISED. STAKE LINE IS 8 FT OUT FROM EAVE"],
 [8,"ON LEVEL GROUND. GUY ANGLE 45 DEG. THIS IS NOT A PREFERENCE."],
 [9,"A STAKE SET CLOSE IN PUTS THE PULL STRAIGHT DOWN INTO THE GROUND AND NONE OF IT"],
 [10,"OUT WHERE THE TENSION IS WANTED. A STAKE SET LONG LETS THE POLE LIFT."],
 [11,"DRIVE EACH STAKE LEANING AWAY FROM THE TENT AT THE ANGLE OF ITS GUY, SO LOAD IS"],
 [12,"TAKEN ALONG THE STAKE AND NOT ACROSS IT. A STAKE DRIVEN PLUMB BENDS, THEN WALKS."],
 [13,"HOLDING POWER IS SOIL, NOT HARDWARE. TEST WITH BAR AND TWO MEN LEANING."],
 [14,"42 IN STAKE, HARDPAN — HOLDS. 42 IN STAKE, LOAM OR MEADOW — DOUBLE STAKE."],
 [15,"ON SLOPING GROUND SET ALL UPHILL GUYS FIRST AND BRING THEM TO EVEN TENSION."],
 [16,"DOWNHILL STAKES CARRY MORE THAN THEIR SHARE. DOUBLE OR TWIN-STAKE ALL OF THEM."],
 [17,"A TOP SET SQUARE ON A SLOPE IS SET WRONG. SET IT TO THE FALL OF THE GROUND."],
 [18,"RIG EVERY SIDE POLE AND ITS GUY BEFORE ANY CENTRE POLE IS RAISED."],
 [19,"SIDE POLE IS A SPACER, NOT A SUPPORT. IT STANDS ON ITS PIN IN THE EAVE GROMMET"],
 [20,"AND DOES NOTHING WHATEVER UNTIL ITS GUY IS TAUT."],
 [21,"A SIDE POLE THAT FALLS OVER DURING RIGGING IS NOT A FAULT. STAND IT AND GO ON."],
 [22,"BRING ALL SIDE GUYS TO HAND TENSION. NONE TIGHT. WORK THE WHOLE LINE ROUND."],
 [23,"RAISE CENTRE POLES LAST. BAIL RING GUYS ARE DRESSED TO THE SAME TENSION ALL"],
 [24,"POLES CARRY IN COMPRESSION ONLY. UNEVEN BAIL TENSION WALKS A CENTRE POLE OUT"],
 [25,"FROM UNDER THE PEAK. IT WILL NOT WARN YOU FIRST."],
 [26,"A CREW THAT DRESSES ONE SIDE TIGHT TO LOOK NEAT HAS ALREADY LOST THE TOP."],
 [27,"CHECK PEAK HEIGHT AT BOTH POLES. 22 FT 0 IN TO UNDERSIDE OF BAIL."],
 [28,"THE TENT IS NOT HELD UP BY ITS POLES. IT IS HELD DOWN BY ITS GUYS."],
 [29,"AFTER RAISING, WALK THE WHOLE STAKE LINE AND EVEN THE GUYS A SECOND TIME."],
 [30,"MANILA AND COTTON GUY LINE SHRINKS WHEN WET. FIGURE 4 TO 6 PER CENT ON LENGTH."],
 [31,"LEAVE EVERY GUY SLACK ENOUGH THAT A MAN CAN PASS HIS CLOSED FIST UNDER IT."],
 [32,"CANVAS SHRINKS ALSO. THE SLACK RULE APPLIES TWICE OVER."],
 [33,"A TOP DRESSED BAR-TIGHT IN DRY AIR WILL PULL ITS OWN GROMMET LINE OUT IN RAIN."],
 [34,"SLACK THE GUYS BEFORE THE WEATHER. NOT DURING IT."],
 [35,"LACE SIDEWALL LAST, EAVE ROPE FIRST, THEN CORNERS, THEN FILL BETWEEN."],
 [36,"SIDEWALL IS A SAIL. A FULLY WALLED TOP TAKES THE WHOLE LATERAL LOAD INTO THE"],
 [37,"SAME STAKES THAT ARE ALREADY HOLDING THE ROOF DOWN."],
 [38,"ON WIND WARNING: UNLACE AND ROLL THE WINDWARD WALL. THIS IS THE PROCEDURE."],
 [39,"DO NOT WAIT TO SEE WHETHER IT IS NEEDED."],
 [40,"WATER PONDS IN ANY SLACK BAY BETWEEN POLES. 100 GAL STANDING WILL PULL A"],
 [41,"CENTRE POLE OUT OF THE PEAK. KEEP THE BAYS WITH RISE IN THEM."],
 [42,"PUSH PONDED WATER UP AND OFF FROM UNDERNEATH WITH A POLE. NEVER FROM ABOVE."],
 [43,"TIE OFF ALL GUY TAILS. LOOSE TAIL FOULS A MOWER AND A MAN BOTH."],
 [44,"COUNT: 2 CENTRE, 18 SIDE, 36 STAKE. ADD 8 FOR DOUBLING A LOW CORNER."],
 [45,"STRIKING: SLACK ALL GUYS EVENLY BEFORE DROPPING ANY CENTRE POLE."],
 [46,"FOLD TOP TO SEAMS, ROLL FROM ONE END, DO NOT FOLD ACROSS A LACE LINE."],
 [47,"STORE DRY. A TOP PUT AWAY WET IS A TOP THROWN AWAY."]
];

var CANOPY = [
 [13,"20 x 20 FRAME CANOPY. NO CENTRE POLE. FRAME CARRIES IN BENDING."],
 [14,"ASSEMBLE FOUR EAVE RAILS AND FOUR HIP RAILS ON THE GROUND, PIN AND CLIP."],
 [15,"RAISE ON FOUR LEGS, TWO MEN TO A LEG, LEGS PLUMB. NO GUY REQUIRED IN CALM."],
 [16,"IN WIND, GUY EACH LEG HEAD TO ONE STAKE, 45 DEG, LEGS STILL PLUMB."],
 [17,"CANOPY TOP IS PULLED OVER FRAME FROM ONE CORNER AND RATCHETED AT EAVE."]
];

/* build panel contents: each of sixteen faces gets a slice */
function panelContent(idx){
  // idx 0..15 ; side A = 0..7 (front), side B = 8..15 (back)
  var out={lines:[],kind:"steps",head:null,foot:null};
  if(idx===8){ // PANEL 9 — the frame canopy plate
    out.kind="canopy";
    out.head="ERECTION — CONT'D";
    CANOPY.forEach(function(s){ out.lines.push({n:s[0],t:s[1]}); });
    out.part="PART NO. 20-20-FC / PLATE 4";
    return out;
  }
  if(idx===3){ out.kind="table"; return out; }
  if(idx===11){ out.kind="diagram"; return out; }
  if(idx===13){ out.kind="back14"; return out; }
  // distribute steps across the other 13 faces
  var order=[0,1,2,4,5,6,7,9,10,12,14,15];
  var slot=order.indexOf(idx);
  var per=Math.ceil(STEPS.length/order.length); // 4
  var start=slot*per;
  for(var i=start;i<Math.min(start+per,STEPS.length);i++){
    out.lines.push({n:STEPS[i][0],t:STEPS[i][1]});
  }
  return out;
}
var PANELS=[];for(var pi=0;pi<16;pi++)PANELS.push(panelContent(pi));

/* ============================================================
   FOLD STATE MACHINE
   Creases: 0..3 = quarter/eighth folds along the long axis (A,B,C,D)
            4    = E, the long cross fold (splits the sheet front/back halves)
   Each crease st in {0 open, 1 valley, 2 mountain}
   Outermost faces computed from a real column stack.
   ============================================================ */

var CREASE_NAMES=["A","B","C","D","E"];
var state={
  fold:[0,0,0,0,0],
  fatigue:[3,5,2,4,26],      // E starts worn — four years in a glovebox
  stiff:[0,0,0,0,0],
  split:[0,0,0,0,4.0],       // E already split 4 cm in from the edge
  folds:0,
  stain:52                   // mm of glovebox band creep
};

try{
  var raw=localStorage.getItem(LS);
  if(raw){
    var s=JSON.parse(raw);
    if(s&&s.fatigue&&s.fatigue.length===5){
      state.fatigue=s.fatigue; state.stiff=s.stiff||state.stiff;
      state.split=s.split; state.folds=s.folds||0;
      state.stain=Math.max(52,s.stain||52);
      state.fold=s.fold||[0,0,0,0,0];
      if(state.split[4]<4)state.split[4]=4;
    }
  }
}catch(e){}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
}

/* The eight columns of the sheet along the folding axis, each column has a
   front face and a back face. Columns 0..7 -> faces (front idx, back idx). */
var COLS=[];
for(var c=0;c<8;c++)COLS.push({f:c, b:15-c});

/* Resolve the stack: apply creases in order. A crease between column groups.
   Crease i sits between column i*? — we use a simple binary hierarchy:
   E (4) folds the sheet in half at column boundary 4;
   A(0) at boundary 2, B(1) at boundary 6, C(2) at boundary 1, D(3) at boundary 3. */
var BOUNDARY=[2,6,1,3,4];

function resolveStack(){
  // stack = list of {col, flipped}
  var stack=[];
  for(var i=0;i<8;i++)stack.push([{col:i,flip:false}]);
  // fold order: E first (big fold), then A,B, then C,D
  var order=[4,0,1,2,3];
  var segs=stack.map(function(s){return s;}); // array of 8 groups
  function doFold(ci){
    var st=state.fold[ci]; if(st===0)return;
    var b=BOUNDARY[ci];
    if(b<=0||b>=segs.length)return;
    var left=segs.slice(0,b), right=segs.slice(b);
    var out;
    if(st===1){ // valley: right folds over onto left, reversed & flipped
      var moved=[];
      for(var i=right.length-1;i>=0;i--){
        var g=right[i].map(function(p){return {col:p.col,flip:!p.flip};}).reverse();
        moved.push(g);
      }
      // merge moved onto left tail
      out=[];
      var n=Math.max(left.length,moved.length);
      for(var j=0;j<n;j++){
        var L=left[left.length-1-j]||[], M=moved[j]||[];
        out.unshift(M.concat(L));
      }
      // prepend untouched leading left groups
      if(left.length>moved.length){
        out=left.slice(0,left.length-moved.length).concat(out.slice(out.length-moved.length));
        // rebuild properly
        var res=[]; var k;
        for(k=0;k<left.length-moved.length;k++)res.push(left[k]);
        for(k=0;k<moved.length;k++){
          res.push(moved[k].concat(left[left.length-1-k]||[]));
        }
        out=res;
      }
    } else { // mountain: left folds behind onto right
      var mv=[];
      for(var i2=left.length-1;i2>=0;i2--){
        var g2=left[i2].map(function(p){return {col:p.col,flip:!p.flip};}).reverse();
        mv.push(g2);
      }
      var res2=[];
      for(var k2=0;k2<mv.length;k2++){
        res2.push((right[k2]||[]).concat(mv[k2]));
      }
      for(var k3=mv.length;k3<right.length;k3++)res2.push(right[k3]);
      out=res2;
    }
    segs=out;
  }
  order.forEach(doFold);
  return segs;
}

/* which two faces are outermost, and are they physically adjacent on the sheet */
function outermost(){
  var segs=resolveStack();
  // take the first remaining group (leftmost packet) — top and bottom of pile
  var pile=segs[0]||[{col:0,flip:false}];
  var top=pile[0], bot=pile[pile.length-1];
  function faceOf(p){ return p.flip? COLS[p.col].b : COLS[p.col].f; }
  var A=faceOf(top), B=faceOf(bot);
  // also grab the second packet's top so we always show two panels side by side
  var pile2=segs[1]||segs[segs.length-1]||pile;
  var C=faceOf(pile2[0]);
  var left=A, right=(A===C? B : C);
  if(left===right) right=(left+7)%16;
  return {left:left,right:right,packets:segs.length};
}

/* the manufacturer's intended fold requires a VALLEY on crease E (index 4). */
var INTENDED=[1,2,1,2,1];
function intendedNeedsValleyOnE(){ return INTENDED[4]===1; }

/* ============================================================
   RENDER
   ============================================================ */
var wrap=document.getElementById("sheetwrap");
var NS="http://www.w3.org/2000/svg";

function fit(){
  var w=Math.min(window.innerWidth-24, 640);
  var h=Math.min(window.innerHeight-Math.max(150,window.innerHeight*0.30), 700);
  var aspect=(105*2)/150; // two panels, each 105 x 150 mm-ish pocket size
  var W=w,H=w/aspect;
  if(H>h){H=h;W=h*aspect;}
  return {W:Math.max(240,W),H:Math.max(180,H)};
}

function el(n,attrs,parent){
  var e=document.createElementNS(NS,n);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}

var VW=420,VH=300; // internal units: two panels of 210 x 300

function creaseVisual(i){
  var f=state.fatigue[i], sp=state.split[i];
  return {fat:f, split:sp};
}

function render(){
  var dim=fit();
  wrap.innerHTML="";
  var svg=el("svg",{id:"sheet",width:dim.W,height:dim.H,viewBox:"0 0 "+VW+" "+VH},wrap);
  svg.setAttribute("xmlns",NS);

  var pair=outermost();

  // paper texture

  el("feTurbulence",{type:"fractalNoise",baseFrequency:"0.9",numOctaves:"3",result:"n"},f1);
  el("feColorMatrix",{type:"saturate",values:"0"},f1);

  drawWear(svg);

  // glovebox stain band across the two panels
  var stainW=state.stain/60*VW;
  var g=el("g",{opacity:"0.85"},svg);
  el("rect",{x:VW*0.30,y:VH*0.42,width:Math.min(VW*0.70,stainW*1.1),height:VH*0.30,
    fill:"#b8a97f",opacity:"0.72"},g);

}

function drawWear(svg){
  // vertical greying bands where creases lie in the folded packet
  var xs=[VW*0.25,VW*0.5,VW*0.75];
  xs.forEach(function(x,i){
    var f=state.fatigue[i]||0;
    var w=1.2+Math.min(6,f*0.12);
    el("rect",{x:x-w/2,y:0,width:w,height:VH,fill:"#cdc4a8",opacity:String(Math.min(.9,.22+f*0.012))},svg);
  });
  // horizontal wear from E
  var fe=state.fatigue[4];
  el("rect",{x:0,y:VH*0.5-1.5-Math.min(4,fe*0.05),width:VW,height:3+Math.min(8,fe*0.1),
    fill:"#cdc4a8",opacity:String(Math.min(.95,.3+fe*0.008))},svg);
}

function drawSeam(svg){
  var fe=state.fatigue[4], sp=state.split[4];
  var x=VW/2;
  el("line",{x1:x,y1:0,x2:x,y2:VH,stroke:"#cdc4a8","stroke-width":String(2+Math.min(6,fe*0.06))},svg);
  // fibre whitening
  el("line",{x1:x,y1:0,x2:x,y2:VH,stroke:"#f3eedd","stroke-width":"1",opacity:String(Math.min(.85,fe*0.02))},svg);
  // the split: real length from the edge, top-down
  if(sp>0){
    var L=Math.min(VH, sp/42*VH);
    el("line",{x1:x,y1:0,x2:x,y2:L,stroke:"#3b3a33","stroke-width":String(1.6+sp*0.06),
      "stroke-linecap":"butt"},svg);
    // ragged edge
    for(var i=0;i<Math.floor(L/9);i++){
      var yy=i*9+Math.random()*4;
      el("rect",{x:x-2-Math.random()*2,y:yy,width:1.5+Math.random()*2,height:2+Math.random()*3,
        fill:"#3b3a33",opacity:"0.55"},svg);
    }
  }
}

/* ============================================================
   HANDLES — drag along a crease to fold, press-and-hold to work flat
   ============================================================ */
var currentPair=null;
function drawHandles(svg,dim){
  var lanes=[
    {ci:2,x:VW*0.25,vert:true},
    {ci:0,x:VW*0.50,vert:true},
    {ci:3,x:VW*0.75,vert:true},
    {ci:1,x:VW*0.125,vert:true},
    {ci:4,y:VH*0.5,vert:false}
  ];
  lanes.forEach(function(L){
    var r;
    if(L.vert){
      r=el("rect",{x:L.x-16,y:0,width:32,height:VH,fill:"transparent",class:"hand"},svg);
    }else{
      r=el("rect",{x:0,y:L.y-16,width:VW,height:32,fill:"transparent",class:"hand"},svg);
    }
    attachCrease(r,L.ci,L.vert);
  });
}

var holdTimer=null, dragStart=null, dragCi=-1, dragVert=true, moved=0;

function attachCrease(node,ci,vert){
  function down(ev){
    ev.preventDefault();
    var p=pt(ev);
    dragStart=p; dragCi=ci; dragVert=vert; moved=0;
    holdTimer=setTimeout(function(){ workFlat(ci); holdTimer=null; dragCi=-1; },620);
  }
  node.addEventListener("mousedown",down);
  node.addEventListener("touchstart",down,{passive:false});
}
function pt(ev){
  var t=(ev.touches&&ev.touches[0])||ev;
  return {x:t.clientX,y:t.clientY};
}
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
function move(ev){
  if(dragCi<0||!dragStart)return;
  var p=pt(ev);
  var dx=p.x-dragStart.x, dy=p.y-dragStart.y;
  moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
  if(moved>18&&holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  if(moved>44){
    var dir;
    if(dragVert) dir=(dx>0)?1:2; else dir=(dy>0)?1:2;
    attemptFold(dragCi,dir);
    dragCi=-1;dragStart=null;
  }
  if(ev.cancelable)ev.preventDefault();
}
window.addEventListener("mouseup",up);
window.addEventListener("touchend",up);
function up(){
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  if(dragCi>=0&&moved<44&&moved>4){
    // a nudge that doesn't take
    bulge(dragCi);
  }
  dragCi=-1;dragStart=null;
}

function attemptFold(ci,dir){
  // A SPLIT CREASE REFUSES THE VALLEY. E is split.
  if(state.split[ci]>2.5 && dir===1){
    bulge(ci);
    sndRefuse(ci);
    speakRefusal(ci);
    return;
  }
  // stiffness resistance
  var resist=state.stiff[ci]-state.fatigue[ci]*0.28;
  if(resist>7 && Math.random()<0.42){
    bulge(ci); sndRefuse(ci);
    return;
  }
  state.fold[ci]=(state.fold[ci]===dir)?0:dir;
  state.fatigue[ci]+=1.6;
  state.stiff[ci]=Math.max(0,state.stiff[ci]-1.1);
  [ci-1,ci+1].forEach(function(n){ if(n>=0&&n<5){ state.stiff[n]+=1.3; } });
  state.folds++;
  state.stain=Math.min(180,state.stain+0.35);
  sndCrease(ci);
  // split growth past threshold
  if(state.fatigue[ci]>34+state.split[ci]*4){
    var grow=0.6+Math.random()*1.4;
    state.split[ci]=Math.min(42,state.split[ci]+grow);
    sndTear(grow);
  }
  save();
  render();
  speakForPair();
}

function workFlat(ci){
  state.stiff[ci]=Math.max(0,state.stiff[ci]-4.5);
  state.fatigue[ci]+=3.4;
  [ci-1,ci+1].forEach(function(n){ if(n>=0&&n<5) state.stiff[n]+=2.0; });
  sndBurnish(ci);
  if(state.fatigue[ci]>34+state.split[ci]*4){
    var grow=0.8+Math.random()*1.8;
    state.split[ci]=Math.min(42,state.split[ci]+grow);
    sndTear(grow);
    line("read","<b>—</b> that's opened up a little more, thumbnail's worth.",true);
  }
  save(); render();
}

function bulge(ci){
  var svg=document.getElementById("sheet");
  if(!svg)return;
  svg.style.transition="none";
  svg.style.transform="perspective(600px) rotateY("+(ci%2?4:-4)+"deg) scale(1.012)";
  setTimeout(function(){
    svg.style.transition="transform .22s cubic-bezier(.2,1.4,.4,1)";
    svg.style.transform="none";
  },70);
}

/* ============================================================
   SOUND — all synthesised
   ============================================================ */
var AC=null, master=null, windGain=null, windFilter=null, started=false;
function audio(){
  if(AC)return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){return null;}
  master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  startBeds();
  return AC;
}
function noiseBuf(sec){
  var n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  return b;
}
function startBeds(){
  if(started)return; started=true;
  // wind bed
  var src=AC.createBufferSource(); src.buffer=noiseBuf(4); src.loop=true;
  windFilter=AC.createBiquadFilter(); windFilter.type="bandpass";
  windFilter.frequency.value=380; windFilter.Q.value=0.7;
  windGain=AC.createGain(); windGain.gain.value=0.05;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
  src.start();
  // wind backs slowly across the visit
  var t0=AC.currentTime;
  (function back(){
    if(!AC)return;
    var f=300+Math.random()*220;
    windFilter.frequency.setTargetAtTime(f,AC.currentTime,9);
    setTimeout(back,14000+Math.random()*11000);
  })();
  gustClock();
  luffClock();
  barClock();
  bobwhiteClock();
  truckOnce();
}
function gustClock(){
  setTimeout(function(){
    if(!AC)return;
    var t=AC.currentTime, mag=0.06+Math.random()*0.20;
    windGain.gain.cancelScheduledValues(t);
    windGain.gain.setTargetAtTime(0.05+mag,t,0.5);
    windGain.gain.setTargetAtTime(0.05,t+1.6+Math.random()*2,1.4);
    windFilter.frequency.setTargetAtTime(500+Math.random()*500,t,0.7);
    if(mag>0.16)sheetSnap(mag);
    gustClock();
  },6000+Math.random()*17000);
}
function sheetSnap(mag){
  var svg=document.getElementById("sheet"); if(!svg)return;
  var a=(Math.random()<.5?-1:1)*(2+mag*30);
  svg.style.transition="transform .12s ease-out";
  svg.style.transform="perspective(700px) rotateY("+a+"deg) rotateX("+(a/3)+"deg) translateX("+(a*1.5)+"px)";
  setTimeout(function(){
    svg.style.transition="transform .55s cubic-bezier(.15,1.5,.4,1)";
    svg.style.transform="none";
  },160);
  // paper flap
  var s=AC.createBufferSource(); s.buffer=noiseBuf(0.35);
  var f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=900;

  if(bright>0.45){
