  <meta name="outbox-spec-era" content="Right now, 4:41 in the afternoon, in the middle of a municipal leaf-collection season in a mid-sized city that the page never names — the sixth week of a nine-week route cycle, with a vacuum truck working the east side of a residential street and a second crew coming behind it with rakes. The page refuses to say the year and nothing in it tells you: the truck is from one decade, the radios are from another, the route map taped inside the cab door has been photocopied from a photocopy eleven times. Not autumn, not a mood, not a memory of childhood leaf piles: the hopper is at about two-thirds, the transfer site closes at 5:30, there are four hundred and ten linear feet of windrow left on this block, and a car is parked over the pile at 1144.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE PROGRESS BAR, rendered at true scale as a long horizontal strip running the full width of the screen and about an inch tall, sitting dead center with nothing above it and nothing below it — no header, no menu, no title, no footer, no percentage readout, no label, no cancel button, no scrollbar, no vertical scroll at any window size. The strangeness: THE BAR IS THE STREET. Its full length is the block's 1,410 linear feet of curb windrow, its filled portion is what has actually been vacuumed, and it does not advance smoothly — it advances in the real irregular bites a leaf truck takes, stalls entirely when the hose clogs, and OCCASIONALLY GOES BACKWARD, because wind puts leaves back onto curb that was already done and the crew re-does it. Inside the fill, at true relative position, are the actual obstructions the crew is working around: a parked car at 1144 rendering as a hard unfillable gap the bar simply flows past and leaves hollow, a storm grate, two driveway aprons, a section where the windrow is soaked through and moves at a fraction of the rate. The visitor's only vocabulary is what a hand does on a leaf truck: DRAG along the unfilled portion to move the nozzle boom and set where the suction is actually pointed, PRESS AND HOLD anywhere on the bar to run the impeller up, and SCRUB back and forth over a stalled section to work a clog loose. The bar never reaches the end, because the route is longer than the day.">
  <meta name="outbox-spec-subject" content="The flat mechanics of municipal loose-leaf collection, which is almost entirely a moisture-and-bulk-density problem and has nothing whatsoever to do with autumn. That a cubic yard of dry loose leaves weighs something like 250 pounds and the identical cubic yard rained on for two days weighs close to 800, so a truck that fills its 25-yard hopper by volume on a dry Tuesday hits its legal axle weight at half a hopper on a wet Thursday and has to leave — which means the route's real capacity is set by the weather three days ago and not by how much anybody vacuumed. That the blower is not a fan drawing leaves up a tube, it is a HIGH-VELOCITY IMPELLER that the leaves pass THROUGH and get shredded by, which is the entire reason the system works at all: whole leaves at their natural bulk density would fill the hopper in four hundred feet, and the impeller's shredding takes the density up by a factor of three or four. That a shredding impeller is therefore doing the compaction, and an impeller with worn blade tips shreds worse, fills the hopper faster with fewer leaves, and the crew notices it as more trips to the transfer site and not as a blade problem. That AIRSPEED IN THE HOSE IS THE WHOLE VARIABLE AND IT IS NOT ADJUSTABLE UPWARD: the system needs roughly 5,000 feet per minute of air in an 8- or 10-inch tube to keep material in suspension, below that leaves drop out of the airstream and lie down inside the hose, and once they lie down they catch the next thing and the clog builds from that point in both directions. That a clog is therefore almost never at the nozzle where the operator is looking. That AIRSPEED FALLS WHEN THE NOZZLE IS BURIED, because a nozzle jammed into a pile has no air path and the impeller is trying to move solid material with nothing to carry it — so the correct technique is to keep the nozzle at the EDGE of the windrow and let air in behind, which looks slower and is measurably faster, and every new operator buries the nozzle. That WET LEAVES DO NOT MERELY WEIGH MORE, THEY STICK: the friction coefficient of a wet leaf mat against asphalt is high enough that suction alone will not lift a soaked windrow, and the mat has to be broken with a rake first, which is why there is a second crew and why the second crew is the actual rate limit of the operation. That a wet windrow left more than about four days begins to compost — it heats, it mats into a felt, and at that point it is not leaf collection, it is shoveling. That STICKS ARE THE SINGLE MOST EXPENSIVE THING A RESIDENT CAN PUT IN A PILE: a branch over about an inch and a half jams the impeller housing, and clearing it is a shutdown, a lockout and twenty minutes, and the arithmetic is that one branch costs more route-feet than an entire block of leaves gains. That rocks are worse and throw blade balance permanently. That a PARKED CAR IS NOT AN INCONVENIENCE, IT IS A GAP THAT NEVER GETS FILLED: the crew cannot vacuum under it, the route does not come back for nine weeks, and that leaf mass goes into the storm drain at the first rain — which is the actual reason the program exists, because leaf litter in stormwater is a phosphorus load, and a city's entire loose-leaf budget is usually justified on a nutrient-loading number and not on tidiness. That the phosphorus arithmetic is honest and ugly: leaves sitting on pavement leach dissolved phosphorus within days, and pavement leaching is several times worse than leaves on a lawn, so the program's whole benefit depends on getting them off the HARD SURFACE and not on getting them at all. That TRANSFER-SITE CYCLE TIME IS THE REAL SCHEDULE: a round trip is however long it is, the site closes at a stated hour, and a truck that fills its hopper at twenty past five has an hour of leaves it cannot legally leave on the truck overnight in a composting mass because a loaded hopper of wet leaves genuinely self-heats. That STREET SWEEPERS ARE A DIFFERENT MACHINE ENTIRELY and cannot do this — a mechanical broom sweeper's hopper is sized for grit and it fills on leaves in two blocks. That WINDROW PLACEMENT IS A RESIDENT BEHAVIOR PROBLEM WITH A REAL COST: leaves in the gutter line are collectible, leaves on the grass strip behind the curb are not reachable by a truck-mounted boom, and leaves in the street beyond the gutter are a traffic hazard and get a different crew. And the flat arithmetic on the block: 1,410 feet of curb, about 410 left, a hopper at two-thirds, a site that closes at 5:30, one car at 1144, and a wind out of the northwest at eleven.">
  <meta name="outbox-spec-tone" content="There is no narrator, no caption, no voice and no written sentence anywhere on the page. The register lives entirely in the bar's own behavior and in the sound, and that register is LOUD, ROUGH, UNEVEN, INTERRUPTED AND SLIGHTLY BEHIND SCHEDULE — a fill that surges when the windrow is dry and loose, crawls when it is soaked, stops dead and stays stopped for a genuinely uncomfortable number of seconds when something jams, and gives back ground it had already taken when a gust comes through. The pace is not graceful and is never rhythmic. Nothing waits for the visitor, nothing performs, nothing is arranged to be admired, and the truck keeps working whether or not anybody touches the bar. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT cozy, NOT autumnal, NOT ASMR, NOT oddly-satisfying, NOT a process-video, NOT a screensaver, NOT stately, NOT reverent — this is 4:41 in the afternoon with a hopper at two-thirds and forty-nine minutes until the site closes.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the bar's fill color is COMPUTED and never chosen. The ground is the unfilled portion of the strip: dry asphalt with a curb line, a flat cool gray-black (#3a3b38) going paler and grittier where tires have polished it (#6e6f68), with real aggregate texture and a faint sun-bleached band along the top edge. The filled portion is NOT a color anybody picked — each of the fourteen hundred one-foot segments stores an actual leaf species mix, an actual moisture fraction, an actual days-on-pavement figure and an actual compaction state, and its rendered color falls out of those four: a fresh dry segment of mixed maple and oak reads a bright ochre-russet (#b5732a) with real per-leaf variation and hard edges; the same segment after two days of rain reads a saturated dark umber (#5a3a1c) with a glossy wet specular; a segment that has been down six days and started to heat reads a flat felted gray-brown (#4a4238) with no variation left in it at all, and a segment that is mostly silver maple reads measurably paler and yellower (#c9a441) than the same segment of pin oak. Nobody anywhere picks a leaf color. The unfillable gap at 1144 is bare polished pavement, exactly the ground color, and is distinguishable from unfilled curb only by the fact that the fill goes around it. Exactly one chip of amber beacon orange (#f08a12) is held strictly for three things: the strobe reflection that sweeps the full length of the bar every 1.4 seconds at true rotation rate, the cone markers at the two driveway aprons, and the hard edge of the nozzle boom wherever it currently sits. It never appears in the leaves, never in the pavement, never in the gap. Flat, hard, high contrast; no glow, no bloom, no soft focus, no vignette, no gradients other than honest wetness specular, honest compaction and honest strobe sweep.">
  <meta name="outbox-spec-wildcard" content="Somewhere in the windrow there is a garden hose. About eleven feet of half-inch vinyl hose, run over by a mower at some point and raked into the pile at the end of a yard, and the engine gives it exactly the properties eleven feet of vinyl hose has and no others: it is too flexible to jam the boom and too tough to shred, so it enters the intake, wraps the impeller shaft, and every single revolution after that it drags — a permanent, computed, irreversible parasitic torque that lowers the impeller's attainable rpm by a real amount and therefore lowers the airspeed ceiling for the rest of this visit and every visit after it. It cannot be cleared, cut, backed out, marked, avoided or seen coming; it is at the same segment position on every visit because the yard it came from is still the yard it came from, and a visitor who has already picked it up on a previous visit does not encounter it again and simply has a truck that never quite pulls what it used to.">

<body>
<canvas id="bar"></canvas>
<a id="way" href="/archive" aria-label="other work on the route"></a>
<script>
(function(){
"use strict";
var N=1410, KEY="eastside.windrow.v1";
var cv=document.getElementById("bar"), ctx=cv.getContext("2d");
var off=document.createElement("canvas"), octx=off.getContext("2d");
var cw=0, ch=0, dpr=1;

/* ---------- segment state ---------- */
var mass=new Float32Array(N), moist=new Float32Array(N), silver=new Float32Array(N),
    days=new Float32Array(N), raked=new Uint8Array(N), stick=new Float32Array(N),
    rock=new Uint8Array(N), car=new Uint8Array(N), apron=new Uint8Array(N),
    grate=new Uint8Array(N), gardenhose=new Uint8Array(N), polish=new Float32Array(N),
    dirty=new Uint8Array(N);

function seedrand(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function dens(w){return 250+560*w;}

function buildFixtures(){
  var i;
  for(i=1136;i<=1155;i++) car[i]=1;
  for(i=1042;i<=1056;i++) apron[i]=1;
  for(i=1298;i<=1312;i++) apron[i]=1;
  for(i=1187;i<=1190;i++) grate[i]=1;
  for(i=1204;i<=1214;i++) gardenhose[i]=1;
  stick[1078]=2.1; stick[1263]=0.9; stick[1351]=1.8; rock[1319]=1;
}

function seedWindrow(R,fresh){
  for(var i=0;i<N;i++){
    var yard=Math.floor(i/37);
    silver[i]=clamp(0.22+0.62*hash(yard,3)+0.08*(hash(i,9)-0.5),0,1);
    var w=0.13+0.09*hash(yard,11)+0.03*(hash(i,4)-0.5);
    var d=2+2.4*hash(yard,17);
    if(i>=1246&&i<=1332){ w=0.68+0.12*hash(i,21); d=4.3+1.9*hash(yard,23); }
    if(i>=1246&&i<=1281){ d=6.0+0.6*hash(i,29); }
    moist[i]=clamp(w,0.05,0.93); days[i]=d; raked[i]=0;
    polish[i]=0.18+0.55*hash(yard,31)*hash(i,37);
    var vol=0.041+0.011*hash(i,41)+0.006*Math.sin(i*0.21);
    if(apron[i]) vol*=0.45;
    if(grate[i]) vol*=0.7;
    var m=vol*dens(moist[i]);
    if(fresh && i<1000) m=0;
    mass[i]=m;
  }
  if(!fresh){ for(var j=0;j<N;j++){ if(car[j]) mass[j]=Math.max(mass[j],0.046*dens(moist[j])); } }
}

/* ---------- machine state ---------- */
var boom=1001.0, depth=0.26, held=false, rpm=620, fpm=0;
var blockMass=0, blockPos=0.5, blockDense=1;
var hopperVol=16.7, hopperMass=9800, bladeWear=0.07, parasitic=0, hoseTaken=false;
var trips=0, clogSec=0, feetCleared=0, poundsHauled=0, routeIdx=1;
var rakePos=1004, tripTimer=0, jamTimer=0, runSec=0;
var KSP=22.4/(2200*2200), RPMBASE=2200, HOPVOL=25, AXLE=13500;
var apPhase=0, lastInput=-99, tsec=0, impactAcc=0, lastBoom=boom, boomVel=0;
var windBase=11, gustUntil=0, gustVal=0, nextGust=8, nextCar=42, nextRake1=1.2, nextRake2=1.9, pulseGlow=0;

/* ---------- persistence ---------- */
function load(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ s=null; }
  buildFixtures();
  if(s&&s.m&&s.m.length===N){
    seedWindrow(seedrand(114411),false);
    for(var i=0;i<N;i++){
      var om=moist[i];
      mass[i]=s.m[i]; moist[i]=clamp(s.w[i],0.05,0.96); days[i]=s.d?s.d[i]:3;
      var add=car[i]?0.085:0.03;
      if(mass[i]>0){ var nw=clamp(moist[i]+add+0.05*hash(i,53),0.05,0.96);
        mass[i]*=dens(nw)/dens(moist[i]); moist[i]=nw; days[i]+=1; }
      om=om;
    }
    hopperVol=s.hv; hopperMass=s.hm; bladeWear=clamp(s.bw,0,1); parasitic=s.pa||0;
    hoseTaken=!!s.ht; trips=s.tr||0; clogSec=s.cl||0; feetCleared=s.ft||0;
    poundsHauled=s.lb||0; routeIdx=(s.rt||1)+1; boom=clamp(s.bp||1001,0,N-1); rakePos=s.rk||boom+8;
    var left=0; for(var k=0;k<N;k++){ if(!car[k]&&mass[k]>0.3) left++; }
    if(left<30){ seedWindrow(seedrand(114411+routeIdx*7),false); routeIdx++; boom=6; rakePos=14; }
  } else {
    seedWindrow(seedrand(114411),true);
  }
  if(hoseTaken){ for(var q=0;q<N;q++) gardenhose[q]=0; }
  for(var z=0;z<N;z++) dirty[z]=1;
}
function save(){
  try{
    var m=new Array(N),w=new Array(N),d=new Array(N);
    for(var i=0;i<N;i++){ m[i]=Math.round(mass[i]*10)/10; w[i]=Math.round(moist[i]*100)/100; d[i]=Math.round(days[i]*10)/10; }
    localStorage.setItem(KEY,JSON.stringify({m:m,w:w,d:d,hv:hopperVol,hm:hopperMass,bw:bladeWear,
      pa:parasitic,ht:hoseTaken,tr:trips,cl:Math.round(clogSec),ft:Math.round(feetCleared),
      lb:Math.round(poundsHauled),rt:routeIdx,bp:Math.round(boom),rk:Math.round(rakePos)}));
  }catch(e){}
}

/* ---------- audio ---------- */
var A={ok:false};
function audio(){
  if(A.ok) return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  var c; try{ c=new C(); }catch(e){ return; }
  A.ctx=c; A.ok=true;
  var comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=9;
  var mg=c.createGain(); mg.gain.value=0.85; mg.connect(comp); comp.connect(c.destination); A.mg=mg;
  var nb=c.createBuffer(1,Math.floor(c.sampleRate*2),c.sampleRate), nd=nb.getChannelData(0);
  for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  A.nb=nb;
  A.n=function(){ var s=c.createBufferSource(); s.buffer=nb; s.loop=true; s.start(); return s; };
  /* air rush */
  A.abp=c.createBiquadFilter(); A.abp.type="bandpass"; A.abp.frequency.value=700; A.abp.Q.value=0.7;
  A.ag=c.createGain(); A.ag.gain.value=0; A.n().connect(A.abp); A.abp.connect(A.ag); A.ag.connect(mg);
  /* street bed */
  var sl=c.createBiquadFilter(); sl.type="lowpass"; sl.frequency.value=280;
  var sg=c.createGain(); sg.gain.value=0.055; A.n().connect(sl); sl.connect(sg); sg.connect(mg);
  /* blower four houses down */
  var bb=c.createBiquadFilter(); bb.type="bandpass"; bb.frequency.value=1850; bb.Q.value=2.1;
  var bg=c.createGain(); bg.gain.value=0.026; A.n().connect(bb); bb.connect(bg); bg.connect(mg); A.bb=bb;
  /* diesel PTO at fast idle */
  var dso=c.createOscillator(); dso.type="sawtooth"; dso.frequency.value=29.5;
  var dlp=c.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value=230;
  var dg=c.createGain(); dg.gain.value=0.13; dso.connect(dlp); dlp.connect(dg); dg.connect(mg); dso.start();
  var hunt=c.createOscillator(); hunt.type="sine"; hunt.frequency.value=0.62;
  var hg=c.createGain(); hg.gain.value=1.35; hunt.connect(hg); hg.connect(dso.frequency); hunt.start(); A.dg=dg;
  var dn=c.createBiquadFilter(); dn.type="lowpass"; dn.frequency.value=130;
  var dng=c.createGain(); dng.gain.value=0.06; A.n().connect(dn); dn.connect(dng); dng.connect(mg);
  /* impeller blade pass */
  A.io=c.createOscillator(); A.io.type="sawtooth"; A.io.frequency.value=180;
  A.io2=c.createOscillator(); A.io2.type="square"; A.io2.frequency.value=360;
  A.ilp=c.createBiquadFilter(); A.ilp.type="lowpass"; A.ilp.frequency.value=1500;
  A.ig=c.createGain(); A.ig.gain.value=0.0;
  A.ig2=c.createGain(); A.ig2.gain.value=0.0;
  A.io.connect(A.ilp); A.ilp.connect(A.ig); A.ig.connect(mg);
  A.io2.connect(A.ig2); A.ig2.connect(mg); A.io.start(); A.io2.start();
  /* boom cylinder */
  A.bo=c.createOscillator(); A.bo.type="triangle"; A.bo.frequency.value=395;
  A.bg2=c.createGain(); A.bg2.gain.value=0; A.bo.connect(A.bg2); A.bg2.connect(mg); A.bo.start();
}
function burst(type,f,q,dur,gain,sweepTo){
  if(!A.ok) return; var c=A.ctx, t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=A.nb; s.loop=true;
  s.playbackRate.value=0.7+Math.random()*0.8;
  var b=c.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q;
  if(sweepTo) b.frequency.linearRampToValueAtTime(sweepTo,t+dur);
  var g=c.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+Math.min(0.012,dur*0.3));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(b); b.connect(g); g.connect(A.mg); s.start(t); s.stop(t+dur+0.05);
}
function knock(str){
  if(!A.ok) return; var c=A.ctx,t=c.currentTime;
  var o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(92,t);
  o.frequency.exponentialRampToValueAtTime(38,t+0.22);
  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.32*str,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  o.connect(g); g.connect(A.mg); o.start(t); o.stop(t+0.45);
  burst("lowpass",340,0.8,0.16,0.2*str);
}
function carPass(){
  if(!A.ok) return; var c=A.ctx,t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=A.nb; s.loop=true;
  var b=c.createBiquadFilter(); b.type="bandpass"; b.Q.value=0.9;
  b.frequency.setValueAtTime(170,t); b.frequency.linearRampToValueAtTime(640,t+2.2);
  b.frequency.linearRampToValueAtTime(190,t+4.6);
  var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.075,t+2.2); g.gain.linearRampToValueAtTime(0.0001,t+4.8);
  s.connect(b); b.connect(g); g.connect(A.mg); s.start(t); s.stop(t+5);
}

/* ---------- input ---------- */
var down=false, lastX=0, dirSign=0, revTimes=[], scrubSpeed=0;
function ftFromEvent(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/Math.max(1,r.width);
  var y=(e.clientY-r.top)/Math.max(1,r.height);
  return {f:clamp(x*N,0,N-1), d:clamp((y-0.10)/0.90,0.02,0.95)};
}
function press(e){
  audio(); if(A.ok&&A.ctx.state==="suspended") A.ctx.resume();
  down=true; held=true; lastInput=tsec;
  var p=ftFromEvent(e); boom=p.f; depth=p.d; lastX=p.f; revTimes.length=0;
  if(e.cancelable) e.preventDefault();
}
function move(e){
  if(!down) return; lastInput=tsec;
  var p=ftFromEvent(e);
  var dx=p.f-lastX;
  if(dx!==0){
    var s=dx>0?1:-1;
    if(dirSign!==0&&s!==dirSign){ revTimes.push(tsec); if(revTimes.length>14) revTimes.shift(); }
    dirSign=s;
  }
  scrubSpeed=scrubSpeed*0.7+Math.abs(dx)*60*0.3;
  boom=p.f; depth=p.d; lastX=p.f;
  if(e.cancelable) e.preventDefault();
}
function release(){ down=false; held=false; dirSign=0; }
cv.addEventListener("pointerdown",press);
window.addEventListener("pointermove",move,{passive:false});
window.addEventListener("pointerup",release);
window.addEventListener("pointercancel",release);
window.addEventListener("keydown",function(e){
  audio(); if(A.ok&&A.ctx.state==="suspended") A.ctx.resume();
  lastInput=tsec;
  if(e.key==="ArrowLeft"){ boom=clamp(boom-(e.shiftKey?10:1),0,N-1); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ boom=clamp(boom+(e.shiftKey?10:1),0,N-1); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ depth=clamp(depth-0.05,0.02,0.95); e.preventDefault(); }
  else if(e.key==="ArrowDown"){ depth=clamp(depth+0.05,0.02,0.95); e.preventDefault(); }
  else if(e.code==="Space"){ held=true; e.preventDefault(); }
  else if(e.key>="1"&&e.key<="9"){
    var k=parseInt(e.key,10), p=(k-0.5)/9;
    if(blockMass>0.2&&Math.abs(p-blockPos)<0.105){
      blockMass*=0.28; blockDense=Math.max(1,blockDense-0.32); knock(0.55); pulseGlow=0.5;
    } else { blockDense+=0.02; burst("bandpass",520,1.4,0.1,0.09); pulseGlow=0.25; }
    e.preventDefault();
  }
});
window.addEventListener("keyup",function(e){ if(e.code==="Space") held=false; });
window.addEventListener("blur",function(){ held=false; down=false; });

/* ---------- physics ---------- */
function update(dt){
  tsec+=dt; runSec+=dt;
  /* wind on its own clock */
  if(tsec>nextGust){ gustVal=7+10*Math.random(); gustUntil=tsec+2+3*Math.random(); nextGust=tsec+9+16*Math.random(); }
  var wind=windBase+3.4*Math.sin(tsec*0.13)+(tsec<gustUntil?gustVal:0);
  if(wind>15.5){
    var moved=(wind-15.5)*0.055*dt;
    for(var t=0;t<3&&moved>0;t++){
      var src=Math.round(boom+2+Math.random()*46);
      if(src<0||src>=N||car[src]||mass[src]<0.6||moist[src]>0.31) continue;
      var dst=Math.round(boom-3-Math.random()*44);
      if(dst<0||dst>=N||car[dst]) continue;
      var dm=Math.min(mass[src],moved*(0.6+Math.random()));
      var tot=mass[dst]+dm;
      if(tot>0) moist[dst]=(moist[dst]*mass[dst]+moist[src]*dm)/tot;
      mass[src]-=dm; mass[dst]+=dm; if(mass[src]<0.05) mass[src]=0;
      dirty[src]=1; dirty[dst]=1; moved-=dm;
    }
  }
  /* rake crew, ahead of the boom, slower on soaked mat */
  var target=Math.min(N-1,boom+13);
  if(rakePos<target){
    var ri=Math.round(clamp(rakePos,0,N-1));
    var rspeed=0.95/(1+2.6*moist[ri]);
    rakePos=Math.min(target,rakePos+rspeed*dt);
    for(var q=Math.round(rakePos)-1;q<=Math.round(rakePos);q++) if(q>=0&&q<N) raked[q]=1;
  } else if(rakePos>target+26){ rakePos=target+26; }
  /* transfer trip / stick lockout */
  if(tripTimer>0){ tripTimer-=dt; if(tripTimer<=0){ hopperVol=0.6; hopperMass=420; trips++; } }
  if(jamTimer>0){ jamTimer-=dt; clogSec+=dt; }
  /* autopilot when nobody has a hand on it */
  var auto=(tsec-lastInput)>4;
  if(auto){
    apPhase+=dt;
    depth=0.22+0.17*Math.sin(apPhase*0.23)+0.08*Math.sin(apPhase*0.79);
    if(fpm>4600&&tripTimer<=0&&jamTimer<=0) boom=clamp(boom+0.5*dt,0,N-1);
    if(blockMass>4&&Math.sin(apPhase*0.52)>0.985){ blockMass*=0.72; knock(0.25); }
  }
  /* impeller */
  var rpmMax=RPMBASE-parasitic;
  var thr=(tripTimer>0||jamTimer>0)?0:(held?1.0:0.862);
  var tgt=thr*rpmMax;
  if(tripTimer>0) tgt=0;
  var load=0;
  var i0=Math.round(clamp(boom,0,N-1));
  /* airflow */
  var mAt=mass[i0]||0;
  var buryTerm=40*Math.pow(depth,1.8)*(Math.max(mAt,2)/12)+blockMass*blockDense*0.9;
  var SP=KSP*rpm*rpm;
  var VP=Math.max(0,(SP-buryTerm)/6.5);
  fpm=4005*Math.sqrt(VP);
  var take=0;
  if(tripTimer<=0&&jamTimer<=0){
    var suspend=clamp((fpm-4200)/3000,0,1);
    var contact=Math.min(1,depth*3.2), airPath=clamp(1-1.15*depth,0,1);
    var rate=27*contact*airPath*suspend;
    var remaining=rate*dt;
    var order=[0,1,-1];
    for(var oi=0;oi<3&&remaining>0;oi++){
      var i=i0+order[oi];
      if(i<0||i>=N||car[i]||mass[i]<=0) continue;
      var mf=raked[i]?1:clamp(1-1.5*moist[i],0.03,1);
      var dm=Math.min(mass[i],remaining*mf);
      if(dm<=0) continue;
      mass[i]-=dm; remaining-=dm; take+=dm;
      if(mass[i]<0.05){
        mass[i]=0; feetCleared+=1;
        if(gardenhose[i]&&!hoseTaken){
          hoseTaken=true; parasitic+=120;
          for(var g2=0;g2<N;g2++) gardenhose[g2]=0;
          burst("bandpass",340,0.6,1.35,0.22,120); knock(0.4);
        }
        if(stick[i]>0){
          if(stick[i]>1.5){ jamTimer=42; knock(1.0); rpm*=0.35; }
          else { knock(0.45); rpm*=0.88; }
          stick[i]=0;
        }
        if(rock[i]){ rock[i]=0; bladeWear=clamp(bladeWear+0.055,0,1); knock(0.9); rpm*=0.6; }
      }
      dirty[i]=1;
    }
    if(take>0){
      poundsHauled+=take;
      var comp=Math.max(1.6,3.65-1.5*bladeWear);
      hopperMass+=take;
      hopperVol+=take/(dens(moist[i0])*comp);
      bladeWear=clamp(bladeWear+take*2.4e-6,0,1);
      load=take/dt;
      impactAcc+=take;
      if(fpm<5000){
        if(blockMass<=0.05) blockPos=clamp(fpm/9000,0.06,0.92);
        blockMass+=take*(1-fpm/5000)*0.58;
      }
      if(hopperVol>=HOPVOL||hopperMass>=AXLE) tripTimer=70;
    }
    if(fpm>6600&&blockMass>0) blockMass-=dt*0.62*(fpm-6600)/2000;
  }
  if(blockMass>1) clogSec+=dt;
  if(blockMass<0) blockMass=0;
  /* scrubbing */
  if(down){
    var recent=0;
    for(var r2=0;r2<revTimes.length;r2++) if(tsec-revTimes[r2]<1) recent++;
    if(blockMass>0.2){
      if(recent>=3&&scrubSpeed>26){
        var reach=Math.max(0,1-blockPos*1.25);
        blockMass-=2.6*dt*(scrubSpeed/40)*reach;
        if(Math.random()<dt*9) burst("bandpass",900,1.1,0.07,0.06);
      } else if(recent>=1&&scrubSpeed<18){
        blockDense+=0.34*dt;
      }
    }
    scrubSpeed*=Math.pow(0.2,dt);
  } else scrubSpeed*=Math.pow(0.02,dt);
  blockDense=clamp(blockDense,1,4.2);
  /* rpm integration with real load-down */
  rpm+=((tgt-load*11)-rpm)*Math.min(1,dt*2.4);
  if(rpm<0) rpm=0;
  boomVel=boomVel*0.8+Math.abs(boom-lastBoom)*0.2; lastBoom=boom;
  pulseGlow*=Math.pow(0.05,dt);
  /* sound bed */
  if(A.ok){
    var bladeHz=Math.max(20,rpm/60*6);
    A.io.frequency.setTargetAtTime(bladeHz,A.ctx.currentTime,0.05);
    A.io2.frequency.setTargetAtTime(bladeHz*2,A.ctx.currentTime,0.05);
    var ia=0.085*Math.pow(rpm/2200,2.1);
    A.ig.gain.setTargetAtTime(ia,A.ctx.currentTime,0.08);
    A.ig2.gain.setTargetAtTime(ia*0.22,A.ctx.currentTime,0.08);
    A.ilp.frequency.setTargetAtTime(700+rpm*0.55,A.ctx.currentTime,0.1);
    A.abp.frequency.setTargetAtTime(240+fpm*0.13,A.ctx.currentTime,0.08);
    A.ag.gain.setTargetAtTime(Math.min(0.13,fpm*0.0000175),A.ctx.currentTime,0.12);
    A.dg.gain.setTargetAtTime(tripTimer>0?0.02:0.13,A.ctx.currentTime,0.5);
    A.bg2.gain.setTargetAtTime(Math.min(0.05,boomVel*0.012),A.ctx.currentTime,0.05);
    A.bb.frequency.setTargetAtTime(1700+220*Math.sin(tsec*0.17),A.ctx.currentTime,0.6);
    while(impactAcc>0.33){
      impactAcc-=0.33;
      var wet=moist[i0]>0.45;
      if(wet) burst("lowpass",520+260*Math.random(),0.9,0.055,0.045+0.03*Math.random());
      else burst("bandpass",2400+2200*Math.random(),1.3,0.03,0.05+0.04*Math.random());
    }
    if(tsec>nextRake1){ burst("bandpass",2600+700*Math.random(),0.8,0.17,0.055,1500); nextRake1=tsec+0.62+Math.random()*0.55; }
    if(tsec>nextRake2){ burst("bandpass",3100+900*Math.random(),0.7,0.2,0.048,1700); nextRake2=tsec+0.83+Math.random()*0.7; }
    if(tsec>nextCar){ carPass(); nextCar=tsec+74+Math.random()*36; }
  }
}

/* ---------- drawing ---------- */
function segColor(i){
  var w=moist[i], s=silver[i], d=days[i];
  var r=160+41*s, g=95+69*s, b=26+39*s;
  var k=1-0.58*w;
  r*=k; g*=k*0.96; b*=k*0.9;
  var cf=clamp((d-3.5)/2.5,0,1)*clamp((w-0.35)/0.3,0,1);
  r=r+(74-r)*cf; g=g+(66-g)*cf; b=b+(56-b)*cf;
  return [r,g,b,cf,w];
}
function drawSeg(i){
  var px=cw/N, x0=Math.floor(i*px), x1=Math.max(x0+1,Math.ceil((i+1)*px)), w=x1-x0, h=ch;
  var bleach=Math.max(2,h*0.09), curbl=Math.max(1,h*0.028);
  var leafy=(mass[i]<=0.25&&!car[i]);
  if(!leafy){
    octx.fillStyle="#3a3b38"; octx.fillRect(x0,0,w,h);
    var p=polish[i]*(0.55+0.45*hash(i,61));
    octx.fillStyle="rgba(110,111,104,"+(0.22+0.5*p).toFixed(3)+")";
    octx.fillRect(x0,h*0.46,w,h*0.34);
    octx.fillStyle="rgba(110,111,104,"+(0.1+0.2*p).toFixed(3)+")";
    octx.fillRect(x0,h*0.80,w,h*0.2);
    for(var a=0;a<5;a++){
      var ay=bleach+hash(i,70+a)*(h-bleach-1);
      var lt=hash(i,90+a);
      octx.fillStyle=lt>0.5?"rgba(122,123,114,0.5)":"rgba(32,33,30,0.55)";
      octx.fillRect(x0,Math.floor(ay),w,1);
    }
  } else {
    var c=segColor(i), cf=c[3], wv=c[4];
    var top=bleach, hh=h-bleach, bands=Math.max(7,Math.round(hh/6));
    for(var bi=0;bi<bands;bi++){
      var j=(1-cf)*(hash(i,120+bi)-0.5)*0.42;
      var yy=top+hh*bi/bands, hb=Math.ceil(hh/bands)+0.5;
      var rr=clamp(c[0]*(1+j),0,255), gg=clamp(c[1]*(1+j*0.92),0,255), bb2=clamp(c[2]*(1+j*1.18),0,255);
      octx.fillStyle="rgb("+(rr|0)+","+(gg|0)+","+(bb2|0)+")";
      octx.fillRect(x0,yy,w,hb);
      if(wv>0.42&&hash(i,200+bi)>0.82){
        octx.fillStyle="rgba(198,196,178,"+(0.08+0.17*wv).toFixed(3)+")";
        octx.fillRect(x0,yy,w,Math.max(1,hb*0.42));
      }
    }
    octx.fillStyle="#3a3b38"; octx.fillRect(x0,0,w,bleach);
    octx.fillStyle="rgba(110,111,104,0.30)"; octx.fillRect(x0,bleach*0.35,w,bleach*0.65);
  }
  /* sun-bleached band along the top of the pavement */
  if(!leafy){ octx.fillStyle="rgba(140,140,128,0.13)"; octx.fillRect(x0,curbl,w,bleach-curbl); }
  /* curb line, cut at the driveway aprons */
  octx.fillStyle=apron[i]?"#4b4c46":"#232420";
  octx.fillRect(x0,0,w,curbl);
  if(grate[i]){
    octx.fillStyle="#26272400"; octx.fillStyle="#262723"; octx.fillRect(x0,bleach,w,h*0.42);
    if((i%2)===0){ octx.fillStyle="#585950"; octx.fillRect(x0,bleach+2,w,h*0.34); }
  }
  dirty[i]=0;
}
function rebuild(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  var rect=cv.getBoundingClientRect();
  cw=Math.max(320,Math.floor(rect.width*dpr));
  ch=Math.max(40,Math.floor(rect.height*dpr));
  cv.width=cw; cv.height=ch; off.width=cw; off.height=ch;
  octx.imageSmoothingEnabled=false;
  for(var i=0;i<N;i++) drawSeg(i);
}
function render(){
  var d=0;
  for(var i=0;i<N;i++){ if(dirty[i]){ drawSeg(i); d++; if(d>400) break; } }
  ctx.clearRect(0,0,cw,ch);
  ctx.drawImage(off,0,0);
  var px=cw/N, bleach=Math.max(2,ch*0.09);
  /* cone markers at the two driveway aprons */
  ctx.fillStyle="#f08a12";
  var cones=[1049,1305];
  for(var ci=0;ci<2;ci++){
    var cx=(cones[ci]+0.5)*px, cyt=bleach+1, cyb=ch*0.55, cwid=Math.max(3,ch*0.085);
    ctx.beginPath(); ctx.moveTo(cx,cyt); ctx.lineTo(cx+cwid,cyb); ctx.lineTo(cx-cwid,cyb); ctx.closePath(); ctx.fill();
  }
  /* beacon sweep, one turn every 1.4 s */
  var p=(tsec%1.4)/1.4, bw=cw*0.062;
  ctx.fillStyle="rgba(240,138,18,0.30)"; ctx.fillRect(p*(cw+bw)-bw,0,bw,ch);
  var p2=((tsec+0.7)%1.4)/1.4;
  ctx.fillStyle="rgba(240,138,18,0.15)"; ctx.fillRect(p2*(cw+bw)-bw,0,bw*0.7,ch);
  /* nozzle boom */
  var bx=Math.floor(boom*px), bwid=Math.max(2,Math.round(2*dpr));
  var dy=bleach+(ch-bleach)*depth;
  ctx.fillStyle="#f08a12";
  ctx.fillRect(bx,0,bwid,dy);
  var notch=Math.max(3,Math.round((fpm/8000)*ch*0.24));
  ctx.fillRect(bx-Math.round(3*dpr),dy-bwid,Math.round(7*dpr),bwid);
  ctx.fillRect(bx-Math.round(1*dpr),dy,Math.round(3*dpr),notch);
  if(pulseGlow>0.02){ ctx.fillStyle="rgba(240,138,18,"+(0.25*pulseGlow).toFixed(3)+")"; ctx.fillRect(0,0,cw,Math.max(1,ch*0.02)); }
}

/* ---------- boot ---------- */
load();
rebuild();
window.addEventListener("resize",function(){ rebuild(); });
var lastT=performance.now(), saveT=0;
function frame(now){
  var dt=(now-lastT)/1000; lastT=now;
  if(dt>0.1) dt=0.1; if(dt<0) dt=0;
  update(dt); render();
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });
})();
</script>
