<title>Tonight the Lake Says Yes — Fireworks for One Hand</title>
<!-- Somewhere out on the water there is a rowboat. Two people are in it. They have not noticed the fireworks yet. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#07061a;color:#fff6e0;font-family:Georgia,"Palatino Linotype",serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .over{position:fixed;left:0;right:0;top:0;padding:clamp(14px,4vw,34px);text-align:center;pointer-events:none}
  h1{font-size:clamp(1.5rem,6vw,3.2rem);font-weight:normal;letter-spacing:.02em;
     background:linear-gradient(90deg,#ffd36e,#ff8fb8,#b9a6ff,#7fe6ff,#ffd36e);background-size:300% 100%;
     -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite;
     text-shadow:0 0 30px rgba(255,200,150,.15)}
  @keyframes shimmer{to{background-position:300% 0}}
  .sub{margin-top:.5em;font-style:italic;font-size:clamp(.9rem,3.4vw,1.1rem);opacity:.85}
  .count{margin-top:.6em;font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;opacity:.6}
  .finale{pointer-events:auto;margin-top:1em;font:inherit;font-size:.95rem;color:#2a1030;cursor:pointer;
     background:linear-gradient(180deg,#ffe7a3,#ffb86e);border:0;border-radius:999px;padding:.55em 1.3em;
     box-shadow:0 0 0 3px rgba(255,220,150,.25),0 0 24px rgba(255,180,110,.5);transition:transform .15s}
  .finale:active{transform:scale(.95)}
  .finale:disabled{opacity:.5;cursor:default}
  footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;text-align:center;font-size:.72rem;
     color:rgba(255,240,220,.55);pointer-events:none}
  footer a{pointer-events:auto;color:#ffd9a0;text-decoration:none;border-bottom:1px dotted rgba(255,217,160,.5)}
  footer small{display:block;margin-top:4px;font-size:.62rem;opacity:.6;letter-spacing:.04em}
</style>

<script defer src="/_vercel/insights/script.js"></script>

<body>
<canvas id="sky" role="img" aria-label="A night sky over a still lake. Touch anywhere and a firework rises from the water and blooms, and the lake blooms with it."></canvas>
<div class="over">
  <h1>Tonight the Lake Says Yes</h1>
  <p class="sub">Touch the sky anywhere you like. Higher sings higher. It's all for you.</p>
  <p class="count"><span id="n">0</span> lit so far</p>
  <button class="finale" id="fin" type="button">✦ the grand finale ✦</button>
</div>
<footer>
  <a href="/archive">every sky we've lit before →</a>
  <small>Best watched from the end of the dock, sitting next to somebody. Every thirteenth one is a heart, and you probably know why.</small>
</footer>
<script>
(function(){
  const c=document.getElementById('sky'),x=c.getContext('2d');
  const nEl=document.getElementById('n'),fin=document.getElementById('fin');
  let W,H,D,L,count=0,last=performance.now();
  const rockets=[],parts=[],stars=[];
  function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;L=Math.round(H*0.78);
    stars.length=0;for(let i=0;i<Math.floor(W*H/5000);i++)stars.push({x:Math.random()*W,y:Math.random()*L*0.95,r:Math.random()*1.2+.2,p:Math.random()*6});}
  addEventListener('resize',size);size();

  let ac=null;
  function audio(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}}
  const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
  function chime(ty){if(!ac)return;try{
    const i=Math.max(0,Math.min(SCALE.length-1,Math.floor((1-ty/L)*SCALE.length)));
    const f=220*Math.pow(2,SCALE[i]/12),t=ac.currentTime;
    [[f,'sine',.22],[f*2,'triangle',.06],[f*3.01,'sine',.03]].forEach(function(v){
      const o=ac.createOscillator(),g=ac.createGain();o.type=v[1];o.frequency.value=v[0];
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v[2],t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+2.7);});
    const len=ac.sampleRate*.5,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
    for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3);
    const s=ac.createBufferSource(),lp=ac.createBiquadFilter(),g2=ac.createGain();
    s.buffer=b;lp.type='lowpass';lp.frequency.value=380;g2.gain.value=.35;s.connect(lp);lp.connect(g2);g2.connect(ac.destination);s.start(t);
  }catch(e){}}

  const TYPES=['peony','ring','willow','double','peony','crossette'];
  function launch(tx,ty,type){
    ty=Math.max(H*0.08,Math.min(ty,L-40));
    rockets.push({x:tx+(Math.random()-.5)*30,y:L,tx:tx,ty:ty,hue:Math.random()*360,type:type});
  }
  function spark(px,py,vx,vy,hue,life,drag,g,sz){parts.push({x:px,y:py,vx:vx,vy:vy,hue:hue,life:life,max:life,drag:drag,g:g,sz:sz});}
  function explode(r){
    count++;nEl.textContent=count;
    let type=r.type||TYPES[Math.floor(Math.random()*TYPES.length)];
    if(count%13===0)type='heart';
    chime(r.ty);
    const n=type==='willow'?70:100;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2;
      if(type==='ring')spark(r.x,r.y,Math.cos(a)*3.2,Math.sin(a)*3.2,r.hue,80,.975,.035,2);
      else if(type==='heart'){const hx=16*Math.pow(Math.sin(a),3),hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
        spark(r.x,r.y,hx*.21,hy*.21,340+Math.random()*20,110,.975,.02,2.2);}
      else if(type==='willow'){const s=Math.random()*3+.5;spark(r.x,r.y,Math.cos(a)*s,Math.sin(a)*s,42,170,.985,.028,1.6);}
      else if(type==='double'){spark(r.x,r.y,Math.cos(a)*3.6,Math.sin(a)*3.6,r.hue,85,.975,.035,2);
        spark(r.x,r.y,Math.cos(a)*1.8,Math.sin(a)*1.8,(r.hue+150)%360,85,.975,.035,1.8);}
      else{const s=Math.random()*3.6+.4;spark(r.x,r.y,Math.cos(a)*s,Math.sin(a)*s,r.hue+(Math.random()*30-15),70+Math.random()*30,.972,.04,2);}
    }
    if(type==='crossette')setTimeout(function(){for(let j=0;j<5;j++){const a=j/5*Math.PI*2;
      rockets.push({x:r.x+Math.cos(a)*40,y:r.y+Math.sin(a)*40,tx:r.x,ty:r.y+Math.sin(a)*60,hue:(r.hue+j*60)%360,type:'ring',small:true,done:true});}},420);
  }

  c.addEventListener('pointerdown',function(e){audio();last=performance.now();launch(e.clientX,e.clientY);});
  addEventListener('keydown',function(e){if(e.code==='Space'){audio();last=performance.now();launch(Math.random()*W,Math.random()*L*.6+H*.08);e.preventDefault();}});
  fin.addEventListener('click',function(){audio();last=performance.now();fin.disabled=true;
    for(let i=0;i<28;i++)setTimeout(function(){launch(W*(.1+Math.random()*.8),H*(.08+Math.random()*.4),i===27?'heart':null);},i*140+Math.random()*80);
    setTimeout(function(){fin.disabled=false;},5200);});

  function frame(now){
    x.setTransform(D,0,0,D,0,0);
    const sg=x.createLinearGradient(0,0,0,L);
    sg.addColorStop(0,'rgba(7,6,26,.22)');sg.addColorStop(.7,'rgba(22,14,52,.22)');sg.addColorStop(1,'rgba(52,26,70,.22)');
    x.fillStyle=sg;x.fillRect(0,0,W,L);
    for(const s of stars){x.fillStyle='rgba(255,245,225,'+(.25+.25*Math.sin(now/700+s.p))+')';x.fillRect(s.x,s.y,s.r,s.r);}
    x.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];
      if(r.done){rockets.splice(i,1);explode({x:r.x,y:r.y,ty:r.ty,hue:r.hue,type:'peony'});continue;}
      const py=r.y;r.y-=(r.y-r.ty)*.055+1.4;r.x+=(r.tx-r.x)*.03;
      x.strokeStyle='hsla('+r.hue+',100%,85%,.9)';x.lineWidth=2;x.beginPath();x.moveTo(r.x,py+6);x.lineTo(r.x,r.y);x.stroke();
      if(Math.random()<.6)spark(r.x,r.y+4,(Math.random()-.5)*.5,Math.random()*.8,40,22,.95,.02,1);
      if(r.y-r.ty<5){rockets.splice(i,1);explode(r);}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];
      p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.life--;
      if(p.life<=0||p.y>L){parts.splice(i,1);continue;}
      const k=p.life/p.max,fl=k<.3&&Math.random()<.4?0:1;
      x.fillStyle='hsla('+p.hue+',100%,'+(55+35*k)+'%,'+(k*fl)+')';
      x.beginPath();x.arc(p.x,p.y,p.sz*(.5+k*.6),0,6.283);x.fill();}
    x.globalCompositeOperation='source-over';
    const lg=x.createLinearGradient(0,L,0,H);lg.addColorStop(0,'#1a1238');lg.addColorStop(1,'#05040f');
    x.fillStyle=lg;x.fillRect(0,L,W,H-L);
    x.setTransform(1,0,0,-1,0,2*L*D);x.globalAlpha=.38;
    const sy=Math.max(0,(2*L-H))*D,sh=L*D-sy;
    if(sh>0)x.drawImage(c,0,sy,W*D,sh,0,sy,W*D,sh);
    x.globalAlpha=1;x.setTransform(D,0,0,D,0,0);
    x.strokeStyle='rgba(5,4,15,.45)';x.lineWidth=1;
    for(let y=L+3;y<H;y+=4+(y-L)*.06){x.beginPath();x.moveTo(0,y+Math.sin(now/900+y)*1.2);x.lineTo(W,y+Math.sin(now/900+y*1.3)*1.2);x.stroke();}
    x.fillStyle='rgba(255,230,190,.25)';x.fillRect(0,L,W,1);
    if(now-last>7000){last=now;launch(W*(.2+Math.random()*.6),H*(.15+Math.random()*.35));}
    requestAnimationFrame(frame);
  }
  x.fillStyle='#07061a';x.fillRect(0,0,W,H);
  setTimeout(function(){launch(W*.5,H*.3,'double');},600);
  requestAnimationFrame(frame);
  console.log('%c✦ You found the dock. Press SPACE and the sky answers without you having to aim. ✦','color:#ffd36e;font-size:13px');
  console.log('%cThe rowboat people said yes, by the way. They were asking each other the same question.','color:#ff8fb8;font-style:italic');
})();
</script>
