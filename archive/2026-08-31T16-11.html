  <meta name="outbox-spec-era" content="1988, right now — a quarter past eleven on a bright dry morning in the returns bay of a commercial laundry on Dawes Road, Bulawayo, Zimbabwe, where the week's hotel linen has come back from four properties in unmarked bundles because the tagging girl was off Monday and Tuesday and nobody did the tags">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport, edge to edge, is a single sheet of white cotton that is being FOLDED, and the folding never stops and never scrolls. The sheet fills the frame at load, flat, wrinkled, life-size, seen straight down under a bay light. Every eleven seconds a real fold executes across it with genuine cloth motion — the fabric lifts, travels, and lays down — and the sheet halves, and the viewport ZOOMS IN by exactly the same factor so the folded bundle still fills the frame edge to edge. The visible cloth is therefore always the same apparent size and always more layers thick, and the wrinkles, the hem stitching, the laundry mark and the pressing shine all grow with it until a single crease is a canyon across the whole page. The count of layers is never printed. There is no header, no menu, no title, no scrollbar, no button, no counter, no explanation. The visitor's entire vocabulary is two gestures: drag anywhere across the cloth to SMOOTH it, which genuinely flattens wrinkle geometry in that region before the next fold arrives and therefore changes what every subsequent fold inherits; and press and hold on any spot to PIN a thumb there, which the next fold has to fold around, producing a real permanent diagonal wrinkle that will be doubled and doubled and doubled and is still there, enormous, forty folds later. Nothing scrolls. Nothing resets. The sheet never runs out of folds.">
  <meta name="outbox-spec-subject" content="The flat physical business of folding, and specifically what folding does to a flat piece of cloth that laundries have to work around every day — that a fold is not a decoration, it is a doubling, and thickness goes as 2^n while area goes as 1/2^n, so a queen flat sheet at eight folds is 256 layers and will not go through a roller ironer at any speed; that the real limit on folding anything is not size but the RATIO of length to thickness, because at every fold the material at the crease has to travel around the outside of the whole stack and there is only so much of it, which is why a 0.4 mm sheet runs out of folds at nine or ten no matter how big you started; that the crease is where the fibre is bent past its elastic recovery and cotton takes a permanent set at the crease if it is folded warm out of the dryer, which is exactly why hotel linen is folded warm on purpose and domestic linen is folded cool and comes out limp; that a wrinkle already in the cloth is not smoothed by folding, it is DOUBLED, so one careless spot at fold two is four identical marks at fold four and sixty-four at fold eight, all in a hard geometric grid, and the grid is diagnostic — a laundress reading a returned sheet can tell you which fold went wrong by counting the spacing of the repeats; that the pressing shine on a cotton weave is flattened fibre reflecting specularly and it lives only on the outside faces of a fold stack, so a bundle opened up shows shine in stripes; that the laundry mark is put in one corner precisely because that corner is the LAST thing folded in and stays outermost and readable in the stack, which is the whole reason it goes there and not in the middle; that hem stitching adds four layers of its own so a folded stack is always thicker along one edge and leans, and a leaning stack on a shelf is what makes hotel linen cupboards fall over; that the standard commercial fold sequence is thirds the long way then halves the short way, not halves-halves, because thirds produces a bundle that fits a shelf depth and halves-halves produces a square nobody can stack; and the flat arithmetic that four hotels came back untagged, that a sheet's property can still be identified from hem type, thread count and how many times it has been through a hot press, and that the driver comes back for the outbound at one.">
  <meta name="outbox-spec-tone" content="The written voice is nonexistent — there are no words on the page at all. The register lives entirely in the behaviour of the cloth, the light and the fold mechanism, and that register is BRISK, WARM, HEAVY-HANDED and INDUSTRIAL — cotton coming down with real weight and a real slap, folds executing at working speed with no ceremony and no pause for admiration, the bay light hard and flat and slightly greenish, the cloth genuinely warm from the dryer so it takes creases sharply and holds them. Nothing waits for the visitor. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT ASMR, NOT satisfying-video, NOT a screensaver, NOT dreamy, NOT precious — this is a stack that has to be on the shelf before the driver comes back at one.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The cloth is commercial bleached cotton in a hard bright white that is not pure — a faintly blue-tinted institutional white (#f2f4f1) that goes a shade warmer and yellower in the folded valleys (#e2ddcb) and reads a distinctly greyer, denser tone wherever layer count is high enough to block the bay light from below (#cfd2cd), so the number of layers is honestly visible in the value without ever being printed. Wrinkle geometry drives a real specular term, so a pressed flat region throws a hard broad sheen (#ffffff) and a crushed region goes matte and shadowed (#b7b9b3). The bay light is a warm dirty fluorescent and lands as a slightly greenish cast across the whole frame (#e8eee2). Exactly one chip of laundry-mark indelible violet (#5b4b96) is held strictly for the property mark stitched in one corner — it is folded in, folded in again, and after a certain number of folds it is simply not on the visible surface anymore and never comes back for the rest of the visit. Exactly one chip of blanket-stitch hem thread ochre (#b08a2e) for the hem run along one edge, which doubles and re-doubles into a visibly ribbed spine down one side of the bundle. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest layer opacity and honest specular from wrinkle slope.">
  <meta name="outbox-spec-wildcard" content="There is a single short black hair on the cloth, about four centimetres long, lying in a lazy curve. It is present in the first two seconds of every visit, in the same place. It is folded and doubled by the fold engine exactly like every other mark on the sheet, so it becomes two hairs, then four, then eight, in the correct grid, and by fold seven there are a hundred and twenty-eight of them lying in identical curves across the whole frame. It cannot be smoothed away, cannot be pinned, and is never accounted for by anything.">
  <meta name="outbox-spec-forbidden" content="NO folding-as-metaphor for anything — not memory, not compression, not how a life gets packed down, not layers-of-a-person, not 'everything is still in there', not intimacy, not domestic care, not the unpaid work of women; it is 2^n layers, a crease-travel limit and a permanent set in cotton fibre, and it has nothing to teach anybody. ABSOLUTELY NO infinity, recursion, fractal awe, Zeno, mathematics-as-poetry, sublime-pattern reverie, Borges, or 'the paper-folding problem' presented as a wonder — the folds run out because the outer layer physically cannot make the turn, and that is the entire content. NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, generative-art-gallery or screensaver framing whatsoever. NO domesticity sentiment: no mother folding sheets, no linen cupboard warmth, no smell of clean washing, no sun-dried-on-the-line lyricism, no comfort, no home. NO hotel melancholy, NO strangers'-beds unease, NO who-slept-here framing, NO liminal / uncanny / backrooms / analog-horror / SCP register about the vanishing laundry mark or the multiplying hair — nothing here is wrong. NO Zimbabwe travelogue, NO explaining a country to anybody, NO 1980s southern-Africa political framing, NO independence-era commentary, NO poverty pathos, NO aren't-they-resourceful condescension, NO heat-and-dust colour writing. NO labour sermon, NO dignity-of-the-worker sentiment, NO industrial-drudgery pathos. NO nostalgia, NO wistfulness, NO 'nobody folds anything properly anymore / the commercial laundries all closed' decline narrative — the driver comes back at one. NO sensuous material writing about cotton or light beyond thickness, weight, sheen, crease radius and layer count. NO purity / whiteness / blankness symbolism of any kind. NO archival / museum / cabinet / drawer / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is a quarter past eleven on a bright dry morning with the bay doors open. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the cloth, the light and the bay, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, tooltip, cursor label or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<!--
  bundle order: thirds the long way, halves the short way, halves, halves, halves.
  hem edge runs top of field, four layers of blanket stitch, it leans.
  driver back at one.
-->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#cfd2cd;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;}

<body>
<canvas id="c"></canvas>
<a class="tab" href="/archive" aria-label="the rest of the week's bundles" title=""></a>
<script>
(function(){
"use strict";

/* ---------- field ---------- */
var FW=256, FH=176, N=FW*FH;
var h=new Float32Array(N), st=new Float32Array(N), lay=new Float32Array(N),
    hem=new Float32Array(N), mk=new Float32Array(N);
var th=new Float32Array(N), ts=new Float32Array(N), tl=new Float32Array(N),
    tm=new Float32Array(N), te=new Float32Array(N);

var frameW=2600, frameH=1750;      /* mm of cloth across the frame */
var segX=1, segY=1;                /* bands, dyadic (and one third) */
var layersAvg=1;
var foldN=0;
var markVisible=true;
var markCell={x:16,y:13};

var hairs=[];                       /* {x,y,rot,flip} in field cells */
var pins=[];                        /* {n,u,v} persisted */

function hash(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  var a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){
  var s=0,a=.5,f=1;
  for(var i=0;i<4;i++){ s+=a*vn(x*f,y*f); f*=2.07; a*=.5; }
  return s;
}

function line(x0,y0,x1,y1,amp,wid,setv,layAdd){
  var dx=x1-x0, dy=y1-y0, L=Math.max(1,Math.hypot(dx,dy)|0);
  for(var s=0;s<=L;s++){
    var t=s/L, cx=x0+dx*t, cy=y0+dy*t;
    for(var oy=-wid;oy<=wid;oy++)for(var ox=-wid;ox<=wid;ox++){
      var X=Math.round(cx+ox), Y=Math.round(cy+oy);
      if(X<0||Y<0||X>=FW||Y>=FH)continue;
      var d=Math.hypot(ox,oy)/(wid+.001);
      if(d>1)continue;
      var w=(1-d)*(1-d);
      var i=Y*FW+X;
      h[i]+=amp*w;
      if(setv!==undefined) st[i]=Math.max(st[i],setv*w);
      if(layAdd) lay[i]+=layAdd*w;
    }
  }
}

function initField(){
  for(var y=0;y<FH;y++)for(var x=0;x<FW;x++){
    var i=y*FW+x;
    var f=fbm(x*0.055, y*0.115);          /* streaks the long way, out of the drum */
    var g=fbm(x*0.21+40, y*0.19+11);
    h[i]=(f-0.5)*1.05 + (g-0.5)*0.32;
    st[i]=0.10+g*0.16;
    lay[i]=1;
    hem[i]=0; mk[i]=0;
  }
  /* blanket-stitch hem run, top edge, four layers of its own */
  for(var x2=0;x2<FW;x2++)for(var y2=0;y2<4;y2++){
    var j=y2*FW+x2; hem[j]=1; lay[j]+=3; h[j]+=0.35+0.18*Math.sin(x2*0.9);
    st[j]=1;
  }
  /* the careless spot: crushed at the machine, counts as one at fold zero */
  line(74,96,96,112,1.35,4,1.0,0);
  line(80,120,70,132,0.9,3,0.9,0);
  /* a couple of drum creases already set */
  line(0,58,FW-1,44,0.55,2,0.75,0);
  line(190,0,168,FH-1,0.45,2,0.7,0);
  /* property mark, indelible violet, one corner */
  for(var my=markCell.y-4;my<=markCell.y+4;my++)
    for(var mx=markCell.x-6;mx<=markCell.x+6;mx++){
      if(mx<0||my<0||mx>=FW||my>=FH)continue;
      var d=Math.hypot((mx-markCell.x)/6,(my-markCell.y)/4);
      if(d<1) mk[my*FW+mx]=Math.pow(1-d,0.55);
    }
  /* one short black hair, lazy curve, four centimetres */
  hairs=[{x:FW*0.61,y:FH*0.42,rot:0.7,flip:1}];
}

/* ---------- persistence: pins survive, in the same places ---------- */
try{
  var raw=localStorage.getItem("dawes.returns.pins");
  if(raw){ var p=JSON.parse(raw); if(p&&p.length) pins=p.slice(-60); }
}catch(e){ pins=[]; }
function savePins(){
  try{ localStorage.setItem("dawes.returns.pins", JSON.stringify(pins.slice(-60))); }catch(e){}
}

/* ---------- fold engine ---------- */
function schedule(n){
  if(n===0) return {axis:'x',seg:3};                 /* thirds the long way */
  return {axis:(n%2===1)?'y':'x', seg:2};            /* halves, short way first */
}
function refl(v,B){ var p=2*B; v=((v%p)+p)%p; if(v>=B) v=p-1-v; return v; }
function sampX(a,x,y){
  if(y<0)y=0; if(y>=FH)y=FH-1;
  if(x<0)x=0; if(x>FW-1)x=FW-1;
  var x0=Math.floor(x), x1=Math.min(FW-1,x0+1), f=x-x0, r=y*FW;
  return a[r+x0]*(1-f)+a[r+x1]*f;
}
function sampY(a,x,y){
  if(x<0)x=0; if(x>=FW)x=FW-1;
  if(y<0)y=0; if(y>FH-1)y=FH-1;
  var y0=Math.floor(y), y1=Math.min(FH-1,y0+1), f=y-y0;
  return a[y0*FW+x]*(1-f)+a[y1*FW+x]*f;
}

var lastFail=0;
function doFold(){
  var s=schedule(foldN), axis=s.axis, n=s.seg;
  var panel=(axis==='x')?frameW:frameH;
  var thick=0.40*layersAvg;
  var ratio=0.62*Math.PI*thick/panel;               /* the outer layer has to make the turn */
  var fr=Math.max(0,Math.min(4.2,ratio-1));
  lastFail=fr;

  var B=(axis==='x')?(FW/segX):(FH/segY);
  var A=(axis==='x')?FW:FH, P=(axis==='x')?FH:FW;
  var crook=fr*2.6, wob=fr*1.9;

  for(var q=0;q<P;q++){
    var off=crook*Math.sin(q/P*4.1+foldN)+wob*(hash(q,foldN)-0.5);
    for(var a=0;a<A;a++){
      var b=Math.floor(a/B), local=a-b*B;
      var partners;
      if(n===2) partners=[refl(B-1-local,B)];
      else partners=[refl(2*B/3-local,B), refl(4*B/3-local,B)];
      var ix=(axis==='x')?(q*FW+a):(a*FW+q);
      var sh=h[ix], sl=lay[ix], ss=st[ix], sm=mk[ix], se=hem[ix];
      for(var k=0;k<partners.length;k++){
        var pa=b*B+partners[k];
        var px,py;
        if(axis==='x'){ px=pa; py=q+off; sh+=sampX(h,px,py); sl+=sampX(lay,px,py);
          ss=Math.max(ss,sampX(st,px,py)); sm+=sampX(mk,px,py); se+=sampX(hem,px,py); }
        else{ px=q+off; py=pa; sh+=sampY(h,px,py); sl+=sampY(lay,px,py);
          ss=Math.max(ss,sampY(st,px,py)); sm+=sampY(mk,px,py); se+=sampY(hem,px,py); }
      }
      th[ix]=sh*0.60;                      /* crushed flat under the weight of the stack */
      tl[ix]=sl;
      ts[ix]=Math.min(1,Math.max(ss,0.30+Math.min(0.7,Math.abs(sh)*0.30)));
      tm[ix]=sm; te[ix]=se;
    }
  }
  h.set(th); lay.set(tl); st.set(ts); mk.set(tm); hem.set(te);

  /* crease lines at the fold axes; radius goes as stack thickness */
  var cellmm=(axis==='x')?(frameW/FW):(frameH/FH);
  var cw=Math.max(0.9, Math.min(B*0.62, (thick*1.35)/cellmm));
  cw*=(1+fr*1.6);
  var camp=1.25/(1+fr*1.1);
  var bands=Math.round((axis==='x')?segX:segY);
  for(var bi=0;bi<bands;bi++){
    var cuts=(n===2)?[B/2]:[B/3,2*B/3];
    for(var ci=0;ci<cuts.length;ci++){
      var pos=bi*B+cuts[ci];
      if(axis==='x') line(pos,0,pos+fr*3,FH-1,camp,Math.max(1,Math.round(cw)),1-fr*0.18,0);
      else line(0,pos,FW-1,pos+fr*3,camp,Math.max(1,Math.round(cw)),1-fr*0.18,0);
      if(fr>0.05){ /* layers slipping, crease going round and soft */
        var jx=(hash(bi*7+ci,foldN)-0.5)*fr*7;
        if(axis==='x') line(pos+jx,0,pos-jx,FH-1,-0.55*fr,Math.max(2,Math.round(cw*1.5)),0.5,0);
        else line(0,pos+jx,FW-1,pos-jx,-0.55*fr,Math.max(2,Math.round(cw*1.5)),0.5,0);
      }
    }
  }

  /* pins: the fold has to go round the thumb */
  for(var pi=0;pi<pins.length;pi++){
    if(pins[pi].n!==foldN) continue;
    var px2=pins[pi].u*FW, py2=pins[pi].v*FH;
    var L2=Math.min(FW,FH)*0.62;
    line(px2-L2*0.7,py2-L2*0.7,px2+L2*0.7,py2+L2*0.7,1.5,3,1.0,0);
    line(px2-L2*0.66,py2-L2*0.74,px2+L2*0.62,py2+L2*0.66,0.8,7,0.85,0.8);
    line(px2-L2*0.74,py2-L2*0.66,px2+L2*0.7,py2+L2*0.58,-0.7,6,0.85,0);
    for(var gy2=-5;gy2<=5;gy2++)for(var gx2=-5;gx2<=5;gx2++){
      var X2=Math.round(px2+gx2),Y2=Math.round(py2+gy2);
      if(X2<0||Y2<0||X2>=FW||Y2>=FH)continue;
      var i2=Y2*FW+X2; h[i2]-=0.9*Math.max(0,1-Math.hypot(gx2,gy2)/5); st[i2]=1; lay[i2]+=1;
    }
  }

  /* hairs double, and double, and double */
  var newHair=[];
  for(var hh=0;hh<hairs.length;hh++){
    var H0=hairs[hh]; newHair.push(H0);
    var av=(axis==='x')?H0.x:H0.y, per=(axis==='x')?H0.y:H0.x;
    var bb=Math.floor(av/B), lo=av-bb*B;
    var ps=(n===2)?[refl(B-1-lo,B)]:[refl(2*B/3-lo,B),refl(4*B/3-lo,B)];
    for(var pk=0;pk<ps.length;pk++){
      var na=bb*B+ps[pk];
      var nh={x:(axis==='x')?na:per, y:(axis==='x')?per:na,
              rot:(axis==='x')?-H0.rot:Math.PI-H0.rot, flip:-H0.flip};
      newHair.push(nh);
    }
  }
  hairs=newHair.length>760?newHair.slice(0,760):newHair;

  /* the mark: once a fold turns its corner under, it is not on the surface any more */
  var movingHigh=(foldN<3);
  if(markVisible){
    var mA=(axis==='x')?markCell.x:markCell.y;
    var mB2=(axis==='x')?(FW/segX):(FH/segY);
    var mloc=mA-Math.floor(mA/mB2)*mB2;
    var inHigh=(mloc>mB2*(n===2?0.5:0.333));
    if(inHigh!==movingHigh) markVisible=false;
  }

  if(axis==='x'){ frameW/=n; segX*=n; } else { frameH/=n; segY*=n; }
  layersAvg*=n;
  foldN++;
  return {fr:fr, axis:axis, n:n, thick:thick};
}

/* ---------- render ---------- */
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var off=document.createElement("canvas"); off.width=FW; off.height=FH;
var octx=off.getContext("2d");
var img=octx.createImageData(FW,FH);
var snap=document.createElement("canvas"), sctx=snap.getContext("2d");
var W=0,Hh=0,DPR=1;
var dirty=true;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; Hh=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(Hh*DPR);
  snap.width=cv.width; snap.height=cv.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  dirty=true;
}
window.addEventListener("resize",resize);

function destRect(fw,fh){
  var asp=fw/fh, dw,dh;
  if(W/Hh > asp){ dw=W; dh=W/asp; } else { dh=Hh; dw=Hh*asp; }
  return {x:(W-dw)/2, y:(Hh-dh)/2, w:dw, h:dh};
}

var C0=0.918,C1=0.933,C2=0.886;
function buildImage(){
  var d=img.data;
  for(var y=0;y<FH;y++){
    var ym=(y>0?y-1:y)*FW, yp=(y<FH-1?y+1:y)*FW, row=y*FW;
    for(var x=0;x<FW;x++){
      var i=row+x;
      var L=lay[i]; if(L<1)L=1;
      var k=Math.min(1,Math.log(L)/Math.LN2/11);
      var r=242+(207-242)*k, g=244+(210-244)*k, b=241+(205-241)*k;
      var xm=x>0?x-1:x, xp=x<FW-1?x+1:x;
      var gx=h[row+xp]-h[row+xm], gy=h[yp+x]-h[ym+x];
      var sp=Math.tanh((gx*1.55+gy*0.85)*1.15);
      var hv=h[i];
      var val=hv<0?Math.min(1,-hv*0.55):0;
      if(val>0){ r+=(226-r)*val*0.5; g+=(221-g)*val*0.5; b+=(203-b)*val*0.5; }
      if(sp>0){ var t1=sp*0.82; r+=(255-r)*t1; g+=(255-g)*t1; b+=(255-b)*t1; }
      else { var t2=-sp*0.88; r+=(183-r)*t2; g+=(185-g)*t2; b+=(179-b)*t2; }
      var he=hem[i];
      if(he>0.01){ var t3=Math.min(0.82,0.28*Math.log(1+he)/Math.LN2+0.22); r+=(176-r)*t3; g+=(138-g)*t3; b+=(46-b)*t3; }
      if(markVisible){ var mv=mk[i]; if(mv>0.02){ var t4=Math.min(0.92,mv*0.85); r+=(91-r)*t4; g+=(75-g)*t4; b+=(150-b)*t4; } }
      var o=i*4;
      d[o]=r*C0; d[o+1]=g*C1; d[o+2]=b*C2; d[o+3]=255;
    }
  }
  octx.putImageData(img,0,0);
}

function drawHairs(dr){
  var cellW=dr.w/FW, cellH=dr.h/FH;
  var mmPerCell=frameW/FW;
  var lenCells=Math.min(FW*0.085, 40/mmPerCell);
  var px=lenCells*cellW;
  if(px<3) px=3;
  ctx.lineCap="round";
  ctx.strokeStyle="rgba(22,20,17,0.86)";
  ctx.lineWidth=Math.max(1,Math.min(3.2,px*0.055));
  var lim=Math.min(hairs.length,760);
  for(var i=0;i<lim;i++){
    var Hd=hairs[i];
    var cx=dr.x+Hd.x*cellW, cy=dr.y+Hd.y*cellH;
    if(cx<-px||cy<-px||cx>W+px||cy>Hh+px) continue;
    var co=Math.cos(Hd.rot), si=Math.sin(Hd.rot);
    var f=Hd.flip;
    ctx.beginPath();
    var ax=-px*0.5, ay=0, bx=0, by=-px*0.34*f, ex=px*0.5, ey=px*0.10*f;
    function T(X,Y,o){ return [cx+(X*co-Y*si), cy+(X*si+Y*co)]; }
    var p0=T(ax,ay), p1=T(bx,by), p2=T(ex,ey);
    ctx.moveTo(p0[0],p0[1]);
    ctx.quadraticCurveTo(p1[0],p1[1],p2[0],p2[1]);
    ctx.stroke();
  }
}

function drawFlat(){
  var dr=destRect(frameW,frameH);
  ctx.imageSmoothingEnabled=true;
  ctx.fillStyle="#cfd2cd"; ctx.fillRect(0,0,W,Hh);
  ctx.drawImage(off,0,0,FW,FH,dr.x,dr.y,dr.w,dr.h);
  drawHairs(dr);
}

/* ---------- fold animation ---------- */
var anim=null;
function startFold(){
  var prevFW=frameW, prevFH=frameH, prevSegX=segX, prevSegY=segY;
  buildImage();
  var drOld=destRect(prevFW,prevFH);
  sctx.setTransform(1,0,0,1,0,0);
  sctx.clearRect(0,0,snap.width,snap.height);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  sctx.fillStyle="#cfd2cd"; sctx.fillRect(0,0,W,Hh);
  sctx.imageSmoothingEnabled=true;
  sctx.drawImage(off,0,0,FW,FH,drOld.x,drOld.y,drOld.w,drOld.h);
  var savedHairs=hairs.slice(0);
  var info=doFold();
  buildImage();
  var drNew=destRect(frameW,frameH);
  anim={t0:performance.now(),dur:1150,drOld:drOld,drNew:drNew,axis:info.axis,
        seg:info.n,bands:(info.axis==='x')?prevSegX:prevSegY,fr:info.fr,
        thick:info.thick,hit:false,oldHairs:savedHairs,oldFW:prevFW,oldFH:prevFH};
  if(info.fr>0.25) creak(info.fr);
}

function drawFolding(now){
  var p=Math.min(1,(now-anim.t0)/anim.dur);
  var e=p<0.72?(p/0.72):1;
  var ez=e*e*(3-2*e);
  var dr={
    x:anim.drOld.x+(anim.drNew.x-anim.drOld.x)*ez,
    y:anim.drOld.y+(anim.drNew.y-anim.drOld.y)*ez,
    w:anim.drOld.w+(anim.drNew.w-anim.drOld.w)*ez,
    h:anim.drOld.h+(anim.drNew.h-anim.drOld.h)*ez
  };
  ctx.fillStyle="#cfd2cd"; ctx.fillRect(0,0,W,Hh);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(snap,0,0,snap.width,snap.height,
     dr.x-(anim.drOld.x)*(dr.w/anim.drOld.w-1)-0, dr.y, dr.w, dr.h);

  /* the moving material, coming over with weight */
  var th2=Math.min(Math.PI,p/0.72*Math.PI);
  var co=Math.cos(th2), si=Math.sin(th2);
  var bands=Math.min(24,anim.bands);
  var axis=anim.axis;
  var scaleX=dr.w/anim.drOld.w, scaleY=dr.h/anim.drOld.h;
  if(bands<=24){
    var span=(axis==='x')?dr.w/anim.bands:dr.h/anim.bands;
    for(var bi=0;bi<bands;bi++){
      var start=(axis==='x')?(dr.x+bi*span):(dr.y+bi*span);
      var crease=start+span*(anim.seg===2?0.5:0.34);
      var halfLen=span-(crease-start);
      var proj=Math.abs(co)*halfLen;
      ctx.save();
      ctx.beginPath();
      if(axis==='x'){
        var lx=co>=0?crease:crease-proj;
        ctx.rect(lx,dr.y,proj,dr.h); ctx.clip();
        ctx.translate(crease,0);
        ctx.scale(co>=0?Math.abs(co):-Math.abs(co),1);
        ctx.translate(-crease,0);
        ctx.drawImage(snap,0,0,snap.width,snap.height,
          anim.drOld.x+(dr.x-anim.drOld.x),dr.y,dr.w,dr.h);
        ctx.restore();
        var flash=Math.pow(si,3);
        ctx.fillStyle="rgba(255,255,255,"+(0.30*flash)+")";
        ctx.fillRect(co>=0?crease:crease-proj,dr.y,proj,dr.h);
        ctx.fillStyle="rgba(120,124,116,"+(0.22*si*(1-Math.abs(co)))+")";
        ctx.fillRect(co>=0?crease-halfLen:crease,dr.y,halfLen*Math.abs(si),dr.h);
      } else {
        var ly=co>=0?crease:crease-proj;
        ctx.rect(dr.x,ly,dr.w,proj); ctx.clip();
        ctx.translate(0,crease);
        ctx.scale(1,co>=0?Math.abs(co):-Math.abs(co));
        ctx.translate(0,-crease);
        ctx.drawImage(snap,0,0,snap.width,snap.height,dr.x,dr.y,dr.w,dr.h);
        ctx.restore();
        var flash2=Math.pow(si,3);
        ctx.fillStyle="rgba(255,255,255,"+(0.30*flash2)+")";
        ctx.fillRect(dr.x,co>=0?crease:crease-proj,dr.w,proj);
        ctx.fillStyle="rgba(120,124,116,"+(0.22*si*(1-Math.abs(co)))+")";
        ctx.fillRect(dr.x,co>=0?crease-halfLen:crease,dr.w,halfLen*Math.abs(si));
      }
      if(ctx.getTransform===undefined){} 
    }
  }
  /* hairs on the moving sheet, before the swap */
  if(p<0.7){
    var keep=hairs; hairs=anim.oldHairs;
    var sfw=frameW; frameW=anim.oldFW;
    ctx.globalAlpha=1-p/0.75;
    drawHairs(dr);
    ctx.globalAlpha=1;
    frameW=sfw; hairs=keep;
  }
  if(p>0.62){
    var a2=Math.min(1,(p-0.62)/0.30);
    ctx.globalAlpha=a2;
    ctx.drawImage(off,0,0,FW,FH,anim.drNew.x,anim.drNew.y,anim.drNew.w,anim.drNew.h);
    drawHairs(anim.drNew);
    ctx.globalAlpha=1;
  }
  if(!anim.hit && p>0.66){ anim.hit=true; whump(anim.thick,anim.fr); }
  if(p>=1){ anim=null; dirty=true; }
}

/* ---------- interaction ---------- */
var down=false, lastPt=null, holdTimer=null, moved=0, downPt=null;
function toField(ev){
  var dr=destRect(frameW,frameH);
  var x=(ev.clientX-dr.x)/dr.w*FW, y=(ev.clientY-dr.y)/dr.h*FH;
  return {x:x,y:y};
}
function smooth(a,b,vel){
  var dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  var ux=L>0.001?dx/L:1, uy=L>0.001?dy/L:0;
  var R=13, steps=Math.max(1,Math.round(L));
  var strength=Math.min(0.55,0.16+vel*0.02);
  for(var s2=0;s2<=steps;s2++){
    var cx=a.x+dx*s2/steps, cy=a.y+dy*s2/steps;
    for(var oy=-R;oy<=R;oy++)for(var ox=-R;ox<=R;ox++){
      var X=Math.round(cx+ox), Y=Math.round(cy+oy);
      if(X<1||Y<1||X>=FW-1||Y>=FH-1)continue;
      var d=Math.hypot(ox,oy)/R; if(d>1)continue;
      var i=Y*FW+X;
      if(st[i]>0.55) continue;                 /* set at the crease: will not come out */
      var m1=h[Math.max(0,Math.min(FH-1,Math.round(Y+uy*2)))*FW+Math.max(0,Math.min(FW-1,Math.round(X+ux*2)))];
      var m2=h[Math.max(0,Math.min(FH-1,Math.round(Y-uy*2)))*FW+Math.max(0,Math.min(FW-1,Math.round(X-ux*2)))];
      var target=(m1+m2)*0.5;
      var w=(1-d)*(1-st[i]/0.55)*strength;
      h[i]+=(target-h[i])*w;
      h[i]*=1-0.06*w;
    }
  }
  dirty=true;
}
function placePin(pt){
  if(pt.x<0||pt.y<0||pt.x>=FW||pt.y>=FH) return;
  pins.push({n:foldN,u:pt.x/FW,v:pt.y/FH});
  savePins();
  for(var gy=-6;gy<=6;gy++)for(var gx=-6;gx<=6;gx++){
    var X=Math.round(pt.x+gx),Y=Math.round(pt.y+gy);
    if(X<0||Y<0||X>=FW||Y>=FH)continue;
    var d=Math.hypot(gx,gy)/6; if(d>1)continue;
    var i=Y*FW+X;
    h[i]-=1.05*(1-d); st[i]=1;
  }
  dirty=true;
  thumb();
}
cv.addEventListener("pointerdown",function(ev){
  ev.preventDefault(); startAudio();
  down=true; moved=0; downPt=toField(ev); lastPt=downPt;
  cv.setPointerCapture(ev.pointerId);
  holdTimer=setTimeout(function(){ if(down&&moved<9) placePin(downPt); holdTimer=null; },430);
},{passive:false});
cv.addEventListener("pointermove",function(ev){
  if(!down) return;
  ev.preventDefault();
  var p=toField(ev);
  var d=Math.hypot(p.x-lastPt.x,p.y-lastPt.y);
  moved+=d;
  if(moved>9 && holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  if(moved>9){ smooth(lastPt,p,d); hiss(d); }
  lastPt=p;
},{passive:false});
function endPtr(ev){
  down=false;
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  hiss(0);
}
cv.addEventListener("pointerup",endPtr);
cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("contextmenu",function(e){e.preventDefault();});

/* ---------- sound ---------- */
var AC=null,master=null,noiseBuf=null,hissG=null,hissF=null;
function noise(ctx2,secs){
  var b=ctx2.createBuffer(1,Math.floor(ctx2.sampleRate*secs),ctx2.sampleRate);
  var d=b.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function src(loop){
  var s2=AC.createBufferSource(); s2.buffer=noiseBuf; s2.loop=!!loop; return s2;
}
function startAudio(){
  if(AC) { if(AC.state==="suspended") AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  noiseBuf=noise(AC,2.2);
  master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);

  /* tunnel washers, down the far end */
  var w=src(true), wf=AC.createBiquadFilter(); wf.type="lowpass"; wf.frequency.value=96; wf.Q.value=1.1;
  var wg=AC.createGain(); wg.gain.value=0.34;
  w.connect(wf); wf.connect(wg); wg.connect(master); w.start();
  var lfo=AC.createOscillator(); lfo.frequency.value=0.37;
  var lg=AC.createGain(); lg.gain.value=0.13; lfo.connect(lg); lg.connect(wg.gain); lfo.start();
  var rum=AC.createOscillator(); rum.type="sine"; rum.frequency.value=43;
  var rg=AC.createGain(); rg.gain.value=0.05; rum.connect(rg); rg.connect(master); rum.start();

  /* roller ironer, somewhere to the left */
  var ir=src(true), ifl=AC.createBiquadFilter(); ifl.type="bandpass"; ifl.frequency.value=430; ifl.Q.value=6.5;
  var ig=AC.createGain(); ig.gain.value=0.035;
  ir.connect(ifl); ifl.connect(ig);
  if(AC.createStereoPanner){ var pn=AC.createStereoPanner(); pn.pan.value=-0.72; ig.connect(pn); pn.connect(master); }
  else ig.connect(master);
  ir.start();
  var ilfo=AC.createOscillator(); ilfo.frequency.value=2.6;
  var ilg=AC.createGain(); ilg.gain.value=0.012; ilfo.connect(ilg); ilg.connect(ig.gain); ilfo.start();

  /* office radio, no words in it */
  var rad=src(true), rf=AC.createBiquadFilter(); rf.type="bandpass"; rf.frequency.value=1350; rf.Q.value=11;
  var radg=AC.createGain(); radg.gain.value=0.016;
  rad.connect(rf); rf.connect(radg);
  if(AC.createStereoPanner){ var pn2=AC.createStereoPanner(); pn2.pan.value=0.55; radg.connect(pn2); pn2.connect(master); }
  else radg.connect(master);
  rad.start();
  var o1=AC.createOscillator(); o1.type="triangle"; o1.frequency.value=311;
  var o2=AC.createOscillator(); o2.type="triangle"; o2.frequency.value=467;
  var og=AC.createGain(); og.gain.value=0.006;
  var olp=AC.createBiquadFilter(); olp.type="lowpass"; olp.frequency.value=900;
  o1.connect(og); o2.connect(og); og.connect(olp); olp.connect(master); o1.start(); o2.start();
  setInterval(function(){
    if(!AC) return;
    var t=AC.currentTime;
    var f=[196,220,247,262,294,330][Math.floor(Math.random()*6)];
    o1.frequency.setTargetAtTime(f,t,0.09);
    o2.frequency.setTargetAtTime(f*1.5,t,0.12);
    og.gain.setTargetAtTime(0.003+Math.random()*0.006,t,0.3);
  },900);

  /* steam valve, on its own clock */
  function vent(){
    if(!AC) return;
    var s3=src(false), hf=AC.createBiquadFilter(); hf.type="highpass"; hf.frequency.value=2600;
    var g3=AC.createGain(); g3.gain.value=0;
    s3.connect(hf); hf.connect(g3); g3.connect(master);
    var t=AC.currentTime, dur=0.35+Math.random()*0.9;
    g3.gain.setValueAtTime(0,t);
    g3.gain.linearRampToValueAtTime(0.055+Math.random()*0.05,t+0.05);
    g3.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    s3.start(t); s3.stop(t+dur+0.05);
    setTimeout(vent, 5200+Math.random()*13000);
  }
  setTimeout(vent, 2200+Math.random()*4000);

  /* fibre hiss, on the drag */
  var hs=src(true); hissF=AC.createBiquadFilter(); hissF.type="bandpass";
  hissF.frequency.value=2400; hissF.Q.value=1.6;
  hissG=AC.createGain(); hissG.gain.value=0;
  hs.connect(hissF); hissF.connect(hissG); hissG.connect(master); hs.start();
}
function hiss(vel){
  if(!AC||!hissG) return;
  var t=AC.currentTime;
  var v=Math.min(1,vel/8);
  hissG.gain.setTargetAtTime(0.10*v,t,0.05);
  hissF.frequency.setTargetAtTime(1500+3200*v,t,0.06);
}
function whump(thick,fr){
  if(!AC) return;
  var t=AC.currentTime;
  var mass=Math.min(1,Math.log(1+thick)/Math.LN2/9);
  var s4=src(false), lp=AC.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.setValueAtTime(900-620*mass,t);
  lp.frequency.exponentialRampToValueAtTime(120,t+0.28+mass*0.3);
  var g4=AC.createGain(); g4.gain.setValueAtTime(0,t);
  g4.gain.linearRampToValueAtTime(0.42+0.3*mass,t+0.012);
  var dur=0.20+mass*0.42;
  g4.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s4.connect(lp); lp.connect(g4); g4.connect(master);
  s4.start(t); s4.stop(t+dur+0.05);
  var o=AC.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(86-38*mass,t);
  o.frequency.exponentialRampToValueAtTime(38-14*mass,t+0.22);
  var og2=AC.createGain(); og2.gain.setValueAtTime(0.34+0.22*mass,t);
  og2.gain.exponentialRampToValueAtTime(0.001,t+0.30+mass*0.25);
  o.connect(og2); og2.connect(master); o.start(t); o.stop(t+0.6);
}
function creak(fr){
  if(!AC) return;
  var t=AC.currentTime+0.10;
  var s5=src(false), bp=AC.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.setValueAtTime(760,t); bp.Q.value=19;
  bp.frequency.linearRampToValueAtTime(420,t+0.55);
  var g5=AC.createGain(); g5.gain.setValueAtTime(0,t);
  g5.gain.linearRampToValueAtTime(0.11*Math.min(1,fr),t+0.14);
  g5.gain.exponentialRampToValueAtTime(0.0008,t+0.62);
  s5.connect(bp); bp.connect(g5); g5.connect(master);
  s5.start(t); s5.stop(t+0.7);
}
function thumb(){
  if(!AC) return;
  var t=AC.currentTime;
  var s6=src(false), lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520;
  var g6=AC.createGain(); g6.gain.setValueAtTime(0.16,t);
  g6.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  s6.connect(lp); lp.connect(g6); g6.connect(master);
  s6.start(t); s6.stop(t+0.2);
}
window.addEventListener("keydown",startAudio);
window.addEventListener("touchstart",startAudio,{passive:true});

/* ---------- clock ---------- */
var nextFold=performance.now()+7000;
function loop(now){
  if(anim) drawFolding(now);
  else{
    if(now>=nextFold){ startFold(); nextFold=now+11000; }
    else if(dirty){ buildImage(); drawFlat(); dirty=false; }
  }
  requestAnimationFrame(loop);
}

initField();
/* pins recorded on a previous visit, laid back into the flat sheet before the first fold */
for(var pz=0;pz<pins.length;pz++){
  if(pins[pz].n!==0) continue;
  var Px=pins[pz].u*FW, Py=pins[pz].v*FH;
  for(var gy3=-6;gy3<=6;gy3++)for(var gx3=-6;gx3<=6;gx3++){
    var X3=Math.round(Px+gx3),Y3=Math.round(Py+gy3);
    if(X3<0||Y3<0||X3>=FW||Y3>=FH)continue;
    var d3=Math.hypot(gx3,gy3)/6; if(d3>1)continue;
    var i3=Y3*FW+X3; h[i3]-=1.0*(1-d3); st[i3]=1;
  }
}
resize();
requestAnimationFrame(loop);

console.log("thirds the long way, then halves the short way. mark goes in the corner so it stays outermost. outbound at one.");
})();
</script>
