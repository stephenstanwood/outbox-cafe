  <meta name="outbox-spec-era" content="1968, right now — twenty past eleven on a Saturday night, second set, on the light platform at the back of a ballroom on Grand River Avenue in Detroit: two 750-watt overhead projectors running hot on a card table, a shoebox of made-up wet slides, a bottle of mineral oil, a bottle of denatured alcohol, and a coffee can of dirty rags. Not a look-back at 'the psychedelic era' and not a 'the ballrooms all closed' lament — the second set started nine minutes ago, the first slide is already cooking itself to mud, and the wall is forty feet wide.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the ballroom's back wall as the projector throws it: one enormous circle of light with a real optical soft edge, a rim of hot lamp-white bleeding to amber, and dark plaster in the corners outside the beam — no header, no caption, no counter, no title, no instructions, nothing to read anywhere. Inside that circle lives a genuine two-phase liquid: dozens of dye-loaded cells riding in oil between two curved clock glasses, and the visitor's cursor IS the pressure of a thumb on the top glass. Press and hold anywhere and the glasses squeeze at that point, splaying the cells outward in real time; drag to slide the top glass across the bottom one, shearing cells until they physically tear in two; roll the wheel to rotate the top glass and set the whole field turning against itself. Cells that touch coalesce for good. The lamp underneath is never off, and its heat is a live field that keeps the whole slide moving whether the visitor touches it or not.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of running a liquid wet slide on an overhead projector — that the whole effect is two liquids that refuse to mix, so the colour is not painted but held in discrete cells with real surface tension, and every shape on that wall is a boundary and not a brushstroke; that the dyes have to be chosen on opposite solubilities, one alcohol-soluble and one water-soluble, or the two colours simply merge into one brown and the slide is dead; that the glasses are curved on purpose, because a flat pair squeezes the liquid out to the edges and a shallow lens keeps it centred where the lamp is brightest; that the actual engine of the piece is the 750-watt lamp, whose heat boils the water phase from below and drives the convection you're watching, which is why a slide comes alive about a minute after you set it down and turns to sludge about eight minutes later; that pressure splays and shear tears, so squeezing gives you rounds and dragging gives you strings, and a torn cell never comes back the same size; that cells which touch merge permanently and a slide therefore gets simpler and coarser the whole night, never more complex; that you cannot get it all in focus, ever, because the liquid sits in a curved lens and the rim is always a different distance from the platen than the centre, so focusing the middle throws the edges soft and that softness is not a fault; and that colour here is subtractive, so red over green is not a third bright colour but a dark one, and three dyes on one slide is how beginners make mud. Literally glass, mineral oil, water, two dyes, and a hot bulb.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is HOT, FAST, SATURATED and RESTLESS — cells boiling up off the bottom of the frame, rounds bursting into strings under a drag, colours going hard and dark where they overlap, the whole field never once holding still. Explicitly NOT a lava lamp, NOT slow, NOT hypnotic, NOT meditative, NOT dreamy, NOT drifting, NOT soft-focus prettiness, NOT melancholy — this is a working light show at full lamp temperature, twenty past eleven, with somebody's thumb on the glass and the band already three songs into the set.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Alcohol-dye scarlet (#e0271b) and water-dye viridian (#0f9b7a) as the two working anchors — the only two dyes on the slide — with their overlaps computed subtractively into a hard bottle-brown (#3d2216), all riding on a blown-out lamp field of hot projector white going warm at the rim (#fff4dc into #f2a63a), and the plaster outside the beam a dead unlit brown-black (#160f0c). Saturated, transmissive, genuinely luminous — this is projected light, not pigment, so the whites blow out and the dye edges carry real chromatic fringing where the lens can't hold two colours in the same plane.">
  <meta name="outbox-spec-wildcard" content="There is a single human hair lying on the projector's stage, in the light path, permanently — thrown up onto the wall enormously magnified as a soft dark curve across the lower left of the disc, with its own honest focus offset (it sits on the platen, not in the liquid, so it is sharpest at exactly the focus setting where every dye cell is soft). It drifts a fraction only when the glasses are physically slid across it. It is never removed, never labelled, never explained, and it is there identically every visit.">
  <meta name="outbox-spec-forbidden" content="NO liquid-light-as-metaphor for consciousness / expansion / dissolving-boundaries / 'the colours are alive' / drug-experience framing whatsoever — it is glass, oil, water, dye and a hot bulb, and it has nothing to teach anyone. NO counterculture mythologising, NO 'far out', NO period-slang winking, NO 1960s nostalgia, and NO 'the ballrooms all closed / nobody runs wet slides anymore / a lost art' decline narrative — the second set is running. NO lava-lamp chill, NO meditative / hypnotic / 'let it wash over you' register, NO slow drifting dreaminess, NO ambient-visualiser framing. NO vaporwave, synthwave, neon-noir, or any late-internet retro-psychedelic aesthetic register. NO melancholy, NO wistfulness, NO soft autumn. NO cryptic-SCP or ominous dread about the hair or the coarsening field. NO archival / museum / cabinet / drawer / relic framing of the projector or the slides. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / lonely-operator / 3am voice — the room is packed, loud and hot. NO signal / transmission / frequency / broadcast framing of the light. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the beam and the wall, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>
<canvas id="wall"></canvas>
<a id="more" href="/archive">more slides</a>
<script>
(function(){
"use strict";
var cv=document.getElementById('wall'), ctx=cv.getContext('2d',{alpha:false});
var scratch=document.createElement('canvas'), sctx=scratch.getContext('2d');
var accum=document.createElement('canvas'), actx=accum.getContext('2d');
var outc=document.createElement('canvas'), octx=outc.getContext('2d');
var W=0,H=0,W2=0,H2=0,lowScale=4,cx=0,cy=0,Rb=1;
var lampR,lampG,lampB,lampI,idxR,idxB,outImg,noiseLUT,LUTM=8191;

/* ---- value noise for the plaster ---- */
function hash(i,j){var n=i*374761393+j*668265263;n=(n^(n>>13))*1274126177;return ((n^(n>>16))>>>0)/4294967295;}
function vnoise(x,y){var i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;
  var u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  var a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){var s=0,amp=.5,f=1;for(var o=0;o<4;o++){s+=amp*vnoise(x*f,y*f);amp*=.5;f*=2.07;}return s;}
function smoothstep(a,b,t){t=(t-a)/(b-a);if(t<0)t=0;if(t>1)t=1;return t*t*(3-2*t);}

/* ---- the two dyes, as absorption. one alcohol soluble, one water soluble. ---- */
var kSr=0.18,kSg=2.15,kSb=2.55;      /* scarlet */
var kVr=2.00,kVg=0.60,kVb=0.95;      /* viridian */
var kHr=2.60,kHg=2.95,kHb=3.20;      /* the hair on the platen */
var DS=1.74/255;

/* ---- state ---- */
var cells=[],vort=[],focus=0.15,omega=0,hairOff={x:0,y:0},frame=0,last=0;
var press=false,pxp=0,pyp=0,pxn=0,pyn=0,dragx=0,dragy=0;
var fkey=false,shiftk=false,pointers=new Map(),twoAng=0,twoY=0;

function mkCell(x,y,r,phase){
  var base=[],N=16;
  for(var j=0;j<N;j++) base.push(1+(Math.random()-.5)*0.20);
  return {x:x,y:y,vx:0,vy:0,area:Math.PI*r*r,load:0.55+Math.random()*0.45,
    phase:phase,depth:Math.random(),s1:0,s2:0,base:base,soak:Math.random()*1.2,spread:0};
}
function seed(){
  cells.length=0;
  var n=44;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*Rb*0.88;
    var r=Rb*(0.048+Math.pow(Math.random(),1.7)*0.085);
    cells.push(mkCell(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr, r, i%2));
  }
  vort.length=0;
  for(var v=0;v<3;v++) vort.push({a:Math.random()*6.28,rr:0.3+Math.random()*0.5,s:(Math.random()<.5?-1:1)*(0.5+Math.random()*0.6),ph:Math.random()*6.28});
}

function resize(){
  W=Math.max(320,window.innerWidth); H=Math.max(320,window.innerHeight);
  cv.width=W; cv.height=H;
  lowScale=Math.max(3,Math.ceil(Math.max(W,H)/300));
  W2=Math.max(90,Math.round(W/lowScale)); H2=Math.max(90,Math.round(H/lowScale));
  scratch.width=accum.width=outc.width=W2; scratch.height=accum.height=outc.height=H2;
  cx=W2*0.5; cy=H2*0.47; Rb=Math.min(W2,H2)*0.63;
  lampR=new Float32Array(W2*H2); lampG=new Float32Array(W2*H2); lampB=new Float32Array(W2*H2);
  lampI=new Float32Array(W2*H2); idxR=new Int32Array(W2*H2); idxB=new Int32Array(W2*H2);
  outImg=octx.createImageData(W2,H2);
  var p=0;
  for(var j=0;j<H2;j++){for(var i=0;i<W2;i++,p++){
    var dx=i-cx, dy=j-cy, rr=Math.sqrt(dx*dx+dy*dy), t=rr/Rb;
    var beam=1-smoothstep(0.885,1.055,t);
    var core=Math.exp(-(t/0.62)*(t/0.62));
    var hot=Math.exp(-Math.pow((t-0.90)/0.10,2))*0.32;
    var inten=beam*(0.40+0.74*core+hot);
    var mix=Math.pow(Math.min(1,t),1.25);
    var cr=(255+(242-255)*mix), cg=(244+(166-244)*mix), cb=(220+(58-220)*mix);
    var wall=0.90+0.20*fbm(i*0.09,j*0.09)+0.06*fbm(i*0.42,j*0.42);
    var spill=t>0.95?0.30*Math.exp(-Math.pow((t-0.95)/0.28,2)):0;
    var plr=22*wall+spill*242, plg=15*wall+spill*166, plb=12*wall+spill*58;
    lampR[p]=plr+inten*cr*wall; lampG[p]=plg+inten*cg*wall; lampB[p]=plb+inten*cb*wall;
    lampI[p]=Math.min(1,inten);
    /* the lens cannot hold two colours in one plane: lateral fringing, zero at axis */
    var ca=1.75*Math.pow(Math.min(1.15,t),1.5), ux=rr>0.001?dx/rr:0, uy=rr>0.001?dy/rr:0;
    var i1=Math.min(W2-1,Math.max(0,i+Math.round(ux*ca))), j1=Math.min(H2-1,Math.max(0,j+Math.round(uy*ca)));
    var i2=Math.min(W2-1,Math.max(0,i-Math.round(ux*ca))), j2=Math.min(H2-1,Math.max(0,j-Math.round(uy*ca)));
    idxR[p]=(j1*W2+i1)*4; idxB[p]=(j2*W2+i2)*4;
  }}
  noiseLUT=new Float32Array(LUTM+1);
  for(var k=0;k<=LUTM;k++) noiseLUT[k]=(Math.random()-0.5);
  if(!cells.length) seed(); 
}

/* ---- the field the lamp drives ---- */
function flow(x,y,out){
  var X=x-cx, Y=y-cy, s=0.56*Rb, f=Math.exp(-(X*X+Y*Y)/(s*s));
  var A0=Rb*0.26;
  var u=-2*A0*X*Y*f/(s*s);
  var v=-A0*(1-2*X*X/(s*s))*f;
  for(var i=0;i<vort.length;i++){
    var vt=vort[i], vxp=cx+Math.cos(vt.a)*vt.rr*Rb, vyp=cy+Math.sin(vt.a)*vt.rr*Rb;
    var ddx=x-vxp, ddy=y-vyp, ss=0.30*Rb, ff=Math.exp(-(ddx*ddx+ddy*ddy)/(ss*ss));
    var B=vt.s*Rb*0.30;
    u+=-2*ddy*B*ff/(ss*ss)*ss; v+=2*ddx*B*ff/(ss*ss)*ss;
  }
  out[0]=u; out[1]=v;
}
function heatAt(x,y){
  var dx=x-cx,dy=y-cy,t=Math.sqrt(dx*dx+dy*dy)/Rb;
  return Math.exp(-(t/0.52)*(t/0.52));
}

function addStrain(c,axis,m){ c.s1+=m*Math.cos(2*axis); c.s2+=m*Math.sin(2*axis); }

function tear(c,i){
  if(cells.length>94) return;
  var axis=0.5*Math.atan2(c.s2,c.s1);
  var dx=Math.cos(axis),dy=Math.sin(axis);
  var f=0.30+Math.random()*0.40;
  var R0=Math.sqrt(c.area/Math.PI);
  var a1=c.area*f, a2=c.area*(1-f);
  var b=mkCell(0,0,1,c.phase); b.base=c.base.slice();
  b.area=a2; b.load=c.load; b.depth=c.depth; b.spread=c.spread*0.6;
  b.x=c.x-dx*R0*0.85*f*1.4; b.y=c.y-dy*R0*0.85*f*1.4;
  b.vx=c.vx-dx*Rb*0.09; b.vy=c.vy-dy*Rb*0.09;
  b.s1=c.s1*0.22; b.s2=c.s2*0.22; b.soak=c.soak*0.5;
  c.area=a1; c.x+=dx*R0*0.85*(1-f)*1.4; c.y+=dy*R0*0.85*(1-f)*1.4;
  c.vx+=dx*Rb*0.09; c.vy+=dy*Rb*0.09; c.s1*=0.22; c.s2*=0.22; c.soak*=0.5;
  cells.push(b);
}
function boil(c){
  if(cells.length>90) return;
  var n=5, R0=Math.sqrt(c.area/Math.PI), each=c.area/n;
  for(var k=0;k<n;k++){
    var a=Math.random()*6.28+k*(6.28/n);
    var nc=mkCell(c.x+Math.cos(a)*R0*1.05, c.y+Math.sin(a)*R0*1.05, 1, c.phase);
    nc.area=each; nc.load=c.load; nc.depth=Math.min(1,Math.max(0,c.depth+(Math.random()-.5)*0.35));
    nc.vx=c.vx+Math.cos(a)*Rb*0.13; nc.vy=c.vy+Math.sin(a)*Rb*0.13-Rb*0.05;
    nc.soak=0;
    if(k===0){ c.area=each; c.soak=0; c.vx=nc.vx; c.vy=nc.vy; c.x=nc.x; c.y=nc.y; }
    else cells.push(nc);
  }
}

var fv=[0,0];
function update(dt){
  var hs=1+0.10*Math.sin(frame*0.11)+0.06*Math.sin(frame*0.037);
  for(var i=0;i<vort.length;i++){
    var vt=vort[i]; vt.a+=dt*0.28*vt.s; vt.ph+=dt*0.9;
    vt.s+= (Math.sin(vt.ph)*0.9-vt.s)*dt*0.5;
  }
  /* focus rack, continuous */
  if(fkey){ focus+=(shiftk?-1:1)*0.45*dt; if(focus>1.45)focus=1.45; if(focus<-0.50)focus=-0.50; }
  omega*=Math.exp(-1.05*dt);

  var ddx=dragx, ddy=dragy; dragx*=0.0; dragy*=0.0;
  var dmag=Math.hypot(ddx,ddy);

  for(var n=0;n<cells.length;n++){
    var c=cells[n], R=Math.sqrt(c.area/Math.PI);
    var Hf=heatAt(c.x,c.y)*hs;
    flow(c.x,c.y,fv);
    var coup=2.4;
    c.vx+=(fv[0]-c.vx)*coup*dt; c.vy+=(fv[1]-c.vy)*coup*dt;
    /* buoyancy: the water phase boils harder than the alcohol phase */
    c.vy-=Rb*0.30*Hf*dt*(c.phase?1.20:0.82)/(1+R/(Rb*0.30));
    /* the roil */
    var jj=Math.sqrt(dt)*Rb*0.22*Hf;
    c.vx+=(Math.random()-.5)*jj; c.vy+=(Math.random()-.5)*jj;
    /* shallow lens keeps the liquid over the lamp */
    var lx=c.x-cx, ly=c.y-cy, lr=Math.sqrt(lx*lx+ly*ly)/Rb;
    c.vx-=lx*0.55*dt*lr*lr; c.vy-=ly*0.55*dt*lr*lr;

    /* thumb on the top glass */
    if(press){
      var px=pxn-c.x, py=pyn-c.y, pd=Math.hypot(px,py), Rp=Rb*0.38;
      if(pd<Rp){
        var w=(1-pd/Rp); w*=w;
        var ux=pd>0.001?px/pd:0, uy=pd>0.001?py/pd:0;
        c.vx-=ux*Rb*2.6*w*dt; c.vy-=uy*Rb*2.6*w*dt;
        addStrain(c, Math.atan2(uy,ux)+Math.PI/2, 1.5*w*dt);
        c.spread+=2.2*w*dt;
      }
    }
    if(dmag>0.01){
      var gd=Math.hypot(pxn-c.x,pyn-c.y);
      var gw=0.35+0.65*Math.exp(-Math.pow(gd/(Rb*0.5),2));
      var dep=0.25+0.75*c.depth;
      c.x+=ddx*gw*dep; c.y+=ddy*gw*dep;
      addStrain(c, Math.atan2(ddy,ddx), Math.min(0.16, dmag*0.011*gw*dep));
    }
    if(Math.abs(omega)>0.0005){
      var dep2=0.20+0.80*c.depth, ang=omega*dt*dep2;
      var ox=c.x-cx, oy=c.y-cy, ca2=Math.cos(ang), sa=Math.sin(ang);
      c.x=cx+ox*ca2-oy*sa; c.y=cy+ox*sa+oy*ca2;
      addStrain(c, Math.atan2(oy,ox)+Math.PI/4, Math.abs(omega)*dt*1.6*lr);
    }

    c.x+=c.vx*dt; c.y+=c.vy*dt;

    /* the rim of the clock glass */
    var ex=c.x-cx, ey=c.y-cy, er=Math.hypot(ex,ey), Rc=Rb*0.985-R*0.35;
    if(er>Rc){ var k=(er-Rc); c.x-=ex/er*k*0.9; c.y-=ey/er*k*0.9;
      var dot=(c.vx*ex+c.vy*ey)/er; if(dot>0){ c.vx-=1.5*dot*ex/er; c.vy-=1.5*dot*ey/er; } }

    /* surface tension pulls it round again; small cells snap back fast */
    var rel=Math.exp(-(0.9+26/Math.max(2,R))*dt);
    c.s1*=rel; c.s2*=rel; c.spread*=Math.exp(-2.4*dt);
    var m=Math.hypot(c.s1,c.s2);
    if(m>0.86){ c.s1*=0.86/m; c.s2*=0.86/m; m=0.86; }
    var thresh=0.42+2.6/Math.max(2,R/(Rb*0.06));
    if(m>thresh && R>Rb*0.030) tear(c,n);

    /* parked in the hot middle too long */
    c.soak+=Hf*dt*(c.phase?1.25:0.75); c.soak-=0.35*dt;
    if(c.soak<0)c.soak=0;
    if(c.soak>3.6 && c.area>Math.PI*Math.pow(Rb*0.055,2)) boil(c);

    c.vx*=Math.exp(-(1.3+22/Math.max(3,R))*dt);
    c.vy*=Math.exp(-(1.3+22/Math.max(3,R))*dt);
    c.depth+=(Math.random()-.5)*dt*0.12; if(c.depth<0)c.depth=0; if(c.depth>1)c.depth=1;
  }

  /* touching cells of the same phase coalesce, and that is permanent */
  for(var a=0;a<cells.length;a++){
    var A=cells[a]; if(!A) continue;
    var Ra=Math.sqrt(A.area/Math.PI);
    for(var b=a+1;b<cells.length;b++){
      var B=cells[b]; if(!B) continue;
      if(A.phase!==B.phase) continue;
      if(Math.abs(A.depth-B.depth)>0.36) continue;
      var Rbb=Math.sqrt(B.area/Math.PI);
      var dx2=B.x-A.x, dy2=B.y-A.y, dd=Math.sqrt(dx2*dx2+dy2*dy2);
      if(dd<(Ra+Rbb)*0.84){
        var tot=A.area+B.area;
        A.x=(A.x*A.area+B.x*B.area)/tot; A.y=(A.y*A.area+B.y*B.area)/tot;
        A.vx=(A.vx*A.area+B.vx*B.area)/tot; A.vy=(A.vy*A.area+B.vy*B.area)/tot;
        A.load=(A.load*A.area+B.load*B.area)/tot;
        A.depth=(A.depth*A.area+B.depth*B.area)/tot;
        A.s1=(A.s1*A.area+B.s1*B.area)/tot; A.s2=(A.s2*A.area+B.s2*B.area)/tot;
        A.area=tot; Ra=Math.sqrt(tot/Math.PI);
        cells[b]=null;
      }
    }
  }
  for(var z=cells.length-1;z>=0;z--) if(!cells[z]) cells.splice(z,1);
}

/* ---- optics ---- */
var BR=[0.45,1.2,2.3,3.7,5.6,8.2];
function planeOf(c){
  var dx=c.x-cx,dy=c.y-cy,t=Math.sqrt(dx*dx+dy*dy)/Rb;
  return t*t*1.00 + c.depth*0.28;   /* curved glass: the rim is never the same distance as the middle */
}
function blurPx(plane){ var v=Math.abs(plane-focus)*7.2; return v>9?9:v; }

function pathCell(g,c){
  var R=Math.sqrt(c.area/Math.PI)*(1+c.spread*0.55);
  var s1=c.s1,s2=c.s2, det=1-s1*s1-s2*s2; if(det<0.12)det=0.12;
  var inv=1/Math.sqrt(det), N=c.base.length, pts=[];
  for(var j=0;j<N;j++){
    var a=j/N*Math.PI*2, br=c.base[j]*R;
    var lx=Math.cos(a)*br, ly=Math.sin(a)*br;
    pts.push([c.x+((1+s1)*lx+s2*ly)*inv, c.y+(s2*lx+(1-s1)*ly)*inv]);
  }
  g.beginPath();
  var mx=(pts[N-1][0]+pts[0][0])/2, my=(pts[N-1][1]+pts[0][1])/2;
  g.moveTo(mx,my);
  for(var j2=0;j2<N;j2++){
    var p1=pts[j2], p2=pts[(j2+1)%N];
    g.quadraticCurveTo(p1[0],p1[1],(p1[0]+p2[0])/2,(p1[1]+p2[1])/2);
  }
  g.closePath();
}

function hairPath(g){
  var pts=[],S=Rb;
  for(var t=0;t<=1.0001;t+=0.04){
    var u=1-t;
    var x=u*u*u*(-0.86)+3*u*u*t*(-0.66)+3*u*t*t*(-0.24)+t*t*t*(0.02);
    var y=u*u*u*(0.06)+3*u*u*t*(0.52)+3*u*t*t*(0.44)+t*t*t*(0.90);
    x+=0.020*Math.sin(t*13.0); y+=0.014*Math.sin(t*9.0+1.2);
    pts.push([cx+x*S+hairOff.x, cy+y*S+hairOff.y]);
  }
  g.lineCap='round'; g.lineJoin='round';
  for(var i=0;i<pts.length-1;i++){
    var tt=i/(pts.length-1);
    var w=Rb*0.020*(0.35+0.65*Math.sin(Math.PI*Math.min(1,Math.max(0,tt*1.05))));
    g.lineWidth=Math.max(0.7,w);
    g.beginPath(); g.moveTo(pts[i][0],pts[i][1]); g.lineTo(pts[i+1][0],pts[i+1][1]); g.stroke();
  }
}

function render(){
  actx.globalCompositeOperation='source-over'; actx.filter='none';
  actx.fillStyle='#000'; actx.fillRect(0,0,W2,H2);
  actx.globalCompositeOperation='lighter';

  var buckets=[[],[],[],[],[],[]];
  for(var i=0;i<cells.length;i++){
    var c=cells[i], bp=blurPx(planeOf(c));
    var bi=0,bd=1e9;
    for(var k=0;k<BR.length;k++){var d=Math.abs(BR[k]-bp); if(d<bd){bd=d;bi=k;}}
    buckets[bi].push(c);
  }
  for(var b=0;b<6;b++){
    if(!buckets[b].length) continue;
    sctx.globalCompositeOperation='source-over'; sctx.filter='none';
    sctx.clearRect(0,0,W2,H2);
    sctx.globalCompositeOperation='lighter';
    for(var q=0;q<buckets[b].length;q++){
      var c2=buckets[b][q];
      var eff=c2.load/Math.pow(1+c2.spread*0.55,2);
      var v=Math.max(6,Math.min(255,Math.round(eff*118)));
      sctx.fillStyle=c2.phase? 'rgb(0,'+v+',0)' : 'rgb('+v+',0,0)';
      pathCell(sctx,c2); sctx.fill();
    }
    actx.filter='blur('+BR[b].toFixed(2)+'px)';
    actx.drawImage(scratch,0,0);
  }
  /* the hair is not in the liquid. it lies on the stage. */
  sctx.globalCompositeOperation='source-over'; sctx.filter='none';
  sctx.clearRect(0,0,W2,H2);
  sctx.strokeStyle='rgb(0,0,205)';
  hairPath(sctx);
  actx.filter='blur('+blurPx(-0.40).toFixed(2)+'px)';
  actx.drawImage(scratch,0,0);
  actx.filter='none';

  var d=actx.getImageData(0,0,W2,H2).data, o=outImg.data;
  var goff=(frame*7919)&LUTM;
  for(var p=0,qq=0;p<W2*H2;p++,qq+=4){
    var ir=idxR[p], ib=idxB[p];
    var sum=d[qq]+d[qq+1]+d[qq+2]+d[ir]+d[ir+1]+d[ir+2]+d[ib]+d[ib+1]+d[ib+2];
    var lr=lampR[p], lg=lampG[p], lb=lampB[p];
    var R,G,B2;
    if(sum===0){ R=lr; G=lg; B2=lb; }
    else{
      var Tr=Math.exp(-(kSr*d[ir]+kVr*d[ir+1]+kHr*d[ir+2])*DS);
      var Tg=Math.exp(-(kSg*d[qq]+kVg*d[qq+1]+kHg*d[qq+2])*DS);
      var Tb=Math.exp(-(kSb*d[ib]+kVb*d[ib+1]+kHb*d[ib+2])*DS);
      R=lr*Tr; G=lg*Tg; B2=lb*Tb;
    }
    var gn=noiseLUT[(p+goff)&LUTM]*(5+9*lampI[p]);
    R+=gn; G+=gn*0.95; B2+=gn*0.85;
    o[qq]=R<0?0:(R>255?255:R);
    o[qq+1]=G<0?0:(G>255?255:G);
    o[qq+2]=B2<0?0:(B2>255?255:B2);
    o[qq+3]=255;
  }
  octx.putImageData(outImg,0,0);
  ctx.imageSmoothingEnabled=true;
  if(ctx.imageSmoothingQuality) ctx.imageSmoothingQuality='high';
  ctx.drawImage(outc,0,0,W2,H2,0,0,W,H);
}

function loop(t){
  if(!last) last=t;
  var dt=(t-last)/1000; last=t;
  if(dt>0.05) dt=0.05; if(dt<0.001) dt=0.001;
  frame++;
  update(dt); render();
  requestAnimationFrame(loop);
}

/* ---- the thumb, the slide, the focus knob ---- */
function toLocal(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/lowScale,(e.clientY-r.top)/lowScale]; }
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,toLocal(e));
  if(pointers.size===1){ var l=toLocal(e); pxn=l[0]; pyn=l[1]; pxp=pxn; pyp=pyn; press=true; }
  else if(pointers.size===2){
    press=false;
    var vals=Array.from(pointers.values());
    twoAng=Math.atan2(vals[1][1]-vals[0][1],vals[1][0]-vals[0][0]);
    twoY=(vals[0][1]+vals[1][1])/2;
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId)) return;
  var l=toLocal(e); pointers.set(e.pointerId,l);
  if(pointers.size===1 && press){
    pxn=l[0]; pyn=l[1];
    dragx+=(pxn-pxp); dragy+=(pyn-pyp);
    hairOff.x=Math.max(-Rb*0.045,Math.min(Rb*0.045,hairOff.x+(pxn-pxp)*0.030));
    hairOff.y=Math.max(-Rb*0.045,Math.min(Rb*0.045,hairOff.y+(pyn-pyp)*0.030));
    pxp=pxn; pyp=pyn;
  } else if(pointers.size>=2){
    var vals=Array.from(pointers.values());
    var a=Math.atan2(vals[1][1]-vals[0][1],vals[1][0]-vals[0][0]);
    var da=a-twoAng; while(da>Math.PI)da-=6.283; while(da<-Math.PI)da+=6.283;
    omega+=da*3.2; twoAng=a;
    var my=(vals[0][1]+vals[1][1])/2;
    focus+=(my-twoY)*0.006; twoY=my;
    if(focus>1.45)focus=1.45; if(focus<-0.50)focus=-0.50;
  }
  e.preventDefault();
},{passive:false});
function up(e){ pointers.delete(e.pointerId); if(pointers.size===0) press=false; }
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',up);
window.addEventListener('wheel',function(e){
  if(fkey||e.shiftKey||e.ctrlKey||e.metaKey||e.altKey){
    focus+=e.deltaY*0.0011; if(focus>1.45)focus=1.45; if(focus<-0.50)focus=-0.50;
  } else omega+=e.deltaY*0.00022;
  e.preventDefault();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F') fkey=true;
  if(e.key==='Shift') shiftk=true;
},false);
window.addEventListener('keyup',function(e){
  if(e.key==='f'||e.key==='F') fkey=false;
  if(e.key==='Shift') shiftk=false;
},false);
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',function(){ var old=cells.slice(); resize();
  for(var i=0;i<old.length;i++){ old[i].x=Math.min(W2,Math.max(0,old[i].x)); old[i].y=Math.min(H2,Math.max(0,old[i].y)); }
});

resize(); seed(); requestAnimationFrame(loop);

console.log("shoebox 3 — scarlet in denatured alcohol, viridian in water, mineral oil between two clock glasses. one dye each side of the fence. three dyes on one slide is how you make mud. lamp's been on since 9.");
})();
</script>
