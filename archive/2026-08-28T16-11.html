  <meta name="outbox-spec-era" content="Late winter 1959, a Thursday afternoon in the marbling room at the back of a trade bindery on Rue Saint-Gilles, Liège: a lead-lined tray four feet by three, alum-sized sheets hanging on laths overhead, a shelf of ground pigment in jam jars, and a radiator somebody turned up at eight o'clock and nobody has turned down since. The room is now several degrees warmer than the size wants to be. This is not a look-back at hand-marbled endpapers and not a lament for a dying trade — a hundred and eighty combed sheets are due downstairs at five, the carrageenan is thinning as it warms so every pattern comes out wider than the last one, and the gall is being adjusted by guesswork between pulls.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the marbling tray seen straight down at life size: a flat sheet of carrageenan size filling the frame corner to corner, a lead rail along the top edge and the bottom edge, and nothing else. No header, no caption, no counter, no title, no instructions, nothing readable anywhere. It is a live floating-film simulation. Colour arrives as real drops that spread into rings and shove every previous ring outward without ever mixing into it, and the visitor's entire vocabulary is the hand: click to drop the next colour in the sequence, drag to draw a single stylus through the film (the pattern follows the path exactly and keeps following it, because nothing here diffuses), drag with two fingers' worth of speed to rake a whole comb through in one pass, and press-and-hold flat against the surface to lay a sheet of paper down — which lifts the entire pattern off the bath, permanently, and slides out of the top of frame onto a stack of drying sheets that is the only thing in the piece that accumulates. The bath underneath is left bare and slightly scummed and ready for the next one.">
  <meta name="outbox-spec-subject" content="The plain physics of floating pigment on a size bath, and specifically why marbling is advection with no diffusion in it and why that single fact is the whole craft — that carrageenan size is a viscous non-Newtonian film whose only job is to be thick enough that a pigment particle sitting on it cannot sink and cannot wander, so a line drawn through it at twenty past three is still exactly that line at half past, and the pattern on the bath is therefore a literal geometric record of every path the hand has taken and never an average of them; that a drop of colour does not dissolve, it SPREADS, pushing everything already on the surface radially outward in an area-preserving way — the film has to go somewhere — so a fresh drop in the middle of a finished pattern does not sit on top of it, it deforms the entire tray at once and every earlier ring becomes a thinner crescent further out; that the spreading is driven by surface tension difference and not by force, which is why ox gall exists: gall lowers a colour's surface tension so it opens out against the film instead of beading, and since every colour laid down has already lowered the tension of the surface it lands on, EACH SUCCESSIVE COLOUR NEEDS MORE GALL THAN THE ONE BEFORE IT, in a rising ladder, and this is the whole reason marblers keep the drop order fixed and never improvise it; that too little gall and the colour beads up, refuses to open, and sinks through to the bottom of the tray where it is simply lost; that too much gall on the last colour and the surface film breaks altogether and the entire pattern flees to the rails in about two seconds and the bath has to be skimmed; that the stylus does not cut the film, it drags it, and the drag falls off with distance at a rate set by the size's viscosity, so a cold thick size gives a tight sharp trail with hard edges and a warm thin one gives a broad soft one that hauls half the tray along with it — which is why a room that has warmed eight degrees since morning is producing visibly different sheets from the same hand doing the same stroke; that a comb is nothing but a row of styluses at a fixed spacing and the named patterns are honest arithmetic — a single pass of a wide comb through parallel stripes gives nonpareil, a second pass at right angles with a finer comb gives the chevrons, and a wavy pass gives Spanish wave, and none of it is invention, it is spacing times amplitude times how far the drag reaches; that the paper takes the pattern by mordant and not by stickiness — the sheet is sized with alum beforehand and the alum is what fixes the pigment, so a sheet that dried unevenly on the lath takes unevenly and comes off with pale ghost patches, and no amount of care at the tray fixes a badly alumed sheet; that the pull takes ONE sheet and takes ALL of it, so a pattern exists for as long as it takes to work it and then does not exist at all; and the flat arithmetic that the tray holds about eleven litres, the size wants to be at sixteen degrees and is at twenty-four, a pull takes about forty seconds including the skim, there are a hundred and eighty to do, and it is nearly four o'clock.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the liquid and the light, and that register is BRISK, WET, CROWDED and SLIGHTLY OUT OF HAND — drops arriving with a real plip and opening fast, rings shoving each other outward and going oval, the comb dragging half the tray with it because the size is too warm, a rim of yesterday's scum riding the lead rails, pigment that failed to open beading and going down through the film and gone. Everything happens at working speed. The bath is never still for more than a couple of seconds and the surface is visibly wet and moving even when nothing is being done to it, because the radiator is driving a slow convection under the film that drifts the whole pattern a few millimetres toward the near rail over the course of a minute. Explicitly NOT hushed, NOT meditative, NOT hypnotic, NOT dreamy, NOT satisfying-video, NOT ASMR, NOT a screensaver, NOT precious — this is a tray in a warm room at ten to four with a hundred and eighty sheets to get through and the patterns coming out wider than they did this morning.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The carrageenan size is the entire ground of the piece and it is not water-clear — it is a flat, faintly translucent olive-grey (#7c7f6b) that goes a shade darker and greener toward the near rail where the film is thickest (#63684f) and shows the lead tray bottom faintly through it as an even colder grey (#8d9187). Against it, ground pigment sits ON the surface and reads as genuinely opaque particulate rather than as dye — hard iron red-oxide (#9d3524), a dense carbon-and-indigo blue-black (#1e2a3d), chrome yellow (#d9a516), and a chalky lead white (#ece7d8) — each rendered with a slightly granular edge because they are ground earths floating on a film and not inks in a solution, and each visibly THINNING in coverage as it is stretched, so a ring pulled out to four times its diameter reads paler and lets the olive through. Lead rails along the top and bottom edges in a dull soft grey with a dark oxidised bloom (#5b5d5e) and a crust of dried pigment scum along the inside lip (#6f5a3c). Exactly one chip of cold north-window specular white (#f1f4ee) is held strictly for the wet gleam on the surface itself — the moving highlight that travels across a drop as it opens, the bright wet trailing edge of a sheet being lifted off, and nothing else. Flat, hard, high contrast, no glow, no bloom, no gradients other than the honest film thickness and the honest pigment coverage — pigment on gel in a warm back room under a grey afternoon window.">
  <meta name="outbox-spec-wildcard" content="About a hand's width in from the lower left rail there is a fleck of dried pigment skin — a small irregular flake of red-oxide that formed on the surface of a jar and got into the tray at some point, roughly four millimetres across, sitting slightly proud of the film with its own tiny shadow. It is advected by nothing. Drops push everything else past it and it does not move. The stylus goes straight through it. The comb passes over it. A sheet laid across it does not lift it and comes off with a small blank spot where it was. The rail skim does not catch it. It is in the same position, the same shape, every visit, and nothing on the page ever accounts for it.">
  <meta name="outbox-spec-forbidden" content="NO marbling-as-metaphor for chaos and order, chance, control, letting-go, the-unrepeatable, 'no two are alike', fingerprints, or how a life turns out — it is an area-preserving map, a tension ladder and a viscosity that has gone up eight degrees since morning, and it has nothing to teach anybody. ABSOLUTELY NO hushed, meditative, hypnotic, reverent, ASMR, oddly-satisfying, ambient-visualiser, screensaver or 'let the colours calm you' framing whatsoever, and NO generative-art-gallery register. NO psychedelic, NO liquid-light-show, NO 60s counterculture drift, NO oil-slick / holographic / opal / vaporwave shimmer, NO pastel dreamscape softness, NO fluid-art-video aesthetic. NO ephemerality lyricism, NO 'the pattern exists only for a moment', NO memento mori — a sheet is pulled and there are a hundred and seventy-nine more to do. NO ebru mysticism, NO Ottoman-master reverence, NO breath-and-patience craft sermon, NO orientalising of any marbling tradition, NO explaining a craft's soul to an outsider, NO artisan-as-sage. NO nostalgia, NO wistfulness, NO 'nobody marbles endpapers anymore / the trade binderies all closed / a vanished craft' decline narrative — the sheets go downstairs at five. NO book fetishism, NO smell-of-old-books, NO bibliophile reverie, NO sensuous writing about paper. NO sensuous material description of pigment, gel or light beyond coverage, opacity, tension, viscosity and speed. NO cryptic-SCP, liminal, uncanny or ominous dread about the fleck of skin or about what sinks through the film — nothing is wrong. NO archival / museum / cabinet / drawer / specimen / relic framing — this is stock being made this afternoon. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is ten to four on a grey afternoon with the radiator on and a press running downstairs. NO signal / transmission / frequency framing of any sound. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the size, the rails, the pigment and the stack of pulled sheets, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, cursor label, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<title>Twenty-Four Degrees on the Size — Rue Saint-Gilles, Ten to Four</title>
<!--
  bench notes, thursday
  radiator valve seized open since eight. rail bolt re-tapped, B. Hallonquist, shop order 4412.
  size wants sixteen. it is not sixteen.
  drop order: red, blue-black, chrome, white. gall up every time. do not improvise it.
  180 sheets. they go downstairs at five.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#63684f;overflow:hidden;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
  a.dn{
    position:fixed;right:7px;bottom:5px;z-index:5;
    font:9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    letter-spacing:.16em;text-transform:lowercase;text-decoration:none;
    color:#6c6e6a;opacity:.62;
  }
  a.dn:hover{color:#9a9c94;opacity:1;}
</style>
</head>
<body>
<canvas id="tray" aria-label="a marbling tray, seen from above"></canvas>
<a class="dn" href="/archive">downstairs</a>
<script>
(function(){
"use strict";

/* ---------- deterministic rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=Math.random;

/* ---------- canvas ---------- */
var cv=document.getElementById('tray'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var pig=document.createElement('canvas'),pctx=pig.getContext('2d',{willReadFrequently:true});
var noiseTile=null,noisePat=null;

function buildNoise(){
  var n=document.createElement('canvas');n.width=n.height=96;
  var c=n.getContext('2d'),id=c.createImageData(96,96),d=id.data,rr=mulberry32(7717);
  for(var i=0;i<96*96;i++){
    var v=rr();
    var a=v<0.34?52:(v>0.80?38:0);
    var g=v<0.34?0:255;
    d[i*4]=g;d[i*4+1]=g;d[i*4+2]=g;d[i*4+3]=a;
  }
  c.putImageData(id,0,0);noiseTile=n;noisePat=ctx.createPattern(n,'repeat');
}

/* ---------- geometry / state ---------- */
var STACK_MAX=68;
var stackN=0,stripSrc=[],stripImg=[];
try{
  stackN=parseInt(localStorage.getItem('stgilles.stack.n')||'0',10)||0;
  stripSrc=JSON.parse(localStorage.getItem('stgilles.stack.s')||'[]');
  if(!Array.isArray(stripSrc))stripSrc=[];
}catch(e){stackN=0;stripSrc=[];}
function loadStrips(){
  stripImg=[];
  for(var i=0;i<stripSrc.length;i++){(function(s){var im=new Image();im.onload=function(){};im.src=s;stripImg.push(im);})(stripSrc[i]);}
}
loadStrips();
function saveStack(){
  try{
    localStorage.setItem('stgilles.stack.n',String(stackN));
    localStorage.setItem('stgilles.stack.s',JSON.stringify(stripSrc.slice(-24)));
  }catch(e){}
}

var stackH=0,trayX=0,trayY=0,trayW=0,trayH=0,railT=24,railB=24;

function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var nw=window.innerWidth,nh=window.innerHeight;
  var oldW=trayW,oldH=trayH,oldX=trayX,oldY=trayY;
  W=nw;H=nh;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  pig.width=cv.width;pig.height=cv.height;
  pctx.setTransform(DPR,0,0,DPR,0,0);
  stackH=Math.min(STACK_MAX,stackN>0?(4+stackN*1.9):0);
  railT=Math.max(16,Math.min(26,H*0.035));
  railB=railT;
  trayX=0;trayW=W;
  trayY=stackH+railT;
  trayH=H-trayY-railB;
  if(!noisePat)buildNoise(); else noisePat=ctx.createPattern(noiseTile,'repeat');
  if(oldW>0&&oldH>0){
    var sx=trayW/oldW,sy=trayH/oldH;
    for(var i=0;i<polys.length;i++){
      var v=polys[i].v;
      for(var k=0;k<v.length;k+=2){
        v[k]=trayX+(v[k]-oldX)*sx;
        v[k+1]=trayY+(v[k+1]-oldY)*sy;
      }
      polys[i].t0*=Math.sqrt(sx*sy);
    }
  }
  fleck.x=trayX+trayW*0.115;fleck.y=trayY+trayH*0.795;
}

/* ---------- pigment ---------- */
var COLS=[
  {rgb:[157,53,36], base:0.90},   /* iron red-oxide      */
  {rgb:[30,42,61],  base:0.845},  /* carbon + indigo     */
  {rgb:[217,165,22],base:0.79},   /* chrome yellow       */
  {rgb:[236,231,216],base:0.735}  /* lead white          */
];
var seq=0;
var film=0.965;            /* live surface tension of the bath */
var BREAK=0.315;
var gall=0.10;             /* the wheel */

var polys=[];              /* {rgb,v:[],t0,res} */
var opening=null;          /* drop currently spreading */
var sinking=null;          /* a bead that refused */
var rupture=null;
var pull=null;
var paperCv=null;

var fleck={x:0,y:0,pts:null};
(function(){
  var rr=mulberry32(4402),p=[];
  for(var i=0;i<11;i++){
    var a=i/11*Math.PI*2,r=2.0+rr()*2.4;
    p.push(Math.cos(a)*r,Math.sin(a)*r*0.82);
  }
  fleck.pts=p;
})();

/* ---------- temperature / viscosity ---------- */
var t0=performance.now();
function temp(){var m=(performance.now()-t0)/60000;return 23.4+Math.min(4.4,m*0.34);}
function decayLen(){var T=temp();return (26+(T-16)*4.4)*(Math.min(W,H)/760);}

/* ---------- polygon helpers ---------- */
var MAXSEG=2.6,MINSEG=1.15;
function circlePoly(cx,cy,r,n){
  var v=[];for(var i=0;i<n;i++){var a=i/n*Math.PI*2;v.push(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}return v;
}
function resample(p){
  var v=p.v,n=v.length>>1,out=[],i,j;
  for(i=0;i<n;i++){
    var x=v[2*i],y=v[2*i+1];j=(i+1)%n;
    var dx=v[2*j]-x,dy=v[2*j+1]-y,d=Math.sqrt(dx*dx+dy*dy);
    out.push(x,y);
    if(d>MAXSEG){
      var k=Math.min(10,Math.ceil(d/MAXSEG)-1);
      for(var m=1;m<=k;m++){var f=m/(k+1);out.push(x+dx*f,y+dy*f);}
    }
  }
  if(out.length>=80){
    var o2=[],px=out[0],py=out[1];o2.push(px,py);
    for(i=1;i<out.length>>1;i++){
      var ax=out[2*i],ay=out[2*i+1];
      if((ax-px)*(ax-px)+(ay-py)*(ay-py)>=MINSEG*MINSEG){o2.push(ax,ay);px=ax;py=ay;}
    }
    if(o2.length>=48){p.v=o2;return;}
  }
  p.v=out;
}
function areaPerim(v){
  var n=v.length>>1,A=0,P=0;
  for(var i=0;i<n;i++){
    var j=(i+1)%n,x1=v[2*i],y1=v[2*i+1],x2=v[2*j],y2=v[2*j+1];
    A+=x1*y2-x2*y1;
    P+=Math.hypot(x2-x1,y2-y1);
  }
  return [Math.abs(A)*0.5,P];
}
function centroid(v){
  var n=v.length>>1,sx=0,sy=0;
  for(var i=0;i<n;i++){sx+=v[2*i];sy+=v[2*i+1];}
  return [sx/n,sy/n];
}

/* ---------- the maps ---------- */
function applyDrop(cx,cy,r2){
  for(var i=0;i<polys.length;i++){
    var v=polys[i].v;
    for(var k=0;k<v.length;k+=2){
      var dx=v[k]-cx,dy=v[k+1]-cy,dd=dx*dx+dy*dy;
      if(dd<1e-8)continue;
      var s=Math.sqrt((dd+r2)/dd);
      v[k]=cx+dx*s;v[k+1]=cy+dy*s;
    }
  }
}
/* a single tine: line through (mx,my) along unit (ux,uy), pull length lam, decay z */
function applyTine(mx,my,ux,uy,lam,z){
  var px=-uy,py=ux;
  for(var i=0;i<polys.length;i++){
    var v=polys[i].v;
    for(var k=0;k<v.length;k+=2){
      var d=Math.abs((v[k]-mx)*px+(v[k+1]-my)*py);
      var f=lam*z/(d+z);
      v[k]+=ux*f;v[k+1]+=uy*f;
    }
  }
}
function applyComb(mx,my,ux,uy,lam,z,teeth,space){
  var px=-uy,py=ux,half=(teeth-1)/2;
  for(var t=0;t<teeth;t++){
    var o=(t-half)*space;
    applyTine(mx+px*o,my+py*o,ux,uy,lam,z);
  }
}
function clampAll(){
  var top=trayY+0.5,bot=trayY+trayH-0.5;
  for(var i=polys.length-1;i>=0;i--){
    var v=polys[i].v;
    for(var k=0;k<v.length;k+=2){
      if(v[k]<trayX)v[k]=trayX; else if(v[k]>trayX+trayW)v[k]=trayX+trayW;
      if(v[k+1]<top)v[k+1]=top; else if(v[k+1]>bot)v[k+1]=bot;
    }
    var ap=areaPerim(v);
    if(ap[0]<2.5)polys.splice(i,1);
  }
  while(polys.length>92)polys.shift();
}
function convect(dt){
  var s=dt/16.7*(0.55+(temp()-16)*0.085);
  for(var i=0;i<polys.length;i++){
    var v=polys[i].v;
    for(var k=0;k<v.length;k+=2){
      var nx=(v[k]-trayX)/trayW,ny=(v[k+1]-trayY)/trayH;
      var vy=0.030*Math.sin(Math.PI*nx)*(0.55+0.45*Math.cos(Math.PI*ny))+0.012;
      var vx=0.018*Math.sin(2*Math.PI*ny)*Math.cos(Math.PI*nx);
      v[k]+=vx*s;v[k+1]+=vy*s;
    }
  }
}

/* ---------- drops ---------- */
function effTension(idx){return COLS[idx].base*(1-0.52*gall);}
function tryDrop(x,y){
  if(pull||rupture)return;
  var idx=seq%COLS.length,eff=effTension(idx);
  if(eff<BREAK){startRupture();return;}
  var margin=film-eff;
  if(margin<=0.004){ /* beads and goes down through the film */
    sinking={x:x,y:y,r:9+R()*3,age:0,rgb:COLS[idx].rgb};
    snd.thud();
    seq++;film-=0.004;
    return;
  }
  var base=Math.min(trayW,trayH);
  var r=(0.030+0.155*Math.min(1,margin/0.34))*base*(0.86+R()*0.28);
  r=Math.max(11,Math.min(r,base*0.30));
  opening={x:x,y:y,r:r,cur:0,rgb:COLS[idx].rgb,age:0,dur:210+r*1.5};
  film=Math.min(film,eff)-0.014;
  seq++;
  snd.plip(r/base);
}
function startRupture(){
  rupture={t:0};
  snd.rip();
}

/* ---------- the pull ---------- */
function buildSheet(){
  var c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(trayW*DPR));c.height=Math.max(2,Math.round(trayH*DPR));
  var g=c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#ddd6c3';g.fillRect(0,0,trayW,trayH);
  /* transferred pigment */
  g.save();g.translate(-trayX,-trayY);
  drawPolysTo(g,1);
  g.restore();
  /* alum coverage: patches that dried unevenly on the lath take unevenly */
  g.globalCompositeOperation='destination-out';
  var patches=[],np=2+Math.floor(R()*4);
  for(var i=0;i<np;i++){
    var px=R()*trayW,py=R()*trayH,pr=trayW*(0.045+R()*0.09);
    patches.push([px,py,pr]);
    g.globalAlpha=0.45+R()*0.42;
    g.beginPath();
    var nn=9+Math.floor(R()*5);
    for(var k=0;k<nn;k++){
      var a=k/nn*Math.PI*2,rr=pr*(0.62+R()*0.62);
      var X=px+Math.cos(a)*rr,Y=py+Math.sin(a)*rr*0.8;
      if(k===0)g.moveTo(X,Y);else g.lineTo(X,Y);
    }
    g.closePath();g.fill();
  }
  /* a lath edge that never took */
  if(R()<0.5){g.globalAlpha=0.5;g.fillRect(0,trayH-(6+R()*16),trayW,20);}
  /* the flake takes nothing */
  g.globalAlpha=1;
  g.beginPath();g.arc(fleck.x-trayX,fleck.y-trayY,4.4,0,7);g.fill();
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  /* paper showing back through where nothing transferred */
  var back=document.createElement('canvas');
  back.width=c.width;back.height=c.height;
  var bg=back.getContext('2d');bg.setTransform(DPR,0,0,DPR,0,0);
  bg.fillStyle='#ddd6c3';bg.fillRect(0,0,trayW,trayH);
  bg.drawImage(c,0,0,trayW,trayH);
  paperCv=back;
  return patches;
}
function sampleColour(x,y){
  try{
    var d=pctx.getImageData(Math.round(x*DPR),Math.round(y*DPR),1,1).data;
    if(d[3]<28)return null;
    return [d[0],d[1],d[2]];
  }catch(e){return null;}
}
function startPull(){
  if(pull||rupture)return;
  var patches=buildSheet();
  pull={phase:'roll',p:0,patches:patches};
}
function commitLift(){
  /* everything on the bath went with the sheet. what is left is residue. */
  var res=[],i,k;
  for(i=0;i<pull.patches.length;i++){
    var P=pull.patches[i],nb=2+Math.floor(R()*3);
    for(k=0;k<nb;k++){
      var x=trayX+P[0]+(R()-0.5)*P[2]*1.2, y=trayY+P[1]+(R()-0.5)*P[2]*1.2;
      var col=sampleColour(x,y);
      if(!col)continue;
      res.push({rgb:col,v:blob(x,y,3+R()*7),t0:5,res:true});
    }
  }
  for(i=0;i<7;i++){
    var x2=trayX+R()*trayW,y2=trayY+R()*trayH,c2=sampleColour(x2,y2);
    if(c2)res.push({rgb:c2,v:blob(x2,y2,2+R()*4),t0:3.5,res:true});
  }
  polys=res;
  film=Math.min(0.93,film+0.20);
  /* strip for the stack edge */
  try{
    var s=document.createElement('canvas');s.width=240;s.height=8;
    var sg=s.getContext('2d');
    sg.drawImage(paperCv,0,Math.round(trayH*0.28*DPR),paperCv.width,Math.round(trayH*0.16*DPR),0,0,240,8);
    stripSrc.push(s.toDataURL('image/png'));
    if(stripSrc.length>24)stripSrc.shift();
    var im=new Image();im.src=stripSrc[stripSrc.length-1];stripImg.push(im);
    if(stripImg.length>24)stripImg.shift();
  }catch(e){}
  stackN++;saveStack();
  var prevY=trayY;
  layout();
  var dy=trayY-prevY;
  if(dy){for(var q=0;q<polys.length;q++){var v=polys[q].v;for(var z=1;z<v.length;z+=2)v[z]+=dy;}}
}
function blob(x,y,r){
  var v=[],n=10+Math.floor(R()*7);
  for(var i=0;i<n;i++){var a=i/n*Math.PI*2,rr=r*(0.6+R()*0.75);v.push(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  return v;
}

/* ---------- skim ---------- */
function skimAt(x){
  var w=52,removed=0;
  for(var i=polys.length-1;i>=0;i--){
    var p=polys[i];
    var c=centroid(p.v);
    if(Math.abs(c[0]-x)<w){
      var ap=areaPerim(p.v),th=2*ap[0]/Math.max(1,ap[1]);
      if(p.res||th/p.t0<0.19){polys.splice(i,1);removed++;}
    }
  }
  if(removed)film=Math.min(0.945,film+0.011*removed);
}

/* ---------- drawing ---------- */
function drawPolysTo(g,alphaMul){
  for(var i=0;i<polys.length;i++){
    var p=polys[i],v=p.v;
    if(v.length<6)continue;
    var ap=areaPerim(v);
    var th=2*ap[0]/Math.max(1,ap[1]);
    var cov=Math.min(1,th/p.t0);
    var a=(0.30+0.70*cov)*alphaMul;
    g.beginPath();g.moveTo(v[0],v[1]);
    for(var k=2;k<v.length;k+=2)g.lineTo(v[k],v[k+1]);
    g.closePath();
    g.fillStyle='rgba('+p.rgb[0]+','+p.rgb[1]+','+p.rgb[2]+','+a.toFixed(3)+')';
    g.fill();
    g.lineWidth=0.9;
    g.strokeStyle='rgba('+p.rgb[0]+','+p.rgb[1]+','+p.rgb[2]+','+(a*0.55).toFixed(3)+')';
    g.stroke();
  }
}

var scumSeed=mulberry32(3311),scumT=[],scumB=[];
function buildScum(){
  scumT=[];scumB=[];var rr=mulberry32(9124);
  for(var i=0;i<=120;i++){scumT.push(rr());scumB.push(rr());}
}
buildScum();

function bathBG(){
  /* size: olive-grey, thicker and greener toward the near rail; lead bottom faintly through */
  var g=ctx.createLinearGradient(0,trayY,0,trayY+trayH);
  g.addColorStop(0,'#7f826e');g.addColorStop(0.55,'#7c7f6b');g.addColorStop(1,'#63684f');
  ctx.fillStyle=g;ctx.fillRect(trayX,trayY,trayW,trayH);
  /* lead tray bottom, colder grey, showing through in patches */
  ctx.save();
  ctx.globalAlpha=0.13;ctx.fillStyle='#8d9187';
  var rr=mulberry32(551);
  for(var i=0;i<26;i++){
    var x=trayX+rr()*trayW,y=trayY+rr()*trayH,w=trayW*(0.06+rr()*0.16),h=trayH*(0.03+rr()*0.09);
    ctx.beginPath();ctx.ellipse(x,y,w,h,rr()*3,0,7);ctx.fill();
  }
  ctx.restore();
  if(noisePat){
    ctx.save();ctx.globalAlpha=0.055;ctx.fillStyle=noisePat;
    ctx.fillRect(trayX,trayY,trayW,trayH);ctx.restore();
  }
}
function wetGleam(now){
  /* cold north window on a moving film. flat, no bloom. */
  ctx.save();
  ctx.globalAlpha=0.045;ctx.fillStyle='#f1f4ee';
  var d=(now*0.012)%(trayW+400)-200;
  ctx.beginPath();
  ctx.moveTo(trayX+d,trayY);
  ctx.lineTo(trayX+d+46,trayY);
  ctx.lineTo(trayX+d+46-trayH*0.35,trayY+trayH);
  ctx.lineTo(trayX+d-trayH*0.35,trayY+trayH);
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.028;
  var d2=(now*0.0075+trayW*0.5)%(trayW+400)-200;
  ctx.fillRect(trayX+d2,trayY,17,trayH);
  ctx.restore();
}
function drawRails(){
  /* far rail */
  ctx.fillStyle='#5b5d5e';
  ctx.fillRect(0,stackH,W,railT);
  ctx.fillRect(0,H-railB,W,railB);
  ctx.fillStyle='#6a6c6c';
  ctx.fillRect(0,stackH,W,1.4);
  ctx.fillRect(0,H-railB,W,1.2);
  ctx.fillStyle='#4c4e4f';
  ctx.fillRect(0,stackH+railT-2,W,2);
  ctx.fillRect(0,H-2.4,W,2.4);
  /* crust of dried pigment scum along the inside lip */
  ctx.fillStyle='#6f5a3c';
  var i,x,h;
  ctx.beginPath();ctx.moveTo(0,stackH+railT);
  for(i=0;i<=120;i++){x=i/120*W;h=scumT[i]*3.6+0.5;ctx.lineTo(x,stackH+railT+h);}
  ctx.lineTo(W,stackH+railT);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,H-railB);
  for(i=0;i<=120;i++){x=i/120*W;h=scumB[i]*4.2+0.6;ctx.lineTo(x,H-railB-h);}
  ctx.lineTo(W,H-railB);ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.5;ctx.fillStyle='#8a6f45';
  for(i=0;i<70;i++){var xx=(i*137.5)%W;ctx.fillRect(xx,H-railB-1.4-scumB[i%120]*2,2.2,1.4);}
  ctx.globalAlpha=1;
}
function drawStack(){
  if(stackN<=0)return;
  ctx.fillStyle='#c8c1ad';ctx.fillRect(0,0,W,stackH);
  ctx.fillStyle='#a79f8b';ctx.fillRect(0,stackH-1.2,W,1.2);
  var n=Math.min(stripImg.length,Math.floor(stackH/2.4));
  for(var i=0;i<n;i++){
    var im=stripImg[stripImg.length-1-i];
    var y=stackH-(i+1)*2.4;
    var ox=((i*53)%9)-4;
    if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,ox,y,W+8,2.0);}
    ctx.fillStyle='rgba(70,66,56,0.30)';ctx.fillRect(0,y+2.0,W,0.5);
  }
  ctx.fillStyle='rgba(40,38,32,0.22)';ctx.fillRect(0,0,W,1);
}
function drawFleck(){
  /* four millimetres of dried skin off the top of the red jar. sits proud. */
  ctx.save();
  ctx.translate(fleck.x,fleck.y);
  ctx.beginPath();
  var p=fleck.pts;
  ctx.moveTo(p[0]+1.3,p[1]+1.5);
  for(var i=2;i<p.length;i+=2)ctx.lineTo(p[i]+1.3,p[i+1]+1.5);
  ctx.closePath();ctx.fillStyle='rgba(46,44,36,0.34)';ctx.fill();
  ctx.beginPath();ctx.moveTo(p[0],p[1]);
  for(i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);
  ctx.closePath();
  ctx.fillStyle='#8e2f20';ctx.fill();
  ctx.strokeStyle='rgba(60,20,12,0.55)';ctx.lineWidth=0.7;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-1.6,-1.2);ctx.lineTo(0.9,-2.0);ctx.lineTo(1.4,-0.4);
  ctx.closePath();ctx.fillStyle='rgba(241,244,238,0.30)';ctx.fill();
  ctx.restore();
}
function drawBead(){
  var idx=seq%COLS.length,c=COLS[idx].rgb;
  var bx=W-40,by=H-railB*0.52;
  var rx=6.5+11*gall, ry=6.5-3.6*gall;
  ctx.save();
  ctx.beginPath();ctx.ellipse(bx,by+1.4,rx*1.05,ry*0.9,0,0,7);
  ctx.fillStyle='rgba(30,28,24,0.35)';ctx.fill();
  ctx.beginPath();ctx.ellipse(bx,by,rx,ry,0,0,7);
  ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';ctx.fill();
  ctx.beginPath();ctx.ellipse(bx-rx*0.28,by-ry*0.34,rx*0.24,ry*0.24,0,0,7);
  ctx.fillStyle='rgba(241,244,238,0.55)';ctx.fill();
  ctx.restore();
}

/* ---------- render loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(50,now-last);last=now;

  /* --- physics --- */
  if(rupture){
    rupture.t+=dt;
    var pr=Math.min(1,rupture.t/2000),push=(1-pr)*7.5*dt/16.7;
    for(var i=0;i<polys.length;i++){
      var v=polys[i].v;
      for(var k=0;k<v.length;k+=2){
        var ny=(v[k+1]-trayY)/trayH-0.5;
        v[k+1]+=Math.sign(ny||1)*push*(0.45+Math.abs(ny));
        v[k]+=((v[k]-trayX)/trayW-0.5)*push*0.8;
      }
    }
    clampAll();
    if(rupture.t>2100){
      var res=[];
      for(i=0;i<10;i++){
        var xr=trayX+R()*trayW,yr=R()<0.5?trayY+2+R()*8:trayY+trayH-10+R()*8;
        res.push({rgb:COLS[Math.floor(R()*4)].rgb,v:blob(xr,yr,2+R()*5),t0:4,res:true});
      }
      polys=res;rupture=null;film=0.90;gall=Math.min(gall,0.42);
    }
  }
  if(opening){
    opening.age+=dt;
    var f=Math.min(1,opening.age/opening.dur);
    var target=opening.r*Math.pow(f,0.62);
    var add=target*target-opening.cur*opening.cur;
    if(add>0){applyDrop(opening.x,opening.y,add);opening.cur=target;}
    if(f>=1){
      polys.push({rgb:opening.rgb,v:circlePoly(opening.x,opening.y,opening.cur,Math.max(64,Math.round(opening.cur*1.4))),t0:opening.cur,res:false});
      opening=null;
    }
  }
  if(sinking){
    sinking.age+=dt;
    sinking.r*=Math.pow(0.9965,dt);
    if(sinking.age>900)sinking=null;
  }
  if(pull){
    if(pull.phase==='roll'){
      pull.p+=dt/1000;
      if(pull.p>=1){pull.p=0;pull.phase='lift';snd.suck();commitLift();}
    }else{
      pull.p+=dt/900;
      if(pull.p>=1)pull=null;
    }
  }
  if(!pull||pull.phase!=='roll'){
    convect(dt);
    for(var q=0;q<polys.length;q++)resample(polys[q]);
    clampAll();
  }
  var tot=0;for(q=0;q<polys.length;q++)tot+=polys[q].v.length>>1;
  MAXSEG=2.5*Math.max(1,tot/9500);

  /* --- draw --- */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  bathBG();

  pctx.setTransform(DPR,0,0,DPR,0,0);
  pctx.clearRect(0,0,W,H);
  drawPolysTo(pctx,1);
  if(opening){
    pctx.beginPath();pctx.arc(opening.x,opening.y,opening.cur,0,7);
    pctx.fillStyle='rgb('+opening.rgb[0]+','+opening.rgb[1]+','+opening.rgb[2]+')';
    pctx.fill();
  }
  if(sinking){
    pctx.beginPath();pctx.arc(sinking.x,sinking.y,sinking.r,0,7);
    var sa=Math.max(0,1-sinking.age/900);
    pctx.fillStyle='rgba('+sinking.rgb[0]+','+sinking.rgb[1]+','+sinking.rgb[2]+','+(sa*0.95)+')';
    pctx.fill();
    pctx.lineWidth=1.4;pctx.strokeStyle='rgba(24,26,22,'+(sa*0.5)+')';pctx.stroke();
  }
  if(noisePat){
    pctx.save();
    pctx.globalCompositeOperation='source-atop';
    pctx.globalAlpha=0.20;pctx.fillStyle=noisePat;pctx.fillRect(0,0,W,H);
    pctx.restore();
  }

  ctx.save();
  ctx.beginPath();ctx.rect(trayX,trayY,trayW,trayH);ctx.clip();
  if(pull&&pull.phase==='roll'){
    var line=trayY+pull.p*trayH;
    ctx.save();ctx.beginPath();ctx.rect(trayX,line,trayW,trayY+trayH-line);ctx.clip();
    ctx.drawImage(pig,0,0,W,H);ctx.restore();
  }else{
    ctx.drawImage(pig,0,0,W,H);
  }
  wetGleam(now);
  if(opening){
    var ha=0.55*(1-opening.age/opening.dur);
    ctx.strokeStyle='rgba(241,244,238,'+Math.max(0,ha)+')';
    ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(opening.x,opening.y,opening.cur*0.94,-2.5,-0.4);ctx.stroke();
  }
  drawFleck();
  if(skim.on){
    ctx.save();ctx.globalAlpha=0.82;ctx.fillStyle='#cfc8b4';
    ctx.fillRect(skim.x-52,trayY,104,trayH);
    ctx.globalAlpha=0.25;ctx.fillStyle='#8b8571';
    ctx.fillRect(skim.x-52,trayY,3,trayH);ctx.fillRect(skim.x+49,trayY,3,trayH);
    ctx.restore();
  }
  if(pull){
    var yTop,yBot;
    if(pull.phase==='roll'){yTop=trayY;yBot=trayY+pull.p*trayH;}
    else{var off=pull.p*(trayH+stackH+railT+8);yTop=trayY-off;yBot=trayY+trayH-off;}
    if(paperCv){
      ctx.save();
      ctx.beginPath();ctx.rect(trayX,Math.max(trayY-2000,yTop),trayW,yBot-yTop);ctx.clip();
      ctx.drawImage(paperCv,trayX,yTop,trayW,trayH);
      ctx.restore();
      ctx.fillStyle='rgba(241,244,238,0.85)';
      ctx.fillRect(trayX,yBot-1.6,trayW,1.8);
      ctx.fillStyle='rgba(60,62,52,0.30)';
      ctx.fillRect(trayX,yBot,trayW,2.4);
    }
  }
  ctx.restore();

  drawRails();
  drawStack();
  drawBead();

  if(pull&&pull.phase==='lift'&&paperCv){
    var off2=pull.p*(trayH+stackH+railT+8);
    var yT=trayY-off2;
    if(yT<stackH+railT){
      ctx.save();
      ctx.beginPath();ctx.rect(0,0,W,stackH+railT);ctx.clip();
      ctx.drawImage(paperCv,trayX,yT,trayW,trayH);
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
var down=false,mode=null,lx=0,ly=0,lt=0,startx=0,starty=0,startt=0,moved=0,holdTimer=null;
var skim={on:false,x:0};
var gallDrag=null;

function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function inRail(y){return y<stackH+railT+6||y>H-railB-6;}
function nearBead(x,y){return Math.abs(x-(W-40))<26&&y>H-railB-10;}

cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  snd.start();
  var p=pos(e);
  down=true;moved=0;startx=lx=p[0];starty=ly=p[1];startt=lt=performance.now();
  if(nearBead(p[0],p[1])){mode='gall';gallDrag=p[0];return;}
  if(inRail(p[1])){mode='skim';skim.on=true;skim.x=p[0];skimAt(p[0]);return;}
  mode='pending';
  holdTimer=setTimeout(function(){
    if(down&&moved<9&&mode==='pending'){mode='pull';startPull();}
  },600);
},{passive:true});

cv.addEventListener('pointermove',function(e){
  var p=pos(e),now=performance.now();
  var dx=p[0]-lx,dy=p[1]-ly,d=Math.hypot(dx,dy),dt=Math.max(1,now-lt);
  if(!down){lx=p[0];ly=p[1];lt=now;return;}
  moved+=d;
  if(mode==='gall'){
    gall=Math.max(0,Math.min(1,gall+(p[0]-gallDrag)/260));
    gallDrag=p[0];lx=p[0];ly=p[1];lt=now;return;
  }
  if(mode==='skim'){
    skim.x=p[0];skimAt(p[0]);lx=p[0];ly=p[1];lt=now;
    snd.slither(Math.min(1,d/dt*0.4),0.4);
    return;
  }
  if(mode==='pull'||pull||rupture){lx=p[0];ly=p[1];lt=now;return;}
  if(mode==='pending'&&moved>7){mode='drag';if(holdTimer)clearTimeout(holdTimer);}
  if(mode!=='drag'){lx=p[0];ly=p[1];lt=now;return;}
  if(d<0.6){lt=now;return;}
  var speed=d/dt;
  var z=decayLen();
  var comb=speed>1.45;
  var steps=Math.min(9,Math.max(1,Math.ceil(d/6)));
  var ux=dx/d,uy=dy/d;
  var space=Math.max(14,Math.min(W,H)*0.032);
  for(var s=0;s<steps;s++){
    var f=(s+0.5)/steps;
    var mx=lx+dx*f,my=ly+dy*f,lam=d/steps;
    if(comb)applyComb(mx,my,ux,uy,lam,z*0.46,13,space);
    else applyTine(mx,my,ux,uy,lam,z);
  }
  if(comb)snd.teeth(speed);
  snd.slither(Math.min(1,speed*0.55),Math.max(0,1-(temp()-23)/6));
  lx=p[0];ly=p[1];lt=now;
},{passive:true});

function endPointer(e){
  if(!down)return;
  down=false;
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  var now=performance.now();
  if(mode==='pending'&&moved<9&&now-startt<560){
    tryDrop(Math.max(trayX+4,Math.min(trayX+trayW-4,startx)),Math.max(trayY+4,Math.min(trayY+trayH-4,starty)));
  }
  skim.on=false;mode=null;gallDrag=null;
  snd.slither(0,1);
}
cv.addEventListener('pointerup',endPointer,{passive:true});
cv.addEventListener('pointercancel',endPointer,{passive:true});
cv.addEventListener('pointerleave',function(){snd.slither(0,1);});

window.addEventListener('wheel',function(e){
  e.preventDefault();
  snd.start();
  gall=Math.max(0,Math.min(1,gall-e.deltaY*0.00075));
},{passive:false});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',function(){layout();});

/* ---------- sound: everything synthesised ---------- */
var snd=(function(){
  var A=null,master=null,slG=null,slF=null,slSrc=null,started=false,noiseBuf=null;
  function mkNoise(){
    var n=A.sampleRate*2,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    return b;
  }
  function start(){
    if(started)return;
    try{
      A=new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){return;}
    started=true;
    if(A.state==='suspended')A.resume();
    master=A.createGain();master.gain.value=0.5;master.connect(A.destination);
    noiseBuf=mkNoise();
    slSrc=A.createBufferSource();slSrc.buffer=noiseBuf;slSrc.loop=true;
    slF=A.createBiquadFilter();slF.type='bandpass';slF.frequency.value=1400;slF.Q.value=2.4;
    slG=A.createGain();slG.gain.value=0;
    slSrc.connect(slF);slF.connect(slG);slG.connect(master);
    slSrc.start();
    radiator();press();guillotine();
  }
  function env(node,g,a,d){
    var t=A.currentTime;
    node.gain.cancelScheduledValues(t);
    node.gain.setValueAtTime(0.0001,t);
    node.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+a);
    node.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  }
  function burst(freq,q,g,a,d,type){
    if(!A)return;
    var s=A.createBufferSource();s.buffer=noiseBuf;
    var f=A.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
    var gn=A.createGain();
    s.connect(f);f.connect(gn);gn.connect(master);
    env(gn,g,a,d);s.start();s.stop(A.currentTime+a+d+0.05);
  }
  function tone(f0,f1,g,dur,type){
    if(!A)return;
    var o=A.createOscillator();o.type=type||'sine';
    var gn=A.createGain();
    o.frequency.setValueAtTime(f0,A.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),A.currentTime+dur);
    o.connect(gn);gn.connect(master);
    env(gn,g,0.004,dur);
    o.start();o.stop(A.currentTime+dur+0.06);
  }
  return {
    start:start,
    plip:function(rel){
      if(!A)return;
      var f=1180-780*Math.min(1,rel*3.4);
      tone(f*1.9,f*0.55,0.14,0.11,'sine');
      burst(f*2.4,1.6,0.08,0.003,0.05);
    },
    thud:function(){ /* beaded, refused, went down through */
      if(!A)return;
      tone(180,72,0.10,0.16,'sine');
      burst(420,0.9,0.035,0.004,0.10,'lowpass');
    },
    slither:function(v,bright){
      if(!A||!slG)return;
      var t=A.currentTime;
      slG.gain.setTargetAtTime(Math.min(0.075,v*0.075),t,0.045);
      slF.frequency.setTargetAtTime(700+2100*v*(0.35+0.65*bright),t,0.06);
      slF.Q.setTargetAtTime(1.4+3*bright,t,0.1);
    },
    teeth:function(sp){
      if(!A)return;

        (function(k){setTimeout(function(){burst(2600+Math.random()*1500,7,0.014,0.001,0.018);},k*17);})(i);
      }
    },
    suck:function(){
      if(!A)return;
      var s=A.createBufferSource();s.buffer=noiseBuf;
      var f=A.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2600,A.currentTime);
      f.frequency.exponentialRampToValueAtTime(320,A.currentTime+0.55);
      var gn=A.createGain();
      s.connect(f);f.connect(gn);gn.connect(master);
      env(gn,0.13,0.05,0.52);s.start();s.stop(A.currentTime+0.7);
      tone(150,58,0.09,0.34,'sine');
    },
    rip:function(){
      if(!A)return;
      var s=A.createBufferSource();s.buffer=noiseBuf;
      var f=A.createBiquadFilter();f.type='highpass';f.frequency.value=900;
      var gn=A.createGain();
      s.connect(f);f.connect(gn);gn.connect(master);
      env(gn,0.11,0.02,1.9);s.start();s.stop(A.currentTime+2.1);
      tone(90,40,0.08,1.2,'sine');
    }
  };
  function radiator(){
    setTimeout(function(){
      if(A){
        var n=1+Math.floor(Math.random()*3);
