  <meta name="outbox-spec-era" content="Saturday 5 November 1988, right now — twenty past eight on a black wet morning in a two-chair hairdressing room on the ground floor of a house on Hafnarstræti in Akureyri, north Iceland, forty minutes before the first head is in the chair and with six booked in before two. The object on the page is the room's own working shade ring: forty-eight swatches of real hair on a brass ring with a card behind each one, made up in this room over eleven years and re-made in pieces whenever a swatch goes off. It is not the manufacturer's ring — that one is in the drawer with the timings crossed out on it. Not a look-back at anything, not a lament, not a memory of a vanished trade: the ring has to be right by nine because a woman is coming in at nine who has been coloured somewhere else and needs matching, the town's hot water is geothermal and sulphurous and every formula in the room is adjusted for it, and four of the ash swatches have gone visibly warm on the ring itself since they were made.">
  <meta name="outbox-spec-format" content="A BROWSEABLE SHADE RING — the whole page is a directory made of hair, and you browse it by fanning it. The entire viewport, edge to edge, is a brass split-ring lying on a salon counter seen straight down at true size, carrying forty-eight numbered swatches of real hair each stapled through a punched card. No header, no menu, no index page, no vertical scroll, no scrollbar, no site chrome. You DRAG in an arc to fan the ring open and closed, and the swatches spread and overlap exactly as a fanned ring does, so most of what you see at any moment is the top two centimetres of thirty-odd swatches and the whole of two or three; the swatch numbers run 1 through 48 in level order and the ring is the only navigation that exists. PRESS any swatch and it swings out to the front of the ring, where its full length can be turned in the light and where its card is readable on the reverse — level, tone, base, developer volume, mixing ratio, timing, and whatever has been written on it since. Beside the ring on the counter lie the three things the room actually works with: a plastic tint bowl, a brush, and a measuring cylinder; you can mix in the bowl, brush it onto any swatch on the ring, and that swatch is coloured for good.">
  <meta name="outbox-spec-subject" content="The flat chemistry of permanent oxidative hair colour, and specifically that almost nothing about it works the way the box says. That TINT DOES NOT LIFT TINT — the artificial pigment already polymerised inside a previously coloured cortex is not touched by another tint, so a woman who has been dark for two years and wants to be light is a bleach-and-tone job or she is nothing, and every single person who gets this wrong gets it wrong in the same direction, twice. That the level system runs 1 to 10, black to lightest blonde, and it is a measurement of how much melanin is left and not a colour name. That LIFTING EXPOSES UNDERLYING PIGMENT IN A FIXED ORDER and always the same order — red, red-orange, orange, gold, yellow, pale yellow — because that is the order the eumelanin goes and the pheomelanin stays, so anybody who lifts a level 4 two steps is holding orange whether they wanted orange or not, and cancelling it is complementary-colour arithmetic on a wheel and not an opinion: blue kills orange, violet kills yellow, green kills red, and the amount is proportional to how much is showing. That DEVELOPER VOLUME SETS LIFT AND NOT DEPOSIT — 10 volume is 3% peroxide, 20 is 6, 30 is 9, 40 is 12, each ten volumes buys roughly one further level of lift and no more, and a person doubling the peroxide to get a lighter result gets the same lift, a swollen cuticle and a dry head. That AMMONIA IS THE DOOR: it takes the mix to about pH 9.5 and swells the cuticle so the small colourless precursors can get into the cortex, where peroxide oxidises them and they couple into a large coloured molecule that is then physically too big to come back out, which is the entire reason permanent colour is permanent and the entire reason it cannot be corrected by washing. That the reaction is essentially finished at thirty-five minutes and leaving it on for an hour deposits nothing further. That MIXING RATIO IS CONCENTRATION: 1:1 and 1:2 out of the same tube are two different depths and the ratio is printed on the tube in the smallest type on it. That POROSITY IS THE WHOLE PROBLEM in practice — a porous end has a lifted cuticle and drinks the mix, so the same bowl over one head produces three different results down the length, and ash on porous ends goes flat and grey-green while the same ash on the mid-lengths is exactly right. That SCALP HEAT IS A REAL VARIABLE worth about half a level: the first centimetre off the scalp processes measurably faster, which is why regrowth goes on last and why a virgin head is done mid-lengths first, roots last, and why the person doing it in their own bathroom starts at the parting and ends up with a hot root and cold ends every time. That GREY HAIR HAS NO MELANIN AT ALL, so it takes only what is deposited and shows the tone naked — put a pure ash on a head that is 80% white and it comes out violet-grey, which is why you carry a proportion of natural base in every grey coverage formula, and the proportion is a function of the percentage of white and nothing else. That resistant white with a tight cuticle has to be pre-softened or the mix simply sits on top of it. That WATER CHEMISTRY IS NOT A DETAIL HERE: the hot water in this town is geothermal and carries sulphur and dissolved iron, both of which react with peroxide — iron catalytically decomposes it so the mix is doing less lifting than the volume says, and sulphur dulls and shifts every ash formula warm and slightly muddy, which means every printed timing on every card in the manufacturer's box is written for somebody else's tap. That copper picked up from pipes or a swimming pool goes green under peroxide and is not a toning problem. That old henna with metallic salts will genuinely heat up and smoke in a bowl and the only honest test is a cutting in a saucer. That THE SHADE RING ITSELF LIES, and lies in a known direction: swatches are real hair standing in salon light for years, the fugitive blue-violet ash bases go first, so every ash on an old ring reads warmer than it will come out, and the ring has to be re-made in pieces or every match made off it is wrong by the same amount. And the flat arithmetic in the room: forty-eight swatches, six heads booked before two, one woman at nine who has been coloured somewhere else and cannot say with what, and a shade ring that is four swatches out of true.">
  <meta name="outbox-spec-tone" content="The orderly, clipped, field-then-value DICTATION voice of Ásta Guðjónsdóttir, forty-four, who has run these two chairs for eleven years and who is speaking every word of this page aloud to be written onto the cards — so it is not description and it is not conversation, it is a person reading out entries in a fixed order. 'Number 31. Base, natural. Tone, ash. Developer, twenty volume. Ratio one to one. Thirty-five minutes and not a minute of that is optional.' Present tense, second person, addressed to whoever is standing at the counter with the pen. She does not narrate, does not explain, does not teach, does not summarise and never says why she is doing any of it — the cards get fields and the fields get values. She breaks the dictation in exactly three ways and no others: to correct a printed manufacturer's timing out loud and say what she is putting instead ('The box says twenty-five. Cross it. Thirty-five.'), to give a number for something ('Water at the tap this morning, fifty-two degrees, and it smells like it always does'), and to re-dictate a whole entry from the top because she has changed one value halfway through and will not have a card with a correction on it. She is specifically and repeatedly annoyed about exactly one thing — that every timing, every ratio and every grey-coverage proportion in the manufacturer's literature is written for soft water and the rep has been told this twice — and she says it three times, once with the rep's name. She is proud of exactly one thing and mentions it twice: that she has never once matched a head off the printed chart in the drawer, only off the ring, and she gives the year she stopped. Never wry, never deadpan, never nostalgic, never charmed by any of it, never a craftsman-sage, never chatty, never confiding — she has six in before two and the ring has to be right by nine.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the most important colour on the page is COMPUTED and never chosen. The counter is 1988 laminate in a hard speckled grey-mint (#b9c4bb) with a lighter fleck (#cfd6cd), scrubbed pale and slightly hazed where the ring is set down every day, and permanently stained in three small hard-edged blots of old tint that have gone brown-violet (#5c4450). Cards are cheap punched stock in a warm dry cream (#e7dfcb), going greasier and more translucent at the thumbed corners (#d3c8ab). Against that, EVERY SWATCH'S COLOUR IS THE OUTPUT OF PIGMENT ARITHMETIC AND NOBODY ANYWHERE PICKS A SHADE: each swatch is several thousand individual fibres, each carrying an actual diameter, an actual remaining eumelanin fraction, an actual remaining pheomelanin fraction, an actual deposited artificial dye load with its own hue and an actual porosity, and its rendered colour is computed per fibre from those five numbers — so a swatch is never one colour, a 'level 7' reads as a real spread of fibres and not as a flat block, and grey coverage renders honestly as white fibres carrying only deposit sitting among pigmented fibres carrying both. The natural series therefore falls out at level 1 near-black with a brown cast (#120e0c), level 4 (#4a2f1e), level 6 (#7a5230), level 7 lifted and honestly orange underneath (#9b6a34), level 8 gold (#c39a52), level 9 pale yellow (#e0c98a), level 10 (#efe3bf), and white fibres at (#ded9d2). Ash and violet deposits are subtractive overlays on whatever is underneath, so ash on a lifted level 6 goes muddy khaki (#6f6a55) and ash on a level 9 goes clean (#b7b3ac) and the difference is arithmetic. FADE IS LIVE AND PERMANENT: every swatch accumulates real light exposure whenever it is fanned to the outside of the ring, blue-violet dye molecules are given a real fugitive rate and warm ones a slow one, so the ash swatches drift warm across visits and the ring goes progressively out of true and never comes back. Wet hair renders measurably darker, glossier and clumped, and dries on an honest curve. Brass ring and staples are dull yellow metal (#9c8340) with one hard moving specular. Exactly one chip of the room's price-list red (#c0342b) is held strictly for the struck-through manufacturer's timings on the cards, the ruled TAP WATER line, and the word RESISTANT — it never touches a swatch, a bowl or the counter. Flat, hard, high contrast, no glow, no bloom, no soft focus, no gradients other than honest per-fibre variance, honest wet gloss and honest fade.">
  <meta name="outbox-spec-wildcard" content="Swatch 22 is not hair. It is a length of modacrylic doll fibre that got onto the ring at some point and was stapled to a card like everything else. The engine treats it exactly as physics treats it: it carries no melanin to remove and no cuticle to open, so oxidation does nothing to it and no precursor diffuses into it — every mix brushed onto it wets it, sits on it, rinses off it and leaves it identically the colour it has always been, a hard flat orange-blonde that matches nothing else on the ring. It renders slightly too glossy and slightly too uniform against real hair at every moment. It fans in rotation like every other swatch, it takes a card, it accumulates no fade at all while the swatches either side of it go warm around it, and it cannot be removed, unstapled, unhooked, marked or set aside by anything the visitor can do. Ásta dictates its card in the same order as every other card, values and all, says once that it came off a display head and that she keeps it because it is the only thing in the room that never changes, and never mentions it again. Same swatch, same staple, same position between 21 and 23, every visit.">
  <meta name="outbox-spec-forbidden" content="NO hair-as-metaphor for anything — not identity, not reinvention, not what women do to themselves, not shedding a past, not roots-as-origins, not 'the colour grows out and the truth comes back'; this is remaining eumelanin, a peroxide concentration and thirty-five minutes, and it has nothing to teach anybody. ABSOLUTELY NO makeover register: no transformation arc, no before-and-after, no big reveal in the mirror, no confidence, no empowerment, no self-care, no 'she walked out a different woman', no client-with-a-story, no divorce haircut, no crying in the chair. NO salon-as-confessional and NO gossip-hub sentiment: no aren't-hairdressers-therapists, no the-women-of-the-town, no warm-community-of-women framing, no eavesdropped-secrets, no everybody-comes-through-that-door. NO beauty-industry critique in either direction: no vanity sermon, no ageing-and-grey-hair essay, no natural-versus-dyed moralising, no chemicals-are-bad, no patriarchy essay, no advertising critique. NO sensuous material writing about hair, foam or light beyond diameter, porosity, water content, gloss and computed colour — no describing anything as silk, ribbons, spun, molten, poured, or falling like anything, and no smell writing at all beyond one flat statement of what the tap water smells of. NO colour lyricism: no describing a shade as warm, honeyed, autumnal, ashen-as-mood; colour here is a pigment load and an undertone showing at a known level. NO Iceland travelogue and NO explaining Iceland to anybody: no sagas, no elves, no aurora, no volcanoes, no glaciers, no black sand, no puffins, no Björk, no Sigur Rós, no hygge, no Nordic noir, no unpronounceable-names joke, no aren't-they-hardy, no darkness-of-the-northern-winter reverie, no Icelandic vocabulary imported as texture beyond a street name and a person's name, no dialect spelling, no financial or political history of any period. NO 1988-as-period-signifier: no Cold War drift, no perms-and-shoulder-pads joke, no eighties retro-kitsch, no camp, no ironic affection for laminate, tint tubes, hood dryers or a fanned swatch ring. NO nostalgia, NO wistfulness, NO 'nobody makes their own shade rings anymore / it all comes out of a computer now / the last of the two-chair rooms' decline narrative — six are booked before two and one of them is at nine. NO craftsman-sage register, NO 'the old colourists could read a head from the door', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc, NO wise absent teacher. NO chemistry-as-wonder, NO teaching voice, NO explainer framing, NO science-communicator enthusiasm, NO 'and here's the clever part' — the cards get fields and values and nothing is explained to anybody. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, hair-video, colour-mixing-video, ambient-visualiser or screensaver framing of the fan, the bowl or the whisking. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the doll swatch, the ring going out of true, or the woman at nine who cannot say what was put on her — nothing here is wrong. NO archival / museum / cabinet / drawer / specimen / collection / relic framing of the ring whatsoever, despite it being forty-eight labelled samples on a hook — it was made in this room, four of its cards are getting rewritten this morning, and it is going to be used at nine. NO ledger, registry, inventory, index or card-catalogue framing either. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is twenty past eight in the morning with the lights on and the sleet going. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / salon-as-parlour / cabinet-of-hobbyists scaffolding, and the word salon never carries any meaning here except a room with two chairs in it.">

<script>
"use strict";
/* Ásta keeps the printed chart in the drawer. Since 1979 nothing has been
   matched off it. The ring is four swatches out of true this morning and
   the woman at nine cannot say what was put on her. 555-PEPR is pencilled
   on the back of card 12 in someone else's hand. */

const KEY="hafnarstraeti.ring.1988.v2";

/* ============ pigment maths ============ */
// A fibre: d diameter, E eumelanin, P pheomelanin, por porosity(0..1),
// dye array of {h,s,l-ish as subtractive triple, c concentration}
function rnd(a){ // small deterministic-ish jitter
  return Math.random()*a;
}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

// underlying pigment colour from remaining melanin
function melaninRGB(E,P){
  // Eumelanin: broad absorber, drives darkness with brown cast.
  // Pheomelanin: red-orange, stays.
  let l = Math.pow(1-clamp(E,0,1), 1.05);      // luminance floor from eumelanin
  let base = 18 + l*232;
  let r = base, g = base*(0.88 - 0.10*(1-l)), b = base*(0.70 - 0.22*(1-l));
  // pheomelanin adds absorbed blue/green -> orange showing
  const p = clamp(P,0,1);
  const showing = p * Math.pow(1-clamp(E,0,1),0.75); // only shows once eumelanin thins
  g -= showing*95;
  b -= showing*165;
  r += showing*16;
  return [clamp(r,6,255),clamp(g,4,250),clamp(b,3,244)];
}
// subtractive deposit overlay
function applyDye(rgb,dyes){
  let [r,g,b]=rgb;
  for(const d of dyes){
    const c=clamp(d.c,0,1.6);
    if(c<=0.0005) continue;
    // d.a = absorbance triple 0..1 per channel
    r*=Math.pow(1-d.a[0]*0.94,c);
    g*=Math.pow(1-d.a[1]*0.94,c);
    b*=Math.pow(1-d.a[2]*0.94,c);
  }
  return [r,g,b];
}
function fibreRGB(f){
  let rgb;
  if(f.syn){ rgb=[201,140,74]; }              // 22
  else rgb = melaninRGB(f.E,f.P);
  rgb = applyDye(rgb,f.dye);
  // porosity scatters -> lighter, flatter, chalkier
  const po=clamp(f.por,0,1);
  rgb=[rgb[0]+(196-rgb[0])*po*0.20, rgb[1]+(192-rgb[1])*po*0.22, rgb[2]+(186-rgb[2])*po*0.24];
  // water darkens and saturates
  const w=clamp(f.w,0,1);
  rgb=[rgb[0]*(1-0.34*w),rgb[1]*(1-0.36*w),rgb[2]*(1-0.36*w)];
  return rgb;
}

function melForLevel(L){
  // level 1..10 -> eumelanin high..low ; pheomelanin decays much slower
  const t=(L-1)/9;
  const E=Math.pow(1-t,1.35)*0.98+0.005;
  const P=(0.30+0.26*Math.sin(t*2.1))*Math.pow(1-t*0.55,0.9);
  return [E,P];
}

/* ============ build fibres ============ */
const NF=340; // rendered fibre samples per swatch (each stands for ~10 real)
function makeSwatch(i){
  const d=DEF[i];
  const syn = d[1]==="SYN";
  const L = syn?7:d[0];
  const tube = syn?null:TUBES.find(t=>t.id===d[1]);
  const fibres=[];
  for(let k=0;k<NF;k++){
    if(syn){
      fibres.push({syn:1,E:0,P:0,por:0.02,w:0,dye:[],d:0.075+rnd(0.006)});
      continue;
    }
    const white = Math.random()<d[3];
    let [E,P]=melForLevel(L+ (Math.random()*1.1-0.55));
    if(white){E=0.004;P=0.008;}
    const dye=[];
    if(d[2]>0){
      const cc = d[2]*(white?1.12:1)*(0.86+Math.random()*0.3);
      dye.push({a:tube.a.slice(),c:cc,fug:tube.fug,id:tube.id});
      if(tube.id==="A"||tube.id==="AA"||tube.id==="V"){
        // carried natural base in grey formulas
        if(d[3]>0) dye.push({a:[0.34,0.44,0.55],c:cc*0.55*d[3],fug:0.28,id:"N"});
      }
    }
    fibres.push({
      syn:0,
      E:clamp(E,0,1),P:clamp(P,0,1),
      por:clamp(d[4]+rnd(0.09),0,1),
      w:0, dye,
      d:0.055+rnd(0.03)
    });
  }
  return {
    n:i+1, syn, level:L, toneId:syn?"SYN":d[1], whiteFrac:d[3],
    fibres, dose:0, remade:0, clock:0, running:false, note:"",
    printed: CARD_TIMES[i]||25,
    vol: syn?20:(L>=8?30:20),
    ratio: (d[1]==="A"||d[1]==="AA"||d[1]==="V")?2:1
  };
}

/* ============ light dose / fade ============ */
// applied per animation frame to swatches near the outside of the fan
function fadeSwatch(t,dose){
  if(t.syn) return;
  t.dose+=dose;
  for(const f of t.fibres){
    for(const d of f.dye){
      d.c*= (1 - dose*0.00050*d.fug);
      if(d.c<0) d.c=0;
    }
  }
}

/* ============ the bowl ============ */
const bowl={
  tube:null, vol:20, ratio:1, dev:0, tint:0, water:0, waterKind:"tap",
  whisked:0, age:0, h2o2:0, pH:7, precursor:0, mixed:false
};
function bowlRecompute(){
  bowl.tint = bowl.tube? (bowl.dev/bowl.ratio) : 0;
  const total=bowl.dev+bowl.tint+bowl.water;
  if(total<=0){bowl.h2o2=0;bowl.pH=7;bowl.precursor=0;return;}
  const pct=bowl.vol*0.3; // 10 vol = 3%
  let h=(bowl.dev*pct)/total;
  // dissolved iron catalytically decomposes peroxide
  if(bowl.waterKind==="tap") h*= (1 - 0.34*(bowl.water/total));
  bowl.h2o2Base=h;
  bowl.pH = bowl.tube? 9.5 - 0.6*(bowl.water/total) : 4.2;
  bowl.precursor = bowl.tube? (bowl.tint/total)*1.0 : 0;
}
function bowlH2O2(){
  // honest working life: peroxide falls once whisked
  const decay = Math.exp(-bowl.age/2400) * (0.55+0.45*clamp(bowl.whisked/9,0,1));
  return (bowl.h2o2Base||0)*decay;
}
function bowlRGB(){
  if(!bowl.tube) return [188,188,182];
  const em=Math.exp(-bowl.age/1800);
  let r=232,g=228,b=218;
  const a=bowl.tube.a, c=clamp(bowl.precursor*1.9,0,1.4);
  r*=Math.pow(1-a[0]*0.7,c); g*=Math.pow(1-a[1]*0.7,c); b*=Math.pow(1-a[2]*0.7,c);
  // oxidised bowls darken and go grey-brown as they stand
  const ox=1-em;
  r=r*(1-ox*0.35)+40*ox; g=g*(1-ox*0.38)+36*ox; b=b*(1-ox*0.40)+34*ox;
  const wet=clamp(bowl.whisked/8,0,1);
  return [r*(1-0.06*wet)+8*wet,g*(1-0.06*wet)+8*wet,b*(1-0.06*wet)+8*wet];
}

/* ============ application ============ */
// applied per fibre zone: 0 root, 1 mid, 2 tip
function brush(t,zone,pass){
  if(!bowl.tube||bowl.dev<=0) return false;
  const h=bowlH2O2(), pre=bowl.precursor, pH=bowl.pH;
  const n=t.fibres.length;
  for(let k=0;k<n;k++){
    const f=t.fibres[k];
    const z=k/n; // sample position stands for length position
    let inZone = zone===1 ? (z>0.28&&z<0.78) : zone===0 ? z<=0.34 : z>=0.72;
    if(!inZone) continue;
    // a fast pass leaves under-loaded fibres
    const load = pass*(0.55+Math.random()*0.55);
    f.w=clamp(f.w+load*0.7,0,1);
    if(!f.mix) f.mix={h:0,pre:0,pH:7,t:0,tube:bowl.tube,kind:bowl.waterKind};
    f.mix.h=Math.max(f.mix.h, h*load);
    f.mix.pre=Math.max(f.mix.pre, pre*load);
    f.mix.pH=pH; f.mix.tube=bowl.tube; f.mix.kind=bowl.waterKind;
    f.mix.zone=zone;
  }
  return true;
}
// step the reaction on a swatch by dt seconds of "processing"
function process(t,dt){
  let any=false;
  const heat = 1.0; // scalp heat is a head variable; on the ring the room is the room
  for(const f of t.fibres){
    if(!f.mix||f.mix.h<=0&&f.mix.pre<=0) continue;
    any=true;
    const m=f.mix;
    m.t+=dt;
    if(f.syn){ continue; } // no cuticle, no cortex, nothing to do
    const openness = clamp((m.pH-7)/2.6,0,1)*(0.55+0.55*f.por);
    // ---- LIFT: eumelanin goes first, pheomelanin much slower
    const k = m.h*0.00072*openness*heat;
    const dE = f.E*(1-Math.exp(-k*dt));
    f.E=clamp(f.E-dE,0,1);
    const dP = f.P*(1-Math.exp(-k*0.13*dt));
    f.P=clamp(f.P-dP,0,1);
    // ---- DEPOSIT: diffuse in, couple, saturate around 35 min
    if(m.pre>0 && m.tube){
      const sat = 1-Math.exp(-m.t/900); // ~ done by 2100 s
      const rate = m.pre*openness*0.00042*(1-sat*0.94);
      let cadd = rate*dt;
      let a=m.tube.a.slice(), fug=m.tube.fug;
      // sulphur shifts blue-violet deposit warm and dulls it
      if(m.kind==="tap" && (m.tube.id==="A"||m.tube.id==="AA"||m.tube.id==="V")){
        a[0]*=0.80; a[1]*=0.94; a[2]*=1.12; cadd*=0.90;
      }
      let ex=f.dye.find(d=>d.id===m.tube.id);
      if(!ex){ ex={a,c:0,fug,id:m.tube.id}; f.dye.push(ex); }
      // porous fibres grab harder
      ex.c += cadd*(0.75+f.por*1.25);
      if(ex.c>1.5) ex.c=1.5;
    }
    // ---- porosity: one way, always up
    f.por=clamp(f.por + m.h*0.0000042*dt + (m.pH>8?0.0000012*dt:0),0,1);
    // drying
    f.w=clamp(f.w-dt*0.00028,0,1);
  }
  return any;
}
function rinse(t){
  for(const f of t.fibres){
    if(f.mix){ f.mix=null; }
    f.w=1;
  }
}

const ringC=document.getElementById("ringCanvas"), rx=ringC.getContext("2d");

let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  [ringC,benchC,hazeC].forEach(c=>{
    c.width=W*DPR; c.height=H*DPR;

function drawHaze(){
  hx.clearRect(0,0,W,H);
  // laminate fleck
  hx.globalAlpha=1;
  for(let i=0;i<Math.floor(W*H/900);i++){
    const x=Math.random()*W,y=Math.random()*H;
    hx.fillStyle= Math.random()<0.62 ? "#cfd6cd" : "#a9b4aa";
    hx.fillRect(x,y,1.2,1.2);
  }
  // scrubbed pale halo where the ring is set down
  const cx=W*0.5, cy=H*0.52;
  const g=hx.createRadialGradient(cx,cy,10,cx,cy,Math.min(W,H)*0.52);
  g.addColorStop(0,"rgba(214,222,213,0.55)");
  g.addColorStop(1,"rgba(214,222,213,0)");
  hx.fillStyle=g; hx.fillRect(0,0,W,H);
  // three hard-edged blots
  const blots=[[0.18,0.76,7],[0.194,0.784,4],[0.83,0.21,9]];
  hx.fillStyle="#5c4450";
  blots.forEach(b=>{
    hx.beginPath();
    const bxp=W*b[0],byp=H*b[1],r=b[2];
    for(let a=0;a<Math.PI*2;a+=0.35){
      const rr=r*(0.8+Math.random()*0.45);
      const px=bxp+Math.cos(a)*rr, py=byp+Math.sin(a)*rr*0.85;
      a===0?hx.moveTo(px,py):hx.lineTo(px,py);
    }
    hx.closePath(); hx.fill();
  });
}

/* ============ the ring geometry ============ */
let fanPos = 0;            // continuous 0..47, which swatch is at the front
let fanSpread = 0.62;      // how open the fan is
let front = 0;
let turned = false;

function ringLayout(){
  const cx=W*0.5, cy=H*(W<760?0.60:0.56);
  const R=Math.min(W,H)*(W<760?0.40:0.42);
  return {cx,cy,R};
}

function drawSwatch(ctx,t,x,y,ang,len,wid,alpha,isFront){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang);
  ctx.globalAlpha=alpha;
  // card
  const cw=wid*1.25, ch=len*0.30;
  ctx.fillStyle="#e7dfcb";
  ctx.fillRect(-cw/2,0,cw,ch);
  ctx.fillStyle="rgba(211,200,171,0.9)";
  ctx.fillRect(-cw/2,ch-ch*0.28,cw,ch*0.28);
  ctx.strokeStyle="rgba(150,140,116,.8)"; ctx.lineWidth=0.7;
  ctx.strokeRect(-cw/2+.35,.35,cw-.7,ch-.7);
  // punch hole
  ctx.fillStyle="rgba(160,170,158,1)";
  ctx.beginPath(); ctx.arc(0,ch*0.30,cw*0.085,0,7); ctx.fill();
  // number
  if(cw>16){
    ctx.fillStyle="#3a342c";
    ctx.font=(Math.max(7,cw*0.24))+"px Helvetica, Arial, sans-serif";
    ctx.textAlign="center";
    ctx.fillText(t.n, 0, ch*0.82);
  }
  // staple
  ctx.strokeStyle="#9c8340"; ctx.lineWidth=Math.max(1,cw*0.05);
  ctx.beginPath(); ctx.moveTo(-cw*0.20,ch*0.60); ctx.lineTo(cw*0.20,ch*0.60); ctx.stroke();

  // fibres
  const n=t.fibres.length;
  const step=wid/n;
  const hl=len*0.70;
  const glossy = t.syn;
  const stride = isFront?1:(wid<40?3:2);
  for(let k=0;k<n;k+=stride){
    const f=t.fibres[k];
    const rgbv=fibreRGB(f);
    const wob = t.syn? 0 : (Math.sin(k*0.87)*0.5+Math.sin(k*2.3)*0.3);
    const clump = f.w>0.25? Math.sin(k*0.34)*f.w*wid*0.02 : 0;
    const x0=-wid/2+k*step + clump;
    ctx.strokeStyle="rgb("+(rgbv[0]|0)+","+(rgbv[1]|0)+","+(rgbv[2]|0)+")";
    ctx.lineWidth=Math.max(0.6,f.d*step*14*stride);
    ctx.beginPath();
    ctx.moveTo(x0,ch);
    ctx.bezierCurveTo(x0+wob*1.2,ch+hl*0.36, x0+wob*2.2,ch+hl*0.72, x0+wob*2.9,ch+hl*(0.94+ (t.syn?0.04:Math.random()*0.10)));
    ctx.stroke();
  }
  // honest wet gloss / synthetic gloss: one hard specular band
  let wetAvg=0; for(let k=0;k<n;k+=8) wetAvg+=t.fibres[k].w; wetAvg/= (n/8);
  const sheen = glossy?0.30:wetAvg*0.42;
  if(sheen>0.02){
    ctx.globalAlpha=alpha*sheen;
    ctx.fillStyle="#f2efe6";
    ctx.fillRect(-wid*0.34, ch+hl*0.26, wid*0.30, hl*0.055);
    ctx.globalAlpha=alpha;
  }
  ctx.restore();
}

function draw(){
  rx.clearRect(0,0,W,H);
  const {cx,cy,R}=ringLayout();
  // brass split ring
  rx.save();
  rx.strokeStyle="#7d6830"; rx.lineWidth=Math.max(5,R*0.045);
  rx.beginPath(); rx.arc(cx,cy,R*0.30,0.15,Math.PI*2-0.05); rx.stroke();
  rx.strokeStyle="#9c8340"; rx.lineWidth=Math.max(3,R*0.028);
  rx.beginPath(); rx.arc(cx,cy,R*0.30,0.15,Math.PI*2-0.05); rx.stroke();
  const sp=(performance.now()/2600)%(Math.PI*2);
  rx.strokeStyle="rgba(240,228,178,0.85)"; rx.lineWidth=Math.max(2,R*0.016);
  rx.beginPath(); rx.arc(cx,cy,R*0.30,sp,sp+0.38); rx.stroke();
  rx.restore();

  const N=48;
  const order=[];
  for(let i=0;i<N;i++){
    let rel=i-fanPos;
    while(rel>24) rel-=48; while(rel<-24) rel+=48;
    order.push({i,rel});
  }
  order.sort((a,b)=>Math.abs(b.rel)-Math.abs(a.rel));
  const spreadRad = fanSpread*0.052;
  for(const o of order){
    const t=SW[o.i];
    const ang = o.rel*spreadRad;
    if(Math.abs(ang)>2.0) continue;
    const dist=Math.abs(o.rel);
    const alpha= clamp(1-dist/34,0.12,1);
    const isFront = o.rel===0 || (Math.abs(o.rel)<0.5);
    const pivotX=cx+Math.sin(ang)*R*0.30;
    const pivotY=cy-Math.cos(ang)*R*0.30*0.55 + R*0.02;
    const len = R*1.30*(isFront&&turned?0.92:1);
    const wid = Math.min(W,H)*0.115;
    // outside-of-fan light dose
    if(dist<3.2 && !paused) fadeSwatch(t, 0.030*(1-dist/3.2)*(1+fanSpread));
    drawSwatch(rx,t,pivotX,pivotY,ang, len, wid, alpha, isFront);
  }

  // front swatch swung out
  const t=SW[front];
  if(turned){
    drawCardBack(rx,t,cx,cy,R);
  }
}

function drawCardBack(ctx,t,cx,cy,R){
  const w=Math.min(W*0.62,300), h=Math.min(H*0.40,210);
  const x=cx-w/2, y=cy-h*0.16;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(-0.02);
  ctx.fillStyle="rgba(35,30,24,.20)"; ctx.fillRect(3,4,w,h);
  ctx.fillStyle="#e7dfcb"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="#a89c7f"; ctx.lineWidth=1; ctx.strokeRect(.5,.5,w-1,h-1);
  ctx.fillStyle="#d3c8ab"; ctx.beginPath();
  ctx.moveTo(w,h); ctx.lineTo(w-26,h); ctx.lineTo(w,h-26); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(185,196,187,1)";
  ctx.beginPath(); ctx.arc(w-18,16,5,0,7); ctx.fill();
  const lines=cardLines(t);
  ctx.textAlign="left";
  ctx.fillStyle="#2b2620";
  ctx.font="bold 12px Helvetica, Arial, sans-serif";
  ctx.fillText("№ "+t.n, 12, 20);
  let yy=36;
  ctx.font="10px Helvetica, Arial, sans-serif";
  for(const L of lines){
    ctx.fillStyle=L.red?"#c0342b":"#4a4438";
    if(L.strike){
      ctx.fillText(L.t,12,yy);
      const m=ctx.measureText(L.t).width;
      ctx.strokeStyle="#c0342b"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(12,yy-3); ctx.lineTo(12+m,yy-3); ctx.stroke();
    } else {
      ctx.fillText(L.t,12,yy);
    }
    yy+=13;
    if(yy>h-10) break;
  }
  ctx.restore();
}
function cardLines(t){
  const s=analyse(t);
  const out=[];
  out.push({t:"BASE "+(t.syn?"none":s.baseLevel.toFixed(1))+"   TONE "+(TONE_NAMES[t.toneId]||"none")});
  out.push({t:"DEVELOPER "+t.vol+" vol    RATIO 1:"+t.ratio});
  out.push({t:"PRINTED "+t.printed+" min",strike:true,red:true});
  out.push({t:"THIRTY-FIVE"});
  out.push({t:"WHITE "+(t.whiteFrac*100|0)+"%   POROSITY "+(s.por*100|0)});
  out.push({t:"UNDERTONE "+s.under.toUpperCase()});
  if(t.remade) out.push({t:"RE-MADE ×"+t.remade});
  if(t.dose>420&&!t.syn) out.push({t:"READS WARM ON THE RING"});
  if(t.note) out.push({t:t.note.toUpperCase()});
  return out;
}

/* ============ swatch analysis (for the dictation) ============ */
const UNDER=["red","red-orange","orange","gold","yellow","pale yellow"];
function analyse(t){
  let E=0,P=0,por=0,w=0,white=0,dyeC=0;
  const n=t.fibres.length;
  let rs=0,gs=0,bs=0;
  for(const f of t.fibres){
    E+=f.E;P+=f.P;por+=f.por;w+=f.w;
    if(f.E<0.02&&!f.syn) white++;
    for(const d of f.dye) dyeC+=d.c;
    const c=fibreRGB(f); rs+=c[0];gs+=c[1];bs+=c[2];
  }
  E/=n;P/=n;por/=n;w/=n;dyeC/=n;
  const lum=(rs/n*0.30+gs/n*0.59+bs/n*0.11);
  const baseLevel = clamp(1+9*Math.pow(1-E,1/1.35),1,10);
  const idx=clamp(Math.floor((baseLevel-3)/1.25),0,5);
  return {E,P,por,w,white:white/n,dye:dyeC,lum,baseLevel,
    under: t.syn?"none":UNDER[idx],
    rgb:[rs/n,gs/n,bs/n]};
}

/* ============ dictation text ============ */
const ASH_IDS=["A","AA","V"];
const SAID={};
function dictation(t){
  const s=analyse(t);
  if(t.syn){
    return "Number twenty-two. Base, none. Tone, none. Developer, nothing it will take. Ratio, none. Timing, none. It came off a display head. Write it up the same as the others and leave it where it is — it is the only thing in this room that does not change.";
  }
  const bits=[];
  const numName=numword(t.n);
  bits.push("Number "+numName+".");
  bits.push("Base, "+ (s.white>0.45? "white at "+(Math.round(s.white*20)*5)+" per cent" : s.baseLevel.toFixed(0)) + ".");
  bits.push("Tone, "+(TONE_NAMES[t.toneId]||"natural")+".");
  bits.push("Developer, "+numword(t.vol)+" volume.");
  bits.push("Ratio one to "+numword(t.ratio)+".");
  bits.push("The box says "+t.printed+". Cross it. Thirty-five, and not a minute of that is optional.");
  if(s.por>0.42) bits.push("Porosity, high. It drinks. Put it on last.");
  if(s.white>0.55) bits.push("Carry natural at "+(Math.round(s.white*100/10)*10)+" per cent of the tube. Not less.");
  if(ASH_IDS.includes(t.toneId)&&t.dose>420) bits.push("This one reads warm on the ring now. Match off it and you will be out by half a level. Re-make it.");
  if(s.under!=="none"&&s.baseLevel>5.4) bits.push("Underlying showing, "+s.under+".");
  if(t.note) bits.push(t.note);
  return bits.join(" ");
}
const NUMWORDS=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
function numword(n){
  if(n<=20) return NUMWORDS[n];
  const tens=["","","twenty","thirty","forty","fifty"];
  const a=Math.floor(n/10), b=n%10;
  return tens[a]+(b?"-"+NUMWORDS[b]:"");
}

/* ============ bench (bowl, brush, cylinder, tap, crock) ============ */
function drawBench(){
  bx.clearRect(0,0,W,H);
  const small = W<760;
  const by = small? H*0.10 : H*0.14;
  const bxp = small? W*0.80 : W*0.845;
  const r = Math.min(W,H)*(small?0.055:0.070);
  // bowl
  bx.save();
  bx.fillStyle="rgba(40,36,30,.16)";
  bx.beginPath(); bx.ellipse(bxp+3,by+5,r*1.02,r*0.72,0,0,7); bx.fill();
  bx.fillStyle="#cdd3c9";
  bx.beginPath(); bx.ellipse(bxp,by,r,r*0.70,0,0,7); bx.fill();
  bx.strokeStyle="#8d968c"; bx.lineWidth=1.4; bx.stroke();
  const c=bowlRGB();
  const fill=clamp((bowl.dev+bowl.tint+bowl.water)/70,0,1);
  if(fill>0.01){
    bx.fillStyle="rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
    bx.beginPath(); bx.ellipse(bxp,by+r*0.10*(1-fill),r*0.80*Math.sqrt(fill),r*0.56*Math.sqrt(fill),0,0,7); bx.fill();
    if(bowl.whisked>1){
      bx.globalAlpha=clamp(bowl.whisked/12,0,0.5);
      bx.strokeStyle="#efece2"; bx.lineWidth=1;
      for(let i=0;i<5;i++){
        bx.beginPath();
        bx.ellipse(bxp,by,r*0.20*(i+1)*0.32*Math.sqrt(fill),r*0.14*(i+1)*0.32*Math.sqrt(fill),0.4,0,7); bx.stroke();
      }
      bx.globalAlpha=1;
    }
  }
  // brush laid across
  bx.save();
  bx.translate(bxp-r*0.4,by+r*0.55); bx.rotate(-0.45);
  bx.fillStyle="#3a3a38"; bx.fillRect(0,0,r*1.5,r*0.10);
  bx.fillStyle="#8f8f88"; bx.fillRect(r*1.5,-r*0.03,r*0.42,r*0.16);
  bx.restore();
  bx.restore();

  // measuring cylinder
  const cyx=bxp+r*1.55, cyy=by-r*0.4, cw=r*0.34, chh=r*1.9;
  bx.fillStyle="rgba(216,222,214,.55)"; bx.fillRect(cyx,cyy,cw,chh);
  bx.strokeStyle="#8d968c"; bx.lineWidth=1; bx.strokeRect(cyx+.5,cyy+.5,cw-1,chh-1);
  const lvl=clamp(bowl.devLeft==null?1:bowl.devLeft,0,1);
  bx.fillStyle="rgba(236,240,231,.9)";
  bx.fillRect(cyx+1.5,cyy+chh*(1-lvl)+1,cw-3,chh*lvl-2);
  bx.strokeStyle="rgba(90,96,88,.7)";
  for(let i=1;i<6;i++){
    const yy=cyy+chh*i/6;
    bx.beginPath(); bx.moveTo(cyx,yy); bx.lineTo(cyx+cw*0.55,yy); bx.stroke();
  }

  // tap at frame edge + crock
  const tx=W*(small?0.06:0.055), ty=H*(small?0.13:0.16);
  bx.strokeStyle="#9c8340"; bx.lineWidth=Math.max(4,r*0.16);
  bx.beginPath(); bx.moveTo(tx,ty-r*1.5); bx.lineTo(tx,ty); bx.lineTo(tx+r*0.75,ty); bx.stroke();
  bx.beginPath(); bx.moveTo(tx+r*0.75,ty); bx.lineTo(tx+r*0.75,ty+r*0.35); bx.stroke();
  if(tapOn){
    bx.strokeStyle="rgba(206,216,208,.75)"; bx.lineWidth=2;
    for(let i=0;i<3;i++){
      bx.beginPath();
      bx.moveTo(tx+r*0.75+(i-1)*1.5,ty+r*0.4);
      bx.lineTo(tx+r*0.75+(i-1)*1.5+Math.sin(performance.now()/90+i)*1.2,ty+r*2.1);
      bx.stroke();
    }
  }
  // crock
  bx.fillStyle="#8f8a7c";
  bx.beginPath(); bx.ellipse(tx+r*2.2,ty+r*1.9,r*0.52,r*0.36,0,0,7); bx.fill();
  bx.fillStyle="#a3a08f"; bx.fillRect(tx+r*1.68,ty+r*1.3,r*1.04,r*0.62);
  bx.fillStyle="#7f8a86";
  bx.beginPath(); bx.ellipse(tx+r*2.2,ty+r*1.30,r*0.52,r*0.30,0,0,7); bx.fill();
  bx.fillStyle="rgba(196,206,200,.65)";
  bx.beginPath(); bx.ellipse(tx+r*2.2,ty+r*1.30,r*0.40,r*0.22,0,0,7); bx.fill();
  bx.fillStyle="#5a5348"; bx.font="8px Helvetica, Arial"; bx.textAlign="center";
  bx.fillText("RAIN", tx+r*2.2, ty+r*1.85);
}

/* ============ sound ============ */
let AC=null, master=null, soundOn=false, roomStarted=false;
function ensureAudio(){
  if(AC) return;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return;
  AC=new C();
  master=AC.createGain(); master.gain.value=0.0; master.connect(AC.destination);
  startRoom();
}
function noiseBuf(sec){
  const n=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
let sleetGain,dryerGain,vanGain,wallGain,tapGain,tapNode;
function startRoom(){
  if(roomStarted) return; roomStarted=true;
  const nb=noiseBuf(4);
  // sleet on single glazing, gusting
  const s=AC.createBufferSource(); s.buffer=nb; s.loop=true;
  const sf=AC.createBiquadFilter(); sf.type="highpass"; sf.frequency.value=2600;
  const sf2=AC.createBiquadFilter(); sf2.type="peaking"; sf2.frequency.value=4200; sf2.gain.value=7;
  sleetGain=AC.createGain(); sleetGain.gain.value=0.03;
  s.connect(sf); sf.connect(sf2); sf2.connect(sleetGain); sleetGain.connect(master); s.start();
  // hood dryer next corner, own irregular clock
  const d=AC.createBufferSource(); d.buffer=nb; d.loop=true;
  const df=AC.createBiquadFilter(); df.type="bandpass"; df.frequency.value=430; df.Q.value=1.1;
  dryerGain=AC.createGain(); dryerGain.gain.value=0.014;
  d.connect(df); df.connect(dryerGain); dryerGain.connect(master); d.start();
  // van idling, not being unloaded
  const v=AC.createOscillator(); v.type="sawtooth"; v.frequency.value=41;
  const vf=AC.createBiquadFilter(); vf.type="lowpass"; vf.frequency.value=180;
  vanGain=AC.createGain(); vanGain.gain.value=0.010;
  const lfo=AC.createOscillator(); lfo.frequency.value=1.7;
  const lg=AC.createGain(); lg.gain.value=2.4; lfo.connect(lg); lg.connect(v.frequency); lfo.start();
  v.connect(vf); vf.connect(vanGain); vanGain.connect(master); v.start();
  // two people through a wall, no words
  const w=AC.createBufferSource(); w.buffer=nb; w.loop=true;
  const wf=AC.createBiquadFilter(); wf.type="lowpass"; wf.frequency.value=320;
  const wf2=AC.createBiquadFilter(); wf2.type="highpass"; wf2.frequency.value=110;
  wallGain=AC.createGain(); wallGain.gain.value=0.0;
  w.connect(wf); wf.connect(wf2); wf2.connect(wallGain); wallGain.connect(master); w.start();
  // tap
  const tp=AC.createBufferSource(); tp.buffer=nb; tp.loop=true;
  const tf=AC.createBiquadFilter(); tf.type="bandpass"; tf.frequency.value=1400; tf.Q.value=0.7;
  tapGain=AC.createGain(); tapGain.gain.value=0; tapNode=tf;
  tp.connect(tf); tf.connect(tapGain); tapGain.connect(master); tp.start();
  roomTick();
}
function roomTick(){
  if(!AC) return;
  const t=AC.currentTime;
  if(sleetGain) sleetGain.gain.setTargetAtTime(0.012+Math.random()*0.055,t,1.4);
  if(dryerGain) dryerGain.gain.setTargetAtTime(Math.random()<0.35?0.002:0.016+Math.random()*0.008,t,2.2);
  if(wallGain) wallGain.gain.setTargetAtTime(Math.random()<0.5?0.0:0.006+Math.random()*0.010,t,1.1);
  setTimeout(roomTick, 1400+Math.random()*3000);
}
function clickStaple(count){
  if(!AC||!soundOn) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(); o.type="square";
  const f=1500+count*22+Math.random()*180;
  o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(f*0.55,t+0.02);
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f; bp.Q.value=5;
  const g=AC.createGain(); g.gain.setValueAtTime(0.05,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+0.035);
  o.connect(bp); bp.connect(g); g.connect(master); o.start(t); o.stop(t+0.05);
}
let whiskSrc=null,whiskFilt=null,whiskGain=null;
function whiskStart(){
  if(!AC||whiskSrc) return;
  whiskSrc=AC.createBufferSource(); whiskSrc.buffer=noiseBuf(2); whiskSrc.loop=true;
  whiskFilt=AC.createBiquadFilter(); whiskFilt.type="bandpass"; whiskFilt.Q.value=0.8;
  whiskFilt.frequency.value=1800;
  whiskGain=AC.createGain(); whiskGain.gain.value=0.0;
  whiskSrc.connect(whiskFilt); whiskFilt.connect(whiskGain); whiskGain.connect(master);
  whiskSrc.start();
}
function whiskStop(){
  if(whiskGain) whiskGain.gain.setTargetAtTime(0,AC.currentTime,0.05);
  const s=whiskSrc; whiskSrc=null;
  if(s) setTimeout(()=>{try{s.stop();}catch(e){}},260);
}
function drawHairSound(wetness){
  if(!AC||!soundOn) return;
  const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf(0.5);
  const f=AC.createBiquadFilter(); f.type="bandpass";
  f.frequency.value= 5200 - wetness*3900; f.Q.value=0.6+wetness*2.4;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.030,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0002,t+0.34);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.4);
}
function cylinderDown(){
  if(!AC||!soundOn) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(320,t);
  o.frequency.exponentialRampToValueAtTime(140,t+0.06);
  const g=AC.createGain(); g.gain.setValueAtTime(0.06,t);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.16);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2);
}
let tapOn=false;
function tapToggle(on){
  tapOn=on;
  if(!AC) return;
  tapGain.gain.setTargetAtTime(on?0.030:0, AC.currentTime, 0.12);
  if(on){ // air knock in the pipe
    const t=AC.currentTime;
    const o=AC.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(58,t+0.09);
    const g=AC.createGain(); g.gain.setValueAtTime(0.09,t);
    g.gain.exponentialRampToValueAtTime(0.0004,t+0.22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.25);
  }
}

/* ============ interaction ============ */
let dragging=false, lastAngle=0, vel=0, paused=false;
function angleAt(x,y){
  const {cx,cy}=ringLayout();
  return Math.atan2(y-cy,x-cx);
}
ringC.addEventListener("pointerdown",e=>{
  ensureAudio();
  dragging=true; lastAngle=angleAt(e.clientX,e.clientY);
  ringC.setPointerCapture(e.pointerId);
  dragStart={x:e.clientX,y:e.clientY,t:performance.now()};
});
let dragStart=null;
ringC.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const a=angleAt(e.clientX,e.clientY);
  let d=a-lastAngle;
  while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2;
  lastAngle=a;
  const prev=Math.round(fanPos);
  fanPos += d*7.4;
  fanSpread = clamp(fanSpread + Math.abs(d)*1.4 - 0.004, 0.28, 1.5);
  vel=d*7.4;
  normalise();
  if(Math.round(fanPos)!==prev){ clickStaple(Math.abs(Math.round(fanPos)-prev)+ (fanSpread*10|0)); setFront(); }
});
function endDrag(e){
  if(!dragging) return;
  dragging=false;
  if(dragStart){
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)<7 && performance.now()-dragStart.t<420){
      // press: pick the swatch under the pointer
      pickAt(e.clientX,e.clientY);
    }
  }
}
ringC.addEventListener("pointerup",endDrag);
ringC.addEventListener("pointercancel",()=>{dragging=false;});
function normalise(){
  while(fanPos<0) fanPos+=48;
  while(fanPos>=48) fanPos-=48;
}
function setFront(){
  const f=((Math.round(fanPos)%48)+48)%48;
  if(f!==front){ front=f; turned=false; renderCard(); renderSwRead(); }
}
function pickAt(x,y){
  const {cx,cy,R}=ringLayout();
  const spreadRad=fanSpread*0.052;
  let best=null,bd=1e9;
  for(let i=0;i<48;i++){
    let rel=i-fanPos;
    while(rel>24) rel-=48; while(rel<-24) rel+=48;
    const ang=rel*spreadRad;
    if(Math.abs(ang)>2.0) continue;
    const pivotX=cx+Math.sin(ang)*R*0.30;
    const pivotY=cy-Math.cos(ang)*R*0.30*0.55 + R*0.02;
    // distance from the swatch's axis line
    const len=R*1.30;
    const ex=pivotX+Math.sin(ang)*len, ey=pivotY+Math.cos(ang)*len;
    const t=clamp(((x-pivotX)*(ex-pivotX)+(y-pivotY)*(ey-pivotY))/((ex-pivotX)**2+(ey-pivotY)**2||1),0,1);
    const px=pivotX+(ex-pivotX)*t, py=pivotY+(ey-pivotY)*t;
    const dd=Math.hypot(x-px,y-py) + Math.abs(rel)*0.9;
    if(dd<bd){bd=dd;best=i;}
  }
  if(best!=null && bd< Math.min(W,H)*0.22){
    if(best===front){ turned=!turned; drawHairSound(analyse(SW[front]).w); }
    else { fanPos=best; front=best; turned=false; clickStaple(6); renderCard(); renderSwRead(); }
  }
}

/* keyboard */
window.addEventListener("keydown",e=>{
  ensureAudio();
  const k=e.key;
  if(k==="ArrowLeft"){ fanPos-=1; normalise(); setFront(); clickStaple(4); e.preventDefault(); }
  else if(k==="ArrowRight"){ fanPos+=1; normalise(); setFront(); clickStaple(4); e.preventDefault(); }
  else if(k==="Enter"){ turned=!turned; drawHairSound(analyse(SW[front]).w); e.preventDefault(); }
  else if(k==="1"){ setVol(10); } else if(k==="2"){ setVol(20); }
  else if(k==="3"){ setVol(30); } else if(k==="4"){ setVol(40); }
  else if(k==="w"||k==="W"){ if(!whiskHeld){ whiskHeld=true; whiskStart(); el("whiskBtn").classList.add("on"); } e.preventDefault(); }
  else if(k===" "){ toggleClock(); e.preventDefault(); }
  else if(k==="+"||k==="="){ fanSpread=clamp(fanSpread+0.08,0.28,1.5); }
  else if(k==="-"){ fanSpread=clamp(fanSpread-0.08,0.28,1.5); }
});
window.addEventListener("keyup",e=>{
  if(e.key==="w"||e.key==="W"){ whiskHeld=false; whiskStop(); el("whiskBtn").classList.remove("on"); }
});
let whiskHeld=false;

/* ============ tools wiring ============ */
const tubesEl=el("tubes");
TUBES.forEach(t=>{
  const b=document.createElement("button");
  b.className="tube"; b.textContent=t.name; b.dataset.id=t.id;
  b.onclick=()=>{ ensureAudio(); bowl.tube=t; bowlRecompute();
    [...tubesEl.children].forEach(c=>c.classList.toggle("on",c.dataset.id===t.id));
    renderBowl(); };
  tubesEl.appendChild(b);
});
function setVol(v){
  bowl.vol=v; bowlRecompute();
  document.querySelectorAll("[data-vol]").forEach(b=>b.classList.toggle("on",+b.dataset.vol===v));
  cylinderDown(); renderBowl();
}
document.querySelectorAll("[data-vol]").forEach(b=>b.onclick=()=>{ensureAudio();setVol(+b.dataset.vol);});
setVol(20);
el("ratioBtn").onclick=()=>{ bowl.ratio = bowl.ratio===1?2:1; el("ratioBtn").textContent="1:"+bowl.ratio; bowlRecompute(); renderBowl(); };
el("pourBtn").onclick=()=>{ ensureAudio(); bowl.dev+=10; bowl.mixed=false; bowl.age=Math.max(0,bowl.age-30); bowlRecompute(); cylinderDown(); renderBowl(); };
el("tipBtn").onclick=()=>{ bowl.dev=0;bowl.water=0;bowl.whisked=0;bowl.age=0;bowl.tube=bowl.tube;bowlRecompute();renderBowl(); };
el("waterBtn").onclick=()=>{ ensureAudio(); tapToggle(true); setTimeout(()=>tapToggle(false),900);
  bowl.water+=10; bowl.waterKind="tap"; bowlRecompute(); renderBowl(); };
el("waterBtn").oncontextmenu=e=>{e.preventDefault(); bowl.water+=10; bowl.waterKind="rain"; bowlRecompute(); renderBowl();};
el("whiskBtn").onpointerdown=()=>{ ensureAudio(); whiskHeld=true; whiskStart(); el("whiskBtn").classList.add("on"); };
["pointerup","pointerleave","pointercancel"].forEach(ev=>el("whiskBtn").addEventListener(ev,()=>{ whiskHeld=false; whiskStop(); el("whiskBtn").classList.remove("on"); }));

el("brushBtn").onclick=()=>doBrush(1);
el("brushRoot").onclick=()=>doBrush(0);
el("brushTip").onclick=()=>doBrush(2);
function doBrush(zone){
  ensureAudio();
  const t=SW[front];
  const now=performance.now();
  const pass = lastBrush && now-lastBrush<600 ? 0.42 : 1.0; // a fast pass under-loads
  lastBrush=now;
  if(brush(t,zone,pass)){
    t.running=true;
    drawHairSound(0.8);
    renderSwRead();
  }
}
let lastBrush=0;
el("rinseBtn").onclick=()=>{ ensureAudio(); const t=SW[front]; rinse(t); t.running=false; t.clock=0;
  matched++; save(); drawHairSound(1); renderCard(); renderSwRead(); tapToggle(true); setTimeout(()=>tapToggle(false),1200); };
el("clockBtn").onclick=toggleClock;
function toggleClock(){
  const t=SW[front]; t.running=!t.running;
  el("clockBtn").classList.toggle("on",t.running);
  renderSwRead();
}
el("remakeBtn").onclick=()=>{
  const t=SW[front];
  if(t.syn){ t.note="WILL NOT BE RE-MADE"; renderCard(); return; }
  if(envelope<=0){ t.note="NO HAIR IN THE ENVELOPE"; renderCard(); return; }
  envelope--; remade++; t.remade++; t.dose=0;
  const fresh=makeSwatch(t.n-1);
  t.fibres=fresh.fibres; t.note="";
  save(); drawHairSound(0.1); renderCard(); renderSwRead();
};
el("soundBtn").onclick=()=>{
  ensureAudio();
  soundOn=!soundOn;
  if(master) master.gain.setTargetAtTime(soundOn?0.7:0.0, AC.currentTime, 0.15);
  el("soundBtn").textContent= soundOn?"Sound on":"Sound off";
  el("soundBtn").classList.toggle("on",soundOn);
  if(AC && AC.state==="suspended") AC.resume();
};

function renderBowl(){
  const c=bowlRGB();
  el("bowlSwatch").style.background="rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
  const total=bowl.dev+bowl.tint+bowl.water;
  el("bowlMeter").style.width=clamp(total/70*100,0,100)+"%";
  const h=bowlH2O2();
  el("bowlRead").innerHTML=
    "<b>"+bowl.dev.toFixed(0)+" ml</b> developer · <b>"+bowl.tint.toFixed(0)+" ml</b> tube · "+
    (bowl.water>0?("<b>"+bowl.water.toFixed(0)+" ml</b> "+bowl.waterKind+" water · "):"")+
    "pH <b>"+bowl.pH.toFixed(1)+"</b> · peroxide <b>"+h.toFixed(2)+"%</b>"+
    (bowl.age>240?" · standing "+(bowl.age/60|0)+" min":"")+
    (bowl.whisked<2&&total>0?" · not whisked":"");
}
function renderSwRead(){
  const t=SW[front], s=analyse(t);
  let loaded=0; for(const f of t.fibres) if(f.mix) loaded++;
  el("swRead").innerHTML=
    "№<b>"+t.n+"</b> · base <b>"+(t.syn?"—":s.baseLevel.toFixed(1))+"</b> · porosity <b>"+(s.por*100).toFixed(0)+
    "</b> · water <b>"+(s.w*100).toFixed(0)+"</b>"+
    (loaded?" · on it <b>"+Math.round(loaded/t.fibres.length*100)+"%</b>":"")+
    (t.running?" · clock <b>"+Math.floor(t.clock/60)+":"+String(Math.floor(t.clock%60)).padStart(2,"0")+"</b>":"")+
    (t.clock>2100?' · <span style="color:#c0342b">done</span>':"");
  el("clockBtn").classList.toggle("on",t.running);
}

/* ============ main loop ============ */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  // fan momentum
  if(!dragging && Math.abs(vel)>0.001){
    const prev=Math.round(fanPos);
    fanPos+=vel; vel*=0.90; normalise();
    if(Math.round(fanPos)!==prev){ clickStaple(3); setFront(); }
    fanSpread=clamp(fanSpread-0.004,0.28,1.5);
  }
  // whisk
  if(whiskHeld){
    bowl.whisked=clamp(bowl.whisked+dt*3.2,0,12);
    if(whiskFilt&&whiskGain){
      const thick=clamp(bowl.whisked/12,0,1)*(bowl.tube?1:0.35);
      whiskFilt.frequency.setTargetAtTime(2600-thick*1650,AC.currentTime,0.08);
      whiskFilt.Q.setTargetAtTime(0.7+thick*3.4,AC.currentTime,0.08);
      whiskGain.gain.setTargetAtTime(soundOn?(0.020+thick*0.030):0,AC.currentTime,0.06);
    }
  }
  if(bowl.dev+bowl.water>0) bowl.age+=dt*(bowl.whisked>1?1.6:1.0);
  // processing clocks
  let anyRun=false;
  for(const t of SW){
    if(t.running){
      t.clock+=dt*24;   // one real second ≈ 24 processing seconds; 35 min ≈ 88 s
      process(t,dt*24);
      anyRun=true;
    } else {
      for(const f of t.fibres) if(f.w>0) f.w=clamp(f.w-dt*0.010,0,1);
    }
  }
  draw();
  drawBench();
  if((now|0)%17===0){ renderBowl(); }
  if(anyRun && (now|0)%9===0){ renderSwRead(); }
  saveTick+=dt;
  if(saveTick>6){ saveTick=0; save(); }
  requestAnimationFrame(loop);
}
let saveTick=0;

/* ============ boot ============ */
resize();
fanPos=0; front=0;
renderCard(); renderBowl(); renderSwRead();
requestAnimationFrame(loop);

// One thing said out loud, once, and written on no card.

console.log("Nothing has been matched off the printed chart in the drawer since 1979.");
console.log("Water at the tap this morning, fifty-two degrees, and it smells like it always does.");
console.log("Four ash swatches are out of true. She is in at nine.");
