  <meta name="outbox-spec-era" content="1968, right now — a live oil-wheel liquid light show projecting on the ballroom wall behind a band mid-set: the projectionist working two watch-glasses of dyed water and coloured oil on the hot deck of an overhead projector THIS minute, pressing and rocking the glass so the blobs bloom, churn and marble across the wall while the amps buzz. Not a look-back at 'the great days of the psychedelic light show' and not a 'nobody does the oil wheels anymore' lament — a real projection actually surging on the wall this second, the oil still warming and beading, the band still playing.">
  <meta name="outbox-spec-format" content="The entire viewport IS the projected circle of the liquid light show thrown on the wall, edge to edge — a GENUINELY functional immiscible-fluid blob sim (metaball surface-tension field), not a canned loop: fat beads of coloured oil and pools of dyed water float between the glass, oils beading and refusing to mix, water spreading thin, the whole mess driven by real heat-convection currents rising off the hot lamp so blobs bulge, split, chase and re-merge and never marble the same way twice. Your cursor is the projectionist's thumb pressing the top glass: press and drag to squash the fluid, surging the blobs outward and combing them into wet marbled ribbons that slowly bloom back. No page chrome, no header, no menu, no controls — just the churning wet colour on the wall.">
  <meta name="outbox-spec-subject" content="The plain, entirely practical physics of an oil-wheel liquid light show — how a puddle of dyed water and a few beads of coloured mineral oil trapped between two curved clock-glasses on a hot overhead projector will not mix, the oil pulling itself into fat round beads by surface tension while the water spreads flat around them; how the heat of the lamp sets up convection so the whole trapped film rolls and churns of its own accord; how pressing or tilting the top glass squashes the beads flat and shears them into marbled ribbons that then bead straight back up; why warmer oil runs looser and livelier and cool oil sits sluggish. Not a metaphor for consciousness or a cosmic voyage or anything at all — literally oil, water, dye, curved glass, and a hot lamp, and the honest way immiscible fluids shove each other around.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except one tiny corner stamp and one tiny tally — the register is purely the wordless, hands-on-the-glass delight of running the wheel and watching the colour decide what to do: quick-eyed for which bead is about to split, chuffed when two oils rush together and bounce apart, pleased when a hard press combs the whole film into wet ribbons that slowly ball back up under the lamp's heat. The blobbing is treated as a plain physical fact and a genuine visual pleasure — hot, wet, saturated, alive — NOT trippy, NOT cosmic, NOT mystical, NOT a mind-expanding-journey register, NOT hushed or reverent, NOT poignant. The closest thing to a voice is the oil's own busy refusal to bead the same way twice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Acid-tangerine oil (#ff6b1a) and hot dye-magenta (#e0186f) blooming and shearing over a deep projector-lamp near-black (#0a0508), with one chip of cyan-dyed water (#28c4d8) threading between the oil beads and a hot specular white-gold rim (#ffd27a) catching the crest of each bead where the lamp rakes through it — the wet, back-lit, over-saturated look of coloured oil and water churning on a hot overhead projector, no soft edges, the colour glowing from behind.">
  <meta name="outbox-spec-wildcard" content="Exactly one blob in the whole film is a single small bead of pure clear water that never takes any dye and never merges into anything — squash it flat, comb it, drive it across the glass, and it always draws itself straight back into one perfect colourless round bead, catching only a thin bright rim of lamp-light. It is never labelled, never explained, never counted or treated any differently by the sim; it is simply the one clear bead among all the churning colour that always comes back to a perfect circle, the same clear bead every single visit, for whoever watches the wall long enough to notice.">
  <meta name="outbox-spec-forbidden" content="NO trippy / psychedelic-mystical / 'cosmic journey' / mind-expanding / consciousness-dissolving register despite the light-show subject — this is oil, water and a hot lamp, nothing more, and it has nothing cosmic to teach you. NO meditative-zen / mindfulness / 'let the colour still you / breathe with it' register. NO melancholy / soft-nostalgia / wistful-elegy framing and NO 'the great light-show era is over / nobody runs the oil wheels anymore / the ballrooms went dark' decline narrative — it's a live projection surging on the wall right now. NO liquid-light-as-metaphor-for-the-fluidity-of-life / letting-go / everything-flows life-lesson framing. NO archival / museum / cabinet / drawer / vault / relic framing of the wheel or the glass. NO cryptic-SCP / ominous / 'the clear bead that will not dye is a warning' dread. NO signal / transmission / frequency / broadcast / projection-as-message framing — it is coloured oil, not a signal. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO dry deadpan understatement. NO society / club / cabinet-of-hobbyists scaffolding. And NO instructional UI text, captions, header, footer credits, title overlay, or any narrating voice anywhere on the page beyond the tiny corner stamp and the tiny tally — the piece is otherwise entirely silent and entirely visual.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Colour on the Hot Deck</title>
<!-- two watch-glasses, a puddle of dye, a few beads of oil, one lamp. press the top glass. -->
<style>
  html,body{margin:0;height:100%;background:#0a0508;overflow:hidden;}
  #wall{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair;}
  .mark{
    position:fixed;z-index:5;font-family:'Courier New',monospace;
    font-size:9px;letter-spacing:.18em;color:rgba(255,200,140,.34);
    text-transform:lowercase;user-select:none;
  }
  #tally{right:10px;bottom:9px;text-align:right;pointer-events:none;
    color:rgba(255,150,90,.40);}
  #stamp{left:11px;bottom:9px;text-decoration:none;color:rgba(255,200,140,.34);
    border-bottom:1px solid rgba(255,200,140,.18);padding-bottom:1px;}
  #stamp:hover{color:rgba(255,215,150,.75);}
</style>
</head>
<body>
<canvas id="wall"></canvas>
<a class="mark" id="stamp" href="/archive">◉ more colour on the wall</a>
<div class="mark" id="tally">reels run on this wheel: …</div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('wall');
  var ctx = cv.getContext('2d');
  var W,H,cx,cy,Rg;
  // ---- offscreen metaball buffer ----
  var buf = document.createElement('canvas');
  var bctx = buf.getContext('2d');
  var bw,bh, sx, img, field, cR, cG, cB, clr;

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W; cv.height = H;
    cx = W/2; cy = H/2;
    Rg = Math.min(W,H)*0.60;
    // buffer scale, cap total pixels
    var scale = Math.min(1, Math.sqrt(78000/(W*H)));
    bw = Math.max(80, Math.min(240, Math.round(W*scale)));
    bh = Math.round(bw * H/W);
    buf.width = bw; buf.height = bh;
    sx = bw / W;
    img = bctx.createImageData(bw,bh);
    var n = bw*bh;
    field = new Float32Array(n); cR = new Float32Array(n);
    cG = new Float32Array(n); cB = new Float32Array(n); clr = new Float32Array(n);
  }

  // ---- fluids ----
  var P = [];
  function makeBlob(x,y,r,g,cr,cg,cb,coh,cohR){
    P.push({x:x,y:y,vx:0,vy:0,r:r,g:g,cr:cr,cg:cg,cb:cb,coh:coh,cohR:cohR});
  }
  function seed(){
    P.length = 0;
    var i,a,rr;
    function around(fx,fy,spread,r,g,cr,cg,cb,coh,cohR,n){
      for(i=0;i<n;i++){
        a = Math.random()*6.283; rr = Math.random()*spread;
        makeBlob(cx+fx+Math.cos(a)*rr, cy+fy+Math.sin(a)*rr, r*(0.85+Math.random()*0.3),
                 g,cr,cg,cb,coh,cohR);
      }
    }
    var s = Rg*0.34;
    around(-s*0.5,-s*0.3, Rg*0.20, 14,'oa',255,107,26, 0.055,2.0, 11); // acid tangerine oil
    around( s*0.55, s*0.2, Rg*0.20, 12,'ob',224,24,111, 0.055,2.0, 11); // hot dye-magenta oil
    around( 0, s*0.15, Rg*0.30, 10,'wt',40,196,216, 0.030,2.6, 16);      // cyan dyed water
    // the one clear bead — never dyed, never merged, its own solitary group
    makeBlob(cx+Rg*0.10, cy-Rg*0.22, 13,'cl',0,0,0, 0,0);
  }

  // ---- heat convection flow off the lamp ----
  var t = 0;
  function flow(x,y,out){
    var nx=(x-cx)/120, ny=(y-cy)/120;
    var fx = Math.sin(ny*1.3 + t) + 0.6*Math.cos(nx*0.9 - t*1.1);
    var fy = Math.cos(nx*1.1 - t*0.9) + 0.6*Math.sin(ny*0.8 + t*1.2);
    var dx=x-cx, dy=y-cy, r=Math.sqrt(dx*dx+dy*dy)+1;
    var rr=Math.min(1,r/Rg), th=4*rr*(1-rr); // thermal, strongest mid-radius
    fx += (dx/r)*th*0.9;  fy += (dy/r)*th*0.9;
    out[0]=fx*0.17; out[1]=fy*0.17;
  }

  // ---- pointer (the projectionist's thumb) ----
  var pDown=false, pX=0, pY=0, pvx=0, pvy=0, plx=0, ply=0;
  function pos(e){
    var r=cv.getBoundingClientRect();
    var t=e.touches?e.touches[0]:e;
    return [t.clientX-r.left, t.clientY-r.top];
  }
  cv.addEventListener('pointerdown',function(e){pDown=true;var p=pos(e);pX=plx=p[0];pY=ply=p[1];pvx=pvy=0;});
  cv.addEventListener('pointermove',function(e){var p=pos(e);pX=p[0];pY=p[1];pvx=pX-plx;pvy=pY-ply;plx=pX;ply=pY;});
  window.addEventListener('pointerup',function(){pDown=false;pvx=pvy=0;});
  cv.addEventListener('pointerleave',function(){pDown=false;});

  var tmp=[0,0];
  function step(){
    t += 0.006;
    var i,j,a,b,dx,dy,d2,d,nx,ny,R,ov,f,same,rng;
    var Rp = Math.max(90, Rg*0.42);
    for(i=0;i<P.length;i++){
      a=P[i];
      flow(a.x,a.y,tmp);
      a.vx+=tmp[0]; a.vy+=tmp[1];
    }
    // pairwise surface tension / immiscibility
    for(i=0;i<P.length;i++){
      a=P[i];
      for(j=i+1;j<P.length;j++){
        b=P[j];
        dx=b.x-a.x; dy=b.y-a.y; d2=dx*dx+dy*dy;
        R=a.r+b.r;
        var mx=R*2.6;
        if(d2>mx*mx) continue;
        d=Math.sqrt(d2)||0.001; nx=dx/d; ny=dy/d;
        if(d<R){ // incompressible core — beads shove each other, won't overlap
          ov=(R-d)/R; f=ov*0.60;
          a.vx-=f*nx; a.vy-=f*ny; b.vx+=f*nx; b.vy+=f*ny;
        }
        same = a.g===b.g;
        if(same){
          rng=R*a.cohR;
          if(d>R*0.6 && d<rng){ // surface tension: like pulls to like
            f=a.coh;
            a.vx+=f*nx; a.vy+=f*ny; b.vx-=f*nx; b.vy-=f*ny;
          }
        } else {
          rng=R*1.5;
          if(d<rng){ // immiscible: unlike shoves apart and beads
            var rep = (a.g==='cl'||b.g==='cl')?0.7 :
                      ((a.g==='wt'||b.g==='wt')?0.5:0.32);
            f=rep*(rng-d)/rng;
            a.vx-=f*nx; a.vy-=f*ny; b.vx+=f*nx; b.vy+=f*ny;
          }
        }
      }
    }
    // pointer pressure — squash outward, drag combs into ribbons
    if(pDown){
      for(i=0;i<P.length;i++){
        a=P[i]; dx=a.x-pX; dy=a.y-pY; d=Math.sqrt(dx*dx+dy*dy)||0.001;
        if(d<Rp){
          var w=(1-d/Rp);
          a.vx += (dx/d)*0.85*w + pvx*0.10*w;
          a.vy += (dy/d)*0.85*w + pvy*0.10*w;
        }
      }
    }
    // integrate + contain + damp
    for(i=0;i<P.length;i++){
      a=P[i];
      var sp=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
      if(sp>5){ a.vx*=5/sp; a.vy*=5/sp; }
      a.x+=a.vx; a.y+=a.vy;
      a.vx*=0.86; a.vy*=0.86;
      dx=a.x-cx; dy=a.y-cy; d=Math.sqrt(dx*dx+dy*dy);
      var lim=Rg-a.r*0.5;
      if(d>lim){
        var pu=(d-lim)*0.08;
        a.vx-=(dx/d)*pu; a.vy-=(dy/d)*pu;
        a.x=cx+(dx/d)*lim; a.y=cy+(dy/d)*lim;
      }
    }
  }

  // ---- metaball render ----
  function render(){
    var n=bw*bh,i;
    field.fill(0); cR.fill(0); cG.fill(0); cB.fill(0); clr.fill(0);
    var soft=1.0;
    for(var p=0;p<P.length;p++){
      var a=P[p];
      var bx=a.x*sx, by=a.y*sx, rb=a.r*sx;
      var reach=rb*3.2;
      var x0=Math.max(0,Math.floor(bx-reach)), x1=Math.min(bw-1,Math.ceil(bx+reach));
      var y0=Math.max(0,Math.floor(by-reach)), y1=Math.min(bh-1,Math.ceil(by+reach));
      var rb2=rb*rb, isClr=(a.g==='cl');
      for(var yy=y0;yy<=y1;yy++){
        var dyv=yy-by, dy2=dyv*dyv, row=yy*bw;
        for(var xx=x0;xx<=x1;xx++){
          var dxv=xx-bx, d2=dxv*dxv+dy2;
          var w=rb2/(d2+soft);
          if(w<0.06) continue;
          var idx=row+xx;
          if(isClr){ clr[idx]+=w; }
          else{
            field[idx]+=w;
            cR[idx]+=w*a.cr; cG[idx]+=w*a.cg; cB[idx]+=w*a.cb;
          }
        }
      }
    }
    var T=0.9, dat=img.data, cxb=cx*sx, cyb=cy*sx, Rgb=Rg*sx;
    var k=0;
    for(var y=0;y<bh;y++){
      for(var x=0;x<bw;x++,k++){
        var f=field[k], cf=clr[k];
        // lamp glow background
        var ddx=x-cxb, ddy=y-cyb, dg=Math.sqrt(ddx*ddx+ddy*ddy)/Rgb;
        var glow=Math.max(0,1-dg); glow*=glow;
        var vg = dg>1 ? Math.max(0,1-(dg-1)*3) : 1; // vignette to the circle edge
        var r = (10+glow*40)*vg, g=(5+glow*15)*vg, b=(8+glow*14)*vg;
        var o=k*4;
        if(cf>T && cf>=f){
          // the clear bead — colourless body, one thin bright lamp-rim
          var rim=Math.max(0,Math.min(1,(T+0.30-cf)/0.30));
          rim=rim*rim;
          r = r*(1-rim)+255*rim; g=g*(1-rim)+222*rim; b=b*(1-rim)+150*rim;
        } else if(f>T){
          var rf=cR[k]/f, gf=cG[k]/f, bf=cB[k]/f;
          // thin gold rim where the lamp rakes the bead's crest
          var rim=Math.max(0,Math.min(1,(T+0.25-f)/0.25));
          rf=rf*(1-rim*0.9)+255*rim*0.9;
          gf=gf*(1-rim*0.9)+210*rim*0.9;
          bf=bf*(1-rim*0.9)+122*rim*0.9;
          // hot specular on the fat middle of a bead
          if(f>T+3){ var sc=Math.min(0.4,(f-(T+3))/6);
            rf=rf*(1-sc)+255*sc; gf=gf*(1-sc)+235*sc; bf=bf*(1-sc)+205*sc; }
          r=rf; g=gf; b=bf;
        }
        dat[o]=r; dat[o+1]=g; dat[o+2]=b; dat[o+3]=255;
      }
    }
    bctx.putImageData(img,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(buf,0,0,bw,bh,0,0,W,H);
    // back-lit bloom pass — the wet over-saturated glow
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.5; ctx.filter='blur(9px)';
    ctx.drawImage(buf,0,0,bw,bh,0,0,W,H);
    ctx.restore();
  }

  function loop(){ step(); render(); requestAnimationFrame(loop); }

  // ---- tally (localStorage, only ever counts up) ----
  function tally(){
    var key='oilwheel.reels', v=0;
    try{ v=parseInt(localStorage.getItem(key)||'0',10)||0; v+=1;
         localStorage.setItem(key,String(v)); }catch(e){ v=1; }
    document.getElementById('tally').textContent='reels run on this wheel: '+v;
  }

  window.addEventListener('resize',function(){ resize(); });
  resize(); seed(); tally(); loop();

  console.log('%c one bead in here never takes the dye — squash it flat and it walks itself back to a perfect little circle. watch the wall a while.','color:#ffd27a;background:#0a0508;padding:3px 6px;');
})();
</script>
