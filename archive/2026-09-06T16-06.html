  <meta name="outbox-spec-era" content="September 1993, the Saturday before the eighteenth, on the flat roof of a three-storey block in Estación Central, Santiago — warm spring afternoon, about forty volantines up over six blocks of low roofs, the wind coming down off the cordillera at nine or ten knots and steadying rather than dying, and a hot dusty smell of the empty lot next door. Not a memory, not a look-back, not a childhood: there are two spools of line left on the table downstairs, a man three roofs over on Calle Chorrillos who has taken four kites off this building since Thursday, and about three hours of usable wind.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY that is one fighting kite and one reel, played with a single hand, filling the whole viewport: the sky seen up-and-out from the roof parapet, your own hexagonal paper volantín riding out at the end of a real line, and four or five other people's kites working the same air over the neighbourhood. You FLY it with one continuous gesture — drag toward yourself to haul in, which tensions the line and makes the kite drive hard in whatever direction its nose is pointing; release toward the sky to give line, which goes slack and lets the kite spin loose and reset; small lateral flicks steer, and the kite has no tail so it will not sit still and never does. You FIGHT by putting your line across somebody else's and then working it: contact is real, and cutting is abrasion — the two lines saw against each other at whatever relative speed you actually generate, and the winner is whoever's coating is still on the line at the point of contact. No menu, no levels, no score screen, no scroll: one reel, two spools left, an opponent on Chorrillos, and the wind holding.">
  <meta name="outbox-spec-subject" content="The flat mechanics of cutting somebody's line off a roof, and specifically that a fighting kite is not steered, it is aimed and then released — that a volantín has no tail on purpose, so it is unstable by design and will always rotate to some heading and then FLY that heading the instant the line comes taut, which means the whole control scheme is two states, tirar (pull, line taut, kite drives) and dar hilo (give, line slack, kite spins), and everything anybody does up there is choosing when to switch between them; that the bow in the spine spar sets how hard it drives and how fast it spins, and a spar bowed too much makes a kite that turns beautifully and will not hold a line across the wind; that CUTTING IS SANDING AND NOTHING ELSE — hilo curado is cotton line run through a paste of ground glass and glue, so a line is a file with a finite number of grains on it, and the cut goes to whoever gets more relative motion across the crossing point with more grit still on their line at that exact place; that this is why the classic answer is to give line fast while the other man pulls, because slack line moving through a taut one saws it, and the man who yanks in a panic is doing the sawing for you; that the first fifteen or twenty metres nearest the kite is the only part of a spool that ever sees a fight, so that is the part that goes bald, and a spool that cut six kites on Thursday is smooth where it matters and the rest of it is as sharp as the day it was made and completely useless; that a line under high tension cuts faster and also breaks faster, so there is a real optimum and it is not maximum tension; that WIND GRADIENT is real — the air over a roofline is dirty and gusty for the first several metres and clean above it, which is why a kite launched low fights badly and why the man with the taller building genuinely has an advantage that is not skill; that line SAG is not slack: a hundred metres of cotton has real weight and real drag, so the kite is never where the line points and a beginner aims at the kite instead of at the line; that a cut kite does not dive, it flutters off downwind flat and slow because nothing is holding its nose anywhere, and that is why children run for four blocks and are often right about where it will land; that the cut line falls too, all of it, across roofs and wires and other people's lines, and picking it out of a television aerial is the actual cost of losing; that WIRE IS NOT LINE — anybody flying steel or nylon-cored line cuts everything instantly, cuts hands, and takes the whole afternoon down with it, which is a real argument up here and not a rule anybody enforces; and the flat arithmetic on the parapet, which is two spools left at eight hundred pesos apiece, four kites lost off this roof since Thursday, a volantín that costs less than the line it flies on, and about three hours of wind.">
  <meta name="outbox-spec-tone" content="The loud, fast, running match commentary of Rosita Yáñez, fifty-four, who sells kites and line off a folding table on the corner downstairs and has come up to the roof with her own spool because a man on Chorrillos has taken four kites off this building since Thursday. Present tense, second person, addressed to whoever came up the stairs behind her and is now holding the spare reel and the paper bag. She narrates the fight the way a person narrates a fight nobody else is watching: short bursts with gaps in them, calling shots before she makes them ('now — now I give it — no, not yet'), talking directly AT the kite about half the time and at the man on Chorrillos the rest, knowing perfectly well he cannot hear a word. She is boastful, cheerfully and openly, and the boasts are always priced: she does not say she is good, she says what a spool costs and how many she has sold to people who lost to her. She keeps a running count of cuts today and gets it wrong twice in the other direction, undercounting because she does not count anything she cut by accident. She breaks off mid-sentence three separate times because the wind does something and she has to deal with it, and picks the sentence up afterwards from a different place. She has a long side-argument going about the sausage cart moving to the other corner, which she returns to at random and which has nothing to do with anything. She calls the man on Chorrillos by a nickname and never his name. Explicitly NOT wry, NOT deadpan, NOT a craftsman-sage, NOT wistful, NOT nostalgic, NOT charmed by any of this, NOT anxious, NOT a woman-proving-herself arc, and NOT the competent-tradesperson-saying-every-figure-twice voice.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The ground is spring Santiago sky, which is not blue at this hour — a hazy, dusty, sun-whitened grey-blue (#a9bfcb) that goes measurably paler and browner toward the horizon at the bottom of frame (#cfc6b3) and cooler and cleaner straight up (#7ea3bd), with the cordillera showing along the lower edge as flat unmodelled haze and nothing else. Against that, the kites: papel volantín is tissue, so its rendered value is COMPUTED from whether the sun is behind it or in front of it — a kite edge-on and lit from behind glows hot and translucent with its spars showing through as hard dark lines, and the same kite banked away goes flat, dull and opaque, and this flips several times a second while it spins. The two paper colours in play are a hot fuchsia (#e2357b) and a hard chrome yellow (#f2c400), both bleached toward white where the sun is straight through them (#fbe9ef) and both dropping to a dirty maroon-olive in silhouette (#5a3a45). Line is rendered honestly: a real hairline in dry cotton grey (#b9ae97) that is genuinely invisible against the pale horizon for most of its length and only picks up a specular glint where the glass coating remains, so the BALD SECTION OF YOUR OWN SPOOL IS VISIBLE AS A LENGTH THAT HAS STOPPED SPARKLING, and nothing on the page ever says so. The roof under the bottom edge is unpainted concrete and tar patch (#8f8b80) with a red-oxide parapet cap (#9c4a2c). Exactly one chip of table-oilcloth cobalt (#1f4fa8) is held strictly for the spool cheeks, the plastic bag the spare line came in, and the price written on masking tape on the reel — it never appears on a kite, in the sky, or on the roof. Flat, hard, high contrast, no glow, no bloom, no lens flare, no soft focus, no gradients other than honest atmospheric haze, honest paper translucency and honest glint on remaining grit.">
  <meta name="outbox-spec-wildcard" content="There is a black plastic bag up there. It came off the empty lot on the first big gust and it is in the wind field like everything else — the engine gives it real drag, real mass and real lift, so it soars, sinks, gets caught in the wake off Chorrillos and climbs again, and about once a session it goes higher than any kite in frame. It cannot be cut, it cannot be hooked, and a line laid across it slides off with no abrasion at all. It never leaves during a visit. Rosita mistakes it for a kite exactly once, early, calls a shot on it, and then says what it is and goes back to the fight and never mentions it again. Same bag, same lot, every visit.">
  <meta name="outbox-spec-forbidden" content="NO kites as metaphor for anything — not freedom, not childhood, not aspiration, not the string that keeps you tethered, not letting go, not what rises and what falls; this is a bowed spar, a slack-line autorotation and a per-centimetre grit value, and it has nothing to teach anybody. ABSOLUTELY NO The Kite Runner, NO 'for you, a thousand times over', NO friendship-across-a-divide arc, NO boy-and-his-kite, NO coming-of-age, NO running-for-the-cut-kite as an image of anything. NO sky lyricism whatsoever: no soaring, no dancing, no the-wind-took-it, no clouds, no light-through-paper reverie, no sensuous writing about tissue paper beyond translucency, weight, tear strength and cost. NO Chile travelogue and NO explaining Chile or Santiago to anybody: no Andes majesty, no Neruda, no magical realism, no empanadas-and-cueca colour writing, no Spanish sprinkled in for flavour beyond the handful of words a person on that roof would actually use in the middle of a fight, no dialect spelling, no charming-neighbours sketch. ABSOLUTELY NO Chilean political history imported as atmosphere or subtext: no 1973, no Pinochet, no plebiscite, no disappeared, no dictatorship allegory, no democracy-restored framing, no poverty pathos, no shantytown sociology, no aren't-they-resilient condescension — it is a Saturday, the wind is good, and she sells line. NO nostalgia, NO wistfulness, NO 'nobody flies kites anymore / the wires took it / the last September like this' decline narrative — there are three hours of wind and two spools left. NO danger-porn about glass line: the wire argument is a flat complaint made in the moment and never a cautionary tale, never foreshadowing, never a lesson. NO craftsman-sage register, NO 'the old flyers could feel the cut coming', NO trade mystique, NO reverence for hand-made line, NO artisan-versus-factory sermon, NO master-and-apprentice arc. NO underdog or revenge arc about the man on Chorrillos, NO rivalry pathos, NO he-taught-me-everything twist; he is a man with a better roof. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the flying. NO cryptic-SCP, liminal, uncanny, backrooms or ominous dread about the plastic bag, the bald line or the kite that never lands — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of any object on this roof. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — it is the middle of a bright warm afternoon. NO signal / transmission / frequency / broadcast framing of any sound on the page. NO society / club / guild / association / cabinet-of-hobbyists scaffolding.">

<!-- the bag came off the lot on the first gust. it is not a kite. it stays. -->
<script>
"use strict";
/* ============ persistence: forward only ============ */
var K="rositaroof.v1";
var S;
try{ S=JSON.parse(localStorage.getItem(K)||"null"); }catch(e){ S=null; }
if(!S||typeof S.metres!=="number"){
  S={metres:120, grit:null, spools:0, lost:0, cut:0, pesos:800, done:false};
}
if(!S.grit){ S.grit=[]; for(var gi=0;gi<160;gi++) S.grit.push(1); }
function save(){ try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} }

/* ============ canvas ============ */
var cv=document.getElementById("c"), ctx=cv.getContext("2d"), W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

/* world units: 1 metre = PXM px. camera looks up-and-out from parapet. */
var PXM=6.2;
var ORIGIN={x:0,y:0};      // reel hand, screen px
function layout(){
  resize();
  ORIGIN.x=W*0.20; ORIGIN.y=H*0.90;
  PXM=Math.max(3.4,Math.min(7.5,H/128));
}
layout();

/* ============ wind field ============ */
/* y in metres above roof. boundary layer dirty below ~9m. buildings throw wake. */
var gustPhase=0, gustVal=0, gustTarget=0, gustClock=0;
var turbSeed=Math.random()*1000;
function noise(a,b){ // cheap smooth-ish
  var s=Math.sin(a*12.9898+b*78.233+turbSeed)*43758.5453;
  return (s-Math.floor(s))*2-1;
}
var BUILDINGS=[ {x:34,w:16,h:11}, {x:70,w:20,h:15} ]; // metres out, wake sources
function wind(x,y,t){
  // base profile: log-ish gradient, ~9-10 knots aloft = ~4.9 m/s
  var base=4.9*Math.min(1,Math.pow(Math.max(y,0.4)/9,0.34));
  var vx=base*(1+0.18*gustVal), vy=0.28*base*0.35;
  // dirty boundary layer near roofline
  if(y<9){
    var f=(9-y)/9;
    vx+= f*2.6*noise(x*0.31+t*1.7, y*0.5);
    vy+= f*2.2*noise(x*0.27-t*1.3, y*0.61+3.1);
    vx*= (1-0.30*f);
  }
  // wakes off the two blocks
  for(var i=0;i<BUILDINGS.length;i++){
    var B=BUILDINGS[i];
    if(x>B.x && x<B.x+B.w*3.2 && y<B.h+3){
      var d=(x-B.x)/(B.w*3.2);
      var s=(1-d)*Math.max(0,1-Math.abs(y-B.h*0.6)/(B.h*0.9));
      vx-= s*3.1;
      vy+= s*1.9*noise(x*0.4+t*2.2,y*0.4);
    }
  }
  return {x:vx,y:vy};
}
function tickWind(dt,t){
  gustClock-=dt;
  if(gustClock<=0){ gustClock=1.6+Math.random()*5.4; gustTarget=(Math.random()*2-1); }
  gustVal+= (gustTarget-gustVal)*Math.min(1,dt*0.7);
}

/* ============ line: chain of segments, mass + drag + tension ============ */
function makeLine(anchorX,anchorY,kite,metresOut,gritArr){
  var N=26;
  var pts=[],old=[];
  for(var i=0;i<=N;i++){
    var f=i/N;
    pts.push({x:anchorX+(kite.x-anchorX)*f, y:anchorY+(kite.y-anchorY)*f});
    old.push({x:pts[i].x,y:pts[i].y});
  }
  return {N:N,p:pts,o:old,len:metresOut,grit:gritArr,tension:0,seg:[]};
}
function lineStep(L,ax,ay,kite,dt,t){
  var N=L.N, segL=L.len/N;
  L.p[0].x=ax; L.p[0].y=ay; L.o[0].x=ax; L.o[0].y=ay;
  for(var i=1;i<=N;i++){
    var p=L.p[i], o=L.o[i];
    var vx=(p.x-o.x), vy=(p.y-o.y);
    o.x=p.x; o.y=p.y;
    var w=wind(p.x,Math.max(p.y,0.2),t);
    var rvx=w.x-vx/dt, rvy=w.y-vy/dt;
    var sp=Math.hypot(rvx,rvy);
    var drag=0.055*sp;
    p.x+= vx*0.992 + (rvx*drag - 0)*dt*dt*30;
    p.y+= vy*0.992 + (rvy*drag - 3.6)*dt*dt*30; // gravity: cotton has weight
  }
  // last point follows kite
  L.p[N].x=kite.x; L.p[N].y=kite.y;
  var maxT=0;
  for(var it=0; it<9; it++){
    for(var j=0;j<N;j++){
      var a=L.p[j], b=L.p[j+1];
      var dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1e-6;
      var diff=(d-segL)/d;
      var st = d>segL ? 0.5 : 0.06;   // rope: stiff in tension, limp in compression
      var mA = (j===0)?0:st, mB=(j+1===N)?0:st;
      if(j===0){ mB=(d>segL?1.0:0.12); }
      if(j+1===N){ mA=(d>segL?1.0:0.12); }
      a.x+=dx*diff*mA; a.y+=dy*diff*mA;
      b.x-=dx*diff*mB; b.y-=dy*diff*mB;
      if(j<3){ var tt=Math.max(0,(d-segL)/segL); if(tt>maxT) maxT=tt; }
    }
    L.p[0].x=ax; L.p[0].y=ay;
    L.p[N].x=kite.x; L.p[N].y=kite.y;
  }
  L.tension = maxT*140;
}

/* ============ kite: flat plate, bowed spar, no tail, divergent in yaw ============ */
function makeKite(x,y,colour,me){
  return {x:x,y:y,vx:0,vy:0, hdg:-Math.PI/2, spin:0,
    bow:0.34, colour:colour, mine:!!me, alive:true, free:false, area:0.42, mass:0.055,
    aoa:0, airspeed:0, lit:0};
}
function kiteStep(k,L,dt,t,pulling){
  var w=wind(k.x,Math.max(k.y,0.1),t);
  var rvx=w.x-k.vx, rvy=w.y-k.vy;
  var V=Math.hypot(rvx,rvy);
  k.airspeed=V;
  var wdir=Math.atan2(rvy,rvx);
  // angle between nose heading and relative wind
  var ang=Math.atan2(Math.sin(k.hdg-wdir),Math.cos(k.hdg-wdir));
  k.aoa=ang;
  var q=0.5*1.22*V*V*k.area;
  // flat plate: normal force ~ sin(2a); no tail -> pitching moment DIVERGENT
  var Fn=q*Math.sin(2*ang)*1.05;
  var nx=Math.cos(k.hdg-Math.PI/2), ny=Math.sin(k.hdg-Math.PI/2);
  var fx=nx*Fn, fy=ny*Fn;
  // drag along relative wind
  var Cd=0.12+0.9*Math.abs(Math.sin(ang));
  fx+= rvx/(V||1)*q*Cd; fy+= rvy/(V||1)*q*Cd;
  fy-= k.mass*9.81;

  if(!k.free){
    // tension from line: pull along last segment
    var a=L.p[L.N-1];
    var dx=a.x-k.x, dy=a.y-k.y, d=Math.hypot(dx,dy)||1e-6;
    var Ten=L.tension*(pulling?1.35:0.45);
    fx+= dx/d*Ten*0.055; fy+= dy/d*Ten*0.055;
    // TAUT: kite drives on heading. SLACK: autorotates.
    var taut=Math.min(1,L.tension/22);
    var bowGain=0.55+k.bow*2.6;           // bowed spar: more bow, faster spin, worse tracking
    var track=(1.6-k.bow*2.2);
    // divergent yaw: centre of pressure ahead of bridle
    k.spin += (-Math.sin(ang)*q*bowGain*0.9)*dt/ k.mass *0.02;
    if(taut>0.35){
      // under tension the nose aligns to the drive vector (aiming, not steering)
      var want=Math.atan2(-dy,-dx)+Math.PI; // away from hand
      var e=Math.atan2(Math.sin(want-k.hdg),Math.cos(want-k.hdg));
      k.spin += e*taut*track*4.2*dt;
      k.spin *= Math.pow(0.02,dt);
    }else{
      k.spin *= Math.pow(0.62,dt);
      k.spin += (0.6+k.bow*3.4)*(k.steerBias||0)*dt*6;
    }
    k.spin += (k.steerBias||0)*dt*(3.0+k.bow*7);
  }else{
    // cut: nothing holds the nose. flat flutter downwind.
    k.spin += noise(k.x*0.4,t*2)*dt*2.2;
    k.spin *= Math.pow(0.4,dt);
    fx*=0.35; fy*=0.35;
    fy+= 0.28; // paper falls slow
  }
  k.hdg += k.spin*dt;
  k.vx += fx/k.mass*dt*0.06;
  k.vy += fy/k.mass*dt*0.06;
  k.vx*=Math.pow(0.55,dt); k.vy*=Math.pow(0.55,dt);
  k.x+=k.vx*dt; k.y+=k.vy*dt;
  if(k.y<0.6 && !k.free){ k.y=0.6; k.vy=Math.max(0,k.vy); }
  if(k.free && k.y<0.2){ k.dead=true; }
  // sun is behind and to the right: how edge-on and how lit
  var toSun=Math.cos(k.hdg-0.55);
  k.lit=Math.abs(toSun);
}

/* ============ actors ============ */
var t=0;
var me=makeKite(14,16,"#e2357b",true);
var myLine;
var out=Math.min(S.metres, 78);
myLine=makeLine(0,0,me,out,S.grit);

function opGrit(){ var g=[]; for(var i=0;i<160;i++) g.push(1); return g; }

var chorrillos={ kite:makeKite(58,22,"#f2c400"), line:null, out:74, grit:opGrit(),
  state:"give", clock:0, relaunch:0, alive:true, bow:0.30, bias:0 };
chorrillos.kite.bow=0.30;
chorrillos.line=makeLine(0,0,chorrillos.kite,chorrillos.out,chorrillos.grit);

var neighbours=[];
(function(){
  var n1={kite:makeKite(40,30,"#f2c400"),line:null,out:60,grit:opGrit(),anchor:{x:40,y:0}};
  n1.kite.bow=0.18; n1.line=makeLine(0,0,n1.kite,n1.out,n1.grit);
  var n2={kite:makeKite(88,26,"#e2357b"),line:null,out:66,grit:opGrit(),anchor:{x:92,y:0}};
  n2.kite.bow=0.20; n2.line=makeLine(0,0,n2.kite,n2.out,n2.grit);
  neighbours.push(n1,n2);
})();

/* the bag */
var bag={x:26,y:7,vx:0,vy:0,rot:0,spin:0,mass:0.012,area:0.30,squash:0};
function bagStep(dt){
  var w=wind(bag.x,Math.max(bag.y,0.2),t);
  var rvx=w.x-bag.vx, rvy=w.y-bag.vy, V=Math.hypot(rvx,rvy);
  var q=0.5*1.22*V*V*bag.area;
  bag.vx+= (rvx/(V||1)*q*1.5)/bag.mass*dt*0.02;
  bag.vy+= ((rvy/(V||1)*q*1.5 + q*0.55*Math.sin(bag.rot*2)) /bag.mass*dt*0.02) - 9.81*dt*0.09;
  bag.vx*=Math.pow(0.35,dt); bag.vy*=Math.pow(0.35,dt);
  bag.x+=bag.vx*dt; bag.y+=bag.vy*dt;
  bag.spin+= noise(bag.x*0.3,t)*dt*4; bag.spin*=Math.pow(0.3,dt); bag.rot+=bag.spin*dt;
  bag.squash=0.5+0.5*Math.sin(t*3.1+bag.x);
  if(bag.y<1.2){ bag.y=1.2; bag.vy=Math.abs(bag.vy)*0.5+0.6; }
  if(bag.x<2){ bag.x=2; bag.vx=Math.abs(bag.vx); }
  if(bag.x>118){ bag.x=118; bag.vx=-Math.abs(bag.vx); }
  if(bag.y>52){ bag.y=52; bag.vy=-0.4; }
}

/* fallen line drapes */
var drapes=[];

/* ============ abrasion ============ */
function gritAt(L,i){ var idx=Math.floor(i/L.N*(L.grit.length-1)); return L.grit[idx]; }
function wearAt(L,i,amt){
  var idx=Math.floor(i/L.N*(L.grit.length-1));
  L.grit[idx]=Math.max(0,L.grit[idx]-amt);
  if(idx>0) L.grit[idx-1]=Math.max(0,L.grit[idx-1]-amt*0.5);
  if(idx<L.grit.length-1) L.grit[idx+1]=Math.max(0,L.grit[idx+1]-amt*0.5);
}
function segInt(p1,p2,p3,p4){
  var d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d)<1e-9) return null;
  var u=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
  var v=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  if(u<0||u>1||v<0||v>1) return null;
  return {u:u,v:v,x:p1.x+(p2.x-p1.x)*u,y:p1.y+(p2.y-p1.y)*u};
}
var contact={on:false,slide:0,grit:1,x:0,y:0};
function segVel(L,i){
  var p=L.p[i],o=L.o[i];
  return {x:(p.x-o.x),y:(p.y-o.y)};
}
function abrade(A,B,dt,onCut){
  var found=false;
  for(var i=0;i<A.N;i++){
    for(var j=0;j<B.N;j++){
      var hit=segInt(A.p[i],A.p[i+1],B.p[j],B.p[j+1]);
      if(!hit) continue;
      var ia=i+hit.u, jb=j+hit.v;
      var va=segVel(A,i), vb=segVel(B,j);
      var slide=Math.hypot(va.x-vb.x,va.y-vb.y)/dt; // real relative sliding speed
      var Fn=(A.tension+B.tension)*0.5+2;
      var gA=gritAt(A,ia), gB=gritAt(B,jb);
      var work=slide*Fn*dt*0.00062;
      // each line's coating removes strength from the OTHER, and wears itself
      A.dmg=(A.dmg||0)+work*gB*(1+A.tension/60);
      B.dmg=(B.dmg||0)+work*gA*(1+B.tension/60);
      wearAt(A,ia,work*0.55);
      wearAt(B,jb,work*0.55);
      found=true;
      contact.on=true; contact.slide=slide; contact.grit=Math.max(gA,gB);
      contact.x=hit.x; contact.y=hit.y;
      // parting: strength falls with grit removed at that spot and tension fatigue
      if(A.dmg>1 && A===myLine){ onCut("me",ia); A.dmg=0; return; }
      if(A.dmg>1 && A!==myLine){ onCut("them",ia); A.dmg=0; return; }
      if(B.dmg>1){ onCut(B===myLine?"me":"them",jb); B.dmg=0; return; }
    }
  }
  if(!found){ /* leave contact.on to be cleared by caller */ }
  return found;
}

/* ============ audio ============ */
var AC=null, gMaster=null, nodes={};
function audio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  gMaster=AC.createGain(); gMaster.gain.value=0.5; gMaster.connect(AC.destination);
  // paper drumming: filtered noise
  var buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  function noiseSrc(){ var s=AC.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return s; }
  nodes.paperN=noiseSrc(); nodes.paperF=AC.createBiquadFilter(); nodes.paperF.type="bandpass";
  nodes.paperF.Q.value=1.1; nodes.paperG=AC.createGain(); nodes.paperG.gain.value=0;
  nodes.paperN.connect(nodes.paperF).connect(nodes.paperG).connect(gMaster);
  // line singing
  nodes.sing=AC.createOscillator(); nodes.sing.type="sawtooth"; nodes.sing.frequency.value=110;
  nodes.singF=AC.createBiquadFilter(); nodes.singF.type="lowpass"; nodes.singF.frequency.value=900;
  nodes.singG=AC.createGain(); nodes.singG.gain.value=0;
  nodes.sing.connect(nodes.singF).connect(nodes.singG).connect(gMaster); nodes.sing.start();
  // rasp at crossing
  nodes.raspN=noiseSrc(); nodes.raspF=AC.createBiquadFilter(); nodes.raspF.type="highpass";
  nodes.raspF.frequency.value=3000; nodes.raspG=AC.createGain(); nodes.raspG.gain.value=0;
  nodes.raspN.connect(nodes.raspF).connect(nodes.raspG).connect(gMaster);
  // spool rattle
  nodes.rat=AC.createGain(); nodes.rat.gain.value=0; nodes.rat.connect(gMaster);
  // bus / dog / television bed
  nodes.tvN=noiseSrc(); var tvF=AC.createBiquadFilter(); tvF.type="bandpass";
  tvF.frequency.value=520; tvF.Q.value=0.7; nodes.tvG=AC.createGain(); nodes.tvG.gain.value=0.012;
  nodes.tvN.connect(tvF).connect(nodes.tvG).connect(gMaster);
  nodes.busN=noiseSrc(); nodes.busF=AC.createBiquadFilter(); nodes.busF.type="lowpass";
  nodes.busF.frequency.value=200; nodes.busG=AC.createGain(); nodes.busG.gain.value=0;
  nodes.busN.connect(nodes.busF).connect(nodes.busG).connect(gMaster);
}
function click(freq,dur,vol){
  if(!AC) return;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type="square"; o.frequency.value=freq; g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(0.0005,AC.currentTime+dur);
  o.connect(g).connect(gMaster); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function bark(){
  if(!AC) return;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type="sawtooth"; o.frequency.setValueAtTime(320,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(140,AC.currentTime+0.16);
  g.gain.value=0.05; g.gain.exponentialRampToValueAtTime(0.0005,AC.currentTime+0.2);
  var f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=700;
  o.connect(f).connect(g).connect(gMaster); o.start(); o.stop(AC.currentTime+0.24);
}
var busClock=6+Math.random()*10, dogClock=9+Math.random()*20, busGear=0, busOn=0, rattleClock=0;
function audioTick(dt){
  if(!AC) return;
  var k=me;
  var stall=Math.abs(Math.sin(k.aoa));
  var airsp=Math.min(1,k.airspeed/9);
  nodes.paperG.gain.value = 0.001+ (k.alive?1:0)*(0.028*airsp*(0.4+stall));
  nodes.paperF.frequency.value = 260+ airsp*1500 + (1-stall)*900;
  nodes.paperF.Q.value = 0.8 + stall*3.5;
  var ten=myLine?myLine.tension:0;
  nodes.sing.frequency.value = 60 + ten*3.2 + 1600/Math.max(20,myLine?myLine.len:60);
  nodes.singG.gain.value = k.alive? Math.min(0.03, ten*0.0009) : 0;
  nodes.singF.frequency.value = 500+ten*22;
  if(contact.on){
    nodes.raspG.gain.value = Math.min(0.05, contact.slide*0.010);
    nodes.raspF.frequency.value = 900 + contact.grit*7000;
  } else nodes.raspG.gain.value *= 0.82;
  busClock-=dt;
  if(busClock<=0){ busClock=11+Math.random()*24; busOn=3.4; busGear=0; }
  if(busOn>0){
    busOn-=dt; busGear+=dt;
    var g=Math.floor(busGear/1.0);
    nodes.busG.gain.value=0.030*Math.min(1,busOn);
    nodes.busF.frequency.value=110+ ((busGear%1.0)*100) + g*55;
  } else nodes.busG.gain.value*=0.9;
  dogClock-=dt;
  if(dogClock<=0){ dogClock=14+Math.random()*30; bark(); if(Math.random()<0.6) setTimeout(bark,240); }
  nodes.tvG.gain.value=0.010+0.006*Math.sin(t*0.7);
  // spool rattle on unwind
  if(giving && k.alive){
    rattleClock-=dt;
    if(rattleClock<=0){ rattleClock=0.035+0.10/(1+myLine.tension*0.05); click(180+Math.random()*90,0.03,0.014); }
  }
}

  var anch=px(0,0);
  var ax=BUILDINGS[1].x+4, ay=BUILDINGS[1].h+0.4;
  lineStep(C.line, ax, ay, C.kite, dt, t);
  kiteStep(C.kite, C.line, dt, t, C.state==="pull");
}
function neighTick(dt){
  for(var i=0;i<neighbours.length;i++){
    var n=neighbours[i];
    if(!n.kite.alive) continue;
    n.kite.steerBias=Math.sin(t*0.5+i*2.1)*0.35;
    lineStep(n.line, n.anchor.x, 1.2, n.kite, dt, t);
    kiteStep(n.kite, n.line, dt, t, (Math.sin(t*0.35+i)>0));
  }
}

/* ============ cutting resolution ============ */
function dropLine(L,cutIdx){
  var pts=[];
  for(var i=Math.floor(cutIdx);i<=L.N;i++) pts.push({x:L.p[i].x,y:L.p[i].y});
  if(pts.length>1) drapes.push({p:pts,v:pts.map(function(){return {x:0,y:0};})});
  if(drapes.length>6) drapes.shift();
}
function myKiteLost(cutIdx){
  me.free=true; me.alive=false;
  dropLine(myLine,cutIdx);
  S.lost++; S.metres=Math.max(0, S.metres - (myLine.len - cutIdx/myLine.N*myLine.len));
  save();
  say("<b>Ay.</b> He got it. Fine — fine, that's the paper, the line is the money. Give me the other reel from the bag.",4.4);
  setTimeout(relaunchMe,4200);
}
function theirKiteLost(){
  chorrillos.alive=false; chorrillos.kite.free=true;
  dropLine(chorrillos.line, chorrillos.line.N*0.15);
  cutsToday++;
  // she undercounts: skips ones that felt accidental
  if(!(contact.slide<2.2 && Math.random()<0.7)) cutsClaimed++;
  S.cut++; save();
  say("<b>¡Ya!</b> That's " + (cutsClaimed||1) + " today. Off it goes — flat, slow, downwind, it'll be on Ecuador in four blocks and some kid already knows where.",4.6);
}
function relaunchMe(){
  if(S.metres<=8){
    S.done=true; save();
    say("That's the spool. All of it bald where it matters and sharp where it never touches anything. I'm not opening another.",9);
    return;
  }
  var need=false;
  // if the working end is bald, open a spool
  var head=0; for(var i=S.grit.length-1;i>S.grit.length-30;i--) head+=S.grit[i];
  if(head/30<0.12){
    if(S.spools<2){
      S.spools++; S.pesos+=800; S.metres=120;
      S.grit=[]; for(var j=0;j<160;j++) S.grit.push(1);
      save();
      say("New spool. Eight hundred. That's " + (S.pesos) + " pesos of hilo on this roof today and I'm still up on the day.",4.6);
    } else {
      S.done=true; save();
      say("No more spools. The last one is smooth for twenty metres and glass for the other hundred, which is the same as nothing. Three hours of wind and I'm out of file.",9);
      return;
    }
  }
  me=makeKite(12,7,"#e2357b"); me.bow=0.34;
  out=Math.min(S.metres,78);
  myLine=makeLine(0,0,me,out,S.grit);
  updateTape();
}
function updateTape(){
  document.getElementById("spoolsline").textContent =
    "carrete " + (S.spools+1) + " de 3";
}
updateTape();

/* ============ main loop ============ */
var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now;
  t+=dt;
  tickWind(dt,t);
  bagStep(dt);

  contact.on=false;
  if(me.alive){
    lineStep(myLine, 0.4, 1.0, me, dt, t);
    kiteStep(me, myLine, dt, t, pulling);
    // giving line pays it out from the spool: slack line through a taut one saws
    if(giving && myLine.len < Math.min(S.metres,104)){ myLine.len += dt*10.5; }
    if(pulling && myLine.len > 22){ myLine.len -= dt*7.0; }
  } else if(me.free && !me.dead){
    kiteStep(me,myLine,dt,t,false);
  }
  chorTick(dt);
  neighTick(dt);

  if(me.alive && chorrillos.alive){
    abrade(myLine, chorrillos.line, dt, function(who,idx){
      if(who==="me") myKiteLost(idx); else theirKiteLost();
    });
  }
  if(me.alive){
    for(var i=0;i<neighbours.length;i++){
      var n=neighbours[i];
      if(!n.kite.alive) continue;
      abrade(myLine, n.line, dt, function(who,idx){
        if(who==="me") myKiteLost(idx);
        else { n.kite.alive=false; n.kite.free=true; dropLine(n.line,n.line.N*0.2);
          cutsToday++; S.cut++; save();
          say("— that one I did not mean. That was the neighbour's. Doesn't count.",3.2); }
      });
    }
  }
  // drapes settle
  for(var d=0;d<drapes.length;d++){
    var D=drapes[d];
    for(var j=0;j<D.p.length;j++){
      var w=wind(D.p[j].x,Math.max(D.p[j].y,0.2),t);
      D.v[j].x+= (w.x*0.06 )*dt*8; D.v[j].y+= (-2.4 + w.y*0.05)*dt*8;
      D.v[j].x*=Math.pow(0.2,dt); D.v[j].y*=Math.pow(0.2,dt);
      D.p[j].x+=D.v[j].x*dt; D.p[j].y+=D.v[j].y*dt;
      var floor=1.0;
      for(var b=0;b<BUILDINGS.length;b++){
        if(D.p[j].x>BUILDINGS[b].x && D.p[j].x<BUILDINGS[b].x+BUILDINGS[b].w) floor=BUILDINGS[b].h;
      }
      if(D.p[j].y<floor){ D.p[j].y=floor; D.v[j].y=0; D.v[j].x*=0.4; }
    }
  }

  rositaTick(dt);
  audioTick(dt);

  // ---- draw ----
  sky();
  drawDrapes();
  for(var q=0;q<neighbours.length;q++){
    if(neighbours[q].kite.alive) drawLine(neighbours[q].line,false);
  }
  if(chorrillos.alive) drawLine(chorrillos.line,false);
  if(me.alive) drawLine(myLine,true);
  drawBag();
  for(var q2=0;q2<neighbours.length;q2++){
    var nk=neighbours[q2].kite;
    if(nk.alive||nk.free){ if(!nk.dead) drawKite(nk); }
  }
  if(chorrillos.alive || (chorrillos.kite.free && !chorrillos.kite.dead)) drawKite(chorrillos.kite);
  if(!me.dead) drawKite(me);
  drawRoof();
  drawReel();

  requestAnimationFrame(frame);
}

/* opening bursts */
setTimeout(function(){ say("Hold that reel and don't put the bag down, it'll go over the edge and I'm not chasing it."); },500);
setTimeout(function(){ say("Right. <i>Cachetón</i> is up. Three roofs, the yellow one, taller building, which is not skill, it's a staircase.");},5200);
setTimeout(function(){ say("Drag <b>down</b> toward you and it drives. Push <b>up</b> and the line goes slack and it spins to a new heading. That's all there is. Two things."); },10500);
setTimeout(function(){ say("Drag on the reel itself to bow the spine. More bow, faster turn, and it won't hold a line across the wind. Your problem."); },16000);

console.log("hilo curado: cotton, ground glass, glue. a file with a finite number of grains on it.");
console.log("the first fifteen metres are the only part that ever fights. that's the part that goes bald.");
console.log("spools opened:",S.spools," pesos:",S.pesos," kites lost:",S.lost," cut:",S.cut);

window.addEventListener("resize",layout);
requestAnimationFrame(frame);
if(S.done){ setTimeout(function(){ say("Nothing left with any grit on it. Sit down, the wind's still good, but I'm not flying a bald line at that man.",30); },1400); }
</script>
