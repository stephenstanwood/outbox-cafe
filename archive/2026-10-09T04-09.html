  <meta name="outbox-spec-era" content="A close, thundery Thursday afternoon in late June 1923, about twenty past three, in the back room of a busy trade bindery on a narrow street behind the Boqueria market in Barcelona. A run of four thousand pocket cookery books, 'La Cuina de Cada Dia', needs marbled endpapers by Saturday. The room has one long zinc-lined marbling trough on trestles, filled with a sloppy carrageen-moss size that was boiled on Tuesday and is just right today. Beside it stand jam jars of ox-gall-thinned paint with horsehair whisks stuck in them, a rack of brass-pinned combs hung on nails, and a stack of alum-dampened sheets under a board weighted with a flat-iron. Damp marbled sheets hang over the room on cotton lines like washing, dripping onto sawdust. The foreman is whistling the same four bars of a street-organ tune over and over. A delivery boy keeps leaning in the door to ask whether the sheets are ready yet, and the thunder has not broken.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE: a wordless, edge-to-edge view straight down onto the surface of the marbling bath, which fills the whole viewport as a slightly trembling skin of floated colour. The visitor flicks drops of paint from a whisk onto the size, where each drop blooms open and genuinely shoves every earlier ring of colour outward into thinner, stretched bands. They drag a stylus through it to pull feathers and hooks, and rake a whole brass comb across it to turn the chaos into the bindery's stock patterns. When they are pleased, they lay a sheet of paper down with a soft slap and peel it up. The print hangs over the frame on a drying line, and the bath is skimmed clean for the next sheet.">
  <meta name="outbox-spec-subject" content="The fast, show-off pleasure of making cheap commercial endpapers that look expensive: the moment a fat drop of red lands on a field of green and pushes forty earlier rings into a squashed onion of stripes; the way one slow drag through concentric circles makes a perfect fern, and a fast one makes a flame; the way a single comb pass turns a stone pattern into a nonpareil so fine it looks woven. It also covers the satisfying slap of paper hitting size, the slightly-too-thick spot where paint pooled, the bubble that leaves a white island on the print, and the fact that every sheet is a one-off and the whole run of four thousand still has to look like it matches. The patterns are working patterns with workshop nicknames that never appear on the page: the stone, the drawn-back, the peacock, the bouquet, the snail and a lopsided one the apprentices call 'the foreman's moustache'.">
  <meta name="outbox-spec-tone" content="Wordless and BRISK-CHEERFUL, like a busy, slightly behind-schedule workroom on a hot afternoon. There is no narrator, no caption and no written sentence. The register lives in the speed and the sound: drops land with a fat little plop, combs rake through with a quick ripping zip, paper goes down with a wet slap and comes up with a sticky peel, and finished sheets swing out onto the line with a snap of the pegs. A cheerful wordless whistle repeats its four bars and occasionally gets one note wrong. A door creaks open every so often, someone says something impatient without words, and the door shuts again. Distant thunder grumbles and never arrives. It should feel like being the quick-handed apprentice who has finally been allowed on the trough and is making sheet after sheet faster than anyone asked, slightly too pleased with every one. Bouncy, quick and busy, never solemn and never calm.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two floated paints and the paper under them. Bindery oxblood-vermilion (#b0342a), the cheap red earth used for cookbook endpapers, and spruce-bottle green (#1d5a48), the green that sells to the stationers, are both floated on the size-bath cream (#efe4c8), which also serves as the colour of every blank sheet and every white island where a bubble or a gap leaves the paper unprinted. Paint is never blended on the surface: red and green stay crisp-edged neighbours with a hairline of cream between them, and they only darken where a band has been stretched so thin that the size shows through as a pale veil of the same hue. The trough's zinc rim, the comb shadows and the drying-line strings are the green pushed down to near-black (#0f2620). A finished print on the line is slightly paler and flatter than the live bath, the way real paper takes up colour. No other hues.">
  <meta name="outbox-spec-wildcard" content="Once per session, the foreman leans over the trough to look, and a single flake of grey cigarette ash drops from above the frame onto the bath. It behaves exactly like a third paint: a small grey ring that every later drop pushes and every comb drags, so it gets pulled into a long grey feather somewhere in the pattern. It prints like everything else, and that one sheet hangs on the line with a grey thread running through it. On a return visit, that sheet is always hung in the middle of the line. Nothing ever explains it.">
