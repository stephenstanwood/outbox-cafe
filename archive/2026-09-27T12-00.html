  <meta name="outbox-spec-era" content="Right now, 6:12 in the morning, in the last six minutes before a municipal swimming pool's water-chemistry log has to be initialled and hung on the nail by the pump room door — the building is 1964, the chlorine controller is 1998, the pH probe was replaced in March, and the page refuses to say the year because nothing in the room tells you. Not a look-back, not a lament, not anybody's lost childhood summer: the first lane swimmers are already on the deck bench, the free chlorine came back at 0.4 and needs to be 1.0 before anybody is allowed in the water, and the acid feed has been running for eleven minutes against a set point somebody changed and did not write down.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE SENTENCE WRITTEN THIRTY-ONE TIMES, stacked as thirty-one lines with nothing else on the page — no header, no menu, no title, no footer, no scrollbar, no links, no buttons, no cursor label, no instructions, and no vertical scroll at any window size. Every line is the same sentence and every line is slightly different from the one above it, because each line is that sentence RE-DERIVED from the pool's live chemistry at a timestamp six seconds later than the line above it, so the thirty-one lines are three minutes and six seconds of one room, written out in full each time. The strangeness: THE READER IS READING DOWNWARD AND THE PAGE IS BEING RE-DERIVED UPWARD. Every six real seconds the engine computes a new bottom line from the current chemistry and every existing line shifts up one position, and the top line is pushed off the page and does not exist anywhere afterward — so a sentence the visitor is in the middle of reading is not where they left it, and the line they liked is gone in three minutes. The visitor's only vocabulary is what a hand does at a chemical feeder: DRAG DOWN or UP anywhere on the page to open and close the acid feed valve, PRESS AND HOLD to run the recirculation pump faster, and PRESS a single line to hold that one line still while the other thirty keep marching past it, which is the only way to read any sentence to the end. A held line stays held until it is pressed again, and it goes stale where it sits while the pool moves on around it, and nothing on the page says so.">
  <meta name="outbox-spec-subject" content="The flat arithmetic of pool water chemistry at six in the morning, which is almost entirely a pH-versus-chlorine-effectiveness problem and has nothing whatsoever to do with cleanliness or with how the water looks. That the single most important fact in the building is that FREE CHLORINE IS TWO DIFFERENT CHEMICALS IN EQUILIBRIUM and pH decides which one you have: hypochlorous acid, which is the disinfectant and kills things in seconds, and hypochlorite ion, which is nearly a hundred times weaker, and the split between them is set by pH alone — at 7.2 about two-thirds of your chlorine is the strong one, at 7.8 it is about a quarter, and at 8.2 it is under a tenth. So the same 1.0 ppm reading is worth four times as much at 7.3 as it is at 7.9, and every operator who chases the chlorine number without looking at the pH is adding gas to a problem that is not a chlorine problem. That this is why the acceptable pH band is narrow at both ends and not arbitrary: below 7.2 the water starts dissolving the grout and etching the plaster and stinging eyes, above 7.8 the chlorine is doing almost nothing and scale begins to drop out on the heat exchanger. That EYE STING IS NOT CHLORINE and never was — it is pH out of the tear-film range and it is chloramines, and the smell everybody calls 'chlorine smell' is specifically the smell of chlorine that has ALREADY BEEN USED UP, combined with ammonia from sweat and urine into monochloramine, dichloramine and nitrogen trichloride, which means a pool that smells strongly of chlorine is a pool with too little free chlorine and not too much. That the two numbers on the test kit are FREE and TOTAL, that the difference between them is combined chlorine, that anything over 0.2 ppm of combined is a pool that needs breakpoint chlorination, and that breakpoint is a real ratio and not a guess: it takes roughly ten parts of free chlorine for every one part of ammonia nitrogen to oxidise the chloramines all the way through, and dosing to eight parts makes it worse rather than better, because the intermediate stages are the ones that smell and burn. That ALKALINITY IS THE SHOCK ABSORBER AND PH IS THE READING: total alkalinity at 80 to 120 ppm is what keeps pH from moving when anything is added, and a pool with alkalinity at 40 will swing a full point on a gallon of acid while a pool at 100 barely moves — so an operator fighting pH all week is almost always looking at an alkalinity number they have not measured. That CALCIUM HARDNESS is the third leg and is not optional: soft water is aggressive and pulls calcium out of the plaster and the grout to satisfy itself, which is why a new pool filled from a soft municipal supply eats its own surfaces, and the Langelier index is the real arithmetic that ties pH, alkalinity, hardness and temperature into one number that says whether this water is dissolving the building or coating it. That TEMPERATURE IS IN THAT EQUATION, which means a pool held at 84 degrees for a warm-water program is chemically a different pool from the same water at 78, and the saturation index moves about two-tenths across that range. That CYANURIC ACID IS THE MOST MISUNDERSTOOD THING IN THE BUILDING: it protects chlorine from ultraviolet by binding most of it in reserve, which is essential outdoors and a genuine liability indoors, because bound chlorine is not working chlorine, and the practical rule is that the free chlorine has to be about 7.5 percent of the cyanuric acid level to have the same killing power — so a pool at 100 ppm cyanuric needs 7.5 ppm of chlorine to do what a pool at 30 ppm does with 2.25, and cyanuric acid does not evaporate, does not break down and can only be removed by draining water. That an indoor pool that has been dosed with stabilised chlorine tablets for years is a pool with a slowly rising floor under it that nobody measured. That CT VALUE IS THE ONLY THING THAT MATTERS FOR SAFETY and it is concentration multiplied by time: most bacteria are gone in under a minute at 1 ppm, giardia takes forty-five minutes, and cryptosporidium requires a CT of about 15,300 mg-min per litre, which at normal chlorine is more than ten days, which is why a crypto incident is not a chlorine problem at all but a hyperchlorination-and-close-the-pool problem, and why the UV unit in the plant room is the only real answer. That TURNOVER IS SEPARATE ARITHMETIC: the pool holds 246,000 gallons, the design turnover is six hours, so the pumps have to move about 680 gallons a minute, and turnover is exponential mixing and not a queue — one turnover removes about 63 percent of anything suspended, not all of it, and four turnovers gets you to 98. That FILTER PRESSURE IS A FLOW READING IN DISGUISE: as the sand loads, differential pressure climbs and flow falls, so a filter ten psi over clean is a pool whose turnover time has quietly gone from six hours to nine, and the chemistry that was correct at the old flow rate is not correct at the new one. That the ORP probe reads oxidation potential and not concentration, that it is what the controller actually acts on, that it drifts with pH and with cyanuric and with probe fouling, and that a controller trusting a dirty probe will feed acid or gas all night against a number that is not true. That the DPD test is the reference and the OT tablets are not, that a DPD reading that flashes pink and then goes clear means the chlorine is high enough to bleach the reagent and the true number is much higher than zero, and that this is the single most dangerous misread in the trade. And the flat arithmetic at the nail by the door: 0.4 free against a 1.0 minimum, pH 7.9 and coming down, alkalinity last measured Thursday, eleven minutes of acid feed against a set point somebody changed, one bather-load of lane swimmers on the bench, and a log that gets initialled at 6:18.">
  <meta name="outbox-spec-tone" content="The rapid, self-interrupting, figure-first voice of Marisol Achterberg-Nyondo, 47, certified pool operator for this building for nine years, who is standing at the test bench with a comparator block in one hand and is talking to nobody in particular because she does this out loud and always has, in short bursts between counting drops. She is not narrating and not reflecting and never addresses the visitor: she is reading a number, saying what it means for the number she has to hit, and going back to the drops. 'Point four. Point four free at seven-nine is not point four, it's about a tenth of a point four, say it properly, it's a tenth.' She counts every titration aloud and starts over twice because she loses the count. She revises her own dosing figure three separate times and says flatly what she had wrong each time: once because she ran the acid demand against Thursday's alkalinity instead of measuring it, once because she forgot the heater came up to 84 for the arthritis class and the saturation index moved, once because she read a DPD that flashed and cleared and believed the low number for about forty seconds before catching it. She is specifically and repeatedly aggrieved about exactly one thing — that somebody on second shift changed the controller's ORP set point without writing it in the book, and she has asked for a lock on the panel twice — and she says it three times, once with the date she asked. She is proud of exactly one thing and says it twice: that this pool has not been closed on her shift since she took the certification, and she gives the month and the number of days. She never explains anything to anybody, never teaches, never summarises, and answers no questions because nobody is asking any. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT meditative, NOT a craftsman-sage, NOT a woman-in-a-man's-plant-room arc, NOT charmed by herself, NOT lonely, NOT the dawn-quiet-before-the-world-wakes voice, and NOT aware of being read.">

  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the most important colour on the page is COMPUTED and never chosen. The ground is the pump room's wall paint, a 1964 institutional aqua-grey gone chalky and slightly powdery at hand height (#8fa7a4), dirtier and greener along the bottom where the floor gets hosed (#6b8180), with a permanent hard-edged white rectangle where a framed certificate was moved. The thirty-one lines are set in the log book's own ballpoint blue-black (#1f2734), and EVERY LINE'S INK DENSITY IS THE OUTPUT OF ITS AGE ON THE PAGE: each line stores the timestamp it was derived at, and density falls honestly across the thirty-one positions, so the newest line at the foot is dense and glossy and the topmost line about to be pushed off is a thin rubbed grey-blue (#6e7788) with individual characters already gone — the page is genuinely harder to read at the top and nothing anywhere says so. A held line stops ageing in density but accumulates a real staleness that renders as a faint chlorine-bleached halo around it (#a9bcb6), which grows, and which also is never explained. Exactly one chip of comparator-block DPD pink (#d8437f) is held strictly for three things: the free chlorine figure wherever it currently appears in any line, the word CLOSED, and the pH reading whenever it is outside 7.2 to 7.8. It never appears in the wall, never in ordinary text, never in the total chlorine figure, never in a held line's halo. Flat, hard, high contrast at the foot and honestly worn at the head; no glow, no bloom, no soft focus, no fade-to-transparent, no vignette, no water caustics, no gradients other than honest per-line ink age and honest bleach halo.">
  <meta name="outbox-spec-wildcard" content="Line 17 of the thirty-one is always, on every visit, the sentence derived for a pool that does not exist in this building. It is the outdoor 20-metre teaching pool that was filled in with sand and paved over in the eighties, and it is still on the controller's channel B because the controller was installed with two channels and nobody deleted the second one. The engine models it fully and honestly as a real body of water: it has its own gallons, its own cyanuric level (very high, because it was outdoor and stabilised), its own temperature tracking a live outdoor figure, its own bather load of zero forever, and its own chemistry that drifts on real arithmetic under a real sky. Its sentence therefore reads completely normally, in the same template with the same slots and the same units, and its figures are internally consistent and internally correct and have nothing to do with the building. It marches, shifts and ages exactly like the other thirty lines, it can be held like any other line, its pink chip lights on the same rules, and it cannot be identified, marked, skipped, released, deleted or distinguished by anything the visitor can do. Marisol mentions channel B exactly once, mid-page, says what year it was paved and that the log has a column for it that she still initials, and never mentions it again.">
  <meta name="outbox-spec-forbidden" content="NO water-as-metaphor for anything — not depth, not immersion, not being held, not surfacing, not balance, not 'what's beneath', not baptism, not cleansing, not letting go; this is a hypochlorous fraction at pH 7.9 and a 15,300 CT requirement and it has nothing to teach anybody. ABSOLUTELY NO swimming-pool nostalgia or sensory reverie: no smell-of-chlorine-and-summer, no wet-tile-and-echo, no the-light-on-the-ceiling, no underwater-silence, no goggles-and-lane-ropes, no first-swimming-lesson, no childhood, no a-boy-who-would-grow-up-to-be, no coming-of-age, no bittersweet hindsight. NO empty-pool-at-dawn mood piece, NO liminal, NO backrooms, NO uncanny, NO SCP, NO analog-horror, NO dread, NO something-in-the-deep-end, NO drowning imagery, NO danger-porn, NO foreshadowed accident, NO 'the water is waiting' — nothing here is wrong and nobody is at risk. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser, lo-fi, chillout or screensaver framing of the water, the pump noise or the marching lines; the pump is loud and the room smells of what it smells of. NO blue lyricism and NO light-on-water writing of any kind: no caustics, no shimmer, no aquamarine reverie, no describing anything as glassy, liquid, breathing or alive. NO athlete or training register: no laps, no discipline, no the-body-as-instrument, no Michael Phelps, no swim-team drama, no early-morning-dedication sermon. NO public-amenity politics: no municipal-budget satire, no bureaucratic-absurd, no committee minutes, no department-of-X, no Kafka, no form-as-joke, no parody of officialese, no 'they're closing the pool', no austerity essay, no third-place sociology, no who-gets-to-swim commentary. NO chemistry-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part', NO myth-busting register about chlorine smell or eye sting — the fact is stated as a working figure and nothing is being corrected for anybody's benefit. NO health-and-safety sermon, NO hygiene moralising, NO shower-before-you-swim joke, NO urine-in-the-pool comedy of any kind, at any level, ever. NO craftsman-sage register, NO 'the old pool men could taste the pH', NO trade mystique, NO reverence for hand skill, NO master-and-apprentice arc, NO wise-absent-predecessor, NO essential-workers framing, NO invisible-infrastructure essay, NO 'nobody thinks about this until it isn't there', NO awe at systems. NO nostalgia, NO wistfulness, NO decline narrative, NO 'the building is coming down in the spring', NO retro-kitsch, NO camp, NO ironic affection for aqua-grey paint, comparator blocks, ballpoint log books or 1960s tilework. NO woman-in-a-man's-plant-room arc, NO proving-herself, NO sexist-second-shift sketch, NO charmed-by-herself. NO dawn framing: no world-not-awake-yet, no first-light, no the-quiet-before, no solitude, no pre-coffee register, no 3am voice, no night-shift / dispatcher / desk / log voice despite there being an actual log — it is twelve minutes past six with nine people on a bench and a deadline at 6:18. NO experimental-literature framing of the repetition: no Oulipo, no Stein, no 'a sentence is a sentence is a sentence', no erasure poetry, no found-poem preciousness, no incantation, no litany, no mantra, no repetition-as-ritual, no repetition-as-obsession, no writing-about-writing, no meta commentary on the page's own shape, no winking at the reader, no the-page-is-aware-of-itself. NO time-as-theme essay, NO entropy sermon, NO the-lines-fade-like-memory, NO ephemerality preciousness about the line that gets pushed off, NO impermanence. NO archival / museum / cabinet / drawer / ledger / registry / log / record / found-document / relic framing of the sentence or the log whatsoever, despite the whole page being a written record that is about to be initialled. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO signal / t <script>
"use strict";
(function(){

/* ---------- storage, forward only ---------- */
var LS="mlpool.v3.";
function lsGet(k,d){try{var v=localStorage.getItem(LS+k);return v===null?d:(isNaN(parseFloat(v))?d:parseFloat(v));}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(LS+k,String(v));}catch(e){}}

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function f(n,d){return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);}
function sgn(n,d){var s=n<0?"-":"+";return s+Math.abs(n).toFixed(d);}
function hx(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function lerpc(a,b,t){var A=hx(a),B=hx(b);return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";}
function h32(a,b){var x=((a*2654435761)^(b*97531))>>>0;x^=x>>>15;x=Math.imul(x,2246822507)>>>0;x^=x>>>13;return (x>>>0)/4294967296;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- outdoor figure for channel B ---------- */
function outdoorTemp(){
  var d=new Date(),h=d.getHours()+d.getMinutes()/60;
  var m=d.getMonth();
  var seasonal=[40,42,47,53,60,66,70,69,63,55,46,41][m];
  return seasonal+8*Math.sin((h-9)/24*2*Math.PI)+2*Math.sin(h*0.7);
}
function sunFactor(){
  var d=new Date(),h=d.getHours()+d.getMinutes()/60;
  return clamp(Math.sin((h-6)/12*Math.PI),0,1);
}

/* ---------- the water ---------- */
function hoclFrac(ph,tempF){
  var pKa=7.54-0.008*(tempF-77);
  return 1/(1+Math.pow(10,ph-pKa));
}
function trueFlow(P,boost){
  return P.designFlow*(boost?1.28:1.0)*(1-Math.min(0.5,P.sand/30));
}
function orpOf(P){
  var hocl=P.fc*hoclFrac(P.ph,P.temp);
  var cyaF=1/(1+0.035*P.cya);
  var eff=hocl*cyaF;
  var o=480+145*Math.log10(1+eff*220)-42*(P.ph-7.4);
  return clamp(o,340,920);
}

var A={
  name:"A", gal:246000,
  fc:0.40, cc:0.30, ph:7.955, ta:96.6, ch:214,
  cya:lsGet("cya",71.0), temp:84.05, nh3:0.052,
  foul:lsGet("foul",16.0), sand:lsGet("sand",7.10),
  acid:14.0, acidMin:lsGet("amin",7.9),
  bench:9, inWater:0, pend:0, feeding:false, orpLag:null,
  designFlow:680, setpoint:692, gas:26.0,
  rfc:0.40, rtc:0.70, bleached:false, opened:false
};
A.orpLag=orpOf(A);

var B={
  name:"B", gal:48000,
  fc:0.88, cc:0.14, ph:8.16, ta:141.0, ch:372,
  cya:lsGet("bcya",128.0), temp:outdoorTemp(), nh3:0.0,
  foul:lsGet("bfoul",44.0), sand:lsGet("bsand",2.40),
  acid:0.0, acidMin:lsGet("bamin",0.0),
  bench:0, inWater:0, pend:0, feeding:false, orpLag:null,
  designFlow:133, setpoint:650, gas:1.2,
  rfc:0.88, rtc:1.02, bleached:false, opened:false
};
B.orpLag=orpOf(B);

var outBand=lsGet("outband",4);
var linesTotal=lsGet("lines",0);

function step(P,dt,boost){
  /* acid feed: consumes alkalinity, banks pH change to be mixed in */
  if(P.acid>0){
    var galAdded=P.acid*dt/3600;
    var dTA=galAdded*25*10000/P.gal;
    P.ta=Math.max(8,P.ta-dTA);
    P.pend-=0.024*dTA*(100/Math.max(20,P.ta));
    P.acidMin+=dt/60;
  }
  /* mixing: one lag constant, flow scales it */
  var flow=trueFlow(P,boost);
  var tau=110*(P.designFlow/Math.max(1,flow));
  var k=1-Math.exp(-dt/tau);
  P.ph+=P.pend*k;
  P.pend*=(1-k);
  /* carbon dioxide leaves over the gutter; pH walks up */
  P.ph+=(P.name==="A"?0.0018:0.0042)*(dt/60)*(boost?1.25:1);
  /* controller, on its own clock, on a set point somebody changed */
  var trueOrp=orpOf(P);
  var otau=90;
  P.orpLag+=(trueOrp-P.orpLag)*(1-Math.exp(-dt/otau));
  var measured=P.orpLag-P.foul;
  var was=P.feeding;
  if(measured<P.setpoint-4) P.feeding=true;
  else if(measured>P.setpoint+10) P.feeding=false;
  if(P.feeding!==was && P.name==="A") audioSolenoid();
  if(P.feeding){
    var ppmPerLb=1e6/(P.gal*8.34);
    var dppm=P.gas*ppmPerLb*dt/3600;
    P.fc+=dppm;
    var dta=dppm*0.7;
    P.ta=Math.max(8,P.ta-dta);
    P.pend-=0.024*dta*(100/Math.max(20,P.ta));
  }
  /* bathers, once the reading lets them in */
  var okNow=(P.rfc>=1.0 && P.ph>=7.2 && P.ph<=7.8);
  if(okNow) P.opened=true;
  if(P.opened && P.bench>0) P.inWater=Math.min(P.bench,P.inWater+dt*0.06);
  if(P.inWater>0){
    P.nh3+=P.inWater*0.00040*(dt/60);
  }
  /* ammonia takes free chlorine and gives combined back */
  var react=Math.min(P.nh3,P.fc*0.1)*(1-Math.exp(-dt/40));
  if(react>0){
    var dfc=Math.min(P.fc*0.5,react*8);
    P.nh3-=react;
    P.fc-=dfc;
    P.cc+=dfc*0.9;
  }
  P.cc-=P.cc*(1-Math.exp(-dt/900))*(boost?1.25:1);
  /* demand and, on channel B, a sky */
  var decay=0.00004;
  if(P.name==="B") decay=0.00002+sunFactor()*0.00055;
  P.fc-=P.fc*decay*dt;
  P.fc=Math.max(0,P.fc);
  P.cc=Math.max(0,P.cc);
  /* things that only go one way */
  P.cya+=(P.name==="A"?0.00040:0.00012)*dt;
  P.foul+=(P.name==="A"?0.00080:0.00030)*dt;
  P.sand+=dt*(boost?1.6384:1.0)*(P.name==="A"?0.00011:0.00004)*(1+P.inWater*0.02);
  /* temperature */
  var tgt=(P.name==="A")?84.2:outdoorTemp();
  P.temp+=(tgt-P.temp)*(1-Math.exp(-dt/(P.name==="A"?2400:900)));
  P.ph=clamp(P.ph,5.8,9.4);
}

function testCycle(P){
  if(P.fc>10){ P.bleached=true; P.rfc=0.26+0.06*Math.random(); P.rtc=P.rfc+0.09; }
  else { P.bleached=false; P.rfc=P.fc; P.rtc=P.fc+P.cc; }
}

/* ---------- what she is saying between drops ---------- */
var ASIDE=[
"one. two. three.",
"four, five \u2014 no, that was five twice, start it again.",
"one. two. three. four.",
"five. six. seven. hold the dropper straight.",
"that demand figure's wrong, I ran it on Thursday's alkalinity and never measured it.",
"measure the alkalinity, then the acid. that order.",
"eight. nine. ten.",
"second shift moved the set point again and didn't write a line about it.",
"I have asked for a lock on that panel twice.",
"eleven. twelve.",
"drop's hanging. come on.",
"wrong again, heater came up to 84 for the arthritis class and the index moved two tenths.",
"84, not 78. re-run the saturation.",
"thirteen. fourteen. fifteen.",
"no. lost it. one. two. three.",
"channel B's the old teaching pool, paved over in 1987, and the sheet still has a column for it and I still initial the column.",
"four. five. six.",
"pink flashed and went clear and I believed the low number for forty seconds.",
"that isn't a low reading, that's a bleached one, dilute it and run it again.",
"seven. eight.",
"March the ninth I asked. that's in the book. the set point isn't.",

"seventeen. eighteen.",
"feed's been open eleven minutes against a number I did not set.",
"nineteen. twenty. that's twenty."
];

/* ---------- one sentence, about twenty slots ---------- */
function clockStr(sec){
  var s=Math.floor(sec)%86400;
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  return h+":"+(m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;
}
function deriveLine(P,tsSec,asideIdx,boost,id){
  var frac=hoclFrac(P.ph,P.temp);
  var fcR=P.rfc, tcR=P.rtc, ccR=Math.max(0,tcR-fcR);
  var work=fcR*frac;
  var flow=trueFlow(P,boost);
  var to=P.gal/Math.max(1,flow)/60;
  var floor=0.075*P.cya;
  var carb=Math.max(5,P.ta-P.cya/3);
  var lsi=P.ph+(0.0107*P.temp-0.212)+(Math.log10(Math.max(10,P.ch))-0.4)+Math.log10(carb)-12.1;
  var orp=Math.round(P.orpLag-P.foul);
  var phOut=(P.ph<7.2||P.ph>7.8);
  var status=(fcR>=1.0 && !phOut)?"OPEN":"CLOSED";
  if(status==="CLOSED") outBand++;
  var segs=[];
  segs.push({t:clockStr(tsSec)+" FC ",k:0});
  segs.push({t:f(fcR,2),k:1});
  segs.push({t:" pH ",k:0});
  segs.push({t:f(P.ph,2),k:phOut?1:0});
  segs.push({t:" work "+f(work,2)+", TC "+f(tcR,2)+" CC "+f(ccR,2)+
    ", TA "+Math.round(P.ta)+" CH "+Math.round(P.ch)+" CYA "+Math.round(P.cya)+" floor "+f(floor,1)+
    ", "+f(P.temp,1)+"F LSI "+sgn(lsi,2)+
    ", ORP "+orp+"/"+P.setpoint+
    ", \u0394P "+f(P.sand,1)+" TO "+f(to,1)+"h, "+Math.round(P.bench)+" on bench, acid "+f(P.acid,1)+"gph "+f(P.acidMin,1)+"m, ",k:0});
  segs.push({t:status,k:status==="CLOSED"?1:0});
  segs.push({t:" \u2014 "+ASIDE[asideIdx],k:0});
  return {segs:segs,id:id};
}

/* ---------- the page ---------- */
var ROWS=31;
var sheet=document.getElementById("sheet");
var rows=[],inners=[];
for(var i=0;i<ROWS;i++){
  var d=document.createElement("div");
  d.className="ln";
  var sp=document.createElement("span");
  sp.className="inner";
  d.appendChild(sp);
  sheet.appendChild(d);
  rows.push(d); inners.push(sp);
}

var lines=[];
var lineId=0;
var poolClock=6*3600+9*60+12; /* the oldest line on the page */
var boost=false;
var heldRow=-1, heldSince=0;

/* seed the last three minutes honestly */
var seedCount=0;
var bResidue=0;
(function seed(){
  var accum=0;
  var nextLine=0;
  for(var t=0;t<ROWS*6;t+=0.5){
    step(A,0.5,false);
    step(B,0.5,false);
    if(t>=nextLine){
      if(seedCount%3===0){testCycle(A);testCycle(B);}
      seedCount++;
      nextLine+=6;
    }
  }
  /* arrange so that at load, row 17 is channel B */
  var n0=Math.floor(linesTotal);
  bResidue=((n0+16)%31+31)%31;
  for(var r=0;r<ROWS;r++){
    var n=n0+r;
    var isB=(((n%31)+31)%31===bResidue);
    var P=isB?B:A;
    var ai=((n+Math.floor(n/31))%31+31)%31;
    lines.push(deriveLine(P,poolClock+r*6,ai,false,lineId++));
  }
  linesTotal=n0+ROWS;
})();

/* ---------- ink age, erosion, halo ---------- */
var EROD=[0.24,0.13,0.06,0.025,0.008];
function erode(text,id,off,p){
  if(p<=0) return esc(text);
  var out="";
  for(var i=0;i<text.length;i++){
    var c=text.charAt(i);
    if(c===" "){out+=" ";continue;}
    out+= (h32(id*7919+off+i,id^(off+i)*31)<p)?" ":c;
  }
  return esc(out);
}
function render(){
  for(var r=0;r<ROWS;r++){
    var L=lines[r];
    if(!L) continue;
    var t=r/(ROWS-1);
    var dark=Math.pow(t,0.45);
    var ink=lerpc("#6e7788","#1f2734",dark);
    var pk=lerpc("#9c8b95","#d8437f",dark);
    var p=(r<EROD.length)?EROD[r]:0;
    var html="",off=0;
    for(var s=0;s<L.segs.length;s++){
      var sg=L.segs[s];
      html+='<span style="color:'+(sg.k?pk:ink)+'">'+erode(sg.t,L.id,off,p)+"</span>";
      off+=sg.t.length;
    }
    inners[r].innerHTML=html;
    if(r!==heldRow){
      rows[r].style.boxShadow="none";
      rows[r].style.background="transparent";
      rows[r].style.zIndex="";
      inners[r].style.transform="translateX(0px)";
    }
  }
}

/* ---------- march: derive at the foot, shift up, drop the top ---------- */
function shift(){
  var n=Math.floor(linesTotal);
  var isB=(((n%31)+31)%31===bResidue);
  var P=isB?B:A;
  var ai=((n+Math.floor(n/31))%31+31)%31;
  poolClock+=6;
  if(n%3===0){ testCycle(A); testCycle(B); audioDrop(); }
  var fresh=deriveLine(P,poolClock+(ROWS-1)*6,ai,boost,lineId++);
  linesTotal=n+1;

  var others=[],heldLine=null;
  for(var r=0;r<ROWS;r++){
    if(r===heldRow) heldLine=lines[r];
    else others.push(lines[r]);
  }
  others.shift();          /* gone. not stored. */
  others.push(fresh);
  var out=[],oi=0;
  for(var q=0;q<ROWS;q++){
    if(q===heldRow) out.push(heldLine);
    else out.push(others[oi++]);
  }
  lines=out;
  render();
  persist();
}

function persist(){
  lsSet("cya",A.cya.toFixed(3));
  lsSet("foul",A.foul.toFixed(3));
  lsSet("sand",A.sand.toFixed(4));
  lsSet("amin",A.acidMin.toFixed(2));
  lsSet("bcya",B.cya.toFixed(3));
  lsSet("bfoul",B.foul.toFixed(3));
  lsSet("bsand",B.sand.toFixed(4));
  lsSet("bamin",B.acidMin.toFixed(2));
  lsSet("lines",Math.floor(linesTotal));
  lsSet("outband",Math.floor(outBand));
}

/* ---------- sizing: thirty-one rows, no scroll, ever ---------- */
var maxLen=0;
function measure(){
  maxLen=0;
  for(var r=0;r<ROWS;r++){
    var L=lines[r]; if(!L) continue;
    var n=0; for(var s=0;s<L.segs.length;s++) n+=L.segs[s].t.length;
    if(n>maxLen) maxLen=n;
  }
  if(maxLen<40) maxLen=180;
}
function resize(){
  measure();
  var w=document.documentElement.clientWidth;
  var h=document.documentElement.clientHeight;
  var rowH=h/ROWS;
  var byW=(w-10)/(maxLen*0.601);
  var fs=Math.min(rowH*0.74,byW);
  fs=clamp(fs,6.4,22);
  sheet.style.fontSize=fs.toFixed(2)+"px";
  sheet.style.lineHeight="1.02";
}
window.addEventListener("resize",resize);

/* ---------- valve, pump, and holding a line ---------- */
var pd=null;
function setAcid(v){
  A.acid=clamp(v,0,96);
  audioAcidRate(A.acid);
}
function toggleHold(i){
  if(i<0||i>=ROWS) return;
  if(heldRow===i){
    rows[i].style.boxShadow="none";
    rows[i].style.background="transparent";
    rows[i].style.zIndex="";
    inners[i].style.transform="translateX(0px)";
    heldRow=-1;
  } else {
    if(heldRow>=0){
      rows[heldRow].style.boxShadow="none";
      rows[heldRow].style.background="transparent";
      rows[heldRow].style.zIndex="";
      inners[heldRow].style.transform="translateX(0px)";
    }
    heldRow=i;
    heldSince=performance.now();
    rows[i].style.zIndex="3";
  }
}
function rowFromY(y){
  var h=document.documentElement.clientHeight;
  return clamp(Math.floor(y/(h/ROWS)),0,ROWS-1);
}
sheet.addEventListener("pointerdown",function(e){
  if(e.target&&e.target.id==="arch") return;
  audioStart();
  pd={x:e.clientX,y:e.clientY,t:performance.now(),acid:A.acid,mode:0,row:rowFromY(e.clientY)};
  try{sheet.setPointerCapture(e.pointerId);}catch(_){}
  pd.timer=setTimeout(function(){
    if(pd&&pd.mode===0){pd.mode=2;boost=true;audioBoost(true);}
  },320);
  e.preventDefault();
},{passive:false});
window.addEventListener("pointermove",function(e){
  if(!pd) return;
  var dy=e.clientY-pd.y;
  if(pd.mode===0&&Math.abs(dy)>8){pd.mode=1;clearTimeout(pd.timer);}
  if(pd.mode===1){ setAcid(pd.acid+dy*0.42); }
  e.preventDefault();
},{passive:false});
function endPointer(){
  if(!pd) return;
  clearTimeout(pd.timer);
  if(pd.mode===2){boost=false;audioBoost(false);}
  if(pd.mode===0){ toggleHold(pd.row); }
  pd=null;
}
window.addEventListener("pointerup",endPointer);
window.addEventListener("pointercancel",endPointer);

window.addEventListener("keydown",function(e){
  audioStart();
  if(e.key==="ArrowDown"){setAcid(A.acid+2.0);e.preventDefault();}
  else if(e.key==="ArrowUp"){setAcid(A.acid-2.0);e.preventDefault();}
  else if(e.code==="Space"){if(!boost){boost=true;audioBoost(true);}e.preventDefault();}
  else if(e.key>="1"&&e.key<="9"){toggleHold(parseInt(e.key,10)-1);e.preventDefault();}
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"){boost=false;audioBoost(false);e.preventDefault();}
});

/* ---------- audio: pump room, tiled hall ---------- */
var ac=null,bus=null,dryG=null,wetG=null,noiseBuf=null;
var pumpOscA=null,pumpOscB=null,pumpG=null,rumbleG=null,rumbleF=null;
var gutterF=null,gutterG=null,crowdG=null;
var acidTimer=null,blockDone=0,audioT0=0,squeegeeNext=0;

function mkNoise(sec){
  var n=Math.floor(ac.sampleRate*sec);
  var b=ac.createBuffer(1,n,ac.sampleRate);
  var d=b.getChannelData(0);
  var last=0;
  for(var i=0;i<n;i++){
    var w=Math.random()*2-1;
    last=0.97*last+0.03*w;
    d[i]=w*0.6+last*1.6;
  }
  return b;
}
function mkIR(){
  var sec=2.6,n=Math.floor(ac.sampleRate*sec);
  var b=ac.createBuffer(2,n,ac.sampleRate);
  var taps=[0.017,0.029,0.041,0.058,0.073,0.101];
  for(var c=0;c<2;c++){
    var d=b.getChannelData(c);
    for(var i=0;i<n;i++){
      var t=i/ac.sampleRate;
      d[i]=(Math.random()*2-1)*Math.exp(-t*2.1)*0.55;
    }
    for(var k=0;k<taps.length;k++){
      var idx=Math.floor((taps[k]+c*0.003)*ac.sampleRate);
      if(idx<n) d[idx]+=0.8/(k+1);
    }
  }
  return b;
}
function audioStart(){
  if(ac) { if(ac.state==="suspended") ac.resume(); return; }
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  audioT0=ac.currentTime;
  noiseBuf=mkNoise(3);
  var conv=ac.createConvolver(); conv.buffer=mkIR();
  bus=ac.createGain(); bus.gain.value=0.30;
  dryG=ac.createGain(); dryG.gain.value=0.72;
  wetG=ac.createGain(); wetG.gain.value=0.46;
  bus.connect(dryG); dryG.connect(ac.destination);
  bus.connect(conv); conv.connect(wetG); wetG.connect(ac.destination);

  /* forty horse, blade passing */
  pumpG=ac.createGain(); pumpG.gain.value=0.055;
  var lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=420;
  pumpOscA=ac.createOscillator(); pumpOscA.type="sawtooth"; pumpOscA.frequency.value=146.7;
  pumpOscB=ac.createOscillator(); pumpOscB.type="sine"; pumpOscB.frequency.value=293.4;
  var gb=ac.createGain(); gb.gain.value=0.35;
  pumpOscA.connect(lp); pumpOscB.connect(gb); gb.connect(lp);
  lp.connect(pumpG); pumpG.connect(bus);
  pumpOscA.start(); pumpOscB.start();

  /* bearing */
  var rn=ac.createBufferSource(); rn.buffer=noiseBuf; rn.loop=true;
  rumbleF=ac.createBiquadFilter(); rumbleF.type="lowpass"; rumbleF.frequency.value=92;
  rumbleG=ac.createGain(); rumbleG.gain.value=0.075;
  rn.connect(rumbleF); rumbleF.connect(rumbleG); rumbleG.connect(bus); rn.start();
  var lfo=ac.createOscillator(); lfo.frequency.value=0.37;
  var lg=ac.createGain(); lg.gain.value=0.028;
  lfo.connect(lg); lg.connect(rumbleG.gain); lfo.start();

  /* gutter lip */
  var gn=ac.createBufferSource(); gn.buffer=noiseBuf; gn.loop=true;
  gutterF=ac.createBiquadFilter(); gutterF.type="bandpass"; gutterF.frequency.value=900; gutterF.Q.value=0.65;
  gutterG=ac.createGain(); gutterG.gain.value=0.050;
  gn.connect(gutterF); gutterF.connect(gutterG); gutterG.connect(bus); gn.start();

  /* nine people on a bench */
  var cn=ac.createBufferSource(); cn.buffer=noiseBuf; cn.loop=true;
  var cf=ac.createBiquadFilter(); cf.type="bandpass"; cf.frequency.value=470; cf.Q.value=1.3;
  crowdG=ac.createGain(); crowdG.gain.value=0.016;
  cn.connect(cf); cf.connect(crowdG); crowdG.connect(bus); cn.start();
  var clfo=ac.createOscillator(); clfo.frequency.value=0.21;
  var clg=ac.createGain(); clg.gain.value=0.010;
  clfo.connect(clg); clg.connect(crowdG.gain); clfo.start();

  audioAcidRate(A.acid);
  squeegeeNext=ac.currentTime+26;
}
function burst(freq,Q,dur,amp,type){
  if(!ac) return;
  var s=ac.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=0.8+Math.random()*0.4;
  var bp=ac.createBiquadFilter(); bp.type=type||"bandpass"; bp.frequency.value=freq; bp.Q.value=Q;
  var g=ac.createGain();
  var t=ac.currentTime;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(amp,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(bus);
  s.start(t); s.stop(t+dur+0.05);
}
function ping(freq,dur,amp,type){
  if(!ac) return;
  var o=ac.createOscillator(); o.type=type||"sine"; o.frequency.value=freq;
  var g=ac.createGain(); var t=ac.currentTime;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(amp,t+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05);
}
function audioAcidRate(gph){
  if(!ac) return;
  if(acidTimer){clearInterval(acidTimer);acidTimer=null;}
  var spm=gph/96*140;
  if(spm<1) return;
  var iv=60000/spm;
  acidTimer=setInterval(function(){
    burst(1150,4.5,0.035,0.055);
    ping(780,0.030,0.020,"square");
  },iv);
}
function audioSolenoid(){
  if(!ac) return;
  burst(1900,7,0.045,0.085);
  ping(305,0.055,0.045,"triangle");
}
function audioDrop(){
  if(!ac) return;
  ping(2480,0.028,0.030);
  burst(3300,9,0.020,0.018);
}
function audioBoost(on){
  if(!ac) return;
  var t=ac.currentTime;
  pumpOscA.frequency.linearRampToValueAtTime(on?184.8:146.7,t+0.9);
  pumpOscB.frequency.linearRampToValueAtTime(on?369.6:293.4,t+0.9);
  pumpG.gain.linearRampToValueAtTime(on?0.072:0.055,t+0.9);
  gutterF.frequency.linearRampToValueAtTime(on?1180:900,t+1.2);
  gutterG.gain.linearRampToValueAtTime(on?0.066:0.050,t+1.2);
}
function startingBlock(){
  if(!ac) return;
  burst(2100,3,0.11,0.075);
  ping(148,0.22,0.050,"square");
  setTimeout(function(){ping(163,0.17,0.038,"square");burst(1750,4,0.07,0.045);},190);
}
function squeegee(){
  if(!ac) return;
  var s=ac.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=0.55;
  var bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=2.2;
  var t=ac.currentTime;
  bp.frequency.setValueAtTime(520,t);
  bp.frequency.linearRampToValueAtTime(1500,t+0.55);
  bp.frequency.linearRampToValueAtTime(700,t+1.1);
  var g=ac.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.030,t+0.12);
  g.gain.linearRampToValueAtTime(0.026,t+0.9);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
  s.connect(bp); bp.connect(g); g.connect(bus);
  s.start(t); s.stop(t+1.4);
}

/* ---------- loops ---------- */
var last=performance.now();
var lineAcc=0;
function frame(now){
  var dt=Math.min(0.25,(now-last)/1000);
  last=now;
  step(A,dt,boost);
  step(B,dt,false);
  lineAcc+=dt;
  if(lineAcc>=6){ lineAcc-=6; shift(); }

  if(heldRow>=0){
    var age=(now-heldSince)/1000;
    var a=Math.min(0.42,age/190*0.42);
    var px=Math.min(11,age/190*11);
    rows[heldRow].style.background="rgba(169,188,182,"+(a*0.62).toFixed(3)+")";
    rows[heldRow].style.boxShadow="0 0 0 "+px.toFixed(1)+"px rgba(169,188,182,"+a.toFixed(3)+")";
    var inn=inners[heldRow];
    var over=inn.scrollWidth-rows[heldRow].clientWidth+8;
    if(over>0){
      var per=Math.max(9,over/34);
      var ph=(age%(per*2))/per;
      var u=ph<1?ph:(2-ph);
      u=u*u*(3-2*u);
      inn.style.transform="translateX("+(-over*u).toFixed(1)+"px)";
    } else {
      inn.style.transform="translateX(0px)";
    }
  }

  if(ac){
    var el=ac.currentTime-audioT0;
    if(blockDone===0&&el>37){blockDone=1;startingBlock();}
    if(blockDone===1&&el>141){blockDone=2;startingBlock();}
    if(ac.currentTime>squeegeeNext){squeegee();squeegeeNext=ac.currentTime+38+Math.random()*28;}
  }
  requestAnimationFrame(frame);
}

render();
resize();
setTimeout(resize,60);
requestAnimationFrame(frame);
setInterval(persist,10000);
window.addEventListener("beforeunload",persist);

/* the column after filter. narrow one. */

console.log("cyanuric on channel A: "+A.cya.toFixed(1)+" ppm and it does not come down.");

})();
