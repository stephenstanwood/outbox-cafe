  <meta name="outbox-spec-era" content="Boxing Night, 26 December 1868, twenty to eight in the evening, in the upstairs assembly room of a Mechanics' Institute in Keighley, West Yorkshire, halfway through a paid magic-lantern entertainment at threepence a head. The biunial lantern stands on a trestle at the back of the room with its limelight hissing, the sheet is a wetted calico stretched on a frame at the front, and about a hundred and forty people on benches have just sat through twelve slides of the Holy Land and a comic slipping-slide of a man swallowing rats. The lecturer has stepped aside and his lad is sliding the chromatrope into the stage, which is the part of the evening everybody actually paid for.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — a live CHROMATROPE projected edge to edge. The whole viewport is the wetted calico sheet in a dark room, filled by one enormous soft-edged disc of projected colour made by two hand-painted glass wheels spinning in opposite directions in front of the limelight, so the overlapping painted patterns (spirals, petals, comb-teeth, stars) interfere and throw a continuously changing moiré rosette that seems to bloom outward, swallow itself and turn inside out. The visitor turns the crank by scrolling or dragging in circles: speed and direction of the crank set both wheels' speeds through a real pulley ratio, so slow cranking gives stately swirling spokes, fast cranking gives strobing wagon-wheel reversals and a rosette that appears to stand still or run backwards, and letting go lets the wheels coast down on real friction. Four glass pairs sit in a wooden rack at the bottom edge of frame; clicking one slides it into the stage with a wooden clunk and a half-second of white limelight before the new pattern fills the sheet. No title, no caption, no instructions.">
  <meta name="outbox-spec-subject" content="The chromatrope as the part of the lantern show that makes a room full of people go 'OOOH' out loud. Nothing about optics as wonder and nothing about history — just the plain crowd-pleasing fact that two badly-painted glass wheels going opposite ways produce shapes that neither wheel contains, and that the audience can't tell whether the thing is growing, shrinking, spinning left or spinning right. Each of the four glass pairs is painted by a different hand with its own wobbles: one is neat compass-drawn crimson petals, one is a hasty blue spiral where the painter's brush clearly ran dry halfway round, one is a comb of yellow teeth on a green ground, and one is a star that is very slightly off-centre on its brass mount, so its rosette lurches once per turn. The sheet is wet so it sags a little in the middle and the image breathes when a draught comes up the stairs.">
  <meta name="outbox-spec-tone" content="Wordless and ROWDY. There is no narrator, no caption and no written sentence; the register lives in the crowd audio and in the picture's exuberance. It is a noisy paid-entertainment room on a holiday night: children on benches shrieking at every reversal, a man at the back whistling through his fingers when the rosette goes backwards, a collective rising 'ooooOOOH' that swells and breaks as the crank speeds up, somebody laughing at the lurching off-centre star, feet drumming on floorboards for 'faster'. The picture is bright, saturated, a bit smeared and plainly hand-made — a showman's trick being pulled off with gusto in front of people who are delighted to be fooled. Loud, warm, cheerful, slightly chaotic.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Limelight cream (#f7ecc8) — the hard, faintly greenish-white disc of the lime on the wet calico, with a cooler vignette at the rim and the weave of the cloth faintly visible through bright areas — on smoky assembly-room black (#120e0c) with a dull oil-lamp amber spill (#5a3a1a at low opacity) along the bottom edge where the lantern case leaks light. All pattern colour comes from transparent glass paint laid over the cream: madder crimson (#c21f3a), Prussian blue (#1f3f94), gamboge yellow (#e8b21a) and a verdigris green (#2f8a64), rendered as TRANSPARENT and SUBTRACTIVE, so where the two wheels' paint overlaps the colours multiply into real darker mixtures (crimson over blue a deep purple-black, yellow over blue a green) and where neither wheel is painted the raw limelight shines through. Brush streaks, pooled paint edges and one bubble in the blue glass show honestly in the projection.">
  <meta name="outbox-spec-wildcard" content="Somewhere on the Prussian-blue spiral glass is the painter's own thumbprint, pressed into the varnish while it was tacky. On the sheet it projects forty times life size as a huge faint whorl of ridges that swings around with the wheel and joins in the moiré like part of the design. Every time it passes the top of the sheet, one child in the crowd audio shouts something delighted and wordless. It is never labelled or explained.">
