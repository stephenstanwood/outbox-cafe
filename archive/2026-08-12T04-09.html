  <meta name="outbox-spec-era" content="Right now — twenty to twelve on a glaring August midday over the parish square at Mqabba, Malta, with the daytime shells going up off the ground battery behind the limestone belfry: no darkness anywhere, forty degrees of sun straight overhead, and colour arriving in the sky as SMOKE rather than as light. Not a festa travelogue, not an outsider's wonder at a foreign festival, and not a look-back at anything — the ground battery is loaded, the midday firing has eleven minutes left in it, and the sky over the square is already getting dirty.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one rectangle of hard cobalt Maltese midday sky, with the cut top corner of a limestone belfry and a strip of flat roof parapet along the very bottom edge and NOTHING else: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The visitor's whole vocabulary is one mortar sat just out of frame at the bottom: press and HOLD anywhere along the lower edge to build lift charge (the mortar's muzzle visibly loads and the hold is felt in the pitch of the launch), drag left or right while holding to tilt the tube, release to fire. A shell climbs on real ballistics trailing a thin grey lift-smoke tail, the time fuse burns on its own honest clock regardless of how high the shell actually got, and then the piece IS the break: a sphere of colour opening in daylight, expanding, shearing, going buoyant, sagging, and dirtying the air it hangs in. Fire fast and the sky fills up with overlapping smoke that never goes away.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of making colour appear in a daylight sky — that a night shell is useless at noon because incandescence cannot out-glare the sun, so a daytime shell contains no stars at all but pellets of an organic dye packed round a cool-burning fuel, and the colour is dye VAPORISED and then re-condensed into airborne particulate, which means the pellet must burn cool or the dye chars and every colour on the shell comes out the same brown-black; that daylight colour is therefore particle density and not brightness, and a thin puff reads as grey no matter what dye is in it; that the break must be packed symmetrically round the burster or the sphere opens lopsided and reads as a smear, which is why the pellets go in in concentric layers and the burster goes dead centre; that the break diameter is set by burster charge and the pellets' burn time, not by shell size, so a small shell with a hot burster throws a wide thin ring and a big one with a soft burster makes a tight dense ball; that the time fuse is lit by the lift charge and burns on its own clock, so a weak lift means the shell breaks low and hard and a strong one means it breaks going down; that smoke is buoyant only while hot and starts sinking within seconds of the pellet burning out, which is why a break rises, stalls, and then sags into a hanging curtain; that wind is not one wind but a shear — near-still at the parapet and moving at height, so the top of a break drifts off the bottom of it and a sphere becomes a leaning ellipse inside ten seconds; that smoke colour composites SUBTRACTIVELY in air, so magenta drifting through chrome yellow gives a dirty orange and three colours crossing gives brown, never a fourth bright hue; that the sky over a battery therefore gets measurably filthier all morning and the last shell of a firing is never seen as clean as the first; and the flat arithmetic that light travels the distance instantly and sound does not, so the gap between seeing the break and hearing it is the height of the break divided by three hundred and forty. Literally dye, a burster, hot particulate, buoyancy, and a shear.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the sky, and that register is LOUD, CONCUSSIVE, GLARING and INCREASINGLY FILTHY — flat overhead sun with no shadow modelling in it, whitewashed limestone blowing out at the edges, hard chalky smoke that opens fast and then hangs there sagging and going brown, one crack arriving late after each break and slapping off the belfry a half-beat after that. Everything happens at working speed with a battery still loaded. Explicitly NOT hushed, NOT awed, NOT dreamlike, NOT slow, NOT twinkling, NOT wistful, NOT a spectacle to be marvelled at — this is midday over a working square and the air is getting used up.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Hard scoured cobalt midday sky (#1f5fb4) paling toward a bleached white-blue at the horizon strip (#a9c9e4) and blown-out sun-struck limestone (#efe6d3) with its shaded parapet face in a warm bone-grey (#c4b699) — those two are the whole ground of the piece. The dye smokes are chalky and opaque rather than luminous: festa magenta (#d2247a), chrome yellow (#e8b21c) and a flat viridian (#1c7a63), all composited subtractively so crossings resolve into dirty orange and a real brown-black (#4a3626) and never into a brighter colour. Exactly one chip of grey lift-smoke (#8f8b82) is held strictly for the climb trail and for the permanent haze layer. Flat, hard, high-contrast, no glow, no bloom, no lens flare, no soft edges anywhere — pigment particulate in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="Exactly one shell per visit — always the fourth one fired, every visit, no matter how it is loaded — is a dud. It climbs normally, the lift smoke reads normally, the fuse time elapses, and then nothing happens: no break, no report, no colour. The shell simply arcs over as a small dark speck, falls, and goes out of frame past the parapet. Nothing on the page marks it, no sound accompanies it, it is never explained, and the fifth shell fires exactly as normal.">
  <meta name="outbox-spec-forbidden" content="NO fireworks-as-metaphor for ephemerality / celebration / joy / 'the beautiful thing that doesn't last' / childhood summer / the-brief-bright-life — it is dye, a burster, hot particulate and a wind shear, and it has nothing to teach anybody. NO awe, NO wonder, NO gasping crowd, NO 'oohs', NO hush-before-the-bang, NO upturned faces. NO night sky of any kind, NO darkness, NO sparkle, NO twinkle, NO glow, NO bloom, NO lens flare — it is noon and nothing in this piece is luminous. NO Mediterranean travelogue, NO exoticising or explaining a Maltese festa to an outsider, NO religious-procession reverence, NO village-characters colour writing. NO nostalgia, NO wistfulness, and NO 'the old pyrotechnicians / nobody makes daytime shells anymore / the factories keep blowing up' decline narrative — the battery is loaded and the midday firing is running. NO danger-porn or disaster foreshadowing about the powder. NO meditative / hypnotic / 'watch the smoke drift and let your mind empty' register — the sky is being wrecked, not soothed. NO sensuous material description of smoke or colour beyond density, hue, buoyancy and how it composites. NO cryptic-SCP or ominous dread about the dud shell. NO archival / museum / cabinet / drawer / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice. NO signal / transmission / frequency / broadcast framing of the reports. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the sky, the belfry corner, the parapet and the smoke, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<title>Dye, Burster, Shear — Over Mqabba</title>
<!--
  pellet: organic dye, cool-burning fuel, ~62% dye by weight.
  it must burn cool. hot and the dye chars and every colour on the shell
  comes out the same brown-black.
  burster dead centre. pellets packed in concentric layers round it,
  or the sphere opens lopsided and reads as a smear.
  the fourth tube is packed the same as the rest.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#1f5fb4;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
  a.mk{position:fixed;right:11px;bottom:9px;width:13px;height:13px;display:block;
    border-right:1px solid #6e6252;border-bottom:1px solid #6e6252;opacity:.34;
    transform:skewX(-12deg);z-index:5;}
  a.mk:hover{opacity:.8;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="mk" href="/archive" aria-label="the rest of the firing" title="the rest"></a>
<script>
(function(){
"use strict";
var cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
var W=0,H=0,dpr=1,ppm=1,ph=0,groundY=0,mortarX=0,Bw=0,topY=0;
var gw=0,gh=0,cell=12,off=null,octx=null,img=null,px32=null,cells=0;

/* dye absorption coefficients derived so density 1.0 renders the palette chip exactly */
var BASE=246;
var ABS=[[0.158,1.924,0.703],   /* festa magenta  #d2247a */
         [0.059,0.324,2.174],   /* chrome yellow  #e8b21c */
         [2.174,0.703,0.911],   /* flat viridian  #1c7a63 */
         [0.543,0.571,0.638]];  /* lift smoke     #8f8b82 */
var DYECSS=['#d2247a','#e8b21c','#1c7a63','#8f8b82'];

var D=[null,null,null,null], T=null, TMP=[null,null,null,null,null];
var hz=[0,0,0,0];
var HAZEGAIN=0.22;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(280,window.innerWidth); H=Math.max(300,window.innerHeight);
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ph=Math.max(46,Math.min(92,H*0.085));
  groundY=H-ph*0.55;
  ppm=H/185;
  Bw=Math.min(W*0.34,310);
  topY=Math.max(90,H*0.30);
  mortarX=Math.max(Bw+70,W*0.57);
  cell=Math.max(9,Math.ceil(Math.sqrt(W*H/7200)));
  gw=Math.max(8,Math.ceil(W/cell)); gh=Math.max(8,Math.ceil(H/cell));
  cells=gw*gh;
  var i,ns=[];
  for(i=0;i<4;i++){var a=new Float32Array(cells); if(D[i])copyInto(a,D[i]); ns.push(a);}
  var nt=new Float32Array(cells); if(T)copyInto(nt,T);
  D=ns; T=nt;
  for(i=0;i<5;i++)TMP[i]=new Float32Array(cells);
  off=document.createElement('canvas'); off.width=gw; off.height=gh;
  octx=off.getContext('2d'); img=octx.createImageData(gw,gh); px32=img.data;
}
function copyInto(dst,src){var n=Math.min(dst.length,src.length);for(var i=0;i<n;i++)dst[i]=src[i];}

/* ---------- field helpers ---------- */
function samp(f,px,py){
  if(px<0||py<0||px>gw||py>gh)return 0;
  var x=px-0.5,y=py-0.5;
  if(x<0)x=0; if(y<0)y=0;
  if(x>gw-1.002)x=gw-1.002; if(y>gh-1.002)y=gh-1.002;
  var i0=x|0,j0=y|0,fx=x-i0,fy=y-j0,b=j0*gw+i0;
  var a0=f[b],a1=f[b+1],a2=f[b+gw],a3=f[b+gw+1];
  return (a0+(a1-a0)*fx)+((a2+(a3-a2)*fx)-(a0+(a1-a0)*fx))*fy;
}
function dep(sx,sy,ch,amt,temp){
  var x=sx/cell-0.5, y=sy/cell-0.5;
  if(x<0||y<0||x>gw-1.002||y>gh-1.002)return;
  var i0=x|0,j0=y|0,fx=x-i0,fy=y-j0,b=j0*gw+i0;
  var w0=(1-fx)*(1-fy),w1=fx*(1-fy),w2=(1-fx)*fy,w3=fx*fy;
  var f=D[ch];
  f[b]+=amt*w0; f[b+1]+=amt*w1; f[b+gw]+=amt*w2; f[b+gw+1]+=amt*w3;
  if(temp>0){
    T[b]=Math.min(1.5,T[b]+temp*w0); T[b+1]=Math.min(1.5,T[b+1]+temp*w1);
    T[b+gw]=Math.min(1.5,T[b+gw]+temp*w2); T[b+gw+1]=Math.min(1.5,T[b+gw+1]+temp*w3);
  }
}

var shearDir=1, shearMax=2.15, simT=0;
function step(dt){
  simT+=dt;
  var x,y,i,ch;
  var sm=shearMax*(0.82+0.30*Math.sin(simT*0.11));
  /* --- advect: kinematic field, buoyancy from cell temperature, shear from altitude --- */
  for(y=0;y<gh;y++){
    var yf=y/gh;
    var ub=shearDir*sm*Math.pow(1-yf,1.25);
    for(x=0;x<gw;x++){
      i=y*gw+x;
      var tot=D[0][i]+D[1][i]+D[2][i]+D[3][i];
      var u=ub+0.26*Math.sin(y*0.31+simT*0.7+x*0.05);
      var v=-(1.85*T[i])+0.52*Math.min(2.2,tot)+0.20*Math.sin(x*0.27-simT*0.55);
      if(v<-4.2)v=-4.2; if(v>1.7)v=1.7;
      var pxc=x+0.5-u*dt, pyc=y+0.5-v*dt;
      TMP[0][i]=samp(D[0],pxc,pyc); TMP[1][i]=samp(D[1],pxc,pyc);
      TMP[2][i]=samp(D[2],pxc,pyc); TMP[3][i]=samp(D[3],pxc,pyc);
      TMP[4][i]=samp(T,pxc,pyc);
    }
  }
  /* --- expansion (diffusion), cooling, dissipation folded into permanent haze --- */
  var kd=0.062,kt=0.10,dec=Math.exp(-dt*0.30),tdec=Math.exp(-dt*0.70);
  for(y=0;y<gh;y++){
    for(x=0;x<gw;x++){
      i=y*gw+x;
      var l=x>0?i-1:i, r=x<gw-1?i+1:i, up=y>0?i-gw:i, dn=y<gh-1?i+gw:i;
      for(ch=0;ch<4;ch++){
        var s=TMP[ch];
        var v=s[i]*(1-4*kd)+kd*(s[l]+s[r]+s[up]+s[dn]);
        var nv=v*dec;
        hz[ch]+=(v-nv);
        D[ch][i]=nv<1e-6?0:nv;
      }
      var s4=TMP[4];
      var tv=s4[i]*(1-4*kt)+kt*(s4[l]+s4[r]+s4[up]+s4[dn]);
      T[i]=tv*tdec;
    }
  }
}

/* ---------- audio ---------- */
var AC=null,master=null,nbuf=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{AC=new C();}catch(e){return;}
  master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  var n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  nbuf=b;
}
function noise(t,dur,amp,type,freq,q,out){
  var s=AC.createBufferSource(); s.buffer=nbuf; s.loop=true;
  s.playbackRate.value=0.7+Math.random()*0.6;
  var f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||1;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0005,amp),t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
  s.connect(f); f.connect(g); g.connect(out||master);
  s.start(t); s.stop(t+dur+0.05);
}
function lowtone(t,f0,f1,amp,dur){
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.7);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(amp,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function sndLift(charge){
  if(!AC)return; var t=AC.currentTime+0.005;
  noise(t,0.30,0.45+charge*0.32,'bandpass',195-charge*100,1.1);
  lowtone(t,98-charge*42,36-charge*12,0.42+charge*0.2,0.26);
}
function sndReport(power,delay,dist){
  if(!AC)return; var t=AC.currentTime+delay;
  var lp=Math.max(430,2500-dist*3.4);
  noise(t,0.22,0.60*power,'lowpass',lp,0.7);
  lowtone(t,64,29,0.55*power,0.30);
  /* slapback off the belfry */
  noise(t+0.049,0.20,0.26*power,'lowpass',Math.max(340,lp*0.55),0.8);
  noise(t+0.106,0.17,0.09*power,'lowpass',620,0.9);
  /* spent casings, flat roof */
  var n=13+(Math.random()*15|0), base=t+1.7+Math.random()*0.5;
  for(var i=0;i<n;i++)noise(base+Math.random()*1.1,0.022,0.025+Math.random()*0.035,'highpass',2100+Math.random()*1800,0.6);
}

/* ---------- entities ---------- */
var shells=[],pellets=[],shots=0;
var GRAV=9.8, SHELLDRAG=0.008, PELDRAG=0.034;

function fire(charge,tilt){
  var v0=46+charge*72;
  shots++;
  var cols=[],pool=[0,1,2],nc=(Math.random()<0.18)?1:(Math.random()<0.72?2:3);
  for(var i=0;i<nc;i++)cols.push(pool.splice(Math.random()*pool.length|0,1)[0]);
  shells.push({
    x:0,y:0,vx:v0*Math.sin(tilt),vy:v0*Math.cos(tilt),t:0,
    fuse:3.52+(Math.random()-0.5)*0.24,
    dud:(shots===4), spent:false,
    rec:{n:60+(Math.random()*31|0), speed:23+Math.random()*15,
         burn:0.95+Math.random()*0.65, pack:0.78+Math.random()*0.58, cols:cols}
  });
  recoil=1; sndLift(charge);
  dep(mortarX+Math.sin(tilt)*10,groundY-6,3,5.2,0.30);
  dep(mortarX+Math.sin(tilt)*22,groundY-20,3,3.0,0.34);
}
function breakShell(s){
  var R=s.rec,nl=R.cols.length,N=R.n,k,L,cnt;
  for(L=0;L<nl;L++){
    var sf=1-L*0.30;
    if(nl===1)cnt=N; else if(L===0)cnt=Math.round(N*0.5); else cnt=Math.round(N*0.5/(nl-1));
    for(k=0;k<cnt;k++){
      var u1,u2,u3,m;
      do{u1=Math.random()*2-1;u2=Math.random()*2-1;u3=Math.random()*2-1;m=u1*u1+u2*u2+u3*u3;}while(m>1||m<1e-4);
      m=Math.sqrt(m); u1/=m;u2/=m;u3/=m;
      var sp=R.speed*sf*(0.90+Math.random()*0.2);
      var mass=0.8+Math.random()*0.5;
      pellets.push({x:s.x,y:s.y,vx:u1*sp,vy:u2*sp,ch:R.cols[L],
        burn:R.burn*(0.80+Math.random()*0.40),age:0,dead:false,
        rate:2.75*R.pack*(0.85+Math.random()*0.3), drag:PELDRAG/mass});
    }
  }
  var dist=Math.sqrt(s.x*s.x+s.y*s.y)+22;
  sndReport(0.55+R.pack*0.42,dist/340,dist);
}
function toSX(x){return mortarX+x*ppm;}
function toSY(y){return groundY-y*ppm;}

function update(dt){
  var i,s,p;
  for(i=shells.length-1;i>=0;i--){
    s=shells[i]; s.t+=dt;
    var sp=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
    var ad=SHELLDRAG*sp;
    s.vx-=s.vx*ad*dt; s.vy-=(s.vy*ad+GRAV)*dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(!s.spent){
      dep(toSX(s.x),toSY(s.y),3,1.55*dt,0.30*dt*3);
      if(s.t>=s.fuse){
        if(s.dud){ s.spent=true; }
        else { breakShell(s); shells.splice(i,1); continue; }
      }
    }
    if(toSY(s.y)>H+40||toSX(s.x)<-120||toSX(s.x)>W+120){shells.splice(i,1);}
  }
  for(i=pellets.length-1;i>=0;i--){
    p=pellets[i]; p.age+=dt;
    var v=Math.sqrt(p.vx*p.vx+p.vy*p.vy), d=p.drag*v;
    p.vx-=p.vx*d*dt; p.vy-=(p.vy*d+GRAV)*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(!p.dead){
      dep(toSX(p.x),toSY(p.y),p.ch,p.rate*dt,1.75*dt);
      if(p.age>=p.burn)p.dead=true;
    }
    if(toSY(p.y)>H+30||p.age>p.burn+7||toSX(p.x)<-200||toSX(p.x)>W+200)pellets.splice(i,1);
  }
  if(pellets.length>1500)pellets.splice(0,pellets.length-1500);
}

/* ---------- drawing ---------- */
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H-ph*0.4);
  g.addColorStop(0,'#1f5fb4'); g.addColorStop(0.62,'#4d86c6'); g.addColorStop(1,'#a9c9e4');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawBelfry(){
  var b=Bw, t=topY;
  ctx.fillStyle='#efe6d3';
  ctx.fillRect(0,t+34,b,H);
  ctx.fillStyle='#c4b699'; ctx.fillRect(b-13,t+34,13,H);          /* shaded return face */
  ctx.fillStyle='#efe6d3'; ctx.fillRect(0,t+18,b+11,17);          /* cornice */
  ctx.fillStyle='#c4b699'; ctx.fillRect(0,t+35,b+11,5);
  ctx.fillStyle='#efe6d3'; ctx.fillRect(0,t,b-16,19);             /* attic band */
  ctx.fillStyle='#c4b699'; ctx.fillRect(b-26,t,10,19);
  /* corner pinnacle, cut by the frame */
  ctx.fillStyle='#efe6d3';
  ctx.fillRect(b-64,t-16,44,17);
  ctx.fillRect(b-56,t-31,28,16);
  ctx.beginPath(); ctx.moveTo(b-52,t-31); ctx.lineTo(b-42,t-52); ctx.lineTo(b-32,t-31); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c4b699'; ctx.fillRect(b-30,t-16,10,17); ctx.fillRect(b-36,t-31,8,16);
  /* bell chamber louvre */
  ctx.fillStyle='#4a3626'; ctx.fillRect(0,t+70,b-58,Math.max(60,H*0.19));
  ctx.fillStyle='#6b563f';
  var ly=t+70,lh=Math.max(60,H*0.19);
  for(var y=ly+6;y<ly+lh-4;y+=11)ctx.fillRect(0,y,b-58,3);
  ctx.fillStyle='#c4b699'; ctx.fillRect(b-58,t+70,8,lh);
  /* joint courses */
  ctx.fillStyle='rgba(196,182,153,0.55)';
  for(var j=t+52;j<H;j+=Math.max(26,H*0.045))ctx.fillRect(0,j,b-14,1);
  /* blown-out sunstruck edge */
  ctx.fillStyle='rgba(255,252,244,0.85)';
  ctx.fillRect(0,t+34,b-13,3); ctx.fillRect(0,t+18,b+11,2); ctx.fillRect(b-64,t-16,44,2);
}
function drawParapet(){
  ctx.fillStyle='#c4b699'; ctx.fillRect(0,H-ph,W,ph);
  ctx.fillStyle='#efe6d3'; ctx.fillRect(0,H-ph,W,Math.max(9,ph*0.26));
  ctx.fillStyle='rgba(255,252,244,0.9)'; ctx.fillRect(0,H-ph,W,2);
  ctx.fillStyle='rgba(122,108,86,0.35)';
  for(var x=(mortarX%97)-97;x<W;x+=97)ctx.fillRect(x,H-ph+Math.max(9,ph*0.26),1,ph);
  ctx.fillRect(0,H-ph+Math.max(9,ph*0.26),W,1);
}
function drawHaze(){
  var tot=0,i,hd=[0,0,0,0];
  for(i=0;i<4;i++){
    var raw=hz[i]/Math.max(1,cells)*HAZEGAIN;
    hd[3]+=raw*0.70; if(i<3)hd[i]+=raw*0.30; else hd[3]+=0;
  }
  for(i=0;i<4;i++)tot+=hd[i];
  if(tot<0.0004)return;
  var ar=0,ag=0,ab=0;
  for(i=0;i<4;i++){ar+=hd[i]*ABS[i][0];ag+=hd[i]*ABS[i][1];ab+=hd[i]*ABS[i][2];}
  var r=BASE*Math.exp(-ar)|0,g2=BASE*Math.exp(-ag)|0,b=BASE*Math.exp(-ab)|0;
  var a=Math.min(0.45,1-Math.exp(-3.0*tot));
  var gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'rgba('+r+','+g2+','+b+','+(a*0.80).toFixed(3)+')');
  gr.addColorStop(1,'rgba('+r+','+g2+','+b+','+(a*1.15).toFixed(3)+')');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
}
function drawSmoke(){
  var i,p=0,d0,d1,d2,d3,tot,ar,ag,ab,a;
  var A0=ABS[0],A1=ABS[1],A2=ABS[2],A3=ABS[3];
  var F0=D[0],F1=D[1],F2=D[2],F3=D[3];
  for(i=0;i<cells;i++,p+=4){
    d0=F0[i];d1=F1[i];d2=F2[i];d3=F3[i];
    tot=d0+d1+d2+d3;
    if(tot<0.005){px32[p+3]=0;continue;}
    ar=d0*A0[0]+d1*A1[0]+d2*A2[0]+d3*A3[0];
    ag=d0*A0[1]+d1*A1[1]+d2*A2[1]+d3*A3[1];
    ab=d0*A0[2]+d1*A1[2]+d2*A2[2]+d3*A3[2];
    a=1-Math.exp(-3.0*tot); a=a*a*(3-2*a);
    px32[p]=BASE*Math.exp(-ar);
    px32[p+1]=BASE*Math.exp(-ag);
    px32[p+2]=BASE*Math.exp(-ab);
    px32[p+3]=a*255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,gw,gh,0,0,gw*cell,gh*cell);
}
function drawBodies(){
  var i,s,p;
  for(i=0;i<pellets.length;i++){
    p=pellets[i];
    var sx=toSX(p.x),sy=toSY(p.y);
    if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;
    if(p.dead){ctx.fillStyle='#4a3626';ctx.fillRect(sx-0.8,sy-0.8,1.7,1.7);}
    else{
      var f=1-p.age/p.burn;
      ctx.fillStyle=DYECSS[p.ch];
      ctx.globalAlpha=0.90;
      var r=1.7+1.5*f;
      ctx.fillRect(sx-r,sy-r,r*2,r*2);
      ctx.globalAlpha=1;
    }
  }
  for(i=0;i<shells.length;i++){
    s=shells[i];
    var x=toSX(s.x),y=toSY(s.y);
    ctx.fillStyle='#2a2018';
    ctx.fillRect(x-2,y-2.4,4,4.8);
  }
}
var recoil=0,tiltShown=0;
function drawMortar(charge,tilt){
  var pivY=H+H*0.11, L=pivY-(H-ph*0.55);
  ctx.save();
  ctx.translate(mortarX,pivY); ctx.rotate(tiltShown); ctx.translate(0,recoil*15);
  ctx.fillStyle='#35291d';
  ctx.beginPath();
  ctx.moveTo(-13,-L); ctx.lineTo(13,-L); ctx.lineTo(19,10); ctx.lineTo(-19,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5d4b38'; ctx.fillRect(-14.5,-L,29,8);
  ctx.fillStyle='#16110b'; ctx.fillRect(-9.5,-L+2,19,26);
  if(charge>0){
    ctx.fillStyle='#cfc3a6';
    var yy=-L+30-charge*22;
    ctx.fillRect(-8,yy,16,13);
    ctx.fillStyle='#8f8b82'; ctx.fillRect(-8,yy,16,3);
  }
  ctx.fillStyle='#231a12'; ctx.fillRect(-19,4,38,3);
  ctx.restore();
}

/* ---------- input ---------- */
var charging=false,chStart=0,startX=0,tilt=0,charge=0;
var MAXTILT=0.38;
function down(e){
  initAudio();
  charging=true; chStart=performance.now();
  startX=(e.touches?e.touches[0].clientX:e.clientX)||W/2;
  tilt=0;
  e.preventDefault();
}
function move(e){
  if(!charging)return;
  var x=(e.touches?e.touches[0].clientX:e.clientX);
  if(x==null)return;
  var t=(x-startX)/(W*0.30);
  tilt=Math.max(-1,Math.min(1,t))*MAXTILT;
  e.preventDefault();
}
function up(e){
  if(!charging)return;
  charging=false;
  var held=(performance.now()-chStart)/1400;
  fire(Math.max(0.07,Math.min(1,held)),tilt);
  charge=0;
  if(e&&e.preventDefault)e.preventDefault();
}
window.addEventListener('pointerdown',down,{passive:false});
window.addEventListener('pointermove',move,{passive:false});
window.addEventListener('pointerup',up,{passive:false});
window.addEventListener('pointercancel',up,{passive:false});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05)dt=0.05; if(dt<0.001)dt=0.001;
  if(charging)charge=Math.max(0.07,Math.min(1,(now-chStart)/1400));
  tiltShown+=(tilt-tiltShown)*Math.min(1,dt*11);
  recoil*=Math.exp(-dt*7);
  update(dt); step(dt);
  drawSky(); drawBelfry(); drawParapet(); drawHaze(); drawSmoke(); drawBodies();
  drawMortar(charging?charge:0,tilt);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

try{
  console.log('%c dye is vaporised and re-condensed. colour here is particle density, not brightness.','color:#d2247a');
  console.log('fuse 3.52 s ± 0.12, lit by the lift charge. it does not care how high the shell got.');
  console.log('shear: near still at the coping, ~6 m/s at height. a sphere is an ellipse inside ten seconds.');
  console.log('report arrives at height ÷ 340.');
}catch(e){}
})();
</script>
