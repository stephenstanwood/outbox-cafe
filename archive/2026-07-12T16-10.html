  <meta name="outbox-spec-era" content="Opening morning of walleye season, 1978 — a lakeside bait-and-tackle shop with the screen door propped and the pegboard just restocked the night before, every hook freshly hung, the coffee going, the first two trucks already parked crooked out front on the gravel and a cardboard 'BAIT — MINNOWS — WORMS' sign leaning in the window. Not a preserved country-store relic and not a 'nobody fishes anymore' lament — a working shop open for business RIGHT NOW with the lures swinging on their pegs and somebody about to buy three before the launch ramp fills up.">
  <meta name="outbox-spec-format" content="The whole viewport IS the pegboard wall of the shop, edge to edge — a tan hardboard grid of little holes with dozens of fishing lures hung on their bent-wire hooks, arranged in rows. You browse it exactly like the wall of goods it is: click any lure and it lifts off its peg and swings forward, and its hand-printed index card slides out beside it (LURE NAME · WHAT SHE TAKES · HOW TO WORK HER · WEIGHT/COLOR · PRICE, plus one penciled aside from the woman who runs the counter); click it again and it hangs back up. A worn strip of hand-lettered section tabs along the bottom (SPINNERS · PLUGS & CRANKS · JIGS & SOFTBAITS · SPOONS · THE WEIRD ONES) re-hangs the whole board with a different run of lures. No browser chrome, no header, no menu — just the pegboard, the hooks, the lures, and the cards.">
  <meta name="outbox-spec-subject" content="The tackle-shop's own working wall of fishing lures and the plain, opinionated, entirely practical business of what each one actually catches and how you're supposed to fish it — the deep-diving crankbait you crawl along the rock shelf for early walleye, the bucktail jig you tip with a fathead and hop off bottom, the copper spoon that only earns its keep on a chop-and-cloud afternoon, the loud chartreuse spinner that's all flash for stained water, the little marabou that outfishes everything in the shop and costs a dime, and the two lures the counter-woman would actually tie on herself if she had the morning off. Not a metaphor for patience or the one-that-got-away or anything at all — literally painted wood and wire and hooks hung on a board, and the honest read of which one to buy for the water you're headed out on today.">
  <meta name="outbox-spec-tone" content="The warm, blunt, hopelessly-practical voice of Bev, who has run the counter and hung this board for a good long while and is genuinely glad you came in before the ramp got busy — every card is her telling you flat out how the thing fishes ('this one's junk in clear water, don't let the color fool you — but on a mud-line day she's the best two dollars you'll spend'), which ones she's tired of restocking because everybody buys them, which sleeper nobody looks at twice, and which one her husband swears by and is wrong about. Peer-to-peer, present-tense, plain, a little bossy, generous underneath it — she'd rather you caught fish than spent money. Never grand, never wistful, never turning a lure into a life-lesson; the coffee's on and the walleye don't care how you feel.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Tan pegboard hardboard (#c39a5f) with its little drilled holes going darker (#8a6a3b) and the bent-wire hooks a dull galvanized gray (#9aa0a4), the index cards in warm ruled cream (#f4ecd8) printed and penciled in a soft graphite near-black (#2e2a22) — and the lures themselves popping off the brown board in hard enamel tackle colors: hot chartreuse (#c6d63a), perch-gold (#d99a2b), spawning-red (#c0392b), and a chip of nickel spoon-flash (#d7dbe0) catching the window light — the exact bright, hard-edged look of painted lures hung on a hardboard wall in a lakeside shop on a bright cold spring morning.">
  <meta name="outbox-spec-wildcard" content="Hung at the very far end of THE WEIRD ONES is exactly one lure that isn't for sale — a fat hand-whittled cedar plug, paint worn down to bare wood at the belly, its treble hooks rusted honest, with a card that reads 'NOT FOR SALE' where every other card lists a price; pick it up and Bev's penciled aside, which appears nowhere else and never repeats, says only that her grandfather carved it and caught the biggest fish anyone in the family ever landed on it and it hangs there to look at, not to buy. Never announced, never pointed at, never counted any differently; you only meet it if you tab all the way to the weird ones and take it down.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-spring / wistful-elegy framing and NO 'nobody fishes anymore / the lake's fished out / the little tackle shops are all closing' decline narrative — this is a working shop open this morning with the board freshly restocked and trucks in the lot. NO archival / museum / cabinet / drawer / estate-sale / relic framing of the lures or the board — even the grandfather's plug is a thing that hangs on the wall, not an exhibit. NO the-one-that-got-away / patience / 'fishing teaches you to wait' life-lesson framing — it's painted wood and wire and how to work it, nothing more. NO cryptic-SCP / ominous / cursed-lure dread. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO dry deadpan understatement — Bev is warm, plain, and opinionated, not arch. NO signal / transmission / frequency / relay framing of anything. NO society / club / cabinet-of-hobbyists scaffolding — it's one woman's shop counter, not a club to join.">

<style>
  :root{
    --board:#c39a5f; --hole:#8a6a3b; --wire:#9aa0a4;
    --card:#f4ecd8; --ink:#2e2a22;
    --chart:#c6d63a; --gold:#d99a2b; --red:#c0392b; --nickel:#d7dbe0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--board);
    background-image:
      radial-gradient(circle at 3px 3px, var(--hole) 1.4px, transparent 2.2px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"Segoe UI", Tahoma, sans-serif;
    min-height:100vh;
    padding-bottom:74px;
    -webkit-tap-highlight-color:transparent;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(88px,1fr));
    gap:26px 6px;
    padding:44px 14px 40px;
    max-width:1100px;
    margin:0 auto;
  }
  .cell{
    appearance:none; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    padding:0; font:inherit; color:inherit; position:relative;
    outline:none;
  }
  .hookwrap{ display:block; line-height:0; height:26px; }
  .lure{
    display:block; line-height:0;
    transform-origin:top center;
    transition:transform .32s cubic-bezier(.34,1.4,.5,1), filter .32s;
    filter:drop-shadow(1px 3px 2px rgba(0,0,0,.28));
  }
  .cell.down .lure{
    transform:translateY(16px) rotate(7deg) scale(1.14);
    filter:drop-shadow(5px 10px 6px rgba(0,0,0,.4));
    z-index:6;
  }
  .cell.down .hookwrap{ animation:rattle .3s ease-out; }
  @keyframes rattle{
    0%{transform:translateX(0)} 20%{transform:translateX(-1.5px) rotate(-3deg)}
    45%{transform:translateX(1.5px) rotate(3deg)} 70%{transform:translateX(-1px)}
    100%{transform:translateX(0)}
  }
  .lbl{
    margin-top:8px; font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
    font-size:12px; line-height:1.05; color:#3a3225; text-align:center;
    max-width:96px; letter-spacing:.2px;
  }
  .cell.hl{ }
  .cell.hl .lbl{ text-decoration:underline; text-decoration-style:dotted; }
  .cell.hl::before{
    content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:104%; height:100%;
    border:2px dashed rgba(46,42,34,.55); border-radius:8px; pointer-events:none;
  }

  /* card */
  .card{
    position:fixed; width:272px; z-index:40; display:none;
    background:var(--card);
    background-image:repeating-linear-gradient(transparent 0 27px, rgba(46,42,34,.13) 27px 28px);
    background-position:0 44px;
    border:1px solid #c8bd9c; border-radius:3px;
    box-shadow:5px 9px 18px rgba(0,0,0,.35);
    padding:12px 14px 14px;
    font-size:12.5px;
  }
  .card.open{ display:block; }
  .card.sheet{ width:auto; left:8px; right:8px; bottom:60px; top:auto !important; max-height:56vh; overflow:auto; }
  .cname{
    font-family:"Courier New",monospace; font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:1px;
    border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:8px;
    line-height:1.15;
  }
  .row{ display:flex; gap:8px; padding:4px 0; align-items:baseline; }
  .row .k{
    font-family:"Courier New",monospace; font-size:9.5px; letter-spacing:.5px;
    text-transform:uppercase; color:#5b513c; flex:0 0 76px; padding-top:1px;
  }
  .row .v{ font-family:"Courier New",monospace; font-size:12px; line-height:1.35; flex:1; }
  .row.price .v{ font-weight:700; font-size:14px; }
  .row.price.nosale .v{ color:var(--red); letter-spacing:1px; }
  .aside{
    margin-top:9px; padding-top:8px; border-top:1px dashed #b6ab89;
    font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
    font-size:13px; line-height:1.45; color:#403626;
  }
  .aside::before{ content:"✎ "; opacity:.6; }

  /* tab strip */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; flex-wrap:wrap; justify-content:center; gap:2px;
    background:linear-gradient(#b98d4f,#a97f43);
    border-top:3px solid #7a5a2e; padding:7px 6px;
    box-shadow:0 -4px 10px rgba(0,0,0,.2);
  }
  .tab{
    appearance:none; border:none; cursor:pointer;
    background:#e9dcbb; color:#3a3020;
    font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
    font-size:13px; letter-spacing:.3px;
    padding:5px 11px; border-radius:2px;
    border:1px solid #b39c6d; box-shadow:1px 2px 0 #8a6a3b;
    transform:rotate(-.6deg);
  }
  .tab:nth-child(even){ transform:rotate(.7deg); }
  .tab.active{ background:#f4ecd8; box-shadow:inset 0 0 0 2px #c0392b, 1px 2px 0 #8a6a3b; }

  /* corner scrawls */
  .scrawl{
    position:fixed; z-index:45;
    font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
    color:#4a3f2c; font-size:12px; line-height:1.2; pointer-events:none;
  }
  .tally{ top:8px; right:10px; text-align:right; opacity:.85; font-size:11px; max-width:150px; }
  .note{ top:8px; left:12px; opacity:.85; max-width:210px; }
  .note a{ color:#7a2c22; pointer-events:auto; }

  @media (max-width:700px){
    .note{ display:none; }
    .tally{ font-size:10px; max-width:120px; }
    .board{ padding-top:34px; gap:24px 4px; }
  }
</style>
</head>

"use strict";

/* ---- hooks & lure art ---- */
function hookSVG(){
  return '<svg class="hookwrap" viewBox="0 0 24 26" width="24" height="26">'+
    '<path d="M12 2 L12 9 Q12 15 6 15 Q2 15 4 21" fill="none" stroke="#9aa0a4" stroke-width="2.4" stroke-linecap="round"/>'+
    '<circle cx="12" cy="2.2" r="1.6" fill="#7a5a2e"/></svg>';
}
function treble(x,y,col){
  col=col||'#9aa0a4';
  return '<g stroke="'+col+'" stroke-width="1.5" fill="none" stroke-linecap="round">'+
    '<path d="M'+x+' '+y+' q-8 10 -3 19"/>'+
    '<path d="M'+x+' '+y+' q8 10 3 19"/>'+
    '<path d="M'+x+' '+y+' v19"/>'+
    '<path d="M'+(x-3.4)+' '+(y+18)+' l3 -3"/>'+
    '<path d="M'+(x+3.4)+' '+(y+18)+' l-3 -3"/>'+
    '<path d="M'+x+' '+(y+19)+' l3 -3"/></g>';
}
function svgWrap(inner){ return '<svg class="lure" viewBox="0 0 56 104" width="56" height="104">'+inner+'</svg>'; }

function art(l){
  var c1=l.c1||'#d99a2b', c2=l.c2||'#d7dbe0';
  switch(l.type){
    case 'spinner':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="58" stroke="#9aa0a4" stroke-width="2.4"/>'+
        '<g transform="rotate(20 41 26)"><ellipse cx="41" cy="26" rx="9" ry="15" fill="'+c2+'" stroke="#6b5a2f" stroke-width="1"/>'+
        '<ellipse cx="38" cy="21" rx="2.6" ry="6" fill="#ffffff" opacity=".45"/></g>'+
        '<circle cx="28" cy="50" r="5" fill="'+c1+'" stroke="#6b5a2f" stroke-width=".6"/>'+
        '<circle cx="28" cy="58" r="4.2" fill="'+c1+'"/>'+
        '<circle cx="28" cy="65" r="3.4" fill="#c0392b"/>'+
        treble(28,70));
    case 'crank':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="11" stroke="#9aa0a4" stroke-width="2"/>'+
        '<path d="M19 12 L37 12 L41 25 L15 25 Z" fill="#cfe6ef" stroke="#7a8a90" stroke-width=".8" opacity=".85"/>'+
        '<ellipse cx="28" cy="52" rx="15" ry="27" fill="'+c1+'" stroke="#6b5a2f" stroke-width="1"/>'+
        '<path d="M14 42 Q28 49 42 42" stroke="rgba(0,0,0,.2)" stroke-width="2" fill="none"/>'+
        '<path d="M15 56 Q28 62 41 56" stroke="rgba(0,0,0,.14)" stroke-width="2" fill="none"/>'+

    case 'jig':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="18" stroke="#9aa0a4" stroke-width="2"/>'+
        '<circle cx="28" cy="27" r="10" fill="'+c1+'" stroke="#6b5a2f" stroke-width="1"/>'+
        '<circle cx="24" cy="24" r="2.6" fill="#fff"/><circle cx="24" cy="24" r="1.2" fill="#111"/>'+
        '<path d="M28 37 q-9 22 7 33" fill="none" stroke="#9aa0a4" stroke-width="2"/>'+
        '<path d="M35 70 l-3 -4" stroke="#9aa0a4" stroke-width="2"/>'+
        hairStrands(28,36,c2,7,30));
    case 'grub':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="18" stroke="#9aa0a4" stroke-width="2"/>'+
        '<circle cx="28" cy="26" r="8" fill="'+ (c1||'#8a6a3b') +'" stroke="#6b5a2f" stroke-width="1"/>'+
        '<path d="M28 33 q-10 8 -6 22 q2 12 12 14 q10 -3 6 -14 q-3 -10 -12 -22 z" fill="'+c2+'" stroke="#7a8a52" stroke-width=".7"/>'+
        '<path d="M40 70 q6 8 -2 20 q-4 8 -12 6" fill="none" stroke="'+c2+'" stroke-width="4" stroke-linecap="round"/>');
    case 'marabou':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="16" stroke="#9aa0a4" stroke-width="2"/>'+
        '<circle cx="28" cy="24" r="8" fill="'+c1+'" stroke="#6b5a2f" stroke-width="1"/>'+
        '<circle cx="25" cy="21" r="2.2" fill="#fff"/><circle cx="25" cy="21" r="1" fill="#111"/>'+
        '<path d="M28 32 q-6 26 4 50 q10 -24 4 -50 z" fill="'+c2+'" opacity=".9"/>'+
        '<path d="M22 34 q-4 22 3 44" fill="none" stroke="'+c2+'" stroke-width="4" stroke-linecap="round" opacity=".7"/>'+
        '<path d="M34 34 q4 22 -3 44" fill="none" stroke="'+c2+'" stroke-width="4" stroke-linecap="round" opacity=".7"/>');
    case 'spoon':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="15" stroke="#9aa0a4" stroke-width="2"/>'+
        '<path d="M28 15 Q13 40 20 66 Q28 82 36 66 Q43 40 28 15 Z" fill="'+c1+'" stroke="#6b5a2f" stroke-width="1"/>'+

        '<path d="M25 22 Q19 42 23 60" stroke="#ffffff" stroke-width="2" fill="none" opacity=".4"/>'+

    case 'cedar':
      return svgWrap(
        '<line x1="28" y1="1" x2="28" y2="13" stroke="#9aa0a4" stroke-width="2"/>'+
        '<ellipse cx="28" cy="50" rx="15" ry="30" fill="#b8935a" stroke="#6b5a2f" stroke-width="1"/>'+
        '<path d="M15 52 Q28 82 41 52 Q28 66 15 52 Z" fill="#d8c39a" opacity=".85"/>'+
        '<path d="M17 34 Q28 40 39 34" stroke="#9c5a3a" stroke-width="3" fill="none" opacity=".5" stroke-dasharray="5 4"/>'+
        '<path d="M18 46 Q28 51 38 46" stroke="rgba(80,50,20,.35)" stroke-width="1.5" fill="none"/>'+
        '<circle cx="26" cy="29" r="2.6" fill="#e8ddc0" stroke="#7a5a2e"/><circle cx="26" cy="29" r="1" fill="#3a2a12"/>'+
        treble(18,64,'#7a4a22')+treble(30,80,'#7a4a22'));
    default:
      return svgWrap('<circle cx="28" cy="40" r="14" fill="'+c1+'"/>');

function hairStrands(x,y,col,n,len){
  var s='<g stroke="'+col+'" stroke-width="2.4" stroke-linecap="round" opacity=".85">';
  for(var i=0;i<n;i++){
    var spread=(i-(n-1)/2)*4;
    s+='<path d="M'+x+' '+y+' q'+(spread*0.7)+' '+(len*0.55)+' '+spread+' '+len+'"/>';
  }
  return s+'</g>';
}

 {tab:'SPINNERS', lures:[

 ]},

/* ---- state ---- */
var board=document.getElementById('board');
var card=document.getElementById('card');
var tabsEl=document.getElementById('tabs');
var tallyEl=document.getElementById('tally');
var current=0, downIdx=null, hlIdx=0;
var actx=null;

var STORE='bev_lures_examined_v1';
function loadSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORE)||'[]')); }
  catch(e){ return new Set(); }
}
var examined=loadSet();
function saveSet(){ try{ localStorage.setItem(STORE, JSON.stringify(Array.from(examined))); }catch(e){} }
function renderTally(){ tallyEl.textContent='LURES TAKEN DOWN AND LOOKED OVER: '+examined.size; }

function rattle(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var now=actx.currentTime;
    for(var i=0;i<4;i++){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='square';
      o.frequency.value=850+Math.random()*700;
      var t=now+i*0.028;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.06,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.038);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.05);
    }
  }catch(e){}
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHTML(l){
  var price = l.noSale
    ? '<div class="row price nosale"><span class="k">Price</span><span class="v">NOT FOR SALE</span></div>'
    : '<div class="row price"><span class="k">Price</span><span class="v">'+esc(l.price)+'</span></div>';
  return '<div class="cname">'+esc(l.name)+'</div>'+
    '<div class="row"><span class="k">What she takes</span><span class="v">'+esc(l.takes)+'</span></div>'+
    '<div class="row"><span class="k">How to work her</span><span class="v">'+esc(l.work)+'</span></div>'+
    '<div class="row"><span class="k">Weight · color</span><span class="v">'+esc(l.spec)+'</span></div>'+
    price+
    '<div class="aside">'+esc(l.aside)+'</div>';
}

function buildBoard(){
  board.innerHTML='';
  var lures=SECTIONS[current].lures;
  lures.forEach(function(l,i){
    var b=document.createElement('button');
    b.className='cell';
    b.type='button';
    b.setAttribute('aria-label', l.name+', '+(l.noSale?'not for sale':l.price));
    b.innerHTML=hookSVG()+art(l)+'<span class="lbl">'+esc(l.name)+'</span>';
    b.addEventListener('click', function(){ hlIdx=i; setHighlight(); toggle(i); });
    board.appendChild(b);
  });
  downIdx=null; hlIdx=0;
  card.classList.remove('open');
  setHighlight();
}

function cells(){ return board.querySelectorAll('.cell'); }

function setHighlight(){
  var cs=cells();
  cs.forEach(function(c,i){ c.classList.toggle('hl', i===hlIdx); });
}

function idFor(sec,i){ return sec+'::'+SECTIONS[sec].lures[i].name; }

function toggle(i){
  var cs=cells();
  var l=SECTIONS[current].lures[i];
  if(downIdx===i){
    cs[i].classList.remove('down');
    card.classList.remove('open');
    downIdx=null;
    return;
  }
  if(downIdx!==null && cs[downIdx]) cs[downIdx].classList.remove('down');
  cs[i].classList.add('down');
  downIdx=i;
  rattle();
  // tally
  var id=idFor(current,i);
  if(!examined.has(id)){ examined.add(id); saveSet(); renderTally(); }
  // card
  card.innerHTML=cardHTML(l);
  card.classList.add('open');
  positionCard(cs[i]);
}

function positionCard(cell){
  if(window.innerWidth<=700){
    card.classList.add('sheet');
    card.style.left=''; card.style.top='';
    return;
  }
  card.classList.remove('sheet');
  var r=cell.getBoundingClientRect();
  var cw=272, ch=card.offsetHeight;
  var left=r.right+14;
  if(left+cw>window.innerWidth-8) left=r.left-cw-14;
  if(left<8) left=8;
  var top=r.top-6;
  if(top+ch>window.innerHeight-66) top=window.innerHeight-66-ch;
  if(top<8) top=8;
  card.style.left=left+'px';
  card.style.top=top+'px';
}

/* tabs */
SECTIONS.forEach(function(s,i){
  var t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.type='button';
  t.textContent=s.tab;
  t.addEventListener('click', function(){
    current=i;
    Array.prototype.forEach.call(tabsEl.children,function(el,j){ el.classList.toggle('active', j===i); });
    buildBoard();
  });
  tabsEl.appendChild(t);
});

/* keyboard */
document.addEventListener('keydown', function(e){
  var n=SECTIONS[current].lures.length;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){
    e.preventDefault(); hlIdx=(hlIdx+1)%n; setHighlight();
    var c=cells()[hlIdx]; if(c) c.scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
    e.preventDefault(); hlIdx=(hlIdx-1+n)%n; setHighlight();
    var c2=cells()[hlIdx]; if(c2) c2.scrollIntoView({block:'nearest'});
  } else if(e.key===' '||e.code==='Space'){
    e.preventDefault(); toggle(hlIdx);
  } else if(e.key==='Escape'){
    if(downIdx!==null){ var cs=cells(); if(cs[downIdx]) cs[downIdx].classList.remove('down'); card.classList.remove('open'); downIdx=null; }
  }
});

/* click empty board to hang up */
board.addEventListener('click', function(e){
  if(e.target===board && downIdx!==null){
    var cs=cells(); if(cs[downIdx]) cs[downIdx].classList.remove('down');
    card.classList.remove('open'); downIdx=null;
  }
});

window.addEventListener('resize', function(){
  if(downIdx!==null){ var cs=cells(); if(cs[downIdx]) positionCard(cs[downIdx]); }
});

renderTally();
buildBoard();

console.log("%cCoffee's on. The marabou's a dime and it'll outfish the lot of them. Pick one before the ramp fills. — Bev","font-style:italic;color:#7a5a2e");
</script>
