<title>The Fifteen-Tooth Music Box (Fill It With Something Sweet)</title>
<style>
  /* every tooth is tuned to a note that can't quarrel with its neighbours — */
  /* punch wherever you like, the comb forgives you. that's the whole trick. */
  :root{
    --paper:#f6e9cf; --ink:#4a2f1a; --brass:#c69a43; --brass-lo:#8a6a26;
    --glow:#ffcf6b; --peg:#e07a4b; --night:#2b1d12;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Iowan Old Style",Georgia,serif; color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, #3d2a19 0%, var(--night) 70%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:22px 14px 34px;
  }
  header{text-align:center; color:var(--paper); max-width:560px}
  h1{font-size:clamp(1.4rem,5vw,2.1rem); margin:.2em 0; letter-spacing:.5px}
  .sub{font-style:italic; opacity:.8; margin:0 0 4px; font-size:.95rem}
  .box{
    width:100%; max-width:560px; margin:18px 0 10px;
    background:linear-gradient(160deg,#e9d6ae,#d8bf8e);
    border:10px solid var(--brass-lo);
    border-radius:16px; padding:14px 12px 16px;
    box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 0 0 3px var(--brass);
  }
  .staff{display:flex; gap:6px}
  .comb{
    display:flex; flex-direction:column; justify-content:space-between;
    padding:2px 0; font-size:.62rem; color:var(--brass-lo); font-weight:700;
    text-align:right; width:22px;
  }
  .grid{
    flex:1; display:grid; grid-template-columns:repeat(16,1fr);
    grid-template-rows:repeat(8,1fr); gap:3px; touch-action:manipulation;
  }
  .cell{
    aspect-ratio:1/1; border:none; padding:0; border-radius:50%;
    background:rgba(120,88,44,.16); cursor:pointer; transition:transform .08s;
  }
  .cell:nth-child(16n+1){box-shadow:inset 0 0 0 1px rgba(138,106,38,.35)}
  .cell.on{
    background:radial-gradient(circle at 35% 30%,var(--peg),#b34e28);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .col-lit{background:rgba(255,207,107,.28)!important}
  .cell.on.col-lit{
    background:radial-gradient(circle at 35% 30%,#fff0c2,var(--glow))!important;
    transform:scale(1.28); box-shadow:0 0 12px var(--glow);
  }
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:center; margin-top:6px;
  }
  button.ctl{
    font-family:inherit; font-size:.95rem; padding:8px 16px; cursor:pointer;
    color:var(--ink); background:var(--paper); border:2px solid var(--brass-lo);
    border-radius:22px; box-shadow:0 3px 0 var(--brass-lo);
  }
  button.ctl:active{transform:translateY(2px); box-shadow:0 1px 0 var(--brass-lo)}
  .tempo{display:flex; align-items:center; gap:8px; color:var(--paper); font-size:.85rem}
  input[type=range]{accent-color:var(--peg); width:110px}
  footer{margin-top:20px; text-align:center; color:var(--paper); opacity:.75; font-size:.78rem}
  footer a{color:var(--glow); text-decoration:none; border-bottom:1px dotted var(--glow)}
  .whisper{display:block; opacity:.55; font-size:.68rem; margin-top:6px; font-style:italic}
</style>
</head>
<body>
<header>
  <h1>The Fifteen-Tooth Music Box</h1>
  <p class="sub">Punch the pegs. Wind the handle. Let the comb do the singing.</p>
</header>

<div class="box" role="group" aria-label="A pentatonic music box you can compose on. Tap dots to place pegs; press Wind It to play.">
  <div class="staff">
    <div class="comb" id="comb" aria-hidden="true"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="controls">
  <button class="ctl" id="play" title="round and round it goes">▶ Wind It</button>
  <button class="ctl" id="clear" title="a blank cylinder is full of promise">Empty the Cylinder</button>
  <label class="tempo">slow<input type="range" id="tempo" min="220" max="560" value="380" step="10">quick</label>
</div>

<footer>
  <span>Built for humming along to. No wrong notes live in this box — they were filed off at the factory.</span>
  <span class="whisper">The tune it comes wound with is called <em>Small Weather, Passing</em>.</span>
  <a href="/archive">← back to the shelf of other little machines</a>
</footer>

<script>
// C-major pentatonic, low to high. eight teeth, tuned so any chord is friends.
const FREQ = [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
const NAMES = ["E","D","C","A","G","E","D","C"]; // shown top→bottom on the comb
const COLS = 16, ROWS = 8;
const cells = [];
let state = Array.from({length:COLS}, ()=>Array(ROWS).fill(false));

// the tune it arrives already humming — a gentle rise and settle
const SEED = [[0,7],[1,5],[2,4],[3,3],[4,2],[5,3],[6,4],[7,5],
              [8,6],[9,4],[10,3],[11,2],[12,1],[13,2],[14,3],[15,4]];
SEED.forEach(([c,r])=>state[c][r]=true);

const grid = document.getElementById('grid');
const comb = document.getElementById('comb');
NAMES.forEach(n=>{const s=document.createElement('span'); s.textContent=n; comb.appendChild(s);});

for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
    const b=document.createElement('button');
    b.className='cell'+(state[c][r]?' on':'');
    const noteName = NAMES[r]+" · step "+(c+1);
    b.setAttribute('aria-label', noteName);
    b.setAttribute('title', noteName);
    b.addEventListener('click',()=>{
      state[c][r]=!state[c][r];
      b.classList.toggle('on', state[c][r]);
      if(state[c][r]) ping(FREQ[7-r], 0.6);
    });
    grid.appendChild(b);
    cells.push({el:b, c, r});
  }
}
const at=(c,r)=>cells[r*COLS+c].el;

// ---- the comb itself: a bright, plucked, decaying tone ----
let AC;
function ping(freq, vel=1){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22*vel,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
  g.connect(AC.destination);
  [[1,1],[2,0.35],[3,0.12]].forEach(([mult,amp])=>{
    const o=AC.createOscillator();
    o.type = mult===1?'triangle':'sine';
    o.frequency.value=freq*mult;
    const og=AC.createGain(); og.gain.value=amp;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t+1.6);
  });
}

let step=0, timer=null;
const playBtn=document.getElementById('play');
function tick(){
  cells.forEach(o=>o.el.classList.remove('col-lit'));
  const prev=(step+COLS-1)%COLS;
  void prev;
  for(let r=0;r<ROWS;r++){
    at(step,r).classList.add('col-lit');
    if(state[step][r]) ping(FREQ[7-r], 1);
  }
  step=(step+1)%COLS;
}
function play(){
  if(timer){ stop(); return; }
  if(AC && AC.state==='suspended') AC.resume();
  step=0; tick();
  timer=setInterval(tick, +document.getElementById('tempo').value);
  playBtn.textContent='❚❚ Let It Rest';
}
function stop(){
  clearInterval(timer); timer=null;
  cells.forEach(o=>o.el.classList.remove('col-lit'));
  playBtn.textContent='▶ Wind It';
}
playBtn.addEventListener('click', play);
document.getElementById('tempo').addEventListener('input',()=>{
  if(timer){ clearInterval(timer); timer=setInterval(tick,+document.getElementById('tempo').value); }
});
document.getElementById('clear').addEventListener('click',()=>{
  stop();
  state = Array.from({length:COLS},()=>Array(ROWS).fill(false));
  cells.forEach(o=>o.el.classList.remove('on'));
});

console.log("%c♫ every tooth in here was hand-filed by someone who cared. play kindly.",
            "color:#c69a43;font-style:italic");
</script>

<script src="/nav.js" defer></script>
</body>
