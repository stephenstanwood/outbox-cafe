  <meta name="outbox-spec-era" content="1937, right now — twenty past eleven on a hot, hard-lit Tuesday morning in the drying yard behind a hand-block textile printing works at Sanganer, outside Jaipur, where two hundred metres of freshly printed cotton have been pegged out flat on gravel in full sun and are being watered off, and the sun is doing the actual chemistry. Not a look-back at 'the old block printers' and not a lament for anything — the cloth is on the ground this minute, the sun is at its worst, and the wash tank is running.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one length of printed cotton pegged flat on bright gravel, seen from directly overhead and life-size: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The cloth carries a live hand-block repeat, printed block by block in real time by an unseen hand — a wooden block descends, presses, lifts, walks one repeat sideways, presses again, with genuine registration error accumulating along the run so the pattern drifts and doubles at the joins exactly like a hand-printed piece does. The visitor's only vocabulary is water and sun: drag anywhere to drag a wet sheet of water across the cloth (a real advancing wetting front that darkens the weave, spreads by capillary action along the warp faster than the weft, and carries loose pigment forward into bleeds), and hold still anywhere to let the sun work on that patch — a live per-pixel exposure field where dyes that need light genuinely deepen and dyes that don't genuinely bleach, at different rates. The piece IS the cloth changing colour under a sun the visitor can't turn off.">
  <meta name="outbox-spec-subject" content="The plain physical business of sun-drying and washing-off a block-printed cotton — that the colour that comes off the block is not the colour the cloth ends up, because the printed paste is mostly thickener and mordant and the dye reaction happens afterward in water and light; that madder-mordanted areas come off the block a dull ochre-grey and only go red once the loose paste is washed away and the sun has had a few hours at them, while indigo-resist areas come off the block as pale wax-white and stay that way; that the fugitive yellows bleach measurably in the same sun that's fixing the reds, so every minute on the gravel is simultaneously improving one colour and destroying another and the whole job is knowing when to lift; that the cloth is laid on gravel rather than grass because gravel dries the underside and grass wicks and stains; that water travels along the warp threads roughly twice as fast as across the weft, so every wet patch spreads as an ellipse and not a circle, and a printer can tell warp from weft at ten paces by watching a splash; that pigment carried in a moving wetting front piles up at the edge where evaporation is fastest — the same reason a spilled cup leaves a ring — and a patch dried too slowly leaves hard tidal edges through the middle of a motif; that the block walks by eye against a pricked registration dot and the error is cumulative, so a hundred-repeat run drifts and the drift shows worst on the fine outline block laid down last; and the flat arithmetic that a black outline block laid over a red field must sit within about a sixteenth of an inch or the whole piece reads as blurred. Literally paste, mordant, gravel, capillary action, and how long you leave it out.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the cloth, the water and the light, and that register is GLARING, WET, BUSY and CHEMICAL — a flat overhead sun with no modelling in it, gravel blowing out white at the edges, water arriving in hard sheets and darkening the weave instantly, colour changing at a speed you can genuinely watch. Everything happens at working speed with a yard full of cloth still to do. Explicitly NOT hushed, NOT meditative, NOT dreamlike, NOT slow, NOT reverent, NOT wistful — this is a hot yard at twenty past eleven with the sun working against you as much as for you.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Bleached gravel white-grey (#dcd6c6) with hard-edged pebble shadow (#8b8375) as the ground of the whole piece, and the cloth an unbleached cotton cream (#f0e7d2) whose wet state renders honestly darker and more transparent (#c9bda1). The two working dye anchors are Sanganeri madder red (#a8322a) — which genuinely arrives over time rather than being present at load — and indigo-resist blue (#25436f), with a fugitive turmeric yellow (#d9a72b) that measurably bleaches toward a pale straw (#e5d9a8) under sustained exposure. Exactly one chip of iron-black outline (#241f1d) is held strictly for the fine outline block. Flat, hard, high-contrast, no glow, no bloom, no gradients except the honest wetting fronts and tidal edges — cloth on gravel photographed straight down in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="One repeat near the middle of the run is printed with the wrong colour block — a motif that should be madder is laid in indigo, quietly and correctly, with perfect registration. It develops, wets, bleeds and behaves exactly like every other motif and is never marked, never flagged, never corrected, and appears in the same position on the cloth every visit.">
  <meta name="outbox-spec-forbidden" content="NO textile-as-metaphor for tradition / heritage / patient handwork / 'the slow arts' / what-the-hands-remember — it is paste, mordant, gravel and capillary action, and it has nothing to teach anybody. NO orientalising or travelogue register of any kind: no spice-and-marigold colour writing, no 'ancient craft', no explaining India to an outsider, no sacred-artisan reverence, no saffron-light lyricism. NO nostalgia, NO wistfulness, NO 'the mills killed hand printing / the last block carvers / a vanishing craft' decline narrative — there is a yard full of cloth on the ground this minute. NO sensuous material-porn about fabric or colour beyond hue, value, saturation and wetness. NO meditative / hypnotic / 'let the slow spread still you' register. NO cryptic-SCP or ominous dread about the wrong-colour repeat. NO archival / museum / cabinet / drawer / textile-collection framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is a glaring late-morning sun. NO signal / transmission / frequency framing. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the cloth, the gravel and the water, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<title>Twenty Past Eleven, Full Sun — Gravel Behind the Printing Shed</title>
<meta name="description" content="A length of block-printed cotton pegged out flat on gravel. Water and sun.">
<!--
  gravel, not grass. grass wicks and stains the underside.
  water runs about twice as fast along the warp as across the weft,
  so every splash spreads as an ellipse. you can tell the warp at ten paces.
  drag = water.  hold still = sun.
-->

<body>
<canvas id="yard"></canvas>

<script>
(function(){
'use strict';
var cv=document.getElementById('yard'), ctx=cv.getContext('2d',{alpha:false});
var CELL=4, W=0,H=0,DPR=1, fw=0,fh=0,N=0;
var sat,satB,Lm,Lr,Lg,Lb,Lm2,Lr2,Lg2,Lb2,Dm,Dr,Dg,Db,paste,fix,dev,bleach,type,cloth,gR,gG,gB,wv;
var fc,fctx,img,d32,LE=true;
var rwC=40,rhC=40,cols=1,rows=1,clothY0=0,clothY1=0,seq=[],pi=0,pacc=0,IVAL=0.1;
var driftX=0,driftY=0,driftOX=0,driftOY=0,age=[0,0,0,0,0],wildRepeat=-1;
var blocks=[],BTYPE=[5,1,2,3,4],BSIZE=[0.30,1.0,0.52,0.22,0.80];
var sunTotal=0, meanWet=0;

var EV=0.16, DEVK=0.040, BLK=0.010, KX=0.16, KY=0.08, KAX=0.95, KAY=0.48;

/* ---------- endianness ---------- */
(function(){var b=new ArrayBuffer(4),u8=new Uint8Array(b),u32=new Uint32Array(b);u32[0]=0x0a0b0c0d;LE=(u8[0]===0x0d);})();
function pack(r,g,b){ r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b;
  return LE ? (0xFF000000|((b|0)<<16)|((g|0)<<8)|(r|0)) : (((r|0)<<24)|((g|0)<<16)|((b|0)<<8)|0xFF); }
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*0.85;}

/* ---------- block masks ---------- */
function mask(bw,bh,fn){
  var c=document.createElement('canvas');c.width=bw;c.height=bh;
  var g=c.getContext('2d');g.fillStyle='#fff';g.strokeStyle='#fff';g.lineCap='round';g.lineJoin='round';
  fn(g,bw,bh,Math.min(bw,bh));
  var d=g.getImageData(0,0,bw,bh).data,m=new Float32Array(bw*bh);
  for(var i=0;i<bw*bh;i++)m[i]=d[i*4+3]/255;
  return {w:bw,h:bh,m:m};
}
function petals(g,cx,cy,R,rx,ry,fillIt){
  for(var k=0;k<8;k++){var a=k*Math.PI/4;
    g.save();g.translate(cx+Math.cos(a)*R*0.205,cy+Math.sin(a)*R*0.205);g.rotate(a);
    g.beginPath();g.ellipse(0,0,R*rx,R*ry,0,0,6.2832);fillIt?g.fill():g.stroke();g.restore();}
}
function buildBlocks(){
  var bw=rwC,bh=rhC;
  blocks[0]=mask(bw,bh,function(g,w,h,R){ /* resist: wax halo + corner drops */
    g.lineWidth=Math.max(1.1,R*0.05);
    g.beginPath();g.arc(w*0.5,h*0.5,R*0.345,0,6.2832);g.stroke();
    var pts=[[0.11,0.13],[0.89,0.13],[0.11,0.88],[0.89,0.88]];
    for(var i=0;i<4;i++){g.beginPath();g.ellipse(w*pts[i][0],h*pts[i][1],R*0.05,R*0.078,0.7,0,6.2832);g.fill();}
  });
  blocks[1]=mask(bw,bh,function(g,w,h,R){ /* madder ground block */
    var cx=w*0.5,cy=h*0.5;
    petals(g,cx,cy,R,0.135,0.078,true);
    g.beginPath();g.arc(cx,cy,R*0.10,0,6.2832);g.fill();
    g.lineWidth=Math.max(1.2,R*0.038);
    g.beginPath();g.moveTo(cx,cy+R*0.32);g.quadraticCurveTo(cx-R*0.05,cy+R*0.40,cx-R*0.02,cy+R*0.455);g.stroke();
    g.beginPath();g.ellipse(cx-R*0.135,cy+R*0.405,R*0.085,R*0.045,-0.55,0,6.2832);g.fill();
    g.beginPath();g.ellipse(cx+R*0.115,cy+R*0.425,R*0.075,R*0.04,0.55,0,6.2832);g.fill();
    g.fillRect(0,0,w,Math.max(1,R*0.030));
    g.fillRect(0,0,Math.max(1,R*0.030),h);
  });
  blocks[2]=mask(bw,bh,function(g,w,h,R){ /* turmeric fills */
    var cx=w*0.5,cy=h*0.5;
    g.beginPath();g.arc(cx,cy,R*0.072,0,6.2832);g.fill();
    for(var k=0;k<8;k++){var a=k*Math.PI/4+Math.PI/8;
      g.beginPath();g.arc(cx+Math.cos(a)*R*0.255,cy+Math.sin(a)*R*0.255,R*0.030,0,6.2832);g.fill();}
    g.beginPath();g.ellipse(w*0.5,h*0.94,R*0.16,R*0.030,0,0,6.2832);g.fill();
    g.beginPath();g.ellipse(w*0.06,h*0.5,R*0.030,R*0.15,0,0,6.2832);g.fill();
  });
  blocks[3]=mask(bw,bh,function(g,w,h,R){ /* indigo dots + buds */
    var pts=[[0.11,0.13],[0.89,0.13],[0.11,0.88],[0.89,0.88]];
    for(var i=0;i<4;i++){g.beginPath();g.arc(w*pts[i][0],h*pts[i][1],R*0.026,0,6.2832);g.fill();}
    g.beginPath();g.ellipse(w*0.30,h*0.80,R*0.045,R*0.024,-0.6,0,6.2832);g.fill();
    g.beginPath();g.ellipse(w*0.70,h*0.80,R*0.045,R*0.024,0.6,0,6.2832);g.fill();
  });
  blocks[4]=mask(bw,bh,function(g,w,h,R){ /* fine iron-black outline, laid last */
    var cx=w*0.5,cy=h*0.5;
    g.lineWidth=Math.max(1.15,R*0.020);
    petals(g,cx,cy,R,0.135,0.078,false);
    g.beginPath();g.arc(cx,cy,R*0.102,0,6.2832);g.stroke();
    g.beginPath();g.arc(cx,cy,R*0.048,0,6.2832);g.stroke();
    g.beginPath();g.moveTo(cx,cy+R*0.32);g.quadraticCurveTo(cx-R*0.05,cy+R*0.40,cx-R*0.02,cy+R*0.455);g.stroke();
    g.beginPath();g.moveTo(0,Math.max(1,R*0.030)+1);g.lineTo(w,Math.max(1,R*0.030)+1);g.stroke();
    g.beginPath();g.moveTo(Math.max(1,R*0.030)+1,0);g.lineTo(Math.max(1,R*0.030)+1,h);g.stroke();
    for(var k=0;k<10;k++){g.beginPath();g.arc((k+0.5)*w/10,h*0.985,Math.max(0.7,R*0.012),0,6.2832);g.fill();}
  });
}

/* ---------- setup ---------- */
function setup(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true;
  fw=Math.ceil(W/CELL);fh=Math.ceil(H/CELL);N=fw*fh;
  sat=new Float32Array(N);satB=new Float32Array(N);
  Lm=new Float32Array(N);Lr=new Float32Array(N);Lg=new Float32Array(N);Lb=new Float32Array(N);
  Lm2=new Float32Array(N);Lr2=new Float32Array(N);Lg2=new Float32Array(N);Lb2=new Float32Array(N);
  Dm=new Float32Array(N);Dr=new Float32Array(N);Dg=new Float32Array(N);Db=new Float32Array(N);
  paste=new Float32Array(N);fix=new Float32Array(N);dev=new Float32Array(N);bleach=new Float32Array(N);
  type=new Uint8Array(N);cloth=new Uint8Array(N);wv=new Int8Array(N);
  gR=new Uint8Array(N);gG=new Uint8Array(N);gB=new Uint8Array(N);
  fc=document.createElement('canvas');fc.width=fw;fc.height=fh;fctx=fc.getContext('2d');
  img=fctx.createImageData(fw,fh);d32=new Uint32Array(img.data.buffer);
  buildGravel();buildCloth();
  var rw=Math.max(96,Math.min(180,W/(W<560?2.6:8.2)));
  rwC=Math.max(20,Math.round(rw/CELL));rhC=rwC;
  cols=Math.ceil(fw/rwC)+1;rows=Math.max(1,Math.floor((clothY1-clothY0)/rhC));
  buildBlocks();
  seq=[];for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)for(var b=0;b<5;b++)seq.push({r:r,c:c,b:b,ri:r*cols+c});
  pi=0;pacc=0;driftX=0;driftY=0;driftOX=0;driftOY=0;age=[0,0,0,0,0];
  wildRepeat=Math.min(rows*cols-1,Math.floor(rows*cols*0.5)+ (cols>2?1:0));
  IVAL=Math.max(0.055,Math.min(0.115,14/Math.max(1,seq.length)));
}
function buildGravel(){
  var c=document.createElement('canvas');c.width=fw;c.height=fh;var g=c.getContext('2d');
  g.fillStyle='#dcd6c6';g.fillRect(0,0,fw,fh);
  var n=Math.floor(fw*fh/7);
  for(var i=0;i<n;i++){
    var x=Math.random()*fw,y=Math.random()*fh,r=0.7+Math.random()*2.5,rot=Math.random()*3.14;
    g.fillStyle='rgba(139,131,117,'+(0.30+Math.random()*0.55).toFixed(2)+')';
    g.beginPath();g.ellipse(x+r*0.5,y+r*0.55,r,r*0.78,rot,0,6.2832);g.fill();
    var l=Math.random()<0.16?253:(222+Math.random()*26);
    g.fillStyle='rgb('+(l|0)+','+((l-5)|0)+','+((l-19)|0)+')';
    g.beginPath();g.ellipse(x,y,r,r*0.78,rot,0,6.2832);g.fill();
  }
  var d=g.getImageData(0,0,fw,fh).data;
  for(var y2=0;y2<fh;y2++){
    var eg=Math.max(0,1-y2/(fh*0.16))*0.10+Math.max(0,1-(fh-y2)/(fh*0.16))*0.10;
    for(var x2=0;x2<fw;x2++){
      var i2=y2*fw+x2,k=i2*4,f=1+eg;
      var rr=d[k]*f,gg2=d[k+1]*f,bb=d[k+2]*f;
      gR[i2]=rr>255?255:rr;gG[i2]=gg2>255?255:gg2;gB[i2]=bb>255?255:bb;
    }
  }
}
function buildCloth(){
  clothY0=Math.round(fh*0.075);clothY1=fh-Math.round(fh*0.075);
  for(var x=0;x<fw;x++){
    var t=clothY0+Math.sin(x*0.055)*1.4+Math.sin(x*0.0161+1.3)*2.3+(Math.random()-0.5);
    var b=clothY1+Math.sin(x*0.047+2.1)*1.6+Math.sin(x*0.0133+0.4)*2.1+(Math.random()-0.5);
    for(var y=0;y<fh;y++){var i=y*fw+x;cloth[i]=(y>=t&&y<=b)?1:0;wv[i]=((Math.random()*9)-4)|0;}
  }
}

/* ---------- printing ---------- */
function stamp(blk,px,py,dtype,load){
  var pf=(dtype===5)?0.45:1.0;
  for(var y=0;y<blk.h;y++){
    var ty=py+y;if(ty<0||ty>=fh)continue;
    var ro=ty*fw,mo=y*blk.w;
    for(var x=0;x<blk.w;x++){
      var a=blk.m[mo+x];if(a<0.03)continue;
      var tx=px+x;if(tx<0||tx>=fw)continue;
      var i=ro+tx;if(!cloth[i])continue;
      var amt=a*load;
      if(type[i]===dtype){ fix[i]=Math.min(1.15,fix[i]+amt*0.85); paste[i]=Math.min(1.5,paste[i]+amt*0.85*pf); }
      else if(amt>fix[i]*0.72){ type[i]=dtype; fix[i]=Math.min(1.1,fix[i]*0.15+amt); paste[i]=Math.max(paste[i]*0.4,amt*pf); dev[i]*=0.25; bleach[i]*=0.25; }
      else { paste[i]=Math.min(1.5,paste[i]+amt*0.3*pf); }
    }
  }
}
function impression(e){
  if(e.b===0){
    if(e.c===0){driftX*=0.45;driftY*=0.45;driftOX*=0.40;driftOY*=0.40;}
    driftX+=gauss()*0.24;driftY+=gauss()*0.17;
    driftOX+=gauss()*0.20;driftOY+=gauss()*0.15;
    driftX=Math.max(-3.6,Math.min(3.6,driftX));driftY=Math.max(-3.0,Math.min(3.0,driftY));
    driftOX=Math.max(-3.0,Math.min(3.0,driftOX));driftOY=Math.max(-2.6,Math.min(2.6,driftOY));
  }
  age[e.b]++;
  var load=1-0.088*age[e.b];
  if(age[e.b]>=8+(e.b%2)){age[e.b]=0;}
  if(load<0.42)load=0.42;
  var dtype=BTYPE[e.b];
  var ox=(e.b===4)?driftX+driftOX:driftX, oy=(e.b===4)?driftY+driftOY:driftY;
  var px=Math.round(e.c*rwC+ox), py=Math.round(clothY0+e.r*rhC+oy);
  if(e.b===1&&e.ri===wildRepeat){ dtype=3; load=1.0; px=e.c*rwC; py=clothY0+e.r*rhC; }
  stamp(blocks[e.b],px,py,dtype,load);
  Snd.thump(BSIZE[e.b]);
}
function printTick(dt){
  if(pi>=seq.length)return;
  pacc+=dt;
  var guard=0;
  while(pacc>=IVAL&&pi<seq.length&&guard<14){pacc-=IVAL;impression(seq[pi++]);guard++;}
}

/* ---------- water ---------- */
var RX=7.6,RY=5.2;
function splash(pxx,pyy,a){
  var cx=pxx/CELL,cy=pyy/CELL;
  var x0=Math.max(0,Math.floor(cx-RX)),x1=Math.min(fw-1,Math.ceil(cx+RX));
  var y0=Math.max(0,Math.floor(cy-RY)),y1=Math.min(fh-1,Math.ceil(cy+RY));
  for(var y=y0;y<=y1;y++){var dy=(y-cy)/RY,ro=y*fw;
    for(var x=x0;x<=x1;x++){var dx=(x-cx)/RX,q=dx*dx+dy*dy;if(q>1)continue;
      var f=1-q*q,i=ro+x;
      var add=a*f*(type[i]===5?0.42:1);
      var s=sat[i]+add;if(s>1.12)s=1.12;sat[i]=s;}}
}
function wetSeg(x0,y0,x1,y1){
  var d=Math.sqrt((x1-x0)*(x1-x0)+(y1-y0)*(y1-y0));
  var steps=Math.max(1,Math.ceil(d/(CELL*1.8)));
  var a=0.55/Math.max(1,Math.min(steps,6));
  for(var k=0;k<=steps;k++){var t=k/steps;splash(x0+(x1-x0)*t,y0+(y1-y0)*t,a*3.0);}
}

/* ---------- diffusion / advection ---------- */
function diffuse(){
  satB.set(sat);
  for(var y=1;y<fh-1;y++){
    var ro=y*fw;
    for(var x=1;x<fw-1;x++){
      var i=ro+x,s=satB[i];
      var l=satB[i-1],r=satB[i+1],u=satB[i-fw],dn=satB[i+fw];
      if(s<0.0004&&l<0.0004&&r<0.0004&&u<0.0004&&dn<0.0004)continue;
      var v=s+KX*(l+r-2*s)+KY*(u+dn-2*s);
      sat[i]=v<0?0:v;
    }
  }
}
function advect(){
  Lm2.set(Lm);Lr2.set(Lr);Lg2.set(Lg);Lb2.set(Lb);
  for(var y=1;y<fh-1;y++){
    var ro=y*fw;
    for(var x=1;x<fw-1;x++){
      var i=ro+x;var m=Lm[i];
      if(m<1e-5)continue;var s=sat[i];if(s<0.10)continue;
      var dl=s-sat[i-1];if(dl<0)dl=0;dl*=KAX;
      var dr=s-sat[i+1];if(dr<0)dr=0;dr*=KAX;
      var du=s-sat[i-fw];if(du<0)du=0;du*=KAY;
      var dd=s-sat[i+fw];if(dd<0)dd=0;dd*=KAY;
      var tot=dl+dr+du+dd;if(tot<1e-5)continue;
      var f=tot>0.45?0.45:tot,sc=f/tot;
      var wl=dl*sc,wr=dr*sc,wu=du*sc,wd=dd*sc,ws=wl+wr+wu+wd;
      var mr=Lr[i],mg=Lg[i],mb=Lb[i];
      Lm2[i]-=m*ws;Lr2[i]-=mr*ws;Lg2[i]-=mg*ws;Lb2[i]-=mb*ws;
      Lm2[i-1]+=m*wl;Lr2[i-1]+=mr*wl;Lg2[i-1]+=mg*wl;Lb2[i-1]+=mb*wl;
      Lm2[i+1]+=m*wr;Lr2[i+1]+=mr*wr;Lg2[i+1]+=mg*wr;Lb2[i+1]+=mb*wr;
      Lm2[i-fw]+=m*wu;Lr2[i-fw]+=mr*wu;Lg2[i-fw]+=mg*wu;Lb2[i-fw]+=mb*wu;
      Lm2[i+fw]+=m*wd;Lr2[i+fw]+=mr*wd;Lg2[i+fw]+=mg*wd;Lb2[i+fw]+=mb*wd;
    }
  }
  var t;t=Lm;Lm=Lm2;Lm2=t;t=Lr;Lr=Lr2;Lr2=t;t=Lg;Lg=Lg2;Lg2=t;t=Lb;Lb=Lb2;Lb2=t;
}

/* ---------- chemistry + render ---------- */
function renderPass(dt){
  var hx=-999,hy=-999,hr=1,hs=0;
  if(hot>0.01&&ptr.active){hx=ptr.x/CELL;hy=ptr.y/CELL;hr=68/CELL;hs=hot;}
  var hr2=hr*hr,wetAcc=0,sunAcc=0;
  for(var y=0;y<fh;y++){
    var ro=y*fw;
    for(var x=0;x<fw;x++){
      var i=ro+x,s=sat[i],rate=1;
      if(hs>0){var ddx=x-hx,ddy=y-hy,q=(ddx*ddx+ddy*ddy)/hr2;
        if(q<1){var g2=(1-q)*(1-q);rate+=hs*6.5*g2;}}
      if(s>0.0006){
        var ev=EV*(0.80+0.55*rate)*(cloth[i]?1:1.9)*(0.35+0.65*s)*dt;
        s-=ev;if(s<0)s=0;sat[i]=s;
        if(Lm[i]>1e-5){
          var df=ev*7;if(s<0.05)df=1;if(df>1)df=1;
          Dm[i]+=Lm[i]*df;Dr[i]+=Lr[i]*df;Dg[i]+=Lg[i]*df;Db[i]+=Lb[i]*df;
          Lm[i]-=Lm[i]*df;Lr[i]-=Lr[i]*df;Lg[i]-=Lg[i]*df;Lb[i]-=Lb[i]*df;
        }
      } else if(Lm[i]>1e-5){
        Dm[i]+=Lm[i];Dr[i]+=Lr[i];Dg[i]+=Lg[i];Db[i]+=Lb[i];
        Lm[i]=0;Lr[i]=0;Lg[i]=0;Lb[i]=0;
      }
      var outR,outG,outB;
      if(cloth[i]){
        wetAcc+=s;sunAcc+=rate;
        var t=type[i],cvg=0,dr2=0,dg2=0,db2=0,pr=0,pg=0,pb=0;
        if(t===1){
          var d=dev[i];
          if(d<1){d+=DEVK*rate*(0.10+0.90*s)*dt;if(d>1)d=1;dev[i]=d;}
          dr2=146+22*d;dg2=133-83*d;db2=108-66*d;
          cvg=fix[i]*(0.45+0.55*d);pr=150;pg=140;pb=116;
        } else if(t===2){
          var b2=bleach[i];
          if(b2<1){b2+=BLK*rate*dt;if(b2>1)b2=1;bleach[i]=b2;}
          dr2=217+12*b2;dg2=167+50*b2;db2=43+125*b2;
          cvg=fix[i]*(1-0.30*b2);pr=219;pg=175;pb=60;
        } else if(t===3){ dr2=37;dg2=67;db2=111;cvg=fix[i];pr=64;pg=88;pb=124; }
        else if(t===4){ dr2=36;dg2=31;db2=29;cvg=fix[i];pr=64;pg=58;pb=52; }
        else if(t===5){ dr2=246;dg2=242;db2=229;cvg=fix[i]*0.85;pr=246;pg=242;pb=229; }
        var p=paste[i];
        if(p>0.002&&s>0.06&&t!==5){
          var rel=p*1.4*s*dt;if(rel>p)rel=p;
          paste[i]=p-rel;p-=rel;
          Lm[i]+=rel;Lr[i]+=rel*pr;Lg[i]+=rel*pg;Lb[i]+=rel*pb;
        }
        var n=wv[i];
        var br=240-39*s+n*0.5,bg=231-42*s+n*0.5,bb=210-41*s+n*0.55;
        if(cvg>0){if(cvg>1)cvg=1;br+=(dr2-br)*cvg;bg+=(dg2-bg)*cvg;bb+=(db2-bb)*cvg;}
        if(p>0.004){var pc=p*0.92;if(pc>0.94)pc=0.94;br+=(pr-br)*pc;bg+=(pg-bg)*pc;bb+=(pb-bb)*pc;}
        var lm=Lm[i];
        if(lm>0.004){var lc=lm*0.85;if(lc>0.82)lc=0.82;var iv=1/lm;
          br+=(Lr[i]*iv-br)*lc;bg+=(Lg[i]*iv-bg)*lc;bb+=(Lb[i]*iv-bb)*lc;}
        var dm=Dm[i];
        if(dm>0.004){var dc=dm*1.35;if(dc>0.92)dc=0.92;var iv2=1/dm;
          br+=(Dr[i]*iv2-br)*dc;bg+=(Dg[i]*iv2-bg)*dc;bb+=(Db[i]*iv2-bb)*dc;}
        var wd2=1-0.16*s,al=0.97-0.22*s;
        br*=wd2;bg*=wd2;bb*=wd2;
        outR=br*al+gR[i]*(1-al);outG=bg*al+gG[i]*(1-al);outB=bb*al+gB[i]*(1-al);
      } else {
        var f2=1-0.32*s;
        outR=gR[i]*f2;outG=gG[i]*f2;outB=gB[i]*f2;
      }
      d32[i]=pack(outR,outG,outB);
    }
  }
  meanWet=wetAcc/N;
  sunTotal+=dt*(sunAcc/N);
}
var weavePat=null;
function makeWeave(){
  var c=document.createElement('canvas');c.width=6;c.height=6;var g=c.getContext('2d');
  g.fillStyle='rgba(122,106,80,0.055)';g.fillRect(0,0,1,6);
  g.fillStyle='rgba(122,106,80,0.040)';g.fillRect(0,0,6,1);
  g.fillStyle='rgba(255,252,240,0.05)';g.fillRect(3,0,1,6);
  weavePat=ctx.createPattern(c,'repeat');
}
function blit(){
  fctx.putImageData(img,0,0);
  ctx.drawImage(fc,0,0,fw,fh,0,0,fw*CELL,fh*CELL);
  if(weavePat){ctx.fillStyle=weavePat;ctx.fillRect(0,clothY0*CELL+3,W,(clothY1-clothY0)*CELL-6);}
  drawPegs();
}
function drawPegs(){
  var step=Math.max(118,W/8.5),ty=clothY0*CELL,by=clothY1*CELL;
  for(var x=step*0.4;x<W;x+=step){
    for(var k=0;k<2;k++){
      var y=(k===0?ty-7:by-8);
      ctx.fillStyle='rgba(139,131,117,0.92)';ctx.fillRect(x+3,y+4,7,15);
      ctx.fillStyle='#241f1d';ctx.fillRect(x,y,7,15);
      ctx.fillStyle='#4b4037';ctx.fillRect(x,y,3,15);
    }
  }
}

/* ---------- sound ---------- */
var Snd={ready:false,ac:null,
 init:function(){
  if(this.ac)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
   var ac=new AC();this.ac=ac;
   var m=ac.createGain();m.gain.value=0.8;m.connect(ac.destination);this.master=m;
   var nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);
   for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=nb;
   var s1=ac.createBufferSource();s1.buffer=nb;s1.loop=true;
   var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=0.7;
   var g1=ac.createGain();g1.gain.value=0;
   s1.connect(bp);bp.connect(g1);g1.connect(m);s1.start();this.rushG=g1;this.rushF=bp;
   var s2=ac.createBufferSource();s2.buffer=nb;s2.loop=true;
   var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=4200;
   var g2=ac.createGain();g2.gain.value=0.006;
   s2.connect(hp);hp.connect(g2);g2.connect(m);s2.start();
   var s3=ac.createBufferSource();s3.buffer=nb;s3.loop=true;
   var bp3=ac.createBiquadFilter();bp3.type='bandpass';bp3.frequency.value=5300;bp3.Q.value=11;
   var tr=ac.createGain();tr.gain.value=1;
   var lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=47;
   var lg=ac.createGain();lg.gain.value=0.85;lfo.connect(lg);lg.connect(tr.gain);lfo.start();
   var g3=ac.createGain();g3.gain.value=0;
   s3.connect(bp3);bp3.connect(tr);tr.connect(g3);g3.connect(m);s3.start();this.cicG=g3;
   this.ready=true;
  }catch(e){this.ready=false;}
 },
 thump:function(size){
  if(!this.ready)return;var ac=this.ac,t=ac.currentTime;
  var f=195-115*size;
  var o=ac.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f,t+0.055);
  var g=ac.createGain();g.gain.setValueAtTime(0.0002,t);
  g.gain.exponentialRampToValueAtTime(0.26,t+0.004);g.gain.exponentialRampToValueAtTime(0.0007,t+0.15);
  o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.18);
  var s=ac.createBufferSource();s.buffer=this.nb;s.loop=true;
  var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=460+520*size;
  var g4=ac.createGain();g4.gain.setValueAtTime(0.20,t);g4.gain.exponentialRampToValueAtTime(0.0006,t+0.085);
  s.connect(lp);lp.connect(g4);g4.connect(this.master);s.start(t);s.stop(t+0.11);
 },
 tick:function(){
  if(!this.ready)return;var ac=this.ac,t=ac.currentTime;
  var s=ac.createBufferSource();s.buffer=this.nb;s.loop=true;
  var hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=2600+Math.random()*3000;
  var g=ac.createGain();g.gain.setValueAtTime(0.012+Math.random()*0.012,t);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.03);
  s.connect(hp);hp.connect(g);g.connect(this.master);s.start(t);s.stop(t+0.05);
 },
 setRush:function(v,f){if(!this.ready)return;
  this.rushG.gain.setTargetAtTime(v,this.ac.currentTime,0.06);
  this.rushF.frequency.setTargetAtTime(f,this.ac.currentTime,0.09);},
 setCic:function(v){if(!this.ready)return;this.cicG.gain.setTargetAtTime(v,this.ac.currentTime,0.6);}
};

/* ---------- pointer ---------- */
var ptr={x:-999,y:-999,px:-999,py:-999,active:false,down:false,speed:0},hot=0,still=0;
function onDown(e){
  Snd.init();if(Snd.ac&&Snd.ac.state==='suspended')Snd.ac.resume();
  ptr.down=true;ptr.active=true;
  var r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.px=ptr.x;ptr.py=ptr.y;
  still=0;e.preventDefault();
}
function onMove(e){
  var r=cv.getBoundingClientRect(),nx=e.clientX-r.left,ny=e.clientY-r.top;
  ptr.active=true;
  var dx=nx-ptr.x,dy=ny-ptr.y,d=Math.sqrt(dx*dx+dy*dy);
  if(ptr.down&&d>1.2){wetSeg(ptr.x,ptr.y,nx,ny);still=0;}
  ptr.speed=ptr.speed*0.72+d*0.28;
  ptr.x=nx;ptr.y=ny;
  if(e.cancelable)e.preventDefault();
}
function onUp(e){ptr.down=false;if(e&&e.pointerType==='touch')ptr.active=false;}
window.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
window.addEventListener('pointerleave',function(){ptr.active=false;});
window.addEventListener('keydown',function(){Snd.init();if(Snd.ac&&Snd.ac.state==='suspended')Snd.ac.resume();});

/* ---------- loop ---------- */
var last=performance.now(),acc=0,tickAcc=0;
function frame(now){
  var dt=(now-last)/1000;last=now;if(dt>0.08)dt=0.08;if(dt<0)dt=0;
  printTick(dt);
  acc+=dt;var n=0;
  while(acc>=1/60&&n<3){advect();diffuse();acc-=1/60;n++;}
  if(acc>0.4)acc=0;
  var moving=ptr.speed>1.4;
  if(ptr.active&&!moving){still+=dt;}else{still=0;}
  hot=Math.min(1,still/0.7)*(ptr.active?1:0);
  ptr.speed*=0.86;
  renderPass(dt);
  blit();
  var rv=ptr.down?Math.min(1,ptr.speed/16)*0.34*(0.35+0.65*Math.min(1,meanWet*9)):0;
  Snd.setRush(rv,520+Math.min(1,ptr.speed/18)*1500);
  Snd.setCic(Math.min(0.055,sunTotal*0.00055));
  tickAcc+=dt;
  if(tickAcc>0.09){tickAcc=0;if(Math.random()<0.45)Snd.tick();}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
setup();makeWeave();requestAnimationFrame(frame);
var rt=null;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(Math.abs(window.innerWidth-W)<48&&Math.abs(window.innerHeight-H)<48)return;
    sunTotal=0;setup();makeWeave();
  },420);
});
