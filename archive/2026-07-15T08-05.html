  <meta name="outbox-spec-era" content="1965 — the op-art / kinetic-art gallery moment, the 'Responsive Eye' hour of hard-edged screen-printed optical fields hung in a bright white-cube show: crisp ruled black-and-white patterns that shimmer, swim, and throw phantom colour purely in the eye of whoever stands in front of them. Present-tense, the print pinned to the wall and buzzing right now, ink barely dry — not a retrospective, not a 'nobody makes this anymore' look-back, a live optical field doing its work this minute.">
  <meta name="outbox-spec-format" content="The entire viewport IS one hard-edged op-art field, edge to edge — two IDENTICAL fine periodic gratings of ruled black marks on optical white, laid one exactly over the other, with the top layer slowly drifting and rotating a hair against the bottom so real moiré beat-fringes genuinely bloom out of the overlap: broad low-frequency bands that sweep across the field, tighten into shimmering rosettes where the two grids cross at a slight angle, and re-form endlessly, never once repeating because it's honest interference between two real patterns, not a canned loop. No page chrome, no header, no menu, no captions — just the buzzing ruled field filling the glass, plus one tiny corner stamp and one tiny tally.">
  <meta name="outbox-spec-subject" content="The plain optics of moiré and nothing else — that two identical periodic patterns overlaid don't add up to a busier version of themselves but breed a whole new, much larger, much slower pattern that lives in neither layer: slide one grating a fraction and dark and light beat-bands come marching out of the crossing; rotate it a couple of degrees and those bands curl into rosettes and pinwheels; make the marks concentric rings instead of straight rules and the beats bloom into swimming ellipses. The read of it: how tiny the shift needs to be to move the fringe hugely, how the fringe races the opposite way to the layer you nudged, how the phantom cyan-and-orange that flickers along the densest beats is your own retina, not the ink. Not a metaphor for anything, not sacred pattern, not chaos-and-order, not perception-as-illusion-of-life — literally two ruled screens, a small offset between them, and the enormous slow ghost-pattern the overlap has no choice but to make.">
  <meta name="outbox-spec-tone" content="No narrator and no text anywhere on the page except the one tiny corner stamp and the one tiny tally — the tone is purely the wordless, leaning-in, quick-eyed delight of standing right up close to a buzzing op print: greedy to see which way the fringe-bands pour next, tickled when a slow rotation curls the whole field into a shimmering rosette, thrilled when a nudge sends the beat racing off sideways faster than your hand moved, and caught out every time the phantom colour flickers up out of plain black and white. The interference is treated as a plain physical fact and a genuine visual jolt — bright, hard-edged, restless, alive — NOT reverent, NOT hushed, NOT a slow-down-and-breathe register, NOT trippy-mystical. The closest thing to a voice is the field's own refusal to hold the same fringe for even a second.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Hard screen-print ink-black (#141414) ruled on optical bone-white (#f4f0e6) — the two flat, no-gradient working colours of a crisp op-art print — with a single phantom retinal after-image accent that the piece never actually prints but the eye supplies: a vibrating ghost-cyan (#3fd0d8) shivering along the densest beat-bands where the fringes crowd tightest, so the only colour on the page is the one your own retina makes. Everything stark, matte, and edge-hard; no soft edges, no shading, no glow in the ink itself.">
  <meta name="outbox-spec-wildcard" content="The page must carry, and only carry, a single tiny corner stamp declaring itself a numbered plate of a fictional optical print-suite — invent a fresh studio name (nothing like Millbrook/Whitmore/Riverside, no 'society/club/gallery-of'), e.g. a made-up imprint such as 'GANNET & HOLM — OPTICAL SUITE, PLATE 11'. Nothing else anywhere on the page names, explains, links, or acknowledges the studio or the plate number; the stamp simply sits in the corner, exactly the same every visit, unremarked.">
  <meta name="outbox-spec-forbidden" content="NO melancholy / soft-autumn / wistful-elegy framing and NO 'op art was a fad / nobody makes optical prints anymore / an age of the gallery that ended' decline narrative — this is a live print buzzing on the wall this minute, ink dry. NO meditative-zen / mindfulness / 'let the pattern dissolve you / lose yourself in it' life-lesson framing, and NO trippy-psychedelic / drug-vision / cosmic-consciousness / third-eye register — it is two ruled screens and the offset between them, nothing more, and it has nothing to teach you. NO 'the illusion reveals that all seeing is deception' perception-parable — the phantom colour is a plain cheerful fact about your retina, not a lesson about reality. NO archival / museum / cabinet / drawer / vault / estate-sale / relic framing of the print or the field. NO cryptic-SCP / ominous / 'something moves in the pattern' dread. NO night-shift / dispatcher / desk / 3am voice. NO lowercase sentence-fragment minimalism. NO dry deadpan understatement. NO signal / transmission / frequency / relay framing of anything (the beats are optical fringes, not signals). NO society / club / cabinet-of-hobbyists scaffolding. And NO instructional UI text, captions, header, footer credits, title overlay, or any narrating voice anywhere on the page beyond the tiny corner plate-stamp and the tiny plates-pulled tally — the piece is otherwise entirely silent and entirely visual.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat-Fringe — Kestrel &amp; Vane, Plate 14</title>
<!--
  Two identical screens. One offset. The big slow ghost the overlap can't help but make.
  Move the pointer: the fringe races the other way, faster than your hand. Press space (or tap): new mark.
-->
<style>
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:#f4f0e6;overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #field{
    position:fixed;inset:0;display:block;
    width:100vw;height:100vh;
    touch-action:none;cursor:crosshair;
  }
  .stamp{
    position:fixed;z-index:5;
    font-family:"Courier New",Courier,monospace;
    color:#141414;background:#f4f0e6;
    border:1px solid #141414;
    padding:5px 8px;line-height:1.35;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  }
  #corner{top:12px;left:12px;font-weight:700;}
  #tally{bottom:12px;left:12px;letter-spacing:.1em;}
  #rest{
    position:fixed;z-index:5;bottom:12px;right:12px;
    font-family:"Courier New",Courier,monospace;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  }
  #rest a{
    color:#141414;background:#f4f0e6;
    border:1px solid #141414;padding:5px 8px;
    text-decoration:none;display:inline-block;
  }
  #rest a:hover{background:#141414;color:#f4f0e6;}
  @media (max-width:520px){
    .stamp,#rest{font-size:9px;}
  }
</style>
</head>
<body>
<canvas id="field" aria-label="A live optical field: two identical fine ruled screens overlaid, the top one drifting and rotating a hair against the bottom so real moiré beat-fringes bloom out of the overlap. Move the pointer to steer the fringe; press the spacebar or tap to change the ruling."></canvas>

<div id="corner" class="stamp">Kestrel &amp; Vane · Optical Suite · Plate 14</div>
<div id="tally" class="stamp">Plates pulled in this edition: <span id="count">0</span></div>
<div id="rest"><a href="/archive">the rest of the suite &rarr;</a></div>

<script>
(function(){
  "use strict";
  var INK  = "#141414";
  var BONE = "#f4f0e6";

  var cv  = document.getElementById("field");
  var ctx = cv.getContext("2d");

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var Wd = 0, Hd = 0, cx = 0, cy = 0, D = 0;

  // one working period, in device pixels — small enough that the beats stay huge
  var p        = Math.max(4, Math.round(5 * dpr));
  var ringSp   = p;
  var ringW    = Math.max(1, p * 0.5);

  // pattern families: 0 = straight ruling, 1 = concentric rings, 2 = dot screen
  var type = 0;

  var linePat = null, dotPat = null;

  function buildLineTile(){
    var c = document.createElement("canvas");
    c.width = p; c.height = p;
    var x = c.getContext("2d");
    x.fillStyle = BONE; x.fillRect(0,0,p,p);
    x.fillStyle = INK;  x.fillRect(0,0,Math.round(p/2),p);
    linePat = ctx.createPattern(c,"repeat");
  }
  function buildDotTile(){
    var c = document.createElement("canvas");
    c.width = p; c.height = p;
    var x = c.getContext("2d");
    x.fillStyle = BONE; x.fillRect(0,0,p,p);
    x.fillStyle = INK;
    x.beginPath();
    x.arc(p/2, p/2, p*0.34, 0, Math.PI*2);
    x.fill();
    dotPat = ctx.createPattern(c,"repeat");
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    Wd = Math.round(w * dpr);
    Hd = Math.round(h * dpr);
    cv.width = Wd; cv.height = Hd;
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    cx = Wd/2; cy = Hd/2;
    D  = Math.ceil(Math.hypot(Wd,Hd)) + p*2;
  }

  // pointer targets (relative nudge) eased toward, plus a never-ending slow drift
  var mx = 0, my = 0, active = false;
  var tgtTheta = 0, tgtOffX = 0, tgtOffY = 0;
  var curTheta = 0, curOffX = 0, curOffY = 0;

  function setTargetsFromPointer(){
    var nx = mx / Wd - 0.5;
    var ny = my / Hd - 0.5;
    tgtTheta = nx * 0.16;      // a couple of degrees of tilt at the edges
    tgtOffX  = nx * p * 5;
    tgtOffY  = ny * p * 5;
  }

  function drawRings(x, ox, oy){
    x.strokeStyle = INK;
    x.lineWidth = ringW;
    var maxR = Math.hypot(Wd,Hd) + ringSp;
    for(var r = ringSp; r < maxR; r += ringSp){
      x.beginPath();
      x.arc(ox, oy, r, 0, Math.PI*2);
      x.stroke();
    }
  }

  function render(now){
    var t = now / 1000;

    // ease pointer contribution
    curTheta += (tgtTheta - curTheta) * 0.07;
    curOffX  += (tgtOffX  - curOffX ) * 0.07;
    curOffY  += (tgtOffY  - curOffY ) * 0.07;

    // perpetual, honest drift so the fringe never holds for even a second
    var driftTheta = t * 0.045;
    var offX = curOffX + Math.sin(t * 0.23) * p * 1.2;
    var offY = curOffY + Math.cos(t * 0.17) * p * 1.2;
    var theta = curTheta + driftTheta;

    // clean bone ground
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BONE;
    ctx.fillRect(0,0,Wd,Hd);

    if(type === 1){
      // concentric rings: bottom fixed, top offset — swimming ellipse beats
      drawRings(ctx, cx, cy);
      ctx.globalCompositeOperation = "multiply";
      drawRings(ctx, cx + offX, cy + offY);
      ctx.globalCompositeOperation = "source-over";
    } else {
      var pat = (type === 2) ? dotPat : linePat;
      // bottom screen, anchored
      ctx.fillStyle = pat;
      ctx.fillRect(0,0,Wd,Hd);
      // top screen, translated + rotated a hair — multiply = union of both inks
      ctx.globalCompositeOperation = "multiply";
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(theta);
      ctx.translate(offX, offY);
      ctx.fillStyle = pat;
      ctx.fillRect(-D, -D, D*2, D*2);
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    requestAnimationFrame(render);
  }

  // ---- input ----------------------------------------------------
  window.addEventListener("pointermove", function(e){
    active = true;
    var r = cv.getBoundingClientRect();
    mx = (e.clientX - r.left) * dpr;
    my = (e.clientY - r.top)  * dpr;
    setTargetsFromPointer();
  }, {passive:true});

  window.addEventListener("pointerleave", function(){
    active = false;
    tgtTheta = 0; tgtOffX = 0; tgtOffY = 0;
  });

  function cycle(){ type = (type + 1) % 3; }

  window.addEventListener("keydown", function(e){
    if(e.code === "Space" || e.key === " " || e.keyCode === 32){
      e.preventDefault();
      cycle();
    }
  });

  // touch: drag steers the field, a quick tap changes the ruling
  var tStart = 0, tsx = 0, tsy = 0, moved = 0;
  cv.addEventListener("touchstart", function(e){
    var tch = e.touches[0];
    tStart = performance.now();
    tsx = tch.clientX; tsy = tch.clientY; moved = 0;
  }, {passive:true});
  cv.addEventListener("touchmove", function(e){
    var tch = e.touches[0];
    moved += Math.abs(tch.clientX - tsx) + Math.abs(tch.clientY - tsy);
    tsx = tch.clientX; tsy = tch.clientY;
    var r = cv.getBoundingClientRect();
    mx = (tch.clientX - r.left) * dpr;
    my = (tch.clientY - r.top)  * dpr;
    setTargetsFromPointer();
  }, {passive:true});
  cv.addEventListener("touchend", function(){
    if(performance.now() - tStart < 300 && moved < 12){ cycle(); }
    tgtTheta = 0; tgtOffX = 0; tgtOffY = 0;
  });

  // ---- persistent tally (counts up across visits, once per load) --
  try{
    var key = "kv_plate14_pulls";
    var n = parseInt(localStorage.getItem(key) || "0", 10);
    if(isNaN(n)) n = 0;
    n += 1;
    localStorage.setItem(key, String(n));
    document.getElementById("count").textContent = n;
  }catch(err){
    document.getElementById("count").textContent = "1";
  }

  window.addEventListener("resize", resize);

  buildLineTile();
  buildDotTile();
  resize();
  requestAnimationFrame(render);

  console.log("%cTwo identical screens. Slide one a hair — the beat-fringe pours the other way, faster than your hand. The cyan flicker on the tightest bands is your own retina, not the ink.","font-family:monospace;color:#141414;background:#f4f0e6;padding:4px");
})();
</script>
