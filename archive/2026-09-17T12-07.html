  <meta name="outbox-spec-era" content="Spring 1999, at the exact crest of the American yo-yo boom — the eight months when two companies had demonstrators driving rented minivans between four school assemblies a day, when a ball-bearing transaxle model was $29.99 at a mall cart and a wooden fixed-axle was $3.99 at a drugstore, and when the only thing three hundred kids on a gym floor actually wanted to see was one throw held long enough to do something inside it. The setting is a middle-school gymnasium in Lubbock, Texas, with the bleachers folded out on one side only, a folding table of stock by the double doors, and the 9:40 assembly coming in while the 8:15 is still going out. Not a look-back, not a memory of a fad, not anybody's childhood: the demonstrator has two more schools today, a box of 96 to move before the district's PO closes on Friday, and a voice that is already going.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY that is one yo-yo, one string and one hand, filling the whole frame: a straight-on view of a throw from about waist height, the yo-yo at the bottom of ten inches of doubled cotton, the gym floor a few inches below it, and nothing else on the page. You play it with a single continuous gesture — DRAG DOWN AND RELEASE to throw, and the speed, the straightness and the length of that drag set the entire rest of the throw, because everything that happens afterward is spent spin. While it is sleeping you TUG to bring it back, TILT by dragging sideways to swing it, PINCH the string by pressing and holding anywhere along its length (which is how every trick in the piece is actually made — the string is a real line you can touch at any point, and putting a finger on it at the right height makes a loop the yo-yo can be dropped into), and you can LET IT DIE, which it will do on its own in a few seconds if you do nothing. There is no trick list, no menu, no level select, no score screen and no scroll: one yo-yo, one string that is getting worse, and about four and a half seconds of spin to spend.">
  <meta name="outbox-spec-subject" content="The flat mechanics of sleeper-based yo-yo play, which is entirely a spin-budget problem and has nothing to do with dexterity. That SPIN TIME IS THE ONLY CURRENCY ON THE PAGE: a throw generates a fixed amount of angular momentum and every single thing done afterward — every swing, every string contact, every loop dropped into — takes some of it back, so a trick is not a shape you make, it is a purchase, and the question is never 'can I do it' but 'is there enough left'. That the throw comes off a WRIST SNAP AND NOT AN ARM: the yo-yo is accelerated over about eight inches of string and then the string runs out, so the useful work is done in the first fraction of the drop and a long slow arm throw with the same total distance puts measurably less spin on it than a short fast wrist one, which is why the biggest kid in the gym throws worst. That a CROOKED THROW COSTS MORE THAN A SLOW ONE: a yo-yo thrown off-plane precesses, the string rubs the inside of one half instead of riding free in the gap, and friction takes the spin at several times the rate of a clean throw, so a bad throw is not a shorter throw, it is a completely different order of magnitude. That RESPONSE IS THE WHOLE DESIGN TRADE: a fixed-axle wooden yo-yo has its string looped around a bare wooden shaft, so friction is enormous, it sleeps two seconds and comes back on the smallest tug, while a transaxle spins the sleeve on a bearing so the string contacts almost nothing, sleeps four or five times as long, and consequently does not come back at all unless you make it — and every kid who buys the expensive one goes home with a yo-yo that will not return, which is a design consequence and not a defect. That the RETURN IS NOT A PULL, IT IS A BIND: a tug lifts the string off the axle and lets it grab, which converts the remaining spin into climbing, so a yo-yo with plenty of spin comes up hard and one nearly dead does not come up at all and has to be wound by hand, forty-five seconds, in front of everybody. That STRING TENSION IS A REAL ACCUMULATING VARIABLE nobody mentions: the string is two plies twisted together, every throw adds a half-twist in the same direction, and after about thirty throws the loop at the axle has tightened enough to close the gap, the yo-yo starts snagging and returning on its own mid-trick, and the fix is to let it hang and unwind, which takes fifteen seconds and looks like nothing. That STRING LENGTH IS CUT TO THE PERSON: the yo-yo should hang at about navel height, and a string an inch too long means every loop trick lands wrong and the yo-yo taps the floor, which is the single most common problem in a gym full of kids using factory-length string out of the bag. That THE STRING IS THE THING TO WATCH AND NOBODY WATCHES IT — every trick is made by putting a finger against the string at a specific height and the yo-yo simply falls into whatever shape that makes, so the hand holding the yo-yo is doing almost nothing and the other hand is doing all of it. That A SNAGGED STRING IS A BURN: a spinning yo-yo whose string grabs a finger transfers real energy into skin, and the demonstrator's middle finger has a shiny patch on it. That the string is cotton, costs eleven cents, frays at exactly one place — where it crosses the axle — and parts without warning. And the flat arithmetic at the table: four and a half seconds off a good throw, ninety-six units in the box, a PO that has to be in by Friday, and two more schools today.">
  <meta name="outbox-spec-tone" content="The loud, hoarse, call-and-response gym-assembly voice of Dez Pilkington-Aquino, twenty-three, who has been doing four schools a day for eleven weeks and is working a wireless mic that pops on every plosive. He is not narrating and not reflecting — he is WORKING A ROOM, so the register is direct address at volume to three hundred people sitting on a floor, in short punchy units with built-in pauses where a crowd noise goes. He runs everything as a count and a callback: 'On three. One. Two — hands DOWN, hands down — three.' He repeats the same four instructions constantly because the room turns over every forty minutes and he has genuinely said each of them two hundred times this month: watch the string not the yo-yo; it's the wrist; throw it straight or it's dead; nobody winds it for you. He talks to the yo-yo about a third of the time, on mic, and at a specific kid in the third row of bleachers the rest. He is openly, cheerfully selling the entire time and never once pretends otherwise — every few lines he names the table by the double doors, gives a price with cents on it, and says what time he has to pack up. He is hoarse and says so twice, both times as a reason he is going to do a trick instead of explaining it. He gets a call-and-response wrong once, restarts it from the top, and does not comment. He is cheerfully boastful in a specific, priced way: he does not say he is good, he says how many throws he has done since January and how many strings he has gone through. Explicitly NOT wry, NOT deadpan, NOT wistful, NOT a craftsman-sage, NOT a burnt-out-carny, NOT secretly sad about the job, NOT a mentor, NOT charmed by himself, NOT a nineties-nostalgia narrator, and NOT aware of being read.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the yo-yo's own appearance is COMPUTED and never chosen. The ground is sealed gymnasium maple under fluorescents — a warm dry honey (#c8934a) with a hard specular strip where the high windows land, going greyer and duller in the worn lane under the bleachers (#a4834f), with two painted court lines crossing the lower frame in flaking volleyball blue. The yo-yo body is a translucent injection-moulded shell in promotional Duncan blue (#12457e), and it is rendered honestly against its own spin: at high RPM the printed logo on the side face smears into a continuous ring and the sidewall reads a single flat tone, at middling RPM the logo becomes a strobing ghost that appears to rotate backwards at whatever rate the frame timing and the true angular velocity actually produce, and near the end of a sleep it resolves into readable lettering — so THE VISITOR CAN SEE HOW MUCH SPIN IS LEFT BY WHETHER THEY CAN READ THE WORD, and nothing on the page ever says so. The string is real cotton rendered at real diameter: bright and tight and pale (#e8e2d0) when fresh, taking a live per-segment fray value that renders as a fuzzed, thickened, slightly greyed run (#b3ab96) concentrated exactly where it crosses the axle, plus a live twist count that visibly tightens the ply spacing along its whole length. Exactly one chip of sticker fluorescent orange (#f26a1b) is held strictly for the price cards on the folding table at the edge of frame, the foil sticker on the yo-yo's own sidewall, and the tape flag on the demo case — it never appears on the string, the floor, the hand or the body. Flat, hard, high contrast; no glow, no bloom, no motion-blur streaks, no lens flare, no gradients other than honest specular on sealed maple, honest fray, and honest strobing against true RPM.">
  <meta name="outbox-spec-wildcard" content="The last unsold unit in the demo case is a Yomega Brain with a worn centrifugal clutch. The engine gives it exactly the properties a worn Brain has and no others: the clutch springs are fatigued, so instead of releasing at a low RPM it grabs the axle at roughly 2.8 seconds into every single sleep regardless of how good the throw was, and the yo-yo returns to the hand whether or not anything is happening at that moment. It throws, sleeps, binds and winds like any other yo-yo, it is dealt into the case rotation exactly as often as the rest, it is not excluded from any physics, and it cannot be marked, swapped, set aside, adjusted, opened or thrown away by anything the visitor can do — it is the same unit, with the same 2.8 seconds, on every visit. Dez sells one off the table in the middle of the page at a price with cents on it, mentions that this one's clutch is gone and that it is therefore the one he demos with, and never mentions it again.">
  <meta name="outbox-spec-forbidden" content="NO yo-yo-as-metaphor for anything — not what comes back to you, not ups and downs, not tension and release, not the string that connects, not letting go and pulling in, not 'it always returns'; this is angular momentum against a friction term and it has nothing to teach anybody. ABSOLUTELY NO skill-as-discipline sermon: no ten-thousand-hours, no practice-makes, no flow state, no mastery arc, no zen, no mindfulness, no breath, no the-body-knows, no muscle-memory mysticism, no martial-arts framing, no 'the yo-yo teaches patience'. NO nineties nostalgia of any kind: no Pogs, no Tamagotchi, no Furby, no dial-up, no 'remember when', no fad-cycle essay, no 'and by autumn it was over', no hindsight, no foreshadowing past Friday, no camp, no retro-kitsch, no ironic affection for mall kiosks, foil stickers, wireless mics or promotional blue plastic, no vaporwave, no Y2K aesthetic. NO childhood-wonder register: no the-gym-fell-silent, no a-kid-in-the-third-row-who-would-grow-up-to-be, no coming-of-age, no innocence, no a-teacher-who-noticed, no the-one-kid-who-got-it. NO burnt-out-performer arc: no the-loneliness-of-the-road, no minivan melancholy, no he-used-to-want-something-else, no sad-clown, no carny pathos, no the-applause-fades. NO sales cynicism and NO anti-consumerism sermon: the table by the double doors has prices on it and the page treats the $29.99 exactly as it treats the four and a half seconds. NO craftsman-sage register, NO trade mystique, NO 'the old demonstrators could read a throw across a gym', NO master-and-apprentice arc, NO reverence for hand skill, NO handmade-versus-plastic argument, NO wooden-fixed-axle purism. NO Texas travelogue and NO explaining West Texas or Lubbock to anybody: no oil, no dust, no Friday-night-lights, no Buddy Holly, no big-sky, no drawl, no dialect spelling, no aren't-they-friendly condescension, no small-town pathos, no school-funding commentary, no teacher-underpaid subplot. NO physics-as-wonder, NO teaching voice from the engine, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — there is no help text anywhere and nothing on the page explains the machine to anybody. NO arcade or scoreboard register: no score, no combo, no streak, no level, no unlock, no achievement, no congratulations, no encouragement, no 'nice one', no trick names displayed at any time. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, process-video, ambient-visualiser or screensaver framing of the spinning. NO sensuous material writing about plastic, cotton or maple beyond friction, tension, fray, twist and specular. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the clutch that always grabs at 2.8 seconds, the string that only frays, or the yo-yo that goes under the bleachers — nothing here is wrong. NO archival / museum / cabinet / drawer / collection / relic framing of the demo case, despite it being a case of dated plastic objects — it is stock, it is for sale, and ninety-six of them have to move by Friday. NO ledger, registry, inventory, index or catalogue framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / log / 3am voice — the gym lights are on, the bleachers are full, and the 9:40 is coming in. NO signal / transmission / frequency / broadcast framing, despite the mic. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<!-- string is cut to the person. navel height. factory length is wrong for everybody in this room. -->
<script>
(function(){
"use strict";
var cv=document.getElementById("c"),g=cv.getContext("2d"),W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);layout();}
window.addEventListener("resize",fit);

/* ---------- persistence, forward only ---------- */
var K="dez.lubbock.99";
var S={throws:0,strings:6,winds:0,twist:0,burn:0,fray:null,unit:0};
try{var raw=localStorage.getItem(K);if(raw){var p=JSON.parse(raw);for(var k in S)if(p[k]!==undefined)S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}

/* ---------- geometry ---------- */
var HANDX,HANDY,FLOORY,PPI; // pixels per inch
function layout(){
  PPI=Math.min(W,H)/14;
  HANDX=W*0.5; HANDY=H*0.30; FLOORY=H*0.80;
  if(FLOORY-HANDY<PPI*11) PPI=(FLOORY-HANDY)/11.6;
}
/* string: chain of segments */
var N=26, seg=[], restLen;
var STRINGIN=10.4; // inches of doubled cotton
function initString(){
  restLen=(STRINGIN*PPI)/N;
  seg=[];
  for(var i=0;i<=N;i++) seg.push({x:HANDX,y:HANDY+i*restLen,px:HANDX,py:HANDY+i*restLen});
  if(!S.fray||S.fray.length!==N+1){S.fray=[];for(var j=0;j<=N;j++)S.fray.push(0);}
}

/* ---------- the three units in the case rotation ---------- */
var UNITS=[
  {name:"transaxle",gap:1.00,base:0.052,mass:1.0,radius:0.62,brain:false,col:"#12457e",word:"DUNCAN"},
  {name:"fixed axle",gap:0.34,base:0.360,mass:0.78,radius:0.55,brain:false,col:"#8a5a2a",word:"NO. 77"},
  {name:"brain",gap:0.86,base:0.078,mass:1.05,radius:0.62,brain:true,col:"#12457e",word:"YOMEGA"}
];
var U=UNITS[S.unit%3];

/* ---------- yo-yo state ---------- */
var yo={
  x:HANDX,y:HANDY,vx:0,vy:0,
  spin:0,          // rad/s, the only currency
  dir:1,
  theta:0,         // rotational phase
  tilt:0,          // radians off plane
  wobble:0,
  mode:"hand",     // hand | falling | sleeping | climbing | dead | wound
  sleepT:0,
  payout:0,        // inches of string paid out
  live:true
};
var pin=null;      // {x,y,i}
var drag=null;
var lastThrow={v:900,skew:0,len:PPI*7};
var windAngle=0,windAccum=0,winding=false;

/* ---------- audio ---------- */
var AC=null,master=null,verb=null,bear=null,bearG=null,bearF=null,hissG=null,hissSrc=null,crowdG=null;
function noiseBuf(sec){var b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function makeVerb(){ // hard-surface gym
  var len=AC.sampleRate*1.9,b=AC.createBuffer(2,len,AC.sampleRate);
  for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
    for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.1)*(i>AC.sampleRate*0.021?1:0.2);}}
  var c=AC.createConvolver();c.buffer=b;return c;
}
function audioInit(){
  if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  verb=makeVerb();var vg=AC.createGain();vg.gain.value=0.33;verb.connect(vg);vg.connect(master);
  // bearing whine
  bear=AC.createOscillator();bear.type="sawtooth";bear.frequency.value=40;
  bearF=AC.createBiquadFilter();bearF.type="bandpass";bearF.Q.value=9;bearF.frequency.value=900;
  bearG=AC.createGain();bearG.gain.value=0;
  bear.connect(bearF);bearF.connect(bearG);bearG.connect(master);bearG.connect(verb);bear.start();
  // cotton hiss on inner wall
  hissSrc=AC.createBufferSource();hissSrc.buffer=noiseBuf(2);hissSrc.loop=true;
  var hf=AC.createBiquadFilter();hf.type="bandpass";hf.frequency.value=3400;hf.Q.value=1.1;
  hissG=AC.createGain();hissG.gain.value=0;
  hissSrc.connect(hf);hf.connect(hissG);hissG.connect(master);hissG.connect(verb);hissSrc.start();
  // three hundred kids on a floor
  var cs=AC.createBufferSource();cs.buffer=noiseBuf(4);cs.loop=true;
  var cf=AC.createBiquadFilter();cf.type="lowpass";cf.frequency.value=620;
  var cf2=AC.createBiquadFilter();cf2.type="highpass";cf2.frequency.value=180;
  crowdG=AC.createGain();crowdG.gain.value=0.028;
  cs.connect(cf);cf.connect(cf2);cf2.connect(crowdG);crowdG.connect(master);crowdG.connect(verb);cs.start();
  scheduleBall();scheduleRoom();
}
function knock(freq,amp,dur,type){
  if(!AC)return;var o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||"triangle";o.frequency.setValueAtTime(freq,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.45),AC.currentTime+dur);
  gn.gain.setValueAtTime(0,AC.currentTime);gn.gain.linearRampToValueAtTime(amp,AC.currentTime+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0008,AC.currentTime+dur);
  o.connect(gn);gn.connect(master);gn.connect(verb);o.start();o.stop(AC.currentTime+dur+0.05);
}
function burst(amp,dur,f,q){
  if(!AC)return;var s=AC.createBufferSource();s.buffer=noiseBuf(0.4);
  var bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=q||1;
  var gn=AC.createGain();gn.gain.setValueAtTime(amp,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0005,AC.currentTime+dur);
  s.connect(bp);bp.connect(gn);gn.connect(master);gn.connect(verb);s.start();s.stop(AC.currentTime+dur+0.05);
}
function floorTap(v){knock(196,Math.min(0.22,v*0.00035),0.20,"triangle");knock(392,Math.min(0.09,v*0.0002),0.09,"sine");}
function doorCrash(){burst(0.12,0.10,1500,0.7);setTimeout(function(){knock(96,0.16,0.42,"square");},70);}
function bleacher(){burst(0.05,0.30,320,0.9);knock(70,0.07,0.34,"triangle");}
var ballT=0;
function scheduleBall(){ballT=setTimeout(function(){
  if(AC){knock(150,0.055,0.26,"sine");burst(0.02,0.05,900,1.4);}
  scheduleBall();},700+Math.random()*1400);}
function scheduleRoom(){setTimeout(function(){
  if(AC){var r=Math.random();if(r<0.3)doorCrash();else if(r<0.72)bleacher();else burst(0.018,0.5,480,0.6);}
  scheduleRoom();},6000+Math.random()*11000);}
/* wireless mic with a real popped plosive */
function micPop(strength){
  if(!AC)return;
  var o=AC.createOscillator(),gn=AC.createGain(),wf=AC.createWaveShaper();
  var curve=new Float32Array(1024);for(var i=0;i<1024;i++){var x=i/512-1;curve[i]=Math.tanh(x*7);}
  wf.curve=curve;
  o.type="sine";o.frequency.setValueAtTime(118,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(42,AC.currentTime+0.13);
  gn.gain.setValueAtTime(0,AC.currentTime);
  gn.gain.linearRampToValueAtTime(0.19*strength,AC.currentTime+0.008);
  gn.gain.exponentialRampToValueAtTime(0.0006,AC.currentTime+0.17);
  o.connect(wf);wf.connect(gn);gn.connect(master);gn.connect(verb);
  o.start();o.stop(AC.currentTime+0.22);
  burst(0.03*strength,0.05,2600,1.2);
}

/* ---------- Dez ---------- */
var micEl=document.getElementById("mic");
var LINES={
 throwGood:[
  "THERE it is. THERE it is. Look at the STRING, don't look at the yo-yo. String's where it lives.",
  "That's a wrist. That's a WRIST, that is not an arm. Eight inches and it's gone. On three — one, two, <b>three</b>.",
  "Okay that one's got seconds in it. That one's got seconds in it and I'm gonna spend 'em.",
  "Straight up and down, straight up and down. Twenty-nine ninety-nine at the table, that's the one that does that."
 ],
 throwCrooked:[
  "OOP. Crooked. Hear that? <i>(hiss)</i> That's the string eating the inside of it. Crooked's not slow, crooked's <b>dead</b>.",
  "Nope. It's leaning. It leans, it rubs, it's over. Throw it STRAIGHT or don't throw it.",
  "You heard that one. That noise is the whole reason. That noise costs you everything."
 ],
 throwWeak:[
  "Soft. That's a soft one. Big kids throw worst, I say that every time, ask the sixth grade.",
  "Slow arm, slow arm. The string runs out in eight inches — all your work has to be in the first eight inches.",
  "Not enough. Snap the wrist. SNAP it. Like you're shaking water off."
 ],
 pin:[

var lastLine="",lineLock=0,restart=false;
function say(cat,force){
  var now=performance.now();
  if(!force&&now<lineLock)return;
  var arr=LINES[cat];if(!arr)return;
  var t=arr[Math.floor(Math.random()*arr.length)];
  if(t===lastLine)t=arr[(arr.indexOf(t)+1)%arr.length];
  lastLine=t;micEl.innerHTML=t;
  lineLock=now+ (force?1400:2600);
  if(/[PpBb]/.test(t.slice(0,18))) micPop(Math.random()*0.6+0.5);
}
var idleTimer=0;

/* ---------- physics ---------- */
var GRAV=2400;
var DT=1/60;
function throwYo(vel,skew,len){
  audioInit();
  // useful work is done over the first eight inches: short fast wrist > long slow arm
  var inches=Math.min(11,len/PPI);
  var eff=Math.min(1,8/Math.max(2.4,inches));           // long slow arm loses
  var speed=Math.min(4200,vel);
  var base=(speed/1600)*eff*(0.55+0.45*Math.min(1,inches/7));
  var skewPen=Math.max(0.28,1-Math.abs(skew)/0.62);
  var tw=Math.max(0.55,1-S.twist/260);
  yo.spin=base*1150*skewPen*tw*(U.brain?0.97:1)*(U.name==="fixed axle"?0.86:1);
  yo.dir=1;
  yo.tilt=skew*0.75;
  yo.wobble=Math.abs(skew)*1.2;
  yo.mode="falling";
  yo.vy=Math.max(600,speed*0.6);
  yo.vx=skew*180;
  yo.sleepT=0;
  yo.payout=0;
  yo.live=true;
  S.throws++; S.twist+=1; // a real half-twist in a fixed direction, every throw
  lastThrow={v:vel,skew:skew,len:len};
  save();updLid();
  var ang=Math.abs(skew);
  if(yo.spin<330) say("throwWeak",true);
  else if(ang>0.20) say("throwCrooked",true);
  else say("throwGood",true);
}
function tug(){
  if(yo.mode!=="sleeping")return;
  audioInit();
  var gapNow=U.gap*Math.max(0.15,1-S.twist/300);
  var need=260/Math.max(0.35,gapNow);
  if(yo.spin>need){
    yo.mode="climbing";
    yo.vy=-Math.min(2100,yo.spin*1.5);
    yo.spin*=0.42;
    say("bindOK",true);
    burst(0.05,0.07,2200,1.1);
  } else if(yo.spin>need*0.42){
    yo.vy=-yo.spin*0.9; yo.spin*=0.5;
    say("bindFail",true);
  } else {
    yo.spin*=0.7;
    say("bindFail",true);
  }
}
function part(i){
  // the string parts and the yo-yo leaves at whatever velocity and angle it had
  S.strings=Math.max(0,S.strings-1);
  for(var j=0;j<=N;j++)S.fray[j]=0;
  S.twist=0;S.unit=(S.unit+1)%3;U=UNITS[S.unit];
  save();updLid();
  yo.mode="gone";yo.live=false;
  yo.vx=(yo.vx||0)+(Math.random()-0.5)*260;
  say("part",true);
  knock(1400,0.16,0.09,"sawtooth");burst(0.12,0.12,3800,1.6);
  setTimeout(function(){ respawn(); },2600);
}
function respawn(){
  initString();
  yo.x=HANDX;yo.y=HANDY;yo.vx=0;yo.vy=0;yo.spin=0;yo.mode="hand";yo.tilt=0;yo.live=true;yo.payout=0;
}

function stringSolve(){
  var anchorEnd = (yo.mode==="hand"||yo.mode==="wound");
  var maxLen = anchorEnd ? 0.2*restLen*N : ( (yo.mode==="falling"||yo.mode==="climbing") ? Math.max(restLen*2,yo.payout) : restLen*N );
  var rl = maxLen/N;
  for(var i=0;i<=N;i++){
    var s=seg[i];
    var vx=(s.x-s.px)*0.985, vy=(s.y-s.py)*0.985;
    s.px=s.x;s.py=s.y;
    s.x+=vx; s.y+=vy+GRAV*DT*DT*0.55;
  }
  for(var it=0;it<7;it++){
    seg[0].x=HANDX;seg[0].y=HANDY;
    var last=seg[N];last.x=yo.x;last.y=yo.y;
    if(pin){
      var p=seg[pin.i];p.x=pin.x;p.y=pin.y;
    }
    for(var i=0;i<N;i++){
      var a=seg[i],b=seg[i+1];
      var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||0.0001;
      var diff=(d-rl)/d;
      if(d<rl) diff*=0.25; // cotton doesn't push
      var ha=(i===0||(pin&&i===pin.i))?0:0.5, hb=(i+1===N||(pin&&i+1===pin.i))?0:0.5;
      var tot=ha+hb; if(tot===0)continue;
      a.x+=dx*diff*(ha/tot);a.y+=dy*diff*(ha/tot);
      b.x-=dx*diff*(hb/tot);b.y-=dy*diff*(hb/tot);
    }
  }
}

var deadTimer=0,floorTapCool=0,snagSaid=0;
function step(){
  var gapNow=U.gap*Math.max(0.12,1-S.twist/300);
  var offax=Math.abs(yo.tilt);

  if(yo.mode==="falling"){
    yo.vy+=GRAV*DT;
    yo.y+=yo.vy*DT; yo.x+=yo.vx*DT;
    yo.payout=Math.min(restLen*N, yo.y-HANDY);
    if(yo.y-HANDY>=restLen*N-0.5){
      yo.y=HANDY+restLen*N;
      yo.mode="sleeping";yo.vy=0;yo.sleepT=0;
      knock(150,0.05,0.12,"triangle");
    }
  } else if(yo.mode==="sleeping"){
    yo.sleepT+=DT;
    // pendulum from the anchor
    var dx=yo.x-HANDX,dy=yo.y-HANDY,L=Math.sqrt(dx*dx+dy*dy)||1;
    var ang=Math.atan2(dx,dy);
    var acc=-(GRAV/ (restLen*N))*Math.sin(ang);
    yo.vx+=acc*(restLen*N)*DT*0.85;
    yo.vx*=0.995;
    yo.x+=yo.vx*DT;
    var tl=restLen*N;
    var na=Math.atan2(yo.x-HANDX,tl);
    yo.x=HANDX+Math.sin(na)*tl; yo.y=HANDY+Math.cos(na)*tl;
    // THE BRAIN: worn clutch grabs at 2.8s regardless
    if(U.brain && yo.sleepT>2.8 && yo.mode==="sleeping"){
      yo.mode="climbing"; yo.vy=-Math.min(1900,Math.max(500,yo.spin*1.4)); yo.spin*=0.4;
      burst(0.05,0.06,1700,1.2);
    }
    // silent killer: twist closes the gap, it binds on its own
    if(S.twist>34 && Math.random()<0.0016*(S.twist-34) && yo.mode==="sleeping"){
      yo.mode="climbing";yo.vy=-Math.min(1800,yo.spin*1.3);yo.spin*=0.45;
      if(performance.now()-snagSaid>5000){say("snag",true);snagSaid=performance.now();}
    }
  } else if(yo.mode==="climbing"){
    yo.vy+=GRAV*DT*0.55;
    yo.y+=yo.vy*DT;
    yo.payout=Math.max(restLen*1.5,yo.y-HANDY);
    if(yo.y<=HANDY+restLen*1.6){
      yo.y=HANDY+restLen*1.2;yo.vy=0;yo.vx=0;yo.mode="hand";yo.payout=0;
      knock(230,0.13,0.17,"triangle"); // hard wooden knock against the hand
      var v=Math.abs(yo.spin);yo.spin*=0.25;
      if(v>140)S.burn=Math.min(1,S.burn+0.0018);
      save();
    }
    if(yo.vy>0&&yo.y-HANDY>restLen*N-1){ yo.y=HANDY+restLen*N; yo.mode= yo.spin>60?"sleeping":"dead"; yo.vy=0; }
  } else if(yo.mode==="dead"){
    var tl2=restLen*N;
    var na2=Math.atan2(yo.x-HANDX,tl2);
    yo.vx*=0.94;
    yo.x+=yo.vx*DT;
    yo.x=HANDX+Math.sin(na2)*tl2;yo.y=HANDY+Math.cos(na2)*tl2;
    // hanging free unwinds the twist at a real rate
    if(Math.abs(yo.vx)<40&&S.twist>0){S.twist=Math.max(0,S.twist-DT*1.9);}
    deadTimer+=DT;
    if(deadTimer>2.2&&performance.now()>lineLock){say("windNeed");deadTimer=0;}
  } else if(yo.mode==="gone"){
    yo.vy+=GRAV*DT;yo.y+=yo.vy*DT;yo.x+=yo.vx*DT;
    if(yo.y>FLOORY-U.radius*PPI){
      yo.y=FLOORY-U.radius*PPI;
      if(Math.abs(yo.vy)>90){yo.vy*=-0.34;floorTap(Math.abs(yo.vy));}
      else yo.vy=0;
      yo.vx*=0.985;
    }
    yo.spin*=0.995;
  } else if(yo.mode==="hand"){
    yo.x+=(HANDX-yo.x)*0.3;yo.y+=(HANDY+restLen*1.2-yo.y)*0.3;
    yo.spin*=0.86;
  }

  /* ---- friction: the only thing that happens to spin ---- */
  if(yo.spin>0 && (yo.mode==="sleeping"||yo.mode==="falling"||yo.mode==="climbing")){
    var f = U.base / Math.max(0.16,gapNow);
    // crooked throws: string rubs one inner wall — nearly an order of magnitude
    f *= (1 + offax*7.2);
    // swinging costs
    f *= (1 + Math.abs(yo.vx)/1400);
    // pin contact costs
    if(pin){
      var px=pin.x,py=pin.y;
      var contact=Math.min(1,Math.abs(px-HANDX)/(PPI*3)+0.35);
      f *= (1 + contact*0.9);
      S.fray[pin.i]=Math.min(1,S.fray[pin.i]+DT*0.02*(1+yo.spin/900));
    }
    // floor contact: a sleeping yo-yo against a surface with a real coefficient
    if(yo.y+U.radius*PPI>FLOORY-1){
      f*=3.4; yo.vx+= -yo.dir*yo.spin*DT*0.9;
      if(performance.now()>floorTapCool){floorTap(220);floorTapCool=performance.now()+260;say("floor");}
    }
    yo.spin -= yo.spin*f*DT*60*0.0166*3.0;
    if(yo.spin<0)yo.spin=0;
    // fray climbs fastest at the axle crossing, faster under tension
    var tension=1+Math.abs(yo.vx)/900+yo.spin/1600;
    S.fray[N]=Math.min(1,S.fray[N]+DT*0.0058*tension);
    S.fray[N-1]=Math.min(1,S.fray[N-1]+DT*0.0034*tension);
    if(pin&&pin.i>1)S.fray[pin.i]=Math.min(1,S.fray[pin.i]+DT*0.004*tension);
    if(yo.spin<30&&(yo.mode==="sleeping")){yo.mode="dead";}
    if(Math.random()<0.02)save();
  }
  if(S.fray[N]>=1 && yo.live){ part(N); }

  /* winding by hand */
  if(winding&&(yo.mode==="dead"||yo.mode==="hand")){
    yo.payout=Math.max(0,restLen*N - windAccum*restLen*N/45);
    var tl3=restLen*N-Math.min(restLen*N-restLen*1.2,windAccum*(restLen*N)/45);
    var na3=Math.atan2(yo.x-HANDX,tl3);
    yo.y=HANDY+Math.cos(na3)*tl3;yo.x=HANDX+Math.sin(na3)*tl3;
    yo.theta+=DT*7;
    if(windAccum>=45){
      winding=false;windAccum=0;S.winds++;save();updLid();
      yo.mode="hand";yo.payout=0;yo.spin=0;
      knock(230,0.12,0.16,"triangle");
    }
  }

  yo.theta += yo.spin*DT*yo.dir;
  if(yo.mode==="dead"||yo.mode==="hand")yo.tilt*=0.97;

  stringSolve();

  /* audio tracking true angular velocity */
  if(AC){
    var rpm=yo.spin;
    var target=rpm>25?Math.min(0.055,0.014+rpm/38000):0;
    bearG.gain.setTargetAtTime(target,AC.currentTime,0.05);
    bear.frequency.setTargetAtTime(58+rpm*0.44,AC.currentTime,0.04);
    bearF.frequency.setTargetAtTime(700+rpm*0.9,AC.currentTime,0.06);
    var h = (rpm>40? Math.min(0.055, offax*0.25*(rpm/900)) : 0);
    hissG.gain.setTargetAtTime(h,AC.currentTime,0.07);
  }

  idleTimer+=DT;
  if(idleTimer>9&&yo.mode==="hand"&&performance.now()>lineLock){
    idleTimer=0;
    var r=Math.random();
    if(r<0.34)say("sales");else if(r<0.44)say("hoarse");else if(r<0.54)say("call");else say("idle");
  }
}

/* ---------- drawing ---------- */
function drawFloor(){
  g.fillStyle="#1b1814";g.fillRect(0,0,W,H);

  g.fillStyle="#c8934a";g.fillRect(0,FLOORY,W,H-FLOORY);

  g.strokeStyle="rgba(120,80,36,.34)";g.lineWidth=1;
  for(var y=FLOORY+6;y<H;y+=Math.max(9,PPI*0.5)){
    g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
  }
  // worn lane under the bleachers (right side)
  g.fillStyle="#a4834f";
  g.fillRect(W*0.72,FLOORY,W*0.28,H-FLOORY);
  // hard specular strip where the high windows land
  var gd=g.createLinearGradient(0,FLOORY,0,H);
  gd.addColorStop(0,"rgba(255,246,222,.0)");
  gd.addColorStop(0.28,"rgba(255,248,226,.30)");
  gd.addColorStop(0.42,"rgba(255,248,226,.05)");

  // two painted court lines, flaking volleyball blue

  g.beginPath();g.moveTo(-20,FLOORY+(H-FLOORY)*0.52);g.lineTo(W+20,FLOORY+(H-FLOORY)*0.40);g.stroke();
  g.beginPath();g.moveTo(W*0.18,H);g.lineTo(W*0.44,FLOORY);g.stroke();
  // flaking
  g.fillStyle="rgba(200,147,74,.55)";
  for(var i=0;i<70;i++){

  }
  // wall above

  wg.addColorStop(0,"rgba(232,222,198,.09)");wg.addColorStop(1,"rgba(0,0,0,.18)");
  g.fillStyle=wg;g.fillRect(0,0,W,FLOORY);
  // folding bleachers, one side only, right edge

    g.fillRect(W-Math.min(W*0.2,PPI*2.4)+b*3, FLOORY-6-b*Math.max(9,PPI*0.42), Math.min(W*0.2,PPI*2.4), Math.max(7,PPI*0.34));
  }
  // folding table of stock by the double doors, left edge
  var tw=Math.min(W*0.20,PPI*2.6), th=Math.max(26,PPI*1.5), tx=-tw*0.28, ty=FLOORY-th;
  g.fillStyle="#3b342c";g.fillRect(tx,ty,tw,th*0.22);
  g.fillStyle="#241f1a";g.fillRect(tx+tw*0.12,ty+th*0.22,5,th*0.78);
  g.fillStyle="#241f1a";g.fillRect(tx+tw*0.80,ty+th*0.22,5,th*0.78);
  // price cards — the only orange besides the sidewall sticker and the case flag
  g.fillStyle="#f26a1b";
  g.fillRect(tx+tw*0.30,ty-Math.max(11,th*0.30),Math.max(16,tw*0.26),Math.max(9,th*0.22));
  g.fillRect(tx+tw*0.62,ty-Math.max(8,th*0.22),Math.max(13,tw*0.20),Math.max(7,th*0.17));
  // demo case with tape flag
  g.fillStyle="#2e2822";g.fillRect(W-Math.max(34,PPI*1.9),FLOORY-Math.max(18,PPI*0.9),Math.max(30,PPI*1.7),Math.max(17,PPI*0.85));
  g.fillStyle="#f26a1b";g.fillRect(W-Math.max(20,PPI*1.1),FLOORY-Math.max(20,PPI*1.0),Math.max(12,PPI*0.6),4);
}
function drawHand(){

  g.translate(HANDX,HANDY);
  g.fillStyle="#c79a76";
  g.beginPath();
  g.moveTo(-r*1.5,r*1.9);g.lineTo(-r*1.35,-r*0.25);
  g.quadraticCurveTo(-r*1.2,-r*0.95,-r*0.25,-r*0.85);
  g.quadraticCurveTo(r*0.9,-r*0.75,r*1.05,r*0.10);

  g.closePath();g.fill();
  g.fillStyle="rgba(90,56,38,.28)";
  g.fillRect(-r*0.4,-r*0.8,2,r*1.2);g.fillRect(r*0.25,-r*0.72,2,r*1.05);

function drawString(){
  var twistTight=Math.min(1,S.twist/60);
  for(var i=0;i<N;i++){
    var a=seg[i],b=seg[i+1];
    var fr=Math.max(S.fray[i],S.fray[i+1]);
    var w=(PPI*0.032)*(1+fr*2.6);
    g.lineCap="round";
    if(fr>0.05){
      g.strokeStyle="rgba(179,171,150,"+(0.30+fr*0.55)+")";
      g.lineWidth=w*2.2;
      g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    }
    g.strokeStyle= fr>0.45? "#b3ab96" : "#e8e2d0";
    g.lineWidth=Math.max(1,w);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    // two plies, spacing tightens with twist
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/d,ny=dx/d, off=(PPI*0.020)*(1-twistTight*0.7);
    g.strokeStyle="rgba(110,104,88,"+(0.28+twistTight*0.25)+")";
    g.lineWidth=Math.max(0.6,w*0.32);
    var plyStep=Math.max(3,d/ (2+twistTight*4));
    for(var t=0;t<d;t+=plyStep){
      var f1=t/d,f2=Math.min(1,(t+plyStep*0.5)/d);
      g.beginPath();
      g.moveTo(a.x+dx*f1+nx*off,a.y+dy*f1+ny*off);
      g.lineTo(a.x+dx*f2-nx*off,a.y+dy*f2-ny*off);
      g.stroke();
    }
  }
  if(pin){
    g.fillStyle="#c79a76";
    g.beginPath();g.arc(pin.x,pin.y,PPI*0.20,0,6.3);g.fill();
    g.fillStyle="rgba(255,238,220,.25)";
    g.beginPath();g.arc(pin.x-PPI*0.05,pin.y-PPI*0.05,PPI*0.07,0,6.3);g.fill();
  }
}
var frameCount=0;
function drawYo(){
  if(!yo.live&&yo.mode!=="gone")return;
  var r=U.radius*PPI;
  g.save();
  g.translate(yo.x,yo.y);
  var tilt=yo.tilt + Math.sin(frameCount*0.5)*yo.wobble*Math.min(0.12,yo.spin/9000);
  g.rotate(tilt*0.5);
  // body — translucent shell
  g.fillStyle=U.col;
  g.beginPath();g.arc(0,0,r,0,6.3);g.fill();
  // rim
  g.strokeStyle="rgba(255,255,255,.14)";g.lineWidth=Math.max(1,r*0.08);
  g.beginPath();g.arc(0,0,r*0.93,0,6.3);g.stroke();
  // honest strobing: the printed word against TRUE angular velocity
  var rpm=yo.spin;
  var apparent = yo.theta % (Math.PI*2);
  if(rpm>620){
    // smears into a continuous ring, sidewall reads one flat tone
    g.strokeStyle="rgba(232,226,208,.22)";g.lineWidth=r*0.30;
    g.beginPath();g.arc(0,0,r*0.56,0,6.3);g.stroke();
  } else if(rpm>60){
    // strobing ghost — ghosts land where the frame timing and real omega put them
    var ghosts = rpm>300?3:(rpm>150?2:1);
    for(var gi=0;gi<ghosts;gi++){
      var a=apparent + gi*(Math.PI*2/ghosts) - frameCount*0.0001;
      g.save();g.rotate(a);
      g.globalAlpha= rpm>300?0.16:(rpm>150?0.32:0.55);
      g.fillStyle="#e8e2d0";
      g.font="bold "+Math.max(6,r*0.30)+"px Helvetica, Arial, sans-serif";
      g.textAlign="center";g.textBaseline="middle";
      g.fillText(U.word,0,-r*0.44);
      g.restore();
    }
    g.globalAlpha=1;
  } else {
    // resolves into readable lettering
    g.save();g.rotate(apparent);
    g.fillStyle="#e8e2d0";
    g.font="bold "+Math.max(6,r*0.30)+"px Helvetica, Arial, sans-serif";
    g.textAlign="center";g.textBaseline="middle";
    g.fillText(U.word,0,-r*0.44);
    g.restore();
  }
  // foil sticker — orange chip, allowed only here
  g.save();g.rotate(apparent*(rpm>620?0.0:1));
  g.fillStyle= rpm>620?"rgba(242,106,27,.34)":"#f26a1b";
  if(rpm>620){g.beginPath();g.arc(0,0,r*0.22,0,6.3);g.fill();}
  else {g.beginPath();g.arc(r*0.34,r*0.10,r*0.14,0,6.3);g.fill();}
  g.restore();
  // hub / axle gap dark
  g.fillStyle="rgba(8,14,26,.75)";
  g.beginPath();g.arc(0,0,r*0.13,0,6.3);g.fill();
  g.restore();
  // shadow on maple
  if(yo.y<FLOORY){
    var h=(FLOORY-yo.y)/(PPI*8);
    g.fillStyle="rgba(70,42,16,"+Math.max(0.05,0.30-h*0.16)+")";
    g.beginPath();g.ellipse(yo.x+ (yo.x-HANDX)*0.08,FLOORY+PPI*0.15,r*(1.0+h*0.5),r*0.26,0,0,6.3);g.fill();
  }
}
function drawDrag(){
  if(!drag)return;
  g.strokeStyle="rgba(232,226,208,.35)";g.lineWidth=2;
  g.setLineDash([4,5]);
  g.beginPath();g.moveTo(drag.sx,drag.sy);g.lineTo(drag.cx,drag.cy);g.stroke();
  g.setLineDash([]);
}

function updLid(){
  document.getElementById("nT").textContent=S.throws;
  document.getElementById("nS").textContent=S.strings;
  document.getElementById("nW").textContent=S.winds;
}

/* ---------- input ---------- */
var st=document.getElementById("stage");
function pt(e){
  var r=cv.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function nearestSeg(p){
  var best=-1,bd=1e9;
  for(var i=2;i<N;i++){
    var dx=seg[i].x-p.x,dy=seg[i].y-p.y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  return (bd < (PPI*0.9)*(PPI*0.9)) ? best : -1;
}
function down(e){
  e.preventDefault();audioInit();
  var p=pt(e);
  idleTimer=0;
  if(yo.mode==="sleeping"||yo.mode==="falling"){
    var i=nearestSeg(p);
    if(i>=0){ pin={x:p.x,y:p.y,i:i}; say("pin",true); return; }
  }
  if(yo.mode==="dead"||(yo.mode==="hand"&&yo.payout>restLen*2)){
    winding=true;windAngle=Math.atan2(p.y-yo.y,p.x-yo.x);
    say("winding",true);
    drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y,t:performance.now(),wind:true};
    return;
  }
  if(yo.mode==="hand"){
    drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y,t:performance.now(),lx:p.x,ly:p.y,lt:performance.now(),vel:0,maxdev:0};
    return;
  }
  // sleeping, not on the string: sideways drag swings, downward nothing
  drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y,t:performance.now(),swing:true};
}
function move(e){
  e.preventDefault();
  var p=pt(e);
  if(pin){
    var i=nearestSeg(p); pin.x=p.x;pin.y=p.y; if(i>=0)pin.i=i;
    return;
  }
  if(!drag)return;
  if(drag.wind){
    var a=Math.atan2(p.y-yo.y,p.x-yo.x);
    var d=a-windAngle;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    windAccum+=Math.abs(d)/(Math.PI*2)*3.2; // real turns-per-drag rate
    windAngle=a;
    drag.cx=p.x;drag.cy=p.y;
    return;
  }
  if(drag.swing){
    yo.vx+=(p.x-drag.cx)*7;
    if(Math.abs(p.x-drag.cx)>3)say("tilt");
    drag.cx=p.x;drag.cy=p.y;
    return;
  }
  var now=performance.now();
  var dt=Math.max(8,now-drag.lt);
  var d=Math.sqrt((p.x-drag.lx)*(p.x-drag.lx)+(p.y-drag.ly)*(p.y-drag.ly));
  drag.vel=drag.vel*0.55 + (d/dt*1000)*0.45;
  var dev=Math.abs(p.x-drag.sx);
  if(dev>drag.maxdev)drag.maxdev=dev;
  drag.lx=p.x;drag.ly=p.y;drag.lt=now;
  drag.cx=p.x;drag.cy=p.y;
}
function up(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(pin){pin=null;return;}
  if(!drag)return;
  if(drag.wind){winding=false;drag=null;return;}
  if(drag.swing){drag=null;return;}
  var dy=drag.cy-drag.sy, dx=drag.cx-drag.sx;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(dy>PPI*1.2 && yo.mode==="hand"){
    var skew=Math.atan2(dx,Math.max(1,dy)) + (drag.maxdev/Math.max(1,Math.abs(dy)))*0.25*(dx>=0?1:-1);
    throwYo(Math.max(200,drag.vel),skew,len);
  }
  drag=null;
}
st.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
st.addEventListener("touchstart",down,{passive:false});
st.addEventListener("touchmove",move,{passive:false});
st.addEventListener("touchend",up,{passive:false});
st.addEventListener("touchcancel",up,{passive:false});

var keyPins={};
window.addEventListener("keydown",function(e){
  audioInit();idleTimer=0;
  var k=e.key;
  if(k===" "){e.preventDefault();
    if(yo.mode==="hand")throwYo(lastThrow.v,lastThrow.skew,lastThrow.len);
    return;}
  if(k==="ArrowUp"){e.preventDefault();tug();return;}
  if(k==="ArrowLeft"){e.preventDefault();yo.vx-=170;say("tilt");return;}
  if(k==="ArrowRight"){e.preventDefault();yo.vx+=170;say("tilt");return;}
  if(k==="w"||k==="W"){
    if(yo.mode==="dead"||yo.mode==="hand"){winding=true;windAccum+= 0; keyPins.W=true;}
    return;}
  if(k>="1"&&k<="9"){
    e.preventDefault();
    var n=parseInt(k,10);
    var i=Math.max(2,Math.min(N-1,Math.round(N*n/10)));
    pin={x:seg[i].x,y:seg[i].y,i:i};
    keyPins[k]=true; say("pin");
    return;}
});
window.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="w"||k==="W"){winding=false;keyPins.W=false;}
  if(k>="1"&&k<="9"){delete keyPins[k];
    var any=false;for(var q in keyPins)if(q>="1"&&q<="9")any=true;
    if(!any&&pin)pin=null;}
});

/* held W winds at a real rate */
setInterval(function(){ if(keyPins.W&&(yo.mode==="dead"||yo.mode==="hand")){winding=true;windAccum+=0.35;} },33);

/* ---------- loop ---------- */
var acc=0,last=performance.now();
function frame(now){
  var d=Math.min(0.1,(now-last)/1000);last=now;acc+=d;
  var guard=0;
  while(acc>=DT&&guard<6){step();acc-=DT;guard++;}
  frameCount++;
  drawFloor();drawString();drawHand();drawYo();drawDrag();
  requestAnimationFrame(frame);
}
fit();initString();respawn();updLid();
requestAnimationFrame(frame);
setTimeout(function(){say("call",true);},2500);
window.addEventListener("beforeunload",save);
console.log("string is cut to the person — navel height. factory length out of the bag is an inch long on most of this room.");
console.log("wound by hand: "+S.winds+". that's forty-five seconds apiece, and nobody does it for you.");
})();
</script>
