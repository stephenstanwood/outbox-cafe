<!-- no leader. no plan. forty thousand birds and one small rule: watch your seven nearest neighbours and match them. that's it. that's the whole thing pouring across the sunset. -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e0c14;overflow:hidden;}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .scratch{
    position:fixed;bottom:9px;z-index:5;
    font:10px/1.3 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.12em;color:rgba(224,196,150,.30);
    text-shadow:0 1px 2px rgba(0,0,0,.6);
    user-select:none;pointer-events:none;
  }
  #tally{left:11px;}
  #back{right:12px;pointer-events:auto;text-decoration:none;color:rgba(224,196,150,.24);}

  @media (max-width:520px){ .scratch{font-size:9px;} }

<body>
<canvas id="sky"></canvas>
<div id="tally" class="scratch">FLOCKS GONE TO ROOST HERE: 0</div>
<a id="back" class="scratch" href="/archive" title="more of these, up in the cabinet">back issues</a>
<script>
(function(){
"use strict";
const cv=document.getElementById("sky"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;

// ---- flock arrays (allocated once) ----
let N=0;
let X,Y,VX,VY,NVX,NVY,SZ,landed;

// ---- tuning: the whole rule lives in these numbers ----
const perc=26, perc2=perc*perc;
const sep=12,  sep2=sep*sep;
const maxSpeed=3.05, minSpeed=1.55, maxForce=0.09;
const wAlign=1.0, wCoh=0.86, wSep=1.55;
const alarmR=98, alarm2=alarmR*alarmR, alarmStrength=1.15;

// ---- spatial grid (linked list, zero per-frame alloc) ----
let cell=perc, cols=1, rows=1, head=null, nxt=null;

// ---- reeds ----
let reedBand=0, roostLine=0, blades=[];

// ---- lifecycle ----
let phase="rise", phaseStart=0, boilDur=60, roostX=0, activeCount=0;
let L=1, Ltarget=1;                 // light level 0..1
let attX=0, attY=0, attrK=0.0006, swirlK=0.012;

// ---- predator (the peregrine that is your cursor) ----
let userX=0,userY=0,userLast=-9999, autoT=0,autoStart=0,autoDur=0,autoActive=false;
let autoSX=0,autoSY=0,autoEX=0,autoEY=0;
let predActive=false, predX=0, predY=0, predVX=0, predVY=0;

// ---- roost tally ----
const LSKEY="outbox.flocks.roosted.v1";
let flocks=0;
try{ flocks=parseInt(localStorage.getItem(LSKEY)||"0",10)||0; }catch(e){}
const tallyEl=document.getElementById("tally");
function drawTally(){ tallyEl.textContent="FLOCKS GONE TO ROOST HERE: "+flocks; }
drawTally();

function rand(a,b){return a+Math.random()*(b-a);}

function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cols=Math.max(1,Math.ceil(W/cell)); rows=Math.max(1,Math.ceil(H/cell));
  head=new Int32Array(cols*rows);
  reedBand=Math.max(66, Math.round(H*0.135));
  roostLine=H-reedBand*0.5;
  buildReeds();
  if(N===0) initFlock();
  else clampFlock();
}

function initFlock(){
  N=Math.max(900, Math.min(2900, Math.round(W*H/640)));
  X=new Float32Array(N); Y=new Float32Array(N);
  VX=new Float32Array(N); VY=new Float32Array(N);
  NVX=new Float32Array(N); NVY=new Float32Array(N);
  SZ=new Float32Array(N); landed=new Uint8Array(N);
  nxt=new Int32Array(N);
  for(let i=0;i<N;i++) SZ[i]=rand(0.8,1.5);
  startRise(performance.now()/1000);
}
function clampFlock(){
  for(let i=0;i<N;i++){
    if(X[i]>W) X[i]=W-2; if(Y[i]>H) Y[i]=H-2;
    if(X[i]<0) X[i]=2;   if(Y[i]<0) Y[i]=2;
  }
}

function buildReeds(){
  blades=[];
  const top=H-reedBand;
  const n=Math.max(60, Math.round(W/6));
  for(let i=0;i<n;i++){
    const x=rand(-4,W+4);
    blades.push({x:x, top: top - rand(6,46), lean: rand(-8,8), w: rand(1.2,3.4)});
  }
  blades.sort((a,b)=>a.top-b.top); // taller (smaller top) drawn last, front
}

// ---------- lifecycle ----------
function startRise(t){
  phase="rise"; phaseStart=t; Ltarget=1.0;
  roostX=rand(W*0.22, W*0.78);
  for(let i=0;i<N;i++){
    landed[i]=0;
    X[i]=rand(0,W);
    Y[i]=H-rand(0,reedBand*0.9);
    const a=rand(-Math.PI*0.85,-Math.PI*0.15);
    VX[i]=Math.cos(a)*rand(1.4,2.6);
    VY[i]=Math.sin(a)*rand(1.4,2.6);
  }
  activeCount=N;
  attX=roostX; attY=H*0.4;
}
function startBoil(t){ phase="boil"; phaseStart=t; boilDur=rand(48,92); }
function startRoost(t){
  phase="roost"; phaseStart=t; Ltarget=0.08;
  roostX=rand(W*0.3, W*0.7);
}
function completeRoost(t){
  flocks++; try{ localStorage.setItem(LSKEY,String(flocks)); }catch(e){}
  drawTally();
  phase="empty"; phaseStart=t; Ltarget=0.055;
}

function updatePhase(t){
  const el=t-phaseStart;
  if(phase==="rise"){
    if(el>3.4) startBoil(t);
  } else if(phase==="boil"){
    Ltarget = 1.0 - 0.52*Math.min(1, el/boilDur);
    if(el>boilDur) startRoost(t);
  } else if(phase==="roost"){
    if(activeCount<=0 || el>20) completeRoost(t);
  } else if(phase==="empty"){
    if(el>1.8) startRise(t);
  }
  // ease light
  L += (Ltarget-L)*0.02;

  // attractor: a wandering roost-swirl, descending into the reeds at day's end
  if(phase==="boil" || phase==="rise"){
    const sky=H*0.42;
    attX = W*0.5 + Math.sin(t*0.11)*W*0.26 + Math.sin(t*0.071+1.7)*W*0.11;
    attY = sky + Math.sin(t*0.093)*H*0.14 + Math.cos(t*0.129)*H*0.07;
    attrK=0.00065; swirlK=0.010;
  } else {
    attX += (roostX-attX)*0.02;
    attY += ((H-reedBand*0.35)-attY)*0.025;
    attrK=0.0045; swirlK=0.030; // tighten & twist down into the reeds
  }
}

// ---------- predator ----------
function launchStoop(t){
  // aim through the flock's rough centre
  let cx=0,cy=0,c=0;
  for(let i=0;i<N;i+=41){ if(!landed[i]){cx+=X[i];cy+=Y[i];c++;} }
  if(c===0){autoActive=false;return;}
  cx/=c; cy/=c;
  const edge=Math.floor(rand(0,4));
  if(edge===0){autoSX=-60; autoSY=rand(0,H*0.7);}
  else if(edge===1){autoSX=W+60; autoSY=rand(0,H*0.7);}
  else if(edge===2){autoSX=rand(0,W); autoSY=-60;}
  else {autoSX=rand(0,W); autoSY=rand(0,H*0.5);}
  const dx=cx-autoSX, dy=cy-autoSY, d=Math.hypot(dx,dy)||1;
  autoEX=cx+dx/d*rand(W*0.35,W*0.7);
  autoEY=cy+dy/d*rand(60,H*0.4);
  autoStart=t; autoDur=rand(1.9,2.9); autoActive=true;
}
function updatePredator(t){
  const userFresh = (t-userLast)<2.4;
  let nx,ny;
  if(userFresh){
    nx=userX; ny=userY; predActive=true; autoActive=false;
  } else {
    if(!autoActive && t>autoT && phase==="boil"){ launchStoop(t); autoT=t+rand(11,24); }
    if(autoActive){
      const k=(t-autoStart)/autoDur;
      if(k>=1.15){ autoActive=false; predActive=false; return; }
      const e=k<1?k:1;
      nx=autoSX+(autoEX-autoSX)*e; ny=autoSY+(autoEY-autoSY)*e;
      // let it overshoot a touch past the flock
      nx+= (autoEX-autoSX)*Math.max(0,k-1);
      ny+= (autoEY-autoSY)*Math.max(0,k-1);
      predActive=true;
    } else { predActive=false; return; }
  }
  predVX = nx-predX; predVY = ny-predY;
  predX=nx; predY=ny;
}

// ---------- steering helper (writes globals to avoid alloc) ----------
let _sx=0,_sy=0;
function steer(dvx,dvy,pvx,pvy){
  let m=Math.sqrt(dvx*dvx+dvy*dvy);
  if(m===0){_sx=0;_sy=0;return;}
  dvx=dvx/m*maxSpeed; dvy=dvy/m*maxSpeed;
  let sx=dvx-pvx, sy=dvy-pvy;
  let sm=Math.sqrt(sx*sx+sy*sy);
  if(sm>maxForce){sx=sx/sm*maxForce; sy=sy/sm*maxForce;}
  _sx=sx; _sy=sy;
}

function step(dtS,t){
  // build grid from current positions
  head.fill(-1);
  for(let i=0;i<N;i++){
    if(landed[i]){nxt[i]=-1;continue;}
    let gx=(X[i]/cell)|0, gy=(Y[i]/cell)|0;
    if(gx<0)gx=0; else if(gx>=cols)gx=cols-1;
    if(gy<0)gy=0; else if(gy>=rows)gy=rows-1;
    const c=gy*cols+gx; nxt[i]=head[c]; head[c]=i;
  }

  const M=Math.min(140,W*0.14), edgeK=0.0016, topK=0.0016;
  const predOn=predActive;

  for(let i=0;i<N;i++){
    if(landed[i])continue;
    const px=X[i],py=Y[i],pvx=VX[i],pvy=VY[i];
    let axA=0,ayA=0,axC=0,ayC=0,cnt=0;
    let sxA=0,syA=0,sepCnt=0;

    let gx=(px/cell)|0, gy=(py/cell)|0;
    if(gx<0)gx=0; else if(gx>=cols)gx=cols-1;
    if(gy<0)gy=0; else if(gy>=rows)gy=rows-1;

    for(let oy=gy-1;oy<=gy+1;oy++){
      if(oy<0||oy>=rows)continue;
      for(let ox=gx-1;ox<=gx+1;ox++){
        if(ox<0||ox>=cols)continue;
        let j=head[oy*cols+ox];
        while(j!==-1){
          if(j!==i){
            const dx=px-X[j], dy=py-Y[j], d2=dx*dx+dy*dy;
            if(d2<perc2){
              cnt++;
              axA+=VX[j]; ayA+=VY[j];
              axC+=X[j];  ayC+=Y[j];
              if(d2<sep2 && d2>0.0001){
                sxA+=dx/d2; syA+=dy/d2; sepCnt++;
              }
            }
          }
          j=nxt[j];
        }
      }
    }

    let accx=0,accy=0;
    if(cnt>0){
      steer(axA/cnt, ayA/cnt, pvx,pvy);        accx+=_sx*wAlign; accy+=_sy*wAlign;
      steer(axC/cnt-px, ayC/cnt-py, pvx,pvy);  accx+=_sx*wCoh;   accy+=_sy*wCoh;
    }
    if(sepCnt>0){
      steer(sxA,syA,pvx,pvy);                  accx+=_sx*wSep;   accy+=_sy*wSep;
    }

    // gentle roost-swirl attractor
    accx+=(attX-px)*attrK; accy+=(attY-py)*attrK;
    let ox2=px-attX, oy2=py-attY, om=Math.sqrt(ox2*ox2+oy2*oy2)||1;
    accx+=(-oy2/om)*swirlK; accy+=(ox2/om)*swirlK;

    // the peregrine: hard, real, immediate flee — this is what shears the cloud
    if(predOn){
      const dx=px-predX, dy=py-predY, d2=dx*dx+dy*dy;
      if(d2<alarm2){
        const d=Math.sqrt(d2)||1, f=1-d/alarmR;
        accx+=(dx/d)*alarmStrength*f*f + (-dy/d)*0.25*alarmStrength*f;
        accy+=(dy/d)*alarmStrength*f*f + (dx/d)*0.25*alarmStrength*f;
      }
    }

    // keep the cloud on the sky
    if(px<M) accx+=(M-px)*edgeK; else if(px>W-M) accx+=(W-M-px)*edgeK;
    if(py<M*0.6) accy+=(M*0.6-py)*topK;

    // a breath of restlessness
    accx+=(Math.random()-0.5)*0.02; accy+=(Math.random()-0.5)*0.02;

    let nvx=pvx+accx*dtS, nvy=pvy+accy*dtS;
    let sp=Math.sqrt(nvx*nvx+nvy*nvy);
    if(sp>maxSpeed){nvx=nvx/sp*maxSpeed; nvy=nvy/sp*maxSpeed;}
    else if(sp<minSpeed && sp>0.0001){nvx=nvx/sp*minSpeed; nvy=nvy/sp*minSpeed;}
    NVX[i]=nvx; NVY[i]=nvy;
  }

  // commit + move + funnel down to roost
  const roosting = (phase==="roost");
  for(let i=0;i<N;i++){
    if(landed[i])continue;
    VX[i]=NVX[i]; VY[i]=NVY[i];
    X[i]+=VX[i]*dtS; Y[i]+=VY[i]*dtS;
    if(X[i]<-20)X[i]=-20; else if(X[i]>W+20)X[i]=W+20;
    if(Y[i]<-30)Y[i]=-30;
    if(roosting && Y[i]>roostLine){ landed[i]=1; activeCount--; }
    else if(Y[i]>H+6) Y[i]=H+6;
  }
}

// ---------- render ----------
function mix(a,b,t){return a+(b-a)*t;}
function drawSky(){
  const bf=0.20+0.80*L;
  const g=ctx.createLinearGradient(0,0,0,H);
  // periwinkle top -> sodium amber -> hot apricot near the reeds
  g.addColorStop(0.00, `rgb(${58*bf|0},${58*bf|0},${102*bf|0})`);
  g.addColorStop(0.50, `rgb(${72*bf|0},${66*bf|0},${112*bf|0})`);
  g.addColorStop(0.78, `rgb(${232*bf|0},${162*bf|0},${76*bf|0})`);
  g.addColorStop(0.92, `rgb(${242*bf|0},${192*bf|0},${122*bf|0})`);
  g.addColorStop(1.00, `rgb(${210*bf|0},${150*bf|0},${92*bf|0})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // low sodium glow along the horizon
  const hy=H-reedBand;
  const rg=ctx.createRadialGradient(W*0.5,hy,10, W*0.5,hy, W*0.75);
  rg.addColorStop(0, `rgba(255,196,120,${0.30*L})`);
  rg.addColorStop(1, "rgba(255,196,120,0)");
  ctx.fillStyle=rg; ctx.fillRect(0,hy-H*0.4,W,H*0.5);
}
function drawBirds(){
  ctx.beginPath();
  for(let i=0;i<N;i++){
    if(landed[i])continue;
    let vx=VX[i],vy=VY[i], m=Math.sqrt(vx*vx+vy*vy)||1;
    const dx=vx/m, dy=vy/m, px=X[i], py=Y[i], s=SZ[i];
    const nx=px+dx*2.0*s,           ny=py+dy*2.0*s;
    const lx=px-dx*1.3*s + -dy*1.05*s, ly=py-dy*1.3*s + dx*1.05*s;
    const rx=px-dx*1.3*s -  -dy*1.05*s, ry=py-dy*1.3*s -  dx*1.05*s;
    ctx.moveTo(nx,ny); ctx.lineTo(lx,ly); ctx.lineTo(rx,ry);
  }
  ctx.fillStyle="rgba(20,16,25,0.86)"; // packs to charcoal where dense
  ctx.fill();
}
function drawPeregrine(){
  if(!predActive)return;
  let m=Math.hypot(predVX,predVY)||1;
  const dx=predVX/m, dy=predVY/m;
  ctx.save();
  ctx.strokeStyle="rgba(138,144,168,0.5)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(predX-dx*14,predY-dy*14);
  ctx.lineTo(predX,predY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(predX+dx*5,predY+dy*5);
  ctx.lineTo(predX-dx*3+ -dy*3.2, predY-dy*3+dx*3.2);
  ctx.lineTo(predX-dx*3 - -dy*3.2, predY-dy*3 - dx*3.2);
  ctx.closePath();
  ctx.fillStyle="rgba(138,144,168,0.85)";
  ctx.fill();
  ctx.restore();
}
function drawReeds(){
  const bf=0.22+0.78*L;
  ctx.fillStyle=`rgb(${14*bf|0},${12*bf|0},${20*bf|0})`;
  ctx.fillRect(0,H-reedBand,W,reedBand);
  ctx.strokeStyle=`rgb(${14*bf|0},${12*bf|0},${20*bf|0})`;
  ctx.lineCap="round";
  const base=H-reedBand+4;
  for(let k=0;k<blades.length;k++){
    const b=blades[k];
    ctx.lineWidth=b.w;
    ctx.beginPath();
    ctx.moveTo(b.x,base);
    ctx.lineTo(b.x+b.lean, b.top);
    ctx.stroke();
  }
}

let last=performance.now()/1000;
function frame(){
  const now=performance.now()/1000;
  let dt=now-last; last=now;
  let dtS=dt*60; if(dtS<0.3)dtS=0.3; else if(dtS>2.4)dtS=2.4;
  updatePhase(now);
  updatePredator(now);
  step(dtS,now);
  drawSky();
  drawBirds();
  drawPeregrine();
  drawReeds();
  requestAnimationFrame(frame);
}
