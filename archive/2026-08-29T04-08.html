  <meta name="outbox-spec-era" content="2006 — the amateur how-to-video era, shot on a Kodak EasyShare in 320×240 with the mic clipping: a fold-out card table set up in the corner of a children's gymnastics center in Muskegon, Michigan, on the Saturday party shift, with a hand-lettered practice sheet taped to the cinderblock, a double-action pump clipped to the table leg, and a cardboard flat of 260Q balloons with the lid torn off. Not a look-back at anything and not a lament for anything — there are two parties stacked back to back, the second one starts in forty minutes, and the box is down to thirty-four balloons.">
  <meta name="outbox-spec-format" content="A REAL, FULLY PLAYABLE BALLOON-TWISTING TOY, worked with two hands on one 260Q. The entire viewport is the card table seen from the twister's own downward angle — a laminate top, the pump barrel at the lower left, the flat of balloons at the lower right, the practice sheet taped up on the wall behind. One balloon is in your hands. You PUMP by dragging the pump handle up and down with real strokes (each stroke adds a real volume of air, and the inflated length and the length of uninflated tail are both live and both visible). You TWIST by grabbing the balloon anywhere along its length and rotating the cursor — the twist is a real angular input, and a bubble only sets if you carry it past enough turns. You LOCK by dragging two or three finished bubbles together until they seat against each other. You BURP by pinching the neck. You TIE OFF by dragging the nozzle into a loop. There is no menu, no level select, no score screen, no scroll — one table, one pump, thirty-four balloons, and no way to get more.">
  <meta name="outbox-spec-subject" content="The plain mechanics of a 260Q pencil balloon and specifically why the entire craft is air management and not shape-making — that a 260 is sixty inches of latex two inches across when full, and that you NEVER fill it: you leave three to five inches of soft uninflated tail, because every single twist you make afterward displaces the air out of that segment into everything still connected, and the tail is the only place that air has to go; that a figure with eleven twists in it needs a longer tail than a figure with four, so the tail length is a decision made before the shape exists and is the commonest reason a beginner's balloon bursts on the last twist of a thing that was going perfectly; that BURPING — pinching the neck and letting a short hiss out before you tie — is the professional correction for having over-pumped, and it is done before tying and never after; that a single twist has no holding power at all and will unwind the instant you let go, because latex under tension is a spring and the twist is stored energy; that the shape holds only through a LOCK, and the standard lock is three consecutive bubbles folded so bubble one and bubble three press against each other with bubble two folded between them, and it holds by mutual friction and cross-pressure and not by knotting anything; that this is why you must never let go of the twist until the lock is seated, and why you hold every completed twist between two fingers while making the next one; that all twists in a single figure must go the SAME direction, because opposing twists work each other loose over the following minute and the animal comes apart in the car; that the balloon must be PRE-STRETCHED by pulling it lengthwise a few times before pumping, because unstretched latex has a very high initial inflation pressure and a much softer plateau afterward, so pre-stretching genuinely lowers the working pressure and makes every twist safer; that the burst never happens in the middle of a bubble, it happens at a twist neck, because the latex there has been locally thinned and abraded and is carrying the highest local stress in the whole balloon; that fingernails, rings, dry cracked hands, cold latex, direct sun, and cinderblock walls are the actual causes of pops and not force; that a cold balloon out of a cold box is measurably stiffer and takes more pump strokes for the same length; that talc on your hands cuts squeak and cuts friction, which helps you twist and hurts your locks; that a balloon tied with too little neck slips its own knot; and the flat arithmetic that a dog is six bubbles and one lock at the ears, a sword is four, a poodle is a dog with a smaller tail bubble, thirty-four balloons is not thirty-four animals because you will lose some, and the second party starts at eleven forty.">
  <meta name="outbox-spec-tone" content="The fast, loud, competitive, entirely cheerful voice of Rikki Adjei-Salvatierra, seventeen, who has twisted at her aunt's gym on Saturdays for two years and is being filmed by her twelve-year-old brother Marcus, who is holding the camera badly and keeps drifting off her hands, which she tells him about four separate times without ever getting annoyed. Present tense, second person, addressed to whoever is going to watch this — she is genuinely trying to teach and she is genuinely good at it, but she talks in fast bursts because she is working while she talks, and she counts out loud constantly: balloons left in the flat, bubbles in the figure, minutes until the eleven-forty party. She corrects one concrete thing at a time ('Longer tail. Longer than that. You're going to want it at the ears and you won't have it') and never generalizes. She is openly competitive about Deshawn from the other gym, who does a four-balloon monkey she says takes too long for a line, and mentions him three times, twice with real respect. She is genuinely delighted, briefly, when a lock seats first try, and says so as a matter of the lock and not of style. She uses one rhyming mnemonic for the ear lock and uses it every single time she gets there, exactly the same way, without ever remarking on the fact that it rhymes. She mentions once that the pump gasket is going and that her aunt keeps saying she'll order one. She is not embarrassed about anything and is not learning a lesson.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Two anchors and one held chip. The card table is a warm speckled laminate in a dulled sand-beige (#c9b38a) with a darker worn band down the near edge where forearms rest (#9d8763) and a hard cold aluminum trim at the lip (#b7bcbd); behind it, gym cinderblock painted a flat institutional blue-white (#dfe4e2). Against that, latex is rendered as genuinely translucent stretched rubber and its color is COMPUTED, not chosen: each balloon carries a base pigment — party red (#d92f2c), grape (#6c3f9e), lime (#7ab52c), tangerine (#ef7c1a), and clear-ish white (#efece2) — whose rendered saturation and value are driven live by actual local wall thickness, so an over-inflated segment reads visibly paler and glassier than a soft one, a twist neck reads as a hard bright thin line where the latex has stretched near-transparent, and the untouched uninflated tail reads dense, dark, matte and chalky with visible talc. Specular is a single hard traveling highlight down the top of each bubble, sized by bubble diameter. Exactly one chip of practice-sheet marker green (#1f7a4d) is held strictly for the hand-lettered sheet taped to the wall, Rikki's bubble counts, and nothing else. Flat, hard, high-contrast, no glow, no bloom, no soft focus, no gradients other than the honest thickness of the rubber — latex and laminate under gym fluorescents at a quarter past eleven in the morning.">
  <meta name="outbox-spec-wildcard" content="The page must rhyme exactly once, and the rhyme must be Rikki's ear-lock mnemonic — a short two-beat thing she says out loud every single time she reaches the ear lock, identically, with no comment, no emphasis, and no acknowledgment anywhere on the page that it rhymes. Nothing else in the piece rhymes, and the mnemonic is never printed as a heading, a caption, or a tip.">
  <meta name="outbox-spec-forbidden" content="NO balloon-as-metaphor for fragility, joy, ephemerality, childhood, letting go, holding your breath, or 'the beautiful thing that pops' — it is displaced volume, a friction lock and hoop stress at a thinned neck, and it has nothing to teach anybody. ABSOLUTELY NO clowns as sentiment, subject, or shadow: no sad clown, no greasepaint, no circus melancholy, no what's-behind-the-smile, no Pennywise, no creepy-clown register of any kind. NO children's-wonder framing: no delighted faces, no 'that's what makes it worth it', no birthday-party warmth, no cute-kid dialogue, no aren't-they-precious. NO whimsy, NO twee, NO quirky-hobby affection, NO camp or ironic winking at party-entertainer culture or at 2006 webcam video. NO poignancy about a teenager working a Saturday job, NO coming-of-age arc, NO 'she'll remember this summer', NO family-warmth sentiment about Marcus or the aunt, NO money-worry pathos. NO craftsman-sage register, NO 'it's all in the wrist' wisdom, NO the-art-of-anything. NO nostalgia, NO wistfulness, NO 'nobody twists balloons anymore / kids only want screens now / the last of the party entertainers' decline narrative — there are thirty-four balloons in the flat and a party at eleven forty. NO sensuous material writing about rubber, air, or color beyond pressure, thickness, friction, temperature and speed. NO danger-porn or foreshadowed-injury dread about the pops; a pop is a segment that exceeded its stress and it is stated as such. NO cryptic-SCP, liminal, uncanny, analog-horror or found-footage framing of the low-resolution video or of anything on the table — nothing is wrong. NO archival / museum / cabinet / drawer / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is a quarter past eleven in the morning under gym fluorescents with a radio on in the office. NO signal / transmission / frequency framing of the squeak or the pop, despite both having a spectrum. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
/* ---------------------------------------------------------------
   card table, corner of the gym, 11:15.
   one 260Q at a time. air is conserved. the tail is the reservoir.
   if the numbers look wrong, it's the gasket. aunt Val says she'll order one.
   (lost cat flyer on the pillar by the door still says PEPPER, since '98)
----------------------------------------------------------------*/
(function(){
"use strict";

var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

/* ---------- flat count, persists, only goes down ---------- */
var LS='rikki_flat_2006';
function readFlat(){
  try{var v=localStorage.getItem(LS); if(v===null) return 34; v=parseInt(v,10);
    return (isNaN(v)||v<0)?0:Math.min(v,34);}catch(e){return 34;}
}
function writeFlat(n){ try{localStorage.setItem(LS,String(n));}catch(e){} }
var flat=readFlat();

/* ---------- audio ---------- */
var A={on:false,ctx:null};
function initAudio(){
  if(A.ctx) return;
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  A.ctx=new C();
  A.master=A.ctx.createGain(); A.master.gain.value=0.0; A.master.connect(A.ctx.destination);
  /* gym bed: mats, kids off left, radio in the office */
  var nb=A.ctx.createBufferSource(); nb.buffer=noiseBuf(4); nb.loop=true;
  var nf=A.ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=520; nf.Q.value=.4;
  var ng=A.ctx.createGain(); ng.gain.value=.028;
  nb.connect(nf); nf.connect(ng); ng.connect(A.master); nb.start();
  A.bed=ng;
  /* radio: thin band of tone drifting, far away in the office */
  var osc=A.ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=196;
  var bp=A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=7;
  var rg=A.ctx.createGain(); rg.gain.value=.006;
  osc.connect(bp); bp.connect(rg); rg.connect(A.master); osc.start();
  A.radioOsc=osc;
  /* squeak channel */
  A.sqSrc=A.ctx.createBufferSource(); A.sqSrc.buffer=noiseBuf(2); A.sqSrc.loop=true;
  A.sqF=A.ctx.createBiquadFilter(); A.sqF.type='bandpass'; A.sqF.frequency.value=2200; A.sqF.Q.value=12;
  A.sqG=A.ctx.createGain(); A.sqG.gain.value=0;
  A.sqSrc.connect(A.sqF); A.sqF.connect(A.sqG); A.sqG.connect(A.master); A.sqSrc.start();
  /* creak: pressure-tracking oscillator */
  A.crO=A.ctx.createOscillator(); A.crO.type='triangle'; A.crO.frequency.value=60;
  A.crG=A.ctx.createGain(); A.crG.gain.value=0;
  A.crO.connect(A.crG); A.crG.connect(A.master); A.crO.start();
  /* burp whistle */
  A.bwO=A.ctx.createOscillator(); A.bwO.type='sawtooth'; A.bwO.frequency.value=900;
  A.bwF=A.ctx.createBiquadFilter(); A.bwF.type='bandpass'; A.bwF.frequency.value=1600; A.bwF.Q.value=9;
  A.bwG=A.ctx.createGain(); A.bwG.gain.value=0;
  A.bwO.connect(A.bwF); A.bwF.connect(A.bwG); A.bwG.connect(A.master); A.bwO.start();
}
function noiseBuf(sec){
  var n=A.ctx.sampleRate*sec, b=A.ctx.createBuffer(1,n,A.ctx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function toggleSound(){
  initAudio(); if(!A.ctx) return;
  A.on=!A.on;
  if(A.ctx.state==='suspended') A.ctx.resume();
  A.master.gain.setTargetAtTime(A.on?0.9:0.0, A.ctx.currentTime, 0.08);
  document.getElementById('snd').textContent='sound: '+(A.on?'on':'off');
}
document.getElementById('snd').addEventListener('click',toggleSound);

function chuff(force){ /* pump valve, two-stroke */
  if(!A.on||!A.ctx) return;
  var t=A.ctx.currentTime;
  var s=A.ctx.createBufferSource(); s.buffer=noiseBuf(0.25);
  var f=A.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380+force*260; f.Q.value=2.2;
  var g=A.ctx.createGain(); g.gain.setValueAtTime(0.0,t);
  g.gain.linearRampToValueAtTime(0.32,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.16+force*0.06);
  s.connect(f);f.connect(g);g.connect(A.master); s.start(t); s.stop(t+0.32);
}
function gasketHiss(){ /* the gasket is going */
  if(!A.on||!A.ctx) return;
  var t=A.ctx.currentTime;
  var s=A.ctx.createBufferSource(); s.buffer=noiseBuf(0.3);
  var f=A.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=2600;
  var g=A.ctx.createGain(); g.gain.setValueAtTime(0.0,t);
  g.gain.linearRampToValueAtTime(0.10,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  s.connect(f);f.connect(g);g.connect(A.master); s.start(t); s.stop(t+0.3);
}
function popSound(){
  if(!A.on||!A.ctx) return;
  var t=A.ctx.currentTime;
  function burst(at,amp,hp){
    var s=A.ctx.createBufferSource(); s.buffer=noiseBuf(0.2);
    var f=A.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    var g=A.ctx.createGain();
    g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(amp,at+0.002);
    g.gain.exponentialRampToValueAtTime(0.0008,at+0.09);
    s.connect(f);f.connect(g);g.connect(A.master); s.start(at); s.stop(at+0.2);
  }
  burst(t,0.85,120);
  burst(t+0.031,0.20,700);   /* cinderblock slap-back */
  burst(t+0.052,0.09,900);
}
function knotClick(){
  if(!A.on||!A.ctx) return;
  var t=A.ctx.currentTime;
  var o=A.ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(320,t);
  o.frequency.exponentialRampToValueAtTime(120,t+0.06);
  var g=A.ctx.createGain(); g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t+0.12);
}

/* ---------- physics: one 260Q ---------- */
/* geometry in inches. nominal: 60" long, 2" dia when full.
   segments along the tube. air mass V (cubic inches) distributed.
   the uninflated tail is the reservoir; twisting displaces into it (i.e. it shrinks). */

var PIG={
  red:[217,47,44], grape:[108,63,158], lime:[122,181,44], tang:[239,124,26], white:[239,236,226]
};
var PIGNAMES=['red','grape','lime','tang','white'];

var B=null; /* current balloon */
function newBalloon(){
  if(flat<=0) return null;
  var k=PIGNAMES[(Math.random()*PIGNAMES.length)|0];
  return {
    pig:PIG[k], pigName:k,
    /* air */
    inflated:0,          /* inches of inflated column */
    radius:0,            /* current mean radius of free column, inches */
    air:0,               /* cubic inches in the free column */
    length:60,           /* nominal uninflated length */
    /* wall */
    thick:new Float32Array(120).fill(1.0),  /* relative wall thickness per 0.5" cell */
    preStretch:0,        /* 0..1, permanently lowers initial inflation pressure */
    temp:0,              /* 0 cold from the flat -> 1 warm in the hand */
    talc:0.35,
    tied:false,
    bubbles:[],          /* {len, r, air, dir, locked} */
    twistAngle:0,        /* accumulated cursor rotation on the live twist */
    twistAt:-1,          /* inches from nozzle where the live twist is */
    twistHeld:false,
    twistDir:0,
    damage:0,
    popped:false,
    born:performance.now(),
    figureDir:0,         /* first twist direction locks the figure */
    mixed:0              /* accumulated mixed-direction unwinding */
  };
}

/* pressure curve: high initial inflation pressure, then plateau, then upturn */
function pressureOf(r, thick, pre, temp){
  /* r = radius inches; balloon relaxed radius ~0.22 */
  var lam=Math.max(1, r/0.22);
  var initial=(1.0-0.42*pre)*(1.15-0.25*temp);
  /* neo-Hookean-ish thin shell: p ~ (t/r)(lam^-1 - lam^-7), scaled */
  var p=(thick/Math.max(lam,1))*(1/lam - Math.pow(lam,-7));
  p=Math.abs(p)*26*initial;
  /* upturn at high extension (strain crystallisation) */
  if(lam>3.6) p+= (lam-3.6)*(lam-3.6)*7.5*thick;
  return p;
}
function hoopStress(r,thick){ return (pressureOf(r,thick,0.4,0.6)*r)/(0.010*thick); }

var VOL_PER_STROKE=7.4; /* cubic inches at the piston, before back-pressure */

function totalAir(b){
  var a=b.air; for(var i=0;i<b.bubbles.length;i++) a+=b.bubbles[i].air; return a;
}
/* redistribute: free column length & radius from air, held at target radius until tail runs out */
function settle(b){
  var lockedLen=0;
  for(var i=0;i<b.bubbles.length;i++) lockedLen+=b.bubbles[i].len;
  var avail=b.length-lockedLen;              /* inches of tube left, inflated + tail */
  /* the free column wants radius r; column length L = air/(pi r^2) */
  /* find r so that L <= avail - minTail; if it can't fit, r grows (this is the danger) */
  var r=0.22, lo=0.22, hi=1.35;
  for(var k=0;k<32;k++){
    var m=(lo+hi)/2;
    var L=b.air/(Math.PI*m*m);
    if(L>avail) lo=m; else hi=m;
  }
  r=hi;
  var L=b.air/(Math.PI*r*r);
  if(L>avail){ L=avail; r=Math.sqrt(b.air/(Math.PI*avail)); }
  /* natural resting radius when there's plenty of tube: the balloon inflates to ~1.0" dia
     under pump pressure and stops; only displacement pushes it past that. */
  if(r<1.0){
    var natural=1.00;
    var Ln=b.air/(Math.PI*natural*natural);
    if(Ln<=avail){ r=natural; L=Ln; }
  }
  b.radius=r; b.inflated=L;
  b.tail=Math.max(0, avail-L);
  /* thin the wall wherever inflated */
  var cells=Math.min(120, Math.ceil((lockedLen+L)*2));
  var start=Math.floor(lockedLen*2);
  for(var c=start;c<cells;c++){
    var strain=r/0.22;
    var wear=(strain-1)*0.00016;
    if(wear>0) b.thick[c]=Math.max(0.14,b.thick[c]-wear);
  }
}

function pump(strokeAmount){
  if(!B||B.tied||B.popped) return 0;
  var back=pressureOf(Math.max(B.radius,0.22),wallAt(B,B.inflated*0.5),B.preStretch,B.temp);
  var eff=VOL_PER_STROKE/(1+back*0.055);   /* late strokes deliver less per unit drag */
  var dv=eff*strokeAmount;
  B.air+=dv; settle(B); checkPop(B,'pump');
  return dv;
}
function wallAt(b,inches){
  var c=Math.max(0,Math.min(119,Math.floor(inches*2)));
  return b.thick[c];
}

function checkPop(b,where){
  if(b.popped) return;
  var worst=0, at=-1;
  /* twist necks: local thinning, highest stress in the balloon */
  for(var i=0;i<b.bubbles.length;i++){
    var bb=b.bubbles[i];
    var neckT=wallAt(b,bb.startAt)*0.36*(1-0.30*bb.abrade);
    var s=hoopStress(bb.r*1.02,neckT);
    if(s>worst){worst=s;at=bb.startAt;}
  }
  if(b.twistAt>=0 && b.twistAngle>1.2){
    var nt=wallAt(b,b.twistAt)*(0.62-0.18*Math.min(1,b.twistAngle/9));
    var s2=hoopStress(b.radius*1.02,nt);
    if(s2>worst){worst=s2;at=b.twistAt;}
  }
  /* smooth column */
  var sc=hoopStress(b.radius,wallAt(b,b.inflated*0.5)*(1-b.damage*0.5));
  if(sc>worst){worst=sc;at=-2;}
  b.worst=worst; b.worstAt=at;
  if(worst>BURSTS){
    b.popped=true; b.popAt=at; b.popTime=performance.now();
    popSound();
    flat=Math.max(0,flat-1); writeFlat(flat);
    burstsThisShift++;
    say(at===-2 ? "That was mid-bubble, which almost never happens. Over-pumped, straight up. Burp it next time."
                : "Popped at the neck. Every time. That's where the latex is thinnest — you already stretched it and then you rubbed it. Not force. Thin.");
    setTimeout(function(){ B=null; }, 900);
  }
}
var BURSTS=1830;
var burstsThisShift=0;

/* ---------- rendering ---------- */
function latexColor(pig, r, thick, talc){
  /* thinner + more stretched = paler, glassier. computed, not chosen. */
  var lam=Math.max(1,r/0.22);
  var trans=Math.min(0.86, (lam-1)*0.24 + (1-thick)*0.55);
  var w=[223,228,226];
  var out=[0,0,0];
  for(var i=0;i<3;i++) out[i]=Math.round(pig[i]*(1-trans)+w[i]*trans);
  if(talc>0.5){ for(var j=0;j<3;j++) out[j]=Math.round(out[j]*0.94+16); }
  return 'rgb('+out[0]+','+out[1]+','+out[2]+')';
}
function darkLatex(pig){
  return 'rgb('+Math.round(pig[0]*0.55+26)+','+Math.round(pig[1]*0.55+26)+','+Math.round(pig[2]*0.55+26)+')';
}

var PX=0; /* pixels per inch, set on layout */
function layout(){
  PX=Math.max(4.2, Math.min(W,H*1.55)/26);
}

function drawTable(){
  /* cinderblock behind */
  ctx.fillStyle='#dfe4e2'; ctx.fillRect(0,0,W,H*0.30);
  ctx.strokeStyle='rgba(150,162,158,.55)'; ctx.lineWidth=1;
  var bh=H*0.30/4;
  for(var r=0;r<5;r++){ ctx.beginPath(); ctx.moveTo(0,r*bh); ctx.lineTo(W,r*bh); ctx.stroke(); }
  for(var r2=0;r2<5;r2++){
    var off=(r2%2)?0:W/9/2;
    for(var x=off;x<W;x+=W/9){ ctx.beginPath(); ctx.moveTo(x,r2*bh); ctx.lineTo(x,(r2+1)*bh); ctx.stroke(); }
  }
  /* practice sheet taped to the wall */
  drawSheet();
  /* aluminum trim at the lip */
  ctx.fillStyle='#b7bcbd'; ctx.fillRect(0,H*0.30,W,H*0.018);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(0,H*0.30,W,2);
  /* laminate */
  ctx.fillStyle='#c9b38a'; ctx.fillRect(0,H*0.318,W,H);
  /* speckle */
  for(var i=0;i<420;i++){
    var sx=(Math.sin(i*97.31)*0.5+0.5)*W, sy=H*0.318+(Math.sin(i*41.7)*0.5+0.5)*(H*0.682);
    ctx.fillStyle= (i%3)?'rgba(120,102,72,.18)':'rgba(240,230,205,.30)';
    ctx.fillRect(sx,sy,2,2);
  }
  /* worn band down the near edge where forearms rest */
  ctx.fillStyle='#9d8763'; ctx.fillRect(0,H*0.845,W,H*0.155);
  ctx.fillStyle='rgba(157,135,99,.5)'; ctx.fillRect(0,H*0.815,W,H*0.03);
  /* table-edge abrasion strip marker */
  ctx.fillStyle='rgba(90,76,52,.25)'; ctx.fillRect(0,H*0.845,W,2);
}
function drawSheet(){
  var w=Math.min(200,W*0.30), h=w*0.72, x=W-w-14, y=10;
  ctx.fillStyle='#f4f2ea'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#b3b7b4'; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  /* tape */
  ctx.fillStyle='rgba(226,222,206,.85)';
  ctx.fillRect(x-8,y-5,26,12); ctx.fillRect(x+w-18,y-5,26,12);
  ctx.fillStyle='#1f7a4d';
  ctx.font='bold 11px "Trebuchet MS",sans-serif';
  ctx.fillText('DOG = 6 bubbles', x+8, y+18);
  ctx.font='10px "Trebuchet MS",sans-serif';
  ctx.fillText('nose · ear · ear · neck', x+8, y+32);
  ctx.fillText('leg · leg  (lock at ears)', x+8, y+44);
  ctx.fillText('SWORD = 4', x+8, y+60);
  ctx.fillText('POODLE = dog, small tail', x+8, y+72);
  ctx.fillText('TAIL: 3–5 in. MINIMUM', x+8, y+88);
  ctx.font='bold 10px "Trebuchet MS",sans-serif';
  ctx.fillText('11:40 — second party', x+8, y+h-8);
}

function drawPump(){
  /* pump barrel clipped to the table leg, lower left */
  var bx=W*0.085, top=H*0.46, bot=H*0.94, bw=Math.max(26,W*0.052);
  ctx.fillStyle='#8f9599'; ctx.fillRect(bx-bw/2, top, bw, bot-top);
  ctx.fillStyle='#a9afb2'; ctx.fillRect(bx-bw/2, top, bw*0.34, bot-top);
  ctx.strokeStyle='#6d7376'; ctx.lineWidth=1; ctx.strokeRect(bx-bw/2+.5, top+.5, bw-1, bot-top-1);
  /* handle */
  var hy=top + (bot-top-30)*pumpPos;
  ctx.fillStyle= pumpGrab?'#2f6f4e':'#4a4e50';
  ctx.fillRect(bx-bw*0.85, hy, bw*1.7, 16);
  ctx.fillStyle='#d92f2c'; ctx.fillRect(bx-bw*0.85, hy, bw*1.7, 4);
  ctx.fillStyle='#3a3e40'; ctx.fillRect(bx-3, hy+16, 6, top+ (bot-top) - hy -16);
  /* hose to the nozzle */
  ctx.strokeStyle='#5b6062'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(bx, top); ctx.quadraticCurveTo(bx+W*0.08, top-H*0.06, nozzle.x, nozzle.y);
  ctx.stroke();
}

function drawFlat(){
  /* cardboard flat of 260Qs, lower right, lid torn off */
  var fw=Math.min(150,W*0.24), fh=fw*0.55, x=W-fw-12, y=H-fh-10;
  ctx.fillStyle='#a9855c'; ctx.fillRect(x,y,fw,fh);
  ctx.fillStyle='#c19c6d'; ctx.fillRect(x,y,fw,fh*0.22);
  ctx.strokeStyle='#7d6142'; ctx.strokeRect(x+.5,y+.5,fw-1,fh-1);
  /* torn lid line */
  ctx.beginPath(); ctx.moveTo(x,y+fh*0.22);
  for(var i=0;i<=10;i++) ctx.lineTo(x+fw*i/10, y+fh*0.22+((i%2)?2:-2));
  ctx.strokeStyle='#6b5238'; ctx.stroke();
  /* uninflated balloons: dense, dark, matte, chalky */
  var n=Math.min(flat,14);
  for(var i=0;i<n;i++){
    var p=PIG[PIGNAMES[i%5]];
    ctx.fillStyle=darkLatex(p);
    var bx=x+7+i*((fw-16)/Math.max(n,1));
    ctx.fillRect(bx, y+fh*0.30, 4, fh*0.58);
    ctx.fillStyle='rgba(255,255,255,.13)';
    ctx.fillRect(bx, y+fh*0.30, 1.4, fh*0.58);
  }
  ctx.fillStyle='#1f7a4d'; ctx.font='bold 12px "Trebuchet MS",sans-serif';
  ctx.fillText(flat===0?'empty':String(flat), x+fw-26, y+fh*0.16+1);
  flatBox={x:x,y:y,w:fw,h:fh};
}
var flatBox={x:0,y:0,w:0,h:0};

/* nozzle position on the table (where the balloon starts) */
var nozzle={x:0,y:0};
function updateNozzle(){ nozzle.x=W*0.20; nozzle.y=H*0.62; }

/* balloon runs left->right from nozzle */
function balloonPath(b){
  /* returns array of {x,y,r,thick,kind} sample points */
  var pts=[], x=nozzle.x, y=nozzle.y;
  var i,bb;
  for(i=0;i<b.bubbles.length;i++){
    bb=b.bubbles[i];
    pts.push({start:x,len:bb.len*PX,r:bb.r*PX,thick:wallAt(b,bb.startAt),kind:'bubble',idx:i,obj:bb});
    x+=bb.len*PX;
  }
  if(b.inflated>0.02) pts.push({start:x,len:b.inflated*PX,r:b.radius*PX,thick:wallAt(b,b.inflated*0.5),kind:'free'});
  x+=b.inflated*PX;
  if(b.tail>0.01) pts.push({start:x,len:b.tail*PX,r:0.22*PX,thick:1,kind:'tail'});
  return pts;
}

function drawBalloon(b,t){
  var y=nozzle.y;
  var segs=balloonPath(b);
  /* shadow on the laminate */
  ctx.fillStyle='rgba(110,92,62,.22)';
  for(var s=0;s<segs.length;s++){
    var g=segs[s];
    ctx.fillRect(g.start+3, y+g.r*0.6+4, g.len, Math.max(3,g.r*0.5));
  }
  for(var s2=0;s2<segs.length;s2++){
    var q=segs[s2];
    if(q.kind==='tail'){
      ctx.fillStyle=darkLatex(b.pig);
      ctx.fillRect(q.start, y-q.r*0.8, q.len, q.r*1.6);
      /* talc chalk */
      for(var k=0;k<Math.floor(q.len/5);k++){
        ctx.fillStyle='rgba(255,255,255,.16)';
        ctx.fillRect(q.start+k*5+(k*7%4), y-q.r*0.8+((k*13)%Math.max(1,q.r*1.6)), 2,1);
      }
      ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(q.start,y-q.r*0.8,q.len,1.5);
    } else {
      var col=latexColor(b.pig,q.r/PX,q.thick,b.talc);
      /* bubble body: flat hard shape */
      ctx.fillStyle=col;
      roundBar(q.start+1,y-q.r,q.len-2,q.r*2,Math.min(q.r,q.len/2));
      ctx.fill();
      /* one hard traveling highlight, sized by diameter */
      var hlx=q.start+ ((t*0.00016+ s2*0.31)%1)*(q.len);
      var hw=Math.max(4,q.r*0.55);
      ctx.fillStyle='rgba(255,255,255,'+(0.30+0.42*(1-q.thick))+')';
      ctx.fillRect(Math.min(hlx,q.start+q.len-hw), y-q.r*0.62, hw, Math.max(2,q.r*0.20));
      /* over-inflation reads glassy: hard edge line */
      if(q.r/PX>1.05){
        ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
        roundBar(q.start+1,y-q.r,q.len-2,q.r*2,Math.min(q.r,q.len/2)); ctx.stroke();
      }
      if(q.kind==='bubble'){
        /* neck at the START of each bubble: bright thin near-transparent line */
        ctx.fillStyle='rgba(248,250,248,.92)';
        ctx.fillRect(q.start-1.5, y-q.r*0.55, 3, q.r*1.1);
        ctx.fillStyle='rgba(0,0,0,.10)';
        ctx.fillRect(q.start+2, y-q.r*0.55, 1.5, q.r*1.1);
        /* locked ring */
        if(q.obj.locked){
          ctx.strokeStyle='#1f7a4d'; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(q.start+q.len/2, y, q.r+3, 0, Math.PI*2); ctx.stroke();
        }
      }
    }
  }
  /* end of the free column: closing neck if there's a live twist */
  if(b.twistAt>=0 && b.twistHeld){
    var lockedLen=0; for(var i2=0;i2<b.bubbles.length;i2++) lockedLen+=b.bubbles[i2].len;
    var tx=nozzle.x+(lockedLen + (b.twistAt-lockedLen))*PX;
    var frac=Math.min(1,b.twistAngle/(Math.PI*4));
    ctx.fillStyle='rgba(250,252,250,'+(0.35+0.6*frac)+')';
    ctx.fillRect(tx-2, nozzle.y-b.radius*PX*(1-0.35*frac), 4, b.radius*PX*2*(1-0.35*frac));
    /* twist indicator: a small green arc showing accumulated rotation */
    ctx.strokeStyle='#1f7a4d'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(tx, nozzle.y - b.radius*PX - 16, 11, -Math.PI/2, -Math.PI/2 + Math.min(b.twistAngle,Math.PI*4)/2);
    ctx.stroke();
  }
  /* nozzle / knot */
  ctx.fillStyle=darkLatex(b.pig);
  ctx.fillRect(nozzle.x-12, nozzle.y-4, 12, 8);
  if(b.tied){ ctx.beginPath(); ctx.arc(nozzle.x-14, nozzle.y, 5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke(); }
}
function roundBar(x,y,w,h,r){
  r=Math.max(0,Math.min(r,h/2,w/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ---------- talk track ---------- */
var talkEl=document.getElementById('talk');
var lines=[];
function say(s){
  if(lines.length && lines[lines.length-1]===s) return;
  lines.push(s); if(lines.length>4) lines.shift();
  talkEl.innerHTML=lines.map(function(l){return '<p class="l">'+l+'</p>';}).join('');
}
var MARCUS=[
  "Marcus. The hands. Point it at the hands.",
  "Marcus, you're on my face again. Hands.",
  "Down. Down. My hands, dude.",
  "Marcus — hands. Thank you."
];
var marcusIdx=0;
function marcus(){ say(MARCUS[marcusIdx%MARCUS.length]); marcusIdx++; }

/* ---------- interaction state ---------- */
var pumpPos=0.0, pumpGrab=false, pumpDir=0, pumpStrokeStart=0, strokeCount=0;
var mode=null; /* 'pump','stretch','twist','lock','burp','tie' */
var mouse={x:0,y:0,down:false};
var twistLast=0, rubVel=0, lastPos={x:0,y:0}, lastT=0;
var dragBubble=-1, dragX=0;

function pos(e){
  var r=cv.getBoundingClientRect();
  var p=(e.touches&&e.touches[0])||e;
  return {x:p.clientX-r.left, y:p.clientY-r.top};
}
function nearPump(p){
  var bx=W*0.085, bw=Math.max(26,W*0.052), top=H*0.46, bot=H*0.94;
  var hy=top+(bot-top-30)*pumpPos;
  return p.x>bx-bw*1.2 && p.x<bx+bw*1.2 && p.y>hy-26 && p.y<hy+42;
}
function inFlat(p){ return p.x>flatBox.x&&p.x<flatBox.x+flatBox.w&&p.y>flatBox.y&&p.y<flatBox.y+flatBox.h; }
function inchesAt(px){ return (px-nozzle.x)/PX; }

function down(e){
  e.preventDefault();
  var p=pos(e); mouse.x=p.x;mouse.y=p.y;mouse.down=true; lastPos={x:p.x,y:p.y}; lastT=performance.now();
  initAudio();
  if(inFlat(p)){
    if(!B && flat>0){ B=newBalloon(); B.temp=0; say("New one out of the flat. It's cold from the box — cold latex is stiffer, it'll take you more strokes for the same length. Pre-stretch it first. Drag it long, three or four times."); }
    else if(!B && flat===0){ say("Flat's empty. Pump still works. Nothing to put on it."); }
    else if(B && !B.popped){ say("Finish that one or drop it. Dragging a second one out costs you the first."); }
    return;
  }
  if(nearPump(p)){ pumpGrab=true; mode='pump'; pumpStrokeStart=p.y; return; }
  if(!B) return;
  /* nozzle: tie or burp */
  if(p.x<nozzle.x+14 && Math.abs(p.y-nozzle.y)<26){
    if(B.tied){ say("Already tied. Burping after the tie does nothing — the air has nowhere to leave from. You burp before."); return; }
    if(B.inflated<2){ say("Nothing in it yet."); return; }
    mode='burp'; say("Burping. Pinch the neck, let a short hiss out, THEN tie. That's the fix for over-pumping and it only works before the knot.");
    return;
  }
  /* on the balloon body */
  var inch=inchesAt(p.x);
  if(Math.abs(p.y-nozzle.y)<Math.max(26,B.radius*PX+14) && inch>0){
    if(!B.tied && B.inflated<0.5){
      mode='stretch'; stretchStart=p.x; say("Good. Pull it out lengthwise. Unstretched latex has a really high starting pressure — pre-stretching drops it and gives you a wider safe range. Every single balloon, every time.");
      return;
    }
    /* drag a completed bubble to lock */
    var lockedLen=0, hit=-1;
    for(var i=0;i<B.bubbles.length;i++){
      if(inch>=lockedLen && inch<lockedLen+B.bubbles[i].len){ hit=i; break; }
      lockedLen+=B.bubbles[i].len;
    }
    if(hit>=0){ mode='lock'; dragBubble=hit; dragX=p.x; return; }
    /* twist somewhere in the free column */
    if(!B.tied){ say("Tie it off first. Drag the nozzle into a little loop. Too little neck and the knot slips itself."); return; }
    mode='twist';
    var lockLen=0; for(var j=0;j<B.bubbles.length;j++) lockLen+=B.bubbles[j].len;
    B.twistAt=Math.max(lockLen+0.6, Math.min(inch, lockLen+B.inflated-0.4));
    B.twistAngle=0; B.twistHeld=true;
    twistLast=Math.atan2(p.y-nozzle.y, p.x-(nozzle.x+B.twistAt*PX));
    say("Twist is rotation, not a pinch. Turn the cursor around the neck. Keep turning. One turn does nothing — it's a spring and it unwinds the second you let go.");
  }
}
var stretchStart=0;

function move(e){
  var p=pos(e); var now=performance.now();
  var dx=p.x-lastPos.x, dy=p.y-lastPos.y;
  var dt=Math.max(1,now-lastT);
  rubVel=rubVel*0.82 + (Math.sqrt(dx*dx+dy*dy)/dt)*0.18;
  mouse.x=p.x;mouse.y=p.y;

  if(mode==='pump'&&mouse.down){
    var top=H*0.46, bot=H*0.94;
    var np=Math.max(0,Math.min(1,(p.y-top-8)/(bot-top-38)));
    var d=np-pumpPos;
    if(d>0.02){ /* downstroke = air in */
      var got=pump(d*1.0);
      if(d>0.10){ chuff(Math.min(1,d*4)); strokeCount++; }
    } else if(d<-0.05){ gasketHiss(); }
    pumpPos=np;
  }
  else if(mode==='stretch'&&mouse.down&&B){
    var pull=(p.x-stretchStart)/PX;
    if(pull>3){ B.preStretch=Math.min(1,B.preStretch+0.16); stretchStart=p.x;
      if(B.preStretch>=1) say("That's stretched. Working pressure is way down now. Onto the pump.");
    }
  }
  else if(mode==='twist'&&mouse.down&&B&&!B.popped){
    var cx=nozzle.x+B.twistAt*PX;
    var ang=Math.atan2(p.y-nozzle.y, p.x-cx);
    var d2=ang-twistLast;
    while(d2>Math.PI)d2-=Math.PI*2; while(d2<-Math.PI)d2+=Math.PI*2;
    if(B.twistDir===0 && Math.abs(d2)>0.05) B.twistDir=d2>0?1:-1;
    B.twistAngle+=Math.abs(d2);
    twistLast=ang;
    if(B.twistAngle>Math.PI*4){ setTwist(); }
  }
  else if(mode==='lock'&&mouse.down&&B){
    var dxx=(p.x-dragX)/PX;
    dragX=p.x;
    tryLock(dragBubble, dxx, p.y);
    if(p.y>H*0.845){ /* dragged onto the worn edge — abrasion */
      if(B.bubbles[dragBubble]) B.bubbles[dragBubble].abrade=Math.min(1,(B.bubbles[dragBubble].abrade||0)+0.02);
      say("Off the edge. That band on the near edge of the table will scuff a neck and then it goes right there.");
      checkPop(B,'abrade');
    }
    if(p.y<H*0.32){
      if(B.bubbles[dragBubble]) B.bubbles[dragBubble].abrade=Math.min(1,(B.bubbles[dragBubble].abrade||0)+0.035);
      say("Off the block. Cinderblock eats balloons. Keep it over the table.");
      checkPop(B,'abrade');
    }
  }
  lastPos={x:p.x,y:p.y}; lastT=now;
}

function up(e){
  mouse.down=false; pumpGrab=false;
  if(mode==='twist'&&B&&!B.popped){
    if(B.twistAngle<=Math.PI*4){
      say("Let go too early. It unwound. A single twist has zero holding power — you hold it between two fingers the whole time you make the next one.");
      B.twistHeld=false; unwinding=true;
    }
  }
  if(mode==='burp'&&B){ if(A.bwG) A.bwG.gain.setTargetAtTime(0,A.ctx.currentTime,0.05); }
  mode=null; dragBubble=-1;
}
var unwinding=false;

function setTwist(){
  var b=B; if(!b) return;
  var lockLen=0; for(var i=0;i<b.bubbles.length;i++) lockLen+=b.bubbles[i].len;
  var len=b.twistAt-lockLen;
  if(len<0.5){ b.twistAngle=0; return; }
  /* isolate: this bubble takes the air in its own volume, the rest gets pushed on */
  var vol=Math.PI*b.radius*b.radius*len;
  vol=Math.min(vol,b.air*0.95);
  var bb={len:len, r:b.radius, air:vol, dir:b.twistDir||1, locked:false,
          startAt:lockLen, abrade:0, torque:b.twistAngle, born:performance.now()};
  b.bubbles.push(bb);
  b.air-=vol;
  if(b.figureDir===0) b.figureDir=bb.dir;
  else if(bb.dir!==b.figureDir){
    b.mixed+=1;
    say("Opposite direction. Don't. Every twist in one figure goes the same way or they work each other loose and it falls apart in the car on the way home.");
  }
  /* the free column now has less tube: displaced air raises pressure, tail shrinks */
  b.twistAt=-1; b.twistAngle=0; b.twistHeld=false; b.twistDir=0;
  /* thin the neck permanently */
  var c=Math.max(0,Math.min(119,Math.floor(bb.startAt*2)));
  b.thick[c]=Math.max(0.12,b.thick[c]*0.66);
  settle(b);
  checkPop(b,'twist');
  var n=b.bubbles.length;
  if(!b.popped){
    if(n===1) say("One. Nose. Now look at your tail — it just got shorter, because that air went somewhere and the tail is the only place it can go.");
    else if(n===2) say("Two. That's an ear.");
    else if(n===3){ say("Three. <b>Ear to ear, twist it here.</b>"); }
    else if(n===4) say("Four. Neck. Tail's tight now, isn't it. Eleven twists needs more tail than four. You decide that before you shape anything.");
    else if(n===5) say("Five. Leg.");
    else if(n===6) say("Six and that's a dog. Lock the ears and you're done. Deshawn does a four-balloon monkey — it's clean, I'm not going to say it isn't, but you can't run a line of nineteen kids on a four-balloon monkey.");
    else say(n+". Keep counting. Watch the tail.");
  }
}

/* LOCKS: three consecutive bubbles folded, one and three press together, two folded between */
function tryLock(idx, dxInches, py){
  var b=B; if(!b) return;
  if(idx<2) return;
  var b1=b.bubbles[idx-2], b2=b.bubbles[idx-1], b3=b.bubbles[idx];
  if(b1.locked) return;
  b3.fold=(b3.fold||0)+dxInches*-0.35;
  if(b3.fold<0.55) return;
  /* normal force from live internal pressures */
  var p1=pressureOf(b1.r, wallAt(b,b1.startAt), b.preStretch, b.temp);
  var p3=pressureOf(b3.r, wallAt(b,b3.startAt), b.preStretch, b.temp);
  var N=(p1+p3)*0.5*Math.min(b1.r,b3.r)*2.6;
  var mu=0.86-(b.talc*0.55);
  var resist=N*mu*Math.min(b1.r,b3.r);
  var stored=(b1.torque+b2.torque+b3.torque)*0.42;
  if(resist>stored){
    b1.locked=b2.locked=b3.locked=true;
    knotClick();
    if(p3>9.5){ /* rock hard: the lock is what bursts it */
      var c=Math.max(0,Math.min(119,Math.floor(b3.startAt*2)));
      b.thick[c]*=0.55; checkPop(b,'lock');
      if(b.popped) return;
    }
    say("<b>Ear to ear, twist it here.</b> — Seated first try. That's the lock doing it, all of it: bubble one and bubble three pressed on each other with two folded between, friction and cross-pressure, no knot in it anywhere.");
  } else {
    b3.fold=0;
    if(p3<3.2) say("Too soft. A soft bubble has no normal force at the contact, so there's no friction, so there's no lock. Put more air in and try again.");
    else say("Didn't seat. Push them harder into each other — one and three have to actually press.");
  }
}

/* burping and warm-up and unwinding, per frame */
var lastFrame=performance.now();
function step(now){
  var dt=Math.min(0.05,(now-lastFrame)/1000); lastFrame=now;

  if(B&&!B.popped){
    /* cold balloon warms in the hand over ~30s */
    B.temp=Math.min(1,B.temp+dt/30);
    /* burping: real ongoing volume out through the neck */
    if(mode==='burp'&&mouse.down&&!B.tied&&B.air>0.2){
      var aperture=Math.max(0.02,Math.min(1,(Math.abs(mouse.y-nozzle.y))/40));
      var p=pressureOf(B.radius,wallAt(B,1),B.preStretch,B.temp);
      var out=aperture*p*3.4*dt;
      B.air=Math.max(0,B.air-out); settle(B);
      if(A.on&&A.bwG){
        A.bwG.gain.setTargetAtTime(0.055,A.ctx.currentTime,0.03);
        A.bwO.frequency.setTargetAtTime(500+ (1-aperture)*1700 + p*40, A.ctx.currentTime,0.05);
      }
    } else if(A.bwG&&A.on){ A.bwG.gain.setTargetAtTime(0,A.ctx.currentTime,0.06); }

    /* unlocked twist unwinds over ~2s when not held */
    if(unwinding){
      B.twistAngle-=dt*(Math.PI*2);
      if(B.twistAngle<=0){ B.twistAngle=0; B.twistAt=-1; unwinding=false; B.twistDir=0; }
    }
    /* mixed twist directions genuinely work loose over the next minute */
    if(B.mixed>0){
      for(var i=0;i<B.bubbles.length;i++){
        var bb=B.bubbles[i];
        if(bb.locked){
          bb.slip=(bb.slip||0)+dt*0.016*B.mixed;
          if(bb.slip>1){ bb.locked=false; bb.slip=0;
            say("There it goes. That's the opposing twists. It always comes apart about a minute later, always."); }
        }
      }
    }
    /* creak tracks live pressure so you can hear it getting dangerous */
    if(A.on&&A.crG){
      var pr=pressureOf(B.radius,wallAt(B,B.inflated*0.5),B.preStretch,B.temp);
      var danger=Math.max(0,(B.worst||0)/BURSTS);
      A.crG.gain.setTargetAtTime(Math.min(0.05,danger*0.06),A.ctx.currentTime,0.12);
      A.crO.frequency.setTargetAtTime(40+pr*11+danger*130,A.ctx.currentTime,0.15);
    }
    /* squeak tracks rubbing velocity, cut by talc */
    if(A.on&&A.sqG){
      var sq=(mode==='twist'||mode==='lock')? Math.min(1,rubVel*0.9):0;
      A.sqG.gain.setTargetAtTime(sq*0.055*(1-B.talc*0.6),A.ctx.currentTime,0.05);
      A.sqF.frequency.setTargetAtTime(1200+rubVel*2600,A.ctx.currentTime,0.05);
    }
    /* tie-off: dragging the nozzle down into a loop */
    if(!B.tied && mode===null && B.inflated>4 && B.tail>=2.6 && B.tail<=8 && autoTieHint<1){
      autoTieHint=1;
      say("Tail's in range. Three to five inches soft. Click the nozzle end twice to tie it — too little neck and the knot slips itself.");
    }
  } else if(A.on&&A.sqG){ A.sqG.gain.setTargetAtTime(0,A.ctx.currentTime,0.1); A.crG.gain.setTargetAtTime(0,A.ctx.currentTime,0.1); }

  render(now);
  requestAnimationFrame(step);
}
var autoTieHint=0;

/* double-click nozzle to tie */
var lastNozzleClick=0;
cv.addEventListener('click',function(e){
  var p=pos(e);
  if(!B||B.tied) return;
  if(p.x<nozzle.x+16 && Math.abs(p.y-nozzle.y)<26){
    var t=performance.now();
    if(t-lastNozzleClick<520){
      if(B.inflated<3){ say("Nothing to tie."); return; }
      if(B.tail<2.0){ say("Too full. That tail's under two inches — you will run out of somewhere to put the air on about the fourth twist and it'll go at a neck. Burp it down first."); return; }
      B.tied=true; knotClick();
      say("Tied. Tail's "+B.tail.toFixed(1)+" inches. Now every twist you make pushes air into what's left, and that soft piece at the end is the only room you have. Grab it anywhere and rotate.");
    }
    lastNozzleClick=t;
  }
});

/* drop the current balloon (costs it) — right-click / long press on the table */
cv.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(B&&!B.popped){
    flat=Math.max(0,flat-1); writeFlat(flat); B=null;
    say("Dropped it. That still counts. Thirty-four in a flat is not thirty-four animals, it's never thirty-four animals.");
  }
});

/* ---------- render ---------- */
var frame=0;
function render(now){
  layout(); updateNozzle();
  drawTable();
  drawPump();
  drawFlat();
  if(B) drawBalloon(B,now);
  else {
    ctx.fillStyle='rgba(60,52,36,.55)';
    ctx.font='12px "Trebuchet MS",sans-serif';
    ctx.fillText(flat>0? 'grab one out of the flat →' : 'flat is empty', nozzle.x-20, nozzle.y+4);
  }
  /* talc pile */
  ctx.fillStyle='rgba(250,250,246,.75)';
  ctx.beginPath(); ctx.arc(W*0.42,H*0.90,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(200,196,186,.6)';
  ctx.beginPath(); ctx.arc(W*0.42,H*0.90,13,0,Math.PI*2); ctx.stroke();

  /* HUD numbers */
  document.getElementById('left').textContent=flat;
  document.getElementById('inf').textContent=B?B.inflated.toFixed(1):'0.0';
  document.getElementById('tail').textContent=B?B.tail.toFixed(1):'0.0';
  document.getElementById('bub').textContent=B?B.bubbles.length:0;
  var mins=15+Math.floor((now-startTime)/60000);
  document.getElementById('clock').textContent=(mins<60?mins:'40+');
  frame++;
  if(frame%1500===0) marcus();
}
var startTime=performance.now();

/* talc toggle */
cv.addEventListener('dblclick',function(e){
  var p=pos(e);
  if(Math.hypot(p.x-W*0.42,p.y-H*0.90)<20 && B){
    B.talc=B.talc>0.5?0.15:0.85;
    say(B.talc>0.5
      ? "Talc on. That kills the squeak and it makes the twists easier — and it makes your locks worse, because a lock is friction and you just took friction away."
      : "Talc off. Louder, grabbier, better locks.");
  }
});

cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();move(e);},{passive:false});
window.addEventListener('touchend',function(e){
  /* touch double-tap on nozzle = tie */
  if(B&&!B.tied&&mode===null){}
  up(e);
});

/* touch tie helper: tap nozzle twice */
var tTap=0;
cv.addEventListener('touchend',function(e){
  var r=cv.getBoundingClientRect();
  var t=e.changedTouches&&e.changedTouches[0]; if(!t||!B||B.tied) return;
  var x=t.clientX-r.left, y=t.clientY-r.top;
  if(x<nozzle.x+18 && Math.abs(y-nozzle.y)<30){
    var nowt=performance.now();
    if(nowt-tTap<560){
      if(B.inflated>=3 && B.tail>=2.0){ B.tied=true; knotClick();
        say("Tied. Tail's "+B.tail.toFixed(1)+" inches."); }
      else if(B.tail<2.0) say("Too full to tie. Burp it down.");
    }
    tTap=nowt;
  }
});

resize(); layout(); updateNozzle();
say("Okay — I've got twenty-five minutes and thirty-four balloons, so watch the hands. A 260 is sixty inches long and two inches across full, and you never fill it. Marcus, the hands.");
say("Grab one out of the flat, bottom right. Then pre-stretch it — drag it out long, a few times.");
requestAnimationFrame(step);

/* console: the only place the arithmetic is written down */
if(window.console&&console.log){
  console.log('%cdog 6 · sword 4 · poodle = dog, small tail','color:#1f7a4d;font-weight:bold');
  console.log('tail 3–5 in. minimum. 11 twists needs more tail than 4. decide before you shape.');
  console.log('pump gasket leaking on the return. Aunt Val says she\'ll order one.');
  console.log('burst always at a neck. never mid-bubble. thin, not force.');
}
})();
</script>
