  <meta name="outbox-spec-subject" content="The flat mechanical business of pinning a hem on a bias-cut skirt for a second fitting — that bias cloth hangs at forty-five degrees to the grain and therefore stretches under its own weight for days after it is cut, which is why the dress was hung on a rail for a week before anybody touched the hem and why a bias hem pinned on the day of cutting is a hem that will be four centimetres crooked by the wedding; that you never measure a hem from the waist, you measure UP from the floor with a chalk marker on a stand and the wearer standing still and turning a quarter at a time, because the floor is the only reference that does not lie about a body; that the shoes matter more than anything the customer says, and a hem pinned in flat slippers is wrong by exactly the heel height and cannot be argued out of it; that a person standing for a fitting stands differently than a person standing anywhere else — she lifts, she holds her breath, she puts weight on one leg — so the fitter chalks, then talks about something else for a minute, then chalks again and takes the second figure; that seam allowance on a curved hem cannot simply be turned up, because the outer circumference of the turned edge is longer than the place it has to lie flat against, which is why a deep hem on a wide skirt has to be eased with a running thread and shrunk with steam, or faced with a separate bias strip cut on the same grain; that pins go in perpendicular to the fold and about every eight centimetres on straight runs and closer than that through the curve; that the mother in the room is a real variable and every fitter budgets time for her; and the flat arithmetic that this dress is due on the 6th, there are two more fittings booked behind it this afternoon, and the shop closes at five.">
  <meta name="outbox-spec-tone" content="The steady, practical, slightly amused voice of Wiesława Dudek-Ostrowska, fifty-one, who has the pins in her mouth and is therefore speaking in short bursts between them, kneeling at the hem, talking half to the girl on the stand and half to the girl's mother sitting behind her with an opinion. Warm and completely unbothered. She says the same measurement out loud twice every time. She is politely immovable about the shoes. She is genuinely pleased when the girl stops lifting her shoulders. She keeps a running count of pins left in the cushion. She mentions the rain twice, and the shoe-repair machine downstairs once. Never wry, never deadpan, never a craftsman-sage, never wistful, never a mother-and-daughter emotional arc.">

<script>
(function(){
"use strict";

/* ---------- the tree ---------- */
var UID = 0;
function W(t, sealed){ return {w:t, a:false, gen:-99, id:++UID, sealed:!!sealed}; }
function isW(n){ return n && typeof n.w === "string"; }

var BASE = "Turn to the window she wants the hem level with the light".split(" ");
var root = {kind:"main", ch: BASE.map(function(t){return W(t);})};
var PERIOD = W("."); PERIOD.period = true; PERIOD.gen = -99;
root.ch.push(PERIOD);

/* ---------- clause bank ---------- */
/* h = host node kinds this clause may legally attach inside
   k = node kind it creates (which governs what may nest inside it) */
var BANK = [
 {k:"clause",h:["main","clause"],t:"which is why it hung on the rail a week before anybody touched it"},
 {k:"clause",h:["main","clause"],t:"because bias cloth hangs at forty five degrees to the grain and goes on stretching under its own weight for days"},
 {k:"clause",h:["main","clause"],t:"since a bias hem pinned the day the skirt is cut comes back four centimetres crooked by the sixth"},
 {k:"clause",h:["main","clause"],t:"and I measure up from the floor and never down from the waist"},
 {k:"clause",h:["main","clause"],t:"which is thirty one centimetres up from the floor and I will say it again thirty one centimetres"},
 {k:"clause",h:["main","clause"],t:"because the floor is the only thing in this room that does not lie about a body"},
 {k:"clause",h:["main","clause"],t:"so turn a quarter and stop and I will chalk the next stretch"},
 {k:"clause",h:["main","clause"],t:"and the marker stands where it stands and you come round to it"},
 {k:"clause",h:["main","clause"],t:"which is why the shoes matter more than anything anybody in this room tells me"},
 {k:"clause",h:["main","clause"],t:"because a hem pinned in flat slippers is wrong by exactly the heel height and no arguing gets it back"},
 {k:"clause",h:["main","clause"],t:"and yours are seven centimetres so seven centimetres it is"},
 {k:"clause",h:["main","clause"],t:"since a person standing for a fitting stands like nobody standing anywhere else on earth"},
 {k:"clause",h:["main","clause"],t:"because you lift and you hold your breath and you put your weight on the left leg"},
 {k:"clause",h:["main","clause"],t:"so I chalk once and talk about something else for a minute and then chalk again and take the second figure"},
 {k:"clause",h:["main","clause"],t:"and the second figure is the one that goes in the book"},
 {k:"clause",h:["main","clause"],t:"which is why the outer edge of a turned hem is longer than the place it has to lie flat against"},
 {k:"clause",h:["main","clause"],t:"so a hem this deep on a skirt this wide gets eased with a running thread and shrunk with steam"},
 {k:"clause",h:["main","clause"],t:"or else faced with a separate bias strip cut on the same grain which is what I would do here"},
 {k:"clause",h:["main","clause"],t:"and the pins go in perpendicular to the fold",pin:true},
 {k:"clause",h:["main","clause"],t:"every eight centimetres on the straight runs and closer than that all through the curve",pin:true},
 {k:"clause",h:["main","clause"],t:"because the curve will not sit down flat if the pins are lazy through it",pin:true},
 {k:"clause",h:["main","clause"],t:"and this one is due on the sixth"},
 {k:"clause",h:["main","clause"],t:"with two more fittings booked in behind you this afternoon"},
 {k:"clause",h:["main","clause"],t:"and the shop shuts at five whatever anybody would like"},
 {k:"clause",h:["main","clause"],t:"which is the rain again on the third pane",max:1},
 {k:"clause",h:["main","clause"],t:"and there is that rain coming over the roofs from the west all afternoon",max:1},
 {k:"clause",h:["main","clause"],t:"while the finishing wheel goes downstairs at the shoe repair",max:1},
 {k:"clause",h:["main","clause"],t:"and your shoulders have come down which is very good keep them exactly there"},
 {k:"clause",h:["main","clause"],t:"so hold still one moment and breathe like a person and not like a statue"},
 {k:"clause",h:["main","clause"],t:"which gives me thirty one up from the floor twice running so that is the hem"},
 {k:"clause",h:["main","clause"],t:"because I would rather lose the minute now than unpick the whole round on the fourth"},
 {k:"clause",h:["main","clause"],t:"and nothing here is difficult it is only slow"},
 {k:"clause",h:["main","clause"],t:"and the back drops longer than the front on the bias every single time"},

 {k:"aside",h:["main","clause","speech"],t:"the good chalk not the yellow one"},
 {k:"aside",h:["main","clause","speech"],t:"eight centimetres and eight centimetres again",pin:true},
 {k:"aside",h:["main","clause","speech"],t:"steam and a running thread and nothing clever"},
 {k:"aside",h:["main","clause","speech"],t:"the left leg again"},
 {k:"aside",h:["main","clause","speech"],t:"seven centimetres of heel"},
 {k:"aside",h:["main","clause","speech"],t:"quarter turn and stop"},
 {k:"aside",h:["main","clause","speech"],t:"a second fitting is a short fitting when nobody moves"},
 {k:"aside",h:["main","clause","speech"],t:"thirty one and thirty one"},

 {k:"speech",h:["main"],t:"and your mother says it looks long from where she is sitting"},
 {k:"speech",h:["main"],t:"and mother would like it a finger shorter which we will look at once it is levelled"},
 {k:"speech",h:["main"],t:"and mother says she can see the pins from over there which she can",pin:true},
 {k:"speech",h:["main"],t:"and mother wants to know whether it can be ready by Friday which it can"},
 {k:"speech",h:["main"],t:"and your mother says the other girl had hers done in flat shoes which I am sure she did"},
 {k:"speech",h:["main"],t:"and mother says shorter at the back and mother is not wrong about the back"},

 {k:"aside",h:["speech","clause"],t:"and I will show her the floor measure in a minute"},
 {k:"aside",h:["speech","clause"],t:"which is fair enough"},
 {k:"aside",h:["speech","clause"],t:"and she is right that it drops there"}
];
var uses = BANK.map(function(){return 0;});

var pinsLeft = 34;
function dynamicPin(){
  pinsLeft -= 1 + Math.floor(Math.random()*3);
  if(pinsLeft < 4) pinsLeft = 4 + Math.floor(Math.random()*6);
  return {k:"clause",h:["main","clause"],pin:true,
    t:"and there are " + numword(pinsLeft) + " pins left in the cushion"};
}
function numword(n){
  var a=["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  var t=["","","twenty","thirty","forty"];
  if(n<20) return a[n];
  var d=Math.floor(n/10), r=n%10;
  return t[d] + (r? " "+a[r] : "");
}

var WILD = "— and the third window has been painted shut since Kubica had the shop —";
var wildDone = false, wildAt = 6 + Math.floor(Math.random()*8);

/* ---------- anchors, persisted ---------- */
var LS = "wdo.anchors.v1";
var persisted = {};
try{
  var raw = localStorage.getItem(LS);
  if(raw){ JSON.parse(raw).forEach(function(w){ persisted[w]=1; }); }
}catch(e){}
function remember(word){
  persisted[word.toLowerCase()] = 1;
  try{ localStorage.setItem(LS, JSON.stringify(Object.keys(persisted))); }catch(e){}
}
root.ch.forEach(function(n){
  if(isW(n) && !n.period && persisted[n.w.toLowerCase()]) n.a = true;
});

/* ---------- flatten / render ---------- */
var el = document.getElementById("line");
var wrap = document.getElementById("wrap");
var gen = 0, focusId = null;

function flatten(node, out){
  for(var i=0;i<node.ch.length;i++){
    var c = node.ch[i];
    if(isW(c)) out.push(c); else flatten(c, out);
  }
  return out;
}
function edgeWord(c, right){
  if(isW(c)) return c;
  var f = flatten(c, []);
  return right ? f[f.length-1] : f[0];
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(fresh){
  var flat = flatten(root, []);
  var html = flat.map(function(w){
    var cls = "w";
    if(w.period) cls += " pd";
    else if(w.sealed) cls += " sl";
    else if(w.a) cls += " an";
    else if(w.gen === gen) cls += " g0";
    else if(w.gen === gen-1) cls += " g1";
    if(w.id === focusId) cls += " fo";
    if(fresh && w.gen === gen) cls += " nu";
    return '<span class="'+cls+'" data-i="'+w.id+'">'+esc(w.w)+'</span>';
  }).join(" ");
  el.innerHTML = html;
  return flat;
}

/* ---------- fit ---------- */
var LH = 1.22, curFs = null, curLh = null;
function fit(animate){
  el.classList.add("nofx");
  var pfs = curFs, plh = curLh;
  var availH = wrap.clientHeight, availW = wrap.clientWidth;
  var lo = 3.5, hi = Math.max(8, Math.min(190, availH/2.35));
  el.style.lineHeight = LH;
  for(var i=0;i<20;i++){
    var mid = (lo+hi)/2;
    el.style.fontSize = mid + "px";
    if(el.scrollHeight <= availH + 0.5 && el.scrollWidth <= availW + 0.5) lo = mid; else hi = mid;
  }
  var fs = lo;
  el.style.fontSize = fs + "px";
  var lines = Math.max(1, Math.round(el.scrollHeight / (fs*LH)));
  var lh = Math.floor((availH / lines) * 100) / 100;
  el.style.lineHeight = lh + "px";
  if(el.scrollHeight > availH + 0.5){
    lh = Math.floor(((availH - 1) / lines) * 100) / 100;
    el.style.lineHeight = lh + "px";
  }
  if(animate && pfs !== null){
    el.style.fontSize = pfs + "px";
    el.style.lineHeight = plh + "px";
    void el.offsetWidth;
    el.classList.remove("nofx");
    el.style.fontSize = fs + "px";
    el.style.lineHeight = lh + "px";
  }
  curFs = fs; curLh = lh;
  return fs;
}

/* ---------- gaps ---------- */
function gaps(){
  var flat = flatten(root, []);
  var pos = {};
  flat.forEach(function(w,i){ pos[w.id] = i; });
  var out = [];
  (function walk(node){
    if(node.kind !== "sealed"){
      var n = node.ch.length;
      var last = (node === root) ? n-2 : n-1;
      for(var i=1;i<=last;i++){
        var L = edgeWord(node.ch[i-1], true), R = edgeWord(node.ch[i], false);
        if(!L || !R) continue;
        if(L.a || R.a) continue;
        out.push({node:node, i:i, kind:node.kind, pos:pos[L.id]});
      }
    }
    for(var j=0;j<node.ch.length;j++){
      if(!isW(node.ch[j])) walk(node.ch[j]);
    }
  })(root);
  return {list:out, total:flat.length, pos:pos};
}

function chooseGap(g){
  var fp = (focusId !== null && g.pos[focusId] !== undefined) ? g.pos[focusId] : null;
  var weights = g.list.map(function(x){
    if(fp === null) return 1;
    var d = Math.abs(x.pos - fp) / 3;
    return 1/(1 + Math.pow(d, 1.6)) * 6 + 0.06;
  });
  var sum = weights.reduce(function(a,b){return a+b;},0);
  var r = Math.random()*sum;
  for(var i=0;i<weights.length;i++){ r -= weights[i]; if(r<=0) return g.list[i]; }
  return g.list[g.list.length-1];
}

function chooseClause(hostKind){
  if(Math.random() < 0.11) {
    var d = dynamicPin();
    if(d.h.indexOf(hostKind) >= 0) return d;
  }
  var idx = [];
  for(var i=0;i<BANK.length;i++){
    var c = BANK[i];
    if(c.h.indexOf(hostKind) < 0) continue;
    if(c.max && uses[i] >= c.max) continue;
    idx.push(i);
  }
  if(!idx.length) return null;
  var min = Math.min.apply(null, idx.map(function(i){return uses[i];}));
  var pool = idx.filter(function(i){ return uses[i] <= min; });
  var pick = pool[Math.floor(Math.random()*pool.length)];
  uses[pick]++;
  return BANK[pick];
}

/* ---------- insertion ---------- */
var insertions = 0, stopped = false;

function makeNode(text, kind, sealed){
  return {kind:kind, ch: text.split(" ").map(function(t){
    var w = W(t, sealed);
    w.gen = gen;
    if(!sealed && t.length > 4 && persisted[t.toLowerCase()]) w.a = true;
    return w;
  })};
}

function insertOnce(){
  var g = gaps();
  if(!g.list.length){ stopped = true; return false; }
  if(curFs !== null && curFs <= 4.2){ stopped = true; return false; }

  var spot = null, clause = null;
  if(!wildDone && insertions >= wildAt){
    var mainGaps = g.list.filter(function(x){ return true; });
    if(mainGaps.length){
      spot = chooseGap({list:mainGaps, pos:g.pos});
      clause = {t:WILD, sealed:true, k:"sealed"};
      wildDone = true;
    }
  }
  if(!clause){
    var tries = 0;
    while(tries++ < 14){
      var s = chooseGap(g);
      var c = chooseClause(s.kind);
      if(c){ spot = s; clause = c; break; }
    }
  }
  if(!clause){ stopped = true; return false; }

  gen++;
  var node = makeNode(clause.t, clause.k, !!clause.sealed);
  spot.node.ch.splice(spot.i, 0, node);
  insertions++;

  render(true);
  fit(true);

  whoosh(clause.t.length);
  if(clause.pin) tick();
  return true;
}

/* ---------- interaction ---------- */
var holdTimer = null, held = false, downId = null;

el.addEventListener("pointerdown", function(ev){
  var t = ev.target.closest ? ev.target.closest(".w") : null;
  if(!t) return;
  startAudio();
  var id = parseInt(t.getAttribute("data-i"),10);
  downId = id; held = false;
  var w = findWord(id);
  if(!w) return;
  holdTimer = setTimeout(function(){
    held = true;
    if(w.period || w.sealed){ thud(); return; }
    if(!w.a){
      w.a = true;
      remember(w.w);
      pinDown();
      render(false);
      fit(true);
    }
  }, 470);
}, {passive:true});

function endPress(ev){
  clearTimeout(holdTimer);
  if(downId === null) return;
  if(!held){
    var w = findWord(downId);
    if(w && !w.period){
      focusId = downId;
      render(false);
      cloth();
    }
  }
  downId = null;
}
el.addEventListener("pointerup", endPress);
el.addEventListener("pointercancel", function(){ clearTimeout(holdTimer); downId=null; });
el.addEventListener("contextmenu", function(e){ e.preventDefault(); });

function findWord(id){
  var f = flatten(root, []);
  for(var i=0;i<f.length;i++) if(f[i].id === id) return f[i];
  return null;
}

/* ---------- clock ---------- */
function nextDelay(){
  var f = flatten(root, []);
  var anchored = f.filter(function(w){return w.a;}).length;
  var ratio = anchored / Math.max(1, f.length);
  var g = gaps().list.length;
  var d = 2300 + ratio * 9000;
  if(g < 8) d *= 1.7;
  if(g < 4) d *= 2.1;
  return Math.min(14000, d + Math.random()*900);
}
function loop(){
  if(stopped) return;
  var ok = insertOnce();
  if(!ok) return;
  setTimeout(loop, nextDelay());
}

/* ---------- audio ---------- */
var AC = null, noiseBuf = null, master = null, started = false;
function startAudio(){
  if(started) return;
  started = true;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){ AC = null; return; }
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);

  var len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2 - 1;

  // rain bed
  var src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  var lp = AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=760; lp.Q.value=.5;
  var g1 = AC.createGain(); g1.gain.value = 0.045;
  src.connect(lp); lp.connect(g1); g1.connect(master);

  var src2 = AC.createBufferSource(); src2.buffer = noiseBuf; src2.loop = true;
  var bp = AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2300; bp.Q.value=.8;
  var g2 = AC.createGain(); g2.gain.value = 0.012;
  src2.connect(bp); bp.connect(g2); g2.connect(master);
  src.start(); src2.start();

  (function drift(){
    if(!AC) return;
    var t = AC.currentTime;
    g1.gain.linearRampToValueAtTime(0.030 + Math.random()*0.028, t + 5);
    g2.gain.linearRampToValueAtTime(0.006 + Math.random()*0.014, t + 5);
    setTimeout(drift, 5000);
  })();

  scheduleWheel();
}
function scheduleWheel(){
  setTimeout(function(){
    wheel();
    scheduleWheel();
  }, 16000 + Math.random()*34000);
}
function wheel(){
  if(!AC) return;
  var t = AC.currentTime;
  var osc = AC.createOscillator(); osc.type="sawtooth"; osc.frequency.value = 104 + Math.random()*14;
  var n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  var f = AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=420; f.Q.value=2.4;
  var g = AC.createGain(); g.gain.value = 0.0001;
  osc.connect(f); n.connect(f); f.connect(g); g.connect(master);
  var dur = 3 + Math.random()*6;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.021, t + 0.9);
  g.gain.setValueAtTime(0.021, t + dur - 0.9);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.frequency.setValueAtTime(96, t);
  osc.frequency.linearRampToValueAtTime(118, t + 0.9);
  osc.frequency.linearRampToValueAtTime(90, t + dur);
  osc.start(t); n.start(t);
  osc.stop(t + dur + .1); n.stop(t + dur + .1);
}
function whoosh(chars){
  if(!AC) return;
  var t = AC.currentTime;
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type="bandpass";
  f.frequency.value = Math.max(280, 1150 - Math.min(760, chars*7));
  f.Q.value = 0.75;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.055, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
  f.frequency.linearRampToValueAtTime(f.frequency.value*0.55, t+0.46);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.5);
}
function tick(){
  if(!AC) return;
  var t = AC.currentTime + 0.14;
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.05);
}
function pinDown(){
  if(!AC) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(1800,t);
  o.frequency.exponentialRampToValueAtTime(620, t+0.07);
  var g = AC.createGain(); g.gain.setValueAtTime(0.035,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.1);
  tick();
}
function cloth(){
  if(!AC) return;
  var t = AC.currentTime;
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1500; f.Q.value=1.1;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.017, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.19);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+0.2);
}
function thud(){
  if(!AC) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(); o.type="sine"; o.frequency.value = 128;
  var g = AC.createGain(); g.gain.setValueAtTime(0.03,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.18);
}
