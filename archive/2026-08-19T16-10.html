  <meta name="outbox-spec-era" content="1953, right now — half past two on a cold bright February afternoon in the unheated cooling shed at the back of a stove-tile works in Sønderborg, southern Jutland, where a rack of nine freshly drawn glazed tiles has just come off the kiln truck at something over seven hundred degrees and is standing down to room temperature on iron bearers, and is crazing audibly the whole time it does it. The shed doors are open onto the yard because they always are. Nobody is standing over the rack; the tiles are simply cooling.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is the top of the cooling rack seen from directly overhead and life-size: nine square glazed stove tiles laid out three by three on flat iron bearers, dark shed floor showing in the gaps, and nothing else in frame — no header, no caption, no counter, no title, no instructions, nothing readable anywhere. Every tile is a genuine cooling body: its rendered colour is computed from its actual live temperature through the real black-body sequence (bright straw-orange, dull cherry, dark plum, gone), and as each one drops through the glaze's set point the glaze goes into tension against the body and CRAZES — a real crack network opening across its face in bursts, hairline by hairline, in front of you. The visitor's entire vocabulary is cold air and a pair of tongs: move the cursor slowly over a tile and you are a draught, chilling that patch and pulling the crack front toward you; press and hold to blow harder and split a domain right across; grab a tile with the cursor and drag it bodily forward off the bearers onto the cold floor, where it cools four times as fast and crazes into a much finer, meaner net than its neighbours. Tiles slid back onto the hot bearers slow down again. Nothing scrolls, nothing is a menu, nothing is ever explained; the rack simply goes cold over about six minutes and the crack networks stop growing and stay exactly as they finished, forever, and the piece keeps sitting there afterwards.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of why a glaze crazes and why the crack pattern looks the way it does — that crazing is not damage and not a defect of firing but a straightforward mismatch of thermal expansion, the glaze shrinking more than the clay body it is stuck to as both come down in temperature, so the glaze ends up in tension and relieves that tension the only way a thin brittle skin can, which is by splitting; that nothing happens at all above the glaze's set point because the glaze is still soft enough to flow and simply accommodates the shrinkage, so the entire event begins at one temperature and never before it; that the first cracks are the longest and the loudest, running clean across the whole face because at that moment the tension field is uniform and there is nothing to stop them; that every subsequent crack is shorter than the one before, because a crack relieves stress in a band either side of itself, so the tile is progressively divided into domains that each have to reach the threshold on their own; that this is why the pattern is hierarchical rather than random, and why the final net looks like a map of countries rather than shattered glass; that a running crack turns and meets an existing crack at very close to ninety degrees, every time, because it is following the direction of maximum tension and an existing crack is a free surface that can carry no stress across it, so T-junctions dominate and X-crossings essentially never occur; that crack spacing settles at roughly the same multiple of glaze thickness across the whole tile, so a thick glaze crazes coarse and a thin one crazes fine, and you can read glaze thickness off the pattern from six feet away; that cooling rate sets the size of everything, because a tile taken out into a cold draught builds tension faster than it can relieve it and answers with a dense fine net, while the same tile left on hot bearers gives a wide open one; that each crack releases elastic energy as an actual audible ping whose pitch depends on the size of the piece of glaze doing the ringing, so the pings climb steadily higher all afternoon as the domains get smaller; and the flat arithmetic that the pinging goes on for hours after the tile is cool enough to hold, tapering off on a long tail, and that a tile put in a damp cellar for a fortnight will craze a little more.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the heat and the cracks, and that register is HARD, DRY, TICKING and BUSY — cracks arriving in bursts of four and five at a time with real audible pings, whole faces going across in one stroke, the incandescence visibly falling minute by minute, cold air off the open yard doors working the near edge of the rack faster than the far edge, everything happening at the speed it actually happens at. Cold bright flat afternoon light, no atmosphere, no shimmer beyond honest heat distortion over the hottest tiles. Explicitly NOT hushed, NOT meditative, NOT reverent, NOT fragile-and-precious, NOT slow, NOT soft-focus, NOT melancholy, NOT ASMR — this is a rack of stock cooling in a cold shed in the middle of a working afternoon and the noise it makes is the noise of a job going normally.">
  <meta name="outbox-spec-length" content="large">
  <meta name="outbox-spec-palette" content="Two anchors and nothing else. Cooled tin-glaze white (#e9e2ce) — a flat opaque off-white with the faintest green cast in the thick pools at the tile edges — and kiln incandescence, which is not a chosen colour but a COMPUTED one: rendered per-tile from real temperature through the actual black-body sequence, running bright straw-orange (#ffb43a) at 740°C down through hot cherry (#d8451a), dull cherry (#8e2410), deep plum-ember (#4a1208) and out into nothing at about 480°C, at which point the glaze white takes over and the tile just sits there being a tile. Craze lines render as a genuine hairline of refracted shadow (#6d7a84) with a very slightly brighter lip on the lit side, drawn a single pixel wide regardless of zoom. Iron bearers are dull scaled grey (#5c5852), the shed floor a dark oiled brick-brown (#2a221e). Flat, hard, high-contrast, no glow, no bloom, no halation, no lens flare, no gradients except the honest thermal field across each tile and the honest heat distortion in the air directly above the hottest ones.">
  <meta name="outbox-spec-wildcard" content="One tile — second row, far left — is a different glaze: a dry matte brown that never crazes at all. It heats and cools and colours through the incandescence exactly like the other eight, it can be dragged onto the cold floor and back, the draught chills it honestly, and it produces not one single crack and not one single ping for the entire life of the page, no matter what is done to it. It is never marked, never labelled, never explained, and it is in the same position in the rack every visit.">
  <meta name="outbox-spec-forbidden" content="NO cracks-as-metaphor for damage, healing, brokenness, fault lines, what-holds-us-together, the-beauty-of-imperfection, or anything else — it is expansion mismatch, a set point, and ninety-degree T-junctions, and it has nothing to teach anybody. ABSOLUTELY NO kintsugi, NO wabi-sabi, NO 'the flaw is the point', NO Japanese-aesthetics reference of any kind, NO craft mysticism, NO potter-as-sage, NO fire-and-earth-and-transformation register. NO hushed, meditative, hypnotic, reverent or 'let it still you' register, and NO ambient-visualiser, screensaver, generative-art-gallery or ASMR framing. NO fragility lyricism, NO 'it is already breaking as you watch', NO ephemerality, NO memento mori. NO nostalgia, NO wistfulness, NO 'the tile works all closed / nobody builds stove tiles anymore / a vanished Danish industry' decline narrative — this is a rack of stock cooling and there is another kiln draw at five. NO Scandinavian-melancholy, NO hygge, NO winter-light-of-the-north lyricism, NO Nordic minimalism as an aesthetic pose. NO sensuous material writing about glaze, clay or heat beyond temperature, thickness, expansion coefficient and spacing. NO cryptic-SCP, liminal-space, uncanny, analog-horror or ominous dread about the matte tile or about the pinging that never stops — nothing is wrong. NO archival / museum / cabinet / drawer / specimen / relic framing of the tiles — they are stock going out on a lorry. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is half past two on a bright cold afternoon with the doors open. NO signal / transmission / frequency framing of the pings, despite them having pitch. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the tiles, the bearers, the floor and the air, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<script>
(function(){
"use strict";

/* ---------- constants: glaze, body, air ---------- */
const TSTART = 742;      // °C off the kiln truck
const TSET   = 625;      // glaze set point. nothing cracks above this. nothing.
const TAMB   = 4;        // February, doors open on the yard
const A_COOL = 0.0045, B_COOL = 0.0045;
const HREF   = 2.6;
const NG     = 26;       // thermal / stress grid per tile
const NC     = NG*NG;
const MM     = 72;       // crack raster per tile
const SBASE  = 12.0;     // full residual tension at room temperature
const SPROP  = 0.62;     // propagation threshold
const STEP   = 0.022;    // tip advance, tile units
const W0     = 0.90;     // relief depth of one crack
const SIMDT  = 1/30;

const THICK = [0.85,0.45,0.70, 0.00,0.95,0.35, 0.55,0.75,0.50]; // glaze thickness, relative
const MATTE = 3;         // second row, far left. dry matte brown. does not craze.

/* ---------- black body look-up, Planck at three wavelengths ---------- */
const BB = new Uint8Array(3*801);
(function buildBB(){
  const c2 = 1.4388e-2;
  const lam = [650e-9, 550e-9, 460e-9];
  const gain = [1.0, 10.6, 57.8];      // channel gains to the shed's own eye
  for(let Tc=0; Tc<=800; Tc++){
    const K = Tc + 273.15;
    let v = [0,0,0], mx = 0;
    for(let k=0;k<3;k++){
      const l = lam[k];
      const e = Math.exp(-c2/(l*K));
      const r = e / Math.pow(l,5);
      v[k] = r * gain[k];
    }
    mx = Math.max(v[0],v[1],v[2]) || 1;
    // luminance falls off as the fourth-ish power; out by 480
    const L = Math.min(1, Math.pow(Math.max(K,1)/1015, 4.5));
    for(let k=0;k<3;k++){
      let s = Math.pow(Math.min(1, v[k]/mx), 1/2.2) * L;
      BB[Tc*3+k] = Math.max(0, Math.min(255, Math.round(s*255)));
    }
  }
})();

/* ---------- canvas ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
let bg = document.createElement('canvas'), bgx = bg.getContext('2d');
let rackX=0, rackY=0, rackS=0, tileW=0, gapW=0, bars=[];

/* ---------- per-cell loss coefficients ---------- */
const hBear = new Float32Array(NC), hFloor = new Float32Array(NC);
for(let j=0;j<NG;j++) for(let i=0;i<NG;i++){
  const c=j*NG+i, u=(i+0.5)/NG, v=(j+0.5)/NG;
  const de = Math.min(u,1-u,v,1-v);
  const edge = 1.1*Math.exp(-de/0.06);
  const bear = Math.exp(-Math.pow((v-0.22)/0.075,2)) + Math.exp(-Math.pow((v-0.78)/0.075,2));
  hBear[c]  = 1.0 + edge + 2.6*bear;
  hFloor[c] = 1.0 + edge*0.7 + 6.5;
}

/* ---------- tiles ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function Tile(idx){
  this.idx = idx;
  this.col = idx%3; this.row = (idx/3)|0;
  this.matte = (idx===MATTE);
  this.thick = THICK[idx];
  this.band  = 0.035 + 0.075*this.thick;
  this.rnd   = mulberry(0x51ab00 + idx*7919);
  this.T  = new Float32Array(NC);
  this.Tn = new Float32Array(NC);
  this.R  = new Float32Array(NC*3);
  this.F  = new Float32Array(NC);
  this.mask = new Uint8Array(MM*MM);
  this.cracks = [];
  this.tips = [];
  this.pend = [];
  this.meanT = TSTART;
  this.onBearers = true;
  this.x=0; this.y=0; this.w=0;
  this.small = document.createElement('canvas'); this.small.width=NG; this.small.height=NG;
  this.sx = this.small.getContext('2d');
  this.img = this.sx.createImageData(NG,NG);
  this.cache = document.createElement('canvas'); this.cx = this.cache.getContext('2d');
  const r = this.rnd;
  const T0 = TSTART - 9*r();
  for(let j=0;j<NG;j++) for(let i=0;i<NG;i++){
    const c=j*NG+i, u=(i+0.5)/NG, v=(j+0.5)/NG;
    const de = Math.min(u,1-u,v,1-v);
    this.T[c] = T0 - 26*Math.exp(-de/0.08) - 4*r();
    this.F[c] = 0.58 + 1.25*Math.pow(r(),1.7);
    this.noise = this.noise;
  }
  // free surfaces: the four edges carry no stress across themselves
  const b=this.band;
  for(let j=0;j<NG;j++) for(let i=0;i<NG;i++){
    const c=j*NG+i, u=(i+0.5)/NG, v=(j+0.5)/NG;
    const ed=[[u,1,0],[1-u,1,0],[v,0,1],[1-v,0,1]];
    for(let k=0;k<4;k++){
      const w = W0*Math.exp(-Math.pow(ed[k][0]/b,2));
      if(w>0.01){ const nx=ed[k][1], ny=ed[k][2];
        this.R[3*c]+=w*nx*nx; this.R[3*c+1]+=w*ny*ny; this.R[3*c+2]+=w*nx*ny; }
    }
    this.R[3*c]   += (r()-0.5)*0.05;
    this.R[3*c+1] += (r()-0.5)*0.05;
    this.R[3*c+2] += (r()-0.5)*0.035;
  }
  this.tex = new Float32Array(NC);
  for(let c=0;c<NC;c++) this.tex[c] = (r()-0.5);
}
const tiles = []; for(let i=0;i<9;i++) tiles.push(new Tile(i));

/* ---------- geometry ---------- */
function layout(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  rackS = Math.min(W*0.80, H*0.68);
  gapW  = rackS*0.030;
  tileW = (rackS - 2*gapW)/3;
  rackX = (W-rackS)/2;
  rackY = (H-rackS)/2 - H*0.055;
  bars = [];
  for(let r=0;r<3;r++){
    const ty = rackY + r*(tileW+gapW);
    for(const f of [0.22,0.78]){
      bars.push({x:rackX-rackS*0.055, y:ty+tileW*f-tileW*0.035,
                 w:rackS+rackS*0.11, h:tileW*0.07});
    }
  }
  for(const t of tiles){
    const oldw = t.w;
    t.w = tileW;
    if(t.onBearers || oldw===0){
      t.x = rackX + t.col*(tileW+gapW);
      t.y = rackY + t.row*(tileW+gapW);
    } else {
      t.x = Math.max(4, Math.min(W-tileW-4, t.x));
      t.y = Math.max(4, Math.min(H-tileW-4, t.y));
    }
    const px = Math.max(8, Math.round(tileW*DPR));
    t.cache.width = px; t.cache.height = px;
    t.cx.setTransform(1,0,0,1,0,0);
    t.cx.clearRect(0,0,px,px);
    for(const cr of t.cracks) drawCrackToCache(t, cr.pts);
  }
  paintBackground();
}

function paintBackground(){
  bg.width = cv.width; bg.height = cv.height;
  bgx.setTransform(DPR,0,0,DPR,0,0);
  bgx.fillStyle = '#2a221e'; bgx.fillRect(0,0,W,H);
  const r = mulberry(4471);
  for(let i=0;i<2600;i++){
    const x=r()*W, y=r()*H, s=0.6+r()*2.4;
    const k = r();
    bgx.fillStyle = k<0.5 ? 'rgba(18,13,10,0.5)' : (k<0.85?'rgba(58,45,36,0.4)':'rgba(74,58,44,0.25)');
    bgx.fillRect(x,y,s,s*(0.6+r()*1.2));
  }
  for(let i=0;i<40;i++){ // swept brick joints
    const y = r()*H;
    bgx.fillStyle='rgba(14,10,8,0.18)'; bgx.fillRect(0,y,W,0.8+r()*1.4);
  }
  for(const b of bars){
    bgx.fillStyle = '#5c5852'; bgx.fillRect(b.x,b.y,b.w,b.h);
    bgx.fillStyle = 'rgba(122,116,106,0.55)'; bgx.fillRect(b.x,b.y,b.w,0.9);
    bgx.fillStyle = 'rgba(16,12,10,0.85)'; bgx.fillRect(b.x,b.y+b.h-0.9,b.w,1.4);
    for(let i=0;i<b.w*0.9;i++){
      const x=b.x+r()*b.w, y=b.y+r()*b.h;
      bgx.fillStyle = r()<0.6?'rgba(30,26,22,0.5)':'rgba(140,132,120,0.22)';
      bgx.fillRect(x,y,0.9+r()*1.6,0.9);
    }
  }
}

/* ---------- stress algebra ---------- */
function principal(rxx,ryy,rxy){
  const mxx=1-rxx, myy=1-ryy, mxy=-rxy;
  const tr=(mxx+myy)*0.5, dd=(mxx-myy)*0.5;
  const rad=Math.sqrt(dd*dd+mxy*mxy);
  let l1=tr+rad;
  let vx,vy;
  if(Math.abs(mxy)>1e-7){ vx=mxy; vy=l1-mxx; }
  else if(mxx>=myy){ vx=1; vy=0; } else { vx=0; vy=1; }
  const n=Math.hypot(vx,vy)||1;
  if(l1<0.06) l1=0.06; if(l1>1) l1=1;
  return [l1, vx/n, vy/n];
}
function sampleR(t,u,v){
  const fx=Math.max(0,Math.min(NG-1.001,u*NG-0.5)), fy=Math.max(0,Math.min(NG-1.001,v*NG-0.5));
  const i0=fx|0, j0=fy|0, ax=fx-i0, ay=fy-j0;
  const g=(i,j,k)=>t.R[3*(Math.min(NG-1,j)*NG+Math.min(NG-1,i))+k];
  const out=[0,0,0];
  for(let k=0;k<3;k++){
    out[k] = g(i0,j0,k)*(1-ax)*(1-ay)+g(i0+1,j0,k)*ax*(1-ay)+g(i0,j0+1,k)*(1-ax)*ay+g(i0+1,j0+1,k)*ax*ay;
  }
  return out;
}
function sigmaAt(t,u,v){
  const i=Math.max(0,Math.min(NG-1,(u*NG)|0)), j=Math.max(0,Math.min(NG-1,(v*NG)|0));
  const T=t.T[j*NG+i];
  return T>=TSET ? 0 : SBASE*(TSET-T)/(TSET-TAMB);
}

/* ---------- relief stamping ---------- */
function stampRelief(t, pts){
  const b=t.band, b2=b*b;
  let x0=1,y0=1,x1=0,y1=0;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const ci0=Math.max(0,Math.floor((x0-2.2*b)*NG)), ci1=Math.min(NG-1,Math.ceil((x1+2.2*b)*NG));
  const cj0=Math.max(0,Math.floor((y0-2.2*b)*NG)), cj1=Math.min(NG-1,Math.ceil((y1+2.2*b)*NG));
  for(let j=cj0;j<=cj1;j++) for(let i=ci0;i<=ci1;i++){
    const u=(i+0.5)/NG, v=(j+0.5)/NG;
    let best=1e9, bnx=0, bny=0;
    for(let s=0;s<pts.length-1;s++){
      const px=pts[s][0], py=pts[s][1];
      let dx=pts[s+1][0]-px, dy=pts[s+1][1]-py;
      const L2=dx*dx+dy*dy; if(L2<1e-12) continue;
      let tt=((u-px)*dx+(v-py)*dy)/L2; tt=tt<0?0:(tt>1?1:tt);
      const qx=px+dx*tt-u, qy=py+dy*tt-v;
      const d2=qx*qx+qy*qy;
      if(d2<best){ best=d2; const L=Math.sqrt(L2); bnx=-dy/L; bny=dx/L; }
    }
    if(best>9*b2) continue;
    const w=W0*Math.exp(-best/b2);
    if(w<0.012) continue;
    const c=3*(j*NG+i);
    t.R[c]  =Math.min(1.06,t.R[c]  +w*bnx*bnx);
    t.R[c+1]=Math.min(1.06,t.R[c+1]+w*bny*bny);
    t.R[c+2]=Math.max(-1.06,Math.min(1.06,t.R[c+2]+w*bnx*bny));
  }
}

/* ---------- crack raster + domain area ---------- */
function rasterize(t, pts){
  for(let s=0;s<pts.length-1;s++){
    const x0=pts[s][0]*MM, y0=pts[s][1]*MM, x1=pts[s+1][0]*MM, y1=pts[s+1][1]*MM;
    const n=Math.max(2,Math.ceil(Math.hypot(x1-x0,y1-y0)*2));
    for(let k=0;k<=n;k++){
      const i=Math.round(x0+(x1-x0)*k/n), j=Math.round(y0+(y1-y0)*k/n);
      if(i>=0&&i<MM&&j>=0&&j<MM) t.mask[j*MM+i]=1;
    }
  }
}
const visit = new Uint8Array(MM*MM), stack = new Int32Array(MM*MM);
function flood(t, si, sj){
  if(si<0||si>=MM||sj<0||sj>=MM) return 0;
  if(t.mask[sj*MM+si]) return 0;
  visit.fill(0);
  let sp=0, n=0;
  stack[sp++]=sj*MM+si; visit[sj*MM+si]=1;
  while(sp>0 && n<MM*MM){
    const c=stack[--sp]; n++;
    const i=c%MM, j=(c/MM)|0;
    if(i>0){const q=c-1; if(!visit[q]&&!t.mask[q]){visit[q]=1;stack[sp++]=q;}}
    if(i<MM-1){const q=c+1; if(!visit[q]&&!t.mask[q]){visit[q]=1;stack[sp++]=q;}}
    if(j>0){const q=c-MM; if(!visit[q]&&!t.mask[q]){visit[q]=1;stack[sp++]=q;}}
    if(j<MM-1){const q=c+MM; if(!visit[q]&&!t.mask[q]){visit[q]=1;stack[sp++]=q;}}
  }
  return n;
}
function domainFrac(t, pts){
  const m=pts[(pts.length/2)|0], m2=pts[Math.min(pts.length-1,((pts.length/2)|0)+1)];
  let dx=m2[0]-m[0], dy=m2[1]-m[1];
  const L=Math.hypot(dx,dy)||1; const nx=-dy/L, ny=dx/L;
  const off=3.2/MM;
  const a=flood(t, Math.round((m[0]+nx*off)*MM), Math.round((m[1]+ny*off)*MM));
  const b=flood(t, Math.round((m[0]-nx*off)*MM), Math.round((m[1]-ny*off)*MM));
  const s=Math.min(a||b, b||a) || Math.max(a,b);
  return Math.max(0.0008, s/(MM*MM));
}

/* ---------- crack drawing ---------- */
function drawCrackToCache(t, pts){
  const x = t.cx, S = t.cache.width;
  x.lineCap='round'; x.lineJoin='round';
  x.lineWidth = 1;
  x.beginPath();
  x.moveTo(pts[0][0]*S-0.9, pts[0][1]*S-0.9);
  for(let i=1;i<pts.length;i++) x.lineTo(pts[i][0]*S-0.9, pts[i][1]*S-0.9);
  x.strokeStyle='rgba(247,242,226,0.34)'; x.stroke();
  x.beginPath();
  x.moveTo(pts[0][0]*S, pts[0][1]*S);
  for(let i=1;i<pts.length;i++) x.lineTo(pts[i][0]*S, pts[i][1]*S);
  x.strokeStyle='#6d7a84'; x.stroke();
}

/* ---------- audio: pings, bearer ticks, wind, a bell in the yard ---------- */
let ac=null, master=null, voices=0;
function audioInit(){
  if(ac) return;
  try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = ac.createGain(); master.gain.value=0.85; master.connect(ac.destination);
  // cold wind through the open doors
  const len = ac.sampleRate*4;
  const buf = ac.createBuffer(1,len,ac.sampleRate);
  const d = buf.getChannelData(0);
  let lastv=0;
  for(let i=0;i<len;i++){ const wn=Math.random()*2-1; lastv=(lastv+0.021*wn)/1.021; d[i]=lastv*3.4; }
  const src = ac.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300; lp.Q.value=0.4;
  const wg = ac.createGain(); wg.gain.value=0.075;
  src.connect(lp); lp.connect(wg); wg.connect(master); src.start();
  const lfo = ac.createOscillator(); lfo.frequency.value=0.07;
  const lg = ac.createGain(); lg.gain.value=0.035;
  lfo.connect(lg); lg.connect(wg.gain); lfo.start();
  scheduleBell();
}
function ping(freq, amp, dec){
  if(!ac || voices>10) return;
  voices++;
  const t0=ac.currentTime;
  const g=ac.createGain(); g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(amp,t0+0.0018);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dec);
  const bp=ac.createBiquadFilter(); bp.type='highpass'; bp.frequency.value=freq*0.55;
  g.connect(bp); bp.connect(master);
  const o1=ac.createOscillator(); o1.type='triangle'; o1.frequency.value=freq;
  const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.71;
  const g2=ac.createGain(); g2.gain.value=0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  o1.start(t0); o2.start(t0); o1.stop(t0+dec+0.02); o2.stop(t0+dec+0.02);
  setTimeout(()=>{voices--;}, (dec+0.05)*1000);
}
function tick(){
  if(!ac) return;
  const t0=ac.currentTime, n=ac.createBufferSource();
  const b=ac.createBuffer(1, 700, ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<700;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/700,5);
  n.buffer=b;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800+Math.random()*2200; f.Q.value=6;
  const g=ac.createGain(); g.gain.value=0.055+Math.random()*0.05;
  n.connect(f); f.connect(g); g.connect(master); n.start(t0);
}
function scheduleBell(){
  setTimeout(function(){
    if(ac){
      const t0=ac.currentTime;
      [372, 559, 748].forEach((f,i)=>{
        const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*(1+ (Math.random()-0.5)*0.004);
        const g=ac.createGain(); g.gain.setValueAtTime(0,t0);
        g.gain.linearRampToValueAtTime(0.016/(1+i*1.4), t0+0.01);
        g.gain.exponentialRampToValueAtTime(0.00008, t0+3.2+i*0.5);
        const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
        o.connect(g); g.connect(lp); lp.connect(master); o.start(t0); o.stop(t0+4.2);
      });
    }
    scheduleBell();
  }, 62000 + Math.random()*80000);
}

/* ---------- pointer: a draught, and a pair of tongs ---------- */
let mx=-9999, my=-9999, down=false, blowing=false, drag=null, dragOff=[0,0], downAt=[0,0], moved=0;
function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
function tileAt(x,y){ for(let i=tiles.length-1;i>=0;i--){ const t=tiles[i];
  if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.w) return t; } return null; }
cv.addEventListener('pointerdown', e=>{
  audioInit(); if(ac && ac.state==='suspended') ac.resume();
  const p=pos(e); mx=p[0]; my=p[1]; down=true; blowing=true; moved=0; downAt=[p[0],p[1]];
  drag=null; const t=tileAt(p[0],p[1]);
  if(t){ dragCandidate=t; dragOff=[p[0]-t.x, p[1]-t.y]; } else dragCandidate=null;
  cv.setPointerCapture(e.pointerId);
});
let dragCandidate=null;
cv.addEventListener('pointermove', e=>{
  const p=pos(e); mx=p[0]; my=p[1];
  if(down){
    moved=Math.hypot(p[0]-downAt[0], p[1]-downAt[1]);
    if(!drag && dragCandidate && moved>14){ drag=dragCandidate; blowing=false; }
    if(drag){ drag.x=p[0]-dragOff[0]; drag.y=p[1]-dragOff[1];
      drag.x=Math.max(-drag.w*0.3,Math.min(W-drag.w*0.7,drag.x));
      drag.y=Math.max(-drag.w*0.3,Math.min(H-drag.w*0.7,drag.y));
      // bring to front
      const k=tiles.indexOf(drag); tiles.splice(k,1); tiles.push(drag);
    }
  }
});
function release(){
  down=false; blowing=false;
  if(drag){
    let ov=0;
    for(const b of bars){
      const ix=Math.max(0, Math.min(drag.x+drag.w,b.x+b.w)-Math.max(drag.x,b.x));
      const iy=Math.max(0, Math.min(drag.y+drag.w,b.y+b.h)-Math.max(drag.y,b.y));
      ov+=ix*iy;
    }
    drag.onBearers = ov > drag.w*drag.w*0.018;
    drag=null;
  }
  dragCandidate=null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', ()=>{ mx=-9999; my=-9999; release(); });
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------- simulation ---------- */
let scanPhase=0, tickTimer=0;
function simulate(dt){
  scanPhase++;
  for(const t of tiles){
    /* --- conduction and boundary loss --- */
    const T=t.T, Tn=t.Tn;
    const hb = t.onBearers ? hBear : hFloor;
    const near = Math.max(0, Math.min(1, ((t.y+t.w*0.5) - H*0.14)/(H*0.80)));
    const door = 0.15 + 0.9*near;
    const D = 0.055;
    // cursor draught, in cell units
    let cu=-99, cv_=-99, crad=0, cstr=0;
    if(mx>-9000 && !drag){
      const rad = t.w*1.15;
      if(mx>t.x-rad && mx<t.x+t.w+rad && my>t.y-rad && my<t.y+t.w+rad){
        cu = (mx-t.x)/t.w*NG; cv_ = (my-t.y)/t.w*NG;
        crad = rad/t.w*NG; cstr = blowing ? 12.0 : 3.5;
      }
    }
    let sum=0;
    for(let j=0;j<NG;j++){
      const jm=j>0?j-1:0, jp=j<NG-1?j+1:NG-1;
      for(let i=0;i<NG;i++){
        const c=j*NG+i;
        const im=i>0?i-1:0, ip=i<NG-1?i+1:NG-1;
        const lap = T[j*NG+im]+T[j*NG+ip]+T[jm*NG+i]+T[jp*NG+i]-4*T[c];
        let h = hb[c] + door;
        if(crad>0){
          const dx=(i+0.5)-cu, dy=(j+0.5)-cv_;
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<crad){ const f=1-d/crad; h += cstr*f*f; }
        }
        const Tv=T[c], k=(Tv+273)/1000;
        const rate=(Tv-TAMB)*(A_COOL+B_COOL*k*k*k)*(h/HREF);
        let nv = Tv + dt*(D*lap - rate);
        if(nv<TAMB) nv=TAMB;
        Tn[c]=nv; sum+=nv;
      }
    }
    t.T=Tn; t.Tn=T; t.meanT=sum/NC;

    if(t.matte) continue;   // dry matte brown. it just cools.

    /* --- slow decay of local flaw strength: the long tail --- */
    const fd = 1 - dt/1500;
    if(scanPhase%7===0) for(let c=0;c<NC;c++) t.F[c]*=Math.pow(fd,7);

    /* --- advance running tips --- */
    for(let k=t.tips.length-1;k>=0;k--){
      const tip=t.tips[k];
      let alive=true;
      for(let a=0;a<2 && alive;a++){
        const sg=sigmaAt(t,tip.x,tip.y);
        if(sg<=0){ alive=false; break; }
        const R=sampleR(t,tip.x,tip.y);
        const pr=principal(R[0],R[1],R[2]);
        const s1=sg*pr[0];
        if(s1<SPROP){ alive=false; break; }
        let dx=-pr[2], dy=pr[1];               // crack line runs perpendicular to max tension
        if(dx*tip.dx+dy*tip.dy < 0){ dx=-dx; dy=-dy; }
        dx = 0.55*dx + 0.45*tip.dx; dy = 0.55*dy + 0.45*tip.dy;
        const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
        tip.dx=dx; tip.dy=dy;
        const sp=STEP*Math.min(1.9, Math.sqrt(Math.max(0.06, s1/SPROP-0.55)));
        tip.x+=dx*sp; tip.y+=dy*sp;
        let stop=false;
        if(tip.x<0||tip.x>1||tip.y<0||tip.y>1){
          tip.x=Math.max(0,Math.min(1,tip.x)); tip.y=Math.max(0,Math.min(1,tip.y)); stop=true;
        }
        tip.arr.push([tip.x,tip.y]); tip.n++;
        if(!stop && tip.n>3){
          const mi=Math.round(tip.x*MM), mj=Math.round(tip.y*MM);
          if(mi>=0&&mi<MM&&mj>=0&&mj<MM&&t.mask[mj*MM+mi]) stop=true;  // free surface: it ends here
        }
        if(tip.n>130) stop=true;
        if(stop) alive=false;
      }
      if(!alive){
        t.tips.splice(k,1);
        tip.cr.live--;
        if(tip.cr.live<=0) finish(t, tip.cr);
      }
    }

    /* --- nucleation: bursts, wherever tension has beaten the local flaw strength --- */
    if(scanPhase%2===0 && t.tips.length<6 && t.cracks.length<900){
      const cand=[];
      for(let j=0;j<NG;j++) for(let i=0;i<NG;i++){
        const c=j*NG+i;
        const Tv=t.T[c]; if(Tv>=TSET) continue;
        const sg=SBASE*(TSET-Tv)/(TSET-TAMB);
        const pr=principal(t.R[3*c],t.R[3*c+1],t.R[3*c+2]);
        const ex=sg*pr[0]-t.F[c];
        if(ex>0) cand.push([ex,i,j,pr[1],pr[2]]);
      }
      if(cand.length){
        cand.sort((a,b)=>b[0]-a[0]);
        let placed=0;
        const used=[];
        for(const cd of cand){
          if(placed>=4 || t.tips.length>=6) break;
          let ok=true;
          for(const u of used) if(Math.hypot(u[0]-cd[1],u[1]-cd[2])<3.0){ ok=false; break; }
          if(ok) for(const tp of t.tips) if(Math.hypot(tp.x*NG-cd[1],tp.y*NG-cd[2])<3.0){ ok=false; break; }
          if(!ok) continue;
          used.push([cd[1],cd[2]]);
          nucleate(t, (cd[1]+0.5)/NG, (cd[2]+0.5)/NG, -cd[4], cd[3]);
          t.F[cd[2]*NG+cd[1]] += 0.9;
          placed++;
        }
      }
    }
  }
  // iron bearers contracting
  tickTimer-=dt;
  if(tickTimer<=0){
    const hot = tiles.some(t=>t.meanT>90);
    tickTimer = hot ? (1.1+Math.random()*3.0) : (7+Math.random()*22);
    if(hot||Math.random()<0.5) tick();
  }
}

function nucleate(t,u,v,dx,dy){
  const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  const cr={pts:null, live:2};
  const A=[[u,v]], B=[[u,v]];
  cr.A=A; cr.B=B;
  t.tips.push({x:u,y:v,dx:dx,dy:dy,arr:A,n:0,cr:cr});
  t.tips.push({x:u,y:v,dx:-dx,dy:-dy,arr:B,n:0,cr:cr});
}
function finish(t, cr){
  const pts = cr.B.slice(1).reverse().concat(cr.A);
  if(pts.length<3) return;
  let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(len<0.018) return;
  cr.pts=pts;
  t.cracks.push(cr);
  stampRelief(t,pts);
  rasterize(t,pts);
  const frac=domainFrac(t,pts);
  drawCrackToCache(t,pts);
  const f=Math.max(420, Math.min(5200, 520*Math.pow(frac,-0.35)));
  const amp=Math.max(0.02, Math.min(0.30, (0.045+0.24*Math.pow(frac,0.45))*Math.min(1.4,0.45+len)));
  const dec=0.11+0.55*Math.pow(frac,0.4);
  ping(f, amp, dec);
}

/* ---------- render ---------- */
const GW=[0xe9,0xe2,0xce], GG=[0xe1,0xe3,0xc6], MB=[0x55,0x40,0x2e];
function render(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg,0,0,W,H);
  for(const t of tiles) drawTile(t, now);
}
function drawTile(t, now){
  const d=t.img.data, base = t.matte ? MB : GW;
  for(let j=0;j<NG;j++) for(let i=0;i<NG;i++){
    const c=j*NG+i, o=c*4;
    const T=t.T[c];
    let k=(T-478)/210; k=k<0?0:(k>1?1:k); k=Math.pow(k,1.35);
    const Ti=Math.max(0,Math.min(800,Math.round(T)));
    const br=BB[Ti*3], bgc=BB[Ti*3+1], bb=BB[Ti*3+2];
    // thick glaze pools a little green at the rim
    const u=(i+0.5)/NG, v=(j+0.5)/NG;
    const de=Math.min(u,1-u,v,1-v);
    const gf = t.matte ? 0 : Math.exp(-de/0.055)*0.75;
    const n = t.tex[c]*(t.matte?9:3.2);
    const r0=base[0]*(1-gf)+GG[0]*gf+n, g0=base[1]*(1-gf)+GG[1]*gf+n, b0=base[2]*(1-gf)+GG[2]*gf+n;
    d[o  ]=Math.min(255, r0*(1-k)+br*k);
    d[o+1]=Math.min(255, g0*(1-k)+bgc*k);
    d[o+2]=Math.min(255, b0*(1-k)+bb*k);
    d[o+3]=255;
  }
  t.sx.putImageData(t.img,0,0);

  // hard contact shadow, light from up-left
  ctx.fillStyle='rgba(10,7,5,0.55)';
  ctx.fillRect(t.x+2.5, t.y+2.5, t.w, t.w);

  ctx.imageSmoothingEnabled=true;
  const amp = Math.max(0, Math.min(1,(t.meanT-540)/220))*1.7;
  if(amp>0.05){
    const S=14;
    for(let s=0;s<S;s++){
      const off=Math.sin(now*0.0065 + s*1.27 + t.idx*2.1)*amp
              + Math.sin(now*0.0113 + s*0.61)*amp*0.4;
      ctx.drawImage(t.small, 0, s*NG/S, NG, NG/S, t.x+off, t.y+s*t.w/S, t.w, t.w/S+0.7);
    }
  } else {
    ctx.drawImage(t.small, 0,0,NG,NG, t.x, t.y, t.w, t.w);
  }

  if(!t.matte){
    let k=(t.meanT-478)/210; k=k<0?0:(k>1?1:k);
    ctx.globalAlpha = 0.5 + 0.5*(1-k);
    ctx.drawImage(t.cache, t.x, t.y, t.w, t.w);
    ctx.globalAlpha = 1;
    // tips currently running
    if(t.tips.length){
      ctx.lineWidth=1/DPR; ctx.strokeStyle='rgba(109,122,132,'+(0.55+0.45*(1-k)).toFixed(2)+')';
      ctx.lineCap='round'; ctx.lineJoin='round';
      for(const tip of t.tips){
        const a=tip.arr; if(a.length<2) continue;
        ctx.beginPath();
        ctx.moveTo(t.x+a[0][0]*t.w, t.y+a[0][1]*t.w);
        for(let i=1;i<a.length;i++) ctx.lineTo(t.x+a[i][0]*t.w, t.y+a[i][1]*t.w);
        ctx.stroke();
      }
    }
  }
  // glaze edge
  ctx.lineWidth=1/DPR;
  ctx.strokeStyle='rgba(24,18,14,0.55)';
  ctx.strokeRect(t.x+0.5/DPR, t.y+0.5/DPR, t.w-1/DPR, t.w-1/DPR);
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.12) dt=0.12;
  acc+=dt;
  let guard=0;
  while(acc>=SIMDT && guard<4){ simulate(SIMDT); acc-=SIMDT; guard++; }
  if(acc>SIMDT*4) acc=0;
  render(now);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
layout();
requestAnimationFrame(frame);

/* nine off the truck at half past two. another draw at five.
   the far left of the second row is a different glaze and will not craze.
   pinging carries on well after they're cool enough to lift. */
})();
</script>
