  <meta name="outbox-spec-era" content="Right now, 11:52 in the morning, in a laundromat on a commercial strip in Yuma, Arizona, in the middle of an ordinary summer — a room with eighteen top-loaders, four of which are out of order, a bill changer that takes fives, and a television bolted near the ceiling that nobody is watching. The page is not set in any decade and refuses to be: the machines are from four different decades, the vending machine is from a fifth, and nothing about the room tells you what year it is. Not a memory, not an atmosphere piece, not a lonely-laundromat mood: there is a woman waiting on dryer 11, a kid doing homework on the folding table, and a man who has been reading the same page of a paperback for twenty minutes.">
  <meta name="outbox-spec-format" content="A STRUCTURALLY WEIRD PAGE: the entire viewport is ONE CONTINUOUS HORIZONTAL LINE OF TEXT, a single sentence with no line breaks, that runs off both edges of the screen forever in both directions — and the only navigation on the page is SCROLLING SIDEWAYS. No header, no menu, no title, no vertical scroll, no scrollbar, no site chrome, no wrapping at any window width. The sentence describes what is currently happening in the room, and it is being written AT A FIXED RATE at the right-hand end while the visitor reads — roughly four words a minute, which is slower than reading and faster than nothing — so a visitor who scrolls right to the leading edge and waits will watch it being extended, word by word, and a visitor who scrolls left travels backward through everything that has already happened. The strangeness: the sentence NEVER ENDS and never has a full stop, but it does have commas, and the whole thing is one grammatically legal run-on that has been running since before the page loaded — scrolling left far enough reaches text written on somebody else's visit, and text written on every previous visit, all of it in the same unbroken line. The visitor cannot type, cannot jump, cannot search, and cannot see more than about eleven words at once. There is no map of where you are in it.">
  <meta name="outbox-spec-subject" content="The flat mechanics of what actually determines whether a load of laundry comes out clean in a coin-operated top-loader, which is almost entirely a question of mechanical action and water temperature and is not a question of detergent at all. That a commercial top-loader's wash cycle is bought by the coin and not by the load, so a machine set for an eleven-minute wash gives eleven minutes whether it holds six pounds or eighteen, and the entire practical skill of using one is deciding what to leave out. That MECHANICAL ACTION IS THE CLEANING and the agitator does it by dragging fabric against fabric — a machine filled past about two-thirds simply stops circulating, the load turns as a solid mass instead of tumbling through itself, and the clothes in the middle of a stuffed tub come out with dry patches that never got wet, which is the single most common failure in the room and nobody in the room knows it is happening. That the correct fill is judged by watching the top of the load go under and come back up, and if it does not come back up the load is too big, full stop. That WATER TEMPERATURE IS A SOLUBILITY QUESTION: most powdered detergent will not fully dissolve below about sixty degrees Fahrenheit, and in a town where the cold tap runs at eighty-six in July the cold cycle is warmer than the warm cycle is in Minnesota, so the printed advice on the box is written for somebody else's plumbing. That HARD WATER IS THE ENTIRE LOCAL PROBLEM — the municipal supply here runs upward of twenty grains per gallon, calcium and magnesium bind the surfactant directly and take it out of play before it ever reaches a fiber, so the first substantial fraction of any detergent dose is spent purely on softening the water and does no washing whatsoever, which is why the same scoop that works fine in Portland leaves a load gray here and why a person who doubles the scoop is right for the wrong reason. That the gray is not dirt, it is precipitated calcium soap deposited back onto the fabric, and it accumulates load after load and cannot be rinsed out. That TOO MUCH DETERGENT IS ITS OWN FAILURE for the opposite reason: the rinse is a fixed volume, suds carry soil in suspension, and a rinse that cannot clear the suds redeposits everything it lifted. That the two errors look identical on the fabric. That SPIN SPEED SETS DRYER TIME and is the only economically important number in the building — a machine spinning at 700 rpm leaves roughly half again as much water in a load as one spinning at 1000, and every ounce of that water has to be evaporated at the customer's expense in a gas dryer at twenty-five cents for eight minutes, so the cheapest washer in the row is genuinely the most expensive machine to use and the sign on it does not say that. That an UNBALANCED LOAD is a mass distribution problem and the machine's answer is to shut itself off, so a single heavy item — one pair of jeans, one towel — spun alone will trip the switch every time, and the fix is to add something, not to remove something, which is exactly backwards from what everybody does. That DRYERS DO NOT DRY BY HEAT, they dry by moving unsaturated air across wet fabric, so a stuffed dryer is running at full gas with air that is already saturated and it will take three times as long and cost three times as much; the sheets have to have room to open. That LINT SCREENS ARE AIRFLOW and a screen coated with fabric softener residue reads clean and passes almost no air. That the four out-of-order machines are out of order for three different reasons and only one of them is broken.">
  <meta name="outbox-spec-tone" content="The flat, running, present-tense observational voice of whoever has been keeping this sentence going — never named, never described, never a character, never a narrator with feelings. The voice does exactly two things and nothing else: it states what is happening in the room at the moment it is written, and it states the mechanical reason for it, in the same register, in the same clause, without transition. 'the woman at nine has put in about twenty-two pounds of towels which is over the tub's usable capacity by a third so the top of the load is going under and not coming back up, and she has gone outside to make a phone call, and the machine will finish in eleven minutes with about four pounds of it never having been submerged, and the kid at the folding table has moved his homework twice because the sun has come around'. It is not deadpan and not dry — it is BUSY and SPECIFIC and slightly hurried, because things are happening faster than the sentence can be written, and it says so: it skips things, it doubles back with 'and before that', it corrects a figure it got wrong ('the eighty-six I said earlier is the tap in January, it is closer to ninety-one today'), and it loses track of somebody and picks them up again six hundred words later. It uses numbers constantly and gives units every time. It never addresses the visitor, never says 'you', never asks a question, never draws a conclusion, never ends a thought, never uses a full stop, never uses the word 'I'. It has three things it is specifically and repeatedly annoyed about — the fabric softener residue on the number 4 dryer screen, the fact that the spin speeds are not posted on the machines, and a man who has been putting quarters in the broken changer since ten forty — and it returns to all three at intervals of several hundred words without ever resolving any of them. Never wry, never melancholy, never wistful, never charmed by anybody in the room, never fond, never observational-essay, never a character study.">

  <meta name="outbox-spec-palette" content="Two anchors and one held chip, and the sentence's own ink density is COMPUTED and never chosen. The ground is the hard institutional interior of the room rendered as flat color: a wall paint in dry mint-green enamel gone chalky at hand height (#a8bdae), with a dirtier scrubbed band along the bottom third where carts have hit it (#8a9c8f) and a lighter rectangle where a sign used to hang. The text runs in worn appliance-decal black (#1d1f1c), and its rendering is honest to WHEN each word was written: every word stores the real timestamp of its own creation and an accumulated wear value that only ever climbs, so the leading edge of the sentence renders crisp and dense, words a few hundred behind it are measurably lighter, and the oldest material far off to the left has gone a rubbed gray-green (#6c7a70) with individual characters dropped out entirely where the wear crossed a threshold — the sentence is genuinely harder to read the further back you scroll, and nothing on the page says so. Words written during a previous visit carry a different and permanently lower density than words written during this one. Exactly one chip of bill-changer red (#c4362a) is held strictly for three things: the OUT OF ORDER lettering wherever it is quoted inside the sentence, the price figures in cents, and the word NOT. It never appears in the wall, never in ordinary text, never at the leading edge. Flat, hard, high contrast at the right-hand end and honestly worn at the left; no glow, no bloom, no soft focus, no fade-to-transparent, no vignette, no gradients other than honest per-word wear.">
  <meta name="outbox-spec-wildcard" content="FORBIDDEN: the letter sequence that spells a full stop has no place on this page — no period, ever, in any position, including at the end of the very last word written. The sentence uses commas and the word 'and' and nothing else to join, and the engine must never work around this by ending a clause with a line break, a dash, a semicolon, a colon or a visual gap. Semicolons and dashes are also banned outright. The only punctuation marks that may appear anywhere on the page are the comma and the apostrophe.">
  <meta name="outbox-spec-forbidden" content="NO laundromat-as-metaphor for anything — not waiting, not cleansing, not starting fresh, not the cycle of things, not strangers-in-a-room, not 'everybody ends up here eventually'; this is twenty grains per gallon and a tub at two-thirds and it has nothing to teach anybody. ABSOLUTELY NO lonely-laundromat mood piece: no fluorescent melancholy, no 3am register, no Edward Hopper, no nobody-speaks-to-anybody, no strangers-almost-connecting, no the-hum-of-the-machines, no watching-clothes-go-around reverie, no meditative circles, no the-television-nobody-is-watching-as-symbol. NO cinematic framing whatsoever: no montage, no slice-of-life indie film register, no quirky-characters-in-a-room ensemble, no a-whole-world-in-one-room, no the-kid-doing-homework as an image of anything, no the-man-with-the-paperback as a mystery. NO poverty pathos, NO class commentary, NO 'the people who don't have a machine at home', NO dignity-of-the-ordinary sermon, NO invisible-labor essay, NO domestic-work-is-work argument, NO gendered-labor essay. NO nostalgia, NO wistfulness, NO decline narrative, NO 'these places are all closing', NO the-last-laundromat, NO coin-op elegy, NO retro-kitsch, NO camp, NO ironic affection for the wood-grain paneling, the bill changer or the bolted-up television. NO Arizona or Southwest travelogue and NO explaining the desert to anybody: no heat-shimmer lyricism, no saguaro, no border commentary, no snowbird joke, no it's-a-dry-heat, no Sonoran mood writing, no dialect spelling, no Spanish sprinkled for flavor, no aren't-they-hardy, no explaining Yuma to anybody. NO sensory writing about laundry: no warm-clothes-out-of-the-dryer comfort, no smell of detergent, no softness, no the-sound-of-water, no clean-as-a-feeling, no domestic coziness of any kind. NO chemistry-as-wonder, NO teaching voice, NO explainer framing, NO tutorial register, NO science-communicator enthusiasm, NO 'and here's the clever part' — the page addresses nobody and explains nothing to anybody. NO experimental-literature framing: no Oulipo, no Beckett, no Molly Bloom, no the-unbroken-sentence-as-consciousness, no stream-of-consciousness, no writing-about-writing, no meta commentary on the sentence's own length or shape, no winking at the reader, no the-page-is-aware-of-itself, no infinite-scroll-as-statement. NO time-as-theme essay, NO entropy sermon, NO the-words-fade-like-memory, NO everything-is-forgotten, NO ephemerality preciousness about the wear. NO hushed, meditative, hypnotic, ASMR, oddly-satisfying, ambient-visualiser or screensaver framing of the scrolling or the machine noise. NO cryptic-SCP, liminal, uncanny, backrooms, analog-horror or ominous dread about the sentence that never ends, the faded left-hand text, the man at the changer, or a room that keeps running while nobody is looking — nothing here is wrong. NO archival / museum / cabinet / drawer / ledger / registry / log / transcript / found-document framing of the sentence whatsoever, despite it being an accumulating written record — it is being written right now and the woman at nine is coming back inside. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice — it is eleven fifty-two in the morning and the door is propped open. NO signal / transmission / frequency / broadcast framing. NO society / club / guild / cabinet-of-hobbyists scaffolding.">

<script>
(function(){
"use strict";

/* ============ storage ============ */
var KEY="ldy_line_v2";
var store=null;
try{ store=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ store=null; }

/* ============ numbers and clock ============ */
var NW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
var TENS=["","","twenty","thirty","forty","fifty"];
function nw(n){n=Math.round(n);if(n<0)n=0;if(n<=20)return NW[n];if(n<60){var a=Math.floor(n/10),b=n%10;return b?TENS[a]+" "+NW[b]:TENS[a];}return String(n);}
function clockStr(mins){
  var m=Math.floor(((mins%1440)+1440)%1440);
  var h=Math.floor(m/60), mm=m%60, hh=h%12; if(hh===0)hh=12;
  var hs=nw(hh);
  if(mm===0) return hs+" o'clock";
  if(mm<10) return hs+" oh "+NW[mm];
  return hs+" "+nw(mm);
}
function R(a,b){return a+Math.random()*(b-a);}
function RI(a,b){return Math.floor(R(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ============ the room ============ */
var TAGS=["the woman in the orange top","the man in the gray shirt","the one with the blue cart","the woman who came in with two baskets","the man with the duffel","the woman in the white cap","the one who parked out front","the man with the red bucket","the woman with the rolling hamper"];

function mkSim(){
  var s={min:11*60+52, ev:[], skipped:0, tapCold:91, tapHot:118, hard:21, outdoor:99, changerN:11, changerSince:"ten forty", washers:[], dryers:[], people:[], usedTags:[]};
  for(var i=1;i<=18;i++){
    var tier = i<=4?0 : i<=9?1 : i<=14?2 : 3;
    var w={i:i,rpm:[640,700,1000,1150][tier],cap:[12,14,16,18][tier],price:[200,225,275,325][tier],st:"idle",t:0,load:0,lb:0,over:0,dry:0,p:-1,rpmNow:0,ooo:null,single:false,trip:0,soap:1};
    if(i===3) w.ooo="lid";
    if(i===7) w.ooo="sign";
    if(i===12) w.ooo="slide";
    if(i===16) w.ooo="slide";
    if(w.ooo) w.st="ooo";
    s.washers.push(w);
  }
  for(var d=1;d<=12;d++){
    s.dryers.push({i:d,st:"idle",t:0,lb:0,water:0,q:0,cents:0,p:-1,screen:d===4?"coated":"clear",stuffed:false});
  }
  return s;
}

function addEv(s,e){
  s.ev.push(e);
  while(s.ev.length>10){ s.ev.shift(); s.skipped++; }
  if(AUD.live && AUD.on) sound(e);
}

function freeWasher(s,lb){
  var best=-1;
  for(var i=0;i<18;i++){var w=s.washers[i];
    if(w.st!=="idle") continue;
    if(best<0) best=i; else if(Math.abs(w.cap-lb)<Math.abs(s.washers[best].cap-lb)) best=i;}
  return best;
}
function freeDryer(s){ for(var i=0;i<12;i++) if(s.dryers[i].st==="idle") return i; return -1; }

function newPerson(s,tag,fixed){
  return {tag:tag,arr:s.min,lb:RI(9,26),w:-1,d:-1,st:"looking",t:R(1,3),fixed:fixed||null,quarters:0,cents:0,note:0,page:0,moves:0,seen:s.min};
}

function seedPeople(s){
  var p1=newPerson(s,"the woman waiting on eleven","dry11");
  p1.st="drying"; p1.lb=19; p1.d=10; p1.t=R(3,7);
  var dr=s.dryers[10]; dr.st="run"; dr.t=R(2,7); dr.lb=19; dr.water=8.9; dr.q=3; dr.cents=75; dr.p=0; dr.stuffed=true;
  s.people.push(p1);
  var p2=newPerson(s,"the kid at the folding table","kid");
  p2.st="homework"; p2.lb=11; p2.t=R(8,14);
  var wi=freeWasher(s,11); var w=s.washers[wi]; w.st="wash"; w.t=R(3,9); w.load=11; w.p=1; p2.w=wi;
  s.people.push(p2);
  var p3=newPerson(s,"the man with the paperback","book");
  p3.st="reading"; p3.lb=16; p3.page=104; p3.t=R(10,20);
  var wj=freeWasher(s,16); var w2=s.washers[wj]; w2.st="wash"; w2.t=R(4,10); w2.load=22; w2.over=1; w2.p=2; p3.w=wj;
  s.people.push(p3);
  var p4=newPerson(s,"the man at the changer","changer");
  p4.st="changer"; p4.t=R(1,3); p4.arr=10*60+40;
  s.people.push(p4);
  for(var k=0;k<2;k++){ var t=pick(TAGS); s.usedTags.push(t); s.people.push(newPerson(s,t)); }
  return s;
}

function stepSim(s,dtMin){
  s.min+=dtMin;
  var hourOfDay=((s.min/60)%24+24)%24;
  s.outdoor=Math.round(88+18*Math.sin((hourOfDay-5)/24*Math.PI*2)*0.9+ (Math.random()-0.5));
  s.tapCold=Math.round(84+ (s.outdoor-88)*0.32 + Math.random()*0.8);
  if(s.tapCold<79)s.tapCold=79;

  var i,w,d,p;
  for(i=0;i<18;i++){
    w=s.washers[i];
    if(w.st==="fill"){ w.t-=dtMin; if(w.t<=0){ w.st="wash"; w.t=11;
        if(w.load>w.cap){ w.over=1; addEv(s,{k:"over",w:w.i,lb:Math.round(w.load),cap:w.cap}); }
      } }
    else if(w.st==="wash"){ w.t-=dtMin; if(w.t<=0){ w.st="spin"; w.t=2.2; w.rpmNow=0;
        if(w.single && Math.random()<0.85){ w.st="balk"; w.t=0.6; w.trip++; addEv(s,{k:"balance",w:w.i,n:w.trip}); }
        else addEv(s,{k:"spin",w:w.i,rpm:w.rpm});
      } }
    else if(w.st==="balk"){ w.t-=dtMin; if(w.t<=0){ w.st="spin"; w.t=2.2; addEv(s,{k:"spin",w:w.i,rpm:w.rpm}); } }
    else if(w.st==="spin"){ w.t-=dtMin; w.rpmNow=Math.min(w.rpm,w.rpm*(1-Math.max(0,w.t-0.5)/1.9)); if(w.t<=0){ w.st="done"; w.rpmNow=0;
        if(w.over){ w.dry=Math.max(1,Math.round((w.load-w.cap*0.72)*0.42)); addEv(s,{k:"patch",w:w.i,lb:w.dry}); }
        addEv(s,{k:"done",w:w.i});
      } }
  }
  for(i=0;i<12;i++){
    d=s.dryers[i];
    if(d.st==="run"){ d.t-=dtMin;
      var rate=0.46; if(d.stuffed)rate*=0.36; if(d.screen==="coated")rate*=0.6;
      d.water=Math.max(0,d.water-rate*dtMin);
      if(d.t<=0){ d.st="stopped"; }
    }
  }
  for(var pi=0;pi<s.people.length;pi++){
    p=s.people[pi]; p.t-=dtMin;
    switch(p.st){
      case "changer":
        if(p.t<=0){ s.changerN++; p.t=R(1.5,5.5); addEv(s,{k:"changer",n:s.changerN}); }
        break;
      case "reading":
        if(p.t<=0){ p.t=R(9,22); addEv(s,{k:"page",tag:p.tag,page:p.page}); }
        if(p.w>=0 && s.washers[p.w].st==="done"){ p.st="transfer"; p.t=R(1.5,3); }
        break;
      case "homework":
        if(p.t<=0){ p.moves++; p.t=R(9,17); addEv(s,{k:"moved",n:p.moves}); }
        if(p.w>=0 && s.washers[p.w].st==="done"){ p.st="transfer"; p.t=R(2,4); }
        break;
      case "looking":
        if(p.t<=0){
          var wi=freeWasher(s,p.lb);
          if(wi<0){ p.t=R(2,5); break; }
          w=s.washers[wi]; p.w=wi; w.p=pi; w.st="fill"; w.t=1.6; w.trip=0; w.single=false; w.over=0; w.dry=0;
          if(p.lb>w.cap && Math.random()<0.7){ w.load=p.lb; }
          else if(p.lb>w.cap){ w.load=w.cap-1; }
          else w.load=p.lb;
          if(p.lb<=4 && Math.random()<0.8){ w.single=true; w.load=p.lb; }
          w.soap = Math.random()<0.35 ? 3 : 1;
          addEv(s,{k:"coin",w:w.i,cents:w.price,n:Math.round(w.price/25),tag:p.tag,lb:Math.round(w.load)});
          p.st="waiting"; p.t=R(1,3);
        }
        break;
      case "waiting":
        if(p.w>=0 && s.washers[p.w].st==="done"){ p.st="transfer"; p.t=R(1,3); break; }
        if(p.t<=0){ if(Math.random()<0.3){ p.st="outside"; p.t=R(3,8); addEv(s,{k:"outside",tag:p.tag}); } else p.t=R(3,7); }
        break;
      case "outside":
        if(p.t<=0){ p.st="waiting"; p.t=R(2,5); addEv(s,{k:"backin",tag:p.tag}); }
        break;
      case "transfer":
        if(p.t<=0){
          var di=freeDryer(s);
          if(di<0){ p.t=R(2,4); break; }
          d=s.dryers[di]; p.d=di; d.p=pi; d.st="run"; d.t=8; d.lb=s.washers[p.w].load||p.lb;
          var rpm=s.washers[p.w].rpm;
          d.water=d.lb*(rpm>=1000?0.44:0.66);
          d.stuffed = d.lb>15 && Math.random()<0.75;
          d.q=1; d.cents=25;
          if(p.w>=0){ s.washers[p.w].st="idle"; s.washers[p.w].load=0; s.washers[p.w].over=0; s.washers[p.w].single=false; }
          addEv(s,{k:"dry",d:d.i,lb:Math.round(d.lb),rpm:rpm,stuffed:d.stuffed,water:Math.round(d.water*10)/10});
          p.st="drying"; p.t=8;
        }
        break;
      case "drying":
        d = p.d>=0 ? s.dryers[p.d] : null;
        if(!d){ p.st="folding"; p.t=5; break; }
        if(d.st==="stopped"){

/* ============ word list ============ */
var words=[];        /* {x,t,s,r} */
var off=[];          /* cumulative char offsets */

var totalWords=0;
var dropped=0;

function pushWord(tok,t,sv){
  var o={x:tok.x,t:t,s:sv,r:tok.r?1:0};
  off.push(totalChars);
  totalChars+=o.x.length+1;
  words.push(o);
  totalWords++;
  if(words.length>30000){
    var cut=2000, shiftChars=0;
    for(var i=0;i<cut;i++) shiftChars+=words[i].x.length+1;
    words=words.slice(cut); off=off.slice(cut);
    for(var j=0;j<off.length;j++) off[j]-=shiftChars;
    totalChars-=shiftChars; dropped+=cut;
  }
}

function emitOne(now,sv){
  if(!pend.length) pend=nextClause(SIM).slice();
  if(!pend.length) return;
  pushWord(pend.shift(),now,sv);
}

/* ============ wear ============ */
var LOGC=Math.log1p(120);
function wearOf(w,now){
  var age=(now-w.t)/1000; if(age<0)age=0;
  var v=Math.log1p(age/900)/LOGC;
  v+=Math.min(0.45,0.13*Math.max(0,sess-w.s));
  return v>1?1:v;
}
function h01(a,b){
  var x=(a*2654435761+b*40503)>>>0;
  x^=x>>>13; x=(x*1274126177)>>>0; x^=x>>>16;
  return (x>>>0)/4294967296;
}
var C0=[29,31,28], C1=[108,122,112], RD=[196,54,42];
function inkOf(w,v){
  var a=w.r?RD:C0, out="rgb(";
  var f=Math.min(1,v/0.78);
  for(var i=0;i<3;i++){ out+=Math.round(a[i]+(C1[i]-a[i])*f)+(i<2?",":""); }
  return out+")";
}
function textOf(w,v){
  if(v>0.985) return " ".repeat(w.x.length);
  if(v<0.5) return w.x;
  var out="";
  for(var i=0;i<w.x.length;i++){
    var th=0.5+0.48*h01(w.t+i*7919,i+w.x.length);
    out += (v>th && w.x[i]!==",") ? " " : w.x[i];
  }
  return out;
}

function maxScroll(){ return Math.max(0,totalChars*CW-VW*0.74); }
function minScroll(){ return -VW*0.06; }
function clampScroll(){ var m=maxScroll(); if(scrollX>m)scrollX=m; if(scrollX<minScroll())scrollX=minScroll(); }

var scrollX=0, vel=0, dirty=true, pinned=true;

function lowerBound(arr,v){ var lo=0,hi=arr.length-1,r=arr.length-1;
  while(lo<=hi){ var m=(lo+hi)>>1; if(arr[m]>=v){ r=m; hi=m-1; } else lo=m+1; } return Math.max(0,r); }

function draw(now){
  var startChar=(scrollX-CW*2)/CW;
  var i=lowerBound(off,startChar); if(i>0)i--;
  var endX=scrollX+VW+CW*2;
  var used=0;
  while(i<words.length){
    var w=words[i], x=off[i]*CW-scrollX;
    if(x>endX) break;
    var el=pool[used];
    if(!el){ el=document.createElement("span"); el.className="w"; el.style.fontSize=FS+"px"; el.style.top=TOP+"px"; lineEl.appendChild(el); pool.push(el); }
    var v=wearOf(w,now);
    var txt=textOf(w,v);
    if(el._t!==txt){ el.textContent=txt; el._t=txt; }
    var ink=inkOf(w,v);
    if(el._c!==ink){ el.style.color=ink; el._c=ink; }
    el.style.transform="translate3d("+x.toFixed(1)+"px,0,0)";
    if(el._h){ el.style.display=""; el._h=false; }
    used++; i++;
    if(used>220) break;
  }
  for(var j=used;j<pool.length;j++){ if(!pool[j]._h){ pool[j].style.display="none"; pool[j]._h=true; } }
}

  var roar=src(NOISE,true); var rb=ctx.createBiquadFilter(); rb.type="bandpass"; rb.frequency.value=720; rb.Q.value=0.7;
  var rg=ctx.createGain(); rg.gain.value=0.0; roar.connect(rb); rb.connect(rg); rg.connect(AUD.bus); roar.start();
  var thud=setInterval(function(){ if(AUD.on) knock(0.026+0.03*wetFrac,110+90*(1-wetFrac)); },1280+Math.random()*260);
  var burn=setInterval(function(){ if(!AUD.on)return; var t=AUD.ctx.currentTime;
    var on=rg.gain.value<0.005;
    if(on){ tick(); rg.gain.setTargetAtTime(0.022,t,0.4); } else rg.gain.setTargetAtTime(0.0,t,0.6);
  },24000+Math.random()*9000);
  return {set:function(wf){ wetFrac=wf; lp.frequency.setTargetAtTime(300+800*(1-wf),AUD.ctx.currentTime,0.8); },
    stop:function(){ clearInterval(thud); clearInterval(burn); try{s.stop();roar.stop();}catch(e){} g.disconnect(); rg.disconnect(); }};
}
function tick(){ var ctx=AUD.ctx,t=ctx.currentTime;
  for(var i=0;i<3;i++){ var o=ctx.createOscillator(); o.type="square"; o.frequency.value=1800+Math.random()*700;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.03,t+i*0.09); g.gain.exponentialRampToValueAtTime(0.0005,t+i*0.09+0.03);
    o.connect(g); g.connect(AUD.bus); o.start(t+i*0.09); o.stop(t+i*0.09+0.05); } }
function coinDrop(n){ if(!AUD.on)return; var ctx=AUD.ctx,t0=ctx.currentTime;
  for(var i=0;i<Math.min(n,14);i++){ (function(i){ var t=t0+i*0.21+Math.random()*0.04;
    var o=ctx.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(2500+Math.random()*700,t);
    o.frequency.exponentialRampToValueAtTime(1500,t+0.09);
    var g=ctx.createGain(); g.gain.setValueAtTime(0.045,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.13);
    o.connect(g); g.connect(AUD.bus); o.start(t); o.stop(t+0.15);
    var s=src(NOISE,false); var f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600;
    var sg=ctx.createGain(); sg.gain.setValueAtTime(0.03,t); sg.gain.exponentialRampToValueAtTime(0.0005,t+0.05);
    s.connect(f); f.connect(sg); sg.connect(AUD.bus); s.start(t); s.stop(t+0.07);
  })(i); } }
function changerRefuse(){ if(!AUD.on)return; var ctx=AUD.ctx,t=ctx.currentTime;
  var o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(64,t);
  o.frequency.linearRampToValueAtTime(96,t+0.5); o.frequency.linearRampToValueAtTime(58,t+1.1);
  var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=420;
  var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+0.12);
  g.gain.setValueAtTime(0.05,t+0.62); g.gain.linearRampToValueAtTime(0.0001,t+1.2);
  o.connect(lp); lp.connect(g); g.connect(AUD.bus); o.start(t); o.stop(t+1.25);
  var s=src(NOISE,false); var bf=ctx.createBiquadFilter(); bf.type="bandpass"; bf.frequency.value=900;
  var sg=ctx.createGain(); sg.gain.setValueAtTime(0.02,t); sg.gain.exponentialRampToValueAtTime(0.0004,t+1.1);
  s.connect(bf); bf.connect(sg); sg.connect(AUD.bus); s.start(t); s.stop(t+1.2); }
function doorBell(){ if(!AUD.on)return; var ctx=AUD.ctx,t=ctx.currentTime;
  [2100,3150,4600].forEach(function(f,i){ var o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f,t);
    var lfo=ctx.createOscillator(); lfo.frequency.value=7+i*2; var lg=ctx.createGain(); lg.gain.value=18; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+0.9);
    var g=ctx.createGain(); g.gain.setValueAtTime(0.03/(i+1),t); g.gain.exponentialRampToValueAtTime(0.0004,t+0.85);
    o.connect(g); g.connect(AUD.bus); o.start(t); o.stop(t+0.9); }); }
function caster(){ if(!AUD.on)return; var ctx=AUD.ctx,t0=ctx.currentTime;
  for(var i=0;i<6;i++){ var t=t0+i*0.33; var o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(1250+Math.random()*300,t);
    var lfo=ctx.createOscillator(); lfo.frequency.value=22; var lg=ctx.createGain(); lg.gain.value=90; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+0.2);
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.02,t+0.04); g.gain.exponentialRampToValueAtTime(0.0004,t+0.19);
    o.connect(g); g.connect(AUD.bus); o.start(t); o.stop(t+0.2); } }
function thumpOff(){ if(!AUD.on)return; knock(0.13,90); setTimeout(function(){knock(0.11,90);},380); setTimeout(function(){knock(0.08,90);},760);
  setTimeout(function(){ var ctx=AUD.ctx,t=ctx.currentTime; var o=ctx.createOscillator(); o.type="square"; o.frequency.value=900;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.02,t); g.gain.exponentialRampToValueAtTime(0.0004,t+0.05);
    o.connect(g); g.connect(AUD.bus); o.start(t); o.stop(t+0.06); },1150); }
function sound(e){
  if(!AUD.on)return;
  if(e.k==="coin") coinDrop(e.n||8);
  else if(e.k==="changer") changerRefuse();
  else if(e.k==="arrive"||e.k==="leave"||e.k==="outside"||e.k==="backin") doorBell();
  else if(e.k==="balance") thumpOff();
  else if(e.k==="quarter") coinDrop(1);
  else if(e.k==="dry") caster();
}
function syncAudio(){
  if(!AUD.on||!SIM)return;
  var want={},i;
  var ag=0, sp=0, dr=0;
  for(i=0;i<18;i++){ var w=SIM.washers[i];
    if(w.st==="wash"&&ag<5){ want["a"+w.i]={t:"a",rate:1.05+((w.i%5)*0.04)}; ag++; }
    else if(w.st==="spin"&&sp<2){ want["s"+w.i]={t:"s",rpm:w.rpmNow}; sp++; } }
  for(i=0;i<12;i++){ var d=SIM.dryers[i];
    if(d.st==="run"&&dr<4){ want["d"+d.i]={t:"d",wf:Math.min(1,d.water/Math.max(1,d.lb*0.6))}; dr++; } }
  for(var k in AUD.voices){ if(!want[k]){ AUD.voices[k].stop(); delete AUD.voices[k]; } }
  for(var k2 in want){
    var spec=want[k2];
    if(!AUD.voices[k2]){
      if(spec.t==="a") AUD.voices[k2]=Agit(spec.rate);
      else if(spec.t==="s") AUD.voices[k2]=Spin();
      else AUD.voices[k2]=Dryer(spec.wf);
    }
    if(spec.t==="s") AUD.voices[k2].set(spec.rpm);
    if(spec.t==="d"&&AUD.voices[k2].set) AUD.voices[k2].set(spec.wf);
  }
}

/* ============ boot ============ */
var now=Date.now();
var lastT=now;
if(store && store.v===2 && store.words && store.words.length){
  sess=(store.sess||1)+1;
  dropped=store.dropped||0;
  totalWords=store.total||0;
  lastT=store.last||now;
  acc=store.acc||0;
  SIM=store.sim||seedPeople(mkSim());
  pend=(store.pend||[]).map(function(p){return {x:p[0],r:p[1]};});
  var base=store.t0||now;
  var wl=store.words, c=0;
  for(var i=0;i<wl.length;i++){
    var o={x:wl[i][0],t:base+wl[i][1]*1000,s:wl[i][2],r:wl[i][3]};
    off.push(c); c+=o.x.length+1; words.push(o);
  }
  totalChars=c;
  if(!SIM.washers) SIM=seedPeople(mkSim());
  AUD.live=false;
  var gap=Math.max(0,now-lastT+acc);
  var nWords=Math.min(2600,Math.floor(gap/WORD_MS));
  var simMin=Math.min(600,(now-lastT)/60000);
  var stepN=Math.max(1,Math.ceil(simMin/0.5));
  var per=simMin/stepN;
  var wordsPerStep=nWords/stepN;
  var made=0;
  for(var st=0;st<stepN;st++){
    stepSim(SIM,per);
    var target=Math.floor((st+1)*wordsPerStep);
    while(made<target){
      var wt=lastT+ (made+1)*WORD_MS;
      emitOne(Math.min(wt,now-500),sess-1);
      made++;
    }
  }
  while(made<nWords){ emitOne(now-500,sess-1); made++; }
  acc=gap-nWords*WORD_MS; if(acc<0)acc=0; if(acc>WORD_MS)acc=acc%WORD_MS;
  AUD.live=true;
} else {
  SIM=seedPeople(mkSim());
  var t0=now-36*WORD_MS;
  AUD.live=false;
  for(var q=0;q<36;q++){ stepSim(SIM,0.25); emitOne(t0+q*WORD_MS,0); }
  AUD.live=true;
  sess=1;
  acc=0;
}
lastT=now;

function save(){
  try{
    var base=words.length?words[0].t:Date.now();
    var wl=new Array(words.length);
    for(var i=0;i<words.length;i++){ var w=words[i]; wl[i]=[w.x,Math.round((w.t-base)/1000),w.s,w.r]; }
    localStorage.setItem(KEY,JSON.stringify({v:2,sess:sess,t0:base,last:Date.now(),total:totalWords,dropped:dropped,acc:acc,words:wl,pend:pend.map(function(p){return [p.x,p.r];}),sim:SIM}));
  }catch(e){}
}

layout();
scrollX=maxScroll();
window.addEventListener("resize",layout);

/* ============ navigation, sideways only ============ */
window.addEventListener("wheel",function(e){
  e.preventDefault(); initAudio();
  var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  scrollX+=d*1.05; vel=d*0.22; homeAnim=null; clampScroll(); pinned=(scrollX>=maxScroll()-CW*2); dirty=true;
},{passive:false});

var dragging=false,lastPX=0,lastMove=0;
function down(x){ dragging=true; lastPX=x; vel=0; homeAnim=null; initAudio(); }
function move(x){ if(!dragging)return; var dx=x-lastPX; lastPX=x; scrollX-=dx; vel=-dx*0.9; clampScroll(); pinned=(scrollX>=maxScroll()-CW*2); dirty=true; }
function up(){ dragging=false; }
window.addEventListener("pointerdown",function(e){ if(e.target&&e.target.id==="rest")return; down(e.clientX); });
window.addEventListener("pointermove",function(e){ move(e.clientX); });
window.addEventListener("pointerup",up);
window.addEventListener("pointercancel",up);
window.addEventListener("touchstart",function(e){ initAudio(); },{passive:true});
window.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});

var homeAnim=null;
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault(); initAudio(); homeAnim=null;
    var idx=lowerBound(off,scrollX/CW);
    if(e.key==="ArrowRight") idx=Math.min(words.length-1,idx+1); else idx=Math.max(0,idx-1);
    scrollX=off[idx]*CW; clampScroll(); pinned=(scrollX>=maxScroll()-CW*2); dirty=true;
  } else if(e.key==="Home"){
    e.preventDefault(); initAudio();
    var dist=scrollX-minScroll();
    var dur=Math.max(3500,Math.min(22000,dist/1.1));
    homeAnim={from:scrollX,to:minScroll(),t0:performance.now(),dur:dur};
    pinned=false;
  } else if(e.key==="m"||e.key==="M"){
    AUD.muted=!AUD.muted;
    if(AUD.ctx&&AUD.bus) AUD.bus.gain.setTargetAtTime(AUD.muted?0.0001:0.26,AUD.ctx.currentTime,0.4);
  }
});

/* ============ loop ============ */
var lastFrame=performance.now(), lastWear=0, lastSave=0;
function frame(ts){
  var dt=Math.min(120,ts-lastFrame); lastFrame=ts;
  if(homeAnim){
    var k=Math.min(1,(ts-homeAnim.t0)/homeAnim.dur);
    var e2=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    scrollX=homeAnim.from+(homeAnim.to-homeAnim.from)*e2;
    if(k>=1) homeAnim=null;
    dirty=true;
  } else if(!dragging&&Math.abs(vel)>0.05){
    scrollX+=vel; vel*=0.93; clampScroll(); pinned=(scrollX>=maxScroll()-CW*2); dirty=true;
  }
  var nowMs=Date.now();
  var elapsed=nowMs-lastT; lastT=nowMs;
  stepSim(SIM,elapsed/60000);
  acc+=elapsed;
  while(acc>=WORD_MS){
    acc-=WORD_MS;
    var wasPinned=pinned;
    emitOne(nowMs,sess);
    if(wasPinned){ scrollX=maxScroll(); }
    dirty=true;
  }
  clampScroll();
  if(dirty||ts-lastWear>1400){ draw(nowMs); dirty=false; if(ts-lastWear>1400) lastWear=ts; }
  if(ts-lastSave>9000){ save(); lastSave=ts; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });

console.log("the screen on 4 reads clean and passes almost no air, take a fingernail to it");
console.log("arrows move one word, home goes all the way back, m is quiet");
})();
</script>
