  <meta name="outbox-spec-subject" content="The plain physical business of holding a whistled note steady for the compulsory round — that a whistle is a Helmholtz resonator made of a mouth cavity and a tongue and nothing else, so pitch is set by the VOLUME of the cavity and not by lip tension, which is why a whistler flattens by opening the jaw and sharpens by humping the tongue forward, and why swallowing kills a note dead mid-phrase; that the compulsory is thirty seconds of one held tone and the judges score three things separately — pitch drift in cents from the reference, vibrato rate in cycles per second, and vibrato DEPTH, and a whistler with lovely wide vibrato and four cents of drift scores below a dull steady one; that vibrato is diaphragm and not throat, so a throat vibrato reads as a wobble with a hard edge on it and every judge on the table hears it; that the note goes sharp as the mouth dries out, honestly and measurably, roughly two cents a second past the twenty-second mark, which is exactly why the good ones start a hair flat on purpose; that cold air and a cold vestibule make everybody sharp on entry and the reference has to be re-struck between contestants for that reason; that breath support falls off at the end of a long note and the pitch sags with it, so the last four seconds of a thirty-second hold is where the round is actually decided; and the flat arithmetic that a hundred cents is a semitone, the tolerance band is eight cents either side, and eight cents at that pitch is about four and a half hertz — countable as beats against the fork if anybody bothers to count">

<title>Four and a Half Hertz Against the Fork</title>
<!--
  NORTH DAKOTA OPEN WHISTLING CHAMPIONSHIPS — compulsory round, senior division
  union hall vestibule, Fargo · Sunday 10:45 a.m. · fork struck between each contestant

  order   contestant              drift(c)  rate(c/s)  depth(c)   note
  1       Marjorie Halvorsen        +11/-4     5.0        22      cold on entry, pulled it down by 0:03
  2       Duane Skoglund             -5/+9     5.6        15      clean, sagged the last three
  3       Verna Peiper               -6         5.4        17      swallowed at 0:13, no restart allowed
  4       Ellis Brandvold            -9/+4      6.2         6      dull as a plank, best card of the morning
  5       Ruth Ann Sietsema          +19        5.2        33      lovely wide vibrato, four cents adrift, third
  6       Carl Ostenson              -3         6.9        19      throat, not diaphragm — all four judges marked it

  tolerance +/- 8 cents on the reference (B, 987.77 Hz) = about 4.57 Hz = countable beats
  reference re-struck between contestants on account of the cold
  coat check tickets are the blue ones from Castellane's, Vera has the stub book
-->
<style>
  html,body{margin:0;padding:0;background:#e6ddc6;}
  body{-webkit-text-size-adjust:100%;}
  #word{

  #foot{

  #foot a:hover{color:#1d3f8f;border-bottom-color:#1d3f8f;}

<body>
<div class="rule" id="ruleHi"></div>
<div class="rule" id="ruleLo"></div>
<div id="word"><span id="pre"></span><span id="tail"></span><span id="live"></span></div>
<div id="foot">hold any key &middot; up sharp, down flat &nbsp;&nbsp;&middot;&nbsp;&nbsp; <a href="/archive">other mornings on the table</a></div>
<script>
(function(){
"use strict";

/* ---- the fork ---- */
var REF = 987.767;            /* B5 */
var DT  = 1/50;               /* emission rate, samples per second */
var BEND = 70;                /* cents of bend, top of viewport to bottom */
var TOL = 8;                  /* cents either side */
var LADDER = ['oo','o','u','a','e','ee'];  /* low to high */
var GPOS = 3711;              /* fixed, every visit */

/* ---- classes for amplitude ---- */
function lerp(a,b,t){return a+(b-a)*t;}
function hex(r,g,b){function h(n){n=Math.max(0,Math.min(255,Math.round(n)));return (n<16?'0':'')+n.toString(16);}return '#'+h(r)+h(g)+h(b);}
function inkFor(a){
  var t=a/9, r,g,b;
  if(t<0.55){var u=t/0.55; r=lerp(0x8f,0x1d,u); g=lerp(0xa4,0x3f,u); b=lerp(0xcf,0x8f,u);}
  else{var u2=(t-0.55)/0.45; r=lerp(0x1d,0x0f,u2); g=lerp(0x3f,0x20,u2); b=lerp(0x8f,0x50,u2);}
  return hex(r,g,b);
}
var css='';
var WT=[300,300,400,400,400,500,600,700,700,800];
for(var a=0;a<10;a++){
  var fs=(0.70+a*0.078).toFixed(3);
  var stroke = a>=8 ? '-webkit-text-stroke:'+((a-7)*0.18).toFixed(2)+'px currentColor;' : '';
  css += '.a'+a+'{font-size:'+fs+'em;font-weight:'+WT[a]+';color:'+inkFor(a)+';'+stroke+'}';
  css += '.o'+a+'{font-size:'+fs+'em;font-weight:'+WT[a]+';color:#c4331e;'+stroke+'}';
}
css += '.br{font-size:0.76em;font-weight:300;color:#a8b6d8;}';
var st=document.createElement('style'); st.appendChild(document.createTextNode(css)); document.head.appendChild(st);

/* ---- coding: one character per sample ---- */
function mk(inst, centre, amp){
  var q = Math.max(0, Math.min(9, Math.round(amp*9)));
  var b;
  if(amp < 0.13){ b = 6; }
  else { b = Math.floor((inst+22)/26); if(b<0)b=0; if(b>5)b=5; }
  var out = Math.abs(centre) > TOL ? 1 : 0;
  return b + q*7 + out*70;
}
function encode(codes){var s='';for(var i=0;i<codes.length;i++)s+=String.fromCharCode(48+codes[i]);return s;}
function decode(s){var a=[];for(var i=0;i<s.length;i++)a.push(s.charCodeAt(i)-48);return a;}

function runsToHTML(codes, gIndex, startIndex){
  var html='', i=0, ci=startIndex||0;
  while(i<codes.length){
    var c=codes[i], j=i;
    while(j<codes.length && codes[j]===c) j++;
    var n=j-i;
    var x=c%70, out=c>=70, b=x%7, q=(x-b)/7;
    var g = (b===6) ? 'h' : LADDER[b];
    var text=''; for(var k=0;k<n;k++) text+=g;
    var cls = (b===6) ? 'br' : (out?'o':'a')+q;
    if(gIndex>=0 && gIndex>=ci && gIndex<ci+text.length){
      var p=gIndex-ci;
      text = text.slice(0,p)+'G'+text.slice(p+1);
    }
    ci += text.length;
    html += '<span class="'+cls+'">'+text+'</span>';
    i=j;
  }
  return {html:html, chars:ci};
}

/* ---- deterministic morning ---- */
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function simulate(p, rng){
  var out=[], walk=0, walkv=0;
  var n=Math.round(p.dur/DT);
  var attack = p.attack||0.16;
  var supStart = (p.supStart===undefined)?24:p.supStart;
  var supRate  = (p.supRate===undefined)?0.115:p.supRate;
  var supFloor = (p.supFloor===undefined)?0.30:p.supFloor;
  var sagStart = (p.sagStart===undefined)?25.6:p.sagStart;
  var sagK     = (p.sag===undefined)?2.0:p.sag;
  var dry      = (p.dry===undefined)?2.0:p.dry;
  for(var i=0;i<n;i++){
    var t=i*DT;
    var amp = Math.min(1, t/attack);
    if(t>supStart) amp *= Math.max(supFloor, 1-(t-supStart)*supRate);
    if(p.swallow && t>p.swallow) amp *= Math.max(0, 1-(t-p.swallow)/0.07);
    if(t > p.dur-0.30) amp *= Math.max(0,(p.dur-t)/0.30);
    amp *= (p.level||1);

    walkv += (rng()-0.5)*(p.walkAmt||0.4); walkv*=0.955;
    walk += walkv*DT*10; walk*=0.9992;

    var c = p.start + walk + (p.driftBias||0)*t;
    if(t>20) c += dry*(t-20);
    if(t>sagStart) c -= sagK*(t-sagStart)*(t-sagStart);
    if(p.entry) c += p.entry*Math.exp(-t/1.1);

    var ve = (t-(p.vibOn||0.55))/0.7; if(ve<0)ve=0; if(ve>1)ve=1;
    var dep = p.vibDepth*ve*(1 + (t>24 ? (t-24)*0.10 : 0));
    var ph = 2*Math.PI*p.vibRate*t;
    var s = Math.sin(ph);
    var osc = p.throat ? (0.78*(s>0?1:(s<0?-1:0)) + 0.22*s) : s;

    out.push(mk(c+dep*osc, c, amp));
    if(p.swallow && t>p.swallow+0.12) break;
  }
  return out;
}

var CONTESTANTS = [
  {start:-4,  entry:13, vibRate:5.00, vibDepth:22, walkAmt:0.60, dur:30, level:1.00},
  {start:-5,            vibRate:5.60, vibDepth:15, walkAmt:0.50, dur:30, level:0.95},
  {start:-6,            vibRate:5.40, vibDepth:17, walkAmt:0.42, dur:30, level:0.95, swallow:13.4},
  {start:-9,            vibRate:6.20, vibDepth:6.5,walkAmt:0.13, dur:30, level:0.84},
  {start:-2,            vibRate:5.15, vibDepth:33, walkAmt:0.34, dur:30, level:1.00, driftBias:0.42},
  {start:-3,            vibRate:6.90, vibDepth:19, walkAmt:0.40, dur:30, level:0.92, throat:true}
];

var rng = mulberry32(19781029);
var all = [];
function breath(n,q){for(var i=0;i<n;i++) all.push(6 + q*7);}
breath(4,1);
for(var ci=0; ci<CONTESTANTS.length; ci++){
  var ph = simulate(CONTESTANTS[ci], rng);
  for(var z=0; z<ph.length; z++) all.push(ph[z]);
  breath(2 + Math.floor(rng()*5), 1);
}
var built = runsToHTML(all, GPOS, 0);
document.getElementById('pre').innerHTML = built.html;

/* ---- what the visitor left behind, last time and the time before ---- */
var LS='ndowc.compulsory.v1';
var stored='';
try{ stored = localStorage.getItem(LS) || ''; }catch(e){ stored=''; }
if(stored){
  var t2 = runsToHTML(decode(stored), -1, 0);
  document.getElementById('tail').innerHTML = t2.html;
}

/* ---- the tolerance rules, drawn where they honestly fall ---- */
var ruleHi=document.getElementById('ruleHi'), ruleLo=document.getElementById('ruleLo');
function placeRules(){
  var h=window.innerHeight;
  ruleHi.style.top = Math.round(h*(0.5 - TOL/(2*BEND))) + 'px';
  ruleLo.style.top = Math.round(h*(0.5 + TOL/(2*BEND))) + 'px';
}
placeRules();
window.addEventListener('resize', placeRules);
window.addEventListener('orientationchange', function(){setTimeout(placeRules,120);});

/* ---- audio: fork and mouth ---- */
var ctx=null, forkOsc=null, forkOsc2=null, forkGain=null;
var toneOsc=null, toneHarm=null, toneGain=null, harmGain=null, noiseSrc=null, noiseGain=null, noiseBP=null;
function audioUp(){
  if(ctx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ctx = new AC();
  forkGain = ctx.createGain(); forkGain.gain.value=0; forkGain.connect(ctx.destination);
  forkOsc = ctx.createOscillator(); forkOsc.type='sine'; forkOsc.frequency.value=REF;
  forkOsc2 = ctx.createOscillator(); forkOsc2.type='sine'; forkOsc2.frequency.value=REF*2;
  var f2g = ctx.createGain(); f2g.gain.value=0.16;
  forkOsc.connect(forkGain); forkOsc2.connect(f2g); f2g.connect(forkGain);
  forkOsc.start(); forkOsc2.start();

  toneGain = ctx.createGain(); toneGain.gain.value=0; toneGain.connect(ctx.destination);
  toneOsc = ctx.createOscillator(); toneOsc.type='sine'; toneOsc.frequency.value=REF;
  toneOsc.connect(toneGain);
  harmGain = ctx.createGain(); harmGain.gain.value=0.055;
  toneHarm = ctx.createOscillator(); toneHarm.type='triangle'; toneHarm.frequency.value=REF*2;
  toneHarm.connect(harmGain); harmGain.connect(toneGain);
  toneOsc.start(); toneHarm.start();

  var len = Math.floor(ctx.sampleRate*2), buf = ctx.createBuffer(1, len, ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1);
  noiseSrc = ctx.createBufferSource(); noiseSrc.buffer=buf; noiseSrc.loop=true;
  noiseBP = ctx.createBiquadFilter(); noiseBP.type='bandpass'; noiseBP.frequency.value=REF; noiseBP.Q.value=7;
  noiseGain = ctx.createGain(); noiseGain.gain.value=0;
  noiseSrc.connect(noiseBP); noiseBP.connect(noiseGain); noiseGain.connect(ctx.destination);
  noiseSrc.start();
}
function strikeFork(){
  if(!ctx) return;
  var n=ctx.currentTime;
  forkGain.gain.cancelScheduledValues(n);
  forkGain.gain.setValueAtTime(forkGain.gain.value, n);
  forkGain.gain.linearRampToValueAtTime(0.085, n+0.006);
  forkGain.gain.exponentialRampToValueAtTime(0.030, n+0.9);
}
function damper(){
  if(!ctx) return;
  var n=ctx.currentTime;
  forkGain.gain.cancelScheduledValues(n);
  forkGain.gain.setValueAtTime(forkGain.gain.value, n);
  forkGain.gain.linearRampToValueAtTime(0.0001, n+0.35);
}

/* ---- the visitor's thirty seconds ---- */
var holding=false, t0=0, acc=0, bend=0, bendTarget=0, lastFrame=0;
var buffer=[], phraseCodes=[], flushAt=0;
var live=document.getElementById('live');

function pointerToCents(y){
  var h=window.innerHeight||1;
  var f = 0.5 - (y/h);
  return f*2*BEND;
}
function setBendFromY(y){ bendTarget = Math.max(-BEND, Math.min(BEND, pointerToCents(y))); }

function startNote(){
  if(holding) return;
  audioUp();
  if(ctx && ctx.state==='suspended'){ try{ctx.resume();}catch(e){} }
  holding=true; t0=performance.now()/1000; acc=0; lastFrame=t0;
  bend = bendTarget;
  phraseCodes=[];
  strikeFork();
  if(ctx){
    var n=ctx.currentTime;
    toneGain.gain.cancelScheduledValues(n);
    toneGain.gain.setValueAtTime(0.0001,n);
    noiseGain.gain.cancelScheduledValues(n);
    noiseGain.gain.setValueAtTime(0.0001,n);
  }
  requestAnimationFrame(frame);
}
function stopNote(){
  if(!holding) return;
  holding=false;
  for(var i=0;i<4;i++) buffer.push(6 + 1*7);
  flush(true);
  if(ctx){
    var n=ctx.currentTime;
    toneGain.gain.cancelScheduledValues(n);
    toneGain.gain.setValueAtTime(toneGain.gain.value,n);
    toneGain.gain.linearRampToValueAtTime(0.0001,n+0.09);
    noiseGain.gain.cancelScheduledValues(n);
    noiseGain.gain.setValueAtTime(noiseGain.gain.value,n);
    noiseGain.gain.linearRampToValueAtTime(0.0001,n+0.09);
  }
  damper();
  try{
    var add = encode(phraseCodes);
    if(stored.length < 140000){ stored += add; localStorage.setItem(LS, stored); }
  }catch(e){}
  phraseCodes=[];
}

function flush(force){
  if(!buffer.length) return;
  var now=performance.now();
  if(!force && now < flushAt) return;
  flushAt = now + 110;
  var r = runsToHTML(buffer, -1, 0);
  var frag=document.createElement('span');
  frag.innerHTML=r.html;
  while(frag.firstChild) live.appendChild(frag.firstChild);
  for(var i=0;i<buffer.length;i++) phraseCodes.push(buffer[i]);
  buffer.length=0;
  window.scrollTo(0, document.documentElement.scrollHeight);
}

function frame(){
  if(!holding){ return; }
  var now=performance.now()/1000;
  var t = now - t0;
  var dtf = Math.min(0.2, now-lastFrame); lastFrame=now;
  acc += dtf;

  var emit = Math.floor(acc/DT);
  if(emit>8) emit=8;
  acc -= emit*DT;

  var inst=0, cents=0, amp=0;
  for(var i=0;i<emit;i++){
    var tt = t - (emit-1-i)*DT;
    bend += (bendTarget-bend)*0.11;

    amp = Math.min(1, tt/0.16);
    if(tt>24) amp *= Math.max(0.30, 1-(tt-24)*0.115);
    if(tt>29.7) amp *= Math.max(0,(30-tt)/0.30);

    cents = -4 + bend;
    if(tt>20) cents += 2.0*(tt-20);
    if(tt>25.6) cents -= 2.0*(tt-25.6)*(tt-25.6);

    var ve=(tt-0.55)/0.7; if(ve<0)ve=0; if(ve>1)ve=1;
    var dep = 16*ve*(1 + (tt>24 ? (tt-24)*0.12 : 0));
    var rate = 5.5 + 0.18*Math.sin(tt*0.9);
    inst = cents + dep*Math.sin(2*Math.PI*rate*tt);

    buffer.push(mk(inst, cents, amp));
  }

  if(emit>0 && ctx){
    var f = REF*Math.pow(2, inst/1200);
    var n=ctx.currentTime;
    toneOsc.frequency.setTargetAtTime(f, n, 0.012);
    toneHarm.frequency.setTargetAtTime(f*2, n, 0.012);
    noiseBP.frequency.setTargetAtTime(f, n, 0.03);
    toneGain.gain.setTargetAtTime(Math.max(0.0001, amp*0.105), n, 0.02);
    noiseGain.gain.setTargetAtTime(Math.max(0.0001, amp*0.010), n, 0.03);
  }
  flush(false);

  if(t>=30){ stopNote(); return; }
  requestAnimationFrame(frame);
}

/* ---- keys, cursor, and a thumb ---- */
window.addEventListener('keydown', function(e){
  if(e.repeat) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key===' '||e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='PageDown'||e.key==='PageUp') e.preventDefault();
  startNote();
});
window.addEventListener('keyup', function(){ stopNote(); });
window.addEventListener('blur', function(){ stopNote(); });

window.addEventListener('mousemove', function(e){ setBendFromY(e.clientY); }, {passive:true});

var pressTimer=null, touchStartY=0, captured=false;
window.addEventListener('touchstart', function(e){
  if(e.touches.length!==1) return;
  touchStartY = e.touches[0].clientY;
  setBendFromY(touchStartY);
  captured=false;
  pressTimer = setTimeout(function(){
    captured=true;
    document.body.style.touchAction='none';
    startNote();
  }, 240);
}, {passive:true});
window.addEventListener('touchmove', function(e){
  if(!e.touches.length) return;
  var y=e.touches[0].clientY;
  if(!captured){
    if(Math.abs(y-touchStartY)>14 && pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
    return;
  }
  setBendFromY(y);
  if(e.cancelable) e.preventDefault();
}, {passive:false});
function endTouch(){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  if(captured){ captured=false; document.body.style.touchAction=''; stopNote(); }
}
window.addEventListener('touchend', endTouch);
window.addEventListener('touchcancel', endTouch);

/* mouse-hold on desktop works too, for anyone without a keyboard handy */
window.addEventListener('mousedown', function(e){
  if(e.target && e.target.tagName==='A') return;
  setBendFromY(e.clientY); startNote();
});
window.addEventListener('mouseup', function(){ stopNote(); });

if(window.console && console.log){
  console.log('fork: 987.77 Hz. eight cents is 4.57 Hz. that is the beat rate you are listening for — count them against the fork and if you get more than four and a half in a second you are outside the band.');
  console.log('past twenty seconds the mouth dries and you go sharp about two cents a second whether you like it or not. that is why they start a hair flat.');
}
})();
