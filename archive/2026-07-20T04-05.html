  <meta name="outbox-spec-era" content="1893 — a mechanics'-institute open evening at the height of the parlour-science craze, a two-pendulum harmonograph set up on a baize table under a bright work-lamp, a fresh sheet of laid paper pinned under its pen and the weights just set swinging for the crowd. Not a look-back at 'the age of drawing-machines' and not a 'nobody builds these anymore' lament — a live instrument tracing a figure RIGHT NOW, the pen still wet, the swings just beginning to die.">
  <meta name="outbox-spec-format" content="A genuinely generative harmonograph piece filling the whole viewport, seen straight down onto the pinned sheet of paper: a single pen nib rests on the paper, driven by two independent damped pendulums (one swinging the paper's carriage, one swinging the pen-gimbal), and the nib's position each frame is the honest sum of both decaying swings, so it inks a real accreting curve — a rose of overlapping loops that tightens and fades as the pendulums lose energy and finally comes to rest. The piece IS the pen drawing: mostly the sheet, the moving nib, the growing figure, one short changing host-caption, a tiny maker's stamp, and a tiny tally.">
  <meta name="outbox-spec-subject" content="The plain mechanics of a two-pendulum harmonograph and nothing more — how one pendulum sweeps the paper side to side and a second, swinging crosswise, carries the pen, so the nib traces the SUM of two slow decaying swings at once; how two frequencies almost-but-not-quite in step make the loops precess a hair each pass so the figure spirals slowly round on itself instead of retracing, how a clean small-whole-number ratio throws a tidy symmetric rose and a ragged ratio a wandering tangle, and how every line thins and shrinks as the weights run down until the pen coasts to a stop dead-center. Not a metaphor for anything, not sacred geometry, not the music of the spheres — literally two swinging weights, a pen, and the drawing they can't help making together.">
  <meta name="outbox-spec-tone" content="The bright, fast-talking, chuffed patter of a young demonstrator working the machine at the open evening, thrilled every single time the pen draws a fresh figure — 'now WATCH her go round — see how each loop lands just shy of the last? that's the two swings pulling against each other—' egging you to set the weights differently and find a new rose, delighted when a tidy ratio snaps out a clean symmetric bloom, cheerfully unbothered when a ragged one wanders. Present-tense, exclamation-happy, peer-to-peer, all spoken text kept to one short changing caption line at a time — the pen does the rest. Never wistful, never hushed, never mystical, never a life-lesson; there's a machine full of swing on the table and it draws something wonderful and that's the whole point.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Prussian-blue drawing ink (#1d3f6e) tracing live on warm laid drawing-paper cream (#efe4c0), the freshest wet stroke catching a slightly darker saturated blue-black (#122844) and the oldest loops thinned to a pale washed blue-grey (#8fa6bf), with a chip of polished pen-holder brass (#b8892f) at the nib and one touch of vermilion sealing-wax red (#b3352b) held only for the little tally — the exact clean, hard-lit look of fresh harmonograph ink drying on pinned paper under a bench work-lamp, no soft edges on the nib.">
  <meta name="outbox-spec-wildcard" content="The page must carry, and only carry, a single tiny corner stamp declaring itself a numbered plate from a fictional instrument-maker — invent a fresh name (nothing like Millbrook/Whitmore/Riverside, no 'society/club/works-of'), e.g. a made-up firm such as 'TALLASEY & VANE — HARMONOGRAPH No. 3'. Nothing else anywhere on the page names, explains, links, or acknowledges the maker or the plate number; the stamp simply sits in the corner, exactly the same every visit, unremarked.">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Her Draw! — The Two-Pendulum Harmonograph, Live on the Table</title>
<style>
  :root{
    --paper:#efe4c0; --ink:#1d3f6e; --fresh:#122844; --old:#8fa6bf;
    --brass:#b8892f; --wax:#b3352b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{
    font-family:Georgia,"Times New Roman",serif;color:var(--ink);
    /* warm laid drawing-paper: fine vertical laid lines + faint horizontal chain lines */
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(90deg, rgba(29,63,110,.045) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(0deg, rgba(29,63,110,.03) 0 1px, transparent 1px 34px);
    touch-action:none;
  }
  #sheet{position:fixed;inset:0;display:block;cursor:crosshair}
  /* four brass-headed pins in the corners of the pinned sheet */
  .pin{position:fixed;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e7c877, var(--brass) 55%, #6c4f14);
    box-shadow:0 1px 2px rgba(0,0,0,.35);z-index:4}
  .pin.tl{top:16px;left:16px}.pin.tr{top:16px;right:16px}
  .pin.bl{bottom:16px;left:16px}.pin.br{bottom:16px;right:16px}

  #stamp{position:fixed;top:22px;left:26px;z-index:5;
    font:600 10px/1.35 Georgia,serif;letter-spacing:.09em;color:var(--ink);
    opacity:.62;text-transform:uppercase;pointer-events:none;
    border:1px solid rgba(29,63,110,.4);padding:5px 8px;border-radius:2px;
    transform:rotate(-1.5deg)}
  #stamp b{display:block;font-size:11px;letter-spacing:.14em}

  #tally{position:fixed;bottom:20px;right:26px;z-index:5;
    font:600 10px/1.3 Georgia,serif;letter-spacing:.13em;color:var(--wax);
    text-transform:uppercase;text-align:right;pointer-events:none;opacity:.9}

  #caption{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:5;max-width:min(680px,90vw);text-align:center;
    font:italic 17px/1.45 Georgia,serif;color:var(--fresh);
    background:rgba(239,228,192,.72);padding:7px 16px;border-radius:3px;
    text-shadow:0 1px 0 rgba(239,228,192,.9);pointer-events:none;
    transition:opacity .25s}
  #caption b{font-style:normal;color:var(--ink)}
  #caption .r{color:var(--wax);font-style:normal;font-weight:700}

  footer{position:fixed;bottom:20px;left:26px;z-index:5;
    font:11px/1.3 Georgia,serif;opacity:.55}
  footer a{color:var(--ink)}
  @media(max-width:540px){
    #caption{font-size:15px;bottom:64px;max-width:92vw}
    footer{bottom:20px}
    #stamp{top:16px;left:14px}
    .pin{width:10px;height:10px}
  }
</style>
</head>
<body>
  <canvas id="sheet"></canvas>
  <span class="pin tl"></span><span class="pin tr"></span>
  <span class="pin bl"></span><span class="pin br"></span>

  <!-- the whole page names nothing else about this firm; it just sits here -->
  <div id="stamp"><b>Cathro &amp; Pell</b>Harmonograph No.&nbsp;5</div>
  <div id="tally">Sheets traced on this table: 0</div>
  <div id="caption">Setting the weights…</div>
  <footer><a href="/archive">&larr; the other sheets</a></footer>

<script>
(function(){
"use strict";
/* --- Two swinging weights and a pen. That is the whole machine.
   Paper carriage swings side-to-side  -> x
   Pen gimbal swings crosswise         -> y
   Nib = the honest sum, inked frame by frame, coasting to dead centre. --- */

var cv=document.getElementById('sheet'), ctx=cv.getContext('2d');
var capEl=document.getElementById('caption'), tallyEl=document.getElementById('tally');
var W=0,H=0,cx=0,cy=0,scale=1,dpr=Math.min(2,window.devicePixelRatio||1);

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2; scale=0.42*Math.min(W,H);
}
resize(); window.addEventListener('resize',function(){resize();});

/* ---- persistent tally (only ever counts up) ---- */
var KEY='harmonograph_sheets_traced';
var sheets=parseInt(localStorage.getItem(KEY)||'0',10)||0;
function drawTally(){ tallyEl.textContent='Sheets traced on this table: '+sheets; }
drawTally();

/* ---- machine state ---- */
var P={};           // current pendulum params
var path=[];        // accreted nib positions, unit space
var t=0, mode='draw', running=false, counted=false;
var acc=0, last=0, step=0.008, startEnv=1, capTimer=0, capIdx=0;
var ratio=1.5, phase=Math.PI/3, setting=false;

function rnd(a,b){return a+Math.random()*(b-a);}

/* nearest tidy small-whole ratio p:q, q<=5 */
function nearestRatio(r){
  var best={p:1,q:1,val:1,diff:1e9};
  for(var q=1;q<=5;q++){
    var p=Math.max(1,Math.round(r*q));
    var v=p/q, d=Math.abs(r-v);
    if(d<best.diff){best={p:p,q:q,val:v,diff:d};}
  }
  return best;
}
function ratioLabel(r){
  var nr=nearestRatio(r);
  if(nr.diff<0.045) return {tidy:true, txt:nr.p+':'+nr.q};
  return {tidy:false, txt:r.toFixed(2)+':1'};
}

/* build a set of fresh randomised weights around a chosen ratio & phase */
function newParams(r,ph){
  var f1=0.62*rnd(0.92,1.08);
  return {
    f1:f1,
    // a hair off the whole ratio, so every loop lands just shy of the last
    f2:f1*(r)+f1*0.012,
    A1:rnd(0.72,0.95), A2:rnd(0.72,0.95),
    p1:0, p2:ph,
    d1:0.11*rnd(0.85,1.22), d2:0.11*rnd(0.85,1.22),
    ratio:r
  };
}
function nib(pp,tt){
  var e1=Math.exp(-pp.d1*tt), e2=Math.exp(-pp.d2*tt);
  return {
    x: pp.A1*Math.sin(2*Math.PI*pp.f1*tt+pp.p1)*e1,   // paper swing
    y: pp.A2*Math.sin(2*Math.PI*pp.f2*tt+pp.p2)*e2    // pen swing (crosswise)
  };
}
function envelope(pp,tt){
  return Math.max(pp.A1*Math.exp(-pp.d1*tt), pp.A2*Math.exp(-pp.d2*tt));
}

/* precompute a pale ghost of the figure while you're setting the weights */
function ghost(r,ph){
  var pp=newParams(r,ph); pp.d1=0.11; pp.d2=0.11; pp.A1=0.86; pp.A2=0.86;
  var arr=[]; for(var tt=0; tt<34; tt+=0.02){ arr.push(nib(pp,tt)); }
  return arr;
}

/* ---- launch a fresh swing ---- */
function launch(r,ph){
  ratio=r; phase=ph;
  P=newParams(r,ph);
  path=[nib(P,0)]; t=0; acc=0; running=true; counted=false; mode='draw';
  startEnv=envelope(P,0); capTimer=0; capIdx=0;
  var lab=ratioLabel(r);
  setCaption('<b>'+ (lab.tidy?'A clean ':'An off-')+'ratio!</b> <span class="r">'+lab.txt+
    '</span> — '+(lab.tidy?'watch this bloom snap out symmetric!':'here comes a wandering one, a lovely tangle!'));
}
function setCaption(html){ capEl.innerHTML=html; }

/* ---- rendering ---- */
function lerp(a,b,f){return a+(b-a)*f;}
function rgb(a,b,f){return 'rgb('+Math.round(lerp(a[0],b[0],f))+','+Math.round(lerp(a[1],b[1],f))+','+Math.round(lerp(a[2],b[2],f))+')';}
var OLD=[143,166,191], MID=[29,63,110], FRESH=[18,40,68];

function colorFor(fr){ // 0 oldest .. 1 head
  if(fr<0.72) return rgb(OLD,MID,fr/0.72);
  return rgb(MID,FRESH,(fr-0.72)/0.28);
}

function render(){
  ctx.clearRect(0,0,W,H);
  var len=path.length;
  if(len<2){ drawNib(); return; }
  ctx.lineJoin='round'; ctx.lineCap='round';

  if(mode==='preview'){
    ctx.strokeStyle=rgb(OLD,MID,0.25); ctx.lineWidth=1;
    ctx.beginPath();
    for(var i=0;i<len;i++){ var q=path[i]; var X=cx+q.x*scale, Y=cy+q.y*scale; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
    ctx.stroke();
    return;
  }

  var N=Math.min(56,Math.max(6,Math.floor(len/40)));
  for(var b=0;b<N;b++){
    var s=Math.floor(b/N*(len-1));
    var e=Math.floor((b+1)/N*(len-1));
    if(e<=s) continue;
    var fr=(b+0.5)/N;
    ctx.strokeStyle=colorFor(fr);
    ctx.lineWidth=0.7+fr*fr*1.7;
    ctx.beginPath();
    var start=Math.max(0,s-1);
    var p0=path[start]; ctx.moveTo(cx+p0.x*scale, cy+p0.y*scale);
    for(var j=start+1;j<=e;j++){ var p=path[j]; ctx.lineTo(cx+p.x*scale, cy+p.y*scale); }
    ctx.stroke();
  }
  drawNib();
}

function drawNib(){
  if(!path.length) return;
  var h=path[path.length-1];
  var X=cx+h.x*scale, Y=cy+h.y*scale;
  // wet stroke tip
  ctx.beginPath(); ctx.arc(X,Y,2.4,0,7); ctx.fillStyle='#0e2038'; ctx.fill();
  // polished pen-holder brass chip at the nib — hard-lit, no soft edge
  ctx.beginPath(); ctx.arc(X,Y,4.6,0,7);
  ctx.fillStyle='#b8892f'; ctx.fill();
  ctx.beginPath(); ctx.arc(X-1.4,Y-1.4,1.5,0,7);
  ctx.fillStyle='#f0d68a'; ctx.fill();
}

/* ---- running captions ---- */
var lines=[
  "Now WATCH her go round!",
  "See how each loop lands just shy of the last? That's the two swings pulling against each other!",
  "The paper's swinging one way, the pen crosswise — and the nib just <b>adds &rsquo;em up</b>!",
  "Round she goes, precessing a hair every pass — no line ever quite retraces!",
  "Two slow weights, one wet pen — this whole rose is just their sum!"
];
function tickCaption(env){
  var frac=env/startEnv;
  if(frac<0.14){
    setCaption("She's running down now — the lines thin and the loops draw inward toward centre!");
    return;
  }
  capTimer-=0.016;
  if(capTimer<=0){
    setCaption(lines[capIdx%lines.length]);
    capIdx++; capTimer=4.4;
  }
}

/* ---- the loop ---- */
function frame(ts){
  var dt=(ts-last)/1000; if(!last) dt=0; last=ts;
  if(dt>0.05) dt=0.05;

  if(running && mode==='draw'){
    acc+=dt;
    while(acc>=step){
      t+=step; acc-=step;
      path.push(nib(P,t));
      if(path.length>16000){ path.shift(); }
    }
    var env=envelope(P,t);
    if(t>3 && env*scale<1.1){
      running=false; mode='rest';
      if(!counted){
        counted=true; sheets++; localStorage.setItem(KEY,String(sheets)); drawTally();
      }
      var lab=ratioLabel(P.ratio);
      setCaption("And she <b>rests</b> — dead centre! That's a <span class=\"r\">"+lab.txt+
        "</span> figure done. Tap <b>SPACE</b> for a fresh sheet, or drag to set new weights!");
    } else {
      tickCaption(env);
    }
  }
  render();
  requestAnimationFrame(frame);
}

/* ---- pointer: drag to set ratio (x) and phase (y), release to swing ---- */
function evXY(e){
  var r=cv.getBoundingClientRect();
  var px=(e.clientX!=null?e.clientX:(e.touches&&e.touches[0].clientX))-r.left;
  var py=(e.clientY!=null?e.clientY:(e.touches&&e.touches[0].clientY))-r.top;
  return {x:px,y:py};
}
function updateSet(e){
  var p=evXY(e);
  ratio=0.5+Math.max(0,Math.min(1,p.x/W))*2.5;   // 0.5 .. 3.0
  phase=Math.max(0,Math.min(1,p.y/H))*Math.PI;    // 0 .. π
  path=ghost(ratio,phase); mode='preview';
  var lab=ratioLabel(ratio);
  setCaption('Setting the weights: ratio <span class="r">'+lab.txt+'</span>'+
    (lab.tidy?' — tidy!':' — ragged!')+' · phase '+ (phase/Math.PI).toFixed(2)+'π — <b>let go to swing!</b>');
}
cv.addEventListener('pointerdown',function(e){ setting=true; running=false; cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); updateSet(e); });
cv.addEventListener('pointermove',function(e){ if(setting) updateSet(e); });
function endSet(e){ if(!setting) return; setting=false; launch(ratio,phase); }
cv.addEventListener('pointerup',endSet);
cv.addEventListener('pointercancel',endSet);

/* ---- spacebar: pin a fresh clean sheet, new randomised weights ---- */
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){
    e.preventDefault();
    var r=0.5+Math.random()*2.5, ph=Math.random()*Math.PI;
    // nudge toward a tidy ratio half the time so blooms show up often
    if(Math.random()<0.5){ var nr=nearestRatio(r); r=nr.val; }
    launch(r,ph);
  }
});

/* ---- first sheet already swinging when you walk up ---- */
setCaption('Drag across the sheet — <b>sideways for the ratio, up&ndash;down for the phase</b> — then let go and WATCH! (or just tap <b>SPACE</b>)');
launch(1.5, Math.PI/3);
requestAnimationFrame(frame);

/* a fresh figure, every single time — never twice the same */
console.log('%cCathro & Pell — Harmonograph No.5. Two weights, one pen. Drag to set the ratio, tap SPACE for a clean sheet.','color:#1d3f6e;font-family:Georgia');
})();
</script>
