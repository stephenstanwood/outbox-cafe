<title>Big Cup, Small Cup, Base Cup, Spike — the Bench Kendama</title>
<meta name="theme-color" content="#f3e7cc">
<meta name="description" content="A brand-new wooden kendama on a sunny park table. Flick the red ball up and land it: big cup, small cup, base cup, and — if you keep at it — the spike.">
<style>
  :root{
    --cream:#f3e7cc; --red:#c8483c; --honey:#d9b06a; --string:#cbb48e; --walnut:#7a5330;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#553d1f;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:block}
  #label{position:fixed;top:10px;left:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#9a7c46;font-weight:700;opacity:.75;pointer-events:none;z-index:3}
  #voice{position:fixed;top:38px;left:50%;transform:translateX(-50%);z-index:4;
    width:min(560px,92vw);padding:11px 15px;border-radius:14px;
    background:rgba(255,250,238,.82);backdrop-filter:blur(4px);
    box-shadow:0 6px 20px rgba(122,83,48,.16);border:1px solid rgba(122,83,48,.14);
    font-size:15px;line-height:1.42;color:#5a4022;text-align:center;
    transition:opacity .18s ease;pointer-events:none}
  #voice b{color:var(--red)}
  #voice.pulse{animation:pop .34s ease}
  @keyframes pop{0%{transform:translateX(-50%) scale(.97)}45%{transform:translateX(-50%) scale(1.025)}100%{transform:translateX(-50%) scale(1)}}
  figure.snap{position:fixed;top:12px;right:12px;margin:0;width:88px;transform:rotate(4.5deg);z-index:2;
    background:#fff;padding:5px 5px 16px;border-radius:2px;
    box-shadow:0 8px 16px rgba(122,83,48,.22);pointer-events:none;opacity:.94}
  figure.snap img{display:block;width:100%;border-radius:1px}
  figure.snap figcaption{font-size:8px;color:#a58a5c;text-align:center;margin-top:3px;font-style:italic;letter-spacing:.02em}
  footer{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);z-index:4;
    font-size:12.5px;color:#8a6d3e}
  footer a{color:#a15a3d;text-decoration:none;border-bottom:1px dotted #c78c6a}
  footer a:hover{color:var(--red)}
  @media (max-width:560px){
    figure.snap{width:64px}
    #voice{font-size:13.5px;top:34px}
    #label{font-size:10px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="label">the bench kendama</div>
<!-- the drilled hole in the tama is what has to find the point. that's the whole trick, right there. -->
<div id="voice"></div>
<figure class="snap">
  <img loading="lazy"
    src="https://v3b.fal.media/files/b/0aa0c242/qMOLT4tCJyQPa6xcy8uYB.jpg"
    alt="The same kendama an hour ago — glossy red tama, honey-turned ken, the cotton string still smelling of the shop.">
  <figcaption>same one, an hour ago</figcaption>
</figure>
<footer>caught your breath? &nbsp;<a href="/archive">more toys on the bench →</a></footer>

<script>
(function(){
  "use strict";
  var cv=document.getElementById("stage"), ctx=cv.getContext("2d");
  var voiceEl=document.getElementById("voice");
  var PI2=Math.PI*2;
  var COL={cream:"#f3e7cc",red:"#c8483c",redDk:"#a5372d",redLt:"#e37a6c",
           honey:"#d9b06a",honeyLt:"#ecc98a",honeyDk:"#b78d47",
           string:"#cbb48e",walnut:"#7a5330",walnutDk:"#5b2f22"};
  var KEY="outbox_kendama_catches", SPK="outbox_kendama_spikes";
  var catches=+(localStorage.getItem(KEY)||0);

  // ---- world / layout ----
  var W,H,dpr,k;
  var armLen,bigR,smallR,baseR,spikeLen,handleLen,ballR,hw,crossH,spikeCatchR;
  var G,catchVy,maxToss,mercyV,L,restX,restY;
  var kminx,kmaxx,kminy,kmaxy;

  var ken={x:0,y:0}, ptr={x:0,y:0};
  var ball={x:0,y:0,vx:0,vy:0,spin:0,angle:0};
  var state={grabbed:false,seat:null,attempt:false,wentUp:false,ladder:0};
  var hasTossed=false, samples=[];

  function clamp(v,a,b){return v<a?a:v>b?b:v;}

  function layout(){
    k=clamp(Math.min(W,H)/720,0.62,1.35);
    armLen=44*k; bigR=34*k; smallR=24*k; baseR=27*k;
    spikeLen=56*k; handleLen=125*k; ballR=29*k; hw=12*k; crossH=15*k; spikeCatchR=15*k;
    G=1700*k; catchVy=820*k; maxToss=1500*k; mercyV=830*k;
    L=clamp(H*0.26,150,340);
    restX=W/2; restY=clamp(H*0.46, spikeLen+40, H-handleLen-baseR-L-10);
    kminx=armLen+bigR+8; kmaxx=W-armLen-smallR-8;
    kminy=spikeLen+24; kmaxy=H-handleLen-baseR-24;
    if(!hasTossed){ ken.x=restX; ken.y=restY; ball.x=restX; ball.y=restY+L; }
  }
  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    layout();
  }
  window.addEventListener("resize",resize);

  // ---- geometry helpers ----
  function crossOpenY(){ return ken.y - crossH*0.5; }
  function targets(){
    return [
      {kind:"spike", x:ken.x, tipY:ken.y-spikeLen},
      {kind:"big",   x:ken.x-armLen, oy:crossOpenY(), r:bigR},
      {kind:"small", x:ken.x+armLen, oy:crossOpenY(), r:smallR},
      {kind:"base",  x:ken.x, oy:ken.y+handleLen, r:baseR}
    ];
  }
  function seatPos(kind){
    if(kind==="spike") return {x:ken.x, y:(ken.y-spikeLen)+ballR*0.6};
    if(kind==="big")   return {x:ken.x-armLen, y:crossOpenY()-bigR*0.12};
    if(kind==="small") return {x:ken.x+armLen, y:crossOpenY()-smallR*0.12};
    return {x:ken.x, y:(ken.y+handleLen)-baseR*0.12};
  }

  // ---- audio ----
  var AC=null;
  function initAudio(){
    if(AC) { if(AC.state==="suspended") AC.resume(); return; }
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
  }
  function knock(kind){
    if(!AC) return;
    try{
      var t=AC.currentTime, sp=(kind==="spike");
      var o=AC.createOscillator(), g=AC.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(sp?305:200,t);
      o.frequency.exponentialRampToValueAtTime(sp?150:112,t+0.09);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.5,t+0.005);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.15);
      var len=Math.floor(AC.sampleRate*0.03), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      var ns=AC.createBufferSource(); ns.buffer=b;
      var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1600;
      var ng=AC.createGain(); ng.gain.value=0.18;
      ns.connect(bp).connect(ng).connect(AC.destination); ns.start(t);
    }catch(e){}
  }

  // ---- voice ----
  var SPECIAL=[
    "THERE it is — that's the one! That's the whole toy, right there. You got the spike.",
    "SPIKE again! Okay, so that first one wasn't a fluke. I'm officially a little in awe.",
    "Ken sasi, clean — the hole found the point and slid right home. That's beautiful.",
    "That's your spike again. You've properly got the feel now. Look at you go."
  ];
  var PROG=[
    "WHOO — big cup! See? You lifted to meet her, you didn't stab. Now the small cup. Same feel, tinier target.",
    "Ha! Small cup — that's the sticky one, everybody swings wide there. You didn't. Base cup next: let her fall a touch lower and drop her in the bottom.",
    "THAT'S the base cup! Okay, okay — soft hands, you've got soft hands now. Deep breath. Line the ken straight under her and go for the spike."
  ];
  var GENERIC={
    big:["Nice — big cup again. Good, keep that feel warm.","Big cup, easy money. Now try to steer her somewhere smaller."],
    small:["Small cup again — look at that touch.","Ooh, small cup. You make it look tidy."],
    base:["Base cup, clean drop. Lovely.","There's the base again — soft as anything."]
  };
  var MISS=[
    "Ah, that one swung wide — pull her taut and go again, everybody misses.",
    "So close! Lift the cup <b>up</b> to meet her next time, don't stab down.",
    "Haha, she got away — no worries, reel her in and have another.",
    "Almost! Let her come to <i>you</i> — you don't have to chase her."
  ];
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function say(html){
    voiceEl.innerHTML=html;
    voiceEl.classList.remove("pulse"); void voiceEl.offsetWidth; voiceEl.classList.add("pulse");
  }
  say("Oh — you picked one up! Grab the <b>red ball</b>, pull the string taut, and flick it up. "+
      "The one secret: don't stab at it — lift the cup <b>up</b> to meet it as it drops. Let it come to you. "+
      "<span style='opacity:.7'>(Tap <b>space</b> for a free toss straight up.)</span>");

  // ---- catches ----
  function doCatch(kind){
    catches++; try{ localStorage.setItem(KEY,catches); }catch(e){}
    knock(kind);
    state.seat=kind; state.attempt=false; state.wentUp=false;
    ball.vx=ball.vy=0; ball.spin=0;
    if(kind==="spike"){
      var s=(+(localStorage.getItem(SPK)||0))+1;
      try{ localStorage.setItem(SPK,s); }catch(e){}
      if(state.ladder<4) state.ladder=4;
      say(s<=SPECIAL.length ? SPECIAL[s-1]
        : pick(["Spike! Clean as anything.","Ken sasi again — you make it look easy now.","Right on the point. Beautiful."]));
    }else{
      var order=["big","small","base"];
      if(state.ladder<3 && kind===order[state.ladder]){ say(PROG[state.ladder]); state.ladder++; }
      else say(pick(GENERIC[kind]));
    }
  }
  function checkCatch(){
    if(ball.vy<=0) return;
    var ts=targets(), i, t;
    // spike first (only when centered)
    t=ts[0];
    if(Math.abs(ball.x-t.x)<spikeCatchR && ball.vy<catchVy &&
       t.tipY>ball.y-ballR*0.35 && t.tipY<ball.y+ballR*1.15){ doCatch("spike"); return; }
    for(i=1;i<ts.length;i++){
      t=ts[i];
      if(Math.abs(ball.x-t.x)<t.r*0.98 && ball.vy<catchVy &&
         ball.y>t.oy-ballR*1.1 && ball.y<t.oy+ballR*0.7){ doCatch(t.kind); return; }
    }
  }

  // ---- physics ----
  function step(dt){
    if(state.grabbed) return;
    if(state.seat){ var s=seatPos(state.seat); ball.x=s.x; ball.y=s.y; ball.vx=ball.vy=0; return; }
    ball.vy+=G*dt;
    ball.vx*=(1-0.15*dt); ball.vy*=(1-0.02*dt);
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    ball.spin*=(1-0.6*dt); ball.angle+=ball.spin*dt;
    var dx=ball.x-ken.x, dy=ball.y-ken.y, d=Math.hypot(dx,dy);
    if(d>L){
      var nx=dx/d, ny=dy/d;
      ball.x=ken.x+nx*L; ball.y=ken.y+ny*L;
      var vr=ball.vx*nx+ball.vy*ny;
      if(vr>0){ ball.vx-=vr*nx; ball.vy-=vr*ny; }
      ball.vx*=0.997; ball.vy*=0.997;
    }
    checkCatch();
    if(state.attempt && !state.seat){
      if(ball.y<ken.y-2) state.wentUp=true;
      if(state.wentUp && ball.y>ken.y+L*0.8 && Math.abs(ball.vy)<160){
        state.attempt=false; state.wentUp=false;
        if(Math.random()<0.75) say(pick(MISS));
      }
    }
  }

  // ---- input ----
  function pos(e){
    var r=cv.getBoundingClientRect();
    var cx=e.touches?e.touches[0].clientX:e.clientX;
    var cy=e.touches?e.touches[0].clientY:e.clientY;
    return {x:cx-r.left, y:cy-r.top};
  }
  function sample(p){ samples.push({x:p.x,y:p.y,t:performance.now()}); if(samples.length>6) samples.shift(); }
  function releaseVel(){
    if(samples.length<2) return {x:0,y:0};
    var now=performance.now(), a=samples[samples.length-1], b=a;
    for(var i=samples.length-1;i>=0;i--){ if(now-samples[i].t<=90){ b=samples[i]; } else break; }
    var dt=(a.t-b.t)/1000; if(dt<0.008) dt=0.008;
    var vx=(a.x-b.x)/dt, vy=(a.y-b.y)/dt;
    var m=Math.hypot(vx,vy); if(m>maxToss){ vx*=maxToss/m; vy*=maxToss/m; }
    return {x:vx,y:vy};
  }
  function onDown(e){
    initAudio();
    var p=pos(e); ptr=p; samples=[]; sample(p);
    if(Math.hypot(p.x-ball.x,p.y-ball.y)<ballR*2.4){
      state.grabbed=true; state.seat=null;
      ken.x=restX; ken.y=restY;              // clean, centred launch
      ball.x=p.x; ball.y=p.y; ball.vx=ball.vy=0;
    }
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    var p=pos(e); ptr=p; sample(p);
    if(state.grabbed){ ball.x=p.x; ball.y=p.y; }
    if(e.cancelable) e.preventDefault();
  }
  function onUp(e){
    if(state.grabbed){
      state.grabbed=false; hasTossed=true;
      var v=releaseVel();
      ball.vx=v.x; ball.vy=v.y; ball.spin=-v.x*0.02;
      state.attempt=true; state.wentUp=false;
    }
    if(e && e.cancelable) e.preventDefault();
  }
  function mercyToss(){
    initAudio();
    state.grabbed=false; state.seat=null; hasTossed=true;
    ken.x=restX; ken.y=restY;
    ball.x=restX; ball.y=restY+ballR*1.5; ball.vx=0; ball.vy=-mercyV; ball.spin=0;
    state.attempt=true; state.wentUp=false;
  }
  cv.addEventListener("mousedown",onDown);
  window.addEventListener("mousemove",onMove);
  window.addEventListener("mouseup",onUp);
  cv.addEventListener("touchstart",onDown,{passive:false});
  window.addEventListener("touchmove",onMove,{passive:false});
  window.addEventListener("touchend",onUp,{passive:false});
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"||e.key===" "){ e.preventDefault(); mercyToss(); }
  });

  // ---- drawing ----
  function bg(){
    ctx.fillStyle=COL.cream; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W*0.5,H*0.16,10,W*0.5,H*0.16,Math.max(W,H)*0.9);
    g.addColorStop(0,"rgba(255,250,231,0.9)"); g.addColorStop(1,"rgba(233,214,168,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // faint tabletop grain
    ctx.strokeStyle="rgba(178,146,92,0.10)"; ctx.lineWidth=1;
    for(var i=0;i<7;i++){ var yy=H*0.62+i*9; ctx.beginPath(); ctx.moveTo(0,yy);
      ctx.bezierCurveTo(W*0.3,yy-6,W*0.6,yy+7,W,yy-3); ctx.stroke(); }
  }
  function drawString(){
    var ax=ken.x, ay=ken.y, bx=ball.x, by=ball.y;
    var d=Math.hypot(bx-ax,by-ay), sag=Math.max(0,(L-d))*0.42;
    var mx=(ax+bx)/2, my=(ay+by)/2+sag;
    ctx.strokeStyle=COL.string; ctx.lineWidth=Math.max(1.4,2*k); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(mx,my,bx,by); ctx.stroke();
  }
  function cupBody(cx,oy,r){
    var g=ctx.createLinearGradient(cx-r,oy,cx+r,oy);
    g.addColorStop(0,COL.honeyDk); g.addColorStop(0.5,COL.honey); g.addColorStop(1,COL.honeyLt);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(cx,oy+r*0.16,r,r*0.92,0,0,PI2); ctx.fill();
    ctx.fillStyle="rgba(90,55,20,0.34)";
    ctx.beginPath(); ctx.ellipse(cx,oy,r*0.9,r*0.42,0,0,PI2); ctx.fill();
    ctx.strokeStyle=COL.honeyLt; ctx.lineWidth=Math.max(1,1.6*k);
    ctx.beginPath(); ctx.ellipse(cx,oy,r*0.9,r*0.42,0,Math.PI,PI2); ctx.stroke();
  }
  function cupFrontRim(cx,oy,r){
    ctx.strokeStyle=COL.honey; ctx.lineWidth=Math.max(2,3*k);
    ctx.beginPath(); ctx.ellipse(cx,oy,r*0.9,r*0.42,0,0,Math.PI); ctx.stroke();
  }
  function drawKen(){
    var hx=ken.x;
    // handle
    var hg=ctx.createLinearGradient(hx-hw,0,hx+hw,0);
    hg.addColorStop(0,COL.honeyDk); hg.addColorStop(0.45,COL.honeyLt); hg.addColorStop(1,COL.honeyDk);
    ctx.fillStyle=hg;
    roundRect(hx-hw,ken.y-crossH*0.2,hw*2,handleLen+crossH*0.2,hw*0.7); ctx.fill();
    // carved counter along the handle
    ctx.save();
    ctx.translate(hx, ken.y+handleLen-6*k); ctx.rotate(-Math.PI/2);
    ctx.font="700 "+(6.6*k)+"px ui-monospace,Menlo,Consolas,monospace";
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(60,32,20,0.55)";
    ctx.fillText("CATCHES LANDED ON THIS KEN: "+catches, 0, 0);
    ctx.fillStyle="rgba(255,247,225,0.30)";
    ctx.fillText("CATCHES LANDED ON THIS KEN: "+catches, 0.6*k, -0.6*k);
    ctx.restore();
    // base cup at handle bottom
    cupBody(hx, ken.y+handleLen, baseR);
    if(state.seat==="base"){/*ball drawn later, rim after*/}
    // crosspiece bar
    var bg2=ctx.createLinearGradient(0,ken.y-crossH*0.5,0,ken.y+crossH*0.5);
    bg2.addColorStop(0,COL.honeyLt); bg2.addColorStop(1,COL.honeyDk);
    ctx.fillStyle=bg2;
    roundRect(hx-armLen-4*k, ken.y-crossH*0.5, armLen*2+8*k, crossH, crossH*0.4); ctx.fill();
    // spike
    var sy0=ken.y-crossH*0.5;
    var sg=ctx.createLinearGradient(hx-6*k,0,hx+6*k,0);
    sg.addColorStop(0,COL.walnutDk); sg.addColorStop(0.5,"#8f6440"); sg.addColorStop(1,COL.walnutDk);
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.moveTo(hx-6*k,sy0); ctx.lineTo(hx+6*k,sy0);
    ctx.lineTo(hx+1.2*k,ken.y-spikeLen); ctx.lineTo(hx-1.2*k,ken.y-spikeLen); ctx.closePath(); ctx.fill();
    // the two cross cups
    cupBody(hx-armLen, crossOpenY(), bigR);
    cupBody(hx+armLen, crossOpenY(), smallR);
  }
  function drawBall(){
    var r=ballR;
    var g=ctx.createRadialGradient(ball.x-r*0.34,ball.y-r*0.4,r*0.15, ball.x,ball.y,r);
    g.addColorStop(0,COL.redLt); g.addColorStop(0.45,COL.red); g.addColorStop(1,COL.redDk);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,r,0,PI2); ctx.fill();
    // glossy highlight
    ctx.fillStyle="rgba(255,255,255,0.32)";
    ctx.beginPath(); ctx.ellipse(ball.x-r*0.32,ball.y-r*0.36,r*0.28,r*0.16,-0.6,0,PI2); ctx.fill();
    // the drilled hole (rotates with spin)
    var hx=ball.x+Math.sin(ball.angle)*r*0.6, hy=ball.y+Math.cos(ball.angle)*r*0.6;
    var hr=r*0.24;
    var hg=ctx.createRadialGradient(hx,hy,hr*0.2,hx,hy,hr);
    hg.addColorStop(0,"#3a1d12"); hg.addColorStop(1,COL.walnutDk);
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,hr,0,PI2); ctx.fill();
    ctx.strokeStyle="rgba(90,45,30,0.5)"; ctx.lineWidth=1; ctx.stroke();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function draw(){
    bg(); drawString(); drawKen(); drawBall();
    // nestle the ball into whichever cup it's seated in
    if(state.seat==="big")   cupFrontRim(ken.x-armLen,crossOpenY(),bigR);
    else if(state.seat==="small") cupFrontRim(ken.x+armLen,crossOpenY(),smallR);
    else if(state.seat==="base")  cupFrontRim(ken.x,ken.y+handleLen,baseR);
  }

  // ---- loop ----
  var last=performance.now();
  function frame(now){
    var e=Math.min(0.033,(now-last)/1000); last=now;
    if(!state.grabbed && hasTossed){
      var tx=clamp(ptr.x,kminx,kmaxx), ty=clamp(ptr.y,kminy,kmaxy);
      ken.x+=(tx-ken.x)*0.35; ken.y+=(ty-ken.y)*0.35;
    }
    var n=3; for(var i=0;i<n;i++) step(e/n);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

  console.log("%cbig cup · small cup · base cup · spike","color:#c8483c;font-weight:bold;font-size:14px");
  console.log("the fourth catch is the whole toy. keep going. 🔴");
})();
</script>
