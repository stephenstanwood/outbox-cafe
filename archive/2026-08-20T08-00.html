  <meta name="outbox-spec-era" content="Right now — twenty to twelve on a glaring August midday over the parish square at Mqabba, Malta, with the daytime shells going up off the ground battery behind the limestone belfry: no darkness anywhere, forty degrees of sun straight overhead, and colour arriving in the sky as SMOKE rather than as light. Not a festa travelogue, not an outsider's wonder at a foreign festival, and not a look-back at anything — the ground battery is loaded, the midday firing has eleven minutes left in it, and the sky over the square is already getting dirty.">
  <meta name="outbox-spec-format" content="GENERATIVE / CSS ART PIECE — wordless, chrome-less, edge to edge. The entire viewport is one rectangle of hard cobalt Maltese midday sky, with the cut top corner of a limestone belfry and a strip of flat roof parapet along the very bottom edge and NOTHING else: no header, no caption, no counter, no title, no instructions, nothing readable anywhere. The visitor's whole vocabulary is one mortar sat just out of frame at the bottom: press and HOLD anywhere along the lower edge to build lift charge (the mortar's muzzle visibly loads and the hold is felt in the pitch of the launch), drag left or right while holding to tilt the tube, release to fire. A shell climbs on real ballistics trailing a thin grey lift-smoke tail, the time fuse burns on its own honest clock regardless of how high the shell actually got, and then the piece IS the break: a sphere of colour opening in daylight, expanding, shearing, going buoyant, sagging, and dirtying the air it hangs in. Fire fast and the sky fills up with overlapping smoke that never goes away.">
  <meta name="outbox-spec-subject" content="The plain, entirely physical business of making colour appear in a daylight sky — that a night shell is useless at noon because incandescence cannot out-glare the sun, so a daytime shell contains no stars at all but pellets of an organic dye packed round a cool-burning fuel, and the colour is dye VAPORISED and then re-condensed into airborne particulate, which means the pellet must burn cool or the dye chars and every colour on the shell comes out the same brown-black; that daylight colour is therefore particle density and not brightness, and a thin puff reads as grey no matter what dye is in it; that the break must be packed symmetrically round the burster or the sphere opens lopsided and reads as a smear, which is why the pellets go in in concentric layers and the burster goes dead centre; that the break diameter is set by burster charge and the pellets' burn time, not by shell size, so a small shell with a hot burster throws a wide thin ring and a big one with a soft burster makes a tight dense ball; that the time fuse is lit by the lift charge and burns on its own clock, so a weak lift means the shell breaks low and hard and a strong one means it breaks going down; that smoke is buoyant only while hot and starts sinking within seconds of the pellet burning out, which is why a break rises, stalls, and then sags into a hanging curtain; that wind is not one wind but a shear — near-still at the parapet and moving at height, so the top of a break drifts off the bottom of it and a sphere becomes a leaning ellipse inside ten seconds; that smoke colour composites SUBTRACTIVELY in air, so magenta drifting through chrome yellow gives a dirty orange and three colours crossing gives brown, never a fourth bright hue; that the sky over a battery therefore gets measurably filthier all morning and the last shell of a firing is never seen as clean as the first; and the flat arithmetic that light travels the distance instantly and sound does not, so the gap between seeing the break and hearing it is the height of the break divided by three hundred and forty. Literally dye, a burster, hot particulate, buoyancy, and a shear.">
  <meta name="outbox-spec-tone" content="No narrator, no captions, no voice, no text of any kind anywhere on the page. The register lives entirely in the behaviour of the sky, and that register is LOUD, CONCUSSIVE, GLARING and INCREASINGLY FILTHY — flat overhead sun with no shadow modelling in it, whitewashed limestone blowing out at the edges, hard chalky smoke that opens fast and then hangs there sagging and going brown, one crack arriving late after each break and slapping off the belfry a half-beat after that. Everything happens at working speed with a battery still loaded. Explicitly NOT hushed, NOT awed, NOT dreamlike, NOT slow, NOT twinkling, NOT wistful, NOT a spectacle to be marvelled at — this is midday over a working square and the air is getting used up.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Hard scoured cobalt midday sky (#1f5fb4) paling toward a bleached white-blue at the horizon strip (#a9c9e4) and blown-out sun-struck limestone (#efe6d3) with its shaded parapet face in a warm bone-grey (#c4b699) — those two are the whole ground of the piece. The dye smokes are chalky and opaque rather than luminous: festa magenta (#d2247a), chrome yellow (#e8b21c) and a flat viridian (#1c7a63), all composited subtractively so crossings resolve into dirty orange and a real brown-black (#4a3626) and never into a brighter colour. Exactly one chip of grey lift-smoke (#8f8b82) is held strictly for the climb trail and for the permanent haze layer. Flat, hard, high-contrast, no glow, no bloom, no lens flare, no soft edges anywhere — pigment particulate in unfiltered overhead sun.">
  <meta name="outbox-spec-wildcard" content="Exactly one shell per visit — always the fourth one fired, every visit, no matter how it is loaded — is a dud. It climbs normally, the lift smoke reads normally, the fuse time elapses, and then nothing happens: no break, no report, no colour. The shell simply arcs over as a small dark speck, falls, and goes out of frame past the parapet. Nothing on the page marks it, no sound accompanies it, it is never explained, and the fifth shell fires exactly as normal.">
  <meta name="outbox-spec-forbidden" content="NO fireworks-as-metaphor for ephemerality / celebration / joy / 'the beautiful thing that doesn't last' / childhood summer / the-brief-bright-life — it is dye, a burster, hot particulate and a wind shear, and it has nothing to teach anybody. NO awe, NO wonder, NO gasping crowd, NO 'oohs', NO hush-before-the-bang, NO upturned faces. NO night sky of any kind, NO darkness, NO sparkle, NO twinkle, NO glow, NO bloom, NO lens flare — it is noon and nothing in this piece is luminous. NO Mediterranean travelogue, NO exoticising or explaining a Maltese festa to an outsider, NO religious-procession reverence, NO village-characters colour writing. NO nostalgia, NO wistfulness, and NO 'the old pyrotechnicians / nobody makes daytime shells anymore / the factories keep blowing up' decline narrative — the battery is loaded and the midday firing is running. NO danger-porn or disaster foreshadowing about the powder. NO meditative / hypnotic / 'watch the smoke drift and let your mind empty' register — the sky is being wrecked, not soothed. NO sensuous material description of smoke or colour beyond density, hue, buoyancy and how it composites. NO cryptic-SCP or ominous dread about the dud shell. NO archival / museum / cabinet / drawer / relic framing. NO dry deadpan understatement. NO lowercase sentence-fragment minimalism. NO night-shift / dispatcher / desk / 3am voice. NO signal / transmission / frequency / broadcast framing of the reports. NO society / club / guild / cabinet-of-hobbyists scaffolding. And beyond the sky, the belfry corner, the parapet and the smoke, NO instructional UI text, captions, header, footer credits, maker's stamp, tally, title overlay, or narrating voice anywhere on the page — the piece is entirely wordless and entirely visual.">

<body>
<canvas id="sky"></canvas>
<a id="arch" href="/archive" title="the rest of the battery">&#9679;&#9679;&#9679;</a>
<script>
/* pellet = dye + cool fuel. burn it hot and every colour on the shell comes out brown. */
(function(){
"use strict";
var C=document.getElementById('sky'),X=C.getContext('2d');
var W=0,H=0,DPR=1;
// smoke grid
var GS=7; // px per cell at CSS scale
var GW=0,GH=0;
var dM,dY,dV,dK,tempA,hazM,hazY,hazV,hazK,uu,vv,tmp1,tmp2,tmp3,tmp4,tmp5;
var GROUND=0; // y of parapet top in css px
function alloc(){
  GW=Math.max(8,Math.ceil(W/GS));GH=Math.max(8,Math.ceil(H/GS));
  var n=GW*GH;
  dM=new Float32Array(n);dY=new Float32Array(n);dV=new Float32Array(n);dK=new Float32Array(n);
  tempA=new Float32Array(n);
  hazM=new Float32Array(n);hazY=new Float32Array(n);hazV=new Float32Array(n);hazK=new Float32Array(n);
  uu=new Float32Array(n);vv=new Float32Array(n);
  tmp1=new Float32Array(n);tmp2=new Float32Array(n);tmp3=new Float32Array(n);tmp4=new Float32Array(n);tmp5=new Float32Array(n);
  img=X.createImageData(GW,GH);
}
var img=null;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);
  C.style.width=W+'px';C.style.height=H+'px';
  GROUND=H-Math.max(46,H*0.11);
  alloc();
}
window.addEventListener('resize',resize);

/* ---------------- audio ---------------- */
var AC=null,master=null;
function audio(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  return AC;
}
var noiseBuf=null;
function noise(){
  if(noiseBuf)return noiseBuf;
  var n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  noiseBuf=b;return b;
}
function thump(charge){
  if(!audio())return;
  var t=AC.currentTime;
  var s=AC.createBufferSource();s.buffer=noise();s.loop=true;
  var f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(180+charge*260,t);
  f.frequency.exponentialRampToValueAtTime(60,t+0.22);
  var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.35+0.3*charge,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0004,t+0.30);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.34);
  // tube ring pitched by charge
  var o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(70+charge*95,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.18);
  var og=AC.createGain();og.gain.setValueAtTime(0.16+0.14*charge,t);
  og.gain.exponentialRampToValueAtTime(0.0004,t+0.2);
  o.connect(og);og.connect(master);o.start(t);o.stop(t+0.22);
}
function report(delay,size,slapDelay){
  if(!audio())return;
  var t=AC.currentTime+delay;
  function crack(at,amp,lp,dur){
    var s=AC.createBufferSource();s.buffer=noise();s.loop=true;
    var f=AC.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(lp,at);
    f.frequency.exponentialRampToValueAtTime(110,at+dur*0.8);
    var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=45;
    var g=AC.createGain();g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+0.004);
    g.gain.exponentialRampToValueAtTime(0.0003,at+dur);
    s.connect(f);f.connect(hp);hp.connect(g);g.connect(master);
    s.start(at);s.stop(at+dur+0.05);
    var o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(58,at);
    o.frequency.exponentialRampToValueAtTime(31,at+0.25);
    var og=AC.createGain();og.gain.setValueAtTime(amp*0.8,at);
    og.gain.exponentialRampToValueAtTime(0.0003,at+0.3);
    o.connect(og);og.connect(master);o.start(at);o.stop(at+0.32);
  }
  crack(t,0.42*size,2600,0.28);
  crack(t+slapDelay,0.19*size,900,0.34);   // off the belfry
  crack(t+slapDelay*2.6,0.07*size,520,0.4); // across the square
}
function rattle(delay,n){
  if(!audio())return;
  for(var i=0;i<n;i++){
    var t=AC.currentTime+delay+Math.random()*1.5;
    var s=AC.createBufferSource();s.buffer=noise();
    s.playbackRate.value=1.6+Math.random();
    var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1400+Math.random()*2600;f.Q.value=6;
    var g=AC.createGain();g.gain.setValueAtTime(0.05+Math.random()*0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0003,t+0.05);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.07);
  }
}

/* ---------------- physics ---------------- */
var PXM=6.2;               // px per metre (scaled at resize-time by height)
function pxm(){return Math.max(3.2,H/150);}
var G=9.81;
var FUSE=3.05;             // seconds. burns on its own clock.
var shells=[],pellets=[],debris=[];
var fired=0;

function fire(charge,tilt){
  fired++;
  var s=pxm();
  var v=(26+charge*54);                       // m/s, honestly proportional to hold
  var ang=-Math.PI/2 + tilt;                  // radians from +x
  var sh={
    x:muzzleX, y:GROUND+10,
    vx:Math.cos(ang)*v*s, vy:Math.sin(ang)*v*s,
    fuse:FUSE, t:0, dud:(fired===4),
    burster:0.55+Math.random()*0.75,          // hot burster -> wide thin ring
    burn:0.9+Math.random()*1.1,               // pellet burn time -> break diameter
    n:60+Math.floor(Math.random()*31),
    trail:[]
  };
  shells.push(sh);
  thump(charge);
}
var DYE=[0,1,2]; // 0 magenta 1 yellow 2 viridian
function breakShell(sh){
  var s=pxm();
  var n=sh.n;
  // pellets packed in concentric layers round the burster, dye by layer
  var layers=3;
  var base=110+sh.burster*135; // m/s of shell fragments
  for(var i=0;i<n;i++){
    var L=Math.floor(i/(n/layers));
    var idx=i%(n/layers);
    var k=i+0.5;
    var phi=Math.acos(1-2*k/n);
    var th=Math.PI*(1+Math.sqrt(5))*k;
    var sp=(base*(0.62+0.38*(L+1)/layers))*(0.9+Math.random()*0.2);
    var dye=DYE[(L+ (Math.random()<0.14?1:0))%3];
    pellets.push({
      x:sh.x,y:sh.y,
      vx:Math.sin(phi)*Math.cos(th)*sp*s + sh.vx*0.22,
      vy:Math.cos(phi)*sp*s + sh.vy*0.22,
      burn:sh.burn*(0.72+Math.random()*0.56),
      t:0, dye:dye, m:0.5+Math.random()*0.7,
      dead:false
    });
  }
  var dist=Math.max(6,(GROUND-sh.y)/s)+34; // metres from the square
  report(dist/340, Math.min(1.25,0.6+sh.burster*0.55), 0.055+Math.random()*0.02);
  rattle(dist/340+1.6, 10+Math.floor(Math.random()*14));
}

/* smoke deposition */
function deposit(px,py,amt,dye,heat){
  var gx=px/GS,gy=py/GS;
  var i0=Math.floor(gx),j0=Math.floor(gy);
  if(i0<1||j0<1||i0>=GW-2||j0>=GH-2)return;
  var fx=gx-i0,fy=gy-j0;
  var w=[(1-fx)*(1-fy),fx*(1-fy),(1-fx)*fy,fx*fy];
  var ix=[i0,i0+1,i0,i0+1],iy=[j0,j0,j0+1,j0+1];
  for(var k=0;k<4;k++){
    var id=iy[k]*GW+ix[k];
    var a=amt*w[k];
    if(dye===0)dM[id]+=a;else if(dye===1)dY[id]+=a;else if(dye===2)dV[id]+=a;else dK[id]+=a;
    tempA[id]+=heat*w[k];
  }
}

/* advection: semi-lagrangian */
function advect(src,dst,dt){
  for(var j=1;j<GH-1;j++){
    for(var i=1;i<GW-1;i++){
      var id=j*GW+i;
      var x=i-uu[id]*dt/GS, y=j-vv[id]*dt/GS;
      if(x<0.5)x=0.5;if(x>GW-1.5)x=GW-1.5;
      if(y<0.5)y=0.5;if(y>GH-1.5)y=GH-1.5;
      var i0=x|0,j0=y|0,fx=x-i0,fy=y-j0;
      var a=src[j0*GW+i0],b=src[j0*GW+i0+1],c=src[(j0+1)*GW+i0],d=src[(j0+1)*GW+i0+1];
      dst[id]=(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
    }
  }
  // edges
  for(var i2=0;i2<GW;i2++){dst[i2]=dst[GW+i2];dst[(GH-1)*GW+i2]=dst[(GH-2)*GW+i2];}
  for(var j2=0;j2<GH;j2++){dst[j2*GW]=dst[j2*GW+1];dst[j2*GW+GW-1]=dst[j2*GW+GW-2];}
}
function swapInto(a,b){for(var i=0,n=a.length;i<n;i++)a[i]=b[i];}

var windPhase=0;
function stepGrid(dt){
  windPhase+=dt*0.19;
  // velocity field: shear increases with altitude + buoyancy from temperature
  for(var j=0;j<GH;j++){
    var yPx=j*GS;
    var alt=Math.max(0,(GROUND-yPx))/Math.max(1,GROUND); // 0 at parapet, 1 up top
    var shear=(3.0+22.0*alt*alt)*(0.72+0.28*Math.sin(windPhase*0.9+alt*2.2));
    for(var i=0;i<GW;i++){
      var id=j*GW+i;
      var T=tempA[id];
      var dens=dM[id]+dY[id]+dV[id]+dK[id];
      // buoyant only while hot; cools fast, then sinks under its own load
      var buoy=-T*118 + dens*11.5;
      var v=vv[id]*0.90 + buoy*dt;
      if(v>52)v=52;if(v<-190)v=-190;
      vv[id]=v;
      uu[id]=uu[id]*0.90+ (shear + Math.sin(j*0.31+windPhase*1.7+i*0.07)*3.4)*dt*3.2;
      if(uu[id]>150)uu[id]=150;
    }
  }
  // advect
  advect(dM,tmp1,dt);swapInto(dM,tmp1);
  advect(dY,tmp2,dt);swapInto(dY,tmp2);
  advect(dV,tmp3,dt);swapInto(dV,tmp3);
  advect(dK,tmp4,dt);swapInto(dK,tmp4);
  advect(tempA,tmp5,dt);swapInto(tempA,tmp5);
  advect(vv,tmp1,dt);swapInto(vv,tmp1);
  advect(uu,tmp2,dt);swapInto(uu,tmp2);

  // diffuse a little, cool, and fold dissipation into permanent haze
  var kd=Math.min(0.5,dt*3.4);
  var cool=Math.exp(-dt*1.75);
  for(var jj=1;jj<GH-1;jj++){
    for(var ii=1;ii<GW-1;ii++){
      var idx=jj*GW+ii;
      var l=idx-1,r=idx+1,u=idx-GW,d=idx+GW;
      tmp1[idx]=dM[idx]+kd*((dM[l]+dM[r]+dM[u]+dM[d])*0.25-dM[idx]);
      tmp2[idx]=dY[idx]+kd*((dY[l]+dY[r]+dY[u]+dY[d])*0.25-dY[idx]);
      tmp3[idx]=dV[idx]+kd*((dV[l]+dV[r]+dV[u]+dV[d])*0.25-dV[idx]);
      tmp4[idx]=dK[idx]+kd*((dK[l]+dK[r]+dK[u]+dK[d])*0.25-dK[idx]);
    }
  }
  var loss=1-Math.exp(-dt*0.115);
  for(var q=0;q<GW*GH;q++){
    var m=tmp1[q]||0,y=tmp2[q]||0,vr=tmp3[q]||0,kk=tmp4[q]||0;
    // dissipated density is never destroyed — it goes into the haze
    hazM[q]+=m*loss*0.36;hazY[q]+=y*loss*0.36;hazV[q]+=vr*loss*0.36;hazK[q]+=kk*loss*0.42;
    dM[q]=m*(1-loss);dY[q]=y*(1-loss);dV[q]=vr*(1-loss);dK[q]=kk*(1-loss);
    tempA[q]*=cool;
  }
  // haze slowly smears sideways and levels out; it only ever thickens overall
  if(hazeTick++%3===0){
    var hb=Math.min(0.34,dt*3*3);
    for(var j3=1;j3<GH-1;j3++)for(var i3=1;i3<GW-1;i3++){
      var id3=j3*GW+i3;
      hazM[id3]+=hb*((hazM[id3-1]+hazM[id3+1]+hazM[id3-GW]+hazM[id3+GW])*0.25-hazM[id3]);
      hazY[id3]+=hb*((hazY[id3-1]+hazY[id3+1]+hazY[id3-GW]+hazY[id3+GW])*0.25-hazY[id3]);
      hazV[id3]+=hb*((hazV[id3-1]+hazV[id3+1]+hazV[id3-GW]+hazV[id3+GW])*0.25-hazV[id3]);
      hazK[id3]+=hb*((hazK[id3-1]+hazK[id3+1]+hazK[id3-GW]+hazK[id3+GW])*0.25-hazK[id3]);
    }
  }
}
var hazeTick=0;

/* ---------------- render ---------------- */
// subtractive: each dye channel removes light. crossings darken, never brighten.
var ABS=[
  [0.06,0.92,0.52],  // magenta d2247a : eats G, some B
  [0.05,0.34,0.95],  // chrome yellow e8b21c : eats B
  [0.90,0.16,0.55],  // viridian 1c7a63 : eats R
  [0.72,0.74,0.76]   // lift grey 8f8b82 : eats everything a bit
];
function drawSmoke(){
  var data=img.data,p=0;
  for(var j=0;j<GH;j++){
    for(var i=0;i<GW;i++){
      var id=j*GW+i;
      var m=dM[id]+hazM[id]*0.85, y=dY[id]+hazY[id]*0.85, v=dV[id]+hazV[id]*0.85, k=dK[id]+hazK[id];
      var tot=m+y+v+k;
      if(tot<0.0035){data[p+3]=0;p+=4;continue;}
      // Beer-Lambert per channel
      var s=1.05;
      var aR=Math.exp(-(m*ABS[0][0]+y*ABS[1][0]+v*ABS[2][0]+k*ABS[3][0])*s);
      var aG=Math.exp(-(m*ABS[0][1]+y*ABS[1][1]+v*ABS[2][1]+k*ABS[3][1])*s);
      var aB=Math.exp(-(m*ABS[0][2]+y*ABS[1][2]+v*ABS[2][2]+k*ABS[3][2])*s);
      // white chalky particulate base, dyed down by absorption
      var base=232;
      var R=base*aR, Gc=base*aG, B=base*aB;
      // dense cores go toward real brown-black 4a3626
      var deep=Math.min(1,tot*0.16);
      R=R*(1-deep)+74*deep; Gc=Gc*(1-deep)+54*deep; B=B*(1-deep)+38*deep;
      var cov=1-Math.exp(-tot*1.28);
      data[p]=R|0;data[p+1]=Gc|0;data[p+2]=B|0;data[p+3]=(cov*255)|0;
      p+=4;
    }
  }
  X.putImageData(img,0,0);
  // scale up the grid buffer
  X.save();
  X.setTransform(1,0,0,1,0,0);
  X.imageSmoothingEnabled=true;
  X.drawImage(C,0,0,GW,GH,0,0,C.width,C.height);
  X.restore();
}

function skyGrad(){
  var g=X.createLinearGradient(0,0,0,GROUND+8);
  g.addColorStop(0,'#17509f');
  g.addColorStop(0.42,'#1f5fb4');
  g.addColorStop(0.84,'#6f9ccd');
  g.addColorStop(1,'#a9c9e4');
  return g;
}

var muzzleX=0;
function drawArchitecture(){
  // ---- belfry, cut top corner, upper left ----
  var bw=Math.min(W*0.30,240), bx=W*0.045, by=-Math.min(H*0.06,40);
  var bh=H*0.46;
  X.fillStyle='#efe6d3';
  X.beginPath();
  X.moveTo(bx,by);
  X.lineTo(bx+bw,by);
  X.lineTo(bx+bw,by+bh*0.80);
  X.lineTo(bx+bw*0.86,by+bh);      // cut corner
  X.lineTo(bx,by+bh*0.88);
  X.closePath();X.fill();
  // shaded return face, warm bone-grey — flat, no modelling
  X.fillStyle='#c4b699';
  X.beginPath();
  X.moveTo(bx+bw*0.72,by);
  X.lineTo(bx+bw,by);
  X.lineTo(bx+bw,by+bh*0.80);
  X.lineTo(bx+bw*0.86,by+bh);
  X.lineTo(bx+bw*0.72,by+bh*0.93);
  X.closePath();X.fill();
  // louvre opening
  X.fillStyle='#8f8b82';
  var ox=bx+bw*0.20,oy=by+bh*0.34,ow=bw*0.40,oh=bh*0.40;
  X.fillRect(ox,oy,ow,oh);
  X.fillStyle='#c4b699';
  for(var s=0;s<7;s++)X.fillRect(ox,oy+oh*(s+0.15)/7,ow,oh*0.055);
  // cornice band
  X.fillStyle='#c4b699';
  X.fillRect(bx,by+bh*0.235,bw*0.96,Math.max(3,bh*0.022));
  // blown-out sun edge on the lit side
  X.fillStyle='rgba(255,253,246,0.85)';
  X.fillRect(bx,by,Math.max(3,bw*0.035),bh*0.885);
  // finial ball on the cut corner
  X.fillStyle='#efe6d3';
  X.beginPath();X.arc(bx+bw*0.86,by+bh+Math.max(5,bw*0.028),Math.max(4,bw*0.032),0,6.284);X.fill();

  // ---- parapet strip along the very bottom ----
  var ph=H-GROUND;
  X.fillStyle='#c4b699';
  X.fillRect(0,GROUND,W,ph);
  X.fillStyle='#efe6d3';
  X.fillRect(0,GROUND,W,Math.max(5,ph*0.20)); // sun-struck coping
  X.fillStyle='rgba(255,255,250,0.9)';
  X.fillRect(0,GROUND,W,Math.max(2,ph*0.06));
  // coping joints
  X.fillStyle='rgba(143,139,130,0.35)';
  for(var jx=((W*0.5)%74);jx<W;jx+=74)X.fillRect(jx,GROUND,1.5,Math.max(5,ph*0.20));
  // small vent squares in the shaded face
  X.fillStyle='rgba(74,54,38,0.22)';
  for(var vx=W*0.12;vx<W;vx+=W*0.27)X.fillRect(vx,GROUND+ph*0.46,Math.max(8,W*0.02),Math.max(6,ph*0.24));
}

function drawMuzzle(){
  var ph=H-GROUND;
  var len=26+charge*30;
  var ang=-Math.PI/2+tilt;
  X.save();
  X.translate(muzzleX,GROUND+ph*0.44);
  X.rotate(ang+Math.PI/2);
  X.fillStyle='#4a3626';
  X.fillRect(-6,-len,12,len+ph);
  X.fillStyle='#8f8b82';
  X.fillRect(-6,-len,12,4);
  if(holding){
    X.fillStyle='#efe6d3';
    X.fillRect(-3,-len+5,6,Math.max(2,charge*(len-8)));
  }
  X.restore();
}

/* ---------------- loop ---------------- */
var holding=false,charge=0,tilt=0,pressX=0,startX=0;
var lastFireTime=0;
function down(e){
  audio();if(AC&&AC.state==='suspended')AC.resume();
  holding=true;charge=0;
  var x=(e.touches?e.touches[0].clientX:e.clientX);
  startX=x;pressX=x;muzzleX=Math.max(30,Math.min(W-30,x));
  e.preventDefault();
}
function move(e){
  if(!holding)return;
  var x=(e.touches?e.touches[0].clientX:e.clientX);
  pressX=x;
  tilt=Math.max(-0.62,Math.min(0.62,(x-startX)/(W*0.42)*0.62));
  e.preventDefault();
}
function up(e){
  if(!holding)return;
  holding=false;
  fire(Math.max(0.06,charge),tilt);
  charge=0;tilt*=0.0;
  if(e&&e.preventDefault)e.preventDefault();
}
C.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
C.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});
window.addEventListener('touchcancel',up,{passive:false});

var last=performance.now();
function frame(now){
  var dt=Math.min(0.042,(now-last)/1000);last=now;
  if(holding)charge=Math.min(1,charge+dt*0.68);
  var s=pxm();

  // shells
  for(var i=shells.length-1;i>=0;i--){
    var sh=shells[i];
    sh.t+=dt;
    var sp=Math.hypot(sh.vx,sh.vy);
    var drag=0.00042*sp;
    sh.vx-=sh.vx*drag*dt*60/60*1;
    sh.vy-=sh.vy*drag*dt;
    sh.vx-=sh.vx*drag*dt;
    sh.vy+=G*s*dt;
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
    // thin grey lift trail into the grid
    deposit(sh.x,sh.y,0.42*dt*60*0.05,3,0.10*dt*60*0.05);
    sh.trail.push(sh.x,sh.y);if(sh.trail.length>90)sh.trail.splice(0,2);
    if(sh.t>=sh.fuse){
      if(!sh.dud)breakShell(sh);
      else{ debris.push({x:sh.x,y:sh.y,vx:sh.vx*0.9,vy:sh.vy*0.9,dud:true}); }
      shells.splice(i,1);continue;
    }
    if(sh.y>H+120||sh.x<-200||sh.x>W+200)shells.splice(i,1);
  }
  // pellets
  for(var p2=pellets.length-1;p2>=0;p2--){
    var P=pellets[p2];
    P.t+=dt;
    var psp=Math.hypot(P.vx,P.vy);
    var pd=(0.0026/P.m)*psp;
    P.vx-=P.vx*pd*dt;P.vy-=P.vy*pd*dt;
    P.vy+=G*s*dt*(P.t<P.burn?0.42:1.0);
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    if(P.t<P.burn){
      // burns cool: dye vaporises and re-condenses as particulate
      var rate=(1-0.42*(P.t/P.burn))*dt*7.4;
      deposit(P.x,P.y,rate,P.dye,rate*0.62);
    }else{
      P.dead=true;
    }
    if(P.dead||P.y>H+80||P.x<-160||P.x>W+160)pellets.splice(p2,1);
  }
  for(var d2=debris.length-1;d2>=0;d2--){
    var D=debris[d2];D.vy+=G*s*dt;D.x+=D.vx*dt;D.y+=D.vy*dt;
    if(D.y>H+60||D.x<-100||D.x>W+100)debris.splice(d2,1);
  }

  stepGrid(dt);

  // ---- draw ----
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,W,H);
  X.fillStyle=skyGrad();X.fillRect(0,0,W,H);
  // flat bleached band low down — no modelling, just glare
  X.fillStyle='rgba(239,230,211,0.16)';
  X.fillRect(0,GROUND-H*0.10,W,H*0.10);

  drawArchitecture();

  // smoke over sky and stone alike
  X.setTransform(1,0,0,1,0,0);
  drawSmoke();
  X.setTransform(DPR,0,0,DPR,0,0);

  // shells and trails on top of near smoke
  X.lineWidth=1.4;X.strokeStyle='rgba(143,139,130,0.55)';
  for(var t2=0;t2<shells.length;t2++){
    var T=shells[t2].trail;
    if(T.length>3){
      X.beginPath();X.moveTo(T[0],T[1]);
      for(var q2=2;q2<T.length;q2+=2)X.lineTo(T[q2],T[q2+1]);
      X.stroke();
    }
    X.fillStyle='#4a3626';
    X.beginPath();X.arc(shells[t2].x,shells[t2].y,3.1,0,6.284);X.fill();
  }
  for(var d3=0;d3<debris.length;d3++){
    X.fillStyle='#4a3626';
    X.beginPath();X.arc(debris[d3].x,debris[d3].y,2.6,0,6.284);X.fill();
  }
  // spent casings still falling: tiny dark specks
  X.fillStyle='rgba(74,54,38,0.75)';
  for(var pk=0;pk<pellets.length;pk++){
    var PP=pellets[pk];
    if(PP.t>PP.burn*0.86)X.fillRect(PP.x-1,PP.y-1,2,2);
  }

  drawMuzzle();

  requestAnimationFrame(frame);
}

resize();
muzzleX=W*0.56;
// one already in the air when you arrive — the firing is running
setTimeout(function(){
  var sh={x:W*0.62,y:GROUND+8,vx:-24*pxm()*0.28,vy:-62*pxm(),
    fuse:FUSE,t:1.1,dud:false,burster:0.9,burn:1.35,n:74,trail:[]};
  shells.push(sh);
},700);
requestAnimationFrame(frame);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!holding){holding=true;charge=0;muzzleX=W*0.5;startX=W*0.5;audio();if(AC&&AC.state==='suspended')AC.resume();e.preventDefault();}
  if(e.code==='ArrowLeft')tilt=Math.max(-0.62,tilt-0.06);
  if(e.code==='ArrowRight')tilt=Math.min(0.62,tilt+0.06);
});
window.addEventListener('keyup',function(e){if(e.code==='Space'&&holding)up({preventDefault:function(){}});});
})();
/* the grid never zeroes. what leaves the plume is folded into the haze and stays there.
   colour in daylight is particle density, not brightness. a thin puff reads grey
   whatever dye is in it. eleven minutes left. */
</script>
