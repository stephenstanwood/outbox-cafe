  <meta name="outbox-spec-era" content="A blowy, bright late morning in early October 1979, about twenty past eleven, five floors up in a narrow stepped alley in the Quartieri Spagnoli of Naples. Two tall tenement walls stand barely four metres apart, and every pair of facing balconies is joined by a pulley clothesline: a loop of plastic-coated wire running between two cast-iron wheels screwed into the plaster, so whoever is hanging washing can reel the line out across the gap one garment at a time. The sky shows only as a crooked strip of hard blue overhead. A Vespa is revving somewhere below, a radio on the third floor is playing a football phone-in nobody is listening to, and a bank of grey cloud is sliding in from the sea end of the alley. Everybody on this side of the building has been told it will rain by one.">
  <meta name="outbox-spec-format" content="A TINY BROWSER GAME / INTERACTIVE TOY: a real, playable PULLEY-LINE LAUNDRY GAME seen from your own balcony rail, looking straight across the alley at the facing wall. A heaped wicker basket of wet washing sits at the bottom of the screen. Drag a garment up to the near end of the line and drop it, peg it with a click, then crank the pulley wheel (drag in circles, or hold RIGHT) to reel it out across the gap and make room for the next one. The line genuinely sags under wet weight. A heavy bedsheet pulls the middle down toward the neighbour's line below, and anything that touches it gets a whistle. The whole basket has to be out and drying before the clouds reach the strip of sky. When the first drops fall, you crank everything back in, fast.">
  <meta name="outbox-spec-subject" content="One family's Saturday wash against one incoming shower. The basket holds a double bedsheet that weighs as much as a small child, four school shirts, a tablecloth with a wine stain that refused to come out, eleven socks (only ten of them pair up), a pair of grandad's enormous striped pyjamas, a baby's knitted cardigan that must on NO account be pegged by the shoulders, three tea towels and a red football shirt with a number 10 on the back that is somebody's whole personality. The game is the practical puzzle of a shared alley: heavy things go in the middle where the line is strongest, but that is also where it sags lowest. Light things flap and tangle in gusts. Pegs are finite. The line below belongs to the Esposito household, who have hung their whites out first and will not be pleased.">
  <meta name="outbox-spec-tone" content="The loud, gleeful, play-by-play shouting of Signora Assunta Caputo, 61, on the balcony directly opposite, who refereed regional women's volleyball for twenty-two years and still has the whistle on a cord round her neck. She has decided your washing is the match of the day. Her calls pop up as chalky speech balloons from her window with a sharp synthesised whistle blast: 'FAULT! Sock on the Esposito line! Point to the Espositos!', 'Beautiful peg. Textbook. Again.', 'The sheet in the MIDDLE? Brave. Very brave. I respect it.' She gives you points, docks you points, calls 'TIME OUT' when you leave the basket alone too long, and announces the score to the whole alley. She is fiercely on your side and also completely impartial, cheers every clean reel-out, and turns into a hoarse, delighted commentator when the rain comes ('IT'S COMING, IT'S COMING, PULL, PULL, PULL!'). Warm, bossy, theatrical and never mean.">

  <meta name="outbox-spec-wildcard" content="Every so often, a wicker basket on a long string is lowered down past your balcony from the fifth floor above, with coins in it and a scrap of paper reading '1 LOAF + 2 LEMONS'. It is plainly meant for the shop downstairs and has nothing to do with you. If you drag the odd unpaired eleventh sock into it before it is hauled back up, it vanishes upward. On your next visit, the basket comes down again with the sock's partner in it, and a note: 'FOUND IT. YOURS?' Assunta treats this as the greatest play of the season. Nothing on the page explains any of it.">

<h1>Rain by One</h1>
<p class="s">Drag washing from the basket up to the line and let go. Heavy things sag. The Espositos' whites are right below. Click a garment to bring it in. R reels everything in, slowly.</p>

<script>
(function(){
var C=document.getElementById('c'),X=C.getContext('2d'),W=800,H=560;X.scale(2,2);
var BL='#2448c8',OCH='#f0d6a0',balloon=document.getElementById('balloon');

// audio
var AC=null,master=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function whistle(){var a=ac();if(!a)return;var t=a.currentTime,o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),g=a.createGain();

g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.setValueAtTime(.12,t+.3);g.gain.linearRampToValueAtTime(0,t+.38);

g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.07);}
var rainNode=null;

s.connect(f);f.connect(g);g.connect(a.destination);s.start();g.gain.linearRampToValueAtTime(.1,a.currentTime+6);rainNode=g;}
// speech
var bt=0;
function say(t,w){balloon.textContent=t;balloon.style.opacity=1;bt=3.8;if(w)whistle();}
var P=[
{k:'sheet',w:150,h:110,wt:8,n:1},{k:'shirt',w:50,h:56,wt:1.6,n:4},{k:'cloth',w:100,h:80,wt:4,n:1},{k:'pj',w:64,h:100,wt:4,n:1},
{k:'card',w:38,h:40,wt:1,n:1},{k:'tea',w:36,h:50,wt:.9,n:3},{k:'foot',w:56,h:62,wt:2,n:1},{k:'sock',w:14,h:30,wt:.5,n:3}];
var G=[],S={};
function lerp(a,b,t){return a+(b-a)*t;}
function init(){G=[];P.forEach(function(p){for(var i=0;i<p.n;i++)G.push({k:p.k,w:p.w,h:p.h,wt:p.wt,loc:'b',x:0,wet:1,ph:Math.random()*6,fault:false,bx:0,by:0,done:false});});
G.forEach(function(g,i){g.bx=100+(i%7)*100;g.by=452+Math.floor(i/7)*52;});
S={score:0,pegs:24,t:0,clean:0,faults:0,saved:0,rain:false,rt:0,end:false,idle:0,drag:null,reel:0,gust:0};
say('Match day! Pick up the sheet. No, the other thing. No, the sheet.',true);}
var N=40,nx=[],ny=[],ox=[],oy=[],load=[],LY=120,restBase=17.5,rest=17.5;
for(var i=0;i<N;i++){nx.push(60+i*680/39);ny.push(LY);ox.push(nx[i]);oy.push(LY);load.push(0);}
function lineY(x){var f=(x-60)/680*(N-1);f=Math.max(0,Math.min(N-1.001,f));var i=Math.floor(f),r=f-i;return lerp(ny[i],ny[i+1],r);}

function physics(dt){
var tw=0;load.fill(0);
G.forEach(function(g){if(g.loc!=='l')return;var w=g.wt*(.4+.6*g.wet);tw+=w;var f=(g.x-60)/680*(N-1),i=Math.max(1,Math.min(N-3,Math.floor(f))),r=f-i;load[i]+=w*(1-r);load[i+1]+=w*r;});
rest=lerp(rest,restBase*(1+.0008*tw),.05);
for(var i=1;i<N-1;i++){var vy=(ny[i]-oy[i])*.97,vx=(nx[i]-ox[i])*.97;ox[i]=nx[i];oy[i]=ny[i];nx[i]+=vx;ny[i]+=vy+.18+load[i]*.012;}
for(var it=0;it<14;it++){ny[0]=LY;nx[0]=60;ny[N-1]=LY;nx[N-1]=740;
for(var i=0;i<N-1;i++){var dx=nx[i+1]-nx[i],dy=ny[i+1]-ny[i],d=Math.sqrt(dx*dx+dy*dy)||1,df=(d-rest)/d*.5;
var a=(i===0)?0:1,b=(i+1===N-1)?0:1;if(a&&b){nx[i]+=dx*df;ny[i]+=dy*df;nx[i+1]-=dx*df;ny[i+1]-=dy*df;}
else if(b){nx[i+1]-=dx*df*2;ny[i+1]-=dy*df*2;}else if(a){nx[i]+=dx*df*2;ny[i]+=dy*df*2;}}}
}
function rect(g){var y=lineY(g.x);return{y:y,b:y+g.h};}
function game(dt){
if(S.end)return;S.t+=dt;S.idle+=dt;bt-=dt;if(bt<=0)balloon.style.opacity=0;

G.forEach(function(g){if(g.loc!=='l')return;

say(g.k==='sock'?'FAULT! Sock on the Esposito line! Point to the Espositos!':g.k==='sheet'?'FAULT! The sheet is in their whites! Point Espositos!':'FAULT! Touching the Esposito line! Minus five!',false);}
if(!hit)g.fault=false;
// tangle
G.forEach(function(h){if(h!==g&&h.loc==='l'&&g.id!==h.id&&Math.abs(h.x-g.x)<(h.w+g.w)/2-6&&!g.tang&&!h.tang){g.tang=h.tang=true;S.score-=3;say('TANGLE! Two garments, one hug. Minus three!',true);}});
});
G.forEach(function(g){if(g.loc==='l'&&g.tang){var tt=false;G.forEach(function(h){if(h!==g&&h.loc==='l'&&Math.abs(h.x-g.x)<(h.w+g.w)/2-6)tt=true;});if(!tt)g.tang=false;}});
if(S.reel>0){S.reel-=dt;if(S.reel<=0){var best=null;G.forEach(function(g){if(g.loc==='l'&&(!best||Math.abs(g.x-60)<Math.abs(best.x-60)))best=g;});if(best){bring(best);S.reel=.45;}}}

else if(!S.rain&&S.t>130&&!S.warned){S.warned=1;say('Look at that sky! Clouds in the strip! Eleven minutes of sun, maybe less!',true);}
if(S.rain)S.rt+=dt;
if(!S.rain&&S.idle>16){S.idle=0;say('TIME OUT! The basket is just sitting there!',true);}
var out=G.filter(function(g){return g.loc==='l'}).length,inb=G.filter(function(g){return g.loc==='b'}).length;
if(S.rain&&(out===0&&!S.drag||S.rt>50)){finish(inb);}

}
function bring(g){var dry=g.wet<.45;g.loc='b';S.pegs++;if(S.rain||g.wet<.45){if(dry){S.score+=15;S.saved++;say('Rescued DRY! Fifteen points! Look at that!',true);}else if(S.rain)say('In! Wet, but in. Next!',false);}

function pos(e){var r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}

else if(g.k==='foot')say('Number ten! Somebody\'s whole personality! Ten points!',true);
else say(['Beautiful peg. Textbook. Again.','Clean peg! Ten points!','That is how it is done. Again.','Nice reel-out! The alley approves!'][S.clean%4],true);}
}else{g.loc='b';say('Out of bounds! Drop it at the line, not in the air!',false);}
});

// drawing

X.restore();}
function peg(x,y){X.fillStyle=BL;X.fillRect(x-3,y-8,6,13);X.fillStyle=OCH;X.fillRect(x-.8,y-6,1.6,8);}
function draw(){
X.clearRect(0,0,W,H);X.fillStyle=OCH;X.fillRect(0,0,W,H);
// tufa speckle blocks
X.strokeStyle='rgba(36,72,200,.12)';X.lineWidth=1;
for(var r=0;r<12;r++)for(var c=0;c<9;c++){var bx=c*96+(r%2?48:0)-20,by=44+r*40;X.strokeRect(bx,by,96,40);}

var p=S.rain?1:Math.min(1,S.t/150);
X.fillStyle=BL;X.beginPath();X.moveTo(0,0);X.lineTo(W,0);X.lineTo(W,26);X.lineTo(420,44);X.lineTo(0,34);X.closePath();X.fill();
X.fillStyle='#142a80';X.beginPath();var cx=W*(1-p*1.05);X.moveTo(W,0);X.lineTo(cx,0);X.bezierCurveTo(cx-20,12,cx+20,20,cx+8,34);X.lineTo(W,26);X.fill();
// Assunta window
X.fillStyle='#f6e6c0';X.strokeStyle=BL;X.lineWidth=3;X.fillRect(350,58,100,56);X.strokeRect(350,58,100,56);
X.fillStyle=BL;X.fillRect(360,70,80,44);X.fillStyle=OCH;X.beginPath();X.arc(400,92,12,0,6.3);X.fill();X.strokeStyle=BL;X.stroke();
X.beginPath();X.moveTo(400,104);X.lineTo(400,116);X.lineWidth=2;X.stroke();X.fillStyle=BL;X.fillRect(392,97,16,3);
X.beginPath();X.arc(400,110,3,0,6.3);X.fill();
// shutter tally
X.fillStyle='#e6c88a';X.fillRect(455,58,60,56);X.strokeRect(455,58,60,56);X.strokeStyle=BL;X.lineWidth=1.6;
var tk=Math.min(S.clean,20);for(var i=0;i<tk;i++){var gx=462+Math.floor(i/5)*13,k=i%5;X.beginPath();if(k<4){X.moveTo(gx+k*2.4,64);X.lineTo(gx+k*2.4,80);}else{X.moveTo(gx-1,78);X.lineTo(gx+10,66);}X.stroke();}
for(var i=0;i<Math.min(S.faults,10);i++){X.beginPath();X.moveTo(462+i*5,90);X.lineTo(466+i*5,100);X.stroke();}
// neighbour line & whites
X.strokeStyle=BL;X.lineWidth=1.6;X.beginPath();for(var x=0;x<=W;x+=20){var y=nbY(Math.max(60,Math.min(740,x)));if(x===0)X.moveTo(x,y);else X.lineTo(x,y);}X.stroke();
var wd=S.gust||0;
whites.forEach(function(w,i){var y=nbY(w.x),sw=Math.sin(S.t*2+i)*wd*4;X.save();X.translate(w.x,y);X.transform(1,0,sw/w.h,1,0,0);X.fillStyle='#f8ebc8';X.strokeStyle=BL;X.lineWidth=1.6;X.fillRect(-w.w/2,0,w.w,w.h);X.strokeRect(-w.w/2,0,w.w,w.h);X.restore();});
// our line
X.strokeStyle=BL;X.lineWidth=2.2;X.beginPath();X.moveTo(nx[0],ny[0]);for(var i=1;i<N;i++)X.lineTo(nx[i],ny[i]);X.stroke();
[60,740].forEach(function(x){X.beginPath();X.arc(x,LY,13,0,6.3);X.fillStyle=OCH;X.fill();X.lineWidth=3;X.stroke();X.beginPath();X.moveTo(x-11,LY);X.lineTo(x+11,LY);X.moveTo(x,LY-11);X.lineTo(x,LY+11);X.lineWidth=1.5;X.stroke();});
// garments on line
G.forEach(function(g){if(g.loc!=='l')return;var y=lineY(g.x),sw=Math.sin(S.t*3+g.ph)*(S.gust)*(18/(g.wt+2));garment(g,g.x,y,1,sw);peg(g.x-g.w*.3,y);peg(g.x+g.w*.3,y);
if(g.fault){X.fillStyle=BL;X.font='bold 14px sans-serif';X.textAlign='center';X.fillText('FAULT',g.x,y-12);}});
// rail
X.fillStyle=OCH;X.fillRect(0,408,W,18);X.strokeStyle=BL;X.lineWidth=3;X.strokeRect(-2,408,W+4,18);
for(var x=10;x<W;x+=40){X.beginPath();X.moveTo(x,426);X.lineTo(x,448);X.lineWidth=2;X.stroke();}
// basket
X.fillStyle='#e6c88a';X.fillRect(40,438,720,122);X.strokeStyle=BL;X.lineWidth=2;X.strokeRect(40,438,720,122);X.globalAlpha=.3;for(var y=446;y<560;y+=10){X.beginPath();X.moveTo(40,y);X.lineTo(760,y);X.stroke();}X.globalAlpha=1;
G.forEach(function(g){if(g.loc==='b')garment(g,g.bx,g.by,.4,0);});
// dragged
if(S.drag){garment(S.drag,S.drag.dx,S.drag.dy-S.drag.h/2,1,0);}
// rain
if(S.rain){X.fillStyle='rgba(20,40,130,.14)';X.fillRect(0,0,W,H);X.strokeStyle='rgba(36,72,200,.7)';X.lineWidth=1.3;for(var i=0;i<90;i++){var rx=(i*97+S.t*260)%W,ry=((i*53)+S.t*620)%H;X.beginPath();X.moveTo(rx,ry);X.lineTo(rx-4,ry+12);X.stroke();}}
}
var last=performance.now();
function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;game(dt);draw();
document.getElementById('sc').textContent='Score '+S.score;document.getElementById('pg').textContent='Pegs '+S.pegs;
document.getElementById('tm').textContent=S.rain?'RAIN! '+Math.max(0,Math.ceil(50-S.rt))+'s':'Clouds in '+Math.max(0,Math.ceil(150-S.t))+'s';
requestAnimationFrame(loop);}
init();requestAnimationFrame(loop);
})();
</script>
