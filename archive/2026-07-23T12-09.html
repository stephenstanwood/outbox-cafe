  <meta name="outbox-spec-era" content="A bright kitchen windowsill at midday, right now — a tall corked glass bottle of water stood in the sun, a little brass diver bobbing just under the surface, the whole thing being squeezed and eased and squeezed again THIS minute. Not a look-back at parlour science or a 'nobody plays with these anymore' lament — a real diver actually sinking and rising in the bottle right now, the water still trembling from the last squeeze.">
  <meta name="outbox-spec-format" content="The whole viewport IS a tall water-filled bottle stood on a sunny windowsill, seen straight on, edge to edge — and inside it a GENUINELY functional Cartesian-diver buoyancy sim: a small brass diver with a trapped pocket of air and a little hook hangs in the water, and pressing-and-holding anywhere on the bottle raises the internal pressure, compressing that air pocket so the diver's density climbs and it sinks under honest damped vertical physics; ease the press and the air springs back and it rises; a light, steady press holds it hovering mid-water. On the sandy floor sit a few pearls in open oyster shells — you sink the diver, hover it dead over a shell, hold steady till the hook takes a pearl, then ease up SLOWLY to float it to the surface tray; too fast a rise or a knock and the pearl slips back down. No browser chrome, no header, no menu — just the bottle, the water, the diver, and the press of your hand on the glass.">
  <meta name="outbox-spec-subject" content="The plain, entirely practical physics of a Cartesian diver — how squeezing the sealed bottle nudges the water pressure up, which squashes the little bubble of trapped air inside the diver smaller, which cuts its buoyancy until the whole diver is a hair denser than the water and quietly sinks; how easing off lets the bubble spring back to size so the buoyancy returns and up it climbs; the knack of pressing JUST enough to make it hang stock-still mid-water instead of plunging or bobbing, and the slow, steady hand it takes to lift a pearl off the sand and coax it to the top without the hook shrugging it loose. Not a metaphor for anything, not the soul rising and sinking, not what floats and what drowns — literally air, water, brass, a corked bottle, and the honest way a squeezed bubble changes its mind about floating.">
  <meta name="outbox-spec-tone" content="The bright, absorbed, half-to-itself running commentary of someone who's just properly got the knack and cannot put the bottle down — murmuring each move as it happens ('squeeze... down he goes... ease off — up he comes — no no, HOLD it there, hover him right over the shell...'), catching its breath when a pearl takes the hook, groaning cheerfully when one slips ('ahh — too quick, too quick, back down he drops'), quietly chuffed each time one rides all the way to the top. Playing alongside you, present-tense, warm and a bit obsessive, talking to the diver as much as to anyone. Never a carnival-barker showman egging you on, never wistful, never a life-lesson — just a person delighted by a squeezed bubble doing exactly what it must.">

  <meta name="outbox-spec-wildcard" content="Half-buried in the sand at the bottom, always at the same fixed spot, sits a single small tarnished brass thimble that is not a pearl and cannot be brought up: hover the diver perfectly over it, take your steadiest hold, ease up slow as you like, and the hook always slides off its smooth rim at the last instant and lets it settle back into the sand. It is never labelled, never explained, never counted or treated any differently by the sim; it is simply the one thing on the bottom that will not come up, the same lost thimble every single visit, for whoever keeps trying for it.">

<title>The Little Brass Diver Won't Sit Still</title>
<!-- a corked bottle, water, a squeezed bubble that keeps changing its mind about floating. press gently. -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1c5a52;
    font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block;position:fixed;inset:0;}
  .ov{position:fixed;pointer-events:none;color:#f4efe2;
    text-shadow:0 1px 3px rgba(12,40,36,.85), 0 0 10px rgba(12,40,36,.5);}
  #msg{left:50%;bottom:64px;transform:translateX(-50%);
    width:min(90vw,640px);text-align:center;font-size:clamp(15px,4.2vw,21px);
    font-style:italic;letter-spacing:.2px;line-height:1.35;
    transition:opacity .5s ease;opacity:.94;}
  #hint{left:50%;top:44%;transform:translate(-50%,-50%);
    text-align:center;font-size:clamp(13px,3.6vw,17px);
    font-style:italic;opacity:.85;transition:opacity 1.2s ease;
    background:rgba(20,70,64,.35);padding:.7em 1.1em;border-radius:20px;
    backdrop-filter:blur(1px);}
  #tally{left:12px;bottom:12px;font-size:10px;line-height:1.5;
    letter-spacing:.6px;opacity:.72;font-family:Georgia,serif;
    text-transform:uppercase;}
  #tally b{font-weight:normal;color:#f7ecc8;}
  #foot{right:12px;bottom:12px;font-size:11px;font-style:italic;
    opacity:.7;pointer-events:auto;}
  #foot a{color:#f4efe2;text-decoration:none;border-bottom:1px dotted rgba(244,239,226,.55);}
  #foot a:hover{opacity:1;border-bottom-color:#f7ecc8;}
</style>

<body>
<canvas id="c"></canvas>
<div id="msg" class="ov">sun's right through the glass. give him a squeeze.</div>
<div id="hint" class="ov">press &amp; hold anywhere on the glass — down he sinks.<br>ease off and up he comes. hold light to hover.</div>
<div id="tally" class="ov">
  Pearls brought up from this bottle: <b id="pc">0</b><br>
  Steadiest hover (seconds held): <b id="hc">0.0</b>
</div>
<div id="foot" class="ov"><a href="/archive">other things left on the sill →</a></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

// ---- physics constants (Boyle's law bubble in a squeezed bottle) ----
var P0=1, V0=0.60, SOLID=0.50, BASE_MASS=1.02, PEARL_MASS=0.035;
var PMAX=0.9, UP_RATE=0.35, DOWN_RATE=0.5;
var FORCE=8, DRAG_L=1.2, DRAG_Q=4.0;
var SAFE_RISE=0.14;           // faster than this while carrying -> pearl slips
var FLOOR_D=0.90, TOP_D=0.02;

// ---- state ----
var d=0.03, vd=0, nx=0.5, targetNx=0.5, prevNx=0.5, hSpeed=0;
var pressure=0, pressing=false, ptrX=0, ptrY=0;
var carrying=null;            // {item, isThimble, pickupDepth}
var dwell=0, hoverT=0, prevD=d, prevPhase='', lastMsg=0, wobble=0;
var shells=[{nx:0.22,present:true},{nx:0.44,present:true},{nx:0.78,present:true}];
var thimble={nx:0.62,present:true,isThimble:true};
var trayPearls=0;

var PEARLS=parseInt(localStorage.getItem('cd_pearls')||'0',10)||0;
var BESTHOV=parseFloat(localStorage.getItem('cd_hover')||'0')||0;
document.getElementById('pc').textContent=PEARLS;
document.getElementById('hc').textContent=BESTHOV.toFixed(1);

// motes drifting in the water
var motes=[]; for(var i=0;i<16;i++){motes.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.004,vy:-Math.random()*.006-.001});}

// ---- audio ----
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,dur,type,g){ var a=ac(); if(!a)return;
  var o=a.createOscillator(), gn=a.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  gn.gain.setValueAtTime(0,a.currentTime);
  gn.gain.linearRampToValueAtTime(g||0.12,a.currentTime+0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur+0.02);
}
var plip=function(){tone(620,0.12,'sine',0.10);};
var tink=function(){tone(940,0.18,'sine',0.12); tone(1240,0.13,'sine',0.05);};
var tap =function(){tone(300,0.16,'triangle',0.13); tone(180,0.20,'sine',0.06);};

// ---- messages ----
var MSG=document.getElementById('msg');
function say(t){ MSG.textContent=t; MSG.style.opacity='0'; requestAnimationFrame(function(){MSG.style.opacity='.94';}); lastMsg=performance.now(); }
var phaseLine={
  down:"squeeze… and down he goes.",
  up:"ease off — and up he comes.",
  hold:"there — hold him — hang steady…",
  carryDown:"careful now, don't jog her.",
  carryUp:"up you come — slow — sloooow…",
  carryHold:"steady, steady, keep her level."
};
var idle=["little diver, just hanging there.","water's still trembling from that last squeeze.","one more, go on.","sun rakes right across the wet glass.","he can't make his mind up, can he.","press just a whisker and he holds."];

// ---- input ----
function setPtr(e){ var r=cv.getBoundingClientRect(); var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; var cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  ptrX=cx; ptrY=cy; var m=W*0.12; targetNx=Math.max(0,Math.min(1,(cx-m)/(W-2*m))); }
window.addEventListener('pointerdown',function(e){ if(e.target&&e.target.closest&&e.target.closest('a'))return; ac(); pressing=true; setPtr(e); wobble=1; e.preventDefault(); },{passive:false});
window.addEventListener('pointermove',function(e){ if(pressing||e.buttons){ setPtr(e); } else { setPtr(e); } },{passive:false});
window.addEventListener('pointerup',function(){ pressing=false; });
window.addEventListener('pointercancel',function(){ pressing=false; });
window.addEventListener('contextmenu',function(e){e.preventDefault();});
var hint=document.getElementById('hint'); var hintGone=false;
function killHint(){ if(!hintGone){ hintGone=true; hint.style.opacity='0'; setTimeout(function(){hint.style.display='none';},1300);} }
window.addEventListener('pointerdown',killHint,{once:false});

// ---- helpers ----
function depthToY(dd){ return H*0.10 + dd*(H*0.90 - H*0.10); }
function nxToX(n){ var m=W*0.12; return m + n*(W-2*m); }

function nearestItem(){
  var best=null,bd=99;
  for(var i=0;i<shells.length;i++){ var s=shells[i]; if(!s.present)continue; var dd=Math.abs(nx-s.nx); if(dd<0.06&&dd<bd){bd=dd;best=s;} }
  var td=Math.abs(nx-thimble.nx); if(thimble.present&&td<0.06&&td<bd){bd=td;best=thimble;}
  return best;
}

// ---- sim step ----
var last=performance.now();
function step(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  wobble*=Math.pow(0.12,dt);

  // pressure (Boyle): squeeze ramps it up, ease lets it fall back
  if(pressing) pressure=Math.min(PMAX,pressure+UP_RATE*dt);
  else pressure=Math.max(0,pressure-DOWN_RATE*dt);
  if(pressing&&Math.random()<0.5) wobble=Math.max(wobble,0.35);

  var airVol=P0*V0/(P0+pressure);
  var mass=BASE_MASS + (carrying?PEARL_MASS*(carrying.isThimble?0.8:1):0);
  var totalVol=SOLID+airVol;
  var netDown=mass-totalVol;
  var force=netDown*FORCE;
  var drag=DRAG_L*vd + DRAG_Q*vd*Math.abs(vd);
  vd += (force-drag)*dt;
  d  += vd*dt;

  if(d>FLOOR_D){ d=FLOOR_D; if(vd>0){ vd=0; } }
  if(d<TOP_D){ d=TOP_D; if(vd<0) vd=0; }

  // steer horizontally
  var pn=nx;
  nx += (targetNx-nx)*Math.min(1,8*dt);
  hSpeed=Math.abs(nx-pn)/Math.max(dt,0.001);

  // surface plip
  if(prevD>0.05 && d<=0.05){ plip(); }
  prevD=d;

  // hooking
  if(!carrying && d>0.78 && Math.abs(vd)<0.06 && hSpeed<0.05){
    var it=nearestItem();
    if(it){ dwell+=dt; if(dwell>0.5){
      carrying={item:it,isThimble:!!it.isThimble,pickupDepth:d};
      if(it.isThimble){ say("on the rim now… ease up slow…"); }
      else { it.present=false; tink(); say("— the hook's got it! gently, gently —"); }
      dwell=0;
    }} else dwell=0;
  } else dwell=0;

  // carrying rules
  if(carrying){
    var vUp=-vd;
    if(carrying.isThimble){
      if(d < carrying.pickupDepth-0.02){ // the smooth rim always slips loose
        carrying=null; say("hm — slides right off. settle back, then.");
      }
    } else {
      if(vUp>SAFE_RISE){ carrying.item.present=true; carrying=null; say("ahh — too quick, too quick — down she drops."); }
      else if(hSpeed>0.42){ carrying.item.present=true; carrying=null; say("— a jog and she's gone. back to the sand."); }
      else if(d<0.06){ // reached the surface tray
        carrying.item.present=true; carrying=null; trayPearls++;
        PEARLS++; localStorage.setItem('cd_pearls',PEARLS);
        document.getElementById('pc').textContent=PEARLS;
        tap(); say("and up he rides — there she is, in the tray!");
      }
    }
  }

  // steady hover record
  if(d>0.12 && d<0.85 && Math.abs(vd)<0.03 && hSpeed<0.02){
    hoverT+=dt;
    if(hoverT>BESTHOV){ BESTHOV=hoverT; localStorage.setItem('cd_hover',BESTHOV.toFixed(2)); document.getElementById('hc').textContent=BESTHOV.toFixed(1); }
  } else hoverT=0;

  // commentary phase
  var phase;
  if(carrying&&!carrying.isThimble){ phase = vd<-0.05?'carryUp': vd>0.05?'carryDown':'carryHold'; }
  else { phase = vd<-0.05?'up': vd>0.05?'down':'hold'; }
  if(phase!==prevPhase && (now-lastMsg)>900){ if(phaseLine[phase]) say(phaseLine[phase]); prevPhase=phase; }
  if((now-lastMsg)>7500 && phase==='hold' && !carrying){ say(idle[(Math.random()*idle.length)|0]); }

  // motes
  for(var i=0;i<motes.length;i++){ var mo=motes[i]; mo.x+=mo.vx*dt*8; mo.y+=mo.vy*dt*8 + Math.sin(now*0.001+i)*0.0003;
    if(mo.y<0){mo.y=1;mo.x=Math.random();} if(mo.x<0)mo.x=1; if(mo.x>1)mo.x=0; }

  draw(now, airVol);
  requestAnimationFrame(step);
}

// ---- drawing ----
function draw(now, airVol){
  ctx.clearRect(0,0,W,H);
  var wob=Math.sin(now*0.006)*wobble*4;

  // water gradient (sunlit aqua-green down to bottle-bottom teal)
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#57c3b0'); g.addColorStop(0.16,'#3fae9c');
  g.addColorStop(0.7,'#2b8175'); g.addColorStop(1,'#1c5a52');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // cork band + neck at very top
  var cg=ctx.createLinearGradient(0,0,0,H*0.05);
  cg.addColorStop(0,'#a06a3a'); cg.addColorStop(1,'#7a4a28');
  ctx.fillStyle=cg; ctx.fillRect(0,0,W,H*0.045);
  ctx.fillStyle='rgba(255,240,210,0.14)'; ctx.fillRect(0,H*0.045,W,H*0.006);

  // bright specular streak raked across the wet glass
  var sx=W*0.30+wob;
  var sg=ctx.createLinearGradient(sx-40,0,sx+40,0);
  sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,0.16)'); sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg; ctx.fillRect(sx-40,H*0.05,80,H*0.9);
  var sx2=W*0.78-wob*0.6;
  var sg2=ctx.createLinearGradient(sx2-16,0,sx2+16,0);
  sg2.addColorStop(0,'rgba(255,255,255,0)'); sg2.addColorStop(0.5,'rgba(255,255,255,0.09)'); sg2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg2; ctx.fillRect(sx2-16,H*0.05,32,H*0.9);

  // motes
  for(var i=0;i<motes.length;i++){ var mo=motes[i]; ctx.fillStyle='rgba(240,255,248,0.28)';
    ctx.beginPath(); ctx.arc(mo.x*W, H*0.08+mo.y*H*0.8, 1.3, 0, 6.3); ctx.fill(); }

  // sand floor
  var sandY=depthToY(0.905);
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=W/12){ ctx.lineTo(x, sandY + Math.sin(x*0.02+2)*6 - 4); }
  ctx.lineTo(W,H); ctx.closePath();
  var sg3=ctx.createLinearGradient(0,sandY-8,0,H);
  sg3.addColorStop(0,'#e2cf9a'); sg3.addColorStop(1,'#c9b073');
  ctx.fillStyle=sg3; ctx.fill();

  // oyster shells + pearls
  for(var s=0;s<shells.length;s++){ drawShell(shells[s].nx, shells[s].present); }
  drawThimble(thimble.nx);

  // surface tray pearls (collected)
  var ty=depthToY(0.045);
  for(var p=0;p<Math.min(trayPearls,9);p++){
    var px=W*0.5 + (p-4)*15;
    drawPearl(px, ty, 6, 1);
  }
  // faint tray shelf line
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W*0.5-80, ty+9); ctx.lineTo(W*0.5+80, ty+9); ctx.stroke();

  // diver
  drawDiver(nxToX(nx)+wob*0.4, depthToY(d), airVol);

  // press ring
  if(pressing){
    ctx.strokeStyle='rgba(255,255,255,'+(0.12+0.1*Math.abs(Math.sin(now*0.01)))+')';
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ptrX,ptrY,26+6*Math.sin(now*0.01),0,6.3); ctx.stroke();
  }

  // glass edge vignette
  var eg=ctx.createLinearGradient(0,0,W,0);
  eg.addColorStop(0,'rgba(12,50,45,0.5)'); eg.addColorStop(0.08,'rgba(12,50,45,0)');
  eg.addColorStop(0.92,'rgba(12,50,45,0)'); eg.addColorStop(1,'rgba(12,50,45,0.5)');
  ctx.fillStyle=eg; ctx.fillRect(0,0,W,H);
}

function drawShell(n,hasPearl){
  var x=nxToX(n), y=depthToY(0.9);
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#d8c48c'; ctx.strokeStyle='#b39a5e'; ctx.lineWidth=1.5;
  // lower half
  ctx.beginPath(); ctx.ellipse(0,4,20,9,0,0,Math.PI); ctx.fill(); ctx.stroke();
  for(var r=-2;r<=2;r++){ ctx.strokeStyle='rgba(150,125,80,0.5)'; ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(r*8,12); ctx.stroke(); }
  // upper (open) half
  ctx.fillStyle='#e6d3a0'; ctx.strokeStyle='#b39a5e';
  ctx.beginPath(); ctx.ellipse(0,-1,18,6,0,Math.PI,0); ctx.fill(); ctx.stroke();
  ctx.restore();
  if(hasPearl){ drawPearl(x,y-1,6.5,1); }
}
function drawThimble(n){
  var x=nxToX(n), y=depthToY(0.9);
  ctx.save(); ctx.translate(x,y);
  // half-buried tarnished brass thimble, unremarked
  var tg=ctx.createLinearGradient(0,-14,0,4);
  tg.addColorStop(0,'#b39a54'); tg.addColorStop(0.6,'#8a7a3e'); tg.addColorStop(1,'#5f6b46');
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(-7,4); ctx.lineTo(-6,-11); ctx.quadraticCurveTo(0,-16,6,-11); ctx.lineTo(7,4); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(90,80,40,0.6)'; ctx.lineWidth=1; ctx.stroke();
  // dimple stipple
  ctx.fillStyle='rgba(60,55,30,0.35)';
  for(var yy=-9;yy<-1;yy+=2){ for(var xx=-4;xx<=4;xx+=2){ ctx.fillRect(xx,yy,0.9,0.9); } }
  // tiny bright rim glint
  ctx.strokeStyle='rgba(255,245,200,0.5)'; ctx.beginPath(); ctx.moveTo(-6,-11); ctx.quadraticCurveTo(0,-16,6,-11); ctx.stroke();
  ctx.restore();
}
function drawPearl(x,y,r,a){
  ctx.save();
  var pg=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.2,x,y,r);
  pg.addColorStop(0,'#ffffff'); pg.addColorStop(0.5,'#f4efe2'); pg.addColorStop(1,'#d8cdb0');
  ctx.globalAlpha=a; ctx.fillStyle=pg;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(x-r*0.35,y-r*0.35,r*0.28,0,6.3); ctx.fill();
  ctx.restore();
}
function drawDiver(x,y,airVol){
  ctx.save(); ctx.translate(x,y);
  // hook below
  ctx.strokeStyle='#b98d30'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,17); ctx.lineTo(0,24); ctx.arc(3,25,3.2,Math.PI,Math.PI*0.2,false); ctx.stroke();
  // carried pearl / thimble on the hook
  if(carrying){ if(carrying.isThimble){ /* drawn on floor, shown lifting via item */ drawPearl(3,29,0,0);} else drawPearl(2,30,6,1); }
  // brass body
  var bg=ctx.createLinearGradient(-14,-18,14,18);
  bg.addColorStop(0,'#e7c063'); bg.addColorStop(0.4,'#c69a3c'); bg.addColorStop(1,'#8f6d24');
  ctx.fillStyle=bg; ctx.strokeStyle='#7a5a1c'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(0,-2,13,17,0,0,6.3); ctx.fill(); ctx.stroke();
  // little dome cap
  ctx.beginPath(); ctx.ellipse(0,-15,6,4,0,0,6.3); ctx.fillStyle='#d9ad48'; ctx.fill();
  // trapped air bubble (shrinks as you squeeze) — pale, near the base
  var bh=3 + (airVol-0.37)/(0.60-0.37)*11; bh=Math.max(2,bh);
  var ag=ctx.createRadialGradient(-2,6,1,0,6,7);
  ag.addColorStop(0,'rgba(255,255,255,0.95)'); ag.addColorStop(1,'rgba(200,240,232,0.5)');
  ctx.fillStyle=ag;
  ctx.beginPath(); ctx.ellipse(0,7,5.5,bh,0,0,6.3); ctx.fill();
  // hard bright specular streak on the wet brass
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(-5,-6,1.7,9,-0.15,0,6.3); ctx.fill();
  ctx.restore();
}

requestAnimationFrame(function(t){ last=t; step(t); });
