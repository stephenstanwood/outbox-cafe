<title>Two Hundred Brass Pins, One Steel Spring</title>
<!--
  Board layout notes, kept where the glass can't smudge them:
  · rows are offset by half a pin-gap, alternating. this is the whole trick.
    with a square grid a ball can fall a clear column top to bottom and
    never touch brass. with the offset there is no such column anywhere.
  · minimum centre-to-centre separation is enforced at ball diameter +
    both pin radii + a tenth of a gap, so nothing can ever wedge for good.
  · the two outer tulips sit under the tight clusters on purpose. by the
    time a ball has taken six or seven hits in that patch it has almost no
    horizontal speed left and drops nearly straight. that is the only way
    a mouth one ball wide ever swallows anything.
  · the spring decides the lane along the dome. the lane decides the third
    row down. after the third row down nothing decides anything.
  · most balls reach the lip and go. that is the ordinary outcome.
-->
<style>
  /* flat, hard, high contrast. lacquer under a bare tube. no soft edges. */
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1c1310;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  /* the sheet of glass in front of everything */
  .glass{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .tube{position:absolute;left:-30%;top:-40%;width:70%;height:190%;
    transform:rotate(15deg);
    background:linear-gradient(90deg,
      rgba(238,241,242,0) 0%, rgba(238,241,242,0) 39%,
      rgba(238,241,242,.045) 39%, rgba(238,241,242,.045) 46%,
      rgba(238,241,242,.105) 46%, rgba(238,241,242,.105) 49.5%,
      rgba(238,241,242,.035) 49.5%, rgba(238,241,242,.035) 57%,
      rgba(238,241,242,0) 57%, rgba(238,241,242,0) 100%);}
  .tube2{position:absolute;right:-22%;top:-40%;width:34%;height:190%;
    transform:rotate(15deg);
    background:linear-gradient(90deg,
      rgba(238,241,242,0) 0%, rgba(238,241,242,0) 62%,
      rgba(238,241,242,.05) 62%, rgba(238,241,242,.05) 66%,
      rgba(238,241,242,0) 66%);}
  .dust{position:absolute;inset:0;
    box-shadow:
      22vw 31vh 0 0 rgba(238,241,242,.16), 61vw 18vh 0 0 rgba(238,241,242,.11),
      44vw 72vh 0 0 rgba(238,241,242,.13), 78vw 55vh 0 0 rgba(238,241,242,.09),
      13vw 61vh 0 0 rgba(238,241,242,.10), 88vw 27vh 0 0 rgba(238,241,242,.12),
      35vw 88vh 0 0 rgba(238,241,242,.08), 69vw 41vh 0 0 rgba(238,241,242,.10);
    width:1px;height:1px;left:0;top:0;}
  footer{position:fixed;left:0;bottom:0;z-index:4;margin:0;padding:0;}
  footer a{display:block;width:14px;height:14px;margin:9px 0 0 9px;border-radius:50%;
    background:#c99a2e;box-shadow:inset -2px -2px 0 0 #8a6416, inset 2px 2px 0 0 #f2dc9a;
    position:relative;overflow:hidden;}
  footer a::after{content:"";position:absolute;left:2px;top:6px;width:10px;height:2px;
    background:#5c3f0c;}
  footer a:focus{outline:2px solid #eef1f2;outline-offset:2px;}
</style>

<body>
<canvas id="board"></canvas>
<div class="glass" aria-hidden="true">
  <div class="tube"></div><div class="tube2"></div><div class="dust"></div>
</div>
<footer><a href="/archive" aria-label="the rest of the hall" title="the rest of the hall"></a></footer>
<script>
(function(){
"use strict";
var cv=document.getElementById('board'), ctx=cv.getContext('2d',{alpha:false});
var stat=document.createElement('canvas'), sctx=stat.getContext('2d');
var W=0,H=0,dpr=1;

/* ---- deterministic layout rng: the board does not rearrange itself ---- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd;

/* ---- board state ---- */
var G, gap, ballR, pinR, margin, left, right, topY, domeBaseY, lipY, lipEndY,
    drainX, drainW, laneW, laneX, laneTopY, launchBaseY, cxD, cyD, Rd, thetaMax,
    fieldTop, fieldBot;
var pins=[], segs=[], tulips=[], balls=[], grid=null;
var MAXBALLS=140;

function seg(x1,y1,x2,y2,e,th){return {x1:x1,y1:y1,x2:x2,y2:y2,e:e,t:th||0,stamp:-1};}

function build(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  stat.width=cv.width; stat.height=cv.height;
  ctx.setTransform(dpr,0,0,dpr,0,0); sctx.setTransform(dpr,0,0,dpr,0,0);
  rnd=mulberry(19740417);

  margin=Math.max(9,Math.min(W,H)*0.028);
  left=margin; right=W-margin; topY=margin;
  var halfW=(right-left)/2;
  var sag=Math.min(H*0.25, halfW*0.44); if(sag<26) sag=26;
  domeBaseY=topY+sag;
  Rd=(halfW*halfW+sag*sag)/(2*sag); cyD=topY+Rd; cxD=(left+right)/2;
  thetaMax=Math.asin(Math.min(1,halfW/Rd));

  var lipH=Math.min(H*0.085, Math.max(26,H*0.05));
  lipY=H-margin-lipH-Math.max(10,H*0.03);
  launchBaseY=H-margin*0.6;
  lipEndY=lipY+lipH;
  if(lipEndY>launchBaseY-4) lipEndY=launchBaseY-4;

  /* solve pin gap so the field lands near two hundred pins whatever the screen */
  var g0=Math.min(W,H)*0.09;
  for(var it=0;it<3;it++){
    var Uw=(right-g0*2.9)-left-g0*1.1;
    var Uh=(lipY-g0*1.0)-(domeBaseY+g0*0.55);
    if(Uw<40)Uw=40; if(Uh<40)Uh=40;
    g0=Math.sqrt(Uw*Uh/(0.866*205));
  }
  gap=Math.max(25,Math.min(72,g0));
  ballR=gap*0.255; pinR=Math.max(2,gap*0.076);
  laneW=ballR*2.85; laneX=right-laneW;
  G=H*12;

  fieldTop=domeBaseY+gap*0.55;
  fieldBot=lipY-gap*1.0;

  drainW=ballR*3.4; drainX=(left+right)/2-gap*0.4;

  buildTulips(); buildSegs(); buildPins(); buildGrid(); paintStatic();
}

function buildTulips(){
  tulips=[];
  var fL=left+gap*0.6, fR=laneX-gap*0.5, cx=(fL+fR)/2, span=(fR-fL);
  function T(x,y){return {x:x,y:y,open:0,tgt:0,vel:0,
    pw:ballR*0.72, L:gap*0.98, pt:Math.max(1.6,gap*0.055), bw:gap*0.52};}
  tulips.push(T(cx-span*0.29, fieldBot-gap*1.35));
  tulips.push(T(cx+span*0.29, fieldBot-gap*1.35));
  tulips.push(T(cx+gap*0.15,  fieldBot+gap*0.35));
}

function buildSegs(){
  segs=[];
  var E=0.34;
  /* dome, as physics segments */
  var N=52;
  for(var i=0;i<N;i++){
    var a1=-thetaMax+(2*thetaMax)*i/N, a2=-thetaMax+(2*thetaMax)*(i+1)/N;
    segs.push(seg(cxD+Rd*Math.sin(a1),cyD-Rd*Math.cos(a1),
                  cxD+Rd*Math.sin(a2),cyD-Rd*Math.cos(a2),0.22,0));
  }
  /* side walls */
  segs.push(seg(left,domeBaseY,left,lipY,E,0));
  segs.push(seg(right,domeBaseY,right,launchBaseY,E,0));
  /* launch lane inner wall + its curl over the top */
  var Ri=Rd-laneW, dx=laneX-cxD;
  var th1=Math.asin(Math.max(-1,Math.min(1,dx/Ri)));
  laneTopY=cyD-Math.sqrt(Math.max(1,Ri*Ri-dx*dx));
  segs.push(seg(laneX,lipY+gap*0.45,laneX,laneTopY,0.28,0));
  var thEnd=th1*0.33, M=16;
  for(var k=0;k<M;k++){
    var b1=th1+(thEnd-th1)*k/M, b2=th1+(thEnd-th1)*(k+1)/M;
    segs.push(seg(cxD+Ri*Math.sin(b1),cyD-Ri*Math.cos(b1),
                  cxD+Ri*Math.sin(b2),cyD-Ri*Math.cos(b2),0.2,0));
  }
  /* drain lip: a shallow V into a mouth about three balls wide */
  segs.push(seg(left,lipY,drainX-drainW/2,lipEndY,0.24,0));
  var lipRx=laneX-gap*0.3;
  segs.push(seg(lipRx,lipY+gap*0.45,drainX+drainW/2,lipEndY,0.24,0));
  /* the lane floor tips returning balls out onto the lip */
  segs.push(seg(right,launchBaseY,lipRx,lipY+gap*0.45,0.2,0));

  /* painted lacquer channels — real walls, not decoration */
  var TH=gap*0.095, LE=0.3;
  chan=[];
  function C(x1,y1,x2,y2){var s=seg(x1,y1,x2,y2,LE,TH);s.lac=1;segs.push(s);chan.push(s);}
  var fL=left+gap*0.6, fR=laneX-gap*0.5, cx=(fL+fR)/2, span=fR-fL;
  /* shoulder rails under the dome, throwing balls off the walls back inward */
  C(fL-gap*0.1, domeBaseY+gap*1.1, fL+span*0.20, domeBaseY+gap*2.5);
  C(fR+gap*0.1, domeBaseY+gap*1.1, fR-span*0.20, domeBaseY+gap*2.5);
  /* centre funnel above the low tulip */
  var t3=tulips[2];
  C(t3.x-gap*2.5, t3.y-gap*3.3, t3.x-gap*0.95, t3.y-gap*1.9);
  C(t3.x+gap*2.5, t3.y-gap*3.3, t3.x+gap*0.95, t3.y-gap*1.9);
  /* feeders leaning over the two cluster tulips */
  C(tulips[0].x-gap*2.9, tulips[0].y-gap*3.6, tulips[0].x-gap*1.5, tulips[0].y-gap*4.4);
  C(tulips[1].x+gap*2.9, tulips[1].y-gap*3.6, tulips[1].x+gap*1.5, tulips[1].y-gap*4.4);

  /* tulip bodies */
  for(var q=0;q<tulips.length;q++){
    var t=tulips[q];
    segs.push(seg(t.x-t.bw,t.y,t.x-t.pw,t.y,0.25,gap*0.05));
    segs.push(seg(t.x+t.pw,t.y,t.x+t.bw,t.y,0.25,gap*0.05));
  }
}
var chan=[];

function buildPins(){
  pins=[];
  var fL=left+gap*0.62, fR=laneX-gap*0.55;
  var rows=Math.max(5,Math.floor((fieldBot-fieldTop)/(gap*0.866)));
  var rg=(fieldBot-fieldTop)/rows;
  var cand=[],i,x,y;
  for(i=0;i<=rows;i++){
    y=fieldTop+i*rg+(rnd()-0.5)*rg*0.07;
    var off=(i%2)?gap*0.5:0;
    for(x=fL+off;x<=fR;x+=gap){
      cand.push({x:x+(rnd()-0.5)*gap*0.09,y:y+(rnd()-0.5)*gap*0.07,
        r:pinR*(0.9+rnd()*0.22)});
    }
  }
  /* the two clusters: extra half-rows, tight, right where the speed gets bled */
  for(var q=0;q<2;q++){
    var t=tulips[q];
    for(var k=1;k<=6;k++){
      var cy=t.y-gap*0.62-k*rg*0.52;
      var wid=gap*(2.6-k*0.16);
      var o=(k%2)?gap*0.41:0;
      for(x=t.x-wid+o;x<=t.x+wid;x+=gap*0.82){
        cand.push({x:x+(rnd()-0.5)*gap*0.05,y:cy+(rnd()-0.5)*gap*0.05,
          r:pinR*(0.88+rnd()*0.2)});
      }
    }
  }
  /* a small crown of pins under the dome apex */
  for(var m=0;m<9;m++){
    var ang=(-0.45+0.11*m);
    cand.push({x:cxD+(Rd-gap*1.5)*Math.sin(ang),y:cyD-(Rd-gap*1.5)*Math.cos(ang),
      r:pinR*1.05});
  }

  var minSep=2*ballR+2*pinR+gap*0.11;
  outer:
  for(i=0;i<cand.length;i++){
    var p=cand[i];
    if(p.x<fL-gap*0.35||p.x>fR+gap*0.2) continue;
    if(p.y<fieldTop-gap*0.9||p.y>fieldBot+gap*0.2) continue;
    /* keep clear of tulips and of every painted channel */
    for(var q2=0;q2<tulips.length;q2++){
      var t2=tulips[q2];
      if(Math.abs(p.x-t2.x)<gap*1.45 && p.y>t2.y-gap*1.75 && p.y<t2.y+gap*1.2) continue outer;
    }
    for(var c=0;c<chan.length;c++){
      if(distSeg(p.x,p.y,chan[c])<ballR+pinR+chan[c].t+3) continue outer;
    }
    for(var j=0;j<pins.length;j++){
      var d=Math.hypot(pins[j].x-p.x,pins[j].y-p.y);
      if(d<minSep) continue outer;
    }
    p.f=(1450+rnd()*1550)*(pinR/p.r);
    p.stamp=-1;
    pins.push(p);
  }
}
function distSeg(px,py,s){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy||1;
  var t=((px-s.x1)*dx+(py-s.y1)*dy)/L2; t=t<0?0:t>1?1:t;
  return Math.hypot(px-(s.x1+t*dx),py-(s.y1+t*dy));
}

/* ---- spatial grid over the static furniture ---- */
function buildGrid(){
  var cell=gap*1.15;
  var cols=Math.ceil(W/cell)+2, rows=Math.ceil(H/cell)+2;
  var cells=new Array(cols*rows);
  for(var i=0;i<cells.length;i++) cells[i]={p:[],s:[]};
  grid={cell:cell,cols:cols,rows:rows,cells:cells};
  function idx(cx,cy){return cy*cols+cx;}
  for(var k=0;k<pins.length;k++){
    var p=pins[k];
    var cx=Math.floor(p.x/cell)+1, cy=Math.floor(p.y/cell)+1;
    if(cx<0||cy<0||cx>=cols||cy>=rows) continue;
    cells[idx(cx,cy)].p.push(p);
  }
  for(var m=0;m<segs.length;m++){
    var s=segs[m], pad=ballR+s.t+2;
    var x0=Math.floor((Math.min(s.x1,s.x2)-pad)/cell)+1, x1=Math.floor((Math.max(s.x1,s.x2)+pad)/cell)+1;
    var y0=Math.floor((Math.min(s.y1,s.y2)-pad)/cell)+1, y1=Math.floor((Math.max(s.y1,s.y2)+pad)/cell)+1;
    for(var a=Math.max(0,x0);a<=Math.min(cols-1,x1);a++)
      for(var b=Math.max(0,y0);b<=Math.min(rows-1,y1);b++)
        cells[idx(a,b)].s.push(s);
  }
}

/* ---- audio: everything synthesised, nothing loaded ---- */
var ac=null, master=null, noise=null, voices=0, hum=null, humF=null, humG=null;
function initAudio(){
  if(ac) { if(ac.state==='suspended') ac.resume(); return; }
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC();
  var comp=ac.createDynamicsCompressor();
  comp.threshold.value=-18; comp.knee.value=8; comp.ratio.value=6;
  comp.attack.value=0.002; comp.release.value=0.12;
  master=ac.createGain(); master.gain.value=0.34;
  master.connect(comp); comp.connect(ac.destination);
  var n=Math.floor(ac.sampleRate*0.12);
  noise=ac.createBuffer(1,n,ac.sampleRate);
  var d=noise.getChannelData(0);
  for(var i=0;i<n;i++){var e=1-i/n; d[i]=(Math.random()*2-1)*e*e*e;}
}
function vRef(){return Math.sqrt(G*gap);}
function tick(vel,f){
  if(!ac||voices>20) return;
  var rel=vel/vRef(); if(rel>1)rel=1; if(rel<0.055) return;
  var t0=ac.currentTime;
  var src=ac.createBufferSource(); src.buffer=noise;
  var bp=ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=f*(0.82+0.55*rel); bp.Q.value=9+6*rel;
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.55*rel*rel+0.02,t0+0.0012);
  g.gain.exponentialRampToValueAtTime(0.0004,t0+0.018+0.055*rel);
  src.connect(bp); bp.connect(g); g.connect(master);
  voices++; src.onended=function(){voices--;};
  src.start(t0); src.stop(t0+0.12);
  if(rel>0.42){
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*(1.0+0.3*rel);
    var og=ac.createGain(); og.gain.setValueAtTime(0.0001,t0);
    og.gain.exponentialRampToValueAtTime(0.10*rel,t0+0.002);
    og.gain.exponentialRampToValueAtTime(0.0003,t0+0.07);
    o.connect(og); og.connect(master); o.start(t0); o.stop(t0+0.09);
  }
}
function clack(vel){
  if(!ac||voices>22) return;
  var rel=Math.min(1,vel/vRef()); if(rel<0.09) return;
  var t0=ac.currentTime;
  var src=ac.createBufferSource(); src.buffer=noise;
  var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=780+700*rel; bp.Q.value=5;
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.3*rel,t0+0.001);
  g.gain.exponentialRampToValueAtTime(0.0004,t0+0.03);
  src.connect(bp); bp.connect(g); g.connect(master);
  voices++; src.onended=function(){voices--;};
  src.start(t0); src.stop(t0+0.06);
}
function drainSound(){
  if(!ac) return; var t0=ac.currentTime;
  var src=ac.createBufferSource(); src.buffer=noise;
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=430;
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.22,t0+0.004);
  g.gain.exponentialRampToValueAtTime(0.0004,t0+0.13);
  src.connect(lp); lp.connect(g); g.connect(master); src.start(t0); src.stop(t0+0.16);
}
function snapSound(){
  if(!ac) return; var t0=ac.currentTime;
  for(var i=0;i<2;i++){
    var src=ac.createBufferSource(); src.buffer=noise;
    var bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=i?2300:3400; bp.Q.value=12;
    var g=ac.createGain();
    var t=t0+i*0.022;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.34,t+0.0012);
    g.gain.exponentialRampToValueAtTime(0.0004,t+0.05);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+0.07);
  }
}
function humStart(){
  if(!ac||hum) return;
  hum=ac.createOscillator(); hum.type='sawtooth'; hum.frequency.value=44;
  humF=ac.createBiquadFilter(); humF.type='lowpass'; humF.frequency.value=340; humF.Q.value=6;
  humG=ac.createGain(); humG.gain.value=0.0001;
  hum.connect(humF); humF.connect(humG); humG.connect(master);
  hum.start();
  humG.gain.exponentialRampToValueAtTime(0.05,ac.currentTime+0.05);
}
function humSet(c){
  if(!ac||!hum) return;
  hum.frequency.setTargetAtTime(42+c*c*120,ac.currentTime,0.03);
  humF.frequency.setTargetAtTime(320+c*820,ac.currentTime,0.03);
  humG.gain.setTargetAtTime(0.035+c*0.055,ac.currentTime,0.05);
}
function humStop(c){
  if(!ac||!hum) return;
  var t0=ac.currentTime, o=hum, g=humG;
  g.gain.setTargetAtTime(0.0001,t0,0.02);
  o.frequency.setValueAtTime(o.frequency.value,t0);
  o.frequency.exponentialRampToValueAtTime(38,t0+0.14);
  o.stop(t0+0.2);
  hum=null;humG=null;humF=null;
  var tw=ac.createOscillator(); tw.type='triangle';
  tw.frequency.setValueAtTime(300+520*c,t0);
  tw.frequency.exponentialRampToValueAtTime(88,t0+0.19);
  var tg=ac.createGain();
  tg.gain.setValueAtTime(0.0001,t0);
  tg.gain.exponentialRampToValueAtTime(0.16*(0.4+c),t0+0.003);
  tg.gain.exponentialRampToValueAtTime(0.0004,t0+0.22);
  tw.connect(tg); tg.connect(master); tw.start(t0); tw.stop(t0+0.25);
  var src=ac.createBufferSource(); src.buffer=noise;
  var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=4;
  var ng=ac.createGain();
  ng.gain.setValueAtTime(0.0001,t0);
  ng.gain.exponentialRampToValueAtTime(0.2,t0+0.002);
  ng.gain.exponentialRampToValueAtTime(0.0004,t0+0.06);
  src.connect(bp); bp.connect(ng); ng.connect(master); src.start(t0); src.stop(t0+0.08);
}

/* ---- the spring ---- */
var charging=false, chargeT=0, charge=0, recoil=0, CHARGE_MS=880;
function fire(c){
  if(balls.length>=MAXBALLS) return;
  var climb=launchBaseY-laneTopY;
  var vClear=Math.sqrt(2*G*Math.max(40,climb));
  var v=vClear*(0.955+0.52*c);
  balls.push({x:laneX+laneW/2,y:launchBaseY-gap*0.5-ballR,
    vx:(rnd?rnd()-0.5:0)*4,vy:-v,r:ballR,slow:0});
  recoil=1;
}

/* ---- physics ---- */
var hits=[], stampId=0;
function step(dt){
  var i,j,b;
  for(i=0;i<balls.length;i++){
    b=balls[i];
    b.vy+=G*dt;
    b.vx*=0.9994; b.vy*=0.9994;
    var sp=Math.hypot(b.vx,b.vy);
    if(sp>5200){b.vx*=5200/sp;b.vy*=5200/sp;}
    b.x+=b.vx*dt; b.y+=b.vy*dt;
  }
  var cell=grid.cell, cols=grid.cols, rows=grid.rows;
  for(i=0;i<balls.length;i++){
    b=balls[i]; stampId++;
    var cx=Math.floor(b.x/cell)+1, cy=Math.floor(b.y/cell)+1;
    for(var a=cx-1;a<=cx+1;a++){
      if(a<0||a>=cols) continue;
      for(var c=cy-1;c<=cy+1;c++){
        if(c<0||c>=rows) continue;
        var cc=grid.cells[c*cols+a];
        for(j=0;j<cc.p.length;j++){
          var p=cc.p[j]; if(p.stamp===stampId) continue; p.stamp=stampId;
          var dx=b.x-p.x, dy=b.y-p.y, R=b.r+p.r;
          if(dx*dx+dy*dy>=R*R) continue;
          var d=Math.hypot(dx,dy)||0.0001;
          var nx=dx/d, ny=dy/d;
          b.x=p.x+nx*R; b.y=p.y+ny*R;
          var vn=b.vx*nx+b.vy*ny;
          if(vn<0){
            b.vx-=1.62*vn*nx; b.vy-=1.62*vn*ny;
            var tx=-ny, ty=nx, vt=b.vx*tx+b.vy*ty;
            b.vx-=0.012*vt*tx; b.vy-=0.012*vt*ty;
            /* honest surface irregularity: real pins are not perfect */
            b.vx+=(Math.random()-0.5)*Math.abs(vn)*0.035;
            if(hits.length<200) hits.push({v:-vn,f:p.f});
          }
        }
        for(j=0;j<cc.s.length;j++){
          var s=cc.s[j]; if(s.stamp===stampId) continue; s.stamp=stampId;
          hitSeg(b,s,1);
        }
      }
    }
  }
  /* tulip petals: live geometry, they move as they open */
  for(i=0;i<tulips.length;i++){
    var t=tulips[i];
    var ang=(4+46*t.open)*Math.PI/180, sa=Math.sin(ang), ca=Math.cos(ang);
    t.tipLx=t.x-t.pw-t.L*sa; t.tipLy=t.y-t.L*ca;
    t.tipRx=t.x+t.pw+t.L*sa; t.tipRy=t.y-t.L*ca;
    var pl={x1:t.x-t.pw,y1:t.y,x2:t.tipLx,y2:t.tipLy,e:0.26,t:t.pt};
    var pr={x1:t.x+t.pw,y1:t.y,x2:t.tipRx,y2:t.tipRy,e:0.26,t:t.pt};
    for(j=0;j<balls.length;j++){ hitSeg(balls[j],pl,0); hitSeg(balls[j],pr,0); }
  }
  /* ball on ball */
  var bc=Math.max(1,ballR*2.2), bcols=Math.ceil(W/bc)+2;
  var map={};
  for(i=0;i<balls.length;i++){
    b=balls[i];
    var k=(Math.floor(b.y/bc)+1)*bcols+(Math.floor(b.x/bc)+1);
    (map[k]||(map[k]=[])).push(i);
  }
  for(i=0;i<balls.length;i++){
    b=balls[i];
    var gx=Math.floor(b.x/bc)+1, gy=Math.floor(b.y/bc)+1;
    for(var ax=gx;ax<=gx+1;ax++) for(var ay=gy-1;ay<=gy+1;ay++){
      if(ax===gx&&ay<gy) continue;
      var lst=map[ay*bcols+ax]; if(!lst) continue;
      for(var z=0;z<lst.length;z++){
        var jj=lst[z]; if(jj<=i) continue;
        var o=balls[jj];
        var dx2=o.x-b.x, dy2=o.y-b.y, RR=b.r+o.r;
        if(dx2*dx2+dy2*dy2>=RR*RR) continue;
        var dd=Math.hypot(dx2,dy2)||0.0001;
        var nx2=dx2/dd, ny2=dy2/dd, ov=(RR-dd)*0.5;
        b.x-=nx2*ov; b.y-=ny2*ov; o.x+=nx2*ov; o.y+=ny2*ov;
        var rv=(o.vx-b.vx)*nx2+(o.vy-b.vy)*ny2;
        if(rv<0){
          var imp=-(1.48)*rv*0.5;
          b.vx-=imp*nx2; b.vy-=imp*ny2; o.vx+=imp*nx2; o.vy+=imp*ny2;
          clack(-rv);
        }
      }
    }
  }
  /* tulip mouths, drain, and the anti-wedge nudge */
  for(i=balls.length-1;i>=0;i--){
    b=balls[i];
    var caught=false;
    for(j=0;j<tulips.length;j++){
      var tt=tulips[j];
      if(b.y>=tt.y && b.y<tt.y+gap*0.55 && Math.abs(b.x-tt.x)<tt.pw+b.r*0.75){
        caught=true;
        if(tt.tgt<1){ tt.tgt=1; tt.vel=9; snapSound(); }
        break;
      }
    }
    if(caught){ balls.splice(i,1); drainSound(); continue; }
    if(b.y>lipEndY+b.r*1.1 || b.y>H+40 || b.x<-40 || b.x>W+40){
      balls.splice(i,1); if(b.y>lipEndY) drainSound(); continue;
    }
    var spd=Math.hypot(b.vx,b.vy);
    if(spd<gap*0.55){ b.slow+=dt; if(b.slow>1.6){ b.vx+=(Math.random()-0.5)*gap*6; b.vy-=gap*2; b.slow=0; } }
    else b.slow=0;
  }
}
function hitSeg(b,s,record){
  var dx=s.x2-s.x1, dy=s.y2-s.y1, L2=dx*dx+dy*dy||1;
  var t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2; t=t<0?0:t>1?1:t;
  var px=s.x1+t*dx, py=s.y1+t*dy;
  var ox=b.x-px, oy=b.y-py, R=b.r+s.t;
  if(ox*ox+oy*oy>=R*R) return;
  var d=Math.hypot(ox,oy);
  var nx,ny;
  if(d<0.0001){nx=0;ny=-1;d=0.0001;} else {nx=ox/d;ny=oy/d;}
  b.x=px+nx*R; b.y=py+ny*R;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    b.vx-=(1+s.e)*vn*nx; b.vy-=(1+s.e)*vn*ny;
    var tx=-ny,ty=nx, vt=b.vx*tx+b.vy*ty;
    b.vx-=0.05*vt*tx; b.vy-=0.05*vt*ty;
    if(record && hits.length<200 && -vn>vRef()*0.1) hits.push({v:-vn*0.7,f:s.lac?900:1900});
  }
}

/* ---- painting ---- */
function ballAt(c,x,y,r){
  c.beginPath(); c.arc(x,y,r,0,6.2832); c.fillStyle='#20262a'; c.fill();
  c.beginPath(); c.arc(x-r*0.06,y-r*0.10,r*0.92,0,6.2832); c.fillStyle='#8b9498'; c.fill();
  c.beginPath(); c.arc(x+r*0.30,y+r*0.34,r*0.30,0,6.2832); c.fillStyle='#5d666a'; c.fill();
  c.beginPath(); c.arc(x-r*0.30,y-r*0.34,r*0.40,0,6.2832); c.fillStyle='#c9d0d3'; c.fill();
  c.beginPath(); c.arc(x-r*0.38,y-r*0.42,r*0.21,0,6.2832); c.fillStyle='#eef1f2'; c.fill();
}
function paintStatic(){
  var c=sctx;
  c.fillStyle='#1c1310'; c.fillRect(0,0,W,H);
  /* playfield lacquer */
  c.beginPath();
  c.moveTo(left,domeBaseY);
  c.arc(cxD,cyD,Rd,-thetaMax-Math.PI/2,thetaMax-Math.PI/2,false);
  c.lineTo(right,H); c.lineTo(left,H); c.closePath();
  c.fillStyle='#cf2a17'; c.fill();
  c.save(); c.clip();
  /* painted gaudy shapes, hard edges only */
  c.fillStyle='#a8210f';
  c.beginPath(); c.arc(tulips[2].x,tulips[2].y-gap*2.3,gap*3.5,0,6.2832); c.fill();
  c.fillStyle='#cf2a17';
  c.beginPath(); c.arc(tulips[2].x,tulips[2].y-gap*2.3,gap*3.0,0,6.2832); c.fill();
  c.fillStyle='#8e1b0e';
  c.fillRect(left,domeBaseY+gap*0.25,right-left,Math.max(3,gap*0.12));
  c.fillRect(left,fieldBot+gap*0.55,right-left,Math.max(3,gap*0.10));
  for(var q=0;q<2;q++){
    var t=tulips[q];
    c.fillStyle='#a8210f';
    c.beginPath();
    c.moveTo(t.x-gap*3.0,t.y-gap*4.6); c.lineTo(t.x+gap*3.0,t.y-gap*4.6);
    c.lineTo(t.x+gap*1.3,t.y-gap*0.9); c.lineTo(t.x-gap*1.3,t.y-gap*0.9);
    c.closePath(); c.fill();
  }
  c.restore();

  /* lacquer channel strips */
  for(var i=0;i<chan.length;i++){
    var s=chan[i];
    c.lineCap='round';
    c.strokeStyle='#3a0c05'; c.lineWidth=s.t*2+Math.max(3,gap*0.07);
    c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke();
    c.strokeStyle='#c02514'; c.lineWidth=s.t*2;
    c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.stroke();
    c.strokeStyle='#e8502f'; c.lineWidth=Math.max(1,s.t*0.5);
    c.beginPath(); c.moveTo(s.x1,s.y1-s.t*0.6); c.lineTo(s.x2,s.y2-s.t*0.6); c.stroke();
  }
  /* rails: dome, walls, lane */
  var rw=Math.max(3,gap*0.11);
  function rail(path){
    c.lineCap='butt'; c.lineJoin='miter';
    c.strokeStyle='#1c1310'; c.lineWidth=rw*1.7; path(); c.stroke();
    c.strokeStyle='#c99a2e'; c.lineWidth=rw; path(); c.stroke();
    c.strokeStyle='#f2dc9a'; c.lineWidth=Math.max(1,rw*0.28); path(); c.stroke();
  }
  rail(function(){c.beginPath();c.arc(cxD,cyD,Rd,-thetaMax-Math.PI/2,thetaMax-Math.PI/2,false);});
  rail(function(){c.beginPath();c.moveTo(left,domeBaseY);c.lineTo(left,lipY);
                  c.moveTo(right,domeBaseY);c.lineTo(right,launchBaseY);});
  var Ri=Rd-laneW, dx=laneX-cxD, th1=Math.asin(Math.max(-1,Math.min(1,dx/Ri)));
  rail(function(){c.beginPath();c.moveTo(laneX,lipY+gap*0.45);c.lineTo(laneX,laneTopY);
    c.arc(cxD,cyD,Ri,th1-Math.PI/2,th1*0.33-Math.PI/2,true);});

  /* the shadowed well and the drain lip */
  c.fillStyle='#1c1310';
  c.beginPath();
  c.moveTo(0,lipY-1); c.lineTo(left,lipY); c.lineTo(drainX-drainW/2,lipEndY);
  c.lineTo(drainX+drainW/2,lipEndY); c.lineTo(laneX-gap*0.3,lipY+gap*0.45);
  c.lineTo(right,launchBaseY); c.lineTo(W,launchBaseY); c.lineTo(W,H); c.lineTo(0,H);
  c.closePath(); c.fill();
  c.fillRect(0,lipEndY,W,H-lipEndY);
  /* brass lip edge */
  c.strokeStyle='#c99a2e'; c.lineWidth=Math.max(2,gap*0.07); c.lineCap='butt';
  c.beginPath(); c.moveTo(left,lipY); c.lineTo(drainX-drainW/2,lipEndY);
  c.moveTo(laneX-gap*0.3,lipY+gap*0.45); c.lineTo(drainX+drainW/2,lipEndY);
  c.moveTo(right,launchBaseY); c.lineTo(laneX-gap*0.3,lipY+gap*0.45); c.stroke();

  /* pins: hard shadow, brass body, one hard highlight */
  for(var k=0;k<pins.length;k++){
    var p=pins[k], r=p.r;
    c.beginPath(); c.arc(p.x+r*0.55,p.y+r*0.75,r*1.05,0,6.2832);
    c.fillStyle='#6e1408'; c.fill();
    c.beginPath(); c.arc(p.x,p.y,r,0,6.2832); c.fillStyle='#c99a2e'; c.fill();
    c.beginPath(); c.arc(p.x+r*0.28,p.y+r*0.30,r*0.62,0,6.2832); c.fillStyle='#8a6416'; c.fill();
    c.beginPath(); c.arc(p.x-r*0.30,p.y-r*0.34,r*0.46,0,6.2832); c.fillStyle='#f2dc9a'; c.fill();
  }
  /* frame screws */
  c.fillStyle='#c99a2e';
  var sc=[[margin*0.5,margin*0.5],[W-margin*0.5,margin*0.5],
          [margin*0.5,H-margin*0.5],[W-margin*0.5,H-margin*0.5]];
  for(var z=0;z<4;z++){
    c.beginPath(); c.arc(sc[z][0],sc[z][1],Math.max(3,margin*0.22),0,6.2832); c.fill();
    c.strokeStyle='#5c3f0c'; c.lineWidth=Math.max(1,margin*0.07);
    c.beginPath(); c.moveTo(sc[z][0]-margin*0.16,sc[z][1]-margin*0.10);
    c.lineTo(sc[z][0]+margin*0.16,sc[z][1]+margin*0.10); c.stroke();
  }
}

function drawTulip(t){
  var ang=(4+46*t.open)*Math.PI/180;
  var sa=Math.sin(ang), ca=Math.cos(ang);
  /* dark mouth behind */
  ctx.fillStyle='#1c1310';
  ctx.fillRect(t.x-t.pw,t.y-gap*0.12,t.pw*2,gap*0.5);
  ctx.lineCap='round';
  for(var s=-1;s<=1;s+=2){
    var x1=t.x+s*t.pw, y1=t.y, x2=t.x+s*(t.pw+t.L*sa), y2=t.y-t.L*ca;
    ctx.strokeStyle='#0e2f1e'; ctx.lineWidth=t.pt*2+3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.strokeStyle='#1f7a4d'; ctx.lineWidth=t.pt*2;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.strokeStyle='#4fbd85'; ctx.lineWidth=Math.max(1,t.pt*0.55);
    ctx.beginPath(); ctx.moveTo(x1-s*t.pt*0.5,y1); ctx.lineTo(x2-s*t.pt*0.5,y2); ctx.stroke();
  }
  /* brass body */
  ctx.fillStyle='#1c1310';
  ctx.fillRect(t.x-t.bw-1,t.y-gap*0.1,(t.bw+1)*2,gap*0.26);
  ctx.fillStyle='#c99a2e';
  ctx.fillRect(t.x-t.bw,t.y-gap*0.08,t.bw-t.pw,gap*0.2);
  ctx.fillRect(t.x+t.pw,t.y-gap*0.08,t.bw-t.pw,gap*0.2);
  ctx.fillStyle='#f2dc9a';
  ctx.fillRect(t.x-t.bw,t.y-gap*0.08,t.bw-t.pw,Math.max(1,gap*0.045));
  ctx.fillRect(t.x+t.pw,t.y-gap*0.08,t.bw-t.pw,Math.max(1,gap*0.045));
}

function drawSpring(){
  var cx=laneX+laneW/2;
  var travel=gap*1.05;
  var y=launchBaseY+travel*charge - recoil*gap*0.5;
  var top=y+gap*0.30, bot=H-margin*0.25;
  var len=Math.max(gap*0.4,bot-top), loops=7;
  ctx.strokeStyle='#1c1310'; ctx.lineWidth=Math.max(3,gap*0.13);
  for(var i=0;i<loops;i++){
    ctx.beginPath();
    ctx.ellipse(cx,top+(i+0.5)*len/loops,laneW*0.36,Math.max(1,len/loops*0.44),0,0,6.2832);
    ctx.stroke();
  }
  ctx.strokeStyle='#8b9498'; ctx.lineWidth=Math.max(2,gap*0.085);
  for(var j=0;j<loops;j++){
    ctx.beginPath();
    ctx.ellipse(cx,top+(j+0.5)*len/loops,laneW*0.36,Math.max(1,len/loops*0.44),0,0,6.2832);
    ctx.stroke();
  }
  ctx.strokeStyle='#eef1f2'; ctx.lineWidth=Math.max(1,gap*0.03);
  for(var k=0;k<loops;k++){
    ctx.beginPath();
    ctx.ellipse(cx-laneW*0.06,top+(k+0.5)*len/loops,laneW*0.36,Math.max(1,len/loops*0.44),0,3.5,5.2);
    ctx.stroke();
  }
  /* striker head */
  var hw=laneW*0.44, hh=gap*0.30;
  ctx.fillStyle='#20262a'; ctx.fillRect(cx-hw-1,y-hh-1,(hw+1)*2,hh*2+2);
  ctx.fillStyle='#8b9498'; ctx.fillRect(cx-hw,y-hh,hw*2,hh*2);
  ctx.fillStyle='#eef1f2'; ctx.fillRect(cx-hw,y-hh,hw*2,Math.max(1,hh*0.4));
  ctx.fillStyle='#4a5257'; ctx.fillRect(cx-hw,y+hh*0.5,hw*2,Math.max(1,hh*0.5));
}

/* ---- loop ---- */
var last=0, lastInput=-9999, nextAuto=1200;
function frame(now){
  if(!last) last=now;
  var dt=Math.min(0.033,(now-last)/1000); last=now;

  if(charging) charge=Math.min(1,(now-chargeT)/CHARGE_MS);
  if(charging && ac) humSet(charge);
  recoil*=Math.pow(0.0009,dt);

  hits.length=0;
  var sub=6, sd=dt/sub;
  for(var s=0;s<sub;s++) step(sd);

  /* tulip petal snap: fast, springy, then it stays where it is */
  for(var i=0;i<tulips.length;i++){
    var t=tulips[i];
    if(t.open!==t.tgt||Math.abs(t.vel)>0.001){
      t.vel+=(t.tgt-t.open)*160*dt; t.vel*=Math.pow(0.0008,dt);
      t.open+=t.vel*dt;
      if(t.open>1.14)  {t.open=1.14;t.vel*=-0.35;}
      if(t.open<0){t.open=0;t.vel=0;}
    }
  }

  /* play the loudest handful of this frame's strikes */
  if(ac&&hits.length){
    hits.sort(function(a,b){return b.v-a.v;});
    for(var h=0;h<hits.length&&h<6;h++) tick(hits[h].v,hits[h].f);
  }

  /* the hall keeps running when nobody's thumb is on it */
  if(now-lastInput>7000){
    nextAuto-=dt*1000;
    if(nextAuto<=0){
      nextAuto=420+Math.random()*1100;
      var c=Math.random();
      charge=c; recoil=0; fire(c);
    }
  }

  ctx.drawImage(stat,0,0,W,H);
  for(var q=0;q<tulips.length;q++) drawTulip(tulips[q]);
  for(var b=0;b<balls.length;b++) ballAt(ctx,balls[b].x,balls[b].y,balls[b].r);
  drawSpring();
  requestAnimationFrame(frame);
}

/* ---- thumb ---- */
function press(e){
  if(e.target&&e.target.tagName==='A') return;
  if(e.cancelable) e.preventDefault();
  initAudio();
  lastInput=performance.now();
  if(charging) return;
  charging=true; chargeT=performance.now(); charge=0;
  humStart();
}
function release(e){
  if(!charging) return;
  if(e&&e.cancelable) e.preventDefault();
  charging=false;
  lastInput=performance.now();
  var c=charge;
  humStop(c);
  fire(c);
  charge=0;
}
window.addEventListener('pointerdown',press,{passive:false});
window.addEventListener('pointerup',release,{passive:false});
window.addEventListener('pointercancel',release,{passive:false});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!e.repeat){e.preventDefault();press(e);} },{passive:false});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'){e.preventDefault();release(e);} },{passive:false});

var rt=null;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){ balls.length=0; build(); },180);
});

build();
requestAnimationFrame(frame);

/* one honest measurement, for anyone who opens the drawer */
(function(){
  var min=1e9;
  for(var i=0;i<pins.length;i++) for(var j=i+1;j<pins.length;j++){
    var d=Math.hypot(pins[i].x-pins[j].x,pins[i].y-pins[j].y);
    if(d<min) min=d;
  }
  console.log('%c●','color:#c99a2e;font-size:22px',
    pins.length+' pins · ball ⌀ '+(ballR*2).toFixed(1)+'px · tightest pin gap '+
    min.toFixed(1)+'px · clearance '+(min-ballR*2-pinR*2).toFixed(1)+'px · 3 tulips · 1 spring');
})();
})();
</script>
