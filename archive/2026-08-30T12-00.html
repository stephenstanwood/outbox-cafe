  <meta name="outbox-spec-subject" content="The flat mechanical business of pinning a hem on a bias-cut skirt for a second fitting — that bias cloth hangs at forty-five degrees to the grain and therefore stretches under its own weight for days after it is cut, which is why the dress was hung on a rail for a week before anybody touched the hem and why a bias hem pinned on the day of cutting is a hem that will be four centimetres crooked by the wedding; that you never measure a hem from the waist, you measure UP from the floor with a chalk marker on a stand and the wearer standing still and turning a quarter at a time, because the floor is the only reference that does not lie about a body; that the shoes matter more than anything the customer says, and a hem pinned in flat slippers is wrong by exactly the heel height and cannot be argued out of it; that a person standing for a fitting stands differently than a person standing anywhere else — she lifts, she holds her breath, she puts weight on one leg — so the fitter chalks, then talks about something else for a minute, then chalks again and takes the second figure; that seam allowance on a curved hem cannot simply be turned up, because the outer circumference of the turned edge is longer than the place it has to lie flat against, which is why a deep hem on a wide skirt has to be eased with a running thread and shrunk with steam, or faced with a separate bias strip cut on the same grain; that pins go in perpendicular to the fold and about every eight centimetres on straight runs and closer than that through the curve; that the mother in the room is a real variable and every fitter budgets time for her; and the flat arithmetic that this dress is due on the 6th, there are two more fittings booked behind it this afternoon, and the shop closes at five.">
  <meta name="outbox-spec-tone" content="The steady, practical, slightly amused voice of Wiesława Dudek-Ostrowska, fifty-one, who has the pins in her mouth and is therefore speaking in short bursts between them, kneeling at the hem, talking half to the girl on the stand and half to the girl's mother sitting behind her with an opinion. Warm and completely unbothered. She says the same measurement out loud twice every time. She is politely immovable about the shoes. She is genuinely pleased when the girl stops lifting her shoulders. She keeps a running count of pins left in the cushion. She mentions the rain twice, and the shoe-repair machine downstairs once. Never wry, never deadpan, never a craftsman-sage, never wistful, never a mother-and-daughter emotional arc.">

<body>
<!-- pin cushion: started at forty. she counts down. -->
<!-- hem measured up from the floor, never down from the waist. the floor does not lie. -->
<div id="room"><span id="sentence"></span></div>
<div id="foot"><a href="/archive" title="the other afternoons">book list</a></div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------
   The sentence is a tree. Nodes are either WORD leaves or SLOT joints.
   Insertion happens at a SLOT (between two words), never at the end.
   ------------------------------------------------------------------ */

var uid = 0;
function W(text, opts){
  opts = opts||{};
  return {t:"w", id:++uid, text:text, sealed:!!opts.sealed, anchored:false, fresh:0, kinds:opts.kinds||[]};
}
function S(kinds){
  return {t:"s", id:++uid, kinds:kinds||["general"], sealed:false, depth:0};
}

/* Build a list-of-nodes: word, slot, word, slot, word ... */
function seq(words, slotKinds){
  var out=[];
  for(var i=0;i<words.length;i++){
    out.push(W(words[i]));
    if(i<words.length-1) out.push(S(slotKinds && slotKinds[i] ? slotKinds[i] : ["general"]));
  }
  return out;
}

var seed = "Turn to the window she wants the hem level with the light".split(" ");
var nodes = [];
(function(){
  var kindMap = [
    ["general","address"],      // Turn |
    ["general"],                // to |
    ["general","noun"],         // the |
    ["general","noun","aside"], // window |
    ["general","speech"],       // she |
    ["general","verb"],         // wants |
    ["general","noun"],         // the |
    ["general","noun","aside"], // hem |
    ["general"],                // level |
    ["general"],                // with |
    ["general","noun"]          // the |
  ];
  for(var i=0;i<seed.length;i++){
    nodes.push(W(seed[i]));
    if(i<seed.length-1) nodes.push(S(kindMap[i]||["general"]));
  }
})();

/* ------------------------------------------------------------------
   Clause generator. Each entry: text, kinds it may attach to, weight.
   All are grammatically insertable between two words as a parenthetical
   or subordinate run — no punctuation used anywhere.
   ------------------------------------------------------------------ */

var CLAUSES = [
  // --- bias / grain ---
  {k:["general","noun","aside"], w:3, t:"which is cut on the true bias at forty five degrees to the grain"},
  {k:["general","aside"], w:3, t:"and bias cloth goes on stretching under its own weight for days after the cutting"},
  {k:["general","aside"], w:2, t:"so it hung on the rail a full week before anybody came near the hem"},
  {k:["general","aside"], w:2, t:"because a bias hem pinned the day it is cut is four centimetres crooked by the sixth"},
  {k:["general","noun"], w:2, t:"the panel that took the drop worst being the left front"},
  {k:["general","aside"], w:2, t:"and I will not pin a bias hem in a hurry for anybody living"},

  // --- floor measurement ---
  {k:["general","aside"], w:3, t:"and you never take a hem down from the waist you take it up from the floor"},
  {k:["general","aside"], w:3, t:"twenty four centimetres up twenty four centimetres up"},
  {k:["general","aside"], w:2, t:"twenty three and a half here twenty three and a half"},
  {k:["general","aside"], w:2, t:"the chalk marker is on the stand at the height I set it and it does not move once we begin"},
  {k:["general","aside"], w:2, t:"the floor being the one reference in this room that does not lie about a body"},
  {k:["general","address"], w:2, t:"a quarter turn now Halinka a quarter and stop"},
  {k:["general","address"], w:2, t:"another quarter and stop there stop"},

  // --- the shoes ---
  {k:["general","aside"], w:3, t:"and the shoes matter more than anything anybody says in this room"},
  {k:["general","aside"], w:2, t:"a hem pinned in flat slippers is wrong by exactly the heel height and no argument moves it"},
  {k:["general","aside"], w:2, t:"five and a half centimetres on that heel five and a half"},
  {k:["general","speech"], w:2, t:"and the mother says she may wear the other pair on the day"},
  {k:["general","aside"], w:2, t:"and I say then bring me the other pair and we will do this again on Friday which is fine by me"},

  // --- standing / posture ---
  {k:["general","aside"], w:2, t:"a person on a stand stands unlike a person anywhere else in the world"},
  {k:["general","aside"], w:2, t:"she lifts she holds her breath she puts her weight on the one leg"},
  {k:["general","address"], w:2, t:"there now your shoulders came down that is much better that is good"},
  {k:["general","aside"], w:2, t:"so I chalk once and talk about the rain a minute and chalk again and I keep the second figure"},
  {k:["general","address"], w:1, t:"breathe out and let the ribs go you are not on parade"},

  // --- seam allowance / easing ---
  {k:["general","aside"], w:2, t:"and a curved hem cannot simply be turned up like a tea towel"},
  {k:["general","aside"], w:2, t:"the outer edge of the turn being longer than the cloth it must lie flat against"},
  {k:["general","aside"], w:2, t:"which is why a deep hem on a wide skirt gets a running thread and a shrink with steam"},
  {k:["general","aside"], w:2, t:"or else a faced strip cut on the same grain and set on by hand"},
  {k:["general","aside"], w:1, t:"four centimetres of allowance here and no more than four"},

  // --- pins ---
  {k:["general","aside"], w:3, t:"pins in perpendicular to the fold always perpendicular"},
  {k:["general","aside"], w:2, t:"eight centimetres apart on the straight runs and closer through the curve"},
  {k:["general","aside"], w:2, t:"and that is thirty one left in the cushion thirty one"},
  {k:["general","aside"], w:2, t:"twenty six left twenty six and there is a box on the shelf"},
  {k:["general","aside"], w:2, t:"nineteen in the cushion nineteen"},
  {k:["general","aside"], w:1, t:"and if I sound like this it is because I have four of them in my mouth"},

  // --- the mother ---
  {k:["general","speech"], w:3, t:"and the mother behind me says it looks long"},
  {k:["general","speech"], w:2, t:"and the mother says her cousin had hers done shorter than that"},
  {k:["general","speech"], w:2, t:"and the mother wants to know whether it will drop again"},
  {k:["general","speech"], w:2, t:"and I say it has done its dropping on the rail already and I have the week to prove it"},
  {k:["general","speech"], w:2, t:"and the mother asks about the sleeve and the sleeve is Friday"},
  {k:["general","aside"], w:2, t:"and I budget twelve minutes for the mother in every fitting and today I am inside it"},
  {k:["general","speech"], w:1, t:"and I say sit where you are and you will see it better from there than from over my shoulder"},

  // --- schedule / weather / shop ---
  {k:["general","aside"], w:2, t:"and this dress is due on the sixth"},
  {k:["general","aside"], w:2, t:"and there are two more behind it this afternoon and we shut at five"},
  {k:["general","aside"], w:2, t:"it is ten past three and Pani Grabiec is at half past"},
  {k:["general","aside"], w:2, t:"and the rain has not let up since half eleven"},
  {k:["general","aside"], w:2, t:"and the rain again listen to that on the glass"},
  {k:["general","aside"], w:2, t:"and the finishing wheel has started up downstairs so hold still through it"},
  {k:["general","noun"], w:1, t:"the good window the one that opens"},
  {k:["general","aside"], w:1, t:"and I want the light across the hem not down it"},

  // --- small mechanical asides ---
  {k:["general","aside"], w:1, t:"and I mark twice because I say every figure twice"},
  {k:["general","aside"], w:1, t:"the tape is on my neck where it lives"},
  {k:["general","aside"], w:1, t:"and knees on the mat because the boards are cold"},
  {k:["general","aside"], w:1, t:"and we will thread mark it before you step down"},
  {k:["general","aside"], w:1, t:"and do not step off the stand until I say"}
];

/* wildcard */
var WILDCARD = "— and the third window has been painted shut since Kubica had the shop —";
var wildcardPlaced = false;

/* ------------------------------------------------------------------
   Anchors persist across visits by word text signature.
   ------------------------------------------------------------------ */
var ANCHOR_KEY = "wd_ostrowska_anchors_v1";
var anchorSet = {};
try{
  var raw = localStorage.getItem(ANCHOR_KEY);
  if(raw){ var arr = JSON.parse(raw); if(arr && arr.length){ for(var i=0;i<arr.length;i++) anchorSet[arr[i]]=true; } }
}catch(e){}
function saveAnchors(){
  try{
    var out=[]; for(var k in anchorSet){ if(anchorSet.hasOwnProperty(k)) out.push(k); }
    localStorage.setItem(ANCHOR_KEY, JSON.stringify(out.slice(0,400)));
  }catch(e){}
}
function anchorKey(node, idx){ return node.text.toLowerCase().replace(/[^a-ząćęłńóśźż]/g,"") + "#" + idx; }

/* apply persisted anchors to seed words */
(function(){
  var wi=0;
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].t==="w"){
      if(anchorSet[anchorKey(nodes[i], wi)]) nodes[i].anchored=true;
      wi++;
    }
  }
})();

/* ------------------------------------------------------------------
   Insertion engine
   ------------------------------------------------------------------ */

var focusIndex = -1;   // index in nodes of last clicked word
var insertCount = 0;

function slotIsOpen(idx){
  var s = nodes[idx];
  if(s.t!=="s") return false;
  if(s.sealed) return false;
  var L = nodes[idx-1], R = nodes[idx+1];
  if(L && L.t==="w" && (L.anchored || L.sealed)) {
    // anchored word: clauses may not split it — a slot adjacent to it is still legal
    // unless the word is part of a sealed run (wildcard), which is fully closed.
    if(L.sealed) return false;
  }
  if(R && R.t==="w" && R.sealed) return false;
  // an anchored word forbids splitting the pair it forms with its neighbour
  if(L && L.t==="w" && L.anchored && R && R.t==="w" && R.anchored) return false;
  if(L && L.t==="w" && L.anchored && Math.random()<0.86) return false;
  if(R && R.t==="w" && R.anchored && Math.random()<0.86) return false;
  return true;
}

function pickSlot(){
  var open=[];
  for(var i=1;i<nodes.length-1;i++){
    if(nodes[i].t==="s" && !nodes[i].sealed){
      var L=nodes[i-1], R=nodes[i+1];
      if(L && L.sealed) continue;
      if(R && R.sealed) continue;
      if(L && L.anchored && R && R.anchored) continue;
      if(L && L.anchored) continue;
      if(R && R.anchored) continue;
      open.push(i);
    }
  }
  if(!open.length) return -1;
  // weight heavily toward the focus
  var best=null, bestScore=-1;
  for(var j=0;j<open.length;j++){
    var idx=open[j];
    var d = (focusIndex>=0) ? Math.abs(idx-focusIndex) : 9999;
    var prox = (focusIndex>=0) ? (1/(1+d*0.28)) : 0;
    var score = Math.random()*0.35 + prox*2.4 + Math.random()*prox*3.0;
    if(score>bestScore){bestScore=score;best=idx;}
  }
  return best;
}

function clausesFor(slot){
  var out=[];
  for(var i=0;i<CLAUSES.length;i++){
    var c=CLAUSES[i];
    for(var j=0;j<c.k.length;j++){
      if(slot.kinds.indexOf(c.k[j])>=0){ out.push(c); break; }
    }
  }
  return out.length?out:CLAUSES;
}

var usedRecently = [];
function chooseClause(slot){
  var pool = clausesFor(slot);
  var total=0, i;
  for(i=0;i<pool.length;i++){
    var pen = usedRecently.indexOf(pool[i].t)>=0 ? 0.06 : 1;
    total += pool[i].w * pen;
  }
  var r = Math.random()*total, acc=0;
  for(i=0;i<pool.length;i++){
    var pen2 = usedRecently.indexOf(pool[i].t)>=0 ? 0.06 : 1;
    acc += pool[i].w*pen2;
    if(r<=acc){ 
      usedRecently.push(pool[i].t);
      if(usedRecently.length>14) usedRecently.shift();
      return pool[i];
    }
  }
  return pool[pool.length-1];
}

function nodesForClause(text, sealed){
  var parts = text.split(" ");
  var out=[];
  for(var i=0;i<parts.length;i++){
    var kinds = ["general"];
    var lower = parts[i].toLowerCase();
    if(/^(the|a|that|this|her|his|my|its)$/.test(lower)) kinds=["general","noun"];
    else if(/^(and|so|because|which|but|or)$/.test(lower)) kinds=["general","aside"];
    else if(/^(says|say|said|wants|asks)$/.test(lower)) kinds=["general","speech","verb"];
    var w = W(parts[i], {sealed:sealed, kinds:kinds});
    w.fresh = 1;
    out.push(w);
    out.push(S(kinds));
  }
  // trailing slot kept: it becomes the join back to the right-hand word
  if(sealed){ for(var s=0;s<out.length;s++){ out[s].sealed=true; } }
  return out;
}

function doInsert(){
  var slotIdx;
  var sealed=false, text;

  if(!wildcardPlaced && insertCount>=5 && Math.random()<0.30){
    slotIdx = pickSlot();
    if(slotIdx<0) return 0;
    text = WILDCARD;
    sealed = true;
    wildcardPlaced = true;
  } else {
    slotIdx = pickSlot();
    if(slotIdx<0) return 0;
    var c = chooseClause(nodes[slotIdx]);
    text = c.t;
  }

  var newNodes = nodesForClause(text, sealed);
  // replace the slot with: slot, ...clause words+slots
  var head = S(nodes[slotIdx].kinds);
  var tail = newNodes;
  var splice = [head].concat(tail);
  nodes.splice.apply(nodes, [slotIdx,1].concat(splice));

  insertCount++;
  render();
  fitText();
  return text.length;
}

/* ------------------------------------------------------------------
   Render
   ------------------------------------------------------------------ */
var sentenceEl = document.getElementById("sentence");
var roomEl = document.getElementById("room");

function render(){
  var frag = document.createDocumentFragment();
  var wi=0;
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(n.t!=="w") continue;
    var sp = document.createElement("span");
    sp.className = "w";
    if(n.fresh>0) sp.className += " fresh";
    if(n.anchored) sp.className += " anchored";
    if(n.sealed) sp.className += " sealed";
    if(i===focusIndex) sp.className += " target";
    sp.textContent = n.text;
    sp.setAttribute("data-i", i);
    frag.appendChild(sp);
    frag.appendChild(document.createTextNode(" "));
    wi++;
  }
  var per = document.createElement("span");
  per.className = "period";
  per.textContent = ".";
  per.id = "the-full-stop";
  frag.appendChild(per);
  sentenceEl.innerHTML = "";
  sentenceEl.appendChild(frag);
}

/* fade freshness over time */
setInterval(function(){
  var changed=false;
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].t==="w" && nodes[i].fresh>0){
      nodes[i].fresh -= 1;
      if(nodes[i].fresh<=0){ nodes[i].fresh=0; changed=true; }
    }
  }
  if(changed){
    var spans = sentenceEl.querySelectorAll(".w.fresh");
    for(var s=0;s<spans.length;s++){
      var idx = +spans[s].getAttribute("data-i");
      if(nodes[idx] && nodes[idx].fresh<=0) spans[s].classList.remove("fresh");
    }
  }
}, 2600);

/* ------------------------------------------------------------------
   Fit: binary search font size so the sentence exactly fills the box
   ------------------------------------------------------------------ */
var currentSize = 40;
function measureOverflow(px){
  sentenceEl.style.fontSize = px + "px";
  // force layout
  var h = sentenceEl.scrollHeight;
  var avail = roomEl.clientHeight - (parseFloat(getComputedStyle(roomEl).paddingTop)+parseFloat(getComputedStyle(roomEl).paddingBottom));
  return h - avail;
}
function fitText(){
  var lo = 4.2, hi = 96, best = lo;
  var avail = roomEl.clientHeight - (parseFloat(getComputedStyle(roomEl).paddingTop)+parseFloat(getComputedStyle(roomEl).paddingBottom));
  for(var it=0; it<17; it++){
    var mid = (lo+hi)/2;
    sentenceEl.style.fontSize = mid + "px";
    var h = sentenceEl.scrollHeight;
    if(h <= avail){ best = mid; lo = mid; } else { hi = mid; }
  }
  currentSize = best;
  sentenceEl.style.fontSize = best.toFixed(2) + "px";
  // if extremely small, relax justification so it doesn't shred
  sentenceEl.style.textAlignLast = best < 9 ? "justify" : "justify";
  sentenceEl.style.lineHeight = best < 11 ? "1.2" : "1.28";
}

/* ------------------------------------------------------------------
   Interaction: click = focus, hold = anchor
   ------------------------------------------------------------------ */
var holdTimer=null, holdTarget=null, held=false;

function wordAt(ev){
  var t = ev.target;
  if(t && t.classList && t.classList.contains("w")) return t;
  return null;
}

function beginHold(ev){
  var el = wordAt(ev);
  if(!el) return;
  held=false;
  holdTarget = el;
  holdTimer = setTimeout(function(){
    held = true;
    var idx = +el.getAttribute("data-i");
    var n = nodes[idx];
    if(!n || n.t!=="w") return;
    if(n.sealed){ tick(0.4); return; }  // wildcard: holding does nothing
    if(!n.anchored){
      n.anchored = true;
      var wi=0;
      for(var i=0;i<idx;i++){ if(nodes[i].t==="w") wi++; }
      anchorSet[anchorKey(n, wi)] = true;
      saveAnchors();
      el.classList.add("anchored");
      pinTick();
    }
  }, 520);
}
function endHold(ev){
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  if(held){ held=false; if(ev && ev.preventDefault) ev.preventDefault(); return; }
  var el = wordAt(ev);
  if(!el) return;
  var prev = sentenceEl.querySelector(".w.target");
  if(prev) prev.classList.remove("target");
  el.classList.add("target");
  focusIndex = +el.getAttribute("data-i");
  clothTick();
}

sentenceEl.addEventListener("mousedown", beginHold);
sentenceEl.addEventListener("mouseup", endHold);
sentenceEl.addEventListener("mouseleave", function(){ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
sentenceEl.addEventListener("touchstart", function(e){ beginHold({target:e.target}); }, {passive:true});
sentenceEl.addEventListener("touchend", function(e){
  var t = e.changedTouches[0];
  var el = document.elementFromPoint(t.clientX, t.clientY);
  endHold({target:el, preventDefault:function(){ e.preventDefault(); }});
}, {passive:false});
sentenceEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* ------------------------------------------------------------------
   Web Audio: rain bed, cloth whoosh, pin tick, finishing wheel
   ------------------------------------------------------------------ */
var AC=null, master=null, audioOn=false;
function initAudio(){
  if(audioOn) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = 0.5;
    master.connect(AC.destination);
    audioOn = true;
    startRain();
    scheduleWheel();
  }catch(e){ audioOn=false; }
}

function noiseBuffer(sec){
  var len = Math.floor(AC.sampleRate*sec);
  var b = AC.createBuffer(1, len, AC.sampleRate);
  var d = b.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  return b;
}

function startRain(){
  var src = AC.createBufferSource();
  src.buffer = noiseBuffer(4);
  src.loop = true;
  var lp = AC.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value=1250; lp.Q.value=0.4;
  var hp = AC.createBiquadFilter();
  hp.type="highpass"; hp.frequency.value=170;
  var g = AC.createGain();
  g.gain.value = 0.030;
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master);
  src.start();
  // slow gusts against the glass
  (function gust(){
    if(!AC) return;
    var t = AC.currentTime;
    var up = 0.030 + Math.random()*0.026;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(up, t + 2 + Math.random()*3);
    g.gain.linearRampToValueAtTime(0.028, t + 6 + Math.random()*5);
    setTimeout(gust, 7000 + Math.random()*9000);
  })();
}

function clothWhoosh(chars){
  if(!audioOn) return;
  var t = AC.currentTime;
  var src = AC.createBufferSource();
  src.buffer = noiseBuffer(0.7);
  var bp = AC.createBiquadFilter();
  bp.type = "bandpass";
  var centre = 900 - Math.min(chars,90)*6;   // longer clause -> lower, heavier shift
  bp.frequency.setValueAtTime(centre+700, t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(180,centre*0.5), t+0.42);
  bp.Q.value = 0.85;
  var g = AC.createGain();
  var peak = 0.055 + Math.min(chars,100)/100*0.05;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t+0.055);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t+0.55);
}

function clothTick(){
  if(!audioOn) return;
  var t=AC.currentTime;
  var src=AC.createBufferSource(); src.buffer=noiseBuffer(0.12);
  var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1400; bp.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.028,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  src.connect(bp);bp.connect(g);g.connect(master);
  src.start(t);src.stop(t+0.13);
}

function pinTick(){ tick(1); }
function tick(vol){
  if(!audioOn) return;
  var t = AC.currentTime;
  var o = AC.createOscillator();
  o.type = "square";
  o.frequency.setValueAtTime(2400, t);
  o.frequency.exponentialRampToValueAtTime(1050, t+0.03);
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.035*vol, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.055);
  var hp = AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=800;
  o.connect(hp); hp.connect(g); g.connect(master);
  o.start(t); o.stop(t+0.07);
}

/* shoe-repair finishing wheel, downstairs, on its own clock */
function runWheel(){
  if(!audioOn) return;
  var t = AC.currentTime;
  var dur = 2.4 + Math.random()*5.5;
  var src = AC.createBufferSource();
  src.buffer = noiseBuffer(2);
  src.loop = true;
  var bp = AC.createBiquadFilter();
  bp.type="bandpass"; bp.frequency.value = 240; bp.Q.value = 3.4;
  var lp = AC.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value = 480;
  var o = AC.createOscillator();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(46, t);
  o.frequency.linearRampToValueAtTime(63, t+0.9);
  o.frequency.setValueAtTime(63, t+dur-0.7);
  o.frequency.linearRampToValueAtTime(40, t+dur);
  var og = AC.createGain();
  og.gain.value = 0.010;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.020, t+0.8);
  g.gain.setValueAtTime(0.020, t+dur-0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(bp); bp.connect(lp); lp.connect(g);
  o.connect(og); og.connect(lp);
  g.connect(master);
  src.start(t); src.stop(t+dur+0.1);
  o.start(t); o.stop(t+dur+0.1);
}
function scheduleWheel(){
  var wait = 9000 + Math.random()*34000;
  setTimeout(function(){ runWheel(); scheduleWheel(); }, wait);
}

document.addEventListener("pointerdown", initAudio, {once:true});
document.addEventListener("keydown", initAudio, {once:true});

/* ------------------------------------------------------------------
   Growth clock — slows as anchors starve the open slots
   ------------------------------------------------------------------ */
function openSlotCount(){
  var n=0;
  for(var i=1;i<nodes.length-1;i++){
    if(nodes[i].t==="s" && !nodes[i].sealed){
      var L=nodes[i-1],R=nodes[i+1];
      if(L&&L.sealed) continue;
      if(R&&R.sealed) continue;
      if(L&&L.anchored) continue;
      if(R&&R.anchored) continue;
      n++;
    }
  }
  return n;
}
function totalSlotCount(){
  var n=0;
  for(var i=1;i<nodes.length-1;i++) if(nodes[i].t==="s") n++;
  return n;
}

function nextDelay(){
  var open = openSlotCount(), all = Math.max(1,totalSlotCount());
  var ratio = open/all;            // 1 = wide open, 0 = fully pinned
  var base = 3400;
  if(ratio<=0) return 9000;
  return base + (1-ratio)*(1-ratio)*15000 + Math.random()*1400;
}

function loop(){
  var chars = doInsert();
  if(chars>0) clothWhoosh(chars);
  setTimeout(loop, nextDelay());
}

fitText();
