  <meta name="outbox-spec-era" content="Undated / out of time — the plain loud physical fact of the boiling surface of a star, the churning convective photosphere the same whether you picture it in 1610 through Galileo's first sunspot sketch or in a solar-telescope feed streaming to a browser right now; not pinned to any decade because convection does exactly what convection has always done — hot plasma rises in the bright center of a granule, cools, and sinks in the dark lanes at its edge, boiling the skin of a star into a restless cobblestone of light that has looked this way for four and a half billion years and is doing it this very second. Not a relic, not a nostalgia piece, not a solemn cosmic wonder — a stovetop the size of a star, rolling and popping and healing itself over and over, bright and violent and cheerful.">
  <meta name="outbox-spec-format" content="The entire viewport IS the roiling surface of a star, edge to edge, rendered as a live generative convection field: hundreds of bright plasma GRANULES continuously bubbling up — each a rounded cell that brightens hot-white at its rising center, spreads, cools, and darkens into the ragged red-black intergranular lanes where the plasma sinks, so the whole surface is a slow-boiling cobblestone of light that never holds still and never repeats. Granules are born, swell, split, and get swallowed by their neighbors in continuous convective churn; every so often a bright arc of plasma loops up off the surface and rains back down. No chrome, no captions, no header, no controls, no text anywhere — just the living churning photosphere filling the frame. Where the cursor rests, the plasma cools into a darkening SUNSPOT that the surrounding granulation flows around; move away and the granules crowd back in and heal it closed over a few seconds.">
  <meta name="outbox-spec-subject" content="Solar granulation — the convective boiling of a star's photosphere: the way rising columns of hot plasma dome up into bright million-degree granule-cells roughly a thousand kilometers across, spill over and cool at their tops, and pour back down through the darker sinking lanes between them; the constant birth, swelling, splitting, and swallowing of granules across the whole surface; the darker cooler pit of a sunspot where a knot of magnetic field chokes off the convection and holds the plasma down; and the bright plasma arcs that leap up along field lines and fall back. Not a metaphor for anything and not a solemn meditation on the cosmos — the plain roaring physical fact of the outermost skin of a star turning itself over, the exact churning texture you'd see through a good hydrogen-alpha filter on any clear afternoon.">

<title>A Stovetop the Size of a Star</title>
<style>
  /* the whole viewport is the rolling skin of a star — no chrome, just the boil */
  html,body{margin:0;padding:0;height:100%;background:#1e0f06;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;position:fixed;inset:0;cursor:crosshair;touch-action:none;}
  /* a faint ember tucked in the corner — the only handhold on the page */
  #more{
    position:fixed;right:12px;bottom:11px;z-index:5;
    font:16px/1 Georgia,serif;color:#ffe27a;text-decoration:none;
    opacity:.14;transition:opacity 1s ease, text-shadow 1s ease;
    text-shadow:0 0 6px #f5b02a;user-select:none;
  }
  #more:hover,#more:focus{opacity:.95;text-shadow:0 0 14px #fff0c4,0 0 26px #f5b02a;outline:none;}
  #tally{position:fixed;left:-9999px;top:-9999px;}
</style>

<body>
<canvas id="c" aria-label="The boiling convective surface of a star, granules bubbling up and sinking, healing over wherever the cursor rests."></canvas>
<a id="more" href="/archive" aria-label="more of the surface, in the cabinet" title="the rest of the surface">✦</a>
<span id="tally" aria-hidden="true">granules born so far: 0</span>
<script>
(function(){
  "use strict";
  const main=document.getElementById('c');
  const ctx=main.getContext('2d');
  const low=document.createElement('canvas');
  const lctx=low.getContext('2d');
  const tally=document.getElementById('tally');

  let W=0,H=0,lowW=0,lowH=0,img=null,data=null,sc=1,spR=6;
  let N=0, cells=[], CX,CY,SZ,CB;
  let spx=0,spy=0,strength=0;
  let ptrActive=false, ptrDown=false, ptrTouch=false, lastMove=-1e9, pmx=0,pmy=0;
  let arcs=[], nextArc=0, born=0, tallyClock=0;
  let last=0;

  const rnd=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

  function resetCell(c){
    c.x=rnd(-3,lowW+3); c.y=rnd(-3,lowH+3);
    const v0=Math.sqrt((lowW*lowH)/Math.max(1,N))*0.22;
    c.vx=rnd(-v0,v0); c.vy=rnd(-v0,v0);
    c.age=rnd(0,1.5); c.life=rnd(3.6,8.5);
    c.size=rnd(0.6,1.5); // bigger granules claim more surface
  }

  function initCells(){
    cells=[];
    for(let i=0;i<N;i++){ const c={}; resetCell(c); c.age=rnd(0,c.life); cells.push(c); }
    CX=new Float32Array(N); CY=new Float32Array(N);
    SZ=new Float32Array(N); CB=new Float32Array(N);
  }

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    main.width=W; main.height=H;
    lowW=clamp(Math.round(W/7),60,200);
    lowH=Math.max(40,Math.round(lowW*H/W));
    low.width=lowW; low.height=lowH;
    img=lctx.createImageData(lowW,lowH); data=img.data;
    sc=W/lowW;
    spR=Math.max(3,lowW*0.045);
    N=clamp(Math.round(lowW*lowH/260),40,160);
    initCells();
  }

  function updateCells(dt){
    const spacing=Math.sqrt((lowW*lowH)/Math.max(1,N));
    const repelR=spR*strength*2.3, repelR2=repelR*repelR;
    for(let i=0;i<N;i++){
      const c=cells[i];
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      if(c.x<-3){c.x=-3;c.vx=-c.vx;} else if(c.x>lowW+3){c.x=lowW+3;c.vx=-c.vx;}
      if(c.y<-3){c.y=-3;c.vy=-c.vy;} else if(c.y>lowH+3){c.y=lowH+3;c.vy=-c.vy;}
      c.age+=dt;
      if(c.age>c.life){ resetCell(c); born++; } // one granule swallowed, another bubbles up elsewhere
      if(strength>0.01){
        const dx=c.x-spx, dy=c.y-spy, dd=dx*dx+dy*dy;
        if(dd<repelR2 && dd>0.0001){
          const d=Math.sqrt(dd), f=(1-d/repelR)*strength*spacing*2.4*dt;
          c.x+=dx/d*f; c.y+=dy/d*f; // convection genuinely diverts around the cold knot
        }
      }
      const x=clamp(c.age/c.life,0,1);
      c.bright=0.28+0.72*Math.sin(Math.PI*x); // dark birth, hot rise, cooling fall
    }
  }

  function fillArrays(){
    for(let i=0;i<N;i++){ const c=cells[i]; CX[i]=c.x; CY[i]=c.y; SZ[i]=c.size; CB[i]=c.bright; }
  }

  function updateCursor(dt,now){
    const moving=(now-lastMove)<130;
    if(ptrActive){
      if(strength<0.02){ spx=pmx; spy=pmy; }
      else { spx+=(pmx-spx)*Math.min(1,dt*3); spy+=(pmy-spy)*Math.min(1,dt*3); }
      if(moving) strength-=dt/3.6;        // stirred: heals as granules crowd back
      else       strength+=dt/1.6;        // held still: cools and darkens, growing a penumbra
    } else {
      strength-=dt/3.0;                    // cursor gone: knit closed over a few seconds
    }
    strength=clamp(strength,0,1);
  }

  function renderField(now){
    const seed=now*0.00045;
    const uActive=strength>0.01;
    const uR0=spR*strength, sx=spx, sy=spy;
    let idx=0;
    for(let py=0;py<lowH;py++){
      for(let px=0;px<lowW;px++){
        let d1=1e18,d2=1e18,b1=0;
        for(let k=0;k<N;k++){
          const dx=px-CX[k], dy=py-CY[k];
          const dd=(dx*dx+dy*dy)/SZ[k];
          if(dd<d1){ d2=d1; d1=dd; b1=CB[k]; }
          else if(dd<d2){ d2=dd; }
        }
        const s1=Math.sqrt(d1), s2=Math.sqrt(d2);
        let interior=1-2*s1/(s1+s2+1e-6); // 1 at a granule's rising center, 0 down in the lanes
        if(interior<0) interior=0;
        const hot=b1;
        const val=interior*(0.5+0.5*hot);
        const core=interior*interior*interior*hot; // white-hot spill at the very top of the dome
        let t=val*1.4; if(t>1)t=1;
        let R=122+(245-122)*t; // magma lane -> photosphere gold
        let G=42+(176-42)*t;
        let B=12+(42-12)*t;
        R=R+(255-R)*core; G=G+(240-G)*core; B=B+(196-B)*core; // -> hot-white core
        if(uActive){
          const dx=px-sx, dy=py-sy, dist=Math.sqrt(dx*dx+dy*dy);
          const ang=Math.atan2(dy,dx);
          const ragg=1+0.22*Math.sin(ang*5+seed)+0.11*Math.sin(ang*9-seed*0.7);
          const uR=uR0*ragg, pR=uR*2.15;
          if(dist<pR){
            let ss=dist<uR?0:(dist-uR)/(pR-uR);
            const fil=0.68+0.32*Math.sin(ang*34+dist*0.7); // penumbral filaments
            let vis=ss*fil; if(vis>1)vis=1;
            R=30+(R-30)*vis; G=15+(G-15)*vis; B=6+(B-6)*vis; // choked near-black umbra
          }
        }
        data[idx]=R; data[idx+1]=G; data[idx+2]=B; data[idx+3]=255;
        idx+=4;
      }
    }
    lctx.putImageData(img,0,0);
  }

  function spawnArc(){
    const ax=rnd(0,W), ay=rnd(H*0.06,H*0.94);
    const dir=Math.random()<0.5?-1:1;
    const len=rnd(60,220);
    const bx=ax+dir*len;
    const by=ay+rnd(-18,18);
    const h=rnd(90,220);
    const cx=(ax+bx)/2+rnd(-24,24);
    const cy=Math.min(ay,by)-h; // the loop bulges up off the churning surface
    arcs.push({ax,ay,bx,by,cx,cy,t:0,dur:rnd(1.7,3.0)});
  }

  function drawArcs(dt){
    if(!arcs.length) return;
    ctx.globalCompositeOperation='lighter';
    for(let a=arcs.length-1;a>=0;a--){
      const arc=arcs[a];
      arc.t+=dt/arc.dur;
      if(arc.t>=1){ arcs.splice(a,1); continue; }
      const p=arc.t;
      const rise=Math.min(1,p/0.55);
      const fade=p<0.55?1:(1-(p-0.55)/0.45);
      const steps=24;
      for(let i=0;i<=steps;i++){
        const u=rise*i/steps;
        const iu=1-u;
        let ix=iu*iu*arc.ax+2*iu*u*arc.cx+u*u*arc.bx;
        let iy=iu*iu*arc.ay+2*iu*u*arc.cy+u*u*arc.by;
        let dy=0;
        if(p>0.55){ const fp=(p-0.55)/0.45; dy=fp*fp*150*(0.35+0.65*u); } // and rains back down
        const al=fade*(0.10+0.20*(i/steps));
        const rad=(2.6+3.6*(i/steps))*3;
        const grd=ctx.createRadialGradient(ix,iy+dy,0,ix,iy+dy,rad);
        grd.addColorStop(0,'rgba(255,240,196,'+al+')');
        grd.addColorStop(0.4,'rgba(255,226,122,'+(al*0.65)+')');
        grd.addColorStop(1,'rgba(255,226,122,0)');
        ctx.fillStyle=grd;
        ctx.beginPath(); ctx.arc(ix,iy+dy,rad,0,6.29); ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
  }

  function frame(now){
    let dt=(now-last)/1000; if(!(dt>0)) dt=0.016; if(dt>0.05) dt=0.05; last=now;
    updateCells(dt);
    updateCursor(dt,now);
    fillArrays();
    renderField(now);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(low,0,0,W,H);
    const nowS=now/1000;
    if(nowS>nextArc && arcs.length<3){ spawnArc(); nextArc=nowS+rnd(4,12); } // never on a fixed beat
    drawArcs(dt);
    tallyClock+=dt;
    if(tallyClock>1){ tally.textContent='granules born so far: '+born; tallyClock=0; }
    requestAnimationFrame(frame);
  }

  // pointer -> the cooling knot that becomes a sunspot
  function toLow(e){ pmx=e.clientX/W*lowW; pmy=e.clientY/H*lowH; }
  main.addEventListener('pointermove',function(e){ toLow(e); lastMove=performance.now(); ptrActive=true; ptrTouch=(e.pointerType==='touch'); });
  main.addEventListener('pointerdown',function(e){ toLow(e); lastMove=performance.now(); ptrActive=true; ptrDown=true; ptrTouch=(e.pointerType==='touch'); });
  main.addEventListener('pointerup',function(e){ ptrDown=false; if(e.pointerType==='touch') ptrActive=false; });
  main.addEventListener('pointercancel',function(){ ptrDown=false; ptrActive=false; });
  main.addEventListener('pointerleave',function(){ if(!ptrTouch) ptrActive=false; });

  let rt=null;
  window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(resize,180); });

  resize();
  nextArc=performance.now()/1000+2.5;
  last=performance.now();
  requestAnimationFrame(frame);

  // hello from the photosphere — four and a half billion years and still boiling, still refusing to repeat
  console.log('%c hot plasma rises in the bright middle, cools, sinks in the dark lanes — over and over, forever ',
    'background:#7a2a0c;color:#fff0c4;padding:3px 8px;border-radius:3px;');
})();
</script>

<script src="/nav.js" defer></script>
</body>
