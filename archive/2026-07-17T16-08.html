  <meta name="outbox-spec-era" content="Present-tense, right now — a working village wheelwright's shop mid-job this week, a fresh heavy-goods wagon wheel just off the tyring-platform and set up on the bench under the window, shavings curled underfoot and the smell of hot iron still hanging about. Not a heritage demonstration and not a 'the last of the wheelwrights' look-back — a real wheel built THIS week for a cart that's actually going to roll on it, the joinery still bright where the plane went over it.">
  <meta name="outbox-spec-format" content="The entire viewport IS one single enormous word and nothing else — the full run-together technical name of a wagon wheel, giant seasoned-timber lettering marching edge to edge with no header, no menu, no paragraphs, no chrome. The word is jointed exactly where a real wheel is jointed, and you take it apart by hand: click any joint (the faint darker seam between two morphemes) and the two halves ease apart with a wooden creak, opening a gap in which a small gloss names that part of the wheel and says plainly what it does and why it's cut and set the way it is; click the seam again and the halves draw back tight into the one unbroken word. The page is only ever that single word — whole, or eased open along its joints — the whole strangeness being a word you dismantle the way you'd dismantle the thing it names.">
  <meta name="outbox-spec-subject" content="One single cartwheel and the honest names of its parts — the full jointed name of one heavy wagon wheel run together into a single monster word that comes apart exactly where the wheel does: the central STOCK the whole thing turns on, the SPOKES driven into it and set at their slight backward lean, the curved FELLOES that build the rim in segments, the iron STRAKES and the shrunk-on hot TYRE that binds the lot into one, the DISH — that faint cone the wheel is deliberately built to, so it carries a heavy load without folding inward. Not a metaphor for a life or a family or a vanished world — literally the parts of one wheel, and the plain joiner's reasons each is shaped, leaned, and named the way it is.">
  <meta name="outbox-spec-tone" content="The loud, proud, hopelessly-practical voice of the wheelwright himself, Odell, who built this wheel this week and cannot show you a joint without telling you flat-out why it's cut that way — brags shamelessly on his own good work ('feel how she comes apart clean? every joint pulling its weight, not a nail in the whole rim'), over-explains the dish and the spoke-lean like they're the cleverest thing anyone ever thought of, ribs the townsfolk who think a wheel's just a round bit of wood. Peer-to-peer, present-tense, brassy, generous underneath it. Never wistful, never a life-lesson, never the mellow at-your-elbow craftsman-sage; a working man delighted to show off how his wheel goes together.">
  <meta name="outbox-spec-length" content="medium">
  <meta name="outbox-spec-palette" content="Seasoned oak-and-elm heartwood brown (#7a4f28) for the great word itself, cut hard against a forge-iron near-black (#1e1a15) for the joint-seams and the small gloss type, all standing on a pale plane-shaving ground (#e7d6b0), with one chip of red-lead cartwheel paint (#a8402b) held only for the shrunk-on tyre-mark and the tiny corner stamp — the warm, hard-lit look of fresh-planed timber and cold black iron on a shaving-strewn bench under the shop window, no soft edges anywhere.">
  <meta name="outbox-spec-wildcard" content="Exactly one joint — the seam between the last felloe and its strake — is swollen tight with damp and will not fully give: click it and it only groans a half-inch and springs back, never opening its gap, never showing its gloss, no matter how you work it. It is never labelled, never pointed at, never counted any differently, never eased; it is simply the one stuck joint in an otherwise clean-parting wheel, the same swollen seam every visit, for whoever keeps trying the one that won't come.">

<title>Stockspokefelloestraketyredish — Take Her Apart</title>
<style>
  :root{
    --timber:#7a4f28;
    --iron:#1e1a15;
    --ground:#e7d6b0;
    --redlead:#a8402b;
    --card:#efe2c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);
    background-image:
      repeating-linear-gradient(92deg, rgba(122,79,40,.045) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(88deg, rgba(30,26,21,.03) 0 1px, transparent 1px 14px);
    color:var(--iron);
    font-family:Georgia,"Times New Roman",serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  #bench{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 3vw 12vh;
  }
  .word{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:0;
    line-height:.92;
    max-width:100%;
  }
  .m{
    font-family:"Arial Black","Franklin Gothic Heavy",Impact,sans-serif;
    font-weight:900;
    font-size:clamp(1.9rem,9.2vw,5.4rem);
    letter-spacing:-.02em;
    color:var(--timber);
    text-transform:uppercase;
    text-shadow:1px 1px 0 rgba(30,26,21,.22), -1px -1px 0 rgba(255,244,214,.35);
    user-select:none;
    white-space:nowrap;
  }
  .m.tyre{position:relative}
  .m.tyre::after{
    content:"";
    position:absolute;left:6%;right:6%;bottom:.06em;height:.09em;
    background:var(--redlead);
    box-shadow:0 0 2px rgba(168,64,43,.5);
  }
  /* the joint-seams */
  .s{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    align-self:stretch;
    padding:0 5px;
    cursor:pointer;
    background:none;border:none;
  }
  .s .line{
    display:block;
    width:3px;
    min-height:1.4em;
    height:100%;
    background:linear-gradient(var(--iron),#3a322a,var(--iron));
    border-radius:1px;
    transition:width .18s ease, background .18s ease;
  }
  .s:hover .line{width:5px}
  .s.highlight .line{width:6px;background:var(--redlead)}
  .s.open .line{width:2px;background:#5a4a38}
  .s:focus{outline:none}
  .s:focus-visible .line{box-shadow:0 0 0 2px var(--redlead)}

  /* the gap + gloss that eases open */
  .g{
    display:flex;
    align-items:center;
    max-width:0;
    opacity:0;
    overflow:hidden;
    transition:max-width .5s cubic-bezier(.4,.05,.2,1), opacity .35s ease, margin .5s ease;
    margin:0;
  }
  .g.open{
    max-width:min(86vw,380px);
    opacity:1;
    margin:.15em 8px;
  }
  .g .card{
    width:min(84vw,360px);
    background:var(--card);
    border:1.5px solid var(--iron);
    border-left:5px solid var(--timber);
    padding:12px 15px 13px;
    font-family:Georgia,serif;
  }
  .g .card h2{
    margin:0 0 .35em;
    font-family:"Arial Black",Impact,sans-serif;
    font-size:.95rem;
    letter-spacing:.02em;
    color:var(--iron);
    text-transform:uppercase;
  }
  .g .card p{
    margin:0;
    font-size:.86rem;
    line-height:1.42;
    color:#2a231b;
  }
  .g.stuck{max-width:0}
  .g.stuck.grn{animation:groan .48s ease}
  @keyframes groan{
    0%{max-width:0} 45%{max-width:15px} 100%{max-width:0}
  }

  #tally{
    position:fixed;left:10px;bottom:9px;
    font-family:Georgia,serif;
    font-size:.62rem;
    letter-spacing:.03em;
    color:#5c5346;
    opacity:.8;
    text-transform:uppercase;
    max-width:60vw;
  }
  footer{
    position:fixed;right:10px;bottom:9px;
    text-align:right;
    font-family:Georgia,serif;
    font-size:.62rem;
    line-height:1.5;
    color:#5c5346;
  }
  footer .stamp{
    display:inline-block;
    border:1.4px solid var(--redlead);
    color:var(--redlead);
    padding:1px 5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    transform:rotate(-3deg);
    opacity:.85;
  }
  footer a{color:#5c5346;text-decoration:none;border-bottom:1px dotted #8a7a5f}
  footer a:hover{color:var(--redlead)}
  .hint{opacity:.6;font-style:italic}
</style>

<body>
  <!-- one wheel, built this week, off the tyring-platform Tuesday. take her down at the joints. -->
  <div id="bench">
    <div class="word" id="word" aria-label="the full jointed name of one wagon wheel — click a seam to ease it apart"></div>
  </div>

  <div id="tally">Joints eased apart in this wheel: <span id="tallyN">0</span></div>
  <footer>
    <div class="hint">click a seam · ← → then space</div>
    <span class="stamp">Odell · Wheelwright</span><br>
    <a href="/archive">the rest of the bench</a>
  </footer>

<script>
(function(){
  "use strict";

  var MORPH = ["STOCK","SPOKE","FELLOE","STRAKE","FELLOE","STRAKE","TYRE","DISH"];
  var SEAMS = [
    { title:"The Stock",
      body:"Solid elm, this — and it HAS to be elm, because elm's grain snarls every which way and won't split when I drive twelve spokes into it. This is the block the whole wheel turns on. Bore it dead true and every other part gets its chance; bore it lazy and you've thrown the day in the fire. And look — she comes apart clean. No nail. There's never a nail in a wheel worth rolling." },
    { title:"The Spoke",
      body:"Cleft oak, mind — cleft, not sawn, so I follow the grain and it stays strong. Driven tight into the stock and set with a lean, ever so slight, toward the load. Folks see that lean and swear I've built her crooked. I have NOT. Hand me the felloe and I'll show you the cleverest trick in the trade." },
    { title:"The Felloe",
      body:"The rim don't come in one lump — I build her out of these curved segments, and every felloe takes two spoke-ends up into it. Six felloes make my rim, good ash, jointed end to end so no felloe-joint ever sits under a spoke. That's careful work. Every joint here pulls its weight and then some." },
    { title:"The Strake",
      body:"Short iron straps, nailed across each felloe-joint. Plenty of heavy jobs still roll out straked instead of tyred. The iron holds the wood tight and the round wood holds the iron out true — they shove against each other all day long and neither one gives an inch. That's the whole idea." },
    { stuck:true },
    { title:"The Tyre", red:true,
      body:"One single hoop of iron, forged a good half-inch small on purpose. Heat her round the fire till she yawns open wide, drop her hot over the whole rim — and quench her THAT INSTANT — and she bites down and drags every felloe, every spoke, every last joint into one hard round thing. That red's where she took hold. Best sound in the yard, that hiss." },
    { title:"The Dish",
      body:"Now sight down her edge-on — she's not flat. She's a shallow cone, dished out away from the load, and I built her so on purpose along with that spoke-lean. A loaded wagon lurches and shoves sideways-in against the wheel; the dish takes that shove and springs it back instead of buckling under. Build her flat and you've built a broke wheel that don't know it yet. Nobody believes me till theirs folds in the lane." }
  ];

  var wordEl = document.getElementById("word");
  var seamEls = [], glossEls = [];

  MORPH.forEach(function(m, i){
    var mEl = document.createElement("span");
    mEl.className = "m" + (m==="TYRE"?" tyre":"");
    mEl.textContent = m;
    wordEl.appendChild(mEl);

    if(i < SEAMS.length){
      var seam = SEAMS[i];
      var sEl = document.createElement("button");
      sEl.className = "s";
      sEl.setAttribute("aria-label", seam.stuck ? "a swollen joint" : ("open the joint at " + seam.title));
      var line = document.createElement("span");
      line.className = "line";
      sEl.appendChild(line);

      var gEl = document.createElement("span");
      gEl.className = "g" + (seam.stuck ? " stuck" : "");
      if(!seam.stuck){
        var card = document.createElement("span");
        card.className = "card";
        var h = document.createElement("h2"); h.textContent = seam.title;
        if(seam.red) h.style.color = "var(--redlead)";
        var p = document.createElement("p"); p.textContent = seam.body;
        card.appendChild(h); card.appendChild(p);
        gEl.appendChild(card);
      }

      (function(idx){
        sEl.addEventListener("click", function(){ toggleSeam(idx, true); });
      })(i);

      wordEl.appendChild(sEl);
      wordEl.appendChild(gEl);
      seamEls[i] = sEl;
      glossEls[i] = gEl;
    }
  });

  /* ---- tally (localStorage, only ever counts up) ---- */
  var KEY = "outbox.wheel.eased";
  var eased = loadEased();
  updateTally();

  function loadEased(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return {};
      var arr = JSON.parse(raw), o = {};
      if(Array.isArray(arr)) arr.forEach(function(n){ o[n]=1; });
      return o;
    }catch(e){ return {}; }
  }
  function saveEased(){
    try{
      var arr = Object.keys(eased).map(Number);
      localStorage.setItem(KEY, JSON.stringify(arr));
    }catch(e){}
  }
  function countEased(){ return Object.keys(eased).length; }
  function updateTally(){ document.getElementById("tallyN").textContent = countEased(); }
  function recordEased(idx){
    if(!eased[idx]){ eased[idx]=1; saveEased(); updateTally(); }
  }

  /* ---- open / close / groan ---- */
  function toggleSeam(idx, fromClick){
    var seam = SEAMS[idx];
    if(seam.stuck){ groan(idx); return; }
    var sEl = seamEls[idx], gEl = glossEls[idx];
    var willOpen = !sEl.classList.contains("open");
    sEl.classList.toggle("open", willOpen);
    gEl.classList.toggle("open", willOpen);
    creak(willOpen);
    if(willOpen) recordEased(idx);
  }

  function groan(idx){
    var gEl = glossEls[idx];
    groanSound();
    gEl.classList.remove("grn");
    // force reflow so the animation restarts every time
    void gEl.offsetWidth;
    gEl.classList.add("grn");
  }
  // clean the groan class after it runs
  document.addEventListener("animationend", function(e){
    if(e.target.classList && e.target.classList.contains("grn")){
      e.target.classList.remove("grn");
    }
  });

  /* ---- keyboard walk + space ---- */
  var cur = 0, hlActive = false;
  function setHighlight(){
    seamEls.forEach(function(s,i){ s.classList.toggle("highlight", hlActive && i===cur); });
    if(hlActive && seamEls[cur]) seamEls[cur].focus();
  }
  document.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight" || e.key==="ArrowLeft"){
      e.preventDefault();
      if(!hlActive){ hlActive=true; }
      else { cur += (e.key==="ArrowRight"?1:-1); }
      if(cur<0) cur = seamEls.length-1;
      if(cur>=seamEls.length) cur = 0;
      setHighlight();
    } else if(e.key===" " || e.key==="Spacebar" || e.code==="Space"){
      if(hlActive){ e.preventDefault(); toggleSeam(cur, false); }
    }
  });

  /* ---- dry wooden creak via Web Audio ---- */
  var actx = null;
  function ac(){
    if(actx) return actx;
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
    return actx;
  }
  function noiseBurst(dur, ripple){
    var ctx = ac(); if(!ctx) return null;
    var len = Math.floor(ctx.sampleRate*dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){
      var stickslip = 0.45 + 0.55*Math.sin(i*ripple)*Math.sin(i*ripple*0.37);
      d[i] = (Math.random()*2-1) * stickslip;
    }
    return buf;
  }
  function creak(open){
    var ctx = ac(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    var dur = 0.34;
    var buf = noiseBurst(dur, 0.021); if(!buf) return;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=7;
    var t = ctx.currentTime;
    bp.frequency.setValueAtTime(open?300:520, t);
    bp.frequency.linearRampToValueAtTime(open?600:230, t+dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.26, t+0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+dur);
  }
  function groanSound(){
    var ctx = ac(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    var dur = 0.5;
    var buf = noiseBurst(dur, 0.009); if(!buf) return;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=9;
    var t = ctx.currentTime;
    bp.frequency.setValueAtTime(210, t);
    bp.frequency.linearRampToValueAtTime(150, t+dur*0.6);
    bp.frequency.linearRampToValueAtTime(200, t+dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t+0.05);
    g.gain.linearRampToValueAtTime(0.14, t+dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+dur);
  }

  console.log("%cThat one felloe-and-strake seam by the tyre? Swollen tight with the damp. Groans and springs right back. She'll give when she's good and dried, not before. — Odell", "color:#a8402b;font-weight:bold");
})();
</script>
