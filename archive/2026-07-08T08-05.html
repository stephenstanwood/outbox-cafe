<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#c9ccd2;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;-webkit-user-select:none;user-select:none;
    touch-action:none;cursor:none;}
  #bowl{position:fixed;inset:0;display:block;}
  /* candy-red painted counter-stripe at the very bottom edge */
  #counter{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:5;
    background:linear-gradient(#e0475a,#d63a4a 40%,#b52c3c);
    box-shadow:0 -3px 10px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;pointer-events:none;}
  #counter .card{background:#fff6e9;color:#8a3a1c;padding:3px 16px;border-radius:3px;

  /* Marnie, leaning on the counter, tickled you leaned in */

    pointer-events:none;transition:opacity .4s;line-height:1.34;}
  #marnie .b{display:inline-block;background:rgba(255,247,233,.94);color:#5c2f14;
    padding:9px 14px;border-radius:14px 14px 14px 4px;font-size:15px;
    box-shadow:0 3px 12px rgba(80,20,40,.22);border:1.5px solid #ffd98a;}
  #marnie .who{font-size:11px;letter-spacing:.14em;color:#d63a4a;font-weight:700;
    margin:0 0 3px 6px;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.6);}
  #blast{position:fixed;right:12px;bottom:58px;z-index:6;display:none;
    background:#ff77b0;color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;

<body>
<canvas id="bowl"></canvas>

<div id="marnie" aria-live="polite">
  <div class="who">Marnie · floss trailer</div>
  <span class="b" id="mline">well hey — you leaned in to have a go! good. keep her MOVING, hon, don't hold in one spot or you'll wind a hard little rock. just sweep the cone round the rim easy and let it come to you.</span>
</div>

<div id="blast">GIVE 'ER THE GUN</div>
<a id="arch" href="/archive">more trailers down the midway →</a>

<div id="counter">
  <div class="card">CONES SPUN AT THIS TRAILER: <b id="tally">0</b></div>
</div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('bowl');
  var ctx = cv.getContext('2d');
  var W=0,H=0,cx=0,cy=0,R=200, DPR=Math.min(window.devicePixelRatio||1, 2);
  var SQ = 0.80;                 // vertical squash → low three-quarter view of the bowl

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W*0.5; cy = H*0.455;
    R = Math.min(W*0.46, (H*0.86)/SQ*0.5);
    R = Math.max(120, R);
  }
  window.addEventListener('resize', resize); resize();

  // ---- the head: a chrome disc, spinning, with one fin bent a hair ----
  var head = { ang:0, color:'#ff77b0', next:'#8fd0ff', pourT:0, pourFlash:0, radius:0 };
  head.radius = function(){ return R*0.16; };
  var BIAS_ANG = 0.62;           // the bent fin flings heavier toward lower-right
  var COLORS = ['#ff77b0','#8fd0ff','#ff9ec4','#a9dcff'];

  // ---- flung sugar threads ----
  var parts = [];
  var burst = 0;                 // spacebar mercy-blast timer (frames)

  function emit(){
    var base = 5 + (burst>0 ? 12 : 0);
    for(var i=0;i<base;i++){
      var a = Math.random()*Math.PI*2;
      spawn(a, 2.0+Math.random()*0.7);
    }
    // extra gush toward the bent-fin side — never labelled, just felt
    var biasN = 2 + (burst>0?3:0);
    for(var j=0;j<biasN;j++){
      var a2 = BIAS_ANG + (Math.random()-0.5)*1.0;
      spawn(a2, 2.4+Math.random()*0.8);
    }
  }
  function spawn(a, sp){
    var swirl = 1.05;            // spin throws it out on a spiral
    var r0 = head.radius()*0.9;
    parts.push({
      x: Math.cos(a)*r0, y: Math.sin(a)*r0,
      vx: Math.cos(a)*sp - Math.sin(a)*swirl,
      vy: Math.sin(a)*sp + Math.cos(a)*swirl,
      c: head.color, w: 0.6+Math.random()*0.9, seed:Math.random()*6.28
    });
  }

  // ---- the cone in your hand, riding the rim ----
  var mx=cx, my=cy, have=true;
  var cone = { ang:0, dist:R, x:R, y:0, spd:0, pang:0 };
  var cloud = { mass:0, wisps:[], sumFluff:0, sag:0 };

  function updateCone(){
    var dx = mx-cx, dy = (my-cy)/SQ;
    var d = Math.hypot(dx,dy);
    var ang = Math.atan2(dy,dx);
    // clamped to the outer rim band — you work the edge, you sweep her round
    d = Math.max(R*0.80, Math.min(R*1.0, d));
    // arc-length swept since last frame → how fast the cone's moving
    var da = ang - cone.pang;
    while(da> Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    var arc = Math.abs(da)*d;
    cone.spd = cone.spd*0.68 + arc*0.32;
    cone.pang = ang;
    cone.ang = ang; cone.dist = d;
    cone.x = Math.cos(ang)*d; cone.y = Math.sin(ang)*d;
  }

  var FLUFF_MAX = 15;            // arc-speed at which winds are fully airy
  function catchThreads(){
    if(!have) return;
    var cr = R*0.14, cr2 = cr*cr;
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      var dx=p.x-cone.x, dy=p.y-cone.y;
      if(dx*dx+dy*dy < cr2){
        parts.splice(i,1);
        var fluff = Math.min(cone.spd/FLUFF_MAX, 1);   // moving = airy, still = packs a rock
        cloud.mass += 1;
        cloud.sumFluff += fluff;
        var spread = (10 + fluff*40) * (0.55+Math.random()*0.7);
        var wa = Math.random()*Math.PI*2;
        cloud.wisps.push({ a:wa, d:spread, r:8+fluff*9+Math.random()*4, c:p.c, s:Math.random()*6.28 });
        if(cloud.wisps.length>170) cloud.wisps.splice((Math.random()*40)|0,1);
        onGrow();
      }
    }
  }
  function airiness(){ return cloud.mass? cloud.sumFluff/cloud.mass : 0; }

  // ---- lift her off ----
  function lift(){
    if(!have) return;
    if(cloud.mass < 30){ say(cloud.mass<6? "have a go, hon — sweep her right through the mist." : "not yet — wind her up a bit more, keep turning!", 0); return; }
    var air = airiness();
    var big = cloud.mass>=70;
    tally++;
    try{ localStorage.setItem('outbox-floss-cones', String(tally)); }catch(e){}
    document.getElementById('tally').textContent = tally;
    // little pop of the finished cloud drifting off
    popClouds.push({ x:cone.x, y:cone.y, wisps:cloud.wisps.slice(), life:34, sag:cloud.sag });
    if(big && air>0.52){ say(pick(WHOOP), 2); }
    else if(air<0.42){ say(pick(ROCK), 2); }
    else { say(pick(FINE), 2); }
    cloud = { mass:0, wisps:[], sumFluff:0, sag:0 };
    have = true;                 // fresh cone appears in your hand
  }
  var popClouds = [];

  // ---- re-pour: fresh colored sugar swirls into the head ----
  function repour(){
    head.color = head.next;
    head.next = COLORS[(Math.random()*COLORS.length)|0];
    head.pourFlash = 30;
    say(pick(POUR), 1);
  }

  // ---------- Marnie's voice ----------
  var mline = document.getElementById('mline');
  var lastSay=0, growSaid=0, rockWarn=0;
  var GROW=["that's it — keep her turning...","ooh, she's blooming now, look at her go!","nice even sweep, hon — round and round.","there we go, she's catchin' proper now."];
  var WHOOP=["THERE she is — look at the SIZE of that! that's a proper one, hon.","WHOO! big fat pink one, that's the ticket — fourteen summers and that's a beauty.","now THAT'S a cone. you've got the knack, look at her!"];
  var ROCK=["eh, that one wound a bit tight — bit of a rock! everybody does their first few. toss it in your head, grab the fresh one, they're free while I'm teachin' ya.","hard little rock, that one — you held still too long. no bother! sweep her more next time and she'll fluff right up."];
  var FINE=["there you go — a decent cone! now do me a fat one.","not bad, not bad. keep her moving even more and watch her puff.","see? she winds on nice when you keep turning."];
  var POUR=["fresh pour goin' in — watch her swirl a new color through!","new sugar in the head, hon — sweep now and she'll marble two-tone."];
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function say(t, pri){
    var now=performance.now();
    if(pri<1 && now-lastSay<3200) return;
    if(pri<2 && now-lastSay<1600) return;
    lastSay=now; mline.textContent=t;
    var m=document.getElementById('marnie'); m.style.opacity='1';
  }
  function onGrow(){
    var now=performance.now();
    if(cloud.mass>110 && cone.spd>3 && now-growSaid>6500){ growSaid=now; say("ooh she's gettin' heavy — one more pass and lift her before she sags!",0); }
    else if(cloud.mass>0 && cloud.mass%22===0 && cone.spd>2.5 && now-growSaid>4200){ growSaid=now; say(pick(GROW),0); }
    if(cloud.mass>16 && airiness()<0.30 && cone.spd<1.4 && now-rockWarn>3800){ rockWarn=now; say("you're windin' a ROCK, hon — keep her MOVING, don't hold in one spot!",0); }
  }

  // ---------- tally ----------
  var tally = 0;
  try{ tally = parseInt(localStorage.getItem('outbox-floss-cones')||'0',10)||0; }catch(e){}
  document.getElementById('tally').textContent = tally;

  // ---------- input ----------
  function setXY(x,y){ mx=x; my=y; }
  window.addEventListener('mousemove', function(e){ setXY(e.clientX,e.clientY); });
  window.addEventListener('mousedown', function(e){ if(e.button===0){ setXY(e.clientX,e.clientY); lift(); } });
  window.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); burst=180; say(pick(["give 'er the gun, hon!","BLAST — fatten her up!","open her up, thick gush comin'!"]),1); }
  });
  cv.addEventListener('touchmove', function(e){ e.preventDefault(); var t=e.touches[0]; setXY(t.clientX,t.clientY); }, {passive:false});
  cv.addEventListener('touchstart', function(e){ var t=e.touches[0]; setXY(t.clientX,t.clientY); }, {passive:false});
  cv.addEventListener('touchend', function(e){ lift(); });
  if('ontouchstart' in window){
    var bl=document.getElementById('blast'); bl.style.display='block';
    bl.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); burst=180; say("give 'er the gun, hon!",1); }, {passive:false});
  }

  // ---------- render ----------
  function chromeBG(){
    var g = ctx.createRadialGradient(cx, cy, R*0.04, cx, cy, R*1.15);
    g.addColorStop(0, '#f6cf94');            // hot melted-sugar caramel core
    g.addColorStop(0.10,'#e0a24c');
    g.addColorStop(0.22,'#cdb79a');
    g.addColorStop(0.42,'#d6dae1');          // brushed chrome pan
    g.addColorStop(0.80,'#c2c7d0');
    g.addColorStop(1.0, '#9aa0ab');
    ctx.fillStyle='#b9bdc4'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=g;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,SQ);
    ctx.beginPath(); ctx.arc(0,0,R*1.12,0,Math.PI*2); ctx.fill();
    // string-light warm wash on the rim + specular ring highlights
    ctx.lineWidth=R*0.05;
    var rg=ctx.createLinearGradient(-R,0,R,0);
    rg.addColorStop(0,'rgba(255,217,138,.15)'); rg.addColorStop(.5,'rgba(255,255,255,.75)'); rg.addColorStop(1,'rgba(255,217,138,.35)');
    ctx.strokeStyle=rg; ctx.beginPath(); ctx.arc(0,0,R*1.0,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=R*0.015; ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(0,0,R*0.72,-2.4,-0.8); ctx.stroke();
    ctx.lineWidth=R*0.02; ctx.strokeStyle='rgba(255,217,138,.5)';
    ctx.beginPath(); ctx.arc(0,0,R*0.9,0.3,1.9); ctx.stroke();
    ctx.restore();
  }

  function drawHead(){
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,SQ); ctx.rotate(head.ang);
    var hr=head.radius();
    // hot amber halo where the sugar liquefies
    var hg=ctx.createRadialGradient(0,0,hr*0.2,0,0,hr*1.9);
    hg.addColorStop(0,'rgba(255,220,150,.9)'); hg.addColorStop(.5,'rgba(224,162,76,.4)'); hg.addColorStop(1,'rgba(224,162,76,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,0,hr*1.9,0,Math.PI*2); ctx.fill();
    // chrome cap
    var cg=ctx.createRadialGradient(-hr*0.3,-hr*0.3,hr*0.1,0,0,hr);
    cg.addColorStop(0,'#ffffff'); cg.addColorStop(.5,'#d6dae1'); cg.addColorStop(1,'#8f96a3');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,hr,0,Math.PI*2); ctx.fill();
    // fins — one of them bent a hair
    for(var f=0;f<6;f++){
      var a=f/6*Math.PI*2;
      var bent = (f===2) ? 0.16 : 0;   // the wildcard, quietly
      ctx.save(); ctx.rotate(a+bent);
      ctx.fillStyle=f===2? '#b9c0cb':'#aeb5c1';
      ctx.fillRect(hr*0.28, -hr*0.06, hr*0.66, hr*0.12);
      ctx.restore();
    }
    // sugar color glowing in the center
    ctx.fillStyle=head.color; ctx.globalAlpha=0.5+ (head.pourFlash>0?0.4:0);
    ctx.beginPath(); ctx.arc(0,0,hr*0.34,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawParts(){
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,SQ);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      ctx.strokeStyle=p.c; ctx.globalAlpha=0.5;
      ctx.lineWidth=p.w;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-p.vx*2.2, p.y-p.vy*2.2);
      ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }

  function drawCloud(ox,oy,wisps,sag,alpha){
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,SQ);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<wisps.length;i++){
      var w=wisps[i];
      var wob=Math.sin(head.ang*2+w.s)*1.4;
      var wx=ox+Math.cos(w.a)*w.d+wob, wy=oy+Math.sin(w.a)*w.d*0.9 + sag*0.5;
      var g=ctx.createRadialGradient(wx,wy,0,wx,wy,w.r);
      g.addColorStop(0, w.c); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha=(alpha||1)*0.5;
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(wx,wy,w.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }

  function drawCone(){
    if(!have) return;
    // paper cone pointing outward past the rim
    var ux=Math.cos(cone.ang), uy=Math.sin(cone.ang);
    var tipx=cone.x+ux*R*0.14, tipy=cone.y+uy*R*0.14;
    var baseX=cone.x-ux*R*0.02, baseY=cone.y-uy*R*0.02;
    var px=-uy, py=ux, bw=R*0.05;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1,SQ);
    ctx.fillStyle='#f2e3c4'; ctx.strokeStyle='#c9a86a'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(tipx,tipy);
    ctx.lineTo(baseX+px*bw, baseY+py*bw);
    ctx.lineTo(baseX-px*bw, baseY-py*bw);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // the cloud she's winding — sags when she gets greedy-heavy
    cloud.sag = cloud.mass>120 ? (cloud.sag+(Math.min((cloud.mass-120)*0.25,18)-cloud.sag)*0.08) : cloud.sag*0.9;
    drawCloud(cone.x-ux*R*0.03, cone.y-uy*R*0.03, cloud.wisps, cloud.sag, 1);
  }

  function tick(){
    // physics
    head.ang += 0.18 + (burst>0?0.12:0);
    if(burst>0) burst--;
    head.pourT++; if(head.pourT>1000+Math.random()*600){ head.pourT=0; repour(); }
    if(head.pourFlash>0) head.pourFlash--;
    emit();
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vx*=0.994; p.vy*=0.994;
      p.x+=p.vx; p.y+=p.vy;
      var d=Math.hypot(p.x,p.y);
      if(d>R*1.06){ parts.splice(i,1); }
    }
    updateCone();
    catchThreads();
    for(var k=popClouds.length-1;k>=0;k--){
      var pc=popClouds[k]; pc.life--; pc.y-=1.6; if(pc.life<=0) popClouds.splice(k,1);
    }

    // draw
    ctx.clearRect(0,0,W,H);
    chromeBG();
    drawParts();
    drawHead();
    for(var m=0;m<popClouds.length;m++){
      drawCloud(popClouds[m].x, popClouds[m].y-(34-popClouds[m].life)*1.6, popClouds[m].wisps, popClouds[m].sag, popClouds[m].life/34);
    }
    drawCone();

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // whisper for whoever pokes at the console — never on the page
  try{ console.log("%cpsst — the head's got one fin bent a hair. the right side of the rim always catches thicker. lead her into it. — Marnie","color:#d63a4a;font-weight:bold"); }catch(e){}
})();
</script>
